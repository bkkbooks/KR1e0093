body:
  text: 欽定四庫全書日講春秋解義卷十四閔公公名啓方莊公之子史記云名開諡法在國逢難曰閔周惠王十六年鄭文公十二年齊桓公二十五年管仲為政宋桓公二十一年晉獻公十六年軍是年晉作三衛懿公八年魯閔二年狄滅衛宋桓公立衛戴公以廬于曹戴公名申立其年卒而立文公蔡穆公十四年曹昭公元年滕詳見隱公元年陳宣公三十二年杞詳見隱公元年及僖公元年薛魯莊公三十一年薛伯卒莒詳見隱公元年邾文公五年許穆公三十七年小邾見莊公元年楚成王十一年令尹子文為政秦詳見隱公元年吳詳見隱公元年越詳見隱公元年欽定四庫全書日講春秋解義卷十四閔公名啓方史記云名開莊公之子以惠王十六年即位諡法在國逢難曰閔元年春王正月左傳元年春不書即位亂故也公羊傳公何以不言即位繼弒君不言即位孰繼繼子般也孰弒子般慶父也殺公子牙今將爾季子不免慶父弒君何以不誅將而不免遏惡也既而不可及因獄有所歸不探其情而誅焉謂弒君之賊已有鄧扈樂遂不及探刺隱情並誅慶父親親之道也惡乎歸獄歸獄僕人鄧扈樂曷為歸獄僕人鄧扈樂莊公存之時樂曾淫于宫中子般執而鞭之莊公死慶父謂樂曰般之辱爾國人莫不知盍弒之矣使弒子般然後誅鄧扈樂而歸獄焉季子至而不變也穀梁傳繼弒君不言即位正也親之非父也子般閔公兄也尊之非君也般未踰年也繼之如君父也者受國焉爾不書即位未行即位之禮也閔公甚幼豈能哀子般之弒而不行即位之禮必在國諸臣尚知大義亦幸慶父在齊猶能守禮而勿失耳記稱魯莊公之喪既葬而絰不入庫門士大夫既卒哭麻不入蓋慶父歸自齊則犯義悖禮專行無忌莫可如何矣齊人救郉左傳狄人伐郉管敬仲言于齊侯曰敬仲管夷吾戎狄豺狼不可厭也諸夏親昵不可棄也昵近也宴安鴆毒不可懷也以宴安比之鴆毒詩云豈不懷歸畏此簡書引詩小雅斷章取義言諸侯有事則書之于簡遣使執以告命告則須敇故畏而不歸也簡書同惡相恤之謂也同恤所惡請救郉以從簡書齊人救郉榖梁傳善救郉也凡書救者未有不善之也救在王室則罪諸侯救在吳楚則罪霸國救在逺國則罪四鄰救而不速救者則書所次以著其慢救而不敢救者則書所至以著其怯兵者聖人所甚重至於救兵則書法如此蓋周官大司馬職大合軍以救無辜伐有罪乃先王制軍詰禁之本義也郉以冬被兵桓公以春救或謂罪其緩過矣其稱人將卑師少也夏六月辛酉葬我君莊公左傳夏六月葬莊公亂故是以緩十一月乃葬穀梁傳莊公葬而後舉諡諡所以成德也于卒事乎加之矣魯君之葬皆不踰五月之期惟桓公戕於齊故九月乃葬昭公客死乾侯故八月乃葬莊公之薨至是十有一月而始克葬蓋以國亂子弒嗣君幼弱故也或乃謂子般非弒誤矣秋八月公及齊侯盟于落姑季子來歸落公羊榖梁作洛落姑杜注齊地在今山東東平州平陰縣界左傳秋八月公及齊侯盟于落姑請復季友也閔公初立國家多難以季子忠賢故請霸主而復之齊侯許之使召諸陳公次于郎以待之季子來歸嘉之也公羊傳其稱季子何賢也其言來歸何喜之也來歸則國安故喜之穀梁傳盟納季子也其曰季子貴之也大夫稱名氏今曰子是貴之也其曰來歸喜之也此舊史緣魯人之情賢季友而喜其歸故稱季子孔子因而不改以季友亦實有功於國耳落姑之盟傳稱請復季友閔公甚幼必魯之世臣尚有忠於謀國者隂告於齊請復季友故桓公以霸令召閔公至齊地而與之盟使復季友而公次于郎以待之命出於齊桓則慶父不敢違而友得安然而返國矣或曰齊方厚陳而友託焉陳魯舊好故陳人為請於齊亦可通冬齊仲孫來左傳冬齊仲孫湫來省難湫仲孫名書曰仲孫亦嘉之也仲孫歸曰不去慶父魯難未己時慶父亦還魯公曰若之何而去之對曰難不已將自斃君其待之公曰魯可取乎對曰不可猶秉周禮周禮所以本也臣聞之國將亡本必先顚而後枝葉從之魯不棄周禮未可動也君其務寧魯難而親之親有禮因重固能重能固則當就成之間㩦二離而相疑者則當因而間之覆昏亂霸王之器也霸王所用故以器為喻公羊傳齊仲孫者何公子慶父也公子慶父則曷為謂之齊仲孫繫之齊也曷為繫之齊外之也曷為外之春秋為尊者諱為親者諱為賢者諱子女子曰以春秋為春秋齊無仲孫其諸吾仲孫與榖梁傳其曰齊仲孫外之也其不目而曰仲孫疏之也其言齊以纍桓也仲孫之來齊侯使之也不稱使而曰來者非聘非盟名曰省難而實有窺伺之心則桓公之使臣不以禮而仲孫之奉命亦非義矣其不書名而曰仲孫亦因舊史之文也蓋仲孫歸有魯秉周禮君其務寧魯難之言而髙子卒來盟以定魯魯人懷其德髙其義故與髙子同不書名仲尼修經因之以著情實若以為春秋特文則季子髙子之不書名為賢而仲孫之不書名為譏義無所處矣附録左傳晉侯作二軍初曲沃武公滅翼王命以一軍為晉侯見莊十六年公將上軍大子申生將下軍趙夙御戎畢萬為右為公御右也夙趙衰兄畢萬魏犨祖父以滅耿滅霍滅魏耿杜注平陽皮氏縣東南有耿鄉今山西河津縣東南有古耿城一名耿鄉城霍杜注永安縣東北有霍大山今山西霍州西有霍城古霍國也三國皆姬姓還為大子城曲沃賜趙夙耿賜畢萬魏以為大夫士蒍曰大子不得立矣分之都城而位以卿先為之極又焉得立位以卿謂將下軍不如逃之無使罪至為吳大伯不亦可乎大伯周大王之適子知其父欲立季歷故讓位而適吳猶有令名與其及也言雖去猶有令名勝于留而及禍且諺曰心茍無瑕何恤乎無家天若祚大子其無晉乎為晉殺申生傳卜偃曰畢萬之後必大卜偃晉掌卜大夫萬盈數也魏大名也以是始賞天啓之矣天子曰兆民諸侯曰萬民今名之大以從盈數其必有衆以魏從萬有衆象初畢萬筮仕于晉遇屯震下坎上屯之比坤下坎上比屯初九變而為比辛廖占之辛廖晉大夫曰吉屯固比入屯險難所以為堅固比親密所以得入吉孰大焉其必蕃昌震為土震變為坤車從馬震為車坤為馬足居之震為足兄長之震為長男母覆之坤為母衆歸之坤為衆六體不易初一爻變有此六義不可易也合而能固安而能殺公侯之卦也比合屯固坤安震殺故曰公侯之卦公侯之子孫必復其始萬畢公之後傳為魏之子孫衆多張本二年春王正月齊人遷陽陽杜注國名今山東沂水縣南有陽都城即陽國也陽小國齊遷其民於國中以為附庸而並其地蓋以戌遂而殲焉為戒也桓公逞其謀力并吞小國而不度於義理如此附録左傳二年春虢公敗犬戎于渭汭大戎西戎别在中國者渭水出隴西東入河水之隈曲曰汭舟之僑曰舟之僑虢大夫無德而祿殃也殃將至矣遂奔晉夏五月乙酉吉禘于莊公左傳夏吉禘于莊公速也三年喪畢致新死者之主于廟廟之逺主當遷入祧因是大祭以審昭穆謂之禘蓋吉祭也莊公喪制未闋時别立廟成因而吉祭故譏其速公羊傳其言吉何言吉者未可以吉也曷為未可以吉未三年也三年矣曷為謂之未三年據莊公三十二年八月薨今閔公二年五月已入三年之竟三年之喪實以二十五月莊公薨至是適二十二月所以必二十五月者取一期再期恩倍漸三年也其言于莊公何未可以稱宫廟也時閔公以莊公喪在三年中未可入大廟禘之于新宫故不稱宫廟曷為未可以稱宫廟在三年之中矣吉禘于莊公何以書譏何譏爾譏始不三年也榖梁傳吉禘者不吉者也莊公薨至此方二十二月喪未畢不可為吉喪事未畢而舉吉祭故非之也禮不王不禘王者禘其祖之所自出而以其祖配之魯侯國而僣天子之祭雖用於周公之廟亦為非禮况羣公乎據經所書有事于宫廟無言某公者此獨書莊公蓋方祀於寢非宫廟也喪未三年而行吉祭一舉而犯大不義者二焉春秋之所謹也時祭有禘之名乃漢儒約春秋所書以為之説而誤焉耳趙氏伯循辨之詳矣秋八月辛丑公薨左傳初公傅奪卜齮田公不禁卜齮魯大夫公即位年八歲知愛其傅而遂成其意以奪齮田齮忿其傅并及公故慶父因之秋八月辛丑共仲使卜齮賊公于武闈共仲即慶父宫中小門謂之闈公羊傳公薨何以不地隱之也何隱爾弒也孰弒之慶父也殺公子牙今將爾季子不免慶父弒二君何以不誅將而不免遏惡也既而不可及緩追逸賊親親之道也穀梁傳不地故也其不書葬不以討母葬子也凡君弒賊討則書葬哀薑與弒被討而不書葬者不以討母葬子公薨不地弒也不書葬賊未討也慶父既縊何以謂賊未討諡為共仲而立其子為卿討賊之法寧有是耶故不書葬以罪魯臣子之昧於大義也九月夫人薑氏孫于邾穀梁傳孫之為言猶孫也諱奔也夫人稱孫與聞乎故也不去姓氏罪降於文薑也齊女而奔於邾蓋身負大惡畏齊桓之討也魯桓見戕於齊經雖不書而莊公不書即位夫人孫于齊則君非正終而夫人與聞乎故可知矣閔公薨而不地夫人孫于邾慶父出奔莒則賊由慶父而夫人與聞乎故可知矣春秋之書微而顯此非其較著者與公子慶父出奔莒左傳成季以僖公適邾僖公閔公庶兄成風之子共仲奔莒乃入立之以賂求共仲于莒莒人歸之及密使公子魚請密杜注魯地公子魚奚斯也不許哭而往共仲曰奚斯之聲也乃縊閔公哀薑之娣叔薑之子也故齊人立之共仲通于哀薑哀薑欲立之閔公之死也哀薑與知之故孫于邾齊人取而殺之于夷以其尸歸為僖元年齊人殺哀薑傳夷杜注魯地僖公請而葬之榖梁傳其曰出絶之也慶父不復見矣書公子慶父出奔莒譏失賊也其縊不書何也不可以討賊之辭書又不可以自縊書故苐書其奔以罪季友之失刑莒人之黨惡耳先儒多以慶父之死比於宋萬非也宋猶醢萬魯於慶父乃加恩禮焉季友忘君父之讎而市小惠其罪大矣附録左傳成季之將生也桓公使卜楚丘之父卜之卜楚丘魯掌卜大夫曰男也其名曰友在公之右在右言用事間于兩社為公室輔兩社周社亳社兩社之間朝廷執政所在季氏亡則魯不昌言季氏之後當與魯國相存亡又筮之遇大有乾下離上大有之乾乾下乾上乾大有六五變為乾曰同復于父筮者之辭也乾為君父離變為乾故曰同復于父敬如君所言其貴與君同及生有文在其手曰友遂以命之遂以為名冬齊髙子來盟公羊傳髙子者何齊大夫也謂髙傒何以不稱使我無君也時閔公弒僖公未立然則何以不名喜之也何喜爾正我也其正我奈何莊公死子般弒閔公弒比三君死曠年無君設以齊取魯曾不興師徒以言而已矣桓公使髙子將南陽之甲南陽何氏休曰齊下邑立僖公而城魯或曰自鹿門至于爭門者是也或曰自爭門至于吏門者是也鹿門何氏休曰魯南城東門爭門吏門亦魯城門名魯人至今以為美談曰猶望髙子也穀梁傳其曰來喜之也其曰髙子貴之也盟立僖公也不言使何也不以齊侯使髙子也魯人喜髙傒之來故史不書名以貴之不稱使者齊桓之使髙子非有討亂扶危一定不移之計而髙子能審大義定魯難以輔成君德保其令名故不稱使以明權在髙子而著其情實也髙子仲孫皆不稱名不言使而傳以為有豫奪之異者仲孫言來以見其徒來覘魯而不能弭亂髙子言來盟則扶危定傾之義著矣且仲孫來之後閔公再弒夫人孫慶父奔髙子盟之後則僖公立哀薑誅比事以觀而奉使之情可見矣經書來盟而不稱使者三髙子恤鄰屈完服義獨華孫為貶蓋魯宋無事華孫私來結盟則罪也春秋屬辭之義以前後事迹考之則得其實矣十有二月狄入衛左傳冬十二月狄人伐衛衛懿公好鶴鶴有乘軒者軒大夫車將戰國人受甲者皆曰使鶴鶴實有祿位余焉能戰公與石祁子玦與寧莊子矢使守玦玉玦莊子寧速也曰以此贊國擇利而為之贊助也玦示以當決斷矢示以禦難與夫人繡衣曰聽于二子繡衣取其文章順敘渠孔御戎子伯為右黃夷前驅孔嬰齊殿傳言衛侯素失民心雖臨事而戒猶無所及及狄人戰于滎澤滎澤杜注此滎澤當在河北與鄭之滎澤不同衛師敗績遂滅衛衛侯不去其旗是以甚敗師之耳目在旗懿公既敗而旗不去故君臣俱盡狄人囚史華龍滑與禮孔以逐衛人二人曰我大史也實掌其祭不先國不可得也狄人畏鬼故恐之言當先白神乃先之至則告守曰不可待也守石寧二大夫夜與國人出狄入衛遂從之又敗諸河衛將東走渡河狄復逐而敗之初惠公之即位也少齊人使昭伯蒸干宣薑昭伯惠公庶兄宣公子頑也不可強之生齊子戴公文公宋桓夫人許穆夫人文公為衛之多患也先適齊及敗宋桓公逆諸河迎衛敗衆宵濟衛之遺民男女七百有三十人益之以共滕之民為五千人共及滕杜注衛别邑立戴公以廬于曹廬舍也曹杜注衛下邑孔疏云當在河東近楚丘戴公名申是年立即卒復立文公許穆夫人賦載馳載馳詩衛風許穆夫人痛衛之亡思歸唁之不可故賦此齊侯使公子無虧帥車三百乘甲士三千人以戌曹無虧齊桓公子武孟也歸公乘馬祭服五稱牛羊豕雞狗皆三百與門材歸遺也四馬曰乘衣單復具曰稱門材使先立門户歸夫人魚軒重錦三十兩魚軒夫人車以魚皮為飾重錦錦之熟細者三十兩三十匹也或問孔子刪詩如牆有茨鶉之奔奔桑中諸篇何以不刪先儒楊時曰此著衛為狄所滅之由也故列於定之方中之前衛之淫恣醜惡乃禍亂所從始肇於晉而成於朔其禮先亡而國從之矣不書滅者狄雖入衛而未嘗據有其地衛雖舉國竄亡而宗社復立也鄭棄其師左傳鄭人惡髙克使帥師次于河上久而弗召髙克鄭大夫文公惡之不能逐故使帥師而不召師潰而歸髙克奔陳鄭人為之賦清人清人詩鄭風刺文公退臣不以道危國亡師之夲也公羊傳鄭棄其師者何惡其將也鄭伯惡髙克使之將逐而不納棄師之道也榖梁傳惡其長也長謂髙克也兼不反其衆則是棄其師也鄭風清人序言髙克之進不以禮文公退之不以義交責之也春秋書鄭棄其師而克之奔陳不書何也諸侯專制國中生殺豫奪惟義所在使髙克罪不可逭請於王而誅之可也職事不共黜而退之可也姦邪不測放而逐之可也乃託為禦患使駐師境上日久衆散懼罪而自奔鄭伯之失政甚矣不書鄭伯而以國稱者當國大臣與其謀也附録左傳晉侯使大子申生伐東山皋落氏皋落氏赤狄别種在晉之東里克諫曰里克晉大夫大子奉冡祀社稷之粢盛以朝夕視君膳者也故曰冡子君行則守有守則從從曰撫軍守曰監國古之制也夫帥師專行謀誓軍旅帥師者必專謀軍事宣號令君與國政之所圖也國政正卿非大子之事也師在制命而已命將軍所制稟命則不威專命則不孝故君之嗣適不可以帥師君失其官帥師不威將焉用之大子統師是失其官也專命不孝是為帥必不威也且臣聞皋落氏將戰君其舍之公曰寡人有子未知其誰立焉不對而退見大子大子曰吾其廢乎對曰告之以臨民謂居曲沃教之以軍旅謂將下軍不共是懼何故廢乎且子懼不孝無懼弗得立修己而不責人則免于難大子帥師公衣之偏衣偏衣左右異色其半似公服佩之金玦玦如環而不連以金為之為偏衣之珮飾狐突御戎先友為右狐突伯行重耳外祖父也為申生御車申生以大子將上軍梁餘子養御罕夷先丹木為右罕夷晉下軍卿也梁餘子養為罕夷御羊舌大夫為尉羊舌大夫叔向祖父也尉軍尉先友曰衣身之偏偏半也握兵之要謂佩金玦將上軍在此行也子其勉之偏躬無慝分身之半非惡意也兵要逺災威權在己可以逺害親以無災又何患焉狐突歎曰歎先友之言為不知君心時事之徴也衣身之章也章貴賤佩衷之旗也旗表也所以表明其中心故敬其事則命以始當命以四時之始服其身則衣之純必以純色為服用其衷則佩之度衷中也佩玉者士君子常度今命以時卒閟其事也冬十二月閟盡之時衣之尨服逺其躬也尨雜色佩以金玦棄其衷也服以逺之時以閟之尨涼冬殺金寒玦離胡可恃也雖欲勉之狄可盡乎梁餘子養曰帥師者受命于廟受脤于社脤宜社之肉盛以脈器有常服矣軍服韋辨不獲而尨命可知也死而不孝不如逃之罕夷曰尨竒無常雜色奇怪非常之服金玦不復雖復何為君有心矣先丹木曰是服也狂夫阻之阻疑也言雖狂夫猶知有疑曰盡敵而反曰公辭敵可盡乎雖盡敵猶有內讒不如違之違去也狐突欲行羊舌大夫曰不可違命不孝棄事不忠雖知其寒寒薄也惡不可取子其死之大子將戰狐突諫曰不可昔辛伯諗周桓公云內寵並后外寵二政嬖子配適大都耦國亂之夲也周公弗從故及于難今亂夲成矣驪姬為內寵二五為外寵奚齊為嬖子曲沃為大都故曰亂夲成矣立可必乎孝而安民子其圖之奉身為孝不戰為安民與其危身以速罪也成風聞成季之繇乃事之成風莊公之妾僖公之母也繇卦兆之占辭而屬僖公焉故成季立之僖之元年齊桓公遷郉于夷儀二年封衛于楚丘郉遷如歸衛國忘亡忘其滅亡之困衛文公大布之衣大帛之冠衛文公名燬戴公之弟大布粗布大帛厚繒務材訓農通商惠工敬教勸學授方方百事之宜任能元年革車三十乘季年乃三百乘衛文以此年冬立季年在僖二十五年蓋招懷逃散故能致十倍之衆日講春秋解義卷十四
