body:
  text: 欽定四庫全書日講春秋解義卷十七僖公十年春王正月公如齊盟柯以後莊公因昏姻一再如齊自此魯不朝齊幾二十年蓋桓公霸業未盛不責諸侯以朝禮今僖始朝齊見於葵丘之後霸勢益張諸侯不朝周而朝霸主自此始矣狄滅溫溫子奔衛左傳十年春狄滅溫蘇子無信也蘇子周司寇蘇公之後也國于溫故曰溫子蘇子叛王即狄又不能于狄叛王事在莊十九年狄人伐之王不救故滅蘇子奔衛弦江黃近楚楚侵而滅之諸侯不能救以其遠也溫乃畿內之國而狄滅之諸侯坐視不救所以病齊桓也晉里克弒其君卓卓公羊作卓子弒卓在前年而以今春書者從赴也國人不子之義已見於奚齊之死故於卓正其君臣之名以著里克弒逆之罪也驪姬作難所難者里克耳使克眀於大義據經廷諍以動其君聞優施之言執節不二固大子以攜其黨多為之故以變其志驪姬之謀未必不懈使獻公終不能寤而殺申生則以死徇之大臣匡君師傅受子之義交盡矣乃以中立求免固讒賊之謀速申生之死克尚有人心哉故正其弒君之罪以示人臣遭遇國難求生避禍以陷於大惡而終亦不免於死亡者先儒有言為人臣子而不眀於春秋之義必陷篡弒之誅死罪之名豈不信與及其大夫荀息公羊傳及者何纍也弒君多矣舍此無纍者乎曰有孔父仇牧皆纍也舍孔父仇牧無纍者乎曰有有則此何以書賢也何賢乎荀息荀息可謂不食其言矣其不食其言奈何奚齊卓子者驪姬之子也荀息傅焉驪姬者國色也其顔色一國之選獻公愛之甚欲立其子于是殺世子申生申生者里克傅之獻公病將死謂荀息曰士何如則可謂之信矣荀息對曰使死者反生生者不愧乎其言則可謂信矣獻公死奚齊立里克謂荀息曰君殺正而立不正廢長而立幼如之何願與子慮之荀息曰君嘗訊臣矣臣對曰使死者反生生者不愧乎其言則可謂信矣里克知其不可與謀退弒奚齊荀息立卓子里克弒卓子荀息死之荀息可謂不食其言矣穀梁傳以尊及卑也荀息間也荀息從君於昏而春秋以死節書比於孔父仇牧何也人情於死生之際每至奪其本心甘棄名義而不顧息之不食其言亦足以愧天下受寄託之任而背之者矣故進之以甚茍免之惡也使荀息初聞獻公廢立之命即能以大義爭之使知變易國常非所以全二子則其義益髙其功益遠左氏引白圭之詩蓋嘉息之不食其言而深惜其始言之玷也司馬光之論篤矣夏齊侯許男伐北戎北戎或曰即山戎或曰非也當時患有大於戎者狄滅溫楚滅弦圍許舍此不圖而從事於戎是不務德而勤遠略况許方患楚而驅以伐戎亦非用人之道也晉殺其大夫里克左傳夏四月周公忌父王子黨會齊隰朋立晉侯周公忌父周卿士王子黨周大夫晉侯殺里克以説自解説不篡將殺里克公使謂之曰微子則不及此雖然子弒二君與一大夫為子君者不亦難乎對曰不有廢也君何以興欲加之罪其無辭乎臣聞命矣伏劒而死于是丕鄭聘于秦且謝緩賂故不及丕鄭里克黨以在秦故不及與里克俱死公羊傳里克弒二君則曷為不以討賊之辭言之惠公之大夫也然則孰立惠公里克也里克弒奚齊卓子逆惠公而入里克立惠公則惠公曷為殺之惠公曰爾既殺夫二孺子矣又將圖寡人為爾君者不亦病乎于是殺之然則曷為不言惠公之入晉之不言出入者踊為文公諱也踊豫也獻公殺申生文公惠公恐見及出奔不子當絶還入為篡文公功足以并掩前人之惡故惠公入懷公出文公入皆不書悉為文公諱故也為文公諱者欲眀文公之功大也齊小白入于齊則曷為不為桓公諱桓公之享國也長美見乎天下故不為之諱本惡也文公之享國也短美未見乎天下故為之諱本惡也穀梁傳稱國以殺罪纍上也里克弒二君與一大夫其以纍上之辭言之何也其殺之不以其罪也其殺之不以其罪奈何里克所為弒者為重耳也夷吾曰是又將殺我乎故殺之不以其罪也其為重耳弒奈何晉獻公伐虢得麗姬獻公私之有二子長曰奚齊稚曰卓子麗姬欲為亂亂謂殺申生而立其子故謂君曰吾夜者夢夫人趨而來曰吾苦畏夫人申生母胡不使大夫將衛士而衛冢乎公曰孰可使曰臣莫尊于世子則世子可故君謂世子曰麗姬夢夫人趨而來曰吾苦畏女其將衛士而往衛冢乎世子曰敬諾築宫宫成麗姬又曰吾夜者夢夫人趨而來曰吾苦飢世子之宫已成則何為不使祠也故獻公謂世子曰其祠世子祠已祠致福于君君田而不在麗姬以鴆為酒藥脯以毒獻公田來麗姬曰世子已祠故致福于君君將食麗姬跪曰食自外來者不可不試也覆酒于地而地賁賁沸起也以脯與犬犬死麗姬下堂而啼呼曰天乎天乎國子之國也子何遲于為君君喟然歎曰吾與女未有過切吾與女未有過差切急是何與我之深也使人謂世子曰爾其圖之世子之傅里克謂世子曰入自眀入自眀則可以生不入自眀則不可以生世子曰吾君已老矣已昏矣若此而入自眀眀則麗姬必死麗姬死則吾君不安所以使吾君不安者吾不若自死吾寧自殺以安吾君以重耳為寄矣慮麗姬又譛重耳故以託里克使保全之刎脰而死故里克所為弒者為重耳也夷吾曰是又將殺我也里克既負弒君之罪晉人殺之則當從州吁無知之例為討賊之詞乃稱國以殺而不去其官以惠公殺之不以其罪也始以賂求既而背之又懼其意在重耳而假詞以殺之非能為二孺子討賊也秋七月附録左傳晉侯改葬共太子共太子申生也秋狐突適下國下國曲沃新城遇太子太子使登僕忽如夢而相見狐突本為申生御故復使登車為僕而告之曰夷吾無禮余得請于帝矣將以晉畀秦秦將祀余對曰臣聞之神不歆非類民不祀非族君祀毋乃殄乎且民何罪失刑乏祀君其圖之君曰諾吾將復請七日新城西偏將有巫者而見我焉將因巫而見許之遂不見及期而往告之曰帝許我罰有罪矣敝于韓敝敗也韓杜注晉地今屬陕西西安府地名韓原丕鄭之如秦也言于秦伯曰吕甥郤稱冀芮實為不從若重問以召之三子晉大夫不從不與秦賂問聘問之幣臣出晉君君納重耳蔑不濟矣冬大雨雪雪公羊作雹公羊傳何以書記異也春秋書大雨雪者三在隱則以日書在桓則以月書此以時書周之冬酉戌亥月也是時隂結而未凝故以大雨雪為異附録左傳冬秦伯使泠至報問且召三子泠至秦大夫郤芮曰幣重而言甘誘我也遂殺丕鄭祁舉及七輿大夫左行共華右行賈華叔堅騅歂纍虎特宫山祁皆里丕之黨也祁舉晉大夫七輿侯伯七命副車七乘每乘一大夫主之七子七輿大夫丕豹奔秦丕豹丕鄭之子言于秦伯曰晉侯背大主而忌小怨民弗與也大主秦也小怨里丕伐之必出公曰失衆焉能殺謂殺里丕之黨違禍誰能出君謂豹避禍也為眀年晉殺丕鄭傳十有一年春晉殺其大夫丕鄭父左傳十一年春晉侯使以丕鄭之亂來告釋經書在今年穀梁傳稱國以殺罪纍上也按左氏丕鄭言于秦伯欲出晉君則信有罪矣曷為稱國以殺而不去其官鄭非弒君之賊也惠公徒以其異已而殺之則殺之不以罪觀丕鄭之事則里克之死出於惠公之私而非以討賊益眀矣其稱國者兼罪用事之臣不能格君心之非而贊其濫刑以危國也附録左傳天王使召武公內史過賜晉侯命召武公周卿士內史過周大夫諸侯即位天子賜之命圭為瑞受玉惰過歸告王曰晉侯其無後乎王賜之命而惰于受瑞先自棄也已其何繼之有禮國之幹也敬禮之輿也不敬則禮不行禮不行則上下昏何以長世為惠公不終張本夏公及夫人薑氏會齊侯于陽穀公之娶夫人之歸皆不見於經合禮故也夫人於傳無考而按其時代當為桓公之女可以歸寧不可以與會公稔知桓莊之失而不改其轍桓公親見兩國之事亦茍循其迹以兩君相會而使婦人厠於其間桓公之志益怠業益衰至楚人滅黃而不能救於是可徴矣附録左傳夏揚拒泉皋伊雒之戎揚拒泉皋杜注皆戎邑伊闕北有泉亭今河南洛陽縣西南有前城即泉亭也伊雒之戎杜注諸雜戎居伊水雒水之間者同伐京師入王城焚東門王子帶召之也王子帶甘昭公召戎欲因以篡位秦晉伐戎以救周秋晉侯平戎于王為二十四年天王出居鄭傳秋八月大雩穀梁傳雩月正也雩得雨曰雩不得雨曰旱禮龍見而雩常事不書書者皆以旱也故得雨則喜以月為正也不得雨則書旱眀旱災成冬楚人伐黃左傳黃人不歸楚貢冬楚人伐黃黃人恃齊故貫之􅉀管敬仲言于齊侯曰江黃遠齊而近楚楚為利之國也若伐而不能救則無以宗諸侯矣桓公不聽遂與之盟既知力不能救乃與之盟以怒楚而速其亡桓公之處心不仁而制事亦失理矣故春秋於弦溫之滅皆不書伐而黃獨書伐以示告命既至效死固守更歷三時援絶勢窮而上下同力以􅈬滅為可哀也十有二年春王三月庚午日有食之不書朔官失之附録左傳十二年春諸侯城衛楚丘之郛懼狄難也為眀年春狄侵衛傳夏楚人滅黃左傳黃人恃諸侯之睦于齊也不共楚職曰自郢及我九百里焉能害我郢楚都夏楚滅黃穀梁傳貫之盟管仲曰江黃遠齊而近楚楚為利之國也若伐而不能救則無以宗諸侯矣宗諸侯謂諸侯宗之桓公不聽遂與之盟管仲死楚伐江滅黃桓公不能救故君子閔之也春秋滅人之國其罪則一而見滅之例有三以歸者既無死難之節又無興復之志貪生畏死甘就執辱其罪為重許斯頓牂之類是也出奔者雖不能死社稷猶有興復之望焉託於諸侯禮稱寓公其罪為輕弦子溫子之類是也若夫國滅而死於其位是謂得正而斃於事為不幸於禮為無愆公羊氏所謂亡國之善詞上下之同力也若江黃二國是矣秋七月附録左傳王以戎難故討王子帶子帶前年召戎伐周秋王子帶奔齊冬齊侯使管夷吾平戎于王使隰朋平戎于晉前年晉救周伐戎故戎與周晉不和王以上卿之禮饗管仲管仲辭曰臣賤有司也有天子之二守國髙在國子髙子天子所命為齊守臣皆上卿也若節春秋來承王命何以禮焉節時也陪臣敢辭諸侯之臣稱于天子曰陪臣王曰舅氏伯舅之使故曰舅氏余嘉乃勳應乃懿德謂督不忘往踐乃職無逆朕命功勳美德可謂正而不可忘者不言位而言職者管仲位卑而執齊政故欲以職尊之管仲受下卿之禮而還不敢以職自髙卒受本位之禮君子曰管氏之世祀也宜哉讓不忘其上詩曰愷悌君子神所勞矣詩大雅言樂易君子為神所勞來故世祀也冬十有二月丁丑陳侯杵臼卒杵公羊作處十有三年春狄侵衛春秋之初狄最盛強桓公雖救邢衛未嘗親與敵戰今見楚人滅黃而齊不能救是以復逞志於衛眀年侵鄭逼近王都而淮夷亦來病杞蓋霸者以力假仁其心不能有勤而無怠故其業必至初盛而終衰觀春秋所書則知仲尼之徒所以不道桓文之事也附録左傳十三年春齊侯使仲孫湫聘于周且言王子帶前年王子帶奔齊言欲復之事畢不與王言歸復命曰未可王怒未怠其十年乎不十年王弗召也夏四月葬陳宣公公會齊侯宋公陳侯衛侯鄭伯許男曹伯于鹹鹹杜注衛地東郡濮陽縣東南有鹹城在今直𨽻開州東南左傳夏會于鹹淮夷病杞故且謀王室也秋為戎難故諸侯戌周齊仲孫湫致之致諸侯戌卒穀梁傳兵車之會也鹹之會謀城杞也城杞之諸侯即在會者凡土功龍見而戒事夏之二月周之四月也水昏正而栽日至而畢日至夏之十一月周之正月也故會在今年之夏眀年春始城之正合土功之時蓋諸侯受功於會旋返其國至眀年春始各就功役耳秋九月大雩冬公子友如齊觀友之聘則齊侯在國眀矣以是知諸侯咸返其國也附録左傳冬晉荐飢麥禾皆不熟使乞糴于秦秦伯謂子桑與諸乎對曰重施而報君將何求言不損秦重施而不報其民必攜攜而討焉無衆必敗不義故民離謂百里與諸乎百里秦大夫對曰天災流行國家代有救災恤鄰道也行道有福丕鄭之子豹在秦請伐晉欲為父報怨秦伯曰其君是惡其民何罪秦于是乎輸粟于晉自雍及絳相繼雍杜注秦國都今陕西鳯翔縣南有古雍城絳杜注晉國都命之曰泛舟之役雍臨渭絳臨汾從渭水運入河汾十有四年春諸侯城緣陵緣陵杜注杞邑後漢志北海郡有營陵縣薛瓚曰春秋謂之緣陵是也其故城在樂昌縣東南今屬山東青州府左傳十四年春諸侯城緣陵而遷杞焉不書其人有闕也闕謂器用未具城池未固而去為惠不終也公羊傳孰城之城杞也曷為城杞滅也孰滅之蓋徐莒脅之曷為不言徐莒脅之為桓公諱也曷為為桓公諱上無天子下無方伯天下諸侯有相滅亡者桓公不能救則桓公恥之也然則孰城之桓公城之曷為不言桓公城之不與諸侯専封也曷為不與實與而文不與文曷為不與諸侯之義不得専封也諸侯之義不得専封則其曰實與之何上無天子下無方伯天下諸侯有相滅亡者力能救之則救之可也穀梁傳其曰諸侯散辭也直曰諸侯無大小之序是各自欲城無總一之者非伯者所制故曰散辭聚而曰散何也諸侯城有散辭也桓德衰矣不書城杞杞未遷也齊桓之城三國書辭各異邢以自遷為文則其國尚存無専封之嫌故再序三國之師以見得救患恤鄰之義也楚丘之城則衛已滅而復封之其功雖大其事尤専故沒諸侯而不書以責其不稟王命也至於緣陵之城則淮夷病杞諸侯城而遷之其功不若楚丘之大其事亦不若楚丘之専故直書諸侯而不序所謂輕重之權衡曲直之繩墨於此可見矣夏六月季姬及鄫子遇于防使鄫子來朝鄫穀梁作繒後同杜注鄫國琅琊鄫縣今山東嶧縣東有鄫城左傳鄫季姬來寧公怒止之以鄫子之不朝也夏遇于防而使來朝公羊傳鄫子曷為使乎季姬來朝言為季姬所使內辭也非使來朝使來請已也穀梁傳遇者同謀也來朝者來請已也朝不言使言使非正也以病繒子也范寧曰魯女無故遠會諸侯遂得淫通此亦事之未必然左傳鄫季姬來寧公怒止之以鄫子之不朝也故遇于防而使來朝此近合人情但季姬不繫於鄫乃女子未嫁之稱且遇者邂逅之辭夫婦相會不宜言遇又眀年宜書鄫季姬歸而曰季姬歸于鄫義皆未安姑並存以俟參考秋八月辛卯沙鹿崩沙鹿杜注山名平陽元城縣東有沙鹿土山今沙鹿山在直隸元城縣東其西有沙鹿城左傳秋八月辛卯沙鹿崩晉卜偃曰期年將有大咎幾亡國國主山川山崩川竭亡國之徴公羊傳沙鹿者何河上之邑也此邑也其言崩何襲邑也襲者默陷入于地中沙鹿崩何以書記異也外異不書此何以書為天下記異也穀梁傳林屬于山為鹿鹿山足沙山名也無崩道而崩故志之也其日重其變也國主山川山川之變咎歸國君此年沙鹿崩眀年晉侯見獲於秦春秋不言事應而事應具存志物之反常使人恐懼修省之義也狄侵鄭冬蔡侯肸卒榖梁傳諸侯時卒惡之也附録左傳冬秦飢使乞糴于晉晉人弗與慶鄭曰慶鄭晉大夫背施無親幸災不仁貪愛不祥怒鄰不義四德皆失何以守國虢射曰虢射惠公舅皮之不存毛將安傅皮以喻所許秦城毛以喻糴言既背秦施為怨已深雖與之糴猶無皮而施毛慶鄭曰棄信背鄰患孰恤之無信患作失援必斃是則然矣虢射曰無損于怨而厚于寇不如勿與慶鄭曰背施幸災民所棄也近猶讎之况怨敵乎弗聽退曰君其悔是哉十有五年春王正月公如齊周官行人職諸侯之邦交嵗相問殷相聘世相朝此周之舊典也王制諸侯于天子五年一朝僖公十年朝齊此年又朝齊蓋用五年一朝之禮直同於事天子矣故曰五霸者三王之罪人也楚人伐徐三月公會齊侯宋公陳侯衛侯鄭伯許男曹伯盟于牡丘遂次于匡公孫敖帥師及諸侯之大夫救徐帥公羊作率後同牡丘杜注地名闕今聊城縣東北有牡丘或云即春秋會盟處匡杜注衛地在陳留長垣縣西南後漢志長垣縣有匡城今屬直隸大名府左傳十五年春楚人伐徐徐即諸夏故也三月盟于牡丘尋葵丘之盟且救徐也葵丘盟在九年孟穆伯帥師及諸侯之師救徐孟穆伯公孫敖慶父之子諸侯次于匡以待之穀梁傳兵車之會也遂繼事也次止也有畏也善救徐也徐嘗為齊取舒以披楚之與國故楚人滅黃之後嗣事於徐是徐為齊受師也况楚人憑陵東夏其勢漸張援徐以遏其鋒當如救焚拯溺且青徐地接無餽餉越險之難桓公乃逡巡牡丘遂止于匡而使大夫救徐何其志之衰氣之餒也以霸主合七國之君尚畏楚而不敢前諸大夫之志能毋怯士衆之氣尚可鼓乎用此知帝王之道至誠無息故盛德大業克保於終霸者假仁義以為名則始勤終怠德衰而業亦墮矣夏五月日有食之左傳夏五月日有食之不書朔與日官失之也秋七月齊師曹師伐厲厲杜注楚與國義陽隨縣北有厲鄉今湖廣隨州北有厲山厲鄉在山下左傳秋伐厲以救徐也大夫救徐楚師不退故二師復伐厲救之厲介徐楚之間乃楚與國兵法攻所必救伐厲以救徐也然繼此楚敗徐于婁林則知厲非楚所必救矣用師而漫無成算無怪其威頓而勢屈也八月螽公羊作􅏑穀梁傳螽蟲災也甚則月不甚則時九月公至自會公羊傳桓公之會不致此何以致久也春秋於魯君歸國而以會致者始此公自正月如齊因會諸侯盟于牡丘次于匡以俟大夫之救徐踰三時而以會致見救徐之無功也季姬歸于鄫已卯晦震夷伯之廟左傳震夷伯之廟罪之也于是展氏有隱慝焉夷伯魯大夫展氏之祖父慝惡也公羊傳晦者何冥也晝日而冥震之者何雷電擊夷伯之廟者也夷伯者曷為者也季氏之孚也孚信也季氏所信任臣季氏之孚則微者其稱夷伯何大之也曷為大之天戒之故大之也何以書記異也穀梁傳晦冥也震雷也夷伯魯大夫也因此以見天子至于士皆有廟天子七廟祭法曰王立七廟曰考廟王考廟皇考廟顯考廟祖考廟有二祧逺廟稱祧諸侯五曰考廟王考廟皇考廟顯考廟祖考廟大夫三曰考廟王考廟皇考廟士二曰考廟王考廟士上士也故德厚者流光德薄者流卑是以貴始德之本也始封必為祖不曰夷伯之廟震而曰震夷伯之廟眀天人相感之義也大夫之家廟震事甚微細而聖人不削謹天變也夷諡伯字在禮大夫既殁雖言於君所稱諡若字故史册因之與始卒稱名異劉敞之説非也冬宋人伐曹左傳冬宋人伐曹討舊怨也莊十四年曹與諸侯伐宋曹嘗從齊伐宋宋人憾焉今諸侯始二曹方伐厲救徐而襄公乘虛伐之宋襄固為不義而自齊桓創霸諸侯無私爭者垂三十年至此不能制諸侯之侵伐即桓德之衰可見矣楚人敗徐于婁林婁林杜注徐地下邳僮縣東南有婁亭在今江南虹縣東北左傳楚敗徐于婁林徐恃救也恃齊救穀梁傳夷狄相敗志也楚人越千里以攻徐齊桓統七國之師畏楚而不敢進春秋書諸侯盟次大夫帥師於前書齊曹伐厲宋人伐曹於中書楚人敗徐於後則齊桓之無志諸侯之解體救徐之不力其情具見矣十有一月壬戌晉侯及秦伯戰于韓獲晉侯秦始見經左傳晉侯之入也秦穆姬屬賈君焉晉侯入在九年穆姬申生姊秦穆夫人賈君晉獻公次妃賈女也且曰盡納羣公子羣公子晉獻武之族宣二年傳曰驪姬之亂詛無畜羣公子晉侯蒸于賈君又不納羣公子是以穆姬怨之晉侯許賂中大夫中大夫國內執政里丕等既而皆背之賂秦伯以河外列城五河外河南也東盡虢略虢略杜注從河南而東盡虢界今河南嵩縣境是也南及華山華山杜注在𢎞農華隂縣西南今屬陕西西安府內及解梁城解梁城杜注河東解縣今山西臨晉縣東南有解城既而不與晉飢秦輸之粟在十三年秦飢晉閉之糴在十四年故秦伯伐晉卜徒父筮之吉徒父秦之掌龜卜者卜人而用筮不能通三易之占故據其所見雜占而言之涉河侯車敗秦軍涉河則晉侯車敗也詰之秦伯不解謂敗在已故詰之對曰乃大吉也三敗必獲晉君其卦遇蠱巽下艮上蠱曰千乘三去三去之餘獲其雄狐夫狐蠱必其君也三去猶易所謂三驅蓋卜筮書雜辭以狐蠱為君喻晉惠公也蠱之貞風也其悔山也內卦為貞外卦為悔巽為風秦象艮為山晉象嵗云秋矣我落其實而取其材所以克也周九月夏之七月孟秋也艮為山山有木今嵗已秋風吹落山木之實則材為人所取實落材亡不敗何待三敗及韓秦三敗晉師遂從之及于韓晉侯謂慶鄭曰寇深矣若之何對曰君實深之可若何公曰不孫卜右慶鄭吉弗使惡其不孫步揚御戎步揚郤犫之父家僕徒為右乘小駟鄭入也鄭所獻馬名小駟慶鄭曰古者大事必乘其産生其水土而知其人心安其教訓而服習其道唯所納之無不如志今乘異産以從戎事及懼而變將與人易亂氣狡憤隂血周作張脈僨興外強中乾狡戾也僨動也氣狡憤于外則血脈必周身而作隨氣張動外雖有強形而內實乾竭進退不可周旋不能君必悔之弗聽九月晉侯逆秦師使韓簡視師韓簡晉大夫韓萬之孫復曰師少于我鬭士倍我公曰何故對曰出因其資謂奔梁求秦入用其寵為秦所納飢食其粟三施而無報是以來也今又擊之我怠秦奮倍猶未也公曰一夫不可狃况國乎遂使請戰曰寡人不佞能合其衆而不能離也君若不還無所逃命秦伯使公孫枝對曰君之未入寡人懼之入而未定列猶吾憂也列位也茍列定矣敢不承命韓簡退曰吾幸而得囚得囚為幸言必敗壬戌戰于韓原九月十三日晉戎馬還濘而止濘泥也還便旋也小駟不調故墮泥中公號慶鄭慶鄭曰愎諫違卜愎戾也固敗是求又何逃焉遂去之梁由靡御韓簡虢射為右輅秦伯將止之輅迎也止獲也鄭以救公誤之慶鄭不知其將獲秦伯呼使救惠公遂誤其師遂失秦伯秦獲晉侯以歸經書十一月壬戌十四日從赴晉大夫反首拔舍從之反首亂頭髮下垂也拔革舍止壞形毁服以示憂戚秦伯使辭焉曰二三子何其戚也寡人之從君而西也亦晉之妖夢是踐豈敢以至狐突不寐與神言故謂之妖夢申生言帝許罰有罪今將晉君而西以厭息此語踐厭也以至言至于已甚晉大夫三拜稽首曰君履后土而戴皇天皇天后土實聞君之言羣臣敢在下風穆姬聞晉侯將至以大子罃𢎞與女簡璧登臺而履薪焉罃康公名𢎞其母弟也簡璧罃𢎞姊妹古之宫閉者皆居之臺以抗絶之穆姬欲自罪故登臺而荐之以薪左右上下者必履柴乃得通使以免服衰絰逆免衰絰遭喪之服令行人服此逆秦伯且告曰上天降災使我兩君匪以玉帛相見而以興戎若晉君朝以入則婢子夕以死夕以入則朝以死唯君裁之乃舍諸靈臺靈臺杜注在京兆鄠縣周之故臺今陕西鄠縣東有鄠宫又東有靈囿囿中有靈臺大夫請以入公曰獲晉侯以厚歸也既而喪歸焉用之若將晉侯入則夫人或自殺大夫其何有焉何有猶何得且晉人戚憂以重我謂反首拔舍天地以要我不圖晉憂重其怒也我食吾言背天地也重怒難任任當也背天不祥必歸晉君公子縶曰公子縶秦大夫不如殺之無聚慝焉恐夷吾歸復相聚為惡子桑曰歸之而質其大子必得大成晉未可滅而殺其君祇以成惡祇適也且史佚有言曰史佚周武王時大史名佚無始禍無怙亂恃人亂為己利無重怒重怒難任陵人不祥乃許晉平晉侯使郤乞告瑕吕飴甥郤乞晉大夫瑕吕飴甥即吕甥也蓋姓瑕吕名飴甥字子金且召之晉侯聞秦將許之平故告吕甥召使迎已子金教之言曰朝國人而以君命賞恐國人不從故先賞之于朝且告之曰孤雖歸辱社稷矣其卜二圉也二代也圉惠公大子懷公衆皆哭哀君不還國晉于是乎作爰田爰易也言分公田之稅舊應入公者改易與所賞之衆吕甥曰君亡之不恤而羣臣是憂惠之至也將若君何衆曰何為而可對曰征繕以輔孺子征賦也繕治也孺子謂大子圉諸侯聞之喪君有君羣臣輯睦甲兵益多好我者勸惡我者懼庶有益乎衆説晉于是乎作州兵五黨為州州二千五百家也因此又使州長各繕甲兵初晉獻公筮嫁伯姬于秦遇歸妹兑下震上歸妹之睽兑下雜上睽歸妹上六變而為睽史蘇占之曰不吉史蘇晉卜筮之史其繇曰士刲羊亦無􅎺也女承筐亦無貺也周易歸妹上六爻辭也離為中女震為長男故稱士女􅎺血也貺賜也刲羊士之功承筐女之職上六無應所求不獲故下刲無血上承無實不吉之象也西鄰責言不可償也兑西方也兑為口舌以兑從震是口舌雷動歸妹之睽猶無相也歸妹女嫁之卦睽乖離之象故曰無相相助也震之離亦離之震二卦變而氣相通為雷為火為嬴敗姬震為雷為木離為火木者火之母火動熾而焚木女嫁反害母家之象故曰為嬴敗姬車説其輹火焚其旗不利行師敗于宗丘輹車下縛也震為車上六爻在震則無應故車脫輹在離則失位故火焚旗言皆失車火之用也車敗旗焚故不利行師火還害母故敗不出國外近在宗邑丘猶邑也歸妹睽孤寇張之弧此睽上九爻辭也處睽之極故曰睽孤失位孤絶故遇寇難而有弓矢之警皆不吉之象姪其從姑震木離火火從木生離為震妹于火為姑謂我姪者我謂之姑此子圉質秦之象六年其逋逃歸其國而棄其家逋亡也家謂子圉婦懷嬴眀年其死于髙梁之虛惠公死之眀年文公入殺懷公于髙梁髙梁杜注晉地在平陽府楊氏縣西南今山西臨汾縣梁墟是及惠公在秦曰先君若從史蘇之占吾不及此夫韓簡侍曰龜象也筮數也物生而後有象象而後有滋滋而後有數先君之敗德及可數乎史蘇是占勿從何益言龜以象示筮以數告象數相因而生然後有占占所以知吉凶不能變吉凶先君敗德致公及此非筮數所生雖復不從史蘇何益于禍詩曰下民之孽匪降自天僔沓背憎職競由人詩小雅言民之邪惡非天所降僔沓面語背相憎疾主于競逐為惡者由人耳因以諷諫惠公有以召此禍也十月晉隂飴甥會秦伯盟于王城隂飴甥即吕甥也食采于隂故曰隂飴甥今山西霍州吕鄉有隂地村王城杜注秦地馮翊臨晉縣東有王城在今陕西朝邑縣東秦伯曰晉國和乎對曰不和小人恥失其君而悼喪其親痛其親為秦所殺不憚征繕以立圉也曰必報讎寧事戎狄君子愛其君而知其罪不憚征繕以待秦命曰必報德有死無二以此不和秦伯曰國謂君何對曰小人戚謂之不免君子恕以為必歸小人曰我毒秦秦豈歸君毒謂三施不報君子曰我知罪矣秦必歸君二而執之服而舍之德莫厚焉刑莫威焉服者懷德二者畏刑此一役也秦可以霸納而不定廢而不立以德為怨秦不其然秦伯曰是吾心也改館晉侯饋七牢焉牛羊豕各一為一牢蛾析謂慶鄭曰蛾析晉大夫盍行乎對曰陷君于敗敗而不死又使失刑非人臣也臣而不臣行將焉入十一月晉侯歸丁丑殺慶鄭而後入丁丑月二十九日是嵗晉又飢秦伯又餼之粟曰吾怨其君而矜其民且吾聞唐叔之封也箕子曰其後必大晉其庸可冀乎唐叔晉始封之君武王之子箕子宋世家云紂親戚也姑樹德焉以待能者于是秦始征晉河東置官司焉征賦也河東即惠公許賂秦以河外列城五之地公羊傳此偏戰也何以不言師敗績君獲不言師敗績也穀梁傳韓之戰晉侯失民矣以其民未敗而君獲也秦伯伐晉而經不書伐専罪晉也獲晉侯不書以歸未至其國都也不書師敗績君重於師故君獲不言師敗績也晉侯三施不報抗兵逆戰及見獲於秦秦伯舍諸國外而旋歸之在晉侯為自取敗在秦伯為善處勝故書法如此日講春秋解義卷十七
