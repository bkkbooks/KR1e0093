body:
  text: 欽定四庫全書日講春秋解義卷五十五昭公二十有六年春王正月附錄左傳二十六年春王正月庚申齊侯取鄆葬宋元公左傳葬宋元公如先君禮也善宋人違命以合禮昭公在外而魯於諸侯之喪每遣使㑹葬則意如之專魯與君無異矣三月公至自齊居于鄆左傳三月公至自齊處于鄆言魯地也穀梁傳公次于陽州其曰至自齊何也公但至陽州未至齊以齊侯之見公可以言至自齊也居于鄆者公在外也至自齊道義不外公也君雖在外猶以在國之禮錄之是崇君之道公來自野井初未及齊國都而曰至自齊野井齊地故也入魯境故書至猶在外故書地居者有其土地人民之稱若曰魯地非意如之所得有所以存公也鄭伯突失國而取櫟以居衞侯衎失國而取夷儀以居皆書曰入此不言入内辭也爲尊者親者諱使若適他國而返居於鄆存一國之防也夏公圍成左傳夏齊侯將納公命無受魯貨申豐從女賈豐賈二人皆季氏家臣以幣錦二兩二丈爲一端二端爲一兩所謂匹也二兩二疋縳一如瑱瑱充耳縳卷也急卷使如充耳易懷藏適齊師謂子猶之人高齮子猶梁丘據齮子猶家臣能貨子猶爲高氏後粟五千庾言若能爲行貨于子猶當爲請使得爲高氏後又當致粟五千庾庾十六斗凡八千斛高齮以錦示子猶子猶欲之齮曰魯人買之百兩一布布陳之以百兩爲數言買此甚多以道之不通先入幣財財猶材也子猶受之言于齊侯曰羣臣不盡力于魯君者非不能事君也然據有異焉異猶怪也宋元公爲魯君如晉卒于曲棘叔孫昭子求納其君無疾而死俱在前年不知天之棄魯耶抑魯君有罪于鬼神故及此也君若待于曲棘使羣臣從魯君以卜焉若可師有濟也君而繼之兹無敵矣若其無成君無辱焉齊侯從之使公子鉏帥師從公鉏齊大夫成大夫公孫朝謂平子曰有都以衞國也請我受師以成邑禦齊師許之請納質弗許曰信女足矣告于齊師曰孟氏魯之敝室也用成已甚弗能忍也請息肩于齊公孫朝詐齊師言欲降使來取成齊師圍成成人伐齊師之飲馬于淄者曰將以厭衆以厭衆心不欲使知已降也淄杜注水出泰山梁父縣西北入汶漢梁父在今泗水縣北魯成備而後告曰不勝衆告齊言衆不欲降已不能勝師及齊師戰于炊鼻季氏師拒公炊鼻杜注魯地齊子淵捷從洩聲子聲子魯大夫射之中楯瓦瓦楯脊繇朐汏輈匕入者三寸入楯瓦也朐車軛輈車轅繇過也汏矢激匕矢鏃也聲子射其馬斬鞅殪改駕人以爲鬷戾也而助之人魯人也鬷戾叔孫氏司馬子車曰齊人也子車即淵捷將擊子車子車射之殪其御曰又之又欲使射餘人子車曰衆可懼也而不可怒也子囊帶從野洩叱之囊帶齊大夫野洩即聲子洩曰軍無私怒報乃私也將亢子又叱之子囊復叱亦叱之野洩亦叱也言齊無戰心但相叱冉豎射陳武子中手冉豎季氏臣武子陳子彊失弓而罵武子罵以告平子曰有君子白晳鬒鬚眉甚口平子曰必子彊也無乃亢諸對曰謂之君子何敢亢之僞言不敢違季氏林雍羞爲顔鳴右下皆魯人羞爲右故下車戰苑何忌取其耳何忌齊大夫顔鳴去之其右見獲懼而去之苑子之御曰視下顧復欲使苑子擊其足苑子刜林雍斷其足鑋而乗于他車以歸刜砍也鑋一足行顔鳴三入齊師呼曰林雍乗言魯人皆致力于季氏不以私怨而相棄穀梁傳非國不言圍所以言圍者以大公也崇大其事齊侯謀納公使公子鉏帥師圍成不書公以齊師而直曰公圍成惡齊受季氏之賂雖得其師不足以也春秋凡公出在境内而返不書至定公在國而致圍成所以著公之危弱攻私邑如敵國也昭公已去國而不致圍成者所以存公如公之在國也然昭公既孫自他國返必書至惟自圍成而復居於鄆不言至亦以示内外之别耳附錄左傳四月單子如晉告急五月戊午劉人敗王城之師于尸氏劉人劉蚠之屬王城子朝之徒尸氏杜注在鞏縣西南偃師城漢志偃師有尸鄉今河南偃師縣西南新蔡鎮即古尸鄉也戊辰王城人劉人戰于施谷施谷杜注周地劉師敗績秋公會齊侯莒子邾子杞伯盟于鄟陵鄟公羊作剸鄟陵杜注地闕左傳秋盟于鄟陵謀納公也霸統既絶參盟復作此齊景假納公之名以糾合也十六年齊徐郯莒嘗盟于蒲隧十九年宋邾郳嘗盟于蟲則諸侯固有不待霸主而自盟會者矣至是始書以晉不復能有諸侯也晉不主盟而後齊專盟矣公至自會居于鄆穀梁傳公在外也至自會道義不外公也凡公行返而告廟則書至昭公居鄆非宗廟之所在何以書曾子問云君去其國大宰取羣廟之主以從則昭公之去鄆而返亦或告於祖禰顧季氏彊悖專有魯國當時史官阿附必不書至聖人以所見之世而特志耳附錄左傳七月己巳劉子以王出師敗懼而出庚午次于渠渠杜注周地按即周陽渠也在今洛陽縣亦名九曲瀆王城人焚劉燒劉子邑丙子王宿于褚氏褚氏杜注洛陽縣南有褚氏亭在今洛陽縣東丁丑王次于萑谷庚辰王入于胥靡辛巳王次于滑萑谷杜注周地按距洛九十里有大谷漢設關于此萑谷蓋其支徑胥靡滑杜注皆周地本鄭邑今河南偃師縣東南有胥靡城縣南有緱氏故城卽古滑地也晉知躒趙鞅帥師納王使女寬守闕塞女寬晉大夫闕塞杜注洛陽西南伊闕口也今洛陽縣南闕塞山是九月庚申楚子居卒左傳九月楚平王卒令尹子常欲立子西子西平王之長庶曰大子壬弱壬昭王也其母非適也王子建實聘之子西長而好善立長則順建善則治王順國治可不務乎子西怒曰是亂國而惡君王也言王子建聘之是彰平王之惡國有外援不可瀆也外援秦也王有適嗣不可亂也敗親速讎不立壬秦將來討是速讎也亂嗣不祥我受其名受惡名賂吾以天下吾滋不從也楚國何爲必殺令尹令尹懼乃立昭王冬十月天王入于成周成周杜注洛陽今故城在縣東北公傳羊成周者何東周也在王城之東故曰東周其言入何不嫌也據入者簒詞旣曰天王則不嫌爲簒矣穀梁傳周有入無出也王者無外不言出因狄泉故稱入惠王襄王入皆不書此曷爲書幸之也王室亂入無足諱焉爾其不曰入于京師而云成周者成周在王城之東曰下都王城爲洛之上都時子朝據王城故王入成周以居子朝旣奔餘黨尚在王城敬王畏偪遂都成周故以地名書之著其實也尹氏召伯毛伯以王子朝奔楚左傳冬十月丙申王起師于滑辛丑在郊郊杜注子朝邑遂次于尸十一月辛酉晉師克鞏知躒趙鞅之師召伯盈逐王子朝伯盈本黨子朝晉師克鞏知其不成逐之而逆敬王王子朝及召氏之族毛伯得尹氏固南宮嚚奉周之典籍以奔楚尹召二族皆奔故稱氏重見尹固名者爲後還見殺隂忌奔莒以叛隂忌子朝黨莒杜注周邑召伯逆王于尸及劉子單子盟遂軍圉澤次于隄上圉澤隄上杜注皆周地按圉澤卽東圉之澤也在今洛陽縣東境癸酉王入于成周甲戌盟于襄宮襄王廟晉師使成公般戍周而還般晉大夫十二月癸未王入于莊宮莊宮在王城王子朝使告于諸侯曰昔武王克殷成王靖四方康王息民竝建母弟以蕃屛周亦曰吾無專享文武之功且爲後人之迷敗傾覆而溺入于難則振救之至于夷王王愆于厥身夷王厲王父也愆惡疾諸侯莫不竝走其望以祈王身至于厲王王心戾虐萬民弗忍居王于彘不忍害王也厲王末周人流王于彘諸侯釋位以閒王政閒猶與也周召二公與治王之政事號曰共和宣王有志而後效官宣王厲王子彘之亂宣王尚少召公虎取而長之效授也至于幽王宣王子天不弔周王昏不若用愆厥位若順也愆失也攜王奸命諸侯替之而建王嗣用遷郟鄏攜王幽王少子伯服也王嗣宜臼也幽王后申姜生大子宜臼王幸襃姒生伯服欲立之而殺大子大子奔申申伯與鄫及西戎伐周戰于戲幽王死諸侯廢伯服而立宜臼是爲平王東遷郟鄏則是兄弟之能用力于王室也至于惠王天不靖周生頽禍心施于叔帶惠襄辟難越去王都惠王平王六世孫頽惠王庶叔也莊十九年作亂惠王適鄭襄王惠王子叔帶襄王弟僖二十四年叔帶作亂襄王處氾則有晉鄭咸黜不端黜去也晉文殺叔帶鄭厲殺子頽爲王室去不端直之人以綏定王家則是兄弟之能率先王之命也在定王六年秦人降妖定王襄王孫定王六年魯宣八年曰周其有頿王頿口上鬚亦克能修其職諸侯服享二世共職二世謂靈景王室其有閒王位諸侯不圖而受其亂災閒王位本謂子朝今子朝以爲王猛受亂災本謂楚今子朝以爲晉至于靈王生而有頿靈王定王孫王甚神聖無惡于諸侯靈王景王克終其世景王靈王子今王室亂單旗劉狄剝亂天下壹行不若單旗穆公也劉狄劉蚡也壹專也謂先王何常之有言無常法唯余心所命其誰敢討之帥羣不弔之人弔至也以行亂于王室侵欲無厭規求無度貫瀆鬼神貫習也慢棄刑法倍奸齊盟傲很威儀矯誣先王晉爲不道是攝是贊攝持也思肆其㒺極兹不穀震盪播越竄在荆蠻不穀子朝自謂未有攸底若我一二兄弟甥舅奬順天法無助狡猾以從先王之命母速天罰赦圖不榖赦其憂而圖其難則所願也敢盡布其腹心及先王之經而諸侯實深圖之昔先王之命曰王后無適則擇立長年鈞以德德鈞以卜王不立愛公卿無私古之制也穆后及大子壽早夭卽世在十五年單劉贊私立少以閒先王閒錯先王之制亦唯伯仲叔季圖之伯仲叔季總謂諸侯閔馬父聞子朝之辭曰文辭以行禮也子朝干景之命遠晉之大以專其志無禮甚矣文辭何爲傳終王室亂穀梁傳遠矣非也非責也奔簒君之賊其責遠矣奔直奔也尹氏世卿秉政擅權書立朝書以朝奔楚著始終怙惡不悛也幷舉召毛治其黨也奔不言出者簒賊竊逃以逭天討無所出也故比於國滅之君與在境外之臣但以奔書曰奔楚則楚受簒賊之罪亦見矣附錄左傳齊有彗星出齊之分野齊侯使禳之晏子曰無益也祗取誣焉天道不謟謟疑也不貳其命若之何禳之且天之有彗也以除穢也君無穢徳又何禳焉若德之穢禳之何損詩曰惟此文王小心翼翼昭事上帝聿懐多福厥德不回以受方國詩大雅翼翼共也聿惟也回違也言文王德不違天人故四方之國歸往之君無違德方國將至何患于彗詩曰我無所監夏后及商用亂之故民卒流亡逸詩也言追監夏商之亡皆以亂故若德回亂民將流亡祝史之爲無能補也公說乃止齊侯與晏子坐于路寢公歎曰美哉室其誰有此乎景公自知德不能久有國故歎也晏子曰敢問何謂也公曰吾以爲在德對曰如君之言其陳氏乎陳氏雖無大德而有施于民豆區釡鍾之數其取之公也薄謂以公量收其施之民也厚謂以私量貸公厚斂焉陳氏厚施焉民歸之矣詩曰雖無德與女式歌且舞詩小雅義取雖無大德要有喜説之心欲歌舞之式用也陳氏之施民歌舞之矣後世若少惰陳氏而不亡則國其國也已公曰善哉是可若何對曰唯禮可以己之在禮家施不及國民不遷農不移工賈不變守常業士不濫不失職官不滔滔慢也大夫不收公利不作福公曰善哉我不能矣吾今而後知禮之可以爲國也對曰禮之可以爲國也久矣與天地竝君令臣共父慈子孝兄愛弟敬夫和妻柔姑慈婦聽禮也君令而不違臣共而不貳父慈而敎子孝而箴箴諫也兄愛而友弟敬而順夫和而義妻柔而正姑慈而從從不自專婦聽而婉婉順也禮之善物也公曰善哉寡人今而後聞此禮之上也對曰先王所禀于天地以爲其民也稟受也爲治也是以先王上之二十有七年春公如齊公至自齊居于鄆左傳二十七年春公如齊公至自齊處于鄆言在外也在外邑故書地穀梁傳公在外也夏四月吳弑其君僚左傳吳子欲因楚喪而伐之前年楚平王卒使公子掩餘公子燭庸帥師圍潛二子皆王僚母弟濳杜注楚邑在廬江六縣西南今江南霍山縣東北有灊城使延州來季子聘于上國季子夲封延陵後復封州來故曰延州來遂聘于晉以觀諸侯觀强弱楚莠尹然工尹麇帥師救濳二尹楚官然麇其名左司馬沈尹戌帥都君子與王馬之屬以濟師都君子在都邑之士有復除者王馬之屬王之養馬官屬校人也與吳師遇于窮窮水經注水出安豐縣窮谷在今江南霍丘縣西令尹子常以舟師及沙汭而還沙汭杜注水名水經注沙南流至義成縣西南入淮在今江南懐遠縣東北左尹郤宛工尹壽帥師至于濳吳師不能退遇窮之師當吳前濳之師要吳後故吳不得退去吳公子光曰此時也弗可失也欲因以弑王告鱄設諸曰鱄設諸二十年伍員所見勇士上國有言曰不索何獲我王嗣也光吳王諸樊子故曰王嗣吾欲求之事若克季子雖至至謂聘還不吾廢也鱄設諸曰王可弑也母老子弱是無若我何欲以老弱託光光曰我爾身也言我身猶爾身夏四月光伏甲于堀室而享王掘地為室王使甲坐于道及其門門階戸席皆王親也夾之以鈹羞者獻體改服于門外羞進食也獻體解衣執羞者坐行而入坐行膝行執鈹者夾承之承執羞者及體以相授也鈹及進羞者體以所食授王光僞足疾入于堀室恐難作王黨殺己故辟之鱄設諸寘劍于魚中以進全魚炙故可置劍抽劍刺王鈹交于胷交鱄設諸胷遂弑王闔廬以其子爲卿子鱄諸子季子至曰苟先君無廢祀民人無廢主社稷有奉國家無傾乃吾君也吾誰敢怨哀死事生以待天命非我生亂立者從之先人之道也吳自諸樊以下兄弟相傳而不立適是亂由先人起也季子自知力不能討光故云爾復命哭墓復使命于僚墓復位而待復本位待光命吳公子掩餘奔徐公子燭庸奔鍾吾鍾吾杜注小國漢志東海郡司吾今江南宿遷縣西北有司吾城楚師聞吳亂而還爲後譖郤宛起此公子光使鱄諸弑之而稱國何也光旣弑立自以諸樊之冢嗣假言國之臣民皆欲弑僚而還國於己故以衆弑赴於諸侯春秋不書人而書國所以發後人之疑使考之而得其實也先儒多以吳之亂責季子惟趙氏鵬飛曰使季子不逃而受之亦不免於亂何則季子之終將授之誰哉受之而身當其亂孰若逃之而自潔其身乎此篤論也楚殺其大夫郤宛郤穀梁作郄左傳郤宛直而和國人說之鄢將師爲右領右領官名與費無極比而惡之惡郤宛令尹子常賄而信讒無極譖郤宛焉謂子常曰子惡欲飲子酒子惡郤宛又謂子惡令尹欲飲酒于子氏子惡曰我賤人也不足以辱令尹令尹將必來辱爲惠己甚吾無以酬之若何無極曰令尹好甲兵子出之吾擇焉擇此以進子常取五甲五兵曰寘諸門令尹至必觀之而從以酬之日無極辭及饗日帷諸門左張帷陳甲兵其中無極謂令尹曰吾幾禍子子惡將爲子不利甲在門矣子必無往且此役也此春救濳之役吳可以得志子惡取賂焉而還又誤羣帥使退其師曰乗亂不祥吳乗我喪我乗其亂不亦可乎令尹使視郤氏則有甲焉不往召鄢將師而告之告子惡門有甲兵將害己將師退遂令攻郤氏且爇之爇燒也子惡聞之遂自殺也國人弗爇令曰不爇郤氏與之同罪或取一編菅焉或取一秉秆焉編菅苫也秉把也秆槀也國人投之遂弗爇也令尹炮之炮燔郤宛盡滅郤氏之族黨殺陽令終與其弟完及佗與晉陳及其子弟令終陽匄子晉陳楚大夫皆郤氏黨晉陳之族呼于國曰鄢氏費氏自以爲王專禍楚國弱寡王室蒙王與令尹以自利也令尹盡信之矣國將如何令尹病之爲下殺無極張本郤宛之死費無極譖諸囊瓦殺之而經以國殺爲文罪楚君也君無道以令其臣致擅殺大夫而無忌紀綱亡矣故以累上之辭書之秋晉士鞅宋樂祁犂衞北宮喜曹人邾人滕人會于扈左傳秋㑹于扈令戍周且謀納公也宋衞皆利納公固請之范獻子取貨于季孫謂司城子梁與北宮貞子曰子梁宋樂祁也貞子衞北宮喜季孫未知其罪而君伐之請囚請亡于是乎不獲君又弗克而自出也夫豈無備而能出君乎季氏之復天救之也休公徒之怒而啓叔孫氏之心不然豈其伐人而説甲執冰以游叔孫氏懼禍之濫而自同于季氏天之道也魯君守齊三年而無成季氏甚得其民淮夷與之有十年之備有齊楚之援公雖在齊言齊不致力有天之贊有民之助有堅守之心有列國之權而弗敢宣也宣用也事君如在國書公行告公至是也故鞅以爲難二子皆圖國者也而欲納魯君鞅之願也請從二子以圍魯無成死之二子懼皆辭乃辭小國而以難復以難納白晉君扈之會謀納公而以貨解無貶辭者以令戍周故也是時大夫同惡相濟齊景爲鄟陵之盟而梁丘據入季氏之錦晉頃爲扈之會而士鞅納季氏之貨二君懵然無知以爲魯之休戚無關於己孰知田常韜禍於齊六卿伏憂於晉厝火積薪而不悟使二君能爲魯討賊亦足以讋内盗之志也冬十月曹伯午卒邾快來奔公羊傳邾婁快者何邾婁之大夫也邾婁無大夫此何以書以近書也快之來奔從其類也意如逐君專國又誘人之臣使之叛其君而已爲之逋逃主罪可勝誅乎春秋書之以深惡季氏也附錄左傳孟懿子陽虎伐鄆陽虎季氏家臣伐鄆欲奪公鄆人將戰子家子曰天命不慆久矣慆疑也言棄君不疑使君亡者必此衆也天旣禍之而自福也不亦難乎猶有鬼神此必敗也嗚呼爲無望也夫其死于此乎公使子家子如晉公徒敗于且知且知杜注近鄆地楚郤宛之難國言未已進胙者莫不謗令尹進胙國中祭祀也謗詛也沈尹戌言于子常曰夫左尹與中廏尹中廏尹陽令終莫知其罪而子殺之以興謗讟至于今不己戍也惑之仁者殺人以掩謗猶弗爲也今吾子殺人以興謗而弗圖不亦異乎夫無極楚之讒人也民莫不知去朝吳在十五年出蔡侯朱在二十一年喪大子建殺連尹奢在二十年屏王之耳目使不聰明不然平王之溫惠共儉有過成莊無不及焉所以不獲諸侯邇無極也今又殺三不辜以興大謗三不辜郤氏陽氏晉陳氏幾及子矣子而不圖將焉用之夫鄢將師矯子之命以滅三族國之良也而不愆位鄢將師矯滅三良罪也而在位無愆過言失刑吳新有君光新立也疆埸日駭楚國若有大事子其危哉知者除讒以自安也今子愛讒以自危也甚矣其惑也子常曰是瓦之罪敢不良圖九月己未子常殺費無極與鄢將師盡滅其族以説于國謗言乃止公如齊左傳冬公如齊齊侯請饗之子家子曰朝夕立于其朝又何饗焉其飲酒也乃飲酒使宰獻而請安比公于大夫也禮君不敵臣宴大夫使宰爲主獻獻爵也請安齊侯請自安不在坐也子仲之子曰重爲齊侯夫人曰請使重見子仲魯公子憖十二年奔齊行飲酒禮而欲使重見從宴媟也子家子乃以君出辟齊夫人公至自齊居于鄆公朝齊者二會齊者一每行必書至書居繫臣民之望也據左氏仲孫何忌陽虎伐鄆公徒敗于且知而經不書存君也上之與下有征無戰况見伐於其臣而又敗乎故削之附錄左傳十二月晉籍秦致諸侯之戍于周魯人辭以難經所以不書戍周籍秦籍談子二十有八年春王三月葬曹悼公公如晉次于乾侯乾侯杜注在魏郡斥丘縣晉竟内邑今直隸成安縣東南有斥丘古城左傳二十八年春公如晉將如乾侯齊侯卑公故適晉子家子曰有求于人而卽其安人孰矜之其造于竟欲使次于竟以待命弗聽使請逆于晉晉人曰天禍魯國君淹恤在外君亦不使一个辱在寡人而卽安于甥舅其亦使逆君言自使齊逆君使公復于竟而後逆之言公不能用子家所以見辱穀梁傳公在外也昭公不見禮於齊故如晉言次不得入也次于陽州猶曰齊魯之境也次于乾侯則進退維谷羇旅之人耳齊猶致恤患之文晉則拒而不受蓋黨意如以弱其君者晉諸卿之本謀也豈肯忽爲公而背季氏哉夏四月丙戌鄭伯寧卒寧公羊作甯六月葬鄭定公附錄左傳晉祁勝與鄔臧通室二子祁盈家臣也通室易妻祁盈將執之盈祁午之子訪于司馬叔游叔游司馬叔侯之子叔游曰鄭書有之惡直醜正實蕃有徒鄭書古書名言害正直者實多徒衆醜亦惡也無道立矣子懼不免言世亂讒勝詩曰民之多辟無自立辟詩大雅辟邪也辟法也姑已若何盈曰祁氏私有討國何有焉遂執之祁勝賂荀躒荀躒爲之言于晉侯晉侯執祁盈以其專戮祁盈之臣曰鈞將皆死憖使吾君聞勝與臧之死也以爲快憖發語之音吾君謂祁盈乃殺之夏六月晉殺祁盈及楊食我楊杜注叔向邑食我叔向子伯石也食我祁盈之黨也而助亂故殺之遂滅祁氏羊舌氏初叔向欲娶于申公巫臣氏夏姬女也其母欲娶其黨叔向曰吾母多而庶鮮吾懲舅氏矣嫌母氏性不曠其母曰子靈之妻殺三夫一君一子而亡一國兩卿矣子靈巫臣妻夏姬三夫陳御叔楚襄老及巫臣時巫臣已死一君陳靈公一子夏徵舒一國陳也兩卿孔寧儀行父可無懲乎吾聞之甚美必有甚惡是鄭穆少妃姚子之子子貉之妹也子貉鄭靈公夷子貉早死無後而天鍾美于是是夏姬也子貉死在宣四年將必以是大有敗也昔有仍氏生女黰黑而甚美有仍古諸侯也美髮爲黰光可以鑑髮膚光色可以照人名曰𤣥妻以髮黒故樂正后䕫取之䕫舜典樂之君長生伯封實有豕心貪惏無饜忿纇無期謂之封豕纇戾也封大也有窮后羿滅之羿簒夏后者䕫是以不祀且三代之亡共子之廢皆是物也夏以妹喜殷以妲己周以襃姒三代所由亡也共子晉申生以驪姬廢女何以爲哉夫有尤物足以移人苟非德義則必有禍叔向懼不敢取平公强使取之生伯石伯石楊食我伯石始生子容之母走謁諸姑子容母叔向嫂伯華妻也姑叔向母曰長叔姒生男兄弟之妻相謂姒姑視之及堂聞其聲而還曰是豺狼之聲也狼子野心非是莫喪羊舌氏矣遂弗視秋七月癸巳滕子寧卒寧公羊作甯附錄左傳秋晉韓宣子卒魏獻子爲政獻子魏舒分祁氏之田以爲七縣七縣鄔祁平陵梗陽塗水馬首盂也分羊舌氏之田以爲三縣銅鞮平陽楊氏司馬彌牟爲鄔大夫鄔杜注大原鄔縣在今山西介休縣東北賈辛爲祁大夫祁杜注大原祁縣今山西祁縣東南有古城司馬烏爲平陵大夫平陵亦曰大陵今山西文水縣東北有大陵故城魏戊爲梗陽大夫戊魏舒庶子梗陽杜注在大原晉陽縣南今山西淸源縣南有梗陽城知徐吾爲塗水大夫徐吾知盈孫塗水杜注大原榆次縣今山西榆次縣西南有塗水故城韓固爲馬首大夫固韓起孫馬首元和志故城在壽陽縣東南今縣屬山西大原府孟丙爲盂大夫盂杜注大原盂縣卽今山西盂縣也樂霄爲銅鞮大夫銅鞮杜注上黨銅鞮縣今山西沁州西南有故城趙朝爲平陽大夫朝趙勝曾孫平陽杜注平陽縣今故城在山西臨汾縣西南僚安爲楊氏大夫楊氏杜注平陽楊氏縣今古楊城在山西洪洞縣南又名危城村謂賈辛司馬烏爲有力于王室二十二年納王故烏卽司馬督故舉之謂知徐吾趙朝韓固魏戊餘子之不失職能守業者也卿之庶子爲餘子其四人者皆受縣而後見于魏子以賢舉也四人司馬彌牟孟丙樂霄僚安也受縣而後見言采衆而舉不以私也魏子謂成鱄鱄晉大夫吾與戊也縣人其以我爲黨乎對曰何也戊之爲人也遠不忘君近不偪同不偪同位居利思義在約思純無濫心有守心而無淫行雖與之縣不亦可乎昔武王克啇光有天下其兄弟之國者十有五人姬姓之國者四十人皆舉親也夫舉無他唯善所在親疏一也詩曰惟此文王帝度其心莫其徳音其徳克明克明克類克長克君王此大國克順克比比于文王其徳靡悔旣受帝祉施于孫子詩大雅美文王能王大國受天福施及子孫心能制義曰度德正應和曰莫莫然淸靜照臨四方曰明勤施無私曰類施而無私物得其所無失類也敎誨不倦曰長敎誨長人之道賞慶刑威曰君作福作威君之職也慈和徧服曰順唯順故天下徧服擇善而從之曰比比方善事使相從也經緯天地曰文經緯相錯故織成文九德不愆作事無悔九德上九曰也皆無愆過則動無悔吝故襲天祿子孫賴之主之舉也近文德矣所及其遠哉賈辛將適其縣見于魏子魏子曰辛來昔叔向適鄭鬷蔑惡鬷蔑鄭然明惡貌醜欲觀叔向從使之收器者而往從隨也隨使人應斂爼豆者立于堂下一言而善叔向將飲酒聞之曰必鬷明也素聞其賢故聞其言而知之下執其手以上曰昔賈大夫惡賈國之大夫惡亦醜也娶妻而美三年不言不笑御以如皋爲妻御之皋澤射雉獲之其妻始笑而言賈大夫曰才之不可以已我不能射女遂不言不笑夫今子少不颺顔貌不顯揚子若無言吾幾失子矣言之不可以已也如是遂如故知今女有力于王室吾是以舉女因賈辛有功而後舉之言人不可無能行乎敬之哉母墮乃力仲尼聞魏子之舉也以爲義曰近不失親謂舉魏戊遠不失舉以賢舉可謂義矣又聞其命賈辛也以爲忠詩曰永言配命自求多福忠也詩大雅永長也言能長配天命致多福者唯忠魏子之舉也義其命也忠其長有後于晉國乎冬葬滕悼公附錄左傳冬梗陽人有獄魏戊不能斷以獄上上魏子其大宗賂以女樂訟者之大宗魏子將受之魏戊謂閻沒女寬曰二人魏子之屬大夫主以不賄聞于諸侯若受梗陽人賄莫甚焉吾子必諫皆許諾退朝待于庭待于魏子之庭饋入召之召二大夫食比置三歎旣食使坐更命之令坐魏子曰吾聞諸伯叔諺曰唯食忘憂吾子置食之閒三歎何也同辭而對曰或賜二小人酒不夕食或他人也言饑甚饋之始至恐其不足是以歎中置自咎曰豈將軍食之而有不足是以再歎魏子中軍帥故謂之將軍及饋之畢願以小人之腹爲君子之心屬厭而已屬足也言小人之腹飽猶知厭足君子之心亦宜然獻子辭梗陽人傳言魏氏所以興日講春秋解義卷五十五
