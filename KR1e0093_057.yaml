body:
  text: 欽定四庫全書日講春秋解義卷五十七定公公名宋襄公庶子昭公弟諡法安民大慮曰定周敬王十一年鄭獻公五年魯定公九年獻公卒子聲公勝立齊景公三十九年宋景公八年晉定公三年晉魏舒為政是年卒范鞅為政魯定公十三年晉逐范中行氏趙鞅歸于晉自是晉知氏韓氏魏氏趙氏竝强分晉之勢成矣衞靈公二十六年蔡昭侯十年曹隱公元年魯定公四年聲公弟露弑隱公代立是為靖公定八年靖公卒子伯陽立滕頃公五年陳惠公二十一年魯定公四年惠公卒子懐公柳立定八年懐公卒子閔公越立把悼公九年魯定公四年悼公卒子隱公乞立是年七月隱公弟過弑隱公自立是為僖公薛襄公二年魯定公十二年襄公卒子比立定十三年比弑惠公夷立又名寅莒郊公邾莊公三十三年魯定公三年莊公卒子隱公益立許許男斯十四年魯定公六年鄭滅許以斯歸弟元公成立小邾詳見昭公元年楚昭王七年魯定公四年吳入楚楚令尹子常奔鄭昭王復國子西為令尹秦哀公二十八年魯定公九年哀公卒孫惠公立吳闔廬六年魯定公四年吳入楚於越入吳定十四年於越敗吳于檇李闔廬傷而卒子夫差立越越子允常魯定公四年越入吳定十四年允常卒子句踐立吳闔廬聞允常死率師伐越句踐襲敗吳于檇李射殺闔廬欽定四庫全書日講春秋解義卷五十七定公名宋襄公之子昭公之弟以敬王十一年即位諡法安民大慮曰定元年春王公羊傳定何以無正月正月者正即位也本有有正月者正諸侯之即位定無正月者即位後也即位在正月後故不書正月即位何以後昭公在外得入不得入未可知也曷為未可知在季氏也定哀多微辭主人習其讀而問其𫝊讀謂經𫝊謂訓詁則未知己之有罪焉爾此假設言之主人謂定哀也設使定哀習其經問其𫝊解詁則不知己之有罪於是此孔子畏時君上以諱尊隆恩下以辟害容身慎之至也穀梁𫝊不言正月定無正也定之無正何也昭公之終非正終也定之始非正始也昭無正終故定無正始不言即位喪在外也定公未即位先書元年春者追書之也書王不書正月者昭公卒於外嗣子為賊臣所廢定公未立意如自以為君頒朔於廟故春秋黜之書王明王法以治之也不書正月著國無主而正朔無所承且見定公受國季氏不得正其始也或謂無事不書非也隱莊元年皆事在三月定元年亦事在三月然隱莊皆書正月則定公不書正月之為無正始可知矣三月晉人執宋仲幾于京師大夫專執于是始左傳元年春王正月辛巳晉魏舒合諸侯之大夫于狄泉將以城成周魏子涖政涖臨也代天子大夫為政衞彪傒曰將建天子立天子之居而易位以令非義也大事奸義必有大咎晉不失諸侯魏子其不免乎是行也魏獻子屬役于韓簡子及原壽過原壽過周大夫而田于大陸焚焉大陸杜注禹貢大陸在鉅鹿北嫌絶逺疑此田在汲郡呉澤荒蕪之地火田幷見燒也爾雅廣平曰陸按吳澤陂在今河南修武縣北一名太白陂還卒于寗寗杜注修武縣近吳澤孔氏頴逹曰寗即修武城也今故城在縣治西范獻子去其柏椁以其未復命而田也范獻子代魏子為政去其柏椁示貶之孟懿子㑹城成周不書公未即位庚寅栽栽設板築宋仲幾不受功曰滕薛郳吾役也欲使三國代宋受役薛宰曰宋為無道絶我小國于周以我適楚故我常從宋晉文公為踐土之盟曰凡我同盟各復舊職若從踐土若從宋亦唯命仲幾曰踐土固然固曰從舊薛舊為宋役薛宰曰薛之皇祖奚仲居薛以為夏車正奚仲為夏禹掌車服大夫奚仲遷于邳仲虺居薛以為湯左相仲虺奚仲之後若復舊職將承王官何故以役諸侯仲幾曰三代各異物薛焉得有舊言居周世不得以夏殷為舊為宋役亦其職也士彌牟曰晉之從政者新言范獻子新為政未習故事子姑受功歸吾視諸故府求故事仲幾曰縱子忘之山川鬼神其忘諸乎士伯怒謂韓簡子曰薛徵于人典籍故事人所知也宋徵于鬼取證于鬼神宋罪大矣且己無辭而抑我以神誣我也啟寵納侮書說命篇語謂開寵過分則納受侵侮其此之謂矣必以仲㡬為戮乃執仲幾以歸三月歸諸京師知以歸不可故復歸之京師城三旬而畢乃歸諸侯之戍齊高張後不從諸侯後期不及諸侯之役晉女叔寛曰周萇𢎞齊高張皆將不免萇叔違天高子違人天既厭周德萇𢎞欲遷都以延其祚故曰違天諸侯相率以崇天子而高子後期故曰違人天之所壞不可支也衆之所為不可奸也為哀三年周人殺萇𢎞六年高張來奔張本公羊𫝊仲幾之罪何不蓑城也若今以草衣城是也禮諸侯為天子治城各有分丈尺宋仲幾不治所主其言于京師何據城言成周執不地伯討也明以天子事執之伯討則其稱人何貶曷為貶不與大夫專執也曷為不與實與而文不與文曷為不與大夫之義不得專執也穀梁𫝊此其大夫其曰人何也微之也何為微之不正其執人于尊者之所也不與大夫之伯討也春秋之義諸侯不得專執况大夫乎宋仲幾㑹城成周而不受功義所當討然在尊者之側請命而執歸於司寇可也既不請命又不歸於王以陪臣而擅執人於天子之側無王甚矣故不以城為王事而畧晉大夫之罪夏六月癸亥公之喪至自乾侯戊辰公即位左𫝊夏叔孫成子逆公之喪于乾侯成子叔孫婼之子季孫曰子家子亟言于我未嘗不中吾志也吾欲與之從政子必止之且聽命焉衆事皆諮問子家子子家子不見叔孫易幾而哭幾哭㑹也不欲見叔孫故朝夕哭不同㑹叔孫請見子家子子家子辭曰羈未得見而從君以出出時成子未為卿君不命而薨羈不敢見言未受昭公之命託辭以拒叔孫叔孫使告之曰公衍公為實使羣臣不得事君二子始謀逐季氏若公子宋主社稷則羣臣之願也宋昭公弟定公凡從君出而可以入者將唯子是聽子家氏未有後季孫願與子從政此皆季孫之願也使不敢以告不敢叔孫成子名對曰若立君則有卿士大夫與守龜在羈弗敢知若從君者則貌而出者入可也貌出謂以義從公與季氏無實怨寇而出者行可也謂與季氏為寇讎者若羈也則君知其出也而未知其入也羈將逃也喪及壞隤公子宋先入從公者皆自壞隤反出奔六月癸亥公之喪至自乾侯戊辰公即位諸侯薨五日而殯殯則嗣子即位癸亥昭公喪至五日殯于宫定公乃即位公羊𫝊癸亥公之喪至自乾侯則曷為以戊辰之日然後即位正棺于兩楹之間然後即位正棺者象既小斂夷于堂昭公死于外不得以君臣禮治其喪故示盡始死之禮禮始死于北牖下浴于中霤飯含于牖下小斂于戸内夷于兩楹之間諸侯三日小斂夷而絰殯而成服故戊辰然後即位子沈子曰定君乎國定昭公之喪禮于國然後即位即位不日此何以日錄乎内也内事詳錄穀梁傳殯然後即位也周人殯于西階之上定無正見無以正也踰年不言即位是有故公也謂昭公在外故言即位是無故公也即位授受之道也先君見授後君乃受故須棺在殯乃言即位先君無正終則後君無正始也先君有正終則後君有正始也戊辰公即位謹之也定之即位不可不察也公即位何以日也戊辰之日然後即位也癸亥公之喪至自乾侯何為戊辰之日然後即位也正君乎國然後即位也諸侯五日而殯今以君始死之禮治之故須殯而後言即位沈子曰正棺乎兩楹之間然後即位也兩楹之間君聽治之處内之大事日即位君之大事也其不日何也以年決者不以日決也此則其日何也著之也何著焉踰年即位厲也厲危也公喪在外踰年六月乃得即位危故日之于厲之中又有義焉先君未殯則後君不得即位未殯雖有天子之命猶不敢况臨諸臣乎周人有喪魯人有喪周人弔魯人不弔周人曰固吾臣也使人可也魯人曰吾君也親之者也使大夫則不可也故周人弔魯人不弔以其下成康為未久也周道尚明君至尊也去父之殯而往弔猶不敢况未殯而臨諸臣乎昭公薨至是閱七月而喪始至而定之即位乃在是月之戊辰蓋遲速進退為意如所制不得專也凡即位皆於朔日故不書日定公待昭公喪至即位不以時故書日秋七月癸巳葬我君昭公左𫝊季孫使役如闞公氏將溝焉闞魯羣公墓所在季孫惡昭公欲溝絶其兆域不使與先君同公氏猶言公之墓宅榮鴐鵞曰生不能事死又離之以自旌也鴐鵞魯大夫榮成伯旌章也縱子忍之後必或恥之乃止季孫問于榮鴐鵞曰吾欲為君諡使子孫知之為惡諡對曰生弗能事死又惡之以自信也將焉用之乃止秋七月癸巳葬昭公于墓道南孔子之為司寇也在定公十年後溝而合諸墓明臣無貶君之義昭公薨逾半載始以喪歸歸甫踰月而遽葬見季氏肆逆無禮於先君而魯之臣子黨惡而不能正也九月大雩穀梁𫝊雩月雩之正也秋大雩非正也冬大雩非正也秋大雩雩之為非正何也冬禾稼既成猶雩則非禮可知秋禾稼始苖嫌當須雨故問也毛澤未盡人力未竭未可以雩也凡地之所生謂之毛言秋百穀之潤澤未盡也人力未竭謂耕耘之功未畢雩月雩之正也月之為雩之正何也其時窮人力盡然後雩雩之正也何謂其時窮人力盡是月不雨則無及矣是年不乂則無食矣是謂其時窮人力盡也雩之必待其時窮人力盡何也雩者為旱求者也求者請也古之人重請何重乎請人之所以為人者讓也請道去讓也則是舍其所以為人也是以重之焉請哉請乎應上公古之神人有應上公者通乎陰陽君親帥諸大夫道之而以請焉其禱辭曰方今大旱野無生稼寡人當死百姓何謗不敢煩民請命願撫萬民以身塞無狀夫請者非可詒託而往也詒託猶假寄必親之者也是以重之凡書大皆譏其僭此則昭公喪未踰年而用盛樂以雩變尤甚矣立煬宮左𫝊昭公出故季平子禱于煬公九月立煬宮平子逐君懼而請禱于煬公昭公死于外自以為獲福故立其宮公羊𫝊煬宮者何煬公之宮也春秋前煬公也立者何立者不宜立也立煬宫非禮也穀梁傳立者不宜立者也煬公考公弟也魯之以弟繼兄蓋始於此意如舍適嗣不立而立定公定公乃昭公之弟恐人議己於是而立煬宫其意若謂魯一生一及其由來舊矣今定公以弟而繼昭公亦猶煬公之以弟而繼考公也夫宮廟即遠有毁而無立今逞私踰典以立久祧之宫誣妄已甚書立者不宜立也附錄左𫝊周鞏簡公棄其子弟而好用遠人簡公周卿士遠人異族也為明年鞏氏賊簡公張本冬十月隕霜殺菽隕公羊作霣公羊𫝊何以書記異也此災菽也曷為以異書異大乎災也異者非常而可怪周十月夏八月微霜用事未可殺菽而殺故曰異穀梁𫝊未可以殺而殺舉重舉殺豆則殺草可知可殺而不殺舉輕不殺草則不殺菽亦顯僖三十三年霣霜不殺草是也其曰菽舉重也周十月今八月也月令九月霜始降八月陰氣未盛非隕霜之候而至於殺菽異矣菽耐霜之榖蓋物之難殺者言殺菽則餘物可知故穀梁子曰舉重二年春王正月附錄左𫝊二年夏四月辛酉鞏氏之羣子弟賊簡公夏五月壬辰雉門及兩觀災公羊傳其言雉門及兩觀災何兩觀微也雉門兩觀皆天子之制門為其主觀為其飾故微也然則曷為不言雉門災及兩觀主災者兩觀也時災從兩觀起時災者兩觀則曷為後言之不以微及大也何以書記災也穀梁傳其不曰雉門災及兩觀何也災自兩觀始也不以尊者親災也尊謂雉門親近也先言雉門尊尊也言及雉門與兩觀俱災也桓宮僖宮災不言及者二廟分明故不必言此不言及則嫌於雉門之兩觀獨災耳秋楚人伐呉左傳桐叛楚桐杜注小國廬江舒縣西南有桐鄉今江南桐城縣北有古桐城與廬江縣接界呉子使舒鳩氏誘楚人舒鳩杜注楚屬國曰以師臨我教舒鳩誘楚使以師臨呉我伐桐為我使之無忌呉伐桐也偽若畏楚師之臨已而為伐其叛國以取媚者欲使楚不忌呉所謂多方以誤之秋楚囊瓦伐呉師于豫章從舒鳩言呉人見舟于豫章偽將為楚伐桐而潛師于巢實欲以擊楚冬十月呉軍楚師于豫章敗之楚不忌呉故遂圍巢克之獲楚公子繁繁守巢大夫附錄左傳邾莊公與夷射姑飲酒私出射姑邾大夫出辟酒閽乞肉焉奪之杖以敲之為明年邾子卒傳冬十月新作雉門及兩觀公傳羊其言新作之何修大也修舊不書此何以書譏何譏爾不務乎公室也不務如公室之禮穀梁傳言新有舊也作為也有加其度也此不正其以尊者親之何也不正謂更擴大之不合法度也據當諱而以雉門親新作之下雖不正也于美猶可也災惡故尊雉門推災而遠之今新作美好之事雖尊雉門可以親之雉門公宮南門之中門也按明堂位天子五門皋庫雉應路魯有庫雉路三門庫門制似天子皋門雉門制似天子應門天子外闕兩觀諸侯外闕一觀魯設兩觀僭也既災則不當更作今復為之其制度無損故書新作譏其僭而不能革也南門亦書新作者彼以本有而改作之其高大過常非故制也延廄言新不言作者因舊而葺之非去舊復為者比言各有當也三年春王正月公如晉至河乃復意如逐君客死於外皆晉大夫為之羽翼其交甚親今公立往朝而晉復辭公者蓋意如之謀不使公得見晉侯所以操縱其君使之一切聽己也二月辛卯邾子穿卒二月公羊穀梁作三月左傳三年春二月辛卯邾子在門臺門上有臺臨廷閽以缾水沃廷邾子望見之怒閽曰夷射姑旋焉旋小便命執之見其不潔執射姑弗得滋怒自投于牀廢于鑪炭廢墮也爛遂卒先葬以車五乗殉五人欲藏中之潔故先内車及殉别為便房蓋其遺命莊公卞急而好潔故及是卞躁疾也夏四月秋葬邾莊公附錄左𫝊秋九月鮮虞人敗晉師于平中平中杜注晉地獲晉觀虎恃其勇也為五年士鞅圍鮮虞張本冬仲孫何忌及邾子盟于拔拔公羊穀梁作枝拔杜注地闕左𫝊冬盟于郯郯杜注即拔也修邾好也公即位故修好魯大夫而盟諸侯邾喪未期而出㑹盟蓋交失之附錄左傳蔡昭侯為兩佩與兩裘以如楚佩佩玉也獻一佩一裘于昭王昭王服之以享蔡侯蔡侯亦服其一子常欲之弗與三年止之唐成公如楚有兩肅爽馬成公唐惠侯之後肅爽駿馬名子常欲之弗與亦三年止之唐人或相與謀請代先從者許之飲先從者酒醉之竊馬而獻之子常子常歸唐侯自拘于司敗竊馬者自拘曰君以弄馬之故隱君身隱憂約也棄國家羣臣請相夫人以償馬必如之相助也夫人謂養馬者唐侯曰寡人之過也二三子無辱皆賞之蔡人聞之固請而獻佩于子常子常朝見蔡侯之徒命有司曰蔡君之久也官不共也言楚所以禮遣蔡侯之物不共備故明日禮不畢遣蔡侯之禮將死蔡侯歸及漢執玉而沈曰余所有濟漢而南者有若大川自誓不復與楚蔡侯如晉以其子元與其大夫之子為質焉而請伐楚為明年㑹召陵張本四年春王二月癸巳陳侯呉卒三月公㑹劉子晉侯宋公蔡侯衞侯陳子鄭伯許男曹伯莒子邾子頓子胡子滕子薛伯把伯小邾子齊國夏于召陵侵楚晉楚交兵止此左傳四年春三月劉文公合諸侯于召陵謀伐楚也文公王官伯也晉人假王命以討楚之久留蔡侯故曰文公合諸侯晉荀寅求貨于蔡侯弗得言于范獻子曰國家方危諸侯方貳將以襲敵不亦難乎水潦方降疾瘧方起中山不服中山鮮虞棄盟取怨晉楚同盟于宋無損于楚而失中山不如辭蔡侯吾自方城以來楚未可以得志晉敗楚侵方城在襄十六年祗取勤焉乃辭蔡侯晉人假羽旄于鄭鄭人與之析羽為旌王者遊車之所建鄭私有之因謂之羽旄借觀之明日或旆以㑹或賤者繼旐曰旆令賤人施其旆執以從㑹示卑鄭晉于是乎失諸侯傳言晉無禮所以遂弱是時晉楚皆衰其大夫用事而貪於賄相類也諸侯兩貳而楚求無厭陵蔑與國故蔡人發憤請師於晉晉於是大合諸侯陳許頓胡素役於楚者皆同心而北嚮天子之老涖焉其勢可有為而六卿懼君勝楚以歸而奪之權故乞賂以離蔡假旄以卑鄭用散諸侯之師以隳其君之功而固其私至以十八國之衆潛掠楚境無功而還春秋據實而書以深罪晉君之失政謀國者之不忠也而晉自是亦不能國矣夏四月庚辰蔡公孫姓帥師滅沈以沈子嘉歸殺之姓公羊作歸姓後同左𫝊沈人不㑹于召陵晉人使蔡伐之夏蔡滅沈書滅沈於㑹召陵之後盟皋鼬之前著侵楚無功而釋憾於微弱之沈徒以重楚人之怒耳蔡之視沈猶楚視蔡也楚實病已乃以所惡者加之沈覆其國而戕其君不義甚矣故書殺以正其罪五月公及諸侯盟于皋鼬皋鼬公羊作浩油杜注繁昌縣東南有城皋亭在今河南臨潁縣界左傳將㑹衞子行敬子言于靈公曰子行敬子衞大夫㑹同難難得宜嘖有煩言莫之治也嘖至也煩言忿爭其使祝佗從祝佗大祝子魚公曰善乃使子魚子魚辭曰臣展四體以率舊職猶懼不給而煩刑書若又共二共二職徼大罪也且夫祝社稷之常隸也社稷不動祝不出竟官之制也社稷動謂國遷君以軍行祓社釁鼓師出先有事祓禱于社謂之宜社于是殺牲以血塗鼓鼙為釁鼓祝奉以從奉社主也于是乎出竟若嘉好之事謂朝㑹君行師從卿行旅從臣無事焉公曰行也及皋鼬將盟將長蔡于衞欲令蔡先衞歃衞侯使祝佗私于萇𢎞曰聞諸道路不知信否若聞蔡將先衞信乎萇𢎞曰信蔡叔康叔之兄也先衛不亦可乎子魚曰以先王觀之則尚德也昔武王克商成王定之選建明德以藩屏周故周公相王室以尹天下尹正也于周為睦以盛德見親厚分魯公以大路大旂魯公伯禽也大路金路錫同姓諸侯車交龍為旂周禮同姓以封夏后氏之璜璜美玉名封父之繁弱封父杜注古諸侯也今河南封丘縣治西北有封父亭繁弱大弓名殷民六族條氏徐氏蕭氏索氏長勺氏尾勺氏使帥其宗氏輯其分族將其類醜醜衆也以法則周公用即命于周即就也是使之職事于魯以昭周公之明德分之土田陪敦陪増也敦厚也土地増厚凡七百里祝宗卜史大祝宗人大卜大史凡四官備物典策典策春秋之制官司彝器官司百官也彝器常用器因商奄之民商奄東方之國令屬魯命以伯禽而封于少皞之虚伯禽策命篇名如君陳君牙類也少皞虚杜注曲阜也在魯城内分康叔以大路少帛綪茷旃旌少帛雜帛也綪茷大赤取染草名也通帛為旃析羽為旌大呂鐘名殷民七族陶氏施氏繁氏錡氏樊氏饑氏終葵氏封畛土略自武父以南及圃田之北竟畛塗所徑也略界也武父杜注衞北界圃田杜注鄭藪名取于有閻之土以共王職有閻杜注衞所受朝宿邑蓋近京畿取于相土之東都以㑹王之東蒐為湯沐邑王東廵守以助祭泰山耼季授土耼季周公弟司空陶叔授民陶叔司徒命以康誥而封于殷虚康誥周書殷虚朝歌也皆啟以商政疆以周索皆魯衞也啟開也居殷故地因其風俗開導以舊政疆理土地以周法索法也分唐叔以大路密須之鼓密須杜注國名闕鞏甲名沽洗鐘名懐姓九宗職官五正懐姓唐之餘民九宗一姓為九族職官五正殷時五官居在唐地世為貴族以賜唐叔使主領之所以榮寵唐叔也命以唐誥而封于夏虚唐誥誥命篇名夏虚杜注大夏大原晉陽也啟以夏政亦因夏風俗開用其政疆以戎索大原近戎而寒不與中國同故自以戎法三者皆叔也而有令德故昭之以分物不然文武成康之伯猶多而不獲是分也唯不尚年也管蔡啟商惎閒王室惎毒也謂以殷叛王于是乎殺管叔而蔡蔡叔蔡放也以車七乗徒七十人與蔡叔車徒而放之其子蔡仲改行帥德周公舉之以為己卿士為周公臣見諸王而命之以蔡命為蔡侯其命書云王曰胡胡蔡仲名無若爾考之違王命也若之何其使蔡先衞也武王之母弟八人周公為大宰康叔為司寇耼季為司空五叔無官豈尚年哉五叔管叔鮮蔡叔度成叔武霍叔處毛叔耼也曹文之昭也文王子與周公異母晉武之穆也武王子曹為伯甸非尚年也以伯爵居甸服言小今將尚之是反先王也晉文公為踐土之盟衞成公不在夷叔其母弟也猶先蔡踐土召陵二㑹經書蔡在衞上霸主以國大小之序也子魚所言盟歃之次其載書云王若曰晉重文公魯申僖公衞武叔武蔡甲午莊侯鄭㨗文公齊潘昭公宋王臣成公莒期兹丕公也齊序鄭下周之宗盟異姓為後藏在周府可覆視也吾子欲復文武之略略道也而不正其德將如之何萇𢎞說告劉子與范獻子謀之乃長衞侯于盟反自召陵鄭子大叔未至而卒晉趙簡子為之臨甚哀曰黄父之㑹在昭二十五年夫子語我九言曰無始亂無為禍首無怙富無恃寵無違同無敖禮無驕能以能驕人無復怒復重也無謀非德非所謀也無犯非義𫝊言簡子能用善言所以遂興穀梁傳後而再㑹公志于後㑹也後志疑也公畏强楚疑于侵之故後者更謀也春秋之例王官與㑹而不與盟則書諸侯盟如葵丘之盟是也㑹盟皆與則不書諸侯如柯陵雞澤平丘之盟是也此言諸侯則劉子不盟可知矣公後至不與㑹而與盟則復稱公㑹諸侯盟如盟于薄盟于扈是也此年公與於召陵之㑹則非後矣㑹與盟公皆與而劉子不與則但當書諸侯盟于皋鼬如祝柯重丘㑹盟殊地之例而又書公及者所以著公受國於意如因如晉見却而汲汲求為此盟也把伯成卒于㑹成公羊作戊不言卒于師者以不成乎伐楚也六月葬陳惠公此見陳侯背殯出㑹也君在殯則辭㑹可也許遷于容城容城杜注闕許四遷皆受楚令悉以自遷為文許所欲也容城蓋析之近地秋七月公至自㑹不致侵楚無功也故以㑹告廟劉卷卒公羊𫝊劉卷者何天子之大夫也外大夫不卒此何以卒我主之也穀梁傳此不卒而卒者賢之也寰内諸侯也非列土諸侯此何以卒也天王崩為諸侯主也昭二十二年景王崩嘗以賓主之禮相接故書其卒畿内諸侯不同列國故不言劉子卷卒先儒謂劉子定内難有大功於王室特書其卒葬然單旗之功與劉子同而不書卒尹氏擅權亦書卒則其義不可通矣蓋召陵之㑹劉子與焉㑹罷而卒故來赴於魯而魯史書之耳葬把悼公楚人圍蔡左傳秋楚為沈故圍蔡晉士鞅衞孔圉帥師伐鮮虞圉公羊作圄晉伐楚則利在諸侯伐鮮虞則利在六卿故楚圍蔡不救而中山是伐比事書之而晉卿保利營私不恤國事之惡著矣葬劉文公公羊傳外大夫不書葬此何以書錄我主也以主我恩錄之尹氏王子虎皆不書葬此書葬以魯特往㑹也冬十有一月庚午蔡侯以呉子及楚人戰于柏舉楚師敗績楚囊瓦出奔鄭柏舉公羊作伯莒穀梁作伯舉杜注楚地當在今湖廣麻城縣境呉始書子左𫝊伍員為呉行人以謀楚楚之殺郤宛也在昭二十七年伯氏之族出郤宛黨伯州犂之孫嚭為呉大宰以謀楚楚自昭王即位無歲不有呉師蔡侯因之以其子乾與其大夫之子為質于呉冬蔡侯呉子唐侯伐楚唐侯不書兵屬于呉蔡舍舟于淮汭呉乗舟從淮來過蔡而舍之自豫章與楚夾漢豫章杜注漢東江北地名左司馬戌謂子常曰子㳂漢而與之上下㳂緣也緣漢上下遮使勿渡我悉方城外以毁其舟還塞大隧直轅冥阨大隧直轅冥阨地理通釋即義陽之黄峴武陽平靖三闗也黄峴平靖俱在今河南信陽州南武陽在州東南子濟漢而伐之我自後擊之必大敗之既謀而行武城黒謂子常曰黒楚武城大夫呉用木也我用革也用軍器不可久也不如速戰史皇謂子常楚人惡子而好司馬史皇楚大夫司馬沈尹戌若司馬毁呉舟于淮塞城口而入城口三隘道之總名是獨克呉也子必速戰不然不免乃濟漢而陳自小别至于大别小别山名在今湖廣漢川縣北一名甑山大别亦山名在今湖廣漢陽縣東北一名魯山三戰子常知不可知呉不可勝欲奔史皇曰安求其事難而逃之將何所入子必死之初罪必盡說言致死以克呉可以免貪賄致寇之罪十一月庚午二師陳于柏舉二師呉楚師闔廬之弟夫槩王晨請于闔廬曰楚瓦不仁瓦子常名其臣莫有死志先伐之其卒必奔而後大師繼之必克弗許夫槩王曰所謂臣義而行不待命者其此之謂也今日我死楚可入也以其屬五千先擊子常之卒子常之卒奔楚師亂呉師大敗之子常奔鄭史皇以其乗廣死以戰死公傳羊呉何以稱子夷狄也而憂中國其憂中國奈何伍子胥父誅乎楚挾弓而去楚以干闔廬闔廬曰士之甚士賢士勇之甚將為之興師而復讎于楚伍子胥復曰諸侯不為匹夫興師且臣聞之事君猶事父也虧君之義復父之讎臣不為也于是止蔡昭公朝乎楚有美裘焉囊瓦求之昭公不與為是拘昭公于南郢數年然後歸之于其歸焉用事乎河曰天下諸侯苟有能伐楚者寡人請為之前列楚人聞之怒為是興師使囊瓦將而伐蔡蔡請救于呉伍子胥復曰蔡非有罪也楚人為無道君如有憂中國之心則若時可矣于是興師而救蔡曰事君猶事父也此其為可以復讎奈何曰父不受誅不受誅罪不當誅也子復讎可也父受誅子復讎推刃之道也一往一來曰推刃復讎不除害不得兼讎其子恐復害己而殺之朋友相衞而不相迿迿先也不先擊刺所以伸孝子之恩古之道也穀梁傳呉其稱子何也以蔡侯之以之舉其貴者也貴謂子也蔡侯之以之則其舉貴者何也呉信中國而攘夷狄呉進矣其信中國而攘夷狄奈何子胥父誅于楚也子胥父伍奢也為楚平王所殺挾弓持矢而干闔廬闔廬曰大之甚勇之甚為是欲興師而伐楚子胥諫曰臣聞之君不為匹夫興師且事君猶事父也虧君之義復父之讎臣弗為也于是止蔡昭公朝于楚有美裘正是日囊瓦求之昭公不與為是拘昭公于南郢南郢楚郡數年然後得歸歸乃用事乎漢用事者禱漢水神曰苟諸侯有欲伐楚者寡人請為前列焉楚人聞之而怒為是興師而伐蔡蔡請救于呉子胥曰蔡非有罪楚無道也君若有憂中國之心則若此時可矣為是興師而伐楚何以不言救也救大也師能左右之曰以曰蔡侯以呉子者蓋謀出於蔡而呉為之用也荆楚横暴蔡尤被毒蓋嘗夷之為縣誘般而殺之用世子有出蔡侯朱又拘呉於南郢數年而後歸今復興師圍其國陵暴極矣晉不足恃故蔡侯不得已而乞師於呉呉子為之大敗楚師囊瓦奔鄭春秋據事直書而蔡人累世之仇頼呉以復晉失其政不足以宗諸侯舉可見矣呉子親行君重於師故不得不書爵𫝊以為進之非也諸侯積忿於楚呉能敗之故舊史喜其事而稱爵或未可知以為孔子特起襃進之文則於通經之義皆不可通矣庚辰呉入郢郢公羊穀梁作楚左傳呉從楚師及清發清發杜注水名水經注溳水南逕石岩山北亦謂之清水在今湖廣安陸縣西石門山下將擊之夫槩王曰困獸猶鬬况人乎若知不免而致死必敗我若使先濟者知免後者慕之蔑有鬭心矣半濟而後可擊也從之又敗之楚人為食呉人及之奔食而從之敗諸雍澨雍澨今湖廣京山縣西南有三澨水雍澨其一也五戰及郢己卯楚子取其妹季芈畀我以出世族譜季芈畀我皆平王女服䖍云畀我季芈之字未知孰是涉睢睢杜注水出新城昌魏縣東南至枝江縣入江今湖廣當陽縣北有沮水相𫝊即楚昭王西涉處鍼尹固與王同舟王使執燧象以奔呉師燒火燧繫象尾使赴呉師驚却之庚辰呉入郢以班處宮以尊卑班次處楚王宮室子山處令尹之宮子山呉王子夫槩王欲攻之懼而去之夫槩王入之言呉無禮所以不能克左司馬戌及息而還息杜注汝南新息也聞楚敗故還敗呉師于雍澨傷初司馬臣闔廬嘗在呉為闔廬臣故恥為禽焉謂其臣曰誰能免吾首呉句卑曰臣賤可乎司馬曰我實失子可哉失不知子賢三戰皆傷曰吾不可用也已句卑布裳剄而裹之司馬已死剄取其首藏其身而以其首免𫝊言司馬之忠壯楚子涉睢濟江入于雲中雲中杜注雲夢澤中所謂江南之夢蓋雲夢一澤跨江南北王寢盗攻之以戈擊王王孫由于以背受之中肩王奔鄖鍾建負季芈以從鍾建楚大夫由于徐蘇而從以背受戈故當時悶絶鄖公辛之弟懐將弑王曰平王殺吾父我殺其子不亦可乎辛蔓成然之子鬬辛也昭十四年楚平王殺成然辛曰君討臣誰敢讎之君命天也若死天命將誰讎詩曰柔亦不茹剛亦不吐不侮矜寡不畏强禦唯仁者能之詩大雅言仲山甫不辟强陵弱違强陵弱非勇也乗人之約非仁也滅宗廢祀非孝也弑君罪應滅宗動無令名非知也必犯是余將殺女鬬辛與其弟巢以王奔隨呉人從之謂隨人曰周之子孫在漢川者楚實盡之天誘其衷致罰于楚而君又竄之竄匿也周室何罪君若顧報周室施及寡人以奬天衷君之惠也漢陽之田君實有之楚子在公宫之北隨公宮也呉人在其南子期似王子期昭王兄公子結逃王而已為王曰以我與之王必免隨人卜與之不吉乃辭呉曰以隨之辟小而密邇于楚楚實存之世有盟誓至于今未改若難而棄之何以事君執事之患不唯一人一人楚王若鳩楚竟敢不聽命呉人乃退鑪金初宦于子期氏實與隨人要言要言無以楚王與呉幷欲脫子期王使見辭曰不敢以約為利王割子期之心以與隨人盟當心前割取血以盟示其至心初伍員與申包胥友包胥楚大夫其亡也謂申包胥曰我必復楚國復報也申包胥曰勉之子能復之我必能興之及昭王在隨申包胥如秦乞師曰呉為封豕長蛇以荐食上國荐數也虐始于楚寡君失守社稷越在草莽使下臣告急曰夷德無厭若鄰于君疆埸之患也呉有楚則與秦鄰逮呉之未定君其取分焉與呉共分楚地若楚之遂亡君之土也若以君靈撫之世以事君秦伯使辭焉曰寡人聞命矣子姑就館將圖而告對曰寡君越在草莽未獲所伏伏猶處也下臣何敢即安立依于庭牆而哭日夜不絶聲勺飲不入口七日秦哀公為之賦無衣詩秦風取其王于興師修我戈矛與子同仇與子偕作與子偕行九頓首而坐無衣三章章三頓首秦師乃出為明年包胥以秦師至張本公羊傳呉何以不稱子反夷狄也其反夷狄奈何君舍于君室大夫舍于大夫室蓋妻楚王之母也穀梁傳日入易無楚也易無楚者壊宗廟徙陳器撻平王之墓何以不言滅也欲存楚也其欲存楚奈何昭王之軍敗而逃父老送之曰寡人不肖亡先君之邑父老反矣何憂無君寡人且用此入海矣父老曰有君如此其賢也以衆不如呉以必死不如楚相與擊之一夜而三敗呉人復立楚復立也何以謂之呉也狄之也何謂狄之也君居其君之寢而妻其君之妻大夫居其大夫之寢而妻其大夫之妻蓋有欲妻楚王之母者不正乗敗人之績而深為利居人之國故反其狄道也郢楚都書入郢見楚之大國都猶不能守也凡書入者皆破其國都也楚地數千里若書入楚則不足以見破其國都之實矣呉不稱子從其恒稱穀梁以為不正其乗人之敗而深為利則諸入國者皆然何獨貶於呉乎日講春秋解義卷五十七
