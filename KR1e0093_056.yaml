body:
  text: 欽定四庫全書日講春秋解義卷五十六昭公二十有九年春公至自乾侯居于鄆齊侯使高張來唁公左傳二十九年春公至自乾侯處于鄆齊侯使高張來唁公稱主君比公于大夫子家子曰齊卑君矣君祗辱焉公如乾侯穀梁傳唁公不得入于魯也不以自晉致者未至晉都不得與晉侯相見故書至自乾侯齊侯荀躒唁公皆地此何以不地唁于野井齊地也唁于乾侯晉地也今在鄆乃魯地故但書來附錄左傳三月己卯京師殺召伯盈尹氏固及原伯魯之子皆子朝黨也稱伯魯子終不説學尹固之復也二十六年尹固與子朝俱奔楚而道還有婦人遇之周郊尤之曰處則勸人爲禍行則數日而反是夫也其過三歲乎夏五月庚寅王子趙車入于鄻以叛陰不佞敗之趙車子朝之餘也鄻杜注周邑陰不佞周大夫公如晉次于乾侯左傳平子每歲賈馬賈買也具從者之衣屨而歸之于乾侯公執歸馬者賣之賣其馬乃不歸馬衞侯來獻其乗馬曰啓服啓服馬名塹而死墮塹死也公將爲之櫝爲作棺子家子曰從者病矣請以食之乃以幃裹之禮曰敝幃不棄爲埋馬也公賜公衍羔裘使獻龍輔于齊侯龍輔玉名遂入羔裘齊侯喜與之陽榖陽穀杜注齊邑公衍公爲之生也其母偕出出之産舍公衍先生公爲之母曰相與偕出請相與偕告畱公衍母使待己共白公三日公爲生其母先以告公爲爲兄公私喜于陽穀而思于魯曰務人爲此禍也務人公爲也始與公若謀逐季氏且後生而爲兄其誣也久矣乃黜之而以公衍爲大子書次于乾侯復不見受也公稔知晉之彊臣黨於意如今絶望於齊不得已而求於晉迹愈勤而計愈左矣使公定居於鄆鄆猶不至於潰也夏四月庚子叔詣卒穀梁傳季孫意如曰叔倪無病而死此皆無公也是天命也言皆天命使魯無君爾非我罪也秋七月附錄左傳秋龍見于絳郊絳晉國都魏獻子問于蔡墨曰蔡墨晉大史吾聞之蟲莫知于龍以其不生得也謂之知信乎對曰人實不知非龍實知言龍無知乃人不知之耳古者畜龍故國有豢龍氏有御龍氏豢御養也獻子曰是二氏者吾亦聞之而不知其故是何謂也對曰昔有飂叔安飂杜注古國也漢志南陽湖陽縣故廖國師古曰左傳作飂今湖陽故城在河南唐縣南叔安飂君名有裔子曰董父實甚好龍能求其耆欲以飲食之龍多歸之乃擾畜龍擾順也以服事帝舜帝賜之姓曰董氏曰豢龍豢龍官名官有世功則以官氏封諸鬷川鬷夷氏其後也鬷川杜注鬷水上夷皆董姓故帝舜氏世有畜龍及有夏孔甲擾于有帝孔甲少康之後九世君也其德能順于天帝賜之乗龍河漢各二合爲四各有雌雄孔甲不能食而未獲豢龍氏有陶唐氏旣衰其後有劉累劉累堯之子孫學擾龍于豢龍氏以事孔甲能飲食之夏后嘉之賜氏曰御龍夏后孔甲以更豕韋之後更代也以劉累代彭姓之豕韋累尋遷魯縣豕韋復國至商而滅累之後世復承其國爲豕韋氏見襄二十四年龍一雌死潛醢以食夏后潛藏也藏以爲醢明龍不知夏后饗之旣而使求之求致龍也懼而遷于魯縣不能致龍故懼魯縣杜注魯陽也今河南魯山縣東北有魯陽故城范氏其後也晉范氏獻子曰今何故無之對曰夫物物有其官官修其方方法術朝夕思之一日失職則死及之失職有罪失官不食不食禄官宿其業宿猶安也其物乃至設水官修則龍至若泯棄之物乃坻伏坻止伏匿鬱湮不育鬰滯也湮塞也育生也故有五行之官是謂五官實列受氏姓封爲上公祀爲貴神社稷五祀是尊是奉五官之君長能修其業者死皆配食于五行之神爲王者所尊奉木正曰句芒正官長也取木生句曲而有芒角也其祀重火正曰祝融祝融明貌其祀犂金正曰蓐收秋物摧蓐而可收也其祀該水正曰𤣥㝠水陰而幽㝠其祀修及熙土正曰后土土爲羣物主故稱后也其祀句龍在家則祀中霤在野則爲社龍水物也水官棄矣故龍不生得不然周易有之在乾乾下乾上乾之姤巽下乾上姤乾初九變曰潛龍勿用乾初九爻辭其同人離下乾上同人乾九二變曰見龍在田乾九二爻辭其大有乾下離上大有乾九五變曰飛龍在天乾九五爻辭其夬乾下兌上夬乾上九變曰亢龍有悔乾上九爻辭其坤坤下坤上坤乾六爻皆變曰見羣龍無首吉乾用九爻辭坤之剝坤下艮上剝坤上六變曰龍戰于野坤上六爻辭若不朝夕見誰能物之物謂上六卦所稱龍各不同也今説易者皆以龍喻陽氣如史墨之言則爲皆是真龍獻子曰社稷五祀誰氏之五官也對曰少皞氏有四叔少皞金天氏曰重曰該曰修曰熙實能金木及水能治其官使重爲句芒木正該爲蓐收金正修及熙爲𤣥㝠二子相代爲水正世不失職遂濟窮桑此其三祀也窮桑少皞之號杜注地在魯北顓頊氏有子曰犂爲祝融犂爲火正共工氏有子曰句龍爲后土共工在大皞後神農前以水名官者其子句龍能平水土此其二祀也后土爲社稷田正也掌播殖也有烈山氏之子曰柱爲稷烈山氏神農世諸侯自夏以上祀之祀柱周棄亦爲稷棄周之始祖能播百穀湯旣勝夏廢柱而以棄代之自商以來祀之傳言蔡墨之博物冬十月鄆潰公羊傳邑不言潰此其言潰何據國曰潰邑曰叛郛之也郛郭曷爲郛之君存焉爾昭公居之故從國言潰不言國之言郛之者公失國也穀梁傳潰之爲言上下不相得也上下不相得則惡矣亦譏公也昭公出奔民如釋重負此意如閒公如乾侯誘其民潰散叛公使公不得更入鄆也自是公遂削跡於魯論者多咎公之失民而不知季氏專國已歴三世加意如兇威所脅民之從之實以耳濡目染之有素而非一朝一夕之故也附錄左傳冬晉趙鞅荀寅帥師城汝濱趙鞅趙武孫也荀寅中行荀吳之子汝濱杜注晉所取陸渾地陸渾今嵩縣汝水在縣南遂賦晉國一鼓鐵以鑄刑鼎令晉國各出功力共鼓石爲鐵計令一鼓而足因軍役而爲之故言遂著范宣子所爲刑書焉仲尼曰晉其亡乎失其度矣夫晉國將守唐叔之所受法度以經緯其民卿大夫以序守之序位次也民是以能尊其貴貴是以能守其業貴賤不愆所謂度也文公是以作執秩之官爲被廬之法在僖二十七年以爲盟主今棄是度也而爲刑鼎民在鼎矣何以尊貴棄禮徵書故不尊貴貴何業之守民不奉上則上失業貴賤無序何以爲國且夫宣子之刑夷之蒐也晉國之亂制也夷蒐在文六年一蒐而三易中軍帥賈季箕鄭之徒遂作亂故曰亂制若之何以爲法蔡史墨曰蔡史墨卽蔡墨范氏中行氏其亡乎中行寅爲下卿而干上令擅作刑器以爲國法是法姦也又加范氏焉易之亡也范宣子刑書中旣廢矣今復變易興之是成其咎其及趙氏趙孟與焉然不得已若德可以免鑄刑鼎本非趙鞅意爲定十三年荀寅士吉射入朝歌以叛傳三十年春王正月公在乾侯左傳三十年春王正月公在乾侯不先書鄆與乾侯非公且徵過也徵明也先此二十七年二十八年公在鄆二十九年公在乾侯而經不釋朝正之禮者蓋以公尚在竟内至是鄆潰客寄乾侯故書所在責公不能繫臣民之望明有過也穀梁傳中國不存公存公故也中國猶國中也公去社稷於今五年毎嵗首不書公者在魯封内則無適而非其所魯固未嘗無君也至是鄆潰客寄乾侯非其所矣故歲首必書公之所在蓋以存君不與季氏之專國也不書居非其地也夏六月庚辰晉侯去疾卒秋八月葬晉頃公左傳夏六月晉頃公卒秋八月葬鄭游吉弔且送葬魏獻子使士景伯詰之曰悼公之喪子西弔子蟜送葬今吾子無貳何故弔葬共使對曰諸侯所以歸晉君禮也禮也者小事大大字小之謂事大在共其時命隨時共所求字小在恤其所無以敝邑居大國之閒共其職貢與其備御不虞之患豈忘共命言不敢忘共命以所備御者多不及辦之先王之制諸侯之喪士弔大夫送葬唯嘉好聘享三軍之事于是乎使卿晉之喪事敝邑之閒先君有所助執紼矣紼輓索也禮送葬必執紼若其不閒雖士大夫有所不獲數矣不得如先王禮數大國之惠亦慶其加而不討其乏明底其情取備而已以爲禮也慶善也底致也加謂君自會葬禮數有加者乏謂不及士弔大夫葬之數者但能致其情而儀文祗取略備靈王之喪在襄二十九年我先君簡公在楚我先大夫印段實往敝邑之少卿也王吏不討恤所無也今大夫曰女盍從舊舊有豐有省不知所從從其豐則寡君幼弱是以不共從其省則吉在此矣唯大夫圖之晉人不能詰傳言大叔之敏冬十有二月吳滅徐徐子章羽奔楚羽公羊作禹左傳吳子使徐人執掩餘使鍾吾人執燭庸二十七年奔故二公子奔楚楚子大封而定其徙使監馬尹大心逆吳公子使居養養杜注卽所封之邑今河南沈丘縣東有養城莠尹然左司馬沈尹戌城之城養取于城父與胡田以與之胡田杜注故胡子之地將以害吳也子西諫曰吳光新得國而親其民視民如子辛苦同之將用之也若好吳邊疆使柔服焉猶懼其至吾又强其讎以重怒之無乃不可乎吳周之胄裔也而棄在海濱不與姬通今而始大比于諸華光又甚文將自同于先王不知天將以爲虐乎使翦喪吳國而封大異姓乎其抑亦將卒以祚吳乎其終不遠矣言其事行可知不久我盍姑億吾鬼神而寧吾族姓以待其歸將焉用自播揚焉億安也歸善惡之歸播揚猶勞動也王弗聽吳子怒冬十二月吳子執鍾吾子遂伐徐防山以水之防壅山水以灌徐己卯滅徐徐子章禹斷其髮攜其夫人以逆吳子斷髮自刑示懼吳子唁而送之使其邇臣從之遂奔楚楚沈尹戌帥師救徐弗及遂城夷夷城父使徐子處之諸侯見滅出奔衆矣如滅譚滅弦滅溫皆不名者彊暴加於小弱力不能勝而奔義未絕也章羽斷其髮以逆吳子則旣降矣降而後奔豈有興復之志哉故名之以著其位之旣絕也附錄左傳吳子問于伍員曰初而言伐楚在二十年余知其可也而恐其使余往也又惡人之有余之功也今余將自有之矣伐楚何如對曰楚執政衆而乖莫適任患若爲三師以肄焉肄勞也一師至彼必皆出彼出則歸彼歸則出楚必道敝亟肄以罷之多方以誤之旣罷而後以三軍繼之必大克之闔廬從之楚于是乎始病爲定四年吳入郢傳三十有一年春王正月公在乾侯左傳三十一年春王正月公在乾侯言不能外内也外内不容所以久在乾侯季孫意如㑹晉荀躒于適歴躒公羊穀梁作櫟適歴杜注晉地左傳晉侯將以師納公范獻子曰若召季孫而不來則信不臣矣然後伐之若何晉人召季孫獻子使私焉曰子必來我受其無咎季孫意如㑹晉荀躒于適歷荀躒曰寡君使躒謂吾子何故出君有君不事周有常刑子其圖之季孫練冠麻衣跣行示憂慼伏而對曰事君臣之所不得也敢逃刑命言願事君君不肯還不敢辟罪君若以臣爲有罪請囚于費以待君之察也亦唯君若以先臣之故不絕季氏而賜之死若弗殺弗亡君之惠也死且不朽若得從君而歸則固臣之願也敢有異心意如出君晉不致討而使荀躒㑹之悖亦甚矣夫晉之六卿猶意如也取貨季氏互爲脣齒而肯背賂以傷其類哉晉侯蔽而不察卒致昭公客死亦從自及也書曰意如㑹晉荀躒于適歴罪晉之辭也夏四月丁巳薛伯穀卒左傳薛伯穀卒同盟故書入春秋來薛始書名故傳發之晉侯使荀躒唁公于乾侯左傳夏四月季孫從知伯如乾侯知伯荀躒子家子曰君與之歸一慙之不忍而終身慙乎公曰諾衆曰在一言矣君必逐之言晉旣憂君君一言使晉晉必逐之荀躒以晉侯之命唁公且曰寡君使躒以君命討于意如意如不敢逃死君其入也公曰君惠顧先君之好施及亡人將使歸糞除宗祧以事君則不能見夫人已所能見夫人者有如河夫人謂季孫荀躒掩耳而走曰怪公所言示不忍聽寡君其罪之恐敢與知魯國之難臣請復于寡君退而謂季孫君怒未怠子姑歸祭歸攝君事子家子曰君以一乗入于魯師季孫必與君歸公欲從之衆從者脅公不得歸傳言君弱不能自主穀梁傳唁公不得入于魯也曰旣爲君言之矣不可者意如也在晉地故不言來荀躒旣㑹意如而復以晉侯之命唁公者適歴之㑹意如願從君歸蓋恃范鞅受其無咎而姑爲欺人之語荀躒隂喻其意故陽以空言勸公入以塞責及得公不能見夫人語遂藉以爲辭而意如之謀遂矣晉定公初立有嗣霸之志觀成周之城召陵之㑹則欲以師納公未嘗不出於誠而荀范表裏爲奸多方以把持之卒不得伸其志其所由來者漸矣秋葬薛獻公附錄左傳秋吳人侵楚伐夷侵潛六夷潛六杜注皆楚邑夷在今亳州故潛城六城俱在今壽州俱屬江南楚沈尹戌帥師救潛吳師還楚師遷潛于南岡而還吳師圍弦左司馬戍卽沈尹戌右司馬稽帥師救弦及豫章吳師還始用子胥之謀也謀在前年冬黑肱以濫來奔肱公羊作弓濫杜注東海昌慮縣今昌慮故城在山東滕縣東南左傳冬邾黑肱以濫來奔賤而書名重地故也黒肱非命卿故曰賤君子曰名之不可不愼也如是夫有所有名而不如其已有所謂有地也言雖有名不如無名已止也以地叛雖賤必書地以名其人終爲不義弗可滅已是故君子動則思禮行則思義不爲利回不爲義疚或求名而不得或欲蓋而名章懲不義也齊豹爲衞司寇守嗣大夫作而不義其書爲盗此求名而不得也二十年豹殺衞侯兄欲求不畏强禦之名邾庶其莒牟夷邾黑肱以土地出求食而已不求其名賤而必書所謂欲蓋而名章也庶其奔在襄二十一年牟夷奔在五年此二物者所以懲肆而去貪也齊豹書盗懲肆也三叛人書名去貪也若艱難其身身爲艱難以險危大人大人在位者而有名章徹謂得勇名攻難之士將奔走之攻猶作也奔走猶赴趣也若竊邑叛君以徼大利而無名謂不書其人名貪冒之民將寘力焉盡力爲之無所顧憚是以春秋書齊豹曰盜三叛人名以懲不義數惡無禮其善志也數列也惡逆無禮皆數列而不遺記事之善者也故曰春秋之稱微而顯文微而義著婉而辨辭婉而旨别上之人能使昭明上之人謂在位者在位者能行其法非賤人所能善人勸焉淫人懼焉是以君子貴之公羊傳文何以無邾婁通濫也此邾婁黒􅝟也春秋之文何以無邾婁蓋欲通濫爲國故使之無所繫也曷爲通濫賢者子孫宜有地也賢者孰謂謂叔術也叔術邾婁顔公之弟或曰羣公子何賢乎叔術讓國也其讓國奈何當邾婁顔之時顔顔公也邾婁女有爲魯夫人者則未知其爲武公與懿公與武懿魯二公孝公幼顔淫九公子于宮中因以納賊則未知其爲魯公子與邾婁公子與臧氏之母養公者也君幼則宜有養者大夫之妾士之妻則未知臧氏之母者曷爲者也養公者必以其子入養不離人母子因以娛公也臧氏之母聞有賊以其子易公抱公以逃賊至湊公寢而弑之直抵公所寢之處而弑之臣有鮑廣父與梁買子者二子皆魯大夫聞有賊趨而至臧氏之母曰公不死也在是吾以吾子易公矣于是負孝公之周愬天子天子爲之誅顔而立叔術反孝公于魯顔夫人者顔公之夫人嫗盈女也國色也其言曰有能爲我殺殺顔者吾爲其妻殺顔公者鮑廣父梁買子也叔術爲之殺殺顔者而以爲妻有子焉謂之盰夏父者其所爲有于顔者也爲顔公夫人時所生也盰幼而皆愛之叔術嫗盈女皆愛之食必坐二子于其側而食之有珍怪之食盱必先取足焉夏父曰以來人未足而盱有餘以來猶曰以是物來置我前也人夏父自謂言我尚未足而盱所得獨多叔術覺焉覺悟也知少時爭食長必爭國曰嘻此誠爾國也夫起而致國于夏父夏父受而中分之叔術曰不可三分之叔術曰不可四分之叔術曰不可五分之然後受之公扈子者邾婁之父兄也當夫子作春秋時于邾婁君爲父兄之行公扈者氏也習乎邾婁之故其言曰惡有言人之國賢若此者乎誅顔之時天子死叔術起而致國于夏父當此之時邾婁人常被兵于周曰何故死吾天子當讓國時邾婁曽受討罪之兵于周曰何故敢以天子爲死違生時命而立夏父乎此天子死則讓初無妻嫂惑皃爭食之驗也通濫則文何以無邾婁天下未有濫也旣通濫爲國則宜特以國見何以文無邾婁蓋以天下實未有濫國春秋新通之耳天下未有濫則其言以濫來奔何叔術者賢大夫也絕之則爲叔術不欲絕不絕則世大夫也大夫之義不得世此解不言濫黒弓意故于是推而通之也就竊邑以出之文推而變通之其文皆同而但無邾婁則旣可以全叔術之心亦可以無世大夫之嫌矣穀梁傳其不言邾黑肱何也據襄二十一年邾庶其以漆閭丘來奔言邾别乎邾也邾以濫邑封黑肱故别之若國其不言濫子何也據旣别之爲國則應書其爵非天子所封也來奔内不言叛也凡竊邑以出者雖賤必書其名懲不義也昭公在外孰受之受之者意如也不令之臣以類相從邾快黑肱接踵而至意如實爲之招也不言邾史闕文十有二月辛亥朔日有食之左傳十二月辛亥朔日有食之是夜也趙簡子夢童子臝而轉以歌臝臝體也轉宛轉也旦占諸史墨曰吾夢如是今而日食何也簡子之夢適與日食㑹疑咎在己故問之對曰六年及此月也吳其入郢乎終亦弗克史墨知夢非日食之應故釋日食之咎而不釋夢入郢必以庚辰庚日有變日在辰尾故曰以庚辰定四年十一月庚辰吳入郢日月在辰尾辰尾龍尾也周十二月今之十月日月合朔于辰尾而食庚午之日日始有謫火勝金故弗克謫變氣也庚午十月十九日去辛亥朔四十一日雖食在辛亥更以始變爲占也午南方楚之位也午火庚金也日以庚午有變故災在楚楚之仇敵惟吳故知入郢必吳火勝金者金爲火妃夫妻相得而强楚盛之兆故終不克食在辛亥亥水也水數六故六年三十有二年春王正月公在乾侯左傳三十二年春王正月公在乾侯言不能外内又不能用其人也其人謂子家羈三年之閒歲首皆書公在乾侯其義一也而左氏各爲之説鑿矣取闞公羊傳闞者何邾婁之邑也曷爲不繫乎邾婁諱亟也去年受濫今復取闞故以爲亟闞魯羣公墓之所在蓋内邑也公旅寄乾侯非有兵力特以先君墳墓在焉遣人誘而取之書此以著季氏據國公無尺土雖得魯邑猶取之於外云爾夏吳伐越左傳夏吳伐越始用師于越也史墨曰不及四十年越其有吳乎存亡之數不過三紀歲星三周三十六歲故曰不及四十年哀二十二年越滅吳去此三十八歲越得歲而吳伐之必受其凶此年歲在星紀星紀吳越之分也歲星所在其國有福吳先用兵故反受其殃此著吳越之始事也吳方抗楚越議其後自是吳楚越不相爲下而齊晉二大國之患專在彊臣天下之勢又一變矣秋七月冬仲孫何忌會晉韓不信齊高張宋仲幾衞世叔申鄭國參曹人莒人薛人杞人小邾人城成周世叔穀梁作大叔莒人下公羊有邾婁人穀梁有邾人左傳秋八月王使富辛與石張如晉請城成周富辛石張周大夫敬王徙都成周以其狹小故請城之天子曰天降禍于周俾我兄弟竝有亂心以爲伯父憂我一二親昵甥舅不皇啓處于今十年謂二十三年二師圍郊至于今勤戍五年謂二十八年晉籍秦致諸侯之戍至于今余一人無日忘之閔閔焉如農夫之望歲懼以待時閔閔憂貌伯父若肆大惠復二文之業弛周室之憂二文謂文侯仇文公重耳弛解也徼文武之福以固盟主宣昭令名則余一人有大願矣昔成王合諸侯城成周以爲東都崇文德焉今我欲徼福假靈于成王修成周之城俾戍人無勤諸侯用寧蝥賊遠屏蝥賊喻災害晉之力也其委諸伯父使伯父實重圖之俾我一人無徵怨于百姓而伯父有榮施先王庸之庸功也先王之靈以爲大功范獻子謂魏獻子曰與其戍周不如城之天子實云雖有後事晉勿與知可也從王命以紓諸侯晉國無憂是之不務而又焉從事魏獻子曰善使伯音對曰伯音韓不信天子有命敢不奉承以奔告于諸侯遲速衰序衰序差次也于是焉在在周所命冬十一月晉魏舒韓不信如京師合諸侯之大夫于狄泉尋盟尋平丘盟且令城成周魏子南面居君位衞彪傒曰彪傒衞大夫魏子必有大咎干位以令大事非其任也詩曰敬天之怒不敢戲豫敬天之渝不敢馳驅詩大雅戒王者當敬畏天之譴怒不可游戲逸豫馳驅自恣渝變也况敢干位以作大事乎己丑士彌牟營成周計丈數計所當城之丈數揣高卑度高曰揣度厚薄仞溝洫度深曰仞物土方議遠邇物相也相取土之方面遠近之宜量事期知事幾時畢計徒庸知用幾人功慮材用知費幾財用書餱糧知用幾糧食以令役于諸侯屬役賦丈賦所當城丈尺書以授帥帥諸侯之大夫而效諸劉子韓簡子臨之以爲成命效致也劉子王卿士簡子韓起孫不信也臨履其事以命諸侯經所以不書魏舒穀梁傳天子微諸侯不享覲天子之在者唯祭與號祭謂郊禘號謂稱王故諸侯之大夫相帥以城之此變之正也不曰城京師而曰城成周紀實也王城自平王東遷以來天子世世居之其城完固敬王避子朝之黨居於成周遂定都焉以其狹小不足以容衆又舊爲遷殷頑民之地其城圯惡故擴而新之諸侯大夫承王命往城禮之所宜故其詞平無所予亦無貶焉十有二月己未公薨于乾侯左傳十二月公疾徧賜大夫從公者大夫不受賜子家子雙琥一環一璧輕服琥玉器刻爲虎形輕服細好之服受之大夫皆受其賜己未公薨子家子反賜于府人曰吾不敢逆君命也大夫皆反其賜書曰公薨于乾侯言失其所也趙簡子問于史墨曰季氏出其君而民服焉諸侯與之君死于外而莫之或罪也對曰物生有兩有三有五有陪貳故天有三辰謂有三地有五行謂有五體有左右謂有兩各有妃耦謂陪貳王有公諸侯有卿皆有貳也天生季氏以貳魯侯爲日久矣民之服焉不亦宜乎魯君世從其失季氏世修其勤民忘君矣雖死于外其誰矜之社稷無常奉君臣無常位自古以然故詩曰高岸爲谷深谷爲陵詩小雅言高下有變易三后之姓于今爲庶主所知也三后虞夏商在易卦雷乗乾曰大壯乾下震上大壯震在乾上故曰雷乗乾天之道也乾爲天子震爲諸侯而在乾上君臣易位臣大强壯若天上有雷昔成季友桓之季也文姜之愛子也始震而卜卜人謁之曰生有嘉聞其名曰友爲公室輔及生如卜人之言有文在其手曰友遂以名之旣而有大功于魯立僖公受費以爲上卿至于文子武子文子行父武子宿世増其業不廢舊績魯文公薨而東門遂殺適立庶魯君于是乎失國失國權政在季氏于此君也四公矣民不知君何以得國是以爲君愼器與名不可以假人器車服名爵號昭公八年於外以齊晉大夫與意如聲勢相倚迭爲輔車故卒不能入史墨之言謂魯民忘君而君臣無常位以此儆君善矣然率天下之彊臣而爲簒奪之謀未必非此言啓之且愼器與名此可以責魯之先君而非所以責昭公也觀春秋始終書法皆以示尊君之義而罪臣子譏諸侯胡氏安國徒以不能復國爲公咎過矣日講春秋解義卷五十六
