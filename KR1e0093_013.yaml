body:
  text: 欽定四庫全書日講春秋解義卷十三莊公二十有七年春公㑹杞伯姬于洮伯姬莊公女洮杜注魯地今山東濮州南有洮城亦作桃城水經注云桃城亦曰姚城因姚墟而得名也左傳二十七年春公㑹杞伯姬于洮非事也天子非展義不廵守天子廵守所以宣布德義諸侯非民事不舉卿非君命不越竟婦人無㑹禮内女爲夫人者七見於經未有與公㑹者而㑹自伯姬始其後來朝其子來求婦皆禮所未有也而魯政之不綱亦可見矣夏六月公㑹齊侯宋公陳侯鄭伯同盟于幽左傳夏同盟于幽陳鄭服也二十二年陳亂而齊納敬仲二十五年鄭文公獲成于楚皆有貳心于齊今始服也穀梁傳同者有同也同尊周也于是而後授之諸侯也其授之諸侯何也齊侯得衆也桓㑹不致安之也桓盟不日信之也信其信仁其仁衣裳之㑹十有一未嘗有歃血之盟也信厚也兵車之㑹四未嘗有大戰也愛民也十六年于幽之盟鄭人附楚而侵宋魯人棄信而受逃是諸侯猶未能深信桓公之心也至是霸勢愈盛陳鄭協服魯亦與㑹故載書復要言曰同諸國蓋自是無離逷矣而衞人不至故明年復有伐衛之師秋公子友如陳葬原仲左傳秋公子友如陳葬原仲非禮也原氏仲字原仲季友之舊也公羊傳原仲者何陳大夫也大夫不書葬此何以書通乎季子之私行也通表而出之之義私行不以公事行也何通乎季子之私行辟内難也君子辟内難而不辟外難禮記曰門内之治恩掩義門外之治義掩恩内難者何公子慶父公子牙公子友皆莊公之母弟也公子慶父公子牙通乎夫人以脅公季子起而治之則不得與于國政坐而視之則親親因不忍見也故于是復請至于陳而葬原仲也穀梁傳言葬不言卒不葬者也不葬者不合書葬也不葬而曰葬諱出奔也言季友辟内難而出以葬原仲爲辭人臣之義無私交大夫非君命不越境葬原仲季友之私也而書如陳從出聘之文是有公命也季友之請爲越禮莊公之從之爲失政直書其事而義自見矣何以知其爲季友之私也凡以公事行而因及其私者經皆不言其事直書如某國而已冬杞伯姬來左傳冬杞伯姬來歸寧也凡諸侯之女歸寧曰來出曰來歸夫人歸寧曰如某出曰歸于某公羊傳其言來何直來曰來直來無事而來也大歸曰來歸大歸廢棄來歸也歸寧常事不書此何以書數也禮父母在歲一歸寧春㑹而冬復至越禮可知矣或曰哀姜方挾勢而驕恣伯姬庶女素不以禮待故不敢遽歸先與父㑹使歸與姜氏成言而後至魯也不然豈有歸寧父母不徑返國都而待於下邑父往㑹之者哉附錄左傳晉侯將伐虢士蔿曰不可虢公驕若驟得勝于我必棄其民無衆而後伐之欲禦我誰與夫禮樂慈愛戰所畜也夫民讓事樂和愛親哀喪而後可用也讓事禮也樂和樂也愛親慈也哀喪愛也有此四者然後可用以戰虢弗畜也亟戰將饑言虢不畜義讓而力戰棄民不養故云將饑莒慶來逆叔姬公羊傳莒慶者何莒大夫也莒無大夫此何以書譏何譏爾大夫越竟逆女非禮也穀梁傳諸侯之嫁子于大夫主大夫以與之主大夫謂使大夫同姓者主之來者接内也接内謂公自主之不正其接内故不與夫婦之稱也夫婦之稱當言逆女諸侯嫁女於大夫命大夫主之君不敵臣也二百四十年魯君嫁女于大夫者多矣而見於經者惟莒慶及齊高固以公自主之故以爲非常而志之也大夫爲君逆則稱女自逆則稱字而不書歸蓋尊卑之别杞伯來朝致伯姬也杞伯不能制其内縱伯姬之數出又來朝而致之其卑弱可知矣附錄左傳王使召伯廖賜齊侯命召伯廖王卿士賜命爲侯伯且請伐衛以其立子頹也立子頽在十九年公㑹齊侯于城濮城濮杜注衞地傳稱王賜齊侯命且請伐衞以情事推之子頹伏誅己十年衞君又易世矣齊桓特以衞不㑹幽之盟申明其立子頹之罪而請討於王耳與公㑹於衞地而伐衞之師魯不與焉亦猶㑹於魯濟以謀伐戎而魯不與伐耳二十有八年春王三月甲寅齊人伐衞衞人及齊人戰衛人敗績左傳二十八年春齊侯伐衛戰敗衞師數之以王命取賂而還公羊傳伐不日此何以日至之日也戰不言伐此其言伐何至之日也春秋伐者爲客伐人者爲客伐者爲主見伐者爲主故使衞主之也及者爲主曷爲使衞主之衞未有罪爾蓋爲幽之㑹服父䘮未終而不至故敗者稱師衛何以不稱師未得乎師也未得成列爲師也穀梁傳于伐與戰安戰也戰衞戰則是師也其曰人何也微之也何爲微之也今授之諸侯而後有侵伐之事故微之也其人衞何也以其人齊不可不人衞也衞小齊大其以衞及之何也以其微之可以言及也其稱人以敗何也不以師敗于人也戰不言伐伐不言日而書日者戰之日也見齊人奉辭伐罪方以是日至而衞不請其故卽以是日與之戰其勁忿而不知自反具見矣凡書及者爲其志乎戰也衞人之急戰若此則宜書衛及非襃貶之所繫也是非則存乎其事矣敗必稱師而衞不稱師何也齊甫至而遂戰未得集衆而成軍耳附錄左傳晉獻公娶于賈無子烝于齊姜齊姜武公妾生秦穆夫人及大子申生又娶二女于戎大戎狐姬生重耳大戎杜注唐叔子孫别在戎狄者當在今陜西延安府境小戎子生夷吾小戎杜注允姓之戎孔氏安國曰此卽瓜州之允姓戎也故瓜州在今陜西肅州西子女也晉伐驪戎驪戎男女以驪姬驪戎杜注在京兆新豐縣今陜西臨潼縣東有驪戎城其君姬姓其爵男也納女于人曰女歸生奚齊其娣生卓子驪姬嬖欲立其子賂外嬖梁五與東關嬖五姓梁名五在閨闥之外者東關嬖五别在關塞者亦名五皆大夫爲獻公所嬖幸視聽外事使言于公曰曲沃君之宗也曲沃桓叔所封先君宗廟所在蒲與二屈君之疆也蒲杜注平陽蒲子縣今山西隰州東北有蒲子故城二屈杜注平陽北屈縣今山西吉州東北有北屈廢縣不可以無主宗邑無主則民不威疆埸無主則啓戎心戎之生心民慢其政國之患也若使太子主曲沃而重耳夷吾主蒲與屈則可以威民而懼戎且旌君伐旌章也伐功也使俱曰狄之廣莫于晉爲都晉之啓土不亦宜乎獻公未决故復使二五俱説之廣莫狄地之曠絕也卽謂蒲子北屈也言遣二公子出都之則晉方當大開土界晉侯説之夏使大子居曲沃重耳居蒲城夷吾居屈羣公子皆鄙鄙邊也唯二姬之子在絳二五卒與驪姬譖羣公子而立奚齊二五梁五東關五也晉人謂之二五耦二耜相耦廣一尺共起一伐言二人墾傷晉室夏四月丁未邾子瑣卒秋荆伐鄭公㑹齊人宋人救鄭宋人下公羊有邾婁人左傳楚令尹子元欲蠱文夫人子元文王弟文夫人文王夫人息嬀也蠱惑以滛事爲館于其宮側而振萬焉振動也萬舞也夫人聞之泣曰先君以是舞也習戎備也今令尹不尋諸仇讎而于未亡人之側不亦異乎尋用也婦人旣寡自稱未亡人御人以告子元御人夫人之侍人子元曰婦人不忘襲讎我反忘之秋子元以車六百乘伐鄭入于桔柣之門桔柣鄭逺郊之門也子元鬭御疆鬭梧耿之不比爲旆子元自與三子特建旆以居前緇廣充幅長尋曰旐繼旐曰旆鬭班王孫游王孫喜殿三子在後爲反禦衆車入自純門及逵市純門鄭外郭門也逵市郭内道上市縣門不發楚言而出子元曰鄭有人焉縣門施于内城門鄭示楚以閒暇故不閉城門出兵而效楚言故子元畏之不敢進諸侯救鄭楚師夜遁鄭人將奔桐丘桐丘杜注許昌縣東北有桐丘城今許昌故城在河南許州東北諜告曰楚幕有烏乃止諜間也幕帳也穀梁傳荆者楚也其曰荆州舉之也善救鄭也鄭服於齊故楚來爭鄭此南北盛衰之大界也桓公救鄭獨與魯宋偕以陳衞懼楚方自守而未暇及鄭耳楚在春秋時最彊大首服陳蔡繼爭鄭而耀武於王畿非齊桓有以遏之將爲周室憂故聖門羞稱五霸而春秋不沒桓文之功其道蓋竝行而不相悖也冬築郿郿公羊穀梁作微杜注魯下邑京相璠曰壽張縣西北有故微鄉魯邑也今山東東平州西有微鄉城左傳築郿非都也凡邑有宗廟先君之主曰都無曰邑邑曰築都曰城周禮四縣爲都四井爲邑然宗廟所在則雖邑曰都尊之也穀梁傳山林藪澤之利所以與民共也虞之非正也虞典禽獸之官言築邑置官司以虞之非正也凡土功大曰城小曰築故館則書築臺則書築囿則書築郿邑而書築創作邑也冬雖工築之時而下書大無麥禾則公輕用民力而時絀舉贏具見矣大無麥禾公羊傳冬旣見無麥禾矣曷爲先言築微而後書無麥禾諱以凶年造邑也穀梁傳大者有顧之辭也于無禾及無麥也顧猶待也待無禾然後追錄無麥故言大以明不收之甚也二穀不升謂之饑五穀不升爲大饑禾者穀之總名無麥禾則黍稷秫稻及二麥皆無矣曰大無者見舉國皆無也王制冢宰制國用必於歲之杪五穀備入然後制國用故無麥禾至冬然後書頻年無水旱之變而一旦大無麥禾推騐事實由魯不務蓄積日損月削以至於麥禾皆盡而後覺之非一歲之事也不書饑者大無麥禾而至於告糴則饑不待言矣臧孫辰告糴于齊左傳冬饑臧孫辰告糴于齊禮也臧孫辰魯大夫臧文仲公羊傳告糴者何請糴也買穀曰糴何以不稱使以爲臧孫辰之私行也何爲以臧孫辰之私行君子之爲國也必有三年之委一年不熟告糴譏也古者三年耕必餘一年之儲九年耕必有三年之積雖遇凶災民不饑乏莊公享國二十八年而無一年之畜危亡切近故諱使若國家不匱大夫自私行糴也穀梁傳國無三年之畜曰國非其國也一年不升登也告糴諸侯告請也糴糴也不正故舉臧孫辰以爲私行也國無九年之畜曰不足無六年之畜曰急無三年之畜曰國非其國也諸侯無粟諸侯相歸粟正也臧孫辰告糴于齊告然後與之言内之無外交也古者税什一豐年補敗敗謂凶年不外求而上下皆足也雖累凶年民弗病也一年不艾艾穫也而百姓饑君子非之不言如爲内諱也古者三年耕必有一年之食九年耕必有三年之食以三十年之通制國用雖有旱乾水溢民無菜色今魯一年不艾而百姓饑汲汲焉求救於鄰國故不書如齊告糴而曰告糴于齊所以著情急於糴以見魯政之無經也而辰猶以急病讓夷爲賢陋矣二十有九年春新延廏左傳二十九年春新作延廏書不時也凡馬日中而出日中而入日中春秋分也治廏當以秋分因馬向入而修之今以春作故曰不時公羊傳新延廏者何修舊也修舊不書此何以書譏何譏爾凶年不修穀梁傳延廏者法廏也周禮天子十二閑馬六種邦國六閑馬四種每廏一閑言法廏者六閑之舊制也其言新有故也言改故而新之有故則何爲書也古之君人者必時視民之所勤民勤于力則功築罕民勤于財則貢賦少民勤于食則百事廢矣凶荒殺禮冬築微春新延廏以其用民力爲己悉矣悉盡也凡興築言新者有故也有所增益曰作剙始曰築閑牧之設以修馬政乆而新之常事也何以書穀梁子曰古之人君必時視民之所勤民勤于力則功築罕民勤于財則貢賦少民勤于食則百事廢矣大無麥禾告糴于齊以救朝夕之急而猶興不急之役其用民力爲己悉矣故修舊不書而於此特書以示戒也或謂後世以興功築爲救荒之要政春秋乃用以爲譏何也後世力役傭於官故可因此以聚窮民古者力役徵於民而於凶年舉之則民不堪命矣延延綿也牧馬欲其滋息故謂之延猶庫藏欲其有餘而謂之長府也夏鄭人侵許左傳夏鄭人侵許凡師有鐘鼓曰伐無曰侵輕曰襲掩其不備許鄭世讎也許自盟幽之後不與齊桓之㑹鄭人侵之或亦齊之命與秋有蜚左傳秋有蜚爲災也凡物不爲災不書公羊傳何以書記異也穀梁傳一有一亡曰有有者昔之所無故書之以記異也劉向曰蜚色靑南越盛暑男女同川滛氣所生爲蟲臭惡非中國所有或曰卽負蠜好以淸旦食稻花或曰山海經以蜚爲獸若牛而白首一目虬尾未知孰是姑存之以備參考冬十有二月紀叔姬卒娣之卒不書叔姬執節守義婦德可儀故魯人賢而錄之孔子不削也城諸及防諸防杜注皆魯邑諸在今山東諸城縣縣又有故防城左傳冬十二月城諸及防書時也凡土功龍見而畢務戒事也周十一月今九月龍星角亢晨見東方三務始畢戒民以土功事火見而致用大火心星十月之初心星次角亢之後而晨見東方致用謂致築作之物也水昏正而栽北方之宿爲水星營室謂之定水昏正謂十月之中定星昏而正中栽樹也謂樹版幹而興作日至而畢日南至微陽始動故土功畢穀梁傳可城也凡城之志皆譏今云可者謂冬可用城不妨農役耳不謂作城無譏也以大及小也諸大防小凡土功得其時亦書重勞民也及者先後之辭附錄左傳樊皮叛王樊皮周大夫樊其采地皮名三十年春王正月附錄左傳三十年春王命虢公討樊皮夏四月丙辰虢公入樊執樊仲皮歸于京師夏師次于成左氏無師字穀梁傳次止也有畏也欲救鄣而不能也不言公恥不能救鄣也穀梁以爲欲救鄣而不能然紀魯姻親紀之亡魯次成而不敢救理或有之紀亡乆矣鄣乃紀之附庸魯明知力不能救何故出師虛爲德於鄣而閒齊好觀前此之㑹城濮明年之獻戎捷則次成之師乃欲㑹齊圍鄣待命於成聞鄣已降而不復行耳附錄左傳楚公子元歸自伐鄭而處王宮欲遂蠱丈夫人鬭射師諫射師鬭廉也則執而梏之梏刑具在手曰梏秋申公鬭班殺子元申楚縣楚僭號縣尹皆稱公鬬班若敖之孫鬭穀於菟爲令尹鬬穀於菟令尹子文也鬬伯比之子自毁其家以紓楚國之難秋七月齊人降鄣鄣杜注紀附庸國東平無監縣東北有鄣城今山東東平州東有鄣城集卽鄣故城也公羊傳鄣者何紀之遺邑也降之者何取之也取之則曷爲不言取之爲桓公諱也外取邑不書此何以書盡也言紀邑至此而盡穀梁傳降猶下也鄣紀之遺邑也不書鄣降于齊而曰齊人降鄣者小國孤危不能自固齊以兵威脅使降附專罪齊也鄣乃紀之附庸紀猶折而入齊鄣豈能與齊抗乎是以於鄣無責焉齊桓假德禮以屬大國諸侯而數併吞小國以自封殖故荀卿惡其以讓飾爭依乎仁而蹈利也八月癸亥葬紀叔姬公羊傳外夫人不書葬此何以書隱之也何隱爾其國亡矣徒葬乎叔爾謂國亡不得與夫合葬故言徒徒空也穀梁傳不日卒而日葬閔紀之亡也滅國之君不書葬况媵乎蓋魯君憫紀之亡高叔姬之義爲服姑姊妹之服而使人㑹其葬故舊史書之孔子存而不削以明彰萬世之女教先儒所謂以賢得書者也九月庚午朔日有食之鼓用牲于社冬公及齊侯遇于魯濟魯濟杜注蓋魯地濟水歴齊魯界在齊界爲齊濟在魯界爲魯濟左傳冬遇于魯濟謀山戎也以其病燕故也燕杜注薊縣今屬順天府穀梁傳及者内爲志焉爾遇者志相得也據左氏謀伐山戎也齊桓伐郳伐鄭伐徐皆以宋主兵與公㑹城濮而後伐衛與公㑹魯濟而後伐戎不自恃其智力而集人之功以爲功此霸業之所以獨盛與齊人伐山戎公羊傳此齊侯也其稱人何貶曷爲貶子司馬子曰蓋以操之爲己蹙矣此蓋戰也何以不言戰春秋敵者言戰桓公之與戎狄驅之爾穀梁傳齊人者齊侯也其曰人何也愛齊侯乎山戎也不以齊侯敵乎山戎故稱人其愛之何也桓内無因國因國因縁山戎左右之國爲内閒者外無從諸侯而越千里之險北伐山戎危之也則非之乎善之也何善乎爾燕周之分子也燕周太保召康公之後與周同姓分子謂周之别子孫也貢職不至山戎爲之伐矣言由山戎爲害伐擊燕使之隔絕于周室齊人伐山戎穀梁以爲善公羊及胡氏以爲譏皆謂齊侯親伐其實非也以僖十年書齊侯許男伐北戎觀之則伐山戎齊侯不親也果齊侯也則事同而稱人稱爵前後互異義安處與三十有一年春築臺于郎公羊傳何以書譏何譏爾臨民之所潄浣也臺近于泉卽泉臺也未成爲郎臺旣成爲泉臺禮内則冠帶垢請潄衣裳垢請澣澣卽浣也左氏傳曰公旣視朔遂登觀臺以望而書雲物爲備故也楚語曰臺高不過望國氛大不過容宴豆瘠磽之地於是乎爲之魯之先公候時占物之臺必有定所不緣占候而去國築臺於逺是爲逰觀之所厲民以自樂也一之爲甚而至於三壞法亂紀亦甚矣夏四月薛伯卒隱十年薛來朝稱侯今稱伯時王所黜也諸傳皆無文杜氏於滕紀降爵皆曰時王所黜獨此無注故或以爲齊桓所黜非也非天子之命春秋當以王爵正之矣築臺于薛薛杜注魯地今山東滕縣東南有薛城公羊傳何以書譏何譏爾遠也六月齊侯來獻戎捷左傳三十一年夏六月齊侯來獻戎捷非禮也凡諸侯有四夷之功則獻于王王以警于夷中國則否諸侯不相遺俘公羊傳齊大國也曷爲親來獻戎捷威我也其威我奈何旗獲而過我也言懸所獲于旗以過魯穀梁傳齊侯來獻捷者内齊侯也不言使内與同不言使也謂内齊侯若同一國故不稱使獻戎捷軍得曰捷戎菽也菽今之胡豆也按管子云出戎菽冬葱布之天下則以戎爲豆也捷者戰勝之所俘獲也獻者下奉上之辭也諸侯自相遺俘非禮矣二傳據此謂齊侯親伐山戎稱人爲貶不知山戎在齊北魯在齊南伐戎而歸道不經魯蓋齊魯鄰封偶來㑹公因獻戎捷與魯濟之㑹等耳伐戎則大夫帥師故稱人獻捷則齊侯親之故書爵皆據其事之實耳獻捷不足爲親伐之徵也秋築臺于秦秦杜注東平范縣西北有秦亭在今山東范縣南公羊傳何以書譏何譏爾臨國也社稷宗廟朝廷皆爲國明皆不當臨也穀梁傳不正罷民三時不正猶不與也虞山林藪澤之利且財盡則怨力盡則懟懟恚恨也君子危之故謹而志之也或曰倚諸桓也桓外無諸侯之變内無國事越千里之險北伐山戎爲燕辟地魯外無諸侯之變内無國事一年罷民三時虞山林藪澤之利惡内也冬不雨公羊傳何以書記異也冬不雨不害禾稼而亦書者見聖人燮理陰陽對時育物以順天心之切也僖文之不雨或歴三時或歴四時此年止一時不雨耳二百四十年間一時不雨者豈止一年而此特書以莊公災歉之後亟興土功昧於敬天勤民之義也三十有二年春城小穀小穀范氏寗曰魯地泰山孫氏曰曲阜西北有小穀城左傳三十二年春城小穀爲管仲也杜注小穀齊邑濟北穀城縣城中有管仲井大都以名通者則不繫國公感齊桓之德故爲管仲城私邑小穀魯邑也左氏謂爲管仲城杜預以楚丘下陽不繫國例之説亦可通但經所書夫人㑹穀公以楚師伐齊取穀晉士匄侵齊至穀傳所稱寘桓公子雍于穀使申叔去穀齊師違穀七里未有言小穀者則此爲魯邑明矣夏宋公齊侯遇于梁丘梁丘杜注高平昌邑縣西南今山東城武縣東北有梁丘山山南有梁丘城左傳齊侯爲楚伐鄭之故請㑹于諸侯楚伐鄭在二十八年謀爲鄭報楚宋公請先見于齊侯夏遇于梁丘穀梁傳遇者志相得也梁丘在曹邾之閒去齊八百里非不能從諸侯而往也辭所遇遇所不遇大齊桓也辭所遇謂八百里閒諸侯必有願從者而不與之遇遇所不遇謂遠遇宋公也齊桓公時諸侯彊大者莫如晉宋望國莫如魯晉擁河山之固不與諸侯㑹盟非齊所能致也故於魯宋未服懾之以威旣合懷之以德下之以禮遇濟則遠至魯境獻捷則親至魯庭旣爲宋出師而再推以主兵復遠遇於宋地而推以主㑹所以服魯宋之心使爲諸侯倡而成其霸事也附錄左傳秋七月有神降于莘有聲以接人莘杜注虢地惠王問諸内史過曰内史過周大夫是何故也對曰國之將興明神降之監其德也將亡神又降之觀其惡也故有得神以興亦有以亡虞夏商周皆有之王曰若之何對曰以其物享焉其至之日亦其物也其至之日謂此神初降之日若以甲乙之日至則祭先脾玉用蒼服上靑也以此類祭之王從之内史過往聞虢請命聞請于神求賜虢土田之命反曰虢必亡矣虐而聽于神神居莘六月虢公使祝應宗區史嚚享焉祝大祝宗宗人史大史應區嚚皆名神賜之土田史嚚曰虢其亡乎吾聞之國將興聽于民將亡聽于神神聰明正直而壹者也依人而行唯德是與虢多涼德其何土之能得爲僖二年晉滅下陽傳秋七月癸巳公子牙卒左傳初公築臺臨黨氏黨氏魯大夫築臺不書不告廟見孟任孟任黨氏女從之閟閟不從公而以夫人言許之許以爲夫人割臂盟公生子般焉雩講于梁氏講肄也梁氏魯大夫女公子觀之女公子般妹圉人犖自牆外與之戲圉人掌養馬者名犖子般怒使鞭之公曰不如殺之是不可鞭犖有力焉能投蓋于稷門蓋覆也稷門魯南城門走而自投接其屋之桷反覆門上公疾問後于叔牙牙慶父同母弟僖叔對曰慶父材蓋欲進其同母兄問于季友對曰臣以死奉般公曰鄉者牙曰慶父材成季使以君命命僖叔待于鍼巫氏成季季友也僖叔牙之諡鍼巫氏魯大夫使鍼季酖之酖鳥名其羽有毒以畫酒飲之則死曰飲此則有後于魯國不然死且無後飲之歸及逵泉而卒逵泉杜注魯地今山東曲阜縣南逵泉是也立叔孫氏不以罪誅故得立後世其祿公羊傳何以不稱弟殺也殺則曷爲不言刺爲季子諱殺也曷爲爲季子諱殺季子之遏惡也不以爲國獄言不顯爲刑戮緣季子之心而爲之諱季子之遏惡奈何莊公病將死以病召季子召之于陳季子至而授之以國政曰寡人卽不起此病吾將焉致乎魯國致與也季子曰般也存君何憂焉公曰庸得若是乎牙謂我曰魯一生一及君已知之矣子繼父曰生弟繼兄曰及慶父也存此莊公之辭也謂牙欲立慶父季子曰夫何敢是將爲亂乎夫何敢俄而牙弑械成時牙實欲弑君兵械已成但事未行耳季子和藥而飲之曰公子從吾言而飲此則必可以無爲天下戮笑必有後乎魯國不從吾言而不飲此則必爲天下戮笑必無後乎魯國于是從其言而飲之飲之無傫氏無傫氏蓋大夫家或云地名至乎王堤而死王堤地名公子牙今將爾今將言欲弑辭曷爲與親弑者同親躬親也君親無將將而誅焉然則善之與曰然殺世子母弟直稱君者甚之也季子殺母兄何善爾誅不得辟兄君臣之義也然則曷爲不直誅而酖之行誅乎兄隱而逃之使託若以疾死然親親之道也左氏公羊皆謂牙之死季友實誅之陸淳謂季子恩義俱立變而得中夫子書其自卒以示無譏先儒皆據此爲義按經所書前此則公子友如陳葬原仲後此則季子來歸似莊閔終始之際季友實不在魯姑發其疑以俟後之治經者不敢彊爲之説八月癸亥公薨于路寢左傳八月癸亥公薨于路寢子般即位次于黨氏卽䘮位次舍也公羊傳路寢者何正寢也公之正居也天子諸侯皆有三寢一曰高寢二曰路寢三曰小寢穀梁傳路寢正寢也寢疾居正寢正也男子不絕于婦人之手以齊終也齊潔也先王制禮疾必正寢欲使公卿得受顧命所以遠女子小人而杜奸邪之隙慮至深遠也魯莊在位日乆薨又得其正何以甫殁而禍亂相尋若是蓋其失在忘父仇徇母命閨闈不飭兵柄下移得免其身幸矣冬十月己未子般卒己未公羊穀梁作乙未左傳冬十月己未共仲使圉人犖賊子般于黨氏共仲慶父成季奔陳立閔公閔公莊公庶子哀姜之娣叔姜所生年甫八歳公羊傳子卒云子卒文十八年冬十月子卒傳云子卒者孰謂謂子赤是也此其稱子般卒何君存稱世子君薨稱子某旣葬稱子踰年稱公子般卒何以不書葬未踰年之君也有子則廟廟則書葬無子不廟不廟則不書葬穀梁傳子卒日正也襄三十一年秋九月癸巳子野卒是也不日故也文十八年冬十月子赤卒是也有所見則日閔公不書卽位是見繼弑者也故慶父之弑子般可以日卒不待不日而後顯未踰年曰卒未成君也未葬名之旣葬則不名或謂子般子赤被弑而書卒子野過毁亦書卒不覩傳文何以知之然閔公不書卽位則繼故可知矣赤之卒下書夫人姜氏歸于齊先君旣殁嗣子暴卒而夫人大歸則國有禍變可知與子野異矣公子慶父如齊穀梁傳此奔也其曰如何也諱莫如深深則隱深謂君弑賊奔隱痛之至茍有所見莫如深也閔公不書卽位則子般被弑慶父出奔俱可見子般之卒慶父弑也宜書出奔其曰如齊見慶父主兵日乆專行自恣國人不能制也内大夫以君命適他國例書如子般旣卒則非君命矣其如齊蓋懼討而飾辭以自解也齊桓主霸與莊公數爲㑹好齊魯壤接慶父爲賊豈得無聞乃不能執而誅之縱使復歸以成再弑有愧於方伯連帥之職矣狄伐郉狄始見於春秋而伐郉入衞兩年之間塗炭二國故齊桓剙霸之功不可沒也日講春秋解義卷十三
