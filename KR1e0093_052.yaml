body:
  text: 欽定四庫全書日講春秋解義卷五十二昭公十有四年春意如至自晉左傳十四年春意如至自晉尊晉罪己也以舍族為尊晉罪己尊晉罪己禮也禮修己而不責人穀梁傳大夫執則致致則名意如惡然而致見君臣之禮也大夫有罪則宜廢既不能廢不得不盡為君臣之恩故曰見君臣之禮邾莒之訴晉人明知罪在意如而擯公不盟雖屈於公義姑執意如而不正其罪不返邾莒邑田尋聼自歸蓋意如深結晉之彊家以厄其君利則歸己而危辱則推君其惡極矣故於至自晉特去氏以著其罪與叔孫婼之見執而歸異也附録左傳南蒯之將叛也在十二年盟費人司徒老祁慮癸僞廢疾二人南蒯家臣使請于南蒯曰臣願受盟而疾興若以君靈不死請待間而盟問差也許之二子因民之欲叛也請朝衆而盟欲因合衆以作亂遂劫南蒯曰羣臣不忘其君君謂季氏畏子以及今三年聼命矣子若弗圖費人不忍其君將不能畏子矣子何所不逞欲請送子送使出奔請期五日南蒯請期冀有變遂奔齊侍飲酒于景公公曰叛夫戲之對曰臣欲張公室也張强也子韓晳曰齊大夫家臣而欲張公室罪莫大焉言越職司徒老祁慮癸來歸費歸魯齊侯使鮑文子致之三月曹伯滕卒夏四月附録左傳夏楚子使然丹簡上國之兵于宗丘上國杜注在國都之西西方居上流故謂之上國宗丘杜注楚地當在今湖廣歸州境且撫其民分貧振窮長孤幼養老疾收介特介特單身民也收聚不使流散救災患宥孤寡赦罪戾詰姦慝舉淹滯禮新叙舊新羇旅也祿勳合親任良物官物事也凖事以任官使屈罷簡東國之兵于召陵亦如之兵在國都之東者好于邊疆息民五年而後用師禮也秋葬曹武公八月莒子去疾卒左傳秋八月莒著丘公卒郊公不戚郊公著丘公子國人弗順欲立著丘公之弟庚輿庚輿莒共公蒲餘侯惡公子意恢而善于庚輿蒲餘侯莒大夫兹夫也意恢莒羣公子郊公惡公子鐸而善于意恢鐸亦羣公子公子鐸因蒲餘侯而與之謀曰爾殺意恢我出君而納庚輿許之為下冬殺意恢傳昭公時薛杞微國無不㑹其葬者何獨於莒則不往蓋意如專國怒其嘗訴己耳或以為著丘公無諡春秋不書其葬誤矣附録左傳楚令尹子旗有德于王子旗蔓成然有佐立之德不知度與養氏比而求無厭養氏子旗之黨養由基之後王患之九月甲午楚子殺鬬成然而滅養氏之族使鬬辛居鄖以無忘舊勳辛子旗之子鄖公辛冬莒殺其公子意恢左傳冬十二月蒲餘侯兹夫殺莒公子意恢郊公奔齊公子鐸逆庚輿于齊齊隰黨公子鉏送之有賂田莒賂齊以田穀梁傳言公子而不言大夫莒無大夫也莒無大夫而曰公子意恢意恢賢也曹莒皆無大夫其所以無大夫者其義異也曹小莒夷故異意恢以國殺為文而不去其族非其罪也公子鐸首亂不見於經者韓愈謂春秋書王法不誅其人之身若此類者多矣附録左傳晉邢侯與雍子爭鄐田邢侯楚申公巫臣之子也雍子亦故楚人久而無成士景伯如楚士景伯晉理官叔魚攝理攝代景伯韓宣子命斷舊獄罪在雍子雍子納其女于叔魚叔魚蔽罪邢侯蔽斷也邢侯怒殺叔魚與雍子于朝宣子問其罪于叔向叔向曰三人同罪施生戮死可也施行罪也雍子自知其罪而賂以買直鮒也鬻獄邢侯專殺其罪一也己惡而掠美為昏貪以敗官為墨墨不潔之稱殺人不忌為賊夏書曰昏墨賊殺逸書三者皆死刑皋陶之刑也請從之乃施邢侯而尸雍子與叔魚于市仲尼曰叔向古之遺直也言叔向之直有古人遺風治國制刑不隱于親謂國之大問已所答當也至于他事則宜有隱三數叔魚之惡不為末減曰義也夫可謂直矣于義未安直則有之平丘之㑹數其賄也謂言瀆貨無厭以寬衛國晉不為暴歸魯季孫稱其詐也謂言鮒也能以寬魯國晉不為虐邢侯之獄言其貪也謂言鮒也鬻獄以正刑書晉不為頗三言而除三惡加三利三惡暴虐頗也三利寬魯衛正刑書殺親益榮猶義也夫十有五年春王正月吳子夷末卒公羊作夷昧二月癸酉有事于武宮籥入叔弓卒去樂卒事左傳十五年春將禘于武公戒百官齊戒梓慎曰禘之日其有咎乎吾見赤黑之祲非祭祥也喪氛也祲妖氛也蓋見于宗廟氛惡氣也其在涖事乎二月癸酉禘叔弓涖事籥入而卒去樂卒事禮也公羊傳其言去樂卒事何禮也君有事于廟聞大夫之喪去樂卒事大夫聞君之喪攝主而往主謂己主祭者臣聞君之喪義不可以不即行故使兄弟若宗人攝行主事而往不廢祭者古禮也大夫聞大夫之喪尸事畢而往賔尸事畢而往也穀梁傳君在祭樂之中聞大夫之喪則去樂卒事禮也祭樂者君在廟中祭作樂君在祭樂之中大夫有變以聞可乎大夫國體也君之卿佐是謂股肱故曰國體古之人重死君命無所不通死者不可復生重莫大馬是以君雖在祭樂之中大夫死以聞可也有事謂有祭事也祭主於誠慤故當祭雖大夫之喪不得以聞若有事于武宮叔弓涖事而卒則為之徹樂而卒事亦禮之可以義起者蓋緣先祖之心見大臣之卒不忍聞樂緣主祭者之心視己設之饌不忍中輟則去樂而卒事可矣弓之卒正當籥入時故舉籥入及其去之則諸樂皆徹故云去樂非獨去籥舞也夏蔡朝吳出奔鄭朝公羊作昭無出字左傳楚費無極害朝吳之在蔡也朝吳蔡大夫有功于楚平王故無極恐其有寵疾害之欲去之乃謂之曰王唯信子故處子于蔡子亦長矣而在下位辱必求之吾助子請又謂其上之人曰蔡人在上位者王唯信吳故處諸蔡二三子莫之如也而在其上不亦難乎弗圖必及于難夏蔡人逐朝吳朝吳出奔鄭王怒曰余唯信吳故置諸蔡且微吳吾不及此女何故去之無極對曰臣豈不欲吳然而前知其為人之異也吳在蔡蔡必速飛去吳所以翦其翼也以鳥喻也言吳在蔡必能使蔡速强而背楚朝吳蔡之世臣蔡之復也本謀實出於吳而至不安於宗國則逐之非蔡侯意也陳蔡世服於楚雖以欲背楚得罪者必奔楚以自訴而吳奔鄭其不容於楚可知矣蔡雖復國而國內之臣楚實制其存亡其何能國乎六月丁巳朔日有食之附録左傳六月乙丑王大子壽卒周景王子秋八月戊寅王穆后崩大子夀之母也傳為晉荀躒如周葬穆后起秋晉荀吳帥師伐鮮虞左傳晉荀吳帥師伐鮮虞圍鼓鼓杜注白狄之别巨鹿下曲陽縣有鼓聚在今直𨽻晉州西鼓人或請以城叛穆子弗許左右曰師徒不勤而可以獲城何故不為穆子曰吾聞諸叔向曰好惡不愆民知所適事無不濟或以吾城叛吾所甚惡也人以城來吾獨何好焉賞所甚惡若所好何無以復加所好若其弗賞是失信也何以庇民力能則進否則退量力而行吾不可以欲城而邇姦所喪滋多使鼓人殺叛人而繕守備圍鼓三月鼓人或請降使其民見曰猶有食色姑修而城軍吏曰獲城而弗取勤民而頓兵何以事君穆子曰吾以事君也獲一邑而教民怠將焉用邑邑以賈怠不如完舊完猶保守賈怠無卒不能善終棄舊不祥鼓人能事其君我亦能事吾君率義不爽爽差也好惡不愆城可獲而民知義所知義所在也荀吳必其能獲故因以示義有死命而無二心不亦可乎鼓人告食竭力盡而後取之克鼓而反不戮一人以鼓子䳒鞮歸䳒鞮鼓君名十二年晉伐鮮虞今又遣命卿率大衆以伐之蓋諸卿各營其私務近攻以闢土壤而荆楚之橫肆小國之摧殘絶不以介於心也冬公如晉左傳冬公如晉平丘之㑹故也謝季孫免歸十三年公如晉為意如請而意如不使公得達者恐公以情訴懼晉侯之意或移而正已之罪也今意如既釋可無他虞故聼公一朝而又止焉比事以觀則晉屢拒公皆意如主之可知矣附録左傳十二月晉荀躒如周葬穆后籍談為介既葬除喪以文伯宴樽以魯壺丈伯荀躒也魯壺魯所獻壺樽王曰伯氏諸侯皆有以鎮撫王室晉獨無有何也感魯壺而言也鎮撫王室謂貢獻之物文伯揖籍談文伯無辭揖籍談使對對曰諸侯之封也皆受明器于王室謂明德之分器以鎮撫其社稷故能薦彝器于王彝常也謂可常寶之器若魯壺之屬晉居深山戎狄之與鄰而遠于王室王靈不及拜戎不暇其何以獻器王曰叔氏而忘諸乎叔籍談字叔父唐叔成王之母弟也其反無分乎密須之鼓與其大路文所以大搜也密須杜注姞姓國也在安定隂密縣今隂密故城在陕西靈臺縣西闕鞏之甲武所以克商也闕鞏國所出鎧唐叔受之以處參虛匡有戎狄參盧實沈之次晉之分野其後襄之二路周襄王賜晉文公大路戎路鏚鉞秬鬯鏚斧也鉞金鉞彤弓虎賁文公受之以有南陽之田事在僖二十八年撫征東夏非分而何夫有勳而不廢有績而載奉之以土田撫之以彝器旌之以車服明之以文章子孫不忘所謂福也福祚之不登叔父焉在言福祚不在叔父當在誰邪且昔而高祖孫伯黶司晉之典籍以為大政故曰籍氏孫伯黶晉正卿籍談九世祖及辛有之二子董之晉于是乎有董史辛有周人其二子適晉為大史籍黶與之共董督晉典因為董氏董狐其後女司典之後也何故忘之籍談不能對賔出王曰籍父其無後乎數典而忘其祖忘祖業籍談歸以告叔向叔向曰王其不終乎吾聞之所樂必卒焉今王樂憂若卒以憂不可謂終王一嵗而有三年之喪二焉謂后崩大子卒禮父為長子三年夫為妻期必三年然後娶則亦有三年之義又天子絶期惟服三年故通謂之三年喪于是乎以喪賔宴又求彝器樂憂甚矣且非禮也彝器之來嘉功之由非由喪也三年之喪雖貴遂服禮也天子諸候除喪當在卒哭今王既葬而除故譏其不遂王雖弗遂宴樂以早亦非禮也禮王之大經也一動而失二禮無大經矣失二禮謂既不遂服又設宴樂言以考典典以志經忘經而多言舉典將焉用之為二十二年王室亂傳十有六年春附録左傳十六年春王正月公在晉晉人止公不書諱之也猶以取郠故齊侯伐徐左傳齊侯伐徐二月丙申齊師至于蒲隧蒲隧杜注徐地下邳取慮縣東有蒲如陂在今江南虹縣北徐人行成徐子及郯人莒人㑹齊侯盟于蒲隧賂以甲父之鼎甲父杜注古國名髙平昌邑縣東南有甲父亭今昌邑城在山東金鄉縣西北叔孫昭子曰諸侯之無伯害哉齊君之無道也興師而伐遠方㑹之有成而還莫之亢也無伯也夫詩曰周宗既滅靡所止戾正大夫離居莫知我肄詩小雅戾定也肄勞也言執政大夫離居異心無有念民勞者其是之謂乎傳言晉之衰此為晉伯既衰齊景公爭伯之始事也然景公不能明政教以收國衆修德禮以屬諸侯而區區於鄰近之國稱兵以逐利將以求霸不亦左乎楚子誘戎蠻子殺之戎蠻公羊作戎曼杜注河南新城縣東南有蠻城在今河南汝州西南左傳楚子聞蠻氏之亂也與蠻子之無質也質信也使然丹誘戎蠻子嘉殺之遂取蠻氏既而復立其子焉禮也公羊傳楚子何以不名據誘蔡侯名夷狄相誘君子不疾也曷為不疾若不疾乃疾之也以為固當然者乃所以為惡也楚子之誘一也而或名或不名者虔以篡弒之賊而滅先王之建國棄疾雖乘亂取國而非親為弒逆雖殺戎蠻子而復立其子其惡之小大有差也蔡侯與戎蠻子之見殺一也而或名或不名者蔡般弒父與君蠻氏亂而無質其罪之輕重有差也程子所謂時措從宜者此類是矣附録左𫝊三月晉韓起聘于鄭鄭伯享之子産戒曰苟有位于朝無有不共恪孔張後至立于客間孔張子孔之孫執政禦之執政掌位列者禦止也適客後又禦之適縣間縣樂肆客從而笑之事畢富子諌曰富子鄭大夫諫子産也夫大國之人不可不慎也幾為之笑而不陵我我皆有禮夫猶鄙我國而無禮何以求榮孔張失位吾子之恥也子産怒曰發命之不衷衷當出令之不信刑之頗類緣事類以成偏頗獄之放紛會朝之不敬使命之不聼取陵于大國罷民而無功罪及而弗知僑之恥也孔張君之昆孫子孔之後也昆兄也子孔鄭襄公兄孔張之祖父執政之嗣也子孔嘗執鄭國之政為嗣大夫承命以使周于諸侯國人所尊諸侯所知立于朝而祀于家卿得自立廟于家有祿于國有賦于軍軍出卿賦百乘喪祭有職受脤歸脤受脤謂君祭以肉賜大夫歸脤謂大夫祭歸肉于公皆社之戎祭也其祭在廟謂助君祭已有著位在位數世世守其業而忘其所僑焉得恥之辟邪之人而皆及執政是先王無刑罰也子寧以他規我宣子有環其一在鄭商玊環同工共璞自共為雙宣子謁諸鄭伯子産弗與曰非官府之守器也寡君不知子大叔子羽謂子産曰韓子亦無幾求晉國亦未可以二晉國韓子不可偷也若屬有讒人交鬬其間鬼神而助之以興其凶怒悔之何及吾子何愛于一環其以取憎于大國也盍求而與之子産曰吾非偷晉而有二心將終事之是以弗與忠信故也僑聞君子非無賄之難立而無令名之患僑聞為國非不能事大字小之難無禮以定其位之患夫大國之人令于小國而皆獲其求將何以給之一共一否為罪滋大大國之求無禮以斥之何饜之有吾且為鄙邑則失位矣不復成國若韓子奉命以使而求玊焉貪淫甚矣獨非罪乎出一玊以起二罪吾又失位韓子成貪將焉用之且吾以玊賈罪不亦鋭乎鋭細小也韓子買諸賈人既成賈矣商人曰必告君大夫韓子請諸子産曰日起請夫環執政弗義弗敢復也今買諸商人商人曰必以聞敢以為請子産對曰昔我先君桓公與商人皆出自周鄭本在周畿內桓公東遷與商人俱庸次比耦庸用也用次更相從耦耕以艾殺此地斬之蓬蒿藜藋而共處之世有盟誓以相信也曰爾無我叛我無强賈無强市其物毋或丐奪爾有利市寶賄我勿與知恃此質誓故能相保以至于今今吾子以好來辱而謂敝邑强奪商人是教敝邑背盟誓也毋乃不可乎吾子得玉而失諸侯必不為也若大國令而共無藝鄭鄙邑也亦弗為也僑若獻玉不知所成敢私布之韓子辭玉曰起不敏敢求玉以徼二罪敢辭之傳言子産知禮宣子能改過夏四月鄭六卿餞宣子于郊宣子曰二三君子請皆賦起亦以知鄭志子齹賦野有蔓草子齹子皮之子嬰齊也野有蔓草詩鄭風取其邂逅相遇適我願兮宣子曰孺子善哉吾有望矣君子相願已所望也子産賦鄭之羔裘言鄭别于唐羔裘也取其彼其之子舍命不渝邦之彥兮以美韓子宣子曰起不堪也不堪國之司直子大叔賦褰裳褰裳詩曰子惠思我褰裳涉溱子不我思豈無他人蓋思大國之勤已也宣子曰起在此敢勤子至于他人乎子大叔拜宣子曰善哉子之言是不有是事其能終乎韓起不欲令鄭求他人子大叔拜以答之所以晉鄭終善子游賦風雨子游駟帶之子駟偃也風雨詩取其既見君子云胡不夷子旗賦有女同車子旗公孫假之子豐施也有女同車取其洵美且都愛樂宣子之志子桞賦蘀兮子桞印假之子印癸也蘀兮詩取其倡子和女言宣子倡已將和從之宣子喜曰鄭其庶乎二二君子以君命貺起賦不出鄭志六詩皆鄭風故曰不出鄭志皆昵燕好也昵親也賦不出其國以示親好二三君子數世之主也可以無懼矣宣子皆獻馬焉而賦我將我將詩頌取其日靖四方我其夙夜畏天之威言志在靖亂畏懼天威子産拜使五卿皆拜曰吾子靖亂敢不拜德宣子私覲于子産以玉與馬曰子命起舍夫玉是賜我玉而免吾死也敢不藉手以拜以玉馬藉手拜謝子産夏公至自晉左傳公至自晉子服昭伯語季平子曰昭伯惠伯之子子服回也隨公從晉還晉之公室其將遂卑矣君幼弱六卿强而奢傲將因是以習習實為常能無卑乎平子曰爾幼惡識國公以去年冬如晉今夏始書至踰三時而後歸去國之久惟僖公㑹淮襄公如楚及此為皆受制於大國而不使即歸也考其時則微傳而事著矣晉人明知罪在意如而釋之明知與公無與而反止焉意如之陷公至於此極其後公謀討之亦勢不容己不幸無成而傳者及諸儒皆責公之妄舉過矣秋八月己亥晉侯夷卒左傳秋八月晉昭公卒晉自平公弛其操柄政在大夫盟宋以後㑹盟征伐楚實專之昭公嗣立僅一㑹大夫幸楚虔覆敗國有內憂未遑外事諸侯復合於平丘正可以有為之時而信義不立軍政不修邾莒雖訴侵地不反芻蕘之淫叔鮒無誅徒以盛兵示威而齊鄭已窺其釁矣且曲庇季氏重困魯侯諸侯心二不亦宜乎此雖由昭公之無志亦因世卿擅國積重而難返也九月大雩左傳九月大雩旱也附録左傳鄭大旱使屠擊祝款豎柎有事于桑山三子鄭大夫斬其木不雨子産曰有事于山藝山林也藝養護令繁殖而斬其木其罪大矣奪之官邑季孫意如如晉冬十月葬晉昭公左傳冬十月季平子如晉葬昭公平子曰子服回之言猶信自往見之乃信回言子服氏有子哉十有七年春小邾子來朝左傳十七年春小邾穆公來朝公與之燕季平子賦采叔采叔詩小雅取其君子來朝何錫與之以穆公喻君子穆公賦菁菁者莪菁菁者莪亦詩小雅取其既見君子樂且有儀以答采叔昭子曰不有以國其能久乎嘉其能答賦言其賢故能久有國魯既卑矣小國猶有朝者晉亦卑矣諸侯猶有朝者但操柄下移內政不修國終無與立耳夏六月甲戌朔日有食之左傳夏六月甲戌朔日有食之祝史請所用幣禮正陽之月日食當用幣于社故請之昭子曰日有食之天子不舉伐鼓于社諸侯用幣于社伐鼓于朝禮也平子禦之曰止也唯正月朔慝未作日有食之于是乎有伐鼓用幣禮也其餘則否大史曰在此月也正月謂建已正陽之月也于周為六月于夏為四月慝隂氣也四月純陽用事隂氣未動而侵陽災重故有伐鼓用幣之禮也平子以為六月非正月故大史答言在此月也日過分而未至過春分而未夏至三辰有災三辰日月星也日月相侵又犯是宿故三辰皆為災于是乎百官降物降物素服君不舉辟移時辟正寢過日食時樂奏鼓祝用幣史用辭用辭以自責故夏書曰辰不集于房夏書𦙍征篇集安也房舍也日月不安其舍則食瞽奏鼓嗇夫馳庶人走嗇夫主幣之官車馬曰馳步曰走為救日食備也此月朔之謂也當夏四月是謂孟夏言此六月當夏家之四月平子弗從昭子退曰夫子將有異志不君君矣安君之災是不復以君為君矣秋郯子來朝左傳秋郯子來朝公與之宴昭子問焉曰少皞氏鳥名官何故也少皞金天氏黃帝之子己姓之祖也郯子曰吾祖也我知之昔者黃帝氏以雲紀故為雲師而雲名黃帝軒轅氏姬姓之祖也黃帝受命有雲瑞故以雲紀事百官師長皆以雲為名號縉雲氏蓋其一官也炎帝氏以火紀故為火師而火名炎帝神農氏姜姓之祖也亦有火瑞以火紀事名百官共工氏以水紀故為水師而水名共工以諸侯霸有九州者在神農前大皞後亦受水瑞以水名官大皞氏以龍紀故為龍師而龍名大皞伏犧氏風姓之祖也有龍瑞故以龍命官我高祖少皞摰之立也鳯鳥適至故紀于鳥為鳥師而鳥名鳯鳥氏厯正也鳯鳥知天時故以名厯正之官𤣥鳥氏司分者也𤣥鳥燕也以春分來秋分去伯趙氏司至者也伯趙伯勞也以夏至鳴冬至止青鳥氏司啓者也青鳥鶬鷃也以立春鳴立夏止丹鳥氏司閉者也丹鳥鷩雉也以立秋來立冬去入大水為蜃上四鳥皆厯正之屬官祝鳩氏司徒也祝鳩鷦鳩也鷦鳩孝故為司徒主教民鴡鳩氏司馬也鴡鳩王鳩也驇而有别故為司馬主法制鳲鳩氏司空也鳲鳩鴶鵴也鳲鳩平均故為司空平水土爽鳩氏司寇也爽鳩鷹也鷙故為司寇主盜賊鶻鳩氏司事也鶻鳩鶻鵰也春來冬去故為司事五鳩鳩民者也鳩聚也治民上聚故以鳩為名五雉為五工正五雉雉有五種西方曰鷷雉東方曰鶅雉南方曰翟雉北方曰鵗雉伊洛之南曰翬雉賈逵曰鷷雉攻木之工也鶅雉磚埴之工也翟雉攻金之工也鵗雉攻皮之工也翬雉設五色之工也利器用正度量夷民者也夷平也九扈為九農正扈有九種也春扈鳻鶞夏扈竊𤣥秋扈竊藍冬扈竊黃棘扈竊丹行扈唶唶宵扈嘖嘖桑扈竊脂老扈鷃鷃以九扈為九農之號各隨其宜以教民事賈逵云春扈鳻鶞相五上之宜趣民耕種者也夏扈竊𤣥趣民耘苖者也秋扈竊藍趣民收斂者也冬扈竊黃趣民蓋藏者也棘扈竊丹為果驅鳥者也行扈唶唶畫為民驅鳥者也宵扈嘖嘖夜為農驅獸者也桑扈竊脂為蠶驅雀者也老扈鷃鷃趣民收麥令不得晏起者也扈民無淫者也扈止也自顓頊以來不能紀遠乃紀于近為民師而命以民事則不能故也顓頊氏代少皞者德不能致逺瑞故以民事命官仲尼聞之見于郯子而學之于時仲尼年二十八既而告人曰吾聞之天子失官學在四夷猶信傳言聖人無常師八月晉荀吳帥師滅陸渾之戎公羊作賁渾戎穀梁無之字左傳晉侯使屠蒯如周屠蒯晉侯之膳宰也以忠諫見進請有事于雒與三塗萇𢎞謂劉子曰客容猛非祭也其伐戎乎陸渾氏甚睦于楚必是故也君其備之乃警戎備九月丁卯晉荀吳帥師涉自棘津棘津杜注河津名在今河南胙城縣北使祭史先用牲于雒陸渾人弗知師從之庚午遂滅陸渾數之以其二于楚也陸渾子奔楚其衆奔甘鹿甘鹿杜注周地今河南宜陽縣有鹿蹄山甘水所出周大獲先警戎備故宣子夢文公攜荀吳而授之陸渾故使穆子帥師獻俘于文宮欲以應夢僖二十二年秦晉遷陸渾之戎于伊川非戎自逼居內地也又不聞其侵敗王略而晉忽以詐滅之貪暴極矣若謂其二于楚則諸侯皆二何獨于陸渾有討乎冬有星孛于大辰左傳冬有星孛于大辰西及漢夏之八月辰星見在天漢西今孛星出辰西光芒東及天漢申須曰申須魯大夫彗所以除舊布新也天事恆象天道恆以象類告示人今除于火火出必布焉諸侯其有火災乎今火向伏故知當須火出乃布散為災梓慎曰往年吾見之是其徵也徵始有形象而微也火出而見前年火出時今兹火出而章必火入而伏隨火行也其居火也久矣歷二年其與不然乎言必然也火出于夏為三月謂昏見于商為四月于周為五月夏數得天得天正若火作其四國當之在宋衛陳鄭乎宋大辰之虛也大辰大火宋分野陳大皞之虛也大皞居陳木火所自出鄭祝融之虛也祝融高辛氏之火正居鄭皆火房也星孛及漢漢水祥也天漢水也衛顓頊之虛也故為帝丘其星為大水衛星營室營室水也水火之牡也牡雄也其以丙子若壬午作乎水火所以合也丙午火壬子水水火合而相薄水少而火多故水不勝火若火入而伏必以壬午不過其見之月火見周之五月鄭禆竈言于子産曰宋衛陳鄭將同日火若我用瓘斝玉瓚鄭必不火瓘圭也斝玉爵也瓚勺也欲以禳火子産弗與以為天災流行非禳所息故也為明年宋衛陳鄭災傳公羊傳孛者何彗星也其言于大辰何在大辰也大辰者何大火也大火心也東方蒼龍七宿之一在中最明以候四時故曰大辰辰時也大火為大辰伐為大辰伐謂參伐也伐星在參傍與參連體大火與伐天所以示民時早晚天下所取正故同為大辰北辰亦為大辰北辰北極居天之中以正四時故亦謂之大辰何以書記異也穀梁傳一有一亡曰有于大辰者濫于大辰也劉向曰大辰者大火也不曰孛于大火而曰大辰者謂濫于蒼龍之體不獨加大火大辰心星也前漢書五行志云心天子之象也天文志云心三星中星曰明堂天子位為大辰彗加於心其祲大矣當其時申須梓愼禆竈皆以為火災至宋胡氏安國則以為應在後五年王室子朝之亂春秋紀災異而不言其事應見人君當謹天戒修德以弭災而事應則不可以常也必求其說則時有不應而轉以天變為不足畏矣楚人及吳戰于長岸長岸杜注楚地今江南當塗縣西南有西梁山與東梁山夾江相對亦曰天門山郡國志春秋楚獲吳餘皇處也左傳吳伐楚陽丐為令尹陽丐穆王曾孫令尹子瑕卜戰不吉司馬子魚曰我得上流何故不吉子魚公子魴也順江而下易用勝敵且楚故司馬令龜我請改卜令曰魴也以其屬死之楚師繼之尚大克之吉戰于長岸子魚先死楚師繼之大敗吳師獲其乘舟餘皇餘皇舟名使隨人與後至者守之環而塹之及泉環周也盈其隧炭陳以待命隧出入道炭火也盈路置火以防吳人言其守之嚴密吳公子光請于其衆曰光諸樊子闔廬喪先王之乘舟豈唯光之罪衆亦有焉請藉取之以救死藉衆之力以取舟衆許之使長鬣者三人潛伏于舟側長鬛多髭鬚與吳人異形狀詐為楚人曰我呼餘皇則對師夜從之師吳師也三呼皆迭對楚人從而殺之楚師亂吳人大敗之取餘皇以歸傳言吳光有謀公羊傳詐戰不言戰此其言戰何據於越敗吳于檇李敵也俱無勝負不可言敗故言戰穀梁傳兩夷狄曰敗於越敗吳于檇李是也中國與夷狄亦曰敗晉荀吳敗狄于大􅓒是也楚人及吳戰于長岸進楚子故曰戰楚先勝吳吳復勝楚勝負相敵故言戰不言敗據傳五年吳嘗敗楚于鵲岸不書六年敗楚于房鍾不書書伐吳而已至是始書戰著其國勢匹敵而抗兵相加也十有八年春附録左傳十八年春王二月乙卯周毛得殺毛伯過而代之毛伯過周大夫得過之族萇𢎞曰毛得必亡是昆吾稔之日也昆吾夏伯稔熟也侈惡積熟以乙卯日與桀同誅侈故之以而毛得以濟侈于王都不亡何待為二十六年毛伯奔楚傳王三月曹伯須卒左傳三月曹平公卒為下㑹葬見原伯張本夏五月壬午宋衛陳鄭災左傳夏五月火始昏見丙子風梓慎曰是謂融風火之始也東北曰融風融風木也木為火母故曰火之始七日其火作乎從丙子至壬午七日壬午水火合之日故知當火作戊寅風甚壬午大甚宋衛陳鄭皆火梓慎登大庭氏之庫以望之大庭氏杜注古國名在魯城內魯于其處作庫高顯故登以望氣參近占以審前年之言曰宋衛陳鄭也數日皆來告火禆竈曰不用吾言鄭又將火前年禆竈欲用瓘斝禳火子産不聼今復請用之鄭人請用之子産不可子大叔曰寶以保民也若有火國幾亡可以救亡子何愛焉子産曰天道遠人道邇非所及也何以知之竈焉知天道是亦多言矣豈不或信多言者或時有中遂不與亦不復火鄭之未災也里析告子産曰將有大祥里析鄭大夫祥變異之氣民震動國幾亡吾身泯焉弗良及也言將先災死國遷其可乎子産曰雖可吾不足以定遷矣子産知天災不可逃非遷所免故託以知不足及火里析死矣未葬子産使輿三十人遷其柩火作子産辭晉公子公孫于東門晉人新來未入者使司寇出新客禁舊客勿出于宮為其知國情不欲令去使子寬子上巡羣屏攝至于大宮二子鄭大夫屏攝祭祀之位大宮鄭祖廟巡行宗廟不使火得及之使公孫登徙大龜登開卜大夫使祝史徙主祏于周廟告于先君祏廟主石函周廟厲王廟也有火災故合羣主于祖廟易救護使府人庫人各警其事商成公警司宮商成公鄭大夫出舊宮人置諸火所不及司馬司寇列居火道備非常也行火所焮焮炙也城下之人伍列登城備姦也明日使野司寇各保其徵野司寇縣士也戒使各保其所應受徵役之人皆令具備以待上命郊人助祝史除于國北為祭處于國北方就大隂禳火禳火于𤣥冥回祿𤣥冥水神回祿火神祈于四鄘鄘城也城積土隂氣所聚故祈祭之以禳火之餘災書焚室而寬其征與之材三日哭國不市使行人告于諸侯宋衛皆如是陳不救火許不弔災君子是以知陳許之先亡也不義所以亡公羊傳何以書記異也何異爾異其同日而俱災也外異不書此何以書為天下記異也穀梁傳其志以同日也其日亦以同日也或曰人有謂鄭子産曰某日有災子産曰天者神子惡知之是人也同日為四國災也四國同日而災非人力所為也傳載禆竈豫知其兆請禳而子産不許蓋知天道之遠一以人事為憑故竈言鄭又當火卒亦不應觀此益信古人以德消變人事誠修在天之禍福實有可移之理矣六月邾人入鄅鄅杜注妘姓國在琅琊開陽縣今山東沂州北有開陽故城左傳六月鄅人藉稻其君自出藉稻蓋履行之邾人襲鄅鄅人將閉門邾人羊羅攝其首焉斬得閉門者頭遂入之盡俘以歸鄅子曰余無歸矣從帑于邾邾莊公反鄅夫人而舍其女為明年宋伐邾起秋葬曹平公左傳秋葬曹平公往者見周原伯魯焉原伯魯周大夫與之語不說學歸以語閔子馬閔子馬曰周其亂乎夫必多有是說而後及其大人大人在位者大人患失而惑患有學而失道者以惑其意又曰可以無學無學不害不害而不學則苟而可于是乎下陵上替能無亂乎夫學殖也殖生長也言學之進德如農之殖苖日新月盛不學將落原氏其亡乎附録左傳七月鄭子産為火故大為社為治也祓禳于四方振除火災禮也乃簡兵大搜將為搜除治兵于廟城內地迫故除廣之子大叔之廟在道南其寢在道北其庭小庭搜場也過期二日使除徒陳于道南廟北曰子産過女而命速除乃毁于而鄉毁女所鄉子産朝過而怒之怒不毁除者南毁子産及衝使從者止之曰毁于北方言子産仁不忍毁人廟火之作也子産授兵登陴子大叔曰晉無乃討乎辭晉公子公孫而授兵似若叛晉子産曰吾聞之小國忘守則危况有災乎國之不可小有備故也既晉之邊吏讓鄭曰鄭國有災晉君大夫不敢寧居卜筮走望不愛牲玉鄭之有災寡君之憂也今執事􅏌然授兵登陴􅏌然徑忿貌將以誰罪邊人恐懼不敢不告子産對曰若吾子之言敝邑之災君之憂也敝邑失政天降之災又懼讒慝之間謀之以啓貪人薦為敝邑不利以重君之憂幸而不亡猶可說也不幸而亡君雖憂之亦無及也鄭有他竟望走在晉言鄭雖與他國為竟每瞻望晉歸赴之既事晉矣其敢有二心傳言子産有備冬許遷于白羽左傳楚左尹王子勝言于楚子曰許于鄭仇敵也而居楚地以不禮于鄭十五年平王復遷邑許自夷還居葉恃楚而不事鄭晉鄭方睦鄭若伐許而晉助之楚喪地矣君盍遷許許不專于楚鄭方有令政許曰人示舊國也許先鄭封鄭曰余俘邑也隱十一年鄭滅許而復存之故曰俘邑葉在楚國方城外之蔽也土不可易易輕也國不可小謂鄭許不可俘讎不可啓君其圗之楚子說冬楚子使王子勝遷許于析實白羽于傳時白羽改為析日講春秋解義卷五十二
