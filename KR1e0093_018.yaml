body:
  text: 欽定四庫全書日講春秋解義卷十八僖公十有六年春王正月戊申朔隕石于宋五是月六鷁退飛過宋都隕公羊作霣鷁穀梁作鶂左傳十六年春隕石于宋五隕星也六鷁退飛過宋都風也鷁水鳥遇迅風而退飛周內史叔興聘于宋宋襄公問焉曰是何祥也吉凶焉在祥吉凶之先見者對曰今兹魯多大喪眀年齊有亂君將得諸侯而不終魯喪齊亂宋襄公不終别以政刑吉凶他占知之退而告人曰君失問是隂陽之事非吉凶所生也言石隕鷁退隂陽錯逆所為非人所生襄公不知隂陽而問人事故曰君失問叔興自以對非其實恐為有識所譏故退而告人吉凶由人吾不敢逆君故也積善餘慶積惡餘殃故曰吉凶由人君問吉凶不敢逆之故假他占以對公羊傳曷為先言霣而後言石霣石記聞聞其磌然視之則石察之則五是月者何僅逮是月也何以不日晦日也晦則何以不言晦春秋不書晦也朔有事則書晦雖有事不書曷為先言六而後言鷁六鷁退飛記見也視之則六察之則鷁徐而察之則退飛五石六鷁何以書記異也外異不書此何以書為王者之後記異也穀梁傳先隕而後石何也隕而後石也于宋四竟之內曰宋後數散辭也耳治也隕石先以耳聞故先言隕是月者决不日而月也是月隕石之月若不言是月嫌與戊申同六鶂退飛過宋都先數聚辭也目治也鶂退先以目見故先言數子曰石無知之物鶂微有知之物石無知故日之石無知而隕必天使之然故詳而日之鶂微有知之物故月之鶂或時自欲退飛耳是以略而月之君子之于物無所茍而已石鶂且猶盡其辭而况于人乎故五石六鶂之辭不設則王道不亢矣不遺細微故王道可舉民所聚曰都隕石者星墜於天半空凝結而成石也退飛者有氣逆驅力不能前而反却也此宋異而書於魯史則當時諸國有非所當告而告者矣春秋存而不削以眀天人感應之理垂戒於後世也宋襄多行不義見石隕鷁退之異不自省德而欲以力爭成霸業後五年見執于盂六年有泓之敗聖人不言災異之應而事應具存不可不察也三月壬申公子季友卒公羊傳其稱季友何賢也穀梁傳大夫日卒正也稱公弟叔仲賢也大夫不言公子公孫疏之也友名也季字也公子公孫為大夫其卒也以名承世繫宜書公子友卒而加季者生而賜氏使世為卿季友仲遂是也季友忠賢在僖公有翼戴之功襄仲弒逆在宣公有援立之力二君欲以異賞報之皆生而賜氏俾世其官經於其卒各以氏書志壞法亂紀之端貽彊家専政之禍深切著眀矣夏四月丙申鄫季姬卒經所書內女為諸侯夫人者七備卒葬者二紀伯姬宋伯姬是也杞叔姬以出不書葬郯伯姬出齊子叔姬遭變而大歸並不書卒杞伯姬歸杞四十餘年卒葬皆不書鄫季姬非出也卒而不葬與杞叔姬同其義無考但以紀叔姬不宜書卒葬而以賢得書例之則宜書而不書者必有故也附録左傳夏齊伐厲不克救徐而還秋七月甲子公孫兹卒附録左傳秋狄侵晉取狐厨受鐸涉汾及昆都狐厨杜注晉邑臨汾縣西北有狐谷亭今屬山西襄陵縣受鐸杜注晉邑昆都杜注晉邑今山西平陽府南有昆都聚因晉敗也即戰韓之敗王以戎難告于齊齊徴諸侯而戌周十一年戎伐京師以來遂為王室難冬十一月乙卯鄭殺子華終管仲之言事在七年􅉀寧母𫝊冬十有二月公㑹齊侯宋公陳侯衛侯鄭伯許男邢侯曹伯于淮淮杜注臨淮郡左右按臨淮郡後漢下邳國今江南泗州左傳十二月㑹于淮謀鄫且東略也淮夷病鄫故城鄫役人病有夜登丘而呼曰齊有亂不果城而還役人遇厲氣不堪久駐故作妖言穀梁傳兵車之㑹也桓公安攘之志至㑹淮而愈怠矣却淮夷而不力城鄫而不果蓋自管仲既沒其內治且不能自持而况於武略乎自齊桓倡霸邢未嘗一與㑹盟而此㑹忽與焉蓋舊服屬於衛不堪徴求而特自請從於㑹也十八年遂與狄人伐衛殆猶介人侵蕭而先來朝於魯也與十有七年春齊人徐人伐英氏英氏杜注楚與國今江南六安州西有英氏城接英山縣境左傳十七年春齊人為徐伐英氏以報婁林之役也婁林役在十五年牡丘之㑹齊桓不能救徐以致婁林之敗復為徐伐英氏以報婁林之役避彊敵而凌弱小豈惟不足以服諸侯將益為楚所玩矣附録左傳夏晉大子圉為質于秦秦歸河東而妻之秦征河東置官司在十五年惠公之在梁也惠公以六年奔梁梁伯妻之梁嬴孕過期卜招父與其子卜之其子曰將生一男一女招曰然男為人臣女為人妾故名男曰圉女曰妾圉養馬者不聘曰妾及子圉西質妾為宦女焉宦事秦為妾夏滅項項杜注項國汝隂項縣今河南項城縣東北故項城是也左傳師滅項師魯師淮之㑹公有諸侯之事未歸而取項淮㑹在前年冬諸侯之事㑹同講禮之事齊人以為討而止公內諱執皆言止公羊傳孰滅之齊滅之曷為不言齊滅之為桓公諱也春秋為賢者諱此滅人之國何賢爾君子之惡惡也疾始絶其始則不得終其惡善善也樂終樂賢者終其行桓公嘗有繼絶存亡之功故君子為之諱也穀梁傳孰滅之桓公也何以不言桓公也為賢者諱也項國也不可滅而滅之乎桓公知項之可滅也而不知已之不可以滅也既滅人之國矣何賢乎君子惡惡疾其始善善樂其終桓公嘗有存亡繼絶之功故君子為之諱也先儒謂考之於經未有書外滅而不言國者如齊師滅談之類是也未有書內取而直言魯者如取鄟取邿取鄫是也僖公在㑹滅項乃季孫所為故不諱其惡與取鄟取邿取鄫為君諱惡實滅而書取異義舊說相承未敢更易但季友卒後魯卿見經者惟公子遂叔孫得臣公孫敖季友生而賜氏使世為卿而友子無佚不見於經不書其卒故𫝊記謂其早亡行父至文六年始使於齊則是時滅項之季孫果何人耶公穀皆謂齊滅以襄十年春㑹于柤夏滅逼陽觀之與此年春伐英氏夏滅項書法正同若謂彼稱遂滅則彼繼㑹而滅文不相蒙此以滅承伐可不稱遂公穀之義未始不可通也秋夫人姜氏㑹齊侯于卞卞杜注魯國卞縣今故卞城在山東泗水縣東左傳秋聲姜以公故㑹齊侯于卞聲姜僖公夫人齊女卞乃桓公歸齊所經之地夫人齊女也故要於路而㑹之婦人迎送不出門見兄弟不踰閾况僖公尚未至國而私自出㑹非禮甚矣聲姜在魯夫人中稱賢詩人以令妻頌之而猶有此失蓋習於聞見之非而昧於禮義之正也九月公至自㑹左傳九月公至書曰至自㑹猶有諸侯之事焉且諱之也先儒皆據左𫝊謂齊以滅項止公夫人㑹齊侯請而釋之但公若以滅項見止則夫人當如齊俟齊侯之歸而請之豈能致齊侯來㑹况齊侯夙重魯宋魯君方以霸事在㑹理宜詰問魯臣擅興滅國之故無緣遽執魯君疑齊侯以疾先歸而留諸侯於㑹以防淮夷之變援伐英之師齊侯道經魯境故夫人親往問疾而公九月始至自㑹耳冬十有二月乙亥齊侯小白卒左傳齊侯之夫人三王姬徐嬴蔡姬皆無子齊侯好內多內寵內嬖如夫人者六人長衛姬生武孟武孟公子無虧少衛姬生惠公公子元鄭姬生孝公公子昭葛嬴生昭公公子潘密姬生懿公公子商人宋華子生公子雍華氏之女子姓公與管仲屬孝公于宋襄公以為大子雍巫有寵于衛共姬因寺人貂以薦羞于公雍巫雍人名巫即易牙共姬即長衛姬亦有寵公許之立武孟管仲卒五公子皆求立冬十月乙亥齊桓公卒乙亥十月八日易牙入與寺人貂因內寵以殺羣吏內寵內官之有權寵者而立公子無虧孝公奔宋十二月乙亥赴辛已夜殯六十七日乃殯穀梁傳此不正其日之何也其不正前見矣其不正之前見何也以不正入虛國故稱嫌焉爾虛國謂齊無人莊九年齊小白入于齊貶不稱公子𫝊例曰以國氏者嫌也既于入齊見其不正故卒不重見十有八年春王正月宋公曹伯衛人邾人伐齊宋公下公羊有㑹字左傳十八年春宋襄公以諸侯伐齊三月齊人殺無虧以說宋穀梁傳非伐喪也附録左傳鄭伯始朝于楚楚子賜之金既而悔之與之􅉀曰無以鑄兵楚金利故故以鑄三鐘夏師救齊穀梁傳善救齊也五月戊寅宋師及齊師戰于甗齊師敗績甗杜注齊地在今山東歷城縣界左傳齊人將立孝公不勝四公子之徒無虧已死故曰四公子遂與宋人戰夏五月宋敗齊師于甗立孝公而還公羊傳戰不言伐此其言伐何宋公與伐而不與戰故言伐春秋伐者為客伐者為主曷為不使齊主之與襄公之征齊也曷為與襄公之征齊桓公死豎刁易牙爭權不葬為是故伐之也穀梁傳戰不言伐客不言及言及惡宋也狄救齊穀梁傳善救齊也戰之書及本以别異客主直與不直自視乎其事然兵凶戰危志乎戰則皆有可貶之道矣春秋書伐而戰者三其二皆以受伐者為主蓋敵國來伐主人固守而不出則師無由合也惟此變文以客及主而下書師救齊狄救齊則罪宋眀矣無虧之殺昭之納皆不書何也魯救無虧不克而忌宋之功故舊史不書孔子雖知其事不得而益也秋八月丁亥葬齊桓公八月無丁亥日誤左傳秋八月葬齊桓公孝公立而後得葬諸侯五月而葬桓公之卒至此十一月然後葬亂故也自管仲殁豎刁易牙競進桓公不能慎終如始付託非人幾亡其國雖威令加乎四海亦何益哉以是知霸德之淺與功利之不足尚而春秋明道正誼之㫖不可一日不講也冬邢人狄人伐衛左傳冬邢人狄人伐衛圍菟圃衛侯以國讓父兄子弟及朝衆曰茍能治之燬請從焉燬衛文公名衆不可而後師于訾婁訾婁杜注衛邑今直隸滑縣西南有訾婁城與長垣縣接界狄師還獨言狄還則邢留拒衛見邢所以終為衛滅穀梁傳狄其稱人何也善纍而後進之纍積伐衛所以救齊也功近而德逺矣言齊桓不能行王道功甚淺近而既殁狄人猶懷之則其德為逺邢為周公之裔衛為武之穆皆嘗亡於狄賴齊復存至帥甲士三千而戌衛者非公子無虧乎乃桓死未踰年而衛與諸侯奉公子昭以伐齊喪其致伐固宜故人狄以見罪衛之深也然衛雖可伐而邢與衛親不當連狄以伐之其後衛卒滅邢未必不基於此附録左傳梁伯益其國而不能實也多築城邑而無民以實之命曰新里秦取之十有九年春附録左傳十九年春遂城而居之承前年𫝊取新里故不復言秦也為此冬梁亡𫝊王三月宋人執滕子嬰齊左傳宋人執滕宣公宣公即嬰齊宋稱人非霸討也凡執得其罪而不歸於亰師則稱人惡其専也歸於京師而執非其罪則稱人惡其濫也經所書見執之君皆不名而滕子名遂失國也舊說以稱名為罪滕子非也嬰齊之罪於𫝊無徴即先儒所云不過失事霸國之禮耳見執之君罪浮於此者衆矣而惟嬰齊是責乎夏六月宋公曹人邾人盟于曹南鄫子㑹盟于邾已酉邾人執鄫子用之宋公公羊作宋人鄫穀梁作繒㑹盟于邾公羊無盟字左傳夏宋公使邾文公用鄫子于次睢之社欲以屬東夷睢水受汴水東入泗此水次有妖神諸夷皆社祠之蓋殺人而用祭以懼諸夷使來歸己也司馬子魚曰司馬子魚公子目夷也古者六畜不相為用謂若祭馬先不用馬小事不用大牲而况敢用人乎祭祀以為人也民神之主也用人其誰饗之齊桓公存三亡國以屬諸侯三亡國魯衛邢義士猶曰薄德謂欲因亂取魯緩救邢衛今一㑹而虐二國之君三月執滕子六月執鄫子又用諸淫昏之鬼非周社故將以求霸不亦難乎得死為幸公羊傳其言㑹盟何後㑹也惡乎用之用之社也其用之社奈何蓋叩其鼻以血社也穀梁傳微國之君因邾以求與之盟人因已以求與之盟已迎而執之惡之故謹而日之也用之者叩其鼻以衈社也衈者釁也取鼻血以釁祭社器秋宋人圍曹左傳宋人圍曹討不服也曹南盟不修地主之禮故子魚言于宋公曰文王聞崇德亂而伐之崇崇侯虎軍三旬而不降退修教而復伐之因壘而降壘軍壘也言不增兵但因舊壘而崇自服詩曰刑于寡妻至于兄弟以御于家邦詩大雅言文王之教自近及逺今君德無乃猶有所闕而以伐人若之何盍姑內省德乎無闕而後動齊桓倡霸深結魯宋布德邢衛撫循曹邾陳蔡鄭許招來徐及江黃依於仁義禮信數十年而後有成宋襄思繼齊桓之迹而以無道行之首伐齊喪次執滕子嬰齊將以威懾諸侯而曹南之盟從者僅曹邾二國又縱邾人虐用鄫子宜乎曹人不服既盟而旋背之也乃不自省德而興圍曹之師霸者以力假仁宋襄力既不足又多行不仁卒之兵敗身傷為天下笑不亦宜乎衛人伐邢左傳秋衛人伐邢以報菟圃之役邢不速退所以獨見伐于是衛大旱卜有事于山川不吉有事祭也寧莊子曰昔周饑克殷而年豐今邢方無道諸侯無伯天其或者欲使衛討邢乎從之師興而雨衛不自省其從宋伐喪之罪而以報復為事直書而罪自見左氏所𫝊寧莊子之所云誣妄之辭也冬㑹陳人蔡人楚人鄭人盟于齊公羊作公㑹此楚與夏盟之始左傳陳穆公請修好于諸侯以無忘齊桓之德冬盟于齊修桓公之好也地于齊齊亦與盟也微者㑹盟不志於春秋此其志者必魯公與陳蔡楚鄭之君或其大夫矣曷為內不言公而外稱人以楚人之得與列國㑹盟自此始故諱之也齊桓聲罪以伐楚屈完來盟于師特受盟耳自是以後終桓之世楚人未嘗一與諸侯之㑹蓋桓公管仲不欲引而近之也及諸侯苦宋襄之暴詐遂啓楚人窺伺之心故假不忘桓德以參與中國之㑹盟而齊孝公墮其術中而不知魯以周公之裔亦俯首以從之楚因是得行其志於中國盟于鹿上㑹于盂遂執宋公以伐宋儼然列位於陳蔡之上而楚氛於是乎漸惡矣則皆盟齊為之厲階也先陳陳為倡也後鄭桓公沒後首朝於楚故為楚屈也陳蔡亦服屬於楚而先楚必君親與㑹而楚鄭則大夫也梁亡左傳梁亡不書其主自取之也不書取梁者主名初梁伯好土功亟城而弗處民罷而弗堪則曰某寇將至乃溝公宫溝塹曰秦將襲我民懼而潰秦遂取梁公羊傳此未有伐者其言梁亡何自亡也其自亡奈何魚爛而亡也魚爛從內發也穀梁傳自亡也湎于酒淫于色心昏耳目塞上無正長之治大臣背叛民為寇盜梁亡自亡也如加力役焉湎不足道也如以伐滅為文猶不足形容其淫湎惟云自亡然後其惡眀梁亡鄭棄其師我無加損焉正名而已矣因舊史之文故無加損梁亡出惡正也正謂政教鄭棄其師惡其長也長謂髙克書梁亡而不書其取之者即國君出奔不書其逐之者之義也民罷而潰則其國已亡而後秦取之非因秦取而後亡也成湯之誥曰凡我造邦無從匪彛無即慆淫各守爾典以承天休凡有國家者不能自彊於政治則日危月削如火銷膏以至滅亡而莫覺矣况如梁伯之好土功盡民力湎于酒淫于色心昏而出政惡者乎故變文以著其自亡為萬世戒也二十年春新作南門魯城南門也本名稷門僖公更髙大之左傳二十年春新作南門書不時也失土功之時凡啓塞從時門户道橋謂之啓城郭墻塹謂之塞皆官民之開閉不可一日而闕故特隨壞時而治之傳既譏僖公作門不時嫌開閉至急之事亦將待土功之月故别起從時之例以眀二義言啓塞不須待時其新作南門則須待耳公羊傳何以書譏何譏爾門有古常也惡奢泰不奉古制常法穀梁傳作為也有加其度也更加使大言新有故也非作也責其改舊制南門者法門也天子諸侯皆南面而治法令之所出入故謂之法門言新者有故也言作者創始也新延廏不言作而此言作則改舊可知矣其曰南門南非一門也記稱魯之庫門制如天子之皋門雉門制如天子之應門則僭侈踰度可知矣春秋凡用民力雖得其時制者猶書於䇿以見勞民為重事而况輕用於所不當為乎僖公嘗修泮宫復閟宫史克作頌而經不書蓋宫廟以事祖考學校以教國之子弟雖重民力不可使廢且泮宫為諸侯之學則閟宫或亦魯之舊也又經所書新宫災大室屋壞無不新之理而經不書惟此及雉門兩觀書新作則修舊不書而書者皆非禮可知矣夏郜子來朝郜姬姓國後漢志濟隂成武北有郜城公羊傳郜子者何失地之君也何以不名兄弟辭也夾漈鄭氏曰郜有二桓二年取郜大鼎北郜也在今單州成武郜子來朝南郜也今單州有二郜城王氏曰郜分為南北皆附庸於宋意是時宋襄無道荆楚日彊郜以宋為難恃而魯為宗國故來朝以求依附與五月乙已西宫災公羊傳西宫者何小寢也小寢則曷為謂之西宫有西宫則有東宫矣魯子曰以有西宫亦知諸侯之有三宫也西宫災何以書記異也穀梁傳謂之新宫則近為禰宫言閔公非僖公之父故不言新宫也以諡言之則如疏之然以是為閔宫也穀梁𫝊以為閔公之廟禮宗廟居左不得稱西宫蓋僖公所居之小寢公羊𫝊曰有西宫則有東宫是也若實閔宫何妨言新宫乎為其已久何妨言閔宫乎鄭人入滑左傳滑人叛鄭而服于衛夏鄭公子士泄堵寇帥師入滑公子士泄鄭文公子堵寇鄭大夫滑與鄭為鄰齊桓時嘗與鄭同盟于幽桓殁未幾鄭首從楚繼入滑無忌憚甚矣此天王出居于鄭之始釁也秋齊人狄人盟于邢左傳秋齊狄盟于邢為邢謀衛難也于是衛方病邢穀梁傳邢為主焉爾邢小其為主何也其為主乎救齊十八年邢人狄人伐衛以救齊是也書狄例以國稱而與齊同稱人者昔宋伐齊喪而狄能救之今衛欲滅邢而狄能謀之故人以進之人狄則罪衛之意眀矣此見聖人仁天下之公心也冬楚人伐隨左傳隨以漢東諸侯叛楚冬楚鬭穀於菟帥師伐隨取成而還君子曰隨之見伐不量力也量力而動其過鮮矣善敗由已而由人乎哉詩曰豈不夙夜謂行多露詩召南以喻違禮而行必有汚辱是亦量力相時而動之義穀梁傳隨國也春秋之初隨常與楚為鬭國楚鬬伯比曰漢東之國隨為大我張吾三軍而以武臨之彼則懼而協以謀我隨張必棄小國方是時隨尚能率小國以抗楚自隨服而漢陽諸姬楚實盡之矣然自莊以前楚人侵伐江漢間小國無一見於經蓋未有告命也至是託言同盟告慶於魯以為恐動諸侯之計觀此益見于齊之盟諱不書公蓋深罪齊孝之失圗病魯僖之無志也附録左傳宋襄公欲合諸侯臧文仲聞之曰以欲從人則可屈己之欲從衆之善以人從欲鮮濟為眀年鹿上盟𫝊日講春秋解義卷十八
