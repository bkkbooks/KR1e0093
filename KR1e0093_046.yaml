body:
  text: 欽定四庫全書日講春秋解義卷四十六襄公三十年春王正月楚子使薳罷來聘罷公羊作頗左傳三十年春王正月楚子使薳罷來聘通嗣君也郊敖即位穆叔問王子之為政何如王子圍為令尹對曰吾儕小人食而聽事猶懼不給命而不免於戾焉與知政固問焉不告穆叔告大夫曰楚令尹將有大事子蕩將與焉子蕩薳罷助之匿其情矣公踰年在楚郟敖新即位使薳罷來聘魯以君行而楚以大夫報行霸主之禮于中國非晉平趙武之責而何哉附録左傳子産相鄭伯以如晉叔向問鄭國之政焉對曰吾得見與否在此嵗也駟良方爭未知所成駟子晳良伯有若有所成吾得見乃可知也叔向曰不既和矣乎對曰伯有侈而愎子晳好在人上莫能相下也雖其和也猶相積惡也惡至無日矣為此年秋良霄出奔傳三月癸未晉悼夫人食輿人之城杞者輿衆也城杞在徃年絳縣人或年長矣無子而徃與於食有與疑年使之年使言某年曰臣小人也不知紀年臣生之嵗正月甲子朔四百有四十五甲子矣其季於今三之一也所稱正月夏正月也三分六甲之一得甲子甲戌盡癸未吏走問諸朝師曠曰魯叔仲惠伯會郤成子於承匡之嵗也在文十一年是嵗也狄伐魯叔孫莊叔於是乎敗狄於鹹獲長狄僑如及虺也豹也而皆以名其子七十三年矣史趙曰晉大史名趙亥有二首六身下二如身是其日數也古亥字二畫在上三人在下故以二為首以六為身下首之二畫豎置身旁當為恀字則是老人始生至今之日數葢以二首為二萬六身為六千六百六十日也士文伯曰文伯士弱之子然則二萬六千六百有六旬也趙孟問其縣大夫則其屬也屬趙武召之而謝過焉曰吾不才任君之大事以晉國之多虞不能由吾子由用也使吾子辱在泥塗乆矣武之罪也敢謝不才遂仕之使助為政辭以老與之田使為君復陶復陶主衣服之官以為絳縣師縣師掌地域辨其夫家人民而廢其輿尉以役孤老故於是魯使者在晉歸以語諸大夫季武子曰晉未可媮也媮薄也有趙孟以為大夫有伯瑕以為佐伯瑕士文伯有史趙師曠而咨度焉有叔向女齊以師保其君其朝多君子其庸可媮乎勉事之而後可傳言晉所以不失諸侯夏四月已亥鄭伯及其大夫盟駟良爭故君子是以知鄭難之不己也夏四月蔡世子般弑其君固左傳蔡景侯為大子般娶于楚通焉太子弑景侯終子産言有子禍榖梁傳其不日子奪父政是謂夷之不言其父而言其君者君於世子有父之親有君之尊故互舉以盡其義也五月甲午宋災宋伯姬卒伯姬上公羊榖梁無宋字左傳或叫于宋大廟叫呼也曰譆譆出出譆譆熱也出出戒伯姬鳥鳴于亳社殷社如曰譆譆皆火妖也甲午宋大災宋伯姬卒待姆也姆女師君子謂宋共姬女而不婦女待人待人而行婦義事也義從宜也伯姬時年六十左右榖梁傳取卒之日加之災上者見以災卒也其見以災卒奈何伯姬之舎失火左右曰夫人少辟火乎伯姬曰婦人之義傅母不在宵不下堂左右又曰夫人少辟火乎伯姬曰婦人之義保母不在宵不下堂遂逮乎火而死婦人以貞為行者也伯姬之婦道盡矣詳其事賢伯姬也連書災與卒而貫以日見以災卒也伯姬年踰六十雖辟火以全生不害為貞而致死以守禮婦道盡矣而宋之臣子緩救以死其君母罪可勝誅哉天王殺其弟佞夫公羊作年夫左傳初王儋季卒儋季周靈王弟其子括將見王而歎單公子愆期為靈王御士過諸廷愆期行過王廷聞其歎而言曰烏乎必有此夫欲有此朝廷之權入以告王且曰必殺之不慼而願大視躁而足髙心在他矣不殺必害王曰童子何知及靈王崩儋括欲立王子佞夫佞夫靈王子景王弟佞夫弗知戊子儋括圍蒍逐成愆成愆蒍邑大夫成愆奔平畤平畤杜注周邑五月癸已尹言多劉毅單蔑甘過鞏成殺佞夫五子周大夫括瑕廖奔晉括廖不書賤也書曰天王殺其弟佞夫罪在王也以佞夫不知故榖梁傳傳曰諸侯且不首惡况於天子乎君無忍親之義天子諸侯所親者唯長子母弟耳天王殺其弟佞夫甚之也鄭伯克叚于鄢不書弟叚不弟也今天王之殺佞夫書弟則知非佞夫之罪也儋括之亂佞夫不知而以嫌見殺過矣王子瑕奔晉儋括之亂佞夫見殺瑕懼禍而奔則必與聞乎儋括之謀矣瑕與子朝皆為逆亂無所容身避罪逃竄與守官保禄而出奔者異故皆不言出附録左傳六月鄭子産如陳涖盟歸復命告大夫曰陳亡國也不可與也聚禾粟繕城郭恃此二者而不撫其民其君弱植公子侈大子卑大夫敖政多門以介于大國能無亡乎不過十年矣為昭八年楚滅陳傳秋七月叔弓如宋葬宋共姬共姬上榖梁無宋字左傳秋七月叔弓如宋葬共姬也公羊傳外夫人不書葬此何以書隱之也何隱爾宋災伯姬卒焉其稱諡何賢也何賢爾宋災伯姬存焉有司復曰火至矣請出伯姬曰不可吾聞之也婦人夜出不見傅母不下堂傅至矣母未至也逮乎火而死穀梁傳外夫人不書葬此其言葬何也吾女也卒災故隱而葬之也魯髙共姬之義故使卿共葬事内女之葬不書遭變然後書莊四年齊侯葬紀伯姬三十年葬紀叔姬此年葬共姬皆非常也鄭良霄出奔許自許入於鄭鄭人殺良霄左傳鄭伯有耆酒為窟室而夜飲酒窟室地室擊鐘焉朝至未己朝者曰公焉在家臣故謂伯有為公其人曰吾公在壑谷壑谷窟室皆自朝布路而罷布路分散既而朝伯有朝鄭君則又將使子晳如楚歸而飲酒庚子子晳以駟氏之甲伐而焚之伯有奔雍梁雍梁杜注鄭地醒而後知之遂奔許大夫聚謀子皮曰仲虺之志云亂者取之亡者侮之推亡固存國之利也罕駟豐同生罕子皮駟子晳豐公孫段也三家本同母兄弟伯有汰侈故不免人謂子産就直助强時謂子晳直三家强子産曰豈為我徒徒黨也言不以駟良為黨國之禍難誰知所敝或主强直難乃不生言能强能直則可弭難今三家未能伯有方爭姑成吾所欲以無所附著為所辛丑子産斂伯有氏之死者而殯之不及謀而遂行不與於國謀印段從之義子産子皮止之衆曰人不我順何止焉子皮曰夫子禮於死者况生者乎遂自止之壬寅子産入癸卯子石入子石印段皆受盟於子晳氏乙已鄭伯及其大夫盟於大宫盟國人於師之梁之外師之梁鄭城門伯有聞鄭人之盟已也怒聞子皮之甲不與攻己也喜曰子皮與我矣癸丑晨自墓門之瀆入墓門鄭城門因馬師頡介於襄庫以伐舊北門馬師頡子羽孫駟帯率國人以伐之駟帯子西子子晳之宗主皆召子産子産曰兄弟而及此吾從天所與伯有死於羊肆羊肆市列子産襚之枕之股而哭之斂而殯諸伯有之臣在市側者既而葬諸斗城斗城杜注鄭地名今河南陳留縣南有斗城子駟氏欲攻子産子皮怒之曰禮國之幹也殺有禮禍莫大焉葬伯有為有禮乃止於是游吉如晋還聞難不入復命於介八月甲子奔晉駟帯追之及酸棗酸棗杜注陳畱縣今河南延津縣北有古城與子上盟子上駟帶用兩珪質於河使公孫肸入盟大夫已已復歸游吉歸書曰鄭人殺良霄不稱大夫言自外入也既出位絶非復鄭大夫于子蟜之卒也子蟜公孫蠆卒在十九年將葬公孫揮與裨竈晨㑹事焉過伯有氏其門上生莠子羽曰其莠猶在乎子羽公孫揮以莠喻伯有於是嵗在降婁降婁中而旦降婁奎婁也周七月今年月降婁中而天明裨竈指之曰猶可以終嵗指降婁也嵗星十二年而一終嵗不及此次也己不及降婁及其亡也嵗在娵訾之口娵訾營室東壁二十八年嵗星淫在𤣥枵今三十年在娵訾是嵗星停在𤣥枵二年其明年乃及降婁僕展從伯有與之皆死僕展鄭大夫伯有黨羽頡出奔晉為任大夫羽頡馬師頡任杜注晉縣屬廣平郡今直隸任縣東南有古任城雞澤之㑹在三年鄭樂成奔楚遂適晉羽頡因之與之比而事趙文子言伐鄭之說焉以宋之盟故不可子皮以公孫鉏為馬師鉏子罕之子代羽頡榖梁傳不言大夫惡之也稱人以殺而不言大夫討賊之辭也不言復入方出而遽歸與宋魚石晉欒盈去國數年而復入者異也不言叛者將不利於國非據邑以自保不得書叛也冬十月葬蔡景公公羊傳賊未討何以書葬君子辭也君子為中國諱弑父恥重故隱之榖梁傳不日卒而月葬不葬者也卒而葬之不忍使父失民於子也不書葬則與失民同故曰不忍使父失民於子春秋大法君弑而賊不討則不書葬蔡景公之葬何以書徧刺天下之諸侯也在禮知生者弔知死者傷世子弑君覆載所不容也不能致討而使人徃㑹其葬以禮於生者人理滅矣附録左傳楚公子圍殺大司馬蒍掩而取其室蒍掩二十五年為大司馬申無宇曰無宇芋尹王子必不免善人國之主也王子相楚國將善是封殖而虐之是禍國也且司馬令尹之偏而王之四體也絶民之主去身之偏艾王之體以禍其國無不祥大焉不祥無大於是何以得免為昭十三年楚弑靈王傳晉人齊人宋人衛人鄭人曹人莒人邾人滕人薛人把人小邾人㑹於澶淵宋災故左傳為宋災故諸侯之大夫㑹以謀歸宋財冬十月叔孫豹㑹晉趙武齊公孫蠆宋向戌衞北宫佗佗北宫括之子鄭罕虎虎子皮及小邾之大夫㑹於澶淵既而無歸於宋故不書其人君子曰信其不可不慎乎澶淵之㑹卿不書不信也夫諸侯之上卿㑹而不信寵名皆棄寵謂族也不信之不可也如是詩曰文王陟降在帝左右信之謂也詩大雅言文王之所以能上接天下接人動順帝者唯以信又曰淑慎爾止無載爾偽逸詩也言當善慎舉止無載行詐偽不信之謂也書曰某人某人㑹於澶淵宋災故尤之也不書魯大夫諱之也公羊傳宋災故者何諸侯㑹於澶淵凡為宋災故也㑹未有言其所為者此言所為何録伯姬也諸侯相聚而更宋之所䘮更復也曰死者不可復生爾財復矣此大事也曷為使微者卿也卿則其稱人何貶曷為貶卿不得憂諸侯也大夫之義得憂内不得憂外所以抑臣道也榖梁傳㑹不言其所為其曰宋災故何也不言災故則無以見其善也其曰人何也救災以衆何救焉更宋之所䘮財也澶淵之會中國不侵伐夷狄夷狄不入中國無侵伐八年善之也晉趙武楚屈建之力也㑹未有言所為者此㑹書宋災故與桓二年稷之㑹書成宋亂同乃程子所謂春秋大義數十炳如日星者也世子弑君之惡不能討宋之災已過時矣而合十二國為㑹以更其財不亦傎乎使不書宋災故則習其讀者疑於欲討蔡般而不果矣列國書人歸財細事卿不行也魯與宋姻親使卿會葬則周恤之事必多故是役轉不與耳附録左傳鄭子皮授子産政伯有死子皮知政以子産賢故讓之辭曰國小而偪偪近大國族大寵多不可為也子皮曰虎帥以聽誰敢犯子子善相之國無小小能事大國乃寛子産為政有事伯石伯石公孫段有事欲使之賂與之邑子大叔曰國皆其國也言鄭大夫共憂鄭國事奚獨賂焉子産曰無欲實難皆得其欲以從其事而要其成非我有成其在人乎言事成猶在我非在他也何愛於邑邑將焉徃言猶在國子太叔曰若四國何子産曰非相違也而相從也言賂以邑欲為和順四國何尤焉鄭書有之曰鄭國史書安定國家必大焉先先和大族姑先安大以待其所歸既伯石懼而歸邑卒與之伯有既死使大史命伯石為卿辭大史退則請命焉請大史更命已復命之又辭如是三乃受策入拜子産是以惡其為人也惡其虚飾使次己位畏其作亂故寵之子産使都鄙有章國都及邉鄙車服尊卑各有分部上下有服公卿大夫服不相踰田有封洫封疆也洫溝也廬井有伍廬舎也九夫為井使五家相保大人之忠儉者大人謂卿大夫從而與之泰侈者因而斃之豐卷將祭請田焉田獵也弗許曰唯君用鮮野獸衆給而已衆臣祭以芻豢為足子張怒退而徵役子張豐卷召兵欲攻子産子産奔晉子皮止之而逐豐卷豐卷奔晉子産請其田里請於公不沒入三年而復之反其田里及其入焉田里所收入從政一年輿人誦之曰取我衣冠而褚之褚畜也奢侈者畏法故畜藏取我田疇而伍之孰殺子産吾其與之及三年又誦之曰我有子弟子産誨之我有田疇子産殖之子産而死誰其嗣之傳言鄭所以興三十有一年春王正月附録左傳三十一年春王正月穆叔至自㑹澶淵㑹還見孟孝伯語之曰趙孟將死矣其語偷不似民主且年未盈五十而諄諄焉如八九十者弗能久矣成二年戰於鞌趙朔已死於是趙文子始生至襄三十年㑹澶淵蓋年四十七八故言未盈五十若趙孟死為政者其韓子乎韓子韓起吾子盍與季孫言之可以樹善君子也言韓起有君子之德晉君將失政矣若不樹焉使早備魯使韓子早為魯備既而政在大夫韓子懦弱大夫多貪求欲無厭齊楚未足與也魯其懼哉孝伯曰人生幾何誰能無偷朝不及夕將安用樹穆叔出而告人日孟孫將死矣吾語諸趙孟之偷也而又甚焉又與季孫語晉故如與孟孫言季孫不從及趙文子卒在昭元年晉公室卑政在侈家韓宣子為政不能圗諸侯魯不堪晉求讒慝𢎞多是以有平丘之會平丘會在昭十三年晉人執季孫意如齊子尾害閭丘嬰欲殺之使帥師以伐陽州陽州杜注魯地在東平西北盖齊魯竟上邑我問師故夏五月子屋殺閭丘嬰以說于我師工僂灑渻竈孔虺賈寅出奔莒四子嬰之黨出羣公子為昭十年欒髙之難復羣公子起本夏六月辛巳公薨於楚宮左傳公作楚宮適楚好其宫歸而作之穆叔曰大誓云民之所欲天必從之君欲楚也夫故作其宮若不復適楚必死是宫也六月辛巳公薨於楚宫叔仲帶竊其拱璧以與御人納諸其懐而從取之由是得罪得罪謂魯人薄之故子孫不得志於魯榖梁傳楚宫非正也楚宫别宫也公適楚美其宫歸而作之遂薨於此魯至襄公季孫宿專行無忌諸大夫則而象之三桓益彊四鄰交侵内失其政柄而外弱於邾莒其所以致此者以公履危而懐安不能自彊於政治非獨以承國於幼弱也秋九月癸巳子野卒左傳立胡女敬歸之子子野胡歸姓之國敬歸襄公妾次於季氏秋九月癸巳卒毁也立敬歸之娣齊歸之子公子稠齊諡稠昭公名穆叔不欲曰大子死有母弟則立之無則立長年鈞擇賢義鈞則卜古之道也非適嗣何必娣之子言子稠非適嗣且是人也居䘮而不哀在慼而有嘉容是謂不度不度之人鮮不為患若果立之必為季氏憂武子不聽卒立之比及葬三易衰衰衽如故衰言其嬉戯無度於是昭公十九年矣猶有童心君子是以知其不能終也為昭二十五年公孫於齊傳榖梁傳子卒日正也傳稱子野以毁卒先儒以為書名未終喪也不薨不葬未踰年也但據經所書則與子般子赤見弑者無異按傳立胡女敬歸之子子野次於季氏既為嗣子則當宅憂於殯宫而次於季氏則其情事不可推而所以卒者亦不可考矣此一經之大義姑發所疑以備先儒所未及不可以無辨也已亥仲孫羯卒左傳已亥孟孝伯卒終穆叔言子貜嗣為大夫是為僖子冬十月滕子來會葬左傳冬十月滕成公来㑹葬惰而多涕子服惠伯曰滕君將死矣怠於其位而哀己甚兆於死所矣能無從乎為昭三年滕子卒傳禮諸侯之喪士弔大夫送葬今滕子親㑹而魯受之皆非禮也癸酉葬我君襄公左傳癸酉葬㐮公附録左傳公薨之月子産相鄭伯以如晉晉侯以我喪故未之見也子産使盡壞其館之垣而納車馬焉士文伯譲之曰敝邑以政刑之不修寇盜充斥充滿斥見言其多無若諸侯之屬辱在寡君者何是以令吏人完客所館髙其閈閎閈閭也厚其牆垣以無憂客使今吾子壞之雖從者能戒其若異客何以敝邑之為盟主繕完葺牆葺覆也以待賓客若皆毁之其何以共命寡君使丐請命正義曰丐士文伯名對曰以敝邑褊小介於大國誅求無時是以不敢寧居悉索敝賦以來㑹時事逢執事之不閒而未得見又不獲聞命未知見時不敢輸幣亦不敢暴露其輸之則君之府實也非薦陳之不敢輸也薦陳猶獻見也其暴露之則恐燥濕之不時而朽蠧以重敝邑之罪僑聞文公之為盟主也宫室卑庳無觀臺榭以崇大諸侯之館館如公寢庫廐繕修司空以時平易道路易治也圬人以時塓館宫室圬人塗者塓塗也諸侯賓至甸設庭燎庭燎設火於庭僕人廵宫車馬有所賓從有代代客役巾車脂轄巾車主車之官隸人牧圉各瞻其事瞻視客所當得百官之屬各展其物展陳也公不留賔而亦無廢事憂樂同之事則廵之廵行也敎其不知而恤其不足賓至如歸無寧菑患無寧寧也不畏冦盜而亦不患燥濕今銅鞮之宫數里銅鞮晉離宫而諸侯舎於隸人舎如隸人舍門不容車而不可踰越盜賊公行而夭癘不戒癘猶災也言水潦不時賓見無時命不可知若又勿壊是無所藏幣以重罪也敢請執事將何所命之雖君之有魯䘮亦敝邑之憂也言鄭與魯亦有同姓之憂若獲薦幣修垣而行君之惠也敢憚勤勞文伯復命趙文子曰信我實不德而以隸人之垣以贏諸侯贏受也是吾罪也使士文伯謝不敏焉晉侯見鄭伯有加禮厚其宴好而歸之乃築諸侯之館叔向曰辭之不可以己也如是夫子產有辭諸侯賴之若之何其釋辭也詩曰辭之輯矣民之協矣辭之繹矣民之莫矣詩大雅言辭輯睦則民恊同辭說繹則民安定莫猶定也其知之矣鄭子皮使印段如楚以適晉告禮也得事大國之禮十有一月莒人弑其君密州左傳莒犂比公生去疾及展輿犂比莒子密州之號既立展輿立以為世子又廢之犂比公虐國人患之十一月展輿因國人以攻莒子弑之乃立展輿立為君去疾奔齊齊出也母齊女展輿呉出也為明年奔呉傳書曰莒人弑其君買朱鉏買朱鉏密州之字言罪之在也罪在鉏也稱人以弑者一國之人所欲弑也莒子虐莒人弑之立展輿春秋稱莒人則罪不在展輿矣左傳展輿因國人以攻莒子陸氏淳謂以當作之傳文偶誤後儒承誤而不敢輙改盖得其義附録左傳吳子使屈狐庸聘於晉屈狐庸巫臣之子也成七年適吳為行人通路也通吴晋之路趙文子問焉曰延州來季子其果立乎延州來季札邑巢隕諸樊在二十五年閽戕戴吳在二十九年戴吳餘祭天似啓之何如對曰不立是二王之命也非啟季子也若天所啟其在今嗣君乎嗣君謂夷昧甚徳而度德不失民度不失事審事情民親而事有序其天所啟也有吳國者必此君之子孫實終之季子守節者也雖有國不立十二月北宫文子相衛襄公以如楚文子北宫佗襄公獻公子宋之盟故也過鄭印段廷勞于棐林如聘禮而以勞辭用聘禮而用郊勞之辭文子入聘報印段子羽為行人馮簡子與子太叔逆客事畢而出言於衛侯曰鄭有禮其數世之福也其無大國之討乎詩云誰能執熱逝不以濯詩大雅濯以水濯手禮之於政如熱之有濯也濯以救熱何患之有此以上文子辭子産之從政也擇能而使之馮簡子能斷大事子大叔美秀而文公孫揮能知四國之為知諸侯所欲為而辨於其大夫之族姓班位貴賤能否而又善為辭令裨諶能謀謀於野則獲得所謀也謀於邑則否此才性之蔽鄭國將有諸侯之事子産乃問四國之為於子羽且使多為辭令與裨諶乗以適野使謀可否而告馮簡子使斷之事成乃授子大叔使行之以應對賓客是以鮮有敗事北宫文子所謂有禮也傳跡子産行事以明文子之言鄭人游於鄉校鄉之學校以論執事論其得失然明謂子産曰毁鄉校如何患人於中謗議國政子産曰何為夫人朝夕退而游焉以議執政之善否其所善者吾則行之其所惡者吾則改之是吾師也若之何毁之我聞忠善以損怨為忠善則怨謗息不聞作威以防怨豈不遽止然猶防川大決所犯傷人必多吾不克救也不如小決使道道通也不如吾聞而藥之也以為己藥石然明曰蔑也今而後知吾子之信可事也小人實不才若果行此其鄭國實頼之豈唯二三臣仲尼聞是語也曰以是觀之人謂子産不仁吾不信也子皮欲使尹何為邑為邑大夫子産曰少未知可否子皮曰愿吾愛之不吾叛也愿謹善也叛逹也使夫徃而學焉夫亦愈知治矣夫謂尹何子産曰不可人之愛人求利之也今吾子愛人則以政猶未能操刀而使割也其傷實多子之愛人傷之而己其誰敢求愛於子子於鄭國棟也棟折榱崩僑將厭焉敢不盡言子有美錦不使人學製焉大官大邑身之所庇也而使學者製焉其為美錦不亦多乎言視美錦之重多於官邑僑聞學而後入政未聞以政學者也若果行此必有所害譬如田獵射御貫則能獲禽貫習也若未嘗登車射御則敗績厭覆是懼何暇思獲子皮曰善哉虎不敏吾聞君子務知大者逺者小人務知小者近者我小人也衣服附在吾身我知而慎之大官大邑所以庇身也我逺而慢之㣲子之言吾不知也他日我曰子為鄭國我為吾家以庇焉其可也今而後知不足自今請雖吾家聽子而行子産曰人心之不同如其面焉吾豈敢謂子面如吾面乎抑心所謂危亦以告也子皮以為忠故委政焉子産是以能為鄭國傳言子產之治乃子皮之力衛侯在楚北宫文子見令尹圍之威儀言於衛侯曰今尹似君矣將有他志雖獲其志不能終也詩曰靡不有初鮮克有終終之實難令尹其將不免公曰子何以知之對曰詩云敬慎威儀惟民之則令尹無威儀民無則焉民所不則以在民上不可以終公曰善哉何謂威儀對曰有威而可畏謂之威有儀而可象謂之儀君有君之威儀其臣畏而愛之則而象之故能有其國家令聞長世臣有臣之威儀其下畏而愛之故能守其官職保族宜家順是以下皆如是是以上下能相固也衞詩曰威儀棣棣不可選也詩邶風棣棣富而閒也選數也言君臣上下父子兄弟内外大小皆有威儀也周詩曰朋友攸攝攝以威儀詩大雅攸所也攝佐也言朋友之道必相敎訓以威儀也周書數文王之德曰周書武成大國畏其力小國懐其德言畏而愛之也詩云不識不知順帝之則言則而象之也大雅又言文王行事無所斟酌惟在則象上天紂囚文王七年諸侯皆從之囚紂於是乎懼而歸之可謂愛之文王伐崇再駕而降為臣蠻夷帥服可謂畏之文王之功天下誦而歌舞之可謂則之文王之行至今為法可謂象之有威儀也故君子在位可畏施舎可愛進退可度周旋可則容止可觀作事可法德行可象聲氣可樂動作有文言語有章以臨其下謂之有威儀也日講春秋解義卷四十六
