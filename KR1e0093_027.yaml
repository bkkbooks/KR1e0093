body:
  text: 欽定四庫全書日講春秋解義卷二十七宣公公名倭一名接又作委文公子毋敬嬴諡法善問周逹曰宣周匡王五年魯宣公二年匡王崩弟定王立鄭穆公二十年魯宣公三年穆公卒靈公夷立宣四年靈公弒弟襄公堅立齊惠公元年魯宣公十年惠公卒子頃公無野立宋詳見文公三年晉靈公繼霸十三年趙盾為政魯宣公二年靈公弒成公黑臀立宣八年郤缺為政宣九年成公卒子景公獳立宜十一年荀林父為政宣十六年士㑹為政宣十七年郤克為政衛成公二十七年魯宣公九年成公卒子穆公速立蔡文公四年魯宣公十七年文公卒子景公固立曹文公十年魯宣公十四年文公卒子宣公廬立陳靈公六年魯宣公十年靈公弒子成公午立杞桓公二十九年薛詳見僖公元年莒季他元年邾定公六年許昭公十四年魯宣公十七年昭公卒靈公立小邾詳見僖公元年楚莊王六年魯宣公十一年盟辰陵討陳春秋始子楚莊王以霸宣十一年楚孫叔敖為令尹宣十二年敗晉于邲宣十八年莊王卒子共王立秦共公元年魯宣公四年共公卒桓公立吳詳見隱公元年及成公元年越詳見隱公元年欽定四庫全書日講春秋解義卷二十七宣公名倭一名接又作委文公之子母敬嬴以匡王五年即位諡法善問周逹曰宣元年春王正月公即位公羊傳繼弒君不言即位此其言即位何其意也穀梁傳繼故而言即位與聞乎故也宣公為弒君者所立受之而不討賊則是與聞乎弒也故如其意而書即位以著其罪公子遂如齊逆女左傳元年春王正月公子遂如齊逆女尊君命也諸侯之卿出入稱名氏所以尊君命也宣公斬焉在疚乃遣同惡之大夫如齊逆女經書之以著敬嬴仲遂請齊立接之本謀又以見齊元無道黨亂臣而使弒其君也隂謀篡弒而急於昏齊以定其位此惡之大者至於卿逆之非禮則亦不待貶絶而見矣三月遂以夫人婦姜至自齊左傳三月遂以夫人婦姜至自齊尊夫人也遂不言公子替其尊稱所以成小君之尊也公羊傳遂何以不稱公子一事而再見者卒名也卒竟也竟但舉名者省文夫人何以不稱姜氏貶曷為貶譏喪娶也喪娶者公也則曷為貶夫人內無貶於公之道也明下無貶上之義內無貶于公之道則曷為貶夫人夫人與公一體也其稱婦何有姑之辭也穀梁傳其不言氏喪未畢故略之也其曰婦緣姑言之之辭也遂之挈由上致之也挈者謂去氏族而直書名上謂宣公夫人不氏與有罪也古者一禮不備貞女不行夫人不能以禮自固而茍從焉非正矣稱婦者蓋有姑則以婦禮至無姑則專以夫人禮至出姜既絶而歸齊而曰婦姜著敬嬴之速以姑自居也夏季孫行父如齊左傳夏季文子如齊納賂以請㑹宣公篡立未列于㑹故以賂請之據左氏納賂以請㑹也下書公㑹齊侯于平州則知此㑹乃行父請之矣又書齊人取濟西田則知請以賂矣仲遂弒君宣公篡立行父不能討反為之使齊而納賂焉魯人乃以為賢觀春秋所書則其惡不可掩矣晉放其大夫胥甲父于衛左傳晉人討不用命者放胥甲父于衛胥甲下軍佐文十二年戰河曲不肯薄秦于險而立胥克克甲之子先辛奔齊先辛甲之屬大夫公羊傳放之者何猶曰無去是云爾羈置之不令去其地然則何言爾近正也此其為近正奈何古者大夫已去三年待放三年者古者疑獄三年而後斷自嫌有罪當誅故三年不敢去君放之非也大夫待放正也河曲之戰距今八年晉始放胥甲父所謂待而後放者故曰近正古者臣有大喪則君三年不呼其門已練可以辨冕辨皮辨爵辨也加旒曰冕服金革之事君使之非也臣行之禮也此與君放之非臣待君放正同故引同類相發明閔子要絰而服事既而曰若此乎古之道不即人心既事畢言古者不敢斥言君即近也退而致仕孔子蓋善之也善其服事外得事君之義致仕內不失親親之恩穀梁傳放猶屏也稱國以放放無罪也稱國以放君與當國大夫主之也河曲之戰撓臾駢之謀而以偏師獨出者趙穿也若討不用命則穿當為首專治軍門之呼則穿與胥甲父同罪可也趙盾當國乃庇穿而蔽罪於甲父晉侯於是為失政而桃園之逆志固萌於此矣公㑹齊侯于平州平州杜注齊地在泰山牟縣西今山東萊蕪縣西有平州城左傳㑹于平州以定公位春秋之世篡立者已列於諸侯則不復致討故季孫行父如齊請㑹而齊侯為㑹以定之夫以齊之彊與魯為鄰其力足以正魯而始徇仲遂之謀繼為平州之㑹非特貪賂失其本心抑以乘亂得國與魯宣之迹相類故同惡相濟耳然欲定其位者魯宣也宜稱及齊而曰㑹者乃治亂臣賊子必先究其黨與之義公子遂如齊左傳東門襄仲如齊拜成遂與行父既再見於經矣如齊拜成削之可也而必書者以著遂為首惡也總其始終直書於䇿而義自見矣六月齊人取濟西田濟西杜注故曹地僖公三十一年晉文以分魯左傳六月齊人取濟西之田為立公故以賂齊也公羊傳外取邑不書此何以書所以賂齊也曷為賂齊為弒子赤之賂也穀梁傳內不言取言取授之也以是為賂齊也濟西之田魯所以賂齊而經書齊人取之者蔽其罪於齊也篡弒之惡茍有人心者所同惡也商人弒立齊惠公惡之終不曰公曰夫已氏何獨至於魯接而不惡且助其邪謀而終定其位耶溺於濟田之賂耳許田入鄭而桓篡成郜鼎入魯而督罪釋濟西入齊而宣位定見諸行事可謂深切著明矣秋邾子來朝邾自僖文之世常與魯抗今宣篡立而反朝之蓋畏齊魯之交合也何以無貶乎既於朝桓貶矣公羊曰其餘從同楚子鄭人侵陳遂侵宋左傳宋人之弒昭公也在文十六年晉荀林父以諸侯之師伐宋在文十七年宋及晉平宋文公受盟于晉又㑹諸侯于扈將為魯討齊二扈盟在文十五年十七年皆取賂而還鄭穆公曰晉不足與也遂受盟于楚陳共公之卒在文十二年楚人不禮焉陳靈公受盟于晉十四年新城十五年十七年兩盟扈秋楚子侵陳遂侵宋穀梁傳遂繼事也鄭本以晉人失賊不討棄晉即楚使能以楚師討宋問昭公之故使宋以鮑為戮而改立君則大義伸於天下矣今乃侵陳以及宋則附楚以亟病中國耳宋者中國之樞紐也楚服陳鄭而宋不屈則不能與晉爭霸書遂侵宋著其志不在陳也猶齊桓之書遂伐楚著其志不在蔡也晉趙盾帥師救陳左傳晉趙盾帥師救陳宋穀梁傳善救陳也楚鄭連兵憑陵上國陳先代之後無罪被侵晉能同惡相恤故褒而書救傳言師救陳宋而經不書宋者宋人負弒君之罪晉受賂不討今雖救宋義不足稱若概書陳宋則典刑紊矣宋公陳侯衛侯曹伯㑹晉師于棐林伐鄭棐公羊作斐棐林杜注鄭地滎陽宛陵縣東南有林鄉今林鄉城在河南新鄭縣東左傳㑹于棐林以伐鄭也楚蒍賈救鄭遇于北林與晉師相遇北林杜注鄭地滎陽中牟縣西南有林亭今屬河南開封府囚晉解揚解揚晉大夫晉人乃還公羊傳此晉趙盾之師也曷為不言趙盾之師君不㑹大夫之辭也時諸侯為趙盾所㑹不與其以卑致尊故正之穀梁傳列數諸侯而㑹晉趙盾大趙盾之事也大其攘楚其曰師何也以其大之也師者衆大之辭于棐林地而後伐鄭疑辭也此其地何則著其美也言似伐鄭有疑須㑹乃定又决之曰非也欲明趙盾之功故詳録其㑹地爾上書晉趙盾帥師救陳此書㑹晉師文相䝉也胡氏謂使列數諸侯而㑹晉趙盾則臣疑於君而不可訓此本公羊君不㑹大夫之說考之於經似不盡協文十四年盟新城以晉趙盾列數於諸侯之下未嘗以臣疑於君為嫌也至地而後伐乃㑹師伐國之事實春秋舉大綱示邪正豈為聚謀與不聚謀而異義乎故穀梁以棐林為疑辭此為著美亦非也冬晉趙穿帥師侵崇崇公羊作栁地譜商有崇國侵書趙穿而後凡役皆書大夫左傳晉欲求成于秦趙穿曰我侵崇秦急崇必救之崇秦之與國吾以求成焉冬趙穿侵崇秦弗與成公羊傳栁者何天子之邑也曷為不繫乎周不與伐天子也崇秦與國晉欲求成于秦反侵其所與益其怒而重其怨謀不若是拙也蓋趙穿已有逆心欲得兵柄而托伐國以用其衆盾為正卿必主是謀桃園之變盾之與聞乎故也審矣晉人宋人伐鄭左傳晉人伐鄭以報北林之役于是晉侯侈趙宣子為政驟諫而不入故不競于楚為明年鄭伐宋張本穀梁傳伐鄭所以救宋也時楚鄭侵宋宋怨鄭與楚之侵復請伐鄭晉以前救無功遂與連兵夫惟德與禮可以服人宋人弒君晉受賂不討反為之興師以修怨宜鄭之終不服也二年春王二月壬子宋華元帥師及鄭公子歸生帥師戰于大棘宋師敗績獲宋華元戰皆書大夫帥師自此始大棘杜注宋地在陳留襄邑縣南今河南睢州西有棘城左傳二年春鄭公子歸生受命于楚伐宋宋華元樂呂御之二月壬子戰于大棘宋師敗績囚華元獲樂呂及甲車四百六十乘俘二百五十人馘百人狂狡輅鄭人狂狡宋大夫輅迎也鄭人入于井倒㦸而出之獲狂狡因倒㦸反為鄭人所禽君子曰失禮違命宜其為禽也戎昭果毅以聽之之謂禮昭謂明曉軍法務在殺敵聽謂常存于耳著于心殺敵為果致果為毅易之戮也致謂必行也易反易將戰華元殺羊食士其御羊斟不與及戰曰疇昔之羊子為政疇昔前日也為政猶言為主今日之事我為政與入鄭師故敗君子謂羊斟非人也以其私憾敗國殄民于是刑孰大焉詩所謂人之無良者詩小雅其羊斟之謂乎殘民以逞宋人以兵車百乘文馬百駟畫馬為文四百匹以贖華元于鄭半入華元逃歸立于門外告而入告宋城門而後入言不茍見叔牂曰子之馬然也叔牂羊斟也華元見而慰之對曰非馬也其人也叔牂知前言已顯故不敢讓罪既合而來奔合猶答也宋城華元為植巡功植將主也城者謳曰睅其目皤其腹棄甲而復于思于思棄甲復來睅出目皤大腹于思多鬢之貌使其驂乘謂之曰牛則有皮犀兕尚多棄甲則那那何也役人曰從其有皮丹漆若何華元曰去之夫其口衆我寡傳言華元不吝其過寬而容衆穀梁傳獲者不與之辭也華元得衆甚賢故不與鄭獲之言盡其衆以救其將也以三軍敵華元華元雖獲不病矣將帥見獲師敗可知不當復書師敗績此兩書之者明宋師懼華元見獲皆竭力救之得衆如是雖師敗身獲適彰其美不病其賢也春秋常例受伐者為主故書宋及通經書戰三十四惟此年戰于大棘及晉趙鞅鄭罕逹戰于鐵兩國並書帥師其衆敵也書獲者七惟華元及齊國書兼書師敗績身見獲而師又敗也大夫生死皆曰獲鄭獲華元生也吳獲陳夏齧獲齊國書死也蓋存之殺之皆在既獲之後故書法如此秦師伐晉左傳秦師伐晉以報崇也伐崇在元年遂圍焦焦杜注晉河外邑括地志陜縣有故焦城在今河南陜州城內城濮之戰晉得秦以挫楚所以伯也自秦晉相惡滅庸之役秦為楚用而趙穿復無故侵崇以挑秦師秦晉之爭復起而楚得專意於北方此晉所以力屈而不支也趙盾才臣豈慮不及此其隂縱穿之邪謀而養成其羽翼情不可掩矣夏晉人宋人衛人陳人侵鄭左傳夏晉趙盾救焦遂自隂地及諸侯之師侵鄭隂地杜注晉河南山北自上洛以東至陸渾上洛今陜西雒南縣陸渾今河南嵩縣以報大棘之役楚鬬椒救鄭曰能欲諸侯而惡其難乎遂次于鄭以待晉師趙盾曰彼宗競于楚殆將斃矣競强也鬬椒若敖之族自子文以來世為令尹姑益其疾乃去之欲示弱以驕之傳言趙盾畏楚而還所以貶稱人且為四年楚滅若敖氏張本胡氏安國謂晉為盟主盾合諸侯之師何畏乎楚何避乎鬬椒以始謀不臧受宋之賂釋罪不討理曲故避之以去義雖正大而非情事之實也方是時盾與靈公猜釁巳成欲握兵柄托於伐國實無鬭心故棐林之役楚囚解揚晉即還師是役復謬為之辭以避鬭椒蓋恐戰而不勝則威權為之損不若全師以退以隂結國人之心而濟其亂謀耳左氏乃謂晉侯侈趙盾驟諌不入是以不競于楚失其實矣秋九月乙丑晉趙盾弒其君夷皋皋公羊作獆左傳晉靈公不君厚斂以雕牆從臺上彈人而觀其辟丸也宰夫胹熊蹯不熟胹煮也殺之置諸畚畚以草索為之筥屬使婦人載以過朝趙盾士季見其手士季隨㑹也問其故而患之將諫士季曰諫而不入則莫之繼也㑹請先不入則子繼之三進及澑而後視之三進三伏公不省而又前也澑屋霤也公知欲諫故佯不視曰吾知所過矣將改之稽首而對曰人誰無過過而能改善莫大焉詩曰靡不有初鮮克有終詩大雅夫如是則能補過者鮮矣君能有終則社稷之固也豈唯羣臣賴之又曰衮職有闕惟伸山甫補之能補過也詩大雅衮君之上服闕過也君能補過衮不廢矣無廢職猶不改宣子驟諌公患之使鉏麑賊之鉏麑晉力士晨往寢門闢矣盛服將朝尚早坐而假寐麑退嘆而言曰不忘恭敬民之主也賊民之主不忠棄君之命不信有一于此不如死也觸槐而死秋九月晉侯飲趙盾酒伏甲將攻之其右提彌明知之右車右趨登曰臣侍君宴過三爵非禮也遂扶以下公嗾夫獒焉獒猛犬嗾使犬也明搏而殺之盾曰棄人用犬雖猛何為鬬且出提彌明死之初宣子田于首山舍于翳桑翳桑桑之多䕃翳者首山杜注在河東蒲坂縣東南即首陽山在今山西蒲州東南見靈輒餓靈輒晉人問其病曰不食三日矣食之舍其半問之曰宦三年矣宦學也未知母之存否今近焉去家近請以遺之使盡之而為之簞食與肉簞竹器圓曰簞方曰笥置諸橐以與之既而與為公介靈輒為公甲士倒㦸以禦公徒而免之問何故對曰翳桑之餓人也問其名居不告而退遂自亡也輒亦去乙丑趙穿攻靈公于桃園乙丑九月二十七日宣子未出山而復山晉竟之山也太史書曰趙盾弒其君以示于朝宣子曰不然對曰子為正卿亡不越竟反不討賊非子而誰宣子曰嗚呼我之懷矣自詒伊戚其我之謂矣逸詩也言人多所懷戀則自詒憂孔子曰董狐古之良史也書法不隱趙宣子古之良大夫也為法受惡惜也越竟乃免越竟則君臣之義絶可以不討賊宣子使趙穿逆公子黑臀于周而立之黑臀晉文公子壬申朝于武宫穀梁傳穿弒也盾不弒而曰盾弒何也以罪盾也其以罪盾何也曰靈公朝諸大夫而暴彈之暴殘暴觀其辟丸也趙盾入諌不聽出亡至于郊趙穿弒公而後反趙盾史狐書賊曰趙盾弒公盾曰天乎天乎豫無罪孰為盾而忍弒其君者乎史狐曰子為正卿入諌不聽出亡不逺君弒反不討賊則志同志同則書重非子而誰故書之曰晉趙盾弒其君夷皋者過在下也稱臣以弒罪在下也不言罪而言過者言非盾親弒有不討賊之過曰于盾也見忠臣之至于許世子止見孝子之至盾以亡不越竟反不討賊受弒君之罪忠不至故也止以病不知嘗藥受弒父之罪孝不至故也春秋加弒于二人以見忠孝不至則被惡名欲使忠臣觀之不敢惜力孝子觀之必盡其心是將來之逺防也趙穿親弒其君董狐歸獄於盾曰子為正卿亡不越竟反不討賊非子而誰蓋亡而越竟則賊之不討猶或勢格力屈而莫可如何也反不討賊則志同志同則書重此晉史之文所以合於聖心而以垂大法也况盾受寄託而外求君嗣子之立本非其意及公既長而惡盾之專則君臣之嫌釁已非一朝夕之故矣故齊商人宋鮑弒君篡國盾皆合諸侯而不討且定其位則其無君之心蓄之素矣盾方出亡而桃園之禍隨作反國之後豈惟不能討賊且使穿逆新君是盾處心積慮成於弒也故先儒胡安國之言曰以魏高貴鄉公之事觀焉抽戈者成濟倡謀者賈充而當國者司馬昭也為天吏者將原司馬昭之心而誅之乎抑將致辟成濟而止也此義不明則亂臣賊子皆得以詭計獲免而至愚無知如鄧扈樂史太之徒皆䝉歸獄而受戮焉王法乖天理息矣故曰春秋成而亂臣賊子懼附録左傳初驪姬之亂在僖四年詛無畜羣公子詛盟誓自是晉無公族無公子故廢公族之官及成公即位乃宦卿之適子而為之田以為公族宦仕也為置田邑以為公族大夫又宦其餘子亦為餘子餘子適子之母弟也亦治餘子之政其庶子為公行庶子妾子也掌率公戎行晉于是有公族餘子公行皆官名趙盾請以括為公族括趙盾異母弟趙姬之中子屏季也曰君姬氏之愛子也趙姬文公女成公姊也微君姬氏則臣狄人也公許之盾狄外孫姬氏逆之以為適事見僖公二十四年冬趙盾為旄車之族旄車公行之官盾本卿適其子當為公族辟屏季故更掌旄車使屏季以其故族為公族大夫盾以其故官屬與屏季使為衰之適冬十月乙亥天王崩三年春王正月郊牛之口傷改卜牛牛死乃不郊猶三望左傳三年春不郊而望皆非禮也望郊之屬也不郊亦無望可也例在僖三十一年復發傳者嫌牛死與卜不從異公羊傳其言之何緩也成七年鼷鼠食郊牛角不言郊牛之角而此言郊牛之口傷者不若食角急也書者譏宣公飬牲不謹敬曷為不復卜據定十五年牛死改卜牛養牲養二卜帝牲不吉則扳稷牲而卜之帝天帝不吉者有災先卜帝牲養之有災更引稷牲卜以為天牲養之凡當二卜復不吉則不郊帝牲在于滌三月滌宮名養帝牲三牢之處謂之滌者取具蕩滌清潔于稷者唯具是視視其身體具無災害而已不特養于滌宫所以降稷尊帝郊則曷為必祭稷王者必以其祖配王者則曷為必以其祖配自內出者無匹不行匹合也自外至者無主不止必得主人乃止天道幽逺故推人道以接之穀梁傳之口緩詞也傷自牛作也牛自傷口非備災之道不至也故以緩詞言之事之變也乃者亡乎人之辭也重發傳者嫌牛死與卜郊不從異也諸侯宗廟社稷之祭俎豆既陳聞王及后之喪則廢禮也天王崩於十月告喪於魯史䇿巳書乃斬衰奔赴之時而僭用郊祀所謂失禮之中又失禮也乃不郊者以在滌之牛口傷而改卜之牛又死也不然郊矣春秋之書微而顯此類是也猶三望者可巳不當為之辭葬匡王四越月而葬其禮略也㑹葬不書卿微者也書之見王室之微諸侯之慢王也附録左傳晉侯伐鄭及郔鄭及晉平士㑹入盟郔杜注鄭地今河南延津縣為夏楚侵鄭傳楚子伐陸渾之戎陸公羊作賁公羊穀梁無之字左傳楚子伐陸渾之戎在伊川遂至于雒雒水杜注出上雒冢領山至河南鞏縣入河觀兵于周疆定王使王孫滿勞楚子王孫滿周大夫楚子問鼎之大小輕重焉示欲逼周取天下對曰在德不在鼎昔夏之方有德也禹之世逺方圖物圖畫山川奇異之物而獻之貢金九牧使九州之牧貢金鑄鼎象物象所圖物著之于鼎百物而為之備使民知神姦圖鬼神百物之形使民逆偹之故民入川澤山林不逢不若若順也不遇妖怪不順之物螭魅罔兩螭山神獸形魅怪物罔兩水神莫能逢之用能協于上下以承天休桀有昏德鼎遷于商載祀六百載祀皆年商紂暴虐鼎遷于周德之休明雖小重也不可遷其姦回昏亂雖大輕也言可移天祚明德有所底止底致也成王定鼎于郟鄏郟鄏杜注今河南也武王遷之成王定之卜世三十卜年七百天所命也周德雖衰天命未改鼎之輕重未可問也楚與陸渾之戎本無夙憾今無故伐之而觀兵周疆且問鼎之輕重其黠驁無王之罪著矣內外傳皆以楚莊為賢不知其終身之小善不足以蓋此大惡也先儒以稱爵為褒觀此則知其必不可通矣夏楚人侵鄭左傳夏楚人侵鄭鄭即晉故也晉靈徇貨黨賊以失鄭趙盾合諸侯以侵之而不能服今成公即位息兵踰年而鄭人棄楚即晉蓋知楚氛日熾有蠶食陳鄭之心而欲依霸國以自固也秋赤狄侵齊地譜洺州春秋赤狄之地赤狄始見經赤狄隗姓其地在潞州以北近晉而逺於齊忽舉侵齊之師知晉之無能為也楚橫於南狄擾於北以中國之無霸耳宋師圍曹左傳宋文公即位三年殺母弟須及昭公子武氏之謀也使戴桓之族攻武氏于司馬子伯之館盡逐武穆之族事竝在文十八年武穆之族以曹師伐宋秋宋師圍曹報武氏之亂也宋鮑篡弒得國逐武穆之族二族以曹師伐宋春秋不書非討罪不足書也鮑不知自反恃衆彊以逞志於曹不待貶而惡見矣冬十月丙戌鄭伯蘭卒左傳冬鄭穆公卒初鄭文公有賤妾曰燕姞姞南燕姓夢天使與已蘭蘭香草曰余為伯鯈余而祖也伯鯈南燕祖以是為而子以蘭為女子名以蘭有國香人服媚之如是媚愛也欲令人愛之如蘭既而文公見之與之蘭而御之辭曰妾不才幸而有子將不信敢徵蘭乎懼將不見信故欲計所賜蘭為懷子月數公曰諾生穆公名之曰蘭文公報鄭子之妃曰陳媯鄭子文公叔父子儀也漢律淫季父之妻曰報生子華子臧子臧得罪而出出奔宋誘子華而殺之南里事在僖十六年南里杜注鄭地使盜殺子臧于陳宋之間在僖二十四年又娶于江生公子士朝于楚楚人鴆之及葉而死葉杜注楚地南陽葉縣今河南葉縣南有古城又娶于蘇生子瑕子俞彌俞彌早卒泄駕惡瑕泄駕鄭大夫文公亦惡之故不立也公逐羣公子公子蘭奔晉從晉文公伐鄭在僖三十年石癸曰石癸鄭大夫吾聞姬姞耦其子孫必蕃姞姓宜為姬配耦姞吉人也后稷之元妃也姞姓之女為后稷妃周是以興故曰吉人今公子蘭姞甥也天或啓之必將為君其後必蕃先納之可以亢寵亢極也與孔將鉏侯宣多納之盟于太宫而立之太宮鄭祖廟以與晉平穆公有疾曰蘭死吾其死乎吾所以生也刈蘭而卒傳言穆氏所以大興于鄭天所啓也葬鄭穆公穆公羊作繆不月闕文也葬速禮不備也四年春王正月公及齊侯平莒及郯莒人不肯公伐莒取向郯國名今山東郯城縣西南有故城向杜注莒邑寰宇志莒州南有向城今屬山東青州府左傳四年春公及齊侯平莒及郯莒人不肯公伐莒取向非禮也平國以禮不以亂伐而不治亂也責公不先以禮治之而用伐以亂平亂何治之有無治何以行禮公羊傳此平莒也其言不肯何辭取向也為公取向作辭也穀梁傳及者內為志焉爾平者成也不肯者可以肯也伐猶可取向甚矣莒人辭不受治也伐莒義兵也討不釋怨取向非也乘義而為利也周官合方氏掌除邦國之怨惡則釋四鄰之怨而成其好固義所當為也然必已之義可以服人然後人能降心以相從魯宣齊惠身為大惡茍有人心者莫不藏惡况莒郯相怨魯乃挾齊之威要以必從則莒人之不肯宜也又以兵加莒而取其邑則惡甚於齊惠矣秦伯稻卒夏六月乙酉鄭公子歸生弒其君夷左傳楚人獻黿于鄭靈公穆公大子夷也公子宋與子家將見宋子公也子家歸生子公之食指動第二指也以示子家曰他日我如此必嘗異味及入宰夫將解黿相視而笑公問之問所笑子家以告及食大夫黿召子公而弗與也欲使指動無效子公怒染指于鼎嘗之而出公怒欲殺子公子公與子家謀先先公為難子家曰畜老猶憚殺之六畜而况君乎反譖子家子家懼而從之夏弒靈公書曰鄭公子歸生弒其君夷權不足也子家權不足以禦亂懼譖而從弒君故書以首惡君子曰仁而不武無能逹也初稱畜老仁也不討子公是不武也故不能自通于仁道而陷弒君之罪凡弒君稱君君無道也稱臣臣之罪也鄭人立子良穆公庶子辭曰以賢則去疾不足去疾子良名以順則公子堅長乃立襄公襄公堅也襄公將去穆氏逐羣兄弟而舍子良以其讓已子良不可曰穆氏宜存則固願也若將亡之則亦皆亡去疾何為乃舍之皆為大夫歸生身為正卿久執兵柄聞宋之逆謀執而誅之猶反手耳宋有逆志而與歸生謀先必知其夙有無君之心也聞而不禁則賊由歸生審矣觀鄭人討亂斫子家之棺則當時國論固以為首惡非孔子作春秋而後歸獄也赤狄侵齊以齊之彊而洺州之狄連歲侵之晉霸之衰與齊之無政竝見矣秋公如齊公至自齊宣公篡弒齊實縱之故既以田賂復僕僕而往朝焉㑹盟書至始於桓公之盟唐朝大國而書至始於宣公之如齊蓋由二公身為大惡有自危之心以得返為幸故特行飲至之禮耳附録左傳初楚司馬子良生子越椒子文曰子文子良兄必殺之是子也熊虎之狀而豺狼之聲弗殺必滅若敖氏矣諺曰狼子野心是乃狼也其可畜乎子良不可子文以為大戚及將死聚其族曰椒也知政乃速行矣無及于難且泣曰鬼猶求食若敖氏之鬼不其餒而而語助言必餒及令尹子文卒鬬般為令尹般子文之子子揚子越為司馬子越即越椒蒍賈為工正譖子揚而殺之子越為令尹己為司馬賈為椒譖子揚而已得椒位子越又惡之惡賈乃以若敖氏之族圄伯嬴于轑陽而殺之圄囚也伯嬴蒍賈也轑陽杜注楚邑遂處蒸野將攻王王以三王之子為質焉弗受蒸野杜注楚邑三王文成穆師于漳澨漳澨杜注漳水邊漳水出新城沶鄉縣至當陽縣與沮水合秋七月戊戌楚子與若敖氏戰于皋滸皋滸杜注楚地伯棼射王汏輈及鼓跗著于丁寧伯棼越椒也輈車轅汏過也箭過車轅上跗所以架鼓丁寧鉦也又射汰輈以貫笠轂兵車無蓋尊者則邊人執笠依轂而立以禦寒暑名曰笠轂此言箭過車轅及王之蓋師懼退王使巡師曰吾先君文王克息獲三矢焉伯棼竊其二盡于是矣所以釋楚師之懼心鼓而進之遂滅若敖氏初若敖娶于䢵䢵杜注國名今湖廣安陸縣有鄖城生鬬伯比若敖卒從其母畜于䢵淫于䢵子之女生子文焉䢵夫人使棄諸夢中夢杜注澤名江夏安陸縣有雲夢城今湖廣雲夢縣治虎乳之䢵子田見之懼而歸夫人以告遂使收之楚人謂乳穀謂虎於菟故命之曰鬭穀於菟以其女妻伯比實為令尹子文其孫針尹克黃針尹官名克黃子揚之子使于齊還及宋聞亂其人曰不可以入矣針尹曰棄君之命獨誰受之言雖奔他國獨誰受此棄命之人君天也天可逃乎遂歸復命而自拘于司敗王思子文之治楚國也曰子文無後何以勸善使復其所改命曰生易其名言更生冬楚子伐鄭左傳冬楚子伐鄭鄭未服也前年楚侵鄭不獲成故胡氏安國謂歸生弒君諸侯未有致討者而楚人至焉故書爵以與之然商臣之次厥貉楚子旅之觀兵問鼎竝以爵書則春秋無以書爵為褒之義明矣自宣成而下楚勢益張故君將則稱君大夫將乃稱人耳日講春秋解義卷二十七
