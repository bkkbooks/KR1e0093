body:
  text: 欽定四庫全書日講春秋解義卷四十一襄公十有七年春王二月庚午邾子牼卒牼公羊穀梁作瞷去年晉執以歸此書卒者蓋晉尋釋之不書其歸不告也宋人伐陳左傳十七年春宋莊朝伐陳獲司徒卬卑宋也司徒卬陳大夫卑宋不設偹宣十二年宋師伐陳為晉討貳也此年宋人伐陳考之左氏不見二國致釁之由而陳自逃歸後不復與諸侯㑹其亦以晉命伐之歟夏衛石買帥師伐曹左傳衞孫蒯田于曹隧越竟而獵蒯林父之子飲馬于重丘重丘杜注曹邑寰宇記重丘在乗氏縣東北今山東曹縣東北有乗氏故城毁其瓶重丘人閉門而訽之訽罵也曰親逐而君爾父為厲厲惡鬼林父逐君在十四年是之不憂而何以田為夏衞石買孫蒯伐曹買石稷子孫蒯不書非卿取重丘曹人愬于晉為明年晉人執石買𫝊孫蒯犯上之臣越境田獵而遭曹人之辱不内自省乃挾貴卿將重兵以攻其國何義乎秋齊侯伐我北鄙圍桃桃公羊作洮杜注弁縣東南有桃虛齊髙厚帥師伐我北鄙圍防高厚上左氏無齊字左傳齊人以其未得志于我故前年圍郕辟孟孺子秋齊侯伐我北鄙圍桃高厚圍臧紇于防防臧紇邑師自陽闗逆臧孫至于旅松陽闗杜注在泰山鉅平縣東今山東寕陽縣東北有陽闗故城旅松杜注近防地魯師畏齊不敢至防郰叔紇臧疇臧賈帥甲三百宵犯齊師送之而復郰叔紇叔梁紇臧疇臧賈臧紇之昆弟也三子與臧紇共在防故夜送臧紇于旅松而復還守防齊師去之失臧紇故齊人獲臧堅堅臧紇之族齊侯使夙沙衞唁之且曰無死堅稽首曰拜命之辱抑君賜不終姑又使其刑臣禮于士以杙抉其傷而死言使賤人来唁已是恵賜不終也夙沙衞奄人故謂之刑臣杙小木也椽屬齊君臣同来伐魯異道而進分圍二邑類而書之其恃衆暴寡可見矣九月大雩宋華臣出奔陳左傳宋華閲卒華臣弱皋比之室臣閲之弟皋比閲之子弱侵易之使賊殺其宰華吴賊六人以鈹殺諸盧門合左師之後盧門宋城門合向戍邑後屋後左師懼曰老夫無罪賊曰皋比私有討于吴遂幽其妻幽吴妻也曰畀余而大璧宋公聞之曰臣也不唯其宗室是暴大亂宋國之政必逐之左師曰臣也亦卿也大臣不順國之恥也不如蓋之乃舍之左師為己短䇿苟過華臣之門必騁惡之十一月甲午國人逐瘈狗瘈狗入于華臣氏國人從之華民懼遂奔陳瘈狗狂狗也華臣心不自安見逐狗而驚走華臣暴亂宗室國討不加懼而出奔失政刑矣君子違不適仇國陳方仇宋而臣奔焉尤可誅也冬邾人伐我南鄙左傳冬邾人伐我南鄙為齊故也魯之四鄙莒伐其東齊伐其北邾伐其南其不振亦甚矣邾之先君以伐魯見執於晉故嗣子叛晉與齊在喪而興師以修怨也此祝柯之㑹所以復見執與附録左傳宋皇國父為大宰為平公築臺妨于農收周十一月今九月收歛時子罕請俟農功之畢公弗許築者謳曰澤門之晳實興我役澤門宋東城南門也皇國父白晳而居近澤門邑中之黔實慰我心子罕黑色而居邑中子罕聞之親執扑以行築者扑杖而抶其不勉者曰吾儕小人皆有闔廬以辟燥濕寒暑今君為一臺而不速成何以為役謳者乃止或問其故子罕曰宋國區區而有詛有祝禍之本也𫝊善子罕分謗齊晏桓子卒晏嬰父也晏嬰麤縗斬斬不緝之也縗在胸前麤三升布苴絰帶杖菅屨苴麻之有子者取其麤也杖竹杖菅屨草屨食鬻居倚廬寢苫枕草此禮與士喪禮畧同鬻謂朝一溢米暮一溢米倚廬倚東牆而為之苫編草也王儉云夏枕凷冬枕草其老曰非大夫之禮也曰唯卿為大夫晏子惡直已以斥時失禮故孫辭畧答家老十有八年春白狄来左傳十八年春白狄始来白狄狄之别名公羊傳白狄者何夷狄之君也何以不言朝不能朝也不書朝者不能行朝禮也春秋據事直書因其来而接之則書来義與介葛盧同夏晉人執衞行人石買左傳夏晉人執衞行人石買于長子執孫蒯于純畱長子純畱杜注二縣皆屬上黨郡純地理志作屯今俱屬山西潞安府為曹故也前年衞伐曹穀梁傳稱行人怨接于上也石買以君命聘晉晉人執之晉知買伐曹之為惡獨不知孫氏逐君之為惡乎假晉欲明天子之禁修方伯之義莫如正孫蒯之惡諸侯服矣今置所先而治所後伯討固若是乎秋齊師伐我北鄙穀梁作齊侯冬十月公㑹晉侯宋公衞侯鄭伯曹伯莒子邾子滕子薛伯杞伯小邾子同圍齊左傳秋齊侯伐我北鄙中行獻子將伐齊夢與厲公訟弗勝厲公獻子所弑者公以戈擊之首隊于前跪而戴之奉之以走見梗陽之巫皋梗陽杜注晉邑在太原晉陽縣南今山西清源縣有梗陽故城皋巫名夢竝見之他日見諸道與之言同巫亦夢見獻子與厲公訟巫曰今兹主必死若有事于東方則可以逞巫知獻子有死徵故勸使決意伐齊獻子許諾晉侯伐齊將濟河獻子以朱絲係玉二瑴雙玉曰瑴而禱曰齊環怙恃其險環齊靈公名負其衆庶棄好背盟陵虐神主神主民也曽臣彪將率諸侯以討焉彪晉平公名稱臣者明上有天子以謙告神曽臣猶末臣其官臣偃實先後之守官之臣偃獻子名苟㨗有功無作神羞官臣偃無敢復濟偃信巫言故以死自誓唯爾有神裁之沈玉而濟冬十月㑹于魯濟尋湨梁之言同伐齊齊侯禦諸平隂塹防門而守之廣里平隂杜注在濟北盧縣東北其城南有防防有門于門外作塹横行廣一里今平隂古城在山東盧縣東北夙沙衞曰不能戰莫如守險弗聼諸侯之士門焉齊人多死范宣子告析文子曰析文子齊大夫子家吾知子敢匿情乎魯人莒人皆請以車千乘自其鄉入既許之矣若入君必失國子盍圖之子家以告公公恐晏嬰聞之曰君固無勇而又聞是弗能乆矣不能乆敵晉齊侯登巫山以望晉師巫山杜注在盧縣東北今山東肥城縣西北有孝堂山即齊侯望晉師處晉人使司馬斥山澤之險雖所不至必旆而疏陳之斥候也疏建旌旗以為陳示衆也使乘車者左實右偽以旆先偽以衣服為人形也建旆以先驅輿曳柴而從之以揚塵齊侯見之畏其衆也乃脱歸脱不張旗幟丙寅晦齊師夜遁師曠告晉侯曰鳥烏之聲樂齊師其遁鳥烏得空營故樂也邢伯告中行伯曰刑伯晉大夫邢侯也中行伯獻子有班馬之聲班别也夜遁馬不相見故鳴齊師其遁叔向告晉侯曰城上有烏齊師其遁十一月丁卯朔入平隂遂從齊師夙沙衞連大車以塞隧而殿此衞所欲守險殖綽郭最曰殖綽郭最齊之勇士子殿國師齊之辱也子姑先乎乃代之殿衞殺馬于隘以塞道恨二子故塞其道欲使晉得之晉州綽及之射殖綽中肩兩矢夾脰脰頸也曰止將為三軍獲不止將取其衷射兩矢中央顧曰為私誓州綽曰有如日言必不殺女明如日乃弛弓而自後縛之反縛之其右具丙州綽之右亦舍兵而縛郭最皆衿甲面縛衿甲不觧甲坐于中軍之鼔下晉人欲逐歸者魯衞請攻險險固城守者己卯荀偃士匄以中軍克京兹京兹杜注在平隂城東南乙酉魏絳欒盈以下軍克邿欒黶死其子盈佐下軍邿杜注平隂西有邿山趙武韓起以上軍圍盧盧齊邑弗克十二月戊戌及秦周伐雍門之萩秦周魯大夫趙武及之共伐萩也雍門齊城門范鞅門于雍門其御追喜以戈殺犬于門中殺犬示間暇孟莊子斬其橁以為公琴莊子孺子速也橁木名己亥焚雍門及西郭南郭劉難士弱率諸侯之師焚申池之竹木二子晉大夫申池齊北門池壬寅焚東郭北郭范鞅門于揚門齊西門州綽門于東閭齊東門左驂迫還于東門中以枚數闔枚馬檛也闔門扇也數其板示不恐齊侯駕將走郵棠郵棠杜注齊邑今山東即墨縣南有甘棠社即古棠鄉大子與郭榮扣馬曰大子光也榮齊大夫師速而疾略也言欲略行其地無乆攻意將退矣君何懼焉且社稷之主不可以輕輕則失衆君必待之將犯之大子抽劍斷鞅乃止甲辰東侵及濰南及沂濰水經注濰水出瑯琊箕縣過東武平昌髙密淳于逕都昌入海箕縣在今莒州東武故城今為諸城縣治平昌髙宻淳于皆在今安丘縣都昌今昌邑縣也沂杜注沂水出東莞蓋縣至下邳入泗蓋縣省入沂水縣今屬山東青州府穀梁傳非圍而曰圍據實伐齊有大焉亦有病焉非大而足同焉齊非大國諸侯豈足同圍之與諸侯同罪之也亦病矣凡侵伐圍入未有書同者齊背盟主數伐小國諸侯同心圍之故特書同見衆所同惡也或疑鞌之戰晉亦為魯衞伐齊而書法各異蓋事有似同實異者鞌之戰雖曰為魯衞討其實大夫逞其私憾耳今兹伐齊則從衆欲而出師以問齊人憑陵與國之罪非為其私此聖人之特筆也曹伯負芻卒于師穀梁傳閔之也楚公子午帥師伐鄭左傳鄭子孔欲去諸大夫欲専權将叛晉而起楚師以去之使告子庚子庚弗許子庚楚令尹公子午楚子聞之使揚豚尹冝告子庚曰揚豚邑大夫名冝國人謂不穀主社稷而不出師死不從禮不能承先君之業死将不得從先君之禮不穀即位于今五年師徒不出人其以不穀為自逸而忘先君之業矣大夫圖之其若之何子庚歎曰君王其謂午懐安乎吾以利社稷也見使者稽首而對曰諸侯方睦于晉臣請嘗之若可君而繼之不可收師而退可以無害君亦無辱子庚帥師治兵于汾汾杜注襄城縣東北有汾丘城水經注潁水東歴罡丘城南故汾丘城也今襄城縣屬河南于是子蟜伯有子張從鄭伯伐齊子張公孫黒肱子孔子展子西守二子知子孔之謀二子子展子西完守入保子孔不敢㑹楚師楚師伐鄭次于魚陵魚陵杜注魚齒山也在南陽犨縣北鄭地水經注湛水源于魚齒山在今河南汝州東南右師城上棘遂渉潁次于旃然将渉潁故于水邊權築小城以為進退之備上棘郡縣志陽翟有上棘城在今河南禹州南旃然杜注旃然水出滎陽成皋縣東入汴水經注索水出京縣西南嵩渚山即古旃然水也嵩渚山在今河南滎陽縣東南蒍子馮公子格率鋭師侵費滑胥靡獻于雍梁胥靡獻于雍梁杜注皆鄭邑河南陽翟縣東北有雍氏城右回梅山梅山杜注在滎陽密縣東北今河南鄭州西南有梅山侵鄭東北至于蟲牢而反子庚門于純門信于城下而還信再宿也渉于魚齒之下杜注魚齒山之下有滍水故言渉甚雨及之楚師多凍役徒幾盡晉人聞有楚師師曠曰不害吾驟歌北風又歌南風南風不競歌者吹律以詠八風南風音㣲故曰不競也師曠唯歌南北風者聼晉楚之强弱多死聲楚必無功董叔曰晉大夫天道多在西北嵗在豕韋月又建亥故曰多在西北南師不時必無功叔向曰在其君之徳也楚之伐閒鄭伯之出也蕭魚以後楚師又加鄭而無功晉悼推誠之效亦見於此十有九年春王正月諸侯盟于祝柯柯公羊作阿祝柯杜注祝柯縣屬濟南郡按禮記武王封黄帝之後于祝即此今山東長清縣豐齊鎮北有故城左傳十九年春諸侯還自沂上盟于督揚督揚杜注即祝柯也曰大毋侵小㑹有王臣而盟無王臣則再舉諸侯㑹盟皆有王臣則不再言諸侯無王臣而再舉諸侯以閒有異事言各有當也晉人執邾子左傳執邾悼公以其伐我故伐魯在十七年邾屢伐魯不畏晉也故又執其君不言以歸舍之也執之舍之不以王命雖當其罪非正也公至自伐齊公羊傳此同圍齊也何以致伐未圍齊也未圍齊則其言圍齊何抑齊也曷為抑齊為其亟伐也或曰為其驕蹇使其世子處乎諸侯之上也即上十一年伐鄭齊世子光在莒子之上穀梁傳春秋之義已伐而盟復伐者則以伐致亳城北之類盟不復伐者則以㑹致㑹於蕭魚之類祝柯之盟盟復伐齊與曰非也然則何為以伐致也曰與人同事或執其君或取其地同與邾圍齊而晉執其君魯取其地與盟後復伐何異此與僖二十九年致圍許異辭何也蓋彼以㑹出而遂圍許以圍許為勲勞故以圍告此以伐齊出而歸以伐齊告圍乃伐之一事耳皆魯史之舊無他義也取邾田自漷水漷水杜注漷水出東海合鄉縣西南經魯國至髙平湖陸縣入泗按合鄉漢縣北齊省湖陸即湖陵在今山東魚䑓縣東北左傳遂次于泗上疆我田正邾魯之界也泗水名取邾田自漷水歸之于我邾田在漷水北今更以漷為界故曰取邾田晉侯先歸公享晉六卿于蒲圃賜之三命之服軍尉司馬司空輿尉候奄皆受一命之服賄荀偃束錦加璧乘馬先吳壽夢之鼎荀偃中軍元帥故賄之五匹為束四馬為乘壽夢吴子乘也獻鼎于魯因以為名古之獻物必有以先故今以璧馬為鼎之先荀偃癉疽生瘍于頭癉疽惡創濟河及著雍病目出大夫先歸者皆反士匄請見弗内請後曰鄭甥可鄭甥荀吴其母鄭女二月甲寅卒而視不可含目開口噤宣子盥而撫之曰事吴敢不如事主猶視欒懐子曰其為未卒事于齊故也乎乃復撫之曰主苟終所不嗣事于齊者有如河乃瞑受含宣子出曰吾淺之為丈夫也自恨以私待人公羊傳其言自漷水何以漷為竟也何言乎以漷為竟漷移也魯本與邾以漷為竟漷移入邾界魯隨而有之穀梁傳軋辭也軋委曲随漷水也言取邾田之多其不日惡盟也僖公取濟西田不言曹成公取汶陽田不言齊魯地也此言取邾田則非魯之舊而恃晉威以彊取明矣自漷水者隨漷水以為界也季孫宿如晉左傳季武子如晉拜師謝伐齊晉侯享之范宣子為政代荀偃将中軍賦黍苖黍苖詩小雅喻晉君憂勞魯國如召伯季武子興再拜稽首曰小國之仰大國也如百穀之仰膏雨焉若常膏之其天下輯睦豈惟敝邑賦六月六月亦小雅以晉侯比吉甫出征以匡王國𦵏曹成公夏衞孫林父帥師伐齊左傳晉欒魴帥師從衞孫文子伐齊欒魴欒氏族為懐子之言故十四年林父逐衞侯衎奔于齊故獨伐齊林父之惡極矣亦以病晉侯也附録左傳季武子以所得于齊之兵作林鐘而銘魯功焉林鐘律名鑄鐘聲應林鐘因以為名臧武仲謂季孫曰非禮也夫銘天子令徳天子銘徳不銘功諸侯言時計功舉得時動有功則可銘大夫稱伐銘其功伐之勞今稱伐則下等也從大夫之例于三者為下等計功則借人也言時則妨民多矣何以為銘且夫大伐小取其所得以作彝器銘其功烈以示子孫昭明徳而懲無禮也今將借人之力以救其死若之何銘之小國幸于大國而昭所獲焉以怒之亡之道也為城西郛及武城𫝊秋七月辛卯齊侯環卒環公羊作瑗左傳齊侯娶于魯曰顔懿姬無子其姪鬷聲姬生光以為大子顔鬷二姬母姓因以為號懿聲皆諡兄子曰姪諸子仲子戎子諸子諸妾姓子者二子皆宋女戎子嬖仲子生牙屬諸戎子戎子請以為大子許之仲子曰不可廢常不祥廢立嫡之常閒諸侯難閒違也光之立也列于諸侯矣今無故而廢之是専黜諸侯而以難犯不祥也君必悔之公曰在我而已遂東大子光徙之東鄙使髙厚傅牙以為大子夙沙衞為少傅齊侯疾崔杼微逆光疾病而立之光殺戎子尸諸朝非禮也婦人無刑無黥刖之刑雖有刑不在朝市謂犯死刑者猶不暴尸夏五月壬辰晦齊靈公卒莊公即位經書辛夘光定位而後赴執公子牙于句瀆之丘地名以夙沙衞易已謂衞教公易大子衞奔高唐以叛髙唐杜注在祝柯縣西北今山東禹城縣北有古高唐城晉士匄帥師侵齊至穀聞齊侯卒乃還左傳晉士匄侵齊及穀聞喪而還禮也公羊傳還者何善辭也何善爾大其不伐喪也此受命乎君而伐齊則何大乎其不伐喪大夫以君命出進退在大夫也穀梁傳還者事未畢之辭也受命而誅生死無所加其怒不伐喪善之也善之則何為未畢也君不尸小事臣不専大名善則稱君過則稱己則民作讓矣士匄外專君命故非之也然則為士匄者宜奈何宜墠帷而歸命乎介除地為墠于墠張帷反命于介介歸告君君命乃還不敢專也穀齊地還者善辭也春秋之時侵伐四出背殯帥師冒喪伐人者衆矣而士匄奉命出師聞喪而還於禮得矣穀梁氏謂禮冝墠帷而歸命于介非也使士匄未出晉境如是焉可也已至齊地則進退在士匄矣况喪必不可伐非進退可疑而待請者故詳書所至及還善之也附録左傳于四月丁未鄭公孫蠆卒赴于晉大夫范宣子言于晉侯以其善於伐秦也十四年晉伐秦子蟜見諸侯之師而勸之濟涇六月晉侯請于王正追賜之大路使以行行𦵏禮禮也八月丙辰仲孫蔑卒齊殺其大夫高厚左傳秋八月齊崔杼殺高厚于灑藍而兼其室灑藍杜注齊地書曰齊殺其大夫從君于昏也解經不言崔杼殺而為國討文殺高厚者崔杼也然莊公徳杼援立之私聽其所為而不問又以晉新行義於齊欲歸罪于高厚以為解則亦公之所欲也故以國殺而不去其官鄭殺其大夫公子嘉嘉公羊作喜左傳鄭子孔之為政也專國人患之乃討西宫之難與純門之師子孔當罪十年尉止等作難西宫子孔知而不言前年子孔召椘師至純門以其甲及子革子良氏之甲守以自守甲辰子展子西率國人伐之殺子孔而分其室書曰鄭殺其大夫專也子然子孔宋子之子也士子孔圭媯之子也子然子革父士子孔子良父宋子圭媯皆鄭穆公妾圭媯之班亞宋子而相親也亞次也士子孔亦相親也僖之四年鄭僖四年魯襄六年子然卒簡之元年鄭簡元年魯襄八年士子孔卒司徒孔實相子革子良之室司徒孔即子孔三室如一故及于難子革子良出奔楚子革為右尹子革即鄭丹為楚右尹鄭人使子展當國子西聴政立子産為卿凡稱國以殺大夫者國君大臣與謀其事不請於天子而擅殺之也故雖殺有罪亦書其官嘉召楚人伐其國則是背畔之臣國人之所同惡使子展子西正名誅之而不利其室則當如殺良霄之例稱人以殺而削其官矣冬葬齊靈公附録左傳齊慶封圍髙唐夙沙衛以髙唐叛故弗克冬十一月齊侯圍之見衛在城上號之乃下衛下與齊侯語問守備焉以無備告揖之乃登齊侯以衞告誠揖而禮之欲生之也衞志于戰死故不順齊侯之揖而還登城聞師將傅食髙唐人殖綽工僂㑹夜縋納師因其㑹食二子齊大夫醢衞于軍城西郛左傳城西郛懼齊也郛外城也魯備齊難城其國之西郛則凡西境亦不敢保其儆守益微矣叔孫豹㑹晉士匄于柯左傳齊及晉平盟于大隧大隧杜注地闕或曰在今髙唐州境故穆叔㑹范宣子于柯穆叔見叔向賦載馳之四章載馳衞風四章曰控于大邦誰因誰極取其欲引大國以自救助叔向曰肸敢不承命魯懼齊而援晉以自固是時政在大夫專相為㑹故詳志之城武城武城杜注泰山南武城縣通典費縣有古武城今故城在山東費縣西南左傳穆叔歸曰齊猶未也不可以不懼乃城武城附録左傳衞石共子卒石買悼子不哀買之子石惡孔成子曰是謂蹷其本必不有其宗孔成子衞大夫蹷拔也為二十八年石惡出奔𫝊二十年春王正月辛亥仲孫速㑹莒人盟于向速公羊作遫後同左傳二十年春及莒平孟莊子㑹莒人盟于向督揚之盟故也督揚盟在前年夏六月庚申公㑹晉侯齊侯宋公衞侯鄭伯曹伯莒子邾子滕子薛伯把伯小邾子盟于澶淵澶淵杜注衞地在頓丘縣南水經注浮水故瀆上承大河于頓丘縣而北出東逕繁陽故城按浮水即澶淵也當在今内黄縣之南開州之西北左傳夏盟于澶淵齊成故也齊之無道諸侯圍之而不服以士匄聞喪還師遂㑹于澶淵修徳来逺信有徵矣經於服異則書同盟此齊成而盟何以不言同同盟云者名生於不足也平公祝柯澶淵之盟不言同其悼公之遺烈與秋公至自㑹仲孫速帥師伐邾左傳邾人驟至驟數也謂十五年十七年伐魯以諸侯之事弗能報也秋孟莊子伐邾以報之祝柯之㑹既執邾子又取其田報亦足矣而復伐之不已甚乎且夏盟而秋伐何以盟為蔡殺其大夫公子燮蔡公子履出奔楚燮穀梁作濕左傳蔡公子燮欲以蔡之晉背楚蔡人殺之公子履其母弟也故出奔楚欲自解燮之欲去楚而之晉也既以追成先志又懼楚役求紓其民皆謀國之合義者國人乃不順而殺之非其罪矣故稱國而不去其官履懼禍出奔自理於楚春秋據事書之或謂貶其不與兄同志曲説也陳侯之弟黄出奔楚黄公羊穀梁作光後同左傳陳慶虎慶寅畏公子黄之偪二慶陳卿恐黄偪奪其政愬諸楚曰與蔡司馬同謀同欲之晉蔡司馬公子燮楚人以為討公子黄出奔楚奔楚自理初蔡文侯欲事晉曰先君與于踐土之盟先君謂父荘侯踐土盟在僖二十八年晉不可棄且兄弟也畏楚不能行而卒文侯卒在宣十七年楚人使蔡無常公子燮求從先君以利蔡不能而死書曰蔡殺其大夫公子燮言不與民同欲也罪其違衆陳侯之弟黄出奔楚言非其罪也稱弟罪陳侯及二慶公子黄將出奔呼于國曰慶氏無道求專陳國暴蔑其君而去其親五年不滅是無天也為二十三年陳殺二慶𫝊穀梁傳諸侯之尊弟兄不得以屬通其弟云者親之也親而奔之惡也所以惡陳侯二慶愬陳黄於楚陳侯不能為之辨明而使之出奔是以一國之大不能庇其弟也黄見惡於楚而反奔楚蓋方是時晉霸衰微諸侯畏楚欲隐身於他國恐楚人以為討而不能庇故赴楚而自理與蔡履同可哀也矣叔老如齊左傳齊子初聘于齊齊魯有怨今始復通故曰初禮也冬十月丙辰朔日有食之季孫宿如宋左傳冬季武子如宋報向戌之聘也向戌聘在十五年禇師段逆之以受享段宋共公子子石也迎以入國受享禮賦常棣之七章以卒武子賦也七章以卒盡八章取其妻子好合如鼓瑟琴宜爾室家樂爾妻孥言二國好合宜其室家相親如兄弟宋人重賄之歸復命公享之賦魚麗之卒章魚麗詩小雅卒章曰物其有矣維其時矣喻聘宋得其時公賦南山有臺南山有臺詩小雅取其樂只君子邦家之基邦家之光喻武子奉使能為國光輝武子去所曰臣不堪也去所辟席魯自蕭魚後連嵗與彊齊邾莒交兵不遑聘問今始平齊遂交鄰國以尋舊好且以結援耳附録左傳衞甯惠子疾召悼子曰悼子甯喜吾得罪于君悔而無及也名藏在諸侯之策曰孫林父甯殖出其君君入則掩之掩惡名若能掩之則吾子也若不能猶有鬼神吾有餒而已不来食矣悼子許諾惠子遂卒為二十六年衞侯歸𫝊日講春秋解義卷四十一
