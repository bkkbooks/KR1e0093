body:
  text: 欽定四庫全書日講春秋解義卷三十五成公十有五年春王二月葬衛定公三月乙巳仲嬰齊卒公羊傳仲嬰齊者何疑仲遂後故問之公孫嬰齊也公孫嬰齊則曷為謂之仲嬰齊為兄後也為兄後則曷為謂之仲嬰齊據本公孫為人後者為之子也更為公孫之子故不得復氏公孫為人後者為其子則其稱仲何孫以王父字為氏也然則嬰齊孰後後歸父也歸父使于晉而未反宣公十八年自晉至柳奔齊何以後之據已絶也叔仲惠伯傅子赤者也叔仲叔彭生氏惠諡也文公死子幼公子遂謂叔仲惠伯曰君幼如之何願與子慮之叔仲惠伯曰吾子相之老夫抱之何幼君之有公子遂知其不可與謀退而殺叔仲惠伯弒子赤而立宣公宣公死成公幼臧宣叔者相也臧孫許宣諡君死不哭聚諸大夫而問焉曰昔者叔仲惠伯之事孰為之諸大夫皆雜然曰仲氏也其然乎于是遣歸父之家然後哭君歸父使乎晉還自晉至柳聞君薨家遣墠帷哭君成踊反命于介自是走之齊魯人徐傷歸父之無後也于是使嬰齊後之也穀梁傳此公孫也其曰仲何也此蓋仲遂之子據實公孫子由父疏之也父有弒君之罪故不得言公子父不言公子則子不得稱公孫是見疏之罪由父故嬰齊仲遂之子歸父之弟仲遂生而賜氏故書曰仲嬰齊也或以不稱公孫為疑是時魯有兩嬰齊一為叔肸之子一即仲嬰齊皆公孫也並見於經如俱稱公孫則此卒者知為何嬰齊耶公羊謂以弟後兄謬矣季孫因歸父欲去三桓而逐之寧有復為立後之理果憫歸父何難反其子而立之而必以弟為之後乎癸丑公會晉侯衛侯鄭伯曹伯宋世子成齊國佐邾人同盟于戚十三年曹伯卒于師負芻殺太子自立晉不能請於天王率諸侯以舉九伐之典既逾三年乃假他事以會與之盟而後執之俾曹人他日得以為口實晉政可謂無章矣宋公卒以六月必有疾而使世子出會也晉侯執曹伯歸于京師公羊作歸之于左傳十五年春會于戚討曹成公也討其殺大子而自立事在十三年執而歸諸京師書曰晉侯執曹伯不及其民也惡不及民凡君不道于其民諸侯討而執之則曰某人執某侯稱人示衆所欲執不然則否謂身犯不義者諸侯將見子臧于王而立之子臧辭曰前志有之曰聖逹節聖人應天不拘常禮次守節謂賢者下失節愚者妄動為君非吾節也雖不能聖敢失守乎遂逃奔宋榖梁傳以晉侯而斥執曹伯惡晉侯也僖二十八年晉人執衛侯歸之于京師此伯討之文也今以侯執伯明執之不以其罪不言之急辭也斷在晉侯也明晉之私二百四十二年諸侯相執多矣惟此稱晉侯以執當其罪又不敢自治而歸于京師使即天刑得侯伯討罪之義也或疑負芻之殺太子經無明文設有之何以不書然以書法考之凡執皆稱人安得謂稱爵者非霸討乎疑負芻之逆節赴告未及魯史無文聖人核知其實而特文以見義也公至自會夏六月宋公固卒左傳夏六月宋共公卒為下宋亂起楚子伐鄭左傳楚將北師侵鄭衛子囊曰子囊莊王子公子貞新與晉盟而背之晉楚盟在十二年無乃不可乎子反曰敵利則進何盟之有申叔時老矣在申聞之曰子反必不免信以守禮禮以庇身信禮之亡欲免得乎楚子侵鄭及暴隧暴隧路史曰暴辛公采地蓋周圻內之邑而是時為鄭所有也遂侵衛及首止鄭子罕侵楚取新石新石杜注楚邑當在今河南葉縣境欒武子欲報楚韓獻子曰無庸使重其罪民將叛之背盟數戰罪也無民孰戰為明年晉敗楚于鄢陵傳楚伐鄭許故也鄭昔嘗伐許而楚不問以鄭方即楚耳今改從晉故楚人惡之而以公子喜之伐許為兵端也秋八月庚辰葬宋共公榖梁傳月卒日葬非葬者也卒當書日葬無甚危則當録月今反常違例以共公失德不宜書葬故日葬以表之此其言葬何也以其葬共姬不可不葬共公也葬共姬則其不可不葬共公何也夫人之義不踰君也為賢者崇也賢崇伯姬故書共公葬宋華元出奔晉宋華元自晉歸于宋宋殺其大夫山宋魚石出奔楚左傳秋八月葬宋共公于是華元為右師魚石為左師蕩澤為司馬蕩澤公孫夀之孫華喜為司徒華喜華父督之玄孫公孫師為司城公孫師莊公孫向為人為大司寇鱗朱為少司寇鱗朱鱗矔孫向􅙮為大宰魚府為少宰蕩澤弱公室殺公子肥輕公室以為弱故殺其枝黨肥文公子華元曰我為右師君臣之訓師所司也今公室卑而不能正吾罪大矣不能治官敢賴寵乎乃出奔晉二華戴族也華元華喜司城莊族也六官者皆桓族也魚石蕩澤向為人鱗朱向􅙮魚府魚石將止華元魚府曰右師反必討是無桓氏也恐華元還討蕩澤并及六族魚石曰右師苟獲反雖許之討必不敢言畏桓族強且多大功國人與之不反懼桓氏之無祀于宋也右師討猶有戌在向戌桓公曾孫言其賢華元必不討桓氏雖亡必偏偏不盡魚石自止華元于河上請討許之乃反使華喜公孫師帥國人攻蕩氏殺子山喜師非桓族故使攻之子山蕩澤書曰宋殺其大夫山言背其族也蕩氏宋公族還害公室故去族以示其罪魚石向為人鱗朱向􅙮魚府出舍于睢上睢杜注水名五大夫畏同族罪及將出奔華元使止之不可冬十月華元自止之不可乃反魚府曰今不從不得入矣右師視速而言疾有異志焉若不我納今將馳矣登丘而望之則馳騁而從之五子亦馳逐之則決睢澨澨水涯閉門登陴矣左師二司寇二宰遂出奔楚四大夫不書獨魚石告為十八年魚石復入彭城傳華元使向戌為左師老佐為司馬老佐戴公五世孫樂裔為司冦以靖國人宋蕩氏戕刈公室華元為右師力不能討而奔晉控於方伯也晉許之討故桓氏懼而反元使元懷祿顧寵難於去國則義不足以服國人幾坐視而莫知所措矣魚石許元討山而身復奔楚蓋與山同罪恐終不免也君子雖違不適讎國宋為楚人所必爭而魚石託焉他日卒介恃楚力以入彭城則實有亂心不獨與山族近可知矣山不氏宋人既正其罪而告不以氏也附録左傳晉三郤害伯宗譖而殺之及欒弗忌欒弗忌晉賢大夫伯州犂奔楚州犂伯宗子韓獻子曰郤氏其不免乎善人天地之紀也而驟絶之不亡何待為十七年晉殺三郤傳初伯宗每朝其妻必戒之曰盜憎主人民惡其上子好直言必及于難傳見雖婦人之言不可廢冬十有一月叔孫僑如會晉士燮齊髙無咎宋華元衛孫林父鄭公子鰌邾人會吳于鍾離此會吳之始亦晉以諸侯之大夫為會之始鍾離杜注楚邑淮南縣今江南鳯陽縣左傳十一月會吳于鍾離始通吳也公羊傳曷為殊會吳據楚不殊外吳也曷為外也春秋內其國而外諸夏內諸夏而外夷狄王者欲一乎天下曷為以外內之辭言之言自近者始也穀梁傳會又會外之也先儒因再書會而有外吳之説然聖人之惡吳不宜過於楚諸侯與楚會何以無異文乎且襄五年會于戚吳人列序則其説不可通矣蓋鍾離柤向皆近吳吳人在是而晉合諸侯以會之非會又會無以見事情戚衛地晉合諸侯于戚而吳人來會安得用會又會之文哉凡此乃事殊文異義各有當而無庸曲説者也許遷于葉左傳許靈公畏逼于鄭請遷于楚辛丑楚公子申遷許于葉穀梁傳遷者猶得其國家以往者也其地許復見也避鄭也盟主不能安小國而使之䁥楚以求安著小國之失所也然許逃中國而主楚亦豈善擇所從者哉十有六年春王正月雨木氷公羊傳雨木氷者何雨而木氷也何以書記異也榖梁傳雨而木氷也志異也傳曰根枝折上溫故雨而不雪下寒故著木而氷陽上施而下不通陰下施而上不通也附録左傳十六年春楚子自武城使公子成以汝陰之田求成于鄭汝水之南近鄭地鄭叛晉子駟從楚子盟于武城為晉伐鄭起夏四月辛未滕子卒左傳夏四月滕文公卒鄭公子喜帥師侵宋左傳鄭子罕伐宋宋將鉏樂懼敗諸汋陂樂懼戴公六世孫將鉏樂氏族汋陂杜注宋地退舍于夫渠夫渠杜注宋地不警宋師不警備鄭人覆之敗諸汋陵汋陵杜注宋地今河南寧陵縣南有汋陵城獲將鉏樂懼宋恃勝也鄭服於中國五年矣至是附楚而加兵於宋諸侯之兵無寧嵗矣附録左傳衛侯伐鄭至于鳴雁鳴雁杜注在陳留雍丘縣西北今河南把縣北有白雁亭為晉故也六月丙寅朔日有食之晉侯使欒黶來乞師左傳晉侯將伐鄭范文子曰若逞吾願諸侯皆叛晉可以逞時厲公無道三郤驕縱故欲使諸侯叛冀其懼而修德若唯鄭叛晉國之憂可立俟也欒武子曰不可以當吾世而失諸侯必伐鄭乃興師欒書將中軍士燮佐之代荀庚郤錡將上軍代士燮荀偃佐之代郤錡偃荀庚子韓厥將下軍郤至佐新軍荀罃居守荀罃下軍佐時郤犨代趙旃將新軍新上下軍已罷郤犨如衛遂如齊皆乞師焉欒黶來乞師孟獻子曰有勝矣卑讓有禮故知其將勝鄭與楚比徴兵討畔視伐秦為有辭矣然當是時楚勢益張晉不能庇諸侯故不惜卑辭以相要結也甲午晦晉侯及楚子鄭伯戰于鄢陵楚子鄭師敗績鄢陵杜注鄭地屬潁川郡按鄢陵本鄢國妘姓為鄭武公所滅初仍故名後改為鄢陵左傳戊寅晉師起鄭人聞有晉師使告于楚姚句耳與往句耳鄭大夫與往非使也為先歸張本楚子救鄭司馬將中軍子反令尹將左子重右尹子辛將右公子壬夫過申子反入見申叔時曰師其何如對曰德刑詳義禮信戰之器也德以施惠刑以正邪詳以事神義以建利禮以順時信以守物民生厚而德正財足則思無邪用利而事節動不失利則事得其節時順而物成羣生得所上下和睦周旋不逆動順理求無不具下應上各知其極無二心故詩曰立我蒸民莫非爾極詩周頌蒸衆也極中也言先王立其衆民皆得中正是以神降之福時無災害民生敦厖敦厚也厖大也和同以聼莫不盡力以從上命致死以補其闕此戰之所由克也今楚內棄其民不施惠而外絶其好義不建利瀆齊盟不詳事神而食話言信不守物姦時以動禮不順時周四月今二月妨農業而疲民以逞刑不正邪而苟快意民不知信進退罪也人恤所底人各憂其身不知所底至之處其誰致死子其勉之吾不復見子矣姚句耳先歸子駟問焉對曰其行速過險而不整速則失志不思慮不整喪列志失列喪將何以戰楚懼不可用也五月晉師濟河聞楚師將至范文子欲反曰我偽逃楚可以紓憂夫合諸侯非吾所能也以遺能者我若羣臣輯睦以事君多矣武子曰不可六月晉楚遇于鄢陵范文子不欲戰郤至曰韓之戰惠公不振旅衆散敗也在僖十五年箕之役先軫不反命死于狄也在僖三十三年邲之師荀伯不復從敗走不復故道在宣十二年皆晉之恥也子亦見先君之事矣今我辟楚又益恥也文子曰吾先君之亟戰也有故秦狄齊楚皆強不盡力子孫將弱今三強服矣秦狄齊敵楚而已唯聖人能外內無患自非聖人外寧必有內憂驕亢則憂患生也盍釋楚以為外懼乎甲午晦楚晨壓晉軍而陳軍吏患之范丐趨進丐士燮子曰塞井夷竈陳于軍中而疏行首疏行首者當陳前決開營壘為戰道晉楚唯天所授何患焉文子執戈逐之曰國之存亡天也童子何知焉欒書曰楚師輕窕固壘而待之三日必退退而擊之必獲勝焉郤至曰楚有六間不可失也其二卿相惡子重子反王卒以舊罷老不代鄭陳而不整蠻軍而不陳陳不違晦晦月終隂之盡故兵家以為忌在陳而囂囂喧譁也合而加囂陳合宜靜而益有聲各顧其後莫有鬬心舊不必良以犯天忌我必克之楚子登巢車以望晉軍巢車車上為櫓子重使大宰伯州犂侍于王後州犂晉伯宗子前年奔楚王曰騁而左右何也曰召軍吏也皆聚于中軍矣曰合謀也張幕矣曰虔卜于先君也徹幕矣曰將發命也甚囂且塵上矣曰將塞井夷竈而為行也皆乘矣左石執兵而下矣曰聼誓也戰乎曰未可知也乘而左右皆下矣曰戰禱也伯州犂以公卒告王公晉侯苖賁皇在晉侯之側亦以王卒告賁皇楚鬬椒子宣四年奔晉皆曰國士在且厚不可當也晉侯左右皆以伯州犂在楚知晉之情且謂楚師多故憚合戰苖賁皇言于晉侯曰楚之良在其中軍王族而已請分良以擊其左右而三軍萃于王卒必大敗之公筮之史曰吉其卦遇復震下坤上復無變曰南國蹙射其元王中厥目此卜者辭也復陽長之卦陽氣起子南行推隂故曰南國蹙南國勢蹙則離受其咎離為諸侯又為目陽氣激南飛矢之象故曰射其元王中厥目國蹙王傷不敗何待公從之從其言而戰有淖于前乃皆左右相違于淖淖泥也達辟也步毅御晉厲公步毅即郤毅欒針為右彭名御楚共王潘黨為右石首御鄭成公唐苟為右欒范以其族夾公行二族強故在公左右陷于淖欒書將載晉侯針曰書退國有大任焉得專之在君前故子名其父大任謂元帥之職且侵官冒也載公為侵官失官慢也去將而御失官也離局姦也逺其部曲為離局有三罪焉不可犯也乃掀公以出于淖掀舉也癸巳潘尫之黨與養由基蹲甲而射之徹七札焉黨潘尫之子蹲聚也札層也一發逹七札言其能陷堅以示王曰君有二臣如此何憂于戰王怒曰大辱國賤其不尚知謀詰朝爾射死藝言汝以射自多必當以藝死呂錡夢射月呂錡魏錡中之退入于泥占之曰姬姓日也異姓月也周世姬姓尊異姓卑必楚王也射而中之退入于泥亦必死矣及戰射共王中目王召養由基與之兩矢使射呂錡中項伏韜韜弓衣以一矢復命言一發而中郤至三遇楚子之卒見楚子必下免胄而趨風疾如風楚子使工尹襄問之以弓工尹楚官名襄問遺也曰方事之殷也有韎韋之附注君子也殷盛也韎赤色跗注戎服若袴而屬于跗與袴連識見不榖而趨無乃傷乎恐其傷郤至見客免胄承命曰君之外臣至從寡君之戎事以君之靈間蒙甲胄不敢拜命間猶近也禮介者不拜敢告不寧君命之辱為事之故敢肅使者以有軍事不得答故肅使者肅手至地若今揖三肅使者而退晉韓厥從鄭伯從逐也其御杜溷羅曰速從之其御屢顧不在馬可及也韓厥曰不可以再辱國君乃止二年鞍戰韓厥已辱齊侯郤至從鄭伯其右茀翰胡曰諜輅之余從之乘而俘以下欲遣輕兵單進以距鄭伯車前而已自後登車以執之郤至曰傷國君有刑亦止石首曰衛懿公唯不去其旗是以敗于熒熒戰在閔二年乃內旌于韜中唐苟謂石首曰子在君側敗者一大一大謂軍大崩也我不如子子以君免我請止乃死楚師薄于險薄迫也叔山冉謂養由基曰叔山冉楚人雖君有命王有死藝命為國故子必射乃射再發盡殪叔山冉搏人以投中車折軾晉師乃止言二子皆有過人之能囚楚公子茷為郤至見譖張本欒針見子重之旌請曰楚人謂夫旌子重之麾也彼其子重也日臣之使于楚也子重問晉國之勇臣對曰好以衆整曰又何如又問其餘臣對曰好以暇暇聞暇今兩國治戎行人不使不可謂整臨事而食言食好整之言不可謂暇請攝飲焉攝持也持飲往飲子重公許之使行人執榼承飲榼飲器造于子重曰寡君乏使使針御持矛御侍也是以不得犒從者使某攝飲子重曰夫子嘗與吾言于楚必是故也不亦識乎知其以往言好暇故致飲受而飲之免使者而復鼓旦而戰見星未己子反命軍吏察夷傷補卒乘補死亡繕甲兵展車馬展陳也雞鳴而食唯命是聼欲復戰晉人患之苖賁皇徇曰搜乘補卒秣馬利兵修陳固列蓐食申禱明日復戰乃逸楚囚逸縱也故欲使楚聞其言王聞之召子反謀榖陽豎獻飲于子反穀陽子反內豎子反醉而不能見王曰天敗楚也夫余不可以待乃宵遁晉入楚軍三日榖食楚粟三日范文子立于戎馬之前曰君幼諸臣不佞佞才也何以及此君其戒之戒勿驕周書曰惟命不于常有德之謂周書康誥言勝無常命惟德是與公羊傳晦者何冥也何以書記異也敗者稱師楚何以不稱師王痍也痍傷也王痍者何傷乎矢也時為飛矢所中然則何以不言師敗績末言爾凡舉師敗績為重衆今傷君則當以君為重穀梁傳日事遇晦曰晦四體偏斷曰敗此其敗則目也楚不言師君重于師也書楚子敗績而不言師何也泓之戰宋公傷股不書宋公敗者其師大敗北而君傷未甚故舉師為重鄢陵則楚師實未大困而君集矢於目故舉君為重也若大棘之戰華元見獲雞父之敗胡沈君滅則備書之皆據事之實以屬辭耳楚殺其大夫公子側左傳楚師還及瑕瑕杜注楚地水經注肥水徑山桑縣城南又東積而為瑕陂山桑縣在今江南蒙城縣北王使謂子反曰先大夫之覆師徒者君不在謂子玉敗城濮時王不在軍子無以為過不榖之罪也子反再拜稽首曰君賜臣死死且不朽臣之卒實奔臣之罪也子重使謂子反曰初隕師徒者而亦聞之矣盍圗之聞子玉自殺終二卿相惡對曰雖微先大夫有之大夫命側側敢不義言以義命已不敢不受側亡君師敢忘其死王使止之弗及而卒主兵者將而御將者君將不同心敗之道也今子反子重素不相能楚子在軍無以御之使敵國謀臣窺其間而敗楚獨委咎於側以殺之則非法矣故稱國以殺而不去其官秋公會晉侯齊侯衛侯宋華元邾人于沙隨不見公沙隨杜注宋地梁國寧陵縣有沙隨亭今沙隨城在河南寧陵縣西左傳戰之日齊國佐髙無咎至于師無咎髙固子衛侯出于衛公出于壞隤壞隤杜注魯邑齊衛皆後非獨魯明晉以僑如故不見公宣伯通于穆薑穆薑成公母欲去季孟而取其室季文子孟獻子將行穆薑送公而使逐二子公以晉難告曰請反而聼命薑怒公子偃公子鉏趨過二公子公庶弟指之曰女不可是皆君也公待于壞隤申宮警備申敕宮備設守而後行是以後後晉楚戰期使孟獻子守于公宮秋會于沙隨謀伐鄭也鄭猶未服宣伯使告郤犨曰魯侯待于壞隤以待勝者觀晉楚之勝負郤犨將新軍且為公族大夫以主東諸侯主齊魯之屬取貨于宣伯而訴公于晉侯晉侯不見公公羊傳不見公者何公不見見也不為晉所見榖梁傳不見公者可以見公也可以見公而不見公譏在諸侯也諸侯無解之者春秋之法為尊親諱沙隨之會晉不見公辱莫大焉而直書之何也是時魯有內難師出後期伯主所當矜恤不討僑如而反受其譖怒公不見其曲在晉於魯何與乎直書不諱示自反而縮則非義相干不足以為辱也公至自會公羊傳公不見見大夫執執季孫行父何以致會不恥也曷為不恥公幼也因公幼殺恥為諱辭附録左傳曹人請于晉曰自我先君宣公即世在十三年國人曰若之何憂猶未弭弭息世既葬國人皆將從子臧所謂憂未息而又討我寡君以亡曹國社稷之鎮公子前年晉侯執曹伯子臧奔宋是大泯曹也先君無乃有罪乎若有罪則君列諸會矣諸侯雖有篡弒之罪侯伯已與之會則不復討前年會于戚曹伯在列盟畢乃執之故曹人以為無罪君唯不遺德刑以伯諸侯豈獨遺諸敝邑敢私布之為曹伯歸傳公會尹子晉侯齊國佐邾人伐鄭王臣會伐始此左傳七月公會尹武公及諸侯伐鄭尹武公王卿士子爵將行薑又命公如初薑穆薑復使公逐季孟公又申守而行諸侯之師次于鄭西我師次于督揚不敢過鄭督揚杜注鄭東地子叔聲伯使叔孫豹請逆于晉師豹叔孫僑如弟為食于鄭郊師逆以至聲伯戒叔孫以必須所逆晉師至乃食聲伯四日不食以待之食使者而後食使者豹之介豹因請逆遂奔齊使其介以晉逆師至諸侯遷于制田制田杜注滎陽宛陵縣東有制澤今制城在河南新鄭縣東北知武子佐下軍以諸侯之師侵陳至于鳴鹿知武子荀罃鳴鹿杜注陳國武平縣西南有鹿邑今河南鹿邑縣西北有古城遂侵蔡未反侵陳蔡不書公不與諸侯遷于潁上戊午鄭子罕宵軍之宋齊衛皆失軍將主與軍相失宋衛不書後也桓文之師以尊王恤鄰為號義既足以動人而力又足以攝之故未嘗請命於王晉霸既衰諸侯攜二故假王命且援王臣以涖之據左氏伐秦之役劉子成子實與焉而經不書蓋書劉成會伐則似因朝而受命於王無以著其因伐而朝之慢伐鄭不書尹單則霸者徵會討二之常辭無以見晉霸益衰假王靈以屬諸侯而終不能服鄭為世變之尤大矣曹伯歸自京師左傳曹人復請于晉晉侯謂子臧反吾歸而君以曹人重子臧故子臧反自宋還曹伯歸子臧盡致其邑與卿而不出公羊傳執而歸者名曹伯何以不名而不言復歸于曹何據曹伯襄復歸于曹易也其歸易故不復舉國與名其易奈何公子喜時在內也喜時子臧公子喜時在內則何以易公子喜時者仁人也內平其國而待之外治諸京師而免之治訟也其言自京師何言甚易也舍是無難矣言惟欲請之于京師舍此之外更無危難穀梁傳不言所歸歸之善者也出入不名以為不失其國也歸為善謂直言歸而不言其國即曹伯歸自京師不言于曹是自某歸次之若蔡季自陳歸于蔡衛侯鄭自楚復歸于衛是負芻篡弒惡莫大焉而不名不稱復歸以其位未絶也不絶其位所以纍天王也歸自京師言天王之釋有罪也或謂當是時周抱空名生殺豫奪不能自主故傳載曹人一則請于晉再則請于晉而未嘗遣一介如周以書法按之非經意也晉既執而歸諸京師使王正賊殺其親之法而加辟焉晉何辭復為負芻解如此則諸侯心懾而王綱可漸舉矣春秋深探其本自貴者始故以失刑之責歸天王而譏不在晉耳九月晉人執季孫行父舍之于苕丘苕公羊作招苕丘杜注晉地左傳宣伯使告郤犨曰魯之有季孟猶晉之有欒范也政令于是乎成今其謀曰晉政多門政不由君不可從也寧事齊楚有亡而已蔑從晉矣若欲得志于魯請止行父而殺之我斃蔑也而事晉行父季文子蔑孟獻子蔑有二矣魯不二小國必睦不然歸必叛矣九月晉人執季文子于苕丘公還待于鄆鄆杜注魯西邑東郡廩丘縣東有鄆城今山東鄆城縣是使子叔聲伯請季孫于晉郤犨曰苟去仲孫蔑而止季孫行父吾與子國親于公室親魯甚于晉公室對曰僑如之情子必聞之矣聞其淫慝情若去蔑與行父是大棄魯國而罪寡君也若猶不棄而惠徼周公之福使寡君得事晉君則夫二人者魯國社稷之臣也若朝亡之魯必夕亡以魯之密邇仇讎亡而為讎仇讎謂齊楚言魯屬齊楚則還為晉讎治之何及郤犨曰吾為子請邑對曰嬰齊魯之常隸也敢介大國以求厚焉隸賤官介因也承寡君之命以請若得所請吾子之賜多矣又何求范文子謂欒武子曰季孫于魯相二君矣二君宣成妾不衣帛馬不食粟可不謂忠乎信讒慝而棄忠良若諸侯何子叔嬰齊奉君命無私謀國家不二圗其身不忘其君若虛其請是棄善人也子其圖之乃許魯平赦季孫公羊傳執未有言舍之者此其言舍之何仁之也曰在招丘悕矣悕悲也仁之者若曰在招丘可悲矣閔録之辭執未有言仁之者此其言仁之何代公執也其代公執奈何前此者晉人來乞師而不與公會晉侯會沙隨將執公季孫行父曰此臣之罪也于是執季孫行父成公將會厲公謂上伐鄭言諡者别于沙隨會不當期不如期將執公季孫行父曰臣有罪執其君子有罪執其父此聼失之大者也聼斷今此臣之罪也舍臣之身而執臣之君吾恐聼失之為宗廟羞也于是執季孫行父榖梁傳執者不舍而舍公所也昭二十三年晉人執我行人叔孫婼不言舍今言舍者以公在苕丘故也執者致而不致公在也昭二十四年姥至自晉行父不致者與公俱還故也何其執而辭也問何以書執而言舍復不言致猶存公也皆所以見公在苕丘存意公亦存也絰未明言公所在苐據所屬之辭以推其意之所存即可知公在是也公存也必欲明公在是者重公故也舍置也如秦獲晉侯舍諸靈臺而不以入國也或以捨為義非也下書行父盟郤犨則著其釋行父矣冬十月乙亥叔孫僑如出奔齊左傳冬十月出叔孫僑如而盟之諸大夫共盟以僑如為戒僑如奔齊十有二月乙丑季孫行父及晉郤犨盟于扈左傳十二月季孫及郤犨盟于扈歸刺公子偃偃與鉏俱薑所指獨刺偃者偃與謀召叔孫豹于齊而立之近此七月聲伯使豹請逆于晉聞魯將討僑如豹辟其難先奔齊生二子而魯乃召之故襄二年豹始見經傳于此因言其終公至自會大夫執而歸則致行父不至者公待行父偕歸故舉公為重也不致伐鄭而致會者公之危不在伐而在會故歸而以會告也附録左傳齊聲孟子通僑如聲孟子齊靈公母宋女使立于髙國之間位比二卿僑如曰不可以再罪奔衛亦間于卿傳終言僑如之佞晉侯使郤至獻楚捷于周與單襄公語驟稱其伐單子語諸大夫曰溫季其亡乎溫季郤至位于七人之下佐新軍位在八而求掩其上稱已之伐掩上功怨之所聚亂之本也多怨而階亂何以在位夏書曰怨豈在明不見是圗夏書五子之歌不見細微也將慎其細也今而明之其可乎言郤至顯稱已功是明取怨咎為明年晉殺三郤傳乙酉刺公子偃穀梁傳大夫日卒正也先刺後名殺無罪也僖二十八年公子買戌衛不卒戌刺之是有罪者先列其罪晉不見公而盟季孫晉人下比之端兆於此矣季孫之釋欒范實私之故其歸自晉也恃晉之援肆無忌憚幽君母殺公子成公拱手以聼而魯政一歸於季氏皆晉之權家庇之也日講春秋解義卷三十五
