body:
  text: 欽定四庫全書日講春秋解義卷二隱公三年春王二月己巳日有食之此書日食之始公羊傳何以書記異也日食則曷為或日或不日或言朔或不言朔曰某月某日朔日有食之者食正朔也桓公三年秋七月壬辰朔日有食之是也其或日或不日或失之前或失之後失之前者朔在前也謂二日食己巳日有食之是也失之後者朔在後也謂晦日食莊公十八年三月日有食之是也穀梁傳言日不言朔食晦日也其日有食之何也吐者外壤食者內壤壤日之輪廓其所吐出者壤在外其所吞食者壤入于內闕然不見其壤有食之者也日既闕損不知壤之所在必有物食之有內辭也或外辭也食者內壤故曰內辭吐者外壤故曰外辭傳無外辭之文者蓋時無外壤也而曰或外辭者因事以推明義例耳有食之者內于日也日食既有兩種之辭今直云有食之者為壤在于內也其不言食之者何也謂經不明言月之食日也知其不可知知也聖人慎疑所謂不知為不知是知也厯法周天之度日行疾月行遲日月一歲凡十二會方會則月光都盡而為晦己會則月光復蘇而為朔當月朔而日月之會東西同度南北同道則月掩日而日為之食精厯算者皆能豫推之是有常度矣既有常度可求則災而非異矣然每食必書示後世以遇災而懼之意也亦以示後世治厯明時之法也日者衆陽之宗為隂所掩王者於此修德行政扶陽抑隂以見克謹天戒之意經書日食三十六示人君不可忽天象也三月庚戌天王崩左傳三年春王三月壬戌平王崩赴以庚戌故書之公羊傳何以不書葬天子記崩不記葬必其時也至尊無所屈也諸侯記卒記葬有天子存不得必其時也設有他故葬必易期曷為或言崩或言薨天子曰崩諸侯曰薨大夫曰卒士曰不䘵等殺其詞以别尊卑穀梁傳高曰崩厚曰崩尊曰崩天子之崩以尊也其崩之何也以其在民上故崩之其不名何也大上故不名也名者所以相别耳居人之大在民之上故無所名崩者上墜之形天子之尊四海之內皆當奔喪魯君聞赴不會有慢上之心故志崩不志葬以著其罪夏四月辛卯尹氏卒尹左作君左傳夏君氏卒聲子也不赴于諸侯不反哭于寢不祔于姑隱不敢從正君之禮故亦不敢備禮于其母故不曰薨不稱夫人故不言葬不書姓為公故曰君氏隱見為君故特書于經曰君氏公羊傳尹氏者何天子之大夫也其稱尹氏何貶曷為貶譏世卿世卿非禮也外大夫不卒此何以卒天王崩諸侯之主也尹氏主儐贊諸侯穀梁傳尹氏者何也天子之大夫也外大夫不卒此何以卒之也于天子之崩為魯主故隱而卒之隱猶痛也周禮大行人之職曰若有大喪則詔相諸侯之禮尹氏時在職而詔魯人之弔者尹氏王朝世卿書卒來赴也古者論功命爵辨材授職世祿而不世官故俊傑皆得在位威福不至下移尹氏秉鈞為周階亂見於家父所刺考之左氏傳世執王朝之政春秋於其告喪與立子朝以子朝奔楚皆以氏書以著世卿之失為後世戒武氏仍叔之子皆此義也且王臣不得外交其死也亦不得赴告尹氏卒而來赴於魯越禮踰法書之以明人臣之義杜朋黨之原又聖人之微旨也附録左傳鄭武公莊公為平王卿士王二于虢西虢公亦仕王朝王欲分任之鄭伯怨王王曰無之故周鄭交質王子狐為質于鄭狐平王子鄭公子忽為質于周忽莊公子王崩周人將畀虢公政四月鄭祭足帥師取溫之麥祭足即祭仲也溫周畿內邑今河南溫縣有古溫城秋又取成周之禾成周洛邑也今河南洛陽縣有故城周鄭交惡君子曰信不由中質無益也明恕而行要之以禮雖無有質誰能間之茍有明信澗溪沼沚之毛山夾水為澗山瀆無所通為溪沼池也沚小渚也毛草也蘋蘩蕰藻之菜蘋大蓱也蘩皤蒿蕰藻聚藻也筐筥錡釜之器方曰筐圓曰筥有足曰錡無足曰釜筐筥皆竹器錡釜皆金器潢汙行潦之水潢汙停水行潦流潦可薦于鬼神可羞于王公羞進也而况君子結二國之信通言盟約彼此之情故云二國行之以禮又焉用質風有采蘩采蘋義取不嫌薄物雅有行葦泂酌行葦義取忠厚泂酌義取行潦可供祭祀昭忠信也秋武氏子來求賻此書來求之始左傳武氏子來求賻王未葬也公羊傳武氏子者何天子之大夫也其稱武氏子何譏何譏爾父卒子未命也武氏子父新死未命而便為大夫薄父子之恩故稱氏言子以譏之何以不稱使當喪未君也當喪謂天子也未君者喪未三年未可居君位稱使武氏子來求賻何以書譏何譏爾喪事無求求賻非禮也蓋通于下禮記少儀臣為君喪納貨貝於君則曰納甸於有司臣歸之禮也君求之非禮也不獨天子為然穀梁傳武氏子者何也天子之大夫也天子之大夫其稱武氏子何也未畢喪孤未爵未爵使之非正也其不言使何也無君也桓王在喪未即位故曰無君歸死者曰賵歸生者曰賻曰歸之者正也求之者非正也周雖不求魯不可以不歸魯雖不歸周不可以求之求之為言得不得未可知之辭也交譏之武氏子天子大夫之嗣也不稱使者嗣王當喪未得發命也古者諒隂百官總己以聽於冢宰三年當是時而有所使稱王則同於至尊稱冢宰則疑於無王故不稱使所以謹通喪之禮又以示君臣名分之際如此其謹嚴也尺土一毛皆天子所有君取於臣豈得言求魯不歸賻而周求之周之失道魯之不臣皆可見矣武氏子仍叔之子或言之或不言之何也蓋言武氏之子則似武氏之子自來求賻若仍叔之子不言之又不見其父尚存聖人之文所以如化工之賦物也八月庚辰宋公和卒左傳宋穆公疾召大司馬孔父而屬殤公焉曰先君舍與夷而立寡人孔父嘉孔子六世祖先君穆公兄宣公也與夷宣公子即殤公寡人弗敢忘若以大夫之靈得保首領以沒先君若問與夷其將何辭以對請子奉之以主社稷寡人雖死亦無悔焉對曰羣臣願奉馮也馮穆公子莊公公曰不可先君以寡人為賢使主社稷若棄德不讓是廢先君之舉也豈曰能賢光昭先君之令德可不務乎吾子其無廢先君之功使公子馮出居于鄭辟殤公也八月庚辰宋穆公卒殤公即位君子曰宋宣公可謂知人矣立穆公其子饗之命以義夫命出于義商頌曰殷受命咸冝百祿是荷其是之謂乎詩頌言殷湯武丁受命皆以義故任荷天之百祿宣公能使其子任荷天祿合此詩之義也穀梁傳諸侯曰卒正也外諸侯卒來告則書魯君書薨臣子之辭也外諸侯書卒非吾君也或不書名不知其名也左傳同盟則赴以名非也豈有臣子當創巨痛深之日而稱先君之名以告鄰國者乎且考之禮辭曰寡君不祿則無稱名之義審矣趙氏匡謂或同會盟而名見於載書或通朝聘而名見于簡牘故國史按舊簡書而紀其名然晉獻公惠公與魯未同會盟通聘問而卒書名宿男同盟滕子杞子來朝而卒不書名則義無處也孫氏覺謂即位之初以名赴我亦無所據蓋承舊史之文而不可損益耳冬十有二月齊侯鄭伯盟于石門此書外諸侯特相盟之始齊今山東臨淄縣西北營丘城石門杜注齊地或曰濟北盧縣故城西南濟水之門左傳冬齊鄭盟于石門尋盧之盟也盧杜注齊地濟北盧縣故城在今山東長清縣西南境盧盟在春秋前庚戌鄭伯之車僨于濟僨仆也濟水名既盟而遇大風傳紀異也十二月無庚戌日誤周室既微霸業未起諸侯無所統各相為黨宋魯陳蔡衛為一黨齊鄭為一黨石門之盟齊鄭相結也是盟也魯公不與經何以書蓋以為常事則不必書以為非常之事則不可以不書記曰有虞氏未施信於民而民信夏后氏未施敬於民而民敬殷人作誓而民始畔周人作會而民始疑傳曰誥誓不及五帝盟詛不及三王聖人有志於大道為公之世故凡盟不削乃以是為非常而志之也癸未葬宋穆公穆公羊榖梁作繆公羊傳葬者曷為或日或不日不及時而日渴葬也不及時不及五月也渴喻急也不及時而不日慢葬也慢薄不能以禮葬過時而日隱之也隱痛賢君不得以時葬也過時而不日謂之不能葬也解緩不能以時葬當時而不日正也當時而日危不得葬也此當時何危爾宣公謂繆公曰以吾愛與夷則不若愛女以為社稷宗廟主則與夷不若女盍終為君矣宣公死繆公立繆公逐其二子莊公馮與左師勃左師官勃名也曰爾為吾子生毋相見死毋相哭所以逺絶之與夷復曰先君之所為不與臣國而納國乎君者以君可以為社稷宗廟主也今君逐君之二子而將致國乎與夷此非先君之意也且使子而可逐則先君其逐臣矣繆公曰先君之不爾逐可知矣吾立乎此攝也終致國乎與夷莊公馮弒與夷故君子大居正宋之禍宣公為之也穀梁傳日葬故也危不得葬也外諸侯之葬有書有不書所以紀邦交之厚薄也蓋據魯人會葬以為言故不曰宋葬穆公而曰葬宋穆公其卒見於經而不書葬者彼雖來赴而魯不往會也凡此皆舊史之文也其變例有三一曰賊不討不書葬隱公之薨而不葬所以責臣子之不能討賊也宋殤齊昭之不書葬視此矣一則諱其辱晉景公之喪成公往弔晉人止公送葬諸侯莫在魯人辱之故諱而不書一曰避其號吳楚之君書卒者十襄公如楚嘗親送其葬於西門之外矣其餘必多遣使會葬而無一見於經蓋據屬詞常法當書葬楚某王葬吳某王故削而不書也示討賊之義避僭王之名乃聖人之特筆而諱晉之辱或亦因魯史之舊文與附録左傳衛莊公娶于齊東宮得臣之妹曰莊薑得臣齊大子名美而無子衛人所為賦碩人也又娶于陳曰厲媯陳國今河南陳州是也生孝伯早死其娣戴媯生桓公莊薑以為己子厲戴皆諡媯陳姓也桓公名完公子州吁嬖人之子也賤而得幸曰嬖有寵而好兵公弗禁莊薑惡之石碏諫曰石碏衛大夫臣聞愛子教之以義方弗納于邪驕奢淫泆所自邪也四者之來寵祿過也將立州吁乃定之矣若猶未也階之為禍失寵而不驕驕而能降降而不憾憾而能聄者鮮矣降謂強降其心聄重也謂自重其身也且夫賤妨貴少陵長遠間親新間舊小加大淫破義所謂六逆也君義臣行父慈子孝兄愛弟敬所謂六順也去順效逆所以速禍也君人者將禍是務去而速之無乃不可乎弗聽其子厚與州吁遊厚石碏子禁之不可桓公立乃老老致仕也四年經書州吁弒其君故傳先經以始事四年春王二月莒人伐杞取牟婁此書伐國取邑之始杞杜注本都雍丘遷都淳于雍丘今河南把縣淳于今山東安丘縣有故城牟婁杜注把邑今諸城縣有婁鄉城公羊傳牟婁者何杞之邑也外取邑不書此何以書疾始取邑也凡外小惡不書取邑差為重故先治之穀梁傳傳曰言伐言取所惡也稱傳曰者穀梁子不親受于師而聞之于傳者既伐其國又取其土明伐不以罪而貪其利故兩書取伐以彰其惡諸侯相伐取地于是始故謹而志之也取者收奪之名諸侯土地受之天王傳之先祖強者不得并兼弱者不冝失守也莒人聲罪伐人而強奪其土故特書曰取以著其惡然隱桓以後傳言外取地甚衆而無一見於經何也入春秋之始猶以取邑為重中葉以後疆場之邑爭奪滋多一彼一此失得無常有不可勝書者矣僖公取濟西田成公取汶陽田乃復吾故田而亦書取何也不請於天王以正疆理而擅兵爭奪與取非所有者何以異乎前書莒人入向天討不加至是伐杞取邑為暴益甚春秋於此蓋深惜九伐不行而慿弱犯寡之肆行無忌云戊申衛州吁弒其君完州榖梁作祝此書弒之始左傳四年春衛州吁弒桓公而立公羊傳曷為以國氏當國也穀梁傳大夫弒其君以國氏者嫌也弒而代之也竊據君位故曰嫌州吁衛公子程子謂春秋之初弒君者多不稱公子公孫蓋身為大惡自絶於先君也大義既明於初其後則皆以其屬稱或見其以親而寵任太過或見其以天屬而反為賊亂立義各不同也孔氏頴達則謂自莊公以上諸弒君者皆不書氏閔公以下皆書氏乃時史有異同非仲尼所筆削理亦可通並存以俟參考夏公及宋公遇于清此書遇之始清杜注衛邑濟北東阿縣有清亭今東阿縣屬山東兗州府左傳公與宋公為會將尋宿之盟宿盟在元年未及期衛人來告亂夏公及宋公遇于清公羊傳遇者何不期也一君出一君要之也言及公要之也穀梁傳及者內為志焉爾遇者志相得也不期而會曰遇今曰內為志非不期也不期而會曰遇清衛邑也古者諸侯或因朝覲或從王事無期約而適值於途必有兩君相見之儀近者為主遠者為賓稱先君以相接所以崇禮讓而絶慢易也周衰諸侯放恣非朝非會私為之約各簡其禮如道路相值者然異於古之不期而遇矣魯宋將尋宿之盟以衛來告亂而相見於清謂之不期而會可乎春秋志內之遇四並書及若曰以此及彼然也志外之遇三並以爵若曰以尊及卑然也皆莫適為主之辭而其出不以事接不以禮之罪具見矣宋公陳侯蔡人衛人伐鄭此書諸侯會伐之始亦東諸侯分黨之始蔡今河南上蔡縣縣西南有故城左傳宋殤公之即位也公子馮出奔鄭鄭人欲納之及衛州吁立將修先君之怨于鄭謂二年鄭人伐衛之怨而求寵于諸侯以和其民諸篡立者諸侯既與之會則不復討故求此寵使告于宋曰君若伐鄭以除君害謂公子馮君為主敝邑以賦與陳蔡從則衛國之願也宋人許之于是陳蔡方睦于衛故宋公陳侯蔡人衛人伐鄭圍其東門五日而還公問于衆仲曰衆仲魯臣衛州吁其成乎對曰臣聞以德和民不聞以亂以亂猶治絲而棼之也棼亂也夫州吁阻兵而安忍阻恃也阻兵無衆安忍無親衆畔親離難以濟矣恃兵則民殘民殘則衆叛安忍則刑過刑過則親離夫兵猶火也弗戢將自焚也夫州吁弒其君而虐用其民于是乎不務令德而欲以亂成必不免矣州吁弒君自立欲藉諸侯之寵以和其民因揣宋殤之忌公子馮為伐鄭之説以動宋而已亦託修先君廩延之怨搆成兵端則首謀者衛也而春秋以宋主兵此聖人誅亂賊必治其黨與之法也宋為大國於衛鄰近州吁弒逆義所當誅宋既不能申鄰國討賊之義乃反與亂賊為黨連兵伐鄭以遂其邪謀則人欲肆而天理滅矣故春秋以宋公為首諸國為從所以彰大義於天下也秋翬帥師此書大夫會伐之始左傳秋諸侯復伐鄭宋公使來乞師公辭之從衆仲之言羽父請以師會之羽父翬之字公弗許固請而行故書曰翬帥師疾之也公羊傳翬者何公子翬也何以不稱公子貶曷為貶與弒公也其與弒公奈何公子翬諂乎隱公謂隱公曰百姓安子諸侯悅子盍終為君矣隱公曰否吾使修塗裘吾將老焉塗裘邑名公子翬恐若其言聞乎桓于是謂桓曰吾為子口隱矣口以口語相發動也隱曰吾不反也稱諡傳者所加桓曰然則奈何曰請作難弒隱公于鍾巫之祭焉弒隱公也穀梁傳翬者何也公子翬也其不稱公子何也貶之也外大夫貶皆稱人內大夫貶皆去族稱名何為貶之也與于弒公故貶也天下惟大權最不可假人而兵權尤甚凡亂賊之欲動於惡未有不専主兵權者人主誠能辨之於早逆折其心則弒逆之萌杜矣宋殤連諸侯以伐鄭使來乞師隱公辭而弗許而翬乘此以竊兵權固請而行翬於是時已有無君之心故先儒以為鍾巫之禍自帥師會伐始也會宋公陳侯蔡人衛人伐鄭左傳諸侯之師敗鄭徒兵取其禾而還時鄭不車戰前書宋公陳侯蔡人衛人伐鄭此但言翬帥師會伐鄭於文義甚為簡明而再序四國何也言之重詞之復其中必有大美惡焉州吁弒君人倫大變宋及陳蔡黨惡搆禍以反天常翬又往會使亂臣賊子之勢益張此世變之極也聖人重言以著其惡而未幾魯宋胥搆篡弒之禍豈非蔑義亂倫氣類實相為感召哉九月衛人殺州吁于濮濮杜注陳地水名左傳州吁未能和其民厚問定君于石子石子石碏也石子曰王覲為可曰何以得覲曰陳桓公方有寵于王桓公稱諡左氏追書陳衛方睦若朝陳使請必可得也厚從州吁如陳石碏使告于陳曰衛國褊小老夫耄矣無能為也此二人者實弒寡君敢即圖之陳人執之而請涖于衛請衛人自臨討之九月衛人使右宰醜涖殺州吁于濮右宰官名醜衛臣名石碏使其宰獳羊肩涖殺石厚于陳宰石碏家臣也獳羊肩宰之姓名君子曰石碏純臣也惡州吁而厚與焉大義滅親古語其是之謂乎公羊傳其稱人何討賊之辭也人人得而討之穀梁傳稱人以殺殺有罪也祝吁之挈失嫌也衆所不與故直挈其名而道之無據位之嫌其月謹之也于濮者譏失賊也譏其不即討州吁之殺石碏主之而書衛人者弒君之賊人人得而誅之不必士師所以廣忠孝之路也若書石碏則似一人之私討而不見其從衆望誅有罪矣濮陳地據左氏陳人與有力焉而不以討賊之義豫之者州吁阻兵乘權衛之臣子力不能誅至於失賊之久實因四國連兵欲定其位耳故聖人以討賊與衛人以失賊罪諸侯程子謂春秋為爰書觀此類可以得其義例矣冬十有二月衛人立晉左傳衛人逆公子晉于邢邢國名姬姓侯爵杜注在廣平襄國縣今直𨽻邢臺縣有襄國故城冬十二月宣公即位書曰衛人立晉衆也公羊傳晉者何公子晉也立者何立者不宜立也其稱人何衆立之之辭也然則孰立之石碏立之石碏立之則其稱人何與尹氏立王子朝不稱人異詞故設問衆之所欲立也衆雖欲立之其立之非也穀梁傳衛人者衆辭也立者不宜立者也晉之名惡也惡謂不正其稱人以立之何也得衆也得衆則是賢也賢則其曰不宜立何也春秋之義諸侯與正而不與賢也正謂嫡長人者衆辭立者不宜立也晉乃桓公之弟莊公之子以次當立國人所共推戴而謂其不宜立者衛之臣子可以討賊不可以置君晉雖諸侯之子而內不承國於先君上不請命於天子衆謂宜立而遂自立焉可乎故春秋於衛人特書立晉以著擅置其君之罪於晉去其公子以明不請王命之非而父子君臣之道正矣然曰衛人立晉則一國之公也與書尹氏立朝為一族之私者異矣此聖人之權衡所以不爽於毫末也日講春秋解義卷二
