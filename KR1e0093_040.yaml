body:
  text: 欽定四庫全書日講春秋解義卷四十襄公十有四年春王正月季孫宿叔老㑹晉士丐齊人宋人衛人鄭公孫蠆曹人莒人邾人滕人薛人把人小邾人㑹吳于向蠆公羊作囆後同向杜注鄭地左傳十四年春吳告敗于晉前年為楚敗于庸浦㑹于向為吳謀楚故也范宣子數吳之不德也以退吳人吳伐楚喪故執莒公子務婁在㑹不書非卿以其通楚使也莒二于楚故比年伐魯將執戎子駒支駒支戎子名范宣子親數諸朝行之所在亦設朝位曰來姜戎氏昔秦人迫逐乃祖吾離于瓜州四嶽之後皆姓姜又别為允姓瓜州杜注地在燉煌今陜西肅州西五百餘里古燉煌郡地乃祖吾離被苫蓋苫編茅也蓋苫之别名䝉荆棘以來歸我先君我先君惠公有不腆之田與女剖分而食之中分為剖今諸侯之事我寡君不如昔者蓋言語漏泄則職女之由詰朝之事㑹事爾無與焉與將執女對曰昔秦人負恃其衆貪于土地逐我諸戎惠公蠲其大德蠲明也謂我諸戎是四嶽之裔胄也四嶽堯時方伯裔逺也胄後也毋是翦棄賜我南鄙之田狐狸所居豺狼所嘷我諸戎除翦其荆棘驅其狐狸豺狼以為先君不侵不叛之臣不內侵亦不外叛至于今不二昔文公與秦伐鄭秦人竊與鄭盟而舍戍焉于是乎有殽之師在僖三十三年晉禦其上戎亢其下亢猶當也秦師不復我諸戎實然譬如捕鹿晉人角之諸戎掎之角者當其頭掎者踣其足與晉踣之踣僵也戎何以不免自是以來晉之百役與我諸戎相繼于時言給晉役不曠時以從執政猶殽志也豈敢離逖今官之師旅官猶稱執事也無乃實有所闕以攜諸侯而罪我諸戎我諸戎飲食衣服不與華同贄幣不通言語不逹何惡之能為不與于㑹亦無瞢焉瞢悶也賦青蠅而退青蠅詩小雅取其愷悌君子無信讒言宣子辭焉辭謝使即事于㑹成愷悌也成愷悌不信讒也不書者戎為晉屬不得特逹于是子叔齊子為季武子介以㑹自是晉人輕魯幣而益敬其使齊子叔老字也言晉敬魯使經所以竝書二卿吳來在向諸侯㑹之故曰㑹吳使舉上客而叔老竝書者以卿行則不得不書矣季孫宿以卿為介而忘其亢叔老介於宿而不敢避魯事可知矣附録左傳吳子諸樊既除喪諸樊吳子乘之長子將立季札札諸樊少弟季札辭曰曹宣公之卒也諸侯與曹人不義曹君曹君公子負芻也殺大子自立事在成公十三年將立子臧子臧去之遂弗為也以成曹君君子曰能守節君義嗣也諸樊適子故曰義嗣誰敢奸君有國非吾節也札雖不才願附于子臧以無失節固立之棄其室而耕乃舍之𫝊言季札之讓且明吳兄弟相𫝊二月乙未朔日有食之夏四月叔孫豹㑹晉荀偃齊人宋人衛北宫括鄭公孫蠆曹人莒人邾人滕人薛人杞人小邾人伐秦秦晉兵爭止此左傳夏諸侯之大夫從晉侯伐秦以報櫟之役也櫟役在十一年晉侯待于竟使六卿帥諸侯之師以進經所以不稱晉侯及涇不濟涇杜注水出安定朝那縣至京兆高陸縣入渭叔向見叔孫穆子穆子賦匏有苦葉詩邶風義取深則厲淺則揭言已志在必濟叔向退而具舟魯人莒人先濟鄭子蟜見衛北宫懿子曰懿子北宫括與人而不固取惡莫甚焉若社稷何懿子說二子見諸侯之師而勸之濟濟涇而次秦人毒涇上流師人多死飲毒水故鄭司馬子蟜帥鄭師以進師皆從之至于棫林棫林杜注秦地案棫林即舊鄭咸林也今為華州屬陕西不獲成焉荀偃令曰雞鳴而駕塞井夷竈示不反唯余馬首是瞻言進退從已欒黶曰晉國之命未有是也余馬首欲東乃歸黶惡偃自専故棄之歸下軍從之左史謂魏莊子曰左史晉大夫不待中行伯乎中行伯荀偃莊子曰夫子命從帥夫子謂荀偃欒伯吾帥也黶下軍帥莊子為佐故曰吾帥吾將從之從帥所以待夫子也以從命為待伯游曰吾令實過悔之何及多遺秦禽軍帥不和恐多為秦所禽獲乃命大還晉人謂之遷延之役遷延却退欒針曰此役也報櫟之敗也役又無功晉之恥也吾有二位于戎路針黶之弟二位謂黶將下軍針為戎右敢不恥乎與士鞅馳秦師死焉鞅士丐子士鞅反欒黶謂士丐曰余弟不欲往而子召之余弟死而子來是而子殺余之弟也弗逐余亦將殺之士鞅奔秦于是齊崔杼宋華閲仲江㑹伐秦仲江宋公孫師之子不書惰也向之㑹亦如之衛北宫括不書于向亦惰書于伐秦攝也能自整攝從鄭子蟜俱濟涇秦伯問于士鞅曰晉大夫其誰先亡對曰其欒氏乎秦伯曰以其汰乎對曰然欒黶汰虐已甚猶可以免其在盈乎盈黶之子秦伯曰何故對曰武子之德在民如周人之思召公焉愛其甘棠况其子乎武子欒書黶之父也召公奭聽訟于甘棠之下周人思之不害其樹而作勿伐之詩在召南欒黶死盈之善未能及人武子所施沒矣而黶之怨實章將于是乎在秦伯以為知言為之請于晉而復之為二十一年晉滅欒氏張本此一役見晉悼公命將非人委政以階厲也夫以十三國之卿大夫帥重兵壓秦境而師出無律將各異心勞民無功晉侯待于境上視若贅旒此皆悼公終怠致諸臣之専恣也己未衛侯出奔齊公羊作衛侯衎左傳衛獻公戒孫文子寧惠子食文子孫林父惠子寧殖皆服而朝日旰不召旰晏也而射鴻于囿二子從之不釋皮冠而與之言皮冠田獵之冠也既不釋冠又不與食二子怒孫文子如戚戚孫文子邑孫蒯入使蒯文子之子公飲之酒使大師歌巧言之卒章大師掌樂大夫巧言詩小雅其卒章曰彼何人斯居河之麋無拳無勇職為亂階戚河上邑公欲以喻文子居河上而為亂也大師辭師曹請為之師曹樂人初公有嬖妾使師曹誨之琴師曹鞭之公怒鞭師曹三百故師曹欲歌之以怒孫子以報公公使歌之遂誦之恐孫蒯不解故蒯懼告文子文子曰君忌我矣弗先必死欲先公作亂并帑于戚而入見蘧伯玉曰伯玉蘧瑗君之暴虐子所知也大懼社稷之傾覆將若之何對曰君制其國臣敢奸之奸猶犯也雖奸之庸知愈乎言逐君更立未知當勝否遂行從近關出懼難作欲速出竟公使子蟜子伯子皮與孫子盟于丘宫三子衛羣公子疑孫子故盟之丘宫杜注近戚地孫子皆殺之四月己未子展奔齊子展衛獻公弟公如鄄鄄杜注衛地使子行于孫子子行羣公子使往請和孫子又殺之公出奔齊孫氏追之敗公徒于阿澤阿澤杜注濟北東阿縣西南有大澤鄄人執之公徒因敗散還故為公執之初尹公他學射于庾公差庾公差學射于公孫丁二子追公二子他與差公孫丁御公子魚曰子魚庾公差射為背師不射為戮射為禮乎禮射不求中射兩軥而還軥車軛卷者尹公他曰子為師我則逺矣乃反之公孫丁授公轡而射之貫臂貫他臂子鮮從公子鮮公母弟鱄及竟公使祝宗告亡且告無罪告宗廟定姜曰定姜公適母無神何告若有不可誣也有罪若何告無舍大臣而與小臣謀一罪也先君有冢卿以為師保而蔑之二罪也余以巾櫛事先君而暴妾使余三罪也告亡而已無告無罪公使厚成叔弔于衛曰厚成叔魯大夫寡君使瘠厚成叔名聞君不撫社稷而越在他竟若之何不弔以同盟之故使瘠敢私于執事曰有君不弔有臣不敏君不赦宥臣亦不帥職增淫發泄其若之何衛人使大叔儀對曰大叔儀衛大夫羣臣不佞得罪于寡君寡君不以即刑而悼棄之以為君憂君不忘先君之好辱弔羣臣又重恤之敢拜君命之辱重拜大貺厚孫歸復命厚孫成叔語臧武仲曰衛君其必歸乎有大叔儀以守有母弟鱄以出或撫其內或營其外能無歸乎齊人以郲寄衛侯郲齊所滅郲國及其復也以郲糧歸言其貪右宰穀從而逃歸穀衛大夫衛人將殺之辭曰余不說初矣言初從君非說之不獲已耳余狐裘而羔䄂狐裘至美也以羔為䄂則少惡喻已雖從君出其罪不多乃赦之衛人立公孫剽剽穆公孫黑背子殤公孫林父寧殖相之以聽命于諸侯聽盟㑹之命衛侯在郲臧紇如齊唁衛侯衛侯與之言虐退而告其人曰衛侯其不得入矣其言糞土也亡而不變何以復國子展子鮮聞之見臧紇與之言道順道理臧孫說謂其人曰衛君必入夫二子者或挽之或推之欲無入得乎為二十六年衛侯歸傳按春秋惟弒君者書某弒其君至君為其下所出祇書出奔而已蓋出之為言不容而見逐之謂言出奔則或君無道或臣彊皆可推其前後事迹而見之矣出奔而名者兩君之辭剽已立而衎不名者剽以公孫為貴卿交諸侯以逐其君而自取之故絶其兩君之稱也然則叔武攝位而鄭亦不名何也叔武稱子剽稱侯稱子者讓之意也稱侯者篡之實也美惡不嫌同辭附録左傳師歸自伐秦晉侯舍新軍禮也成國不過半天子之軍成國大國周為六軍諸侯之大者三軍可也于是知朔生盈而死朔知罃之長子盈朔弟也盈生而朔死盈生六年而武子卒彘裘亦幼皆未可立也新軍無帥故舍之裘士魴子十三年荀罃士魴卒子皆幼未任為卿故新軍無帥遂舍之師曠侍于晉侯師曠晉樂大師子野晉侯曰衛人出其君不亦甚乎對曰或者其君實甚良君將賞善而刑淫養民如子蓋之如天容之如地民奉其君愛之如父母仰之如日月敬之如神明畏之如雷霆其可出乎夫君神之主而民之望也若困民之主匱神乏祀百姓絶望社稷無主將安用之弗去何為天生民而立之君使司牧之勿使失性有君而為之二二卿佐使師保之勿使過度是故天子有公諸侯有卿卿置側室大夫有二宗士有朋友庶人工商皂隸牧圉皆有親昵以相輔佐也善則賞之過則匡之患則救之失則革之自王以下各有父兄子弟以補察其政史為書謂大史君舉則書瞽為詩瞽盲者為詩以風刺工誦針諌工樂人也誦針諫之辭大夫規誨士𫝊言士卑不得徑逹聞君過失傳告大夫庶人謗庶人不與政聞君過則誹謗商旅于市旅陳也陳其貨物以示時所貴尚百工獻藝獻其技藝以喻政事故夏書曰遒人以木鐸徇于路夏書𦙍征篇遒人行人之官也木鐸木舌金鈴徇于路求歌謡之言官師相規工執藝事以諌正月孟春于是乎有之有遒人徇路之事諌失常也天之愛民甚矣豈其使一人肆于民上以從其淫而棄天地之性必不然矣𫝊善師曠能因問盡言莒人侵我東鄙莒自滅鄫後七年之閒四侵魯境是蔑晉也湨梁之執蓋有由矣秋楚公子貞帥師伐吳左傳秋楚子為庸浦之役故在前年子囊師于棠以伐吳棠楚地寰宇記六合古棠邑今六合縣屬江南吳不出而還子囊殿以吳為不能而弗警吳人自皋舟之隘要而擊之皋舟吳險厄之道楚人不能相救吳人敗之獲楚公子宜穀傳言不備不可以師楚既不得志於北方故構怨于吳𫝊載是年冬子囊卒遺言必城郢則吳為楚患迫矣附録左傳王使劉定公賜齊侯命將昏于齊故也定公劉夏之諡曰昔伯舅大公右我先王股肱周室師保萬民世胙大師以表東海王室之不壞繄伯舅是賴今余命女環環齊靈公名兹率舅氏之典纂乃祖考無忝乃舊敬之哉無廢朕命𫝊言王室不能命有功冬季孫宿㑹晉士丐宋華閲衛孫林父鄭公孫蠆莒人邾人于戚左傳晉侯問衛故于中行獻子獻子荀偃對曰不如因而定之衛有君矣伐之未可以得志而勤諸侯史佚有言曰因重而撫之重不可移就撫安之仲虺有言曰亡者侮之亂者取之推亡固存國之道也君其定衛以待時乎冬㑹于戚謀定衛也定立剽范宣子假羽毛于齊而弗歸析羽為旌王者游車之所建齊私有之因謂之羽毛宣子聞而借觀之齊人始二晉悼用師於鄭衛衎無役不從今為其臣所逐晉當㑹諸侯納衛君誅孫寧以伸伯討乃聼賊臣立君而為㑹以定其位悼公之失莫甚於此林父在㑹以是知其謀定剽也荀偃弒君之賊其右剽也宜矣附録左傳楚子囊還自伐吳卒將死遺言謂子庚必城郢子庚司馬公子午也當代子囊為令尹君子謂子囊忠君薨不忘增其名謂前年諡君為共將死不忘衛社稷可不謂忠乎忠民之望也詩曰行歸于周萬民所望忠也詩小雅忠信為周言德行歸于忠信即為萬民所瞻仰十有五年春宋公使向戌來聘二月己亥及向戌盟于劉劉孔氏穎逹曰釋例地關蓋魯城外之近地左傳十五年春宋向戌來聘且尋盟報二年豹之聘尋十一年亳之盟見孟獻子尤其室尤責過也曰子有令聞而美其室非所望也對曰我在晉吾兄為之毁之重勞且不敢閒閒非也言獻子友于兄且不隱其實公嘗如晉晉侯出國而盟公于長樗此霸主所以懷望國也而魯以待向戌戍之亢公之卑為己甚矣劉夏逆王后于齊左傳官師從單靖公逆王后于齊卿不行非禮也官師劉夏非卿也天子不親迎使上卿逆公監之乃為合禮公羊傳劉夏者何天子之大夫也劉者何邑也其稱劉何以邑氏也外逆女不書此何以書過我也穀梁傳過我故志之也婚姻得禮者常事不書失禮然後書王后天下之母上儀天王昏禮莫大於是而使士往迎是卑其身而輕人倫之本矣故因劉夏之過我而書之以示非禮不書歸與紀季姜異魯不為主也附録左傳楚公子午為令尹代子囊公子罷戎為右尹蒍子馮為大司馬子馮叔敖從子公子橐師為右司馬公子成為左司馬屈到為莫敖屈到屈蕩子公子追舒為針尹追舒莊王子子南屈蕩為連尹養由基為宫廄尹以靖國人君子謂楚于是乎能官人官人國之急也能官人則民無覦心無覬覦以求幸詩云嗟我懷人置彼周行能官人也詩周南行列也周遍也詩人嗟歎言我思得賢人置之遍于列位是后妃之志以官人為急王及公侯伯子男甸采衛大夫各居其列所謂周行也鄭尉氏司氏之亂在十年其餘盜在宋鄭人以子西伯有子産之故納賂于宋三子之父皆為尉氏所殺故以馬四十乘百六十匹與師茷師慧樂師也茷慧其名三月公孫黑為質焉公孫黑子晳司城子罕以堵女父尉翩司齊與之良司臣而逸之賢而放之託諸季武子武子置諸卞鄭人醢之三人也三人堵女父尉翩司齊師慧過宋朝將私焉私小便其相曰相師者朝也慧曰無人焉相曰朝也何故無人慧曰必無人焉若猶有人豈其以千乘之相易淫樂之矇必無人焉故也千乘相謂子産等也言不為子産早殺三盜俟賂方歸是重淫樂而輕國相子罕聞之固請而歸之言子罕能改過夏齊侯伐我北鄙圍成公救成至遇遇杜注魯地公羊傳其言至遇何不敢進也衛衎在齊而季孫宿㑹戚以立剽故齊來伐魯於是時三分其民而公室卑弱不足以當敵故救成而不敢進也季孫救台遂入鄆而不忌公親救成則至遇而難前觀宿之彊則知公之所以弱矣季孫宿叔孫豹帥師城成郛左傳夏齊侯圍成二于晉故也于是乎城成郛由不能救成故成郛壞此孟氏私邑而叔季帥師城之者三家相黨以備齊為名興大役故其城堅固可守卒為魯患而不可墮也秋八月丁巳日有食之邾人伐我南鄙左傳秋邾人伐我南鄙亦二于晉故使告于晉晉將為㑹以討邾莒十二年十四年莒人伐魯未之討晉侯有疾乃止冬晉悼公卒遂不克㑹為明年㑹湨梁𫝊邾背晉與齊而黨於莒故來伐魯以望國而不競如此則民分於三桓故也冬十有一月癸亥晉侯周卒晉悼賢君也悼沒而春秋無霸矣晉自靈成景厲四世不競周嗣服之初慨然思復文公之業經營內外卒成三駕之功楚服其威鄭懷其德抑何盛也然謹於諸侯而縱於大夫工於撫鄭而拙於懷陳明於治楚而暗於治秦君子惜焉而尤失正者不討衛孫林父寧殖逐君之惡而庇之晉之六卿魯之三家齊之崔慶陳氏視此而縱矣附録左傳鄭公孫夏如晉奔喪夏子西子蟜送葬言諸侯畏晉故卿共葬宋人或得玉獻諸子罕子罕弗受獻玉者曰以示玉人玉人以為寶也故敢獻之子罕曰我以不貪為寶爾以玉為寶若以與我皆喪寶也不若人有其寶稽首而告曰小人懷璧不可以越鄉言必為盜所害納此以請死也請免死子罕置諸其里使玉人為之攻之攻治也富而後使復其所賣玉得富十二月鄭人奪堵狗之妻而歸諸范氏堵狗堵女父之族狗娶于晉范氏鄭人既誅女父畏狗因范氏作亂故奪其妻歸范氏先絶之𫝊言鄭之有謀十有六年春王正月葬晉悼公晉平初立見諸侯多不協汲汲欲㑹而速葬其親悖禮甚矣三月公㑹晉侯宋公衛侯鄭伯曹伯莒子邾子薛伯把伯小邾子于湨梁戊寅大夫盟湨梁杜注湨水出河內軹縣東南至溫入河案爾雅梁莫大于湨梁湨水名梁隄也今濟源縣西北原山有白澗水即湨水也左傳十六年春葬晉悼公平公即位平公悼公子彪羊舌肸為傅肸叔向也代士渥濁張君臣為中軍司馬張老子代其父祁奚韓襄欒盈士鞅為公族大夫祁奚去中軍尉為公族大夫去劇職就閒官韓襄無忌子虞丘書為乘馬御代程鄭改服修官蒸于曲沃既葬改喪服修官選賢能蒸冬祭也諸侯五月而葬既葬卒哭作主然後蒸嘗于廟今晉將有湨梁之役故速葬而蒸警守而下㑹于湨梁順河東行故曰下命歸侵田以我故執邾宣公莒犂比公犂比莒子號且曰通齊楚之使晉侯與諸侯宴于溫使諸大夫舞曰歌詩必類歌古詩當各從義類齊髙厚之詩不類荀偃怒且曰諸侯有異志矣使諸大夫盟髙厚髙厚逃歸于是叔孫豹晉荀偃宋向戌衛寧殖鄭公孫蠆小邾之大夫盟曰同討不庭自曹以下大夫不書故𫝊舉小邾以包之公羊傳諸侯皆在是其言大夫盟何信在大夫也何言乎信在大夫遍刺天下之大夫也曷為遍刺天下之大夫君若贅旒然旒旗旒贅繫屬之辭以旗旒為喻者言為臣下所執持東西莫能自主也穀梁傳湨梁之㑹諸侯失正矣諸侯㑹而曰大夫盟正在大夫也諸侯在而不曰諸侯之大夫大夫不臣也春秋書大夫皆有所繫救徐之役諸侯次匡而遣大夫往則大夫帥師實受諸侯之命也故書曰公孫敖帥師及諸侯之大夫救徐雞澤之㑹諸侯已盟而大夫又盟然猶受命盟袁僑也故書曰叔孫豹及諸侯之大夫及陳袁僑盟今湨梁之㑹諸侯皆在若大夫受命而盟則冝書魯卿及諸侯之大夫盟而獨書大夫則是大夫自相與盟非諸侯之命矣故不以大夫繫之諸侯著諸侯失政而大夫無諸侯也晉人執莒子邾子以歸執以歸始此諸侯有罪執之以歸而不歸京師已則不臣而以討人非正也故稱晉人而二君不名齊侯伐我北鄙齊侯自柯陵之㑹遂不復出但使世子伉禮出㑹蓋有輕諸侯之心晉㑹湨梁以討二齊獨不至乃益復伐我三年之間師五至魯暴亦甚矣夏公至自㑹見公出謀齊尚未及返而已見伐於齊也五月甲子地震叔老㑹鄭伯晉荀偃衛寧殖宋人伐許左傳許男請遷于晉欲叛楚諸侯遂遷許許大夫不可晉人歸諸侯唯以其師討許鄭子蟜聞將伐許遂相鄭伯以從諸侯之師鄭與許有宿怨故其君親行穆叔從公從公歸齊子帥師㑹晉荀偃齊子叔老書曰㑹鄭伯為夷故也夷平也言諸侯之卿可以㑹伯子男于義為平夏六月次于棫林庚寅伐許次于函氏棫林函氏杜注皆許地晉荀偃欒黶帥師伐楚以報宋楊梁之役晉師獨進楊梁役在十二年楚公子格帥師及晉師戰于湛阪湛阪杜注襄城昆陽縣北有湛水東入汝水經注湛水出犫縣北魚齒山東南流為湛浦即此今葉縣北有昆陽城楚師敗績晉師遂侵方城之外不書不告復伐許而還許未遷故鄭非主兵曷為㑹鄭伯春秋不以大夫主諸侯則推而屬之鄭正君臣之分也秋齊侯伐我北鄙圍成成左氏作郕今從公羊穀梁左傳秋齊侯圍郕郕魯孟氏邑二晉故伐魯孟孺子速徼之孟獻子之子莊子速也徼要也齊侯曰是好勇去之以為之名速遂塞海陘而還海陘杜注魯隘道去年伐我圍成今春再伐至是又圍成甚之也大雩冬叔孫豹如晉左傳冬穆叔如晉聘且言齊故言齊再伐魯晉人曰以寡君之未禘祀禘祀三年喪畢之吉祭與民之未息不然不敢忘穆叔曰以齊人之朝夕釋憾于敝邑之地是以大請敝邑之急朝不及夕引領西望曰庶幾乎庶幾晉來救比執事之閒恐無及也見中行獻子賦圻父圻父詩小雅周司馬掌封畿之兵甲故謂之圻父詩人責圻父為王爪牙不修其職使百姓受困苦之憂而無所止居獻子曰偃知罪矣敢不從執事以同恤社稷而使魯及此見范宣子賦鴻雁之卒章鴻雁詩小雅卒章曰鴻雁于飛哀鳴嗸嗸唯此哲人謂我劬勞言魯憂困嗸嗸然若鴻雁之失所宣子曰丐在此敢使魯無鳩乎鳩集也書如晉於圍成後著魯不能自彊於政治急則求晉非待敵保邦之策也日講春秋解義卷四十
