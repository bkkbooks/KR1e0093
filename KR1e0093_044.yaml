body:
  text: 欽定四庫全書日講春秋解義卷四十四襄公二十有六年春附録左傳二十六年春秦伯之弟針如晉修成修㑹夷儀歲之成叔向命召行人子員欲使答秦命行人子朱曰朱也當御御進也言次當行三云叔向不應子朱怒曰班爵同何以黜朱于朝撫劍從之叔向曰秦晉不和久矣今日之事幸而集晉國賴之不集三軍暴骨子員道二國之言無私子常易之姦以事君者吾所能御也拂衣從之人救之平公曰晉其庶乎吾臣之所爭者大師曠曰公室懼卑臣不心競而力爭謂二子不心競為忠而撫劍拂衣不務德而爭善爭謂所行為善私欲已侈能無卑乎王二月辛卯衛寧喜弒其君剽左傳衛獻公使子鮮為復使為己求反國辭敬姒強命之敬姒獻公及子鮮之母對曰君無信臣懼不免敬姒曰雖然以吾故也許諾初獻公使與寧喜言言復國寧喜曰必子鮮在不然必敗子鮮賢國人信之必欲使在其閒故公使子鮮子鮮不獲命于敬姒以公命與寧喜言曰苟反政由寧氏祭則寡人寧喜告蘧伯玉伯玉曰瑗不得聞君之出敢聞其入十四年孫氏欲逐獻公瑗走從近關出遂行從近關出告右宰穀衛大夫右宰榖曰不可獲罪于兩君前出獻公今弒剽天下誰畜之畜猶容也悼子曰吾受命于先人不可以二悼子寧喜受命在二十年榖曰我請使焉而觀之觀其可還與否遂見公于夷儀反曰君淹恤在外十二年矣而無憂色亦無寬言猶夫人也若不已死無日矣悼子曰子鮮在右宰榖曰子鮮在何益多而能亡言子鮮為義多不過亡出于我何為悼子曰雖然弗可以已孫文子在戚孫嘉聘于齊孫襄居守二子孫文子之子二月庚寅寧喜右宰榖伐孫氏不克伯國傷伯國孫襄父兄皆不在故乘弱攻之寧子出舍于郊欲奔伯國死孫氏夜哭國人召寧子寧子復攻孫氏克之辛卯殺子叔及大子角子叔衛侯剽言子叔剽無諡故書曰寧喜弒其君剽言罪之在寧氏也榖梁傳此不正其日何也殖也立之喜也君之正也父立以為君則子宜君之以明正也剽雖篡立然春秋之法其實篡也以篡書其實為君也以君書剽既篡立凡衛之臣子立於其朝者君臣之分已定有致難於剽者自宜以弒君書矣先儒多謂寧喜父子反覆於二君之閒故蔽其罪猶一曲之義也衛孫林父入于戚以叛書叛始此左傳孫林父以戚如晉以邑屬晉書曰入于戚以叛罪孫氏也臣之祿君實有之義則進否則奉身而退專祿以周旋戮也宋魚石入于彭城晉欒盈入于曲沃將為亂於國而抗其君不得以叛書叛者據邑而君不能討也故書叛自林父始春秋之義常以上下比事而見其始也書衛侯衎出奔齊繼書會于戚而林父在焉則知逐君者林父其終也書寧喜弒其君剽孫林父入于戚以叛繼書衎歸則知寧喜之弒由衎而林父為懼罪矣甲午衛侯衎復歸于衛左傳甲午衛侯入書曰復歸國納之也大夫逆于竟者執其手而與之言道逆者自車揖之逆于門者頷之而已頷搖其頭言衎驕心易生公至使讓大叔文子曰寡人淹恤在外二三子皆使寡人朝夕聞衛國之言吾子獨不在寡人在存問也公聞文子答寧喜之言故忿之古人有言曰非所怨勿怨寡人怨矣對曰臣知罪矣臣不佞不能負羈絏以從扞牧圉臣之罪一也有出者有居者出謂衎居謂剽也臣不能二通外內之言以事君臣之罪二也有二罪敢忘其死乃行從近關出公使止之傳言衛侯不能安和大臣公羊傳此諼君以弒也其言復歸何惡剽也曷為惡剽剽之立于是未有說也剽以公孫篡立位非其次故未有說然則曷為不言剽之立不言剽之立者以惡衛侯也衛侯失衆出奔故亦惡之穀梁傳日歸見知弒也喜弒君衎歸故録日以見其知情衛侯出奔齊及入于夷儀皆以爵稱今既得國乃書其名何也使人之臣弒其君而求利焉其惡大矣故特書名以著其罪而又書復歸以見國其所固有也附録左傳衛人侵戚東鄙以林父叛故孫氏訴于晉晉戌茅氏茅氏杜注戚東鄙殖綽伐茅氏殺晉戌三百人殖綽齊人今來在衛孫蒯追之弗敢擊文子曰厲之不如厲惡鬼以比殖綽遂從衛師敗之圉圉杜注衛地今直𨽻開州東有圉城雍鉏獲殖綽雍鉏孫氏臣復訴于晉為下晉討衛張本鄭伯賞入陳之功入陳在前年三月甲寅朔享子展賜之先路三命之服先八邑以路及命服為邑先八邑三十二井賜子産次路再命之服先六邑子産辭邑曰自上以下隆殺以兩禮也臣之位在四上卿子展次卿子西十一年良霄見經十九年乃立子産為卿故位在四且子展之功也臣不敢及賞禮請辭邑公固豫之乃受三邑位次當受二邑以公固與之故受三邑公孫揮曰子産其將知政矣讓不失禮夏晉侯使荀吳來聘左傳晉人為孫氏故召諸侯將以討衛也夏中行穆子來聘穆子荀吳召公也召公為澶淵㑹附録左傳楚子秦人侵吳及雩婁雩婁杜注屬安豐郡今江南霍丘縣西南有故城聞吳有備而還遂侵鄭五月至于城麇鄭皇頡戌之皇頡鄭大夫守城麇之邑出與楚師戰敗穿封戌囚皇頡公子圍與之爭之公子圍共王子靈王也正于伯州犂伯州犂曰請問于囚乃立囚立皇頡于庭而問之伯州犂曰所爭君子也其何不知言王子圍及穿封戌皆非細人易别識也上其手曰夫子為王子圍寡君之貴介弟也下其手曰此子為穿封戌方城外之縣尹也誰獲子上下手以道囚意囚曰頡遇王子弱焉弱敗也戌怒抽戈逐王子圍弗及楚人以皇頡歸印堇父與皇頡戌城䴢印堇父鄭大夫楚人囚之以獻于秦鄭人取貨于印氏以請之子大叔為令正主作辭令之正以為請子産曰不獲受楚之功而取貨于鄭不可謂國秦其不然受楚獻功大名也以貨免之小利也故謂秦不爾若曰拜君之勤鄭國微君之惠楚師其猶在敝邑之城下其可辭如此歸功于秦則堇父可得弗從遂行秦人不豫更幣從子産而後獲之𫝊稱子産之善于辭公會晉人鄭良霄宋人曹人于澶淵左傳六月公會晉趙武宋向戌鄭良霄曹人于澶淵以討衛疆戚田取衛西鄙懿氏六十以與孫氏懿氏杜注戚城西北五十里有懿城今戚城在開州北趙武不書尊公也向戌不書後也鄭先宋不失所也如期至于是衛侯會之晉將執之不得與會故不書晉人執寧喜北宫遺使女齊以先歸討其弒君伐孫氏也遺北宫適之子女齊司馬侯歸晉而後告諸侯故經書在秋衛侯如晉晉人執而囚之于士弱氏士弱晉主獄大夫秋七月齊侯鄭伯為衛侯故如晉晉侯兼享之晉侯賦嘉樂嘉樂詩大雅取其嘉樂君子顯顯令德宜民宜人受祿于天國景子相齊侯景子國弱賦蓼蕭蓼蕭詩小雅言大平澤及逺若露之在蕭以喻晉君恩澤及諸侯子展相鄭伯賦緇衣緇衣詩鄭風取適子之館兮還豫授子之粲兮言不敢違逺于晉叔向命晉侯拜二君曰寡君敢拜齊君之安我先君之宗祧也敢拜鄭君之不二也蓼蕭緇衣二詩所趣各不同故拜二君詞異國子使晏平仲私于叔向曰晉君宣其明德于諸侯恤其患而補其闕正其違而治其煩所以為盟主也今為臣執君若之何叔向告趙文子文子以告晉侯晉侯言衛侯之罪使叔向告二君言自以殺晉戍三百人為罪不以林父故國子賦轡之柔矣逸詩義取寬政以安諸侯若柔轡之御剛馬子展賦將仲子兮將仲子詩鄭風義取衆言可畏衛侯雖别有罪而衆人謂晉為臣執君晉侯乃許歸衛侯叔向曰鄭七穆罕氏其後亡者也子展儉而一子展鄭子罕之子鄭穆公十一子子展子西子産伯有子大叔子石伯石為七穆子然二子孔已亡子羽不為卿故惟言七穆澶淵衛地之近戚者晉黨於孫氏討衛而疆戚田因為此會此晉之所以失諸侯也夷儀之會以賂定亂賊此會復披衛地以奬叛臣蓋晉之彊家皆有弱其君之心故與鄰國之亂臣聲勢相倚平公暗弱聽其倒行逆施而不察豈不悖乎晉宋稱人會者非卿也凡此類宜以經為斷而不可以傳汨之疆戚田事本細微故諸國皆大夫而魯君獨親之吳人所譏國君道長而大夫不出門蓋謂此耳秋宋公殺其世子痤痤穀梁作座左傳初宋芮司徒生女子芮司徒宋大夫赤而毛棄諸堤下共姬之妾取以入共姬宋伯姬名之曰棄長而美平公入夕平公共姬子共姬與之食公見棄也而視之尤尤甚也姬納諸御嬖生佐佐元公惡而婉貌惡而心順大子痤美而很貌美而心很戾合左師畏而惡之合左師向戌寺人惠牆伊戾為大子內師而無寵惠牆氏伊戾名秋楚客聘于晉過宋大子知之請野享之公使往伊戾請從之公曰夫不惡女乎夫謂大子對曰小人之事君子也惡之不敢逺好之不敢近敬以待命敢有二心乎縱有共其外莫共其內臣請往也遣之至則欿用牲加書徴之詐作盟處為大子反徴驗而騁告公曰大子將為亂既與楚客盟矣公曰為我子又何求對曰欲速公使視之則信有焉有盟徴問諸夫人與左師夫人佐母棄也則皆曰固聞之公囚大子大子曰唯佐也能免我以其婉也召而使請曰日中不來吾知死矣左師聞之聒而與之語聒歡也欲使佐失期過期乃縊而死佐為大子公徐聞其無罪也乃亨伊戾左師見夫人之步馬者步馬習馬問之對曰君夫人氏也左師曰誰為君夫人余胡弗知圉人歸以告夫人夫人使饋之錦與馬先之以玉曰君之妾棄使某獻左師改命曰君夫人而後再拜稽首受之左師令使者改命也傳言宋公暗左師諛大子所以無罪而死申生之死晉獻終不寤宋公既知伊戾之讒而烹之乃於芮棄之寵愛左師之委任終無改焉大學於修身齊家專以辟為戒職此故耳晉人執衛寧喜公羊傳此執有罪何以不得為伯討不以其罪執之也寧喜身負大惡晉若正其罪而執之歸於京師則為霸討當如厲公之執曹伯以爵稱今以伐戚殺戌而執之以快林父之心悖矣殖與喜之惡一也殖以附晉免喜以背晉執林父與喜之惡一也林父以附晉獲庇喜以背晉見執然則晉非執弒君之賊執不附已者耳故稱人以著其罪焉附録左傳鄭伯歸自晉使子西如晉聘辭曰寡君來煩執事懼不免于戾使夏謝不敏夏子西名君子曰善事大國初楚伍參與蔡大師子朝友其子伍舉與聲子相善也聲子子朝之子伍舉子胥祖父椒舉也伍舉娶于王子牟王子牟為申公而亡獲罪出奔楚人曰伍舉實送之伍舉奔鄭將遂奔晉聲子將如晉遇之于鄭郊班荆相與食而言復故班布也布荆坐地共議歸楚事聲子曰子行也吾必復子及宋向戌將平晉楚平在明年聲子通使于晉還如楚令尹子木與之語問晉故焉且曰晉大夫與楚孰賢對曰晉卿不如楚其大夫則賢皆卿材也如把梓皮革自楚往也雖楚有材晉實用之子木曰夫獨無族姻乎對曰雖有而用楚材實多歸生聞之歸生聲子名善為國者賞不僭而刑不濫賞僭則懼及淫人刑濫則懼及善人若不幸而過寧僭無濫與其失善寧其利淫無善人則國從之從之亡也詩曰人之云亡邦國殄瘁無善人之謂也詩大雅殄盡也瘁病也故夏書曰與其殺不辜寧失不經懼失善也夏書大禹謨不經不用常法商頌有之曰不僭不濫不敢怠皇命于下國封建厥福詩商頌言殷湯賞不僭差刑不濫溢不敢怠解以自寬暇故能為下國所命為天子此湯所以獲天福也古之治民者勸賞而畏刑恤民不倦賞以春夏刑以秋冬順天時是以將賞為之加膳加膳則飫賜飫饜也酒食賜下無不饜足所謂加膳也此以知其勸賞也將刑為之不舉不舉則徹樂此以知其畏刑也夙興夜寐朝夕臨政此以知其恤民也三者禮之大節也有禮無敗今楚多淫刑其大夫逃死于四方而為之謀主以害楚國不可救療所謂不能也不能用其材子儀之亂在文十四年析公奔晉晉人置諸戎車之殿殿後車以為謀主繞角之役晉將遁矣析公曰楚師輕窕易震蕩也若多鼓鈞聲以夜軍之楚師必遁晉人從之楚師宵潰晉遂侵蔡襲沈獲其君敗申息之師于桑隧獲申麗而還成六年晉欒書救鄭與楚師遇于繞角楚師還晉侵沈獲沈子八年復侵楚敗申息獲申麗鄭于是不敢南面楚失華夏則析公之為也雍子之父兄譖雍子君與夫人不善是也不是其曲直雍子奔晉晉人與之鄐鄐杜注晉邑以為謀主彭城之役晉楚遇于靡角之谷在成十八年晉將遁矣雍子發命于軍曰歸老幼反孤疾二人役歸一人簡兵搜乘秣馬蓐食師陳焚次次舍也焚舍示必死明日將戰行歸者而逸楚囚欲使楚知之楚師宵潰晉降彭城而歸諸宋以魚石歸在元年楚失東夷子辛死之則雍子之為也楚東小國及陳見楚不能救彭城皆叛五年楚人討陳叛故殺令尹子辛子反與子靈爭夏姬子靈巫臣而雍害其事子靈奔晉晉人與之邢邢杜注晉邑以為謀主扞禦北狄通吳于晉教吳叛楚教之乘車射御驅侵使其子狐庸為吳行人焉吳于是伐巢取駕克棘入州來駕棘杜注皆楚邑譙國酇縣東北有棘亭在今河南永城縣南楚罷于奔命至今為患則子靈之為也事見成七年若敖之亂伯賁之子賁皇奔晉晉人與之苖若敖亂在宣四年苖杜注晉邑今河南濟源縣西有苖亭以為謀主鄢陵之役在成十六年楚晨壓晉軍而陳晉將遁矣苖賁皇曰楚師之良在其中軍王族而已若塞井夷竈成陳以當之欒范易行以誘之欒書時將中軍范燮佐之易行謂簡易兵備令楚貪已不復顧二穆之兵中行二郤必克二穆郤錡時將上軍中行偃佐之郤至佐新軍令此三人分良以攻二穆之兵楚子重子辛皆出穆王故曰二穆吾乃四萃于其王族必大敗之四萃四靣集攻之晉人從之楚師大敗王夷師熸夷傷也熸火滅也軍敗之狀子反死之鄭叛吳興楚失諸侯則苖賁皇之為也子木曰是皆然矣聲子曰今又有甚于此椒舉娶于申公子牟子牟得戾而亡君大夫謂椒舉女實遣之懼而奔鄭引領南望曰庶幾赦余亦弗圖也今在晉矣晉人將與之縣以比叔向彼若謀害楚國豈不為患子木懼言諸王益其祿爵而復之聲子使椒鳴逆之椒鳴伍舉子八月壬午許男寧卒于楚冬楚子蔡侯陳侯伐鄭左傳許靈公如楚請伐鄭十六年晉伐許他國皆大夫獨鄭伯自行故許恚欲報之曰師不興孤不歸矣八月卒于楚楚子曰不伐鄭何以求諸侯冬十月楚子伐鄭鄭人將禦之子産曰晉楚將平諸侯將和和在明年楚王是故昧于一來不如使逞而歸乃易成也夫小人之性釁于勇嗇于禍以足其性而求名焉者非國家之利也若何從之釁動也嗇貪也言鄭之欲與楚戰者皆釁勇貪名之人非能為國計慮久利不可從子展說不禦寇十二月乙酉入南里南里杜注鄭邑今河南新鄭縣南有地名南里墮其城涉于樂氏樂氏杜注津名在今河南新鄭縣境洧水濟渡處門于師之梁鄭城門縣門發獲九人焉涉于汜而歸于汜城下涉汝水南歸而後葬許靈公卒靈公之志而後葬之楚以許故偕蔡陳伐鄭鄭自蕭魚以來至此三被楚禍而猶未忍叛晉則悼公推誠之效也然十八年楚公子午不得志於鄭二十四年諸侯救之此年諸侯不救鄭亦不禦使楚得逞蓋是時晉平昏庸大夫專恣不在諸侯而南北分霸之勢成矣葬許靈公附録左傳衛人歸衛姬于晉乃釋衛侯衛侯以女說晉而後得免君子是以知平公之失政也晉韓宣子聘于周王使請事問何事來聘對曰晉士起將歸時事于宰旅無他事矣起宣子名禮諸侯大夫入天子國稱士時事四時貢職宰旅冢宰之下士言獻貢賦于宰旅不敢斥尊王聞之曰韓氏其昌阜于晉乎辭不失舊齊人城郟之歲在二十四年其夏齊烏餘以廪丘奔晉烏餘齊大夫麇丘杜注東郡廩丘縣故城是在今山東范縣東南襲衛羊角取之羊角杜注廩丘縣所治羊角城是在今山東范縣東南新安村遂襲我髙魚髙魚杜注髙魚城在廩丘縣東北今山東鄆城縣西髙魚鄉是其地有大雨自其竇入雨故水竇開介于其庫入髙魚庫而介其甲以登其城克而取之又取邑于宋于是范宣子卒宣子范丐諸侯弗能治也及趙文子為政乃卒治之文子言于晉侯曰晉為盟主諸侯或相侵也則討而使歸其地今烏餘之邑皆討類也言于比類宜見討而貪之是無以為盟主也請歸之公曰諾孰可使也對曰胥梁帶能無用師胥梁帶晉大夫能無用師言有權謀晉侯使往二十有七年春附録左傳二十七年春胥梁帶使諸喪邑者具車徒以受地必周諸喪邑謂齊魯宋也周密也必密來勿以受地為名使烏餘具車徒以受封烏餘以地來故詐許封之烏餘以其衆出使諸侯僞效烏餘之封者效致也使齊魯宋僞若致邑封烏餘者而遂執之盡獲之皆取其邑而歸諸侯諸侯是以睦于晉傳言趙文子賢故平公雖失政而諸侯猶睦齊侯使慶封來聘左傳齊慶封來聘其車美孟孫謂叔孫曰慶季之車季慶封字不亦美乎叔孫曰豹聞之服美不稱必以惡終美車何為叔孫與慶封食不敬為賦相鼠亦不知也相鼠詩鄘風曰相鼠有皮人而無儀人而無儀不死何為慶封不知此詩為己言其閽甚為明年慶封來奔傳齊魯不交好者三十年於兹景公即位始修好於四鄰而命慶封來聘亦賢於日尋侵伐者矣夏叔孫豹㑹晉趙武楚屈建蔡公孫歸生衛石惡陳孔奐鄭良霄許人曹人于宋奐公羊作瑗後同晉楚始同主盟左傳宋向戌善于趙文子又善于令尹子木欲弭諸侯之兵以為名欲獲息民之名如晉告趙孟趙孟謀于諸大夫韓宣子曰兵民之殘也財用之蠧蠧害物之蟲小國之大菑也將或弭之雖曰不可必將許之弗許楚將許之以召諸侯則我失為盟主矣晉人許之如楚楚亦許之如齊齊人難之陳文子曰晉楚許之我焉得己且人曰弭兵而我弗許則固攜吾民矣將焉用之齊人許之告于秦秦亦許之皆告于小國為會于宋五月甲辰晉趙武至于宋丙午鄭良霄至六月丁未朔宋人享趙文子叔向為介司馬置折俎禮也折俎體解節折升之于俎合卿享宴之禮故曰禮也周禮司馬掌會同之事仲尼使舉是禮也以為多文辭舉謂記録之也宋向戌自美弭兵之意敬逆趙武趙武叔向因享宴之㑹展賓主之辭故仲尼以為多文辭戊申叔孫豹齊慶封陳須無衛石惡至須無陳文子甲寅晉荀盈從趙武至從後也後武遣盈如楚丙辰邾悼公至小國故君自來壬戌楚公子黑肱先至成言于晉時令尹子木止陳遣黑肱就晉大夫成盟載之言兩相然可丁卯宋向戌如陳從子木成言于楚戊辰滕成公至子木謂向戌請晉楚之從交相見也使諸侯從晉楚者更相朝見庚午向戌復于趙孟趙孟曰晉楚齊秦匹也晉之不能于齊猶楚之不能于秦也不能服而使之楚君若能使秦君辱于敝邑寡君敢不固請于齊壬申左師復言于子木子木使馹謁諸王王曰釋齊秦他國請相見也經所以不書齊秦秋七月戊寅左師至從陳還是夜也趙孟及子晳盟以齊言子晳公子黑肱素要齊其辭至盟時不得復訟爭庚辰子木至自陳陳孔奐蔡公孫歸生至曹許之大夫皆至以藩為軍示不相忌晉楚各處其偏晉處北楚處南伯夙謂趙孟曰伯夙荀盈楚氛甚惡懼難氛氣也言楚有襲晉之氣趙孟曰吾左還入于宋若我何營在宋北東頭為上故晉營在東有急可左回入宋東門晉楚爭衡諸侯各有所屬前此時叛而即楚者不過陳蔡鄭許近楚之國耳今則南北分霸魯宋衛曹皆以事晉者事楚往朝會伐而天下之大防盡潰矣自晉士縠盟垂隴以前雖霸國之大夫不以名見也繼而內大夫與霸國之大夫離㑹以名見繼而齊宋衛之大夫衆會以名見繼而鄭大夫亦以名見至此而諸侯之大夫盡以名見其稱人者獨微國耳蓋大夫益張禮樂征伐皆自之出而列國之大防盡潰矣此魯侯降為家人六卿分晉之端兆也衛殺其大夫寧喜左傳衛寧喜專公患之公孫免餘請殺之免餘衛大夫公曰微寧子不及此吾與之言矣言政由寧氏事未可知祗成惡名止也對曰臣殺之君勿與知乃與公孫無地公孫臣謀二公孫衛大夫使攻寧氏弗克皆死公曰臣也無罪父子死余矣獻公出時公孫臣之父為孫氏所殺夏免餘復攻寧氏殺寧喜及右宰榖尸諸朝榖不書非卿也石惡將會宋之盟受命而出衣其尸枕之股而哭之欲斂以亡懼不免且曰受命矣乃行行㑹于宋為明年石惡奔傳穀梁傳稱國以殺罪纍上也寧喜弒君其以纍上之辭言之何也嘗為大夫與之涉公事矣涉猶歷也寧喜出君弒君而不以弒君之罪罪之者惡獻公也剽篡國者也國人可討而寧喜嘗事之以為君不得殺也故書弒以正其罪喜弒君者也凡人宜討而衛獻與之要言以速其弒與之共事而假手於他人以殺之則殺之不以其罪故稱國以殺而不去其官衛侯之弟鱄出奔晉鱄穀梁作專左傳子鮮曰逐我者出謂孫林父納我者死謂寧喜賞罰無章何以沮勸君失其信而國無刑不亦難乎且鱄實使之使寧喜納君遂出奔晉公使止之不可及河又使止之止使者而盟于河誓不還託于木門木門杜注晉邑不鄉衛國而坐怨之深也木門大夫勸之仕不可曰仕而廢其事罪也從之昭吾所以出也將誰訴乎從之謂治其事也事治則明已出欲仕無所自訴吾不可以立于人之朝矣終身不仕公喪之如稅服終身稅即繐也喪服繐縗裳縷細而希非五服之常本無月數痛愍子鮮故特為此服此服無月數而獻公尋薨故言終身公與免餘邑六十辭曰唯卿備百邑臣六十矣下有上祿亂也此一乘之邑非四井之邑論語稱千室又云十室明通稱臣弗敢聞且寧子唯多邑故死臣懼死之速及也公固與之受其半以為少師公使為卿辭曰大叔儀不二能贊大事君其命之乃使文子為卿文子大叔儀公羊傳衛殺其大夫寧喜則衛侯之弟鱄曷為出奔晉為殺寧喜出奔也曷為為殺寧喜出奔衛寧殖與孫林父逐衛侯而立公孫剽寧殖病將死謂喜曰黜公者非吾意也孫氏為之我即死女能固納公乎喜曰諾寧殖死喜立為大夫使人謂獻公曰黜公者非寧氏也孫氏為之吾欲納公何如獻公曰子苟納我吾請與子盟喜曰無所用盟請使公子鱄約之喜素信鱄獻公謂公子鱄曰寧氏將納我吾欲與之盟其言曰無所用盟請使公子鱄約之子固為我與之約矣公子鱄辭曰夫負羈縶執鈇鑕從君東西南北則是臣僕庶孽之事也若夫約言為信則非臣僕庶孽之所敢與也獻公怒曰黜我者非寧氏與孫氏凡在爾欲以此語迫令必約之公子鱄不得已而與之約己約歸至殺寧喜公子鱄挈其妻子而去之將濟于河挈其妻子而與之盟曰苟有履衛地食衛粟者昧雉彼視昧割也時割雉以為盟曰負盟者視彼割雉榖梁傳專喜之徒也專之為喜之徒何也已雖急納其兄與人之臣謀弒其君是亦弒君者也專其曰弟何也專有是信者言君本使專與喜為約許以賂君賂不入乎喜而殺喜是君不直乎喜也故出奔晉織絇邯鄲終身不言衛專之去合乎春秋得見幾之義衛侯食言使鱄引咎而自竄過固大矣而鱄亦不能無過蓋始雖為兄求復與喜要言然宜思所以置剽俾兩得而無害至於政由寧氏祭則寡人則信不近義言之必不可復者也始謀不臧終雖隱身於異國亦差彊於食其言而不知自愧者耳先儒多以去賢鱄過矣秋七月辛巳豹及諸侯之大夫盟于宋左傳辛巳將盟于宋西門之外楚人衷甲甲在衣中欲因會擊晉伯州犂曰合諸侯之師以為不信無乃不可乎夫諸侯望信于楚是以來服若不信是棄其所以服諸侯也固請釋甲子木曰晉楚無信久矣事利而已苟得志焉焉用有信大宰退太宰伯州犂告人曰令尹將死矣不及三年求逞志而棄信志將逞乎志以發言言以出信信以立志參以定之志言信三者具而後身安存信亡何以及三為明年子木死起本趙孟患楚衷甲以告叔向叔向曰何害也匹夫一為不信猶不可單斃其死單盡也斃踣也若合諸侯之卿以為不信必不捷矣食言者不病不病者單斃于死非子之患也夫以信召人而以僭濟之必莫之與也安能害我且吾因宋以守病則夫能致死為楚所病則欲入宋城夫謂宋也與宋致死雖倍楚可也子何懼焉又不及是曰弭兵以召諸侯而稱兵以害我吾庸多矣非所患也季武子使謂叔孫以公命曰視邾滕兩事晉楚則貢賦重故欲比小國武子恐叔孫不從其言故假公命以敦之既而齊人請邾宋人請滕皆不與盟叔孫曰邾滕人之私也我列國也何故視之宋衛吾匹也乃盟故不書其族言違命也晉楚爭先爭先歃血晉人曰晉固為諸侯盟主未有先晉者也楚人曰子言晉楚匹也若晉常先是楚弱也且晉楚狎主諸侯之盟也久矣狎更也豈專在晉叔向謂趙孟曰諸侯歸晉之德只非歸其尸盟也子務德無爭先且諸侯盟小國固必有尸盟者小國主辨具楚為晉細不亦可乎乃先楚人書先晉晉有信也蓋孔子追正之壬午宋公兼享晉楚之大夫趙孟為客客一坐所尊子木與之言弗能對使叔向侍言焉子木亦不能對也乙酉宋公及諸侯之大夫盟于蒙門之外前盟諸大夫不敢敵公禮也今宋公以近在其國故謙而重盟䝉門杜注宋城門子木問于趙孟曰范武子之德何如對曰夫子之家事治言于晉國無隱情其祝史陳信于鬼神無愧辭子木歸以語王王曰尚矣哉能歆神人宜其光輔五君以為盟主也五君謂文襄靈成景子木又語王曰宜晉之伯也有叔向以佐其卿楚無以當之不可與爭晉荀盈遂如楚涖盟重結晉楚之好鄭伯享趙孟于垂隴自宋還過鄭子展伯有子西子産子大叔二子石從二子石印段公孫段趙孟曰七子從君以寵武也請皆賦以卒君貺武亦以觀七子之志詩以言志子展賦草蟲草蟲詩召南曰未見君子憂心忡忡亦既見止亦既覯止我心則降以趙孟為君子趙孟曰善哉民之主也在上不忘降故可以主民抑武也不足以當之辭君子伯有賦鶉之賁賁鶉之賁賁詩鄘風義取人之無良我以為兄我以為君也趙孟曰牀笫之言不踰閾况在野乎非使人之所得聞也笫簀也此詩刺淫亂故云牀笫之言子西賦黍苖之四章黍苖詩小雅四章曰肅肅謝功召伯營之列列征師召伯成之比趙孟于召伯趙孟曰寡君在武何能焉推善于其君子産賦隰桑隰桑詩小雅義取思見君子盡心以事之曰既見君子其樂如何趙孟曰武請受其卒章卒章曰心乎愛矣遐不謂矣中心藏之何日忘之趙孟欲子産之見規誨子大叔賦野有蔓草野有蔓草詩鄭風取其邂逅相遇適我願兮趙孟曰吾子之惠也大叔喜于相遇故趙武受其惠印段賦蟋蟀蟋蟀詩唐風曰無已大康職思其居好樂無荒良士瞿瞿言瞿瞿然顧禮義趙孟曰善哉保家之主也吾有望矣能戒懼不荒所以保家公孫段賦桑扈桑扈詩小雅義取君子有禮文故能受天之祜趙孟曰匪交匪敖福將焉往此桑扈詩卒章趙孟因以取意若保是言也欲辭福祿得乎卒享文子告叔向曰伯有將為戮矣詩以言志志誣其上而公怨之以為賓榮伯有稱人之無良是誣其上也趙孟倡賦詩以自寵故曰為賓榮其能久乎幸而後亡叔向曰然已侈所謂不及五稔者夫子之謂矣為三十年鄭殺良霄傳文子曰其餘皆數世之主也子展其後亡者也在上不忘降謂賦草蟲曰我心則降印氏其次也樂而不荒謂賦蟋蟀曰好樂無荒樂以安民不淫以使之後亡不亦可乎宋左師請賞曰請免死之邑欲宋君稱功加厚賞故謙言免死之邑公與之邑六十以示子罕子罕曰凡諸侯小國晉楚所以兵威之畏而後上下慈和慈和而後能安靖其國家以事大國所以存也無威則驕驕則亂生亂生必滅所以亡也天生五材金木水火土也民竝用之廢一不可誰能去兵兵之設久矣所以威不軌而昭文德也聖人以興謂湯武亂人以廢謂桀紂廢興存亡昏明之術皆兵之由也而子求去之不亦誣乎以誣道蔽諸侯罪莫大焉縱無大討而又求賞無厭之甚也削而投之削賞左師之書左師辭邑向氏欲攻司城司城子罕左師曰我將亡夫子存我德莫大焉又可攻乎君子曰彼己之子邦之司直詩鄭風司主也樂喜之謂乎樂喜子罕也善其不阿向戌何以恤我我其收之詩周頌恤憂也收取也向戌之謂乎善向戌能知其過公羊傳曷為再言豹殆諸侯也殆危也曷為殆諸侯為衛石惡在是也曰惡人之徒在是矣榖梁傳湨梁之會諸侯在而不曰諸侯之大夫大夫不臣也晉趙武恥之豹云者恭也不舉姓氏諸侯不在而曰諸侯之大夫大夫臣也其臣恭也晉趙武為之㑹也楚之爭霸常始於宋而南北分霸卒成於宋自向戌為弭兵之說而趙武從之驅天下諸侯南鄉而朝楚楚欲不違而晉勢益大屈矣方是時晉楚皆倦於兵是以偶息數年之爭而魯師取鄆晉師敗狄至楚圍篡立大合諸侯伐吳滅賴所謂弭兵者安在哉湨梁之盟不書諸侯之大夫以諸侯在會而大夫盟故不書諸侯以罪其臣此盟則諸侯不在故書諸侯之大夫以存其君義各有當也附録左傳齊崔杼生成及彊而寡偏喪曰寡寡特也娶東郭姜生明東郭姜以孤入曰棠無咎無咎棠公子與東郭偃相崔氏偃姜之弟崔成有疾而廢之有惡疾也而立明成請老于崔崔杜注濟南東朝陽縣西北有崔氏城在今山東章丘縣西北崔子許之偃與無咎弗豫曰崔宗邑也必在宗主宗邑宗廟所在宗主謂崔明成與彊怒將殺之告慶封曰夫子之身夫子謂崔杼亦子所知也唯無咎與偃是從父兄莫得進矣大恐害夫子敢以告慶封曰子姑退吾圗之告盧蒲嫳嫳慶封屬大夫盧蒲嫳曰彼君之讎也君謂齊莊公天或者將棄彼矣彼實家亂子何病焉崔之薄慶之厚也他日又告成彊復告慶封曰苟利夫子必去之難吾助女九月庚辰崔成崔彊殺東郭偃棠無咎于崔氏之朝崔子怒而出其衆皆逃求人使駕不得使圉人駕寺人御而出圉人飬馬者寺人奄士且曰崔氏有福止余猶可恐滅家禍不止其身遂見慶封慶封曰崔慶一也言如一家是何敢然請為子討之使盧蒲嫳帥甲以攻崔氏崔氏堞其宫而守之堞短垣使其衆居短垣內以自守弗克使國人助之遂滅崔氏殺成與彊而盡俘其家其妻縊妻東郭姜嫳復命于崔子且御而歸之嫳為崔子御至則無歸矣乃縊終入于其宫不見其妻凶崔明夜辟諸大墓開先人之冢以藏之辛巳崔明來奔慶封當國楚薳罷如晉涖盟罷令尹子蕩報荀盈也晉侯享之將出賦既醉既醉詩大雅曰既醉以酒既飽以德君子萬年介爾景福以美晉侯比之太平君子也叔向曰薳氏之有後于楚國也宜哉承君命不忘敏子蕩將知政矣敏以事君必能養民政其焉往崔氏之亂在二十五年申鮮虞來奔申鮮虞莊公之黨僕賃于野以喪莊公為莊公服喪冬楚人召之遂如楚為右尹傳言楚能用賢冬十有二月乙亥朔日有食之左傳十一月乙亥朔日有食之辰在申司歷過也再失閏矣謂斗建指申周十一月今之九月當建戌而在申故知再失閏也文十一年三月甲子至今年七十一歲應有二十六閏今長歷推得二十四閏通計少再閏傳曰辰在申再失閏矣若十有二月當為辰在亥則是三失閏非再失也杜氏預推歷與傳合當以傳為定日講春秋解義卷四十四
