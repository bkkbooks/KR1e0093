body:
  text: 欽定四庫全書日講春秋解義卷四十八昭公三年春王正月附録左傳三年春王正月鄭游吉如晉送少姜之𦵏梁丙與張趯見之二子晉大夫梁丙曰甚矣哉子之為此来也卿共妾葬過禮甚子大叔曰將得已乎昔文襄之霸也其務不煩諸侯令諸侯三嵗而聘五嵗而朝有事而㑹不協而盟君薨大夫弔卿共𦵏事夫人士弔大夫送葬足以昭禮命事謀闕而已朝聘以昭禮盟㑹以謀闕無加命矣命有常今嬖寵之䘮不敢擇位而數于守適不敢以其位卑而令禮數如守適夫人惟懼獲戾豈敢憚煩少姜有寵而死齊必繼室今兹吾又將来賀不唯此行也張趯曰善哉吾得聞此數也然自今子其無事矣譬如火焉火心星火中寒暑乃退心以季夏昏中而暑退季冬旦中而寒退此其極也能無退乎晉將失諸侯諸侯求煩不獲言将不能復煩諸侯二大夫退子大叔告人曰張趯有知其猶在君子之後乎譏其無隐諱丁未滕子原卒原公羊作泉左傳丁未滕子原卒同盟故書名附録左傳齊侯使晏嬰請繼室于晉復以女繼少姜曰寡君使嬰曰寡人願事君朝夕不倦將奉質幣以無失時則國家多難是以不獲不腆先君之適謂少姜以備内官焜燿寡人之望則又無禄早世隕命寡人失望君若不忘先君之好恵顧齊國辱收寡人徼福于大公丁公二公齊先君照臨敝邑鎮撫其社稷則猶有先君之適及遺姑姊妹若而人言如常人不敢譽君若不棄敝邑而辱使董振擇之董正也振整也言選擇精審也以備嬪嬙寡人之望也韓宣子使叔向對曰寡君之願也寡君不能獨任其社稷之事未有伉儷在縗絰之中是以未敢請君有辱命恵莫大焉若恵顧敝邑撫有晉國賜之内主豈唯寡君舉羣臣實受其貺其自唐叔以下實寵嘉之既成昏許昏成晏子受禮受賓享之禮叔向從之宴相與語叔向曰齊其何如問興衰晏子曰此季世也吾弗知齊其為陳氏矣公棄其民而歸于陳氏齊舊四量豆區釜鍾四升為豆各自其四以登于釜四豆為區區斗六升四區為釜釡六斗四升登成也釜十則鍾六斛四斗陳氏三量皆登一焉鍾乃大矣登加也加一謂加舊量之一也以五升為豆五豆為區五區為釡則區二斗釡八斗鍾八斛以家量貸而以公量收之貸厚而收薄山木如市弗加于山魚鹽蜃蛤弗加于海價如在山海不加貴民參其力二入于公而衣食其一言公重賦斂公聚朽蠧而三老凍餒三老謂上夀中夀下夀皆八十已上不見養遇國之諸市屨賤踊貴踊刖足者屨言刖多民人痛疾而或燠休之燠休痛念之聲謂陳氏也其愛之如父母而歸之如流水欲無獲民將焉辟之箕伯直柄虞遂伯戲四人皆舜後陳氏之先其相胡公大姬已在齊矣胡公四人之後周始封陳之祖大姬其妃也言陳氏將有國其先祖鬼神已共在齊叔向曰然雖吾公室今亦季世也戎馬不駕卿無軍行公乗無人卒列無長百人為卒言人皆非其人非其長庶民罷敝而公室滋侈道殣相望而女富溢尤嬖寵之家民聞公命如逃寇讎欒郤胥原狐續慶伯降在皁𨽻八姓晉舊臣之族也皁𨽻賤官政在家門民無所依君日不悛以樂慆憂慆蔵也公室之卑其何日之有讒鼎之銘曰讒鼎鼎名昧旦丕顯後世猶怠昧旦早起也丕大也言夙興以務大顯後世猶觧怠况日不悛其䏻久乎晏子曰子將若何叔向曰晉之公族盡矣肸聞之公室將卑其宗族枝葉先落則公從之肸之宗十一族惟羊舌氏在而已肸又無子無賢子公室無度幸而得死豈其獲祀初景公欲更晏子之宅曰子之宅近市湫隘囂塵不可以居請更諸爽塏者爽明塏燥辭曰君之先臣容焉臣不足以嗣之于臣侈矣且小人近市朝夕得所求小人之利也敢煩里旅旅衆也不敢勞衆為己宅公笑曰子近市識貴賤乎對曰既利之敢不識乎公曰何貴何賤于是景公繁于刑有鬻踊者故對曰踊貴屨賤既已告于君故與叔向語而稱之景公為是省于刑君子曰仁人之言其利博哉晏子一言而齊侯省刑詩曰君子如祉亂庶遄已詩小雅如行也祉福也遄疾也言君子行福則庶㡬亂疾止也其是之謂乎及晏子如晉公更其宅反則成矣既拜拜謝新宅乃毁之而為里室皆如其舊本壊里室以大晏子之宅故復之則使宅人反之還其故室且諺曰非宅是卜唯隣是卜卜良鄰二三子先卜隣矣二三子謂隣人違卜不祥君子不犯非禮去儉即奢為非禮小人不犯不祥古之制也吾敢違諸乎卒復其舊宅公弗許因陳桓子以請乃許之夏四月鄭伯如晉公孫段相甚敬而卑禮無違者晉侯嘉焉授之以䇿䇿賜命之書曰子豐有勞于晉國子豐段之父余聞而弗忘賜女州田州杜注縣屬河内郡本周邑以胙乃舊勲伯石再拜稽首受䇿以出君子曰禮其人之急也乎伯石之汰也一為禮于晉猶荷其禄况以禮終始乎詩曰人而無禮胡不遄死其是之謂乎初州縣欒豹之邑也豹欒盈族及欒氏亡在㐮二十三年范宣子趙文子韓宣子皆欲之文子曰溫吾縣也州本屬溫溫趙氏邑二宣子曰自郤稱以别三𫝊矣郤稱晉大夫始受州自是州與溫别晉之别縣不唯州誰獲治之文子病之乃舎之二子曰吾不可以正議而自與也皆舎之及文子為政趙獲曰獲文子子可以取州矣文子曰退二子之言義也二子二宣子也違義禍也余不能治余縣又焉用州其以徼禍也君子曰弗知實難知而弗從禍莫大焉有言州必死豐氏故主韓氏舊以韓氏為主人伯石之獲州也韓宣子為之請之為其復取之之故為七年豐氏歸州張本夏叔弓如滕五月葬滕成公滕始書葬左傳五月叔弓如滕𦵏滕成公子服椒為介及郊遇懿伯之忌敬子不入忌怨也懿伯椒之叔父敬子叔弓也叔弓禮椒為之辟仇恵伯曰恵伯子服椒公事有公利無私忌椒請先入乃先受館敬子從之𫝊言叔弓之有禮魯未嘗㑹小國之葬以㐮公之葬滕子親来故厚報而使卿共事夫天王之葬魯有不㑹或使㣲者往比事以觀而其罪益著矣附錄左傳晉韓起如齊逆女為平公逆公孫蠆為少姜之有寵也以其子更公女而嫁公子更嫁公女人謂宣子子尾欺晉晉胡受之宣子曰我欲得齊而逺其寵寵謂子尾寵將来乎秋七月鄭罕虎如晉賀夫人且告曰楚人日徵敝邑以不朝立王之故楚靈王新立敝邑之往則畏執事其謂寡君而固有外心其不往則宋之盟云云交相見進退罪也寡君使虎布之宣子使叔向對曰君若辱有寡君在楚何害修宋盟也君苟思盟寡君乃知免于戾矣君若不有寡君雖朝夕辱于敝邑寡君猜焉君實有心何辱命焉君其往也苟有寡君在楚猶在晉也張趯使謂太叔曰自子之歸也歸在此年春小人糞除先人之敝廬曰子其將来今子皮實来小人失望大叔曰吉賤不獲来賤非上卿畏大國尊夫人也且孟曰而将無事吉庶幾焉孟張趯也庶㡬如趯言秋小邾子来朝左傳小邾穆公来朝季武子欲卑之穆叔曰不可曹滕二邾實不忘我好敬以逆之猶懼其貳又卑一睦焉一睦謂小邾逆羣好也其如舊而加敬焉志曰䏻敬無災又曰敬逆来者天所福也季孫從之昭公即位之初大國来聘小國来朝雖仍邦交之舊然權臣擅國公室無民昭公中主無大過人之材故不能撥亂反正而先儒刻責之深亦未得其實也八月大雩左傳八月大雩旱也附録左傳齊侯田于莒莒齊東竟盧蒲嫳見泣且請曰余髪如此種種余奚能為嫳慶封黨㐮二十八年放之于竟種種短也自言衰老不䏻復為害公曰諾吾告二子二子子雅子尾歸而告之子尾欲復之子雅不可曰彼其髪短而心甚長其或寝處我矣九月子雅放盧蒲嫳于北燕恐其復作亂冬大雨雹北燕伯款出奔齊左傳燕簡公多嬖寵欲去諸大夫而立其寵人冬燕大夫比以殺公之外嬖比相親比公懼奔齊書曰北燕伯款出奔齊罪之也榖梁傳其曰北燕從史文也凡國君出奔不言其逐之者亦不著其所以出燕大夫殺君之寵人以脅而出之其罪大矣而苐書款奔所謂存王法不誅其人身也附録左傳十月鄭伯如楚子産相楚子享之賦吉日吉日詩小雅宣王田獵之詩楚王欲與鄭伯共田故賦之既享子産乃具田備王以田江南之夢楚之雲夢跨江南北齊公孫竈卒竈子雅司馬竈見晏子曰司馬竈齊大夫又喪子雅矣晏子曰惜也子旗不免殆哉以其不臣子旗子雅之子姜族弱矣而媯將始昌媯陳氏二恵競爽猶可子雅子尾皆齊恵公之孫競强也爽明也又弱一个焉姜其危哉四年春王正月大雨雹雹公羊榖梁俱作雪左傳大雨雹季武子問于申豐曰申豐魯大夫雹可禦乎對曰聖人在上無雹雖有不為災古者日在北陸而蔵冰陸道也謂夏十二月日在虚危氷堅而蔵之西陸朝覿而出之謂夏三月日在昴畢蟄蟲出而用氷春分之中奎星朝見東方其藏冰也深山窮谷固隂沍寒于是乎取之沍閉也必取積隂之氷所以道逹其氣使不為災其出之也朝之禄位賔食喪祭于是乎用之其藏之也黑牡秬黍以享司寒黒牡黒牲也秬黒黍也司寒𤣥㝠北方之神故物皆用黒有事于氷故祭其神其出之也桃􅋃棘矢以除其災桃弓棘箭所以禳除凶邪將御至尊故其出入也時食肉之禄冰皆與焉食肉之禄謂在朝廷治其職事就官食者大夫命婦喪浴用冰祭寒而藏之享司寒獻羔而啓之二月春分獻羔祭韭始開氷室公始用之公先用優尊火出而畢賦火星昏見東方謂三月四月中自命夫命婦至于老疾無不受冰山人取之縣人𫝊之山人虞官也縣人遂屬輿人納之隷人藏之夫冰以風壯而以風出順春風而散用其藏之也周其用之也徧則冬無愆陽愆過也謂冬溫夏無伏隂伏隂謂夏寒春無凄風秋無苦雨雷出不震無菑霜雹癘疾不降民不夭札今藏川池之氷棄而不用既不蔵深山窮谷之氷又火出不畢賦有餘則棄之風不越而殺雷不發而震越散也言隂陽失序雷風為害雹之為菑誰䏻禦之七月之卒章藏冰之道也七月詩豳風卒章曰二之日鑿氷冲冲謂十二月鑿而取之三之日納于凌隂凌隂氷室也四之日其蚤獻羔祭韭謂二月春分蚤開氷室以薦宗廟季氏専國有無君之心隂陽失位故冬春之閒大雨雹者再而申豐乃以為藏冰非法之故或有畏而不敢正言或黨附季孫曲為之説以蔽君之聼要之皆名教之罪人也附録左傳四年春王正月許男如楚楚子止之遂止鄭伯復田江南許男與焉前年楚子已與鄭伯田江南故言復使椒舉如晉求諸侯二君待之鄭許二君椒舉致命曰寡君使舉曰日君有恵賜盟于宋宋盟在㐮二十七年曰晉楚之從交相見也以嵗之不易寡人願結驩于二三君使舉請閒君若苟無四方之虞則願假寵以請于諸侯晉侯欲勿許司馬侯曰不可楚王方侈天或者欲逞其心以厚其毒而降之罰未可知也其使能終亦未可知也晉楚唯天所相不可與争君其許之而修徳以待其歸若歸于徳吾猶將事之况諸侯乎若適淫虐楚將棄之吾又誰與爭公曰晉有三不殆其何敵之有國險而多馬齊楚多難多簒試之禍有是三者何鄉而不濟對曰恃險與馬而虞隣國之難是三殆也四嶽東嶽岱西嶽華南嶽衡北嶽恒三塗三塗杜注在河南陸渾縣南水經注伊水歴崖口山峡也壁立如闕即古三塗山在今河南嵩縣陽城陽城杜注在陽城縣東北今河南登封縣北車嶺山是也大室大室杜注在陽城縣西北即嵩髙也在今河南登封縣北荆山荆山杜注在新城沶鄉縣南在今湖廣南漳縣西南中南中南杜注在始平武功縣南在今陜西長安縣南九州之險也是不一姓冀之北土燕代馬之所生無興國焉恃險與馬不可以為固也從古以然是以先王務修徳音以亨神人亨通也不聞其務險與馬也鄰國之難不可虞也或多難以固其國啟其疆土或無難以喪其國失其守宇于國則四垂為宇若何虞難齊有仲孫之難而獲桓公至今賴之仲孫公孫無知事在荘九年晉有里㔻之難而獲文公是以為盟主里克㔻鄭事在僖九年衞郉無難敵亦喪之閔二年狄滅衞僖二十五年衞滅邢故人之難不可虞也恃此三者而不修政徳亡于不暇又何能濟君其許之紂作淫虐文王恵和殷是以隕周是以興夫豈争諸侯乃許楚使使叔向對曰寡君有社稷之事是以不獲春秋時見言不得自往謙辭諸侯君實有之何辱命焉椒舉遂請昏蓋楚子使舉時兼使求昏晉侯許之楚子問于子産曰子産時從鄭簡公在楚晉其許我諸侯乎對曰許君晉君少安不在諸侯其大夫多求貪也莫匡其君在宋之盟又曰如一若不許君將焉用之焉用宋盟王曰諸侯其來乎對曰必來從宋之盟承君之歡不畏大國大國晉也何故不來不来者其魯衞曹邾乎曹畏宋邾畏魯魯衞偪于齊而親于晉唯是不来其餘君之所及也誰敢不至王曰然則吾所求者無不可乎對曰求逞于人不可與人同欲盡濟夏楚子蔡侯陳侯鄭伯許男徐子滕子頓子胡子沈子小邾子宋世子佐淮夷㑹于申楚子専㑹諸侯始此左傳夏諸侯如楚魯衞曹邾不㑹曹邾辭以難公辭以時祭衞侯辭以疾如子産言鄭伯先待于申六月丙午楚子合諸侯于申椒舉言于楚子曰臣聞諸侯無歸禮以為歸今君始得諸侯其慎禮矣霸之濟否在此㑹也夏啓有鈞臺之享啓禹子鈞臺杜注河南陽翟縣南有鈞臺陂在今河南禹州城北闗外商湯有景亳之命景亳杜注河南鞏縣西南有湯亭或言亳即偃師按今河南偃師縣南有景山即此周武有孟津之誓孟津即盟津也成有岐陽之蒐周成王歸自奄大蒐于岐山之陽岐山杜注在扶風美陽縣西北在今陜西岐山縣境康有酆宫之朝酆杜注在始平鄠縣東有靈臺括地志鄠縣東三十五里有豐宫今属陜西西安府穆有塗山之㑹周穆王㑹諸侯于塗山塗山杜注在夀春東北今山在江南懐逺縣東南齊桓有召陵之師在僖四年晉文有踐土之盟在僖二十八年君其何用宋向戌鄭公孫僑在諸侯之良也君其選焉選擇所用王曰吾用齊桓王使問禮于左師與子産左師曰小國習之大國用之敢不薦聞獻公合諸侯之禮六其禮六儀也宋公爵故獻公禮子産曰小國共職敢不薦守獻伯子男㑹公之禮六鄭伯爵故獻伯子男㑹公之禮其禮同所從言之異君子謂合左師善守先代子産善相小國王使椒舉侍于後以規過規正二子之過卒事不䂓王問其故對曰禮吾未見者有六焉又何以規左師子産所獻六禮楚皆未嘗行宋大子佐後至王田于武城久而弗見椒舉請辭焉請王辭謝之王使往曰屬有宗祧之事于武城言為宗廟田獵寡君将堕幣焉敢謝後見堕布也輸也恨其後至故言将因諸侯㑹布幣乃相見徐子吴出也以為貳焉故執諸申楚子示諸侯侈椒舉曰夫六王二公之事六王啓湯武成康穆也二公齊桓晋文皆所以示諸侯禮也諸侯所由用命也夏桀為仍之㑹有緡叛之仍緡杜注皆國名商紂為黎之蒐東夷叛之黎杜注東方國名周幽為大室之盟戎狄叛之大室中嶽皆所以示諸侯汰也諸侯所由棄命也今君以汰無乃不濟乎王弗聽子産見左師曰吾不患楚矣汰而愎諫不過十年左師曰然不十年侈其惡不逺逺惡而後棄善亦如之徳逺而後興為十三年楚弑其君𫝊晉霸始衰齊首背之平公猶屢合諸侯以討焉自齊莊公死齊與晉平晉侯自是不復出與㑹盟故楚䖍遂合諸侯借討亂之名以逞其貪暴雖䖍終自敗而天下之大勢遂不可復挽矣其原皆由晉政不綱諸卿植黨列國彊家争附之以固其私而怠於公義也春秋之初亂臣賊子國人鄰國皆應時致討其後乃有受其賂而不討與之㑹以定其位者至於楚䖍則天下諸侯奉為盟主而屬服焉以晉之季世屢以賂釋亂賊而不討諸侯離心勢己外潰六卿則而象之權復内移以至流毒於生民如是其烈也楚人執徐子吴晉通使道必由徐徐吴出也故雖屬楚而不禁吴晉之通故楚既與之㑹而又執之不言歸者在㑹而執尋釋之也秋七月楚子蔡侯陳侯許男頓子胡子沈子淮夷伐吴左傳秋七月楚子以諸侯伐吴宋大子鄭伯先歸經所以更叙諸侯宋華費遂鄭大夫從執齊慶封殺之左傳使屈申圍朱方朱方杜注吴邑慶封所封也屈申屈蕩子八月甲申克之執齊慶封而盡滅其族慶封以㐮二十八年奔吴八月無甲申日誤將戮慶封椒舉曰臣聞無瑕者可以戮人慶封唯逆命是以在此逆命謂性不恭順其肯從于戮乎言不肯黙而從戮播于諸侯焉用之王弗聼負之斧鉞以徇于諸侯使言曰無或如齊慶封弑其君弱其孤以盟其大夫齊崔杼弑君慶封其黨也故以弑君罪責之慶封曰無或如楚共王之庶子圍弑其君兄之子麇而代之以盟諸侯王使速殺之公羊傳此伐吴也其言執齊慶封何為齊誅也其為齊誅奈何慶封走之吴吴封之于防然則曷為不言伐防不與諸侯専封也慶封之罪何脅齊君而亂齊國也榖梁傳此入而殺其不言入何也慶封封乎吴鍾離言時殺慶封于鍾離實不入吴其不言伐鍾離何也不與吴封也慶封其以齊氏何也為齊討也靈王使人以慶封令于軍中曰有若齊慶封弑其君者乎慶封曰子一息我亦且一言曰有若楚公子圍弑其兄之子而代之為君者乎軍人粲然皆笑粲然盛笑貌慶封弑其君而不以弑君之罪罪之者慶封不為靈王服也不與楚討也春秋之義用貴治賤用賢治不肖不以亂治亂也孔子曰懐惡而討雖死不服其斯之謂與春秋書殺他國大夫之法有二凡有罪而當誅者曰某人殺某若楚人殺陳徵舒是也無罪者書執而殺之若執蔡世子有以歸用之執陳行人干徵師殺之是也慶封有與弑其君之罪而不書殺齊慶封慶封不為楚䖍服也懐惡而討雖死不服故不得純以討賊之辭書遂滅賴頼公羊榖梁俱作厲左傳遂以諸侯滅賴賴子面縛銜璧士袒輿櫬從之造于中軍王問諸椒舉對曰成王克許在僖六年許僖公如是王親釋其縛受其璧焚其櫬王從之遷賴于鄢鄢杜注楚邑楚子欲遷許于賴使鬬韋龜與公子棄疾城之而還為許城也鬬韋龜子文之𤣥孫申無宇曰楚禍之首將在此矣召諸侯而来伐國而克城竟莫校謂築城于外竟諸侯無與争王心不違民其居乎言將有事不得安也民之不處其誰堪之不堪王命乃禍亂也榖梁傳遂繼事也九月取鄫左傳九月取鄫言易也莒亂著丘公立而不撫鄫著丘公去疾也鄫叛而来故曰取凡克邑不用師徒曰取公羊傳其言取之何滅之也滅之則其言取之何内大惡諱也㐮六年莒人滅鄫尚未絶其祀以為附庸今魯復取之莒不書伐莒鄫叛而来不用師徒也附録左傳鄭子産作丘賦丘十六井當出馬一匹牛三頭今子産别賦其田如魯哀公十一年之用田賦國人謗之曰其父死于路謂子國為尉氏所殺己為蠆尾謂子産重賦毒􅊣百姓以令于國國將若之何子寛以告子寛鄭大夫子産曰何害苟利社稷死生以之且吾聞為善者不改其度故能有濟也民不可逞度不可改度法也詩曰禮義不愆何恤于人言逸詩吾不遷矣遷移也渾罕曰渾罕子寛國氏其先亡乎君子作法于涼其敝猶貪涼薄也作法于貪敝將若之何姬在列者在列國也蔡及曹滕其先亡乎偪而無禮蔡偪楚曺滕偪宋鄭先衞亡偪而無法偪晉楚政不率法而制于心民各有心何上之有子産權時救急渾罕譏之正道冬吴伐楚入棘櫟麻棘櫟麻杜注皆楚東鄙邑譙國鄼縣東北有棘亭汝隂新蔡縣東北有櫟亭今河南新蔡縣北野櫟店即古櫟城也魏收志安陽縣治麻城在今江南碭山縣境以報朱方之役朱方役在此年秋楚沈尹射奔命于夏汭夏汭杜注漢水曲入江今夏口也亦曰漢口在今湖廣江夏縣吴兵在東北楚盛兵在東南以絶其後箴尹宜咎城鍾離宜咎本陳大夫㐮二十四年奔楚薳啓彊城巢然丹城州來然丹鄭穆公孫㐮十九年奔楚東國水不可以城東國即頼之故國也彭生罷賴之師彭生楚大夫罷鬬韋龜城賴之師冬十有二月乙卯叔孫豹卒左傳初穆子去叔孫氏及庚宗成十六年辟僑如之難庚宗杜注魯地今山東泗水縣有庚宗亭遇婦人使私為食而宿焉問其行告之故哭而送之婦人聞而哭之適齊娶于國氏生孟丙仲壬夢天壓已弗勝穆子夢也顧而見人黑而上僂上僂肩傴深目而豭喙口象猪號之曰牛助余乃勝之旦而皆召其徒無之徒從者且曰志之志識也及宣伯奔齊宣伯僑如穆子之兄成十六年奔齊饋之穆子饋宣伯宣伯曰魯以先子之故將存吾宗必召女召女何如對曰願之久矣蓋忿言魯人召之不告而歸既立所宿庚宗之婦人獻以雉問其姓女生曰姓謂子也對曰余子長矣能奉雉而從我矣召而見之則所夢也未問其名號之曰牛曰唯皆召其徒使視之遂使為豎豎小臣有寵長使為政為家政公孫明知叔孫于齊公孫明齊大夫子明歸未逆國姜子明取之國姜孟仲母故怒其子長而後使逆之子孟丙仲壬田于丘蕕丘蕕杜注地名遂遇疾焉豎牛欲亂其室而有之强與孟盟不可欲使從己孟不肯叔孫為孟鐘曰爾未際際接也孟未與諸大夫相接見饗大夫以落之以豭猪血釁鐘曰落既具饗禮具使豎牛請日請饗日入弗謁出命之日詐命日及賓至聞鐘聲牛曰孟有北婦人之客北婦人國姜也客謂公孫明怒將往牛止之賔出使拘而殺諸外殺孟丙牛又强與仲盟不可仲與公御萊書觀于公莱書公御士名仲與之私逰觀于公宫公與之環使牛入示之示叔孫入不示出命佩之牛謂叔孫見仲而何而何如何叔孫曰何為曰不見既自見矣言仲已自往見公公與之環而佩之矣遂逐之奔齊疾急命召仲牛許而不召杜洩見告之饑渴授之戈杜洩叔孫氏宰也牛不食叔孫叔孫怒欲使杜洩殺之對曰求之而至又何去焉豎牛曰夫子疾病不欲見人使寘饋于个而退个東西廂牛弗進則置虛命徹寫器令空示若叔孫已食命去之十二月癸丑叔孫不食乙卯卒三日絶糧牛立昭子而相之昭子叔孫豹之庶子叔孫婼公使杜洩葬叔孫豎牛賂叔仲昭子與南遺昭子叔仲帶也南遺季氏家臣使惡杜洩于季孫而去之憎洩不與己同志杜洩將以路𦵏且盡卿禮路王所賜叔孫車南遺謂季孫曰叔孫未乗路葬焉用之且冡卿無路介卿以𦵏不亦左乎冡卿謂季孫介次也謂叔孫季孫曰然使杜洩舎路不可曰夫子受命于朝而聘于王夫子謂叔孫聘在㐮二十四年王思舊勲而賜之路復命而致之君君不敢逆王命而復賜之使三官書之吾子為司徒實書名謂季孫也書名定位號夫子為司馬與工正書服謂叔孫也服車服之器工正所書孟孫為司空以書勲今死而弗以是棄君命也書在公府而弗以是廢三官也若命服生弗敢服死又不以將焉用之乃使以葬季孫謀去中軍豎牛曰夫子固欲去之誣叔孫以媚季孫五年春王正月舎中軍左傳五年春王正月舎中軍卑公室也罷中軍季孫稱左師孟氏稱右師叔孫氏則自以叔孫為軍名毁中軍于施氏成諸臧氏季孫不欲親其議勅二家㑹諸大夫發毁置之計又取其令名初作中軍三分公室而各有其一季氏盡征之叔孫氏臣其子弟孟氏取其半焉及其舎之也四分公室季氏擇二簡擇取二分二子各一皆盡征之而貢于公以書使杜洩告于殯曰告叔孫之柩子固欲毁中軍既毁之矣故告杜洩曰夫子唯不欲毁也故盟諸僖閎詛諸五父之衢皆在㐮十一年受其書而投之投擲也帥士而哭之痛叔孫之見誣叔仲子謂季孫曰帶受命于子叔孫曰葬鮮者自西門不以夀終為鮮西門非魯朝正門季孫命杜洩命使從西門杜洩曰卿喪自朝魯禮也吾子為國政未改禮而又遷之遷易也羣臣懼死不敢自也自從也既𦵏而行以辟禍仲至自齊仲壬聞䘮而来季孫欲立之南遺曰叔孫氏厚則季氏薄彼實家亂子弗與知不亦可乎南遺使國人助豎牛以攻諸大庫之庭攻仲壬也魯城内有大庭氏之虚于其上作庫司宫射之中目而死豎牛取東鄙三十邑以與南遺取叔孫氏邑昭子即位朝其家衆曰豎牛禍叔孫氏使亂大從使從于亂一云使亂大和順之道殺適立庶又披其邑将以赦罪披析也謂以邑與南遺昭子不知豎牛餓殺其父故但言其見罪罪莫大焉必速殺之豎牛懼奔齊孟仲之子殺諸塞關之外齊魯界上關投其首于寕風之棘上寕風杜注齊地仲尼曰叔孫昭子之不勞不可能也不以立已為功勞周任有言曰為政者不賞私勞不罰私怨詩云有覺徳行四國順之詩大雅覺直也言徳行直則四方順從之初穆子之生也荘叔以周易筮之荘叔穆子父得臣也遇明夷離下坤上明夷之謙艮下坤上謙明夷初九變為謙以示卜楚丘椘丘卜人姓名曰是將行行出奔而歸為子祀奉祭祀以讒人入其名曰牛卒以餒死明夷日也離為日日之數十甲至癸故有十時亦當十位日中當王食時當公平旦為卿雞鳴為士夜半為皁人定為輿黄昏為隸日入為僚晡時為僕日昳為臺隅中日出闕不在第尊王公曠其位自王已下其二為公其三為卿日上其中日中盛明故以當王食日為二公位旦日為三卿位明夷之謙明而未融其當旦乎融朗也離在坤下日在地中之象又變為謙謙道卑退故曰明而未融日明未融故曰其當旦乎故曰為子祀荘叔卿也卜豹為卿故知為子祀日之謙當鳥故曰明夷于飛離為日為鳥離變為謙日光不足故當烏鳥飛行故曰于飛明而未融故曰垂其翼于日為未融于鳥為垂翼象日之動日動物也雖有夷傷其動不爽君子象之故曰君子于行明夷初九得位有應君子象也在明傷之世居謙下之位故將辟難而行當三在旦故曰三日不食旦位在三又非食時故曰三日不食離火也艮山也離為火火焚山山敗離艮合體故于人為言艮為言敗言為讒為離所焚故言敗故曰有攸往主人有言言必讒也離變為艮故言有所往往而見焚故主人有言言而見敗故必讒言純離為牛易離上離下離畜牝牛吉故言純離為牛世亂讒勝勝將適離故曰其名為牛離焚山則離勝譬世亂則讒勝山焚則離獨存故知名為牛也豎牛非牝牛故不吉謙不足飛不翔謙道冲退故飛不逺翔垂不峻翼不廣峻髙也翼垂下故不䏻廣逺故曰其為子後乎不逺翔故知不逺去吾子亞卿也抑少不終旦日正卿之位荘叔父子世為亞卿位不足以終盡卦體蓋引而致之公羊傳舎中軍者何復古也然則曷為不言三卿五亦有中三亦有中言㐮十一年作三軍時不言作中軍者以五軍有中三軍亦有中若言作中軍便疑是五之中故變言作三軍今則竟言舎中軍矣榖梁傳貴復正也初作三軍三分公室而各有其一及其舎之也四分公室季氏擇二二家各一皆盡征之而貢于公蓋季孫乗㐮公之幼弱作三軍以奪公室之民而孟叔之民尚有屬公者至是則無一民之屬於公而季氏得二兵彊權盛不獨公若綴旒即二家亦不得不為屬役矣兵權有國之司命三綱兵政之本原觀中軍之作舎而昭公見逐之勢成矣季氏無君其臣則而效之南蒯叛陽貨専而季斯囚亦必至之理也三軍之作舎皆自季氏而經書之若國政何也季氏専魯數世矣惟行父既老數年中孟孫蔑叔孫豹少與邦交之事宿嗣父位則聘問大國盟㑹諸侯皆宿専之㐮公幼弱豹蔑皆賢三軍之作非宿為之而誰哉至昭公時則宿専制魯政又積二十餘年其主三軍之舎固不待言矣楚殺其大夫屈申左傳楚子以屈申為貳于吴乃殺之以屈生為莫敖生屈建子使與令尹子蕩如晉逆女過鄭鄭伯勞子蕩于汜勞屈生于菟氏汜菟氏杜注皆鄭地晉侯送女于邢丘子産相鄭伯㑹晉侯于郉丘傳言楚强諸侯畏敵其使屈申楚重臣也楚靈疑忌而戮之以為貳于吴而未有顯迹毋乃欲加之罪乎然申為人臣君弑不能討國亂不能去北面而事寇讎其見殺也亦自取焉耳公如晉左傳公如晉自郊勞至於贈賄無失禮晉侯謂女叔齊曰魯侯不亦善于禮乎對曰魯侯焉知禮公曰何為自郊勞至于贈賄禮無違者何故不知對曰是儀也不可謂禮禮所以守其國行其政令無失其民者也今政令在家在大夫不能取也有子家羈弗能用也羈荘公𤣥孫懿伯也奸大國之盟陵虐小國謂代莒取鄆利人之難謂往年莒亂取鄫不知其私不自知有私難公室四分民食于他他謂三家思莫在公不圗其終無為公謀終始者為國君難将及身不恤其所禮之本末將于此乎在而屑屑焉習儀以亟言善于禮不亦逺乎君子謂叔侯于是乎知禮時晋侯亦失政叔齊以此諷諌昭公如晋凡七見止者一及河而不至者五惟此年得成禮而反然以莒人之愬幾復見止盖季氏自結於晉之彊家再世矣乗亂而取鄆者季氏受其逋逃叛邑者季氏乃欲止公晉侯之不明諸臣之黨惡季孫之竊國専利多方以陷其君先儒皆置而不論獨苛責公不知公之過惟娶於吴蓋欲藉吴以抗季氏其他實未見失徳凡左氏所譏皆季氏之誣詞𫝊者習焉而不察耳附録左傳晉韓宣子如楚送女叔向為介鄭子皮子大叔勞諸索氏索氏杜注河南成皋縣東有大索城今在滎陽縣東北太叔謂叔向曰楚王汰侈已甚子其戒之叔向曰汰侈已甚身之災也焉能及人若奉吾幣帛慎吾威儀守之以信行之以禮敬始而思終終無不復事皆可復行從而不失儀從順也敬而不失威道之以訓辭奉之以舊法考之以先王以先王之禮成其好度之以二國度晉楚之勢而行之雖汰侈若我何及楚楚子朝其大夫曰晉吾仇敵也苟得志焉無恤其他今其来者上卿上大夫也若吾以韓起為閽刖足使守門以羊舌肸為司宫加宫刑足以辱晉吾亦得志矣可乎大夫莫對薳啓彊曰可苟有其備何故不可耻匹夫不可以無備况恥國乎是以聖王務行禮不求耻人朝聘有珪珪以為信享頫有璋享饗也頫見也既朝聘而享見也小有述職諸侯適天子曰述職大有巡功天子廵守曰廵功設机而不倚爵盈而不飲言務行禮宴有好貨宴飲以貨為好衣服車馬在客所無飱有陪鼎熟食為飱陪加鼎所以厚殷勤入有郊勞出有贈賄禮之至也國家之敗失之道也失朝聘宴好之道則禍亂興城濮之役晉無楚備以敗于邲言兵禍始于城濮邲之役楚無晉備以敗于鄢自鄢以來晉不失備而加之以禮重之以睦是以楚弗䏻報而求親焉既獲姻親又欲耻之以召寇讎備之若何誰其重此若有其人耻之可也若其未有君亦圖之晉之事君臣曰可矣求諸侯而麇至麇羣也求昏而薦女君親送之上卿及上大夫致之猶欲耻之君其亦有備矣不然奈何韓起之下趙成中行吴魏舒范鞅知盈皆三軍之將佐也成趙武之子吴荀偃之子羊舌肸之下祁午張趯籍談女齊梁丙張骼輔躒苖賁皇皆諸侯之選也韓㐮為公族大夫韓須受命而使矣㐮韓無忌子須起之門子年雖幼己任出使箕㐮郉帶二人韓氏族叔禽叔椒子羽皆韓起庶子皆大家也韓賦七邑皆成縣也成縣賦百乗也羊舌四族皆强家也銅鞮伯華叔向叔魚叔虎兄弟四人晉人若䘮韓起楊肸五卿八大夫五卿趙成以下八大夫祁午以下輔韓須楊石石叔向子食我也因其十家九縣韓氏七羊舌氏四而言十家舉大數也羊舌四家共二縣故但言强家長轂九百長轂戎車也縣百乗其餘四十縣遺守四千計遺守國者尚有四千乗奮其武怒以報其大恥伯華謀之伯華叔向兄中行伯魏舒帥之伯中行吴其蔑不濟矣君将以親易怨失婚姻之親實無禮以速寇而未有其備使羣臣往遺之禽以逞君心何不可之有王曰不榖之過也大夫無辱謝薳啓彊厚為韓子禮王欲敖叔向以其所不知而不能言叔向之多知亦厚其禮韓起反鄭伯勞諸圉圉杜注鄭地在今把縣南辭不敢見禮也以奉使君命未反故鄭罕虎如齊娶于子尾氏自為逆也晏子驟見之陳桓子問其故對曰能用善人民之主也謂授子産政夏莒牟夷以牟婁及防兹来奔防兹杜注城陽平昌縣西南有防亭姑幕縣東北有兹亭今平昌故城在山東安丘縣西南姑幕故城在諸城縣西北左傳夏莒牟夷以牟婁及防兹来奔牟夷非卿而書尊地也公羊傳莒牟夷者何莒大夫也莒無大夫此何以書重地也其言及防兹來奔何不以私邑累公邑也穀梁傳以者不以者也来奔者不言出以其方向内也及防兹以大及小也莒無大夫其曰牟夷何也以其地来也以地来則何以書也重地也春秋於邾莒大夫例不書姓名㣲也然以地叛雖賤必名終為不義不可滅矣以婁牟及防兹以公邑及私邑也季孫宿為魯盗故邾莒之盗以氣類而相從㐮二十一年公如晉邾庶其以地来奔宿納之今公如晉莒牟夷以地来奔宿又納之㐮公如楚宿取卞公懼不敢入今又乗公之適晉亟招叛人俾莒訴而致討於公盖時欲置其君於罟擭陷穽之中他年見逐而終不能歸其兆已見於此矣秋七月公至自晉左傳莒人愬于晉愬魯受牟夷晉侯欲止公范獻子曰不可人朝而執之誘也討不以師而誘以成之惰也為盟主而犯此二者無乃不可乎請歸之閒而以師討焉乃歸公秋七月公至自晉莒人以受牟夷愬于晉幾被執辱歴三時乃得歸故以告於廟也戊辰叔弓帥師敗莒師于蚡泉蚡公羊作濆榖梁作賁杜注魯地地譜云魯東竟之地左傳莒人来討討受牟夷不設備戊辰叔弓敗諸蚡泉莒未陳也公羊傳濆泉者何直泉也謂此泉直上而出直泉者何湧泉也榖梁傳狄人謂賁泉失台號從中國名從主人中軍既毁季孫自為一軍力全而勢彊二家共為一軍力分而勢弱不獨公為所制而二家亦屬役焉故取鄆受叛者季孫而莒人來討則使叔弓應敵也秦伯卒公羊傳何以不名秦者夷也匿嫡之名也謂嫡子生而不名令于四竟擇勇猛者立之其名何文十八年秦伯罃卒宣四年秦伯稻卒書名嫡得之也言罃稻獨以嫡得立經書諸侯之卒不名者多矣當時不以名赴史承而書之聖人不䏻益也𫝊者於此獨曲為之説誤矣冬楚子蔡侯陳侯許男頓子沈子徐人越人伐吴越始見經左傳冬十月楚子以諸侯及東夷伐吴以報棘櫟麻之役役在四年薳射以繁揚之師㑹于夏汭薳射楚大夫㑹楚子也越大夫常夀過帥師㑹楚子于瑣瑣杜注楚地當在今江南霍丘縣東聞吴師出薳啓彊帥師從之遽不設備吴人敗諸鵲岸鵲岸杜注廬江舒縣有鵲尾渚今江南繁昌縣西南大江中有鵲洲楚子以馹至于羅汭羅水名吴子使其弟蹶由犒師楚人執之將以釁鼓王使問焉曰女卜來吉乎對曰吉寡君聞君將治兵于敝邑卜之以守龜曰余亟使人犒師請行以觀王怒之疾徐而為之備尚克知之言吴令龜如此龜兆告吉曰克可知也君若驩焉好逆使臣滋敝邑休怠而忘其死亡無日矣今君奮焉震電馮怒馮盛也虐執使臣將以釁鼓則吴知所備矣敝邑雖羸若早修完其可以息師息楚之師難易有備可謂吉矣且吴社稷是卜豈為一人使臣獲釁軍鼓而敝邑知備以禦不虞其為吉孰大焉國之守龜其何事不卜一臧一否其誰能常之城濮之兆其報在邲城濮之戰楚卜吉其效乃在邲今此行也其庸有報志乃弗殺楚師濟于羅汭沈尹赤㑹楚子沈尹赤楚大夫次于莱山薳射帥繁揚之師先入南懐楚師從之及汝清南懐汝清杜注皆楚界當在今江淮間吴不可入有備楚子遂觀兵于坻箕之山坻箕之山今江南巢縣南有躊躇山輿地志即坻箕山也是行也吴早設備楚無功而還以蹶由歸楚子懼吴使沈尹射待命于巢薳啓彊待命于雩婁禮也善有備楚病吴故通越以制吴猶晉病楚故通吴以制楚也越常夀過始見經而稱人越驟彊也或曰不可云沈子徐越伐吴猶戚之㑹吴以鄫故稱人耳楚䖍身負大惡王法所不宥也而恃彊逞暴為修怨之師諸侯及徐越從之有黨惡之罪先儒乃以為善楚而進越過矣附録左傳秦后子復歸于秦元年奔晋景公卒故也終五稔之言日講春秋觧義卷四十八
