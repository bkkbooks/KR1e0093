body:
  text: 欽定四庫全書日講春秋解義卷三十一成公公名黑肱宣公子諡法安民立政曰成周定王十七年魯成公五年定王崩子簡王立鄭㐮公十五年魯成公四年襄公卒悼公費立成六年悼公卒弟成公睔立齊頃公九年魯成公九年頃公卒子靈公環立宋文公二十一年魯成公二年文公卒子共公固立成十五年共公卒子平公成立晉景公繼霸十年時郤克為政魯成公四年欒書為政成十年景公有疾晉人立太子州蒲是為厲公是年景公卒成十八年厲公弑悼公周立韓厥為政衞穆公十年魯成公二年穆公卒子定公臧立成十四年定公卒子獻公衎立蔡景公二年曹宣公五年魯成公十三年宣公卒弟成公負芻立滕文公十年魯成公十六年文公卒成公原立陳成公九年把桓公四十七年薛詳見隠公元年莒魯成公十四年莒子朱卒一名渠丘公黎比公宻州立又名買朱鉏邾定公二十四年魯成公十七年定公卒宣公牼立許靈公二年魯成公十五年許遷于葉小邾詳見僖公元年楚共王元年魯成十六年子反将中軍子重将左戰鄢陵楚敗績晉射共王中目楚殺子反秦桓公十五年魯成公十四年桓公卒子景公立吳魯成公七年呉伐郯始見經即呉子夀夢也夀夢一名乗越詳見隠公元年欽定四庫全書日講春秋觧義卷三十一成公名黒肱宣公之子母穆姜以定王十七年即位諡法安民立政曰成元年春王正月公即位繼正而行即位之禮故書於策也與桓宣之書即位辭同而義異考其事論其世則其實不可揜矣二月辛酉葬我君宣公無冰穀梁傳終時無冰則志此未終時而言無冰何也言終寒時無冰當志耳今方建丑之月是寒時未終終無冰矣加之寒之辭也周二月夏十二月也是月于寒之中又加甚焉過此無冰終無復冰矣恆燠也周之二月夏之十二月也當凅隂冱寒而恆燠焉此政事舒緩紀綱縱弛之象也方是時成公幼弱政在三家公室不張其象已先見矣凡策書所載皆經邦大訓人有㣲而不登其姓名事有小而不記其本末雨雹冰雪何以悉書天人一理也萬物一氣也觀於隂陽寒暑之變以察其消息盈虚此敬天勤民慎於㣲之意也每慎於㣲則王事備矣附錄左傳元年春晉侯使瑕嘉平戎于王平文十七年邥垂之役詹嘉處瑕故謂之瑕嘉單襄公如晉拜成單襄公王卿士劉康公徼戎將遂伐之叔服曰背盟而欺大國此必敗背盟不祥欺大國不義神人弗助將何以勝不聴遂伐茅戎三月癸未敗績於徐吾氏徐吾氏茅戎之别也茅戎杜注戎别種水經注大陽縣有茅亭故茅戎邑也括地志茅戎在河北縣西當在今山西平陸縣界三月作丘甲左傳為齊難故作丘甲前年魯乞師于楚欲以伐齊楚師不出故懼而作丘甲公羊傳何以書譏何譏爾譏始丘使也言始使丘民作甲穀梁傳作為也丘為甲也使一丘之民皆作甲丘甲國之事也丘作甲非正也丘作甲之為非正何也古者立國家百官具農工皆有職以事上古者有四民有士民有商民有農民有工民夫甲非人人之所能為也丘作甲非正也此因齊難而益兵也司馬法九夫為井四井為邑四邑為丘四丘為甸甸賦車一乗歩卒七十二人甲士三人凡二十五人為一甲三甲為一乗一丘所出十有八人今丘出一甲是一甸之中百人為兵總一乗計之增一甲矣積三甸計之增一乗矣增乗増甲雖不可考其實皆益兵其數皆増三之一爾春秋惡其紊亂先王軍賦之制以重困農民故特書作以譏之作者不宜作也夏臧孫許及晉侯盟于赤棘赤棘杜注晉地左傳聞齊将出楚師夏盟于赤棘與晉盟懼齊楚季孫當國憾齊人之納歸父又聞其将出楚師遂急於求晉而為此盟魯所欲故書及魯大夫特盟諸侯者五其四書及皆魯志也惟祲祥書㑹則邾志耳諸侯與大夫㑹盟在列國亦為降尊失列况霸主乎季孫行父㑹齊侯于陽榖而後公子遂及齊侯盟于郪丘昔也公孫敖㑹晉侯于戚今則臧孫許及晉侯盟政教之陵遲其所由来者漸矣秋王師敗績于茅戎公羊穀梁作貿戎左傳秋王人来告敗解經所以秋乃書公羊傳孰敗之蓋晉敗之以晉比侵栁園郊知王師討晉而敗或曰貿戎敗之以地在貿戎故然則曷為不言晉敗之王者無敵莫敢當也穀梁傳不言戰莫之敢敵也為尊者諱敵不諱敗諱敵使莫為之偶不諱敗以見其過為親者諱敗不諱敵諱敗惜其毁折也不諱敵諸侯有列國尊尊親親之義也尊謂王親謂魯然則孰敗之晉也王者之師有征無戰書敗不書戰以茅戎不得與天子抗也柔服逺人惟在惇信明義而設詐相邀是失其所以馭戎之禮故以自敗為文亦自反之道也冬十月穀梁傳季孫行父秃晉郤克眇衞孫良夫跛曹公子手僂同時而聘于齊齊使秃者御秃者使眇者御眇者使跛者御跛者使僂者御僂者御迎也蕭同姪子處臺上而笑之蕭國也同姓也姪子字也其母更嫁齊恵公生頃公宣十二年楚滅蕭故随其母在齊聞於客客不說而去相與立胥閭而語移日不觧胥閭門名齊人有知之者曰齊之患必自此始矣范氏甯曰榖梁子作傳皆釋經以立義未有無其文而發傳者疑冬十月下脱季孫行父如齊六字附録左傳冬臧宣叔令修賦繕完治完城郭具守備曰齊楚結好我新與晉盟晉楚争盟齊師必至雖晉人伐齊楚必救之是齊楚同我也言将共伐知難而有備乃可以逞為二年齊侯伐我傳二年春齊侯伐我北鄙左傳二年春齊侯伐我北鄙圍龍龍杜注魯邑在泰山博縣西南頃公之嬖人盧蒲就魁門焉攻龍門龍人囚之齊侯曰勿殺吾與而盟無入而封封竟弗聼殺而膊諸城上膊磔也齊侯親鼓士陵城三日取龍遂南侵及巢丘初宣公事齊甚謹聘㑹相繼及與晉盟斷道而怨隙成再盟赤棘而伐我北鄙魯於是乎空國兵而為鞌之戰同曰憤兵務相報復不待貶而罪自見矣夏四月丙戌衛孫良夫帥師及齊師戰于新築衞師敗績新築杜注衞地今直隸魏縣南有新築城左傳衞侯使孫良夫石稷甯相向禽将侵齊與齊師遇齊伐魯還故遇良夫孫林父之父石稷石碏四世孫甯相甯俞子石子欲還孫子曰不可以師伐人遇其師而還將謂君何若知不能則如無出今既遇矣不如戰也夏有闕文失新築戰事石成子曰成子石稷師敗矣子不少湏衆懼盡子喪師徒何以復命皆不對又曰子國卿也隕子辱矣隕見禽獲子以衆退我此乃止自請止此禦齊師且告車来甚衆新築人救孫桓子故並告令軍中齊師乃止次于鞠居鞠居杜注衞地後漢志封丘有鞠亭即古鞠居也新築人仲叔于奚救孫桓子桓子是以免于奚守新築大夫既衞人賞之以邑賞于奚辭請曲縣繁纓以朝許之曲縣軒縣也周禮天子樂宫縣四面諸侯軒縣闕南方故曲縣鐘磬之屬縣于筍簴者繁纓馬飾諸侯服仲尼聞之曰惜也不如多與之邑惟噐與名不可以假人器車服名爵號君之所司也名以出信名位不愆為民所信信以守器動不失信則車服可保器以藏禮車服所以表尊卑禮以行義尊卑有禮各得其宜義以生利得其宜則利生利以平民政之大節也若以假人與人政也政亡則國家従之弗可止也已欲戰者衛也故以衞主之衞既使世子臧與晉同伐齊又使四大夫侵齊及與齊師遇石稷欲還良夫不可盖欲逞一笑之忿而敗國勦民有不顧也彊臣柄國其君不能主同列不敢争而専行無忌如此故孔逹帥師不書至良夫而後書著大夫之無君也其後林父出君據邑以叛其端已兆於此矣六月癸酉季孫行父臧孫許叔孫僑如公孫嬰齊帥師㑹晉郤克衞孫良夫曹公子首及齊侯戰于鞌齊師敗績首公羊穀梁作手鞌杜注齊地近志云鞌即古之歴下左傳孫桓子還于新築不入不入國遂如晉乞師臧宣叔亦如晉乞師皆主郤獻子孫桓子臧宣叔皆不以國命自詣郤克故不書晉侯許之七百乗五萬二千五百人郤子曰此城濮之賦也城濮之戰晉車七百乗有先君之明與先大夫之肅故㨗克于先大夫無能為役請八百乗許之六萬人郤克将中軍士爕佐上軍范文子代荀庚欒書將下軍代趙朔韓厥為司馬以救魯衞臧宣叔逆晉師且道之季文子帥師㑹之及衞地韓獻子将斬人郤獻子馳將救之至則既斬之矣郤子使速以徇告其僕曰吾以分謗也不欲使韓子獨受殺人之謗師從齊師于莘莘杜注齊地六月壬申師至于靡笄之下靡笄杜注山名徐廣曰靡當作歴志曰歴山即左傳所謂靡笄之山在今山東濟南府南齊侯使請戰曰子以君師辱于敝邑不腆敝賦詰朝請見對曰晉與魯衞兄弟也来告曰大國朝夕釋憾于敝邑之地大國謂齊敝邑魯衛自稱寡君不忍使羣臣請于大國無令輿師淹于君地輿衆也淹久也能進不能退君無所辱命言自欲戰不須齊命齊侯曰大夫之許寡君之願也若其不許亦將見也齊髙固入晉師桀石以投人桀擔也禽之而乗其車既獲其人因釋已車而載所獲者車繫桑本焉以徇齊壘將至齊壘以桑樹繫車而走欲自異曰欲勇者賈余餘勇言已勇有餘欲賣之癸酉師陳于鞌邴夏御齊侯逢丑父為右晉觧張御郤克鄭丘緩為右齊侯曰余姑翦滅此而後朝食不介馬而馳之介甲也郤克傷于矢流血及屨未絶鼓音中軍將自執旗鼓故雖傷而擊鼔不息曰余病矣張侯曰張侯解張自始合而矢貫余手及肘余折以御左輪朱殷豈敢言病朱血色血色久則殷赤黒色也言血多汚車輪御猶不敢息吾子忍之緩曰自始合茍有險余必下推車子豈識之然子病矣張侯曰師之耳目在吾旗鼓進退従之此車一人殿之可以集事殿鎮也集成也若之何其以病敗君之大事也擐甲執兵固即死也病未及死吾子勉之左并轡右援枹而鼓馬逸不能止師從之晉師從郤克車齊師敗績逐之三周華不注華不注杜注山名在今山東濟南府城北韓厥夢子輿謂已曰且辟左右子輿韓厥父言勿處車之左右兩偏故中御而従齊侯將在左居中代御者邴夏曰射其御者君子也公曰謂之君子而射之非禮也射其左越於車下越隊也射其右斃于車中綦母張喪車綦母張晉大夫從韓厥曰請寓乗寓寄也從左右皆肘之使立于後以左右皆死不欲使立其處故以肘排退之韓厥俛定其右俛俯也右被射仆車中故俯安隠之逢丑父與公易位見事急故易居公處將及華泉華不注山泉水也驂絓于木而止驂馬絓也丑父寝于轏中轏卧車也蛇出于其下以肱擊之傷而匿之故不能推車而及為韓厥所及韓厥執縶馬前縶馬絆執之示修臣僕之禮再拜稽首奉觴加璧以進曰寡君使羣臣為魯衞請曰無令輿師陷入君地下臣不幸屬當戎行屬適也無所逃隠且懼奔辟而忝兩君臣辱戎士敢告不敏攝官承乏此皆韓厥自處臣僕謙敬之飾言丑父使公下如華泉取飲時丑父代為齊侯故詐使公下車欲使走逸鄭周父御佐車佐車副車宛茷為右載齊侯以免韓厥獻丑父郤獻子将戮之呼曰自今無有代其君任患者有一于此將為戮乎郤子曰人不難以死免其君我戮之不祥赦之以勸事君者乃免之齊侯免求丑父三入三出毎出齊師以帥退入于狄卒齊師既敗皆有退心故齊侯輕出其衆以帥厲退者狄卒狄人從晉討齊者狄卒皆抽戈楯冒之以入于衞師衞師免之狄衞尚畏齊强故不敢害遂自徐闗入今淄川縣有古徐闗齊侯見保者曰勉之齊師敗矣辟女子使辟君也齊侯單還故婦人不辟之女子曰君免乎曰免矣曰鋭司徒免乎曰免矣鋭司徒主鋭兵者曰茍君與吾父免矣可若何乃奔齊侯以為有禮既而問之辟司徒之妻也辟司徒主壘壁者予之石窌石窌杜注邑名濟北盧縣東有地名石窌今屬山東長清縣晉師從齊師入自丘輿擊馬陘丘輿馬陘杜注皆齊邑在今山東益都縣界齊侯使賔媚人賂以紀甗玉磬與地媚人國佐也甗玉甑皆滅紀所得不可則聼客之所為賓媚人致賂晉人不可曰必以蕭同叔子為質同叔蕭君之字齊侯外祖父子女也難斥言其母故逺言之而使齊之封内盡東其畝壟畝南北東西各従其宜欲使盡東者為晉之伐齊循壟東行為易也對曰蕭同叔子非他寡君之母也若以匹敵則亦晉君之母也吾子布大命于諸侯而曰必質其母以為信其若王命何且是以不孝令也詩曰孝子不匱永錫爾類詩大雅言孝心不乏者又能以孝道長賜其同類若以不孝令於諸侯其無乃非徳類也乎不以孝徳賜同類先王疆理天下物土之冝而布其利疆界也理正也物土之冝播植之物各從土冝故詩曰我疆我理南東其畆詩小雅或南或東從其土冝今吾子疆理諸侯而曰盡東其畝而已唯吾子戎車是利無顧土冝其無乃非先王之命也乎反先王則不義何以為盟主其晉實有闕四王之王也禹湯文武樹徳而濟同欲焉五伯之霸也夏伯昆吾商伯大彭豕韋周伯齊桓晉文勤而撫之以役王命役事也今吾子求合諸侯以逞無疆之欲詩曰布政優優百禄是遒詩商頌優和遒聚也子實不優而棄百祿諸侯何害焉不然寡君之命使臣則有辭矣曰子以君師辱於敝邑不腆敝賦以犒從者戰而曰犒為孫辭畏君之震師徒橈敗吾子惠徼齊國之福不泯其社稷使繼舊好唯是先君之敝器土地不敢愛子又不許請收合餘燼燼火餘木背城借一敝邑之幸亦云從也况其不幸敢不唯命是聼魯衛諌曰諫郤克齊疾我矣其死亡者皆親暱也子若不許讎我必甚唯子則又何求子得其國寳謂甗磬我亦得地齊歸所侵而紓于難其榮多矣齊晉亦唯天所授豈必晉晉人許之對曰羣臣帥賦輿以為魯衞請賦輿猶兵車若茍有以藉口而復于寡君君之恵也敢不唯命是聼禽鄭自師逆公禽鄭魯大夫歸逆公㑹晉師公羊傳曹無大夫小國例無大夫公子手何以書憂内也從魯為文憂魯之不勝而曹能助之故不掩其功榖梁傳其日或曰日其戰也或曰日其悉也悉謂魯四大夫時悉在戰也明二者皆當日曹無大夫其曰公子何也以吾之四大夫在焉舉其貴者也不欲令内衆大夫與外卑者共行戰成公㓜弱國勢未張季孫一怒遂掃境興師雖無人乎其君之側而不恤也將稱元帥略其副策書之體也而四卿竝書蓋季孫自喜其事諸大夫各詡其功故舊史竝著之小國之大夫不以名見而曹公子首書亦以是也春秋有仍舊史之文以見情實寓精義者此類是也秋七月齊侯使國佐如師己酉及國佐盟于袁婁穀梁作爰婁張氏洽曰臨淄縣西有袁婁或曰在淄川境左傳秋七月晉師及齊國佐盟于袁婁使齊人歸我汶陽之田公羊傳君不使乎大夫此其行使乎大夫何佚獲也佚獲者已獲而逃亡當賤之使與大夫敵體其佚獲奈何師還齊侯還繞晉郤克投㦸逡巡再拜稽首馬前逢丑父者頃公之車右也面目與頃公相似衣服與頃公相似代頃公當左車君居左臣居右使頃公取飲頃公操飲而至頃公欲堅敵意令不疑己曰革取清者革更也軍中人多水泉濁欲使逺取清者因亡去頃公用是佚而不反逢丑父曰吾頼社稷之神靈吾君已免矣郤克曰欺三軍者其法奈何顧問執法者曰法斮斮斬于是斮逢丑父己酉及齊國佐盟于袁婁曷為不盟于師而盟于袁婁前此者晉郤克與臧孫許同時而聘于齊蕭同姪子者齊君之母也踊于棓而闚客踊上也棓躡板則客或跛或眇于是使跛者迓跛者使眇者迓眇者二大夫出相與踦閭而語移日然後相去齊人皆曰患之起必自此始二大夫歸相與率師為鞌之戰齊師大敗齊侯使國佐如師郤克曰與我紀侯之甗反魯衛之侵地使耕者東畝晉地川谷宜東畝者多欲使齊之耕者亦東畝是將以齊為土地與左傳説異且以蕭同姪子為質則吾舎子矣國佐曰與我紀侯之甗請諾反魯衞之侵地請諾使耕者東畝是則土齊也蕭同姪子者齊君之母也齊君之母猶晉君之母也不可請戰壹戰不勝請再再戰不勝請三三戰不勝則齊國盡子之有也何必以蕭同姪子為質揖而去之郤克眣魯衛之使使以其辭而為之請眣以目使人也郤克恥傷其威故使魯衛大夫以國佐辭為國佐請然後許之逮于袁婁而與之盟逮追及國佐也穀梁傳鞌去國五百里爰婁去國五十里國齊國一戰緜地五百里焚雍門之茨雍門齊城門茨蓋也侵車東至海君子聞之曰夫甚甚之辭焉言逼之太甚齊有以取之也齊之有以取之何也敗衞師于新築侵我北鄙敖郤獻子謂笑其跛齊有以取之也爰婁在師之外言師已逼其國郤克曰反魯衞之侵地以紀侯之甗来以蕭同姪子之母為質齊侯與姪子同母異父昆弟不欲斥言齊侯之母故言姪子之母也兼忿姪子笑使耕者皆東其畝然後與子盟國佐曰反魯衞之侵地以紀侯之甗来則諾以蕭同姪子之母為質則是齊侯之母也齊侯之母猶晉君之母也晉君之母猶齊侯之母也使耕者盡東其畝則是終土齊也利其戎車侵伐易将終以齊為土不可請一戰一戰不克請再再不克請三三不克請四四不克請五五不克舉國而授于是而與之盟齊國佐如師與楚屈完同而書法異何也楚服齊桓之義其使屈完如師意在受盟故書来盟前定之辭也齊師既敗使國佐納賂以求成其盟非前定也故書如師晉卿以一笑之辱與諸國連兵以逞忿義本不足以服齊及國佐如師又不能以徳禮相屬而亂以要之由是國子不可請合餘燼背城借一揖而去之郤克使魯衞之使以其詞為之請逮于袁婁而與之盟則汲汲欲盟者晉也故反以晉及之若此類見曲直之䋲墨矣附録左傳公㑹晉師於上鄍上鄍杜注地闕當在今山東陽穀縣境賜三帥先路三命之服三帥郤克士燮欒書司馬司空輿師候正亞旅皆受一命之服晉司馬司空皆大夫輿師主兵車候正主斥堠亞旅亦大夫八月壬午宋公鮑卒左傳八月宋文公卒始厚𦵏用蜃炭益車馬始用殉焼蛤為炭以瘞壙多埋車馬用人從𦵏重噐備重猶多也噐備葬噐甲兵之屬椁有四阿棺有翰檜四阿四注椁也翰旁飾檜上飾皆王禮君子謂華元樂舉于是乎不臣臣治煩去惑者也是以伏死而争今二子者君生則縱其惑謂文十八年殺母弟湏死又益其侈是棄君于惡也何臣之為庚寅衞侯速卒速公羊作遫左傳九月衞穆公卒晉三子自役弔焉哭于大門之外師還過衞因弔之未復命故不敢成禮衞人逆之逆于門外設䘮位婦人哭于門内䘮位婦人哭于堂賔在門外故移在門内送亦如之遂常以𦵏至葬通行此禮附録左傳楚之討陳夏氏也在宣十一年莊王欲納夏姬申公巫臣曰不可君召諸侯以討罪也今納夏姬貪其色也貪色為淫淫為大罰周書曰周書康誥明徳慎罰文王所以造周也明徳務崇之之謂也愼罰務去之之謂也若興諸侯以取大罰非愼之也君其圗之王乃止子反欲取之巫臣曰是不祥人也是夭子蠻子蠻鄭靈公夏姬之兄殺死無後殺御叔御叔夏姬之夫亦早死弑靈侯陳靈公戮夏南夏姬子徴舒出孔儀孔寧儀行父喪陳國楚滅陳何不祥如是人生實難其有不獲死乎天下多美婦人何必是子反乃止王以予連尹襄老襄老死於邲邲戰在宣十二年不獲其尸其子黒要烝焉黑要襄老子巫臣使道焉曰歸吾聘女道夏姬使歸鄭又使自鄭召之曰尸可得也襄老尸必來逆之姬以告王王問諸屈巫屈巫巫臣對曰其信知罃之父成公之嬖也而中行伯之季弟也知罃父荀首也中行伯荀林父也邲之戰楚人囚知罃新佐中軍而善鄭皇戌甚爱此子謂知罃其必因鄭而歸王子與襄老之尸以求之王子楚公子榖臣邲之戰荀首囚之鄭人懼于邲之役而欲求媚于晉其必許之王遣夏姬歸將行謂送者曰不得尸吾不反矣巫臣聘諸鄭聘夏姬鄭伯許之及共王即位將為陽橋之役陽橋杜注魯地博縣有陽橋在今山東泰安州西北楚伐魯至陽橋在是年冬使屈巫聘于齊且告師期巫臣盡室以行申叔跪從其父將適郢叔跪申叔時之子遇之曰異哉夫子有三軍之懼而又有桑中之喜桑中衞風淫奔之詩宜將竊妻以逃者也及鄭使介反幣而以夏姬行介副也幣聘物將奔齊齊師新敗曰吾不處不勝之國遂奔晉而因郤至以臣于晉郤至郤克族子晉人使為邢大夫邢杜注晉邑子反請以重幣錮之禁錮勿令仕王曰止其自為謀也則過矣其為吾先君謀也則忠忠社稷之固也所盖多矣蓋覆也且彼若能利國家雖重幣晉將可乎若無益于晉晉将棄之何勞錮焉為七年楚滅巫臣族晉南通吴張本晉師歸范文子後入武子曰武子士㑹文子之父無為吾望爾也乎對曰師有功國人喜以逆之先入必屬耳目焉是代帥受名也故不敢武子曰吾知免矣謂謙遜可免禍郤伯見郤伯郤克公曰子之力也夫對曰君之訓也二三子之力也臣何力之有焉范叔見范叔范文子勞之如郤伯對曰庚所命也克之制也燮何力之有焉荀庚將上軍時不出范文子上軍佐代行故稱帥以譲欒伯見公亦如之對曰燮之詔也士用命也書何力之有焉欒書下軍帥故推功上軍傳言晉帥克讓所以能勝取汶陽田汶陽漢志魯國汶郷縣顔師古曰即汶陽田今山東泗水縣東南有汶陽故城公羊傳汶陽田者何鞌之賂也取者得非其有之稱汶陽之田本魯田也齊人反我侵地不曰来歸而書取者恃大國兵力以得之而不請於天王以正其疆理則取之不以其道與得非其有奚異乎其事與取濟西田同故書法不異若龜隂讙闡乃齊人以歸於我故曰歸盖歸者其意也取者非其意也冬楚師鄭師侵衞十有一月公㑹楚公子嬰齊于蜀楚書公子自嬰齊始左傳宣公使求好于楚莊王卒宣公薨不克作好公即位受盟于晉元年盟赤棘㑹晉伐齊衛人不行使于楚不聘楚而亦受盟于晉從于伐齊故楚令尹子重為陽橋之役以救齊將起師子重曰君弱傳曰寡人生十年而喪先君共王即位至是二年蓋年十二三矣羣臣不如先大夫師衆而後可詩曰濟濟多士文王以寜詩大雅夫文王猶用衆况吾儕乎且先君莊王屬之曰無徳以及逺方莫如恵恤其民而善用之莊王臨終屬羣臣之辭乃大戸閲民户口己責棄逋責逮鰥施及老鰥救乏赦罪悉師王卒盡行彭名御戎蔡景公為左許靈公為右王卒盡行故王戎車亦行王不在不立戎右使御者居中令二君當左右之位二君弱皆强冠之冬楚師侵衞遂侵我師于蜀公賂之而退故不書侵使臧孫徃臧孫宣叔辭曰楚逺而久固將退矣無功而受名臣不敢不敢虚受退楚名楚侵及陽橋孟孫請徃孟孫孟獻子賂之以執斲執鍼織紝皆百人執斲匠人執鍼女工織紝織繒布者公衡為質公衡成公子以請盟楚人許平穀梁傳楚無大夫其曰公子何也嬰齊亢也侵稱師著衆也㑹稱嬰齊著公㑹楚大夫義各有所當也不書楚師侵伐何也蜀魯地楚師至蜀而公遽出迎故不成乎侵伐也以望國諸侯降班毁列與蠻荆之大夫㑹辱莫大焉故致賂納質皆略而不書以為不足書也季孫以逞一笑之憤辱國危君至此罪不容於誅矣丙申公及楚人秦人宋人陳人衞人鄭人齊人曹人邾人薛人鄫人盟于蜀左傳十一月公及楚公子嬰齊蔡侯許男秦右大夫説宋華元陳公孫寜衞孫良夫鄭公子去疾及齊國之大夫盟于蜀齊大夫不書其名非卿也卿不書匱盟也于是乎畏晉而竊與楚盟故曰匱盟言匱乏而盟蔡侯許男不書乘楚車也謂之失位乗楚王車為左右是失位也卿不書則稱人諸侯不書皆不見經君臣之别君子曰位其不可不慎也乎蔡許之君一失其位不得列于諸侯况其下乎詩曰不觧于位民之攸塈詩大雅言在上者勤正其位則國安而民息塈息也其是之謂矣楚師及宋公衡逃歸臧宣叔曰衡父不忍數年之不宴宴樂也以棄魯國國将若之何誰居後之人必有任是夫居語辭言後人必有當此患國棄矣是行也晉辟楚畏其衆也君子曰衆之不可以已也大夫為政猶以衆克况明君而善用其衆乎大誓所謂商兆民離周十人同者衆也大誓周書民離則弱合則成衆言殷以散亡周以衆興公羊傳此楚公子嬰齊也其稱人何得一貶焉爾得一貶者獨此一事得具見其惡故貶之爾穀梁傳楚其稱人何也于是而後公得其所也卑楚以尊公㑹與盟同月則地㑹不地盟不同月則地㑹地盟此其地㑹地盟何也以公得其所申其事也今之屈向之驕也楚人序於諸國之上主盟也薄宋之盟書㑹而此書公及何也薄宋皆楚盟諸侯而公徃㑹之此則楚師壓境公汲汲欲與之盟又諸國皆大夫宜用以尊及卑之辭也㑹書公子嬰齊而盟書楚人何也使㑹書楚人則疑於楚卿貶稱人而不見望國之君屈下於楚大夫之辱盟書公子嬰齊而列序諸國之卿則疑於諸侯及大夫盟㑹之常辭而無以見楚大夫主盟公及諸國從楚之非義矣程子所謂㣲辭隠義時措從宜者此類是也附錄左傳晉侯使鞏朔獻齊㨗于周王弗見使單襄公辭焉曰蠻夷戎狄不式王命式用也淫湎毁常王命伐之則有獻㨗王親受而勞之所以懲不敬勸有功也兄弟甥舅侵敗王略兄弟同姓國甥舅異姓國略經略法度王命伐之告事而已不獻其功所以敬親暱禁淫慝也今叔父克遂有功于齊克能也而不使命卿鎮撫王室所使来撫余一人而鞏伯實来未有職司于王室大國三卿二卿命于天子鞏朔上軍大夫名位卑不逹於王室又奸先王之禮謂獻齊㨗余雖欲于鞏伯欲受其獻其敢廢舊典以忝叔父夫齊甥舅之國也齊世與周昏故曰甥舅而大師之後也寜不亦淫從其欲以怒叔父抑豈不可諫誨士莊伯不能對莊伯鞏朔王使委于三吏委屬也三吏三公禮之如侯伯克敵使大夫告慶之禮降于卿禮一等王以鞏伯宴而私賄之使相告之曰非禮也勿籍相相禮者籍書也王畏晉故私宴賄以慰鞏朔日講春秋解義卷三十一
