body:
  text: 欽定四庫全書日講春秋解義卷二十六文公十有五年春季孫行父如晋左傳十五年春季文子如晉為單伯與子叔姬故也因晋請齊商人弒逆執君夫人及魯使魯不能以義討而反因晋以求齊行父使晉不知請討晋為盟主亦不能討皆罪也直書行父如晋貶自見矣三月宋司馬華孫來盟左傳三月宋華耦來盟其官皆從之書曰宋司馬華孫貴之也𫝊曰卿行旅從華孫能率其屬以敬事自重故貴而不名然非也周之禮經諸侯相聘其使介有常數矣不聞其官皆從以為典也公與之宴辭曰君之先臣督得罪于宋殤公耦華督曾孫督弒殤公在桓二年名在諸侯之䇿臣承其祀其敢辱君請承命于亞旅亞旅上大夫魯人以為敏穀梁傳司馬官也其以官稱無君之辭也來盟者何前定也不言及者以國與之也書司馬華孫者著其為華督之孫世執兵柄如武氏子仍叔之子之類不書名意在因族以見義不繫於名也不言使自請之也華耦蓋與穆襄之族黨公子鮑豫結諸侯疑子哀在魯或間其好故因是來盟其専行無君與屈完髙子之來盟異春秋美惡不嫌同辭以事實具見於前後也屈完來盟而楚帖髙子來盟而魯定華孫來盟而昭公弒其迹固較然異矣夏曹伯來朝左傳夏曹伯來朝禮也諸侯五年再相朝以修王命古之制也十一年曹伯來朝至此五年𫝊為齊侯伐曹張本凡書來朝皆譏譏其不朝天子而私相朝也曹伯十一年來朝越四年又朝過於事天子之禮尤失其正春秋書之以示貶亦以起齊人伐曹之文為不能以禮自守而妄悅人以召禍者戒也齊人歸公孫敖之喪左傳齊人或為孟氏謀孟氏公孫敖家慶父為長庶故或稱孟氏曰魯爾親也飾棺置諸堂阜堂阜齊魯竟上地飾棺不殯示無所歸魯必取之從之卞人以告卞人卞邑大夫惠叔猶毁以為請敖卒至今朞年毁猶未己哀過喪禮立于朝以待命許之取而殯之齊人送之書曰齊人歸公孫敖之喪為孟氏且國故也為惠叔毁請且國之公族故葬視共仲以罪降聲已不視帷堂而哭聲己惠叔母怨敖從莒女故帷堂襄仲欲勿哭怨敖取其妻惠伯曰即叔彭生喪親之終也雖不能始善終可也史佚有言曰兄弟致美各盡其美救乏賀善弔災祭敬喪哀情雖不同毋絶其愛親之道也子無失道何怨于人襄仲說帥兄弟以哭之他年其二子來敖在莒所生孟獻子愛之聞于國獻子穀之子仲孫蔑或譖之曰將殺子獻子以告季文子二子曰夫子以愛我聞我以將殺子聞不亦逺于禮乎逺禮不如死一人門于句鼆一人門于戾丘皆死句鼆戾丘杜注魯邑有寇攻門二子禦之而死蓋以眀其無殺獻子之心公羊傳何以不言來內辭也脅我而歸之筍將而來也筍者竹箯一名編輿將送也大夫卒於外不書喪至此獨書何也敖奉命如京師棄命出奔為禽獸行魯聽其復既復再奔又受其喪見魯之無政刑也不言來歸蓋齊人但致之境上而敖之子自取以葬故不曰來六月辛丑朔日有食之鼓用牲于社左傳六月辛丑朔日有食之鼓用牲于社非禮也日有食之天子不舉伐鼓于社責羣隂諸侯用幣于社社尊于諸侯故請救而不敢責之伐鼓于朝退自責以昭事神訓民事君天子不舉諸侯用幣所以事神尊卑異制所以訓民示有等威古之道也莊公兩以日食鼓用牲于社既已非禮今文公亦復如此必以為先朝故事可舉而行而不顧義之可否因陋承誤妄亦甚矣單伯至自齊左傳齊人許單伯請而赦之使來致命畏晉故書曰單伯至自齊貴之也單伯執節不移故貴之榖梁傳大夫執則致致則名此其不名何也據昭十四年意如至自晋稱名天子之命大夫也大夫恆出不書至惟執則書國體所係也單伯致而不名者命大夫例書字也尊王命也晋郤缺帥師伐蔡戊申入蔡左傳新城之盟在前年蔡人不與晋郤缺以上軍下軍伐蔡曰君弱不可以怠戊申入蔡以城下之盟而還凡勝國曰滅之勝國絶其社稷有其土地獲大城焉曰入之得大都而不有公羊傳入不言伐此其言伐何至之日也其日何至之日也用兵之道當先至竟侵責之不服乃伐之今日至便以今日伐故日以起其暴也入而言伐又舉日於伐下者見伐之不服然後入也所以兼惡蔡然晋實不能制楚入蔡何為書伐書入以譏晋也秋齊人侵我西鄙榖梁傳其曰鄙逺之也其逺之何也不以難介我國也介猶近也季孫行父如晋左傳秋齊人侵我西鄙故季文子告于晋商人大逆無道諸侯不討反怙逆以伐人故貶而人之師無名故曰侵魯因齊之暴再往告晋晋實主盟而縱商人至此罪可知矣冬十有一月諸侯盟于扈左傳冬十一月晋侯宋公衛侯蔡侯陳侯鄭伯許男曹伯盟于扈尋新城之盟且謀伐齊也齊數伐魯故齊人賂晋侯故不克而還于是有齊難是以公不㑹書曰諸侯盟于扈無能為故也惡受賂不能討齊凡諸侯㑹公不與不書諱君惡也謂國無難不㑹義事故為惡與而不書後也謂後期也是盟為齊亂也魯以備齊故不㑹非一後再有事而不序諸侯散辭也見晋不足以主盟而諸侯無統紀也弒君之賊人人得而討之晋侯受賂而在㑹諸侯俯首以聽晋命其罪惟均故同略而不序十有二月齊人來歸子叔姬左傳齊人來歸子叔姬王故也以單伯為王使故叔姬之歸曰王故公羊傳其言來何閔之也此有罪何閔爾父母之于子雖有罪猶若其不欲服罪然父為子隱人情之至也穀梁傳其曰子叔姬貴之也其言來歸何也父母之于子雖有罪猶欲其免也不言齊子叔姬來歸而曰齊人來歸子叔姬者見子叔姬無罪齊人自絶而歸之爾此商人為之稱齊人者罪齊人以商人為君而不知其惡深責之也按二𫝊於叔姬皆云父母之于子則其為文公女也益信齊侯侵我西鄙遂伐曹入其郛左傳齊侯侵我西鄙謂諸侯不能也不能討已遂伐曹入其郛討其來朝也此年夏曹伯朝魯季文子曰齊侯其不免乎已則無禮而討于有禮者曰女何故行禮禮以順天天之道也已則反天而又以討人難以免矣詩曰胡不相畏不畏于天詩小雅君子之不虐幼賤畏于天也在周頌曰畏天之威于時保之詩周頌言畏天威于是保福祿不畏于天將何能保以亂取國奉禮以守猶懼不終多行無禮弗能在矣為十八年齊弒商人𫝊公羊傳郛者何恢郭也恢大也郭城外大郭入郛書乎曰不書圍不言入入郛不書此何以書動我也動我懼我也動我者何內辭也其實我動焉爾因侵我遂入曹故詳其事若云齊不去而伐曹幾入我郛矣可懼也扈之㑹晋取齊賂而還商人自此知諸國之無能為益肆其暴以魯如晋謀已而曹修禮於魯故一歲再侵魯以及曹書遂著其暴也入其郛者甚之也十有六年春季孫行父㑹齊侯于陽榖齊侯弗及盟左傳十六年春王正月及齊平公有疾使季文子㑹齊侯于陽榖請盟齊侯不肯曰請俟君間間疾瘳公羊傳其言弗及盟何不見與盟也謂齊侯不肯盟榖梁傳弗及者內辭也行父失命矣齊得內辭也行父出㑹失辭為齊侯所拒不盟由齊故得內辭文公怠於國政不能憤發自彊討齊之亂反使商人得以彊大威我命使執辱邉鄙被兵此有志者困心衡慮時而公方且宴安於國使其臣降志求盟復為商人所侮故直書曰齊侯弗及盟弗者遷詞若曰我本欲盟而齊不及我盟以深愧之也夏五月公四不視朔左傳夏五月公四不視朔疾也公羊傳公曷為四不視朔公有疾也何言乎公有疾不視朔自是公無疾不視朔也然則曷為不言公無疾不視朔有疾猶可言也無疾不可言也榖梁傳天子告朔于諸侯諸侯受乎禰廟禮也公四不視朔公不臣也天子班朔而公不視是不臣以公為厭政以甚矣上書夏五月下書四不視朔追言之也前此未有書不視朔者若其有疾則亦常事爾而特書者見公之非有疾而然也蓋此時本以疾詐齊自是遂因循廢之有不視朔亦不復書其譏已明矣不重譏也六月戊辰公子遂及齊侯盟于郪丘公羊作犀丘穀梁作師丘公羊疏云正本作菑丘杜注齊地當在今山東東阿縣境左傳公使襄仲納賂于齊侯故盟于郪丘穀梁傳復行父之盟也春齊侯不與行父盟故復使遂修之行父請盟則弗及仲遂納賂則從齊固貪利而魯之畏齊抑何甚也夫齊魯皆千乘之國齊曲而魯直彼以力我以義何懾於齊而以賄成哉明年齊侯復有西鄙之伐則知要盟不足恃而魯之為計亦愚矣秋八月辛未夫人姜氏薨毁泉臺左傳有蛇自泉宫出入于國如先君之數伯禽至僖公十七君秋八月辛未聲姜薨僖公夫人文公母也毁泉臺公羊傳泉臺者何郎臺也莊公築臺于郎郎臺則曷為謂之泉臺未成為郎臺未成但以地名之既成為泉臺既成更以所置名之毁泉臺何以書譏何譏爾築之譏毁之譏先祖為之已毁之不如勿居而已矣穀梁傳喪不二事二事緩喪也喪事主哀而復毁泉臺是以喪為緩以文為多失道矣自古為之今毁之不如勿處而已矣若以夫人居之而薨但當勿處泉臺之築固為非禮然先君所舉其存與毁亦非治亂安危之所繫則勿居可也而勞民毁之以暴其失有蔑視先祖之心故謹而志之楚人秦人巴人滅庸左傳楚大饑戎伐其西南至于阜山師于大林又伐其東南至于陽丘以侵訾枝戎山夷也阜山在今湖廣房縣南大林陽丘訾枝杜注皆楚邑大林在今湖廣荆門州西北庸人帥羣蠻以叛楚庸杜注上庸縣屬楚之小國麇人率百濮聚于選將伐楚百濮夷也選杜注楚地當在今湖廣枝江縣南境于是申息之北門不啓備中國楚人謀徙于阪髙阪髙杜注楚險地當在今湖廣襄陽府西境蒍賈曰不可我能往寇亦能往不如伐庸夫麇與百濮謂我饑不能師故伐我也若我出師必懼而歸百濮離居將各走其邑誰暇謀人乃出師旬有五日百濮乃罷自廬以往振廪同食往往伐庸也振發也廩倉也同食上下無異饌也次于句澨句澨杜注楚西界地當在今湖廣均州西使廬戢黎侵庸及庸方城方城杜注庸地上庸縣東有方城亭在今湖廣竹山縣東庸人逐之囚子揚窗窗戢黎官屬三宿而逸曰庸師衆羣蠻聚焉不如復大師還復句澨師且起王卒合而後進師叔曰師叔楚大夫潘尫也不可姑又與之遇以驕之彼驕我怒而後可克先君蚡冒所以服陘隰也蚡冒楚武王父陘隰杜注地名在今湖廣荆州府東又與之遇七遇皆北僞走也唯裨鯈魚人實逐之裨鯈魚杜注庸之三邑魚古魚復縣即今四川奉節縣庸人曰楚不足與戰矣遂不設備楚子乘馹㑹師于臨品臨品杜注地名當在今湖廣均州界分為二隊子越自石溪子貝自仞以伐庸子越鬬椒也子貝楚大夫石溪仞杜注入庸道俱當在今湖廣均州界秦人巴人從楚師羣蠻從楚子盟遂滅庸𫝊言楚有謀臣所以興庸乘楚饑帥羣蠻以叛楚楚伐之取成可已而夷其宗社罪莫大焉秦與滅庸則服於楚矣夫城濮之役秦實助晉至是晉反棄以資楚楚西連巴秦繞出周晉之後而同力以敵晉則列國諸侯在其掌握矣此楚所以益彊而晉不振也冬十有一月宋人弒其君杵臼公羊作處臼左傳宋公子鮑禮于國人鮑昭公庶弟文公也宋饑竭其粟而貸之年自七十以上無不饋詒也時加羞珍異羞進也無日不數于六卿之門數不疏國之材人無不事也親自桓以下無不恤也桓鮑之曾祖公子鮑美而豔襄夫人欲通之鮑嫡祖母而不可乃助之施昭公無道國人奉公子鮑以因夫人于是華元為右師華元督曽孫代公子成公孫友為左師華耦為司馬代公子卬鱗矔為司徒蕩意諸為司城公子朝為司寇代華御事初司城蕩卒公孫夀辭司城夀蕩之子請使意諸為之意諸夀之子既而告人曰君無道吾官近懼及焉棄官則族無所庇子身之二也姑紓死焉雖亡子猶不亡族已在故也既夫人將使公田孟諸而殺之公知之盡以寶行蕩意諸曰盍適諸侯公曰不能其大夫至于君祖母以及國人諸侯誰納我且既為人君而又為人臣不如死盡以其寶賜左右而使行夫人使謂司城去公對曰臣之而逃其難若後君何言無以事後君冬十一月甲寅宋昭公將田孟諸未至夫人王姬使帥甸攻而殺之襄夫人周襄王姊故稱王姬帥甸郊甸之帥蕩意諸死之書曰宋人弒其君杵臼君無道也稱國人弒以見其君有罪文公即位使母弟須為司城代意諸華耦卒而使蕩虺為司馬虺意諸之弟公羊傳弒君者曷為或稱名氏或不稱名氏大夫弒君稱名氏賤者窮諸人言非大夫則稱人大夫相殺稱人賤者窮諸盜言非大夫則稱盜謂其詞己窮無他可稱也宋昭公之弒由襄夫人而書宋人者以昭公無道國人皆有欲弒之心故以衆言之既著昭公自取之實又正宋人以大惡之名而主者之罪自在其中矣不書葬賊不討也蕩意諸之死不書以其知國人之謀而不能止知昭公之危而不能救坐待其及故不得與死於其職者同也十有七年春晉人衛人陳人鄭人伐宋左傳十七年春晉荀林父衛孔達陳公孫寧鄭石楚伐宋討曰何故弒君猶立文公而還卿不書失其所也鄉不書謂稱人失其所討之罪程子謂行天討而成其亂失天職也故四國之卿貶而稱人義本左氏先儒皆宗之獨啖氏助以為不命之卿例稱人考是時晉之當國者趙盾而荀林父僅佐中軍衛之當國者寧俞而孔達未嘗執政陳公孫寧抑置衛下其尤卑可知鄭石楚亦無聞於時則啖說未失也不然襄二十五年齊崔杼弒其君諸侯㑹于夷儀謀伐齊而沮於賂猶是役也而列序十二國之君其義不可通矣夏四月癸亥葬我小君聲姜聲公羊作聖左傳夏四月癸亥葬聲姜有齊難是以緩公羊傳聖姜者何文公之母也九月乃葬慢也不稱僖姜而别為之諡非禮也齊侯伐我西鄙六月癸未公及齊侯盟于穀西當作北左傳齊侯伐我北鄙襄仲請盟六月盟于穀郪丘盟矣齊猶以公不親往復肆侵伐脅公出盟而公之昏庸不能為國以禮汲汲請盟乞免於伐齊之無道極矣魯之不振甚矣諸侯㑹于扈左傳晉侯搜于黃父黃父杜注一名黑壤晉地遂復合諸侯于扈平宋也公不與㑹齊難故也書曰諸侯無功也刺欲平宋而復不能于是晉侯不見鄭伯以為二于楚也鄭子家使執訊而與之書執訊通訊問之官以告趙宣子曰寡君即位三年魯文二年召蔡侯而與之事君九月蔡侯入于敝邑以行行朝晉也敝邑以侯宣多之難寡君是以不得與蔡侯偕宣多既立穆公恃寵專權十一月克減侯宣多而隨蔡侯以朝于執事減損也難未盡而行言汲汲于朝晉十二年六月歸生佐寡君之嫡夷歸生子家名夷太子名靈公也以請陳侯于楚而朝諸君十四年七月寡君又朝以蕆陳事蕆敕也敕成前好十五年五月陳侯自敝邑往朝于君往年正月燭之武往朝夷也將夷往朝于晉八月寡君又往朝以陳蔡之密邇于楚而不敢二焉則敝邑之故也雖敝邑之事君何以不免在位之中一朝于襄襄公而再見于君夷與孤之二三臣相及于絳絳晉國都雖我小國則蔑以過之矣今大國曰爾未逞吾志敝邑有亡無以加焉古人有言曰畏首畏尾身其餘幾言首尾有畏則身中不畏者少又曰鹿死不擇音音茠䕃之處小國之事大國也德則其人也不德則其鹿也鋌而走險急何能擇鋌疾走貌命之罔極亦知亡矣將悉敝賦以待于鯈鯈晉鄭之竟言欲以兵距晉唯執事命之文公二年六月壬申朝于齊鄭文二年魯莊之二十三年四年二月壬戌為齊侵蔡亦獲成于楚居大國之間而從于强令豈其罪也大國若弗圖無所逃命晉鞏朔行成于鄭趙穿公壻池為質焉諸侯不序所以削晉霸而著其黨逆之罪也昭公雖無道非宋人所得而弒晉不能討又安定之是廢君臣之義滅天理矣然則何以不書成宋亂如稷之㑹乎華督之弒霸事未興故書以責在㑹之諸侯今晉主夏盟而率諸侯以奬亂罪浮㑹稷故削晉稱諸侯事同辭異罪有輕重故也秋公至自穀商人不可與盟書至危之且見不與扈之㑹以著公失所從也附録左傳秋周甘歜敗戎于邥垂乘其飲酒也歜周大夫邥垂杜注周地河南新鄭縣北有垂亭今為河南洛陽縣地為成元年晉侯平戎于王𫝊冬十月鄭大子夷石楚為質于晉石楚鄭大夫冬公子遂如齊左傳襄仲如齊拜穀之盟復曰臣聞齊人將食魯之麥言將伐魯以臣觀之將不能齊君之語偷臧文仲有言曰民主偷必死自商人之篡魯連年被兵上卿納賂請盟又親與盟繼又使卿往聘而怒猶未怠也卑屈之不足以紓禍也如是十有八年春王二月丁丑公薨于臺下左傳十八年春齊侯戒師期而有疾戒師將以伐魯醫曰不及秋將死公聞之卜曰尚無及期欲令先師期死惠伯令龜以卜事告龜卜楚丘占之曰齊侯不及期非疾也君亦不聞言君先齊侯終令龜有咎言令龜者亦有凶兆為惠伯死張本二月丁丑公薨穀梁傳臺下非正也秦伯罃卒秦自九年歸襚始與魯通好至是書卒蓋來赴而往弔其喪也夏五月戊戌齊人弒其君商人左傳齊懿公之為公子也與邴歜之父爭田弗勝及即位乃掘而刖之斷其尸足而使歜僕納閻職之妻而使職驂乘夏五月公游于申池申池杜注齊南城西門名申門左右有池在今山東臨淄縣西二人浴于池歜以撲抶職撲箠也抶擊也欲以相感激職怒歜曰人奪女妻而不怒一抶女庸何傷職曰與刖其父而弗能病者何如乃謀弒懿公納諸竹中歸舍爵而行飲酒訖乃去言齊人惡懿公二人無所畏齊人立公子元桓公子惠公歜職以僕御之賤既斃商人舍爵而行略不畏忌則齊人固惡商人而欲其斃也故以弒君繫之然商人前書弒舍今不從州吁無知之例以討賊書者蓋罪齊人既以為君而又殺之也六月癸酉葬我君文公左傳六月葬文公秋公子遂叔孫得臣如齊左傳秋襄仲莊叔如齊惠公立故且拜葬也襄仲賀惠公立莊叔謝齊來㑹葬文公二妃敬嬴生宣公敬嬴嬖而私事襄仲宣公長而屬諸襄仲襄仲欲立之叔仲不可叔仲惠伯仲見于齊侯而請之齊侯新立而欲親魯許之穀梁傳使舉上客而不稱介不正其同倫而相介故列而數之也上客聘主也禮大夫為卿介遂與得臣俱為卿是以同倫為副使故兩言之明無差降使舉上客常也其變文書介副者欲以起問者見事情也子赤之弒經以卒書其實尚隱故上書大夫竝使下書夫人歸于齊中曰子卒則見邪謀發於奉使之日而公子遂弒立之罪著矣冬十月子卒左傳冬十月仲殺惡及視而立宣公惡大子視其母弟書曰子卒諱之也仲以君命召惠伯詐以子惡命其宰公冉務人止之曰入必死叔仲曰死君命可也公冉務人曰若君命可死非君命何聽弗聽乃入殺而埋之馬矢之中公冉務人奉其帑以奔蔡既而復叔仲氏不絶其後公羊傳子卒者孰謂謂子赤也何以不日隱之也何隱爾弒也弒則何以不日不忍言也穀梁傳子卒不日故也故殺也稱子卒成之為在喪之君也凡君在喪稱子繼世不忍當也既葬不名終人子之事也不書弒不忍斥言卒而不日則不以正終明矣何以知其賊乎上書大夫竝使下書子卒則知罪之在公子遂矣叔仲彭生死之不書者蓋史官畏遂不敢書夫子作春秋當哀公時而宣公乃時君之祖故仍舊史為國諱惡不敢增也或謂死非君命不得以死節書則人臣扞君於患難之際必待命而往亦已晚矣夫人姜氏歸于齊左傳夫人姜氏歸于齊惡視之母出姜也大歸也將行哭而過市曰天乎仲為不道殺適立庶市人皆哭魯人謂之哀姜終出姜不允于魯𫝊穀梁傳惡宣公也有不待貶絶而罪惡見者有待貶絶而惡從之者直書姜氏之歸則宣公罪惡不貶而自見姪娣者不孤子之意也言其中一人有子則當共養一人有子三人緩帶緩帶優游之稱一曰就賢也若竝有子則就其賢宣公以庶篡立非賢之謂故惡之文公葬子卒而夫人出則知嗣子之殁於弒而不容於魯也齊人弒舍而歸叔姬於魯魯人弒赤而歸出姜於齊人紀絶矣內夫人以罪出曰孫無罪而出曰歸季孫行父如齊行父與謀弒赤故出姜方歸行父亟往蓋赤實齊甥恐夫人訴而齊來討於是議納賂請盟之事行父之罪固不待貶而魯之臣子皆不可勝誅矣莒弒其君庶其左傳莒紀公生大子僕又生季他紀號也莒夷無諡故有别號愛季他而黜僕且多行無禮于國僕因國人以弒紀公以其寶玉來奔納諸宣公公命與之邑曰今日必授季文子使司寇出諸竟曰今日必逹公問其故季文子使大史克對曰先大夫臧文仲教行父事君之禮行父奉以周旋弗敢失隊曰見有禮于其君者事之如孝子之養父母也見無禮于其君者誅之如鷹鸇之逐鳥雀也先君周公制周禮曰則以觀德德以處事事以度功功以食民則法也合法則為吉德違法則為凶德處制也度量也食養也作誓命曰毁則為賊誓命要信之辭毁則壞法也掩賊為藏掩匿也竊賄為盜盜器為姦器國用也主藏之名以掩賊為名賴姦之用用姦器也為大凶德有常無赦刑有常在九刑不忘誓命以下皆九刑之書行父還觀莒僕莫可則也還猶周旋孝敬忠信為吉德盜賊藏姦為凶德夫莒僕則其孝敬則弒君父矣則其忠信則竊寶玉矣其人則盜賊也其器則姦兆也兆域也保而利之則主藏也以訓則昏民無則焉不度于善而皆在于凶德是以去之昔髙陽氏有才子八人髙陽帝顓頊之號八人其苗裔蒼舒隤敳檮戭大臨尨降庭堅仲容叔達此即垂益禹臯陶之倫齊聖廣淵眀允篤誠天下之民謂之八愷齊中也淵深也允信也篤厚也愷和也髙辛氏有才子八人髙辛帝嚳之號八人亦其苗裔伯奮仲堪叔獻季仲伯虎仲熊叔豹季貍此即稷契朱虎熊羆之倫忠肅共懿宣慈惠和天下之民謂之八元肅敬也懿美也宣遍也元善也此十六族也世濟其美不隕其名以至于堯堯不能舉舜臣堯舉八愷使主后土禹作司空即主地之官以揆百事莫不時序地平天成揆度也成亦平也舉八元使布五教于四方契作司徒敷五教故知契在八元之中父義母慈兄友弟共子孝內平外成內中夏外逺國昔帝鴻氏有不才子帝鴻黃帝掩義隱賊好行凶德醜類惡物頑嚚不友是與比周醜亦惡也心不則德義之經為頑口不道忠信之言為嚚比近也周密也天下之民謂之渾敦渾敦不開通之貌謂歡兜少皞氏有不才子少皞金天氏之號次黃帝毁信廢忠崇飾惡言靖譛庸回服讒搜慝以誣盛德崇聚也靖安也庸用也回邪也服行也搜隱也慝惡也天下之民謂之窮竒其行窮其好竒謂共工顓頊氏有不才子不可教訓不知話言話善也告之則頑舍之則嚚傲很明德以亂天常天下之民謂之檮杌檮杌頑凶無儔匹之貌謂鯀此三族也世濟其凶增其惡名以至于堯堯不能去縉雲氏有不才子縉雲黃帝氏官名貪于飲食冒于貨賄冒亦貪也侵欲崇侈不可盈厭聚斂積實不知紀極不分孤寡不恤窮匱天下之民以比三凶非帝王子孫故别以比三凶謂之叨餮貪財為叨貪食為餮舜臣堯為堯臣賓于四門闢四門以賓禮衆賢流四凶族渾敦窮竒檮杌叨餮投諸四裔以禦螭魅投棄也裔逺也螭魅山林異氣所生為人害者是以堯崩而天下如一同心戴舜以為天子以其舉十六相去四凶也故虞書數舜之功曰慎徽五典五典克從無違教也徽美也此八元之功曰納于百揆百揆時序無廢事也此八愷之功曰賓于四門四門穆穆無凶人也去四凶之功舜有大功二十而為天子舉十六相去四凶也今行父雖未獲一吉人去一凶矣于舜之功二十之一也庶幾免于戾乎公羊傳稱國以弒何稱國以弒者衆弒君之辭紀公多行無禮稱國以弒衆所欲弒也左氏言大子僕因國人以弒是以子弒父春秋何為沒而不書且僕既以衆弒則宜自立矣又何以來奔故吳氏澄謂僕因國人以弒紀公以當作之卓氏爾康又謂以已二字古人通用蓋紀公已見弒故僕懼禍及而來奔也若據𫝊則經不書僕弒義無所處故竝録焉附録左傳宋武氏之族宋武公之子孫道昭公子將奉司城須以作亂文公弒昭公故武族欲導其子以作亂司城須文公弟十二月宋公殺母弟須及昭公子使戴莊桓之族攻武氏于司馬子伯之館戴族華樂也莊族公孫師也桓族向魚鱗蕩也司馬子伯華耦也遂出武穆之族以穆族黨于武氏故使公孫師為司城公孫師莊公之孫代母弟須公子朝卒使樂吕為司寇以靖國人樂吕戴公之曽孫為宣三年宋師圍曹𫝊日講春秋解義卷二十六
