body:
  text: 欽定四庫全書日講春秋觧義卷二十五文公十年春王三月辛卯臧孫辰卒臧孫魯之名大夫也知栁下惠之賢而不與立自莊公末己與聞國政四十餘年魯政多疵安在其為賢哉夏秦伐晉左傳十年春晉人伐秦取少梁夏秦伯伐晉取北徵少梁杜注馮翊夏陽縣今陜西韓城縣南有少梁城北徵古國今陜西澄城縣西南有古城晉舍適嗣而外求君罪也既而悔之正矣秦不顧義理是非報復不已且結楚以為援致晉人力疲於西楚人逞志於南庸蕭陳鄭圍滅相繼中國之屈於楚秦為之也故伐晉不稱人苐舉號以黜之楚殺其大夫宜申左傳初楚范巫矞似矞似范邑之巫謂成王與子玉子西曰三君皆将强死城濮之役王思之故使止子玉曰毋死不及止子西子西縊而縣絶在僖二十八年王使適至遂止之使為商公商杜注楚邑上雒商縣今屬陜西商州㳂漢泝江将入郢㳂順流泝逆流王在渚宫下見之懼而辭曰子西倉卒見王而懼以辭謝王臣免于死又有䜛言謂臣将逃臣歸死于司敗也陳楚名司宼為司敗王使為工尹掌百工之官又與子家謀弑穆王穆王聞之五月殺鬬宜申及仲歸仲歸子家不書非卿宜申謀弑穆王而稱國以殺不去其官何哉曰穆王者即楚世子商臣也而春秋之義微矣自正月不雨至于秋七月穀梁傳歴時而言不雨文不閔雨也不閔雨者無志乎民者也歴時總書不雨言雨不雨皆漫不繫於公心也及蘇子盟于女栗女栗杜注地名闕左傳秋七月及蘇子盟于女栗頃王立故也僖十年狄滅温蘇子奔衛今復見者盖王復之蘇子來盟王使之也頃王新立不能修明王度以朝諸侯而乃使大夫盟魯辱也故諱而書及及者我所欲也其不書公為公諱也襄王喪葬公未嘗往頃王既立公又不朝乃與王臣要盟臣子之義安在哉故諱之冬狄侵宋狄歴侵諸國猶未及宋至是見侵蓋乘宋亂且料晉之不能救也楚子蔡侯次于厥貉厥公羊作屈厥貉杜注地名闕當在今河南項城縣左傳陳侯鄭伯㑹楚子于息冬遂及蔡侯次于厥貉将以伐宋陳鄭及宋麇子不書者宋鄭執卑茍免為楚僕任受役于司馬麇子恥之遂逃而歸三君失位降爵故不列于諸侯宋鄭猶然則陳侯必同也宋華御事曰華御事華元之父楚欲弱我也先為之弱乎何必使誘我我實不能民何罪乃逆楚子勞且聽命遂道以田孟諸孟諸杜注宋大藪也在梁國雎陽縣東北在今河南商丘縣東北宋公為右盂鄭伯為左盂盂田獵陳名期思公復遂為右司馬子朱及文之無畏為左司馬期思杜注弋陽期思縣在今河南固始縣西北復遂期思公名子朱無畏皆楚大夫将獵張雨甄故置左司馬二人分于左右以右司馬一人居中命夙駕載燧宋公違命無畏抶其僕以徇燧取火者抶撻也或謂子舟曰國君不可戮也子舟無畏字子舟曰當官而行何强之有詩曰剛亦不吐柔亦不茹詩大雅美仲山甫不辟强禦毋縱詭隨以謹罔極詩大雅詭隨心不正者罔無極中也是亦非辟强也敢愛死以亂官乎為宣十四年宋人殺子舟張本厥貉之㑹麇子逃歸為明年楚子伐麇𫝊次者欲進而不前之意楚将伐宋而不果故書次以著其包藏禍心欲憑陵諸夏而未遂也楚子侵伐書爵其勢益張而諸侯畏之也蔡侯首附楚故序於楚下以示譏書爵者斥言以罪其人也十有一年春楚子伐麇麇公羊作圏楚始書君将左傳十一年春楚子伐麇成大心敗麇師于防渚防渚杜注麇地今湖廣房縣潘崇復伐麇至于錫穴錫穴杜注麇地今湖廣鄖陽府治厥貉之㑹麇子逃歸蓋見宋陳鄭以大國公侯而受役於楚司馬故恥於失列而去之也以𫝊考之一敗於防渚再廹於錫穴而不聞與楚成所謂與民守之效死而民弗去者也春秋不書麇子之逃而獨書楚子伐麇聖人之情見矣夏叔仲彭生㑹晉郤缺于承筐公羊穀梁無仲字筐作匡承筐杜注宋地在陳畱襄邑縣今河南睢州西有故城此大夫特相㑹之始左傳夏叔仲惠伯㑹晉郤缺于承筐惠伯即彭生謀諸侯之從于楚者九年陳鄭及楚平十年宋聽楚命是㑹謀諸侯之從楚未為非義然大夫專㑹以謀國事諸侯之政大夫擅之矣故謹而志之秋曹伯來朝左傳秋曹文公來朝即位而來見也曹文公即位在九年諸侯世相朝禮也曹伯即位來朝常事爾然不先如京師故書之以見失尊王之義也曹本服宋自晉文執曹共公以畀宋人遂不與諸侯之事蓋晉方惡曹宋遂挾為私屬也至是晉政中衰曹文公嗣立遂自附於魯而後此復列於諸侯之㑹盟公子遂如宋左傳襄仲聘于宋且言司城蕩意諸而復之八年意諸來奔歸不書史失之因賀楚師之不害也前年楚次厥貉将以伐宋魯聘宋者八蓋始於此是時頃王立已三年且使蘇子來盟公既不朝又不遣聘而亟修禮於宋其悖甚矣狄侵齊冬十月甲午叔孫得臣敗狄于鹹鹹杜注魯地左傳鄋瞞侵齊鄋瞞狄國名漆姓在夏為防風氏殷為汪芒氏遂伐我公卜使叔孫得臣追之吉侯叔夏御莊叔緜房甥為右富父終甥駟乘侯叔夏緜房甥富父終甥皆魯大夫駟乘四人共車冬十月甲午敗狄于鹹獲長狄僑如僑如鄋瞞之君蓋長三丈富父終甥摏其喉以戈殺之摏猶衝也埋其首于子駒之門子駒魯郭門骨節非常恐後世怪之故詳其處以命宣伯得臣待事而名其三子因名宣伯曰僑如以旌其功初宋武公之世鄋瞞伐宋在春秋前司徒皇父帥師禦之耏班御皇父充石公子穀甥為右司宼牛父駟乘以敗狄于長丘皇父戴公子充石其名耏班穀甥牛父皆宋大夫長丘杜注宋地在今河南封丘縣東獲長狄縁斯縁斯僑如之先皇父之二子死焉宋公于是以門賞耏班使食其征謂之耏門皇父與穀甥及牛父皆死故耏班獨受賞門關門征税也晉之滅潞也在宣十五年獲僑如之弟焚如齊襄公之二年魯桓十六年也鄋瞞伐齊齊王子成父獲其弟榮如埋其首于周首之北門榮如焚如之弟以魯桓公十六年死至宣十五年一百三歳其兄猶在傳言既長且夀有異于人王子成父齊大夫周首杜注齊邑濟北穀城縣東北有周首亭在今山東東阿縣東北衛人獲其季弟簡如伐齊退走至衛見獲鄋瞞由是遂亡長狄之種絶公羊傳狄者何長狄也兄弟三人一者之齊一者之魯一者之晉其之齊者王子成父殺之其之魯者叔孫得臣殺之則未知其之晉者也其言敗何大之也敵一人而言敗以狄長大非一人所能敵興師動衆然後殺之如大戰然故就其事言敗其日何大之也如約日大戰其地何大之也如據地大戰何以書記異也穀梁傳不言帥師而言敗何也直敗一人之辭也一人而曰敗何也以衆焉言之也言其力足以敵衆𫝊曰長狄也弟兄三人佚宕列國佚更也宕擾也瓦石不能害叔孫得臣最善射者也射其目身横九畝廣一步長百步為一畝九畝五丈四尺斷其首而載之眉見于軾兵車之軾髙三尺三寸然則何為不言獲也曰古者不重創不禽二毛故不言獲為内諱也既射其目又斷其首是重創非古道故諱之其之齊者王子成父殺之則未知其之晉者也十餘年之間狄四侵齊而侵魯宋者各一今得臣出其不虞而敗之自是始有懼心其勢少戢不言帥師将尊師少也不曰戰者内勝之辭也不言獲長狄僑如賤之也附録左傳郕大子朱儒自安于夫鍾國人弗徇安處也夫鍾杜注郕邑徇順也為明年郕伯來奔𫝊十有二年春王正月郕伯來奔郕公羊作盛左傳十二年春郕伯卒郕人立君大子自安于外邑故大子以夫鍾與郕邽來奔郕邽杜注郕邑公以諸侯逆之非禮也非公寵叛人故書曰郕伯來奔不書地尊諸侯也既尊以為諸侯故不復見其竊邑之罪所以深責魯也公羊傳盛伯者何失地之君也何以不名兄弟辭也義見僖二十年郜子來朝𫝊諸侯失地皆名其不名者非其自取也荘八年郕降于齊師自是入齊為附庸今又來奔蓋為齊所偪耳春秋不名恕之也杞伯來朝左傳杞桓公來朝始朝公也且請絶叔姬而無絶昏公許之不絶昏立其娣以為夫人不書來歸未笄而卒二月庚子子叔姬卒左傳二月叔姬卒不言杞絶也既許其絶故不言杞書叔姬言非女也女未嫁而卒不書公羊傳此未適人何以卒許嫁矣婦人許嫁字而笄之死則以成人之喪治之其稱子何貴也其貴奈何母弟也穀梁傳其曰子叔姬貴也公之母姊妹也同母姊妹其一𫝊曰許嫁以卒之也别據一説以叔姬時已許嫁故書其卒男子二十而冠冠而列丈夫三十而娶女子十五而許嫁二十而嫁禮女子許嫁而卒即為長殤有服引此以明許嫁而卒之之意叔姬曰子蓋時君之女以别於先君之女也女子適人必係國叔姬字未嫁也夏楚人圍巢巢杜注吳楚閒小國廬江六縣東有居巢城今江南廬州府巢城西巢湖即其處左傳楚令尹大孫伯卒成嘉為令尹成嘉若敖曾孫子孔羣舒叛楚羣舒杜注偃姓舒庸舒鳩之屬廬江南有舒城西南有龍舒按今江南舒城廬江二縣之境皆羣舒地夏子孔執舒子平及宗子遂圍巢平舒君名宗巢二國羣舒之屬書稱巢伯來朝則巢之建國久矣王道不行小國困於彊暴不得保其社稷書圍巢者惡楚之不仁而小國之無所庇頼也秋滕子來朝左傳秋滕昭公來朝亦始朝公也曹把滕相繼來朝以魯為秉禮之國也文公乃不思述職有闕而越再朝之期覲禮不修不亦悖乎秦伯使術來聘術公羊作遂左傳秦伯使西乞術來聘且言将伐晉襄仲辭玉玉圭璋也禮聘義云以圭璋聘己聘而還圭璋今聘禮方行而辭玉不與秦之伐晉也曰君不忘先君之好照臨魯國鎮撫其社稷重之以大器寡君敢辭玉對曰不腆敝器不足辭也主人三辭賓答曰寡君願徼福于周公魯公以事君不腆先君之敝器使下臣致諸執事以為瑞節節信也周禮大宗伯以玉作六瑞以等邦國是也要結好命所以藉寡君之命結二國之好是以敢致之襄仲曰不有君子其能國乎國無陋矣厚賄之公羊傳遂者何秦大夫也秦無大夫秦楚吳越之國不書其大夫此何以書賢繆公也何賢乎繆公以為能變也其為能變奈何唯諓諓善竫言俾君子易怠而况乎我多有之諓諓淺薄之貌竫猶撰也易怠輕慢也唯一介斷斷焉無他技其心休休能有容是難也秦将為河曲之戰故以賄結魯而魯亦厚賄之是相與以利也歸襚稱人此稱君大夫蓋漸進之術不氏未命之卿來魯皆書名也遣聘者康公也而𫝊以為賢繆公朱子謂公羊穀梁未見國史觀此類可知冬十有二月戊午晉人秦人戰于河曲河曲杜注在河東蒲坂縣南今山西蒲州東南隅有故城左傳秦為令狐之役故在七年冬秦伯伐晉取羈馬羈馬杜注晉邑在今山西蒲州南晉人禦之趙盾将中軍荀林父佐之代先克郤缺将上軍代箕鄭父臾駢佐之代林父欒盾将下軍欒枝子代先蔑胥甲佐之胥臣子代先都范無恤御戎代步招以從秦師于河曲臾駢曰秦不能久請深壘固軍以待之從之秦人欲戰秦伯謂士㑹曰晉士㑹七年奔秦若何而戰對曰趙氏新出其屬曰臾駢必實為此謀将以老我師也趙有側室曰穿側室支子穿趙夙庶孫晉君之壻也有寵而弱不在軍事未嘗涉知軍事好勇而狂且惡臾駢之佐上軍也若使輕者肆焉其可肆暫往而速退也秦伯以璧祈戰于河十二月戊午秦軍掩晉上軍趙穿追之不及反上軍不動趙穿獨追之秦軍速退故不及怒曰裹糧坐甲固敵是求敵至不擊将何俟焉軍吏曰将有待也穿曰我不知謀将獨出乃以其屬出宣子曰秦獲穿也獲一卿矣時穿為散卿如前郤缺之未有軍行秦以勝歸我何以報乃皆出戰交綏司馬法曰從綏不及是古名退軍為綏秦晉兵未及爭而兩退故曰交綏秦行人夜戒晉師曰兩軍之士皆未憗也明日請相見也憗缺也臾駢曰使者目動而言肆懼我也将遁矣目動心不安言肆聲放失常節薄諸河必敗之胥甲趙穿當軍門呼曰死傷未收而棄之不惠也不待期而薄人于險無勇也乃止謀泄故不行為宣元年放胥甲𫝊秦師夜遁復侵晉入瑕公羊傳此偏戰也何以不言師敗績敵也曷為以水地以水地者以水之曲折為地名意謂水曲甚多疑不足以定地之名如戰泓不言曲河曲疏矣河千里而一曲也千里而始一曲則為河曲有幾故水亦可以定地之名也穀梁傳不言及秦晉之戰己亟故畧之也亟數也戰必有曲直以一人主之二國戰鬬數曲直不可得詳故畧不言及凡戰皆以主及客秦為令狐之役積忿不已又為是戰曲在秦故不云晉及不書敗績交綏而退無勝負也季孫行父帥師城諸及鄆鄆公羊作運後同杜注城陽姑幕縣南有員亭即鄆也今山東沂水縣北鄆城是按此為東鄆成四年城鄆為西鄆乃在東平州左傳城諸及鄆書時也穀梁傳稱帥師言有難也帥師而城畏莒故也鄆莒邑而介於魯城非其所有慮莒必爭於是乎以兵往諸魯邑也而近於鄆故竝以師城十有三年春王正月附録左傳十三年春晉侯使詹嘉處瑕以守桃林之塞詹嘉晉大夫賜其瑕邑令帥衆守桃林以備秦桃林杜注在𢎞農華隂縣東潼關地理通釋自潼關至函谷歴陜華二州地俱謂之桃林塞今陜西華隂縣以東河南靈寳縣以西皆是也夏五月壬午陳侯朔卒附録左傳晉人患秦之用士㑹也以前年士㑹為秦畫計故夏六卿相見于諸浮諸浮杜注晉地趙宣子曰隨㑹在秦賈季在狄難日至矣若之何中行桓子曰中行桓子荀林父也僖二十八年始将中行故以為氏請復賈季能外事且由舊勲有狐偃之舊勲郤成子曰賈季亂且罪大殺陽處父故不如隨㑹能賤而有恥柔而不犯不可犯以不義其知足使也且無罪乃使魏夀餘偽以魏叛者以誘士㑹執其帑于晉使夜逸魏夀餘畢萬之後帑夀餘子請自歸于秦秦伯許之履士㑹之足于朝躡士㑹足欲使行秦伯師于河西将取魏魏人在東夀餘曰請東人之能與夫二三有司言者吾與之先欲與晉人在秦者共先告喻魏有司使士㑹士㑹辭曰晉人虎狼也若背其言臣死妻子為戮無益于君不可悔也辭行示己無去心秦伯曰若背其言所不歸爾帑者有如河乃行繞朝贈之以䇿繞朝秦大夫䇿馬檛曰子無謂秦無人吾謀適不用也示己覺其情既濟魏人譟而還喜得士㑹秦人歸其帑其處者為劉氏士㑹堯後劉累之裔别族復累之姓邾子蘧蒢卒穀梁作籧篨左傳邾文公卜遷于繹繹杜注邾邑在今山東鄒縣東南史曰利于民而不利于君邾子曰茍利于民孤之利也天生民而樹之君以利之也民既利矣孤必與焉左右曰命可長也君何弗為邾子曰命在養民死之短長時也民茍利矣遷也吉莫如之左右以一人之命為言文公以百姓之命為主一人之命各有短長不可如何百姓之命乃𫝊世無窮故卒徙之遂遷于繹五月邾文公卒君子曰知命自正月不雨至于秋七月大室屋壊大公羊作世左傳秋七月大室之屋壊書不共也公羊傳世室者何魯公之廟也周公稱大廟魯公稱世室羣公稱宫此魯公之廟也曷為謂之世室世室猶世室也世世不毁也魯公始封之君故不毁周公何以稱大廟于魯封魯公以為周公也周公拜乎前魯公拜乎後始受封時拜于文王廟也曰成王始授其茅土之辭生以養周公死以為周公主如周公死當以魯公為祭祀主然則周公之魯乎曰不之魯也封魯公以為周公主然則周公曷為不之魯欲天下之一乎周也周公徳至重功至大嫌之魯恐天下迴心趨向之所以一天下之心于周室魯祭周公何以為牲周公用白牲白牲殷牲也周公死有王禮謙不敢與文武同也魯公用騂犅騂犅赤脊周牲也魯公以諸侯不嫌故從周制以脊為差羣公不毛不毛不純色所以降于尊祖魯祭周公何以為盛盛粢盛也在器曰盛周公盛盛者謂新穀滿其器魯公燾燾者冐也下故而上冒以新也羣公廪廪謂全用故穀上少有新穀相連而已世室屋壊何以書譏何譏爾久不修也穀梁傳大室屋壊者有壊道也譏不修也大室猶世室也周公曰大廟伯禽曰大室羣公曰宫禮宗廟之事君親割割牲夫人親舂舂粢盛敬之至也為社稷之主而先君之廟壊極稱之志不敬也極稱言屋壊不復依違其文魯以周公為始祖祀於大廟伯禽為昭之第一室親盡當毁魯人以其始封不祧其主以為世室文公怠慢廟久不葺當恒暘之時而屋自壊不㳟甚矣更造不書者雖用民力不可已也冬公如晉衛侯㑹公于沓㑹下公羊無公字沓杜注地闕狄侵衛晉不能霸以啓戎心故狄因衛侯之出乘閒侵之書之以病晉也十有二月己丑公及晉侯盟公還自晉鄭伯㑹公于棐還上公羊穀梁無公字棐公羊作斐杜注鄭地即棐林今河南新鄭縣東林鄉城是也左傳冬公如晉朝且㝷盟尋八年衡雍之盟衛侯㑹公于沓請平于晉公還鄭伯㑹公于棐亦請平于晉公皆成之衛鄭貳于楚畏晉故因公請平鄭伯與公宴于棐子家賦鴻雁子家鄭大夫公子歸生也鴻雁詩小雅義取侯伯哀恤鰥寡有征行之勞喻鄭國寡弱欲使魯侯還晉恤之季文子曰寡君未免于此言亦同有微弱之患文子賦四月四月詩小雅義取行役踰時思歸祭祀不欲為之還晉子家賦載馳之四章載馳詩鄘風四章以下義取小國有急欲引大國以救助文子賦采薇之四章采薇詩小雅取其豈敢定居一月三捷許為鄭還不敢安居鄭伯拜謝公為行公答拜公羊傳還者何善辭也何善爾往黨衛侯㑹公于沓至得與晉侯盟反黨鄭伯㑹公于斐故善之也黨所也所猶時齊人語也穀梁傳還者事未畢也自晉事畢也諸侯将朝于天子豫相㑹禮也今文公朝晉而往返㑹衛鄭之君非禮也然三國皆無貶辭者蓋衛鄭不忘晉霸而介魯以求通春秋善其棄異即同故詳志之十有四年春王正月公至自晉附録左傳十四年春頃王崩子匡王立周公閲與王孫蘇爭政故不赴凡崩薨不赴則不書禍福不告亦不書懲不敬也欲使怠慢者戒是歲頃王崩公既盟晉還又與鄭㑹久於道路而不臨不賻不奔故書至以著之王崩不書未赴也邾人伐我南鄙叔彭生帥師伐邾左傳邾文公之卒也在前年公使弔焉不敬邾人來討伐我南鄙故惠伯伐邾魯以七年伐邾取須句邾人不能報至是乘公如晉伐我南鄙不知公之既至也兵未反魯復報之邾子卒未一年居喪而伐人與伐人之喪皆罪也夏五月乙亥齊侯潘卒左傳子叔姬妃齊昭公生舍叔姬無寵舍無威公子商人驟施于國商人桓公子驟數也而多聚士盡其家貸于公有司以繼之家財盡從公及國之有司富者貸夏五月昭公卒舍即位附録左傳邾文公元妃齊姜生定公二妃晉姬生捷菑文公卒邾人立定公捷菑奔晉六月公㑹宋公陳侯衛侯鄭伯許男曹伯晉趙盾癸酉同盟于新城新城杜注宋此梁國穀熟縣西在今河南商丘縣西南左傳六月同盟于新城從于楚者服且謀邾也從楚者陳鄭宋謀邾謀納捷菑穀梁傳同者有同也同外楚也同盟于新城諸侯既㪚復合同外楚也時楚勢益彊諸侯畏懼欲依晉以自固載書要言與齊桓盟幽事雖異而所以為同一也趙盾主盟不以先諸侯君臣之分也附録左傳秋七月乙夘夜齊商人弑舍而讓元元商人兄齊惠公也書九月從告七月無乙夘日誤元曰爾求之久矣我能事爾爾不可使多蓄憾不為君則恨多将免我乎爾為之秋七月有星孛入于北斗左傳有星孛入于北斗周内史叔服曰不出七年宋齊晉之君皆将死亂後三年宋弑昭公五年齊弑懿公七年晉弑靈公案是時此星在角由杓入斗自北而入晉居北齊宋居晉東故三國當之斗數七故云不及七年公羊傳孛者何彗星也状如篲篲者掃故置新之象其言入于北斗何北斗有中也北斗天之樞機玉衡七政所出中者魁中何以書記異也穀梁傳孛之為言猶茀也茀星亂臣之類其曰入北斗北斗貴星人君之象斗有環域也據孛于大辰及東方皆不言入此言入者見斗有規郭入其魁中也有星者不當有而有北斗天之三辰綱紀星也孛得入之其變大矣宋先代之後齊晉天子方伯乃中國之紀綱而三君皆違道失徳故當其應天之示人切矣公至自㑹晉人納捷菑于邾弗克納公羊作接菑左傳晉趙盾以諸侯之師八百乘納捷菑于邾八百乘六萬人言力有餘邾人辭曰齊出貜且長貜且定公宣子曰辭順而弗從不祥乃還公羊傳納者何入辭也其言弗克納何大其弗克納也何大乎其弗克納晉郤缺帥師革車八百乘以納接菑于邾婁力沛若有餘而納之邾婁人言曰接菑晋出也貜且齊出也子以其指指手指則接菑也四貜且也六言俱不得天之正性喻皆庶子也子以大國壓之則未知齊晉孰有之也貴則皆貴矣雖然貜且也長既兩不得正性又皆貴惟當以年長立之郤缺曰非吾力不能納也義實不爾克也引師而去之故君子大其弗克納也大其不以己非奪人之是此晉郤缺也其稱人何貶曷為貶不與大夫專廢置君也曷為不與實與而文不與文曷為不與大夫之義不得專廢置君也穀梁傳是郤克也其曰人何也微之也何為微之也長轂五百乘緜地千里長轂兵車五百乘合三萬七千五百人緜猶彌漫過宋鄭滕薛夐入千乘之國夐逺也欲變人之主至城下然後知何知之晚也弗克納未伐而曰弗克何也弗克其義也捷菑晉出也貜且齊出也貜且正也捷菑不正也書弗克納言聞過而改失之於初而得之於末愈乎遂過也書人者本未得其主名也觀三𫝊所𫝊各異可徵舊史失其名而非孔子用此為襃貶矣附録左傳周公将與王孫蘇訟于晉王叛王孫蘇王匡王叛不與而使尹氏與􅖫啓訟周公于晉尹氏周卿士􅖫啓周大夫趙宣子平王室而復之楚荘王立穆王子也子孔潘崇将襲羣舒使公子燮與子儀守而伐舒蓼即羣舒二子作亂城郢而使賊殺子孔不克而還八月二子以楚子出将如商密廬戢黎及叔麇誘之遂殺鬬克及公子燮廬杜注襄陽中廬縣戢黎廬大夫叔䴢其佐鬬克子儀也初鬬克囚于秦在僖二十五年秦有殽之敗在僖三十三年而使歸求成成而不得志無賞報也公子燮求令尹而不得故二子作亂九月甲申公孫敖卒于齊左傳穆伯之從己氏也在八年魯人立文伯穆伯之子穀穆伯生二子于莒而求復文伯以為請襄仲使無朝聽命不使與聽政事復而不出三年而盡室以復適莒文伯疾而請曰穀之子弱子孟獻子年尚幼請立難也難穀弟許之文伯卒立惠叔穆伯請重賂以求復惠叔以為請許之将來九月卒于齊告喪請葬請以卿禮葬弗許穀梁傳奔大夫不言卒而言卒何也為受其喪不可不卒也其地于外也大夫奔不書卒非我臣也既許其歸則其卒也是亦大夫而已矣故書之卒在常所則不地書卒于齊見死非其地且為齊人歸喪起也齊公子商人弑其君舍左傳齊人定懿公使來告難故書以九月齊公子元不順懿公之為政也終不曰公曰夫己氏夫己氏猶言某甲公羊傳此未踰年之君也其言弑其君舍何己立之已殺之成死者而賤生者也惡商人無道故成舍之君號以賤商人之所為穀梁傳舍未踰年其曰君何也成舍之為君所以重商人之弑也商人其不以國氏何也不以嫌代嫌也舍不宜立有不正之嫌商人專權有當國之嫌故不書國氏明不以嫌相代舍之不日何也未成為君也舍未踰年成之為君者春秋之作本以懲姦惡若立未踰年被弑而不曰君則逆亂之臣皆得以肆其凶惡故原情立義而以弑書晉奚齊亦未踰年以本不正故不書弑商人稱公子見天屬之親而為宼讎甚之也宋子哀來奔左傳宋髙哀為蕭封人以為卿蕭宋附庸初仕蕭還升為卿不義宋公而出遂來奔書曰宋子哀來奔貴之也貴其不食汙君之禄辟禍速也公羊傳宋子哀者何無聞焉爾穀梁傳其曰子哀失之也失其氏族不知何人公羊曰無聞穀梁曰失之謂不書其氏族耳左氏曰貴之則以為稱字不知古有以子名者陳子亢介子推是也不書氏族與宋蕩山同乃赴告之辭略耳冬單伯如齊齊人執單伯單伯如齊唁子叔姬也吳氏澄謂子叔姬為文公女歸齊而舍遇弑姬無所從魯故遣單伯往請商人惡魯與舍為昏因單伯來誣以罪而并子叔姬執之兩書齊人執者明單伯子叔姬之不相及别而言之所以重齊人之罪也案左氏謂子叔姬妃齊昭公考齊昭立在文公前七年則叔姬不得為文公女而春秋以子稱其説不可通矣單伯見荘元年此猶見者蓋其子孫世稱之也齊人執子叔姬左傳襄仲使告于王請以王寵求昭姬于齊昭姬子叔姬曰殺其子焉用其母請受而罪之冬單伯如齊請子叔姬齊人執之恨魯恃王勢以求女故又執子叔姬欲以恥辱魯公羊傳執者曷為或稱行人或不稱行人稱行人而執者以其事執也以其所街奉國事執之晉人執我行人叔孫舍是也不稱行人而執者以己執也己者已大夫自以大夫之罪執之單伯之罪何道淫也惡乎淫淫于子叔姬時子叔姬嫁當為齊夫人使單伯送之然則曷為不言齊人執單伯及子叔姬内辭也使若異罪然深諱使若各自以他事見執者穀梁傳私罪也單伯淫于齊齊人執之叔姬同罪也商人弑君之惡已顯而執叔姬之事聖人不獨罪商人也齊人不討賊俱北面事之又敢執君夫人是舉國之人皆有不赦之罪故書曰齊人所以窮亂賊之黨與而治之也日講春秋觧義卷二十五
