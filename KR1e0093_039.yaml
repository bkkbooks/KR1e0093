body:
  text: 欽定四庫全書日講春秋解義卷三十九襄公十年春公㑹晉侯宋公衛侯曹伯莒子邾子滕子薛伯把伯小邾子齊世子光㑹吳于柤柤杜注楚地今山東嶧縣泇口是也左傳十年春㑹于柤㑹吳子夀夢也夀夢吳子乘三月癸丑齊髙厚相大子光以先會諸侯于鍾離不敬吳子未至先從東道與東諸侯㑹遇非夲期地故不書會髙厚髙固子士莊子曰髙子相大子以會諸侯將社稷是衛而皆不敬棄社稷也其將不免乎為十九年齊殺髙厚二十五年弒其君光傳夏四月戊午㑹于柤經書春書始行也戊午月一日穀梁傳會又會外之也晉率十二諸侯㑹吳于楚地示楚以得吳也晉得吳則楚不敢議鄭議鄭則懼吳襲其後此即齊桓逺結江黃之遺智也特書㑹吳以吳為此㑹故也夏五月甲午遂滅逼陽逼穀梁作傅杜注逼陽妘姓國彭城傅陽縣也在今山東嶧縣南左傳晉荀偃士丐請伐逼陽而封宋向戌焉以宋常事晉而向戌有賢行故欲封之為附庸荀罃曰城小而固勝之不武弗勝為笑固請丙寅圍之弗克丙寅四月九日孟氏之臣秦堇父輦重如役堇父孟獻子家臣逼陽人啓門諸侯之士門焉縣門發縣門編版廣長如門施機關以縣門上有寇則發機而下之郰人紇抉之以出門者郰杜注魯縣東南莝城紇郰邑大夫仲尼父叔梁紇也抉舉也門者諸侯之士在門內者狄虒彌建大車之輪而蒙之以甲以為櫓狄虒彌魯人也櫓大楯左執之右拔㦸以成一隊百人為隊成一隊言其當百人也孟獻子曰詩所謂有力如虎者也詩邶風主人縣布逼陽人縣布以試外勇者堇父登之及堞而絶之隊則又縣之蘇而復上者三主人辭焉乃退帶其斷以徇于軍三日帶其斷布以示勇諸侯之師久于逼陽從丙寅至庚寅二十五日故曰久荀偃士丐請于荀罃曰水潦將降懼不能歸請班師知伯怒知伯荀罃投之以機出于其閒出偃丐之閒曰女成二事而後告余二事伐逼陽封向戌余恐亂命以不女違女既勤君而興諸侯牽帥老夫以至于此既無武守而又欲易余罪曰是實班師不然克矣謂偃丐將言爾余羸老也可重任乎不任受女此責七日不克必爾乎取之五月庚寅月四日荀偃士丐帥卒攻逼陽親受夫石甲午滅之月八日書曰遂滅逼陽言自㑹也以與向戌向戌辭曰君若猶辱鎮撫宋國而以逼陽光啓寡君羣臣安矣其何貺如之若専賜臣是臣興諸侯以自封也其何罪大焉敢以死請乃豫宋公宋公享晉侯于楚丘請以桑林桑林殷天子之樂名荀罃辭荀偃士丐曰諸侯宋魯于是觀禮宋王者後魯以周公故皆用天子禮樂故可觀魯有禘樂賔祭用之宋以桑林享君不亦可乎舞師題以旌夏師樂師旌夏大旌也題識也以大旌表識其行列晉侯懼而退入于房旌夏非常卒見之心偶有所畏去旌卒享而還及著雍疾著雍杜注晉地卜桑林見祟見于卜兆荀偃士丐欲奔請禱焉荀罃不可曰我辭禮矣彼則以之猶有鬼神于彼加之晉侯有間間疾差也以逼陽子歸獻于武宫謂之夷俘逼陽妘姓也使周內史選其族嗣納諸霍人禮也霍杜注晉邑使周史者示有王命師歸孟獻子以秦堇父為右生秦丕兹事仲尼言堇父以力相尚子事仲尼以德相尚穀梁傳遂直遂也其曰遂何不以中國從夷狄也言時實吳㑹諸侯滅傅陽逼陽楚與國為吳晉往來要地故帥㑹柤之師滅之以通吳曰遂繼事之詞也諸侯㑹而滅人之國非禮也公至自㑹榖梁傳㑹夷狄不致恥與同惡事不致恥有惡此其致何也存中國也中國有善事則并焉如僖四年侵蔡蔡潰遂伐楚是并焉不另書也無善事則異之存之也會吳于柤甲午遂滅傅陽是則若㑹與遂異人汲鄭伯汲猶引也鄭伯髠為臣所弒而不書弒此引而致于善事逃歸陳侯謂鄬之會致柤之㑹存中國也公之出夲為會吳故歸仍以㑹告也楚公子貞鄭公孫輒帥師伐宋左傳六月楚子囊鄭子耳伐宋師于訾毋訾毋杜注宋地當在今河南鹿邑縣境庚午圍宋門于桐門桐門宋城門名凡專將言帥師苟二國㑹則先序主兵者而不言帥師蓋諸侯猶務恤民而不輕用衆也鄭受晉師楚人勞役釁起於宋故各用重兵而自是圍滅亦竝稱帥師此春秋將變為戰國之漸也晉師伐秦左傳晉荀罃伐秦報其侵也侵在九年秦嘗侵晉故知罃以師報之夫晉方圖楚不思樹秦以為援而反搆秦以資敵非計之得者也附録左傳衛侯救宋師于襄牛鄭子展曰必伐衛不然是不與楚也得罪于晉又得罪于楚國將若之何子駟曰國病矣子展曰得罪于二大國必亡病不猶愈于亡乎諸大夫皆以為然故鄭皇耳帥師侵衛楚令也亦兼受楚之敕命也皇耳皇戌子孫文子卜追之獻兆于定姜姜氏問繇曰兆如山陵有夫出征而喪其雄姜氏曰征者喪雄禦寇之利也大夫圖之衛人追之孫蒯獲鄭皇耳于犬丘蒯孫林父子秋七月楚子囊鄭子耳伐我西鄙還圍蕭八月丙寅克之九月子耳侵宋北鄙孟獻子曰鄭其有災乎師競已甚周猶不堪競况鄭乎有災其執政之三士乎秋莒人伐我東鄙左傳莒人閒諸侯之有事也故伐我東鄙莒屢同晉悼之盟而乘間加兵於魯其無忌憚甚矣公㑹晉侯宋公衛侯曹伯莒子邾子齊世子光滕子薛伯把伯小邾子伐鄭此三駕之一左傳諸侯伐鄭齊崔杼使太子光先至于師故長于滕己酉師于牛首牛首杜注鄭地齊世子光序四君上蓋晉悼以齊大國光復先至心嘉其勤遂進之以勸來者此伯主摟諸侯之術也直書其事義自見矣冬盜殺鄭公子騑公子發公孫輒騑公羊穀梁作斐書盜始此左傳初子駟與尉止有爭將禦諸侯之師而黜其車禦牛首師也黜減損尉止獲獲囚俘又與之爭子駟抑尉止曰爾車非禮也遂弗使獻不使獻所獲初子駟為田洫洫田畔溝也司氏堵氏侯氏子師氏皆喪田焉侵四族田故五族聚羣不逞之人因公子之徒以作亂八年子駟所殺公子媐等之黨于是子駟當國子國為司馬子耳為司空子孔為司徒冬十月戊辰尉止司臣侯晉堵女父子師僕帥賊以入晨攻執政于西宫之朝殺子駟子國子耳劫鄭伯以如北宫子孔知之故不死子孔公子嘉知難不告為十九年殺公子嘉傳書曰盜言無大夫焉尉止等五人皆士也子西聞盜子西公孫夏子駟子不警而出尸而追盜先臨尸而追盜盜入于北宫乃歸授甲臣妾多逃器用多喪子産聞盜子産子國子為門者置守門庀羣司閉府庫慎閉藏完守備成列而後出兵車十七乘千二百七十五人尸而攻盜于北宫子蟜帥國人助之殺尉止子師僕盜衆盡死侯晉奔晉堵女父司臣尉翩司齊奔宋尉翩尉止子司齊司臣子子孔當國代子駟為載書以位序聽政辟自羣卿諸司各守其職位以受執政之法不得與朝政大夫諸司門子弗順將誅之子孔欲誅不順者子産止之請為之焚書子孔不可曰為書以定國衆怒而焚之是衆為政也國不亦難乎子産曰衆怒難犯専欲難成合二難以安國危之道也不如焚書以安衆子得所欲衆亦得安不亦可乎專欲無成犯衆興禍子必從之乃焚書于倉門之外不於朝內焚欲使逺近見所燒衆而後定榖梁傳稱盜以殺大夫弗以上下道惡上也兩下相殺不志乎春秋惡鄭伯不能修政刑致盜殺大夫也以上下道當言鄭人殺其大夫盜殺三卿不稱其大夫者正義云凡言其者其所有也君實臣之君故書弒其君臣實君之臣故書殺其大夫盜者寇賊之名被殺者非盜之所有既以盜為文故不得言其大夫其說精矣但欲書大夫獨不可如蔡侯申例而書曰盜殺鄭大夫某乎蓋騑者主從楚以勞中國又弒君之賊也而發輒惟騑是從惡積不可掩鄭不能討而盜得殺之故不書大夫當討之賊也不書鄭人不以討賊之義豫尉止等也戌鄭虎牢楚公子貞帥師救鄭左傳諸侯之師城虎牢而戌之晉師城梧及制欲以逼鄭不書城魯不與也梧制杜注皆鄭舊地案隋書滎陽縣有梧桐澗疑即梧也士魴魏絳戌之書曰戌鄭虎牢非鄭地也言將歸焉鄭服則欲以還鄭故繫之鄭以見晉志鄭及晉平楚子囊救鄭十一月諸侯之師還鄭而南至于陽陵還繞也陽陵杜注鄭地在今河南許州西北楚師不退知武子欲退曰今我逃楚楚必驕驕則可與戰矣欒黶曰逃楚晉之恥也合諸侯以益恥不如死我將獨進師遂進己亥與楚師夾潁而軍潁杜注潁水出城陽至下蔡入淮子蟜曰諸侯既有成行必不戰矣從之將退不從亦退從猶服也退楚必圍我猶將退也不如從楚亦以退之以退楚宵涉潁與楚人盟欒黶欲伐鄭師伐涉潁者荀罃不可曰我實不能禦楚又不能庇鄭鄭何罪不如致怨焉而還為後伐之資今伐其師楚必救之戰而不克為諸侯笑克不可命勝負難要不可命以必克不如還也丁未諸侯之師還侵鄭北鄙而歸欲以致怨楚人亦還公羊傳孰戌之諸侯戌之曷為不言諸侯戌之離至不可得而序故言我也諸侯已取之矣曷為繫之鄭據莒牟夷以牟婁來奔夲把之邑不繫于把諸侯莫之主有故反繫之鄭穀梁傳其曰鄭虎牢决鄭乎虎牢也二年鄭去楚從中國故城虎牢不言鄭使與內無異後數反覆故繫之鄭若决絶而棄外然諸侯伐鄭而鄭不下於是乎頓兵虎牢為久駐計非遣兵往戌若戌陳比也晉人主於扼鄭而使之自服肄楚而使之自疲故不與楚戰而惟示鄭以必克之勢是以諸侯方戌鄭即請成曰戌鄭虎牢明戌其要地以厄之而非為鄭戌也楚書救非善之也蓋紀其實且見晉有成謀楚雖欲救而不能耳公至自伐鄭虎牢既戌鄭將自服故以伐致而䇿勳焉附録左傳王叔陳生與伯輿爭政二子王卿士王右伯輿右助王叔陳生怒而出奔及河王復之殺史狡以說焉不入遂處之處叔河上晉侯使士丐平王室王叔與伯輿訟焉王叔之宰與伯輿之大夫瑕禽坐獄于王庭瑕禽伯輿屬大夫周禮命夫命婦不躬坐獄訟故使宰與屬大夫對爭曲直士丐聽之王叔之宰曰篳門閨竇之人而皆陵其上其難為上矣篳門柴門閨竇小戶穿壁為户上鋭下方狀如圭也言伯輿微賤之家瑕禽曰昔平王東遷吾七姓從王牲用備具王賴之而賜之騂旄之盟平王徙時大臣從者七姓伯輿祖在其中主為王備犧牲共祭祀王恃其用故與之盟使世守其職騂旄赤牛也舉騂旄者言得重盟不以犬雞曰世世無失職若篳門閨竇其能來東底乎且王何賴焉今自王叔之相也政以賄成隨財制政而刑放于寵寵臣専刑不任法官之師旅不勝其富吾能無篳門閨竇乎唯大國圗之下而無直則何謂正矣正者不失下之直范宣子曰天子所右寡君亦右之所左亦左之宣子知伯輿直不欲自專故推之于王使王叔氏與伯輿合要合要辭如今辨答也王叔氏不能舉其契理曲無以答故不能舉其要契之辭王叔奔晉不書不告也單靖公為卿士以相王室十有一年春王正月作三軍左傳十一年春季武子將作三軍魯本無中軍唯上下二軍皆屬于公有事三卿更帥以征伐季氏欲専其民人故假立中軍因以改作告叔孫穆子曰請為三軍各征其軍征賦稅也穆子曰政將及子子必不能政者霸國之政令禮大國三軍魯次國而為大國之制貢賦必重故憂不能堪武子固請之穆子曰然則盟諸穆子知季氏將復變易故盟之乃盟諸僖閎僖宫之門詛諸五父之衢五父衢道名在魯國東南詛以禍福之言相要正月作三軍三分公室而各有其一三子各毁其乘壞其私乘分以足成三軍季氏使其乘之人以其役邑入者無征不入者倍征役力役邑賦稅設利害以懼民驅使入已民辟倍征故盡屬季氏孟氏使半為臣若子若弟取其子弟之半也四分其乘之人以三歸公而取其一叔孫氏使盡為臣盡取子弟以其父兄歸公不然不舍公羊傳三軍者何三卿也作三軍何以書譏何譏爾古者上卿下卿上士下士古制諸侯有司徒司空上下卿各一上士相上卿下士相下卿今益司馬作中卿官踰王制故譏之榖梁傳作為也古者天子六師諸侯一軍作三軍非正也費誓稱魯人三郊三遂說者謂大國三軍故三郊三遂則三軍魯之舊也何以謂之作蓋前此民皆屬公故車曰公車徒曰公徒屬有侵伐之事諸卿遞將不一其權是魯之三軍也至是襄公幼弱政歸季氏遂分國民為三三家各有其一又各以父兄子弟分為四季氏盡取四分叔孫氏取子弟而以父兄歸公孟氏止取其子弟之半而以三歸公於是但有私家之軍而無公室之軍矣是以謂之作作者不宜作也亂王制弱公室故謹書之夏四月四卜郊不從乃不郊穀梁傳夏四月不時也四卜非禮也四卜郊不從事已見於僖公但於彼書免牲而於此書不郊者蓋言免牲則不郊可知云不郊則卜免牲不吉而不敢免也鄭公孫舍之帥師侵宋左傳鄭人患晉楚之故諸大夫曰不從晉國幾亡楚弱于晉晉不吾疾也疾急也晉疾楚將辟之何為而使晉師致死于我楚弗敢敵而後可固與也子展曰與宋為惡諸侯必至吾從之盟楚師至吾又從之則晉怒甚矣晉能驟來楚將不能吾乃固與晉大夫說之使疆埸之司惡于宋宋向戌侵鄭大獲子展曰師而伐宋可矣若我伐宋諸侯之伐我必疾吾乃聼命焉且告于楚楚師至吾又與之盟而重賂晉師乃免矣夏鄭子展侵宋欲以致諸侯鄭人見楚弱于晉故侵宋以激晉怒使致死于鄭楚弗敢敵然後固與晉而不知為國之夲在修德政以自彊敦信義以睦鄰徒幸敵之少懦以苟安計亦左矣公㑹晉侯宋公衛侯曹伯齊世子光莒子邾子滕子薛伯把伯小邾子伐鄭此三駕之二左傳四月諸侯伐鄭己亥齊大子光宋向戌先至于鄭門于東門釋齊大子光所以序莒上也向戌不書宋公在㑹故其莫晉荀罃至于西郊東侵舊許舊許杜注許之舊國鄭新邑案成十五年許遷于葉則許之舊國為鄭所有故謂之舊許衛孫林父侵其北鄙六月諸侯㑹于北林師于向向杜注地在潁川長社縣東北今河南尉氏縣西南有向城右還次于瑣北行而西為右還瑣杜注滎陽宛陵縣西有瑣侯亭在今河南新鄭縣北圍鄭觀兵于南門西濟于濟隧濟隧杜注水名水經注濟水伏流自河而出隂溝上源濟隧絶焉世謂之十字溝是時諸侯之戌常在虎牢故國君一集即可聲罪致討而兵力不勞此鄭所以不能支也秋七月己未同盟于亳城北亳公羊榖梁作京亳城杜注鄭地當在今河南偃師縣左傳鄭人懼乃行成秋七月同盟于亳范宣子曰不慎必失諸侯慎敬威儀謹辭令諸侯道敝而無成能無二乎乃盟載書曰凡我同盟毋薀年蕰積年穀而不分災毋壅利毋保姦毋留慝救災患恤禍亂同好惡奬王室或間兹命司慎司盟二司天神名山名川羣神羣祀先王先公先王諸侯之大祖先公始封君七姓十二國之祖七姓晉魯衛鄭曹滕姬姓邾小邾曹姓宋子姓齊姜姓莒己姓把姒姓薛任姓實十三國言十二誤也明神殛之俾失其民隊命亡氏踣其國家踣斃也公至自伐鄭穀梁傳不以後致謂盟在伐後盟後復伐鄭也以前事致者見雖同盟而未得鄭也柯陵之盟亦未能得鄭而書至異穀梁以此為盟後更伐柯陵獨非盟後復伐乎蓋厲公三伐終不能服鄭故以常例書之此則三駕之後蕭魚始以會致故前二役致伐以見兵事之未可息而終致會以見諸國之所由息肩也楚子鄭伯伐宋左傳楚子囊乞旅于秦秦右大夫詹帥師從楚子將以伐鄭鄭伯逆之丙子伐宋秦師不書不與伐宋而還蓋用公孫舍之致晉之謀也據事以書而鄭之反復具見矣公㑹晉侯宋公衛侯曹伯齊世子光莒子邾子滕子薛伯把伯小邾子伐鄭㑹于蕭魚此三駕之三蕭魚杜注鄭地路史少昊後嬴姓國修魚即蕭魚也左傳九月諸侯悉師以復伐鄭鄭人使良霄大宰石􅎢如楚告將服于晉曰孤以社稷之故不能懷君君若能以玉帛綏晉不然則武震以攝威之孤之願也楚人執之書曰行人言使人也既成而後告故書在蕭魚下石􅎢為介故不書諸侯之師觀兵于鄭東門鄭人使王子伯駢行成甲戌晉趙武入盟鄭伯冬十月丁亥鄭子展出盟晉侯十二月戊寅㑹于蕭魚經書秋史失之庚辰赦鄭囚皆禮而歸之納斥候禁侵掠晉侯使叔肸告于諸侯叔肸叔向也告諸侯亦使赦鄭囚公使臧孫紇對曰凡我同盟小國有罪大國致討苟有以藉手鮮不赦宥寡君聞命矣鄭人賂晉侯以師悝師觸師蠲悝觸蠲皆樂師名廣車軘車淳十五乘甲兵備廣車軘車皆兵車名淳耦也廣軘車相耦凡十五乘凡兵車百乘他兵車及廣軘共百乘歌鐘二肆肆列也縣鐘十六為一肆二肆三十二枚及其鎛磬鎛磬皆樂器女樂二八十六人晉侯以樂之半賜魏絳曰子教寡人和諸戎狄以正諸華八年之中九合諸侯九合諸侯謂五年㑹戚又會城棣救陳七年會鄬八年㑹邢丘九年盟于戲十年會柤又伐鄭戌虎牢十一年同盟亳城北又㑹蕭魚如樂之和無所不諧請與子樂之辭曰夫和戎狄國之福也八年之中九合諸侯諸侯無慝君之靈也二三子之勞也臣何力之有焉抑臣願君安其樂而思其終也詩曰樂只君子殿天子之邦詩小雅殿鎮也樂只君子福祿攸同便蕃左右亦是帥從便蕃數也言逺人相帥來服從便蕃然在左右夫樂以安德和其心義以處之禮以行之信以守之仁以厲之厲風俗而後可以殿邦國同福祿來逺人所謂樂也書曰居安思危逸書思則有備有備無患敢以此規公曰子之教敢不承命抑微子寡人無以待戎不能濟河渡河南服鄭夫賞國之典也藏在盟府司盟之府有賞功之制不可廢也子其受之魏絳于是乎始有金石之樂禮也禮大夫有功則賜樂公羊傳此伐鄭也其言㑹于蕭魚何蓋鄭與會爾地㑹而後伐未集事之辭也伐而後地會集事之辭也伐鄭㑹於蕭魚書法與盟於召陵同皆經之特筆所以序霸績也蓋自悼公能用魏絳息民之䇿聽知罃不與楚戰以逸待勞楚不能應遂全師以服鄭而悼公信鄭不疑不復以諸侯同盟鄭自此不叛晉者二十四年則謀能制勝誠足感人之效也不書鄭會以下書楚人執鄭行人良霄則得鄭可知矣公至自㑹穀梁傳伐而後㑹不以伐鄭致得鄭伯之辭也鄭與㑹而服諸侯喜之故以㑹致厲公三伐終以伐致悼公三伐終以㑹致揆以當日情事皆魯史據告廟之辭以書於䇿非聖人變易其辭以為褒貶也楚人執鄭行人良霄霄穀梁作宵穀梁傳行人者挈國之辭也挈猶傳也行人傳國之辭命者執而不稱行人以己執也稱行人而執以其事執也書楚執鄭行人良霄見楚之力盡於是矣冬秦人伐晉左傳秦庶長鮑庶長武帥師伐晉以救鄭庶長秦爵鮑先入晉地士魴御之少秦師而弗設備壬午武濟自輔氏從輔氏渡河與鮑交伐晉師己丑秦晉戰于櫟櫟杜注晉地晉師敗績易秦故也秦與楚婚於是為楚伐晉報十年之伐敗晉於櫟不書晉不告也十有二年春王三月莒人伐我東鄙圍台季孫宿帥師救台遂入鄆台穀梁作邰杜注琅琊費縣南有台亭今費縣屬山東兖州府鄆公羊作運杜注莒邑左傳十二年春莒人伐我東鄙圍台季武子救台遂入鄆取其鐘以為公盤公羊傳邑不言圍此其言圍何伐而言圍者取邑之辭也伐而不言圍者非取邑之辭也外取魯邑不直言取諱恥也大夫無遂事此其言遂何公不得為政爾穀梁傳伐國不言圍邑舉重也伐國重圍邑輕取邑不書圍安足書也不足書而今書蓋為下事起遂繼事也受命而救邰不受命而入鄆惡季孫宿也文十二年嘗帥師城鄆矣魯不能守復為莒所取今季孫宿因救台而遂入之大夫無遂事遂者專行不忌之辭惡宿之擅權而公不得為政也夏晉侯使士魴來聘左傳夏晉士魴來聘且拜師謝前年伐鄭師晉悼服鄭制楚而修禮於諸侯善持勝也秋九月吳子乘卒吳始書卒左傳秋吳子夀夢卒臨于周廟禮也周廟文王廟也周公出文王故魯立其廟凡諸侯之喪異姓臨于外于城外向其國同姓于宗廟所出王之廟同宗于祖廟始封君之廟同族于禰廟父廟也同族謂髙祖以下是故魯為諸姬臨于周廟諸同姓國為邢凡蔣茅胙祭臨于周公之廟即祖廟也六國皆周公之支子别封為國共祖周公吳子書卒以其暴盛赴告相及而諸侯重之也不書葬非不會也削之以避其僭號與楚同例冬楚公子貞帥師侵宋左傳冬楚子囊秦庶長無地伐宋師于楊梁以報晉之取鄭也楊梁杜注梁國睢陽縣東有地名楊梁水經注渙水東徑陽亭北即楊梁也在今河南歸德府城東南據𫝊楚人率秦伐宋不書秦以師屬楚也自是不復有事於北方以楚審旋卒而又與吳構怨耳附録左傳靈王求后于齊齊侯問對于晏桓子桓子對曰先王之禮辭有之天子求后于諸侯諸侯對曰夫婦所生若而人不敢譽亦不敢毁故曰若而人妾婦之子若而人言非適也無女而有姊妹及姑姊妹則曰先守某公之遺女若而人齊侯許昏王使隂里結之隂里周大夫結成也為十五年劉夏逆王后傳公如晉左傳公如晉朝且拜士魴之辱禮也晉侯一使人來聘公即親往拜之事晉之禮過於恭矣附録左傳秦嬴歸于楚秦景公妹為楚共王夫人楚司馬子庚聘于秦子庚莊王子午為夫人寧禮也十有三年春公至自晉左傳十三年春公至自晉孟獻子書勞于廟書勳勞于䇿禮也桓二年傳公至自唐告于廟也凡公行告于宗廟反行飲至舍爵䇿勳焉禮也桓十六年傳公至自伐鄭以飲至之禮此年傳書勞于廟故先儒通其意謂告廟飲至書勞凡三事偏行一禮則必書至悉闕則史無其文按曽子問諸侯出而反必親告於祖禰則雖無事反必告廟禮也而春秋公行多不書至蓋㑹盟侵伐其事繁猥必有勳勞可書或自喜其事而行飲至之禮乃告於廟其餘則怠於禮或醜其事而不告則史無其文其事無可醜而不告者怠於禮也齊桓之㑹不致是也事可醜而告者自危也成公十年如晉見止送葬而書至之類是也夏取邿邿公羊作詩杜注任城亢父縣有邿亭在今山東濟寧州東南左傳夏邿亂分為三師救邿遂取之師魯師也凡書取言易也用師不勞雖國亦曰取用大師焉曰滅用力難重雖邑亦曰滅弗地曰入謂不有其地公羊傳詩者何邾婁之邑也曷為不繫乎邾婁諱亟也諱背蕭魚之㑹亟凡書取者或乘其衰亂或受其潰叛或用少師而未嘗頓兵勞力皆直書取惟魯滅小國有諱而書取者視若己地而取之也然諱之適所以張之此傳所謂微而顯者與邿微國也附録左傳荀罃士魴卒罃中軍將魴下軍佐晉侯搜于綿上以治兵使士丐將中軍辭曰伯游長伯游荀偃昔臣習于知伯是以佐之非能賢也請從伯游荀偃將中軍代荀罃士丐佐之位如故使韓起將上軍辭以趙武又使欒黶以武位卑故不聼更命黶辭曰臣不如韓起韓起願上趙武君其聽之使趙武將上軍武自新軍起四等代荀偃韓起佐之位如故欒黶將下軍魏絳佐之黶亦如故絳自新軍佐超一等代士魴新軍無帥將佐皆遷晉侯難其人使其什吏什吏謂十人長也率其卒乘官屬以從於下軍禮也晉國之民是以大和諸侯遂睦君子曰讓禮之主也范宣子讓其下皆讓欒黶為汰弗敢違也晉國以平數世賴之刑善也夫刑法也一人刑善百姓休和可不務乎書曰一人有慶兆民賴之其寧惟永其是之謂乎周書吕刑義取上有好善之慶則下賴其福而長安也周之興也其詩曰儀刑文王萬邦作孚詩大雅言文王善用法故能為萬邦所信孚信也言刑善也及其衰也其詩曰大夫不均我從事獨賢詩小雅刺幽王役使不均故從事者怨恨稱己之勞以為獨賢無讓心言不讓也世之治也君子尚能而讓其下小人農力以事其上是以上下有禮而讒慝黜逺由不爭也謂之懿德及其亂也君子稱其功以加小人加陵也君子在位者小人伐其技以馮君子馮亦凌也是以上下無禮亂虐竝生由爭善也謂之昏德國家之敝恆必由之秋九月庚辰楚子審卒左傳楚子疾告大夫曰不榖不德少主社稷生十年而喪先君未及習師保之教訓而應受多福多福謂為君是以不德而忘師于鄢成十六年戰鄢以辱社稷為大夫憂其𢎞多矣𢎞大也若以大夫之靈獲保首領以殁于地唯是春秋窀穸之事窀厚也穸夜也厚夜猶長夜謂葬埋所以從先君於禰廟者請為靈若厲欲受惡諡也亂而不損曰靈戮殺不辜曰厲大夫擇焉莫對及五命乃許秋楚共王卒子囊謀諡大夫曰君有命矣子囊曰君命以共若之何毁之赫赫楚國而君臨之撫有蠻夷奄征南海以屬諸夏而知其過可不謂共乎請諡之共大夫從之傳言子囊之善附録左傳吳侵楚養由基奔命子庚以師繼之子庚楚司馬養叔曰即養由基吳乘我喪謂我不能師也必易我而不戒子為三覆以待我我請誘之子庚從之戰于庸浦庸浦杜注楚地當在今江南無為州南大敗吳師獲公子黨君子以吳為不弔詩曰不弔昊天亂靡有定詩小雅言不為昊天所恤則致罪也為明年㑹向傳冬城防左傳冬城防書事時也于是將早城臧武仲請俟畢農事禮也魯有二防一近宋隱十年伐宋取防是也一近齊隱九年公㑹齊侯于防是也此所城乃近齊之防魯既事晉而外齊故城防以備之而明年齊卒有圍成之役則懼齊明矣附録左傳鄭良霄大宰石􅎢猶在楚十一年楚人執之至今石􅎢言于子囊曰先王卜征五年先五年而卜其吉凶也征謂巡守征行而歲習其祥祥習則行五年習卜皆同吉乃巡狩不習則增修德而改卜不習謂卜不吉今楚實不競行人何罪止鄭一卿以除其逼一卿謂良霄使睦而疾楚以固于晉焉用之使歸而廢其使言往者鄭使良霄至楚其意欲楚執之得有辭以堅事晉今釋使歸則鄭無辭于楚是廢其夲使之意怨其君以疾其大夫而相牽引也不猶愈乎楚人歸之日講春秋解義卷三十九
