body:
  text: 欽定四庫全書日講春秋解義卷四十七昭公公名稠襄公子母齊歸在位二十五年孫於齊在外八年凡三十二年薨於乾侯諡法威儀恭明曰昭周景王四年魯昭公二十二年景王崩王猛立是年卒王室亂弟敬王立昭二十三年尹氏立王子朝昭二十六年敬王入於成周子朝奔楚鄭簡公二十五年魯昭公十二年簡公卒子定公寧立昭二十八年定公卒獻公蠆立齊景公七年宋平公三十五年魯昭公十年平公卒子元公佐立昭二十五年元公卒子景公頭曼立晉平公十七年趙武為政魯昭公元年冬趙武卒韓起為政魯昭公十年平公卒子昭公夷立魯昭公十六年晉昭公卒子頃公去疾立昭二十八年魏舒為政昭三十年頃公卒子定公午立衛襄公三年魯昭公七年襄公卒子靈公元立蔡靈公二年魯昭公十一年楚殺蔡靈公滅蔡昭十三年楚平王封蔡蔡侯廬立是為平公昭二十年平公卒太子朱立昭二十一年朱奔楚平公弟悼公東國立昭二十三年悼公卒弟昭公申立曹武公十四年魯昭公十四年武公卒子平公須立昭十八年平公卒子悼公午立昭二十七年悼公卒弟聲公野立昭三十二年平公弟通弒聲公代立是為隱公滕成公三十五年魯昭公三年成公卒悼公寧立昭二十八年悼公卒頃公結立陳哀公二十八年魯昭公八年哀公卒楚滅陳昭十三年楚平王封陳陳侯吳立是為惠公把文公九年魯昭公六年文公卒子平公郁釐立昭二十四年平公卒子悼公成立薛魯昭公三十一年薛獻公榖卒入春秋薛始書名子襄公定立莒展輿元年魯昭公元年齊納莒公子去疾是為著丘公展輿奔吳昭十四年著丘公卒子郊公立是年奔齊著丘之弟庚輿立是為共公昭二十三年庚輿來奔齊納郊公邾悼公十五年魯昭公元年悼公卒莊公穿立許悼公六年魯昭公九年遷於夷昭十八年遷於白羽昭十九年悼公弒斯立小邾穆公十三年魯昭公十七年小邾穆公來朝楚郟敖四年魯昭公元年楚圍弒而自立改名虔是為靈王楚薳罷為令尹昭十三年靈王弒平王居立即棄疾子旗為令尹昭十四年殺成然子暇為令尹昭二十三年子常為令尹昭二十六年平王卒昭王軫立秦景公三十六年魯昭公五年景公卒子哀公立吳夷末二年魯昭公十五年夷末卒子僚立昭二十七年僚弒闔廬立一名光諸樊子越魯昭公五年越會楚伐吳始見經即書人欽定四庫全書日講春秋解義卷四十七昭公名稠襄公之子母齊歸以景王四年即位在位二十五年孫於齊在外八年諡法威儀恭明曰昭元年春王正月公即位穀梁傳繼正即位正也子野卒於季氏季氏既以毁告則自當行即位之禮如常矣襄公夙有憾於季氏自楚而返幾不敢入其後昭公又為季氏所逐凡傳所載昭公臨喪不戚及穆叔議其不當立皆季氏之黨之誣辭耳叔孫豹會晉趙武楚公子圍齊國弱宋向戌衛齊惡陳公子招蔡公孫歸生鄭罕虎許人曹人于虢國弱公羊作國酌齊惡公羊作石惡罕虎公羊作軒虎虢公羊作漷榖梁作郭杜注鄭地左傳元年春楚公子圍聘於鄭且娶於公孫段氏伍舉為介將入館鄭人惡之知楚懷詐使行人子羽與之言乃館於外舍城外既聘將以衆逆子産患之使子羽辭曰以敝邑褊小不足以容從者請墠聽命欲於城外除地為墠行昏禮令尹命太宰伯州犂對曰君辱貺寡大夫圍謂圍將使豐氏撫有而室豐氏公孫段圍布几筵告於莊共之廟而來莊王共王圍之祖父若野賜之是委君貺於草莾也是寡大夫不得列於諸卿也言不得從卿禮不寧唯是又使圍蒙其先君蒙欺也將不得為寡君老大臣稱老懼辱命而黜退其蔑以復矣唯大夫圖之子羽曰小國無罪恃實其罪恃大國而無備則是罪將恃大國之安靖已而無乃包藏禍心以圖之小國失恃而懲諸侯使莫不憾者距違君命而有所壅塞不行是懼不然敝邑館人之屬也館人守舍人也其敢愛豐氏之祧伍舉知其有備也請垂櫜而入垂櫜示無弓許之正月乙未入逆而出遂會於虢尋宋之盟也宋盟在襄二十七年祁午謂趙文子曰宋之盟楚人得志於晉今令尹之不信諸侯之所聞也子弗戒懼又如宋子木之信稱於諸侯猶詐晉而駕焉詐謂衷甲况不信之尤者乎楚重得志於晉晉之恥也子相晉國以為盟主於今七年矣襄二十五年為政以春言故云七年再合諸侯襄二十五年會夷儀二十六年會澶淵三合大夫襄二十七年會宋三十年會澶淵及今會虢也服齊狄寧東夏襄二十八年齊侯白狄朝晉平秦亂襄二十六年秦晉為成城淳于襄二十九年城杞之淳于杞遷都師徒不頓國家不罷民無謗讟諸侯無怨天無大災子之力也有令名矣而終之以恥午也是懼吾子其不可以不戒文子曰武受賜矣然宋之盟子木有禍人之心武有仁人之心是楚所以駕於晉也今武猶是心也楚又行僭僭不信非所害也武將信以為本循而行之譬如農夫是穮是蓘穮耘也壅苖為蓘雖有飢饉必有豐年言耕鉏不以水旱息必獲豐年之收且吾聞之能信不為人下吾未能也詩曰不僭不賊鮮不為則信也詩大雅賊害人也能為人則者不為人下矣吾不能是難楚不為患楚令尹圍請用牲讀舊書加於牲上而已舊書宋之盟書楚恐晉先歃故欲從舊書加於牲上不歃血經所以不書盟晉人許之三月甲辰盟楚公子圍設服離衛設君服二人執戈陳於前以自衛離陳也叔孫穆子曰楚公子美矣君哉鄭子皮曰二執戈者前矣禮君行有二執戈在前蔡子家曰蒲宫有前不亦可乎公子圍在會特緝蒲為王殿屋蔽屏以自殊異言既造王宫而居之雖服君服無所怪也楚伯州犂曰此行也辭而假之寡君聞諸大夫譏之故言假以飾令尹過鄭行人揮曰假不反矣伯州犂曰子姑憂子晳之欲背誕也襄三十年鄭子晳殺伯有背命放誕將為國難言子且自憂此無為憂令尹子羽曰當璧猶在子羽行人揮當璧謂棄疾事在昭十三年假而不反子其無憂乎齊國子曰吾代二子愍矣國子國弱也二子謂王子圍及伯州犂陳公子招曰不憂何成二子樂矣衛齊子曰苟或知之雖憂何害齊子齊惡言先知為備雖有憂難無所損害宋合左師曰大國令小國共吾知共而己晉樂王鮒曰小旻之卒章善矣吾從之小旻詩小雅其卒章義取非唯暴虎馮河之可畏也不敬小人亦危殆王鮒從斯義故不敢譏公子圍退會子羽謂子皮曰叔孫絞而婉絞切也譏其似君反謂之美故曰婉宋左師簡而禮無所臧否故曰簡共事大國故曰禮樂王鮒字而敬字愛也不犯凶人所以自愛敬子與子家持之子子皮子家蔡公孫歸生持之言無所取與皆保世之主也齊衛陳大夫其不免乎國子代人憂子招樂憂齊子雖憂弗害夫弗及而憂與可憂而樂與憂而弗害皆取憂之道也憂必及之大誓曰民之所欲天必從之大誓周書三大夫兆憂憂能無至乎言以知物其是之謂矣物類也察言以知禍福之類公羊傳此陳侯之弟招也何以不稱弟據八年稱弟貶曷為貶為殺世子偃師貶曰陳侯之弟招殺陳世子偃師大夫相殺稱人此其稱名氏以殺何後八年事言將自是弒君也明其欲弒君故令與弒君而立者同文孔瑗弒君本謀在招今將爾詞曷為與親弒者同君親無將將而必誅焉然則曷為不於其弒焉貶據未弒也以親者弒然後其罪惡甚春秋不待貶絶而罪惡見者不貶絶以見罪惡也貶絶然後罪惡見者貶絶以見罪惡也今招之罪已重矣曷為復貶乎此據棄疾不豫貶著招之有罪也何著乎招之有罪據棄疾不著言楚之託乎討招以滅陳也八年楚滅陳討招之意不明故豫貶於此明楚先以正罪討招乃滅陳也自向戌為弭兵之説而趙武從之至是楚人再先於晉而齊亦從盟矣晉既再屈楚圍篡立遂合諸侯伐吳誅齊慶封執徐子滅陳滅蔡兵禍之烈諸侯之屈辱危亡前此所未有也向戌之以誣道蔽諸侯趙武以偷安禍列國罪不容於誅矣三月取鄆左傳季武子伐莒取鄆莒人告於會楚告於晉曰尋盟未退尋弭兵之盟而魯伐莒瀆齊盟請戮其使時叔孫豹在會欲戮之樂桓子相趙文子桓子即王鮒欲求貨於叔孫而為之請使請帶焉難指求貨故以帶為辭弗與梁其脛日脛叔孫家臣貨以藩身子何愛焉叔孫曰諸侯之會衛社稷也我以貨免魯必受師言不戮其使必伐其國是禍之也何衛之為人之有牆以蔽惡也喻己為國衛如牆為人蔽牆之隙壞誰之咎也咎在牆衛而惡之吾又甚焉罪甚牆雖怨季孫魯國何罪叔出季處有自來矣季孫守國叔孫出使所從來久吾又誰怨然鮒也賄弗與不已召使者裂裳帛而與之曰帶其褊矣言帶褊盡故裂裳示不相逆趙孟聞之曰臨患不忘國忠也思難不越官信也謂言叔出季處圖國忘死貞也謀主三者義也三者忠信貞有是四者又可戮乎乃請諸楚曰魯雖有罪其執事不辟難執事謂叔孫畏威而敬命矣子若免之以勸左右可也若子之羣吏處不辟汚汚勞事出不逃難其何患之有患之所生汚而不治難而不守所由來也能是二者又何患焉不靖其能其誰從之安靖賢能則衆附從魯叔孫豹可謂能矣請免之以靖能者子會而赦有罪又賞其賢諸侯其誰不欣焉望楚而歸之視逺如邇疆埸之邑一彼一此何常之有王伯之令也引其封疆而樹之官引正也舉之表旗而著之制令旌旗以表貴賤為諸侯作制度法令使不得相侵犯過則有刑猶不可一於是乎虞有三苖三苖叨餮放三危者夏有觀扈觀杜注觀國頓丘衛縣今山東觀城縣西有古觀國城扈杜注在始平鄠縣今陜西鄠縣北有古城書序曰啓與有扈戰於甘之野商有姺邳姺邳柱注二國商諸侯邳今下邳縣竹書紀年商外壬元年姺人邳人叛即此周有徐奄徐奄杜注二國皆嬴姓書序曰成王伐淮夷遂踐奄徐即淮夷今山東曲阜縣舊城即古奄地自無令王諸侯逐進逐猶競也狎主齊盟其又可一乎恤大舍小足以為盟主又焉用之焉用治小事封疆之削何國蔑有主齊盟者誰能辨焉辨治也吳濮有釁楚之執事豈其顧盟吳在東濮在南杜注建寧郡南有濮夷在今雲南界莒之疆事楚勿與知諸侯無煩不亦可乎莒魯爭鄆為日久矣苟無大害於其社稷可無亢也亢禦去煩宥善莫不競勸子其圖之固請諸楚楚人許之乃免叔孫令尹享趙孟賦大明之首章大明詩大雅言文王明明照於下故能赫赫盛於上令尹意在首章故特稱以自光大趙孟賦小宛之二章小宛詩小雅取其各敬爾儀天命不又言天命一去不可復還以戒令尹事畢趙孟謂叔向曰令尹自以為王矣何如對曰王弱令尹強其可哉言可成雖可不終趙孟曰何故對曰強以克弱而安之強不義也安於勝君是強而不義不義而強其斃必速詩曰赫赫宗周褒姒滅之強不義也詩小雅襄姒幽王后王惑焉而行不義遂至滅亡言雖赫赫盛強不義足以滅之令尹為王必求諸侯晉少懦矣諸侯將往若獲諸侯其虐滋甚民弗堪也將何以終夫以強取不義而克必以為道道以淫虐弗可久己矣為十二年楚弒靈王傳公羊傳鄆者何內之邑也其言取之何不聽也季孫宿救台遂入鄆欲取而未得故承莒亂伐而取之其事與歸父伐邾取繹同而書法異何也使書伐莒取鄆則疑於始討賊而終得賂但書取鄆則攻奪而已矣附録左傳夏四月趙孟叔孫豹曹大夫入于鄭會罷過鄭鄭伯兼享之子皮戒趙孟戒享期禮終趙孟賦瓠葉受所戒禮畢而賦詩瓠葉詩小雅義取古人不以微薄廢禮雖瓠葉首猶與賔客享之子皮遂戒穆叔且告之告以趙孟賦瓠葉穆叔曰趙孟欲一獻瓠葉詩義取薄物而以獻酬知欲一獻子其從之子皮曰敢乎穆叔曰夫人之所欲也又何不敢及享具五獻之籩豆於幕下朝聘之制大國之卿五獻趙孟辭私于子産曰武請于冢宰矣冢宰子皮請謂賦瓠葉乃用一獻趙孟為客禮終乃宴穆叔賦鵲巢鵲巢詩召南喻晉君有國趙孟治之趙孟曰吾不堪也又賦采蘩亦詩召南義取蘩菜薄物可以薦公侯享其信不求其厚曰小國為蘩大國省穡而用之其何實非命穡愛也子皮賦野有死麕之卒章亦詩召南卒章喻趙孟以義撫諸侯無以非禮相加陵趙孟賦常棣常棣詩小雅取其凡今之人莫如兄弟言欲親兄弟之國且曰吾兄弟比以安尨也可使無吠受子皮之詩穆叔子皮及曹大夫興拜舉兕爵曰小國賴子知免於戾矣兕爵罰不敬言小國蒙趙孟德比以安自知免此罰戮飲酒樂趙孟出曰吾不復此矣天王使劉定公勞趙孟於潁館於雒汭王景王定公劉夏雒汭杜注在河南鞏縣南水曲流為汭劉子曰美哉禹功見河雒而思禹功明德逺矣微禹吾其魚乎吾與子辨冕端委以治民臨諸侯端委禮衣禹之力也子盍亦逺績禹功而大庇民乎對曰老夫罪戾是懼焉能恤逺吾儕偷食朝不謀夕何其長也劉子歸以語王曰諺所謂老將知而耄及之者耄亂也其趙孟之謂乎為晉正卿以主諸侯而儕於隸人朝不謀夕棄神人矣神怒民叛何以能久趙孟不復年矣言將死不復見明年神怒不歆其祀民叛不即其事祀事不從又何以年為此冬趙孟卒張本叔孫歸曾夭御季孫以勞之旦及日中不出恨季孫伐莒使己幾被戮曾夭謂曾阜曰阜叔孫家臣旦及日中吾知罪矣魯以相忍為國也忍其外不忍其內焉用之欲受楚戮是忍其外日中不出是不忍其內阜曰數月於外言叔孫勞役在外數月一旦於是庸何傷賈而欲贏而惡囂乎言譬如商賈求贏利者不得惡喧囂之聲阜謂叔孫曰可以出矣叔孫指楹曰雖惡是其可去乎楹柱也以喻魯有季孫猶屋有柱乃出見之鄭徐吾犯之妹美犯鄭夫夫公孫楚聘之矣楚子南穆公孫公孫黑又使強委禽焉禽鴈也納采用鴈犯懼告子産子産曰是國無政非子之患也唯所欲與犯請於二子請使女擇焉皆許之子晳盛飾入布幣而出子晳公孫黑布陳贄幣子南戎服入左右射超乘而出女自房觀之曰子晳信美矣抑子南夫也言丈夫夫夫婦婦所謂順也適子南氏子晳怒既而櫜甲以見子南欲殺之而取其妻子南知之執戈逐之及衝衝交道擊之以戈子晳傷而歸告大夫曰我好見之不知其有異志也故傷大夫皆謀之子産曰直鈞幼賤有罪罪在楚也先聘子南直也子南用戈子晳直也子産力未能討故鈞其事歸罪於楚乃執子南而數之曰國之大節有五女皆姦之畏君之威聽其政尊其貴事其長飬其親五者所以為國也今君在國汝用兵焉不畏威也姦國之紀不聽政也姦國之紀謂傷人子晳上大夫女嬖大夫而弗下之不尊貴也幼而不忌不事長也忌畏也兵其從兄子晳子南之從兄不養親也君曰余不女忍殺宥女以遠勉速行乎無重而罪五月庚辰鄭放遊楚於吳遊楚即子南將行子南子産咨於大叔大叔遊楚之兄子大叔曰吉不能亢身焉能亢宗亢蔽也彼國政也非私難也子圗鄭國利則行之又何疑焉周公殺管叔而蔡蔡叔蔡放也夫豈不愛王室故也吉若獲戾子將行之何有於諸遊為二年鄭殺公孫黑傳夏秦伯之弟針出奔晉左傳秦后子有寵於桓如二君于景后子秦桓公子景公母弟針也其權寵如二君其母曰弗去懼選選數也恐景公數其罪而加戮癸卯針適晉其車千乘書曰秦伯之弟針出奔晉罪秦伯也罪失教后子享晉侯造舟於河造舟為梁通秦晉之道十里舍車一舍八乘為八反之備自雍及絳雍絳相去千里歸取酬幣備九獻之儀始禮自齊其一故續送其八酬酒幣終事八反每十里以八乘車各以次載幣相授而還不徑至故言八反千里用車八百乘其二百乘以自隨傳言秦針之奢富司馬侯問焉曰子之車盡於此而己乎對曰此之謂多矣若能少此吾何以得見言己坐車多故出奔女叔齊以告公且曰秦公子必歸臣聞君子能知其過必有令圖令圗天所贊也后子見趙孟趙孟曰吾子其曷歸問何時當歸對曰針懼選於寡君是以在此將待嗣君趙孟曰秦君何如對曰無道趙孟曰亡乎對曰何為一世無道國未艾也艾絶也國於天地有與立焉言欲輔助之者多不數世淫弗能斃也趙孟曰天乎對曰有焉趙孟曰其幾何對曰針聞之國無道而年榖和熟天贊之也鮮不五稔趙孟視蔭曰朝夕不相及誰能待五蔭日景趙孟意衰以日景自喻故言如此后子出而告人曰趙孟將死矣主民玩歲而愒日玩愒皆貪也其與幾何公羊傳秦無大夫此何以書仕諸晉也曷為仕諸晉有千乘之國而不能容其母弟故君子謂之出奔也榖梁傳諸侯之尊弟兄不得以屬通其弟云者親之也親而奔之惡也針者秦桓公之子景公母弟也桓公愛其少子寵賚優厚針遂富擬於君所以出奔也國家強幹弱枝衣服禮秩皆有差等非徒為國逺慮亦以善全其所愛耳針以公子至有車千乘則其人亦非能守禮秉義者然既奔之後能自知其過必有令圖是以終得返國與附録左傳鄭為遊楚亂故六月丁巳鄭伯及其大夫盟于公孫段氏罕虎公孫僑公孫段印段遊吉駟帶私盟于閨門之外實薰隧閨門鄭城門薰隧門外道名實之者為明年子産數子晳罪稱薰隧盟起本公孫黑強與于盟使大史書其名且曰七子自欲同于六卿故曰七子子産弗討子晳強討之恐亂國六月丁巳邾子華卒晉荀吳帥師敗狄于大鹵大鹵公羊穀梁作大原杜注大原晉陽縣左傳晉中行穆子敗無終及羣狄于大原即大鹵也無終山戎崇卒也將戰魏舒曰彼徒我車所遇又厄地險不便車以什共車必克更增十人以當一車之用困諸厄又克請皆卒去車為步卒自我始乃毁車以為行五乘為三伍乘車者車三人五乘十五人今改去車更以五人為伍分為三伍荀吳之嬖人不肯即卒斬以徇為五陳以相離兩于前伍于後専為右角參為左角偏為前拒皆臨時處置之名以誘之翟人笑之未陳而薄之大敗之公羊傳此大鹵也曷為謂之大原地物從中國邑人名從主人原者何上平曰原下平曰隰穀梁傳傳曰中國曰大原夷狄曰大鹵號從中國名從主人悼公復霸魏絳請和戎曰勞師于戎而楚伐陳必不能救晉既委諸侯于楚而又有事於狄此楚圍所以得假討賊之名以並吞陳蔡與秋莒去疾自齊入于莒左傳莒展輿立而奪羣公子秩公子召去疾于齊去疾奔齊在襄三十一年秋齊公子鉏納去疾去疾以名繫國與齊小白同明其當有國也於次去疾為長以君弒出奔而國人召之則其復無惡可知矣莒展輿出奔吳展下公羊榖梁無輿字左傳展輿奔吳展輿之立踰年矣與鄭忽曹羈異而不稱爵其罪大也為弒君者所立既立乎其位而不能討賊則不可以有國矣以名繫國以其嘗為世子與鄭突曹赤無先君之命者異也其奔吳本吳出也叔弓帥師疆鄆田左傳叔弓帥師疆鄆田因莒亂也此春取鄆今正其疆界于是莒務婁瞀胡及公子滅明以大厖與常儀靡奔齊三子展輿黨大厖常儀靡杜注莒二邑當在今莒州北竟君子曰莒展之不立棄人也夫奪羣公子秩是棄人人可棄乎詩曰無競維人善矣詩周頌言惟得人則國家強公羊傳疆鄆田者何與莒為竟也與莒為竟則曷為帥師而往畏莒也穀梁傳疆之為言猶竟也取鄆不書帥師者乘莒亂出其不意而取之為易今欲固其所得則莒人來爭必矣故動大衆使卿將以疆之脅莒以必從也葬邾悼公邾滕薛小國也秦逺國也皆至昭公而書葬魯衰甚矣待小國如大國逺國如近國附録左傳晉侯有疾鄭伯使公孫僑如晉聘且問疾叔向問焉曰寡君之疾病卜人曰實沈臺駘為祟史莫之知敢問此何神也子産曰昔高辛氏有二子髙辛帝嚳伯曰閼伯季曰實沈居于曠林不相能也曠林杜注地闕日尋干戈以相征討后帝不臧后帝堯也遷閼伯于商丘主辰商丘杜注宋地即今河南商丘縣辰大火也商人是因故辰為商星商人湯先相土封商丘因閼伯故國祀辰星遷實沈于大夏主參大夏杜注晉陽縣即大原也參水星唐人是因以服事夏商唐人若劉纍之等其季世曰唐叔虞當武王邑薑方震大叔邑薑武王后懷胎為震大叔即叔虞夢帝謂己余命而子曰虞將與之唐屬諸參而蕃育其子孫及生有文在其手曰虞遂以命之及成王滅唐而封大叔焉故參為晉星由是觀之則實沈參神也昔金天氏有裔子曰昧為玄冥師生允格臺駘金天氏帝少暤玄冥水官昧為水官之長臺駘能業其官宣汾洮汾洮杜注二水名後漢志聞喜有洮水今聞喜縣屬山西障大澤以處大原帝用嘉之帝顓頊封諸汾川沈姒蓐黃實守其祀四國臺駘之後今晉主汾而滅之矣由是觀之則臺駘汾神也抑此二者不及君身山川之神則水旱癘疫之災於是乎禜之周禮四曰禜祭為營儹用幣以祈福祥日月星辰之神則雪霜風雨之不時于是乎禜之若君身則亦出入飲食哀樂之事也山川星辰之神又何為焉僑聞之君子有四時朝以聽政晝以訪問夕以修令夜以安身于是乎節宣其氣勿使有所壅閉湫底以露其體湫集也底滯也露羸也節宣失時則血氣集滯而體羸露兹心不爽而昏亂百度爽明也今無乃一之同四時也則生疾矣僑又聞之內官不及同姓內官嬪御其生不殖殖長也美先盡矣則相生疾同姓之相與先美矣美極則盡盡則生疾君子是以惡之故志曰買妾不知其姓則卜之違此二者古之所慎也一四時取同姓二者古人所慎男女辨姓禮之大司也今君內實有四姬焉同姓姬四人其無乃是也乎若由是二者弗可為也已為治也四姬有省猶可無則必生疾矣據異姓去同姓故言省叔向曰善哉肸未之聞也此皆然矣叔向出行人揮送之叔向問鄭故焉且問子晳對曰其與幾何無禮而好陵人怙富而卑其上弗能久矣晉侯聞子産之言曰博物君子也重賄之晉侯求醫于秦秦伯使醫和視之曰疾不可為也是謂近女室疾如蠱蠱惑疾非鬼非食惑以喪志惑女色而失志良臣將死天命不祐公曰女不可近乎對曰節之先王之樂所以節百事也故有五節五聲之節遲速本末以相及中聲以降五降之後不容彈矣此謂先王之樂得中聲聲成五降而息也降罷退於是有煩手淫聲慆堙心耳乃忘平和君子弗聽也五降不息則雜聲並奏慆慢也書無即慆淫物亦如之至于煩乃舍也己無以生疾君子之近琴瑟以儀節也非以慆心也為心之儀節使動不過度天有六氣謂陰陽風雨晦明也降生五味謂金味辛木味酸水味鹹火味苦土味甘皆由陰陽風雨而生發為五色辛色白酸色青鹹色黑苦色赤甘色黃發見也徵為五聲白聲商青聲角黑聲羽赤聲徴黃聲宫徴驗也淫生六疾淫過也六氣曰陰陽風雨晦明也分為四時序為五節過則為災隂淫寒疾寒過則為冷陽淫熱疾熱過則喘渴風淫末疾末四肢也風為緩急雨淫腹疾雨濕之氣為泄注晦淫惑疾晦夜也為宴寢過節則心惑亂明淫心疾明晝也思慮煩多心勞生疾女陽物而晦時淫則生內熱惑蠱之疾女常隨男故言陽物家道常在夜故言晦時今君不節不時能無及此乎出告趙孟趙孟曰誰當良臣對曰主是謂矣主相晉國于今八年晉國無亂諸侯無闕可謂良矣和聞之國之大臣榮其寵祿任其大節有災禍興而無改焉改改行以救災必受其咎今君至于淫以生疾將不能圖恤社稷禍孰大焉主不能禦吾是以云也趙孟曰何謂蠱對曰淫溺惑亂之所生也于文皿蟲為蠱文字也皿器也器受蟲害者為蠱穀之飛亦為蠱穀久積則變為飛蟲名曰蠱在周易女惑男風落山謂之蠱巽下艮上蠱巽為長女為風艮為少男為山少男説長女非匹故惑山木得風而落皆同物也物猶類也趙孟曰良醫也厚其禮而歸之冬十有一月己酉楚子麇卒麇公羊穀梁作卷左傳楚公子圍使公子黑肱伯州犂城犨櫟郟黑肱王子圍之弟子晳也犨櫟郟杜注犨縣屬南陽郟縣屬襄城櫟河南陽翟縣三邑本鄭地今犨縣故城在河南魯山縣東南郟縣屬河南汝州鄭人懼子産曰不害令尹將行大事而先除二子也二子謂黑肱伯州犁禍不及鄭何患焉冬楚公子圍將聘于鄭伍舉為介未出竟聞王有疾而還伍舉遂聘十一月己酉公子圍至入問王疾縊而弒之遂殺其二子幕及平夏皆郟敖子右尹子干出奔晉子干王子比宮廄尹子晳出奔鄭殺大宰伯州犁于郟葬王于郟謂之郟敖使赴于鄭伍舉問應為後之辭焉問赴者對曰寡大夫圍伍舉更之曰共王之子圍為長伍舉更赴辭使從禮此告終稱嗣不以篡弒赴諸侯子干奔晉從車五乘叔向使與秦公子同食食祿同皆百人之餼趙文子曰秦公子富叔向曰底祿以德底致也德鈞以年年同以尊公子以國不聞以富且夫以千乘去其國強禦己甚詩曰不侮鰥寡不畏強禦詩大雅秦楚匹也使后子與子干齒以年齒為髙下而坐辭曰針懼選楚公子不獲是以皆來亦唯命不獲不得自安言唯主人命所處且臣與羇齒無乃不可乎后子先來仕欲自同于晉臣為主人子干後來奔以為羇旅之客史佚有言曰非羇何忌忌敬也欲謙以自别楚靈王即位靈王公子圍也即位易名熊虔薳罷為令尹薳啓強為大宰鄭遊吉如楚葬郟敖且聘立君歸謂子産曰具行器矣楚王汰侈而自説其事必合諸侯吾往無日矣子産曰不數年未能也為四年會申傳據傳及他書言麇為圍所弒者不可悉數而經書卒或曰以申之會為諸侯諱也夫亂賊不討如成宋亂宋災故之類聖人皆明著其罪何以諱為或曰麇以病卒實非弒也則諸傳記所云豈盡妄乎蓋楚無齊晉太史之直書列國之史皆承其偽赴無所據以革之與鄭伯髠頑等耳楚公子比出奔晉鄭伯髠頑以如會道卒故可變文以發人之疑而楚麇則無可因之事也然圍與比皆公子圍専兵柄麇卒而比奔圍遂得國而麇之子不立則其情亦不可掩矣附録左傳十二月晉既蒸蒸冬祭也趙孟適南陽將會孟子餘孟子餘趙衰趙武之曾祖其廟在于晉之南陽溫縣往會祭之甲辰朔蒸于溫趙氏蒸祭甲辰十二月朔庚戌卒十二月七日終劉定公秦后子之言鄭伯如晉弔及雍乃復傳言大夫強諸侯畏而弔之二年春晉侯使韓起來聘左傳二年春晉侯使韓宣子來聘公即位故宣子韓起且告為政而來見代趙武為政禮也觀書于太史氏見易象與魯春秋曰周禮盡在魯矣易象上下經之象辭魯春秋史記之䇿書春秋遵周公之典以序事故曰周禮吾乃今知周公之德與周之所以王也公享之季武子賦綿之卒章綿詩大雅卒章義取文王有四臣故能興起以晉侯比文王以韓子比四輔韓子賦角弓角弓詩小雅取其兄弟昏姻無胥逺矣季武子拜曰敢拜子之彌縫敝邑寡君有望矣謂以兄弟之義武子賦節之卒章節詩小雅卒章取式訛爾心以畜萬邦以美晉德既享宴于季氏有嘉樹焉宣子譽之武子曰宿敢不封殖此樹以無忘角弓遂賦甘棠甘棠詩召南召伯息于甘棠之下詩人思之而愛其樹武子欲封殖嘉樹如甘棠以宣子比召公宣子曰起不堪也無以及召公宣子遂如齊納幣為平公聘少薑見子雅子雅召子旗子旗子雅之子使見宣子宣子曰非保家之主也不臣志氣亢見子尾子尾見強強子尾之子宣子謂之如子旗大夫多笑之唯晏子信之曰夫子君子也夫子韓起君子有信其有以知之矣自齊聘于衛衛侯享之北宫文子賦淇澳淇澳詩衛風美武公也言宣子有武公之德宣子賦木瓜木瓜亦衛風義取欲厚報以為好前此晉之聘魯者九未聞以上卿執政承使者蓋晉益衰故視列國如匹敵猶魯益衰則視邾薛如大國耳附録左傳夏四月韓須如齊逆女須韓起子逆少薑齊陳無宇送女致少薑少薑有寵于晉侯晉侯謂之少齊為立别號所以寵異之謂陳無宇非卿執諸中都中都杜注晉邑在西河界休縣東南今山西平遙縣西北有中都古城少薑為之請曰送從逆班班列也畏大國也猶有所易是以亂作韓須公族大夫陳無宇上大夫言齊畏晉改易禮制使上大夫送遂致此執辱之罪蓋少薑謙以示譏夏叔弓如晉左傳叔弓聘于晉報宣子也此春韓宣子來聘晉侯使郊勞辭曰寡君使弓來繼舊好固曰女無敢為賓徹命于執事徹達也敝邑𢎞矣敢辱郊使請辭致館辭曰寡君命下臣來繼舊好好合使成臣之祿也祿榮也敢辱大館叔向曰子叔子知禮哉子叔子叔弓吾聞之曰忠信禮之器也卑讓禮之宗也辭不忘國忠信也謂稱舊好先國後已卑讓也謂始稱敝邑之𢎞次稱臣之祿詩曰敬慎威儀以近有德夫子近德矣詩大雅秋鄭殺其大夫公孫黑左傳秋鄭公孫黑將作亂欲去遊氏而代其位遊氏大叔之族傷疾作而不果駟氏與諸大夫欲殺之駟氏黑之族子産在鄙聞之懼弗及乘遽而至使吏數之曰伯有之亂在襄三十年以大國之事而未爾討也爾有亂心無厭國不女堪専伐伯有而罪一也昆弟爭室而罪二也謂爭徐吾犯之妹薰隧之盟女矯君位而罪三也謂使大史書七子有死罪三何以堪之不速死大刑將至再拜稽首辭曰死在朝夕無助天為虐子産曰人誰不死凶人不終命也作凶事為凶人不助天其助凶人乎請以印為褚師印子晳之子褚師市官子産曰印也若才君將任之不才將朝夕從女女罪之不恤而又何請焉不速死司寇將至七月壬寅縊尸諸周氏之衢加木焉書其罪于木以加尸上黑怙強而好亂干國之紀數矣君大夫畏而不敢誅會其疾而後幸勝焉則所以討罪者非其道矣故稱國以殺而不去其官冬公如晉至河乃復季孫宿如晉左傳晉少薑卒公如晉及河晉侯使士文伯來辭曰非伉儷也請君無辱公還季孫宿遂致服焉致少薑之禭服叔向言陳無宇于晉侯曰彼何罪君使公族逆之齊使上大夫送之猶曰不共君求以貪國則不共逆卑于送是晉國不共而執其使君刑己頗何以為盟主且少薑有辭冬十月陳無宇歸十一月鄭印段如晉弔弔少薑公羊傳其言至河乃復何不敢進也穀梁傳恥如晉故著有疾也公如晉而不得入季孫宿如晉而得入惡季孫宿也季孫久自結於晉以擅魯自襄公之末君臣之釁已開故嗣君喪畢而朝霸國季孫畏公之訴已於晉也故使晉辭公而後己入焉公穀所傳實得其情蓋晉之強家與季孫同志故計無不行觀此則子野之卒書法與見弒者不殊不可謂非筆削之大義也不然聖人作經豈若是混而無别哉日講春秋解義卷四十七
