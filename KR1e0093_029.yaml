body:
  text: 欽定四庫全書日講春秋解義卷二十九宣公十有一年春王正月夏楚子陳侯鄭伯盟于辰陵辰陵穀梁作夷陵杜注陳地潁川長平縣東南有辰亭在今河南陳州西南左傳十一年春楚子伐鄭及櫟子良曰晉楚不務德而兵爭與其來者可也晉楚無信我焉得有信乃從楚夏楚盟于辰陵陳鄭服也是時楚莊盛強主盟中國蓋齊晉方有事於莒狄各營其私置亂賊而不問陳鄭知中國不足恃故折而附楚也附録左傳楚左尹子重侵宋子重公子嬰齊莊王弟王待諸郔郔杜注楚地在今河南項城縣境令尹蒍艾獵城沂艾獵孫叔敖也沂杜注楚邑在今河南真陽縣境使封人慮事封人其時主築城者慮事謀慮計功以授司徒司徒掌役量功命日命作日數分財用財用築作具平板幹幹楨也墻兩頭立木板在兩旁障土者平等其高下稱畚築量輕重畚盛土器程土物為作程限議遠邇均勞逸略基趾略行也趾城足具餱糧餱乾食也度有司謀監主事三旬而成不愆于素不過素所慮之期也傳言叔敖之能使民公孫歸父會齊人伐莒秋晉侯會狄于欑函欑函杜注狄地左傳晉郤成子求成于衆狄衆狄疾赤狄之役遂服于晉赤狄潞氏最強故服役衆狄秋會于欑函衆狄服也是行也諸大夫欲召狄郤成子曰吾聞之作德莫如勤非勤何以求人能勤有繼其從之也勤則功繼之詩曰文王既勤止詩頌文王勤以創業文王猶勤况寡德乎穀梁傳不言及外狄也陳夏徵舒為亂楚方伸大義於天下晉為霸主乃孜孜於羣狄至往會焉卑亦甚矣直書其事深譏之也冬十月楚人殺陳夏徵舒公羊傳此楚子也其稱人何據下入陳稱子貶曷為貶據徴舒有罪不與外討也辟天子不與外討者因其討乎外而不與也雖內討亦不與也雖自討其臣下亦不得與曷為不與實與而文不與文曷為不與諸侯之義不得專討也諸侯之義不得專討則其曰實與之何上無天子下無方伯天下諸侯有為無道者臣弒君子弒父力能討之則討之可也穀梁傳此入而殺也其不言入何也據入國乃得殺外徵舒于陳也其外徵舒于陳何也明楚之討有罪也若書楚子入陳殺夏徴舒則入者內不受是無以表徴舒之悖逆故先言殺丁亥楚子入陳穀梁傳入者內弗受也曰入惡入者也何用弗受也不使夷狄為中國也徵舒在株林為陳南邑楚莊先經其地執而殺之而後入陳不言楚子而稱人討賊之文也然當時楚實利陳後雖聽申叔時之説能復封陳而置夏州納亂臣存亡興滅顧若是乎舜跖之分其始在善利之間耳討賊者衆人之公義故殺徵舒書楚人縣陳者一人之貪心故入陳書楚子罪人既得其入也何為哉胡氏安國謂不書取陳而書入為末減之辭非也楚實未嘗取陳以實書耳納公孫寧儀行父于陳寧公羊作寧左傳冬楚子為陳夏氏亂故伐陳十年夏徵舒弒君謂陳人無動將討于少西氏少西徵舒之祖子夏之名遂入陳殺夏徵舒轘諸栗門轘車裂也栗門陳城門因縣陳滅陳以為楚縣陳侯在晉靈公子成公午申叔時使于齊申叔時楚大夫反復命而退王使讓之曰夏徵舒為不道弒其君寡人以諸侯討而戮之諸侯縣公皆慶寡人楚縣大夫皆僭稱公女獨不慶寡人何故對曰猶可辭乎王曰可哉曰夏徵舒弒其君其罪大矣討而戮之君之義也抑人亦有言曰牽牛以蹊人之田蹊徑也而奪之牛牽牛以蹊者信有罪矣而奪之牛罰已重矣諸侯之從也曰討有罪也今縣陳貪其富也以討召諸侯而以貪歸之無乃不可乎王曰善哉吾未之聞也反之可乎對曰可哉吾儕小人所謂取諸其懷而與之也謂譬如取人物于其懷而還之為愈于不還乃復封陳鄉取一人焉以歸謂之夏州示討夏氏所獲故書曰楚子入陳納公孫寧儀行父于陳書有禮也沒其縣陳本意而以討亂存國為丈善其得禮公羊傳此皆大夫也其言納何納公黨與也寧儀行父本以助公見絶故言納公黨與穀梁傳納者內弗受也輔人之不能民而討猶可輔相鄰國有不能治民者而討其罪人則可曰猶可者明鄰國之君無輔相之道入人之國制人之上下使不得其君臣之道不可二人與昏淫當絶而楚強納之是制人之上下二人致亂之臣國所不容楚子不殺而反納之必因其來奔許以陳輸楚故使執其國柄為主於內而陳自是從楚不敢二則其無誅惡之實心不可掩矣孔寧儀行父之奔不書必孔子削之也書奔則習其讀者或疑二人能請討於楚而其惡隱矣附録左傳厲之役鄭伯逃歸蓋在六年自是楚未得志焉鄭既受盟于辰陵又徼事于晉為明年楚圍鄭傳十有二年春葬陳靈公公羊傳討此賊者非臣子也何以書葬據惠公殺里克不書卓子葬君子辭也君子之心無私故討賊不間內外楚已討之矣臣子雖欲討之而無所討也弒逆之賊人皆得討蓋綱常所在非有彼此之殊也徵舒雖為楚殺陳之臣子亦可以釋憾矣故靈公得書葬楚子圍鄭左傳十二年春楚子圍鄭旬有七日鄭人卜行成不吉卜臨于大宫臨哭也且巷出車吉出車于巷示將見遷不得安居國人大臨守陴者皆哭陴城上僻倪皆哭所以告楚窮也楚子退師鄭人修城進復圍之三月克之退師猶不服故復圍之九十日入自皇門至于逵路塗方九軌曰逵鄭伯肉袒牽羊以逆曰孤不天不為天所祐不能事君使君懷怒以及敝邑孤之罪也敢不唯命是聽其俘諸江南以實海濱亦唯命其翦以賜諸侯使臣妾之亦唯命若惠顧前好徼福于厲宣桓武不泯其社稷周厲王宣王鄭之所自出桓公武公鄭始封之君也使改事君夷于九縣夷比也楚滅九國以為九縣莊十四年滅息十六年滅鄧僖五年滅弦十二年滅黃二十六年滅夔文四年滅江五年滅六滅蓼十六年滅庸傳稱楚武王克權又稱文王縣申息凡十一國不知何以言九君之惠也孤之願也非所敢望也敢布腹心君實圖之左右曰不可許也得國無赦王曰其君能下人必能信用其民矣庸可幾乎退三十里而許之平潘尫入盟子良出質潘尫楚大夫子良鄭伯弟以傳考之凡入國者必陵暴殘毁有所俘獲楚子入郭門至于逵路而退師許盟秋毫無犯義不得書入胡氏安國謂即其國都而書圍為從輕典非也夏六月乙卯晉荀林父帥師及楚子戰于邲晉師敗績邲杜注鄭地今河南鄭州束有邲城左傳夏六月晉師救鄭荀林父將中軍代郤缺先縠佐之先縠彘季代林父士會將上軍河曲之役郤缺將上軍宣八年代趙盾將中軍士會代將上軍郤克佐之郤克郤缺子代臾駢趙朔將下軍代欒盾欒書佐之欒書欒盾子代趙朔趙括趙嬰齊為中軍大夫嬰齊趙盾異母弟鞏朔韓穿為上軍大夫荀首趙同為下軍大夫荀首林父弟趙同嬰齊兄韓厥為司馬韓厥韓萬玄孫及河聞鄭既及楚平桓子欲還桓子林父曰無及于鄭而勦民勦勞也焉用之楚歸而動不後隨武子曰武子士會善會聞用師觀釁而動德刑政事典禮不易不可敵也不為是征言無釁不可動楚軍討鄭怒其二而哀其卑叛而伐之服而舍之德刑成矣伐叛刑也柔服德也二者立矣昔歲入陳今兹入鄭民不罷勞君無怨讟政有經矣荆尸而舉楚武王始更此陳法遂以為名商農工賈不敗其業而卒乘輯睦事不姦矣蒍敖為宰蒍敖孫叔敖宰令尹擇楚國之令典軍行右轅左追蓐在車之右者挾轅為戰備在左者追求草蓐為宿備傳曰令尹南轅又曰改乘轅楚陳以轅為主前茅慮無慮無如今軍行前有斥候踏伏皆持以綘及白為幡見騎賊舉絳幡見步賊舉白幡備慮有無也茅明也或曰時楚以茅為旌識中權後徑中軍制謀後以精兵為殿百官象物而動軍政不戒而備物謂旌旗畫物類也戒敕令能用典矣其君之舉也內姓選于親外姓選于舊舉不失德賞不失勞老有加惠旅有施舍旅客來者施之以惠舍不勞役君子小人物有服章貴有常尊賤有等威禮不逆矣德立刑行政成事時典從禮順若之何敵之見可而進知難而退軍之善政也兼弱攻昧武之善經也子姑整軍而經武乎猶有弱而昧者何必楚仲虺有言曰仲虺湯左相薛之祖奚仲之後取亂侮亡兼弱也汋曰於鑠王師遵養時晦汋詩頌篇名美武王能遵天之道須暗昧者惡積而後取之耆昧也耆致也致討于昧武曰無競惟烈武詩頌篇名競強也言克商功業實無強也撫弱耆昧以務烈所可也言當務從武王之功業撫而取之彘子曰彘子先縠不可晉所以霸師武臣力也今失諸侯不可謂力有敵而不從不可謂武由我失霸不如死且成師以出聞敵強而退非夫也非丈夫命為軍帥而卒以非夫唯羣子能我弗為也以中軍佐濟佐彘子所帥也濟渡河知莊子曰莊子䓒首此師殆哉周易有之在師坎下坤上師之臨兌下坤上臨師初六變而之臨曰師出以律否臧凶執事順成為臧逆為否衆散為弱坎為衆今變為兌兌柔弱川壅為澤坎為川今變為兌兌為澤是川見壅有律以如己也如從也法行則人從法法敗則法從人坎為法象今為衆則散為川則壅是失法之用從人之象故曰律否臧且律竭也竭敗也坎變為兌是法敗盈而以竭水以盈為功竭則敗夭且不整所以凶也水遇夭塞不得整流則竭涸也不行之謂臨水變為澤乃成臨卦澤不行之物有帥而不從臨孰甚焉此之謂矣譬彘子之違命亦不可行果遇必敗彘子尸之尸之主此禍雖免而歸必有大咎為明年晉殺先縠傳韓獻子謂桓子曰獻子韓厥彘子以偏師陷子罪大矣子為元帥師不用命誰之罪也失屬亡師為罪已重不如進也事之不捷惡有所分與其專罪六人同之不猶愈乎師遂濟楚子北師次于郔沈尹將中軍沈縣名或作寢杜注寢汝陰固始縣子重將左子反將右子反公子側將飲馬于河而歸聞晉師既濟王欲還嬖人伍參欲戰參伍奢之祖父令尹孫叔敖弗欲曰昔歲入陳今兹入鄭不無事矣戰而不捷參之肉其足食乎參曰若事之捷孫叔為無謀矣不捷參之肉將在晉軍可得食乎令尹南轅反旆回車南鄉旆軍前大旗伍參言于王曰晉之從政者新未能行令其佐先縠剛愎不仁未肯用命其三帥者專行不獲聽而無上衆誰適從此行也晉師必敗且君而逃臣若社稷何王病之告令尹改乘轅而北之次于管以待之晉師在敖鄗之間管杜注滎陽縣東北有管城在今河南鄭州北敖鄗杜注二山在滎陽縣西北今河南滎澤縣西北有敖山鄭皇戌使如晉師曰鄭之從楚社稷之故也未有二心楚師驟勝而驕其師老矣而不設備子擊之鄭師為承承繼也楚師必敗彘子曰敗楚服鄭于此在矣必許之欒武子曰武子欒書楚自克庸以來在文十六年其君無日不討國人而訓之討治也于于曰也民生之不易禍至之無日戒懼之不可以怠在軍無日不討軍實而申警之于勝之不可保紂之百克而卒無後訓之以若敖蚡冒篳路藍縷以啓山林篳路柴車藍縷敝衣言二君勤儉以啓土針之曰民生在勤勤則不匱不可謂驕先大夫子犯有言曰師直為壯曲為老我則不德而徼怨于楚我曲楚直不可謂老其君之戎分為二廣廣有一卒卒偏之兩十五乘為一廣司馬法百人為卒二十五人為兩車十五乘為大偏今廣十五乘亦用舊偏法復以二十五人為承副右廣初駕數及日中左則受之以至于昏內官序當其夜內官近官序次也以待不虞不可謂無備子良鄭之良也師叔楚之崇也師叔入盟子良在楚楚鄭親矣來勸我戰我克則來不克遂往以我卜也鄭不可從趙括趙同曰率師以來唯敵是求克敵得屬又何俟必從彘子知季曰原屏咎之徒也知季莊子也原趙同屏趙括徒黨也咎指彘子趙莊子曰欒伯善哉莊子趙朔欒伯武子實其言必長晉國實猶充也楚少宰如晉師少宰官名曰寡君少遭閔凶不能文聞二先君之出入此行也二先君楚成王穆王將鄭是訓定豈敢求罪于晉二三子無淹久隨季對曰昔平王命我先君文侯曰與鄭夾輔周室毋廢王命今鄭不率寡君使羣臣問諸鄭豈敢辱候人候人主賓客之官敢拜君命之辱彘子以為諂使趙括從而更之曰行人失辭言誤對寡君使羣臣遷大國之迹于鄭遷徙也曰無辟敵羣臣無所逃命楚子又使求成于晉晉人許之盟有日矣有期日楚許伯御樂伯攝叔為右以致晉師單車挑戰又示不欲和以疑晉之羣帥許伯曰吾聞致師者御靡旌摩壘而還靡旌驅疾也摩近也樂伯曰吾聞致師者左射以菆左車左也菆矢之善者代御執轡御下兩馬掉鞅而還兩飾也掉正也示間暇攝叔曰吾聞致師者右入壘折馘執俘而還折馘斷耳皆行其所聞而復晉人逐之左右角之張兩角從旁夾攻之樂伯左射馬而右射人角不能進矢一而已麋興于前射麋麗龜麗著也龜背之隆高當心者晉鮑癸當其後使攝叔奉麋獻焉曰以歲之非時獻禽之未至敢膳諸從者鮑癸止之曰其左善射其右有辭君子也既免晉魏錡求公族未得而怒錡魏犨子欲為公族大夫欲敗晉師請致師弗許請使許之遂往請戰而還楚潘黨逐之潘尫子及滎澤滎澤杜注在滎陽縣東見六麋射一麋以顧獻曰子有軍事獸人無乃不給于鮮敢獻于從者叔黨命去之即潘黨趙旃求卿未得旃趙穿子且怒于失楚之致師者請挑戰弗許請召盟許之與魏錡皆命而往郤獻子曰獻子郤克二憾往矣弗備必敗彘子曰鄭人勸戰弗敢從也楚人求成弗能好也師無成命多備何為士季曰備之善若二子怒楚楚人乘我喪師無日矣不如備之楚之無惡除備而盟何損于好若以惡來有備不敗且雖諸侯相見軍衛不徹警也彘子不可士季使鞏朔韓穿帥七覆于敖前帥將也覆為伏兵七處故上軍不敗趙嬰齊使其徒先具舟于河故敗而先濟潘黨既逐魏錡趙旃夜至于楚軍二人雖俱受命而行不相隨趙旃在後至席于軍門之外使其徒入之布席坐示無所畏楚子為乘廣三十乘分為左右右廣雞鳴而駕日中而説説舍也左則受之日入而説許偃御右廣養由基為右彭名御左廣屈蕩為右楚王更迭載之故各有御右乙卯王乘左廣以逐趙旃趙旃棄車而走林屈蕩摶之得其甲裳晉人懼二子之怒楚師也使軘車逆之軘車兵車名潘黨望其塵使騁而告曰晉師至矣楚人亦懼王之入晉軍也遂出陳孫叔曰進之寧我薄人無人薄我詩云元戎十乘以先啓行先人也詩小雅元戎戎車在前也軍志曰先人有奪人之心薄之也遂疾進師車馳卒奔乘晉軍桓子不知所為鼓于軍中曰先濟者有賞中軍下軍爭舟舟中之指可掬也兩手曰掬晉師右移上軍未動餘軍皆移去惟上軍在經所以書戰言猶有陳工尹齊將右拒卒以逐下軍工尹齊楚大夫右拒陳名楚子使唐狡與蔡鳩居告唐惠侯曰二子楚大夫唐杜注屬楚之小國義陽安昌縣有上唐鄉不穀不德而貪以遇大敵不穀之罪也然楚不克君之羞也敢藉君靈以濟楚師使潘黨率遊闕四十乘遊車補闕者從唐侯以為左拒以從上軍駒伯曰駒伯郤克待諸乎隨季曰楚師方壯若萃于我吾師必盡不如收而去之分謗生民不亦可乎同奔為分謗不戰為生民殿其卒而退不敗王見右廣將從之乘屈蕩尸之曰君以此始亦必以終尸止也軍中易乘則恐人惑自是楚之乘廣先左以乘左得勝故晉人或以廣隊不能進廣兵車重故不能進楚人惎之脫扃惎教也扃車上兵闌也少進馬還又惎之拔旆投衡乃出還便旋不進旆大旗也拔旆投衡上使不帆風差輕顧曰吾不如大國之數奔也趙旃以其良馬二濟其兄與叔父以他馬反遇敵不能去棄車而走林逢大夫與其二子乘逢大夫晉人謂其二子無顧不欲見趙旃顧曰趙叟在後叟老稱怒之怒其違命使下指木曰尸女于是授趙旃綏以免明日以表尸之表所指木取其尸皆重獲在木下兄弟纍尸而死楚熊負羈囚知罃知莊子以其族反之負羈楚大夫知罃知莊子之子族家兵反還戰厨武子御武子魏錡下軍之士多從之知莊子下軍大夫故每射抽矢菆納諸厨子之房抽擢也菆好箭房箭舍厨子怒曰非子之求而蒲之愛蒲楊栁可以為箭董澤之蒲可勝既乎董澤杜注澤名河東聞喜縣東北有董池陂今屬山西平陽府知季曰不以人子吾子其可得乎吾不可以茍射故也射連尹襄老獲之遂載其尸射公子穀臣囚之穀臣楚王子以二者還及昏楚師軍于邲晉之餘師不能軍宵濟亦終夜有聲言其兵衆將不能用丙辰楚重至于邲重輜重也遂次于衡雍潘黨曰君盍築武軍築軍營以彰武功而收晉尸以為京觀積尸封土其上謂之京觀臣聞克敵必示子孫以無忘武功楚子曰非爾所知也夫文止戈為武武王克商作頌曰載戢干戈載櫜弓矢周頌時邁篇櫜韜也我求懿德肆于時夏允王保之肆遂也夏大也言武王既息兵又能求美德故功業遂大信哉王能保天下也又作武其卒章曰耆定爾功其三曰鋪時繹思我徂惟求定鋪布也繹陳也美武王能布政陳教使天下歸往求安定其六曰綏萬邦屢豐年綏安也屢數也夫武禁暴戢兵保大定功安民和衆豐財者也此武七德故使子孫無忘其章著之篇章使子孫不忘今我使二國暴骨暴矣觀兵以威諸侯兵不戢矣暴而不戢安能保大猶有晉在焉得定功所違民欲猶多民何安焉無德而強爭諸侯何以和衆利人之幾而安人之亂幾危也以為已榮何以豐財兵動則年荒武有七德我無一焉何以示子孫其為先君宮告成事而已祀先君告戰勝武非吾功也古者明王伐不敬取其鯨鯢而封之以為大戮鯨鯢大魚名以喻不義之人吞食小國于是乎有京觀以懲淫慝今罪無所晉罪無所犯而民皆盡忠以死君命又可以為京觀乎祀于河作先君宮告成事而還傳言楚莊有禮所以遂興是役也鄭石制實入楚師石制鄭大夫將以分鄭而立公子魚臣辛未鄭殺僕叔及子服僕叔魚臣也子服石制也君子曰史佚所謂毋怙亂者謂是類也言恃人之亂以要利詩曰亂離瘼矣爰其適歸詩小雅離憂也瘼病也爰于也言禍亂憂病于何所歸手歎之歸于怙亂者也夫恃亂則禍歸之公羊傳大夫不敵君此其稱名氏以敵楚子何據城濮之戰得臣稱人不與晉而與楚子為禮也稱林父及楚子戰惡以晉臣與楚君抗禮故云不與曷為不與晉而與楚子為禮也莊王伐鄭勝乎皇門勝戰勝皇門鄭郭門放乎路衢路衢郭內衢道鄭伯肉袒左執茅旌茅旌祀宗廟所用茅斷曰藉不斷曰旌右執鸞刀鸞刀宗廟割肉之刀執宗廟器者示以宗廟不血食自歸首以逆莊王曰寡人無良邊垂之臣言已有過于楚邊垂之臣謙不敢斥莊王以干天禍是以使君王沛焉辱到敝邑沛焉怒有餘之貌君如矜此喪人自謂已喪亡錫之不毛之地使帥一二耋老而綏焉六十稱耋七十稱老謙不敢多索丁夫願得主帥一二老夫以自安請唯君王之命莊王曰君之不令臣交易為言是亦莊王謙不斥鄭伯之辭交易猶往來也言君之不善臣屢往來為惡言是以使寡人得見君之玉面而微至乎此莊王親自手旌緇廣充幅長尋曰旐繼旐如燕尾曰旆加文章曰旗錯莘鳥曰旟注旄首曰旌左右撝軍退舍七里將軍子重諫曰南郢之與鄭相去數千里諸大夫死者數人厮役扈養死者數百人艾草為防者曰厮汲水漿者曰役養馬者曰扈炊烹者曰養今君勝鄭而不有無乃失民臣之力乎莊王曰古者杅不穿皮不蠧則不出于四方杅飲水器穿敗也皮裘也蠹壞也言古者出四方皆當有所喪費喻已出征伐士卒死傷固其宜也是以君子篤于禮而薄于利要其人而不要其土告從不赦不詳善用心曰詳吾以不詳道民災及吾身何日之有既則晉師之救鄭者至荀林父也曰請戰莊王許諾將軍子重諫曰晉大國也王師淹病矣君請勿許也莊王曰弱者吾威之強者吾辟之是以使寡人無以立乎天下令之還師而逆晉寇言還者時莊王勝鄭去矣會晉師至復還戰也莊王鼓之晉師大敗晉衆之走者舟中之指可掬矣莊王曰嘻吾兩君不相好百姓何罪令之還師而佚晉寇佚猶遇使得渡水去也穀梁傳績功也功事也日其事敗也不書救鄭緩不及事無救患之實也中國與楚戰無論勝敗皆以中國為主故書晉及徐邈以為內晉而外楚是也將稱元帥乃史䇿之通例胡氏安國謂戰以晉主之責其非觀釁之師敗以林父主之責其不能制命皆非經之本義秋七月附録左傳鄭伯許男如楚為十四年晉伐鄭傳秋晉師歸桓子請死晉侯欲許之士貞子諫曰貞子士渥濁不可城濮之役晉師三日穀在僖二十八年文公猶有憂色左右曰有喜而憂如有憂而喜乎公曰得臣猶在憂未歇也困獸猶鬬况國相乎及楚殺子玉公喜而後可知也曰莫余毒也已是晉再克而楚再敗也楚是以再世不競今天或者大警晉也而又殺林父以重楚勝其無乃久不競乎林父之事君也進思盡忠退思補過社稷之衛也若之何殺之夫其敗也如日月之食焉何損于明晉侯使復其位言晉景所以不失霸冬十有二月戊寅楚子滅蕭左傳冬楚子伐蕭宋華椒以蔡人救蕭蕭人囚熊相宜僚及公子丙王曰勿殺吾退蕭人殺之王怒遂圍蕭蕭潰申公巫臣曰巫臣楚申縣尹師人多寒王巡三軍拊而免之拊撫慰三軍之士皆如挾纊纊綿也言説以忘寒遂傅于蕭還無社與司馬卯言號申叔展還無社蕭大夫司馬卯申叔展皆楚大夫也無社素識叔展故因卯呼之叔展曰有麥麴乎曰無有山鞠窮乎曰無麥麴鞠窮所以御濕欲使無社逃泥水中無社不解故曰無軍中不敢正言故謬語河魚腹疾奈何叔展言無禦濕藥將病曰目于眢井而拯之無社意解欲入井故使叔展視虛廢井而求拯巳若為茅絰哭井則已叔展又教結茅以表井須哭乃應以為信明日蕭潰申叔視其井則茅絰存焉號而出之號哭也傳言蕭人無守心楚莊得陳鄭而不有傳以為賢觀其滅蕭則知前日之釋陳乃料其國大衆心難移而非果能以德禮屬諸侯也蕭既滅亡必無赴告蓋楚莊既服陳鄭北挫晉師於河上遂有鞭笞天下之心故以滅蕭告於諸侯以相震攝耳晉人宋人衛人曹人同盟于清丘清丘杜注衛地濮陽縣東南在今直隸開州東南長樂里此大夫同盟之始左傳晉原縠宋華椒衛孔達曹人同盟于清丘原縠先縠曰恤病討二于是卿不書經俱稱人不實其言也宋伐陳衛救之不討二也楚伐宋晉不救不恤病也蕭乃宋之附庸在宋之南去楚千有餘里楚既敗晉又直抵宋郊滅其附庸故宋衛曹皆懼而欲倚晉然晉及諸國不能信任仁賢修明政事以自強而徒要盟以禦楚末矣其書同盟蓋晉霸既衰諸侯散而復合故載書以是要言耳宋師伐陳衛人救陳左傳宋為盟故伐陳陳二于楚故衛人救之孔達曰先君有約言焉若大國討我則死之衛成公與陳共公有舊好故孔達欲背盟救陳而以死謝晉為十四年衛殺孔達傳清丘之盟陳人不與宋師伐陳問陳故也但陳有弒君之亂晉不能討而楚討之雖曰縣陳尋復封之其德於楚而不二未可深責也故衛以救書示陳之無罪而被兵也然宋之伐陳雖過而輔霸之義則正衛之救陳雖善而背盟之罪難辭直書而其義皆著矣十有三年春齊師伐莒公羊作伐衛左傳十三年春齊師伐莒莒恃晉而不事齊故也十一年公孫歸父會齊人伐莒以泄不肯平之憾也間歲而齊又伐之徒以魯有向之獲而齊未有耳莒豈負齊魯之邑哉書師見用大衆以扼小邦也夏楚子伐宋左傳夏楚子伐宋以其救蕭也救蕭在前年君子曰清丘之盟唯宋可以免焉宋討陳之二不背盟言故也楚伐宋以宋師嘗伐陳也陳不與清丘之盟晉所當問而不能問宋代晉伐之以犯楚怒又晉所當救而不能救諸侯何恃哉胡氏安國謂宋伐陳以召楚兵則楚人有辭以伐故書其爵謬矣上年滅蕭明年圍宋凶暴巳甚而俱書楚子亦得謂之有辭乎書楚子以見其君親將耳陳蔡世服於楚楚有事於中國皆自鄭及宋楚成爭霸敗宋於泓楚穆爭霸弱宋於厥貉楚莊之興挾鄭以侵宋此年之伐明年之圍又明年宋人力屈求平而南北之勢成矣成十八年彭城之役楚又挾鄭以圍宋非悼公之略則不待襄公之末盟于宋而南北分霸早見矣秋螽公羊作􅏑冬晉殺其大夫先縠左傳秋赤狄伐晉及清先縠召之也清杜注一名清原今山西稷山縣西北有清原城冬晉人討邲之敗與清之師歸罪于先縠而殺之盡滅其族君子曰惡之來也已則取之其先縠之謂乎縠違命喪師復召狄謀亂討之固宜而稱國以殺不去其官者何將責元帥林父不能制命晉侯既復其位自戰邲至此逾年矣何為始討其罪意縠好剛任直當國大臣多惡之會楚復伐宋故追咎前敗而清之師謂縠召狄亦附會以成獄辭如郤至實召楚師之類耳故稱國以殺見其出於君大夫之喜怒而不去其官見其非死於軍刑也附録左傳清丘之盟晉以衛之救陳也討焉尋清丘之盟以責衛使人弗去曰罪無所歸將加而師孔達曰茍利社稷請以我説罪我之由我則為政而亢大國之討將以誰任亢禦也我則死之為明年殺孔逹傳日講春秋解義卷二十九
