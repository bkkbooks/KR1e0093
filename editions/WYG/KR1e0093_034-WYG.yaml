body:
  text: 欽定四庫全書日講春秋解義卷三十四成公十年春附録左傳十年春晉侯使糴茷如楚報大宰子商之使也糴茷晉大夫子商楚公子辰使在前年衞侯之弟黑背帥師侵鄭左傳衞子叔黑背侵鄭晉命也凡受大國之命而加兵於鄰國者多書侵蓋本無積怨不過侵擾其邊境而已黑背稱弟義見齊年来聘傳夏四月五卜郊不從乃不郊公羊傳其言乃不郊何不免牲故言乃不郊也穀梁傳夏四月不時也郊時極于三月五卜强也乃者亡乎人之辭也禮記載卜筮之辭旬之外曰逺某日旬之内曰近某日是每旬而一卜也傳稱啓蟄而郊則周之三月乃郊之大期五卜者蓋三月三卜四月又二卜皆不吉乃止也其瀆甚矣五月公會晉侯齊侯宋公衞侯曹伯伐鄭左傳鄭公子班聞叔申之謀改立君之謀叔申公孫申三月子如立公子繻子如公子班夏四月鄭人殺繻立髠頑髠頑鄭成公大子子如奔許欒武子曰鄭人立君我執一人焉何益不如伐鄭而歸其君以求成焉晉侯有疾五月晉立大子州蒲以為君而會諸侯伐鄭州蒲厲公生立子為君此父不父子不子經因書晉侯其惡明鄭子罕賂以襄鍾子罕穆公子襄鍾鄭襄公之廟鍾子然盟于修澤子駟為質子然子駟皆穆公子修澤杜注滎陽卷縣東有修武亭在今河南原武縣北辛巳鄭伯歸鄭伯歸不書鄭不告入晉執鄭伯久而不釋聞鄭已立君乃伐而歸之以求成不能服鄭之心而徒勦民以勞諸侯宜乎覇業之不振也按君在而立君者鄭也左氏因晉侯有疾謂經所書晉侯乃太子州蒲誤矣春秋辨名分豈有生代父位而以爵書之義乎齊人來媵公羊傳媵不書此何以書錄伯姬也三國来媵非禮也曷為皆以錄伯姬之辭言之婦人以衆多為侈也侈大也伯姬賢三國爭媵故侈大其能容之徳也非齊人来媵則衞晉之媵宜以為常事而不書以是知春秋於共姬之事錄之特詳皆志魯宋及齊之過禮而後人推論則亦有以見其賢聲之著耳丙午晉侯獳卒左傳晉侯夢大厲被髮及地搏膺而踊曰殺余孫不義厲鬼趙氏之先祖也八年晉侯殺趙同趙括故怒余得請于帝矣壊大門及寢門而入公懼入于室又壊戸公覺召桑田巫桑田杜注晉邑巫言如夢公曰何如曰不食新矣公疾病求醫于秦秦伯使醫緩為之緩醫名為猶治也未至公夢疾為二豎子曰彼良醫也懼傷我焉逃之其一曰居肓之上膏之下若我何肓鬲也心下為膏醫至曰疾不可為也在肓之上膏之下攻之不可攻熨灸達之不及達鍼藥不至焉不可為也公曰良醫也厚為之禮而歸之六月丙午晉侯欲麥周六月今四月麥始熟使甸人獻麥甸人主為公田者饋人為之召桑田巫示而殺之將食張如厠陷而卒張腹滿也明巫言果驗小臣有晨夢負公以登天及日中負晉侯出諸厠遂以為殉附錄左傳鄭伯討立君者戊申殺叔申叔禽叔禽叔申弟君子曰忠為令徳非其人猶不可况不令乎言叔申為忠不得其人還害身秋七月公如晉左傳秋公如晉晉人止公使送𦵏于是糴茷未反是春晉使糴茷至楚結成晉謂魯貳于楚故留公湏糴茷還驗其盧實冬𦵏晉景公公送𦵏諸侯莫在魯人辱之故不書諱之也諱不書晉𦵏也在禮惟天王之喪同軌畢至魯聞晉之喪而君親往焉己卑屈而失位矣晉適有疑於魯而又知其不能自彊遂止之使送𦵏不能以禮為國而足恭以茍悦於人恥辱乃自取耳不書會𦵏乃魯君臣諱恥而不書於冊非孔子削之也冬十月公羊無此三字十有一年春王三月公至自晉左傳十一年春王三月公至自晉晉人以公為貳于楚故止公公請受盟而後使歸晉侯使郤犨来聘己丑及郤犨盟犨公羊作州左傳郤犨来聘且涖盟郤犨郤克從父兄弟附録左傳聲伯之母不聘聲伯之母叔肸之妻穆姜曰吾不以妾為姒穆姜宣公夫人宣公叔肸同母昆弟昆弟之妻相謂為姒生聲伯而出之嫁于齊管于奚生二子而寡以歸聲伯聲伯以其外弟為大夫外弟管于奚之子為魯大夫而嫁其外妹于施孝叔孝叔魯恵公五世孫郤犨來聘求婦于聲伯聲伯奪施氏婦以與之婦人曰鳥獸猶不失儷儷偶也子将若何曰吾不能死亡言不與郤犨婦懼忿而致禍婦人遂行生二子于郤氏郤氏亡郤氏亡在十七年晉人歸之施氏施氏逆諸河沈其二子沈之于河婦人怒曰己不能庇其伉儷而亡之伉敵也又不能字人之孤而殺之將何以終遂誓施氏誓不為之婦也傳言郤犨滛縱所以亡夏季孫行父如晉左傳夏季文子如晉報聘且涖盟也左氏稱行父如晉報聘且涖盟然據經止出聘之常詞似未嘗復㝷盟也公止於晉九月而後歸傳載公請受盟而未嘗言盟公者蓋方是時晉稍懦矣欲如陽處父之盟文公恐諸侯􅂝貳故許魯以成待公既歸而後使郤犨盟公也魯人畏晉而報聘豈敢使行父抗盟晉君亦豈肯與行父盟哉或曰晉使大夫盟行父而魯人諱之也附録左傳周公楚惡恵襄之偪也恵王襄王之族且與伯與爭政伯與周卿士不勝怒而出及陽樊王使劉子復之盟于鄄而入三日復出奔晉鄄杜注周邑為明年經書周公出奔傳秋叔孫僑如如齊左傳秋宣伯聘于齊以修前好鞌以前之好魯齊戰鞌以後使命不通者㡬十年矣今屈辱於晉故使僑如通問以謝戰鞌之師捐歸汶陽之忿未㡬復求昏而齊卒無報聘蓋魯為齊弱久矣冬十月附録左傳晉郤至與周爭鄇田鄇杜注溫别邑河内懐縣西南有鄇人亭在今河南武陟縣王命劉康公單襄公訟諸晉郤至曰溫吾故也故不敢失言溫郤氏舊邑劉子單子曰昔周克商使諸侯撫封各撫有其封内之地蘇忿生以溫為司寇與檀伯達封于河檀周邑在今河南河内縣蘇氏即狄又不能于狄而奔衞事在僖十年襄王勞文公而賜之溫在僖二十五年狐氏陽氏先處之狐溱陽處父先食溫地而後及子若治其故則王官之邑也子安得之晉侯使郤至勿敢爭𫝊言郤至貪所以亡宋華元善于令尹子重又善于欒武子聞楚人既許晉糴茷成而使歸復命矣在前年冬華元如楚遂如晉合晉楚之成為明年盟宋西門外張本秦晉為成將會于令狐晉侯先至焉秦伯不肯渉河次于王城使史顆盟晉侯于河東史顆秦大夫晉郤犨盟秦伯于河西就盟王城范文子曰是盟也何益齊盟所以質信也齊一心質成也會所信之始也始之不從其可質乎秦伯歸而背晉成為十三年伐秦傳十有二年春周公出奔晉左傳十二年春王使以周公之難来告周公奔在前年書曰周公出奔晉凡自周無出天子無外故奔者不言出周公自出故也周公為王所復而自絶于周故書出以罪之公羊傳周公者何天子之三公也王者無外此其言出何自其私土而出也私土謂其國穀梁傳周有入無出有入如昭二十六年天王入于成周是其曰出上下一見之也上謂僖二十四年天王出居于鄭下謂今周公出奔上下皆一見之言其上下之道無以存也上雖失之下孰敢有之上雖有不君之失臣下莫敢效不臣之過今上下皆失之矣王臣有罪誅戮放流惟王所命未聞有罪而自奔也王之所棄天下同棄之所至之國宜執以歸司寇今王與周公要盟既盟而周公復奔王政不綱周公之傲悖所不待言而晉受逋逃罪亦不可逭矣王子瑕王子朝之奔不言出以為逆亂無所容其身與滅國之君在外之臣同義不得言出與周公居位有禄以私忿而自出者異也夏公會晉侯衞侯于瑣澤瑣澤公羊作沙澤杜注地闕左傳宋華元克合晉楚之成終前年事夏五月晉士燮會楚公子罷許偃二子楚大夫癸亥盟于宋西門之外曰凡晉楚無相加戎好惡同之同恤菑危備救凶患若有害楚則晉伐之在晉楚亦如之交贄往来道路無壅謀其不協而討不庭有渝此盟明神殛之俾隊其師無克胙國鄭伯如晉聽成聽受也晉楚既成鄭往受命會于瑣澤成故也晉厲初立而求諸侯也陳許宋曹皆已從楚惟魯衞兩屬故晉會之左傳謂宋華元克合晉楚鄭伯如晉聽成據經楚鄭不至宋亦不與未足信也果晉楚為成所闗非細聖人豈反削而不書乎秋晉人敗狄于交剛交剛杜注地闕左傳狄人閒宋之盟以侵晉而不設備秋晉人敗狄于交剛穀梁傳中國與夷狄不言戰皆曰敗之夷狄不日狄白狄也九年秦人白狄伐晉此先敗狄而後伐秦是知報九年之役也不自彊於政治以攘爭覇之楚而區區釋憾於羣狄所爭益細矣冬十月附録左傳晉郤至如楚聘且涖盟楚子享之子反相為地室而縣焉縣鐘鼓也郤至将登登堂金奏作于下擊鐘而奏樂驚而走出子反曰日云莫矣寡君須矣吾子其入也賓曰賓郤至傳凡交讓得賓主辭者多曰賓主以明之君不忘先君之好施及下臣貺之以大禮重之以備樂如天之福兩君相見何以代此下臣不敢言此兩君相見之禮子反曰如天之福兩君相見無亦唯是一矢以相加遺焉用樂言兩君戰乃相見無用此樂寡君須矣吾子其入也賓曰若讓之以一矢禍之大者其何福之為世之治也諸侯閒于天子之事則相朝也王事閒缺則修私好于是乎有享宴之禮享以訓共儉享有體薦設几而不倚爵盈而不飲肴乾而不食所以訓共儉宴以示慈恵宴則折爼相與共食共儉以行禮而慈恵以布政政以禮成民是以息百官承事朝而不夕不夕言無事此公侯之所以扞城其民也扞蔽也言享宴結好鄰國所以蔽扞其民故詩曰赳赳武夫公侯干城詩周南兎罝篇赳赳武貌干扞也及其亂也諸侯貪冒侵欲不忌爭尋常以盡其民八尺曰尋倍尋曰常言爭尺丈之地以相攻伐略其武夫以為己腹心股肱爪牙略取也言世亂則公侯制禦武夫以從己志使侵害鄰國為搏噬之用無已故詩曰赳赳武夫公侯腹心舉詩之正以駮亂義詩言治世則武夫能合徳公侯外為扞城内制其腹心之欲天下有道則公侯能為民干城而制其腹心亂則反之今吾子之言亂之道也不可以為法然吾子主也至敢不從遂入卒事歸以語范文子文子曰無禮必食言吾死無日矣夫為十六年鄢陵戰張本冬楚公子罷如晉聘且涖盟報郤至十二月晉侯及楚公子罷盟于赤棘赤棘杜注晉地十有三年春晉侯使郤錡來乞師左傳十三年春晉侯使郤錡来乞師将事不敬孟獻子曰郤氏其亡乎禮身之幹也敬身之基也郤子無基且先君之嗣卿也郤錡郤克子故曰嗣卿受命以求師将社稷是衞而惰棄君命也不亡何為為十七年晉殺郤錡傳穀梁傳乞重辭也古之人重師故以乞言之也外乞師不書必盟主也而後書乞卑辭也見晉之無以令與國也齊桓晉文假尊王之義徵兵侵伐猶以禁暴討畔為名故諸侯拱手聽命今晉以私怨報秦則其義不足以令諸侯矣故懼其不從而卑辭以乞耳三月公如京師穀梁傳公如京師不月月非如也時實㑹晉伐秦過京師也公行出竟有危則月朝京師理無危懼故不月非如而曰如不叛京師也因其過朝故正其文使若本自往夏五月公自京師遂會晉侯齊侯宋公衞侯鄭伯曹伯邾人滕人伐秦左傳三月公如京師宣伯欲賜欲王賜己請先使王以行人之禮禮焉不加厚孟獻子從王以為介而重賄之介輔相威儀者獻子相公以禮故王重賜之公及諸侯朝王遂從劉康公成肅公會晉侯伐秦劉成二公不書兵不加秦成子受脤于社不敬脤宜社之肉也盛以蜃器故曰脤宜出兵祭社之名劉子曰吾聞之民受天地之中以生所謂命也是以有動作禮義威儀之則以定命也能者養之以福養威儀以致福不能者敗以取禍是故君子勤禮小人盡力勤禮莫如致敬盡力莫如敦篤敬在養神篤在守業國之大事在祀與戎祀有執膰膰祭肉戎有受脤神之大節也交神之大節今成子惰棄其命矣惰則失中和之氣其不反乎為成肅公卒于瑕張本夏四月戊午晉侯使吕相絶秦呂相魏錡子蓋口宣已命曰昔逮我獻公及穆公相好晉献公秦穆公戮力同心申之以盟誓重之以昏姻穆公夫人獻公之女天禍晉國文公如齊惠公如秦辟驪姬也不言狄梁舉所恃大國無禄獻公即世穆公不忘舊徳俾我惠公用能奉祀于晉僖十年秦納恵公又不能成大勲而為韓之師僖十五年秦伐晉獲恵公亦悔于厥心用集我文公集成也納文公在僖二十四年是穆之成也文公躬擐甲胄䟦履山川踰越險阻征東之諸侯虞夏商周之𦙍而朝諸秦則亦既報舊徳矣諸侯朝秦不見于傳蓋文其詞鄭人怒君之疆埸我文公帥諸侯及秦圍鄭晉自討鄭貳于楚鄭非侵秦也蓋以此誣秦事在僖三十年秦大夫不詢于我寡君擅及鄭盟盟者秦伯謙言大夫諸侯疾之將致命于秦文公恐懼綏静諸侯秦師克還無害則是我有大造于西也無禄文公即世穆為不弔不見弔傷蔑死我君寡我襄公寡弱也迭我殽地迭侵突也奸絶我好伐我保城殄滅我費滑伐保城誣之費滑杜注滑國都于費即緱氏縣今河南偃師縣南有緱氏故城秦滅滑在僖三十三年散離我兄弟滑晉同姓撓亂我同盟傾覆我國家我襄公未忘君之舊勲而懼社稷之隕是以有殽之師在僖三十三年猶願赦罪于穆公穆公弗聽而即楚謀我天誘其衷成王隕命秦使鬬克歸楚求成事見文十四年文元年楚弑成王穆公是以不克逞志于我穆襄即世康靈即位康公我之自出晉甥又欲闕翦我公室傾覆我社稷帥我蝥賊以来蕩摇我邊疆此亦文致之辭蝥賊食禾稼蟲名謂秦納公子雍我是以有令狐之役在文七年康猶不悛入我河曲伐我涑川涑川杜注涑水出河東聞喜縣西南至蒲坂縣入河今山西蒲州東北有涑水城俘我王官翦我覊馬我是以有河曲之戰在文十二年東道之不通則是康公絶我好也及君之嗣也我君景公引領西望曰庶撫我乎君亦不恵稱盟不肯稱晉望而共盟利吾有狄難謂晉滅潞氏時入我河縣焚我箕郜箕郜晉二邑芟夷我農功䖍劉我邊陲䖍劉皆殺也我是以有輔氏之聚聚衆也在宣十五年君亦悔禍之延而欲徼福于先君獻穆使伯車来命我景公曰伯車秦桓公子吾與女同好棄惡復修舊徳以追念前勲言誓未就景公即世我寡君是以有令狐之會令狐會在十一年君又不祥背棄盟誓白狄及君同州君之仇讎而我之昏姻也季隗庸咎如赤狄之女也白狄伐而獲之納諸文公君来賜命曰吾與女伐狄寡君不敢顧昏姻畏君之威而受命于吏君有二心于狄曰晉將伐女狄應且憎是用告我言狄雖應答秦而心實憎秦無信楚人惡君之二三其徳也亦来告我曰秦背令狐之盟而来求盟于我昭告昊天上帝秦三公楚三王三公穆康共三王成穆莊曰余雖與晉出入余唯利是視不穀惡其無成徳是用宣之以懲不壹諸侯備聞此言斯是用痛心疾首暱就寡人寡人帥以聽命唯好是求君若恵顧諸侯矜哀寡人而賜之盟則寡人之願也其承寧諸侯以退承君之意以寕静諸侯豈敢徼亂君若不施大恵寡人不佞其不能以諸侯退矣敢盡布之執事俾執事實圖利之秦桓公既與晉厲公為令狐之盟而又召狄與楚欲道以伐晉諸侯是以睦于晉晉辭多誣故傳惟據此事以正秦罪晉欒書将中軍荀庚佐之代荀首士燮将上軍代荀庚郤錡佐之代士燮韓厥将下軍代郤錡荀罃佐之代趙同趙旃将新軍代韓厥郤至佐之代趙括郤毅御戎欒鍼為右郤毅郤至弟欒鍼樂書子孟獻子曰晉帥乗和師必有大功帥軍帥乗車士五月丁亥晉師以諸侯之師及秦師戰于麻隧秦師敗績獲秦成差及不更女父麻隧杜注秦地在今陕西涇陽縣西南成差女父皆秦大夫不更秦爵戰敗績不書蓋經文闕漏曹宣公卒于師師遂濟涇及侯麗而還涇杜注涇水出安定東南漢志出开頭山在今陜西平涼府西南侯麗杜注秦地在今陜西涇陽縣境迓晉侯于新楚迓迎也既戰晉侯止新楚故師還過迎之新楚杜注秦地在今陜西朝邑縣境成肅公卒于瑕終劉子之言公羊傳其言自京師何據僖公二十八年諸侯遂圍許不言自王所公鑿行也鑿猶更造之意公鑿行奈何不敢過天子也時本欲直伐秦塗過京師不敢過天子而不朝故成其意使若故朝然後更行也穀梁傳言受命不敢叛周也使若既朝王而王命使伐秦叛周謂専征伐僖公兩朝于王所俱書朝此不書朝而書如京師僅同於如齊如晉之文者因會伐而行故不成其朝然書自京師而以伐秦為遂事又以明朝王為重而存人臣之禮也其辭若志敬而實以志不敬此程子所謂或抑或縱或予或奪微辭隱義時措而從宜者與附録左傳六月丁夘夜鄭公子班自訾求入于大宫不能殺子印子羽訾杜注鄭地十年班出奔許今欲還為亂子印子羽皆穆公子反軍于市己巳子駟帥國人盟于大宫子駟穆公子遂從而盡焚之殺子如子駹孫叔孫知子如公子班子駹班弟孫叔子如子孫知子駹子曹伯廬卒于師廬左氏作盧左傳曹人使公子負芻守使公子欣時逆曹伯之喪二子皆曹宣公庶子秋負芻殺其大子而自立也宣公大子諸侯乃請討之晉人以其役之勞請俟他年穀梁傳傳曰閔之也公大夫在師曰師在會曰會秋七月公至自伐秦不以京師至而以伐秦至明其意本不在於朝王也冬𦵏曹宣公左傳冬𦵏曹宣公既𦵏子臧将亡子臧公子欣時國人皆将從之不義負芻故成公乃懼成公負芻告罪且請焉請留子臧乃反而致其邑還邑于成公為十五年執曹伯傳穀梁傳𦵏時正也十有四年春王正月莒子朱卒夏衞孫林父自晉歸于衞左傳十四年春衞侯如晉晉侯强見孫林父焉林父以七年奔晉强見欲歸之定公不可夏衞侯既歸晉侯使郤犨送孫林父而見之衞侯欲辭定姜曰定姜定公夫人不可是先君宗卿之嗣也同姓之卿大國又以為請不許将亡雖惡之不猶愈于亡乎君其忍之安民而宥宗卿不亦可乎衞侯見而復之復林父位衞侯饗苦成叔成叔郤犨甯惠子相惠子甯殖苦成叔傲甯子曰苦成家其亡乎古之為享食也以觀威儀省禍福也故詩曰兕觵其觩㫖酒思柔詩小雅言君子好禮飲酒皆思柔徳雖設兕觵觩然不用以兕角為觵所以罰不敬觩陳設之貌彼交匪傲萬福來求彼之交于事而不惰傲乃萬福之所求今夫子傲取禍之道也為十七年郤氏亡傳晉受衞國逋逃罪戾之臣又彊歸之林父之罪著矣晉厲之惡顯矣衞定不能辭以大義而受之其不能君又可知矣秋叔孫僑如如齊逆女左傳秋宣伯如齊逆女稱族尊君命也鄭公子喜帥師伐許左傳八月鄭子罕伐許敗焉子罕公子喜為許所敗戊戌鄭伯復伐許庚子入其郛許人平以叔申之封四年鄭公孫申疆許田許人敗之不能定其封疆今許以是所封田求和于鄭鄭逼許楚困鄭以國大小兵力彊弱更相吞噬人理亡矣越明年許遷于葉辟鄭以依楚以晉不足恃也而襄三年晉荀罃伐許猶以從楚為討何其不自反與九月僑如以夫人婦姜氏至自齊左傳九月僑如以夫人婦姜氏至自齊舎族尊夫人也舎族謂不稱叔孫故君子曰春秋之稱微而顯辭微而義顯志而晦志記也晦亦微也謂約言以記事事叙而文微婉而成章婉曲也謂曲屈其辭有所辟諱以示大順而成篇章盡而不汙謂直言其事盡其事實無所汙曲懲惡而勸善善名必書惡名不滅所以為懲勸非聖人誰能修之穀梁傳大夫不以夫人以夫人非正也刺不親迎也僑如之挈由上致之也稱婦有姑也氏或曰衍先儒皆謂諸侯當親迎程子獨辨其非以為親迎者迎於所館未有委宗廟社稷而逺適他國以逆婦者胡氏安國主穀梁譏不親迎亦謂或迎於國或迎於境上夫既曰迎於境上則未入境之先安得不以大夫逆乎以是知程子之説不可易也冬十月庚寅衞侯臧卒左傳衞侯有疾使孔成子甯恵子立敬姒之子衎以為大子成子孔達之孫敬姒定公妾衎獻公冬十月衞定公卒夫人姜氏既哭而息見大子之不哀也不内酌飲歎曰是夫也将不唯衞國之敗其必始于未亡人夫賤之之稱定姜言獻公行無禮必從已始下言暴妾使余是也嗚呼天禍衞國也夫吾不獲鱄也使主社稷鱄衎之母弟大夫聞之無不聳懼孫文子自是不敢舎其重器于衞孫文子林父盡寘諸戚戚孫氏邑而甚善晉大夫備亂起欲以為援為襄十四年衛侯出奔傳秦伯卒日講春秋解義卷三十四
