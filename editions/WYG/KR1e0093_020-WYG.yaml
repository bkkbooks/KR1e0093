body:
  text: 欽定四庫全書日講春秋解義卷二十僖公二十有四年春王正月附録左傳二十四年春王正月秦伯納之納重耳也不書不告入也及河子犯以璧授公子曰臣負羈絏從君巡于天下羈馬絡首絏馬繮臣之罪甚多矣臣猶知之而况君乎請由此亡公子曰所不與舅氏同心者有如白水子犯重耳舅也諸言有如皆是誓辭投其璧于河質信于河濟河圍令狐入桑泉取臼衰令狐今山西猗氏縣西有令狐城桑泉杜注在河東解縣西今山西臨晉縣東有桑泉城臼衰杜注解縣東南有臼城在今山西解州西北二月甲午晉師軍于廬栁懐公遣軍距重耳廬栁今山西猗氏縣西北有廬栁城秦伯使公子縶如晉師師退軍于郇晉師從秦命納文公故退師郇杜注解縣西北有郇城在今山西臨晉縣東北辛丑狐偃及秦晉之大夫盟于郇壬寅公子入于晉師丙午入于曲沃丁未朝于武宫文公之祖武公廟戊申使殺懐公于髙梁懐公奔髙梁不書亦不告也吕郤畏偪吕甥郤芮恵公舊臣故畏為文公所逼害將焚公宫而弑晉侯寺人披請見公使讓之且辭焉辭不見曰蒲城之役在五年君命一宿女即至其後余從狄君以田渭濵女為恵公来求殺余命女三宿女中宿至雖有君命何其速也夫袪猶在袪披所斬文公衣袂也女其行乎對曰臣謂君之入也其知之矣知君人之道若猶未也又將及難君命無二古之制也除君之惡唯力是視蒲人狄人余何有焉當二君世君為蒲狄之人于我有何義今君即位其無蒲狄乎齊桓公置射鈎而使管仲相乾時之役管仲射桓公中帶鈎君若易之何辱命焉言若反齊桓念舊惡則已將自去耳不湏辱君命行者甚衆豈唯刑臣披奄人故稱刑臣公見之以難告告吕郤欲焚公宫三月晉侯潛㑹秦伯于王城己丑晦公宫火瑕甥郤芮不獲公乃如河上秦伯誘而殺之晉侯逆夫人嬴氏以歸秦穆公女文嬴也秦伯送衛于晉三千人實紀綱之僕新有吕郤之難國未輯睦故以兵衛文公諸門戸僕隸之事皆秦卒共之為之紀綱初晉侯之豎頭湏守蔵者也頭湏一曰里鳬湏豎左右小吏韓詩外𫝊云文公亡過曹里鳬湏從因盗重耳資而亡重耳無糧餒不能行介子推割股以食重耳然後能行其出也竊蔵以逃盡用以求納之求納文公及入求見公辭焉以沐謂僕人曰沐則心覆心覆則圖反宜吾不得見也沐則頭低故心反覆也居者為社稷之守行者為羈絏之僕其亦可也何必罪居者國君而讎匹夫懼者甚衆矣僕人以告公遽見之言文公棄小怨所以能安衆狄人歸季隗于晉而請其二子二子伯鯈叔劉請其進退之命文公妻趙衰生原同屏括樓嬰原屛接三子之邑趙姬請逆盾與其母趙姬文公女也盾狄女叔隗之子子餘辭子餘趙衰字姬曰得寵而忘舊何以使人必逆之固請許之来以盾為才固請于公以為嫡子而使其三子下之以叔隗為内子而已下之卿之嫡妻為内子皆非此年事盖因狄人歸季隗遂終言叔隗晉侯賞從亡者介之推不言禄禄亦弗及介推文公從亡微臣之語助推曰獻公之子九人唯君在矣恵懐無親外内棄之天未絶晉必將有主主晉祀者非君而誰天實置之而二三子以為己力不亦誣乎竊人之財猶謂之盗况貪天之功以為己力乎下義其罪上賞其姦上下相䝉䝉欺也難與處矣其母曰盍亦求之以死誰懟對曰尤而效之罪又甚焉且出怨言不食其食怨言謂上下相䝉難與處其母曰亦使知之若何欲今推達言于文公對曰言身之文也身將隠焉用文之是求顯也其母曰能如是乎與女偕隠遂隠而死晉侯求之不獲以緜上為之田曰以志吾過且旌善人旌表也緜上杜注西河介休縣南有地名緜上今山西沁源縣北有緜上闗緜上城夏狄伐鄭左傳鄭之入滑也滑人聽命入滑在二十年師還又即衛鄭公子士洩堵俞彌帥師伐滑堵俞彌鄭大夫王使伯服㳺孫伯如鄭請滑二子周大夫鄭伯怨恵王之入而不與厲公爵也事在荘二十一年又怨襄王之與衛滑也怨王助衛為滑請故不聴王命而執二子王怒將以狄伐鄭富辰諫曰不可臣聞之大上以徳撫民無親疏也其次親親以相及也先親以及疏推恩以行義昔周公弔二叔之不咸故封建親戚以蕃屏周弔傷也咸同也周公傷夏殷之叔世疏其親戚以致滅亡故廣封其兄弟管蔡郕霍魯衛毛耼郜雍曹滕畢原酆郇文之昭也十六國皆文王子也管杜注管國在滎陽京縣東北隋置管城縣今河南開封府鄭州治廢管城是也毛杜注采邑今河南宜陽縣界雍杜注雍國在河内山陽縣西今河南修武縣西有雍城畢杜注畢國在長安縣西北今陕西咸陽縣北有畢原酆杜注酆國在始平鄠縣東今鄠縣屬西安府邘晉應韓武之穆也四國皆武王子應杜注應國在襄陽城父縣西今河南寳豐魯山二縣界有應城凡蔣郉茅胙祭周公之𦙍也𦙍嗣也蔣杜注在弋陽期思縣今河南尉氏縣西有蔣城茅杜注髙平昌邑縣西有茅鄉今山東金鄉縣西北有昌邑城其西有茅鄉古茅國也胙杜注東郡燕縣西南有胙亭今河南胙城縣是也召穆公思周徳之不類故糾合宗族于成周而作詩類善糾聚也召穆公周卿士名虎召杜注穆公采地扶風雍縣東南有召亭在今陜西鳯􅃋府境常棣詩屬小雅曰常棣之華鄂不鞾鞾常棣棣也鄂鄂然華外發不豈不也鞾鞾以喻兄弟和睦則强盛而有光輝鞾鞾然凡今之人莫如兄弟其四章曰兄弟鬩于牆外禦其侮鬩訟争貌言内雖不和猶宜外扞異俟之侵侮如是則兄弟雖有小忿不廢懿親今天子不忍小忿以棄鄭親其若之何庸勲親親暱近尊賢徳之大者也庸用也暱親也即聾從眜與頑用嚚姦之大者也棄徳崇姦禍之大者也鄭有平恵之勲平王東遷晉鄭是依恵王出奔虢鄭納之是其動也又有厲宣之親鄭始封之祖桓公友周厲王之子宣王之母弟棄嬖寵而用三良七年殺嬖臣申侯十六年殺寵子子華也三良叔詹堵叔師叔所謂尊賢于諸姬為近鄭居河洛道近當暱之四徳具矣耳不聴五聲之和為聾目不别五色之章為眜心不則徳義之經為頑口不道忠信之言為嚚狄皆則之四姦具矣周之有懿徳也猶曰莫如兄弟故封建之其懐柔天下也猶懼有外侮扞禦侮者莫如親親故以親屏周召穆公亦云周公詩召公歌之故言亦云今周徳既衰于是乎又渝周召以從諸姦無乃不可乎民未忘禍王又興之前有子頽之亂中有叔帶召狄故曰民未忘禍其若文武何言將廢文武之功業王弗聴使頽叔桃子出狄師二子周大夫夏狄伐鄭取櫟王徳狄人将以其女為后富辰諫曰不可臣聞之曰報者倦矣施者未厭有勞則望報過甚狄固貪惏殺人而取財曰惏王又唘之女徳無極婦怨無終婦女之志近之則不知止足逺之則忿怨無已終猶已也狄必為患王又弗聴初甘昭公有寵于恵后王子帶食邑于甘杜注河南縣西南有甘水今河南洛陽縣即河南縣也縣西南有甘城甘水在焉恵后将立之未及而卒昭公奔齊在十二年王復之在二十二年又通于隗氏隗氏王所立狄后王替隗氏替廢也頽叔桃子曰我實使狄狄其怨我遂奉太叔以狄師攻王王御士將禦之周禮王之御士十二人王曰先后其謂我何先后恵后誅太叔恐違先后志寜使諸侯圖之王遂出及坎欿國人納之坎欿杜注周地在河南鞏縣東秋頽叔桃子奉太叔以狄師伐周大敗周師獲周公忌父原伯毛伯富辰原毛皆采邑王出適鄭處于汜汜杜注鄭南汜也在襄城縣南今屬河南開封府太叔以隗氏居于温鄭在畿内王所倚毗頽叔桃子將欲叛王故先以狄伐鄭盖為叔帶謀也伐鄭果出王意則是年冬王出居于鄭伐焉而又依之非情也左氏所𫝊未可盡信附録左傳鄭子華之弟子臧出奔宋十六年殺子華故好聚鷸冠鷸鳥名聚鷸羽以為冠非法之服鄭伯聞而惡之使盜誘之八月盜殺之于陳宋之間君子曰服之不𠂻身之災也𠂻猶適也詩曰彼己之子不稱其服詩曹風刺小人在位徳不稱其服子臧之服不稱也夫詩曰自詒伊慼其子臧之謂矣詩小雅言其自取􅁨夏書曰地平天成稱也夏書大禹謨地平其化天成其施上下相稱為宜宋及楚平宋成公如楚還入于鄭鄭伯将享之問禮于皇武子皇武子鄭卿對曰宋先代之後也于周為客天子有事膰焉有事祭宗廟也膰祭肉尊之故賜以祭胙有䘮拜焉宋弔周䘮王特拜謝之豐厚可也鄭伯從之享宋公有加禮也秋七月冬天王出居于鄭左傳冬王使来告難曰不榖不徳得罪于母弟之􅃂子帶鄙在鄭地氾鄙野也敢告叔父天子謂同姓諸侯曰叔父臧文仲對曰天子蒙塵于外敢不奔問官守官守王之羣臣王使簡師父告于晉使左鄢父告于秦二子周大夫天子無出書曰天王出居于鄭辟母弟之難也天子凶服降名禮也凶服素服降名稱不穀鄭伯與孔将鉏石甲父侯宣多省視官具于氾三子鄭大夫省官司具器用而後聽其私政禮也得先君後已之禮公羊傳王者無外此其言出何不能乎母也魯子曰是王也不能乎母者其諸此之謂與榖梁傳天子無出出失天下也居者居其所也雖失天下莫敢有也雖實出奔而王者無外王之所居諸侯不敢有之以為國天王居于狄泉不書出者雖去京師猶在畿内也此則去畿内而越在諸侯之國故書出出而曰居者天子以天下為家王出在鄭則鄭伯莫敢私其地故曰居晉侯夷吾卒據左氏晉恵公卒以二十三年九月先儒謂文公定位而後告䘮魯史即告時書之𫝊所據他國之史故經𫝊年月各異義亦可通附録左傳衛人將伐郉禮至曰不得其守國不可得也禮至衛大夫守謂郉正卿國子我請昆弟仕焉乃往得仕為明年滅郉𫝊二十有五年春王正月丙午衛侯燬滅郉左傳二十五年春衛人伐郉二禮從國子巡城二禮禮至兄弟掖以赴外掖持臂也謂執持其臂投之城外也殺之正月丙午衛侯燬滅郉同姓也故名禮至為銘曰余掖殺國子莫余敢止惡其不知恥詐以滅同姓而反銘功于器公羊傳衛侯燬何以名絶曷為絶之滅同姓也榖梁傳燬之名何也不正其伐本而滅同姓也絶先祖支體故謂之伐本郉衛近族又皆齊桓所存之亡國也衛侯忘舊徳以伐齊䘮反怒郉救齊至使其臣設詐行險以戕滅之絶先祖之裔無人理矣故生而名之夏四月癸酉衛侯燬卒宋蕩伯姬来逆婦公羊傳宋蕩伯姬者何蕩氏之母也蕩氏宋世大夫其言来逆婦何兄弟辭也其稱婦何有姑之辭也宋魯之間名結婚姻爲兄弟稱婦者見姑之辭榖梁傳婦人既嫁不踰竟宋蕩伯姬来逆婦非正也其曰婦何也緣姑言之之辭也伯姬魯君之女而配蕩氏其嫁不見於經國君不與大夫敵故不書於策也今来逆婦而經書之見僖公失禮自主大夫之婚上下之分亂矣婦人不専行姑自逆婦非禮也盖交譏之宋殺其大夫公羊傳何以不名宋三世無大夫三世内娶也禮不臣妻之父母榖梁傳其不稱名姓以其在祖之位尊之也義繫於殺則止書其官不紀名氏公羊氏以為内娶非也君娶一卿之女何得一國之内悉無大夫且既稱大夫則非無大夫明甚榖梁氏又以為諱祖之名然春秋國史禮無私諱其説亦非也盖因魯史記舊文而不能益爾附録左傳秦伯師于河上將納王狐偃言于晉侯曰求諸侯莫如勤王勤納王也諸侯信之且大義也繼文之業而信宣于諸侯今為可矣晉文侯仇為平王侯伯匡輔周室使卜偃卜之曰吉遇黄帝戰于阪泉之兆黄帝與神農之後姜氏戰于阪泉之野勝之今得其兆故以為吉公曰吾不堪也對曰周禮未改今之王古之帝也言周徳雖衰其命未改今之周王自當帝兆不謂晉公曰筮之筮之遇大有乾下離上大有之睽兌下離上睽大有九三變而為睽曰吉遇公用享于天子之卦大有九三爻辭也三為三公而得位變而為兌兌為説得位而説故能為王所宴饗戰克而王饗吉孰大焉言卜筮協吉且是卦也天為澤以當日天子降心以逆公不亦可乎乾為天兑為澤乾變為兑而上當離離為日日之在天垂曜在澤天子在上説心在下是降心逆公之象大有去睽而復亦其所也言去睽卦還論大有亦有夭子降心之象乾尊離卑降尊下卑亦其義也晉侯辭秦師而下辭讓秦師使還順流故曰下三月甲辰次于陽樊右師圍温太叔在温故左師逆王夏四月丁巳王入于王城取太叔于温殺之于隰城戊午晉侯朝王王饗醴命之宥請隧弗許闗地通路曰隧王之葬禮也諸侯皆縣柩而下曰王章也未有代徳而有二王亦叔父之所惡也與之陽樊温原攒茅之田晉于是始啓南陽四邑在晉山南河北故曰南陽陽樊不服圍之倉葛呼曰倉葛陽樊人徳以柔中國刑以威四夷宜吾不敢服也此誰非王之親姻其俘之也乃出其民取其土而己秋楚人圍陳納頓子于頓左傳秋秦晉伐鄀鄀杜注本在商宻秦楚界上小國其後遷于南郡鄀縣今河南淅川縣西有丹水故城古鄀國也楚鬭克屈禦寇以申息之師戍商宻鬭克申公子儀屈禦冦息公子邉皆楚大夫商宻杜注鄀别邑在南鄉丹水縣戍守也二子屯兵于析以為商宻援秦人過析隈入而係輿人以圍商宻昏而傅焉析杜注楚邑一名白羽今河南内鄉縣即其地也隈隱蔽之處係縛輿人詐為克析得其囚俘者昏而傅城不欲令商宻知囚非析人宵坎血加書偽與子儀子邉盟者掘地為坎以埋盟之餘血加盟書其上商宻人懼曰秦取析矣戍人反矣乃降秦師秦師囚申公子儀息公子邉以歸楚令尹子玉追秦師弗及不復言晉者秦為兵主遂圍陳納頓子于頓公羊傳何以不言遂兩之也榖梁傳納者内弗受也圍一事也納一事也而遂言之盖納頓子者陳也圍陳使納頓子頓子廹於陳而奔楚人圍陳以納之故不言遂明其本一事也諸侯不能保恤小寡反使荆楚假義以操廢置之權此𫝊所以閔無霸與凡國君失地出奔則名他國納之則不名以諸侯不得相名也葬衛文公附録左傳冬晉侯圍原原亦如陽樊不服故命三日之糧原不降命去之諜出諜閒也曰原將降矣軍吏曰請待之公曰信國之寳也民之所庇也得原失信何以庇之所亡滋多退一舎而原降遷原伯貫于冀伯貫周守原大夫也趙衰為原大夫狐溱為温大夫狐溱狐毛之子冬十有二月癸亥公㑹衛子莒慶盟于洮洮杜注魯地孔氏穎達曰八年盟于洮杜注曹地三十一年魯始得曹田此時不得為魯地注誤耳左傳衛人平莒于我十二月盟于洮修衛文公之好且及莒平也莒以元年酈之後怨魯衛文公将平之未及而卒成公追成父志故曰修文公之好穀梁傳莒無大夫其曰莒慶何也以公之㑹目之也衛欲平莒於魯故為㑹于洮稱衛子䘮未踰年也莒子不至盖疑魯未肯平故先以大夫聽命小國之大夫不名而莒慶名以事接於我舊史稱名孔子仍而不革也附録左傳晉侯問原守于寺人勃鞮勃鞮披也對曰昔趙衰以壺飱從徑餒而弗食言其亷且仁不忘君也徑猶行也故使處原二十有六年春王正月己未公㑹莒子衛甯速盟于向速公羊作遫後同甯速衛大夫莊子也向杜注莒地冢宇記曰莒州南有向城今屬山東青州府左傳二十六年春王正月公㑹莒兹㔻公兹㔻時君之號莒夷無諡以號為稱甯荘子盟于向尋洮之盟也洮盟在前年穀梁傳公不㑹大夫其曰甯速何也以其隨莒子可以言㑹也洮之盟莒魯平矣以莒子不親至復為是㑹以成之二國既通故衛侯不㑹使大夫即事以質信而已凡書盟者惡之此無貶辭者踰月再盟比書之而義自見矣齊人侵我西鄙公追齊師至酅弗及酅公羊穀梁皆作巂酅杜注齊地濟北榖城縣西有地名酅下今山東東阿縣西南有酅下聚左傳齊師侵我西鄙討是二盟也討魯與衛莒為洮向之盟公羊傳其言至巂弗及何侈也侈大也大公却强齊之兵穀梁傳人微者也侵淺事也公之追之非正也至巂急辭也弗及者弗與也弗與戰也可以及而不敢及也其侵也曰人其追也曰師以公之弗及大之也弗及内辭也弗及者若曰我自不及耳非齊不可及凡追師在境内則譏其不豫追戎于濟西是也在境外則譏其深入追齊師至酅是也弗者遷辭也有畏而弗敢及之也齊魯私憤之兵均為不義然先儒謂書人為罪齊非也自隠以来凡以兵加我君大夫皆書人君将書君自文十五年齊懿公始大夫将書大夫自襄七年齊髙厚始至邾莒小國則終春秋恒書人凡此皆舊史之文孔子所不能易者也又謂前書齊人是見其弱以誘魯後書齊師是伏其衆以邀魯亦非也城濮柏舉皆戰書楚人敗書楚師則其義不可通矣夏齊人伐我北鄙衛人伐齊左傳夏齊孝公伐我北鄙衛人伐齊衛救魯故伐齊洮之盟故也公使展喜犒師展喜魯大夫使勞齊師使受命于展禽展禽食邑栁下諡曰恵齊侯未入竟展喜從之曰寡君聞君親舉玉趾將辱于敝邑使下臣犒執事齊侯曰魯人恐乎對曰小人恐矣君子則否齊侯曰室如縣罄野無青草何恃而不恐時夏四月今之二月野物未成故言居室而資糧縣盡在野則無蔬食之物所以當恐對曰恃先王之命昔周公大公股肱周室夹輔成王成王勞之而賜之盟曰世世子孫無相􅊣也載在盟府載載書也大師職之職主也桓公是以糾合諸侯而謀其不協彌縫其闕而匡救其災昭舊職也及君即位諸侯之望曰其率桓之功我敝邑用不敢保聚用此舊盟故不聚衆保守曰豈其嗣世九年而棄命廢職其若先君何君必不然恃此以不恐齊侯乃還衛平莒魯為洮向之盟齊何與焉乃連興侵伐之師非義甚矣二盟乃衛人平莒於魯故為魯報齊然亦無名之師也公子遂如楚乞師書乞師始此左傳東門襄仲臧文仲如楚乞師襄仲公子遂居東門故以為氏臧文仲為襄仲副使故不書臧孫見子玉而道之伐齊宋以其不臣也言其不臣事周室可以此罪責而伐之公羊傳乞師者何卑辭也曷為以外内同若辭重師也曷為重師師出不正反戰不正勝也正預期也穀梁傳乞重辭也何重焉重人之死也非所乞也師出不必反戰不必勝故重之也書乞卑辭也荆楚僭王陵暴列國僖公不忍齊人侵伐之怨乃自屈於楚乞師以報齊是猶揖盜以困鄰也害義孰大焉秋楚人滅蘷以蘷子歸蘷公羊作隗杜注楚同姓國建平秭歸縣湖廣歸州志云州西南有蘷子城地名蘷沱左傳蘷子不祀祝融與鬻熊祝融髙辛氏之火正楚之逺祖也鬻熊祝融之十二世孫蘷楚之别封故亦世紹其祀楚人讓之對曰我先王熊摯有疾鬼神弗赦而自竄于蘷熊摯楚嫡子有疾不得嗣位故别封為蘷子吾是以失楚又何祀焉秋楚成得臣鬭宜申帥師滅蘷以蘷子歸成得臣令尹子玉鬬宜申司馬子西穀梁傳蘷國也不日微國也以歸猶愈乎執也春秋凡滅國以其君歸者無不名蘷子何以不名諸侯之祀不過其祖蘷祖熊摯其不祀祝融鬻熊禮也以是見滅實非其罪故特寛假之不日赴告闕也冬楚人伐宋圍緡緡穀梁作閔左傳宋以其善于晉侯也重耳之出宋襄公贈馬二十乘叛楚即晉冬楚令尹子玉司馬子西帥師伐宋圍緡公羊傳邑不言圍此其言圍何刺道用師也時以師與魯未至又道用之惡其輕民命不仁之甚也穀梁傳伐國不言圍邑此其言圍何也以吾用其師目其事也非道用師也楚人為魯伐齊而中道更伐宋故伐圍兼書所以責楚前年宋公忘讎即楚今復從晉能徙義矣楚遂伐其國而圍其邑備書之以著其横兼罪魯之召㓂也公以楚師伐齊取榖公至自伐齊左傳公以楚師伐齊取榖凡師能左右之曰以左右謂進退在己寘桓公子雍于榖易牙奉之以為魯援雍本與孝公争立故使居榖以偪齊楚申公叔侯戍之為二十八年楚子使申叔去榖張本桓公之子七人為七大夫于楚言孝公不能撫公族公羊傳此已取榖矣何以致伐未得乎取榖也未可謂得意于取穀曷為未得乎取榖曰患之起必自此始也魯内虚而外乞師以犯强齊㑹齊侯昭卒晉文行霸幸而得免榖梁傳以者不以者也民者君之本也使民以其死非其正也惡事不致此其致之何也危之也以楚師伐齊取榖置戍以逼之不待貶而罪見矣而僖公方自以為得告至而策勲焉豈非失其本心與二十有七年春把子来朝左傳二十七年春把桓公来朝用夷禮故曰子公卑把把不共也把稱子時王所黜也春秋有褒貶而無黜陟𫝊謂公卑把似謂舊史稱子果舊史變易王爵孔子豈仍其非而不革乎夏六月庚寅齊侯昭卒左傳夏齊孝公卒有齊怨前年齊再伐魯不廢䘮紀䘮紀䘮事之總名禮也齊桓既殁諸侯猶思其徳孝公不能繼志述事乃盟楚狄伐宋及魯衛為謀不逺霸業遽隳惜哉秋八月乙未葬齊孝公三月而葬非禮也魯有齊怨而㑹其君之葬豈非去古未逺猶秉周禮之驗與乙巳公子遂帥師入把八月無乙巳乙巳九月六日左傳秋入把責無禮也以来朝不共故把魯甥舅之國伯姬在焉方来朝而帥師入之憑弱犯寡不義甚矣魯自季友卒公子遂用事乞楚師以仇齊今又入把背舊棄親結憾四鄰僖公之末造無一可觀者憸人之害政於此可見矣冬楚人陳侯蔡侯鄭伯許男圍宋左傳楚子將圍宋使子文治兵于睽子文時不為令尹故云使治兵習號令也睽楚邑終朝而畢不戮一人子文欲委重于子玉故畧其事子玉復治兵于蒍子玉為令尹故蒍亦楚邑終日而畢鞭七人貫三人耳以矢穿其耳國老皆賀子文賀子玉堪其事子文飲之酒蒍賈尚幼後至不賀蒍賈伯嬴孫叔敖之父子文問之對曰不知所賀子之𫝊政于子玉曰以靖國也靖諸内而敗諸外所獲㡬何子玉之敗子之舉也舉以敗國將何賀焉子玉剛而無禮不可以治民過三百乘其不能以入矣三百乘二萬二千五百人茍入而賀何後之有冬楚子及諸侯圍宋宋公孫固如晉告急先軫曰先軫原軫也報施救患取威定霸于是乎在矣狐偃曰楚始得曹而新昏于衛若伐曹衛楚必救之則齊宋免矣前年楚使申叔戌榖以偪齊于是乎蒐于被廬被廬晉地作三軍閔元年晉獻公作二軍今復增一軍謀元帥元帥中軍帥趙衰曰郤縠可臣亟聞其言矣説禮樂而敦詩書詩書義之府也禮樂徳之則也徳義利之本也夏書曰賦納以言明試以功車服以庸尚書虞夏書也賦猶取也庸功也取納以言觀其志也明試以功考其事也車服以庸報其勞也君其試之乃使郤縠将中軍郤溱佐之使狐偃将上軍讓于狐毛而佐之狐毛偃之兄命趙衰為卿讓于欒枝先軫欒枝貞子也欒賔之孫使欒枝將下軍先軫佐之荀林父御戎荀林父中行桓子魏犫為右晉侯始入而教其民二年欲用之二十四年入國子犯曰民未知義未安其居無義則茍生于是乎出定襄王二十五年定襄王以示事君之義入務利民民懐生矣将用之子犯曰民未知信未宣其用宣明也未明于見用之信于是乎伐原以示之信伐原在二十五年民易資者不求豐焉明徴其辭民以貨物易資財者不詐以求多明定其辭不二價重言信也公曰可矣乎子犯曰民未知禮未生其共于是乎大蒐以示之禮蒐頥少長明貴賤作執秩以正其官執秩主爵秩之官民聽不惑而後用之出穀戍釋宋圍楚子使申叔去穀子玊去宋一戰而霸文之教也謂明年城濮之戰公羊傳此楚子也其稱人何貶曷為貶為執宋公貶故終僖之篇貶也穀梁傳楚人者楚子也其曰人何也人楚子所以人諸侯也其人諸侯何也不正其信夷狄而伐中國也𫝊稱楚子及諸侯圍宋十二月公㑹諸侯盟于宋就楚子而受盟也然則楚子在師明矣其書楚人以明年晉興楚屈故舊史以公之就見楚子為諱而書人也先儒謂書人為貶書爵為褒觀楚穆楚靈之侵伐皆書爵則其義不通矣十有二月甲戌公㑹諸侯盟于宋魯方親楚故往㑹盟楚子主盟而曰㑹諸侯諱公從楚亦不與楚以主盟也日講春秋解義卷二十
