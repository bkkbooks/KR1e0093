body:
  text: 欽定四庫全書日講春秋解義卷二十一僖公二十有八年春晉侯侵曹晉侯伐衞左傳二十八年春晉侯將伐曹假道于衞曹在衞東故衞人弗許還自南河濟南河杜注從汲郡南渡出衞南而東水經注河水逕東燕縣故城北有棘津之名即此也棘津在今河南汲縣南侵曹伐衞正月戊申取五鹿二月晉郤縠卒原軫將中軍胥臣佐下軍上徳也先軫以下軍佐超將中軍故曰上徳晉侯齊侯盟于斂盂斂盂杜注衞地今直𨽻開州東南斂盂聚是也齊侯以穀戍之迫故從晉求援衞侯請盟晉人弗許衞侯欲與楚國人不欲故出其君以説于晉衞侯出居于襄牛襄牛杜注衞地今屬河南歸徳府公羊傳曷為再言晉侯非兩之也然則何以不言遂未侵曹也未侵曹則其言侵曹何致其意也其意侵曹則曷為伐衞晉侯將侵曹假塗于衛衞曰不可得則固將伐之也言欲侵曹而因衞之不肯假途遂伐衛則尚未侵曹而推其意故两書之也穀梁傳再稱晉侯忌也以修曹衞之宿怨故再稱晉侯以刺之齊桓因蔡潰而伐楚故言遂此則侵曹既反而後伐衞故再言晉侯皆各據事之實而書之非襃貶所繫也晉文之興其勢與齊桓異齊桓之時楚雖閒犯上國猶無逺圖故合諸侯正問罪之名以求其服而已晉文之時則陳蔡鄭許久服於楚且與之聯兵以圍宋又戍穀以逼齊非大挫其鋒楚禍不息而楚子入居於申使子玉去宋非侵曹伐衛多方以激之無由致楚而與之戰先儒乃專罪晉侯之報怨且謂宜先伐陳蔡鄭許曹衛自服皆昧於情實之論也公子買戍衛不卒戍刺之左傳公子買戍衛晉伐衛衛楚之昏姻魯欲與楚故戍衛楚人救衛不克公懼于晉殺子叢以説焉子叢公子買字謂楚人曰不卒戍也詐告楚人之詞殺子叢在楚救衛下經在上者救衛之赴後至公羊傳不卒戍者何不卒戍者内辭也不可使往也不可使往則其言戍衛何遂公意也以不可使之事使其臣故為公諱言使若臣不遵君命者然刺之者何殺之也殺之則曷為謂之刺之内諱殺大夫謂之刺之也有罪無罪皆不得專殺故諱殺言刺之穀梁傳先名後刺殺有罪也公子啟曰不卒戍者可以卒也可以卒而不卒譏在公子也刺之可也公子啟魯大夫内殺大夫曰刺刺未有書其故者而曰不卒戍刺之所以見其辭之不直情之甚私買之死實非其罪不止於專殺大夫而已也公既附楚遣買戍衛又懼晉而殺之詭辭以謝楚政刑如此其能國乎楚人救衛春秋凡書救者皆善此書救非善楚也見晉伐所必救能致楚人分圍宋之師以出而戰克取威正其謀之譎也故曰比事屬辭春秋之敎三月丙午晉侯入曹執曹伯􅂌宋人左傳晉侯圍曹門焉多死攻曹城門曹人尸諸城上晉侯患之聼輿人之謀曰稱舍于墓輿衆也舍墓為将發冡師遷焉曹人兇懼兇兇恐懼聲為其所得者棺而出之欲加禮晉師以免發冢之禍因其兇也而攻之三月丙午入曹數之以其不用僖負羈而乗軒者三百人也且曰獻狀軒大夫車言其無徳居位者多故責其功狀令無入僖負羈之宫而免其族報施也報飱璧之施魏犨顛頡怒曰勞之不圖報于何有爇僖負羈氏爇焚也魏犨傷于胷公欲殺之而愛其材使問且視之病將殺之魏犨束胷見使者曰以君之靈不有寕也言不以病故自安寕距躍三百曲踊三百距躍超越也曲踊跳踊也百猶勵也盖三次勉勵為之乃舎之殺顛頡以狥于師立舟之僑以為戎右舟之僑故虢臣閔二年奔晉以代魏犨為先歸張本宋人使門尹般如晉師告急門尹般宋大夫時楚猶未觧宋圍公曰宋人告急舎之則絶告楚不許我欲戰矣齊秦未可若之何先軫曰使宋舎我而賂齊秦藉之告楚我執曹君而分曹衛之田以賜宋人欲以激怒楚人楚愛曹衛必不許也喜賂怒頑能無戰乎言齊秦喜得宋賂而怒楚之頑必自戰也不可告請故曰頑公說執曹伯分曹衛之田以畀宋人公羊傳畀者何與也其言畀宋人何與使聼之也與使聼其獄也曹伯之罪何甚惡也其甚惡奈何不可以一罪言也穀梁傳入者内弗受也日入惡入者也以晉侯而斥執曹伯惡晉侯也惡其忌怨深畀與也其曰人何也不以晉侯畀宋公也畀上與下之詞故不以侯畀公曹雖即楚文之昭也晉侯茍修其訓典善其辭令以鎮撫之曹伯羸者畏威懐徳自當翻然改圖乃遽興師而入其國執其君又分其田暴矣然使執之以歸京師俾天子治其即楚之罪猶不失為霸討今特欲致楚與戰乃以曹伯畀宋人而激其怒何其譎也雖一戰而勝為諸夏盟主其功雖多其道不足尚也夏四月己巳晉侯齊師宋師秦師及楚人戰于城濮楚師敗績左傳楚子入居于申申在方城内故曰入使申叔去穀二十六年由叔戍榖使子玉去宋曰無從晉師晉侯在外十九年矣而果得晉國晉侯生十七年而亡亡十九年而反凡三十六年至此年四十矣險阻艱難備嘗之矣民之情偽盡知之矣天假之年而除其害除惠懐吕郤天之所置其可廢乎軍志曰允當則歸軍志兵書允當無求過分又曰知難而退又曰有徳不可敵此三志者晉之謂矣子玉使伯棼請戰伯棼子越椒也鬬伯比之孫曰非敢必有功也願以閒執讒慝之口閒執猶塞也讒慝若蒍賈譏子玉之言王怒少與之師唯西廣東宫與若敖之六卒實從之楚有左右廣西廣即右廣也又大子有宫甲分取以給之若敖楚武王之祖父葬若敖者子玉之祖也六卒子玉宗人之兵六百人言不悉師以益之子玉使宛春告于晉師曰宛春楚大夫請復衛侯而封曹臣亦釋宋之圍衛侯未出竟曹伯見執在宋已失位故言復衛封曹子犯曰子玉無禮哉君取一臣取二取一謂釋宋取二謂復曹衛不可失矣言可伐先軫曰子與之定人之謂禮楚一言而定三國我一言而亡之我則無禮何以戰乎不許楚言是棄宋也救而棄之謂諸侯何言將為諸侯所怪楚有三施我有三怨怨讎已多将何以戰不如私許復曹衛以攜之攜離也執宛春以怒楚既戰而後圖之湏勝負決乃定計公說乃拘宛春于衛且私許復曹衛曹衛告絶于楚子玉怒從晉師晉師退軍吏曰以君辟臣辱也且楚師老矣何故退子犯曰師直為壯曲為老豈在久乎㣲楚之惠不及此重耳過楚楚成王有贈送之惠退三舎辟之所以報也踐晉侯辟君三舎之言背惠食言以亢其讎亢猶當也讎謂楚我曲楚直其衆素飽直氣盈飽不可謂老我退而楚還我将何求若其不還君退臣犯曲在彼矣退三舍楚衆欲止子玉不可夏四月戊辰晉侯宋公齊國歸父崔夭秦小子憖次于城濮國歸父崔夭齊大夫小子憖秦穆公子楚師背酅而舍酅丘陵險阻名晉侯患之聼輿人之誦恐衆畏險故聼其歌誦曰原田每每舎其舊而新是謀髙平曰原喻晉君羙盛若原田之草每每然可以謀立新功不足念舊惠公疑焉疑衆謂已背舊謀新子犯曰戰也戰而捷必得諸侯若其不捷表裏山河必無害也晉國外河而内山公曰若楚惠何欒貞子曰漢陽諸姬楚實盡之水北曰陽姬姓之國在漢北者楚盡滅之思小惠而􅁯大恥不如戰也晉侯夢與楚子搏搏手搏楚子伏已而盬其腦盬啑也是以懼子犯曰吉我得天楚伏其罪吾且柔之矣晉侯上向故得天楚子下向地故伏其罪腦所以柔物子犯審見事宜故權言以答夢子玉使鬬勃請戰鬬勃楚大夫子上曰請與君之士戯君馮軾而觀之得臣與寓目焉寓寄也晉侯使欒枝對曰寡君聞命矣楚君之惠未之敢忘是以在此為大夫退其敢當君乎既不獲命矣不獲止命敢煩大夫謂二三子戒爾車乗敬爾君事詰朝將見詰朝平旦晉車七百乗韅靷鞅靽七百乗五萬二千五百人在背曰韅在胸曰靷在腹曰鞅在後曰靽言駕乗修備晉侯登有莘之虛以觀師有莘杜注故國名今河南陳畱縣有莘城山東曹縣有莘仲集其地接二縣界曰少長有禮其可用也遂伐其木以益其兵伐木以益攻戰之具輿曳柴亦是也己巳晉師陳于莘北胥臣以下軍之佐當陳蔡子玉以若敖之六卒将中軍曰今日必無晉矣子西将左子西鬬宜申子上将右胥臣䝉馬以虎皮先犯陳蔡陳蔡奔楚右師潰陳蔡屬楚右師狐毛設二旆而退之旆大旗又建二旆而退使若大將稍却欒枝使輿曳柴而偽遁曳柴起塵詐為衆走楚師馳之楚師見二旆先退曳柴塵起以為晉師已走故馳而逐之原軫郤溱以中軍公族横擊之公族公所率之軍狐毛狐偃以上軍夾攻子西楚左師潰楚師敗績子玉收其卒而止故不敗晉師三日館穀館舍也食楚軍穀三日及癸酉而還公羊傳此大戰也曷為使㣲者㣲者謂楚稱人子玉得臣也子玉得臣則其稱人何貶曷為貶大夫不敵君也書晉及以主是戰者實晉侯也盖子玉雖從晉師而初告于晉曰請復衞侯而封曹臣亦釋宋之圍則固無必戰之心也自先軫獻計許曹衛以攜之拘宛春以怒之必欲致楚與戰則宜書晉及明矣夫齊桓既殁楚勢益張滅黄而霸主不能䘏敗徐而諸大夫不能救執中國盟主而在㑹者不敢争今又戍穀逼齊合兵圍宋非一戰而勝之無以奪蠻荆之氣定中夏之心非若齊桓師次召陵楚即受盟猶可以禮服也所遇不同故為謀亦異其有功於天下則一也楚殺其大夫得臣楚始書大夫左傳初楚子玉自為瓊弁玉纓弁以鹿子皮為之纓結于頷下而垂者瓊玉之别名次之以飾弁及纓詩云㑹弁如星未之服也先戰夢河神謂已曰畀余余賜女孟諸之麋孟諸杜注宋藪澤今河南歸徳府有孟諸澤水草之交曰麋弗致也大心與子西使榮黄諫大心子玉之子子西子玉之族子玉剛愎故因榮黄以諫榮黄榮季也弗聼榮季曰死而利國猶或為之况瓊玉乎是糞土也而可以濟師将何愛焉因神之欲以附百姓之願濟師之理弗聼出告二子曰非神敗令尹令尹其不勤民實自敗也盡心盡力無所愛惜為勤既敗王使謂之曰大夫若入其若申息之老何申息二邑子弟皆從子玉而死言何以見其父老子西孫伯曰孫伯即大心得臣将死二臣止之曰君其將以為戮及連榖而死連榖杜注楚地當在楚方城之外王無赦命故自殺晉侯聞之而後喜可知也喜見于顔色曰莫余毒也已蒍吕臣實為令尹奉己而已不在民矣言其自守無大志敗績固得臣之罪然楚子既知晉侯非子玉所可敵則當申無從晉師之命而禁止之乃怒而少與之師及其敗而致之死則棄将棄師之罪其誰任之哉故稱國以殺而不去其官也衛侯出奔楚諸侯失地名衛侯之奔不名盖其出也使元咺奉叔武以受盟則國猶其國也或曰晉文以私怨逐衛侯若書名則與鄭伯突蔡侯朱自失其國者無别矣義亦可通五月癸丑公㑹晉侯齊侯宋公蔡侯鄭伯衛子莒子盟于踐土踐土杜注鄭地今屬河南開封府左傳甲午至于衡雍晉師癸酉自城濮還二十二日為甲午衡雍杜注鄭地滎陽卷縣在今河南原武縣西北作王宫于踐土襄王聞晉戰勝自往勞之故為作宫鄉役之三月鄉猶屬也城濮役之前三月鄭伯如楚致其師為楚師既敗而懼使子人九行成于晉子人氏九名晉欒枝入盟鄭伯五月丙午晉侯及鄭伯盟于衡雍丁未獻楚俘于王駟介百乗徒兵千駟介四馬被甲徒兵歩卒鄭伯傅王用平禮也傅相也以周平王享晉文侯仇之禮享晉侯己酉王享醴命晉侯宥王命尹氏及王子虎内史叔興父策命晉侯為侯伯尹氏王子虎皆王卿士叔興父王大夫以策書命晉侯為伯也周禮九命作伯賜之大輅之服戎輅之服大輅金輅也祭祀所乘其服鷩冕戎輅戎車也兵事所乘其服韋弁彤弓一彤矢百玈弓矢千彤赤色玈黑色弓一矢百則矢千弓十矣諸侯賜弓矢然後専征伐秬鬯一卣秬黒黍鬯香酒所以降神卣器名虎賁三百人曰王謂叔父敬服王命以綏四國糾逖王慝逖逺也有惡于王者糾而逺之晉侯三辭從命曰重耳敢再拜稽首奉揚天子之丕顯休命丕大也休羙也受策以出出入三覲出入猶去來也從來至去凡三見王衛侯聞楚師敗懼出奔楚遂適陳自襄牛出使元咺奉叔武以受盟奉使攝君事元咺衛大夫叔武衛侯弟癸亥王子虎盟諸侯于王庭踐土宫之庭書踐土别于京師要言曰皆奨王室無相害也有渝此盟明神殛之俾隊其師無克祚國隊隕也及其元孫無有老幼甚言變盟之禍君子謂是盟也信謂晉于是役也能以徳攻以文徳教民而後用之榖梁傳諱㑹天王也實㑹天王而文不言若諸侯自共盟然踐土之㑹天王下勞晉侯削而不書存王朝之體也然下書魯君之朝則亦不沒其實矣𫝊言王子虎盟諸侯于王庭而經不書王人虎雖涖盟而不與歃也齊非霸主而序宋公之上主盟者以勢之彊弱相上下也子者君未踰年之稱晉文怒衛成奔楚立叔武以受盟故稱子以著晉文廢置諸侯之罪而叔武不敢自安之義亦可見矣陳侯如㑹公羊傳其言如㑹何後㑹也榖梁傳如㑹外乎㑹也于㑹受命也外乎㑹不及序也受命于㑹故書如㑹陳侯本附於楚今以晋勝為踐土之盟天王在焉懼而歸命願與斯㑹春秋喜其悔罪知反故曰如㑹如者緩而不迫不及盟亦不求盟也與書乞盟者異矣公朝于王所公羊傳曷為不言公如京師天子在是也天子在是則曷為不言天子在是不與致天子也諸侯宜往朝天子無致天子之禮穀梁傳朝不言所言所者非其所也非京師朝王所者王在踐土非京師也古者諸侯五年一朝必於廟禮也若王時巡則朝於方嶽其時有定其地有常今天王下勞晋侯而公朝焉則非其時與地矣故曰言所非其所也然天子在是其可以不朝乎故春秋不以諸侯就朝為非而以王所非其所為貶正其夲之義也諸侯皆朝而獨書公乃魯史記事之法六月衛侯鄭自楚復歸于衛衛元咺出奔晋左傳或訴元咺于衛侯曰立叔武矣其子角從公公使殺之角元咺子咺不廢命奉夷叔以入守夷叔叔武夷諡也六月晉人復衛侯以叔武受盟于踐土故聼衛侯歸甯武子與衛人盟于宛濮武子甯俞也宛濮杜注陳畱長垣縣西南有宛亭近濮水曰天禍衛國君臣不恊以及此憂也衛侯欲與楚國人不欲故不和今天誘其衷衷中也使皆降心以相從也不有居者誰守社稷不有行者誰扞牧圉牛曰牧馬曰圉不恊之故用昭乞盟于爾大神以誘天衷以誘掖中心之天理自今日以往既盟之後行者無保其力居者無懼其罪有渝此盟以相及也以惡相及明神先君是糾是殛國人聞此盟也而後不貳衛侯先期入不信叔武甯子先長牂守門以為使也與之乘而入長牂衛大夫甯子患公欲速故先入欲安喻國人公子歂犬華仲前驅二子衛大夫叔武將沐聞君至喜捉髮走出前驅射而殺之公知其無罪也枕之股而哭之歂犬走出公使殺之元咺出奔晋元咺以衛侯驅入殺叔武故至晋愬之榖梁傳自楚楚有奉焉爾奉藉楚之力復者復中國也中國猶國中也歸者歸其所也鄭之名失國也衛侯出奔不名歸國何以名殺叔武也殺叔武何以不書或衛侯不告魯史夲無其文或魯史承告歸獄於歂犬孔子覈其情實而削之乃斥衛侯之名志元咺之奔以示其義也其稱復歸國乃所宜復也陳侯款卒秋把伯姬來伯姬莊公女歸寕曰來魯嘗遣師入把數加侵辱伯姬來魯将以謝過而求平然莊公既殁無歸寕之義非禮也公子遂如齊魯嘗以楚師伐齊取榖及晉文主霸齊魯均往受盟齊不敢背晋盟而報魯怨魯因使公子遂聘齊講好亦足見霸權之立可以平諸侯之憾而息其争也附錄左傳城濮之戰晋中軍風于澤牛馬因風而走皆失之亡大旆之左旃大旆旗名繫旐曰旆通帛曰旃祁瞞姦命掌此二事而不修為奸軍令司馬殺之以徇于諸侯使茅茷代之師還壬午濟河舟之僑先歸士㑹攝右士㑹随武子士蒍之孫攝右權代舟之僑秋七月丙申振旅愷以入于晋愷樂也師出有功則愷歌入國獻俘授馘授數也數所截耳飲至大賞徴㑹討貳徴召諸侯将冬㑹于温殺舟之僑以徇于國民于是大服君子謂文公其能刑矣三罪而民服三罪顛頡祁瞞舟之僑詩云惠此中國以綏四方不失賞刑之謂也詩大雅民勞篇冬公㑹晉侯齊侯宋公蔡侯鄭伯陳子莒子邾子秦人于溫穀梁無齊侯秦與諸侯㑹始此左傳冬㑹于温討不服也討衛許榖梁傳諱㑹天王也天王狩于河陽狩榖梁作守河陽即温盖古孟津周畿内地襄王以賜晋文公杜注晋地河内有河陽縣今屬河南懷慶府古河陽城在縣西三十里左傳是㑹也晋侯召王以諸侯見且使王狩晋侯大合諸侯而欲尊事天子以為名義自嫌强大不敢朝周喻王出狩因得盡羣臣之禮仲尼曰以臣召君不可以訓故書曰天王狩于河陽言非其地也言若天子自行出狩河陽非王狩地失地故書且明徳也隠晋文召君之闕以明其功徳河陽之狩趙盾之弑泄冶之罪皆變例以起義之詞故特稱仲尼以明之公羊傳狩不書此何以書不與再致天子也魯子曰温近而踐土逺也此魯子一說也温近狩地故可言狩踐土逺狩地故不言狩榖梁傳全天王之行也時實晋文公召王以臣不可致君因天子有巡守之禮故以自行為文為若将守而遇諸侯之朝也為天王諱也水北為陽山南為陽温河陽也晋侯召王而孔子書曰天王狩于河陽為若将狩而遇諸侯之朝者所以尊周而全晋也盖晋侯之召王則非而其夲心乃欲率諸侯以尊周室若直書以示貶則無以異於心跡皆悖而躬為大惡者故原其情而為之諱此聖人待人之忠恕也踐土之㑹出自天王故削而不書以掩其迹温之㑹出自晋侯故變文起義以原其情非聖人莫能修此類其較著者也壬申公朝于王所公羊傳其日何錄乎内也朝于外為失禮錄此以見魯之非榖梁傳朝于廟禮也于外非禮也獨公朝與諸侯盡朝也其日以其再致天子故謹而日之主善以内謂公朝于王所目惡以外謂晋侯再致天子言曰公朝逆辭也而尊天子公若朝于廟當言如京師今言公朝是逆常之辭也雖逆常而實主于敬王故曰尊天子㑹于温言小諸侯温河北地以河陽言之大天子也温即河陽小諸侯故以一邑言之尊天子故以廣大言之日繫于月月繫于時壬申公朝于王所其不月失其所繫也以為晋文公之行事為已傎矣以臣召君顛倒上下日不繫于月猶諸侯不宗于天子朝繫日見先狩而後朝也有日而無月盖舊史之闕晋人執衛侯歸之于京師左傳衛侯與元咺訟争殺叔武事甯武子為輔鍼荘子為坐士榮為大士元咺不宜與君對坐故使鍼莊子代衛侯為坐獄之主甯子為輔位髙故先言之大士治獄官也以其主獄事與晋之獄官對理質正衛侯不勝三子詞屈殺士榮刖鍼荘子謂甯俞忠而免之執衛侯歸之于京師寘諸深室深室别為囚室甯子職納槖饘焉槖衣囊饘糜也甯子以君在幽囚故親以衣食為己職言其忠至所慮者深公羊傳歸之于者何歸于者何歸之于者罪已定矣歸于者罪未定也罪未定則何以得為伯討歸之于者執之于天子之側者也罪定不定已可知矣執于天子之側已白天子罪定不定自在天子故言已可知歸于者非執之于天子之側者也罪定不定未可知也未得白天子分别之者故曰未可知衛侯之罪何殺叔武也何以不書為叔武諱也春秋為賢者諱何賢乎叔武讓國也其讓國奈何文公逐衛侯而立叔武叔武辭立而他人立則恐衛侯之不得反也故于是已立然後為踐土之㑹治反衛侯衛侯得反曰叔武簒我元咺争之曰叔武無罪終殺叔武元咺走而出此晉侯也其稱人何貶曷為貶衛之禍文公為之也文公為之奈何文公逐衛侯而立叔武使人兄弟相疑放乎殺母弟者文公為之也放至也榖梁傳此入而執其不言入何也不外王命于衛也入者自外來晋以王命討衛衛為王之土故曰不外王命歸之于京師緩辭也斷在京師也衛元咺自晋復歸于衛左傳元咺歸于衛立公子瑕瑕衛公子適也公羊傳自者何有力焉者也得晋之力以歸此執其君其言自何怪咺訴執其君晋實主之為叔武争也解晋助咺之故榖梁傳自晋晋有奉焉爾復者復中國也歸者歸其所也衛侯雖有殺叔武之罪然於元咺為君晋文為臣執君故衛侯不名而書晋人示不得為霸討也歸之于者執之于天子之側其罪已定矣特歸其人于京師耳晋厲公之執曹伯書歸于京師盖白其事於王而不敢専治其罪所以得為霸討而稱爵也大夫歸不言復必諸侯也而後言復國其所自有有歸道也大夫言復者抗也元咺復歸宋魚石晋欒盈復入皆抗辭也諸侯遂圍許左傳丁丑諸侯圍許㑹温諸侯也丁丑十月十五日榖梁傳遂繼事也承上文之事晋帥諸侯圍許雖曰討其不朝于河陽然當時滕薛把邾之屬不朝者衆矣盖齊桓既殁諸侯南嚮陳蔡鄭許且與楚連兵以圍宋城濮之後蔡鄭受盟陳亦如㑹惟許再㑹不至故帥諸侯圍之盖許在鄭南逺晋而近楚其亦懲於江黄之滅霸國不能救而姑附楚以紓禍與曹伯襄復歸于曹遂㑹諸侯圍許左傳晋侯有疾曹伯之豎侯獳貨筮史豎掌通内外者姓侯名獳史晋史使曰以曹為解齊桓公為㑹而封異姓封郉衛今君為㑹而滅同姓曹叔振鐸文之昭也叔振鐸曹始封君文王之子先君唐叔武之穆也且合諸侯而滅兄弟非禮也與衛偕命私許復曹衛而不與偕復非信也同罪異罰非刑也衛已復故禮以行義信以守禮刑以正邪舍此三者君将若之何公說復曹伯遂㑹諸侯于許榖梁傳復者復中國也天子免之因與之㑹其曰復通王命也免之于宋身未反國因㑹于許即從反國之辭通王命遂繼事也曹伯何以名不能執義陳辭而貨筮史以求免其歸之道非所以歸也不書所自以言自晋則身方在宋言自宋則釋之者晋故苐曰復歸附録左傳晋侯作三行以禦狄荀林父將中行屠擊将右行先蔑将左行晋置上中下三軍今復置三行以辟天子六軍之名三行無佐疑大夫帥日講春秋解義卷二十一
