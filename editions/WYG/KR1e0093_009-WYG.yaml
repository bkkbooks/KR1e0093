body:
  text: 欽定四庫全書日講春秋解義卷九莊公公名同桓公之子母文姜諡法勝敵克壯曰莊周莊王四年魯莊公十二年莊王崩子僖王立莊十七年僖王崩子恵王立鄭子儀元年魯莊公十四年鄭傅瑖殺子儀而納厲公莊二十一年厲公卒子文公立齊襄公五年魯莊公八年襄公弑莊九年齊桓公小白入于齊是年齊管仲為政宋莊公十八年魯莊公二年宋莊公卒子閔公捷立莊十二年閔公弑弟桓公御説立晉翼晉侯緡十二年緡之二十七年魯莊公之十六年也曲沃武公伐晉滅之曲沃武公二十三年魯莊公十六年滅晉侯緡周僖王命曲沃伯以一軍為晉侯始更號曰晉武公魯莊公十七年武公卒子獻公佹諸立衛恵公七年黔牟二年魯莊公六年齊納恵公放黔牟于周莊二十五年恵公卒子懿公赤立蔡哀侯二年魯莊公十年楚敗蔡師執哀侯以歸莊十九年哀侯卒于楚蔡人立其子肸為繆侯曹莊公九年魯莊公二十三年曹莊公卒子僖公夷立魯莊公三十二年僖公卒子昭公班立滕詳見隠公元年陳魯莊公元年十月莊公林卒子宣公杵臼立杞詳見隠公元年及僖公元年薛魯莊公三十一年薛伯卒邾魯莊公十六年邾子克卒即儀父也邾子瑣立莊公二十八年邾子瑣卒文公蘧蒢立許許叔入許五年即僖公四年許穆公新臣也小邾魯莊公五年郳黎来来朝詳見隠公元年楚武王四十八年魯莊公四年卒子文王熊貲立莊十九年文王卒子堵敖熊囏立莊二十二年熊惲弑兄堵敖代立是為楚成王史記以莊十八年為堵敖元年堵敖立五年遇弑楚成立十六年齊桓公以兵侵楚至陘山莊公三十年楚子文為令尹秦詳見隠公元年吳詳見隠公元年越見上註欽定四庫全書日講春秋解義卷九莊公名同桓公之子母文姜以莊王四年即位諡法勝敵克壯曰莊元年春王正月左傳元年春不稱即位文姜出故也公羊傳公何以不言即位春秋君弑子不言即位君弑則子何以不言即位隠之也孰隠隠子也隠痛是子之禍穀梁傳繼弑君不言即位正也繼弑君不言即位之為正何也曰先君不以其道終則子不忍即位也不書即位繼故而不忍行即位之禮也閔公僖公亦然然閔僖之立不忘討賊故叔牙慶父終無所逃其死莊公則宴然安於其位而且與仇人親暱焉天理滅熄罪不容於誅矣三月夫人孫于齊左傳三月夫人孫于齊不稱姜氏絶不為親禮也公羊傳孫者何孫猶孫也孫猶遯也内諱奔謂之孫夫人固在齊矣其言孫于齊何念母也從莊公念母起見正月以存君念母以首事正月以存君者正月嵗終復始臣子喜其君父與嵗終而復始執贄以存之今此練祭亦是臣子閔君父往年此日没今年復此日存而禮祭之取法存君也念母以首事者夫人當首營祭事時莊公將為練祭念母而欲迎之也夫人何以不稱姜氏貶曷為貶與弑公也其與弑公奈何夫人譖公于齊侯公曰同非吾子齊侯之子也齊侯怒與之飲酒于其出焉使公子彭生送之于其乗焉乗將上車時搚幹而殺之幹脇也搚折聲也念母者所善也則曷為于其念母焉貶不與念母也念母則忘父背夲之道也穀梁傳孫之為言猶孫也諱奔也接練時錄母之變始人之也于練時感夫人不與祭故始以人道録之不言氏姓貶之也人之于天也以道受命于人也以言受命不若于道者天絶之也不若于言者人絶之也臣子大受命臣子受天與君父之命義得貶夫人桓公之死實由姜氏乃魯之臣子不共戴天之仇在莊公雖有母子之私恩不得以奪君父之大義也春秋於其孫齊不稱姜氏𫝊曰絶不為親而人道之大防立矣不稱姜氏而曰夫人所以罪魯之臣子不知其為賊而使泰然居夫人之位也内諱奔曰孫臣子辭也姜氏以桓十八年如齊無歸魯之文盖以滛與聞乎弑無顔告廟故史不書至書孫于齊則往年之從喪而歸魯具見矣夏單伯逆王姬逆左氏作送公羊傳單伯者何吾大夫之命乎天子者也諸侯大夫例稱名以命于天子故稱字何以不稱使天子召而使之也逆之者何使我主之也曷為使我主之天子嫁女于諸侯必使諸侯同姓者主之諸侯嫁女于大夫必使大夫同姓者主之穀梁傳單伯者何吾大夫之命乎天子者也命大夫故不名也其不言如何也其義不可受于京師也其義不可受于京師何也曰躬君弑于齊使之主婚姻與齊為禮其義固不可受也單伯為魯大夫之命於天子者也諸侯之大夫命於天子則不名比於王臣也逆王姬使魯為主也天子嫁女于諸侯必使諸侯同姓者主之魯方有喪而使主婚姻非禮也莊公忘不共戴天之仇不辭而與齊為禮其惡不待貶而見矣秋築王姬之館于外左傳秋築王姬之館于外為外禮也外城外也公羊傳何以書譏何譏爾築之禮也于外非禮也于外何以非禮築于外非禮也其築之何以禮主王姬者必為之改築主王姬者則曷為必為之改築于路寢則不可小寢則嫌路寢則外内無别小寢則䙝凟皆所以遠别也羣公子之舍謂女公子也則以卑矣其道必為之改築者也穀梁傳築禮也于外非禮也築之為禮何也主王姬者必自公門出于廟則己尊于寢則己卑為之築節矣築之外變之正也築之外變之為正何也仇讎之人非所以接婚姻也衰麻非所以接弁冕也其不言齊侯之来逆何也不使齊侯得與吾為禮也魯為王室懿親其主王姬舊矣館于國中宜有常所而特築於外盖知其不可而為之也然以仇讎而接婚姻以衰麻而接弁冕築館于外遂可以自掩乎竊按齊魯之邦交以察莊公之用心非畏王命而不敢辭乃欲藉是以結齊好也故自是以後㑹伐同狩與齊昵好絶無閒疑廢人倫滅天理莫此為甚故春秋於主王姬事特書屢書以正莊公忘親暱讎之大惡云冬十月乙亥陳侯林卒穀梁傳諸侯日卒正也王使榮叔来錫桓公命此書錫命之始公羊傳錫者何賜也命者何加我服也其言桓公何追命也追命死者故舉諡穀梁傳禮有受命無来錫命錫命非正也生服之死行之禮也生不服死追錫之不正甚矣天子錫命諸侯車服禮器所以旌有功襃有徳也桓公身為大惡莊王不能討之於生前及其既死又從而追錫之是使亂臣賊子不惟免罪而反以邀寵非小失也夫王者履天位奉天道賞則承天命罰則行天討故王必稱天所以法天也今莊王寵簒弑以亂天常無天甚矣故不稱天王姬歸于齊公羊傳何以書我主之也穀梁傳為之中者歸之也魯主王姬之嫁在他公時則以為常事而不書此獨屢書而不厭其煩以歸于齊故也不書伯季尊王姬而異於諸侯之女也不書来逆杜氏預謂公不與接非也齊侯傲慢實未至魯親迎耳果来魯則宜特書以見義矣齊師遷紀郱鄑郚此書遷之始郱杜注在東莞臨朐縣東南今屬山東青州府鄑訾同音杜注都昌縣西有訾城都昌今山東昌邑縣也有訾亭社在縣西郚杜注在朱虚縣東南今山東安丘縣西南有郚城公羊傳遷之者何取之也取之則曷為不言取之也為襄公諱也外取邑不書此何以書大之也何大爾自是始滅也穀梁傳紀國也郱鄑郚國也或曰遷紀于郱鄑郚郱鄑郚皆紀邑遷者徙其民而取其地也邑不書遷遷不書師今齊將滅紀先取其旁邑其書師遷見紀民猶足與守而齊用大衆廹之以為己屬也按宋人遷宿齊人遷陽宿與陽國也而遷書人郱鄑郚邑也而遷書師此春秋特筆著紀季入齊紀侯去國之由以見王綱縱弛小國困敝而暴亂者得以逞其志也二年春王二月葬陳莊公夏公子慶父帥師伐於餘丘於餘丘杜注國名公羊傳於餘丘者何邾婁之邑也曷為不繫乎邾婁國之也曷為國之君存焉爾穀梁傳國而曰伐於餘丘邾之邑也其曰伐何也公子貴矣師重矣而敵人之邑公子病矣病公子所以譏乎公也其一曰君在而重之也慶父公庶兄或曰弟於餘丘或國或邑不可考以慶父主兵為後弑子般閔公之禍所託始故謹而書之魯在春秋中弑逆之禍三見皆以貴戚主兵威柄下移卒為君父之患公子翬仲遂之變與慶父同出一轍也且莊公於不共戴天之仇釋而不圖乃侵伐小國師出無名徒使公族擅兵禍及國本聖人特書伐所以著履霜之戒也秋七月齊王姬卒公羊傳外夫人不卒此何以卒録焉爾曷為録焉爾我主之也穀梁傳為之主者卒之也主其嫁則有兄弟之恩死則服之服之故書卒内女嫁為諸侯妻則書卒王姬而比内女主其嫁也按戴記齊告王姬之喪魯莊公為之大功或曰由魯嫁故為之服姊妹之服書於􅁽者以君為之服也莊公之盡禮仇讎而不知有父遂至於此故屢書以正其汩大倫滅天理之罪云冬十有二月夫人姜氏㑹齊侯于禚禚公羊作郜杜注齊地左𫝊定九年齊侯致禚媚杏于衛杜注三邑皆齊西界據此當為齊魯衛分界之地左傳二年冬夫人姜氏㑹齊侯于禚書姦也穀梁傳婦人既嫁不踰竟踰竟非正也婦人不言㑹言㑹非正也饗甚矣謂四年饗齊侯于祝丘書夫人見於魯為國君之母書姜氏見於齊襄為同氣之人乃靦然出㑹甘為禽獸之行直書其事以著姜氏齊侯之惡而莊公之罪亦不可逭矣乙酉宋公馮卒三年春王正月溺㑹齊師伐衛左傳三年春溺㑹齊師伐衛疾之也公羊傳溺者何吾大夫之未命者也穀梁傳溺者何也公子溺也其不稱公子何也惡其會仇讎而伐同姓故貶而名之也衛朔奔齊齊欲納之時天王已絶朔而立公子黔牟矣莊公乃興師㑹仇讎逆王命以伐同姓納不義之君直書其事不待貶而罪自見矣溺不稱公子内大夫之未命者也夏四月葬宋莊公穀梁傳月葬故也五月葬桓王左傳夏五月葬桓王緩也公羊傳此未有言崩者何以書葬盖改葬也穀梁傳𫝊曰改葬也改葬之禮緦舉下緬也緦五服最下緬藐逺也天子諸侯易服而葬以為交于神眀不可以純凶况其緬者乎故改葬之禮其服唯輕言緬釋所以緦也或曰郤尸以求諸侯言停尸七年以求諸侯㑹葬天子志崩不志葬必其時也何必焉舉天下而葬一人其義不疑也志葬故也危不得葬也曰近不失崩不志崩失天下也京師去魯不逺赴告之命可不踰旬而至史不志崩則亂可知獨隂不生獨陽不生獨天不生三合然後生凡生類禀靈知于天資形于二氣故曰母之子也可天之子也可尊者取尊稱焉卑者取卑稱焉其曰王者民之所歸往也桓王崩在桓十五年至是始葬或曰桓十八年𫝊載子儀黑肩之難是以緩或曰東遷之初尚有志歸葬於西周已而諸侯背叛王師傷敗故至此始葬不書公如又不書卿大夫往盖魯使㣲者會葬也秋紀季以酅入于齊酅杜注紀邑在齊國東安平縣今山東臨淄縣東有安平城又有酅亭左傳秋紀季以酅入于齊紀于是乎始判判分也言分為附庸始于此公羊傳紀季者何紀侯之弟也何以不名賢也何賢乎紀季服罪也其服罪奈何魯子曰請後五廟以存姑姊妹紀與齊讎小大不敵季知必亡故以酅首服請為五廟後以供祭祀存姑姊妹者言兄弟子姪亦隨國亡但外出之女有所歸趣而已穀梁傳酅紀之邑也入于齊者以酅事齊也入者内弗受也紀季紀侯之弟季字也諸侯兄弟貶則書名不貶則書字是時齊欲滅紀故紀季以邑入齊請為附庸以存先祀盖紀侯命之也夫棄君以避患挟地以附敵非人臣之義也而春秋於紀季無譏焉盖彊暴憑陵天子不能正隣國不能救宗社危亡計日可待不得已而屈己下敵以存五廟乃行權而不悖乎經與他公子之去國者異矣不書奔原其情也書入難辭盖閔之也冬公次于滑滑公羊穀梁作郎杜注鄭地在陳留襄邑縣北今河南睢州有滑亭左傳冬公次于滑將㑹鄭伯謀紀故也鄭伯辭以難厲公在櫟故凡師一宿為舍再宿為信過信為次公羊傳其言次于郎何刺欲救紀而後不能也穀梁傳次止也有畏也欲救紀而不能也紀將滅於齊公以師出次于滑欲㑹鄭伯謀紀鄭伯不㑹遂中止焉次者止也救而書次譏辭也魯於紀有婚姻之好於齊有君父之讎茍能救紀抑齊一舉而兩善并矣乃畏齊而中止故書公次于滑以譏師出之無名也四年春王二月夫人姜氏享齊侯于祝丘享公羊穀梁作饗祝丘杜注魯地穀梁傳饗甚矣饗齊侯所以病齊侯也兩君相見之禮曰享禮姑姊妹已嫁而反兄弟不與同席而坐况婦人輕去其國而用兩君相見之禮乎前曰㑹至是曰享凟䙝益甚矣經於孫齊去其氏以絶之自㑹禚以下復書夫人姜氏者盖揭其氏姓所以示之有别而正其亂倫之罪也三月紀伯姬卒穀梁傳外夫人不卒此其言卒何也吾女也適諸侯則尊同以吾為之變卒之也禮諸侯絶旁期姑姊妹嫁于國君者尊與己同則為之服大功變不服之例故書卒内女適諸侯尊同則為之服而史書其葬内女為諸侯夫人者七惟紀伯姬宋伯姬志卒志葬盖閔紀之亡襃共姬之賢而詳其本末也附錄左傳四年春王三月楚武王荆尸授師孑焉以伐隨尸陳也荆亦楚也更為楚陳兵之法孑者㦸也參用㦸為陳將齊授兵于廟故齊入告夫人鄧曼曰余心蕩蕩動散也鄧曼歎曰王禄盡矣盈而蕩天之道也先君其知之矣故臨武事將發大命而蕩王心焉若師徒無􅉛王薨于行國之福也王遂行卒于樠木之下樠木名也令尹鬭祈莫敖屈重除道梁溠時秘王喪故為竒兵更開直道梁橋也溠杜注溠水在義陽厥縣西東南入鄖水釋例云即漈水源出縣北在今湖廣隨州東南營軍臨隨隨人懼行成莫敖以王命入盟隨侯且請為㑹于漢汭而還汭内也謂漢西濟漢而後發喪夏齊侯陳侯鄭伯遇于垂齊謀取紀恐陳鄭為之援故結歡於二國是以三國遇垂而紀侯遂去也蘇氏以鄭伯為子儀然子儀之為君也微豈敢輕去國都逺與諸侯㑹此所書者實厲公也盖厲公善結四鄰之援諸侯親之故舊史以爵書而春秋亦不没其實耳紀侯大去其國左傳紀侯不能下齊以與紀季夏紀侯大去其國違齊難也公羊傳大去者何滅也孰滅之齊滅之曷為不言齊滅之為襄公諱也春秋為賢者諱何賢乎襄公復讎也何讎爾遠祖也哀公亨乎周鄭氏云懿始受譖而亨齊哀公是也紀侯譖之以襄公之為于此焉者事祖禰之心盡矣盡者何襄公將復讎乎紀卜之曰師喪分焉分半也師喪亡其半寡人死之襄公答卜者之辭不為不吉也遠祖者幾世乎九世矣九世猶可以復讎乎雖百世可也家亦可乎家謂大夫家曰不可國何以可國君一體也先君之恥猶今君之恥也今君之恥猶先君之恥也國君何以為一體國君以國為體諸侯世故國君為一體也今紀無罪此非怒與怒謂遷怒言怒紀之先祖遷之于子孫曰非也古者有眀天子則紀侯必誅必無紀者紀侯之不誅至今有紀者猶無眀天子也古者諸侯必有㑹聚之事相朝聘之道號辭必稱先君以相接然則齊紀無説焉不可以並立乎天下故將去紀侯者不得不去紀也有眀天子則襄公得為若行乎曰不得也不得則襄公曷為為之上無天子下無方伯緣恩疾者可也恩謂先祖之恩疾痛也因痛先祖而可復讎也穀梁傳大去者不遺一人之辭也言民之從者四年而後畢也紀侯賢而齊侯滅之不言滅而曰大去其國者不使小人加乎君子紀侯為齊所逼圖存不獲委宗廟於其弟而去之舉土地人民儀章器物悉委置之而不顧故曰大去凡失國宜書奔宜書名今於紀獨否閔其不得已而不忍罪之爾太王遷邠不以養人者害人權也鑿池築城與民死守弗去經也紀無太王轉敗為功以屈為伸之勢又不能守土誓死拱手以避敵其事固無足取特其不能下齊之志則殊有可悲者焉聖人以其不争而去為無罪故不以失國之君待之盖寓興滅繼絶之義於言外也六月乙丑齊侯葬紀伯姬公羊傳外夫人不書葬此何以書隠之也何隠爾其國亡矣徒葬于齊爾此復讎也曷為葬之滅其可滅葬其可葬此其為可葬奈何復讎者非將殺之逐之也以為雖遇紀侯之殯亦將葬之也穀梁傳外夫人不書葬此其書葬何也吾女也失國故隠而葬之國滅不書葬而紀伯姬書葬其義有二一則以内女之失所而閔之也一則以紀之夫人葬於齊侯為人道之變而著之也齊襄廹逐紀侯雖其夫人在殯而不及葬其惡甚矣乃欲以葬伯姬自掩乎故不稱齊人而目其君以斥其詐也秋七月冬公及齊人狩于禚禚公羊穀梁作郜公羊傳公曷為與微者狩齊侯也齊侯則其稱人何諱與讎狩也前此者有事矣後此者有事矣則曷為獨于此焉譏于讎者將壹譏而已故擇其重者而譏焉莫重乎其與讎狩也于讎者則曷為將壹譏而已讎者無時焉可與通通則為大譏不可勝譏故將壹譏而已其餘從同同孔氏穎達曰考諸古本𫝊及注同字之下皆無重語有者衍文穀梁傳齊人者齊侯也其曰人何也卑公之敵所以卑公也何為卑公也不復讎而怨不釋刺釋怨也齊侯書人隠辭也不忍公之與仇讎㑹獵也何以知其為齊君蒐狩非微者之事也不共戴天之讎而與之㑹獵以為樂且禚乃二年夫人姜氏㑹齊侯之地也莊公於是無羞惡之心矣五年春王正月夏夫人姜氏如齊師穀梁傳師而曰如衆也婦人既嫁不踰竟踰竟非禮也曰會曰享猶假禮為名兵衆會集之地以婦人翺翔其間為禽獸之行可謂無忌憚矣不言地者師之進止無常也前此㑹禚享祝丘皆厯日而返故書月至此歴月而返故書時使魯之臣子早為防閑豈至於此此春秋所以反復深責於莊公也秋郳犂来来朝郳公羊作倪犁公羊穀梁作黎郳杜注附庸國也東海昌慮縣東北有郳城今昌慮城在山東滕縣東南郳城在縣東左傳五年秋郳犁来来朝名未王命也公羊傳倪者何小邾婁也小邾婁國名小邾婁則曷為謂之倪未能以其名通也倪為小邾婁之都邑時未能為附庸不足以小邾婁名通故畧謂之倪黎来者何名也其名何微國也穀梁傳郳國也黎来微國之君未爵命者也郳為荒逺附庸之國其後數從齊桓以尊周室王命為小邾子犂来此時尚未受爵命也而来朝則已能自進於禮矣按春秋繁露云附庸字者方三十里名者方二十里犂来書名雖不得與邾儀父同而視介葛盧来不能行朝禮者則有閒矣冬公㑹齊人宋人陳人蔡人伐衛左傳冬伐衛納恵公也公羊傳此伐衛何納朔也曷為不言納衛侯朔辟王也朔得罪于王故辟王而不眀言納朔穀梁傳是齊侯宋公也其曰人何也人諸侯所以人公也其人公何也逆天王之命也三年齊師㑹魯伐衛以納朔不克至是又㑹四國之兵以納之不言納不與納也諸侯失國諸侯納之正也納朔何以非正王命黜之而立黔牟則已絶於衛矣乃違命以逞無君之罪可勝誅哉故直書以著其惡六年春王正月王人子突救衛此書救之始左傳六年春王人救衛公羊傳王人者何微者也子突者何貴也貴則其稱人何繫諸人也曷為繫諸人王人爾糓梁傳王人卑者也稱名貴之也稱子則非名名當為字善救衛也救者善則伐者不正矣王人微者稱字尊王命也自伐鄭以来王師不書此書救衛何天下方無道賤奪貴少陵長天子不能禁幸而發憤誅衛而諸侯不顧順逆黨同拒命其惡甚矣故特書救以為王師之出惟此猶合司馬九伐之法而重著王命不行正諸國亂常之罪也夏六月衛侯朔入于衛左傳夏衛侯入放公子黔牟于周放甯跪于秦甯跪衛大夫殺左公子洩右公子職乃即位君子以二公子之立黔牟為不度矣夫能固位者必度于本末而後立衷焉不知其本不謀知本之不枝弗强本末始終也衷節適也譬之𣗳木本弱者其枝必披非人力所能强成詩云本支百世詩大雅言文王本支俱茂蕃滋百世也公羊傳衛侯朔何以名絶曷為絶之犯命也犯天子命其言入何簒辭也穀梁傳其不言伐衛納朔何也不逆天王之命也不與諸侯得納天王之所絶入者内弗受也何用弗受也為以王命絶之也朔之名惡也朔入逆則出順矣朔出入名以王命絶之也春秋復國有以難詞而書入者有以逆詞而書入者衛朔藉五諸侯力抗王命以拒子突逐黔牟𫝑誠無難而書入逆辭也内不受也凡奔君返國未有不言復者衛侯鄭曹伯襄衛侯衎皆稱復歸是也蔡侯廬陳侯吳不稱復非奔君也朔奔君不言復而以内不受之辭書其惡大無可復之道也秋公至自伐衛公羊傳曷為或言致㑹或言致伐得意致㑹不得意致伐衛侯朔入于衛何以致伐不敢勝天子也穀梁傳惡事不致此其致何也不致則無用見公之惡事之成也公附仇讎􅅄不義連逆黨以抗王師而得其所欲歸告於廟著於冊直書其事而罪不容誅矣螟冬齊人来歸衛俘俘公羊穀梁作寳左傳冬齊人来歸衛寳文姜請之也公羊傳此衛寳也則齊人曷為来歸之衛人歸之也衛人歸之則其稱齊人何讓乎我也其讓乎我奈何齊侯曰此非寡人之力魯侯之力也穀梁傳以齊首之分惡于齊也使之如下齊而来我然惡戰則殺矣若衛自歸寳于齊而後齊以與魯以齊為首事則魯與王人戰罪惡差減也俘軍所獲也二𫝊經文作寳按書序稱遂伐三朡俘厥寳玉則俘者軍獲之總名而或取其人或取其器物皆可言俘也齊侯受天子之罪人連諸侯而納之衛故以寳賂齊而齊以分於四國焉書曰齊人来歸則黨惡之罪魯宋陳蔡同之而齊為首惡可知矣夫朔弑君兄逆王命茍有人心者皆知其惡而諸侯乃援之甚力觀衛寳之歸然後知所以喪其本心而甘為大惡者皆由於欲貨也孟子言終去仁義懐利以相接不至簒弑攘奪不厭其深得春秋之義也夫附録左傳楚文王伐申過鄧鄧祁侯曰吾甥也楚文王夫人鄧曼子故鄧侯以為甥止而享之騅甥耼甥養甥請殺楚子皆鄧甥仕于舅氏鄧侯弗許三甥曰亡鄧國者必此人也若不早圖後君噬齊喻不可及其及圗之乎圖之此為時矣鄧侯曰人將不食吾餘言自害其甥必為人所賤對曰若不從三臣抑社稷實不血食而君焉取餘言君無復餘弗從還年伐申還之年楚子伐鄧十六年楚復伐鄧滅之日講春秋解義卷九
