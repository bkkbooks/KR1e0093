body:
  text: 欽定四庫全書日講春秋解義卷三十二成公三年春王正月公㑹晉侯宋公衞侯曹伯伐鄭左傳三年春諸侯伐鄭次于伯牛討邲之役也伯牛杜注鄭地邲役在宣十二年遂東侵鄭鄭公子偃帥師禦之偃穆公子子游使東鄙覆諸鄤覆伏兵敗諸丘輿鄤丘輿杜注皆鄭地晉偏軍為鄭所敗故不書皇戌如楚獻㨗陽橋之役鄭實導楚故晉欲討貳而宋魯衞曹亦懼楚之無厭故雖從楚盟旋復㑹晉以伐鄭焉宋衞未葬而背殯越境以從金革之事且載於策書者不稱子而稱爵違禮忘親之惡不可掩矣辛亥葬衞穆公穆公羊作繆六月乃葬非禮也衞侯時有伐鄭之役故緩期而背殯從吉之罪亦因以見矣二月公至自伐鄭甲子新宮災三日哭公羊傳新宮者何宣公之宮也三年喪畢神主新入廟故謂新宮宣宮則曷為謂之新宮不忍言也親之精神所依而災孝子隱痛不忍正言也其言三日哭何廟災三日哭禮也新宮災何以書記災也穀梁傳新宮者禰宮也三日哭哀也其哀禮也廹近不敢稱諡㳟也其辭恭且哀以成公為無譏矣先儒謂不曰宣宮主未入也主未入則遇災而哭為非禮但古之新廟非毁舊更作也不過易檐改塗而已新主未入則舊主在焉不應以哭為譏若哭為得禮法不宜書姑發所疑以備參考乙亥葬宋文公七月而葬僭天子也陷先君於不義臣子之罪也傳載宋始厚葬必縁糜費踰度故襄事遲也宋君背殯從戎哀戚之意衰矣而徒為厚葬之虛文何益哉夏公如晉左傳夏公如晉拜汶陽之田鄭公子去疾帥師伐許左傳許恃楚而不事鄭鄭子良伐許許恃楚而不事鄭故鄭伐之然已實不明去就之義而專意事楚又何以責許之不共乎許鄭之蔽也楚越許而後至鄭無許則楚兵一出直履鄭郊乃逼之不已徒自毁其藩籬而隳内固之勢失謀亦甚矣公至自晉古者諸侯繼世三年喪畢以士服見於王而受命焉魯宣公除喪而朝於齊成公除喪而朝於晉以事天子之禮事強鄰慢上而辱國亦甚矣附録左傳晉人歸楚公子榖臣與連尹襄老之尸于楚以求知罃于是荀首佐中軍矣荀首知罃父故楚人許之王送知罃曰子其怨我乎對曰二國治戎臣不才不勝其任以為俘馘執事不以釁鼔以血塗鼔曰釁使歸即戮君之惠也臣實不才又誰敢怨王曰然則德我乎對曰二國圖其社稷而求紓其民各懲其忿以相宥也兩釋纍囚以成其好二國有好臣不與及其誰敢德王曰子歸何以報我對曰臣不任受怨君亦不任受徳無怨無德不知所報王曰雖然必告不榖對曰以君之靈纍臣得歸骨于晉寡君之以為戮死且不朽若從君之惠而免之以賜君之外臣首稱于異國君曰外臣首其請于寡君而以戮于宗亦死且不朽若不獲命而使嗣宗職次及于事而帥偏師以修封疆雖遇執事其弗敢違其竭力致死無有二心以盡臣禮所以報也王曰晉未可與爭重為之禮而歸之秋叔孫僑如帥師圍棘棘杜注汶陽田之邑在濟北蛇丘縣季氏私考曰今當為肥鄉縣地左傳秋叔孫僑如圍棘取汶陽之田棘不服故圍之僑如叔孫得臣子公羊傳棘者何汶陽之不服邑也其言圍之何不聽也不聽叛也棘為汶陽之邑復故邑而民不服蓋魯是時初稅畝作丘甲賦役日重棘雖復歸故國所以不願為之民也歟成公不知薄稅歛輕力役修德政以來之而命將董師環而攻焉失撫綏之義矣大雩晉郤克衞孫良夫伐廧咎如廧公羊作將榖梁作牆廧咎如杜注赤狄别種左傳晉郤克衞孫良夫伐廧咎如討赤狄之餘焉廧咎如潰上失民也廧咎如為赤狄别種先是晉滅潞氏甲氏及畱吁餘衆散入廧咎如故復興是役此逐利之師也楚方蹂藉中原晉人不修霸業而敝敝焉惟狄之務摟與國以伐之其為國可知矣冬十有一月晉侯使荀庚來聘晉來聘之始衞侯使孫良夫來聘丙午及荀庚盟丁未及孫良夫盟聘而遂盟始此左傳冬十一月晉侯使荀庚來聘且尋盟尋元年赤􅁄盟荀庚林父之子衞侯使孫良夫來聘且尋盟尋宣七年盟公問諸臧宣叔曰中行伯之于晉也其位在三下卿孫子之于衞也位為上卿將誰先對曰次國之上卿當大國之中中當其下下當其上大夫降一等小國之上卿當大國之下卿中當其上大夫下當其下大夫降大國二等上下如是古之制也衞在晉不得為次國晉為盟主其將先之古制公為大國侯伯為次國子男為小國春秋時以強弱為大小故衞雖侯爵猶為小國計等則衞小國之上卿與晉大國之下卿名位正敵以盟主故先晉丙午盟晉丁未盟衞禮也公羊傳此聘也其言盟何聘而言盟者尋舊盟也榖梁傳其日公也傳例盟前定則不日後定則日此盟公雖在位亦以非前定故日之來聘而求盟不言及者以國與之也不言其人亦以國與之也不言及謂凡書來盟者若文十五年宋華孫來盟宣七年衞孫良夫來盟是也此先聘而後盟故不言來盟總言及而不復著其人亦舉國為主之辭不言求兩欲之也諸侯有聘而無盟聘禮也盟非禮也然茍出於君命則書使來盟而不言聘今書使來聘而别言盟則二大夫生事而專盟也魯不能以禮却之其何能國乎第書及為公諱也鄭伐許鄭專事楚而絶晉復馮弱犯寡一歲之中再伐鄰國不亦甚乎直舉國名傳無其説孔氏穎達以為告辭畧故史異文是也附録左傳十二月甲戌晉作六軍為六軍僭也韓厥趙括鞏朔韓穿荀騅趙旃皆為卿賞鞌之功也韓厥為新中軍趙括佐之鞏朔為新上軍韓穿佐之荀騅為新下軍趙旃佐之晉舊有三軍今増此故為六軍齊侯朝于晉將授玉執玉為贄郤克趨進曰此行也君為婦人之笑辱也寡君未之敢任晉侯享齊侯齊侯視韓厥韓厥曰君知厥也乎齊侯曰服改矣戎朝異服也言服改明識其人韓厥登舉爵曰臣之不敢愛死為兩君之在此堂也荀罃之在楚也鄭賈人有將寘諸褚中以出褚絮也既謀之未行而楚人歸之賈人如晉荀罃善視之如實出已賈人曰吾無其功敢有其實乎吾小人不可以厚誣君子遂適齊傳言知罃之賢四年春宋公使華元來聘左傳四年春宋華元來聘通嗣君也宋入春秋未嘗聘魯文十一年公子遂雖往而宋不報也此繼晉衞而來聘蓋以三年春同㑹伐鄭故以好相結耳而六年冬復有侵宋之師用此見邦交無常惟以強國之意為向背耳三月壬申鄭伯堅卒把伯來朝左傳把伯來朝歸叔姬故也明年叔姬大歸故把伯先修朝禮言其故夏四月甲寅臧孫許卒公如晉左傳夏公如晉晉侯見公不敬季文子曰晉侯必不免詩曰敬之敬之天惟顯思命不易哉詩頌言天道顯明受其命甚難不可不敬以奉之夫晉侯之命在諸侯矣可不敬乎敬諸侯則得天命公以蜀之盟棄晉從楚内有懼焉故比年如晉不知禮愈䌓身愈卑徒自取屈辱而已葬鄭襄公秋公至自晉左傳秋公至自晉欲求成于楚而叛晉以晉侯見公不敬故季文子曰不可晉雖無道未可叛也國大臣睦而邇于我諸侯聽焉未可以貳史佚之志有之曰史佚周文王太史非我族類其心必異楚雖大非吾族也其肯字我乎字愛也公乃止冬城鄆魯有二鄆此西鄆即汶陽之一邑既得汶陽故城之以自固雖時亦書重役民也杜氏預以為備晉蓋因公之不禮於晉意其然爾鄭伯伐許左傳冬十一月鄭公孫申帥師疆許田前年鄭伐許侵其田今正其界許人敗諸展陂展陂杜注許地在今許州西北鄭伯伐許取鉏任泠敦之田鉏任泠敦俱在今許州境晉欒書將中軍代郤克荀首佐之士燮佐上軍荀庚將上軍不行故佐獨出以救許伐鄭取汜祭氾祭杜注鄭地成皋縣東有氾水楚子反救鄭鄭伯與許男訟焉于子反前爭曲直皇戌攝鄭伯之辭子反不能決也曰君若辱在寡君寡君與其二三臣共聽兩君之所欲成其可知也欲使于楚子前決之不然側不足以知二國之成側于反名為明年許愬鄭于楚張本鄭伯在喪而書爵以吉禮從金革之事也上三年冬書鄭伐許先儒皆以為惡鄭之甚然三年夏書鄭公子去疾帥師伐許此年又書鄭伯伐許不應兩年之間事同罪一而或恕之或誅之以是知孔氏穎達謂一據舊史之文義或然也附録左傳晉趙嬰通于趙莊姬趙嬰趙盾弟莊姬趙朔妻朔盾之子五年春王正月把叔姬來歸榖梁傳婦人之義嫁曰歸反曰來歸把叔姬來歸出也叔姬之罪無所考見或曰疾或曰無子然必不安於把而來歸爾春秋於内女之出與歸録之詳者所以重人倫為後世戒也附録左傳五年春原屏放諸齊放趙嬰也原同屏季嬰之兄嬰曰我在故欒氏不作我亡吾二昆其憂哉且人各有能有不能言己雖淫而能令莊姬䕶趙氏舎我何害弗聽嬰夢天使謂已祭余余福女使問諸士貞伯貞伯曰不識也既而告其人曰貞伯自告其從人神福仁而禍淫淫而無罰福也祭其得亡乎以得放遣為福祭之之明日而亡為八年晉殺趙同趙括傳仲孫蔑如宋左傳孟獻子如宋報華元也前年宋華元來聘蔑與華元交相聘問其情厚矣尋復廹於晉令遽興侵宋之師謹於邦交者固如是乎夏叔孫僑如㑹晉荀首于榖首公羊作秀榖杜注齊地左傳夏晉荀首如齊逆女故宣伯餫諸榖野饋曰餫運糧饋之敬大國也榖齊地也他國大夫非過吾境而使大夫往㑹之非禮也自文十一年彭生㑹郤缺宣十五年蔑㑹髙固自是以後大夫㑹大夫率以為常蓋列國之君皆失其政矣梁山崩梁山杜注在馮翊夏陽縣北夏陽今陜西韓城縣左傳梁山崩晉侯以傳召伯宗伯宗辟重曰辟傳重重載之車重人曰待我不如㨗之速也㨗邪出問其所曰絳人也問絳事焉曰梁山崩將召伯宗謀之問將若之何曰山有朽壤而崩可若何國主山川主謂所主祭故山崩川竭君為之不舉降服乘縵車無文徹樂出次舎于郊祝幣陳玉帛史辭自罪責以禮焉其如此而已雖伯宗若之何伯宗請見之見之于晉君不可遂以告而從之從重人言公羊傳梁山者何河上之山也梁山崩何以書記異也何異爾大也何大爾梁山崩壅河三日不㳅㳅同流外異不書此何以書為天下記異也榖梁傳不日何也高者有崩道也有崩道則何以書也曰梁山崩壅遏河三日不流晉君召伯尊而問焉伯尊來遇輦者輦者不辟使車右下而鞭之輦者曰所以鞭我者其取道遠矣所用鞭我之間行道則可遠伯尊下車而問焉曰子有聞乎對曰梁山崩壅遏河三日不流伯尊曰君為此召我也為之奈何輦者曰天有山天崩之天有河天壅之雖召伯尊如之何伯尊由忠問焉用忠誠之心問之輦者曰君親素縞帥羣臣而哭之既而祠焉斯流矣伯尊至君問之曰梁山崩壅遏河三日不流為之奈何伯尊曰君親素縞帥羣臣而哭之既而祠焉斯流矣孔子聞之曰伯尊其無績乎攘善也績功也攘盜也梁山崩記異也詩曰奕奕梁山蓋在韓侯之國韓滅於晉不繫之晉者公羊子所謂為天下記異是也古禮遭變異有降服乘縵徹樂出次祝幣史辭之文者皆恐懼修省之心所發著也絳人之論於禮文備矣若徒舉其文而無實心先之何足以弭災變乎附録左傳許靈公愬鄭伯于楚前兩年鄭伐許故六月鄭悼公如楚訟不勝楚人執皇戌及子國子國鄭穆公子故鄭伯歸使公子偃請成于晉秋八月鄭伯及晉趙同盟于垂棘宋公子圍龜為質于楚而歸圍龜文公子華元享之請鼔譟以出鼔譟以復入出入輒擊鼔曰習攻華氏宋公殺之宣十五年宋楚平後華元使圍龜代己為質故怨而欲攻華氏秋大水冬十有一月己酉天王崩左傳十一月己酉定王崩子簡王立傳本在蟲牢下盖月顚倒十有二月己丑公㑹晉侯齊侯宋公衞侯鄭伯曹伯邾子把伯同盟于蟲牢蟲牢杜注鄭地陳畱封丘縣北有桐牢今桐牢亭在河南封丘縣北三里左傳冬同盟于蟲牢鄭服也諸侯謀復㑹宋公使向為人辭以子靈之難子靈圍龜也宋公不欲㑹以新誅子靈為辭為明年侵宋傳鄭襄公自戰邲以後堅於附楚至是始復從晉故書同盟載書以是要言也定王之赴已在諸侯之策晉侯若㒺聞知而合九國之諸侯以為㑹盟無王之罪視他盟有加矣六年春王正月公至自㑹五年冬天王崩公與諸侯方為蟲牢之盟若能自㑹奔喪承事庶幾可以補過而晏然返國若無聞焉書至自㑹所以著其不臣之罪也附録左傳六年春鄭伯如晉拜成子游相子游公子偃授玉于東楹之東禮授玉兩楹之間鄭伯行疾故東過士貞伯曰鄭伯其死乎自棄也已視流而行速不安其位宜不能久視流不端諦東過故言不安其位二月辛巳立武宮左傳二月季文子以鞌之功立武宮非禮也魯人自鞌之功至今無患故築武軍又作先君武公宮以告成事欲以示後世聽于人以救其難不可以立武立武由己非由人也公羊傳武宮者何武公之宮也在春秋前立者何立者不宜立也立武宮非禮也榖梁傳立者不宜立也二昭二穆與太祖之廟而五諸侯之廟制也魯以周公為大祖而伯禽為世室二廟不毁昭功德也武公至成公十一世其毁己久而復立之失禮違制故特書曰立立者不宜立也或曰明堂位以魯公廟為文世室武公廟為武世室不為無據曰茍謂之世室則世世不毁矣奚待成公而始立乎且昭十五年有事于武宮不言世室則知明堂位之文妄也取鄟鄟杜注附庸國左傳取鄟言易也公羊傳鄟者何邾婁之邑也曷為不繫于邾婁諱亟也方與邾婁同蟲牢之盟旋取其邑諱魯背信亟也榖梁傳鄟國也鄟微國也取者取為附庸也公羊傳於根牟鄟邿皆曰邾邑然春秋未有取他國之邑而不繫國者以僖公之取須句訾婁皆繫以邾例之則其説不可通矣胡氏安國謂滅而書取乃為君諱過若項之書滅則僖公在㑹乃季孫所為故直書不隱以時事考之似非其實其辨已於滅項具之姑存所疑以備參考衞孫良夫帥師侵宋左傳三月晉伯宗夏陽説衞孫良夫甯相鄭人伊雒之戎陸渾蠻氏侵宋夏陽説晉大夫蠻氏杜注戎别種河南新城縣東南有蠻城經惟書衞孫良夫者獨衞告也以其辭㑹也辭㑹在前年師于鍼衞人不保不守備說欲襲衞曰雖不可入多俘而歸有罪不及死伯宗曰不可衞唯信晉故師在其郊而不設備若襲之是棄信也雖多衞俘而晉無信何以求諸侯乃止師還衞人登陴聞説謀故晉命也往年宋實預蟲牢之盟今一辭㑹而使衞魯交侵之獨不思前此楚人圍宋經歴三時國幾斃而不能救乎晉景之惽愚諸大夫之很肆所以使諸侯離心而霸業不振者皆由不能自返而責人無己也附録左傳晉人謀去故絳晉復命新田為絳故謂此故絳諸大夫皆曰必居郇瑕氏之地郇瑕杜注古國名河東解縣西北有郇城沃饒而近盬盬鹽也杜注猗氏縣鹽池是國利君樂不可失也韓獻子將新中軍且為僕大夫兼大僕公揖而入獻子從公立于寢庭路寢之庭謂獻子曰何如問諸大夫言是非對曰不可郇瑕氏土薄水淺其惡易覯易覯則民愁民愁則墊隘墊隘羸困也于是乎有沈溺重膇之疾不如新田新田杜注平陽絳縣土厚水深居之不疾髙燥故有汾澮以流其惡杜注汾水出大原經絳北西南入河澮水出平陽絳縣南西入汾惡垢穢且民從敎十世之利也夫山澤林盬國之寶也國饒則民驕佚財易致則民驕侈近寶公室乃貧近寶則民不務本不可謂樂公説從之夏四月丁丑晉遷于新田為季孫如晉傳夏六月邾子來朝公孫嬰齊如晉左傳子叔聲伯如晉聲伯嬰齊命伐宋晉人命公比年如晉大夫又繼往焉蓋與齊為讎不得不倚晉為援是以君臣僕僕霸政之煩苛小國之困敝於此可見矣壬申鄭伯費卒左傳六月鄭悼公卒終士貞伯之言秋仲孫蔑叔孫僑如帥師侵宋左傳秋孟獻子叔孫宣伯侵宋晉命也魯宋㑹師同盟聘問相結遽以晉命而加兵於宋非義也兵戎有國之重事邦交人道之大倫聽命於人不得已焉將能立乎魯自戰鞌四卿竝書此又二卿竝書蓋大夫益張史承其意而不敢略也凡以霸令有事於鄰國多書侵豈非本無積怨故無志深入而淺侵其境歟楚公子嬰齊帥師伐鄭楚始書大夫將左傳楚子重伐鄭鄭從晉故也冬季孫行父如晉左傳冬季文子如晉賀遷也晉遷新田故行父如晉遷不書擇利自徙非不得已則常事耳晉欒書帥師救鄭救公羊作侵左傳晉欒書救鄭與楚師遇于繞角繞角杜注鄭地杜佑通典汝州魯山縣東南有繞角城楚師還晉師遂侵蔡楚公子申公子成以申息之師救蔡禦諸桑隧桑隧杜注汝南朗陵縣東有桑里在上蔡西南趙同趙括欲戰請于武子武子欒書武子將許之知莊子范文子韓獻子諫曰不可吾來救鄭楚師去我吾遂至于此是遷戮也戮而不已又怒楚師戰必不克遷戮不義怒敵難當故不克雖克不令成師以出而敗楚之二縣何榮之有焉六軍悉出故曰成師以大勝小不足為榮若不能敗為辱己甚不如還也乃遂還于是軍帥之欲戰者衆或謂欒武子曰聖人與衆同欲是以濟事子盍從衆子為大政將酌于民者也酌取民心以為政子之佐十一人六軍之卿佐時欒書將中軍荀首佐之荀庚將上軍士燮佐之郤錡將下軍趙同佐之韓厥將新中軍趙括佐之鞏朔將新上軍韓穿佐之荀騅將新下軍趙旃佐之其不欲戰者三人而已知范韓欲戰者可謂衆矣商書曰三人占從二人衆故也商書洪範武子曰善鈞從衆夫善衆之主也三卿為主可謂衆矣從之不亦可乎傳善欒書得從衆之義且為八年晉侵蔡傳楚伐鄭喪致悼公過期不葬書欒書之救而伐者之罪自著矣據左氏欒書未戰而退師似不成乎救然始遇於繞角而楚師還繼遇於桑隧而申息之師亦未能逞則不可謂無功矣日講春秋解義卷三十二
