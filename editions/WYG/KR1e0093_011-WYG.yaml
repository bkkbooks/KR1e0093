body:
  text: 欽定四庫全書日講春秋解義卷十一莊公十有二年春王三月紀叔姬歸于酅公羊傳其言歸于酅何隠之也何隠爾其國亡矣徒歸于叔爾也叔者紀季也婦人謂夫之弟曰叔穀梁傳國而曰歸此邑也其曰歸何也吾女也失國喜得其所故言歸焉爾叔姬守節積有年矣紀季以酅入于齊時齊聽後五廟故叔姬歸于酅魯喜其女得申其志而書之紀亡矣叔姬至是始歸者紀侯卒也歸順辭婦人夫死無子而終扵父母家非正也紀季入齊五廟在焉叔姬不歸於魯而歸于酅魯人高其節義恩禮有加焉其歸及卒𦵏悉書扵册孔子存而不削為後世勸也先儒謂叔姬歸奉紀祀非也凡祭必夫婦親之故舅没則姑老紀侯大去季之主祀乆矣叔姬何與焉但婦人以夫家為家無論紀侯有子與否義當歸于酅耳夏四月秋八月甲午宋萬弑其君捷及其大夫仇牧捷公羊作接左傳十二年秋宋萬弑閔公于蒙澤蒙澤杜注宋邑梁國有䝉縣今河南商丘縣北有蒙澤南有蒙縣古城遇仇牧于門批而殺之手批之也遇大宰督于東宮之西華督又殺之殺督不書宋不以告立子游子游宋公子羣公子奔蕭蕭杜注宋邑沛國蕭縣今縣屬江南徐州府縣北有蕭城公子御説奔亳亳杜注宋邑蒙縣西北有亳城今河南商丘縣北有大蒙城皇甫謐所謂蒙為北亳是也南宮牛猛獲帥師圍亳牛長萬之子猛獲其黨公羊傳及者何累也弑君多矣舍此無累者乎孔父荀息皆累也舍孔父荀息無累者乎曰有有則此何以書賢也何賢乎仇牧仇牧可謂不畏强禦矣其不畏强禦奈何萬嘗與莊公戰即乘丘之役獲乎莊公為莊公所獲莊公歸散舍諸宮中散放也舍止也數月然後歸之歸反為大夫于宋與閔公博博戲名婦人皆在側萬曰甚矣魯侯之淑魯侯之美也美好天下諸侯宜為君者惟魯侯爾閔公矜此婦人自矜其色于此婦人妬其言顧曰此虜也顧謂側婦人此萬也虜執虜也爾虜焉故爾汝也謂萬也更向萬曰汝嘗執虜于魯侯故稱譽爾魯侯之美惡乎至惡乎至猶何所至萬怒搏閔公絶其脰脰頸也齊人語仇牧聞君弑趨而至遇之于門手劔而叱之萬臂摋仇牧側手曰摋碎其首齒著乎門闔闔扇仇牧可謂不畏强禦矣穀梁傳宋萬宋之卑者也卑者以國氏以尊及卑也仇牧閑也仇牧扞衛其君故見殺也君弑大夫死扵其難而經書之者厲臣節也大夫之死君難有不書者故知書者皆聖人所取也仇牧不能討賊雖死無益扵事然不計力之彊弱事之濟否而以身殉國亦可以愧人臣之食焉而逃其難者矣若大宰督則身為大惡死不足償故削而不書冬十月宋萬出奔陳左傳冬十月蕭叔大心叔蕭大夫名及戴武宣穆莊之族宋五公之子孫以曹師伐之殺南宮牛于師殺子游于宋立桓公桓公御説猛獲奔衞南宮萬奔陳以乘車輦其母一日而至駕人曰輦宋去陳二百六十里言萬之多力宋人請猛獲于衞衞人欲勿與石祁子曰石祁子衞大夫不可天下之惡一也惡于宋而保于我保之何𥙷得一夫而失一國與惡而棄好非謀也衞人歸之亦請南宮萬于陳以賂陳人使婦人飲之酒而以犀革裹之比及宋手足皆見宋人皆醢之萬弑君之賊也陳受其奔為逋逃主及貪宋賂然後以狙詐縛之故書萬出奔陳而不書宋人殺萬以著陳人黨惡之罪也先儒或并罪宋人之逸賊緩討則過矣萬旣多力又執國權立子游而遣師圍亳蕭叔以五族及曹師伐之連兵浹月僅乃克之豈能禁萬之逸耶慶父弑魯閔公奔莒莒人受賂而後歸之及境而縊故閔公不書葬不以討賊予魯也宋人殺萬不書疑若慶父自縊之類或使者畏其勇因其手足皆見而道殺之至宋然後醢之耳果生致於宋而明正其誅安得不以討賊許宋哉蓋臣子之心急於得賊鄰國求賂不容不致故陳人求賂罪不可寛而宋人致賂則義無可責也十有三年春齊侯宋人陳人蔡人邾人㑹于北杏齊侯穀梁作齊人北杏杜注齊地當在今山東東阿縣境左傳十三年春㑹于北杏以平宋亂遂人不至穀梁傳是齊侯宋公也其曰人何也始疑之何疑焉桓非受命之伯也將以事授之者也言諸侯將權推齊侯使行伯事曰可矣乎未乎舉人衆之辭也先儒以四國稱人齊侯書爵為始霸之辭非也宋先君見弑新君出㑹如以䘮服見則當書宋子以嘉服見則當書宋公以著其違禮何故沒而不書若以示齊霸則齊以侯爵序宋上雖書宋公亦知主㑹者齊也至謂四國之君貶而稱人以誅亂始益誤矣謂桓非受命之伯諸侯不宜私相推戴以為盟主則首亂者齊也許首亂者以霸而罪推戴者以無王聖人之賞罰乃若是其無章乎况據􅀴所書乃諸國之大夫聼命扵㑹之常辭無以知宋人之獨為君也後儒因此謂曹南獨書宋公城濮獨書晉侯皆始霸之辭穿鑿支離皆由稱爵為襃稱人為貶之説誤之耳夏六月齊人滅遂遂杜注遂國在濟北蛇丘縣東北今山東寧陽縣西北有遂鄉左傳夏齊人滅遂而戍之戌守也為後殱于遂張本穀梁傳遂國也其不日微國也滅者亡國之善詞上下之同力也齊桓恃其衆彊以刦制諸侯懼其未盡從也約之以㑹要之以盟其不順者則侵之伐之執之滅之外假尊周之名實以自封殖耳北杏之㑹魯遂皆不至齊扵魯有納糾之憾有敗師之怨比扵遂之可疾輕重較然矣乃扵魯則屈意而與之和扵遂則慿怒而滅其國蓋知魯之難服故結以為助知遂之無援則借以示威且利其土地耳故曰五霸者三王之罪人也秋七月冬公㑹齊侯盟于柯柯杜注濟北東阿齊之柯邑今山東東阿縣地左傳冬盟于柯始及齊平也公羊傳何以不日易也其易奈何桓之盟不日其㑹不致信之也其不日何以始乎此莊公將㑹乎桓曹子進曰君之意何如曹子曹劌史記作曹沬見莊將㑹有慙色故問之莊公曰寡人之生則不若死矣自傷伐齊納糾不能納反為齊所脅而殺之曹子曰然則君請當其君臣請當其臣當猶敵也將刦之之辭莊公曰諾于是㑹乎桓莊公升壇曹子手劔而從之管子進曰君何求乎管子管仲桓公卒愕不能應故管子進為此言曹子曰莊公亦造次不知所言故任曹子城壞壓竟齊數侵魯取邑以喻侵深也君不圖與管子曰然則君將何求曹子曰願請汶陽之田欲復魯竟管子顧曰君許諾桓公曰諾曹子請盟桓公下與之盟已盟曹子摽劔而去之摽辟也要盟可犯强見要脅而盟故云可犯而桓公不欺曹子可讎而桓公不怨桓公之信著乎天下自柯之盟始焉穀梁傳曹劌之盟也信齊侯也桓盟雖内與不日信也公盟例日外諸侯盟例不日桓信著故雖公與盟猶不日書㑹齊志也齊桓圖霸欲結魯宋是以釋屢戰之怨而為此盟也魯於齊世讎而平可乎傳曰敵惠敵怨不在後嗣魯莊忘親暱讎當齊襄之身數為㑹好著於經者詳矣今旣易世而桓公倡霸合諸侯以尊周室又可背乎故書公㑹而無貶辭也附録左傳宋人背北杏之㑹十有四年春齊人陳人曹人伐宋左傳十四年春諸侯伐宋背北杏㑹故齊請師于周假王命以示大順宋背北杏之㑹桓公請命於周而伐之蓋不得魯宋諸侯不肅故疾圖之而不敢緩也其稱人師少也齊自滅譚遂後救邢而外四十年未嘗興大衆蓋管仲得政師有節制其賦於民薄而蓄諸侯之力者亦厚矣故天下樂為之用而動則有成也先儒謂未嘗遣大夫為主將非也春秋之初惟内大夫帥師書名外則衆稱師少稱人無以大夫之名氏見者夏單伯㑹伐宋左傳夏單伯㑹之取成于宋而還公羊傳其言㑹伐宋何後㑹也本期而後故但舉㑹穀梁傳㑹事之成也伐事已成單伯乃至伐宋之役齊止用近宋之陳曹而不煩逺兵魯新從霸故齊雖不徵於魯而魯自遣單伯以兵往㑹也内大夫㑹伐者八獨翬㑹四國伐鄭與單伯㑹伐宋先列諸國之伐蓋後㑹之文左氏以單伯為周大夫非也成十六年十七年尹子單子三㑹伐鄭不書㑹伐又定四年傳云劉文公合諸侯侵楚經書公㑹劉子則此書單伯㑹伐為魯大夫明矣附録左傳鄭厲公自櫟侵鄭及大陵大陵杜注鄭地今河南臨潁縣北有大陵城獲傅瑕傅瑕鄭大夫傅瑕曰苟舍我吾請納君與之盟而赦之六月甲子傅瑕殺鄭子及其二子而納厲公鄭子子儀初内蛇與外蛇鬭于鄭南門中内蛇死六年而厲公入公聞之公魯莊公問于申繻曰猶有妖乎對曰人之所忌其氣燄以取之妖由人興也人無釁焉妖不自作人棄常則妖興故有妖厲公入遂殺傅瑕使謂原繁曰傅瑕貳言有二心于己周有常刑旣伏其罪矣納我而無貳心者吾皆許之上大夫之事吾願與伯父圖之上大夫卿伯父謂原繁且寡人出伯父無裏言無納我之言入又不念寡人不親附己寡人憾焉對曰先君桓公命我先人典司宗祏桓公鄭始受封君也宗祏宗廟中藏主石室言己世為宗廟守臣社稷有主而外其心其何貳如之苟主社稷國内之民其誰不為臣臣無貳心天之制也子儀在位十四年矣而謀召君者庸非貳乎莊公之子猶有八人若皆以官爵行賂勸貳而可以濟事君其若之何臣聞命矣乃縊而死秋七月荆入蔡左傳蔡哀侯為莘故繩息媯以語楚子莘役在十年繩譽也楚子加息以食入享遂滅息以息媯歸生堵敖及成王焉未言未與王言楚子問之對曰吾一婦人而事二夫縱弗能死其又奚言楚子以蔡侯滅息遂伐蔡欲以説息媯秋七月楚入蔡君子曰商書所謂惡之易也如火之燎于原不可鄉邇其猶可撲滅者其如蔡哀侯乎商書盤庚言惡易長而難滅穀梁傳荆者楚也其曰荆何也州舉之也州不如國國不如名名不如字齊桓圖霸力尚未能帖荆十年荆方敗蔡而執其君今又破蔡而入其國蔡近於楚受禍獨深故自北杏以後齊桓之㑹盟蔡不復與矣蔡始見經則㑹鄧以懼楚終錄於經則遷州來以避楚楚始見經則敗蔡終録於經則圍蔡齊晉之霸其極盛則侵蔡以伐楚其極衰則㑹召陵以救蔡而不能柏舉之戰吳張而陵齊晉亦以蔡故原蔡之始終而霸國消長之形荆楚彊弱之𫝑皆可見矣冬單伯㑹齊侯宋公衞侯鄭伯于鄄鄄杜注衞地今山東濮州東舊城集故鄄城也左傳冬㑹于鄄宋服故也穀梁傳復同㑹也是春三國伐宋至夏單伯始㑹伐宋已服而三國旋師不及至宋境故復㑹齊宋之君以結成而衞鄭之君以始不與北杏之㑹亦來㑹也至是齊霸畧定矣若陳蔡曹邾或從㑹或從伐己歸齊者不復更與此㑹蓋桓公之霸政務簡便不欲煩諸侯也十有五年春齊侯宋公陳侯衞侯鄭伯㑹于鄄左傳十五年春復㑹焉齊始霸也穀梁傳復同㑹也十三年十四年㑹此年復㑹三合諸侯而不盟以示重慎是以盟則衆信莫敢渝也陳舊序衞下齊桓始霸楚亦始彊陳介二國之閒齊桓以為三恪進之於衞上欲重結之也自是遂為定列夏夫人姜氏如齊穀梁傳婦人旣嫁不踰竟踰竟非禮也姜氏自齊襄見殺八年不出至是魯欲通好於齊姜假託國事以愚其昏懦之子齊亦欲善魯而姑受之復啓越境之恣矣秋宋人齊人邾人伐郳郳即小邾國公羊作兒左傳秋諸侯為宋伐郳郳附庸屬宋而叛故齊桓為之伐北杏之㑹齊桓已序諸國之上此復序宋下者為宋伐郳故推宋主兵也後此伐鄭伐徐亦然至二十七年同盟于幽霸體旣正無復有先齊者矣鄭人侵宋左傳鄭人閒之而侵宋乗伐郳之閒鄭背二鄄之㑹閒諸侯之伐郳而侵宋其反覆扵齊楚之閒蓋始扵此侵伐之義三𫝊不同左氏曰有鐘鼓曰伐無鐘鼓曰侵據此則齊侯侵蔡晉侯侵楚皆用大師而總數國若無鐘鼓何以行師公羊氏曰觕者曰侵精者曰伐蓋以精為深觕爲淺也然傳所載有侵師至破其國伐而未深入者穀梁氏曰苞人民毆牛馬曰侵斬樹木壞宫室曰伐齊桓伐楚不戰而服豈有壞宮室伐樹木之事耶先儒既辨其非而以伐為聲罪致討侵為無名行師然考之詩書曰侵自阮疆曰侵于之疆周官九伐之法負固不服則侵之而謂之無名可乎蓋聲罪致討曰伐潜師掠境曰侵伐者兵法所謂正也侵者兵法所謂奇也冬十月十有六年春王正月夏宋人齊人衞人伐鄭南北爭鄭于是始左傳十六年夏諸侯伐鄭宋故也楚勢浸彊陳蔡鄭許適當其衝而鄭尤南北之樞紐鄭之貳非細故也故合諸侯以伐之但突始簒國及忽復位又入櫟以逼之忽以弑死齊桓當請於王以正突之罪今乃為宋而伐之末矣然宋自是與齊為一魯宋諸侯之望也魯宋服而中國諸侯之志定矣秋荆伐鄭左傳鄭伯自櫟入在十四年緩告于楚秋楚伐鄭及櫟為不禮故也齊方圖霸楚亦有事於北方鄭地要綰南北中國得鄭則可以拒楚楚得鄭則可以窺中國故爭鄭自此始自是鄭被兵於楚者二十中國侵之伐之三十有九考鄭之始終可以見南北盛衰之大畧矣附錄左傳鄭伯治與于雍糾之亂者在桓十五年九月殺公子閼刖强鉏二子祭仲黨公父定叔出奔衞共叔段之孫定諡也三年而復之曰不可使共叔無後于鄭使以十月入曰良月也就盈數焉數滿于十君子謂强鉏不能衞其足言其不能早辟害冬十有二月㑹齊侯宋公陳侯衞侯鄭伯許男滑伯滕子同盟于幽公羊作公㑹許男下公羊穀梁俱有曹伯此書同盟之始滑杜注滑國河南緱氏縣今河南偃師縣南有緱氏故城古滑國也幽杜注宋地當在今河南考城縣境左傳冬同盟于幽鄭成也公羊傳同盟者何同欲也穀梁傳同者有同也同尊周也不言公外内寮一疑之也寮謂諸侯也魯與齊讎外内諸侯同一疑公未知可事齊乎不乎故㑹不云公以著疑焉齊自北杏以後屢合諸侯有㑹而無盟諸侯之心未一也至此鄭服始合九國之君而為此盟舉天下而聽命於一國古未有也然猶未敢專主盟之權故載書曰同盟至僖二年盟貫齊始為盟主自後不復書同矣㑹不書公諱之也陳氏以為齊初主盟不言公楚初與盟不言公晉大夫初㑹盟不言公得其義矣邾子克卒穀梁傳其曰子進之也此邾儀父也附齊而尊王室王命進其爵故書卒與諸侯同附録左傳王使虢公命曲沃伯以一軍為晉侯曲沃武公伐晉侯緡滅之盡以其寶噐賂獻于王王因命為晉侯周禮小國一軍晉土地雖大以武公初為諸侯故以小國之禮命之初晉武公伐夷執夷詭諸夷詭諸周大夫夷采地名蒍國請而免之蒍國周大夫既而弗報詭諸不報施于蒍國故子國作亂子國即蒍國謂晉人曰與我伐夷而取其地遂以晉師伐夷殺夷詭諸周公忌父出奔虢周公忌父王卿士辟子國之難惠王立而復之十有七年春齊人執鄭詹詹公羊作瞻左傳十七年春齊人執鄭詹鄭不朝也公羊傳鄭詹者何鄭之微者也以無氏也此鄭之微者何言乎齊人執之書甚佞也穀梁傳人者衆辭也以人執與之辭也鄭詹鄭之卑者卑者不志此其志何也以其逃來志之也逃來則何志焉將有其末末謂逃來不得不録其本也鄭詹鄭之佞人也稱人以執非霸討也詹不氏未賜族也討得其罪則稱爵謂之霸討桓未聞朝王而討鄭之不朝己可乎詹必至齊而後見執不書行人非以使事執也夏齊人殲于遂殱公羊作瀸左傳夏遂因氏頜氏工婁氏須遂氏饗齊戍醉而殺之齊人殲焉四族遂之强宗殱盡也公羊傳瀸者何瀐積也瀸積死非一之辭衆殺戍者也穀梁傳殲者盡也然則何為不言遂人盡齊人也無遂之辭也無遂則何為言遂其猶存遂也以其能殺齊戍故若遂之存存遂奈何曰齊人滅遂使人戍之遂之因氏飲戍者酒而殺之齊人殲焉此謂狎敵也狎猶輕也齊人滅遂慮其不服置兵戍守防患周矣而終為遂人所殲信乎力不足以服人也不曰遂人殲齊人者已無遂之辭又以見齊人之自取也觀此益見遂以滅書乃亡國之善詞上下之同力矣秋鄭詹自齊逃來公羊傳何以書書甚佞也曰佞人來矣佞人來矣穀梁傳逃義曰逃逃者匹夫苟免之行也詹旣見執若齊人不釋守死以待命可也即齊欲釋之亦當執禮以爭請暴其無罪於諸侯乃不辱君命而遁逃苟免恥孰甚焉魯方與齊同盟而受其逋逃罪亦不可掩矣冬多麋公羊傳何以書記異也麋魯所有不足為異而多則反常且有傷稼之害故志之十有八年春王三月日有食之穀梁傳不言日不言朔夜食也何以知其夜食也曰王者朝日謂日始出而虧傷之處尚存故知其夜食也故雖為天子必有尊也貴為諸侯必有長也故天子朝日諸侯朝朔經書日食三十六大都皆書日書朔獨此與僖十五年夏五月朔與日皆不書史失之也合朔在夜日食地中故穀梁以為夜食然苟朝日而見其虧傷是即朔日食矣如日未出而明復即朝日何從見其虧傷以是知為舊史之闕也附録左傳十八年春虢公晉侯朝王王饗醴命之宥王之覲羣后始則行饗禮先置醴酒示不忘古飲宴則命以幣物宥助也所以助歡敬之意皆賜玉五瑴雙玉為瑴馬三匹非禮也王命諸侯名位不同禮亦異數不以禮假人侯而與公同賜是借人禮虢公晉侯鄭伯使原莊公逆王后于陳陳媯歸于京師虢晉朝王鄭伯又以齊執其卿求王為援皆在周倡義為王定昏得同姓宗國之禮故𫝊詳其事不書不告也實惠后陳媯後寵愛少子亂周室故𫝊竝舉其從王之諡夏公追戎于濟西左傳夏公追戎于濟西不言其來諱之也戎來侵魯魯人不知去乃追之故諱不言其來公羊傳此未有言伐者其言追何大其為中國追也此未有伐中國者則其言為中國追何大其未至而豫禦之也其言于濟西何大之也穀梁傳其不言戎之伐我何也以公之追之不使戎邇于我也于濟西者大之也何大焉為公之追之也追者宼已去而躡之追齊至酅先言侵而後言追此不言侵伐明不覺其來敵去而始追之也書者譏内無戎備秋有􅈮􅈮又作蜮左傳秋有􅈮為災也公羊傳何以書記異也穀梁傳一有一亡曰有或有有時或有無時言不常也故書曰有􅈮射人者也國之所有則以多為異國之所無則以有為異􅈮者陰物漢書五行志劉向以為􅈮生南越越地男女同川亂氣所生故聖人名之曰􅈮􅈮猶惑也能含沙射人甚者至死乃魯之所無故以有書冬十月附録左傳初楚武王克權權杜注國名南郡當陽縣東南有權城水經注􅃆水東㑹權口南流逕權城北古之權國也今屬湖南安陸府使鬭緡尹之鬭緡楚大夫以叛緡以權叛圍而殺之遷權于那處那處杜注楚地南郡編縣東南有那口城在今湖廣荆門州東南使閻敖尹之閻敖楚大夫及文王即位與巴人伐申而驚其師巴人叛楚而伐那處取之遂門于楚閻敖游涌而逸杜注涌水在南郡華容縣游浮行也楚子殺之其族為亂冬巴人因之以伐楚十有九年春王正月附録左傳十九年春楚子禦之禦巴人大敗于津津杜注楚地江陵縣有津鄉在今湖廣枝江縣還鬻拳弗納鬻拳楚大閽遂伐黄黄嬴姓國敗黄師于踖陵踖陵杜注黄地當在今河南光州西南境還及湫湫杜注南郡鄀縣東南有湫城在今湖廣宜城縣有疾夏六月庚申卒鬻拳𦵏諸夕室夕室杜注地名亦自殺也而𦵏于絰皇絰皇冢前闕生守門故死不失職初鬻拳强諫楚子楚子弗從臨之以兵懼而從之鬻拳曰吾懼君以兵罪莫大焉遂自刖也楚人以為大閽謂之大伯伯長也為門官之長使其後掌之君子曰鬻拳可謂愛君矣諌以自納于刑刑猶不忘納君于善夏四月秋公子結媵陳人之婦于鄄遂及齊侯宋公盟公羊傳媵者何諸侯娶一國則二國往媵之以姪娣從姪者何兄之子也娣者何弟也諸侯壹聘九女諸侯不再娶媵不書此何以書為其有遂事書大夫無遂事此其言遂何聘禮大夫受命不受辭辭謂專對之辭出竟有可以安社稷利國家者則專之可也穀梁傳媵淺事也不志此其志何也辟要盟也魯實使結要二國之盟恐齊宋不與故假媵婦為名何以見其辟要盟也媵禮之輕者也盟國之重也以輕事遂乎國重無説其曰陳人之婦畧之也其不日數渝惡之也數疾也渝渝盟也不書如陳送媵而書媵陳人之婦則非奉君命而媵陳之微者明矣以國卿而私行出疆見魯之無政也聘禮大夫受命不受辭出竟有可以安社稷利國家者專之可也謂本有此命得以便宜從事特不受專對之辭耳結本以私事出無君命而要盟於大國公侯故書遂以著其生事專命之罪若齊宋之盟出於公命則當如公孫兹如牟因聘而娶但書其聘之例書盟而不書媵矣夫人姜氏如莒穀梁傳婦人旣嫁不踰竟踰竟非正也前此姜氏如齊桓公不討遂使蕩然無忌恣情如莒非惟魯之辱亦齊之羞也附録左傳初王姚嬖于莊王生子頽王姚莊王之妾姚姓子頽有寵蒍國為之師及惠王即位惠王莊王孫取蒍國之圃以為囿邊伯之宮近于王宮邊伯周大夫王取之王奪子禽祝跪與詹父田三子皆周大夫而收膳夫之秩膳夫石速也故蒍國邊伯石速詹父子禽祝跪作亂因蘇氏蘇氏周大夫桓王奪其十二邑以與鄭自此遂不和秋五大夫奉子頽以伐王不克出奔温蘇子奉子頽以奔衞衞師燕師伐周燕南燕冬立子頽冬齊人宋人陳人伐我西鄙此魯國見伐之始穀梁傳其曰鄙逺之也其逺之何也不以難邇我國也齊宋方與結定盟而旋伐我何也自鄭詹逃來已得罪於齊又以結之抗盟重怒但齊宋當拒不與盟不宜旣盟而復伐且據傳王室方有子頽之亂衞燕稱兵伐周桓公不能討而合二國以伐魯傎矣日講春秋解義卷十一
