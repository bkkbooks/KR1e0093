body:
  text: 欽定四庫全書日講春秋解義卷八桓公十有四年春正月公㑹鄭伯于曹左傳十四年春㑹于曹曹人致餼禮也熟曰饔生曰餼前年魯㑹鄭紀敗齊衛之師恐其報怨故為此㑹以謀之曹素與魯協故魯㑹鄭於其地公於鄭突比之至矣十二年屢㑹以平宋鄭而不克則為武父之盟為宋之伐十三年㑹戰今又為此㑹同惡相濟眀矣無冰公羊傳何以書記異也周之正月乃夏之十一月時當堅冰無冰者温也故曰異穀梁傳無冰時燠也周官凌人職正嵗十有二月令斬冰三其凌豳風七月之詩二之日鑿冰冲冲三之日納于凌隂以供賔食喪祭下逮老疾其蔵之也周用之也徧則冬無愆陽夏無伏隂春無凄風秋無苦雨盖亦燮理隂陽之一事仲冬之月燠而無冰劉向以為紀綱縱弛善惡不明賞罰不行之象春秋所書皆經邦大訓而四時寒暑之變必詳亦洪範念用庶徴之義也夏五公羊傳夏五者何無聞焉爾榖梁傳孔子曰聽逺音者聞其疾而不聞其舒望逺者察其貌而不察其形貌姿體形容色立乎定哀以指隠桓隠桓之日逺矣夏五𫝊疑也不書月闕文也先儒或謂疑而不益見聖人之慎或曰此修經以後𫝊寫者之脱漏耳後説似得其實盖事之疑者不敢書闕者不敢益聖人之慎也若五下脱月則何所疑而不敢益乎如舊史五下有所繫之事孔子自宜益月而具書其事或僅存夏五二字又宜用無事必具時與首月之例削五而書夏四月以是知為修經後之脱漏也鄭伯使其弟語来盟語穀梁作禦左傳夏鄭子人来尋盟且修曹之㑹子人即弟語也其後為子人氏穀梁傳諸侯之尊弟兄不得以屬通其弟云者以其来我舉其貴者也来盟前定也不日前定之盟不日言信在前非結于今突之簒立本由宋人而復與宋惡所恃惟魯而已鄭非無大夫而来盟必使其母弟盖懼忽方在外儀亹在内諸大夫或有異心也使来盟則盟已前定與髙子之盟異矣秋八月壬申御廪災公羊傳御廩者何粢盛委之所蔵也御者謂御用于宗廟也委積也御廩災何以書記災也門觀災而新作則書御廪粢盛之所蔵其新也必矣何以不書記曰君子將營宫室宗廟為先御廪所儲以供宗廟也故其新也以為常事而不書垂教之意深矣盖國之本務雖勤於工築而民無勞怨也乙亥嘗左傳秋八月壬申御廪災乙亥嘗書不害也災其屋救之則息不及穀故曰書不害公羊傳常事不書此何以書譏何譏爾譏嘗也曰猶嘗乎御廩災不如勿嘗而已矣穀梁傳御廪之災不志此其志何也以為唯未易災之餘而嘗可也志不敬也言用火焚之餘以祭宗廟不敬之大也天子親耕以共粢盛王后親蠶以共祭服國非無良農工女也以為人之所盡事其祖禰不若以己所自親者也何用見其未易災之餘而嘗也曰甸粟而内之三宫三宫米而蔵之御廪甸甸師掌田之官三宫三夫人也宗廟之禮君親割夫人親舂夫嘗必有兼甸之事焉夫人親舂是兼甸之事一本甸作旬旬十日也壬申御廪災乙亥嘗以為未易災之餘而嘗也壬申乙亥相去止四日故知未易災之餘嘗祭時事之常何以書周之八月非時也不改卜而祭不敬也穀梁以御廪所蔵為既舂之米故曰未易災之餘而嘗考之周官廩人職大祭祀共其接盛鄭康成云扱以授舂人是御廩所蔵固未舂也舂人為米以獻於三宫三宫夫人擇之以授􅐪人使為粢盛非兼旬莫辦壬申距乙亥甫四日則粟之出廪久矣以此知穀梁之説非也但遇災之後不改卜而遽嘗則未免慢易耳冬十有二月丁巳齊侯祿父卒宋人以齊人蔡人衛人陳人伐鄭公羊序蔡人在衛人下左傳冬宋人以諸侯伐鄭報宋之戰也戰宋在十二年焚渠門鄭城門入及大逵伐東郊鄭郊取牛首牛首杜注鄭邑今河南陳留縣西南有牛首城以大宫之椽歸為盧門之椽大宫鄭祖廟盧門宋城門椽榱也圓為椽方為桷公羊傳以者何行其意也穀梁傳以者不以者也不以者謂本非所得制今得以之民者君之本也使人以其死非正也刺四國使宋専用其師輕民命也師而曰以在以人之師者則為能左右之以行已意在為人所以者則為非其本意而為人所用之稱凡見於經皆以弱而假彊者也前此諸侯有㑹伐者矣非一國之意故以爵序即小國主兵而序乎大國之上亦非一國之意不得書以也齊蔡衛陳與鄭無怨徒以宋怨鄭突之背已而出師以聽宋所為故書以自此始霸事既興則徴兵於諸侯雖能左右之而不復書以矣其書以者如魯以楚師伐齊蔡以吳子伐楚皆以弱假彊也列國之兵有制皆統於天子而敢私用之與私為人用以驅人於死地皆大亂之道也故穀梁氏曰以者不以者也十有五年春二月天王使家父来求車左傳十五年春天王使家父来求車非禮也諸侯不貢車服車服上之所以賜下天子不私求財諸侯有常職貢公羊傳何以書譏何譏爾王者無求求車非禮也穀梁傳古者諸侯時獻于天子以其國之所有故有辭讓而無徴求求車非禮也求金甚矣前此求賻雖非王朝之體然賻乃諸侯所當歸也車服上所以賜下而以求於下失禮甚矣周禮列國雖有器貢不過桃弧棘矢魯壺之類耳左氏諸侯不貢車服禮之經也或謂車為器貢誤矣三月乙未天王崩此桓王也赴告及魯故書於䇿此後莊王僖王不書崩盖王室不告魯亦不赴見諸侯之不臣也夏四月己巳葬齊僖公五月鄭伯突出奔蔡左傳祭仲専鄭伯患之使其壻雍糾殺之將享諸郊雍姬知之謂其母曰父與夫孰親其母曰人盡夫也父一而已胡可比也遂告祭仲曰雍氏舍其室而將享子于郊吾惑之以告祭仲殺雍糾尸諸周氏之汪周氏鄭大夫汪池也暴其尸以示戮公載以出曰謀及婦人宜其死也夏厲公出奔蔡公羊傳突何以名奪正也穀梁傳譏奪正也鄭突患祭仲之専使雍糾殺之為仲所覺糾見殺而突奔書名著其簒也書鄭伯見國人已奉之為君諸侯已與為同列也陸淳曰逐君之臣其罪易知也君而見逐其惡大矣聖人之教在乎端本清源故凡諸侯之奔皆不書其逐之者所以警乎人君其説是也突謀奪嫡始藉宋之力以脅仲與仲比以竊國又與其親戚謀殺之為反覆盜賊之計則其出亡自取焉耳茍正其本爵賞刑威惟君所操雖有奸邪孰敢窺伺哉鄭世子忽復歸于鄭左傳六月乙亥昭公入公羊傳其稱世子何復正也曷為或言歸或言復歸復歸者出惡歸無惡復入者出無惡入有惡入者出入惡歸者出入無惡穀梁傳反正也忽之奔不稱爵責不能守其位也返國稱世子見國其所當有也諸侯世國失位出奔歸而稱復正也大夫不世爵失位出奔歸而稱復則惡也許叔入于許左傳許叔入于許穀梁傳許叔許之貴者也莫宜乎許叔其曰入何也其歸之道非所以歸也言不請王命而歸以復國書入有鄭之難未可以安然而歸也書叔著其兄弟之行次見國破君亡以序可嗣立也其義與紀季蔡季相發興復之善者莫過於許叔存祀之善者莫過於紀季歸國之善者莫過於蔡季皆聖人之所與也使書名則與入簒者無别矣公㑹齊侯于艾艾公羊作鄗穀梁作蒿左傳公㑹齊侯于艾謀定許也左氏以為謀定許也然入許本齊魯與鄭合謀今許叔乗鄭之亂以復其國齊魯不興師以問之則已矣何故反為㑹以定其位也且㑹艾之後魯再伐鄭而齊不與焉安見其為謀定許哉髙氏閌曰魯嘗與齊絶矣襄公新立復通好彭生之禍兆於此矣故春秋志之以齊為主盖齊志也邾人牟人葛人来朝牟國今山東歴城縣東有牟城葛國嬴姓今河南寧陵縣有葛城公羊傳皆何以稱人夷狄之也此来朝者三國之君也其稱人何天王崩不奔䘮而相率以朝弑逆之賊且行旅見之禮故特文以見義也秋九月鄭伯突入于櫟櫟杜注鄭别都也河南陽翟縣今禹州是也左傳秋鄭伯因櫟人殺檀伯而遂居櫟檀伯鄭守櫟大夫公羊傳櫟者何鄭之邑曷為不言入于鄭末言爾末者淺也曷為末言爾祭仲亡矣然則曷為不言忽之出奔言忽為君之微也祭仲存則存矣祭仲亡則亡矣鄭已有君突自外竊入亦書鄭伯此因舊史之文而存之以示戒也魯桓與突同惡相濟出師輔簒至於再三故魯史卑忽而崇突以鄭伯書春秋因之而不革程子所謂以戒居正者之不能保也衛侯之入夷儀不名衎正而突簒也衎之入衛書而突之入鄭不書衎告而突不告也盖諸侯以突為鄭君突亦自以為鄭君久矣故不復以入鄭告也至大都耦國之害則昭十一年𫝊載申無宇之言備矣冬十有一月公㑹宋公衛侯陳侯于袲伐鄭袲公羊作侈宋公上公羊有齊侯袲杜注宋地沛國相縣西南有袲亭在今江南宿州境左傳冬㑹于袲謀伐鄭將納厲公也弗克而還穀梁傳地而後伐疑辭也非其疑也鄭突簒國伐而正之義也不應疑故責之忽在鄭而諸侯伐鄭則助突眀矣穀梁謂地而後伐為有所疑非也先㑹而後伐紀其實耳或謂宋既責賂而伐突不當又納突魯方與突伐宋不當又㑹宋納突且忽之奔也衛實受之亦不應伐忽以納突以是有疑不知魯軌宋馮衛朔皆以不正得國其與突為黨乃水之流濕火之就燥又以正繼正則鄰國無所求以不正奪正則可以責賂其来舊矣故不復知有人紀之常邦交之正耳十有六年春正月公㑹宋公蔡侯衛侯于曹左傳十六年春正月㑹于曹謀伐鄭也前年冬謀納厲公不克故復更謀夏四月公㑹宋公衛侯陳侯蔡侯伐鄭左傳夏伐鄭魯宋衛再㑹連兵以伐正而助不正非徒為突謀亦欲植黨示威以自固也其惡固不待貶而見矣春正月㑹于曹蔡先於衛夏四月伐鄭衛先於蔡周官大司馬設儀辨位以等邦國九儀之命不可亂也至春秋時霸者以意之向背為升降列國以勢之彊弱相上下而舊典不可復問矣此民志所以不定爭攘所以日繁也秋七月公至自伐鄭此書致伐之始左傳秋七月公至自伐鄭以飲至之禮也穀梁傳桓無㑹其致何也危之也助簒伐正危殆之甚魯桓躬為簒弑求助於彊鄰其身既定遂㑹于稷以成宋亂亂臣賊子由是益張今又再㑹連兵伐正以助簒方且飲至䇿勲自眀得意積不善之殃將至矣冬城向左傳冬城向書時也杜氏預謂城以十一月以長歴推之此年閏在六月月却而節前水星可在十一月而正以證𫝊曰書時非誤但縱是十一月亦夏之九月農功未畢盖城築之事非可月成戒事於此月而以春正月畢功則無妨農之病耳十有一月衛侯朔出奔齊左傳初衛宣公烝于夷姜生急子夷姜宣公之庶母也上淫為烝屬諸右公子為之娶于齊而美公取之生夀及朔屬夀于左公子左右公子左右媵之子因以為號夷姜縊失寵故宣姜與公子朔構急子宣姜即宣公所娶急子之妻構㑹其過惡公使諸齊使盜待諸莘將殺之莘杜注衛地今山東莘縣北有莘亭夀子告之使行不可曰棄父之命惡用子矣有無父之國則可也及行飲以酒夀子載其旌以先盜殺之急子至曰我之求也此何罪請殺我乎又殺之二公子故怨恵公恵公朔也十一月左公子洩右公子職立公子黔牟黔牟羣公子恵公奔齊公羊傳衛侯朔何以名絶曷為絶之得罪于天子也其得罪于天子奈何見使守衛朔朔十二月朔政事也而不能使衛小衆時天子使發小衆不能使行越在岱隂齊越走也岱泰山也山北曰隂屬負兹舍不即罪爾屬託也諸侯有疾稱負兹舍止也即就也言託疾而止不就罪也穀梁傳朔之名惡也天子召而不往也朔繼立已五年二公子雖怨之以其承國於父未敢廢立必因召而不往王欲致討然後得行其志莊六年諸侯納朔而王人子突救衛則公穀所𫝊盖信而有徴也十有七年春正月丙辰公㑹齊侯紀侯盟于黄黄杜注齊地路史登之黄縣東南有古黄城本紀邑後入齊案登州府黄縣齊東垂也去魯殊逺疑非㑹盟處左傳十七年春盟于黄平齊紀且謀衛故也紀魯之婚姻而衛朔在齊齊欲納朔而魯欲平紀故釋前憾而為此盟也然二年之後齊遽遷紀三邑六年之後魯卒㑹齊納朔事之順逆交之離合一聽乎彊者而弱者不敢違則盟何足恃耶又齊之圖紀十有二年矣魯為紀納后於王故紀雖從魯敗齊而齊不敢報怨至襄公而後逞志焉用此見襄之無道而僖猶知畏義也二月丙午公㑹邾儀父盟于趡㑹公羊穀梁作及趡杜注魯地當在今山東泗水鄒縣之間左傳及邾儀父盟于趡尋蔑之盟也隠公元年嘗與邾盟于蔑至七年魯渝盟而伐邾遂絶通好及桓立十五年邾與牟葛来朝因尋蔑之好而為此盟乃不踰年又興師㑹伐何哉從宋志也夫前此伐邾既為宋討後此伐邾又從宋志已欲盟而盟人欲伐則伐邦交之反覆無常一至於此春秋凡盟皆惡有以夫夏五月丙午及齊師戰于奚公羊闕夏字奚穀梁作郎此齊魯交兵之始奚杜注魯地今山東滕縣南奚公山下有奚邑左傳夏及齊師戰于奚疆事也爭疆界也于是齊人侵魯疆疆吏来告公曰疆埸之事慎守其一而備其不虞不虞猶不意也姑盡所備焉事至而戰又何謁焉穀梁傳内諱敗舉其可道者也不言其人以吾敗也不言及之者為内諱也不名及者疆吏得公命與戰微者之名不載於䇿書也觀眀年公㑹齊侯于濼則齊魯之怨未深其非公與戰眀矣六月丁丑蔡侯封人卒左傳蔡桓侯卒秋八月蔡季自陳歸于蔡左傳蔡人召蔡季于陳秋蔡季自陳歸于蔡蔡人嘉之也穀梁傳蔡季蔡之貴者也自陳陳有奉焉爾舊説蔡季與獻舞俱桓侯弟也桓侯無子立獻舞季遂去而之陳封人卒獻舞立蔡人思而召之其去以道其歸以禮故稱字以襃之按杜氏預謂季即獻舞先儒多謂季讓國之賢不宜失國見執而不死於位以此斷獻舞為異人以經考之突歸于鄭赤歸于曹皆稱名而季書字則歸無惡可知矣陳侯之弟黄楚公子比之歸皆先書其奔而季之如陳不書則出無惡可知矣盖奔者以惡出也故魯公子之奔未有不書者而季友如陳不書其歸也特書季子来歸用此觀之則蔡季之出入無惡信矣但人之才分有限而事變無常以歸國無惡而决其無失國見執之事亦非定論並存二説兼發所疑以俟參考癸巳葬蔡桓侯春秋惟封人之葬書侯故先儒皆謂五等諸侯本國臣子皆稱之曰公其卒也不請諡於王遂私諡為某公春秋從而書之以見其非禮惟蔡季賢知請諡於王王之䇿書則云諡曰某侯故特書之以眀得禮也及宋人衛人伐邾左傳伐邾宋志也邾宋爭疆魯從宋志以為此伐其距趡之盟僅數月耳刑牲詔神棄如敝屣瀆信而不仁亦甚矣冬十月朔日有食之左傳冬十月朔日有食之不書日官失之也天子有日官諸侯有日御日官居卿以底日禮也日官天子掌厯者不在六卿之數而位從卿故言居卿也底平也謂平厯數也日御不失日以授百官于朝言日御奉天子所頒之厯不失天時以授百官穀梁傳言朔不言日食既朔也既盡也盡朔一日至眀日乃食是月二日食也書朔不書日舊史闕文也歴家謂有平朔有定朔以日平行月平行推算某日某時某刻合朔是為平朔日有盈縮月有遲疾取均度或加或減於平行以定某日某時某刻日月相㑹是為定朔自劉洪乾象厯始用定朔於是非朔不食漢初以前皆用平朔故有食於朔前後者但朔前朔後聖人何難據實以書而必曲生義例乎日食於朔二日則不得為朔矣故當以文闕為正附録左傳初鄭伯將以髙渠彌為卿昭公惡之固諫不聽昭公立懼其殺己也辛夘弑昭公而立公子亹昭公弟君子謂昭公知所惡矣公子達曰達魯大夫髙伯其為戮乎復惡已甚矣復重也本為昭公所惡而又弑君是重為惡也十有八年春王正月是年桓公之終也復書王正月眀弑君之賊雖身已没而王法不得赦也又桓十五年天王崩至是嗣王三年之喪畢矣眀弑君之賊後王宜加討也然則簒弑者身無存没時無古今而不可容於天地之間故曰孔子成春秋而亂臣賊子懼公㑹齊侯于濼公與夫人姜氏遂如齊公羊無與字濼水名杜注在濟南歴城縣西北入濟今趵突泉即濼水之源也盖濟水伏流重發處左傳十八年春公將有行遂與姜氏如齊申繻曰魯大夫女有家男有室無相凟也謂之有禮易此必敗公㑹齊侯于濼遂及文姜如齊齊侯通焉公謫之以告夫人告齊侯公羊傳公何以不言及夫人夫人外也若言夫人已為公所絶外也夫人外者何内辭也言内為公諱之辭其實夫人外公也穀梁傳濼之㑹不言及夫人何也以夫人之伉弗稱數也夫人驕伉不可言及故舍而弗數公往㑹齊侯夫人欲同往而公不能制㑹禮畢夫人欲從齊侯至齊公不能止而身從之禮防盡潰而亂象已形矣濼之㑹不言夫人夫人不與㑹也僖公及夫人姜氏㑹齊侯于陽穀以夫及婦恒辭也此獨變文書與與者相敵而不相屬之辭眀夫人不屬于公公羊氏所謂夫人外公是也夫不夫婦不婦欲無敗得乎故變文以著見殺之由也夏四月丙子公薨于齊丁酉公之喪至自齊左傳夏四月丙子享公使公子彭生乗公公薨于車上車曰乗彭生多力拉公幹而殺之魯人告于齊曰寡君畏君之威不敢寧居来修舊好禮成而不反無所歸咎惡于諸侯請以彭生除之齊人殺彭生穀梁傳其地于外也薨稱公舉上也公五等之上魯君弑而薨者以不地見其弑而此書薨于齊何也薨在外不得不書其地也然前書公與夫人如齊已見起禍之端後書夫人孫于齊則去其姓氏以正與聞乎弑之罪莊公不書即位以眀先君不以道終子不忍即位之義則雖書薨于齊而見戕之實亦不可掩矣秋七月附録左傳秋齊侯師于首止首止杜注衛地陳留襄邑縣東南有首鄉在今河南睢州東南子亹㑹之髙渠彌相不知齊欲討己七月戊戌齊人殺子亹而轘髙渠彌轘車裂也祭仲逆鄭子于陳而立之昭公弟子儀也是行也祭仲知之故稱疾不往人曰祭仲以知免仲曰信也子亹之立本非仲意故然譏者之言周公欲弑莊王而立王子克克莊王弟子儀辛伯告王辛伯周臣遂與王殺周公黒肩王子克奔燕初子儀有寵于桓王桓王屬諸周公辛伯諫曰竝后妾如后匹嫡庶如嫡兩政臣擅命耦國都如國亂之本也周公弗從故及及于難冬十有二月己丑葬我君桓公公羊傳賊未討何以書葬讎在外也讎在外則何以書葬君子辭也齊彊魯弱不可立報故君子量力而為恕辭穀梁傳葬我君接上下也言我君舉國上下之辭君弑賊不討不書葬此其言葬何也不責踰國而討于是也桓公葬而後舉諡諡所以成徳也諡者行之迹所以表徳于卒事乎加之矣人之終卒事畢于葬故于葬定稱號也智者慮義者行仁者守有此三者備然後可以㑹矣桓無此三者而出㑹大國所以見殺賊未討而書葬讎在外也凡在官者殺無赦謂本國之臣子耳讎在敵國勢或不能即討而親之喪不可久暴露故於葬無責焉非謂討可緩也若莊公之忘親暱讎則又非欲報而不能者所可比書葬而其罪愈不容逭矣日講春秋解義卷八
