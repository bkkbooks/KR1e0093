body:
  text: 欽定四庫全書日講春秋解義卷三十六成公十有七年春衛北宫括帥師侵鄭括公羊作結左傳十七年春王正月鄭子駟侵晉虛滑虛滑杜注晉二邑衛北宫括救晉侵鄭至于高氏括成公曽孫高氏杜注在陽翟縣西南今屬河南禹州衛鄭時無怨隙盖晉命也夏公㑹尹子單子晉侯齊侯宋公衛侯曹伯邾人伐鄭左傳夏五月鄭大子髠頑侯獳為質于楚侯獳鄭大夫楚公子成公子寅戌鄭公㑹尹武公單襄公及諸侯伐鄭自戲童至于曲洧戲童水經注汜水出浮戲之山在今河南汜水縣曲洧杜注新汲縣治曲洧城臨洧水今洧川縣屬河南晉乗鄢陵戰勝之後假王臣之重帥諸侯以討鄭至於再三而終不能服鄭者盖鄭感楚君親集矢於其目又晉雖倖勝而内政不修楚雖偶敗而其勢實盛也附錄左傳晉范文子反自鄢陵使其祝宗祈死祝宗主祭祀祈禱者曰君驕侈而克敵是天益其疾也難將作矣愛我者唯祝我使我速死無及于難范氏之福也六月戊辰士燮卒𫝊言厲公無道故賢臣憂懼而死六月乙酉同盟于柯陵柯陵杜注鄭西地左傳乙酉同盟于柯陵尋戚之盟也戚盟在十五年穀梁傳柯陵之盟謀復伐鄭也不重言諸侯見尹單亦與盟也王臣與諸侯要盟於是始自是習以為常非禮也秋公至自㑹左傳楚子重救鄭師于首止諸侯還畏楚强穀梁傳不曰至自伐鄭者公不周乎伐鄭也周信也言公逼于諸侯為此盟意不欲更伐鄭何以知公之不周乎伐鄭以其以㑹致也何以知其盟復伐鄭也以其後㑹之人盡盟者也後㑹謂冬伐鄭不周乎伐鄭則何為日也言公之不背柯陵之盟也不以伐致者楚人救而諸侯還未成乎伐也齊髙無咎出奔莒左傳齊慶克通於聲孟子與婦人䝉衣乘輦而入於閎慶克慶封父䝉衣為婦人服與婦人相冐閎巷門鮑牽見之鮑牽鮑叔牙曾孫以告國武子武子召慶克而謂之􅂟克久不出而告夫人曰國子謫我夫人怒國子相靈公以㑹㑹伐鄭髙鮑處守髙無咎鮑牽及還將至閉門而索客蒐索備姦人孟子訴之曰髙鮑將不納君而立公子角角頃公子國子知之秋七月壬寅刖鮑牽而逐髙無咎無咎奔莒髙弱以盧叛弱無咎子盧髙氏邑齊人來召鮑國而立之國牽之弟文子初鮑國去鮑氏而來為施孝叔臣施孝叔魯大夫施氏卜宰匡句須吉宰家臣之長匡句須亦施氏家臣施氏之宰有百室之邑與匡句須邑使為宰以讓鮑國而致邑焉施孝叔曰子實吉對曰能與忠良吉孰大焉鮑國相施氏忠故齊人取以為鮑氏後仲尼曰鮑莊子之知不如葵葵猶能衛其足莊子鮑牽葵傾葉向日以蔽其根言鮑牽居亂不能危行言孫靈公不公其聼奔其世臣以長禍亂無咎身為卿佐亦不能謀國正君遂生疑閒至於見逐盖兩譏之九月辛丑用郊公羊傳用者何用者不宜用也九月非所用郊也周之九月夏之七月非郊時然則郊曷用郊用正月上辛正月者嵗首上辛尤始新皆取首先之意或曰用然後郊用者先有事如魯人將有事于上帝必先有事于泮宫是也穀梁傳夏之始可以承春以秋之末承春之始盖不可矣郊春事也夏之始亦不時今言可者欲明秋末之不可故以是為猶可也九月用郊用者不宜用也宫室不設不可以祭衣服不修不可以祭車馬器械不備不可以祭有司一人不備其職不可以祭祭者薦其時也薦其敬也薦其美也美備也非享味也郊之不時未有甚於此者盖成公十年嘗五卜郊而不從遂不郊今懼卜而不從故不卜而直用之爾書曰用郊盖前此未有不卜而用事者也劉氏敞謂用人以祭非也邾用鄫子楚用蔡世子皆快意於讎敵安有殺無罪以祭上帝者且書執書人然後書用則知為用其人若用郊則與用牲用幣用田賦用致夫人文義正同安得鑿為異説乎晉侯使荀罃來乞師冬公㑹單子晉侯宋公衛侯曹伯齊人邾人伐鄭左傳冬諸侯伐鄭前夏未得志故十月庚午圍鄭不書圍畏楚救不成圍而還穀梁傳言公不背柯陵之盟也當時楚勢甚張且挾鄭為援非假王命合諸侯以屢伐之其憑陵列國必更有甚焉先儒專以晉厲為譏議亦未究乎事理之實耳十有一月公至自伐鄭左傳楚公子申救鄭師于汝上十一月諸侯還前此二伐非乞師而往則其反也亦不以師行告廟今之伐以乞師而㑹則其反也不得不以伐告焉故各從其實書之壬申公孫嬰齊卒于貍脤脤公羊作軫穀梁作蜃貍脤杜注地闕左傳初聲伯夢涉洹洹杜注洹水出汲郡林慮縣東北至魏郡長樂縣入清水今河南林縣西北林慮山即洹水所出也或與已瓊瑰食之泣而為瓊瑰盈其懷瓊玉瑰珠也食珠玉含象従而歌之曰濟洹之水贈我以瓊瑰歸乎歸乎瓊瑰盈吾懷乎夢中為此歌懼不敢占也還自鄭從伐鄭還壬申至于貍脤而占之曰余恐死故不敢占也今衆繁而従余三年矣無傷也言之之莫而卒𫝊戒數占夢公羊傳非此月日也曷為以此月日卒之據下丁巳朔知壬申在十月待君命然後卒大夫曷為待君命然後卒大夫前此者嬰齊走之晉走出奔公㑹晉侯將執公嬰齊為公請公許之反為大夫歸至于貍軫而卒無君命不敢卒大夫國人未被君命不敢使従大夫禮公至曰吾固許之反為大夫然後卒之十一月公至自伐鄭始言其故故引其卒日書于公至之月穀梁傳十一月無壬申壬申乃十月也致公而後錄臣子之義也嬰齊實以十月壬申卒而公以十一月還先致公而後錄其卒先君後臣之義也其地未踰竟也附錄左傳齊侯使崔杼為大夫使慶克佐之帥師圍盧討高弱國佐從諸侯圍鄭以難請而歸請于諸侯遂如盧師殺慶克以穀叛惡克淫亂故殺之齊侯與之盟于徐闗而復之十二月盧降使國勝告難于晉待命于清勝國佐子使以高氏難告晉欲討國佐故留其子於外清杜注陽平樂縣是今山東堂邑縣東南有清城為明年殺國佐𫝊十有二月丁巳朔日有食之邾子貜且卒晉殺其大夫郤錡郤犨郤至左傳晉厲公侈多外嬖外嬖愛幸大夫反自鄢陵欲盡去羣大夫而立其左右終士燮言胥童以胥克之廢也怨郤氏胥童胥克子宣八年郤缺廢胥克而嬖于厲公郤錡奪夷陽五田五亦嬖于厲公郤犨與長魚矯争田執而梏之與其父母妻子同一轅繫之車轅既矯亦嬖于厲公欒書怨郤至以其不從己而敗楚師也欲廢之鄢陵戰欒書欲固壘郤至言楚有六閒以取勝使楚公子茷告公鄢陵戰晉囚公子茷以歸曰此戰也郤至實召寡君以東師之未至也與軍帥之不具也曰此必敗吾因奉孫周以事君孫周晉襄公曽孫悼公公告欒書書曰其有焉不然豈其死之不恤而受敵使乎謂鄢陵戰時楚子問郤至以弓君盍嘗使諸周而察之郤至聘于周欒書使孫周見之公使覘之信覘伺也遂怨郤至厲公田與婦人先殺而飲酒後使大夫殺公無道先婦人而後卿佐郤至奉豕進之于公寺人孟張奪之郤至射而殺之公曰季子欺余季子郤至公反以為郤至奪孟張豕厲公將作難胥童曰必先三郤族大多怨去大族不偪敵多怨有庸公曰然郤氏聞之郤錡欲攻公曰雖死君必危郤至曰人所以立信知勇也信不叛君知不害民勇不作亂失兹三者其誰與我死而多怨將安用之君實有臣而殺之其謂君何我之有罪吾死後矣若殺不辜將失其民欲安得乎待命而已受君之禄是以聚黨有黨而爭命罪孰大焉傳言郤至無反心壬午胥童夷羊五帥甲八百將攻郤氏長魚矯請無用衆公使清沸魋助之清沸魋亦嬖人抽戈結衽而偽訟者衽裳際三郤將謀于榭榭講武堂矯以戈殺駒伯苦成叔于其位駒伯郤錡苦成叔郤犨位所坐處也温季曰逃威也凶賊為害故曰威或曰威當為藏遂趨矯及諸其車以戈殺之皆尸諸朝胥童以甲劫欒書中行偃于朝矯曰不殺二子憂必及君公曰一朝而尸三卿余不忍益也對曰人將忍君人謂書與偃臣聞亂在外為姦在内為軌御姦以徳御軌以刑徳綏逺刑治近不施而殺不可謂徳臣偪而不討不可謂刑徳刑不立姦軌竝至臣請行遂出奔狄公使辭于二子辭謝書與偃曰寡人有討于郤氏郤氏既伏其辜矣大夫無辱其復職位皆再拜稽首曰君討有罪而免臣于死君之恵也二臣雖死敢㤀君徳乃皆歸公使胥童為卿公遊于匠麗氏匠麗嬖大夫家欒書中行偃遂執公焉召士匄士匄辭召韓厥韓厥辭曰昔吾畜于趙氏孟姬之讒吾能違兵違去不與兵亂示不與黨言此者明已無所偏助孟姬趙莊姬亂在八年古人有言曰殺老牛莫之敢尸尸主也而况君乎亍一子不能事君焉用厥也穀梁傳自禍于是起矣厲公見殺之禍郤氏雖擅權結怨然既為大夫則君之股肱也厲公不明徵其罪而隂用嬖幸之計一朝而殺三卿又不能顯任忠賢修明國政遂用此以階禍惜哉楚人滅舒庸舒庸杜注東夷國地譜廬州有舒城左傳舒庸人以楚師之敗也敗于鄢陵道吳人圍巢伐駕圍釐虺巢駕釐虺杜注楚四邑在今江南廬州府境遂恃吳而不設備楚公子槖師襲舒庸滅之楚方摧敗而餘威猶足蠶食逺國如使鄢陵得志則毒被華夏可勝道哉故觀舒庸之滅然後知鄢陵之勝討鄭之勤所以挫楚而不復北師者亦晉厲之勞績也附錄左傳閏月乙卯晦欒書中行偃殺胥童以其劫已故民不與郤氏胥童道君為亂故皆書曰晉殺其大夫明郤氏夫民胥童道亂宜為國戮傳在今年經在明春從告十有八年春王正月晉殺其大夫胥童宋督殺孔父弑殤公先書弑而稱及今欒書荀偃殺胥童而弑厲公則以國殺大夫為文而書於弑君之前盖嬖幸之臣導君於昬亡其身以及其君故春秋竝治其罪以為後戒庚申晉弑其君州蒲左傳十八年春王正月庚申晉欒書中行偃使程滑弑厲公程滑晉大夫葬之于翼東門之外以車一乘言不以君禮葬諸侯葬車七乗使荀罃士魴逆周子于京師而立之周子悼公生十四年矣大夫逆于清原周子曰孤始願不及此雖及此豈非天乎抑人之求君使出命也立而不從將安用君二三子用我今日否亦今日共而從君神之所福也傳言其少有才所以能自固對曰羣臣之願也敢不唯命是聼庚午盟而入與諸大夫盟館于伯子同氏晉大夫家辛巳朝于武宫逐不臣者七人夷羊五之屬周子有兄而無慧不能辨菽麥故不可立穀梁傳稱國以弑其君君惡甚矣欒書使程滑弑厲公與趙盾之事無異而於書則沒其名何也時無董狐南史之直書方柄國則赴於諸侯必有所以諉其罪者魯史既承而書之孔子修經雖知其人無所據以革舊史也故稱國以弑俾後人得以考其實焉前書殺三卿繼書殺胥童而後厲公見弑則以君臣不睦而生亂可知矣三卿及胥童皆稱國以殺則當國大臣實與其事可知矣欒書久執兵柄三專征伐明著於經鄢陵之役其子黶實來乞師四卿既殺欒氏專晉則弑君者非書而誰哉此筆削之義游夏所以不能贊也齊殺其大夫國佐左傳齊為慶氏之難故前年國佐殺慶克甲申晦齊侯使士華免以戈殺國佐于内宫之朝士刑官華免名内宫之朝夫人宫朝羣妾處師逃于夫人之宫伏兵宫内恐不勝書曰齊殺其大夫國佐棄命專殺以穀叛故也國佐本疾淫亂殺慶克齊以是討之嫌其罪不及死故傳明言其三罪使清人殺國勝勝國佐子前年待命于清者國弱來奔王湫奔萊弱勝之弟湫國佐黨慶封為大夫慶佐為司寇封佐皆慶克子既齊侯反國弱使嗣國氏禮也佐之罪不及不祀慶克作慝濁亂中閨齊靈不能防閑其母又受母譖而戮高國不君甚矣國位不忍一旦之忿誅慶克據盧以抗其君不得謂之非叛然其心則為其君正家法可憫也故以累上書焉附錄左傳二月乙酉朔晉悼公即位于朝朝廟五日而即位始命百官施舎己責施恩恵舍勞役止逋責逮鰥寡振廢滯舉用舊德匡乏困救災患禁淫慝薄賦斂宥罪戾節器用時用民使民以時欲無犯時不縱私欲奪農時使魏相士魴魏頡趙武為卿相魏錡子魴士㑹子頡魏顆子武趙朔子此四人其父祖皆有勞于晉國荀家荀㑹欒黶韓無忌為公族大夫二苟未知所出無忌韓厥子使訓卿之子弟共儉孝弟使士渥濁為太傅使脩范武子之法渥濁士貞子武子為景公太傅右行辛為司空使脩士蒍之法辛將右行因以為氏士蒍獻公司空弁糾御戎校正屬焉弁糾欒糾也校正主馬官使訓諸御知義戎士尚節義也荀賔為右司士屬焉使訓勇力之士時使司士車右之官勇力皆車右也勇力多不順命故訓以共時之使卿無共御省卿戎御立軍尉以攝之祁奚為中軍尉羊舌職佐之魏絳為司馬絳魏犨子張老為候奄候奄中軍主斥候之官鐸遏宼為上軍尉籍偃為之司馬偃籍談父為上軍司馬使訓卒乗親以聽命相親以聽上命程鄭為乗馬御六騶屬焉使訓羣騶知禮程鄭荀氏别族乗馬御乗車之僕也六騶六閑之騶周禮有六閑馬乗車尚禮容故訓羣騶使知禮凡六官之長皆民譽也總舉六官則知羣官無非其人舉不失職官不易方官守其業無相踰易爵不踰徳師不陵正旅不偪師正軍將命卿也師二千五百人之帥旅五百人之帥言上下有禮不相陵偪民無謗言所以復霸也此以上通言悼公所行未必皆在即位之年公如晉左傳公如晉朝嗣君也夏楚子鄭伯伐宋宋魚石復入於彭城彭城杜注宋邑彭城縣今江南徐州左傳夏六月鄭伯侵宋及曹門外曹門宋城門遂㑹楚子伐宋取朝郟楚子辛鄭皇辰侵城郜取幽丘同伐彭城朝郟城郜幽丘杜注皆宋邑朝郟當在今河南夏邑縣境城郜幽丘俱在今江南蕭縣界納宋魚石向為人鱗朱向􅙮魚府焉五子以十五年出奔楚獨言魚石以帥告以三百乗戍之而還書曰復入惡其依阻大國以兵威還故書復入凡去其國國逆而立之曰入復其位曰復歸諸侯納之曰歸以惡曰復入此四條所以明内外之援辨順逆之辭通君臣取國有家之大例宋人患之西鉏吾曰西鉏吾宋大夫何也若楚人與吾同惡以徳於我吾固事之也不敢貳矣大國無厭鄙我猶憾言苐恐己事之則以我為鄙邑猶恨不足此可患耳不然而收吾憎使贊其政以閒吾釁亦吾患也謂用魚石使佐政今將崇諸侯之姦而披其地披猶分也以塞夷庚夷庚杜注吳晉往來之要道逞姦而攜服攜離也毒諸侯而懼吳晉吾庸多矣非吾憂也且事晉何為晉必恤之不書納不與納也諸侯世國返國而書復入正也大夫不世官既見絶於君而復入焉則其惡甚矣不言叛者將以亂國非直叛君而已也公至自晉晉侯使士匄來聘左傳公至自晉晉范宣子來聘宣子士匄且拜朝也拜謝公朝君子謂晉於是乎有禮公朝始至而聘使即來悼公之下諸侯肅矣此列國所以睦叛國所以服也秋把伯來朝左傳秋把桓公來朝勞公且問晉故公以晉君語之把伯於是驟朝於晉而請為昏為平公不徹樂張本附録左傳七月宋老佐華喜圍彭城老佐卒焉言所以不克彭城八月邾子來朝左傳八月邾宣公來朝即位而來見也成公季年把邾相繼來朝以晉悼公初立首加禮於魯故二君來修舊好欲因魯以自通於晉耳故自是晉合諸侯把與二邾無役不從也築鹿囿左傳築鹿囿書不時也公羊傳何以書譏何譏爾有囿矣又為也穀梁傳築不志此其志何也山林藪澤之利所以與民共也虞之非正也虞謂築而防之是時大夫擅國威權日去而公自娛於鳥獸草木達時害民非易所謂冥豫者與己丑公薨于路寢左傳己丑公薨于路寢言道也得君薨之道穀梁傳路寢正也男子不絶婦人之手以齊終也齊潔齊也冬楚人鄭人侵宋左傳冬十一月楚子重救彭城伐宋宋華元如晉告急韓獻子為政時欒書卒韓厥將中軍曰欲求得人必先勤之成霸安疆自宋始矣晉侯師于台谷以救宋台谷杜注地闕遇楚師于靡角之谷楚師還畏晉强也靡角杜注宋地楚鄭侵宋救彭城也不書救者不與其救也悼公一出而楚師還與前楚師至而諸侯還規模一變矣齊桓剙霸始於平宋亂晉文繼霸始於釋宋圍悼公嗣興又始於彭城之救以宋乃諸侯之望南北之樞紐也晉侯使士魴來乞師魴公羊作彭書乞師止此左傳晉士魴來乞師將救宋季文子問師數于臧武仲武仲宣叔子名紇對曰伐鄭之役知伯實來下軍之佐也伐鄭在十七年知伯荀罃今彘季亦佐下軍彘季士魴如伐鄭可也事大國無失班爵而加敬焉禮也從之悼公復興霸業而乞師以救宋猶遵厲公故事元年而後無復乞師則召兵而已矣十有二月仲孫蔑㑹晉侯宋公衛侯邾子齊崔杼同盟于虛朾虚朾杜注闕或云即宋之虚也左傳十二月孟獻子㑹于虚朾謀救宋也宋人辭諸侯而請師以圍彭城不敢煩諸侯故但請其師為襄元年圍彭城傳孟獻子請于諸侯而先歸㑹葬諸侯師至楚鄭已退故宋人辭諸侯而請其師以圍彭城先為此盟魯君在䘮故不與㑹亦不遣大夫聼命悼公所以懷諸侯也丁未葬我君成公左傳丁未葬我君成公書順也薨于路寢五月而葬國家安静世適承嗣故曰順日講春秋解義卷三十六
