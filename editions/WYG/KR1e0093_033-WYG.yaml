body:
  text: 欽定四庫全書日講春秋解義卷三十三成公七年春王正月鼷鼠食郊牛角改卜牛鼷鼠又食其角乃免牛榖梁傳不言日急辭也辭中促急不容日過有司也郊牛日展觓角而知傷觓球球然角貎展道盡矣其所以備災之道不盡也改卜牛鼷鼠又食其角又有繼之辭也前已食故曰繼其緩辭也曰亡乎人矣非人之所能也所以免有司之過也乃免牛乃者亡乎人之辭也免牲者為之緇衣纁裳有司𤣥端奉送至于南郊免牛亦然免牲不曰不郊免牛亦然鼷鼠鼱鼩物之微者牛有力之畜何至為所食蓋將祭之牲必繫於牢而設楅衡以制其角故不能備鼠也始焉食角乃有司疎於防伺既展其傷當知所備而又食焉則非有司之過矣許氏翰曰小害大下賊上食而又食三桓子孫相繼之象也宣公有虞三桓之志至成公始弗戒矣理或然也吳伐郯吳始見經左傳七年春吳伐郯郯成季文子曰中國不振旅蠻夷入伐而莫之或恤無弔者也夫言中國不能相愍恤詩曰不弔昊天亂靡有定其此之謂乎詩小雅刺在上者不能弔愍下民故號天告亂有上不弔其誰不受亂上謂霸主吾亡無日矣君子曰知懼如是斯不亡矣楚始見經以州舉繼以國舉吳始見經即以國舉繼乃稱人繼乃稱爵皆舊史之文聖人因之以著世變者也吳自壽夢得申公巫臣即為楚患至是伐郯兵連上國始見於春秋晉人苐知通吳以制楚不知楚抑而吳興其患適相等耳附録左傳鄭子良相成公以如晉見且拜師為楚伐鄭張本夏五月曹伯來朝左傳夏曹宣公來朝曹與魯為兄弟之國徒以弱小僖文以後屢朝於魯而魯始終不聞報聘邦交之非禮槪可見矣不郊猶三望經書猶三望者三僖三十一年書免牲而繫以猶三望不言不郊者免牲則不郊可知矣宣三年書牛死乃不郊而繫以猶三望蓋帝牛死或扳稷牛而用之必言不郊義乃不漏若此年旣書免牛又書不郊因有閒事不可但言猶三望故以不郊起之也秋楚公子嬰齊帥師伐鄭公㑹晉侯齊侯宋公衞侯曹伯莒子邾子把伯救鄭八月戊辰同盟于馬陵馬陵杜注衞地陽平元城縣東南有地名馬陵在今直隸大名府治東南左傳秋楚子重伐鄭師于氾氾杜注鄭地在襄城縣南諸侯救鄭鄭共仲侯羽軍楚師二子鄭大夫囚鄖公鍾儀鍾儀楚鄖縣大夫獻諸晉八月同盟于馬陵尋蟲牢之盟且莒服故也蟲牢盟在五年莒本屬齊齊服故莒從之晉人以鍾儀歸囚諸軍府軍藏府也為九年晉侯見鍾儀張本楚人頻年伐鄭橫暴憑陵之罪不待貶而見矣晉前此救鄭以大夫帥師今則國君親將合九國之君以揚軍聲故鄭恃此以不屈於楚盟蜀之後晉霸所以復延頼有此耳故晉景之時書同盟者五蓋諸侯同懼楚氛之惡欲倚晉以自固而載書以是要言耳公至自㑹諸侯㑹而楚師退故不以救鄭至吳入州來州來杜注楚邑淮南下蔡縣今江南夀州北有蔡國城左傳楚圍宋之役在宣十四年師還子重請取于申呂以為賞田王許之申公巫臣曰不可此申呂所以邑也是以為賦以御北方若取之是無申呂也言申呂頼此田成邑不得此田則無以出兵賦而二邑壞晉鄭必至于漢王乃止子重是以怨巫臣子反欲取夏姬巫臣止之遂取以行子反亦怨之及共王即位子重子反殺巫臣之族子閻子蕩及清尹弗忌及襄老之子黑要以夏姬故竝怨黑要而分其室子重取子閻之室使沈尹與王子罷分子蕩之室子反取黑要與清尹之室巫臣自晉遺二子書曰爾以讒慝貪惏事君而多殺不辜余必使爾罷于奔命以死巫臣請使于吳晉侯許之吳子壽夢説之夀夢季札父乃通吳于晉以兩之一卒適吳舎偏兩之一焉司馬法百人為卒二十五人為兩車九乗為小偏十五乗為大偏正義曰以兩之一謂將二十五人也又言卒謂更將百人凡將一百二十五人適吳也舎偏謂舍一偏之車九乗也兩之一又舎二十五人也蓋畱九乗車及一兩二十五人令吳習之與其射御敎吳乗車敎之戰陳敎之叛楚先是吳嘗屬楚寘其子狐庸焉使為行人于吳吳始伐楚伐巢伐徐巢徐楚屬國子重奔命救巢徐馬陵之㑹吳入州來子重自鄭奔命因伐鄭而行子重子反于是乎一歲七奔命蠻夷屬于楚者吳盡取之是以始大通吳于上國州來楚之附庸迤北則魯迤南而西則楚楚控州來則可以禦吳吳得之則可以窺楚晉之通吳亦制楚之善策然不能自彊於政治則楚雖罷敝而吳亦爭雄於齊晉矣書吳入州來録其始事也冬大雩榖梁傳雩不月而時非之也冬無為雩也凡雩皆因旱而舉榖梁謂冬無為雩非也周之十月正夏之八月是時不雨能無雩乎衞孫林父出奔晉左傳衞定公惡孫林父冬孫林父出奔晉林父良夫之子衞侯如晉晉反戚焉戚林父邑林父出奔戚隨屬晉孫氏世執衞政而自結於晉之彊家故見惡於君遂挾地以奔晉為衞患者幾四十年魯之季氏亦然晉君不能謹持操柄聽於彊家私庇諸侯之叛臣以致衞獻魯昭窮於無告而不知晉社已陰移於六卿矣履霜堅冰由來者漸豈不信與八年春晉侯使韓穿來言汶陽之田歸之于齊左傳八年春晉侯使韓穿來言汶陽之田歸之于齊季文子餞之私焉私與之言曰大國制義以為盟主是以諸侯懷德畏討無有貳心謂汶陽之田敝邑之舊也而用師于齊使歸諸敝邑今有二命曰歸諸齊信以行義義以成命小國所望而懷也信不可知義無所立四方諸侯其誰不解體詩曰女也不爽士貳其行士也罔極二三其德爽差也極中也詩衞風婦人怨夫不一其行喩魯事晉猶女之事夫不敢過差而晉有罔極之心反二三其德七年之中一與一奪二三孰甚焉士之二三猶喪妃耦而况霸主霸主將德是以以用也而二三之其何以長有諸侯乎詩曰猶之未遠是用大簡猶圖也簡諫也詩大雅言王者圖事不遠故用大道諫之行父懼晉之不遠猶而失諸侯也是以敢私言之公羊傳來言者何内辭也脅我使我歸之也曷為使我歸之鞌之戰齊師大敗齊侯歸弔死視疾七年不飲酒不食肉晉侯聞之曰嘻奈何使人之君七年不飲酒不食肉請皆反其所取侵地榖梁傳于齊緩辭也不使盡我也若曰為之請歸不使晉制命于我鞌之戰晉令於齊反魯侵地故以汶陽歸魯復有二命俾歸於齊義不足以宗諸侯矣然曰來言是尚未能必魯之聽從也而魯侯微弱遂以歸齊而不能保其何能國乎晉欒書帥師侵蔡左傳晉欒書侵蔡六年未得志故遂侵楚獲申驪申驪楚大夫楚師之還也謂六年遇于繞角時晉侵沈獲沈子揖初從知范韓也知莊子范文子韓獻子君子曰從善如流宜哉宜有功也詩曰愷悌君子遐不作人遐逺也不語助作用也詩大雅言文王能遠用善人求善也夫作人斯有功績矣是行也鄭伯將㑹晉師門于許東門大獲焉過許見其無備因攻之蔡逼於楚故自翟泉以後未嘗從諸侯㑹盟晉之侵蔡報楚之伐鄭也大國爭衡而小國受其敝可矜孰甚焉公孫嬰齊如莒左傳聲伯如莒逆也自為逆婦而書者因聘而逆先儒謂行父如陳公孫兹如牟嬰齊如莒皆因聘而請昏納婦春秋止書曰如不許其託公以遂私非也據經所書止聘問之恆詞治經者何由知其請昏納婦而得筆削之義乎蓋事本㣲細不宜登於策書而又無害於義故略之耳宋公使華元來聘左傳宋華元來聘聘共姬也穆姜之女成公姊妹為宋共公夫人即伯姬也凡列國相聘必有事焉非專行聘禮也華元之來蓋圖昏爾夏宋公使公孫壽來納幣左傳夏宋公使公孫壽來納幣禮也納幣應使卿公羊傳納幣不書此何以書録伯姬也伯姬守節逮火而死賢故詳録其禮納幣不書此何以書納幣使卿非禮也春秋於共姬之歸宋自納幣致女以及三國來媵備載而無遺雖以表共姬之賢亦以志其過禮其義竝行而不相悖也晉殺其大夫趙同趙括左傳晉趙莊姬為趙嬰之亡故譖之于晉侯趙嬰亡在五年曰原屏將為亂欒郤為徵欒氏郤氏亦徵其為亂六月晉討趙同趙括武從姬氏畜于公宮趙武莊姬之子莊姬晉成公女畜養也以其田與祁奚韓厥言于晉侯曰成季之勲宣孟之忠成季趙衰宣孟趙盾而無後為善者其懼矣三代之令王皆數百年保天之禄夫豈無辟王頼前哲以免也辟邪辟周書曰不敢侮鰥寡所以明德也周書康誥言文王不侮鰥寡而德益明欲晉景恤趙孤以法文王乃立武而反其田焉不去其官殺無罪也稱國以殺君與當國大臣共主之也據左氏莊姬之譖由同括之逐趙嬰則殺無罪可知矣莊姬誣同括將為亂而欒郤為徵則忌害趙氏而共成是獄可知矣秋七月天子使召伯來賜公命賜公羊穀梁作錫錫命止此左傳秋召桓公來賜公命桓公周卿士即召伯公羊傳其稱天子何元年春王正月正也其餘皆通矣天王天子皆可通稱穀梁傳禮有受命無來錫命錫命非正也曰天子何也曰見一稱也前此未有言天子者今言天子是更見一稱成公即位八年而不入見既踰五服一朝之期又未嘗有敵愾獻功之事何為而來賜命哉天子僭賞而諸侯亦不以為德自是以後錫命亦不見於經矣書天子或舊史從策命之文或傳寫誤也附録左傳晉侯使申公巫臣如吳假道于莒與渠丘公立于池上渠丘公莒子朱也渠丘杜注邑名莒縣有蘧里今屬山東青州府曰城已惡莒子曰辟陋在夷其孰以我為虞虞度也對曰夫狡焉思啓封疆以利社稷者何國蔑有唯然故多大國矣唯或思或縱也思謂思開封疆縱不設備勇夫重閉况國乎為明年莒潰傳冬十月癸卯把叔姬卒左傳冬把叔姬卒來歸自把故書叔姬見出於把而來歸遂卒於魯但稱叔姬恐其同於未嫁之女故仍以把書書卒者為他日喪歸於把也晉侯使士燮來聘叔孫僑如㑹晉士燮齊人邾人伐郯左傳晉士燮來聘言伐郯也以其事吳故七年郯與吳成公賂之請緩師文子不可文子士燮曰君命無貳失信不立禮無加貨事無二成公私不兩成君後諸侯是寡君不得事君也燮將復之季孫懼使宣伯帥師㑹伐郯郯之見伐於吳晉不能救及不得已而與吳成又帥諸侯以伐之晉不能制楚而徒欲服鄭不能制吳而反以責郯宜其不足以宗諸侯而魯人既知郯不當伐又屈於彊令而㑹師焉其不能立亦可知矣衞人來媵左傳衞人來媵共姬禮也凡諸侯嫁女同姓媵之異姓則否必以同姓者參骨肉至親所以息陰訟公羊傳媵不書此何以書録伯姬也榖梁傳媵淺事也不志此其志何也以伯姬之不得其所故盡其事也不得其所謂災死也媵伯姬也禮諸侯嫁女于諸侯以姪娣從衞人來媵非失禮也以後此齊晉來媵踰諸侯一娶九女之制故備書以志非禮若以異姓不宜來媵為義則但書齊媵可矣左氏之說非也九年春王正月把伯來逆叔姬之喪以歸左傳九年春把桓公來逆叔姬之喪請之也魯請于把把叔姬卒為把故也死而反葬故卒稱把逆叔姬為我也既棄而復逆其喪明為魯故公羊傳把伯曷為來逆叔姬之喪以歸内辭也脅而歸之也穀梁傳傳曰夫無逆出妻之喪而為之也言其不合為而為之故書以見其非出婦未反而逆其喪非禮也女嫁未三月而卒尚歸葬於女氏之黨况出而死於母家乎把伯以叔姬為賢則初不當出以為不賢則卒不當以歸二者必居其一矣觀其初出不敢直歸之魯先朝而後歸焉則懼魯可知其逆喪以歸必魯人脅之耳内女出而歸者三郯伯姬齊子叔姬皆不書卒以無異事法不宜書非謂把叔姬賢於二姬也公㑹晉侯齊侯宋公衞侯鄭伯曹伯莒子把伯同盟于蒲蒲杜注衞地在長垣縣西南左傳為歸汶陽之田故諸侯貳于晉歸田在前年晉人懼㑹于蒲以尋馬陵之盟馬陵盟在七年季文子謂范文子曰德則不競尋盟何為范文子曰勤以撫之寛以待之堅強以御之明神以要之柔服而伐貳德之次也是行也將始㑹吳吳人不至為十五年㑹鍾離𫝊晉人以諸侯皆貳故盟蒲以固結之然諸侯之貳以晉制命不信復命魯以汶陽之田歸之于齊也已則無信而要人以信慮人之異而彊之同安能保其不異哉其書同盟蓋諸侯同懼楚而晉復懼諸侯之貳故載書以是要言耳公至自㑹二月伯姬歸于宋左傳二月伯姬歸于宋前書納幣後書致女及三國來媵則伯姬之歸豈得不書非以伯姬之賢而特書其歸也范氏甯謂逆者非卿不書以公孫壽納幣觀之逆不應使微者諸儒以為宋公親迎亦無可據姑發所疑俟治經者考焉附録左傳楚人以重賂求鄭鄭伯㑹楚公子成于鄧為晉人執鄭伯傳夏季孫行父如宋致女左傳夏季文子如宋致女復命公享之賦韓奕之五章韓奕詩大雅其五章言蹶父嫁女于韓侯為女相所居莫如韓樂以喩魯侯有蹶父之德宋公如韓侯宋土如韓樂穆姜出于房再拜曰穆姜伯姬毋聞文子言宋樂喜而出謝其行勞大夫勤辱不忘先君以及嗣君施及未亡人先君猶有望也敢拜大夫之重勤又賦緑衣之卒章而入緑衣詩邶風取其我思古人實獲我心喩文子言得已意公羊傳未有言致女者此其言致女何録伯姬也榖梁傳致者不致者也婦人在家制于父既嫁制于夫如宋致女是以我盡之也刺已嫁而猶以父制盡之不正故不與内稱也内稱謂稱使逆者微故致女詳其事賢伯姬也禮婦人三月廟見而後稱婦父母使人聘問以致成婦禮謂之致女伯姬賢魯國重之故使卿致也晉人來媵左傳晉人來媵禮也公羊傳媵不書此何以書録伯姬也榖梁傳媵淺事也不志此其志何也以伯姬之不得其所故盡其事也亦媵伯姬也伯姬賢聞於四鄰故諸國爭媵信其無妬忌之行也秋七月丙子齊侯無野卒晉人執鄭伯晉欒書帥師伐鄭左傳秋鄭伯如晉晉人討其貳于楚也執諸銅鞮銅鞮杜注晉别縣在上黨欒書伐鄭鄭人使伯蠲行成伯蠲鄭行人晉人殺之非禮也兵交使在其間可也楚子重侵陳以救鄭陳與晉故榖梁傳不言戰以鄭伯也為尊者諱恥王師敗績于貿戎是也為賢者諱過為齊桓諱滅項是也為親者諱疾欒書以鄭伯伐鄭不言戰是也鄭兄弟之國故曰親君臣交兵病莫大焉故曰疾附録左傳晉侯觀于軍府見鍾儀問之曰南冠而縶者誰也南冠楚冠縶拘執有司對曰鄭人所獻楚囚也使稅之鄭獻鍾儀在七年稅解也召而弔之再拜稽首問其族對曰泠人也泠人樂官公曰能樂乎對曰先父之職官也敢有二事言不敢學他事使與之琴操南音南音楚聲公曰君王何如對曰非小人之所得知也固問之對曰其為大子也師保奉之以朝于嬰齊而夕于側也嬰齊令尹子重側司馬子反言其尊卿敬老不知其他公語范文子文子曰楚囚君子也言稱先職不背本也樂操土風不忘舊也稱大子抑無私也舍其近事而逺稱少小以示性所自然明至誠名其二卿尊君也不背本仁也不忘舊信也無私忠也尊君敏也仁以接事信以守之忠以成之敏以行之事雖大必濟君盍歸之使合晉楚之成公從之重為之禮使歸求成為下十二月晉楚結成張本鄭雖貪賂從楚猶朝於晉是未告絶於晉也晉不能招攜以禮懷遠以德而拘其君伐其國戮其行成之使暴矣書人以執非霸討也殺伯蠲不書既執其君舉重而餘可略也楚侵陳以救鄭不書鄭無可救之善不與其救也冬十有一月葬齊頃公楚公子嬰齊帥師伐莒庚申莒潰楚人入鄆鄆杜注莒别邑任公輔曰東鄆也左傳冬十一月楚子重自陳伐莒圍渠丘渠丘城惡衆潰奔莒戊申月六日楚入渠丘莒人囚楚公子平楚人曰勿殺吾歸而俘莒人殺之楚師圍莒莒城亦惡庚申月十八日莒潰楚遂入鄆莒無備故也終巫臣之言君子曰恃陋而不備罪之大者也備豫不虞善之大者也莒恃其陋而不修城郭浹辰之間而楚克其三都無備也夫浹辰十二日也詩曰雖有絲麻無棄菅蒯雖有姬姜無棄蕉萃凡百君子莫不代匱言備之不可以已也逸詩也絲麻可為布帛菅蒯草之可用以織者姬姜大國女蕉萃陋賤之人榖梁傳其日莒雖夷狄猶中國也大夫潰莒而之楚是以知其上為事也臣以叛君為事明君臣無道惡之故謹而日之也潰例月甚之故日守國之道以安民為本鑿池築城必民能效死而後可守也莒恃僻陋不修城郭致楚浹辰而克其三都信無備矣然兵至而民逃其上則雖有金城湯池豈足恃哉楚之伐莒以救鄭也莒同馬陵及蒲之盟晉坐視其危而莫之恤而惡鄭之從楚執其君以伐其國何以為盟主乎秦人白狄伐晉左傳秦人白狄伐晉諸侯貳故也自滅庸以來秦楚交合而同心以謀晉晉方爭鄭楚人伐莒以撓其東故秦與狄復攻其西使晉力不能支而自屈也鄭人圍許左傳鄭人圍許示晉不急君也此秋晉執鄭伯是則公孫申謀之曰我出師以圍許為將改立君者而紓晉使紓緩也勿亟遣使詣晉示欲更立君晉必歸君為明年晉侯歸鄭伯張本鄭以晉人執其君歸咎於許而圍之且使晉知執其君為無益而速歸之也晉不能制楚庇鄭而彊以非義相要諸侯皆貳即鄭豈可以力服耶城中城左傳城中城書時也榖梁傳城中城者非外民也中城者郛之内宮之外也魯懲莒之無備而潰故懼而城之夫諸侯守在四境故楚人城郢謀國者以為憂至城中城則其為儆守也益微矣且設險於城郭之内將獨保其戚屬乎故榖梁以為外民也附録左傳十二月楚子使公子辰如晉報鍾儀之使請修好結成日講春秋解義卷三十三
