body:
  text: 欽定四庫全書日講春秋解義卷五十三昭公十有九年春附録左傳十九年春楚工尹赤遷陰于下陰陰杜注隂縣屬南鄉郡今湖廣光化縣西漢水西岸有古隂縣城令尹子瑕城郟郟亦楚邑叔孫昭子曰楚不在諸侯矣其僅自完也以持其世而已遷隂城郟皆欲以自完守楚子之在蔡也郹陽封人之女奔之郹陽杜注蔡邑當在今新蔡縣境生大子建及即位使伍奢爲之師伍奢伍舉之子伍員之父費無極爲少師無寵焉欲譖諸王曰建可室矣室妻也王爲之聘于秦無極與逆勸王取之正月楚夫人嬴氏至自秦爲下拜夫人起宋公伐邾左傳鄅夫人宋向戌之女也故向寧請師寜向戌子請宋公伐邾二月宋公伐邾圍蟲蟲杜注邾邑當在今山東濟寧州境三月取之乃盡歸鄅俘天下無霸邾以蕞爾小邦逞其暴横而宋元於此能一正入鄅之亂此所謂聲罪執言之師也夏五月戊辰許世子止弑其君買左傳夏許悼公瘧五月戊辰飲大子止之藥卒止獨進藥不由醫大子奔晉書曰弑其君君子曰盡心力以事君舎藥物可也藥物有毒當由醫非凡人所知譏止不舍藥物所以加弑君之名穀梁傳日弑正卒也凡弑不書日此弑而日知買爲正卒也正卒則止不弑也不弑而曰弑責止也責止不嘗藥止曰我與夫弑者不立乎其位以與其弟虺哭泣歠飦粥嗌不容粒嗌喉也未踰年而死故君子卽止自責而責之也就其有自責心故以備禮責之許悼公飲世子止之藥而卒事與楚商臣蔡般異而同以弑書何也藥出於止而君死於藥則止雖非弑而弑君之罪止有不得辭者故加弑焉所以敎天下之爲臣子者也其異於商臣般者過與故之不同耳其心不同而春秋之文一施之何以辨乎觀商臣般皆立乎其位而止則弗立乎其位比事以推而止之不志乎弑亦可見矣且許與陳蔡皆密邇於楚許且近遷于白羽矣楚虔能假討賊之名以滅陳蔡何棄疾遂釋許而不問乎此又可尋迹推理而知之者也已夘地震經書地震者五而昭公之世再見地臣道也義主安靜時季孫僭竊臣道失常天心譴告而昭公漫不知省其及宜矣附錄左傳邾人郳人徐人會宋公乙亥同盟于蟲終宋公伐邾事楚子為舟師以伐濮濮杜注南夷費無極言于楚子曰晉之伯也邇于諸夏而楚辟陋故弗能與爭若大城城父而寘大子焉以通北方王收南方是得天下也王説從之故大子建居于城父令尹子瑕聘于秦拜夫人也為明年譖大子張本秋齊髙發帥師伐莒左傳秋齊高發帥師伐莒莒不事齊故莒子奔紀鄣紀鄣杜注莒邑也東海贛檢縣東北有紀城今山東莒州即江南贛榆縣界使孫書伐之孫書陳無宇之子子占也初莒有婦人莒子殺其夫已爲嫠婦寡婦爲嫠及老託于紀鄣紡焉以度而去之因紡纑連所紡以度城高下而藏之待外攻者欲報讎去藏也及師至則投諸外繫䋲城上而投其所垂于外随之以出或獻諸子占子占使師夜縋而登縁繩登城登者六十人縋絕師鼓譟城上之人亦譟莒共公懼啓西門而出七月丙子齊師入紀傳言怨不在大齊景有爭霸之心因莒不事齊遂興是役夫不以徳義服人而徒計近功侵凌弱小以晏子爲之輔佐亦不能有所匡正則所謂顯君者何足稱哉冬葬許悼公公羊傳賊未討何以書葬不成于弑也曷爲不成于弑止進藥而藥殺也止進藥而藥殺則曷爲加弑焉爾譏子道之不盡也其譏子道之不盡奈何曰樂正子春之視疾也樂正子春曽子弟子以孝名聞復加一飯則脱然愈復損一飯則脱然愈復加一衣則脱然愈復損一衣則脱然愈脱然疾除貌也言消息得其節止進藥而藥殺是以君子加弑焉爾失其消息多少之宜曰許世子止弑其君買是君子之聽止也聽治止罪葬許悼公是君子之赦止也原止進藥本欲愈父之病無害父之意故赦之赦止者免止之罪辭也穀梁𫝊日卒時葬不使止爲弑父也曰子既生不免乎水火母之罪也羈貫成童不就師傅父之罪也羈貫謂交笄剪髪以爲飾成童八嵗以上就師學問無方心志不通身之罪也心志既通而名譽不聞友之罪也名譽既聞有司不舉有司之罪也有司舉之王者不用王者之過也許世子不知嘗藥累及許君也許君不授子以師傅使不識嘗藥之義故累及之許止弑君與趙盾弑君皆聖人特筆然晉靈公不書葬而許悼公書葬者趙盾力能討賊而不討不得不終誅之若許止痛父之死咎已之深未踰年而卒則其心可知矣故上書弑以著止有弑君之事此書葬以明止實無弑君之心一立法甚嚴一待人以恕也附録左𫝊是嵗也鄭駟偃卒子游娶于晉大夫生絲弱子游駟偃也弱幼少其父兄立子瑕子瑕子游叔父駟乞子產憎其爲人也憎子瑕且以爲不順弗許亦弗止駟氏聳聳懼他日絲以告其舅冬晉人使以幣如鄭問駟乞之立故駟氏懼駟乞欲逃子產弗遣請龜以卜亦弗予大夫謀對子産不待而對客曰鄭國不天寡君之二三臣札瘥夭昏大死曰札小疫曰瘥短折曰夭未名曰昏今又喪我先大夫偃其子幼弱其一二父兄懼隊宗主私族于謀而立長親于私族謀之寡君與其二三老曰抑天實剝亂是吾何知焉諺曰無過亂門民有兵亂猶憚過之而况敢知天之所亂今大夫將問其故抑寡君實不敢知其誰實知之平丘之會在十三年君尋舊盟曰無􅂉失職若寡君之二三臣其即世者晉大夫而專制其位是晉之縣鄙也何國之爲辭客幣而報其使遣人報晉使晉人舍之楚人城州來沈尹戌曰楚人必敗十三年吳縣州來今就城而取之戌莊王曾孫葉公諸梁父也昔吳滅州來子旗請伐之王曰吾未撫吾民今亦如之而城州來以挑吳能無敗乎侍者曰王施舍不倦息民五年可謂撫之矣戌曰吾聞撫民者節用于内而樹德于外民樂其性而無寇讎今宮室無量民人日駭勞罷死轉轉遷徙也忘寢與食非撫之也鄭大水龍鬭于時門之外洧淵時門鄭城門洧淵杜注洧水出滎陽密縣東南至潁川長平入潁按今洧水自密縣東流經新鄭縣南門又東會于溱水謂之雙洎河卽洧淵也國人請爲禜焉子産弗許曰我鬭龍不我覿也覿見也龍鬬我獨何覿焉禳之則彼其室也淵龍之室吾無求于龍龍亦無求子我乃止也傳言子産之知令尹子瑕言蹶由于楚子曰蹶由吳王弟五年靈王執以歸彼何罪諺所謂室于怒市于色者楚之謂矣言靈王怒吳子而執其弟猶人忿于室家而作色于市人舍前之忿可也乃歸蹶由言楚子能用善言二十年春王正月附録左傳二十年春王二月己丑日南至是嵗朔旦冬至之嵗也當言正月己丑朔日南至時史失閏閏更在二月後故經因史而書正月傳更具于二月記南至日以正歴也梓愼望氛氛氣也時魯侯不行登臺之禮使梓慎望氛曰今兹宋有亂國㡬亡三年而後弭蔡有大喪爲宋華向出奔蔡侯卒傳叔孫昭子曰然則戴桓也戴族華氏桓族向氏汰侈無禮已甚亂所在也傳言妖由人興費無極言于楚子曰建與伍奢將以方城之外叛自以爲猶宋鄭也齊晉又交輔之將以害楚其事集矣王信之問伍奢伍奢對曰君一過多矣一過納建妻何信于讒王執伍奢忿奢切言使城父司馬奮揚殺大子未至而使遣之知大子寃故遣令去三月大子建奔宋王召奮揚奮揚使城父人執已以至王曰言出于余口入于爾耳誰告建也對曰臣告之君王命臣曰事建如事余臣不佞不能苟貳奉初以還奉初命以周旋不忍後命故遣之既而悔之亦無及已王曰而敢來何也對曰使而失命召而不來是再奸也逃無所入王曰歸從政如他日善其言舍使還無極曰奢之子材若在吳必憂楚國盍以免其父召之彼仁必來不然將爲患王使召之曰來吾免而父棠君尚謂其弟員曰棠君奢之長子尚也為棠邑大夫員尚弟子胥爾適吳我將歸死吾知不逮自以知不及員我能死爾能報聞免父之命不可以莫之奔也親戚為戮不可以莫之報也奔死免父孝也度功而行仁也仁者貴成功擇任而往知也員任報讎知死不辟勇也尚為勇父不可棄俱去為棄父名不可廢俱死為廢名爾其勉之相從為愈言愈于同奔共死也伍尚歸奢聞員不來曰楚君大夫其旰食乎將有吳憂不得早食楚人皆殺之員如吳言伐楚之利于州于州于吳子僚公子光曰是宗為戮而欲反其讎不可從也員曰彼將有他志光欲弑僚不利員用事故破其議而員亦知之余姑為之求士而鄙以待之計未得用故進勇士以求入于光退居邊鄙乃見鱄設諸焉鱄諸勇士而耕于鄙為二十七年吳弑僚𫝊夏曹公孫㑹自鄸出奔宋鄸穀梁作夢杜註曹邑在今山東曹州北公羊傳奔未有言自者此其言自何畔也畔則曷為不言其畔為公子喜時之後諱也春秋為賢者諱何賢乎公子喜時讓國也其讓國奈何曹伯廬卒于師在成十三年則未知公子喜時從與公子負芻從與喜時曹伯廬弟負芻喜時庶兄㦯爲主于國㦯爲主于師古者諸侯師出世子率衆守國其次宜爲君者持棺絮從所以備不虞㦯時疾病相代行史丈不具故傳疑之公子喜時見公子負芻之當主也逡廵而退賢公子喜時則曷爲爲會諱君子之善善也長惡惡也短惡惡止其身善善及子孫賢者子孫故君子爲之諱也穀梁𫝊自夢者專乎夢也能專制夢曹無大夫其曰公孫何也言其以貴取之而不以叛也會以公孫之貴而得夢既而不以之叛明曹君無道致令其奔非㑹之罪故書公孫以善之春秋時臣能專其邑無不叛其國者故經於大夫自其邑出奔者皆先書叛以正其罪如宋華亥向寧華定自南里出奔楚先書入南里以叛宋公之弟辰自蕭来奔先書入蕭以叛是也此書自鄸出奔以見鄸乃會之世邑所得專制而不敢據邑以要君與身在國都倉卒見逐者異耳㦯謂爲公子喜時之後賢之非也春秋之義善善惡惡各以其事何有賢其祖而遂襃其子孫乎且會爲喜時之子孫亦無所考公羊未見國史所傳事迹多未可信也附録左傳宋元公無信多私而惡華向華定華亥與向寧謀曰亡愈于死先諸欲先作亂華亥僞有疾以誘羣公子公子問之則執之夏六月丙申殺公子寅公子御戎公子朱公子固公孫援公孫丁拘向勝向行于其廩八子皆公黨公如華氏請焉弗許遂劫之劫公癸夘取大子欒與母弟辰公子地以爲質欒景公也辰及地皆元公弟一云皆大子欒兄弟公亦取華亥之子無慼向寜之子羅華定之子啓與華氏盟以爲質爲此冬華向出奔傳秋盜殺衛侯之兄縶縶公羊穀梁作輒左傳衛公孟縶狎齊豹公孟靈公兄也齊豹齊惡之子爲衛司寇狎輕也奪之司寇與鄄鄄杜注豹邑有役則反之縶足不良故有役則以官邑還豹使行無則取之公孟惡北宮喜褚師圃欲去之喜貞子公子朝通于襄夫人宣姜宣姜靈公嫡母懼而欲以作亂故齊豹北宮喜褚師圃公子朝作亂初齊豹見宗魯于公孟薦達也爲驂乘焉將作亂而謂之曰公孟之不善子所知也勿與乘吾將殺之對曰吾由子事公孟子假吾名焉故不吾逺也言子借我以善名故公孟親近我雖其不善吾亦知之抑以利故不能去是吾過也今聞難而逃是僭子也使子言不信子行事乎吾將死之以周事子周猶終竟也而歸死于公孟其可也丙辰衛侯在平夀平壽杜注衛下邑公孟有事于蓋獲之門外有事祭也蓋獲衛郭門齊子氏帷于門外而伏甲焉齊豹之家使祝鼃寘戈于車薪以當門要其前使一乘從公孟以出亦如前車寘戈于薪尋其後使華齊御公孟宗魯驂乘及閎中閎曲門中齊氏用戈擊公孟宗魯以背蔽之㫁肱以中公孟之肩皆殺之公聞亂乘驅自閲門入閲門衛城門名慶比御公公南楚驂乘使華寅乘貳車公副車及公宮鴻駵魋駟乘于公鴻駵魋復就公乘一車四人公載寶以出褚師子申遇公于馬路之衢遂從從公出過齊氏使華寅肉袒執蓋以當其闕肉袒示不敢與齊氏爭執蓋蔽公而去闕空也以蓋當待從空闕之處齊氏射公中南楚之背公遂出寅閉郭門不欲令追者出踰而從公踰郭出公知死鳥死鳥杜注衛地析朱鉏宵從竇出徒行從公朱鉏成子黒背孫齊侯使公孫青聘于衛青頃公之孫既出聞衛亂使請所聘公曰猶在竟内則衛君也乃將事焉行聘事遂從諸死鳥請將事辭曰亡人不佞失守社稷越在草莾吾子無所辱君命賓曰寡君命下臣于朝曰阿下執事阿比也命已使比衛臣下臣不敢貳主人曰君若恵顧先君之好照臨敝邑鎭撫其社稷則有宗祧在乃止衛侯固請見之不獲命以其良馬見爲相見之禮爲未致使故也故不敢以容禮見衛侯以爲乘馬喜其敬已故貴其物賓將掫掫行夜主人辨曰亡人之憂不可以及吾子草莽之中不足以辱從者敢辭賓曰寡君之下臣君之牧圉也若不獲扞外役是不有寡君也臣懼不免于戻請以除死親執鐸終夕與于燎設火燎以備守齊氏之宰渠子召北宮子北宮喜也北宮氏之宰不與聞謀殺渠子遂伐齊氏滅之丁巳晦公入與北宫喜盟于彭水之上秋七月戊午朔遂盟國人八月辛亥公子朝褚師圃子玉霄子髙魴出奔晉皆齊氏黨閏月戊辰殺宣姜與公子朝通謀故衞侯賜北宫喜諡曰貞子滅齊氏故賜析朱鉏諡曰成子宵從公故而以齊氏之墓予之皆未死而賜諡及墓田𫝊終而言之衞侯告寧于齊且言子石子石公孫青言其有禮齊侯將飲酒徧賜大夫曰二三子之教也苑何忌辭曰何忌齊大夫與于青之賞必及于其罰在康誥曰父子兄弟罪不相及尚書康誥况在羣臣臣敢貪君賜以干先王琴張聞宗魯死琴張孔子弟子字子開名牢將往弔之仲尼曰齊豹之盜而孟縶之賊女何弔焉君子不食姦知公孟不善而受其禄是食姦也不受亂許豹行事是受亂也不爲利疚于回疚病回邪也以利故不能去是病身于邪不以回待人知難不告是以邪待人不蓋不義以周事豹是蓋不義不犯非禮以二心事縶是非禮公羊𫝊母兄稱兄兄何以不立有疾也何疾爾惡疾也糓梁傳盜賤也其曰兄母兄也目衞侯衞侯累也惡衞侯不能保護其兄乃爲盜所殺然則何爲不爲君也曰有天疾者不得入乎宗廟輒者何也曰兩足不能相過聚合不解如見絆縶齊謂之綦楚謂之踙衞謂之輒左氏以爲齊豹殺之也豹爲衞司寇何以盜書胡氏安國謂罪在宗魯宗魯孟縶之驂乘法應書盜此求其說而不得也宗魯雖與聞其事而作亂者實豹今釋豹不誅歸獄宗魯於義爲頗然則經所謂盜實齊豹耳豹具官於衞變文書盜所以甚衞靈之無政刑也以千乘之國不能衞其母兄制其禍亂使盜賊竊發兄死身危幾亡其國故書盜以著之至豹以守嗣大夫爲盜賊之事是亦盜賊而已矣冬十月宋華亥向寧華定出奔陳寧公羊作寗左傳宋華向之亂公子城公孫忌樂舍司馬彊向宜向鄭楚建郳申出奔鄭城平公子舍樂喜孫宜鄭皆向戌子建楚平王亡大子申小邾穆公子八子皆宋大夫公之黨辟難出其徒與華氏戰于鬼閻八子之徒衆也鬼閻杜注潁川長平縣西北有閻亭今河南陳州西華縣東北閻倉亭城是也敗子城子城適晉别走至晉爲明年子城以晉師至張本華亥與其妻必盥而食所質公子者而後食公與夫人每日必適華氏食公子而後歸華亥患之欲歸公子向寧曰唯不信故質其子若又歸之死無日矣公請于華費遂將攻華氏費遂大司馬華氏族對曰臣不敢愛死無乃求去憂而滋長乎恐殺大子憂益長臣是以懼敢不聽命公曰子死亡有命余不忍其訽訽恥也冬十月公殺華向之質而攻之戊辰華向奔陳華登奔吳登費遂之子黨華向者向寧欲殺大子華亥曰干君而出又殺其子其誰納我且歸之有庸可以爲公善使少司寇牼以歸牼華亥庶兄以三公子歸公也曰子之齒長矣不能事人以三公子爲質必免質信也送公子歸可以自明不叛之信公子旣入華牼將自門行從公門去公遽見之執其手曰余知而無罪也入復而所所所居官十有一月辛卯蔡侯廬卒廬左氏作盧按十三年蔡侯廬歸于蔡左氏亦作廬此應誤附錄左傳齊侯疥遂痁痁瘧疾期而不瘳諸侯之賓問疾者多在多在齊梁丘據與裔款言于公曰二子齊嬖大夫吾事鬼神豐于先君有加矣今君疾病爲諸侯憂是祝史之罪也諸侯不知其謂我不敬君盍誅于祝固史嚚以辭賓欲殺嚚固以辭謝來問疾之賓公說告晏子晏子曰日宋之盟宋盟在襄二十七年屈建問范會之德于趙武趙武曰夫子之家事治言于晉國竭情無私其祝史祭祀陳信不愧其家事無猜其祝史不祈建以語康王楚王康王曰神人無怨宜夫子之光輔五君以爲諸侯主也公曰據與款謂寡人能事鬼神故欲誅于祝史子稱是語何故對曰若有德之君外內不廢無廢事上下無怨動無違事其祝史薦信無愧心矣是以鬼神用饗國受其福祝史與焉與受國福其所以蕃祉老壽者爲信君使也其言忠信于鬼神其適遇淫君外内頗邪上下怨疾動作辟違從欲厭私高臺深池撞鐘舞女斬刈民力輸掠其聚輸墮也以成其違不恤後人暴虐淫從肆行非度無所還忌還猶顧也不思謗讟不憚鬼神神怒民痛無悛于心其祝史薦信是言罪也其蓋失數美是矯誣也進退無辭則虚以求媚是以鬼神不饗其國以禍之祝史與焉所以夭昏孤疾者爲暴君使也其言僭嫚于鬼神公曰然則若之何對曰不可爲也言非誅祝史所能治山林之木衡鹿守之澤之萑蒲舟鮫守之藪之薪蒸虞候守之海之鹽蜃祈望守之衡鹿舟鮫虞候祈望皆官名也言公專守山澤之利不與民共縣鄙之人入從其政偪介之關暴征其私介隔也迫近國都之闗言邊鄙既入服政後近闗又征奪其私物使民重困也承嗣大夫强易其賄承嗣大夫世位者布常無藝布政無法制徴斂無度宮室日更淫樂不違内寵之妾肆奪于市外寵之臣僭令于鄙詐爲敎令私欲養求不給則應所求不給則應之以罪民人苦病夫婦皆詛祝有益也詛亦有損􅊃攝以東􅊃攝杜注齊西界也平原􅊃城縣有攝城在今山東􅊃城縣東北姑尤以西姑尤杜注齊東界也姑水尤水皆在城陽郡東南入海姑水卽今山東黄縣之大姑河尤水卽今掖縣之小姑河其爲人也多矣雖其善祝豈能勝億兆人之詛君若欲誅于祝史修德而後可公說使有司寬政毁關去禁薄斂己責除逋責十二月齊侯田于沛疾愈行獵沛杜注澤名招虞人以弓不進虞人掌山澤之官公使執之辭曰昔我先君之田也旃以招大夫弓以招士皮冠以招虞人臣不見皮冠故不敢進乃舍之仲尼曰守道不如守官君招當往道之常也非物不進官之制也君子韙之韙是也齊侯至自田晏子侍于遄臺臺名子猶馳而造焉子猶梁丘據公曰唯據與我和夫晏子對曰據亦同也焉得爲和公曰和與同異乎對曰異和如羹焉水火醯醢鹽梅以烹魚肉燀之以薪燀炊也宰夫和之齊之以味濟其不及以洩其過洩減也君子食之以平其心君臣亦然君所謂可而有否焉臣獻其否以成其可獻君之否以成君可君所謂否而有可焉臣獻其可以去其否是以政平而不干民無爭心故詩曰亦有和羹既戒既平詩商頌言中宗能與賢者和齊可否其政如羹敬戒且平和羮備五味異于大羹鬷嘏無言時靡有爭鬷總也嘏大也言總大政能使上下如和羮先王之濟五味和五聲也以平其心成其政也聲亦如味一氣樂須氣以動二體舞者有文武三類風雅頌四物雜用四方之物以成噐五聲宮商角徵羽六律黄鐘大簇姑洗㽔賓夷則無射也陽聲爲律陰聲爲呂此十二月氣七音宮商角徵羽變宮變徵也周武王伐紂自午及子凡七日王因此以數合之以聲昭之故以七周其數以律和其聲謂之七音八風八方之風東北曰條風又名融風東方曰明庶風東南曰清明風南方曰景風又名凱風西南曰凉風西方曰閭闔風西北曰不周風北方曰廣莫風九歌九功之徳皆可歌也六府三事謂之九功水火金木土穀謂之六府正徳利用厚生謂之三事以相成也言此九者合然後相成爲和樂清濁小大短長疾徐哀樂剛柔遲速髙下出入周疏以相濟也周密也君子聽之以平其心心平徳和故詩曰徳音不瑕詩豳風義取心平則徳音無瑕闕今據不然君所謂可據亦曰可君所謂否據亦曰否若以水濟水誰能食之若琴瑟之專壹誰能聽之同之不可也如是飲酒樂公曰古而無死其樂若何晏子對曰古而無死則古之樂也君何得焉昔爽鳩氏始居此地爽鳩氏少皞氏之司寇季萴因之季萴虞夏諸侯代爽鳩氏者有逢伯陵因之逢伯陵殷諸侯姜姓蒲姑氏因之蒲姑氏殷周之閒代逢公者而後大公因之古若無死爽鳩氏之樂非君所願也鄭子産有疾謂子大叔曰我死子必爲政唯有徳者能以寛服民其次莫如猛夫火烈民望而畏之故鮮死焉水懦弱民狎而翫之則多死焉故寛難難以治疾數月而卒大叔爲政不忍猛而寛鄭國多盜取人于萑苻之澤萑苻杜注澤名疑即中牟澤于澤中劫人也大叔悔之曰吾早從夫子不及此興徒兵以攻萑苻之盜盡殺之盜少止仲尼曰善哉政寛則民慢慢則糾之以猛猛則民殘殘則施之以寛寛以濟猛猛以濟寛政是以和詩曰民亦勞止汔可小康惠此中國以綏四方施之以寛也詩大雅汔其也周厲王暴虐民勞于苛政故詩人刺之欲其施之以寛毋從詭隨詭人隨人無正心不可從以謹無良式遏寇虐慘不畏明糾之以猛也慘曾也言爲宼虐曾不畏明法者亦當用猛政糾治之柔遠能邇以定我王平之以和也又曰不競不絿不剛不柔詩商頌言湯政得中和絿急也布政優優百祿是遒優優和也遒聚也和之至也及子產卒仲尼聞之出涕曰古之遺愛也子產見愛有古人之遺風二十有一年春附録左傳二十一年春天王將鑄無射周景王也無射鐘名律中無射泠州鳩曰泠樂官州鳩其名王其以心疾死乎夫樂天子之職也夫音樂之輿也樂因音而行而鐘音之器也音由器以發天子省風以作樂器以鍾之鍾聚也以器聚音輿以行之小者不窕窕細而不滿大者不槬槬横大不入則和于物物和則嘉成嘉樂成也故和聲入于耳而藏于心心億則樂億安也窕則不咸不充滿人心槬則不容心不堪容心是以感感實生疾今鐘槬矣王心弗堪其能久乎爲明年天王崩傳王三月葬蔡平公左傳三月葬蔡平公蔡大子朱失位位在卑不在適子位以長㓜齒大夫送葬者歸見昭子昭子問蔡故以告昭子歎曰蔡其亡乎若不亡是君也必不終詩曰不解于位民之攸塈詩大雅塈息也今蔡侯始即位而適卑身將從之爲蔡侯朱出奔𫝊夏晉侯使士鞅來聘書聘止此左𫝊夏晉士鞅來聘叔孫爲政叔孫昭子以三命爲國政季孫欲惡諸晉憎叔孫在己上位故使有司以齊鮑國歸費之禮爲士鞅鮑國歸費在十四年牢禮各如其命數魯人失禮故爲鮑國七牢士鞅怒曰鮑國之位下其國小而使鞅從其牢禮是卑敝邑也將復諸寡君魯人恐加四牢焉爲十一牢言魯不能以禮事大國且爲哀七年呉徵百牢起晉頃即位五年始通嗣君蓋霸業既隳六鄕睢盱相忌邦交不暇及也於時士鞅怒魯禮好不結財求無藝諸侯外之而晉亦不復遣聘矣宋華亥向寧華定自陳入于宋南里以叛叛公羊作畔南里杜注宋城内里名在今河南商丘縣境左𫝊宋華費遂生華貙華多僚華登貙爲少司馬多僚爲御士公御士與貙相惡乃譖諸公曰貙將納亡人亡人華亥等亟言之公曰司馬以吾故亡其良子司馬華費遂良子華登死亡有命吾不可以再亡之對曰君若愛司馬則如亡死如可逃何遠之有言亡可以逃死勿慮其逺以恐動公公懼使侍人召司馬之侍人宜僚飲之酒而使告司馬告使逐貙司馬歎曰必多僚也吾有讒子而弗能殺吾又不死抑君有命可若何乃與公謀逐華貙將使田孟諸而遣之公飲之酒厚酬之酬酒幣賜及從者司馬亦如之亦如公賜張匄尤之張匄華貙臣尤怪賜之厚曰必有故使子皮承宜僚以劍而訊之子皮華貙宜僚盡以告張匄欲殺多僚子皮曰司馬老矣登之謂甚言登亡傷司馬心已甚吾又重之不如亡也五月丙申子皮將見司馬而行則遇多僚御司馬而朝張匄不勝其怒遂與子皮臼任鄭翩殺多僚任翩亦貙家臣劫司馬以叛而召亡人壬寅華向入樂大心豐愆華牼禦諸横横杜注梁國睢陽縣南有横亭華氏居盧門以南里叛盧門宋東城南門六月庚午宋城舊鄘及桑林之門而守之舊鄘故城也桑林城門名公羊傳宋南里者何若曰因諸者然因諸者齊故刑人之地公羊子齊人故以齊喻也博物志云周曰囹圄齊曰因諸榖梁𫝊自陳陳有奉焉爾入者内弗受也其曰宋南里宋之南鄙也以者不以者也叛直叛也言不作亂華向首禍於國結黨以奔今乘隙而入外挾呉楚將覆宗邦罪不勝誅矣春秋書叛于戚于朝歌于蕭皆不係之國此獨曰宋南里者戚與朝歌及蕭皆其所食私邑若南里則宋國城内之里名是華向與宋分國而居不止竊邑而已故書入于宋南里以深罪叛臣逼脅其君已甚之詞也曰自陳者因陳之力陳亦有罪焉爾秋七月壬午朔日有食之左傳秋七月壬午朔日有食之公問于梓愼曰是何物也物事也禍福何爲對曰二至二分二至冬至夏至二分春分秋分日有食之不爲災日月之行也分同道也至相過也二分日夜等故言同道二至長短極故言相過其他月則爲災陽不克也故常爲水陰侵陽是陽不勝陰昭公之世日食凡七見時天下彊臣多抗其君而季氏之僭逼尤甚梓愼不能因公之問告以省徳消變乃云分至不爲災按詩十月之交即夏正八月秋分之月也而云日有食之亦孔之醜七年四月甲辰朔日食春分之月也而云魯衞惡之安在其不爲災邪即行有常度天運固然然遇災而懼之心亦當無時不儆凜也八月乙亥叔輒卒輒公羊作痤左傳于是叔輒哭日食意在于憂災昭子曰子叔將死非所哭也八月叔輒卒輒叔弓之子無事業見經獨書其卒卿卒必書也附録左𫝊冬十月華登以吳師救華氏登前年奔呉齊烏枝鳴戍宋烏枝鳴齊大夫廚人濮曰濮宋廚邑大夫軍志有之先人有奪人之心後人有待其衰盍及其勞且未定也伐諸若入而固則華氏衆矣悔無及也從之丙寅齊師宋師敗吳師于鴻口鴻口杜注梁國睢陽縣東有鴻口亭在今商丘虞城二縣界獲其二帥公子苦雂偃州員二帥吳大夫華登帥其餘以敗宋師公欲出出奔廚人濮曰吾小人可藉死可借使死難而不能送亡君請待之乃徇曰揚徽者公徒也徵識也所以相别衆從之公自揚門見之揚門睢陽正東門名揚門下而廵之曰國亡君死二三子之耻也豈專孤之罪也齊烏枝鳴曰用少莫如齊致死齊致死莫如去備備長兵也彼多兵矣請皆用劍從之華氏北復即之廚人濮以裳裏首而荷以走曰得華登矣遂敗華氏于新里新里華氏所取邑翟僂新居于新里旣戰説甲于公而歸翟僂新公臣居華氏地而助公戰華姓居于公里亦如之妵華氏族故助華氏亦如僂新説甲歸十一月癸未公子城以晉師至城以前年奔晉曹翰胡會晉荀呉齊苑何忌衞公子朝救宋翰胡曹大夫苑何忌齊大夫公子朝前年出奔晉今還衛丙戌與華氏戰于赭丘赭丘杜注宋地後漢志陳國長平縣有赭丘城當在今河南陳州西北境鄭翩願爲鸛其御願爲鵝鄭翩華氏黨鸛鵝皆陳名子禄御公子城莊菫爲右子禄向宜干犫御呂封人華豹張匄爲右皆華氏黨相遇城還華豹曰城也城怒而反之反還戰將注豹則關矣注傅矢闗引弓曰平公之靈尚輔相余平公公子城之殳豹射出其閒出子城子禄之閒將注則又關矣曰不狎鄙狎更也謂豹頻射不使已得更遞是可鄙抽矢豹止不射城射之殪豹死張匄抽殳而下殳長丈二在車邊射之折股扶伏而擊之折軫折城車軫又射之死匄死干犫請一矢求死城曰余言女于君欲活之對曰不死伍乘軍之大刑也同乘共伍當皆死干刑而從子君焉用之子速諸乃射之殪犫又死大敗華氏圍諸南里華亥搏膺而呼見華貙曰吾爲欒氏矣晉欒盈還入作亂而死事在襄二十三年貙曰子無我迋迋恐也不幸而後亡使華登如楚乞師華貙以車十五乘徒七十人犯師而出犯公師出送華登食于睢上哭而送之乃復入入南里楚薳越帥師將逆華氏大宰犯諌曰犯楚大宰諸侯唯宋事其君今又爭國釋君而臣是助無乃不可乎王曰而告我也後既許之矣爲明年華向出奔楚𫝊冬蔡侯朱出奔楚朱穀梁作東左傳蔡侯朱出奔楚費無極取貨于東國東國隠大子之子平侯廬之弟朱叔父也而謂蔡人曰朱不用命于楚君王將立東國若不先從王欲楚必圍蔡蔡人懼出朱而立東國朱愬于楚楚子將討蔡無極曰平侯與楚有盟故封盟于鄧依陳蔡人以國其子有二心故廢之子謂朱也靈王殺隱大子其子與君同惡徳君必甚又使立之不亦可乎且廢置在君蔡無他矣言權在楚則蔡無他心糓梁𫝊東者東國也何爲謂之東也王父誘而殺焉楚子䖍誘蔡侯般殺之于申父執而用焉執蔡世子有以歸用之奔而又奔之曰東惡之而貶之也奔既罪矣又奔讎國惡莫大焉費無極取貨東國脅國人出朱而立之讒人之爲害如此或疑此書朱出奔楚後書東國卒于楚朱無歸入卒葬之文東國無出奔之事疑即東國而誤爲朱然左氏記沈尹戌之言亦曰出蔡侯朱而史記蔡世家亦曰隱大子之子東國攻平侯子而代立則朱東國固兩人也榖梁經文特因後書東國而誤爾公如晉至河乃復左傳公如晉及河鼓叛晉晉克鼓在十五年至是叛晉屬鮮虞晉將伐鮮虞故辭公晉伐鮮虞何妨於邦交而以此爲辭以却公蓋意如之謀公益急晉之權家黨季氏以弱其君而晉君亦不得自爲政矣日講春秋解義卷五十三
