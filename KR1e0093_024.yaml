body:
  text: 欽定四庫全書日講春秋解義卷二十四文公五年春王正月王使榮叔歸含且賵左傳五年春王使榮叔來含且賵榮叔天子之上大夫榮采地叔字也公羊傳含者何口實也孝子所以實親口也緣生以事死不忍虚其口天子以珠諸侯以玉大夫以碧士以貝其言歸含且賵何兼之兼之非禮也榖梁傳含一事也賵一事也兼歸之非正也其曰且志兼也其不言來不周事之用也賵以早乘馬曰賵所以助葬成風未葬故言早而含已晚已殯故言晚春秋繋王於天以履天位治天職所惇庸者天叙天秩所刑賞者天命天討文公以風氏之喪訃於王非禮也王不能正反歸含賵失天理矣故特不稱天言弗克若天也三月辛亥葬我小君成風公羊傳成風者何僖公之母也成風書葬是祔於姑也隱公時仲子猶别立宮以祀今則儼然並尊又私諡焉亂禮甚矣書其實以示譏也王使召伯來㑹葬召伯穀梁作毛伯左傳召昭公來㑹葬召采地伯爵天子卿也禮也成風莊公之妾母以子貴故曰禮穀梁傳㑹葬之禮于鄙上鄙竟也為送葬來故從竞至墓上王臣下聘桓公宰糾書名示貶而大夫再聘則書字從同也今王以夫人之禮喪成風再不稱天何也薨而賵含尚曰不可又使卿來㑹葬將祔之於廟則其事益隆失益甚矣故復去天以示義夏公孫敖如晉王含且賵又使卿來㑹葬禮莫隆焉不往謝而亟如晉慢王尊霸不貶而惡見矣秦人入鄀左傳初鄀叛楚即秦又貳于楚夏秦人入鄀鄀介秦楚之閒商臣弑逆鄀叛楚而即秦以穆公為可恃也及楚滅江懼而貳於楚秦不能庇鄀乃稱兵以入之而其後鄀卒為楚所并王政不行小國之無罪而就滅亡如此可哀也夫秋楚人滅六六杜注六國廬江六縣在今江南六安州北左傳六人叛楚即東夷秋楚成大心仲歸帥師滅六仲歸子家冬楚公子燮滅蓼蓼杜注蓼國安豐蓼縣今河南固始縣東北蓼城崗即其地臧文仲聞六與蓼滅曰皋陶庭堅不祀忽諸蓼與六皆皋陶後也庭堅皋陶字德之不建民之無援哀哉邾滅須句楚滅六蓼皆世變之大者須句司大皞之祀六蓼實皋陶之後上古建國歴唐虞三代緜延不絶入春秋而後蕩滅無遺蓋不獨周綱解紐自古聖王之政教至是而盡廢故不足以相維持也冬十月甲申許男業卒附錄左傳晉陽處父聘于衞反過寗寗嬴從之寗杜注晉邑汲郡修武縣今河南獲嘉縣西北有故城嬴逆旅大夫及温而還其妻問之嬴曰以剛商書曰沈漸剛克髙明柔克沈漸猶滯弱也髙明猶亢爽也言各當以剛柔勝已本性乃能成全也此在洪範今謂之周書夫子壹之謂純任剛也其不沒乎天為剛德猶不干時寒暑相順况在人乎且華而不實言過其行怨之所聚也犯而聚怨剛則犯人不可以定身余懼不獲其利而離其難是以去之離麗也為六年晉殺處父傳晉趙成子趙衰新上軍帥中軍佐也欒貞子欒枝下軍帥也霍伯先且居中軍帥也臼季胥臣下軍佐也皆卒為六年蒐于夷傳六年春葬許僖公附錄左傳六年春晉蒐于夷舍二軍僖三十一年晉蒐清原作五軍今舍二軍復三軍之制夷杜注晉地前年四郷卒故蒐以謀軍帥使狐射姑將中軍代先且居趙盾佐之代趙衰也盾趙衰子陽處父至自温往年聘衞過温今始至改蒐于董董杜注河東汾隂縣有董亭在今山西聞喜縣東北接絳州界易中軍易以趙盾為帥射姑佐之陽子成季之屬也處父嘗為趙衰屬大夫故黨于趙氏且謂趙盾能曰使能國之利也是以上之宣子于是乎始為國政宣趙盾諡制事典典常也正法罪輕重當辟刑獄辟猶理也董逋逃董督也由質要由用也質要券契也治舊洿治理洿穢本秩禮貴賤不失其本續常職修廢官出滯淹拔賢能也既成以授大傅陽子與大師賈佗使行諸晉國以為常法賈佗以公族從文公而不在五人之數夏季孫行父如陳左傳臧文仲以陳衞之睦也欲求好于陳夏季文子聘于陳季文子即行父季友之孫且娶焉季友以原仲之舊如陳者再今行父之往蓋因其祖舊好假公室之聘而圖婚耳韓侯因朝而娶詩列大雅則於禮無譏故經但以出聘書而不及其私與友之葬原仲異也附錄左傳秦伯任好卒任好秦穆公名以子車氏之三子奄息仲行鍼虎為殉子車秦大夫氏也以人從葬為殉皆秦之良也國人哀之為之賦黄鳥黄鳥詩秦風義取黄鳥止于棘桑往來得其所傷三良不然君子曰秦穆之不為盟主也宜哉死而棄民善人者民之望也殺以殉葬是棄民望先王違世猶詒之法而况奪之善人乎詩曰人之云亡邦國殄瘁詩大雅言善人亡則國瘁病無善人之謂若之何奪之古之王者知命之不長是以竝建聖哲建立聖知以司牧民樹之風聲因土地風俗為立聲敎之法分之采物旌旗衣服各有分制著之話言話善言也為作善言遺戒為之律度鐘律度量所以治歴明時陳之藝極藝凖也極中也貢獻多少之法傳曰貢之無藝又曰貢獻無極引之表儀引導也表儀猶威儀予之法制告之訓典訓典先王之書敎之防利防惡興利委之常秩委任也常秩官司之常秩道之以禮則使毋失其土宜衆𨽻賴之而後即命即就也聖王同之今縱無法以遺後嗣而又收其良以死難以在上矣君子是以知秦之不復東征也不能復征東方諸侯為霸主秋季孫行父如晉左傳秋季文子將聘于晉使求遭喪之禮以行聞晉侯疾故其人曰將焉用之其人從者文子曰備豫不虞古之善敎也求而無之實難難卒得過求何害王制諸侯比年一小聘三年一大聘五年一朝文公即位六載未嘗一如京師而朝晉者再且數遣聘問知霸主而不知有王比事以觀罪可見矣八月乙亥晉侯驩卒驩公羊作讙左傳八月乙亥晉襄公卒靈公少晉人以難故欲立長君趙孟曰趙孟趙盾也立公子雍公子雍文公子襄公庻弟杜祁之子好善而長先君愛之且近于秦秦舊好也置善則固事長則順立愛則孝結舊則安為難故故欲立長君有此四德者難必抒矣抒除也賈季曰不如立公子樂樂文公子懷嬴所出辰嬴嬖于二君辰嬴即懷嬴二君懷公文公也立其子民必安之趙孟曰長嬴賤班在九人班位也其子何震之有震威也且為二嬖淫也為先君子不能求大而出在小國辟也母淫子辟無威陳小而遠無援將何安焉杜祁以君故讓偪姞而上之杜祁杜伯之後祁姓也偪國名姞姞姓女生襄公為世子故杜祁讓使在己上以狄故讓季隗而己次之故班在四以季隗是文公處狄時妻故復讓之先君是以愛其子而仕諸秦為亞卿焉言其賢故位尊秦大而近足以為援母義子愛足以威民立之不亦可乎使先蔑士㑹如秦逆公子雍先蔑士伯也士㑹隨季也賈季亦使召公子樂于陳趙孟使殺諸郫郫杜注晉地今河南濟源縣西有郫亭冬十月公子遂如晉葬晉襄公左傳冬十月襄仲如晉葬襄公禮諸侯五月而葬今三月不及期非禮也又禮諸侯之喪士弔大夫送葬及晉文昉為霸令使大夫弔卿共葬事故襄仲以卿往㑹亦非禮也晉殺其大夫陽處父晉狐射姑出奔狄射榖梁作夜左傳賈季怨陽子之易其班也本中軍帥易以為佐而知其無援于晉也少族多怨九月賈季使續鞫居殺陽處父鞫居狐氏之族書曰晉殺其大夫侵官也君已命帥處父易之故曰侵官十一月丙寅晉殺續簡伯討其殺處父簡伯續鞫居十一月無丙寅丙寅十二月八日也日月必有誤賈季奔狄宣子使臾駢送其帑臾駢趙盾屬大夫帑妻子也宣子以賈季佐中軍同官故夷之蒐賈季戮臾駢戮辱也臾駢之人欲盡殺賈氏以報焉臾駢曰不可吾聞前志有之曰敵惠敵怨不在後嗣忠之道也敵猶對也若及子孫則為非對是遷怒也夫子禮於賈季我以其寵報私怨無乃不可乎介人之寵非勇也介因也損怨益仇非知也殺季家欲以除怨宣子將復怨已是益仇以私害公非忠也釋此三者何以事夫子盡具其帑與其器用財賄親帥扞之送致諸竟扞衞也公羊傳晉殺其大夫陽處父則狐射姑曷為出奔射姑殺也射姑殺則其稱國以殺何君漏言也其漏言奈何君將使射姑將謂作中軍大夫陽處父諫曰射姑民衆不説不可使將于是廢將陽處父出射姑入君謂射姑曰陽處父言曰射姑民衆不説不可使將射姑怒出刺陽處父于朝而走榖梁傳稱國以殺罪累上也襄公已葬其以累上之辭言之何也君漏言也上泄則下闇下闇則上聾且闇且聾無以相通臣闇不言君無所聞上下否塞夜姑殺者也夜姑之殺奈何曰晉將與狄戰使狐夜姑為將軍趙盾佐之陽處父曰不可古者君之使臣也使仁者佐賢者不使賢者佐仁者今趙盾賢夜姑仁其不可乎賢者多才也戰主攻伐仁者有惻隱之心不如多才者有權畧襄公曰諾謂夜姑曰吾始使盾佐女今女佐盾矣稱處父語以語之故傳曰漏言也夜姑曰敬諾襄公死處父主竟上事待諸侯㑹葬在鄙上夜姑使人殺之君漏言也故士造辟而言詭辭而出辟君也言與君言出則詭辭不以實告人曰用我則可不用我則無亂其德此士對君言之辭凡君與臣同殺則稱國今射姑實殺處父而罪累上者見人君以公正之道進退其臣人自心服無所歸咎襄公乃漏言於射姑嫁怨於處父雖非身殺之而以失言殺之等殺耳故襄公已卒而書國殺所以為後世戒也閏月不告月猶朝于廟左傳閏月不告朔非禮也經稱告月傳稱告朔明告月必以朔閏以正時四時漸差則置閏以正之時以作事順時命事事以厚生事不失時則年豐而民生厚生民之道於是乎在矣不告閏朔棄時政也何以為民為治也公羊傳不告月者何不告朔也禮諸侯受十二月朔政于天子藏于祖廟每月朔朝廟使大夫南面奉天子命君北面而受之比時使有司先告朔謹之至也曷為不告朔謂不言朔而言月天無是月也閏月矣何以謂之天無是月非常月也猶者何通可以已也朝者因視朔政爾無政而朝故曰猶不言朔者閏月無告朔禮也穀梁傳不告月者何也不告朔也不告朔則何為不言朔也閏月者附月之餘日也積分而成于月者也一嵗三百六十日餘六日又有小月六積五嵗約得六十日而再閏積衆月之餘分以成此月天子不以告朔而喪事不數也閏是叢殘之數非月之正故吉凶大事皆不用也猶之為言可以已也告朔然後朝廟既廢其大而行其細故譏之諸侯月朔告於廟謂之告朔因以聽治此月之政謂之視朔不告月者不告朔也因月之虧盈置閏是主乎月而有閏也故不言朔而言月在禮天子閏月聽朔於明堂閏者所以定四時成嵗天子以為月而頒之諸侯不奉以告是輕正朔慢時令也况一月之内百官修政於朝庻民服事於野閏雖無常而政有常安得不告猶朝於廟者幸其不已之詞也七年春公伐邾左傳七年春公伐邾閒晉難也公因霸國有難而侵小三月甲戌取須句遂城郚句公羊作朐郚杜注魯邑卞縣南有郚城在今山東泗水縣東南左傳三月甲戌取須句須句魯封内屬國僖公反其君之後邾復滅之寘文公子焉邾文公子叛邾在魯故使為守須句大夫非禮也絶大皡之祀以與鄰國叛臣故曰非禮公羊傳取邑不日此何以日内辭也使若他人然據昭三十二年正月取闞亦邾妻之邑木嘗書日今以日為内辭者使若公春伐邾妻而去他人自以甲戌日取之所以深諱其貪利取邑也然僖公嘗伐邾取須朐矣何以不為内辭哉公羊之説非也穀梁傳取邑不日此其日何也不正其再取故謹而日之也僖二十二年公已伐邾取須句過而不改故錄日以志之然非也設不日則聽其取已乎遂繼事也因伐邾之師晉襄既卒國未立君公乘其閒伐邾取邑絶大皞之祀俾邾之叛臣守之貪土地而舍逋逃又重勞民力城内邑以防邾師之至心有慊焉故畏鄰國之伐而不知愈重其過耳夏四月宋公王臣卒王臣穀梁作壬臣宋人殺其大夫左傳夏四月宋成公卒于是公子成為右師莊公子公孫友為左師目夷子樂豫為司馬戴公元孫鱗矔為司徒桓公孫公子蕩為司城桓公子也以武公名廢司空為司城華御事為司寇華元父也傳言六卿皆公族昭公不親信之所以致亂昭公將去羣公子成公卒其弟禦殺世子而自立國人殺禦而立其少子杵臼是為昭公樂豫曰不可公族公室之枝葉也若去之則本根無所庇廕矣葛藟猶能庇其本根故君子以為比詩人取以喻九族兄弟况國君乎此諺所謂庇焉而縱㝷斧焉者也縱放也尋即將尋斧柯之尋必不可君其圖之親之以德皆股肱也誰敢攜貳若之何去之不聽穆襄之族率國人以攻公穆公襄公之子孫昭公所欲去者殺公孫固公孫鄭于公宮二子在公宮故為亂兵所殺六卿和公室樂豫舍司馬以讓公子卬卬昭公弟昭公即位而葬書曰宋人殺其大夫不稱名衆也且言非其罪也殺者衆故名不可知死者無罪則例不稱名公羊傳何以不名成公十五年秋宋殺其大夫山稱名宋三世無大夫三世内娶也穀梁傳稱人以殺誅有罪也臣以權寵逼君故言有罪成公在殯昭公首為亂階至使公族構難大夫罹殃經書宋人以著國亂無政而昭公之不君亦可見矣戊子晉人及秦人戰于令狐晉先蔑奔秦蔑公羊作昩奔上有以師字左傳秦康公送公子雍于晉曰文公之入也無衛故有呂郤之難在僖二十四年乃多與之徒衛穆嬴日抱大子以啼于朝曰穆嬴農公夫人靈公母也先君何罪其嗣亦何罪舍適嗣不立而外求君將焉寘此出朝則抱以適趙氏頓首于宣子曰先君奉此子也而屬諸子曰此子也才吾受子之賜不才吾唯子之怨今君雖終言猶在耳而棄之若何宣子與諸大夫皆患穆嬴且畏偪畏國人以大義來逼已乃背先蔑而立靈公初使先蔑逆子雍故言背靈公大子夷皋也以禦秦師箕鄭居守趙盾將中軍先克佐之克先且居子代狐射姑荀林父佐上軍箕鄭將上軍居守故佐獨行先蔑將下軍先都佐之步招御戎戎津為右及菫隂先蔑士㑹逆公子雍前還晉晉人始以逆雍出軍故蔑猶在職菫隂杜注晉地宣子曰我若受秦秦則賔也不受寇也既不受矣而復緩師秦將生心先人有奪人之心軍之善謀也逐寇如追逃軍之善政也訓卒利兵秣馬蓐食潛師夜起蓐食早食于寢蓐也戊子敗秦師于令狐至于刳首刳首杜注令狐在河東與刳首相接按令狐今山西猗氏縣地刳首當在今滎河臨晉閒己丑先蔑奔秦士㑹從之先蔑之使也荀林父止之曰夫人大子猶在而外求君此必不行子以疾辭若何不然將及攝卿以往可也何必子同官為寮吾嘗同寮敢不盡心乎弗聽為賦板之三章板詩大雅其三章義取芻蕘之言猶不可忽况同寮乎僖二十八年林父將中行先蔑將左行又弗聽及亡荀伯盡送其帑及其器用財賄于秦荀伯林父曰為同寮故也士㑹在秦三年不見士伯士伯先蔑其人曰能亡人于國言能與人俱亡于晉國不能見于此焉用之何用如此士季曰士季士㑹吾與之同罪非義之也言已非慕先蔑之義而從之將何見焉及歸遂不見責先蔑為正卿而不匡諫且俱出奔惡有黨也士㑹歸在十三年公羊傳晉先眜以師奔秦此偏戰也何以不言師敗績敵也此晉先眜也其稱人何貶曷為貶外也其外奈何以師外也懷持二心有功欲還無功便持師出奔故于戰貶之何以不言出遂在外也言從竟外去穀梁傳不言出在外也輟戰而奔秦以是為逃軍也輟止也為將而獨奔故曰逃軍晉人舍適嗣而外求君其始已失及畏偪立君不知以禮謝秦而悍然興戎掩其不備蓋晉人為志乎是戰也言戰不言敗勝負敵也先蔑之奔不言出明自軍中去也狄侵我西鄙左傳狄侵我西鄙公使告于晉趙宣子使因賈季問酆舒且讓之時賈季奔在狄酆舒狄相酆舒問于賈季曰趙衰趙盾孰賢對曰趙衰冬日之日也趙盾夏日之日也冬日可愛夏日可畏魯嘗患戎未嘗患狄蓋狄遠魯且懾晉也至是晉構秦難不在諸侯魯閒之而近伐邾狄亦閒之而遠侵魯春秋書此罪魯之不自正而晉業之替亦見矣秋八月公㑹諸侯晉大夫盟于扈扈杜注鄭地滎陽卷縣西北有扈亭在今河南原武縣西北左傳秋八月齊侯宋公衞侯陳侯鄭伯許男曹伯㑹晉趙盾盟于扈晉侯立故也公後至故不書所㑹凡㑹諸侯不書所㑹謂不具列公侯及卿大夫後也後至不書其國辟不敏也不敏猶不達也諸國皆在公獨後是不逹于事此傳自釋凡例之意公羊傳諸侯何以不序大夫何以不名公失序也公失序奈何諸侯不可使與公盟眣晉大夫使與公盟也以目通指曰眣文公内則喪娶逆祀外則貪利取邑為諸侯所薄賤故不見序穀梁傳其曰諸侯畧之也以大夫主盟諸侯自㑹扈始趙盾初立靈公專執晉政彊㑹八國之君而自主盟若晉無君然故諸侯不序而趙盾不名所以著大夫之專也冬徐伐莒徐僭號即戎厥後自進於中國數從㑹伐經皆稱人以其能附中國也今以中國無霸興兵伐莒故復以號舉公孫敖如莒涖盟涖公羊穀梁作莅左傳穆伯娶于莒曰戴已生文伯其娣聲已生惠叔穆伯公孫敖也文伯穀也惠叔難也戴己卒又聘于莒莒人以聲己辭則為襄仲聘焉襄仲公子遂敖從父昆弟冬徐伐莒莒人來請盟見伐故欲結援穆伯如莒涖盟且為仲逆及鄢陵鄢陵杜注莒邑登城見之美自為娶之仲請攻之公將許之叔仲惠伯諫曰惠伯叔牙孫臣聞之兵作于内為亂于外為寇寇猶及人亂自及也今臣作亂而君不禁以啟寇讎若之何公止之惠伯成之平二子使仲舍之舍不娶公孫敖反之還莒女復為兄弟如初從之為明年公孫敖奔莒傳穀梁傳莅位也其曰位何也前定也其不日前定之盟不日也以徐伐莒而往涖盟嫌非兩國交盟之例故明之莒為徐所伐故來求援請修洮之盟而敖因盟莒以代弟逆婦且為不道經苐書涖盟所謂春秋書王法不誅其人身也附錄左傳晉郤缺言于趙宣子曰日衞不睦故取其地日往日元年晉伐衞取戚田今已睦矣可以歸之叛而不討何以示威服而不柔何以示懷非威非懷何以示德無德何以主盟子為正卿以主諸侯而不務德將若之何夏書曰戒之用休董之用威勸之以九歌勿使壞九功之德皆可歌也謂之九歌六府三事謂之九功水火金木土穀謂之六府正德利用厚生謂之三事義而行之謂之德禮德正德也禮以制財用之節又以厚生民之命無禮不樂所由叛也若吾子之德莫可歌也其誰來之盍使睦者歌吾子乎宣子説之為明年晉歸鄭衞田張本八年春王正月附錄左傳八年春晉侯使解揚歸匡戚之田于衞解揚晉大夫匡本衞邑中屬鄭孔達伐不能克今晉令鄭還衞竝歸所取戚田且復致公壻池之封自申至于虎牢之竟公壻池晉君女壻舊取衞地以封之今竝還衛也申杜注鄭地當在今河南汜水縣界夏四月附錄左傳夏秦人伐晉取武城以報令狐之役令狐役在七年秋八月戊申天王崩左傳秋襄王崩子頃王壬臣立為公孫敖如周弔傳冬十月壬午公子遂㑹晉趙盾盟于衡雍左傳晉人以扈之盟來討前年盟扈公後至冬襄仲㑹晉趙孟盟于衡雍報扈之盟也乙酉公子遂㑹雒戎盟于暴公羊作伊雒戎暴杜注鄭地左傳遂㑹伊雒之戎伊雒之戎將伐魯公子遂不及復君故專命與之盟書曰公子遂珍之也珍貴也翟泉之盟猶有王人及魯公涖焉以大夫而專㑹盟自衡雍始其後趙盾仲遂皆為弑君之賊而有後於魯晉三桓專魯六卿分晉其兆早見於斯矣遂既盟趙盾四日又盟雒戎而再以名見不書遂㑹蓋以二事出皆有公命左氏之説非也公孫敖如京師不至而復丙戌奔莒公羊無而字左傳穆伯如周弔喪不至以幣奔莒從己氏焉已氏莒女公羊傳不至復者何不至復者内辭也不可使往也安居不肯行故諱使若己行但不至而還用不可使往則其言如京師何遂公意也正其義不使君命壅塞何以不言出據慶父言出奔遂在外也諱使若從外來不敢復還者也穀梁傳不言所至未如也若其已行當如公子遂至黄乃復今不言所至而直言復知其實未如也未如則未復也未如而曰如不廢君命也受命而出義無私留書如京師以顯命行于下不書所至以表不去之罪未復而曰復不專君命也復者事畢之辭未如故知其未復加畢事之文者言君命無輒専之道其如非如也其復非復也唯奔莒之為信故謹而日之也還者事畢復者事未畢也禮君言不宿於家况敖受命以赴天王之喪廢君命而徒返無王無君罪莫甚焉文公既不加誅又不再使卿往亦罪也不言所至者舉京師為重也不言出受命矣自外出也螽螽公羊作􅏑宋人殺其大夫司馬宋司城來奔左傳宋襄夫人襄王之姊也昭公不禮焉昭公適祖母夫人因戴氏之族華樂皇皆戴族以殺襄公之孫孔叔公孫鍾離及大司馬公子卬皆昭公之黨也司馬握節以死故書以官節國之符信也握之以死示不廢命司城蕩意諸來奔效節于府人而出效猶致也意諸公子蕩之孫公以其官逆之皆復之卿違從大夫公賢其效節故以本官逆之請宋而復之司城官屬悉來奔故言皆復亦書以官皆貴之也公羊傳司馬者何司城者何皆官舉也皆以官名舉言之曷為皆官舉據宋殺其大夫山不官舉宋三世無大夫三世内娶也宋以内娶三世妃黨爭權相殺主或不知所任故舉其官殺梁傳司馬官也其以官稱無君之辭也司城官也其以官稱無君之辭也來奔者不言出舉其接我也殺其大夫志亂也二人皆以官舉見主兵者不能其官至於見殺守土者不能其官至於出奔故以其官責之而宋國無政昭公之不能定位已於此見其端兆矣附錄左傳夷之蒐晉侯將登箕鄭父先都登之于上軍也夷蒐在六年而使士縠梁益耳將中軍士縠本司空先克曰狐趙之勲不可廢也狐偃趙衰有從亡之勲從之先克奪蒯得田于菫隂七年晉禦秦師于菫隂以軍事奪其田也先克中軍佐故箕鄭父先都士縠梁益耳蒯得作亂著五人作亂之由為明年殺先克張本九年春毛伯來求金來求止此左傳毛伯衞來求金非禮也天子不私求財故曰非禮不書王命未葬也公羊傳毛伯者何天子之大夫也何以不稱使當喪未君也踰年矣何以謂之未君襄王崩在八年踰年當即位即位矣而未稱王也未稱王何以知其即位以諸侯之踰年即位亦知天子之踰年即位也俱繼體其禮不得異以天子三年然後稱王亦知諸侯于其封内三年稱子也各信息于其下踰年稱公矣則曷為于其封内三年稱子緣民臣之心不可一日無君緣終始之義一年不二君故君薨稱子某既葬稱子明繼體以繋民臣之心不可曠年無君故踰年稱公緣孝子之心則三年不忍當也孝子三年志在思慕不忍當父位故雖即位猶于其封内三年稱子毛伯來求金何以書譏何譏爾王者無求求金非禮也然則是王者與據未稱王曰非也非王者則曷為謂之王者王者無求曰是子也繼文王之體守文王之法度文王之法無求而求故譏之也引文王者文王始受命制法度穀梁傳求車猶可求金甚矣求俱不可在喪尤甚公孫敖既不至京師魯遂不供天子之喪故毛伯來風魯以求金何以不稱使當喪未君也冢宰不能制國用而下求諸侯不貢而致王求皆非也自是以後魯不修貢而王亦無求矣夫人姜氏如齊二月叔孫得臣如京師穀梁傳京大也師衆也言周必以衆與大言之也辛丑葬襄王左傳二月莊叔如周葬襄王莊叔即得臣公羊傳王者不書葬此何以書不及時書過時書我有往者則書穀梁傳天子志崩不志葬舉天下而葬一人其道不疑也志葬危不得葬也不得備禮葬日之甚矣其不葬之辭也王室微弱諸侯無復往㑹葬前年公子遂如晉葬襄公今此得臣如京葬襄王是夷周於晉也晉人殺其大夫先都左傳九年春王正月己酉使賊殺先克箕鄭等所使也不赴故不書乙丑晉人殺先都梁益耳乙丑正月十九日經書二月從告三月夫人姜氏至自齊穀梁傳卑以尊致病文公也夫人行例不致乃以君禮致剸公寵之過夫人與君敵體然適他國未有致之者則其行非禮以不致見其罪也此書致以歸寧告廟得其正也歸寧常事爾宜不書然不一書則終無以著其正故於出姜之至見之又歸寧雖常事而出姜之歸寧以不安於魯而歸告於父母則非常也晉人殺其大夫士縠及箕鄭父左傳三月甲戌晉人殺箕鄭父士縠蒯得梁益耳蒯得不書皆非卿穀梁傳稱人以殺誅有罪也鄭父累也三大夫作亂殺中軍佐固有罪矣曷為不稱國討時晉侯年㓜政在趙盾故稱人以殺見大夫專作威福而政不自君出也楚人伐鄭左傳范山言于楚子曰范山楚大夫晉君少不在諸侯北方可圖也楚子師于狼淵以伐鄭狼淵杜注潁川潁隂縣有狼陂在今河南許州囚公子堅公子尨及樂耳三子鄭大夫鄭及楚平公子遂㑹晉人宋人衞人許人救鄭左傳公子遂㑹晉趙盾宋華耦衞孔達許大夫救鄭華耦華督曽孫不及楚師卿不書緩也以懲不恪獨書公子遂者春秋于魯事自非特為襃貶則皆從國史不同之于他國也楚自城濮以來不敢窺諸國以文襄之烈存也今狼淵之師正其嘗試之時而趙盾不能折衝弭患乃視為常役緩不及事致楚得志而晉遂不競矣夏狄侵齊楚得志而狄交侵矣故書以病晉也附錄左傳夏楚侵陳克壺丘壺丘杜注陳邑在今河南陳州南境以其服于晉也秋楚公子朱自東夷伐陳子朱息公也陳人敗之獲公子茷陳懼乃及楚平以小勝大故懼而請平也傳言晉君少楚陵中國明年所以有厥貉之㑹秋八月曹伯襄卒九月癸酉地震公羊傳地震者何動地也何以書記異也天動地靜者常也地動者象隂為陽行故曰異穀梁傳震動也地不震者也震故謹而日之也地道以靜為體以順為正安以承天者也逆其常理而不得節則震而不安其所承矣冬楚子使椒來聘椒穀梁作萩楚君臣姑竝見經左傳冬楚子越椒來聘子越椒令尹子文從子執幣傲叔仲惠伯曰是必滅若敖氏之宗傲其先君神弗福也十二年傳曰先君之敝器使下臣致諸執事明奉使皆告廟故言傲其先君也為宣四年楚滅若敖氏張本公羊傳椒者何楚大夫也楚無大夫此何以書始有大夫也始有大夫則何以不氏據屈完氏許夷狄者不一而足也許與也言進之當以漸穀梁傳楚無大夫其曰萩何也以其來我襃之也先儒皆謂春秋與楚慕義能以禮交諸侯故襃進之乃樂與人為善之義此大非也商臣負覆載不容之罪乘晉霸之衰圍江圍巢滅江滅六滅蓼伐鄭侵陳侵宋其聘魯乃遠交近攻之術亦所以窺伺東夏耳春秋乃用此襃之而赦其大惡逆天理悖人情矣而謂孔子有是乎蓋中國無霸楚勢日張魯人畏其憑陵喜於來聘而以待齊晉之禮待之故舊史備其辭孔子仍而不革以著諸侯畏楚之情實耳觀十年冬楚次厥貉亦書爵則以書爵為襃其不可通也審矣秦人來歸僖公成風之襚左傳秦人來歸僖公成風之襚禮也秦本非魯方嶽同盟無相赴弔之制故不譏其緩而以接好為禮諸侯相弔賀也雖不當事送死不及尸故曰不當事茍有禮焉書也以無忘舊好公羊傳其言僖公成風何兼之兼之非禮也禮主于敬當各使一使所以别尊卑曷為不言及成風成風尊也不可使卑及尊也穀梁傳秦人弗夫人也言秦人弗以成風為夫人故不言夫人即外之弗夫人而見正焉見不以妾為妻之正秦晉方不睦而魯善於晉故秦人歸襚以結魯猶楚欲圖北方而來聘也過時始至不以緩為譏以其始通錄之也僖公成風雖母子先君後夫人體當然也不言及卑不及尊也不稱夫人以義不得言及茍稱夫人則辭不别白嫌於僖公之夫人耳葬曹共公日講春秋解義卷二十四
