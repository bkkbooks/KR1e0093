body:
  text: 欽定四庫全書日講春秋解義卷五桓公公名軌惠公之子隱公之弟弒兄自立史記一名允諡法辟土服逺曰桓周桓王九年魯桓公十五年桓王崩子莊王立鄭莊公三十三年魯桓公十一年莊公卒子昭公忽立是年忽奔衛厲公突立桓十五年厲公奔蔡昭公歸秋突入于櫟桓十七年昭公弒立子亹桓十八年齊殺亹祭仲立子儀齊僖公二十年魯桓公十四年僖公卒子襄公諸兒立宋殤公九年魯桓公二年殤公弒莊公馮立晉翼哀侯七年魯桓公二年哀侯侵陘庭陘庭與曲沃武公謀桓三年曲沃伐翼獲哀侯晉人立其子小子侯桓七年曲沃武公殺小子侯桓八年曲沃滅翼冬王命虢仲立晉哀侯之弟緡于晉曲沃武公六年衛宣公八年魯桓公十二年宣公卒惠公朔立桓十六年惠公奔齊公子黔牟立蔡桓侯四年魯桓公十七年桓侯卒子哀侯獻舞立曹桓公四十六年魯桓公十年曺桓公卒莊公射姑立滕詳見隱公元年陳桓公三十四年魯桓公五年陳桓公卒陳他殺太子免而自立桓六年蔡人殺陳他厲公躍立桓十二年厲公卒莊公林立杞武公詳見隱公元年薛詳見隱公元年莒詳見隱公元年邾儀父詳見隱公元年許許叔詳見隱公元年魯桓公十五年許叔入于許小邾詳見隱公元年楚武王三十年魯桓公六年伐隨使隨請周尊楚號周室不聽還報楚桓公八年熊通怒自立為楚武王與隨人盟而去詳見莊公四年傳注秦詳見隱公元年吳詳見隱公元年越詳見隱公元年欽定四庫全書日講春秋解義卷五桓公名軌史記名允惠公之子隱公之弟以桓王九年即位諡法辟土服逺曰桓元年人君繼世踰年改元自是循數以編年雖久而不易至漢孝文改後元年孝武又因事别建年號歷代因之或一世而屢易或一嵗而再更記注繁蕪莫可勝紀乃知春秋編年為萬世不易之法也春王正月公即位公羊傳繼弒君不言即位此其言即位何如其意也弒君欲即位故如其意以著其惡榖梁傳桓無王其曰王何也桓公十八年唯元年二年十年十八年有王自外皆無王故傳據以發問謹始也其曰無王何也桓弟弒兄臣弒君天子不能定諸侯不能救百姓不能去以為無王之道遂可以至焉爾元年有王所以治桓也繼故不言即位正也故謂弒也繼故不言即位之為正何也曰先君不以其道終則子弟不忍即位也繼故而言即位則是與聞乎弒也繼故而言即位是為與聞乎弒何也曰先君不以其道終已正即位之道而即位是無恩于先君也推其無恩則知與弒也繼故而書即位則為與聞乎弒何也以無哀先君之心故泰然而行即位之禮也桓公之書即位與文成襄昭同何以知其與聞乎弒也隱公之薨不地不葬則不以道終顯然矣桓之篇十四年春不書王以王綱不振故篡弒之賊得泰然而安于其位也元年書王以踰年即位正王法當行之日也然則公羊氏所稱桓幼而貴隱長而卑者非乎非也諸侯不再娶惠公元妃既卒繼室以聲子則是攝行內主之事矣隱之立正也其欲授桓實讓而非攝也隱讓而桓弒罪不容於誅矣三月公會鄭伯于垂榖梁傳會者外為主焉爾鄭伯所以欲為此會者為易田故鄭伯欲得許田以自廣是以為垂之會蓋知桓之篡逆意不自安特假以求賂焉度魯急於會諸侯必從所欲故也夫鄭莊與隱公同盟締好今見其賊不能討反有所要求欲以定其位故書公會鄭伯會者外為主言鄭志也鄭伯以璧假許田左傳元年春公即位修好于鄭鄭人請復祀周公卒易祊田事在隱八年公許之三月鄭伯以璧假許田為周公祊故也魯不宜聽鄭祀周公又不宜易取祊田犯二不宜以動故隱其實不言祊稱璧假言若進璧以假田非久易也公羊傳其言以璧假之何易之也易之則其言假之何為恭也使若暫假借之辭曷為為恭有天子存則諸侯不得専地也許田者何魯朝宿之邑也諸侯時朝乎天子天子之郊諸侯皆有朝宿之邑焉古者諸侯朝于天子至逺郊不敢便入必先告至天子以諸侯逺來朝為告至之須當有所止宿故賜邑于逺郊其實天子地諸侯不得専也此魯朝宿之邑也則曷為謂之許田諱取周田也諱取周田則曷為謂之許田繫之許也曷為繫之許近許也此邑也其稱田何田多邑少稱田邑外之田畝多邑內之家數少則稱田邑多田少稱邑邑內之家數多邑外之田畝少則稱邑榖梁傳假不言以言以非假也非假而曰假諱易地也禮天子在上諸侯不得以地相與也無田則無許可知矣不言許不與許也但言以璧假許而不繼田則許屬鄭也今言許田明以許之田與鄭不與許邑許田者魯朝宿之邑也邴者鄭伯之所受命而祭泰山之邑也泰山非鄭竟從天王巡狩受命而祭也用見魯之不朝于周而鄭之不祭泰山也擅相易則知朝祭並廢隱公八年鄭來歸祊本欲易許田也魯受祊而未與許田以祊薄於許也及桓公弒立鄭伯乘其位之未定復要許田而加璧以請焉知桓方自危不敢不從也其不曰以璧易而謂之假者為國諱惡且示有歸道也桓乃無父無君之人則棄先祖之地廢朝覲之禮曾不以動其心宜矣夏四月丁未公及鄭伯盟于越越杜注近垂地名當在今山東曺州附近左傳夏四月丁未公及鄭伯盟于越結祊成也盟曰渝盟無享國榖梁傳及者內為志焉爾越盟地之名也鄭伯先為垂之會以求許田公既以許田委鄭而因欲固鄭好以自安故復為此盟書公及魯志也衛州吁弒桓公而自立則朝陳而請覲於王曺負芻弒宣公之子而自立諸侯與會于戚而執之曺人請于晉曰若有罪則君列諸會矣亂臣賊子所懼者天子之征鄰封之討耳天子而許之覲鄰國而與之會則可安於其位矣此衰周之亂政也魯自隱公以來與齊鄭親鄭伯數假王命以興師戰克攻取諸侯畏之故桓公不惜棄先祖之地以求為此盟而又求昏於齊以自固也至鄭伯之惡則不待貶絶而自見矣秋大水此書水災之始左傳秋大水凡平原出水為大水廣平曰原雨自上而下浸潤于土陂障下地可使水潦停焉平原髙地不應有水而云出水者水不入于土而出于地上也公羊傳何以書記災也榖梁傳髙下有水災曰大水水災隂沴之發也大者非常之詞書大水則害禾稼毁廬舍不待言矣書時不書月以見泛濫為害歷時未平也變不虛生蓋可忽乎哉冬十月榖梁傳無事焉何以書不遺時也春秋編年四時具而後為年附録左傳冬鄭伯拜盟鄭伯若自來則經不書若遣使則當言鄭人不得稱鄭伯疑謬誤宋華父督見孔父之妻于路華父大夫氏督名宋戴公孫孔父宋大司馬父其名榖梁以父為字諡非也目逆而送之曰美而艷二年春王正月榖梁傳桓無王其曰王何也正與夷之卒也元年書王篡弒之賊踰年即位而臨臣民王法宜急施也二年復書王喪期未畢猶冀王之能討也過此而不討則終無望矣故三年以後不復書王也先儒以為正宋督之弒義亦可通但二百四十年他國有篡弒之變未嘗不書王則非春秋之本指也戊申宋督弒其君與夷及其大夫孔父左傳二年春宋督攻孔氏殺孔父而取其妻公怒督懼遂弒殤公君子以督為有無君之心而後動于惡故先書弒其君公羊傳及者何纍也從君而死曰纍弒君多矣舍此無纍者乎曰有仇牧荀息皆纍也仇牧事在莊十二年荀息事在僖十年舍仇牧荀息無纍者乎曰有有則此何以書賢也何賢乎孔父孔父可謂義形于色矣其義形于色奈何督將弒殤公孔父生而存則殤公不可得而弒也故于是先攻孔父之家殤公知孔父死己必死趨而救之皆死焉孔父正色而立于朝則人莫敢過而致難于其君者孔父可謂義形于色矣榖梁傳孔父先死其曰及何也書尊及卑春秋之義也孔父之先死何也督欲弒君而恐不立于是乎先殺孔父孔父間也間捍禦也何以知其先殺孔父也曰子既死父不忍稱其名臣既死君不忍稱其名以是知君之纍之也孔氏父字諡也或曰其不稱名蓋為祖諱也孔子故宋也孔父既死而後殤公弒先書弒君者督有無君之心而後敢加刃于孔父也書及其大夫褒死節也孔父不能早正殤公之德預遏華督之姦而春秋褒其節何也孔父生而存則殤公不可得而弒其正色立朝實足以衛宗社而怵姦邪不可以變出意外而遂沒其節也觀華督及徒人費石之紛如賈舉州綽之類皆與君偕死而不書則知書者皆春秋之所豫矣滕子來朝滕侯國何以稱子時王所貶也王政之不行于諸侯久矣何以能加于滕小國猶有聽命者也故杞於桓以侯見至僖而書子薛於隱以侯見至莊而書伯與滕子為三皆微國也大國莫見焉杞于僖以子見至文復書伯亦時王進之也或以為孔子之褒貶非也諸侯之惡有大于三國者矣何以不貶以是知其不可通也按卓氏爾康曰灌甫曰樂正子記滕薛旅朝隱公桓王聞之徴朝皆黜焉則信而有徵矣三月公會齊侯陳侯鄭伯于稷以成宋亂稷杜注宋地當在今河南歸德府境左傳會于稷以成宋亂為賂故立華氏也言立以為卿宋殤公立十年十一戰民不堪命孔父嘉為司馬嘉孔父字督為大宰故因民之不堪命先宣言曰司馬則然己殺孔父而弒殤公召莊公于鄭而立之以親鄭莊公公子馮也隱三年出居于鄭以郜大鼎賂公郜國所造之鼎故名郜大鼎郜杜注國名濟隂城武縣東南有郜城蓋郜有二城南郜城則為宋邑隱十年取郜是也北郜城則為郜國俱在山東城武縣齊陳鄭皆有賂故遂相宋公公羊傳內大惡諱此其目言之何目指斥也逺也所見異辭所聞異辭所傳聞異辭隱亦逺矣曷為為隱諱謂觀魚之事隱賢而桓賊也桓篡弒與宋督同惡相濟故賤不為諱也榖梁傳以者內為志焉爾公為志乎成是亂也此成矣取不成事之辭而加之焉取不成事之辭若云宋亂本不可成桓實強成之于內之惡而君子無遺焉爾桓弒逆之人故極言其惡無所遺漏會未有言其所為此特言所為者蓋事關世變篡弒之禍接迹天下自此會始也向也合五國之君大夫以定州吁而州吁卒討今也合四國之君以立華督而督遂世為國卿亂臣賊子自是泰然無所忌憚矣春秋諱國惡獨此直書公會以桓公身為大惡諸侯不能討其亂而反與共會成宋亂乃人道之極變也春秋特書所為者二此會與澶淵之會是也蓋不書以成宋亂則此會疑謀討華督不書宋災故則澶淵之會疑謀討蔡般此所謂大義數十炳如日星聖人直書以著褒貶者也夏四月取郜大鼎于宋戊申納于大廟左傳夏四月取郜大鼎于宋戊申納于大廟非禮也臧哀伯諌曰哀伯魯大夫僖伯之子君人者將昭德塞違以臨照百官猶懼或失之故昭令德以示子孫是以清廟茅屋清廟肅然清靜之稱茅屋以茅飾屋大路越席大路玉路祀天車也越席結草為席大羹不致大羹肉汁不致五味粢食不鑿黍稷曰粢不精鑿昭其儉也衮冕黻珽衮畫衣冕冠也黻韋韠以蔽膝珽玉笏也𢃄裳幅舄𢃄革𢃄裳下衣愊今之行縢逼束其脛自足至膝舄復履衡紞紘綖衡維持冠者紞冠之垂者紘纓從下而上者綖冠上覆昭其度也藻率鞞鞛藻率以韋為之所以藉玉鞞佩刀削上飾鞛下飾鞶厲遊纓鞶大𢃄厲大𢃄之垂者遊旌旗之遊纓在馬膺前昭其數也火龍黼黻火畫火也龍畫龍也白與黑謂之黼文如斧黑與青謂之黻文如兩已相背昭其文也五色比象車服器械之有五色皆以比象天地四方昭其物也示器物不虗設鍚鸞和鈴鍚在馬額鸞在鑣和在衡鈴在旗昭其聲也三辰旗旗日月星為三辰畫于旗旗昭其明也夫德儉而有度登降有數登降謂上下尊卑文物以紀之聲明以發之以臨照百官百官于是乎戒懼而不敢易紀律今滅德立違謂立華督違命之臣而置其賂器于大廟以明示百官百官象之其又何誅焉國家之敗由官邪也官之失德寵賂章也郜鼎在廟章孰甚焉武王克商遷九鼎于洛邑九鼎殷所受夏九鼎也武王克商乃營洛邑而遷九鼎焉洛邑杜注武王但營洛邑未有都城周公乃卒營洛邑謂之王城即河南城也今河南洛陽縣城內西偏即王城故址義士猶或非之夷齊之屬而况將昭違亂之賂器于大廟其若之何公不聽周內史聞之曰內史周大夫官臧孫達其有後于魯乎君違不忘諌之以德公羊傳此取之宋其謂之郜鼎何器從名從舊主之名地從主人從見在得地之主人器何以從名地何以從主人器之與人非有即爾器之始造各有主非今有之而即可為是人之器也故其名必從本主宋始以不義取之故謂之郜鼎至乎地之與人則不然俄而可以為其有矣土地無常主故俄而可以為其有矣然則為取可以為其有乎承上文言地既可以俄而為所有則既為所取遂可以為所有而于義無傷乎曰否何者若楚王之妻媦無時焉可也媦妹也引此為喻明其終不可為有也何以書譏何譏爾遂亂受賂遂成也納于大廟非禮也穀梁傳桓內弒其君外成人之亂受賂而退以事其祖非禮也其道以周公為弗受也郜鼎者郜之所為也曰宋取之宋也鼎本郜國所作宋後得之以是為討之鼎也討宋亂而更受其賂鼎孔子曰名從主人謂作鼎之主人物從中國謂鼎在宋故曰郜大鼎也宋以郜鼎賂公不曰宋人來歸而曰取于宋蔽罪于魯也曰郜大鼎宋本以不義取鼎于郜而魯又取之于宋也定弒逆之賊取其賂器置于大廟以明示百官其後公子牙慶父仲遂意如之惡豈非則而象之者與取者得非其有之稱納者內不受之辭不曰獻而曰納其義以先祖為不受也春秋書致賂者三宋以郜鼎賂而書魯取蔽罪于魯也魯以濟西賂而書齊取蔽罪于齊也齊致衛寶而書齊人來歸明齊首惡且結正諸侯之罪不獨在魯也秋七月杞侯來朝公羊榖梁皆作紀侯左傳秋七月把侯來朝不敬杞侯歸乃謀伐之榖梁傳朝時此其月何也前滕侯薛侯來朝止稱時桓內弒其君外成人之亂于是為齊侯陳侯鄭伯討數日以賂討計也為三國計功勞數日月多寡以責宋賂已即是事而朝之已紀也惡之故謹而月之也左氏誤以紀為杞見下有入把事遂為不敬之説杞爵非侯文誤也及紀侯大去之後杞無以侯見者矣故知凡杞稱侯者皆當為紀蔡侯鄭伯會于鄧鄧按公羊蓋鄧國今湖廣襄陽府東北鄧城是與杜注異左傳蔡侯鄭伯會于鄧鄧杜注潁川召陵縣西南有鄧城蓋蔡地也始懼楚也楚杜注楚國南郡江陵縣北紀南城也今江陵縣屬湖廣荆州府紀南城在府北公羊傳離不言會二國會曰離此其言會何蓋鄧與會爾此外諸侯相會之始而楚為中國患已兆其端關於天下之故非小故春秋特書之荆楚負險恃強有道後服見于商頌周雅及周之衰僭號稱王威行江漢至是遂有憑陵上國之心三國地與之近是以懼而為會其後鄧首見滅蔡侯為俘終春秋之世鄭被蹂轥不能自強於政冶而欲恃外交以抗強大果何益乎此孟子所以言以小事大惟在於強為善也九月入杞左傳九月入把討不敬也榖梁傳我入之也將卑師少外則稱人內則但云入某伐某故知入把者魯也或疑蔡鄧入把然考之于經如滅逼陽滅賴蒙前事而書者皆稱遂此不稱遂則為魯入無疑矣公及戎盟于唐左傳公及戎盟于唐修舊好也惠隱之好隱公因戎請至再而後與之盟今戎未嘗請而桓及之盟蓋身負大惡欲結好以自固與及鄭盟越之意同也冬公至自唐此書至之始左傳冬公至自唐告于廟也凡公行告于宗廟反行飲至舍爵䇿勳焉禮也爵飲酒器既飲置爵則書勳勞于䇿速紀有功也特相會往來稱地讓事也特相會公與一國會也會必有主二人獨會則莫肯為主彼此相讓會事不成故但書地自參以上則往稱地來稱會成事也成會事榖梁傳桓無會而其致何也逺之也桓會甚衆而曰無會者無致會也此以逺故危而致之凡君行告于宗廟反必告至禮之常也其不書至者未行飲至之禮也凡書至皆稱自會以盟皆因會而為之還時雖并以盟告而出則未有以盟告者故不云至自盟也其或會盟之後復有侵伐之事如僖二十八年會于溫遂圍許而書公至自圍許襄十年會于柤遂滅逼陽而書公至自會則時史之異亦因其告廟之文夲異而書於册耳附録左傳初晉穆侯之夫人薑氏以條之役生太子條杜注晉地今山西安邑縣有中條山縣北有鳴條岡穆侯七年戰條太子文侯也命之曰仇意取戰相仇怨其弟以千畝之戰生弟桓叔也千畝杜注西河界休縣南有地名千畝今山西介休縣有千畝原穆侯十年戰千畝命之曰成師意取能成其衆師服曰晉大夫異哉君之名子也夫名以制義名之必可言也義以出禮禮從義出禮以體政政以禮成政以正民是以政成而民聽易則生亂嘉耦曰妃怨耦曰仇古之命也自古有此言今君命太子曰仇弟曰成師始兆亂矣兄其替乎太子桓叔並因戰為名而所附意異故師服知桓叔之黨必盛于晉以傾宗國惠之二十四年魯惠公也晉始亂故封桓叔于曲沃文侯卒子昭侯立危不自安故封桓叔為曲沃伯靖侯之孫欒賓傅之靖侯桓叔之髙祖以貴寵公孫為傅相後遂為欒氏蓋其父字欒師服曰吾聞國家之立也本大而末小是以能固故天子建國立諸侯也諸侯立家主卿大夫之家卿置側室側室衆子也得立此一官大夫有二宗大夫身是適子為小宗亦立次者為二宗以相輔二士有𨽻子弟士卑自以子弟為僕𨽻庶人工商各有分親庶人無尊卑但以親疏為分別皆有等衰衰殺也自天子至于庶人各有等第降殺是以民服事其上而下無覬覦下不冀望上位今晉甸侯也而建國本既弱矣其能久乎惠之三十年晉潘父弒昭侯而納桓叔不克潘父晉大夫時桓叔入晉敗歸晉人立孝侯昭侯子惠之四十五年曲沃莊伯伐翼弒孝侯莊伯桓叔子翼人立其弟鄂侯鄂侯生哀侯鄂侯以隱五年奔隨其年王立哀侯于翼哀侯侵陘庭之田陘庭杜注翼南鄙邑今山西翼城縣東南有熒庭城志云即陘庭也陘庭南鄙啓曲沃伐翼三年春正月自三年以後月不繫王以著桓之無王與天王之失政也諸侯喪畢以士服見天子天子錫之爵命然後歸治其國桓弒其君又成人之亂當類見之期又不入見而請命焉是無王也桓王不能施九伐之法又明年而宰糾且下聘焉王綱盡墜天下自是不復知有王矣或以為周不頒厯昭公末年王室有子朝之亂豈暇頒厯而經皆書王非不頒厯明矣又以為此闕文安得一公之內凡十四年皆不書王為此説者皆不明于春秋討賊之義者也附録左傳三年春曲沃武公伐翼武公莊伯子次于陘庭凡師再宿為信過信為次韓萬御戎韓萬莊伯弟梁𢎞為右右戎車之右逐翼侯于汾隰汾釋例汾水出太原故汾陽縣至河東汾隂入河今汾水出山西靜樂縣西南至滎河縣北入河靜樂漢汾陽滎河漢汾隂也汾隰汾水邉驂絓而止驂騑馬夜獲之國語云殺哀侯及欒共叔共叔桓叔之傳欒賓之子公會齊侯于嬴嬴杜注齊邑泰山嬴縣故城在今山東泰安州東南左傳會于嬴成昏于齊也公不由媒介自與齊侯會而成昏魯桓懼方伯之有討而乞昏于齊以為此會非媒而昏昏不以正也越境而會會不以正也使其私人往逆逆不以正也為齊侯而親迎迎不以正也故于嬴之會謹而書之夏齊侯衛侯胥命于蒲蒲杜注衛地在陳留長垣縣西南今直𨽻長垣縣治故蒲城是也左傳夏齊侯衛侯胥命于蒲不盟也公羊傳胥命者何相命也相命以言不歃血為誓何言乎相命近正也此其為近正奈何古者不盟結言而退榖梁傳胥之為言猶相也相命而信諭謹言而退以是為近古也是必一人先其以相言之何也不以齊侯命衛侯也倡和理均不以齊大衛小而分别之世至春秋列國多變傾危成俗盟詛多渝二國為會相命以言不復刑牲歃血要質于鬼神故公羊榖梁皆以為近古而荀卿亦謂春秋善胥命也或謂相命為方伯則經當明著其事以正其不命于王而私相命之罪矣按左氏莊二十一年鄭虢胥命于弭同謀納王不可謂相命以伯况齊衛胥命以後不聞有會盟侵伐之事其戰于即及盟于惡曺皆以鄭忽之故則非相命以伯明矣六月公會杞侯于郕把公羊作紀郕公羊作盛左傳公會把侯于郕杞求成也凡稱把侯者皆當作紀紀侯懼齊欲親魯為援冀抗齊鄭觀桓之六年復與公為郕之會而冬又來朝則此會之為紀明矣秋七月壬辰朔日有食之既公羊傳既者何盡也穀梁傳言日言朔食正朔也既者盡也有繼之辭也盡而復生謂之既言日言朔食正朔也既盡也厯家以日月交會月掩日故日食食既則正相掩而日光為之盡也榖梁傳曰言日言朔食正朔也言朔不言日食既朔也言日不言朔食晦日也不言日不言朔夜食也夫夜食而曉見其傷則時刻可稽何為不書朔與日乎且使日食于亥子之交未出地而明復則雖朝日何從見其虧傷之處耶蓋日食不占夜猶月食不占晝是以唐一行算厯上􅘦往古千有餘年日食常在晝月食常在夜春秋所書日食或有日而無朔或有朔而無日或日朔並失乃舊史有詳略耳公子翬如齊逆女左傳秋公子翬如齊逆女修先君之好故曰公子昏禮雖奉時君之命其言必稱先君以為禮辭故公子翬逆女傳稱修先君之好公子遂逆女傅稱尊君命互舉其義穀梁傳逆女親者也使大夫非正也翬至桓公之編始稱公子桓以為謀主德其援立而加崇寵也翬為桓弒隱即為桓逆女以結好于齊所以定桓而因自固也遂之于宣亦然皆不待貶絶而罪惡見者也九月齊侯送薑氏于歡歡杜注魯地濟北蛇丘縣西有下歡亭水經注云俗訛為夏暉城今山東肥城縣西南有故城左傳齊侯送薑氏非禮也凡公女嫁于敵國姊妹則上卿送之以禮于先君公子則下卿送之于大國雖公子亦上卿送之于天子則諸卿皆行公不自送于小國則上大夫送之公羊傳何以書譏何譏爾諸侯越竟送女非禮也此入國矣何以不稱夫人自我言齊父母之于子雖為鄰國夫人猶曰吾薑氏榖梁傳禮送女父不下堂母不出祭門諸母兄弟不出闕門祭門廟門也闕兩觀也在祭門外父戒之曰謹慎從爾舅之言母戒之曰謹慎從爾姑之言諸母般申之曰謹慎從爾父母之言般囊也所以盛朝夕所須以備舅姑之用送女踰竟非禮也歡魯地也父母兄弟無越竟送女之禮譏齊侯也入國矣何以不稱夫人未廟見猶未入國也故從齊侯而為之辭公會齊侯于歡穀梁傳無譏乎曰為禮也齊侯來也公之逆而會之可也齊侯送女入魯竟公以會禮接之兩失之矣春秋謹而書之所以正人倫之始也夫人薑氏至自齊公羊傳翬何以不致得見乎公矣榖梁傳其不言翬之以來何也公親受之于齊侯也子貢曰冕而親迎不己重乎冕祭服孔子曰合二姓之好以繼萬世之後何謂己重乎前書翬逆此不書翬以夫人薑氏至以桓既會齊侯而受之于歡也家人之初曰間有家悔亡桓失其間敝笱之刺兆矣冬齊侯使其弟年來聘左傳冬齊仲年來聘致夫人也女出嫁隨使大夫聘問自魯出則曰致女自他國來則總曰聘蓋以聘禮致故傳曰致女而經曰聘也隱七年年嘗來聘隱弒而結昏于桓又使年來聘深愛其女而以歸于篡弒之人所謂失其本心者與有年公羊傳有年何以書以喜書也大有年何以書亦以喜書也此其曰有年何僅有年也彼其曰大有年何謂宣十六年大豐年也僅有年亦足以當喜乎恃有年也恃賴也謂民猶賴此有年也榖梁傳五榖皆熟為有年也春秋二百四十二年之中豈無豐年而不見于經惟于桓書有年于宣書大有年蓋桓宣享國皆十有八年而書有年者各一嵗則他年多歉而民不聊生具見矣春秋獨于二公書有年以著其逆天而殃及于民也附録左傳芮伯萬之母芮薑惡芮伯之多寵人也故逐之出居于魏為明年秦侵芮張本芮杜注芮國在馮翊臨晉縣今陜西朝邑縣有芮故城在黃河西岸魏杜注魏國河東河北縣括地志魏故國在芮城縣北今山西芮城縣河北故城是也孔疏世本芮魏皆姬姓日講春秋解義卷五
