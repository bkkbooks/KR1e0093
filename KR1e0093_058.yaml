body:
  text: 欽定四庫全書日講春秋解義卷五十八定公五年春王三月辛亥朔日有食之三月公羊作正月附錄左𫝊五年春王人殺子朝于楚因楚亂也終閔馬父之言夏歸粟于蔡左傳夏歸粟于蔡以周亟矜無資亟急也公羊傳孰歸之諸侯歸之曷為不言諸侯歸之離至不可得而序故言我也穀梁傳諸侯無粟諸侯相歸粟正也孰歸之諸侯也不言歸之者專辭也若獨主于魯義邇也言邇近之事不足具列諸侯春秋貴義不貴惠蔡為楚困而不能救今見楚敗吳勝乃歸蔡粟徒為吳而已無救災之實也二傳以為諸侯歸之經畧不序盖魯與諸侯皆以晋命歸粟書魯事則可包諸侯與城楚丘戌陳同義於越入吳左傳越入吳吳在楚也公羊傳於越者何越者何於越者未能以其名通也不能與中國通故從其俗稱曰於越越者能以其名通也能與中國通則以中國之辭稱之曰越於越者其自稱者也越者中國稱之者也考之經入吳敗吳皆越人来告故書於越吳伐越則吳来吿也故止書越六月丙申季孫意如卒左傳六月季平子行東野東野杜注季氏邑還未至丙申卒于房房蓋近費之地陽虎將以璵璠歛璵璠羙玉君所佩仲梁懐弗與懐亦季氏家臣曰改步改玉步謂行也玉藻云君行接武大夫繼武又云公侯佩山𤣥玉大夫佩水蒼玉是君臣步玉不同陽虎欲逐之吿公山不狃不狃曰彼為君也子何怨焉不狃季氏臣費宰子洩也為君不欲使僭既𦵏桓子行東野桓子意如子季孫斯及費子洩為費宰逆勞于郊桓子敬之勞仲梁懐仲梁懐弗敬懐時從桓子行輕慢子洩子洩怒謂陽虎子行之乎行逐懐也為下陽虎囚桓子起内大夫有罪而身不見討則春秋不書其卒公子翬是也意如卒何以書見定公忘大義而念私勞使逐君之賊生安其位卒用卿禮也秋七月壬子叔孫不敢卒附録左𫝊申包胥以秦師至秦子蒲子虎帥車五百乗以救楚五百乗三萬七千五百人子蒲曰吾未知吳道言未知制吳之法術使楚人先與吳人戰而自稷㑹之大敗夫槩王于沂稷沂杜注皆楚地當在今河南桐柏縣境吳人獲薳射子柏舉薳射楚大夫其子帥奔徒以從子西敗吳師于軍祥軍祥杜注楚地當在今湖廣隨州西南秋七月子期子蒲滅唐從吳伐楚故九月夫槩王歸自立也自立為吳王號夫槩以與王戰而敗奔楚為堂谿氏傳終言之吳師敗楚師于雍澨秦師又敗吳師吳師居麇麇杜注地名今湖廣巴陵縣東有麇城子期將焚之子西曰父兄親暴骨焉不能收又焚之不可前年楚與吳戰多死麇中言不可并焚子期曰國亡矣死者若有知也可以歆舊祀言焚吳復楚則祭祀不廢豈憚焚之焚之而又戰吳師敗又戰于公壻之谿公壻之谿杜注楚地名吳師大敗吳子乃歸囚闉輿罷闉輿罷請先遂逃歸輿罷楚大夫請先至吳而逃歸言吳惟得楚一大夫復失之所以不克葉公諸梁之弟后臧從其母于吳不待而歸諸梁司馬沈尹戌之子葉公子髙也吳入楚獲后臧之母楚定臧棄母而歸葉公終不正視不義之乙亥陽虎囚季桓子及公父文伯文伯季桓子從父昆弟也而逐仲梁懐冬十月丁亥殺公何藐藐季氏族己丑盟桓子于稷門之内稷門魯南城門庚寅大詛逐公父歜及秦遄皆奔齊歜即文伯也秦遄平子姑壻也傳言季氏之亂楚子入于郢吴師已歸初鬭辛聞吳人之爭宫也曰吾聞之不讓則不和不和不可以逺征吳爭于楚必有亂有亂則必歸焉能定楚王之奔隨也將涉于成臼成臼杜注江夏竟陵縣有臼水出聊屈山西南入漢今湖廣漢川縣有臼子河西南與漢水合即臼水也藍尹亹涉其帑亹楚大夫不與王舟及寧王欲殺之子西曰子常唯思舊怨以敗君何效焉王曰善使復其所吾以志前惡惡過也王賞鬭辛王孫由于王孫圉鍾建鬭巢申包胥王孫賈宋木鬭懐九子皆從王有大功者子西曰請舍懐也以初謀弑王也王曰大徳滅小怨道也終從其兄免王大難是大徳申包胥曰吾為君也非為身也君既定矣又何求且吾尤子旗其又為諸子旗蔓成然也以有徳于平王求欲無厭平王殺之在昭十四年遂逃賞王將嫁季芈季芈辭曰所以為女子逺丈夫也鍾建負我矣以妻鍾建以為樂尹司樂大夫王之在隨也子西為王輿服以保路國于脾洩失王恐國人潰散故偽為王車服立國脾洩以保安道路人脾洩杜注楚邑當在今湖廣荆州府境聞王所在而後從王王使由于城麇于麇築城復命子西問髙厚焉弗知子西曰不能如辭言自知不能當辭勿行城不知髙厚小大何知對曰固辭不能子使余也人各有能有不能王遇盜于雲中余受其戈其所猶在袒而示之背曰此余所能也脾洩之事余亦弗能也傳言昭王所以復國有賢臣也冬晉士鞅帥師圍鮮虞左傳晉士鞅圍鮮虞報觀虎之役也三年鮮虞獲晉觀虎鮮虞近晉晉彊家實利其土以培私封屢伐不克故復圍之六年春王正月癸亥鄭游速帥師滅許以許男斯歸速公羊作遫後同左傳六年春鄭滅許因楚敗也鄭虐於許久矣許依楚抗鄭至於四遷今吳入郢許無所援鄭遂滅之哀元年以後許復見者楚禍既定復建許也自隱十一年鄭入許而齊鄭之黨合天下遂無王至是鄭滅許而齊鄭之黨又合天下遂無霸葢晋楚俱弱勢復一變而春秋以終矣二月公侵鄭左𫝊二月公侵鄭取匡為晉討鄭之伐胥靡也胥靡杜注周地周儋翩因鄭人以作亂鄭為之伐胥靡故晋使魯討之匡杜注鄭地取匡不書歸之晋往不假道于衛及還陽虎使季孟自南門入出自東門陽虎將逐三桓使得罪于鄰國舍于豚澤衞侯怒使彌子瑕追之彌子瑕衞嬖大夫公叔文子老矣文子公叔發輦而如公曰尤人而效之非禮也昭公之難君將以文之舒鼎衞文公之鼎成之昭兆寳龜定之鞶鑑鞶帶而以鏡為飾也苟可以納之擇用一焉公子與二三臣之子諸侯苟憂之將以為之質為質求納魯昭公此羣臣之所聞也今將以小忿蒙舊徳無乃不可乎大姒之子大姒文王妃唯周公康叔為相睦也而效小人以棄之不亦誣乎天將多陽虎之罪以斃之君姑待之若何乃止止不伐魯師自宣十八年公伐把後魯無君將者八十年至是陪臣執國以三桓專兵為口實欲竊兵權故託公以出師耳當是時晋霸既失諸侯皆離令不能行故討鄭之師雖出晋命實陽虎主其謀欲徼禍鄰國危魯師以逞其欲故書侵以志其挟私啓釁非有輔霸討亂之實也公至自侵鄭夏季孫斯仲孫何忌如晉左傳夏季桓子如晉獻鄭俘也獻此春取匡之俘陽虎强使孟懿子往報夫人之幣晋人兼享之賤魯故不復兩設禮孟孫立于房外謂范獻子曰陽虎若不能居魯而息肩于晋所不以為中軍司馬者有如先君稱先君以徵其言若欲使晉必厚待之獻子曰寡君有官將使其人擇得其人鞅何知焉獻子謂簡子曰魯人患陽虎矣孟孫知其釁以為必適晋故强為之請以取入焉欲令晉人聞虎當逃走故强設請託之辭因此言以入晉令晉素知之春秋書内卿竝使者二遂得臣如齊見仲遂邪謀之始此年斯何忌如晋見陽虎專權二卿為其所脅行止惟命他日為亂之端兆也然不介晋權亂未敢發故因如晋變文書介副以著其禍之所自起耳附錄左傳四月己丑吳大子終纍敗楚舟師終纍闔廬子夫差兄獲潘子臣小唯子二子楚舟師之帥及大夫七人楚國大惕懼亡子期又以陵師敗于繁揚陵師陸軍令尹子西喜曰乃今可為矣言知懼而後可治于是乎遷郢于鄀而改紀其政以定楚國傳言楚賴子西以安周儋翩率王子朝之徒因鄭人將以作亂于周儋翩子朝餘黨鄭于是乎伐馮滑胥靡負黍狐人闕外鄭伐周六邑在魯伐鄭取匡前于此見者為戌周起也負黍杜注陽城縣西南有負黍亭今河南登封縣負黍聚一名黄城是也狐人後漢志潁隂縣有狐宗鄉古狐人亭也在今河南臨潁縣闕外即伊闕外之邑在今洛陽縣南闕塞山下六月晉閻沒戌周且城胥靡為下天王出居姑蕕起秋晉人執宋行人樂祁犂左𫝊秋八月宋樂祁言于景公曰諸侯唯我事晉今使不往晉其憾矣樂祁吿其宰陳寅以與公言吿之陳寅曰必使子往他日公謂樂祁曰唯寡人説子之言子必往陳寅曰子立後而行寅知晉政多門往必有難故使樂祁立後而往吾室亦不亡唯君亦以我為知難而行也見溷而行溷樂祁子也見于君立以為後趙簡子逆而飲之酒于緜上獻楊楯六十于簡子楊木名陳寅曰昔吾主范氏今子主趙氏又有納焉以楊楯賈禍弗可為也已知范氏必怨將得禍然子死晉國子孫必得志于宋以其為國死范獻子言于晉侯曰以君命越疆而使未致使而私飲酒不敬二君不可不討也乃執樂祁晉自八卿擅權上下相陵傾軋之謀已非一日今范鞅為政而趙鞅主宋樂祁此欲奪執政之權非為一宋行人爭得失也范鞅知之故必執樂祁以伐其謀各逞私圖不顧國體亂政亟行内外相競而晉之禍遂不可止自是三家之勢成矣冬城中城穀梁傳城中城者三家張也三家侈張故公懼而修内城或曰非外民也是時政在三家公室無民豈能役衆修城以備外患盖陽虎欲去三桓故託懼齊鄭而城中城將挟公以自固耳季孫斯仲孫忌帥師圍鄆公羊傳此仲孫何忌也曷為謂之仲孫忌譏二名二名非禮也昭公二十五年齊侯取鄆以居公三十年鄆潰遂貳於齊至是陽虎謀傾季氏脅使圍鄆以搆齊而絶其外援明年國夏来伐連嵗兵争葢始於此仲孫忌不言何闕文附録左傳陽虎又盟公及三桓于周社盟國人于亳社詛于五父之衢為八年陽虎作亂起冬十二月天王處于姑蕕姑蕕杜注周地辟儋翩之亂也為明年單劉逆王張本七年春王正月附録左𫝊七年春二月周儋翩入于儀栗以叛儀栗杜注周邑齊人歸鄆陽闗陽虎居之以為政鄆陽關杜注皆魯邑中貳于齊齊今歸之不書者為虎所專也夏四月附錄左傳夏四月單武公劉桓公敗尹氏于窮谷尹氏復黨儋翩共為亂也武公穆公子桓公文公子秋齊侯鄭伯盟于鹹諸侯始復特盟鹹杜注衛地左傳秋齊侯鄭伯盟于鹹徴㑹于衛齊鄭之盟叛晉也霸統絶諸侯散特盟復起自齊桓以来未之有也於是再見諸侯無齊盟矣是故于石門志諸侯之合也于鹹志諸侯之散也齊人執衞行人北宫結以侵衛穀梁傳以重辭也衞人重北宮結齊以衞重結故執以侵之齊侯衞侯盟于沙沙公羊作沙澤杜注陽平元城縣東南有沙亭在今直隸元城縣東左𫝊衞侯欲叛晉諸大夫不可使北宮結如齊而私于齊侯曰執結以侵我欲以齊師懼諸大夫齊侯從之乃盟于瑣瑣杜注即沙也晉地道記元城縣有瑣陽城為明年涉佗捘衞侯手張本齊每視晉為彊弱晉彊則同諸侯以附晉晉弱則合諸侯以自彊而魯衞鄭又視齊晉之彊弱以為向背者也至是晉既益衰楚復新敗吳越之勢未及北方齊遂乘間糾合既盟鄭復劫衛自此以後齊衞合黨次五氏次垂葭次渠蒢至哀元年遂伐晉而天下之變益紛矣大雩齊國夏帥師伐我西鄙左傳齊國夏伐我齊叛晉故陽虎御季桓子公歛處父御孟懿子處父孟氏家臣成宰公歛陽將宵軍齊師齊師聞之墮伏而待之墮毁其車以誘敵而設伏兵處父曰虎不圖禍而必死苫夷曰虎陷二子于難苫夷季氏家臣二子季孟不待有司余必殺女虎懼乃還不敗傳言陪臣强能自相制季孟不敢有心諸侯惟魯事晉齊叛晉與鄭盟故為鄭伐且報鄆之圍也九月大雩經書雩祭二十有一惟昭二十五年及是秋再書雩志災甚且言瀆也冬十月附錄左傳冬十一月戊午單子劉子逆王于慶氏慶氏守姑蕕大夫晉籍秦送王己巳王入于王城己巳十二月五日有日無月館于公族黨氏黨氏周大夫而後朝于莊宮莊王廟八年春王正月公侵齊左傳八年春王正月公侵齊報前年伐我西鄙門于陽州士皆坐列言無鬬志曰顔高之弓六鈞高魯人三十斤為鈞六鈞百八十斤古稱重故以為異强皆取而傳觀之陽州人出顔高奪人弱弓籍丘子鉏擊之子鉏齊人與一人俱斃斃仆也偃且射子鉏中頬殪子鉏死顔息射人中眉顔息魯人退曰我無勇吾志其目也以自矜師退冉猛偽傷足而先猛魯人欲先歸其兄㑹乃呼曰猛也殿㑹見師退而猛不在列乃大呼詐言猛在後殿𫝊言魯無軍政報國夏之伐也是時三家專魯陽虎用事實使公將欲歸怨於公也公至自侵齊附録左傳二月己丑單子伐榖城劉子伐儀栗討儋翩之黨穀城杜注在河南縣西今洛陽縣西北有古城辛邜單子伐簡城劉子伐盂以定王室簡城孟皆周邑今河南河内縣西北有邘臺鎮古盂國也𫝊終王室之亂趙鞅言于晉侯曰諸侯唯宋事晉好逆其使猶懼不至今又執之是絶諸侯也將歸樂祁士鞅曰三年止之執祁在六年無故而歸之宋必叛晉獻子私謂子梁曰獻子范鞅子梁樂祁寡君懼不得事宋君是以止子子姑使溷代子溷樂祁子子梁以吿陳寅陳寅曰宋將叛晉是棄溷也不如待之留待勿以子自代樂祁歸卒于大行大行杜注晉東南山士鞅曰宋必叛不如止其尸以求成焉乃止諸州州杜注晉地為明年宋公使樂大心如晋張本二月公侵齊左𫝊公侵齊攻廩丘之郛主人焚衝衝戰車或濡馬褐以救之馬褐馬衣遂毁之毁郛主人出師奔攻郛人少故遣後師走往助之陽虎偽不見冉猛者曰猛在此必敗陽州之役猛先歸言若在此必復敗猛逐之逐廩丘人顧而無繼偽顛虎曰盡客氣也言非勇苫越生子苫越苫夷將待事而名之陽州之役獲焉名之曰陽州欲比僑如三月公至自侵齊穀梁傳公如往時致月危致也往月致時危往也往月致月惡之也曹伯露卒夏齊國夏帥師伐我西鄙左𫝊夏齊國夏高張伐我西鄙報上二侵以公不與鹹沙之盟且報再侵也自圍鄆以後齊魯之兵六見然于齊稱伐于魯稱侵曲直彊弱可見矣公㑹晉師于瓦瓦杜注衛地東郡燕縣東北有瓦亭今直隸滑縣東南瓦岡集即其地也左傳晉士鞅趙鞅荀寅救我公㑹晉師于瓦范獻子執羔趙簡子中行文子皆執雁魯于是始尚羔禮卿執羔大夫執雁魯則卿大夫竝執雁今見士鞅執羔始令卿執之記禮廢之乆也晉將救魯公親至瓦以逆㑹之比其至則齊師已去救不及事故不書救士鞅不書辭當然也使書㑹晉士鞅則似以他事㑹而不知晉以師來與救之後期及齊師已退矣公至自瓦此特相㑹往来稱地之例也故不以㑹致秋七月戊辰陳侯栁卒晉士鞅帥師侵鄭遂侵衞士公羊作趙左傳晉師將盟衛侯于鄟澤自瓦還就衛地盟趙簡子曰羣臣誰敢盟衛君者前年衞叛晉屬齊簡子意欲摧辱之涉佗成何曰二子晋大夫我能盟之衛人請執牛耳盟禮尊者涖牛耳衛侯與晉大夫盟自以當涖牛耳故請成何曰衛吾温原也焉得視諸侯將歃涉佗捘衛侯之手及捥捘擠也血至捥衞侯怒王孫賈趨進曰賈衛大夫盟以信禮也信猶明也有如衛君其敢不唯禮是事而受此盟也衛侯欲叛晉而患諸大夫王孫賈使次于郊大夫問故問不入之故公以晉詬語之詬恥也且曰寡人辱社稷其改卜嗣寡人從焉大夫曰是衞之禍豈君之過也公曰又有患焉謂寡人必以而子與大夫之子為質大夫曰苟有益也公子則往羣臣之子敢不皆負羈絏以從將行王孫賈曰苟衞國有難工商未嘗不為患使皆行而後可欲以激怒國人公以吿大夫乃皆將行之行有日有期日公朝國人使賈問焉曰若衞叛晉晉五伐我病何如矣皆曰五伐我猶可以能戰賈曰然則如叛之病而後質焉何遲之有乃叛晉晉人請改盟弗許秋晉士鞅㑹成桓公侵鄭桓公周卿士圍蟲牢報伊闕也六年鄭伐周闕外晉為周報之遂侵衞討叛鄭伯與齊為鹹之盟衛侯與齊為沙之盟二國皆為齊叛晉故兩侵之曰遂繼事也曰侵義不足以服人而力復不勝小有侵掠而遂返也葬曹靖公九月𦵏陳懐公季孫斯仲孫何忌帥師侵衞左傳九月師侵衛晉故也為晉命無可聲之罪故書侵冬衛侯鄭伯盟于曲濮曲濮杜注衛地盖濮水曲折之處在今山東濮州境前年公侵鄭今年二卿侵衛皆為晉故而士鞅又自帥師侵之故二國同為此盟以固其交而備晉也從祀先公左傳季寤公鉏極公山不狃皆不得志于季氏季寤季桓子之弟公鉏極公彌曽孫桓子族子公山不狃費宰叔孫輒無寵于叔孫氏輒叔孫氏之庶子叔仲志不得志于魯志叔仲帶之孫為國人所薄故五人因陽虎陽虎欲去三桓以季寤更季氏代桓子以叔孫輒更叔孫氏代武叔已更孟氏陽虎自代懿子冬十月順祀先公而祈焉將作大事欲以順祀取媚辛邜十月二日禘于僖公不于大廟者順祀之義當退僖公懼于僖神故于僖廟行順祀公羊傳從祀者何順祀也復文公之逆祀文公逆祀去者三人諫不從而去之定公順祀叛者五人諫不以禮而去曰叛叛與去皆不書者微也穀梁傳貴復正也文公逆祀今復正從祀之説二傳及諸家皆以為正閔僖之位獨蜀人馮山以為昭公至是始得從祀於太廟而胡氏安國取之於當日事情為近葢意如出君於外既薨七月不得以時歸𦵏𦵏又絶其兆域不得同於先君則其主乆未得從昭穆祔祭宜矣至是意如已卒陽虎將殺季斯亂魯國欲著季氏之罪取説於衆以售其姦遂以昭公之主從祀太廟事雖順而情實逆故春秋特書從祀先公於盜竊寳玉大弓之上以發後人之疑而考其實焉若文公逆祀則臧文仲所為非季氏之惡也但春秋每書宫廟必舉其諡又昭公𦵏已書諡疑已祔廟左氏傳曰順祀先公而祈焉盖自逺及近徧祀魯之先公以祈神祐而請罪季氏也義亦可通盜竊寶玉大弓左傳壬辰將享季氏于蒲圃而殺之戒都車曰癸巳至都邑之兵車也陽虎欲以壬辰夜殺季孫明日癸巳以都車攻二家成宰公歛處父告孟孫曰季氏戒都車何故孟孫曰吾弗聞處父曰然則亂也必及于子先備諸與孟孫以壬辰為期處父期以兵救孟孫壬辰先癸巳一日陽虎前驅林楚御桓子虞人以鈹盾夾之陽越殿越陽虎從弟將如蒲圃桓子咋謂林楚曰咋暫也而先皆季氏之良也爾以是繼之欲使楚免己于難以繼其先人之良對曰臣聞命後後晚也陽虎為政魯國服焉違之徵死死無益于主桓子曰何後之有而能以我適孟氏乎對曰不敢愛死懼不免主桓子曰往也孟氏選圉人之壯者三百人以為公期築室于門外實以備難不欲使人知故偽築室于門外因得聚衆公期孟氏支子林楚怒馬及衢而騁陽越射之不中築者闔門季氏既得入乃閉門有自門閒射陽越殺之陽虎劫公與武叔以伐孟氏武叔叔孫不敢之子州仇也公歛處父帥成人自上東門入魯東城之北門入救孟氏與陽氏戰于南門之内弗勝又戰于棘下棘下杜注城内地名陽氏敗陽虎説甲如公宫取寶玉大弓以出舍于五父之衢寢而為食其徒曰追其將至虎曰魯人聞余出喜于徴死徵召也陽虎召季氏于蒲團將殺之今得脱必喜故言喜于召死何暇追余從者曰嘻懼聲速駕公歛陽在公歛陽請追之孟孫弗許畏陽虎陽欲殺桓子欲因亂討季氏以强孟氏孟孫懼而歸之子言辨舍爵于季氏之廟而出子言季寤辨猶周徧也徧告廟飲酒示無懼陽虎入于讙陽闗以叛叛不書畧家臣公羊傳盜者孰謂謂陽虎也陽虎者曷為者也季氏之宰也季氏之宰則微者也惡乎得國寶而竊之陽虎專季氏季氏專魯國陽虎拘季孫孟氏與叔孫氏迭而食之睋而鋟其板曰以指爪刻其饋器之上歛藏衣物之板某月某日將殺我于蒲圃力能救我則于是于是時至乎日若時而出臨南者陽虎之出也姊妹之子謂之出或曰從其家出而仕于公御之于其乗焉上車時季孫謂臨南曰以季氏之世世有子子可以不免我死乎以義責之臨南曰有力不足臣何敢不勉陽越者陽虎之從弟也為右為季氏車右實衛之諸陽之從者車數十乗至于孟衢孟氏衢也四逹可以横去臨南投策而墜之䇿馬捶也陽越下取策臨南駷馬而由乎孟氏捶馬衘走陽虎從而射之矢著于莊門莊門孟氏所入門名然而甲起于琴如甲公歛處父所帥也琴如地名二家知出期故于是時起兵弑不成却反舍于郊皆説然息説解舍然猶如或曰弑千乗之主而不克時季氏邑至千乗舍此可乎陽虎曰夫孺子得國而已孺子謂季氏得國謂獲免得專國也如丈夫何丈夫虎自謂睋而曰彼哉彼哉望見公歛處父師再言彼哉彼哉者切遽意趣駕既駕公歛處父帥師而至慬然後得免自是走之晉寳者何璋判白判半也半珪曰璋白藏天子青藏諸侯不言璋言玉者珪璧琮璜璋五玉盡亡之也𫝊獨言璋者璋所以郊天尤重也弓繡質質拊也言大者力千斤龜青純純緣也謂縁甲􅏋也千嵗之龜青􅏋明于吉凶經不言龜者從寳省文穀梁𫝊寶玉者封圭也始封之圭大弓者武王之戎弓也周公受賜藏之魯非其所以與人而與人謂之亡非其所取而取之謂之盜盜陽虎也家臣賤名氏不見故曰盜寶玉大弓先公分器不能謹守而盜得竊諸公宫魯之無人無政於此極矣附録左傳鄭駟歂嗣子大叔為政歂駟乞子子然也為明年殺鄧析張本日講春秋解義卷五十八
