body:
  text: 欽定四庫全書日講春秋解義卷七桓公九年春紀季薑歸于京師左傳九年春紀季薑歸于京師凡諸侯之女行唯王后書公羊傳其辭成矣則其稱紀季薑何自我言紀父母之于子雖為天王后猶曰吾季薑京師者何天子之居也京者何大也師者何衆也天子之居必以衆大之辭言之穀梁傳為之中者歸之也中謂關與昏事往逆稱王后既歸何以稱季薑自逆者言之王者無外王命之斯后之矣自歸者言之未見宗廟不敢以尊自處也京師者大衆之稱經書逆王后者二惟季薑書歸于京師魯主之故必書其歸劉夏逆王后不書歸過魯而魯不為之主也夏四月秋七月附録左傳巴子使韓服告于楚請與鄧為好巴國名姬姓今四川巴縣韓服巴行人楚子使道朔將巴客以聘于鄧道朔楚大夫巴客韓服鄧南鄙鄾人攻而奪之幣鄾今湖廣襄陽縣東北鄾城是也殺道朔及巴行人楚子使薳章讓于鄧鄧人弗受夏楚使鬭廉帥師及巴師圍鄾鬬廉楚大夫鄧養甥聃甥帥師救鄾三逐巴師不克二甥皆鄧大夫鬭廉衡陳其師于巴師之中以戰而北衡橫也分巴師為二部鬬廉橫陳于其間以與鄧師戰而偽北北走也鄧人逐之背巴師而夾攻之楚師偽走鄧師逐之背巴師巴師攻之楚師自前還與戰鄧師大敗鄾人宵潰秋虢仲芮伯梁伯荀侯賈伯伐曲沃梁國嬴姓漢志左馮翊夏陽故少梁今少梁城在陜西韓城縣南茍國姬姓水經注古水西南徑荀城在絳州西十五里今絳州屬山西賈國姬姓今山西臨汾縣有賈鄉冬曹伯使其世子射姑來朝左傳冬曹大子來朝賓之以上卿禮也諸侯之適子未誓于天子而攝其君則以皮帛繼子男故賓之以上卿各當其國之上卿享曹大子初獻樂奏而歎施父曰施父魯大夫曹大子其有憂乎非歎所也公羊傳諸侯來曰朝此世子也其言朝何春秋有譏父老子代從政者則未知其在齊與在曹與在齊世子光也言射姑來朝與齊光序諸侯之上皆當譏而下文曹伯卒葬全録或于曹無譏未可知也此傳者依違之詞穀梁傳朝不言使言使非正也使世子伉諸侯之禮而來朝曹伯失正矣諸侯相見曰朝以待人父之道待人之子以內為失正矣內失正曹伯失正世子可以已矣則是放命也放命猶言方命謂逆命也尸子曰夫已多乎道已止也止曹伯使朝之命則曹伯不陷非禮之愆世子無茍從之咎魯無失政之譏三者正則合道多矣周官典命凡諸侯之嫡子誓於天子而攝其君則下其君之禮一等未誓則以皮帛繼子男謂諸侯老疾當朝覲之期身不能親得使子攝急述職也諸侯間於王事則相朝夲無定期曹伯既有疾何急於朝魯而使世子攝哉故曹伯使朝世子當辭而魯亦不當受蓋參譏之十年春王正月穀梁傳桓無王其曰王何也正終生之卒也桓無王此復書王何也或曰十者盈數也天道十年則必反故易稱守貞者十年而反常傳論惡遠者十年而必棄桓弒君篡國其數已盈故以天道王法正之也或曰魯采服之國也宜四歲而一見并類見之期計之三不朝矣正天王當以六師移之之節也其義皆可通庚申曹伯終生卒左傳十年春曹桓公卒終施父之言夏五月葬曹桓公附録左傳虢仲譖其大夫詹父于王詹父有辭以王師伐虢夏虢公出奔虞虢仲王卿士詹父屬大夫虞國名姬姓古虞城在今山西平陸縣東北秋公會衛侯于桃丘弗遇桃丘杜注衛地濟北東阿縣東南有桃城今山東東阿縣西有桃城鋪旁有丘即桃丘也公羊傳會者何期辭也其言弗遇何公不見要也穀梁傳弗遇者志不相得也弗內辭也託言衛侯不遇則若衛侯不蒙魯公之接者以殺其恥衛侯與公為會期中背而與齊鄭故公往會而不相遇蓋齊鄭急於謀紀而紀魯姻也伐鄭之役衛實從王故魯欲以為援而往會之而胥命于蒲齊衛既合故衛始以鄭之怨而約與魯會終以齊之故背魯而與鄭為郎之師也附録左傳秋秦人納芮伯萬于芮四年圍魏所執者初虞叔有玉虞叔虞公之弟虞公求旃旃之也弗獻既而悔之曰周諺有之匹夫無罪懷璧其罪吾焉用此其以賈害也賈買也乃獻之又求其寶劍叔曰是無厭也無厭將及我將殺我遂伐虞公故虞公出奔共池共池杜注地名闕今山西平陸縣西有共池志云虞公出奔地冬十有二月丙午齊侯衛侯鄭伯來戰于郎左傳冬齊衛鄭來戰于郎我有辭也初北戎病齊諸侯救之鄭公子忽有功焉齊人餼諸侯使魯次之魯以周班後鄭鄭人怒請師于齊齊人以衛師助之故不稱侵伐不稱侵伐而以戰為文明魯直諸侯曲故言我有辭以禮自釋交綏而退無敗績先書齊衛王爵也鄭主兵而序齊衛下者以王爵次之也公羊傳郎者何吾近邑也吾近邑則其言來戰于郎何近也惡乎近近乎圍也兵近都城幾與圍無異此偏戰也偏一面也吉日定地各居一面鳴鼓而戰不相詐何以不言師敗績內不言戰言戰乃敗矣榖梁傳來戰者前定之戰也內不言戰言戰則敗也不言其人以吾敗也不言及者為內諱也內不言戰言戰則敗也春秋所書加兵於魯者衆矣未有稱來戰者此著罪之在三國也魯桓弒逆人人得而誅之鄭伯則首盟于越以定其位齊侯則繼會于稷以濟其姦且重之以婚姻今乃以私忿小怨親帥其師而來戰尚為知類也哉鄭人主兵而首齊以非得齊不能舉是師也春秋時列國之邦交惟利所在向背無常齊僖嫁女於魯乃聼鄭而與魯戰蓋齊與鄭謀紀而魯欲庇之故盡力於鄭以固其交而姻親有不暇顧也十有一年春正月齊人衛人鄭人盟于惡曹惡曹杜注地闕左傳十一年春齊衛鄭宋盟于惡曹宋不書經闕惡曹之盟即前此三國之君來戰于郎者也其稱人何自有參盟其惡莫甚於惡曹前此鄭敗王師後此齊滅后之母家衛抗王人子突而自立皆與魯桓同惡故變文以發後人之疑而著其罪也按翟泉之盟七國皆書人蜀之盟十有一國皆書人澶淵之會十有二國皆書人未必皆微者茍皆微者不宜著於經以此證之則此盟乃三國之君審矣附録左傳楚屈瑕將盟二軫二軫皆國名二在今湖廣應山縣境軫在今湖廣應城縣西鄖人軍于蒲騷鄖國名杜注江夏雲杜縣東南有鄖城在今湖廣安陸縣蒲騷鄖邑在今應城縣北將與隨絞州蓼伐楚師絞州蓼皆國名絞在今湖廣鄖陽府西北州今湖廣監利縣東有州陵城蓼在今河南唐縣南莫敖患之莫敖楚官名即屈瑕鬭廉曰鄖人軍其郊必不誡且日虞四邑之至也虞度也四邑隨絞州蓼也邑亦國也君次于郊郢以禦四邑君謂屈瑕郊郢杜注楚地今湖廣安陸府治郢州故城是其地也我以鋭師宵加于鄖鄖有虞心而恃其城莫有鬭志若敗鄖師四邑必離莫敖曰盍請濟師于王濟益也對曰師克在和不在衆商周之不敵君之所聞也成軍以出又何濟焉莫敖曰卜之對曰卜以決疑不疑何卜遂敗鄖師于蒲騷卒盟而還卒盟二軫夏五月癸未鄭伯寤生卒左傳鄭昭公之敗北戎也齊人將妻之昭公辭祭仲曰必取之君多內寵子無大援將不立三公子皆君也謂子突子亹子儀其母皆有寵弗從夏鄭莊公卒初祭封人仲足有寵于莊公祭杜注鄭地陳留長垣縣東北有祭城今屬直𨽻大名府封人守封疆者因以所守為氏莊公使為卿為公娶鄧曼曼鄧姓生昭公故祭仲立之春秋之初罪莫甚於鄭莊宋魯齊衛次之而其後禍亂相仍亦未有甚於五國者考其終始可為亂常不義者戒矣秋七月葬鄭莊公卒踰兩月而葬慮有爭也蓋嗣子為喪主諸侯會葬其位定則不敢爭故凡速葬者必有故也九月宋人執鄭祭仲此書執之始左傳宋雍氏女于鄭莊公曰雍姞生厲公雍氏姞姓宋大夫以女妻人曰女雍氏宗有寵于宋莊公故誘祭仲而執之曰不立突將死亦執厲公而求賂焉祭仲與宋人盟以厲公歸而立之公羊傳祭仲者何鄭相也何以不名賢也何賢乎祭仲以為知權也其為知權奈何古者鄭國處于留先鄭伯有善于鄶公者通乎夫人以取其國而遷鄭焉遷鄭都于鄶而野留野鄙也莊公死已葬祭仲將往省于留塗出于宋宋人執之謂之曰為我出忽而立突祭仲不從其言則君必死國必亡從其言則君可以生易死國可以存易亡少遼緩之則突可故出而忽可故反是不可得則病出突反忽之計不可得行則已實恥之病恥也然後有鄭國計雖不行然仍須力討之令忽有國即費功力猶愈于國之亡也古人之有權者祭仲之權是也權者何權者反于經然後有善者也權之所設舍死亡無所設設施也舍置也如置死亡之事不得施行權有道自貶損以行權不害人以行權殺人以自生亡人以自存君子不為也穀梁傳宋人者宋公也其曰人何也貶之也祭仲何以不名命大夫也諸侯之大夫三命受位列為王臣則同於王朝之大夫而書字祭仲之惡不待貶而見著其爵列所以甚其罪也或疑名其君於下不宜字其臣於上不知君前臣名乃生人應對之禮非所施於國史之紀事各從其宜者也公羊傳以祭仲為知權害義傷教自范寧發之皆知其悖矣突歸于鄭公羊傳突何以名挈乎祭仲也挈猶提挈也其言歸何順祭仲也穀梁傳曰突賤之也曰歸易辭也突篡兄之位制命權臣故言歸為易辭非善之也祭仲易其事權在祭仲也易言廢立在己死君難臣道也今立惡而黜正惡祭仲也小白陽生繫之齊明其當有齊也突不繫鄭明其不當立也不稱公子春秋之初凡爭國者皆不稱公子也書歸有二義一順詞也一易詞也後書鄭世子忽則突之不順其迹顯著蓋易詞也內則權臣許之立外則大國為之援而世子忽之才不能自固故其歸為易耳鄭忽出奔衛此書奔之始左傳秋九月丁亥昭公奔衛己亥厲公立公羊傳忽何以名春秋伯子男一也辭無所貶既葬稱子合伯子男為一辭無所貶皆從子忽不稱子者貶而名之也穀梁傳鄭忽者世子忽也其名失國也忽繫鄭明其正也不稱子責不能守其位未終喪而出奔失子之道矣其義與國君失位以自奔為文而不書其逐之者同所以警居位者當自強於為善也柔會宋公陳侯蔡叔盟于折此大夫會盟諸侯之始折杜注地闕公羊傳柔者何吾大夫之未命者也公會宋公于夫鍾鍾公羊作童夫鍾杜注郕地今山東寧陽縣盛鄉城北有夫鍾里冬十有二月公會宋公于闞闞杜注魯地今山東汶上縣西有闞亭在南旺湖中臣與宋公盟于折君與宋公會于夫鍾于闞明年又會于虛于龜蓋公與突皆篡立聲𫝑相倚而又有憾於忽宋自納突之後以責賂生隙故公不憚屈己力為突請以固宋交而定其位也然屢盟而卒畔數會而卒離觀此益見盟會之不足恃矣十有二年春正月夏六月壬寅公會杞侯莒子盟于曲池把公羊穀梁作紀曲池公羊作毆蛇杜注魯地魯國汶陽縣北有曲水亭在今曲阜縣東北源出石門山左傳十二年夏盟于曲池平杞莒也隱公四年莒人伐杞自是遂不平杞當作紀是時紀為齊難危急甚矣魯桓切切為紀謀故屢會焉而大國無與同心者曲池之盟僅能與弱小之莒偕其不能為助而無救於紀之亡也蓋可知矣秋七月丁亥公會宋公燕人盟于穀丘燕人杜注南燕大夫穀丘杜注宋地在今山東曹州北左傳公欲平宋鄭秋公及宋公盟于句瀆之丘句瀆之丘杜注即穀丘也今其地名句陽店宋以立厲公故多責賂于鄭鄭人不堪故不平入春秋來燕未嘗見經杜預謂燕人南燕大夫以昭公三年書北燕伯款出奔齊知此為南燕也莊公之三十年齊伐山戎始為燕通道於周則此年及十三年所書為姞姓之燕可知矣左傳稱穀丘之盟亦為平鄭宋觀十三年四國來戰燕亦與焉則燕乃宋之與國而此盟之為鄭請可徴也八月壬辰陳侯躍卒壬辰七月二十三日書于八月從赴公會宋公于虛虛公羊作郯杜注宋地疑在今河南睢州境冬十有一月公會宋公于龜龜杜注宋地疑在今河南睢州境左傳宋成未可知也故又會于虛冬又會于龜諸侯非王事不出境桓公委宗社人民五出與宋會厲民荒政甚矣魯宋五會之地闞魯地夫鍾亦近魯故宋公來會欲因魯以責賂虛龜與穀丘皆宋地故桓公往會欲為突請免賂觀所會之地而情事可推矣丙戌公會鄭伯盟于武父武父杜注鄭地陳留濟陽縣東北有武父城在今直隸東明縣西南左傳宋公辭平故與鄭伯盟于武父鄭終不肯致賂宋遂辭平是以與鄭盟而謀宋也突稱鄭伯不沒其實也雖篡弒之賊國人君之諸侯君之其會盟侵伐茍不以爵書則非其實而亦無以屬辭蓋列國之君書爵而一人獨書名則與大夫之會盟會伐者無以異矣王迹既熄霸統未興諸侯自擅無所稟命觀隱十年見兵革之亂也桓十一年十二年見會盟之亂也霸統興而諸侯有所忌無復此亂矣故君子不得已而與桓文丙戌衛侯晉卒穀梁傳再稱日決日義也決日者謂二事決宜書日故經兩舉日文也通一經惟此重書日蓋册書之體一日二事夲宜各書其日而史所未詳不可復考偶有存者則仍其舊文耳或曰不應再書丙戌非後申則前子非也會盟宜日者也其不日者史失之耳武父之盟既書日使晉卒不再書日則不知其卒於何日矣十有二月及鄭師伐宋丁未戰于宋左傳遂帥師而伐宋戰焉宋無信也君子曰茍信不繼盟無益也詩云君子屢盟亂是用長無信也詩小雅言無信故數盟數盟則情疏情疏而憾結故亂長公羊傳戰不言伐此其言伐何辟嫌也惡乎嫌嫌與鄭人戰也不言伐則嫌內微者與鄭人戰于宋地故舉伐以明之此偏戰也何以不言師敗績內不言戰言戰乃敗矣上十年郎戰之下巳有此傳上來戰于魯此往戰于宋嫌其異故復明之穀梁傳非與所與伐戰也非責也責魯又與其所與伐者戰也不言與鄭戰恥不和也于伐與戰敗也內諱敗舉其可道者也戰輕于敗戰可道而敗不可道公及鄭伯十有一月盟于武父則十有二月伐宋者為公與鄭伯明矣內不書公而鄭亦稱師何也變文以著其罪也來戰者罪在彼往戰者罪在我宋人責賂不已固不為無過然魯桓取其賂以成亂鄭突資其力以篡國及鄭以責賂背宋而魯遂黨鄭渝數會之信連兵深入戰於國都邦交之翻覆謀計之傾危若此此聖人所以深惡魯鄭也附録左傳楚伐絞軍其南門莫敖屈瑕曰絞小而輕輕則寡謀請無扞采樵者以誘之扞衛也從之絞人獲三十人獲楚人也明日絞人爭出驅楚役徒于山中楚人坐其北門而覆諸山下坐猶守也覆設伏兵而待之大敗之為城下之盟而還伐絞之役楚師分涉于彭彭水名杜注在新城昌魏縣今故昌魏縣在湖廣房縣西南羅人欲伐之使伯嘉諜之三巡數之羅杜注熊姓國在宜城縣西山中後徙南郡枝江縣今湖廣宜城縣西羅川城乃羅故國其在平江縣南之羅城與湘陰縣接界者是後徙處也伯嘉羅大夫諜伺也巡遍也十有三年春附録左傳十三年春楚屈瑕伐羅鬭伯比送之還謂其御曰莫敖必敗舉趾髙心不固矣遂見楚子曰必濟師難言屈瑕將敗故以益師諷諫楚子辭焉入告夫人鄧曼鄧曼曰大夫其非衆之謂鄧曼楚武王夫人言伯比意不在于益衆其謂君撫小民以信訓諸司以德而威莫敖以刑也莫敖狃于蒲騷之役將自用也狃快也必小羅君若不鎮撫其不設備乎夫固謂君訓衆而好鎮撫之召諸司而勸之以令德見莫敖而告諸天之不假易也言天不借貸慢易之人不然夫豈不知楚師之盡行也楚子使賴人追之不及賴國名子爵後漢志褒信侯國有賴亭故賴國褒信故縣在今息縣東北其賴亭在商城縣南皆屬河南光州杜注在義陽隨縣則去光州甚遠不知何據賴人仕于楚者莫敖使徇于師曰諫者有刑徇宣令也及鄢亂次以濟鄢杜注鄢水在襄陽宜城縣入漢今湖廣宜城縣南有宜城故城遂無次且不設備及羅羅與盧戎兩軍之盧戎杜注南蠻即今中廬故城在湖廣南漳縣東大敗之莫敖縊于荒谷荒谷杜注楚地荆州記州東三里有三湖湖東有水名荒谷在今湖廣荆州府羣帥囚于冶父冶父杜注楚地水經注荒谷東岸有冶父城在今荆州府東以聽刑楚子曰孤之罪也皆免之二月公會紀侯鄭伯己巳及齊侯宋公衛侯燕人戰齊師宋師衛師燕師敗績左傳宋多責賂于鄭鄭不堪命故以紀魯及齊與宋衛燕戰不書所戰後也公後地期不及其戰故不書所戰之地鄭人來請修好公羊傳曷為後日恃外也其恃外奈何得紀侯鄭伯然後能為日也得紀侯鄭伯之助然後乃能結戰日以勝內不言戰此其言戰何從外也從外諸侯相與戰例曷為從外恃外故從外也何以不地近也惡乎近近乎圍郎亦近矣郎何以地郎猶可以地也郎雖在郊內尚非攻城猶可以舉其地穀梁傳其言及者由內及之也其曰戰者由外言之也戰稱人敗稱師重衆也其不地于紀也春秋戰無不地鄭氏曰紀當為己謂在魯也字之誤耳此戰先儒多主穀梁謂戰于紀其實當以公羊為正蓋宋怨魯鄭伐其國都故連三國之師造於城下無四鄙城邑可書故不地也使戰于紀則當書齊侯宋公衛侯燕人伐紀公會鄭伯救紀及齊侯宋公衛侯燕人戰事乃明著何為故隱其辭使人莫辨哉首齊侯國強而近魯故宋推以主兵也先言會而後言日既會而後戰會與戰異日也衛侯書爵先君未葬而以吉禮從金革之事也凡諸侯在喪有境外之事以喪行者稱子以吉行者稱爵志其惡有淺深也三月葬衛宣公列國諸侯之葬必我往會而始書魯方與衛戰而不廢喪紀蓋魯秉周禮與衛舊睦故也夏大水自禹濬畎澮距川周公因之益詳井田溝洫之制故年之豐凶一視農力而水旱不能為災周衰暴君汚吏慢其經界司空之法不修於是水無所泄旱無以溉尋常水旱猶或有蓄積可支苟遇大水則不獨禾稼不登而廬舍人民且不可問矣春秋備書於策所以悼禹功之遠憫周制之廢生民受患而無以拯濟也秋七月冬十月日講春秋解義卷七
