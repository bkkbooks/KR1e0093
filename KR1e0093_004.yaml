body:
  text: 欽定四庫全書日講春秋解義卷四隱公八年春宋公衛侯遇于垂垂杜注衛地濟隂句陽縣東北有垂亭今山東曺州北句陽店是其地也左傳八年春齊侯將平宋衛平宋衛于鄭有會期宋公以幣請于衛請先相見衛侯許之故遇于犬丘犬丘垂也地有兩名穀梁傳不期而會曰遇遇者志相得也按左氏齊侯將平宋衛于鄭而以經考之後此瓦屋宋齊衛參盟而鄭不與十年入鄭伐戴又宋衛為黨以仇鄭則此遇所謀蓋欲從齊而無意于釋鄭憾也三國既有會期而宋以幣請先見則非不期而遇可知矣三月鄭伯使宛來歸祊庚寅我入祊祊公羊穀梁作邴杜注鄭祀泰山之邑今山東費縣治故祊城是也左傳鄭伯請釋泰山之祀而祀周公以泰山之祊易許田三月鄭伯使宛來歸祊不祀泰山也許田成王賜周公朝宿之邑後世因立周公别廟焉地近鄭祊鄭助祭泰山湯沐之邑地近魯鄭以天子不能復巡狩故欲以祊易許田各從本國所近恐魯以周公别廟為疑故云已廢泰山之祀欲為魯祀周公遜辭以求之也公羊傳宛者何鄭之微者也邴者何鄭湯沐之邑也天子有事于泰山諸侯皆從泰山之下諸侯皆有湯沐之邑焉有事者巡狩祭天告至之禮也當沐浴潔齊以致其敬故謂之湯沐邑所以尊待諸侯而共其費也其言入何難也入非已至之文難詞也其日何難也言不可即入至此日乃入也其言我何言我者非獨我也自入邑不得言我有他人在其中乃得言我齊亦欲之以齊與魯鄭比聘會知之穀梁傳名宛所以貶鄭伯惡與地也去其族惡擅易天子邑入者內弗受也日入惡入者也邴者鄭伯所受命于天子而祭泰山之邑入之例見前嫌易田與兵入異故重發之六年鄭人來輸平蓋請以祊歸也今使宛來歸祊蓋將以易許也許者朝宿之地在王畿之內成王所以特賜周公也祊者湯沐之邑在泰山之旁宣王所以特賜鄭伯也祊近于魯許鄰于鄭故各以所便相易用此見鄭有無君之心而謂天王不復能巡狩矣用此見鄭有無親之心而敢以先祖所受之邑與人矣入者不順之詞非我所有而強入之也附録左傳夏虢公忌父始作卿士于周周人遂畀之政四月甲辰鄭公子忽如陳逆婦媯辛亥以媯氏歸甲寅入于鄭陳針子送女先配而後祖針子曰是不為夫婦誣其祖矣非禮也何以能育針子陳大夫禮逆婦必先告祖廟而後行鄭忽先逆婦而後告廟故曰先配而後祖夏六月己亥蔡侯考父卒穀梁傳諸侯日卒正也辛亥宿男卒穀梁傳宿微國也未能同盟故男卒也周人以諡易名在禮赴告之詞曰寡君不祿則赴不以名明矣而卒以名書以會盟聘問素與魯通故志其人以别其世次也已通而不名者舊史失之也宿與魯元年同盟而卒不書名則他可知矣蔡宣公未與魯通而卒書名蓋别有所徵凡此類皆舊史之文孔子不得而加損者也秋七月庚午宋公齊侯衛侯盟于瓦屋此書外參盟之始瓦屋杜注周地今河南洧川縣南瓦屋里是也左傳齊人卒平宋衛于鄭秋會于溫盟于瓦屋以釋東門之役禮也會溫不書不以告也鄭不與盟故不書穀梁傳外盟不日此其日何也諸侯之參盟于是始故謹而日之也三人為盟曰參盟誥誓不及五帝盟詛不及三王交質子不及二伯瓦屋之盟左氏以為齊平宋衛于鄭而程子以為與鄭絶者蓋宋衛雖屈於齊而終不與鄭平也入春秋來書盟者七皆二國相為盟自參盟作而諸侯各樹其黨邦交離合無常會盟侵伐益多事矣瓦屋周地三國會於此既不入覲於王而刑牲歃血私相要結其蔑視王室之罪可勝誅哉是盟也關於世道升降之機為甚故謹之八月葬蔡宣公公羊傳卒何以名而葬不名卒從正而葬從主人卒名謹終辨實之正義葬稱公從臣子之辭卒何以日而葬不日卒赴而葬不告榖梁傳月葬故也蔡侯考父卒以夏六月而以八月葬蓋踰月而葬矣諸侯五月而葬不及期簡也葬舉諡故不名不日史失之附録左傳八月丙戌鄭伯以齊人朝王禮也鄭伯不以虢公得政而背王故禮之上有七月庚午下有九月辛卯則八月不得有丙戌九月辛卯公及莒人盟于浮來浮公羊榖梁作包此書好莒之始亦書魯君特會外大夫之始浮來杜注紀邑在今山東莒州西左傳公及莒人盟于浮來以成紀好也二年紀莒盟于密為魯故今公尋之故曰以成紀好公羊傳公曷為與微者盟稱人微者稱人則從不疑也從隨也稱微者則非公從人盟而人從公盟不疑矣榖梁傳可言公及人不可言公及大夫言大夫則敵公矣公曷為及莒之微者盟左氏曰成紀好也及者內為志凡公與強國之大夫盟則不書公及諱強國之以無道加於公也及齊髙徯晉處父盟是也與小國之大夫盟則不諱公以公自欲與盟非為彼所強也然以望國之君而降班以盟小國之大夫失禮亦甚矣螟民以食為天有災必書重民命也附録左傳冬齊侯使來告成三國公使衆仲對曰君釋三國之圖以鳩其民鳩集也君之惠也寡君聞命矣敢不承受君之明德冬十有二月無駭卒駭榖梁作賅左傳無駭卒羽父請諡與族公問族于衆仲衆仲對曰天子建德立有德為諸侯因生以賜姓若舜由媯汭故陳為媯姓胙之土而命之氏諸侯以字諸侯位卑不得賜姓故其臣因氏其王父字為諡因以為族或使即先人之諡稱以為族官有世功則有官族邑亦如之謂取其舊官舊邑之稱以為族公命以字為展氏諸侯之子稱公子公子之子稱公孫公孫之子以王父字為氏無駭公子展之孫故為展氏公羊傳此展無駭也何以不氏疾始滅也故終其身不氏入極為始滅故終身貶之榖梁傳無賅之名未有聞焉或曰隱不爵大夫也或説曰故貶之也無駭公子展之孫也何以名公孫之子未賜族而為大夫者則書名與異姓之臣等也蓋古者置卿惟賢德是選有世祿而無世官春秋之初猶為近古故無駭與挾皆書其名而不氏耳其後大夫世官無不賜之族如魯三桓鄭七穆以字族也宋戴氏衛齊氏以諡族也晉士氏中行氏以官族也韓氏魏氏以邑族也子孫相繼亦世其官而不改而先王之禮亡矣故其弊至於三家専魯華向亂宋六卿分晉諸侯失國而出奔者相繼則惟其不遵先王世祿而不世官之禮是以至此極也觀春秋所書而是非之迹治亂之效昭然可覩矣九年春天王使南季來聘榖梁傳南氏姓也季字也聘問也聘諸侯非正也古者天子於諸侯有時聘間問之典所以洽恩惠而通情志也載在周禮掌之行人而榖梁氏乃以聘諸侯為非正何也按王制諸侯之於天子比年一小聘三年一大聘五年則躬往述職而朝焉天子念其勤故有時聘遣問以慰答之今魯隱嗣世九年史䇿不書遣使如周亦不書公如京師則是朝聘之典俱缺也以王法論之貶爵削地在所不免而遣使聘焉其斯以為不正乎通經所書公如京師者一朝于王所者二卿大夫如京師者五魯於王室最親怠慢不臣如此則他國可知矣天王來聘于魯者七錫命者三歸脤者一賵葬者四恩數稠疊若此則齊晉秦楚諸大國聘問之勤不後於魯又可知矣夫君臣上下之分恃有紀綱禮法以維之王朝無紀綱而後征伐自諸侯出諸侯蔑禮法而後政事自大夫出豈一朝一夕之故乎記曰聘覲之禮廢則君臣之位失而倍畔侵陵之敗起矣可不戒哉三月癸酉大雨震電庚辰大雨雪左傳九年春王三月癸酉大雨霖以震書始也書癸酉始雨日庚辰大雨雪亦如之書時失也凡雨自三日以往為霖平地尺為大雪經有電無霖傳有霖無電傳不解經蓋所據簡䇿錯誤公羊傳何以書記異也何異爾不時也何以書記異也何異爾俶甚也俶始怒也甚猶大甚也榖梁傳震雷也電霆也電雷之光有霆必有電故曰電霆志疏數也八日之間再有大變隂陽錯行故謹而日之也雨月志正也雨得其時則書月陽精發而為雷電隂氣凝而為雨雪隂陽運動宜有常而無忒周之三月實夏之正月雷未可以出電未可以見而大震電此陽失其節也雷既出電既見則雪不當復降而大雨雪則陽不能制隂而隂氣縱矣凡變見於天曰異害及於民曰災春秋遇災異必書雖不若漢儒五行之説每事強為徴應而天人相感之際實未可忽也挾卒挾公羊榖梁俱作俠公羊傳俠者何吾大夫之未命者也榖梁傳俠者所俠也俠名也所其氏或云所斥也未詳孰是弗大夫者隱不爵大夫也隱之不爵大夫何也曰不成為君也夏城郎左傳夏城郎書不時也隱公元年費伯已帥師城郎至此年復城之蓋因其舊而加修築也案桓十年三國來戰於此莊八年俟陳蔡師次於此十年齊宋之師又次於此是郎為魯之要地非不宜城而城以夏則非其時也城以衛民而因此以奪農時則昧於為政之本矣秋七月榖梁傳無事焉何以書不遺時也冬公會齊侯于防防公羊作邴杜注魯地在琅琊華縣東南今山東費縣東北有華城即華縣左傳宋公不王鄭伯為王左卿士以王命討之伐宋宋以入郛之役怨公不告命入郛在五年公怒絶宋使秋鄭人以王命來告伐宋伐宋未得志故欲再伐之冬公會齊侯于防謀伐宋也穀梁傳會者外為主焉爾周禮大行人職時會以發四方之禁王事也至春秋諸侯或講好或謀事自相見於隙地或諸侯與鄰國之大夫相見或列國之大夫自相見並以會名故凡書會皆譏也據左氏宋公不王鄭伯以王命討之使來告命會于防謀伐宋也于中丘為師期也果爾則奉王命討不庭經於會防及後伐宋宜有異文以發明其善而與私會私伐者同辭以是知其非王事也蓋矯假以逞私忿耳附録左傳北戎侵鄭鄭伯禦之患戎師曰彼徒我車懼其侵軼我也軼突也公子突曰突鄭厲公也使男而無剛者嘗寇而速去之嘗試也勇則能往無剛不耻退君為三覆以待之戎輕而不整貪而無親勝不相讓敗不相救先者見獲必務進進而遇覆必速奔後者不救則無繼矣乃可以逞從之戎人之前遇覆者奔祝聃逐之祝􅖫鄭大夫衷戎師謂戎師在三伏之中前後擊之盡殪殪死也戎師大奔十一月甲寅鄭人大敗戎師十年春王二月公會齊侯鄭伯于中丘左傳十年春王正月公會齊侯鄭伯于中丘癸丑盟于鄧為師期傳言正月會癸丑盟推經傳日月癸丑是正月二十六日經二月誤盟不書蓋公還告會而不告盟鄧杜注魯地當在今山東兖州府境春秋之初諸侯擅興不過彼此修怨耳鄭伯為王卿士無王命而會齊魯齊魯亦無王命而私與鄭連兵自是諸侯始橫行而無所忌此禮樂征伐自諸侯出之始事也夏翬帥師會齊人鄭人伐宋左傳夏五月羽父先會齊侯鄭伯伐宋言先會明非公本期公羊傳此公子翬也何以不稱公子貶曷為貶隱之罪人也故終隱之篇貶也終隱之世皆去其族至桓而復書族明與桓同惡也翬之悖逆其來有漸隱公不能辨之於早始焉伐鄭固請而行今兹伐宋先期而往肆行無忌不待鍾巫之變而已知其有無君之心矣故兵柄下移春秋屢致意焉以示當制之於未亂也若夫伐宋之是非則直書其事而自見矣六月壬戌公敗宋師于菅菅杜注宋地左傳六月戊申公會齊侯鄭伯于老桃經不書會不告于廟也老桃杜注宋地今山東濟寧州北有桃鄉城六月無戊申戊申五月二十三日日誤壬戌公敗宋師于菅穀梁傳內不言戰舉其大者也戰然後敗故敗大于戰兩軍皆陳曰戰今不言戰而言敗蓋不待陳而薄人於險以詐謀取勝也故以敗之者為主矯假王命棄好怒鄰而遂鄭報怨之私雖以正用兵猶貶况以詐諼取勝乎辛未取郜辛巳取防郜在今山東城武縣東南防在今山東金鄉縣西左傳庚午鄭師入郜辛未歸于我庚辰鄭師入防辛巳歸于我君子謂鄭莊公于是乎可謂正矣以王命討不庭下之事上皆成禮于庭中不貪其土以勞王爵正之體也勞者敘其勤以答之魯爵尊鄭爵卑故言以勞王爵公羊傳取邑不日此何以日一月而再取也何言乎一月而再取甚之也內大惡諱此其言甚之何春秋録內而略外于外大惡書小惡不書于內大惡諱小惡書明取邑為小惡一月再取小惡中甚者耳故書而不諱穀梁傳取邑不日此其日何也不正其乘敗人而深為利取二邑故謹而日之也經於二邑書魯取地歸於魯也傳書鄭入而歸於魯蓋鄭實主兵故讓魯取之也魯宋同盟未嘗有怨入郛不救其曲在魯乃中變而合鄭以讎宋實由輸平歸祊以利相結故既勝之後復以二邑讓魯直書其事而背義尚詐結黨肆暴之惡具見矣附録左傳蔡人衛人郕人不會王命不伐宋也秋宋人衛人入鄭齊魯地逺宋量力不能報故先結衛以報鄭鄭方息師於郊不暇守禦故入之易諸侯不務講信修睦而結黨報復反覆相攻皆由王政不綱是以肆行而無所忌也宋人蔡人衛人伐戴鄭伯伐取之戴公羊榖梁作載戴國子姓杜注陳留外黃縣東南有戴城今河南考城縣東南考城故城是也左傳秋七月庚寅鄭師入郊猶在郊駐兵逺郊誘三國敝其師因而取之宋人衛人入鄭蔡人從之伐戴八月壬戌鄭伯圍戴癸亥克之取三師焉宋衛既入鄭而以伐戴召蔡人蔡人怒故不和而敗公羊傳其言伐取之何易也其易奈何因其力也因誰之力因宋人蔡人衛人之力也榖梁傳不正其因人之力而易取之故主其事也戴居鄭之北鄙三國入鄭而不能克故移兵以伐其附庸鄭伯乘其敝與戴合攻而取三師其殘民甚矣附録左傳九月戊寅鄭伯入宋報入鄭也九月無戊寅戊寅八月二十四日冬十月壬午齊人鄭人入郕郕公羊作盛左傳冬齊人鄭人入郕討違王命也榖梁傳入者內弗受也日入惡入者也郕國也二國入郕以郕不會伐宋也宋以公子馮在鄭故二國交惡左氏傳云宋公不王鄭伯以王命討之據經所書不見其為王討也王臣不行王師不出矯假以逞私忿耳蓋齊所欲者郕也鄭所欲者許也鄭助齊以入郕故明年秋齊復助鄭以入許徇私結黨馮弱暴寡其惡極矣按傳隱三年周人將畀虢公政與鄭交惡六年鄭伯朝周王不禮焉八年虢公作卿士于周是年鄭伯以齊朝王九年以王命討宋於時鄭伯為王左卿士疑因再朝王復任之而鄭之朝王隂欲假王命以摟諸侯而報私怨也觀其前則有取麥取禾之悖觀其後且為繻葛之戰矣春秋之不王孰有過於鄭莊者左氏蔽於其迹而不究其情當以程子之説正之十有一年春滕侯薛侯來朝此書諸侯朝魯之始薛任姓杜注魯國薛縣今薛城在山東滕縣南左傳十一年春滕侯薛侯來朝爭長薛侯曰我先封薛祖奚仲夏所封在周之前滕侯曰我周之卜正也卜正卜官之長周禮有春官大卜薛庶姓也非周同姓我不可以後之公使羽父請于薛侯曰君與滕君辱在寡人周諺有之曰山有木工則度之賓有禮主則擇之周之宗盟異姓為後寡人若朝于薛不敢與諸任齒君若辱貺寡人則願以滕君為請薛侯許之乃長滕侯公羊傳其言朝何諸侯來曰朝大夫來曰聘其兼言之何微國也榖梁傳天子無事諸侯相朝正也事謂巡狩崩葬兵革之事考禮修德所以尊天子也諸侯來朝時正也朝宜以時故書時則正也犆言同時也犆言謂别言也如穀伯鄧侯來朝同時來不俱至纍數皆至也纍數總言之也如滕薛來朝同時俱至周禮行人職凡諸侯之邦交殷相聘世相朝也其為禮亦節矣周衰典禮大壞邦交惟視勢之強弱以魯事考之或來朝而不報其禮或屢往而至於不納無復有以禮義相接者矣况于天子述所職者蓋闕如也而自相朝聘可乎故經於大國來聘小國來朝一切書而不削惡其慢於王事也且非天子不旅見諸侯滕薛二君不各書來朝而纍數之與榖伯鄧侯之來朝異文是同日而旅見矣隱公偃然而受之罪可勝誅乎夏公會鄭伯于時來公羊榖梁夏字下有五月時來公羊作祁黎杜注時來郲也滎陽縣東有釐城鄭地在今河南開封府東左傳夏公會鄭伯于郲謀伐許也鄭伯將伐許五月甲辰授兵于大宫鄭祖廟公孫閼與潁考叔爭車公孫閼鄭大夫潁考叔挾輈以走輈車轅子都拔棘以逐之子都即公孫閼棘戟也及大逵逵道方九軌弗及子都怒會者外為主此會鄭志也許逺於齊魯而鄰於鄭鄭莊日思兼并然不藉鄰國之勢則動非萬全故前年伐宋克其二邑鄭不取而讓於魯又助齊入郕齊魯之交益固然後連兵以壓許蓋鄭計入許之後齊魯不能越國以鄙逺則己安坐而得之矣齊魯特為其所愚而不覺耳故時來之會以鄭主之也秋七月壬午公及齊侯鄭伯入許許今河南許州故城在州東北左傳秋七月公會齊侯鄭伯伐許庚辰傅于許附于城下潁考叔取鄭伯之旗蝥弧以先登蝥弧旗名子都自下射之顚顚墜而死瑕叔盈又以蝥弧登瑕叔盈鄭大夫周麾而呼曰君登矣鄭師畢登壬午遂入許許莊公奔衛齊侯以許讓公公曰君謂許不共故從君討之許既伏其罪矣雖君有命寡人弗敢與聞乃與鄭人鄭伯使許大夫百里奉許叔以居許東偏許叔許君弟東偏東鄙也曰天禍許國鬼神實不逞于許君而假手于我寡人寡人唯是一二父凡不能共億共給億安也其敢以許自為功乎寡人有弟不能和協而使糊其口于四方弟謂共叔假糊鬻也説文云寄食其况能久有許乎吾子其奉許叔以撫柔此民也吾將使獲也佐吾子獲鄭大夫若寡人得沒于地天其以禮悔禍于許無寧兹許公復奉其社稷無寧寧也唯我鄭國之有請謁焉如舊昏媾其能降以相從也無滋他族實逼處此以與我鄭國爭此土也吾子孫其覆亡之不暇而况能禋祀許乎寡人之使吾子處此不唯許國之為亦聊以固吾圉也圉邊垂也乃使公孫獲處許西偏曰凡而器用財賄無置于許我死乃亟去之吾先君新邑于此先君謂武公周宣王封弟友為鄭伯食米于畿內友之子武公從平王東遷取虢鄶二國之地居之乃為新鄭王室而既卑矣周之子孫日失其序夫許大嶽之胤也大嶽神農之後堯四嶽也天而既厭周德矣吾其能與許爭乎君子謂鄭莊公于是乎有禮禮經國家定社稷序民人利後嗣者也許無刑而伐之刑法也服而舍之度德而處之量力而行之相時而動無纍後人死乃亟去之言欲不纍後人也可謂知禮矣鄭伯使卒出豭行出犬雞以詛射潁考叔者豭豬别名百人為卒二十五人為行君子謂鄭莊公失政刑矣政以治民刑以正邪既無德政又無威刑是以及邪邪而詛之將何益矣及者內為主時來書公會鄭伯明伐許本鄭志也此書公及齊侯鄭伯則入許者公所欲也蓋自輸平而後宛來歸祊又助魯取二邑於宋故公欲助鄭并許以為報也隱公即位十有一年受天王之使而未嘗朝聘王室告喪既不奔赴且無賵賻擅興甲兵植黨肆暴奪人城邑今又助鄭為虐入人之國而逐其君其不善之積蓋有不可逭者矣附録左傳王取塢劉蒍邘之田于鄭塢杜注緱氏縣西南有塢聚在今河南偃師縣西南劉杜注緱氏縣西北有劉亭今亦屬偃師縣蒍在今河南懷慶偃師孟縣之間邘今河南河內縣西北邘臺鎮是也而與鄭人蘇忿生之田蘇忿生周武王司冦蘇公也溫注見前原杜注在沁水縣西今河南濟源縣西北有原鄉絺杜注在野王今河內縣西南有絺城樊杜注一名陽樊野王縣西南有陽城在今濟源縣東南隰郕杜注在懷縣西南今河南武陟縣西南隰城是也欑茅杜注在修武縣北今河南修武縣北大陸村即其地向杜注軹縣西有地名向上今濟源縣西南有向城盟杜注盟津在今孟縣南州杜注州縣今故城在河內縣治東陘杜注闕元和志太行陘在河內縣西北三十里在今懷慶府西北一名丹陘隤杜注在修武縣北京相璠曰河內修武縣北有故隤城懷杜注懷縣今武陟縣西有懷縣故城十二邑皆蘇忿生之田君子是以知桓王之失鄭也恕而行之德之則也禮之經也已弗能有而以與人人之不至不亦宜乎蘇氏叛王十二邑王所不能有為桓五年從王伐鄭張本鄭息有違言息國名姬姓侯爵今河南息縣違言以言語相違恨息侯伐鄭鄭伯與戰于竟息師大敗而還君子是以知息之將亡也不度德不量力不親親鄭息同姓之國不徵辭不察有罪犯五不韙而以伐人韙是也其喪師也不亦宜乎冬十月鄭伯以虢師伐宋壬戌大敗宋師以報其入鄭也入鄭在十年宋不告命故不書凡諸侯有命告則書不然則否傳因宋不告敗而發此例師出臧否亦如之雖及滅國滅不告敗勝不告克不書于䇿冬十有一月壬辰公薨左傳羽父請殺桓公將以求大宰大宰官名公曰為其少故也吾將授之矣使營菟裘吾將老焉菟裘杜注魯邑在泰山梁父縣南今山東泰安州南泗水縣北有梁父城菟裘聚羽父懼反譖公于桓公而請弒之公之為公子也與鄭人戰于狐壤止焉內諱獲故言止狐壤鄭地後漢志潁川郡潁隂縣有狐宗鄉疑即此在今河南許州西鄭人囚諸尹氏尹氏鄭大夫賂尹氏而禱于其主鍾巫主尹氏所主祭遂與尹氏歸而立其主立鍾巫于魯十一月公祭鍾巫齊于社圃園名館于寪氏寪氏魯大夫壬辰羽父使賊弒公于寪氏立桓公而討寪氏有死者欲以弒公之罪加寪氏而不能正法僅有死者而已不書葬不成喪也公羊傳何以不書葬隱之也何隱爾弒也弒則何以不書葬春秋君弒賊不討不書葬以為無臣子也子沈子曰稱子冠氏上者著其為師也君弒臣不討賊非臣也不復讎非子也葬生者之事也春秋君弒賊不討不書葬以為不繫乎臣子也公薨何以不地不忍言也隱何以無正月隱將讓乎桓故不有其正月也榖梁傳公薨不地故也隱之隱猶痛也不忍地也其不言葬何也君弒賊不討不書葬以罪下也隱十年無正隱不自正也元年有正所以正隱也明隱宜立死者人道之終也故春秋于魯君之薨路寢而外于小寢于别宫臺下皆明著其地至薨而不地則有不忍言者矣不書葬賊不討也使書公薨于寪氏桓翬之罪非徒不討後世且無由而識之矣不書地以著君父不得其死之實不書葬以警臣子復讎討賊之心非聖人莫能修此類是也日講春秋解義卷四
