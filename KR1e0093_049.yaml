body:
  text: 欽定四庫全書日講春秋解義卷四十九昭公六年春王正月把伯益姑卒左傳六年春王正月把文公卒弔如同盟禮也晉平公把出也故命魯歸其侵地有未盡者復以讓魯今把以喪赴而魯㑹其葬畏晉故也把復稱伯豈平公厚其母家為請於王而復之與葬秦景公秦始書葬左傳大夫如秦葬景公禮也合士弔大夫送葬之禮附録左傳三月鄭人鑄刑書鑄刑書于鼎以為國之常法叔向使詒子産書曰始吾有虞于子虞度也言凖度子産以為己法今則已矣昔先王議事以制不為刑辟懼民之有爭心也臨事制刑不豫設法也法豫設則民知爭端猶不可禁禦是故間之以義糾之以政行之以禮守之以信奉之以仁制為祿位以勸其其從勸從教嚴斷刑罰以威其淫懼其未也故誨之以忠聳之以行聳懼也教之以務時所急使之以和說以使民臨之以敬涖之以强斷之以剛義斷恩猶求聖哲之上明察之官上公王也官卿大夫也忠信之長慈惠之師民于是乎可任使也而不生禍亂民知有辟則不忌于上權移于法故民不畏上並有爭心以徵于書而徼幸以成之因危文以生爭緣徼幸以成其巧僞弗可為矣夏有亂政而作禹刑商有亂政而作湯刑周有亂政而作九刑言不能議事以制三辟之興皆叔世也今吾子相鄭國作封洫在襄三十年立謗政作丘賦在四年制參辟鑄刑書制參辟謂用三代之末法將以靖民不亦難乎詩曰儀式刑文王之德日靖四方詩周頌言文王以德為儀式故能日有安靖四方之功刑法也又曰儀刑文王萬邦作孚詩大雅言文王作儀法為天下所孚信也如是何辟之有言惟以德與信不以刑也民知爭端矣將棄禮而徵于書錐刀之末將盡爭之錐刀末喻小事亂獄滋豐賄賂並行終子之世鄭其敗乎肸聞之國將亡必多制數改法其此之謂乎復書曰若吾子之言僑不才不能及子孫吾以救世也既不承命敢忘大惠以見針戒為惠士文伯曰火見鄭其火乎火心星也周五月昏見火未出而作火以鑄刑器藏爭辟焉火如象之不火何為象類也同氣相求火未出而用火相感而致災夏季孫宿如晉左傳夏季孫宿如晉拜莒田也謝前年受牟夷邑不見討晉侯享之有加籩籩豆之數多于常禮武子退使行人告曰小國之事大國也苟免于討不敢求貺得貺不過三獻周禮大夫三獻今豆有加下臣弗堪無乃戾也韓宣子曰寡君以為歡也對曰寡君猶未敢况下臣君之隸也敢聞加貺固請徹加而後卒事晉人以為知禮重其好貨宿受牟夷叛邑時公在晉莒訴於晉公幾見止故宿如晉拜莒田自比於晉隸足恭以媚晉重自託以傾其君此公數如晉所以拒而不納也葬把文公宋華合比出奔衛左傳宋寺人栁有寵有寵于平公大子佐惡之華合比曰我殺之栁聞之乃坎用牲埋書詐為盟處而告公曰合比將納亡人之族亡人華臣也襄十七年奔衛既盟于北郭矣公使視之有焉遂逐華合比合比奔衛于是華亥欲代右師亥合比弟乃與寺人栁比從為之徵曰聞之久矣公使代之代合比為右師見于左師向戌左師曰女夫也必亡夫謂華亥女喪而宗室于人何有人亦于女何有詩曰宗子維城毋俾城壞毋獨斯畏詩大雅言宗子之固若城俾使也女其畏哉為二十年華亥出奔傳宋平公既以伊戾之譖殺世子痤又以栁之譛逐華合比前後憸謀如出一轍然非向戌為伊戾徵華亥為栁徵平公猶未必深信而不疑以至絶父子之恩暌君臣之義也閹寺禍人國家必廷臣與之合其姦乃必售伊栁戌亥之覆轍可不戒哉附録左傳六月丙戌鄭災終士文伯之言楚公子棄疾如晉報韓子也報前年送女過鄭鄭罕虎公孫僑游吉從鄭伯以勞諸柤柤杜注鄭地辭不敢見固請見之見如見王見鄭伯如見楚王言棄疾恭而有禮以其乘馬八匹私面私見鄭伯見子皮如上卿如見楚卿以馬六匹見子産以馬四匹見子大叔以馬二匹禁芻牧採樵不入田不犯田種不樵樹不采藝藝種也不抽屋不强丐誓曰有犯命者君子廢小人降舍不為暴主不慁賔慁患也往來如是鄭三卿皆知其將為王也三卿罕虎公孫僑遊吉韓宣子之適楚也楚人弗逆公子棄疾及晋竟晋侯將亦弗逆叔向曰楚辟我衷辟邪也衷正也若何效辟詩曰爾之教矣民胥效矣詩小雅言上教下效從我而已焉用效人之辟書曰聖作則逸書則法也無寧以善人為則而則人之辟乎匹夫為善民猶則之况國君乎晉侯說乃逆之𫝊言叔向知禮秋九月大雩左傳秋九月大雩旱也楚薳罷帥師伐吳左傳徐儀楚聘于楚儀楚徐大夫楚子執之逃歸懼其叛也使薳泄伐徐薳泄楚大夫吳人救之令尹子蕩帥師伐吳師于豫章而次于乾溪豫章當在江北淮水南乾溪杜注在譙國城父縣南今江南亳州東南有乾溪與城父村相近吳人敗其師于房鍾房鍾杜注吳地當在今夀州蒙城縣界獲宫廏尹棄疾鬬韋龜之父子蕩歸罪于薳泄而殺之不以敗告故不書楚頻年伐吳終未能得志故自是以後遂舍吳而肆毒於陳蔡也冬叔弓如楚左傳冬叔弓如楚聘且弔敗也弔為吳所敗魯逺於楚而婚於吳遂不與申之㑹至是震楚兵威故使弓先聘而明年遂朝之也齊侯伐北燕左傳十一月齊侯如晉請伐北燕也士丐相士鞅逆諸河禮也士丐晉大夫或作王正晉侯許之十二月齊侯遂伐北燕將納簡公簡公北燕伯三年出奔齊晏子曰不入燕有君矣民不二吾君賄左右諂諛作大事不以信未嘗可也為明年暨齊平𫝊晉人納捷菑於邾非正也而能以義自反故特書不克納以著其遷善改過之美齊侯納北燕伯正也而終以賂止故苐書伐燕而不書不克納以示其本無定燕之心惟恃彊以凌弱耳七年春王正月暨齊平左傳七年春王正月暨齊平齊求之也癸已齊侯次于虢虢杜注燕竟當在今直隸滄州界燕人行成曰敝邑知罪敢不聼命先君之敝器請以謝罪公孫晳曰晳齊大夫受服而退俟釁而動可也二月戊午盟于濡上濡上杜注濡水出高陽縣東北至河間鄭縣入易水當在今直𨽻安州任丘之間燕人歸燕姬賂以瑤罋玉櫝斝耳瑶玉也櫝匱也斝耳玉爵不克而還榖梁傳平者成也暨猶暨暨也暨者不得已也以外及內曰暨我所欲曰及不得已曰暨是時昭公結昏彊吳無汲汲附齊之意其與齊平乃齊求于魯故曰暨至定公八年魯再侵齊結怨大國懼而請平乃魯求於齊故曰及也左𫝊齊求之也乃正解魯暨齊平之義後乃及齊燕之事而杜氏預遂謂燕暨齊平誤矣書暨齊平正與及齊平及鄭平之文同且叔孫婼旋如齊涖盟則此為內平審矣若外平則當用宋人及楚人平之例附録左傳楚子之為令尹也為王旌以田析羽為旌王旌遊至于軫芋尹無宇斷之曰一國兩君其誰堪之及即位為章華之宫章華杜注南郡華容縣今湖廣監利縣東有華容城納亡人以實之無宇之閽入焉有罪亡入章華宫無宇執之有司弗與曰執人于王宫其罪大矣執而謁諸王執無宇焉王將飲酒無宇辭曰天子經略經營天下略有四海故曰經略諸侯正封封疆有定分古之制也封略之內何非君土食土之毛誰非君臣毛草也故詩曰普天之下莫非王土率土之濱莫非王臣詩小雅濱涯也天有十日甲至癸人有十等王至臺下所以事上上所以共神也故王臣公公臣大夫大夫臣士士臣皂皂臣輿輿臣隸隸臣僚僚臣僕僕臣臺馬有圉牛有牧養馬曰圉養牛曰牧以待百事今有司曰女胡執人于王宫將焉執之周文王之法曰有亡荒閲荒大也閲搜也有亡人當大搜其衆所以得天下也吾先君文王作僕區之法僕區刑書名曰盜所隱器隱盜所得器與盜同罪所以封汝也行善法故能啓疆北至汝水若從有司是無所執逃臣也逃而舍之是無陪臺也言皆將逃王事無乃闕乎昔武王數紂之罪以告諸侯曰紂為天下逋逃主萃淵藪萃集也天下逋逃悉以紂為淵藪集而歸之故夫致死焉人欲致死討紂君王始求諸侯而則紂無乃不可乎若以二文之法取之盜有所在矣言王亦為盜王曰取而臣以往盜有寵未可得也盜有寵靈王自謂遂赦之為葬靈王張本三月公如楚左傳楚子成章華之臺臺杜注在華容城內今監利縣北有章華臺願與諸侯落之宫室始成祭之為落大宰薳啓彊曰臣能得魯侯薳啓彊來召公辭曰昔先君成公命我先大夫嬰齊曰吾不忘先君之好將使衡父照臨楚國衡父公衡鎮撫其社稷以輯寧爾民嬰齊受命于蜀蜀盟在成二年奉承以來弗敢失隕而致諸宗祧曰我先君共王引領北望日月以冀冀魯朝𫝊序相授于今四王矣四王共康郟敖及靈王嘉惠未至唯襄公之辱臨我喪襄公二十八年如楚弔康王喪孤與其二三臣悼心失圖在哀喪故社稷之不皇况能懷思君德皇暇也言有大喪多不暇今君若步玉趾辱見寡君寵靈楚國以信蜀之役致君之嘉惠是寡君既受貺矣何蜀之敢望言不敢望如蜀復有質子其先君鬼神實嘉賴之豈唯寡君君若不來使臣請問行期問魯見伐之期寡君將承質幣而見于蜀以請先君之貺公將往夢襄公祖祖祭道神梓慎曰君不果行襄公之適楚也夢周公祖而行今襄公實祖君其不行子服惠伯曰行先君未嘗適楚故周公祖以道之襄公適楚矣而祖以道君不行何之三月公如楚鄭伯勞于師之梁鄭城門孟僖子為介不能相儀僖子仲孫貜及楚不能答郊勞為下僖子病不能相禮張本據左氏楚子成章華之臺願與諸侯落之而薳啓彊自謂能得魯侯蓋知季孫擅國魯君若寄生聞楚有命季氏必迫公以出而不敢違若宋衛之君尚能専有其國恐馳詞執禮以抗非義之請而不赴則楚威為之頓也叔孫婼如齊涖盟婼公羊作舍後同榖梁𫝊涖位也內之前定之辭謂之涖外之前定之辭謂之來夏四月甲辰朔日有食之左𫝊夏四月甲辰朔日有食之晉侯問于士文伯曰誰將當日食對曰魯衛惡之衛大魯小公曰何故對曰去衛地如魯地衛地豕韋也魯地降婁也日食于豕韋之末及降婁之始乃息故禍在衛大在魯小也周四月今二月故日在降婁于是有災魯實受之災發于衛而魯受其餘禍其大咎其衛君乎魯將上卿八月衛侯卒十一月季孫宿卒公曰詩所謂彼日而食于何不臧者何也感日食而問詩對曰不善政之謂也國無政不用善則自取謫于日月之災故政不可不慎也務三而已一曰擇人二曰因民三曰從時附録左𫝊晉人來治杞田前女叔侯不盡歸今公適楚晉人恨故復來治季孫將以成與之成孟氏邑本杞田謝息為孟孫守不可謝息僖子家臣曰人有言曰雖有挈瓶之知守不假器禮也挈瓶汲者喻小知為人守器猶知不以借人夫子從君夫子謂孟僖子從公如楚而守臣喪邑雖吾子亦有猜焉言季孫亦將疑我不忠季孫曰君之在楚于晉罪也又不聽晉魯罪重矣晉師必至吾無以待之不如與之閒晉而取諸杞吾與子桃桃杜注魯國卞縣東南有桃虛成反誰敢有之是得二成也魯無憂而孟孫益邑子何病焉辭以無山與之萊柞萊柞杜注二山乃遷于桃謝息遷也晉人為杞取成楚子享公于新臺章華臺也使長鬣者相鬣鬚也欲先夸魯侯好以大屈宴好之賜大屈弓名既而悔之薳啓彊聞之見公公語之拜賀公曰何賀對曰齊與晉越欲此久矣寡君無適與也而𫝊諸君君其備禦三鄰齊晉越慎守寶矣敢不賀乎公懼乃反之𫝊言楚靈不信所以不終鄭子産聘于晉晉侯有疾韓宣子逆客私焉曰寡君寢疾于今三月矣並走羣望晉所望杞山川皆走往祈禱有加而無瘳今夢黃熊入于寢門其何厲鬼也對曰以君之明子為大政其何厲之有昔堯殛鯀于羽山羽山杜注在東海祝其縣西南今山東沂州東有山髙四里其西為羽淵其神化為黃熊以入于羽淵實為夏郊三代祀之鯀禹父夏郊祭之歷殷周二代又通在羣神之數並見祀晉為盟主其或者未之祀也乎韓子祀夏郊晉侯有閒賜子産莒之二方鼎莒所貢子産為豐施歸州田于韓宣子豐施鄭公孫假之子三年晉以州田賜假此年正月假辛曰日君以夫公孫假為能任其事而賜之州田今無祿早世不獲久享君德其子弗敢有不敢以聞于君私致諸子宣子辭子産曰古人有言曰其父析薪其子弗克負荷荷擔也以微薄喻貴重施將懼不能任其先人之祿其况能任大國之賜縱吾子為政而可後之人若屬有疆埸之言敝邑獲戾而豐氏受其大討吾子取州是免敝邑于戾而建置豐氏也敢以為請宣子受之以告晉侯晉侯以與宣子宣子為初言初言謂與趙文子爭州田病有之以易原縣于樂大心樂大心宋大夫原晉邑以賜樂大心鄭人相驚以伯有曰伯有至矣襄三十年鄭人殺伯有言其鬼至則皆走不知所往鑄刑書之嵗二月在前年或夢伯有介而行曰壬子余將殺帶也駟帶助子晳殺伯有壬子六年三月三日明年壬寅余又將殺假也公孫假豐氏黨壬寅此年正月二十八日及壬子駟帶卒國人益懼齊燕平之月此年正月壬寅公孫假卒國人愈懼其明月子産立公孫泄及良止以撫之乃止公孫泄子孔之子也襄十九年鄭殺子孔良止伯有子也立以為大夫使有宗廟子大叔問其故子産曰鬼有所歸乃不為厲吾為之歸也大叔曰公孫泄何為子孔不為厲問何為復立泄子産曰說也為身無義而圖說伯有無義以妖鬼故立之恐惑民並立泄使若自以大義存誅絶之後者以解說民心從政有所反之以取媚也民不可使知之故治政或當反道以求媚于民不媚不信說而後信之不信民不從也及子産適晉趙景子問焉景子晉中軍佐趙成曰伯有猶能為鬼乎子産曰能人生始化曰魄魄形也既生魄陽曰魂陽神氣也用物精多則魂魄彊物權勢是以有精爽至於神明精者神之未著爽者明之未昭匹夫匹婦彊死彊死不病也其魂魄猶能馮依于人以為淫厲况良霄我先君穆公之胄子良之孫子耳之子敝邑之卿從政三世矣鄭雖無腆抑諺曰蕞爾國而三世執其政柄其用物也𢎞矣其取精也多矣其族又大所馮厚矣而彊死能為鬼不亦宜乎𫝊言子産之博敏子皮之族飲酒無度故馬師氏與子皮氏有惡馬師氏公孫鉏之子罕翔也襄三十年馬師頡出奔公孫鉏代為馬師與子皮俱同一族齊師還自燕之月在此年二月罕朔殺罕魋魋子皮弟罕朔奔晉韓宣子問其位于子産問朔可使在何位子産曰君之羇臣苟得容以逃死何位之敢擇卿違從大夫之位謂以禮去者降位一等罪人以其罪降罪重則降多古之制也朔于敝邑亞大夫也其官馬師也大夫位馬師職獲戾而逃唯執政所置之得免其死為惠大矣又敢求位宣子為子産之敏也使從嬖大夫為子産故故降一等不以罪降秋八月戊辰衛侯惡卒左𫝊秋八月衛襄公卒晉大夫言于范獻子曰衛事晉為睦晉不禮焉庇其賊人而取其地賊人孫林父其地戚也故諸侯二詩曰䳭鴒在原兄弟急難詩小雅䳭鴒雍渠也飛則鳴行則搖喻兄弟相救于急難不可自舍又曰死喪之威兄弟孔懷威畏也言有死喪則兄弟宜相懷思兄弟之不睦于是乎不弔不相弔恤况逺人誰敢歸之今又不禮于衛之嗣衛必叛我是絶諸侯也獻子以告韓宣子宣子說使獻子如衛弔且反戚田衛齊惡告喪于周且請命王使成簡公如衛弔簡公王卿士且追命襄公曰叔父陟恪在我先王之左右以佐事上帝余敢忘髙圉亞圉二圉周之先為殷諸侯亦受殷王追命者榖梁𫝊鄉曰衛齊惡在元年今曰衛侯惡此何為君臣同名也君子不奪人名不奪人親之所名重其所以來也王父名子也不奪人名謂親之所名明臣雖欲改君不當聼也君不聼臣易名者欲使重父命也父受命名于王父王父卒則聼王父之命名之九月公至自楚左𫝊九月公至自楚孟僖子病不能相禮不能相儀答郊勞以此為己病乃講學之苟能禮者從之及其將死也二十四年孟僖子卒𫝊終言之召其大夫曰禮人之幹也無禮無以立吾聞將有逹者曰孔丘僖子卒時孔子年三十五聖人之後也聖人殷湯而滅于宋孔子六代祖孔父嘉為宋督所殺其子奔魯其祖弗父何以有宋而授厲公弗父何孔父嘉之髙祖宋閔公之子厲公之兄何適嗣當立以讓厲公及正考父弗父何之曾孫佐戴武宣皆宋君三命兹益共三命上卿言位髙益共故其鼎銘云一命而僂再命而傴三命而俯俯共于傴傴共于僂循牆而走言不敢安行亦莫余敢侮饘于是鬻于是以糊余口于是鼎中為饘鬻饘鬻糊屬言至儉其共也如是臧孫紇有言曰聖人有明德者若不當世不當大位謂正考父其後必有達人今其將在孔丘乎我若獲沒必屬說與何忌于夫子使事之說南宫敬叔何忌孟懿子皆僖子之子而學禮焉以定其位知禮則位安故孟懿子與南宫敬叔師事仲尼仲尼曰能補過者君子也詩曰君子是則是效詩小雅孟僖子可則效已矣公如楚必致危之故以告於廟也附録左𫝊單獻公棄親用羇獻公周卿士單靖公之子頃公之孫羇寄客也冬十月辛酉襄頃之族殺獻公而立成公襄公頃公之父成公獻公弟冬十有一月癸未季孫宿卒左𫝊十一月季武子卒晉侯謂伯瑕曰伯瑕士文伯吾所問日食從矣可常乎衛侯武子皆卒故對曰不可六物不同各異時民心不一政教殊事序不類有變易官職不則治官居職非一法同始異終胡可常也詩曰或燕燕居息或憔悴事國詩小雅言不同其異終也如是公曰何謂六物對曰嵗時日月星辰是謂也公曰多語寡人辰而莫同如北辰大辰之類其義莫同何謂辰對曰日月之㑹是謂辰故以配日謂以子丑配甲乙自季友至行父雖専魯國臣節尚無顯悖至宿則乘君幼而分其民據其土稱兵邦域招納叛人諂事霸國深結彊家以閒阻其君襄公自楚歸至不敢入他日意如逐君乃宿之遺謀耳十有二月癸亥葬衛襄公左𫝊衛襄公夫人姜氏無子姜氏宣姜嬖人婤姶生孟縶孔成子夢康叔謂己立元成子衛卿孔逹之孫蒸鉏也元孟縶弟夢時元未生余使羈之孫圉與史苟相之羈蒸鉏子苟史朝子史朝亦夢康叔謂己余將命而子苟與孔蒸鉏之曾孫圉相元史朝見成子告之夢夢協晉韓宣子為政聘于諸侯之嵗在二年婤姶生子名之曰元孟縶之足不良弱行跛也孔成子以周易筮之曰元尚享衛國主其社稷令蓍辭遇屯震下坎上屯又曰余尚立縶尚克嘉之嘉善也遇屯之比坤下坎上比屯初九爻變以示史朝史朝曰元亨又何疑焉周易曰屯元亨成子曰非長之謂乎言屯之元亨謂年長非謂名元對曰康叔名之可謂長矣孟非人也將不列于宗不可謂長且其繇曰利建侯繇卦辭嗣吉何建嗣子有常位故無所建建非嗣也二卦皆云謂再得屯卦皆有建侯之文子其建之康叔命之二卦告之筮襲于夢武王所用也弗從何為大誓曰朕夢協朕卜襲于休祥戎商必克此武王辭弱足者居跛則偏弱居其家不能行侯主社稷臨祭祀奉民人事鬼神從㑹朝又焉得居各以所利不亦可乎孟跛利居元吉利建故孔成子立靈公靈公元也十二月癸亥葬衛襄公八年春附録左𫝊八年春石言于晉魏榆魏榆杜注晉地今山西榆次縣西北有故城通典曰晉魏榆邑也晉侯問于師曠曰石何故言對曰石不能言或馮焉謂有精神憑依石而言不然民聽濫也濫失也抑臣又聞之曰作事不時怨讟動于民則有非言之物而言今宫室崇侈民力雕盡怨讟並作莫保其性性命也石言不亦宜乎于是晉侯方築虒祁之宫虒祁杜注地名在絳西四十里臨汾水在今山西曲沃縣西叔向曰子野之言君子哉子野師曠字君子之言信而有徵故怨逺于其身小人之言僭而無徵故怨咎及之詩曰哀哉不能言匪舌是出唯躬是瘁詩小雅不能言謂不知言理僭而無信自取瘁病故哀之哿矣能言巧言如流俾躬處休其是之謂乎哿嘉也巧言如流謂言之順叙信而有徵自取安逸師曠此言緣問流轉終歸于諫故以比巧言如流也當叔向時詩義如此故與今說詩者小異是宫也成諸侯必叛君必有咎夫子知之矣為十年晉侯彪卒𫝊陳侯之弟招殺陳世子偃師左𫝊陳哀公元妃鄭姬生悼大子偃師二妃生公子留下妃生公子勝二妃嬖留有寵屬諸司徒招與公子過招及過皆哀公弟哀公有廢疾三月甲申公子招公子過殺悼大子偃師而立公子留榖梁𫝊鄉曰陳公子招在元年今曰陳侯之弟招何也曰盡其親所以惡招也盡其親謂既稱公子又稱弟招先君之公子今君之母弟兩下相殺不志乎春秋此其志何也世子云者唯君之二也云可以重之存焉志之也諸侯之尊兄弟不得以屬通其弟云者親之也親而殺之惡也陳招以介弟為司徒不顧宗社以逞其私殺嫡立庶致楚乘釁以滅陳故不稱公子而變文書弟所以甚招之惡而著陳侯失親親之道也夏四月卒丑陳侯溺卒左𫝊夏四月辛亥哀公縊憂恚自殺經書辛丑從赴陳侯因偃師之變恚而卒則其託留於公子招所以寵留而非有殺偃師之心也楚棄疾立公子比而靈王縊春秋書比弒其君招殺偃師而哀公縊不書招弒其君何也招方當國不肯以先君之縊赴舊史承而書之與鄭伯髠頑楚子麇同叔弓如晉左𫝊叔弓如晉賀虒祁也賀宫成游吉相鄭伯以如晉亦賀虒祁也史趙見子大叔曰甚哉其相䝉也可弔也而又賀之子大叔曰若何弔也其非唯我賀將天下實賀言諸侯畏晉非獨鄭楚成章華之臺而召諸侯以落之晉成虒祁之宫而諸侯畢賀小國之困敝極矣楚人執陳行人干徵師殺之左𫝊干徵師赴于楚干徵師陳大夫且告有立君公子勝訴之于楚以招過殺偃師告楚人執而殺之殺干徵師公子留奔鄭書曰陳侯之弟招殺陳世子偃師罪在招也楚人執陳行人干徵師殺之罪不在行人也榖梁𫝊稱人以執大夫執有罪也稱行人怨接于上也陳殺世子罪在於招行人何辜而以為戮乎蓋楚靈因陳亂以為利欲震怖其國而取之故殺人以行其詐耳陳公子留出奔鄭留書公子是為招所立而猶不敢安於其位故不以偃師之獄歸之秋搜于紅書搜始此紅杜注魯地沛國蕭縣西有紅亭遠疑蕭縣今屬江南徐州府左𫝊秋大搜于紅自根牟至于商衛革車千乘根牟杜注魯東界琅琊陽都縣有牟鄉商杜注宋地魯西竟接宋衛也公羊𫝊搜者何簡車徒也何以書蓋以罕書也榖梁𫝊正也因搜狩以習用武事禮之大者也艾蘭以為防蘭香草也防為田之大限置旃以為轅門周禮通帛曰旃轅門卬車以其轅表門以葛覆質以為𣙗質椹也𣙗門中臬葛或作褐流旁握御轚者不得入流旁握謂車兩轊頭各去門邊空握握四寸也轚挂則不得入門車軌塵塵不出轍馬候蹄發足相應遲疾相投掩禽旅掩取衆禽御者不失其馳然後射者能中過防弗逐不從奔之道也戰不逐奔之義面傷不獻嫌誅降不成禽不獻惡虐幼小禽雖多天子取三十焉其餘與士衆以習射于射宫取三十以共乾豆賓客之庖射宫澤宫射而中田不得禽則得禽田得禽而射不中則不得禽是以知古之貴仁義而賤勇力也射以不爭為仁揖讓為義春秋凡五書搜皆曰大搜著僭也此𫝊亦言大搜于紅自根牟至于商衛革車千乘而經無大字闕文也在他公不書惟書於昭定之世何也魯僭大搜之禮亦如郊禘之不可勝書惟昭定之際公無尺土一民而三桓用天子之禮以簡私家之軍實尤非常之變不赦之惡也附録左𫝊七月甲戌齊子尾卒子旗欲治其室子旗欒施丁丑殺梁嬰梁嬰子尾家宰八月庚戌逐子成子工子車三子齊大夫子尾之屬子成頃公子固子工成之弟鑄子車頃公之孫捷皆來奔而立子良氏之宰子良子尾之子髙彊也子旗為之立宰其臣曰子尾家臣孺子長矣孺子謂子良而相吾室欲兼我也授甲將攻之陳桓子善于子尾亦授甲將助之或告子旗子旗不信則數人告將往又數人告于道遂如陳氏桓子將出矣聞之而還聞子旗至游服而逆之去戎備著常遊戲之服請命問桓子所至對曰聞彊氏授甲將攻子子聞諸曰弗聞子盍亦授甲無宇請從子旗曰子胡然彼孺子也吾誨之猶懼其不濟吾又寵秩之謂為之立宰其若先人何子盍謂之謂之使無攻我周書曰惠不惠茂不茂周書康誥言當施惠于不惠者勸勉于不勉者茂勉也康叔所以服𢎞大也服行也桓子稽顙曰頃靈福子頃公靈公欒氏所事之君吾猶有望遂和之如初和欒髙二家陳人殺其大夫公子過左𫝊陳公子招歸罪于公子過而殺之言招所以不死而得放稱人以殺而不去其官國亂無政衆人擅殺非討賊之辭也蓋偃師之死招實主謀孔奐與焉而非過之所欲也招惡其異己反加罪焉經書招殺偃師於前書楚師滅陳殺奐於後而過稱大夫則不與殺世子明矣大雩冬十月壬午楚師滅陳執陳公子招放之于越殺陳孔奐奐公羊作瑗左𫝊九月楚公子棄疾帥師奉孫吳圍陳孫吳悼大子偃師之子惠公宋戴惡㑹之戴惡宋大夫冬十一月壬午滅陳壬午十月十八日𫝊言十一月誤輿嬖袁克殺馬毁玉以葬輿衆也袁克嬖人之貴者欲厚葬哀公楚人將殺之請置之置馬玉既又請私私盡君臣恩私于幄加絰于顙而逃使穿封戌為陳公戌楚大夫滅陳為縣使戌為縣公曰城麇之役不諂城麇役在襄二十六年戌與靈王爭皇頡侍飲酒于王王曰城麇之役女知寡人之及此女其辟寡人乎對曰若知君之及此臣必致死禮以息楚息寧靜也晉侯問于史趙曰陳其遂亡乎對曰未也公曰何故對曰陳顓頊之族也陳祖舜舜出顓頊嵗在鶉火是以卒滅陳將如之顓頊氏以嵗在鶉火而滅火盛而水滅今在析木之津猶將復由箕斗之閒有天漢故謂之析木之津由用也且陳氏得政于齊而後陳卒亡物莫能兩盛自幕至于瞽瞍無違命幕舜之先瞽瞍舜父舜重之以明德置德于遂遂舜後蓋殷之興存舜之後而封遂遂世守之及胡公不淫故周賜之姓使祀虞帝臣聞盛德必百世祀虞之世數未也繼守將在齊其兆既存矣言陳氏興盛于齊形兆已見榖梁𫝊惡楚子也楚莊討陳之亂有善有惡故先書楚人殺陳夏徵舒而後及其入國納亂臣之事是非不相掩也楚圍則恃彊逞暴利陳之土地而滅之非有討賊之義故先書滅陳葬陳哀公榖梁𫝊不與楚滅閔公也陳已滅矣非我往㑹葬而書與莊四年齊侯葬紀伯姬同耳彼曰齊蓋上無齊滅紀之文不書齊侯則未知孰葬之今已書楚師滅陳則下三事皆䝉上文而書耳日講春秋解義卷四十九
