body:
  text: 欽定四庫全書日講春秋解義卷十莊公七年春夫人薑氏會齊侯于防防杜注魯地左傳七年春文薑會齊侯于防齊志也穀梁傳婦人不會會非正也文薑數與齊侯會至齊地則姦發夫人至魯地則齊侯之志夏四月辛卯夜恆星不見夜中星隕如雨隕公羊作霣辛卯夜穀梁夜作昔左傳夏恆星不見夜明也星隕如雨與雨偕也恆常也常見之星應見之時而不見日光不以昏沒至夜猶明也如而也偕俱也夜半星落而且雨星與雨俱下也公羊傳恆星者何列星也常以時列見列星不見則何以知夜之中星反也反者星復其位也星反在夜半之後則知向者不見之時是夜中矣如雨者何如雨者非雨也非雨則曷為謂之如雨不修春秋曰雨星不及地尺而復不修春秋魯史記舊文不及地尺而復謂不至地而沒也君子修之曰星霣如雨明其狀似雨爾不當言雨星何以書記異也穀梁傳恆星者經星也經常也謂常列宿日入至于星出謂之昔不見者可以見也夜中星隕如雨其隕也如雨是夜中與春秋著以傳著疑以傳疑中之幾也而曰夜中著焉爾著著見也幾微也言春秋之書皆以實録今星隕而雨則夜中之時幾微難知而曰夜中必是事之著見而有據爾非臆度而知也何用見其中也失變而録其時則夜中矣失變不知星變始于何時也言經以何事知其夜中以失星變之始而録其已隕之時揆度刻漏則正當夜中矣其不曰恆星之隕何也我知恆星之不見而不知其隕也此解不得言恆星之隕也我見其隕而接于地者則是雨説也著于上見于下謂之雨著于下不見于上謂之隕豈雨説哉此又解不言雨星而言隕星之意恆星天之經星常見者也如雨言衆也先儒謂前此五國連兵抗拒王命後此齊晉更霸政歸盟主先王之紀綱法度掃滅殆盡故恆星宜見而不見衆星不當隕而隕天人相感之理信可畏也經書星隕隕石隕霜或先或後立文各異蓋星在天有象先見星而後見其隕石與霜則既隕而後見耳秋大水穀梁傳高下有水災曰大水無麥苗左傳秋無麥苗不害嘉穀也黍稷尚可更種故曰不害嘉穀公羊傳無苗則曷為先言無麥而後言無苗苗禾也生曰苗秀曰禾一災不書一穀之災不書于經也待無麥然後書無苗何以書記災也穀梁傳麥苗同時也麥與黍稷之苗同時死周之秋夏正之五月也麥熟苗將秀而大水漂蕩則麥苗俱無矣春秋謹而書之畏天災重民命也此亦周人即以子月為春之徵若夏時之秋則麥之登既久而穀將成熟不復有苗矣冬夫人薑氏會齊侯于穀穀杜注齊地濟北穀城縣今山東東阿縣治故穀城是也穀梁傳婦人不會會非正也再發傳者防魯地穀齊邑故重發之春夫人薑氏會齊侯于防冬夫人薑氏會齊侯于穀在齊在魯一嵗宣淫者再人欲肆而廉恥喪惡積不可掩矣以致無知篡弒之禍天理之不誣者也八年春王正月師次于郎以俟陳人蔡人公羊傳次不言俟此其言俟何託不得已也師出本為下滅成諱滅同姓故託以待二國為辭穀梁傳次止也俟待也用大衆曰師次止也春秋書次其義不一伐而次者有整兵慎戰之意蓋善之也救而次者有爰師畏敵之意蓋譏之也若郎之次則無名妄動尤為非義經書俟陳蔡而未明所事杜預謂期共伐郕於情事為合賈逵范寧皆云陳蔡欲伐魯非也陳蔡與魯隔逺未聞搆怨何因來伐且俟者相須同行之辭非防敵拒寇之稱也甲午治兵治公羊作祠左傳八年春治兵于廟禮也公羊傳祠兵者何出曰祠兵入曰振旅出兵必祠于近郊殺牲以饗士卒其禮一也皆習戰也何言乎祠兵為久也曷為為久吾將以甲午之日然後祠兵于是諱為久留辭使若無欲滅同姓之意穀梁傳出曰治兵習戰也入曰振旅習戰也治兵而陳蔡不至矣兵事以嚴終以嚴整終事故曰善陳者不戰此之謂也善為國者不師道之以德齊之以禮四海賓服何師之為善師者不陳師衆素嚴不須耀軍列陳善陳者不戰軍陳嚴整敵望而畏之莫敢戰善戰者不死投兵勝地故無死者善死者不亡民盡其命無奔背散亡者此所治者即次郎之師也俟而不至暴師既久則有失伍故復申明軍法以整齊之其志非善之也譏黷武也夏師及齊師圍郕郕降于齊師郕公羊作成左傳夏師及齊師圍郕郕降于齊師仲慶父請伐齊師仲慶父公子慶父也齊不與魯共其功故欲伐之公曰不可我實不德齊師何罪罪我之由夏書曰皋陶邁種德德乃降書稱皋陶能行布其德德乃下洽于民今引之斷章取證降義言皋陶能行布其德由其有德乃為人降服也姑務修德以待時乎公羊傳成者何盛也盛魯之同姓國盛則曷為謂之成諱滅同姓也曷為不言降吾師辟之也辟滅同姓使若魯圍之而去成自從後降于齊師也穀梁傳其曰降于齊師何不使齊師加威于郕也使若齊無武功而郕自降齊仇讎也郕同姓也及者內為志也郕降于齊師者義不服也直書而其惡著矣秋師還左傳秋師還君子是以善魯莊公公羊傳還者何善辭也此滅同姓何善爾病之也慰勞其罷病曰師病矣曷為病之非師之罪也君之使非師之罪也穀梁傳還者事未畢也遁也郕已降而以未畢為文者蓋辟滅同姓之國示不卒其事書師還者言師至是而始還也其次其及其還皆不稱公者春秋之法內大惡諱莊公舉大衆會仇讎以伐同姓暴師於外更歷三時力屈而後還無名黷武非義害人未有若此之甚者故以為大惡而諱不書公也冬十有一月癸未齊無知弒其君諸兒左傳齊侯使連稱管至父戍葵丘二子齊大夫葵丘杜注齊地臨淄縣西有地名葵丘今山東臨淄縣西有西安城葵丘在其處瓜時而往曰及瓜而代期戍公問不至問命也請代弗許故謀作亂僖公之母弟曰夷仲年生公孫無知有寵于僖公衣服禮秩如適適大子襄公絀之二人因之以作亂二人連稱管至父連稱有從妹在公宮無寵使間公伺公之間隙曰捷吾以女為夫人捷克也宣無知之言冬十二月經書十一月癸未蓋月六日也傳云十二月傳誤齊侯遊于姑棼遂田于貝丘姑棼杜注齊地即薄姑也今山東博興縣東北有薄姑城貝丘杜注齊地博昌縣有地名貝丘今山東博興縣南有貝中聚見大豕從者曰公子彭生也公見大豕而從者見彭生蓋妖鬼公怒曰彭生敢見射之豕人立而啼公懼隊于車傷足喪屨反還也誅屨于徒人費誅責也弗得鞕之見血走出遇賊于門即連管之徒為亂者劫而東之費曰我奚御哉袒而示之背信之費請先入詐欲助賊伏公而出鬬死于門中石之紛如死于階下齊小臣也遂入殺孟陽于牀孟陽亦齊小臣代公居牀曰非君也不類見公之足于户下遂弒之而立無知初襄公立無常政令無常鮑叔牙曰君使民慢亂將作矣奉公子小白出奔莒鮑叔牙小白傅小白僖公庶子亂作管夷吾召忽奉公子糾來奔管夷吾召忽子糾傅子糾小白庶兄為九年公伐齊納子糾齊小白入于齊傳初公孫無知虐于雍廩雍廩齊大夫為殺無知傳穀梁傳大夫弒其君以國氏者嫌也弒而代之也弒君者連稱管至父而專罪無知者君弒而無知受之則賊不在二子矣無知不稱公孫隱桓莊之春秋凡賊皆名之也徒人費石之紛如皆死君難而不見於經如費等乃便嬖私昵之臣逢君之惡使百姓苦之者也與孔父之義形於色仇牧之不畏強禦而死於其職者異矣九年春齊人殺無知左傳九年春雍廩殺無知穀梁傳無知之挈失嫌也稱人以殺大夫殺有罪也傳稱齊公孫無知虐于雍廩九年春雍廩殺無知則是殺無知者雍廩也而書齊人討賊之辭也弒君之賊人人得而誅之所以使亂臣賊子無所容於天地之間也無知不稱君已不能君齊人亦莫之君也春秋之初王道猶未盡墜人心知有禮義故州吁之弒衛人以為賊不踰年卒討之無知之弒齊人以為賊踰年卒討之無知不成君而雍廩得書人國猶有臣子也公及齊大夫盟于蔇蔇公羊穀梁作暨杜注魯地琅琊繒縣北有蔇亭在今山東嶧縣東故鄫城左傳公及齊大夫盟于蔇齊無君也公羊傳公曷為與大夫盟齊無君也然則何以不名為其諱與大夫盟也使若衆然鄰國之臣猶吾臣也君之于臣當告從命行而反歃血約誓故諱使若悉得齊諸大夫而約束之者穀梁傳公不及大夫大夫不名無君也盟納子糾也不日其盟渝也變盟立小白當齊無君制在公矣當可納而不納故惡內也及者內為志也蔇魯地也公邀齊大夫至魯地而盟納子糾也大夫不名來者非一人也公於不共戴天之仇生則屢與會好殁則謀定其國家而圖其後嗣天理滅矣故書及以著其本心之喪失也夏公伐齊納糾齊小白入于齊納糾左作納子糾左傳夏公伐齊納子糾桓公自莒先入公羊傳納者何入辭也其言伐之何伐而言納者猶不能納也糾者何公子糾也何以不稱公子君前臣名也公子無去國之義去公子見臣于魯也曷為以國氏稱齊小白當國也其言入何篡辭也穀梁傳當可納而不納齊變而後伐故乾時之戰不諱敗惡內也大夫出奔反以好曰歸以惡曰入齊公孫無知弒襄公公子糾公子小白不能存出亡齊人殺無知而迎公子糾于魯公子小白不讓公子糾先入又殺之于魯故曰齊小白入于齊惡之也糾不稱子國非其國也入者難辭也小白繫齊宜有國也按公穀荀子史記皆以子糾為兄小白為弟程子以薄昭之言證小白為兄朱子以為疑左傳史記杜預謂小白子糾為僖公子而程子以為襄公子未知孰是而以經文斷之忽繫鄭而突不繫鄭則嫡庶之辨也捷災不繫邾而書弗克納則長幼之辨也今小白繫齊則鄭忽之例也糾不稱子而書納則捷災之例也小白與糾當立不當立之義明矣小白與糾當立不當立之義明而管仲召忽之是非功罪亦辨直以經斷傳可也秋七月丁酉葬齊襄公九月乃葬亂故也無知己誅可以葬矣八月庚申及齊師戰于乾時我師敗績乾時杜注齊地時水在樂安縣界支流旱則竭涸故曰乾時今樂安故城在山東博興縣北時水在縣南左傳秋師及齊師戰于乾時我師敗績公喪戎路傳乘而歸傳乘乘他車秦子梁子以公旗辟于下道二子公御及戎右也以誤齊師是以皆止獲也公羊傳內不言敗此其言敗何伐敗也伐誇大也曷為伐敗復讎也復讎以死敗為榮此復讎乎大國曷為使微者公也公則曷為不言公不與公復讎也曷為不與公復讎復讎者在下也公實為不納子糾伐齊諸大夫以為不如以復讎伐之非誠心至意故不與也內不言敗而乾時之敗不諱者能與讎戰雖敗猶榮也傳稱公喪戎路傳乘而歸而經不書公何也明公之志在納糾不知讎之當復也微者之戰不名而書及者有之矣此書及何以别于微者之戰也上書公及齊大夫盟于蔇公伐齊納糾則此戰公實主之不待傳而明矣九月齊人取子糾殺之左傳鮑叔帥師來言曰子糾親也請君討之管召讎也請受而甘心焉乃殺子糾于生竇生竇杜注魯地史記作笙瀆賈逵曰句瀆也今山東曹州北有句陽古城即句瀆故地召忽死之管仲請囚鮑叔受之及堂阜而稅之堂阜杜注齊地東莞蒙陰縣西北有夷吾亭鮑叔解夷吾縛于此因以為名今堂阜在山東蒙陰縣西北稅脫同歸而以告曰管夷吾治于高傒高傒齊卿高敬仲也言管仲治理政事之才多于敬仲使相可也公從之公羊傳其取之何內辭也脅我使我殺之也其稱子糾何貴也其貴奈何宜為君者也穀梁傳外不言取言取病內也取易辭也猶曰取其子糾而殺之云爾十室之邑可以逃難百室之邑可以隱死以千乘之魯而不能存子糾以公為病矣魯殺子糾于生竇而經書齊人取之者齊令也是猶齊人取於魯而殺之爾惡齊而亦以病魯也納糾不稱子明不當立也此特書子明不當殺也不目桓公而稱齊人并其國人而罪之也廢立之際權寄於當國大臣齊大夫始謀不審既與魯盟而欲立之終乃假手於魯以加刃焉則皆不得辭其罪矣冬浚洙洙水出魯國東北西南入沇水下合泗公羊傳洙者何水也浚之者何深之也曷為深之畏齊也洙在魯北齊所由來曷為畏齊也辭殺子糾也時魯見脅於齊微弱可恥故諱使若辭不肯殺子糾齊自取殺之畏齊怒而為備也穀梁傳浚洙者深洙也著力不足也洙水在魯北齊伐魯之道也魯雖殺子糾猶有畏齊之心故浚而深之以備齊也公不能明刑政結人心以自強於為治使大國畏之而以畏齊浚洙不知固國以保民為本輕用民力妄興大役適足以搖邦本况洙水近在魯城之北欲恃此以不恐即此見謀國之無人而召侮於鄰敵矣十年春王正月公敗齊師于長勺長勺杜注魯地左傳十年春齊師伐我公將戰曹劌讀見曹劌魯人其鄉人曰肉食者謀之又何間焉肉食在位者間猶與也劌曰肉食者鄙未能逺謀乃入見問何以戰公曰衣食所安茀敢專也必以分人對曰小惠未遍民弗從也衣食所惠不過左右故曰未遍公曰犧牲玉帛弗敢加也必以信祝辭不敢以小為大以惡為美對曰小信未孚孚大信也神弗福也公曰小大之獄雖不能察必以情必盡已情察審也對曰忠之屬也上思利民忠也可以一戰戰則請從公與之乘共乘兵車戰于長勺公將鼓之劌曰未可齊人三鼓劌曰可矣齊師敗績公將馳之劌曰未可下視其轍視車迹也登軾而望之曰可矣遂逐齊師既克公問其故對曰夫戰勇氣也一鼓作氣再而衰三而竭彼竭我盈故克之夫大國難測也懼有伏焉恐詐奔吾視其轍亂望其旗靡故逐之榖梁傳不日疑戰也言不尅日而戰以詐相襲疑戰而曰敗勝內也謂勝在內長勺之戰以報乾時之役魯地而齊師至焉疑罪之在齊也乃經于齊不書伐而魯書敗意在責魯何也觀長勺之勝魯非甚弱必不能與齊敵也使莊公移乾時之戰於桓公見戕之時移長勺之戰於齊襄未死之日則勝亦榮也敗亦榮也莊公之師不以復父讎而以納讎人之子既敗而逞忿以勦民設詐以怒敵敗固為恥而勝亦不足道矣故主魯而以詐戰書其義可謂深切著明矣二月公侵宋此書侵之始公羊傳曷為或言侵或言伐粗者曰侵侵者兵加其竟而已以罪輕無深責焉于義為粗精者曰伐執詞以伐于義為精戰不言伐圍不言戰入不言圍滅不言入書其重者也穀梁傳侵時此其月何也乃深其怨于齊又退侵宋以衆其敵惡之故謹而月之潛師掠境曰侵宋魯未嘗有隙莊公以僥幸得志於齊遂舉無名之師乘勝以掠宋境皆召兵之道非保國之謀所以致次郎之師也三月宋人遷宿此遷國之始公羊傳遷之者何不通也以地還之也還繞也宋欲遷宿先繞取其地使不得通四方宿窮從宋求遷故得言遷子沈子曰不通者蓋因而臣之也宿不得通四方宿君遷宋因臣有之穀梁傳遷亡辭也為人所遷則無復國家故曰亡辭其不地宿不復見也國亡不復見經遷者猶未失其國家以往者也謂自遷者遷國之例有二其以自遷為文者邢遷于夷儀衛遷于帝丘之類是也以遷國為文者宋人遷宿齊師遷紀郱鄑郚之類是也宿介宋魯之間屬宋而親魯宋人以為二而遷之自是亡矣然遷之使屬役于己而不滅其社稷宗廟尚知有所畏忌則是王澤之未竭也僖文以後有滅國無遷國矣夏六月齊師宋師次于郎公敗宋師于乘丘乘丘杜注魯地西漢泰山郡有乘丘縣顔師古曰即春秋乘丘也括地志乘丘在瑕丘縣西北今山東滋陽縣西有古瑕丘城左傳夏六月齊師宗師次于郎公子偃曰公子偃魯大夫宋師不整可敗也宋敗齊必還請擊之公弗許自雩門竊出蒙皋比而先犯之雩門魯南城門皋比虎皮公從之大敗宋師于乘丘齊師乃還公羊傳其言次于郎何伐也伐則其言次何齊與伐而不與戰故言伐也此解本所以當言伐意謂若齊本與宋共伐而但不與戰則既成乎伐可言伐也我能敗之故言次也此解本所以不言伐言次之意言二國才止次未成于伐魯即能敗宋師齊師罷去故不言伐言次也穀梁傳次止也畏我也不日疑戰也疑戰而曰敗勝內也齊以長勺之役宋以公侵之故致怨于魯連兵境上意欲乘釁報復固為無名之師魯不能修辭執禮以退二國而偷一時之便攻其不備以積怨怒鄰亦非安國便民之道也故次者不以其事勝者不以其理蓋交譏之秋九月荆敗蔡師于莘以蔡侯獻舞歸舞穀梁作武莘杜注蔡地在今河南汝陽縣境左傳蔡哀侯娶于陳息侯亦娶焉息媯將歸過蔡蔡侯曰吾姨也妻之姊妹曰姨止而見之弗賓不禮敬也息侯聞之怒使謂楚文王曰伐我吾求救于蔡而伐之楚子從之秋九月楚敗蔡師于莘以蔡侯獻舞歸公羊傳荆者何州名也州謂九州冀兗青徐揚荆豫梁雍州不若國國不若氏氏不若人人不若名名不若字字不若子蔡侯獻舞何以名絶曷為絶之獲也曷為不言其獲不與夷狄之獲中國也穀梁傳荆者楚也何為謂之荆狄之也何為狄之聖人立必後至天子弱必先叛故曰荆狄之也蔡侯何以名也絶之也何為絶之獲也中國不言敗此其言敗何也中國不言敗蔡侯其見獲乎其言敗何也釋蔡侯之獲也諱獲故止言敗以歸猶愈乎執也諱見執故言以歸楚祝融之後其先鬻熊為文王師封於丹陽而始見經以州舉者僣號稱王肆毒於上國也諸侯不生名而書敗書入書滅而以其君歸者則名以不能守其國又不能守於位而甘為臣僕故賤之也蔡侯獻舞潞子嬰兒沈子嘉許男斯頓子牂胡子豹曹伯陽邾子益皆名而夔子不名雖國滅而身執其義不可屈也冬十月齊師滅談談子奔莒此書滅國之始談杜注談國在濟南平陵縣西南今山東歷城縣東南有談城左傳齊侯之出也過談談不禮焉及其入也諸侯皆賀談又不至冬齊師滅談談無禮也談子奔莒同盟故也公羊傳何以不言出國已滅矣無所出也諸侯國滅失地則名而談子不名者蓋其所失者事大國之禮而未嘗有可滅之罪故恕之也滅而書奔責不死於其位也不書出國亡無所出也不書名者已無取滅之罪為強大所併出於不幸而義未可絶也齊桓於圖霸之初用管仲攻瑕之術肆其兵威凌暴弱小以恐懼天下之諸侯談之亡也特出於不幸耳故存其爵而不比於失地之君楚子滅弦弦子奔黃狄滅溫溫子奔衛義猶是也十有一年春王正月夏五月戊寅公敗宋師于鄑鄑杜注魯地當在今山東兗州府境與元年在都昌縣西者乃二地左傳十一年夏宋為乘丘之役故侵我公禦之宋師未陳而薄之敗諸鄑凡師敵未陳曰敗某師謂設權譎變詐以勝敵彼我未得成列成列而未得用故以未陳獨敗為文皆陳曰戰堅而有備各得其所成敗決于志力者也大崩曰敗績師徒橈敗喪其功績故曰敗績得俊曰克克勝也戰勝其師獲得其雄俊者覆而敗之曰取某師覆隱也攻其不備若網羅所掩覆一軍皆見禽制故曰取京師敗曰王師敗績于某王者無敵于天下故以自敗為文明天下莫之得挍穀梁傳內事不言戰舉其大者其日成敗之也結日列陳不以詐相襲得敗師之道故曰成宋萬之獲也宋師再至再敗兵禍旋及其君魯雖再勝國亦困於兵矣傳書侵我經不書侵蓋與長勺義同秋宋大水左傳秋宋大水公使弔焉曰天作淫雨害于粢盛若之何不弔對曰孤實不敬天降之災又以為君憂拜命之辱臧文仲曰臧文仲魯大夫宋其興乎禹湯罪已其興也悖焉悖勃同盛貌桀紂罪人其亡也忽焉忽速貌且列國有凶稱孤禮也言懼而名禮其庶乎言懼罪已名禮稱孤其庶庶幾于興既而聞之曰公子御説之辭也御説宋莊公子臧孫逹曰是宜為君有恤民之心公羊傳何以書記災也外災不書此何以書及我也時魯亦有水災書魯則宋災不見兩舉則煩文不省故詭例書外以見內也穀梁傳外災不書此何以書王者之後也髙下有水災曰大水春秋凡外災來告則書者諸侯之於四鄰有恤病救急之義則告為得禮而不可以不弔故四國同災許人不弔君子譏之凡志災皆所以示天戒之當謹民隱之宜恤也冬王姬歸于齊左傳冬齊侯來逆共姬公羊傳何以書過我也時王者嫁女于齊塗過魯明當有送迎之禮在塗不稱婦者王者無外故從在國辭穀梁傳其志過我也王姬齊桓公夫人也主襄公之昏其罪大故書之詳主桓公之昏其罪小故書之略此輕重之權衡也春秋之義尊王朝抑列國惟王姬下嫁與列國之女同辭而不異蓋以王姬雖貴其當執婦道與公侯大夫士庶人之女同所以述天理訓萬世也附録左傳乘丘之役在十年公以金僕姑射南宮長萬金僕姑矢名南宮長萬宋大夫公右歂孫生搏之搏取也宋人請之宋公靳之魯聽其得還戲而相愧曰靳曰始吾敬子今子魯囚也吾弗敬子矣病之萬不以為戲而以為己病為宋萬弒君傳曰講春秋解義卷十
