body:
  text: 欽定四庫全書日講春秋解義卷六十定公十有三年春齊侯衛侯次于垂葭葭公羊作瑕穀梁無衛侯字垂葭杜注改名郹氏髙平巨野縣西南有郹亭今屬濟寧州左傳十三年春齊侯衛侯次于垂葭實郹氏使師伐晉將濟河諸大夫皆曰不可邴意兹曰意兹齊大夫可鋭師伐河內河內杜注汲郡今河南衛輝府治傳必數日而後及絳傳告晉絳不三月不能出河則我既濟水矣乃伐河內齊侯皆斂諸大夫之軒唯邴意兹乘軒以其言當齊侯欲與衛侯乘共載與之宴而駕乘廣載甲焉使告曰晉師至矣齊侯曰比君之駕也寡人請攝以己車攝代衛車乃介而與之乘驅之或告曰無晉師乃止傳言齊侯輕所以不能成功夏築蛇淵囿蛇淵囿水經注蛇水又西徑鑄城西京相璠曰濟北有蛇丘城城下有水魯囿也今蛇丘故城在山東肥城縣南杜氏預以為書不時也此與受女樂事正相類蓋孔子去而魯君臣之志荒矣大搜于比蒲衛公孟彄帥師伐曹秋晉趙鞅入于晉陽以叛左傳晉趙鞅謂邯鄲午曰歸我衛貢五百家吾舍諸晉陽十年鞅圍衛衛人懼貢五百家鞅置之邯鄲今欲徙于晉陽杜注晉陽趙鞅邑午許諾歸告其父兄父兄皆曰不可衛是以為邯鄲言衛以五百家在邯鄲故與邯鄲親而置諸晉陽絶衛之道也不如侵齊而謀之侵齊則齊當來報欲因懼齊而徙則衛與邯鄲好不絶乃如之而歸之于晉陽欲如是謀而後歸衛貢趙孟怒召午而囚諸晉陽鞅不察其謀謂不用命故囚之使其從者說劍而入涉賓不可涉賓午家臣乃使告邯鄲人曰吾私有討于午也二三子唯所欲立午鞅同族别封邯鄲故使邯鄲人更立午宗親遂殺午趙稷涉賓以邯鄲叛稷午子夏六月上軍司馬籍秦圍邯鄲邯鄲午荀寅之甥也荀寅范吉射之姻也壻父曰姻寅子娶吉射女而相與睦故不與圍邯鄲將作亂攻趙鞅董安于聞之安于趙氏臣告趙孟曰先備諸趙孟曰晉國有命始禍者死為後可也安于曰與其害于民寧我獨死懼見攻必傷害民請以我說趙孟不可秋七月范氏中行氏伐趙氏之宮趙鞅奔晉陽晉人圍之穀梁傳以者不以者也叛直叛也鞅入晉陽以拒范中行而直書曰叛者惟辟作威邯鄲午無罪而趙鞅專殺不忌其心已無君矣及荀范伐之鞅不訴於君而擅興晉陽之甲非叛而何土地人民皆君所有也鞅始欲奪邯鄲之民以自封殖終則據君之邑與同列相攻使得逃於王法則亂賊無所懼矣冬晉荀寅士吉射入于朝歌以叛荀寅下公羊有及字左傳范皋夷無寵于范吉射而欲為亂于范氏皋夷范氏側室子梁嬰父嬖于知文子文子荀躒文子欲以為卿韓簡子與中行文子相惡簡子不信也中行文子荀寅魏襄子亦與范昭子相惡襄子曼多也昭子士吉射故五子謀五子范皋夷梁嬰父荀躒韓不信魏曼多將逐荀寅而以梁嬰父代之逐范吉射而以范皋夷代之荀躒言于晉侯曰君命大臣始禍者死載書在河為盟書沈之河今三臣始禍而獨逐鞅刑已不鈞矣請皆逐之冬十一月荀躒韓不信魏曼多奉公以伐范氏中行氏弗克二子將伐公齊髙彊曰三折肱知為良醫彊子尾子昭十年奔魯遂適晉言歷疾痛多然後深知良醫治療之法唯伐君為不可民弗與也我以伐君在此矣三家未睦三家知韓魏可盡克也克之君將誰與若先伐君是使睦也弗聽遂伐公國人助公二子敗從而伐之丁未荀寅士吉射奔朝歌人臣不忌其君未有不終於亂者也晉大夫不忌其君為日已久自衛孫林父逐君晉卿實為之主其後意如出君又從而把持之翼助他國之亂臣皆有欲為亂之心也而其君冥然不悟一聽其所為及是而三卿俱叛豈一朝一夕之故哉晉趙鞅歸于晉左傳韓魏以趙氏為請十二月辛未趙鞅入于絳盟于公宮公羊傳此叛也其言歸何以地正國也其以地正國奈何晉趙鞅取晉陽之甲以逐荀寅與士吉射荀寅與士吉射者曷為者也君側之惡人也此逐君側之惡人曷為以叛言之無君命也穀梁傳此叛也其以歸言之何也貴其以地反也以晉陽歸晉貴其以地反則是大利也非大利也許悔過也許悔過則何以言叛也以地正國也以地正國則何以言叛其入無君命也歸易辭也韓魏為之請晉侯許之復而寅與吉射去國出奔無有難之者故其歸為易春秋書之以著叛逆之臣安然歸國見晉之無人也叛臣至於書歸則佚賊不足録矣先儒以歸為善辭遂謂鞅有叛迹而無叛心非也衛孫林父亦書歸何善之有薛弒其君比稱國以弒與晉州蒲莒庶其吳僚同國小而其事失傳無可考矣附録左傳初衛公叔文子朝而請享靈公欲令公臨其家退見史鰌而告之史鰌曰子必禍矣子富而君貪罪其及子乎文子曰然吾不先告子是吾罪也君既許我矣其若之何史鰌曰無害子臣可以免言能執臣禮富而能臣必免于難上下同之言尊卑皆然戌也驕其亡乎戌文子之子富而不驕者鮮吾唯子之見驕而不亡者未之有也戌必與焉及文子卒衛侯始惡于公叔戌以其富也公叔戌又將去夫人之黨靈公夫人南子黨宋朝之徒夫人訴之曰戌將為亂十有四年春衛公叔戌來奔衛趙陽出奔宋衛趙陽公羊穀梁作晉趙陽左傳十四年春衛侯逐公叔戌與其黨故趙陽奔宋戌來奔終前傳史魚之言附録左傳梁嬰父惡董安于謂知文子曰不殺安于使終為政于趙氏趙氏必得晉國盍以其先發難也討于趙氏文子使告于趙孟曰范中行氏雖信為亂安于則發之是安于與謀亂也晉國有命始禍者死二子既伏其罪矣敢以告告使討安于趙孟患之安于曰我死而晉國寧趙氏定將焉用生人誰不死吾死莫矣乃縊而死趙孟尸諸市而告于知氏曰主命戮罪人安于既伏其罪矣敢以告知伯從趙孟盟知伯荀躒而後趙氏定祀安于于廟趙氏廟二月辛巳楚公子結陳公孫他人帥師滅頓以頓子牂歸二月公羊作三月孫公羊作子牂公羊作牄左傳頓子牂欲事晉背楚而絶陳好二月楚滅頓楚患列國百餘年柏舉既敗其威始戢諸侯皆二而陳猶比而從之至是國勢漸復以頓棄楚即晉與召陵之會而陳舊嘗圍頓與之有怨遂連兵滅之以動諸侯自是楚威復振滅胡疆蔡克戎蠻以通少習脅晉而晉至以京師事楚越十有八年及湣公之身而為楚所滅矣春秋書之以罪楚之肆虐而陳助彊滅鄰實自斃也夏衛北宮結來奔左傳夏衛北宮結來奔公叔戌之故也五月於越敗吳于檇李吳子光卒檇公羊作醉檇李杜注吳郡嘉興縣南醉李城今檇李城在浙江嘉興縣南左傳吳伐越報五年越入吳越子句踐禦之句踐允常子陳于檇李句踐患吳之整也使死士再禽焉不動使死士再掠陳如髙固入晉師桀石投人禽之以徇齊壘使罪人三行屬劍于頸以劍注頸而辭曰二君有治治軍旅臣奸旗鼓犯軍令不敏于君之行前不敢逃刑敢歸死遂自剄也師屬之目越子因而伐之大敗之靈姑浮以戈擊闔廬姑浮越大夫闔廬傷將指取其一屨其足大指見斬遂失屨姑浮取之還卒于陘去檇李七里釋經所以不書滅夫差使人立于庭夫差闔廬嗣子苟出入必謂己曰夫差而忘越王之殺而父乎則對曰唯不敢忘三年乃報越後三年哀元年書敗詐戰也繫卒於敗下見以傷卒不書滅還兵而隕非陳殁者比去檇李未逺故不地公會齊侯衛侯于牽牽公羊作堅又作掔杜注魏郡黎陽縣東北有牽城今故牽城在直隸內黃縣之西南濬縣之北左傳晉人圍朝歌公會齊侯衛侯于脾上梁之閒脾上梁閒柱注即牽謀救范中行氏齊魯叛晉故助范中行也析成鮒小王桃甲率狄師以襲晉二子晉大夫范中行氏之黨戰于絳中不克而還士鮒奔周小王桃甲入于朝歌公至自會秋齊侯宋公會于洮左傳秋齊侯宋公會于洮范氏故也謀救范氏衛鄭魯皆與齊盟惟宋尚未絶晉至是始為此會蓋亦從於齊也傳謂牽洮二會皆謀救范中行氏是時衛有公叔戌之難宋有公子辰之難齊景不能為二國定亂乃合謀以助晉之叛臣衛宋不能自治其叛臣而惟齊之從黨逆奬亂世變不可復問矣此春秋降為戰國之自也天王使石尚來歸脤周魯之交止此書天王止此公羊傳石尚者何天子之士也天子上士以名氏通脤者何俎實也實俎肉也腥曰脤熟曰膰穀梁傳脤者何也俎實也祭肉也生曰脤熟曰膰其辭石尚士也辭猶書也何以知其士也天子之大夫不名石尚欲書春秋欲著名于春秋諫曰久矣周之不行禮于魯也請行脤貴復正也祭肉曰脤禮諸侯入朝助祭然後受俎實周衰列國職貢不修祀事不相而特使石尚歸脤於魯者蓋晉霸已失王室無所恃賴故借此以親同姓之國自是王使不見於經蓋周室益微使命不復加於諸侯矣衛世子蒯聵出奔宋左傳衛侯為夫人南子召宋朝南子宋女也朝宋公子舊通于南子在宋呼之會于洮大子蒯聵獻盂于齊過宋野蒯聵衛靈公大子盂杜注邑名就會獻之故自衛行而過宋邑野人歌之曰既定爾婁豬盍歸吾艾豭婁豬求子豬也得牡則定以喻南子艾老也豭牡豕以喻宋朝大子羞之謂戲陽速曰從我而朝少君速大子家臣少君南子少君見我我顧乃殺之速曰諾乃朝夫人夫人見大子大子三顧速不進夫人見其色啼而走見大子色變知欲殺己曰蒯聵將殺余公執其手以登臺大子奔宋盡逐其黨故公孟彄出奔鄭自鄭奔齊大子告人曰戲陽速禍余戲陽速告人曰大子則禍余大子無道使余殺其母余不許將戕于余若殺夫人將以余說余是故許而弗為以紓余死諺曰民保于信吾以信義也使義可信不必信言蒯聵出奔書世子罪靈公也南子之惡甚矣其欲去世子如哀姜亂魯驪姬亂晉蓋惡其斥己之淫而以欲弒誣之靈公惑於其譖不能明辨致使奔宋宋南子家也使蒯聵果負謀殺南子之名以出乃敢奔其母家乎以此知左氏所記特南子之讒言非實録也衛公孟彄出奔鄭宋公之弟辰自蕭來奔辰奔而入叛叛而復奔三書宋公之弟著其失弟道又以見宋國之無政也書自蕭罪據邑也書來奔譏納叛也大搜于比蒲書搜止此春秋田狩之事公行者必書公公觀魚于棠公狩于郎皆是也自昭之搜紅政在三桓搜田之禮雖公自行皆不曰公觀下書邾子來會則公親搜明矣而不書公足以知公之不得為政而大夫專國也邾子來會公諸侯相見於郤地曰會今公搜於國內而邾子來會非其地也此與公及齊侯遇于穀蕭叔朝公同來者既非受者亦失交譏之也城莒父及霄莒父霄皆魯邑在今莒州境譏勞民與城諸防城諸鄆同例是歲無冬史闕文附録左傳冬十二月晉人敗范中行氏之師于潞潞晉地獲籍秦髙彊二子黨范氏者終景王言籍父無後又敗鄭師及范氏之師于百泉鄭助范氏故并敗之百泉衛地在今河南衛輝府西北蘇門山下衛源也十有五年春王正月邾子來朝邾朝止此左傳十五年春邾隱公來朝隱公邾子益子貢觀焉邾子執玉髙其容仰公受玉卑其容俯玉朝者之贄子貢曰以禮觀之二君者皆有死亡焉夫禮死生存亡之體也將左右周旋進退俯仰于是乎取之朝祀喪戎于是乎觀之今正月相朝而皆不度不合法度心已亡矣嘉事不體何以能久嘉事朝禮髙仰驕也卑俯替也驕近亂替近疾君為主其先亡乎為此年公薨哀七年以邾子益歸傳邾子以前會為未成禮於歲首復朝未幾奔魯之喪蓋削弱已甚又齊魯同盟晉霸既失邾無所恃故懼魯而卑屈至此鼷鼠食郊牛牛死改卜牛公羊傳曷為不言其所食據食角漫也穀梁傳不敬莫大焉不敬故天災最甚二月辛丑楚子滅胡以胡子豹歸左傳吳之入楚也在四年胡子盡俘楚邑之近胡者楚既定胡子豹又不事楚曰存亡有命事楚何為多取費焉二月楚滅胡召陵之侵頓胡之君皆與是後楚有吳患不能報前年滅頓今復滅胡蓋不得逞於中國而吞噬小弱以快其宿憾也夏五月辛亥郊公羊傳曷為以夏五月郊據魯郊當卜春三正也又養牲于滌宮不過三月三卜之運也運轉也已卜春三正不吉復轉卜也夏三月周五月得二吉故五月郊也壬申公薨于髙寢左傳夏五月壬申公薨仲尼曰賜不幸言而中是使賜多言者也穀梁傳髙寢非正也髙寢宮名定公乘昭公之後政在季氏值陽虎既奔三桓亦微孔子為政綱紀粗立正可以有為之時而惛於女樂不竟其用至其末年會牽會洮城莒父城霄無非助亂勞民之舉魯之益弱宜矣鄭罕達帥師伐宋罕公羊作軒左傳鄭罕達敗宋師于老丘罕達子齹之子老丘杜注宋地今河南陳留縣北有老丘城宋公子地奔鄭鄭為之伐宋欲取地以居之自此二國構兵與隱公初年公子馮事正相類蓋霸統既絶諸侯無所繫屬各競其私而莫之能禁也齊侯衛侯次于渠蒢渠蒢公羊作籧蒢宋地左傳齊侯衛侯次于籧拿謀救宋也籧拿即渠蒢五氏垂葭之次皆為謀晉至是復出兵觀望而明年遂有伐晉之舉左氏以為救宋非也鄭從齊方堅齊得衛得魯皆鄭謀之最後宋始附齊其交未久齊不應救宋以仇鄭且鄭非彊國合齊衛以敵之亦何懼而不果哉邾子來奔喪諸侯始奔喪公羊傳其言來奔喪何奔喪非禮也穀梁傳喪急故以奔言之奔喪之制日行百里故傳言急所以申匍匐之情也周衰小國以事天子之禮事大國天子崩葬諸侯皆無奔喪會葬之事而魯君嘗奔齊晉之喪會楚之葬經不書諱之也邾子滕子來奔喪會葬而皆書者志其禮之僭也秋七月壬申姒氏卒姒穀梁作弋左傳秋七月壬申姒氏卒不稱夫人不赴且不祔也公羊傳姒氏者何哀公之母也何以不稱夫人哀未君也穀梁傳妾辭也不言夫人薨哀公之母也成風敬嬴皆書薨書夫人而定姒不書夫人書卒或謂哀公初立未成君又喪在殯不及尊其母故魯史所書如是理或然也八月庚辰朔日有食之九月滕子來會葬丁巳葬我君定公雨不克葬戊午日下昃乃克葬昃穀梁作稷左傳葬定公雨不克襄事禮也襄成也雨而成事若汲汲于欲葬穀梁傳葬既有日不為雨止禮也雨不克葬喪不以制也乃急辭也不足乎日之辭也見宣八年葬敬嬴傳國君葬具無不備故不為雨止雨不克葬譏不能葬也事與宣公葬敬嬴同葬敬嬴言日中而克葬此言日下昃乃克葬日中則裕於日昃矣故穀梁子曰乃急辭也辛巳葬定姒左傳葬定姒不稱小君不成喪也公未葬而夫人薨不赴不祔故不稱小君反哭于寢故書葬公羊傳定姒何以書葬未踰年之君也哀未踰年有子則廟廟則書葬葬不稱小君不備夫人之禮著其實也禮竝有喪葬則先母而後父今定公薨在五月姒氏卒在七月喪不同月葬各有期是以先葬定公若同月則定姒當先葬矣冬城漆左傳冬城漆書不時告也實以秋城冬乃告廟二喪葬事畢又興土功其困民也甚矣日講春秋解義卷六十
