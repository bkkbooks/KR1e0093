body:
  text: 欽定四庫全書日講春秋解義卷十二莊公二十年春王二月夫人薑氏如莒穀梁傳婦人既嫁不踰竟踰竟非正也婦人既嫁不踰境父母沒不得歸寧文薑十五年如齊尚為越禮况頻年如莒乎文薑為禽獸之行與聞乎弒其如莒何足深責而聖人備書於經痛莊公君國二十年尚不能防間其母任其蕩檢踰間至於此極也記曰禮禁亂之所自生猶防止水之所自來也以舊防為無所用而壞之者必有水敗以舊禮為無所用而去之者必有亂患信哉附録左傳二十年春鄭伯和王室不克執燕仲父南燕伯夏鄭伯遂以王歸王處于櫟秋王及鄭伯入于塢塢王所取鄭邑遂入成周取其寶器而還冬王子頽享五大夫樂及遍舞遍舞六代之樂雲門大卷大咸大磬大夏大濩大武是也鄭伯聞之見虢叔曰叔虢公字寡人聞之哀樂失時殃咎必至今王子頽歌舞不倦樂禍也夫司寇行戮君為之不舉去盛饌而况敢樂禍乎姦王之位禍孰大焉臨禍忘憂憂必及之盍納王乎虢公曰寡人之願也夏齊大災公羊傳大災者何大瘠也瘠病也大瘠者何癘也癘民疾疫也何以書記災也外災不書此何以書及我也穀梁傳其志以甚也天火曰災來告故書經所書宋災陳災宋衛陳鄭災皆不言大此獨書大舊史從來告之辭而孔子因之也秋七月冬齊人伐戎穀梁作伐我周有子頽之亂齊桓始霸若罔聞知鄭伯虢公胥命于弭討亂殺子頽王入于王城齊皆不預去年伐魯今年伐戎大率逐利以自私於王室何有蓋其志在圖霸謀先自固國𫝑之張必自近始故深結魯宋並吞談遂耀武郳戎於王室有不暇顧耳此仲尼之徒所以羞稱五霸也二十有一年春王正月夏五月辛酉鄭伯突卒左傳二十一年春胥命于弭鄭虢相命弭杜注鄭地當在今河南密縣境夏同伐王城鄭伯將王自圉門入虢叔自北門入殺王子頽及五大夫鄭伯享王于闕西辟闕象魏也西辟闕之西偏樂備備六代之樂王與之武公之略自虎牢以東略界也武公舊竟後失其地故惠王復與之虎牢杜注河南成皋縣今河南汜水縣西有虎牢城原伯曰原伯原莊公鄭伯效尤言效子頽舞遍樂其亦將有咎五月鄭厲公卒春秋自突歸于鄭之後其出奔蔡入于櫟雖書名而皆繫以爵以突雖篡而實君雖君而實篡不沒其實也自入櫟以後凡與諸侯會盟侵伐者皆突而忽亹儀無見焉舊史備其卒葬孔子安得而削之乎然備記其始終亦所以著王法不行亂賊壽終以為居正而不能保者之戒也秋七月戊戌夫人薑氏薨穀梁傳婦人弗目也弗目謂不言其地也婦人無外事居有常所故薨不書地文薑之惡極矣而卒葬一用小君之禮此魯之禍所以未艾也附録左傳王巡虢守虢公為王宮于玤玤杜注虢地在今河南澠池縣界王與之酒泉酒泉杜注周邑今陜西同州有甘泉出匱谷中造酒尤美名酒泉鄭伯之享王也王以后之鞶鑑豫之后王后也鞶帶而以鑑為飾也虢公請器王豫之爵爵飲酒器鄭伯由是始惡于王鄭伯厲公子文公為僖二十四年鄭執王使張本冬王歸自虢冬十有二月葬鄭厲公鄭突與虢公討子頽定惠王勳在王室而不免諡為厲以此見周室雖衰公議尚在臣子私諡不敢妄加美名古意猶可考也二十有二年春王正月肆大眚眚公羊作省公羊傳肆者何跌也跌過也大省者何災省也肆大省何以書譏何譏爾譏始忌省也省日忌吉事不忌凶事時魯有夫人之喪乃以省日忌不哭故譏之穀梁傳肆失也眚災也災紀也失故也紀治理也有罪當治理之今失之者以文薑之故為嫌天子之葬也文薑罪應誅絶須赦而後得葬不赦而葬則嫌天子不許之葬矣所以舉一國之大惡皆赦除之使文薑亦得以除其罪也肆大眚譏失刑也舜典眚災肆赦乃不幸而過誤者易曰君子以赦過宥罪過乃赦之罪則少寬宥焉耳周官三宥三赦皆情之可原孽非己作者未聞肆大眚也大眚皆肆則廢天討虧國典縱有罪虐無辜惡人幸以免矣諸葛亮曰治世以大德不以小惠其治蜀軍旅數興而赦不妄下蜀人久而歌思如周人之思召公也蓋得春秋之旨矣癸丑葬我小君文薑公羊傳文薑者何莊公之母也穀梁傳小君非君也其曰君何也以其為公配可以言小君也文薑孫齊不稱薑氏後此則一仍其恆稱何也魯之臣子既不能討莊公又不能以大義絶之而生則縱其所為死則葬之備禮著於史册者固不可得而易矣婦人生無爵從夫之爵死無諡從夫之諡魯夫人别為諡自文薑始豈非以淫亂弒逆不敢以先君之諡配之而然與其後魯夫人皆别作諡不察其由違禮害義甚矣陳人殺其公子御寇御公羊穀梁俱作禦此書專殺之始左傳二十二年春陳人殺其大子御寇宣公大子也陳人惡殺太子之名故以公子告陳公子完與顓孫奔齊完顓孫皆御寇黨顓孫自齊來奔齊侯使敬仲為卿敬仲完字辭曰羇旅之臣幸若獲宥及于寬政赦其不間于教訓而免于罪戾弛于負擔弛去離也君之惠也所獲多矣敢辱高位以速官謗請以死告詩云翹翹車乘招我以弓豈不欲往畏我友朋逸詩也翹翹逺貌古者聘士以弓言雖貪顯命懼為朋友所譏責使為工正掌百工之官飲桓公酒樂公曰以火繼之辭曰臣卜其晝未卜其夜不敢君子曰酒以成禮不繼以淫義也以君成禮弗納于淫仁也初懿氏卜妻敬仲懿氏陳大夫其妻占之曰吉是謂鳳皇于飛和鳴鏘鏘鳳皇雌雄俱飛相和而鳴鏘鏘然猶敬仲夫妻相隨適齊有聲譽有媯之後將育于薑媯陳姓薑齊姓五世其昌並于正卿八世之後莫之與京京大也陳厲公蔡出也蔡女所出故蔡人殺五父而立之五父陳他也生敬仲其少也周史有以周易見陳侯者陳侯使筮之遇觀坤下巽上觀之否坤下乾上否觀六四爻變而為否曰是謂觀國之光利用賓于王此易觀卦六四爻辭此其代陳有國乎不在此其在異國非此其身在其子孫光遠而自他有耀者也坤土也巽風也乾天也風為天于土上巽變為乾故云風為天六四爻位在坤上坤為土故云于土上山也互體正卦三四五爻為艮變卦二三四爻亦為艮故云山也有山之材而照之以天光于是乎居土上山則材之所生上有乾下有坤故言居土上照之以天光故曰觀國之光利用賓于王四爻為諸侯變而之乾有國朝王之象庭實旅百奉之以玉帛天地之美具焉故曰利用賓于王艮為門庭乾為金玉坤為布帛諸侯朝王陳贄幣之象旅陳也百言物備猶有觀焉故曰其在後乎觀非在己之言故知在子孫風行而著于土巽在坤上故為著土故曰其在異國乎若在異國必薑姓也薑大嶽之後也薑姓之先為堯四嶽山嶽則配天物莫能兩大陳衰此其昌乎變而象艮故知當興于大嶽之後及陳之初亡也昭八年楚滅陳陳桓子始大于齊桓子敬仲五世孫陳無宇其後亡也哀十七年楚復滅陳成子得政成子陳常也敬仲八世孫穀梁傳言公子而不言大夫公子未命為大夫也其曰公子何也公子之重視大夫命以執公子大夫既命得執公子之禮惟天子得奉天命而專生殺故二百四十年書殺大夫者四十有七皆諸侯也蓋諸侯之大夫皆命於天子而不得專命大夫有罪當請於天子而不得專殺春秋之世國無大小其卿大夫皆專命之有罪無罪皆專殺之公子之重視大夫故備書以著其罪也其專殺稱君者獨出於其君之意而大夫國人不與焉如晉侯殺其世子申生是也稱國者君與當國大臣主之如鄭殺其大夫申侯是也稱人義有二一則國亂無政衆人擅殺而不出於君陳人之殺御寇是也其一弒君之賊人人得而誅之背叛之臣國人所同惡如衛人殺州吁鄭人殺良霄是也其見殺者所稱亦不一或稱大夫或稱公子或稱大夫公子稱公子者公子而非大夫也稱大夫者大夫而非公子也稱大夫公子者公子而為大夫者也夏五月春秋無事書首時未有書五月者或謂下有事而文脫或四訛而為五也何休謂譏莊公娶讎女不可奉先祖四時祭祀猶五月不宜首時則鑿矣秋七月丙申及齊高傒盟于防公羊傳齊高傒者何貴大夫也曷為就吾微者而盟公也公則曷為不言公諱與大夫盟也穀梁傳不言公高傒伉也驕伉與公敵體恥之故不書公高傒齊貴卿也魯無使微者與盟之理蓋公也諱不言公以謀娶仇人之女而與大夫要盟惡莫大焉故隱之冬公如齊納幣公羊傳納幣不書此何以書譏何譏爾親納幣非禮也穀梁傳納幣大夫之事也禮有納采采擇女之德性也其禮用鴈為贄有問名問女名而卜之有納徵徵成也納幣以成昏有告期告迎期四者備而後娶禮也公之親納幣非禮也故譏之納幣大夫之事也而公親之蓋齊疑昏議故自往與要言也娶夫人以承宗廟也先君見戕而娶讎女茍有人心者忍此乎至在喪而圖昏又不足責矣二十有三年春公至自齊公羊傳桓之盟不日其會不致信之也此之桓國何以致危之也何危爾公一陳他也公如齊淫與陳他相似齊桓之編莊公與之會盟遇伐救者九皆不書至獨三如齊書至以娶讎女而行乃返告於先君之廟其惡極矣祭叔來聘穀梁傳其不言使何也天子之內臣也不正其外交故不與使也祭畿內之國祭叔王朝之大夫五十以伯仲周道也假聘禮以私行故不書使義與祭伯來朝而不言朝尹氏王子虎劉卷來訃而不書其爵同皆所以正私交之罪絶朋黨之萌也夏公如齊觀社左傳二十三年夏公如齊觀社非禮也曹劌諫曰不可夫禮所以整民也故會以訓上下之則制財用之節貢賦多少朝以正班爵之義帥長幼之序征伐以討其不然不然不用命諸侯有王從王事王有巡守以大習之大習朝會之禮非是君不舉矣君舉必書書而不法後嗣何觀公羊傳何以書譏何譏爾諸侯越竟觀社非禮也穀梁傳常事曰視非常曰觀觀無事之辭也以是為尸女也尸主也主為齊女往借觀社為辭無事不出竟齊因社祭而搜軍實以示威已為非禮莊公踰境往觀其失益大矣天子祀上帝諸侯會以受事焉不聞諸侯之相會祀也莊公蓋託名而往以堅昏約故穀梁氏以為尸女耳凡公出以朝及喪葬但書如而不言其事觀社非常故特書附録左傳晉桓莊之族逼桓叔莊伯之子孫強盛逼迫公室獻公患之士蒍曰士蒍晉大夫去富子富子二族之富強者則羣公子可謀也已公曰爾試其事士蒍與羣公子謀譖富子而去之公至自齊穀梁傳公如統言公出行之例往時正也致月故也如往月致月有懼焉爾荆人來聘楚交中國始此公羊傳荆何以稱人始能聘也穀梁傳善纍而後進之其曰人何也舉道不待再謂一舉而進之春秋於楚始書荆繼書荆人繼書楚子著其漸盛也楚邇年加兵於蔡鄭而聘使至魯蓋遠交近攻之術介人欲侵蕭而先朝魯秦人歸襚來聘而有河曲之師蓋魯為春秋望國而親於齊晉故介人來朝欲藉以為援秦楚來聘欲以間齊晉之交也公及齊侯遇于穀穀梁傳及者內為志焉爾遇者志相得也及者內為志蓋齊猶以昏議為疑故公汲汲而為此遇也書之以著莊公之不子而齊桓私意回惑不能以禮接人亦於是可見矣蕭叔朝公公羊傳其言朝公何公在外也言于穀朝公穀梁傳微國之君未爵命者其不言來于外也朝于廟正也于外非正也蕭宋之附庸穀齊地嘉禮不野合蕭叔朝公在齊之穀則非其所也朝必於廟公不辭而受之於穀亦過矣蓋交譏之秋丹桓宮楹左傳秋丹桓宮之楹公羊傳何以書譏何譏爾丹桓宮楹非禮也穀梁傳禮天子諸侯黝堊黝黑色凡塗飾皆言堊大夫倉士黈黈黃色丹楹非禮也楹柱也楹未有以丹飾者為將娶讎女欲夸示之而亂王制以瀆先君直書而惡見矣冬十有一月曹伯射姑卒十有二月甲寅公會齊侯盟于扈扈杜注鄭地在滎陽卷縣西北後漢志卷縣有扈城亭今河南原武縣西北扈亭是也公羊傳桓之盟不日此何以日危之也何危爾我二也魯子曰我二者非彼然我然也此盟亦要結姻好也魯求之愈急而齊許之愈緩蓋莊公為文薑所制必使娶於母家而齊女待年莊公時已三十有六矣故越禮不顧如此其亟耳二十有四年春王三月刻桓宮桷左傳二十四年春刻其桷桷椽也皆非禮也合上丹楹而發御孫諫曰御孫魯大夫臣聞之儉德之共也侈惡之大也先君有共德而君納諸大惡無乃不可乎公羊傳何以書譏何譏爾刻桓宮桷非禮也穀梁傳禮天子之桷斫之礱之斫削也礱磨也加密石焉又以細石磨之諸侯之桷斫之礱之大夫斫之士斫本刻桷非正也夫人所以崇宗廟也取非禮與非正而加之于宗廟以飾夫人非正也刻桓宮桷丹桓宮楹斥言桓宮以惡莊也不言新宮而直謂之桓宮以桓見殺于齊而飾其廟以榮讎國之女惡莊不子桷有斫礱未聞復刻鏤之也王制革制度曰畔其君討丹楹刻桷乃宮廟所未有之飾即無故而為此亦不容於王法矣况娶讎人之女以薦舍於禰廟而特為非禮之飾以誇耀之死者有知其怨恫當何如至五廟並列而獨崇飾於桓宮又其惡之淺者矣葬曹莊公夏公如齊逆女公羊傳何以書親迎禮也穀梁傳親迎恆事也不志此其志何也不正其親迎于齊也親迎者昏禮之常春秋常事不書此獨書之不正其親迎于齊也所謂常者其事非一如視朔則月事之常也搜狩則時事之常也郊祀雩祭之類則歲事之常也至於納幣逆女至歸之類昏姻之常也合禮為常常則不書若夫崩薨卒葬即位之類乃人道始終之大變即合禮亦書非親迎之比也秋公至自齊穀梁傳迎者行見諸舍見諸諸之也言瞻望夫人乘車先至非正也八月丁丑夫人薑氏入左傳秋哀薑至公羊傳其言入何難也其言日何難也其難奈何夫人不僂僂疾也齊人語不可使入言夫人稽留不肯疾順公意故不能使之即入與公有所約約謂約逺媵妾也然後入穀梁傳入者內弗受也日入惡入者也何用不受也以宗廟弗受也其以宗廟弗受何也取仇人子弟以薦舍于前薦進舍置其義不可受也不書至而書入不可以見乎宗廟也入者不順之辭以宗廟為不受也且昏義以正始為先公既親迎而不與夫人同至則夫道不正於始矣薑氏既歸而不從公以俱入則婦道不正於始矣弒閔遜邾之亂其兆己見此皆忘親越禮之所致也故春秋詳書其事以為後戒戊寅大夫宗婦覿用幣左傳公使宗婦覿用幣傳不言大夫唯舉非常非禮也御孫曰男贄大者玉帛公侯伯子男執玉諸侯世子附庸孤卿執帛小者禽鳥卿執羔大夫執雁士執雉以章物也章所執之物别貴賤女贄不過榛栗棗修以告虔也榛似栗而小修脯也今男女同贄是無别也男女之别國之大節也而由夫人亂之無乃不可乎公羊傳宗婦者何大夫之妻也覿者何見也用者何用者不宜用也見用幣非禮也然則曷用棗栗云乎腶修云乎穀梁傳覿見也禮大夫不見夫人不言及謂不言大夫及宗婦不正其行婦道謂見夫人乃宗婦之道故列數之也男子之贄羔雁雉腒士冬用雉夏用腒腒乾雉也夏用之備腐臭也婦人之贄棗栗腶修用幣非禮也用者不宜用者也大夫國體也國體謂為君股肱而行婦道惡之故謹而日之也何休曰禮夫人至大夫郊迎明日大夫宗婦皆見公事曰見私事曰覿見夫人禮也而以私言之夫人不可以見宗廟則亦不可以臨羣臣也且大夫宜見於廟宗婦宜見於宮中今男女並覿而又同贄亂男女之别自夫人之至始莊公自壞其防何怪夫人異日之躬為大惡哉春秋所書自盟防至此凡十有三事詞繁而不殺所以示正始之道者可謂深切著明矣附録左傳晉士蒍又與羣公子謀使殺遊氏之二子遊氏亦桓莊之族士蒍告晉侯曰可矣不過二年君必無患大水冬戎侵曹曹羈出奔陳赤歸于曹公羊傳曹羈者何曹大夫也曹無大夫此何以書賢也何賢乎曹羈戎將侵曹曹羈諫曰戎衆以無義君請勿自敵也曹伯曰不可三諫不從遂去之故君子以為得君臣之義也書法與突歸于鄭鄭忽出奔衛同故杜預知二傳之非而以羈為曹世子也莊公既葬羈嗣世一年矣而奔不稱爵以微弱不能君猶鄭忽之不稱爵也歸者易辭赤恃戎之力以篡國其歸為易猶突恃宋以篡而書歸也春秋於忽與羈皆繫國而書名以為居正者之戒郭公公羊穀梁並以赤歸于曹郭公連文為句公羊傳赤者何曹無赤者蓋郭公也郭公者何失地之君也穀梁傳赤蓋郭公也何為名也禮諸侯無外歸之義外歸非正也郭公之義本不可曉而公穀之説更不可通先儒有以為郭亡者公與亡字相近而偶誤耳管子之書曰齊桓公之郭問父老曰郭何故亡曰以其善善而惡惡也公曰若子之言乃賢君也何至於亡父老曰郭君善善而不能用惡惡而不能去所以亡也考其時與事謂之郭亡理或有之夫不知其善惡猶覬一旦而知之也既知其善而不能用則君子登進之路絶既知其惡而不能去則小人益肆行而無所忌矣春秋以郭之自亡書與梁亡同義二十有五年春陳侯使女叔來聘左傳二十五年春陳女叔來聘陳卿女氏叔其字也始結陳好也嘉之故不名穀梁傳其不名何也天子之命大夫也季友相魯原仲相陳二人有舊故各請於君通聘以結好此大夫交政於中國之漸也命大夫故不名魯單伯鄭祭仲陳女叔是也齊晉無命大夫蓋自恃疆大不復請命於王耳夏五月癸丑衛侯朔卒衛朔入國魯莊與有力焉未必不會其葬蓋朔搆殺其兄而逆天子之命故不書葬以不其罪之當討耳六月辛未朔日有食之鼓用牲于社左傳夏六月辛未朔日有食之鼓用牲于社非常也非常鼓之月辛未實七月朔置閏失所故致月錯惟正月之朔慝未作正月夏之四月周之六月謂正陽之月今書六月而傳云惟者明此月非正陽月也慝陰氣日有食之于是乎用幣于社伐鼓于朝食于正陽之月則諸侯用幣于社請救于上公伐鼓于朝退而自責以明陰不宜侵陽臣不宜掩君以示大義公羊傳日食則曷為鼓用牲于社求乎陰之道也求責求也以朱絲營社或曰脅之脅與責求同義社土地之主月土地之精月犯日故攻社以脅其本朱絲營之助陽抑陰也或曰為暗恐人犯之故營之社者土地之主尊也為日光盡天暗冥恐人犯歷之故營之穀梁傳言日言朔食正朔也鼓禮也用牲非禮也天子救日置五麾麾旌幡也陳五兵五鼓五兵矛戟鉞楯弓矢諸侯置三麾陳三鼓三兵大夫擊門士擊柝言充其陽也充實也凡有聲皆陽事以壓陰氣日月之食皆有常度古人遇日食必書者蓋深致其扶陽抑陰之旨言當恐懼修省而不敢忽也左氏謂唯正月之朔慝未作于是用幣于社伐鼓于朝非也夏書季秋日食有奏鼓之文豈獨正陽之月哉所以書者譏其不鼓于朝又用牲耳伯姬歸于杞穀梁傳其不言逆何也逆之道微無足道焉爾伯姬莊公女婚姻常事不書此何以書逆者非卿則名姓不登於史策見昏禮之日壞也內女適鄰國而為夫人則書歸適大夫則否别尊卑也其得禮者皆不書常事也秋大水鼓用牲于社于門左傳秋大水鼓用牲于社于門亦非常也凡天災有幣無牲非日月之眚不鼓公羊傳其言于社于門何于社禮也于門非禮也穀梁傳高下有水災曰大水既戒鼓而駭衆用牲可以已矣救日以鼓兵救水以鼓衆附録左傳晉士蒍使羣公子盡殺遊氏之族乃城聚而處之聚杜注晉邑冬晉侯圍聚盡殺羣公子冬公子友如陳此內大夫出䀻之始凡公及內卿往他國皆書如蓋外諸侯來魯者書朝外卿來魯者書聘則內書所如不言其事而自明矣隱桓莊之間上而周近而齊有來聘者矣魯未嘗有報聘者而女叔一來季友旋報繼又躬會原仲之葬則陳魯之交雖有君命而實出於季友原仲之私情不獨大夫漸張而季氏之專魯微兆己見於斯矣朱子於季友獨以為無狀誠論世知人之特識也二十有六年春公伐戎公羊無春字隱桓世有戎盟至莊始渝為魯之患今此伐戎為濟西之役也故無譏辭附録左傳二十六年春晉士蒍為大司空夏士蒍城絳以深其宫絳杜注晉所都也今山西絳縣史記是年晉始都絳夏公至自伐戎曹殺其大夫此專殺大夫之始公羊傳何以不名衆也曷為衆殺之不死于曹君者也君死乎位曰滅曷為不言其滅為曹羈諱也此蓋戰也何以不言戰為曹羈諱也以大夫即是曹羈按公穀此等傳皆出其所傳聞無可考證姑存其文耳他皆倣此穀梁傳言大夫而不稱名姓無命大夫也無命大夫而曰大夫賢也為曹羈崇也稱國以殺者國君與當國大夫共主之而不請於天子也不書名或曰非一人或曰不知其名也齊桓葵丘之會申明王禁曰無專殺大夫其視當時之諸侯可謂彼善於此矣秋公會宋人齊人伐徐徐杜注徐國在下邳僮縣東南括地志徐城縣西有大徐城即古徐國也今江南泗州北有徐城韓氏愈曰徐與秦俱出伯翳為羸姓昭五年楚人執徐子蓋子爵戎在徐州之域舊為魯患是年春公伐戎秋又伐徐必戎與徐相表裏以侵軼魯也故二國將卑師少而公獨親行齊桓致勤於魯宋又屢推宋主兵魯宋親附是以諸侯衆服而明年盟幽同心以相推戴與附録左傳秋虢人侵晉冬虢人又侵晉為傳明年晉將伐虢張本冬十有二月癸亥朔日有食之日講春秋解義卷十二
