body:
  text: 欽定四庫全書日講春秋解義卷六十四哀公附録魯史自此以下至十六年皆魯史記之文弟子欲存孔子卒故并録以續春秋小邾射以句繹來奔句繹杜注地名左𫝊小邾射以句繹來奔射小邾大夫春秋止于獲麟故射不在三叛人之數孔子弟子既續書魯策以繫于經丘明亦隨而𫝊之終于哀公以卒前事曰使季路要我吾無盟矣子路信誠人素服之故不須盟使子路子路辭季康子使冉有謂之曰千乘之國不信其盟而信子之言子何辱焉對曰魯有事于小邾不敢問故死其城下可也彼不臣而濟其言濟成也是義之也由弗能夏四月齊陳恆執其君置于舒州舒州今山東滕縣東南薛城是左𫝊齊簡公之在魯也闞止有寵焉簡公悼公陽生子壬闞止子我事在六年及即位使為政陳成子憚之驟顧諸朝成子陳常心不安故數顧之諸御鞅言于公曰鞅齊大夫陳闞不可竝也君其擇焉擇用一人弗聽子我夕夕視事陳逆殺人逢之陳逆子行陳氏宗也子我逢之遂執以入陳氏方睦宗族和使疾而遺之潘沐備酒肉焉使詐病因內潘沐并得內酒肉潘米汁可以沐頭饗守囚者醉而殺之而逃子我盟諸陳于陳宗失陳逆懼其反為患故盟之初陳豹欲為子我臣豹亦陳氏族使公孫言已言已介逹之已有喪而止既而言之曰有陳豹者長而上僂肩背僂望視目望陽事君子必得志欲為子臣吾憚其為人也恐多詐故緩以告子我曰何害是其在我也使為臣他日與之言政說遂有寵謂之曰我盡逐陳氏而立女若何對曰我逺于陳氏矣言已疏逺且其違者不過數人違不從也何盡逐焉遂告陳氏子行曰子行陳逆彼得君弗先必禍子子行舍子公宫子行逃而隱于陳氏今又隱于公宫夏五月壬申成子兄弟四乘如公成子之兄弟昭子莊簡子齒宣子夷穆子安廩丘子意兹芒子盈惠子得凡八人二人共一乘子我在幄幄帳也聼政之處出逆之遂入閉門成子入反閉門不納子我侍人禦之子我侍人子行殺侍人素在內故得殺之公與婦人飲酒于檀臺成子遷諸寢徙公使居正寢公執戈將擊之疑其欲作亂大史子餘曰非不利也將除害也成子出舍于庫以公怒故聞公猶怒將出曰何所無君子行抽劍曰需事之賊也誰非陳宗所不殺子者有如陳宗言子若欲出我必殺子乃止子我歸屬徒攻闈與大門闈宫中小門大門宫門也皆不勝乃出陳氏追之失道于弇中適豐丘弇中狹路豐丘杜注陳氏邑豐丘人執之以告殺諸郭關齊關名成子將殺大陸子方子方子我臣陳逆請而免之以公命取車于道子方取道中行人車及耐衆知而東之知其矯命奪車逐使東出雍門齊城門也陳豹與之車弗受曰逆為余請豹與余車余有私焉事子我而有私于其讎何以見魯衛之士𫝊言陳氏務施東郭賈奔衛賈即子方庚辰陳桓執公于舒州公曰吾早從鞅之言不及此悔不誅陳氏庚戌叔還卒五月庚申朔日有食之陳宗豎出奔楚宋向魋入于曹以叛曹杜注八年宋滅曹以為邑左𫝊宋桓魋之寵害于公恃寵驕盈公使夫人驟請享焉而將討之夫人景公母欲因享討之未及魋先謀公請以鞍易薄鞍杜注向魋邑薄杜注公邑欲因易邑為公享宴而作亂公曰不可薄宗邑也宗廟所在乃益鞍七邑而請享公焉僞喜于受賜以日中為期家備盡往甲兵之備公知之告皇野曰余長魋也少長育之皇野司馬子仲今將禍余請即救司馬子仲曰有臣不順神之所惡也而况人乎敢不承命不得左師不可左師向魋兄向巢也請以君命召之左師每食擊鐘聞鐘聲公曰夫子將食既食又奏奏樂公曰可矣以乘車往曰迹人來告曰主迹禽獸者逢澤有介麇焉逢澤杜注地理志云在滎陽開封縣東北逺疑非蓋宋都睢陽去開封四百餘里或宋都之旁别有逢澤不可考公曰雖魋未來得左師吾與之田若何皇野稱公命君憚告子難以遊戲煩大臣野曰嘗私焉君欲速故以乘車逆子與之乘至公告之故拜不能起司馬曰即皇野君與之言使公與要誓公曰所難子者上有天下有先君言不使禍難及子對曰魋之不共宋之禍也敢不唯命是聼司馬請瑞焉瑞符節以發兵以命其徒攻桓氏桓氏向魋其父兄故臣曰不可司馬故臣與桓魋無怨者其新臣曰從吾君之命遂攻之子頎騁而告桓司馬子頎桓魋弟桓司馬即魋也司馬欲入入攻君子車止之車亦魋弟曰不能事君而又伐國民不與也祗取死焉向魋遂入于曹以叛莒子狅卒六月宋向魋自曹出奔衛宋向巢來奔左𫝊六月使左師巢伐之欲質大夫以入焉巢不能克魋恐公怒欲得國內大夫為質還入國不能亦入于曹取質不能得大失故入曹劫曹人子弟而質之欲以自固魋曰不可既不能事君又得罪于民將若之何乃舍之舍曹子弟民遂叛之向魋奔衛向巢來奔宋公使止之曰寡人與子有言矣不可以絶向氏之祀辭曰臣之罪大盡滅桓氏可也若以先臣之故而使有後君之惠也若臣則不可以入矣司馬牛致其邑與圭焉而適齊牛桓魋弟也圭守邑符信向魋出于衛地公文氏攻之公文氏衛大夫求夏后氏之璜焉與之他玉而奔齊陳成子使為次卿司馬牛又致其邑焉而適吳不欲與魋同國吳人惡之而反趙簡子召之陳成子亦召之卒于魯郭門之外坑氏葬諸丘輿坑氏魯人也丘輿杜注泰山南城縣西北有輿城今山東費縣西輿城是録其卒葬所在愍賢者失所齊人弒其君壬于舒州左𫝊甲午齊陳恆弒其君壬于舒州壬簡公也孔丘三日齊而請伐齊三公曰魯為齊弱久矣子之伐之將若之何對曰陳恆弒其君民之不與者半以魯之衆加齊之半可克也公曰子告季孫孔子辭辭不告退而告人曰吾以從大夫之後也故不敢不言嘗為大夫而去故言後秋晉趙鞅帥師伐衛八月辛丑仲孫何忌卒左𫝊初孟孺子泄將圉馬于成泄孟懿子之子孟武伯也圉畜飬也成杜注孟氏邑成宰公孫宿不受曰孟孫為成之病不圉馬焉病謂民貧困孺子怒襲成從者不得入乃反成有司使孺子鞭之恨恚故鞭成有司之使人秋八月辛丑孟懿子卒成人奔喪弗內袒免哭于衢聽共請聽命共使弗許懼不歸不敢歸成為明年成叛𫝊冬陳宗豎自楚復入于陳陳人殺之陳轅買出奔楚有星孛饑十有五年春王正月成叛左𫝊十五年春成叛于齊武伯伐成不克遂城輸以逼成夏五月齊髙無㔻出奔北燕左𫝊夏楚子西子期伐吳及桐汭桐汭杜注宣城廣德縣西南有桐水出白石山西北入丹陽湖陳侯使公孫貞子弔焉弔為楚所伐及良而卒良杜注吳地將以尸入聘禮若賔死未將命則既斂于棺造于朝介將命吳子使大宰嚭勞且辭曰以水潦之不時無乃廩然隕大夫之尸廩然傾動貌以重寡君之憂寡君敢辭上介芋尹蓋對曰蓋陳大夫貞子上介寡君聞楚為不道薦伐吳國滅厥民人寡君使蓋備使弔君之下吏備猶副也無祿使人逢天之戚大命隕隊絶世于良廢日共積廢行道之日以共具殯斂所積聚之用一日遷次一日即遷次不敢留君命今君命逆使人曰無以尸造于門是我寡君之命委于草葬也且臣聞之曰事死如事生禮也于是乎有朝聘而終以尸將事之禮朝聘道死以尸行事又有朝聘而遭喪之禮遭所聘之喪若不以尸將命是遭喪而還也無乃不可乎以禮防民猶或踰之今大夫曰死而棄之是棄禮也其何以為諸侯主先民有言曰無穢虐士虐士死者備使奉尸將命苟我寡君之命逹于君所雖隕于深淵則天命也非君與涉人之過也吳人內之𫝊言芋尹蓋知禮鄭伯伐宋秋八月大雩左𫝊秋齊陳瓘如楚瓘陳恆之兄子玉也過衛仲由見之曰天或者以陳氏為斧斤既斫喪公室而他人有之不可知也其使終饗之亦不可知也若善魯以待時不亦可乎何必惡焉仲由事孔子故為魯言子玉曰然吾受命矣子使告我弟弟成子也晉趙鞅帥師伐衛冬晉侯伐鄭及齊平左𫝊冬及齊平子服景伯如齊子贛為介見公孫成公孫成成宰公孫宿也曰人皆臣人而有背人之心况齊人雖為子役其有不二乎言子叛魯齊人亦將叛子子周公之孫也多饗大利猶思不義利不可得而喪宗國將焉用之喪宗國謂以邑入齊使魯有危亡之禍成曰善哉吾不早聞命𫝊言仲尼之徒皆忠于魯國陳成子館客曰寡君使恆告曰寡人願事君如事衛君言衛與齊同好而魯未肯景伯揖子贛而進之對曰寡君之願也昔晉人伐衛在定八年齊為衛故伐晉冠氏喪車五百在定九年冠氏杜注陽平館陶縣因與衛地自濟以西禚媚杏以南書社五百二十五家為一杜籍書而致之吳人加敝邑以亂在八年齊因其病取歡與闡亦在八年寡君是以寒心若得視衛君之事君也則固所願也成子病之乃歸成公孫宿以其兵甲入于嬴嬴杜注齊邑衛公孟彄出奔齊左𫝊衛孔圉取大子蒯聵之姊生悝孔圉孔文子也蒯聵姊孔伯姬孔氏之豎渾良夫長而美孔文子卒通于內通伯姬大子在戚孔姬使之焉使良夫詣大子所大子與之言曰苟使我入獲國服冕乘軒三死無與冕大夫服軒大夫車三死死罪三與之盟為請于伯姬良夫為大子請閏月良夫與大子入舍于孔氏之外圃圃園昏二人蒙衣而乘二人大子與良夫䝉衣為婦人服也寺人羅御如孔氏孔氏之老欒寧問之稱姻妾以告自稱婚姻家妾遂入適伯姬氏既食孔伯姬杖戈而先大子與五人介輿豭從之輿豭豚欲以盟迫孔悝于厠強盟之孔氏専政故劫令逐輒遂劫以登臺欒寧將飲酒炙未熟聞亂使告季子季子子路也為孔氏邑宰召獲駕乘車召獲衛大夫駕乘車者不欲戰行爵食炙奉衛侯輒來奔季子將入遇子羔將出子羔衛大夫髙柴孔子弟子將出奔曰門已閉矣季子曰吾姑至焉子羔曰弗及不踐其難謂政不及已季子曰食焉不辟其難子羔遂出子路入及門公孫敢門焉守門曰無入為也言輒已出季子曰是公孫也求利焉而逃其難由不然利其祿必救其患有使者出乃入因門開而入曰大子焉用孔悝雖殺之必或繼之言已必繼孔悝為難攻大子且曰大子無勇若燔臺半必舍孔叔大子聞之懼下石乞盂黶敵子路二子蒯聵黨以戈擊之斷纓子路曰君子死冠不免不使冠在地結纓而死孔子聞衛亂曰柴也其來由也死矣孔悝立莊公莊公蒯聵也魯史書于明年春從告莊公害故政欲盡去之故政輒之臣先謂司徒瞞成曰寡人離病于外久矣子請亦嘗之歸告禇師比欲與之伐公不果比禇師聲子為明年瞞成奔起十有六年春王正月己卯衛世子蒯聵自戚入于衛衛侯輒來奔二月衛子還成出奔宋左𫝊十六年春瞞成禇師比出奔宋瞞成即子還成以伐莊公不果故奔衛侯使鄢武子告于周曰武子衛大夫肸也蒯聵得罪于君父君母逋竄于晉晉以王室之故不棄兄弟置諸河上河上戚也天誘其衷獲嗣守封焉使下臣肸敢告執事王使單平公對曰肸以嘉命來告余一人往謂叔父余嘉乃成世復爾祿次敬之哉方天之休言天方授爾以休弗敬弗休悔其可追𫝊終蒯瞆之事夏四月己丑孔丘卒仲尼既告老去位猶書卒者魯之君臣宗其聖德殊而異之魯襄二十二年生至今七十三也四月十八日乙丑無己丑己丑五月十二日日月必有誤孔子作春秋終于獲麟公羊穀梁經是也弟子欲記聖師之卒故採魯史記以續夫子之經而終于此丘明因隨而作𫝊終于哀公自此以下無復經矣左𫝊夏四月己丑孔丘卒公誄之曰旻天不弔不憖遺一老俾屏余一人以在位仁覆閔下故稱旻天弔恤也憖且也屏蔽也㷀㷀余在疚嗚呼哀哉尼父無自律疚病也律法也言喪尼父無以自為法子贛曰君其不沒于魯乎夫子之言曰禮失則昏名失則愆失志為昏失所為愆生不能用死而誄之非禮也稱一人非名也天子稱一人非諸侯之名君兩失之六月衛侯飲孔悝酒于平陽平陽杜注東郡燕縣東北有平陽亭今直隸滑縣韋城南有平陽城是也重酬之大夫皆有納焉納財賄也醉而送之夜半而遣之載伯姬于平陽而行載其母俱去及西門平陽門使二車反祏于西圃使副車還取廟主西圃孔氏廟所在祏藏主石函子伯季子初為孔氏臣新登于公升為大夫請追之遇載祏者殺而乘其車許公為反祏孔悝怪載祏者久不來使公為反逆之遇之曰與不仁人爭明無不勝必使先射射三發皆逺許為許為射之殪𫝊言子伯不仁所以死或以其車從從公為得祏于橐中孔悝出奔宋楚大子建之遇讒也自城父奔宋在昭十九年又辟華氏之亂于鄭在昭二十年鄭人甚善之又適晉與晉人謀襲鄭乃求復焉鄭人復之如初晉人使諜于子木請行而期焉請行襲鄭之期子木即建也子木暴虐于其私邑邑人訴之鄭人省之得晉諜焉遂殺子木其子曰勝在吳子西欲召之葉公曰葉公子髙沈諸梁也吾聞勝也詐而亂無乃害乎子西曰吾聞勝也信而勇不為不利舍諸邉竟使衛藩焉葉公曰周仁之謂信周親也率義之謂勇吾聞勝也好復言而求死士殆有私乎私謀復讎復言非信也期死非勇也期必也子必悔之弗從召之使處吳竟為白公白杜注楚邑汝隂褒信縣西南有白亭請伐鄭子西曰楚未節也言國新復政令尚無節度不然吾不忘也他日又請許之未起師晉人伐鄭楚救之與之盟勝怒曰鄭人在此讎不逺矣比子西于鄭人勝自厲劍子期之子平見之曰王孫何自厲也曰勝以直聞不告汝庸為直乎將以殺爾父平以告子西子西曰勝如卵余翼而長之以鳥為喻楚國第用士之次第我死令尹司馬非勝而誰勝聞之曰令尹之狂也得死乃非我子西不悛勝謂石乞曰石乞勝之徒王與二卿士二卿士子西子期皆五百人當之則可矣乞曰不可得也五百人不可得曰市南有熊宜僚者若得之可以當五百人矣乃從白公而見之與之言說告之故辭承之以劍按劍指其喉不動勝曰不為利諂不為威惕不泄人言以求媚者去之吳人伐慎慎杜注汝隂慎縣今江南潁上縣西北有慎城白公敗之請以戰備獻所得鎧杖兵器欲因獻用之以為亂許之遂作亂秋七月殺子西子期于朝而劫惠王子西以袂掩面而死慙于葉公子期曰昔者吾以力事君不可以弗終抉豫章以殺人而後死以效其多力豫章大木石乞曰焚庫弒王不然不濟白公曰不可弒王不祥焚庫無聚將何以守矣乞曰有楚國而治其民以敬事神可以得祥且有聚矣何患弗從葉公在蔡蔡遷州來楚并其地方城之外皆曰可以入矣子髙曰吾聞之以險徼幸者其求無饜偏重必離險猶惡也所求無饜則不安譬如物偏重則離敗欲須其斃而討之聞其殺齊管修也而後入管修楚賢大夫故齊管仲之後殺賢則失民白公欲以子閭為王子閭平王子啓五辭王者子閭不可遂劫以兵子閭曰王孫若安靖楚國匡正王室而後庇焉啓之願也敢不聽從若將専利以傾王室不顧楚國有死不能遂殺之而以王如髙府髙府楚别府石乞尹門為門尹圉公陽穴宫負王以如昭夫人之宫公陽楚大夫昭夫人王母越女葉公亦至及北門或遇之曰君胡不胄國人望君如望慈父母焉盜賊之矢若傷君是絶民望也若之何不胄乃胄而進又遇一人曰君胡胄國人望君如望嵗焉嵗年榖也日月以幾冀君來若見君面是得艾也艾安也民知不死其亦夫有奮心猶將旌君以徇于國旌表也而又掩面以絶民望不亦甚乎乃免胄而進言葉公得民心遇針尹固帥其屬將與白公子髙曰微二子者楚不國矣二子子西子期也柏舉之敗二子功多棄德從賊其可保乎乃從葉公使與國人以攻白公白公奔山而縊其徒微之微匿也生拘石乞而問白公之死焉對曰余知其死所而長者使余勿言長者謂白公也曰不言將烹乞曰此事克則為卿不克則烹固其所也何害乃烹石乞王孫燕奔頯黃氏燕勝弟頯黃杜注吳地在今寧國府境沈諸梁兼二事二事令尹司馬國寧乃使寧為令尹子西之子子國也使寬為司馬子期之子而老于葉𫝊終言之衛侯占夢嬖人以能占夢見愛求酒于大叔僖子僖子大叔遺不得與卜人比而告公曰君有大臣在西南隅弗去懼害託占卜夢而言乃逐大叔遺遺奔晉衛侯謂渾良夫曰吾繼先君而不得其器若之何國之寶器輒皆將去良夫代執火者而言曰將密謀屏左右疾與亡君皆君之子也召之而擇材焉可也召輒若不材器可得也輒若不材可廢其身因得其器豎告大子大子疾大子使五人輿豭從己劫公而彊盟之盟求必立已且請殺良夫公曰其盟免三死盟在十五年曰請三之後有罪殺之公曰諾哉左𫝊十七年春衛侯為虎幄于藉圃于藉田之圃新造幄幕皆以虎獸為飾成求令名者而與之始食焉大子請使良夫以良夫應為令名良夫乘衷甸兩牡衷甸一轅卿軍紫衣狐裘紫衣君服至袒裘不釋劍而食食而熱故偏袒亦不敬大子使牽以退數之以三罪而殺之三罪紫衣袒裘帶劍三月越子伐吳吳子禦之笠澤笠澤今江南吳縣西南太湖是也夾水而陳越子為左右句卒句卒鉤伍相著别為左右屯使夜或左或右鼓譟而進吳師分以禦之越子以三軍潜涉當吳中軍而鼓之吳師大亂遂敗之左右句卒為聲勢以分吳軍而三軍精卒并力擊其中軍故得勝也晉趙鞅使告于衛曰君之在晉也志父為主請君若大子來以免志父不然寡君其曰志父之為也謂已教使不來衛侯辭以難大子又使㭬之㭬訴父欲速得其處夏六月趙鞅圍衛齊國觀陳瓘救衛國觀國書之子得晉人之致師者子玉使服而見之釋囚服服其本服曰國子實執齊柄而命瓘曰無辟晉師豈敢廢命子又何辱言不須來致師自將往戰簡子曰我卜伐衛未卜與齊戰乃還畏子玊楚白公之亂陳人恃其聚而侵楚聚積聚也楚既寧將取陳麥楚子問帥于大師子榖與葉公諸梁子榖曰右領差車與左史老皆相令尹司馬以伐陳其可使也言此二人皆嘗輔相子西子期伐陳今復可使子髙曰率賤民慢之懼不用命焉右領左史皆楚賤官子榖曰觀丁父鄀俘也武王以為軍率是以克州蓼服隨唐大啓羣蠻彭仲爽申俘也文王以為令尹實縣申息朝陳蔡封畛于汝開封畛北至汝水唯其任也何賤之有子髙曰天命不諂諂疑也令尹有憾于陳十五年子西伐吳陳使貞子弔吳以此為恨天若亡之其必令尹之子是與君盍舍焉舍右領與左史臣懼右領與左史有二俘之賤而無其令德也王卜之武城尹吉武城尹子西子公孫朝使帥師取陳麥陳人御之敗遂圍陳秋七月己卯楚公孫朝帥師滅陳終鄭裨竈言五及鶉火陳卒亡王與葉公枚卜子良以為令尹枚卜不斥言所卜以令龜子良惠王弟沈尹朱曰吉過于其志志望也葉公曰王子而相國過將何為過相將為王也他日改卜子國而使為令尹子國寧也衛侯夢于北宫見人登昆吾之觀杜注衛有觀在于昆吾氏之虛今濮陽城中按濮陽即今直隸開州州西南有濮陽縣城城中有昆吾臺被髮北面而譟曰登此昆吾之虛綿綿生之瓜綿綿瓜初生也良夫言已有以小成大之功若瓜之初生謂使衛侯得國余為渾良夫叫天無辜本盟當免三死而并數一時之事為三罪殺之故自謂無辜公親筮之胥彌赦占之赦衛筮史曰不害與之邑置之而逃奔宋言衛侯無道卜人不敢以實對懼難而逃也衛侯貞卜正卜夢之吉凶其繇曰如魚竀尾竀赤也魚勞則尾赤衡流而方羊裔焉橫流方羊不能自安裔水邉言衛侯將若此魚大國滅之將亡闔門塞竇乃自後踰此皆繇辭冬十月晉復伐衛春伐未得志故入其郛將入城簡子曰止叔向有言曰怙亂滅國者無後不欲乘人之衰衛人出莊公而與晉平晉立襄公之孫般師而還十一月衛侯自鄄入般師出辟蒯聵也初公登城以望見戎州戎州杜注戎邑今山東曹縣有楚丘故城漢置已氏縣即戎州也問之以告公曰我姬姓也何戎之有焉翦之削壞其邑聚公使匠久久不休息公欲逐石圃石圃衛卿石惡從子未及而難作辛巳石圃因匠氏攻公公閉門而請弗許踰于北方而隊折股終如卜言乃自後踰戎州人攻之大子疾公子青踰從公青疾弟戎州人殺之公入于戎州已氏已氏戎州人姓初公自城上見已氏之妻髮美使髠之以為吕姜髢吕姜莊公夫人髢髲也既入焉而示之璧曰活我吾與女璧已氏曰殺女璧其焉往遂殺之而取其璧衛人復公孫般師而立之十二月齊人伐衛衛人請平立公子起起靈公子執般師以歸舍諸潞潞杜注齊邑公㑹齊侯盟于蒙齊侯簡公弟平公驁也蒙杜注在東莞蒙隂縣西今山東蒙隂縣西有故城孟武伯相齊侯稽首公拜齊人怒武伯曰非天子寡君無所稽首武伯問于髙柴曰諸侯盟誰執牛耳執牛耳尸盟者季羔曰鄫衍之役吳公子姑曹季羔髙柴也鄫衍在七年發陽之役衛石魋發陽鄖地在十二年石魋石曼姑之子武伯曰然則彘也彘武伯名也鄫衍則大國執發陽則小國執據時執者無常故武伯自以為可執宋皇瑗之子麇瑗宋右師有友曰田丙而奪其兄酁般邑以與之酁般愠而行告桓司馬之臣子儀克克在下邑不與魋亂故在子儀克適宋告夫人曰麇將納桓氏公問諸子仲子仲皇野初子仲將以杞姒之子非我為子為適子把姒子仲妻麇曰必立伯也伯非我兄是良材子仲怒弗從故對曰右師則老矣不識麇也言右師老不能為亂麇則不可知公執之執麇皇瑗奔晉召之召令還左𫝊十八年春宋殺皇瑗公聞其情復皇氏之族使皇緩為右師言宋景公無常也緩瑗從子巴人伐楚圍鄾鄾杜注楚邑今湖廣襄陽縣東北有鄾城初右司馬子國之卜也觀瞻曰如志子國未為令尹時卜為右司馬得吉兆如其志觀瞻楚開卜大夫觀從之後故命之命以為右司馬及巴師至將卜帥王曰寧如志何卜焉寧子國也使帥師而行請承承佐王曰寢尹工尹勤先君者也柏舉之役寢尹由于以背受戈工尹固執燧象奔吳師皆為先君勤勞三月楚公孫寧吳由于薳固敗巴師于鄾故封子國于析君子曰惠王知志知用其意夏書曰官占唯能蔽志昆命于元龜書大禹謨官占卜筮之官蔽斷也昆後也言當先斷意後用龜也其是之謂乎志曰聖人不煩卜筮惠王其有焉夏衛石圃逐其君起起奔齊衛侯輒自齊復歸逐石圃而復石魋與大叔遺皆蒯聵所逐左𫝊十九年春越人侵楚以誤吳也誤吳使不為備夏楚公子慶公孫寬追越師至冥冥杜注越地不及乃還秋楚沈諸梁伐東夷報越三夷男女及楚師盟于敖從越之夷三種敖杜注東夷地冬叔青如京師敬王崩故也言敬王能終其世終萇𢎞言東王必大克叔青叔還子左𫝊二十年春齊人來徴會夏會于廩丘為鄭故謀伐晉十五年晉伐鄭鄭人辭諸侯秋師還終叔向言晉公室卑吳公子慶忌驟諫吳子曰不改必亡弗聽出居于艾艾杜注吳邑豫章有艾縣今艾城在江西寧州西遂適楚聞越將伐吳冬請歸平越遂歸欲除不忠者以說于越吳人殺之十一月越圍吳趙孟降于喪食趙孟襄子無恤時有父簡子之喪楚隆曰楚隆襄子家臣三年之喪親昵之極也主又降之無乃有故乎趙孟曰黃池之役先主與吳王有質黃池在十三年先主簡子質盟信也曰好惡同之今越圍吳嗣子不廢舊業而敵之嗣子襄子自謂欲敵越救吳非晉之所能及也吾是以為降楚隆曰若使吳王知之若何趙孟曰可乎隆曰請嘗之乃往先造于越軍曰吳犯閒上國多矣聞君親討焉諸夏之人莫不欣喜唯恐君之志不從請入視之許之告于吳王曰寡君之老無恤使陪臣隆敢展謝其不共黃池之役君之先臣志父得承齊盟曰好惡同之今君在難無恤不敢憚勞非晉國之所能及也使陪臣敢展布之王拜稽首曰寡人不佞不能事越以為大夫憂拜命之辱與之一簞珠簞小笥使問趙孟曰句踐將生憂寡人寡人死之不得矣王曰溺人必笑吾將有問也以自喻所問不急猶溺人不知所為而反笑史黯何以得為君子史黯晉大夫蔡墨云不及四十年吳當亡吳王感問此也對曰黯也進不見惡退無謗言王曰宜哉左𫝊二十一年夏五月越人始來越既勝吳欲霸中國始遣使適魯秋八月公及齊侯邾子盟于顧顧杜注齊地今山東范縣東南有顧城齊人責稽首責十七年齊侯為公稽首不見答因歌之曰魯人之皋數年不覺使我髙蹈皋緩也髙蹈猶逺行也言魯人皋緩數年不知答齊稽首故使我髙蹈來為此㑹唯其儒書以為二國憂二國齊邾也言魯據周禮不肯答稽首令齊邾逺至是行也公先至于陽榖先期至齊閭丘息曰息閭丘明之後君辱舉玉趾以在寡君之軍羣臣將傳遽以告寡君比其復也君無乃勤為僕人之未次次舍也請除館于舟道舟道杜注齊地辭曰敢勤僕人左𫝊二十二年夏四月邾隱公自齊奔越曰吳為無道執父立子越人歸之大子革奔越邾隱公八年為吳所囚十年奔齊冬十一月丁卯越滅吳請使吳王居甬東甬東杜注越地㑹稽句章縣東海中洲也按海中洲即舟山今之定海縣縣東有翁山即甬東也辭曰孤老矣焉能事君乃縊越人以歸以其尸歸終史墨子胥之言也左𫝊二十三年春宋景曹卒景曹宋元公夫人小邾女季桓子外祖母季康子使冉有弔且送葬曰敝邑有社稷之事使肥與有職競焉肥康子名競遽也是以不得助執紼使求從輿人求冉有名輿衆也曰以肥之得備彌甥也彌逺也康子父之舅氏故稱彌甥有不腆先人之産馬使求薦諸夫人之宰其可以稱旌繁乎稱舉也繁馬飾繁纓也終樂祁之言政在季氏夏六月晉荀瑤伐齊荀瑶荀躒之孫知伯襄子髙無㔻帥師御之知伯視齊師馬駭遂驅之曰齊人知余旗其謂余畏而反也及壘而還將戰長武子請卜武子晉大夫知伯曰君告于天子而卜之以守龜于宗祧吉矣吾又何卜焉且齊人取我英丘英丘晉地君命瑶非敢耀武也治英丘也以辭伐罪足矣何必卜壬辰戰于犂丘犂丘杜注隰也今山東臨邑縣有犂丘亭齊師敗績知伯親禽顔庚顔庚齊大夫顔涿聚秋八月叔青如越始使越也越諸鞅來聘報叔青也左𫝊二十四年夏四月晉侯將伐齊使來乞師曰昔臧文仲以楚師伐齊取榖在僖二十六年宣叔以晉師伐齊取汶陽在成二年寡君欲徼福于周公願乞靈于臧氏以臧氏世勝齊故臧石帥師㑹之取廩丘臧石賓如之子軍吏令繕將進晉軍吏也繕治戰備萊章曰萊章齊大夫君卑政暴往嵗克敵禽顔庚今又勝都取廩丘天奉多矣又焉能進是躗言也躗過也役將班矣晉師乃還餼臧石牛生曰餼大史謝之曰晉大史以寡君之在行牢禮不度不如禮度敢展謝之終臧氏有後于魯邾子又無道越人執之以歸終子贛之言而立公子何何亦無道何大子革弟公子荆之母嬖荆哀公庶子將以為夫人使宗人釁夏獻其禮宗人禮官對曰無之公怒曰女為宗司立夫人國之大禮也何故無之對曰周公及武公娶于薛武公敖也孝惠娶于商孝公稱惠公弗皇商宋也自桓以下娶于齊桓公始娶文姜此禮也則有若以妾為夫人則固無其禮也公卒立之而以荆為大子國人始惡之惡公閏月公如越得大子適郢適郢越王大子得相親說也將妻公而多與之地公孫有山使告于季孫季孫懼使因大宰嚭而納賂焉乃止嚭故吳臣也季孫恐公因越討已故懼左𫝊二十五年夏五月庚辰衛侯出奔宋衛侯輒也衛侯為靈臺于藉圃與諸大夫飲酒焉禇師聲子襪而登席古者見君解襪公怒辭曰臣有疾異于人足有創若見之君將殼之殼嘔吐也是以不敢公愈怒大夫辭之不可共辭謝公公不可解禇師出公㦸其手手屈肘如㦸形曰必斷而足聞之禇師與司寇亥乘曰今日幸而後亡恐死以得亡為幸公之入也奪南氏邑南氏子南之子公孫彌牟而奪司寇亥政公使侍人納公文懿子之車于池懿子公文要公有忿使人投其車于池水中初衛人翦夏丁氏在十一年以其帑賜彭封彌子彭封彌子彌子瑕彌子飲公酒納夏戊之女嬖以為夫人其弟期大叔疾之從孫甥也期夏戊之子姊妹之孫為從孫甥與孫同列少畜于公以為司徒夫人寵衰期得罪公使三匠久公使優狡盟拳彌狡俳優名拳彌衛大夫使俳優盟之欲耻辱也而甚近信之故禇師比公孫彌牟公文要司寇亥司徒期因三匠與拳彌以作亂比襪登席者彌牟喪邑者要失車者亥奪政者期得罪者皆執利兵無者執斤斤工匠所執使拳彌入于公宫信近之故得入而自大子疾之宫譟以攻公鄄子士請禦之鄄子士衛大夫彌援其手曰子則勇矣將若君何不見先君乎君何所不逞欲先君蒯聵也亂不速奔故為戎州所殺且君嘗在外矣豈必不反當今不可衆怒難犯休而易閒也乃出將適蒲蒲杜注近晉邑今直隸長垣縣故蒲城是彌曰晉無信不可將適鄄鄄杜注齊晉界上邑彌詐不知謀故公信之彌曰齊晉爭我不可將適泠泠杜注近魯邑彌曰魯不足與請適城鉏以鉤越城鉏杜注近宋邑宋南近越轉相鉤牽越有君乃適城鉏彌曰衛盜不可知也請速自我始乃載寶以歸欺衛君言君以寶自隨將致衛盜請速行已為先發而因載寶歸衛也公為支離之卒支離陳名因祝史揮以侵衛揮衛祝史衛人病之懿子知之知揮為內閒見子之子之公孫彌牟文子也請逐揮文子曰無罪懿子曰彼好専利而妄夫見君之入也將先道焉若見君有入勢必道助之若逐之必出于南門而適君所雖知其為君閒不審察私共評之夫越新得諸侯將必請師焉揮在朝使吏遣諸其室難面逐之先逐其家揮出信弗內再宿為信五日乃館諸外里外里公所在遂有寵使如越請師請師伐衛求入六月公至自越前年行今還季康子孟武伯逆于五梧五梧杜注魯南鄙郭重僕為公僕見二子曰惡言多矣君請盡之二子不臣之言甚多欲使公盡聽之公宴于五梧武伯為祝祝上夀酒惡郭重曰何肥也訾毁其貌季孫曰請飲彘也以魯國之密邇仇讎臣是以不獲從君克免于大行又謂重也肥公曰是食言多矣能無肥乎以誚三桓之數食言飲酒不樂公與大夫始有惡為二十七年公孫邾起左𫝊二十六年夏五月叔孫舒帥師㑹越皋如后庸宋樂茷納衛侯舒武叔之子文子也皋如后庸越大夫樂茷宋司城子潞衛侯輒也文子欲納之文子彌牟懿子曰君愎而虐少待之必毒于民乃睦于子矣衛師侵外州大獲越納輒之師出禦之大敗衛師敗掘褚師定子之墓焚之于平莊之上定子褚師比之父也平莊陵名文子使王孫齊私于皋如曰齊衛大夫王孫賈之子昭子也子將大滅衛乎抑納君而已乎皋如曰寡君之命無他納衛君而已文子致衆而問焉曰君以蠻夷伐國國幾亡矣請納之衆曰勿納曰彌牟亡而有益請自北門出欲以觀衆心衆曰勿出重賂越人申開守陴而納公申重也開重門而嚴設守備欲以恐公使不敢入公不敢入師還立悼公悼公蒯聵庶弟公子黚也南氏相之以城鉏與越人公曰期則為此司徒期也令苟有怨于夫人者報之夫人期姊也怒期不得加戮故勑宫女令困苦期姊司徒期聘于越為悼公聘公攻而奪之幣期告王越王王命取之期以衆取之公怒殺期之甥之為大子者忿期而及其姊為夫人者遂復及夫人之子遂卒于越終言之也終效夷言死于夷宋景公無子取公孫周之子得與啓畜諸公宫周元公孫子髙也得昭公也啓得弟未有立焉于是皇緩為右師皇非我為大司馬皇懷為司徒皇懷非我從昆弟靈不緩為左師不緩子靈圍龜之後樂茷為司城茷樂溷子樂朱鉏為大司寇朱鉏樂挽子六卿三族降聽政三族皇靈樂也降和同也因大尹以達大尹近官有寵者六卿因之以自通逹于君大尹常不告而以其欲稱君命以令國人惡之司城欲去大尹左師曰縱之使盈其罪重而無基能無敝乎言勢重而無德以為基必敗冬十月公遊于空澤空澤杜注宋邑在今河南虞城縣東辛巳卒于連中連中館名大尹興空澤之士千甲甲士千人奉公自空桐入如沃宫奉公尸也空桐杜注梁國虞縣東南有地名空桐今虞城縣空桐澤有空桐亭沃宫宋都內宫名使召六子曰聞下有師君請六子畫畫計䇿六子至以甲劫之曰君有疾病請二三子盟乃盟于少寢之庭曰無為公室不利大尹立啓奉喪殯于大宫三日而後國人知之司城茷使宣言于國曰大尹惑蠱其君而専其利今君無疾而死死又匿之是無他矣大尹之罪也言大尹所弒得夢啓北首而寢于盧門之外盧門宋東門北首死象在門外失國也已為烏而集于其上咮加于南門尾加于桐門桐門北門曰余夢美必立大尹謀曰我不在盟少寢盟但以君命盟六鄉大尹不盟無乃逐我復盟之乎使祝為載書六子在唐盂唐盂杜注地名將盟之祝襄以載書告皇非我襄祝名皇非我因子潞門尹得左師謀曰子潞樂茷門尹得樂得民與我逐之乎皆歸授甲使徇于國曰大尹惑蠱其君以陵虐公室與我者救君者也衆曰與之大尹徇曰戴氏皇氏將不利公室戴氏即樂氏與我者無憂不富衆曰無别惡其號令與君無别戴氏皇氏欲伐公公謂啓樂得曰不可彼以陵公有罪我伐公則甚焉使國人施于大尹施罪于大尹大尹奉啓以奔楚乃立得司城為上卿盟曰三族共政無相害也衛出公自城鉏使以弓問子贛且曰吾其入乎子贛稽首受弓對曰臣不識也私于使者曰昔成公孫于陳僖二十八年衛成公奔楚遂適陳寧武子孫莊子為宛濮之盟而君入在僖二十八年獻公孫于齊在襄十四年子鮮子展為夷儀之盟而君入在襄二十六年今君再在孫矣謂十五年孫魯今又孫宋內不聞獻之親外不聞成之卿則賜不識所由入也詩曰無競惟人四方其順之詩周頌言無強惟得人也若得其人四方以為主而國于何有左𫝊二十七年春越子使后庸來聘且言邾田封于駘上欲使魯還邾田封竟至駘上二月盟于平陽平陽杜注西平陽孔氏穎達曰高平南有平陽縣在今山東鄒縣西南三子皆從季康子叔孫文子孟武伯皆從后庸盟康子病之言及子贛曰若在此吾不及此夫蓋子贛十二年嘗辭吳盟故思之武伯曰然何不召曰固將召之文子曰他日請念言季孫不能用子貢臨難而思之夏四月己亥季康子卒公弔焉降禮禮不備晉荀瑶帥師伐鄭次于桐丘鄭駟𢎞請救于齊𢎞駟歂子齊師將興陳成子屬孤子三日朝屬㑹死事者之子使朝三日以禮之設乘車兩馬繫五邑焉乘車兩馬大夫服又加之以五邑召顔涿聚之子晉曰隰之役而父死焉隰役在二十三年以國之多難未女恤也今君命女以是邑也服車而朝無廢前勞乃救鄭及留舒留舒杜注齊地今山東東阿縣西南有留舒城違榖七里榖人不知言其整違去也及濮雨不涉濮杜注水自陳留酸棗縣傍河東北經濟隂至髙平入濟子思曰子思國參大國在敝邑之宇下是以告急今師不行恐無及也成子衣製杖戈製雨衣也立于阪上馬不出者助之鞕之知伯聞之乃還畏其得衆心曰我卜伐鄭不卜敵齊使謂成子曰大夫陳子陳之自出陳之不祀鄭之罪也十七年楚滅陳非鄭之罪蓋知伯誣辭故寡君使瑶察陳衷焉衷善也謂大夫其恤陳乎若利本之顛瑶何有焉成子怒曰多陵人者皆不在知伯其能久乎中行文子告成子曰文子荀寅此時奔在齊有自晉師告寅者將為輕車千乘以厭齊師之門則可盡也成子曰寡君命恆曰無及寡無畏衆雖過千乘敢辟之乎將以子之命告寡君成子疑其有為晉之心也文子曰吾乃今知所以亡自恨己無知君子之謀也始衷終皆舉之而後入焉謀一事則當慮此三變然後入而行之所謂君子三思今我三不知而入之不亦難乎公患三桓之侈也欲以諸侯去之欲求諸侯師以逐三桓三桓亦患公之妄也故君臣多閒公游于陵阪遇孟武伯于孟氏之衢曰請有問于子余及死乎問可得以壽死否對曰臣無由知之三問卒辭不對公欲以越伐魯而去三桓秋八月甲戌公如公孫有陘氏有陘氏即有山氏因孫于邾乃遂如越國人施公孫有山氏以公自其家出故也終子贛之言君不沒于魯悼之四年晉荀瑶帥師圍鄭悼公哀公之子哀公出孫魯人立之未至鄭駟𢎞曰知伯愎而好勝早下之則可行也乃先保南里以待之保守也南里在城外知伯入南里門于桔柣之門鄭人俘酅魁壘酅魁壘晉士賂之以知政欲使反為鄭閉其口而死將門將攻鄭門知伯謂趙孟入之對曰主在此主謂知伯言何不自入也知伯曰惡而無勇何以為子惡貌醜也簡子廢嫡子伯魯而立襄子故知伯言其醜且無勇何以立為子對曰以能忍耻庶無害趙宗乎知伯不悛趙襄子由是惎知伯惎毒也遂喪之知伯貪而愎故韓魏反而喪之史記晉懿公之四年魯悼公之十四年知伯帥韓魏圍趙襄子于晉陽韓魏反與趙氏謀殺知伯于晉陽之下在春秋後二十七年日講春秋解義卷六十四
