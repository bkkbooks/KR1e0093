body:
  text: 欽定四庫全書日講春秋解義卷五十一昭公十有三年春叔弓帥師圍費左傳十三年春叔弓圍費前年南蒯以費叛故弗克敗焉不書諱之平子怒令見費人執之以為囚俘冶區夫曰區夫魯大夫非也若見費人寒者衣之飢者食之為之令主而共其乏困費來如歸南氏亡矣民將叛之誰與居邑若憚之以威懼之以怒民疾而叛為之聚也若諸侯皆然費人無歸不親南氏將焉入矣平子從之費人叛南氏費叛南氏在明年傳終言其效南蒯季氏家臣據邑以叛至命正卿舉大衆圍之若敵國然家臣強大夫弱也季孫以所惡於下者事其上而不忠於君南蒯則而象之不亦宜乎春秋之法不書內叛蓋尺地一民皆歸三家南蒯之叛叛季氏也季氏安得以叛治蒯哉然書圍費則其實不可掩矣季氏之私邑叛而使卿率師以討之己儼然若魯國之君此昭公之逐所以民不知君而安於季氏也夏四月楚公子比自晉歸于楚弒其君虔于乾溪溪穀梁作溪左傳楚子之為令尹也殺大司馬薳掩而取其室在襄三十年及即位奪薳居田居掩之族遷許而質許圍遷許在九年圍許大夫蔡洧有寵于王王之滅蔡也其父死焉楚滅蔡在十一年洧仕楚其父在國故死王使與于守而行使洧守國王行至乾溪申之會越大夫戮焉越大夫常壽過也申會在四年王奪鬬韋龜中犨又奪成然邑而使為郊尹蔓成然故事蔡公鬬韋龜令尹子文玄孫中犨杜注邑名成然韋龜子郊尹治郊竟大夫蔡公棄疾也故猶舊也韋龜以棄疾有當璧之命故使成然事之故薳氏之族及薳居許圍蔡洧蔓成然皆王所不禮也因羣喪職之族啓越大夫常壽過作亂圍固城克息舟城而居之息舟杜注楚邑城之堅固者一云固城息舟楚二邑觀起之死也其子從在蔡事朝吳曰今不封蔡蔡不封矣我請試之觀起死在襄二十二年朝吳故蔡大夫聲子之子觀從以父死怨楚故欲試作亂以蔡公之命召子干子晳二子皆靈王弟元年子干奔晉子晳奔鄭及郊而告之情告以蔡公不知謀強與之盟入襲蔡蔡公將食見之而逃不知其故驚起辟之觀從使子干食居蔡公之牀食其食坎用牲加書而速行偽與蔡公盟示衆以驗己徇于蔡曰已觀從也蔡公召二子將納之與之盟而遣之矣將師而從之詐言蔡公將以師助二子蔡人聚將執之執觀從辭曰失賊成軍而殺余何益賊謂二子言蔡公已成軍殺已不解亂乃釋之朝吳曰二三子若能死亡則如違之以待所濟違蔡公命若求安定則如與之以濟所欲與蔡公且違上何適而可上謂蔡公衆曰與之乃奉蔡公召二子而盟于鄧依陳蔡人以國國陳蔡而依之楚公子比公子黑肱公子棄疾蔓成然蔡朝吳帥陳蔡不羮許葉之師因四族之徒以入楚四族薳氏許圍蔡洧蔓成然及郊陳蔡欲為名故請為武軍欲築壘壁以示後人為復讎之名蔡公知之曰欲速且役病矣請藩而已乃藩為軍蔡公使須務牟與史猈先入因正僕人殺大子祿及公子罷敵須務牟史猈楚大夫蔡公之黨正僕大子近官祿罷敵皆靈王子公子比為王公子黑肱為令尹次于魚陂魚陂杜注竟陵縣城西北有甘魚陂在今湖廣景陵縣西北公子棄疾為司馬先除王宮使觀從從師于乾溪而遂告之從乾溪之師告使叛靈王且曰先歸復所後者劓師及訾梁而潰王聞羣公子之死也自投于車下曰人之愛其子也亦如余乎侍者曰甚焉小人老而無子知擠于溝壑矣擠墜也王曰余殺人子多矣能無及此乎右尹子革曰請待于郊以聽國人聽國人之所與王曰衆怒不可犯也曰若入于大都而乞師于諸侯王曰皆叛矣曰若亡于諸侯以聽大國之圖君也王曰大福不再祇取辱焉然丹乃歸于楚棄王而歸王沿夏將欲入鄢夏杜注漢别名順流為沿芋尹無宇之子申亥曰吾父再姦王命謂斷王旌執人章華宮王弗誅惠孰大焉君不可忍惠不可棄吾其從王乃求王遇諸棘闈以歸棘里名闈門也夏五月癸亥王縊于芋尹申亥氏申亥以其二女殉而葬之公羊傳此弒其君其言歸何據齊陽生入惡不言歸歸無惡于弒立也歸無惡于弒立者何靈王為無道作乾溪之臺三年不成楚公子棄疾脅比而立之然後令于乾溪之役曰比己立矣後歸者不得復其田里衆罷而去之靈王經而死穀梁傳自晉晉有奉焉爾歸而弒不言歸言歸非弒也傳例曰歸為善自某歸次之然則弒君不得言歸言歸比不弒之一驗也歸一事也弒一事也而遂言之以比之歸弒比不弒也歸與弒其事各異自宜别書之而今連言之是比之歸適遇君弒爾比不弒之二驗也弒君者日不日比不弒也據文元年夏四月丁未楚世子商臣弒其君髠書日此不日比不弒君之三驗也楚虔篡立之初比已奔晉未嘗一日為虔之臣春秋乃以大惡歸之何也賊可討而不可代也虔之篡弒當其時力不能討而隱身於晉郟敖二子見戕無後則自潔其身可矣乃自晉復歸倡亂而據其位則為弒其君而已此聖人所以辨公私之義而嚴亂賊之誅也楚公子棄疾殺公子比殺公羊作弒左傳觀從謂子干曰不殺棄疾雖得國猶受禍也子干曰余不忍也子玉曰子玉觀從人將忍子吾不忍俟也乃行國每夜駭曰王入矣相恐以靈王也乙卯夜棄疾使周走而呼曰王至矣國人大驚使蔓成然走告子干子晳曰王至矣國人殺君司馬司馬謂棄疾將來矣君若早自圖也可以無辱衆怒如水火焉不可為謀又有呼而走至者曰衆至矣二子皆自殺丙辰棄疾即位名曰熊居名改名也葬子干于訾實訾敖不成君無諡號者楚皆謂之敖殺囚衣之王服而流諸漢乃取而葬之以靖國人使子旗為令尹子旗蔓成然楚師還自徐前年圍徐之師吳人敗諸豫章獲其五帥豫章杜注當在江北淮水南蓋後徙在江南五帥蕩侯潘子司馬督囂尹午陵尹喜平王封陳蔡復遷邑復九年所遷邑致羣賂始舉事時所貨賂施舍寬民宥罪舉職召觀從王曰唯爾所欲對曰臣之先佐開卜乃使為卜尹使枝如子躬聘于鄭且致犨櫟之田枝如子躬楚大夫犨櫟本鄭邑楚中取之平王新立故還以賂鄭事畢弗致鄭人請曰聞諸道路將命寡君以犨櫟敢請命對曰臣未聞命既復王聞犨櫟降服而對曰降服如今免冠也謝違命臣過失命未之致也王執其手曰子毋勤姑歸不穀有事其告子也善其有權他年芋尹申亥以王柩告乃改葬之初靈王卜曰余尚得天下不吉投龜詬天而呼曰是區區者而不余畀余必自取之民患王之無厭也故從亂如歸初共王無冢適有寵子五人無適立焉乃大有事于羣望而祈曰羣望星辰山川請神擇于五人者使主社稷乃遍以璧見于羣望曰當璧而拜者神所立也誰敢違之既乃與巴姬密埋璧于大室之庭巴姬共王妾大室祖廟使五人齊而長入拜從長幼以次拜康王跨之過其上也靈王肘加焉子干子晳皆遠之平王弱抱而入再拜皆厭紐微見璧紐以為審識鬬韋龜屬成然焉知其將立故且曰棄禮違命楚其危哉棄禮棄立長之禮而卜于神違命違當璧之命而立康王也子干歸韓宣子問于叔向曰子干其濟乎對曰難宣子曰同惡相求如市賈焉同利以相求何難對曰無與同好誰與同惡取國有五難有寵而無人一也人賢人有人而無主二也須內主為應有主而無謀三也有謀而無民四也有民而無德五也子干在晉十三年矣晉楚之從不聞達者可謂無人族盡親叛可謂無主無釁而動可謂無謀召子干時楚未有大釁為羇終世可謂無民終身客晉是無民亡無愛徵可謂無德楚人無愛念之者王虐而不忌靈王暴虐無所畏忌將自亡楚君子干涉五難以弒舊君誰能濟之言楚借君子干以弒靈王終無能成有楚國者其棄疾乎君陳蔡城外屬焉城方城也時穿封戌既死棄疾並領陳事苛慝不作盜賊伏隱私欲不違不以私欲違民事民無怨心先神命之先神謂羣望國民信之芈姓有亂必季實立楚之常也獲神一也當璧拜有民二也民信之令德三也無苛慝寵貴四也貴妃子又君陳蔡居常五也棄疾季有五利以去五難誰能害之子干之官則右尹也數其貴寵則庶子也以神所命則又遠之其貴亡矣其寵棄矣民無懷焉國無與焉將何以立宣子曰齊桓晉文不亦是乎皆庶賤對曰齊桓衛姬之子也有寵于僖衛姬齊僖公妾有鮑叔牙賓須無隰朋以為輔佐有莒衛以為外主齊桓出奔莒衛其母家有國髙以為內主從善如流下善齊肅下善謙下于善人不藏賄不從欲施舍不倦求善不厭是以有國不亦宜乎我先君文公狐季姬之子也有寵于獻好學而不二生十七年有士五人有先大夫子餘子犯以為腹心有魏犨賈他以為股肱士五人狐偃趙衰顛頡魏武子司空季子也子餘即趙衰子犯即狐偃魏犨即魏武子賈他不在五人列蓋叔向所賢有齊宋秦楚以為外主齊妻以女宋贈以馬楚子享之秦伯納之有欒卻狐先以為內主謂欒枝卻縠狐突先軫也亡十九年守志彌篤惠懷棄民惠公懷公不恤民也民從而與之獻無異親民無異望獻公之子九人惟文公在天方相晉將何以代文此二君者異于子干共有寵子國有奧主謂棄疾無施于民無援于外去晉而不送歸楚而不逆何以冀國公羊傳比已立矣其稱公子何據齊公子商人弒其君舍立未踰年見弒稱君其意不當也不欲當君位其意不當則曷為加弒焉爾比之義宜乎效死不立大夫相殺稱人此其稱名氏以弒何言將自是為君也故使與弒君而立者同文穀梁傳當上之辭也當上之辭者謂不稱人以殺乃以君殺之也稱人以殺謂若衛人殺州吁于濮是也今比實不弒故以君殺大夫之辭言之討賊以當上之辭殺非弒也實有弒君之罪則人人皆欲殺宜稱人以殺之今言楚公子棄疾殺公子比明棄疾所殺非弒君之人比之不弒又一驗也比之不弒有四其三在前傳合此為四取國者稱國以弒若比欲取國而弒君則當直云楚比弒其君虔如衛州吁弒其君完齊無知弒其君諸兒之類不應言公子也楚公子棄疾殺公子比比不嫌也今棄疾殺之又言殺公子比不言弒其君是比無欲為君之嫌春秋不以嫌代嫌不以亂治亂之義棄疾主其事故嫌也比實無弒君之罪而棄疾主殺之是棄疾有欲為君之嫌棄疾立比為王已為司馬則已君比矣宜以弒書而曰公子比何也比之立及其見殺不過旬月君臣之分未定也若書弒其君比則疑於齊舍為嗣世之正書楚人殺比則棄疾疑於石碏雍廩得討賊之義故以公子殺公子書而棄疾險詐怙亂竊國之罪不可掩矣秋公會劉子晉侯齊侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯杞伯小邾子于平丘平丘杜注陳留長垣縣西南漢置平丘縣晉廢今故城在河南陳留縣北左傳晉成虒祁在八年諸侯朝而歸者皆有二心為取郠故取郠在十年晉將以諸侯來討叔向曰諸侯不可以不示威乃並徵會告于吳秋晉侯會吳子于良良杜注下邳有良城縣在今江南邳州水道不可吳子辭乃還七月丙寅治兵于邾南甲車四千乘三十萬人羊舌鮒攝司馬鮒叔向弟遂合諸侯于平丘子産子大叔相鄭伯以會子産以幄幕九張行幄幕軍旅之帳子大叔以四十既而悔之每舍損焉及會亦如之亦九張也傳言子産之適宜大叔之從善次于衛地叔鮒求貨于衛淫芻蕘者欲使衛患之而致貨衛人使屠伯饋叔向羮與一篋錦屠伯衛大夫曰諸侯事晉未敢攜二况衛在君之宇下而敢有異志芻蕘者異于他日敢請之請止之叔向受羮反錦受羮示不逆其意且非貨曰晉有羊舌鮒者瀆貨無厭亦將及矣將及禍為此役也役事也子若以君命賜之其己客從之未退而禁之禁芻蕘者晉自重丘以後會盟皆大夫至是昭公即位會楚內亂再合諸侯劉子臨之正可以有為之機也叔向號稱賢者不能導其君樹德修禮以懷諸侯而反欲脅之以威不知晉政多門諸卿各固其私甲車雖衆莫肯盡力於公其為列國所窺察久矣是以齊欲廢盟鄭人爭承魯有違言而晉自是不能復合諸侯列國君大夫皆旅見於楚矣八月甲戌同盟于平丘公不與盟左傳晉人將尋盟齊人不可有二心故晉侯使叔向告劉獻公曰獻公王卿士劉子抑齊人不盟若之何對曰盟以底信底致也君苟有信諸侯不二何患焉告之以文辭董之以武師雖齊不許君庸多矣庸功也討之有辭故功多天子之老請帥王賦元戎十乘以先啓行遲速唯君欲佐晉討齊叔向告于齊曰諸侯求盟已在此矣今君弗利寡君以為請對曰諸侯討二則有尋盟若皆用命何盟之尋託用命以拒晉叔向曰國家之敗有事而無業事則不經業貢賦之業有業而無禮經則不序須禮而有次序有禮而無威序則不共禮須威嚴而後共有威而不昭共則不明威須昭告神明而後信義著不明棄共百事不終所由傾覆也信義不明則棄威不威棄禮無禮無經無經無業故百事不成是故明王之制使諸侯歲聘以志業志識也間朝以講禮再朝而會以示威再會而盟以顯昭明志業于好聘也講禮于等朝也示威于衆會也昭明于神盟也自古以來未之或失也存亡之道恆由是興晉禮主盟懼有不治奉承齊犧而布諸君齊盟之犧牲求終事也君曰余必廢之何齊之有唯君圖之寡君聞命矣齊人懼對曰小國言之大國制之敢不聽從既聞命矣敬共以往遲速唯君叔向曰諸侯有間矣不可以不示衆八月辛未治兵建而不旆建立旌旗不曵其旆旆遊也壬申復旆之諸侯畏之軍將戰則旆故曵旆以恐之邾人莒人訴于晉曰魯朝夕伐我幾亡矣我之不共魯故之以晉侯不見公使叔向來辭曰諸侯將以甲戌盟寡君知不得事君矣請君無勤託謙辭以絶魯子服惠伯對曰君信蠻夷之訴蠻夷謂邾莒以絶兄弟之國棄周公之後亦唯君寡君聞命矣叔向曰寡君有甲車四千乘在雖以無道行之必可畏也况其率道其何敵之有牛雖瘠僨于豚上其畏不死僨仆也南蒯子仲之憂其庸可棄乎棄猶忘也若奉晉之衆用諸侯之師因邾莒杞鄫之怒以討魯罪間其二憂因南蒯子仲二憂為間隙何求而弗克魯人懼聽命不敢與盟甲戌同盟于平丘齊服也經所以稱同令諸侯日中造于除除地為壇會盟處癸酉退朝子産命外僕速張于除張幄幕子大叔止之使待明日及夕子産聞其未張也使速往乃無所張矣地已滿也傳言子産每事敏于大叔及盟子産爭承承貢賦之次曰昔天子班貢輕重以列列尊貢重周之制也公侯地廣故所貢者多卑而貢重者甸服也甸服謂天子畿內共職貢者鄭伯男也而使從公侯之貢懼弗給也敢以為請諸侯靖兵好以為事行理之命行理使人通聘問者無月不至貢之無藝藝法制小國有闕所以得罪也諸侯修盟存小國也貢獻無極亡可待也存亡之制將在今矣自日中以爭至于昏晉人許之既盟子大叔咎之曰諸侯若討其可瀆乎瀆易也子産曰晉政多門二偷之不暇何暇討國不競亦陵何國之為穀梁傳同者有同也同外楚也公不與盟者可以與而不與譏在公也其日善是盟也楚棄疾立內施德惠外撫鄰國晉人恐懼又諸侯多二故載書要言曰同不書諸侯劉子亦與盟也或謂揭公於不與盟之上則是不與盟之意主於魯非也沙隨不見公不可言公不見晉侯此不與盟不可言諸侯不盟公屬辭之體然也若魯不願盟則其赴會何為乎晉人執季孫意如以歸左傳公不與盟晉人執季孫意如以幕蒙之使狄人守之司鐸射懷錦奉壺飲冰以蒲伏焉司鐸射魯大夫蒲伏竊往飲季孫冰箭筒蓋可以取飲守者御之乃與之錦而入晉人以平子歸子服湫從湫惠伯三家不臣之罪至意如極矣擅兵取邑中分魯國以自封殖至使君若贅旒民忘其上討而執之固其宜矣而不得為霸討何也晉人若能徵邾莒赴訴之辭究南蒯子仲奔叛之故請於天子以大義誅意如正三桓之罪歸其地與民於公則魯國順正諸侯威懷而霸事可復興矣乃徒辱魯君而不察其情雖執意如而不正其罪安得為霸討乎蓋由諸卿曲庇季氏而晉君亦不得為政爾附録左傳子産歸未至聞子皮卒哭且曰吾己已猶決競無為為善矣唯夫子知我言子皮知己之善仲尼謂子産于是行也足以為國基矣詩曰樂只君子邦家之基詩小雅子産君子之求樂者也且曰合諸侯藝貢事禮也藝治也公至自會公羊傳公不與盟者何公不見與盟也言不為晉所許公不見與盟大夫執何以致會不恥也曷為不恥諸侯遂亂反陳蔡君子不恥不與焉時諸侯將討棄疾棄疾乃封陳蔡之君使説諸侯諸侯由是遂還不復討楚楚亂遂成故云爾公雖不與盟然己與平丘之會矣故以會致附録左傳鮮虞人聞晉師之悉起也五年傳曰遺守四千今甲車四千乘故為悉起而不警邊且不修備晉荀吳自著雍以上軍侵鮮虞及中人中人杜注中山望都縣西北有中人城在今直隸唐縣境驅衝競驅衝車與犾爭逐大獲而歸蔡侯廬歸于蔡陳侯吳歸于陳左傳楚之滅蔡也靈王遷許胡沈道房申于荆焉滅蔡在十一年許胡沈小國也道房申皆故諸侯楚滅以為邑徙其人于荆山房杜注汝南有吳房縣即房國今河南遂平縣有吳房城平王即位既封陳蔡而皆復之禮也隱大子之子廬歸于蔡禮也悼大子之子吳歸于陳禮也隱大子世子有也廬蔡平侯悼大子偃師也吳陳惠侯公羊傳此皆滅國也其言歸何據歸者有國辭不與諸侯專封也榖梁傳善其成之會而歸之故謹而日之二國獲復平丘盟之力也故于其歸追述前盟謹日之以美其功此未嘗有國也使如失國辭然者不與楚滅也陳蔡皆見滅於楚矣廬與吳未嘗有國也而書歸于蔡歸于陳如固有其國者然先王建國非楚虔所得滅也廬與吳未嘗有位也而書蔡侯陳侯如固有其位者然周室班爵非楚棄疾所得封也不言自楚義亦如此冬十月葬蔡靈公左傳冬十月葬蔡靈公禮也國復成禮以葬也穀梁傳變之不葬有三變之謂改常禮失德不葬弒君不葬滅國不葬然且葬之不與楚滅且成諸侯之事也當蔡世子有被圍諸侯環視不救及廬復國乃相率而葬靈公靈公者世子般也曾是以為邦交之禮乎公如晉至河乃復左傳公如晉荀吳謂韓宣子曰諸侯相朝講舊好也執其卿而朝其君有不好焉不如辭之乃使士景伯辭公于河士景伯文伯之子彌牟也公如晉請季孫也晉復拒公蓋晉卿隂庇意如固將歸之故辭公而專以市其私德耳吳滅州來左傳吳滅州來令尹子旗請伐吳王弗許曰吾未撫民人未事鬼神未修守備未定國家而用民力敗不可悔州來在吳猶在楚也子姑待之傳言平王所以能有國州來楚之附庸實邊邑也成六年吳嘗入焉兹復乘楚亂而滅之十九年傳載楚城州來是吳雖滅之而不能有也附録左傳季孫猶在晉子服惠伯私于中行穆子曰魯事晉何以不如夷之小國魯兄弟也土地猶大所命能具若為夷棄之使事齊楚其何瘳于晉瘳差也猶言益也親親與大賞共罰否所以為盟主也子其圖之諺曰臣一主二吾豈無大國言不合則去而他事魯尚有齊楚不獨晉也穆子告韓宣子且曰楚滅陳蔡不能救而為夷執親將焉用之乃歸季孫惠伯曰寡君未知其罪合諸侯而執其老若猶有罪死命可也死晉命也若曰無罪而惠免之諸侯不聞是逃命也何免之為請從君惠于會欲于會盟時見遣以暴魯之無罪爭國體也宣子患之謂叔向曰子能歸季孫乎對曰不能鮒也能乃使叔魚鮒字叔魚叔魚見季孫曰昔鮒也得罪于晉君襄二十一年叔魚坐叔虎與欒氏黨並得罪自歸于魯君微武子之賜不至于今武子平子之祖雖獲歸骨于晉猶子則肉之敢不盡情歸子而不歸鮒也聞諸吏將為子除館于西河西使近河其若之何且泣泣以信其言平子懼先歸惠伯待禮待見遣之禮日講春秋解義卷五十一
