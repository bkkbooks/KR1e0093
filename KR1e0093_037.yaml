body:
  text: 欽定四庫全書日講春秋解義卷三十七襄公公名午成公子母定姒諡法因事有功曰襄辟土有德曰襄周簡王十四年魯襄公元年簡王崩子靈王立襄二十八年靈王崩子景王立鄭成公十三年魯襄公二年成公卒子僖公髠頑立襄七年僖公卒簡公嘉立齊靈公十年魯襄公十九年靈公卒子莊公光立襄二十五年莊公弒弟景公杵臼立宋平公四年晉悼公復霸元年韓厥為政襄七年知罃為政襄十一年會於蕭魚服鄭襄十三年荀偃為政襄十五年悼公卒子平公彪立襄十九年士丐為政襄二十五年趙武為政襄二十七年晉楚盟於宋南北分霸始此衛獻公五年魯襄公十四年獻公奔齊衛立公孫剽是為殤公襄二十六年殤公弒獻復歸於衛襄二十九年獻公卒子襄公立蔡景公二十年魯襄公三十年景公弒子靈公般立曹成公六年魯襄公十八年成公卒子武公滕立滕詳見成公元年陳成公二十七年魯襄公四年成公卒子哀公溺立把桓公六十五年魯襄公六年桓公卒子孝公丐立襄二十三年孝公卒弟文公益姑立薛詳見僖公元年莒犂比公五年魯襄公十六年晉執犂比公襄三十一年犂比公弒子展輿立邾宣公三年魯襄公十六年晉執宣公襄十七年宣公卒悼公華立襄十九年晉執悼公許靈公十八年魯襄公二十六年靈公卒於楚悼公買立小邾魯襄公七年小邾穆公來朝楚共王十九年子重為令尹魯襄公三年子重伐吳卒子辛為令尹襄五年楚殺子辛子囊為令尹襄十三年共王卒子康王昭立襄十五年子庚為令尹襄二十一年子南為令尹二十二年薳子馮為令尹襄二十五年子木為令尹襄二十八年康王卒郟敖麇立秦景公五年吳壽夢十四年魯襄公十二年壽夢卒諸樊立一名遏襄二十五年遏門於巢卒餘祭立一名載襄二十九年餘祭卒夷末立一名餘昧越詳見隱公元年及昭公元年欽定四庫全書日講春秋解義卷三十七襄公名午成公之子母定姒以簡王十四年即位諡法因事有功曰襄元年春王正月公即位穀梁傳繼正即位正也按九年左氏傳曰會于沙隨之嵗寡君以生晉侯曰十二年矣則是年公始四嵗而三年遂朝於晉蓋霸體日肆小國畏之而越禮以相奉也仲孫蔑會晉欒黶宋華元衛寧殖曹人莒人邾人滕人薛人圍宋彭城左傳元年春己亥圍宋彭城下有二月則此己亥為正月正月無己亥日誤非宋地追書也成十八年楚取彭城以封魚石故曰非宋地夫子治春秋追書繫之宋于是為宋討魚石故稱宋且不登叛人也登成也不與其專邑叛君故使彭城還繫宋謂之宋志稱宋亦以成宋志彭城降晉晉人以宋五大夫在彭城者歸置諸瓠丘彭城降不書賤略之瓠丘杜注晉地河東東垣縣東南有壺丘亦曰陽壺寰宇記曰古陽壺城南臨大河今山西垣曲縣東南陽壺城是也五大夫魚石向為人鱗朱向􅙮魚府齊人不會彭城晉人以為討二月齊太子光為質于晉光齊靈公大子公羊傳宋華元曷為與諸侯圍宋彭城為宋討也其為宋討奈何魚石走之楚楚為之伐宋取彭城以封魚石魚石之罪奈何以入是為罪也説在成十八年楚已取之矣曷為繫之宋不與諸侯專封也穀梁傳繫彭城于宋者不與魚石正也魚石人臣而取君之邑邑以繫國為正故言繫彭城于宋不與魚石正也據傳楚已取彭城封魚石戌之三百乘矣則曷為繫之宋楚不得取之宋魚石不得受之楚雖專其地君子不登叛人所以正強域固封守謹王度也齊國夏衛石曼姑圍戚不繫之衛此圍彭城諸侯之師與宋華元偕其事正同而書宋彭城何也蒯聵衛之世子時君之父也既入于戚則戚固其邑矣何必繫之衛哉彭城為楚所奪而宋之叛臣據之必繫於宋大義始著此春秋之書所以微而顯也夏晉韓厥帥師伐鄭厥公羊作屈仲孫蔑會齊崔杼曹人邾人把人次于鄫鄫公羊作合杜注鄭地在陳留襄邑縣東南左傳夏五月晉韓厥荀偃帥諸侯之師伐鄭入其郛敗其徒兵于洧上洧上杜注洧水出密縣東南至長平入潁長平在今河南西華縣于是東諸侯之師次于鄫以待晉師晉師自鄭以鄫之師侵楚焦夷及陳孟獻子自鄫先歸不與侵陳楚故不書晉侯衛侯次于戚以為之援晉悼公既克彭城禽五大夫於是伐鄭以討其從楚納魚石之罪以韓厥自足當鄭不欲重勤東諸侯之師故使次于鄫以懾鄭心且備楚師之出也傳稱楚子辛救鄭而經不書以鄭懷集矢之小德而不能以大義裁之附楚以侵軼同盟奬助亂臣無可救之善耳秋楚公子壬夫帥師侵宋左傳秋楚子辛救鄭侵宋吕留吕留杜注二縣屬彭城郡今俱在徐州境鄭子然侵宋取犬丘犬丘杜注譙國酇縣東北有犬丘城今河南永城縣西北大丘集是也九月辛酉天王崩邾子來朝左傳九月邾子來朝邾宣公禮也冬衛侯使公孫剽來聘晉侯使荀罃來聘左傳冬衛子叔晉知武子來聘子叔公孫剽禮也凡諸侯即位小國朝之大國聘焉以繼好結信謀事補闕禮之大者也三國朝聘左氏皆以為禮杜氏預以為王赴未至穀梁注公羊疏皆主杜氏獨胡氏安國主孫氏復説謂赴告已及按經冬下無月日後二月又無事見經諸家之説無所據以辨其孰是也二年春王正月葬簡王鄭師伐宋左傳二年春鄭師侵宋書伐從告楚令也以彭城故書師著其用大衆也附録左傳齊侯伐萊萊人使正輿子賂夙沙衛以索馬牛皆百匹正輿子萊大夫夙沙衛齊寺人索簡擇好者齊師乃還君子是以知齊靈公之為靈也諡法亂而不損曰靈言諡應其行夏五月庚寅夫人薑氏薨左傳夏齊薑薨齊諡也初穆薑使擇美檟以自為櫬與頌琴檟梓之屬櫬棺也頌琴琴名猶言雅琴皆欲以送終季文子取以葬君子曰非禮也禮無所逆婦養姑者也虧姑以成婦逆莫大焉穆薑成公母齊薑成公婦詩曰其惟哲人告之話言順德之行詩大雅哲知也話善也言知者行事無不順季孫于是為不哲矣且薑氏君之妣也襄公適母詩曰為酒為醴蒸畀祖妣以洽百禮降福孔偕詩周頌蒸進也畀與也偕遍也言敬事祖妣則鬼神降福季孫葬薑氏不以禮是不敬祖妣六月庚辰鄭伯睔卒左傳鄭成公疾子駟請息肩于晉欲辟楚役以負擔喻公曰楚君以鄭故親集矢于其目謂鄢陵戰晉射楚王目非異人任寡人也若背之是棄力與言言盟誓之言其誰昵我免寡人唯二三子秋七月庚辰庚辰七月九日經書六月誤鄭伯睔卒不書葬者成公背中國故諸侯不會其葬也晉師宋師衛寧殖侵鄭左傳于是子罕當國攝君事子駟為政子國為司馬晉師侵鄭諸大夫欲從晉子駟曰官命未改成公未葬嗣君未免喪故言未改不欲違先君意穀梁傳其曰衛寧殖如是而稱于前事也初衛侯速卒鄭人侵之故舉寧殖之報以明稱于前事晉宋稱師將卑師衆也衛書寧殖將尊師少也考其事而師將之當兼重見矣上言鄭伯睔卒下書三國侵譏伐喪也秋七月仲孫蔑會晉荀罃宋華元衛孫林父曹人邾人于戚左傳會于戚謀鄭故也孟獻子曰請城虎牢以逼鄭虎牢杜注舊鄭邑後屬晉知武子曰善鄫之會吾子聞崔子之言今不來矣元年孟獻子與齊崔杼次于鄫崔杼有不服晉之言獻子以告知武子滕薛小邾之不至皆齊故也三國齊之屬寡君之憂不唯鄭罃將復于寡君而請于齊以城事白晉君而請齊會之欲以觀齊志得請而告吾子之功也得請謂齊人應命告諸侯會築虎牢若不得請事將在齊吾子之請諸侯之福也豈唯寡君賴之傳言荀罃能用善謀將城虎牢也其未城者齊與滕薛小邾不至也然大夫專會以謀鄭政在大夫矣己丑葬我小君齊薑左傳齊侯使諸薑宗婦來送葬婦人越疆送葬非禮召萊子萊薑姓故召之萊子不會故晏弱城東陽以逼之為六年滅萊傳東陽杜注齊竟上邑今東陽城在山東臨胊縣東公羊傳齊薑者何齊薑與繆薑則未知其為宣夫人與成夫人與叔孫豹如宋左傳穆叔聘于宋通嗣君也冬仲孫蔑會晉荀罃齊崔杼宋華元衛孫林父曹人邾人滕人薛人小邾人于戚遂城虎牢左傳冬復會于戚齊崔武子及滕薛小邾之大夫皆會知武子之言故也武子言事將在齊齊人懼帥小國而會之遂城虎牢鄭人乃成公羊傳虎牢者何鄭之邑也其言城之何取之也取之則曷為不言取之為中國諱也曷為為中國諱諱伐喪也曷為不繫乎鄭為中國諱也大夫無遂事此其言遂何歸惡乎大夫也穀梁傳若言中國焉中國猶國中也不繫虎牢于鄭如國中之邑也內鄭也鄭服罪故內之鄭當南北之衝故禦楚必先服鄭而虎牢乃鄭之要塞城虎牢則鄭不敢南嚮楚不得北師而天下蒙其安故不繫于鄭示鄭不得專也自平王東遷鄭武公為卿士王賜之虎牢以東後失其地鄭厲公納惠王王復與之然齊桓之霸説鄭申侯而與之虎牢則固未嘗以虎牢為中國之輕重也至晉厲悼時則近楚微國吞噬靡遺若陳若蔡若許皆世服焉鄢陵之後三合諸侯連諸國之師而不能服鄭楚與鄭無嵗不加兵於宋及虎牢既城則雞澤之盟鄭不召而自至而陳亦改圖北嚮則是役也成功甚大而義亦無愆此聖人所以不繫之鄭與楚殺其大夫公子申左傳楚公子申為右司馬多受小國之賂以逼子重子辛楚人殺之故書曰楚殺其大夫公子申言所以致國討之文三年春楚公子嬰齊帥師伐吳吳楚爭疆自此始左傳三年春楚子重伐吳為簡之師簡選練克鳩兹至于衡山鳩兹杜注吳邑在丹陽蕪湖縣東今江南蕪湖縣東有鳩兹港是也衡山杜注在吳興府烏程縣南案烏程去蕪湖甚逺今江南當塗縣東北有橫山似為近之使鄧廖帥組甲三百被練三千組甲漆甲成組文被練練袍以侵吳吳人要而擊之獲鄧廖其能免者組甲八十被練三百而已子重歸既飲至三日吳人伐楚取駕駕良邑也鄧廖亦楚之良也君子謂子重于是役也所獲不如所亡當時君子楚人以是咎子重子重病之遂遇心疾而卒楚始伐吳以吳與於鍾離之會也楚自鄢陵以後勢稍挫屈畏晉與諸侯并力謀之而吳乘其後故先有事於吳然國政失御大臣相殘既與晉讎又結吳怨適見其謀國之不臧耳公如晉左傳公如晉始朝也童子侯不朝王蓋不可接以成人之禮也豈可反朝同列乎夏四月壬戌公及晉侯盟于長樗長樗孔氏穎逹曰近城地左傳夏盟于長樗孟獻子相公稽首知武子曰天子在而君辱稽首寡君懼矣稽首事天子之禮孟獻子曰以敝邑介在東表密邇仇讎仇讎謂齊楚與晉爭寡君將君是望敢不稽首傳言獻子能固事盟主春秋時諸侯不親盟於他國文二年公如晉晉人使陽處父盟公三年請改盟猶盟於其國非禮也今悼公修禮於魯若不敢使魯君就已而出盟於外以相就者然此諸侯所以睦於晉也公至自晉附録左傳晉為鄭服故且欲修吳好鄭服在前年將合諸侯使士丐告於齊曰寡君使丐以嵗之不易不易多難也不虞之不戒寡君願與一二兄弟相見以謀不協請君臨之使丐乞盟齊侯欲勿許而難為不協乃盟于耐外耐杜注水名案耐水即時水也平地出泉曰耐祁奚請老晉侯問嗣焉嗣續其職者稱解狐其讎也將立之而卒解狐卒又問焉對曰午也可午祁奚子于是羊舌職死矣晉侯曰孰可以代之對曰赤也可赤職之子伯華于是使祁午為中軍尉羊舌赤佐之各代其父君子謂祁奚于是能舉善矣稱其讎不為諂立其子不為比舉其偏不為黨偏屬也商書曰無偏無黨王道蕩蕩商書洪範蕩蕩平正無私其祁奚之謂矣解狐得舉未得位故曰得舉祁午得位伯華得官建一官而三物成一官軍尉物事也能舉善也夫唯善故能舉其類詩云惟其有之是以似之詩小雅言唯有德之人能舉似已者祁奚有焉六月公會單子晉侯宋公衛侯鄭伯莒子邾子齊世子光己未同盟于雞澤雞澤杜注在廣平曲梁縣西南後漢志曲梁侯國有雞澤即春秋同盟處也今曲梁故城在直隸廣平府東北左傳六月公會單頃公及諸侯己未同盟于雞澤晉侯使荀會逆吳子于淮上吳子不至道逺多難穀梁傳同者有同也同外楚也是時諸侯同心病楚鄭亦因城虎牢而服焉故載書要言同盟書日於諸侯之下所以别會與盟之異日也他盟但合諸侯行盟禮故書某日會某侯盟於某地此則既行會禮别日又行盟禮故書日以隔之其與首止葵丘再書地異者無大美惡則舉其重者而已陳侯使袁僑如會左傳楚子辛為令尹侵欲于小國陳成公使袁僑如會求成袁僑濤塗四世孫晉侯使和組父告于諸侯公羊傳其言如會何後會也穀梁傳如會外乎會也外乎會者明本非會內也諸侯已會乃至耳于會受命也陳自辰陵即楚二十有八年今聞鄭伯受盟乃使大夫求成於晉本非召會又後時故書如會戊寅叔孫豹及諸侯之大夫及陳袁僑盟諸侯在而大夫自為盟始于此左傳秋叔孫豹及諸侯之大夫及陳袁僑盟陳請服也公羊傳曷為殊及陳袁僑為其與袁僑盟也喜得陳故殊之穀梁傳及以及與之也但言叔孫豹及諸侯之大夫則無以表袁僑之得禮故再言及明獨與袁僑不與諸侯之大夫諸侯以為可與則與之不可與則釋之諸侯盟又大夫相與私盟是大夫張也故雞澤之會諸侯始失正矣大夫執國權曰袁僑異之也異袁僑之得禮虎牢既城鄭人來歸而陳亦改圖鄭君先至諸侯既與之盟而後陳袁僑至故使大夫盟之此悼公所以持大體也傳謂諸侯盟大夫又相與私盟為大夫張過矣湨梁之會諸侯不盟而大夫盟責大夫之專可也此書諸侯之大夫及陳袁僑盟則大夫奉君命以即事禮安而分明安得謂大夫専而諸侯失其柄乎附録左傳晉侯之弟揚干亂行于曲梁行陳次曲梁晉地魏絳戮其僕晉侯怒謂羊舌赤曰合諸侯以為榮也揚干為戮何辱如之必殺魏絳無失也對曰絳無二志事君不辟難有罪不逃刑其將來辭何辱命焉言終魏絳至授僕人書僕人晉侯御僕將伏劍士魴張老止之公讀其書曰日君乏使使臣斯司馬斯此也臣聞師衆以順為武順莫敢違軍事有死無犯為敬守官行法雖死不敢有違君合諸侯臣敢不敬君師不武執事不敬罪莫大焉臣懼其死以及揚干無所逃罪不能致訓至于用鉞用鉞斬揚干之僕臣之罪重敢有不從以怒君心言不敢不從戮請歸死於司寇公跣而出曰寡人之言親愛也吾子之討軍禮也寡人有弟弗能教訓使干大命寡人之過也子無重寡人之過魏絳死為重過敢以為請晉侯以魏絳為能以刑佐民矣反役與之禮食使佐新軍羣臣旅會今欲顯魏絳故特為設禮食張老為中軍司馬代魏絳士富為候奄代張老士富士會别族楚司馬公子何忌侵陳陳叛故也秋公至自會冬晉荀罃帥師伐許左傳許靈公事楚不會于雞澤冬晉知武子帥師伐許責許不會于雞澤也許自新城以來困於鄭脅於楚不與中國會盟久矣今以陳鄭偶服遂侈然求多於許其心褊矣宜不得許且並陳鄭而失之也四年春王三月己酉陳侯午卒左傳四年春楚師為陳叛故猶在繁陽前年何忌之師侵陳今猶未還繁陽杜注楚地在汝南鮦陽縣南今河南新蔡縣有繁陽亭韓獻子患之言于朝曰文王帥殷之叛國以事紂唯知時也今我易之難哉三月陳成公卒楚人將伐陳聞喪乃止陳人不聼命臧武仲聞之曰陳不服于楚必亡大國行禮焉而不服在大猶有咎而况小乎夏楚彭名侵陳陳無禮故也為下陳圍頓傳襄公名午與陳侯同名經不為國諱者周人雖以諡易名因而有諱然考之禮律亦有不盡諱者後世忌諱繁而名實亂矣䇿書所紀不宜變易故莊公名同而書同盟僖公名申而書戊申定公名宋而書宋公皆臨文不諱之法也夏叔孫豹如晉左傳穆叔如晉報知武子之聘也武子聘在元年晉侯享之金奏肆夏之三不拜肆夏樂曲名周禮以鐘鼓奏九夏其二曰肆夏三曰韶夏四曰納夏蓋擊鐘而奏此三夏曲工歌文王之三又不拜工樂人也文王之三大雅之首文王大明綿歌鹿鳴之三三拜小雅之首鹿鳴四牡皇皇者華韓獻子使行人子員問之曰子以君命辱於敝邑先君之禮藉之以樂以辱吾子吾子舍其大而重拜其細敢問何禮也對曰三夏天子所以享元侯也使臣弗敢與聞文王兩君相見之樂也臣不敢及及與也鹿鳴君所以嘉寡君也敢不拜嘉歌鹿鳴義取我有嘉賔叔孫奉君命而來以叔孫為嘉賔乃所以嘉魯君也四牡君所以勞使臣也敢不重拜詩言使臣乘四牡騑騑然行不止勤勞也晉以叔孫來聘故以此勞之皇皇者華君教使臣曰必咨於周皇皇者華君遣使臣之詩言忠臣奉使能光輝君命如華之皇皇然又當咨於忠信以補不及忠信為周其詩曰周爰咨諏周爰咨謀周爰咨度周爰咨詢言必於忠信之人詢此四事臣聞之訪問於善為咨問善道咨親為詢問親戚之義咨禮為度問禮冝咨事為諏問政事咨難為謀問患難臣獲五善敢不重拜秋七月戊子夫人姒氏薨姒公羊作弋下定姒同左傳秋定姒薨不殯於廟無櫬不虞櫬親身棺季孫以定姒本賤不欲以夫人禮卒之虞祭也匠慶謂季文子曰匠慶魯大夫子為正卿而小君之喪不成不終君也慢其母是不終事君之道君長誰受其咎初季孫為已樹六檟于蒲圃東門之外蒲圃場圃名季文子樹檟欲自為櫬匠慶請木為定姒作櫬季孫曰略不以道取為略匠慶用蒲圃之檟季孫不御御止也傳言遂得成禮故經無異文君子曰志所謂多行無禮必自及也其是之謂乎孔氏穎達曰二年齊薑薨葬者成公夫人也據傳匠慶之言則定姒襄公生母王氏葆曰定十五年書葬定姒哀公之母也自襄至哀歷世未逺不應同諡曰定文必有誤葬陳成公陳即晉魯會其葬故書八月辛亥葬我小君定姒公羊傳定弋者何襄公之母也未踰月而速葬其禮略也蓋行父本不欲以夫人之禮葬不得已于人言則略其禮季氏無君之心自行父已兆其端矣冬公如晉左傳冬公如晉聼政受貢賦多少之政晉侯享公公請屬鄫鄫杜注小國琅邪鄫縣欲使屬魯如須句顓臾之比晉侯不許孟獻子曰以寡君之密邇于仇讎而願固事君無失官命晉官徵發之命鄫無賦于司馬晉司馬掌諸侯之賦為執事朝夕之命敝邑敝邑褊小闕而為罪闕不共也寡君是以願借助焉晉侯許之為明年叔孫豹鄫世子巫如晉傳襄公之生至是始七嵗且有母喪而急於朝晉豈公所自主乎蓋行父懲於歸父之事欲專魯而過禮以自媚於晉不顧其君之幼弱不能勝勞役而任禮事也行父託言居守而使孟獻子從行故吳人曰國君道長而大夫不出門正謂是耳陳人圍頓左傳楚人使頓間陳而侵伐之間伺其隙故陳人圍頓楚圍陳納頓子陳畏楚而不敢報陳改事晉楚使頓間陳而侵伐之故陳人圍頓自會于雞澤以後伐許圍頓皆霸勢之將興而晉之謀國者皆務苟安而不能保陳終成南北分霸之勢不亦悖乎附録左傳無終子嘉父使孟樂如晉無終杜注山戎國名今順天府玉田縣西有古無終城子爵也嘉父名孟樂其使臣因魏莊子納虎豹之皮以請和諸戎欲戎與晉和莊子魏絳晉侯曰戎狄無親而貪不如伐之魏絳曰諸侯新服陳新來和將觀於我我德則睦否則攜二勞師於戎而楚伐陳必弗能救是棄陳也諸華必叛戎禽獸也獲戎失華無乃不可乎夏訓有之曰有窮后羿夏訓夏書有窮杜注國名水經注窮水出於安豐在今英山縣境羿有窮君之號公曰后羿何如怪其言不次故問之對曰昔有夏之方衰也后羿自鉏遷於窮石因夏民以代夏政禹孫太康淫放失國夏人立其弟仲康仲康卒子相立羿遂代相號曰有窮鉏杜注羿本國名今直隸滑縣東有鉏城恃其射也羿善射不修民事而淫於原獸棄武羅伯因熊髠尨圉四子皆羿賢臣而用寒浞寒浞伯明氏之讒子弟也寒杜注寒國北海平夀縣東有寒亭在今山東濰縣東北伯明其君名伯明后寒棄之夷羿收之夷氏信而使之以為己相浞行媚於內內宫人而施賂於外愚弄其民而虞羿於田樂之以遊田樹之詐慝以取其國家外內咸服羿猶不悛將歸自田羿獵還家衆殺而亨之以食其子食羿子其子不忍食諸死于窮門靡奔有鬲氏靡夏遺臣事羿者有鬲杜注國名平原鬲縣今山東德平縣東有故鬲城浞因羿室就其妃妾生澆及豷恃其讒慝詐偽而不德于民使澆用師滅斟灌及斟尋氏二國夏同姓諸侯后相所依杜注樂安壽光縣東南有灌亭北海平夀縣東南有斟亭今斟灌城在山東夀光縣東北斟尋城在山東濰縣西南處澆于過處豷于戈過戈杜注皆國名東萊掖縣北有過鄉戈在宋鄭之間按今山東萊州府治即過國也靡自有鬲氏收二國之燼燼遺民以滅浞而立少康少康夏后相之子少康滅澆于過后杼滅豷于戈后杼少康子有窮由是遂亡浞因羿室故不改有窮之號失人故也昔周辛甲之為大史也命百官官針王闕辛甲周武王大史使百官各為針辭以戒王過于虞人之針曰虞人掌田獵芒芒禹迹芒芒逺貌畫為九州經啓九道啓開九州之道民有寢廟獸有茂草各有攸處德用不擾在帝夷羿冒于原獸冒貪也忘其國恤而思其麀牡武不可重重猶數也用不恢于夏家獸臣司原敢告僕夫獸臣虞人告僕夫不敢斥尊虞針如是可不懲乎于是晉侯好田故魏絳及之公曰然則莫如和戎乎對曰和戎有五利焉戎狄荐居貴貨易土荐聚也易猶輕也土可賈焉一也邊鄙不聳民狎其野穡人成功二也聳懼狎習也戎狄事晉四鄰振動諸侯威懷三也以德綏戎師徒不勤甲兵不頓四也頓壞也鑒于后羿而用德度逺至邇安五也君其圖之公説使魏絳盟諸戎修民事田以時傳言晉侯能用善謀冬十月邾人莒人伐鄫臧紇救鄫侵邾敗于狐駘臧紇武仲狐駘杜注邾地魯國番縣東南有目台亭今狐駘山在山東滕縣東南國人逆喪者皆髽魯于是乎始髽髽麻髮合喪禮之始變國人誦之曰臧之狐裘敗我于狐駘臧紇時服狐裘我君小子朱儒是使朱儒朱儒使我敗于邾公幼弱故曰小子臧紇短小故曰朱儒敗不書魯人諱之五年春公至自晉左傳五年春公至自晉附録左傳王使王叔陳生訴戎于晉王叔周卿士時戎侵暴故晉人執之士魴如京師言王叔之二于戎也夏鄭伯使公子發來聘左傳夏鄭子國來聘通嗣君也鄭僖公初即位魯與鄭自輸平來盟以後聘使不通終春秋僅見於此則以晉霸復興諸侯輯睦也叔孫豹鄫世子巫如晉鄫榖梁作繒後同左傳穆叔覿鄫大子于晉以成屬鄫覿見也前年請屬鄫故將鄫大子巫如晉以成之書曰叔孫豹鄫大子巫如晉言比諸魯大夫也公羊傳外相如不書此何以書為叔孫豹率而與之俱也叔孫豹則曷為率而與之俱蓋舅出也巫者鄫前夫人襄公母姊妹之子也俱莒外孫故曰舅出莒將滅之故相與往殆乎晉也殆疑也以疑讞于晉莒將滅之則曷為相與往殆乎晉取後乎莒也其取後乎莒奈何莒女有為鄫夫人者蓋欲立其出也時莒女嫁為鄫後夫人夫人女還嫁莒有外孫鄫子愛後夫人而無子欲立其外孫魯因為之往讞于晉穀梁傳外不言如而言如為我事往也外相如不書鄫世子之如晉何以書以鄫既屬魯叔孫豹率而與之俱故比諸魯大夫耳豹與鄫世子同如晉而不言及是旅見於晉也晉之汰亦甚矣仲孫蔑衛孫林父會吳於善道道公羊榖梁作稻善道杜注地闕按阮勝之南兗州記盱眙本吳善道地今屬江南泗州左傳吳子使壽越如晉壽越吳大夫辭不會於雞澤之故三年會雞澤吳不至今來謝之且請聽諸侯之好晉人將為之合諸侯使魯衛先會吳且告會期故孟獻子孫文子會吳於善道穀梁傳吳謂善伊謂稻緩號從中國名從主人吳之土音與中國異其所號地形物類當從中國以教殊俗故不言伊緩而言善稻若人名則從其本國所稱晉將邀吳為戚之會魯衛近吳且俱同姓故先使通好不言及同受命於晉也不列敘而别言會吳者吳人在善道蔑與林父往會之也秋大雩左傳秋大雩旱也楚殺其大夫公子壬夫左傳楚人討陳叛故曰由令尹子辛實侵欲焉乃殺之書曰楚殺其大夫公子壬夫貪也君子謂楚共王于是不刑詩曰周道挺挺我心扃扃講事不令集人來定逸詩也挺挺正直也扃扃明察也講謀也言謀事不善聚致賢人以定之已則無信而殺人以逞不亦難乎夏書曰成允成功夏書大禹謨允信也言信成然後有成功壬夫侵欲固有罪矣然楚子不能申明法教禁之於先及陳怨已深伐之不服始歸咎而殺之豈用刑之正哉故稱國以殺罪纍上也公會晉侯宋公陳侯衛侯鄭伯曹伯莒子邾子滕子薛伯齊世子光吳人鄫人于戚左傳九月丙午盟于戚會吳且命戍陳也不書盟蓋不以盟告廟穆叔以屬鄫為不利使鄫大夫聽命于會傳言鄫人所以見于戚會公羊傳吳何以稱人吳鄫人云則不辭晉合諸侯而吳來聽命與吳居其所而諸國往會之者異矣故列敘而不殊會其稱人與鄫並列不得云吳鄫人也公至自會冬戍陳公羊傳孰戍之諸侯戍之曷為不言諸侯戍之離至不可得而序離至離别前後至也故言我也以魯至時書穀梁傳內辭也不言諸侯是魯戌之諸侯受命于戚各以師戍陳離至不可得而序故獨書魯戍也齊桓不戰而屈楚晉文戰而屈楚悼公通吳以制楚又戍守陳鄭事勢各異不可以優劣論也楚公子貞帥師伐陳公會晉侯宋公衛侯鄭伯曹伯齊世子光救陳十有二月公至自救陳曹伯下公羊穀梁有莒子邾子滕子薛伯左傳楚子囊為令尹公子貞范宣子曰我喪陳矣楚人討二而立子囊必改行改子辛行而疾討陳陳近于楚民朝夕急能無往乎有陳非吾事也無之而後可冬諸侯戍陳子囊伐陳十一月甲午會于城棣以救之城棣杜注鄭地陳留酸棗縣西南有棣城寰宇記有南棣城北棣城在陽武縣北今屬河南開封府穀梁傳善救陳也晉之於陳既勤戍於無事之時復率救於被兵之日可謂勤矣卒不能保陳以楚益張而陳近焉事勢實然然非悼公即世必能與楚相持不至南北分霸也辛未季孫行父卒左傳季文子卒大夫入斂公在位在阼階西鄉宰庀家器為葬備庀具也無衣帛之妾無食粟之馬無藏金玉無重器備器備謂珍寶甲兵之物君子是以知季文子之忠于公室也相三君矣而無私積可不謂忠乎先儒以左氏所稱多謂行父忠慎然子赤之弒行父非惟坐視而又為仲遂奔走焉及宣公既殁復乘間以逐歸父而三桓之勢成孟叔且拱手以聽於季氏矣其妾不衣帛馬不食粟乃矯情悅衆以自固其身家與陳氏燠休齊民之意同故孔子譏其三思而朱子尤深惡之洵論世知人之特識也六年春王三月壬午把伯姑容卒左傳六年春杞桓公卒始赴以名同盟故也把入春秋未嘗書名桓公三與成公同盟故赴以名夏宋華弱來奔左傳宋華弱與樂轡少相狎長相優又相謗也華弱樂轡皆宋大夫狎親習也優調戲也子蕩怒以弓梏華弱于朝子蕩樂轡也張弓以貫其頸若械之在手故曰梏平公見之曰司武而梏于朝難以勝矣司武司馬遂逐之夏宋華弱來奔司城子罕曰同罪異罰非刑也專戮于朝罪孰大焉亦逐子蕩子蕩射子罕之門曰幾日而不我從言亦當見逐子罕善之如初秋葬把桓公滕子來朝左傳秋滕成公來朝始朝公也莒人滅鄫左傳莒人滅鄫鄫恃賂也歸魯貢恃之而慢莒故滅穀梁傳非滅也中國日卑國月夷狄時鄫中國也而時非滅也家有既亡國有既滅家立異姓為後則亡國立異姓為嗣則滅既盡也滅而不自知由别之而不别也立嗣宜分别同姓而繒不别莒人滅繒非滅也立異姓以蒞祭祀滅亡之道也魯既請於晉以屬鄫而中棄之晉為盟主坐視莒人滅同盟之國而不能正皆罪也公穀以昭四年書取鄫疑鄫未嘗滅故有立異姓為後之説不知莒人始滅之繼又復之使為附庸其後魯又取之與鄭既滅許而許復見經等耳果立異姓為後聖人宜直書其事以為世戒顧隱其辭曰滅則後人但知鄫之滅而無由知其立異姓為後也鑿而蔽於理故不可從冬叔孫豹如邾左傳冬穆叔如邾聘且修平平四年狐駘戰公初即位邾子來朝四年有狐駘之戰至是往聘修平以無忘舊好也季孫宿如晉左傳晉人以鄫故來討曰何故亡鄫鄫屬魯見滅故晉責魯季武子如晉見且聼命武子季孫宿始代父為卿見大國聼命受罪宿行父之子也父喪未期而遽如晉時襄公幼弱宿代父執政急自托於晉而實非公意也傳謂晉人以鄫故來討非也前年會戚己命鄫聼命於會鄫之亡於魯何與耶十有二月齊侯滅萊左傳十一月齊侯滅萊萊恃謀也賂夙沙衛之謀也事在二年于鄭子國之來聘也四月晏弱城東陽而遂圍萊子國聘在五年二年晏弱城東陽至五年四月復託治城因遂圍萊甲寅堙之環城傅于堞堙土山也堞女牆也周城為土山及女牆及把桓公卒之月此年三月乙未王湫帥師及正輿子棠人軍齊師王湫故齊人成十八年奔萊正輿子萊大夫棠杜注萊邑北海即墨縣有棠鄉今縣南甘棠社即古棠鄉也縣屬山東齊師大敗之丁未入萊萊共公浮柔奔棠浮柔萊共公名正輿子王湫奔莒莒人殺之四月陳無宇獻萊宗器于襄宫無宇桓子陳完玄孫襄宫齊襄公廟晏弱圍棠十一月丙辰而滅之遷萊于郳遷萊子于郳國高厚崔杼定其田高厚高固子公羊傳曷為不言萊君出奔國滅君死之正也萊近齊齊圖萊久矣自宣七年伐萊至是滅之晉文襄之世諸侯無敢相滅者成景以後開地於狄數滅小國故雖悼公復霸亦不能禁諸侯之相滅也日講春秋解義卷三十七
