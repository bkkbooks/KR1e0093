body:
  text: 欽定四庫全書日講春秋解義卷六十二哀公六年春城邾瑕瑕公羊作葭書城止此邾瑕杜注任城亢父縣北有邾婁城在今山東濟寧州南邾瑕如魯濟之類魯有負瑕故稱邾以别之不書取葢未嘗取而彊城見魯之弱邾也晉趙鞅帥師伐鮮虞左𫝊六年春晉伐鮮虞治范氏之亂也四年鮮虞納荀寅于柏人昭十二年楚䖍方熾而晉伐鮮虞十五年楚平初立布徳於諸侯而荀吴再伐之定四年召陵罷㑹士鞅及衞孔圉㑹伐五年吴方入郢士鞅又伐之於是盡失諸侯此年復有趙鞅之師則晉霸之衰皆由諸大夫貪伐鮮虞以自封殖故也吴伐陳左𫝊吴伐陳復修舊怨也元年未得志故楚子曰吾先君與陳有盟不可以不救乃救陳師于城父陳盟在昭十三年夏齊國夏及髙張來奔左𫝊齊陳乞偽事髙國者髙張國夏受命立荼陳乞欲害之故先偽事焉每朝必驂乗焉所從必言諸大夫言其罪過曰彼皆偃蹇将棄子之命偃蹇驕傲皆曰髙國得君必偪我盍去諸固将謀子子早圖之圖之莫如盡滅之需事之下也需疑也及朝則曰彼虎狼也彼謂諸大夫見我在子之側殺我無日矣請就之位欲與諸大夫謀髙國故求就之又謂諸大夫曰二子者禍矣言髙國二子恃得君而欲謀二三子曰國之多難貴寵之由盡去之而後君定既成謀矣盍及其未作也先諸作而後悔亦無及也大夫從之夏六月戊辰陳乞鮑牧牧鮑圉孫及諸大夫以甲入于公宫昭子聞之與恵子乘如公昭子髙張恵子國夏戰于荘敗髙國敗也荘六軌之道國人追之國夏奔莒遂及髙張晏圉弦施來奔圉晏嬰之子圉施不書非卿陳乞将立陽生故先逐國髙國髙奔而後陳乞弑君之謀得遂矣故先書二卿之奔於弑君之前以著難所自作而國髙不能衞上委君而逃之罪亦見矣叔還㑹吴于柤齊景既卒吴欲爭霸魯先徃會之秋七月庚寅楚子軫卒左𫝊秋七月楚子在城父将救陳卜戰不吉卜退不吉王曰然則死也再敗楚師不如死前已敗于柏舉今若退還亦是敗棄盟逃讎亦不如死死一也其死讎乎命公子申為王不可則命公子結亦不可則命公子啟申子西結子期啟子閭皆昭王兄五辭而後許将戰王有疾庚寅昭王攻大冥大冥杜注陳地在今河南項城縣境吴師所在也卒于城父子閭退曰君王舍其子而讓羣臣敢忘君乎從君之命順也從命許立立君之子亦順也二順不可失也與子西子期謀潜師閉塗逆越女之子章立之而後還閉塗不通外使也越女昭王妾章恵王是嵗也有雲如衆赤鳥夾日以飛三日楚子使問諸周大史周大史曰其當王身乎日為人君妖氣守之故以為當王身雲在楚上唯楚見之故禍不及他國若禜之可移于令尹司馬禜禳也王曰除腹心之疾而置諸股肱何益不榖不有大過天其夭諸有罪受罰又焉移之遂弗禜初昭王有疾卜曰河為祟王弗祭大夫請祭諸郊王曰三代命祀祭不越望諸侯望祀竟内山川星辰江漢雎漳楚之望也四水在楚界禍福之至不是過也不榖雖不徳河非所獲罪也遂弗祭孔子曰楚昭王知大道矣其不失國也宜哉夏書曰惟彼陶唐帥彼天常有此冀方今失其行亂其紀綱乃滅而亡夏書五子之歌也唐虞及夏同都冀州不易地而亡由于不知大道故又曰允出兹在兹由已率常可矣夏書大禹謨言信出已則福亦在已附録左𫝊八月齊邴意兹來奔髙國黨齊陽生入于齊齊陳乞弑其君荼荼公羊作舍左𫝊陳僖子使召公子陽生僖子陳乞召在七月今在八月下記事之次陽生駕而見南郭且于且于齊公子鉏與陽生同奔居魯南郭曰嘗獻馬于季孫不入于上乘故又獻此請與子乘之畏在家人聞其言故欲二人共載以試馬為辭出萊門而吿之故魯郭門也闞止知之先待諸外闞止陽生家臣子我也待外欲俱去公子曰事未可知反與壬也處壬陽生子簡公戒之遂行戒使無洩言逮夜至于齊國人知之故以昏至不欲令人知也國人知而不言言陳氏得衆僖子使子士之母養之隠于僖子家内子士母僖子妾與饋者皆入僖子又令陽生隨饋食之人入處公宫冬十月丁夘立之将盟盟諸大夫鮑子醉而徃其臣差車鮑點曰點鮑牧臣也差車主車之官此誰之命也陳子曰受命于鮑子遂誣鮑子曰子之命也見其醉故誣之鮑子曰女忘君之為孺子牛而折其齒乎而背之也孺子荼也景公嘗銜䋲為牛使荼牽之荼頓地故折其齒悼公稽首曰悼公陽生吾子奉義而行者也若我可不必亡一大夫言已可為君必不怨鮑子若我不可不必亡一公子公子自謂也恐鮑子殺已故要之義則進否則退敢不唯子是從廢興無以亂則所願也鮑子曰誰非君之子乃受盟使胡姬以安孺子如賴胡姬景公妾也安孺子之號賴杜注齊邑去鬻姒荼之母殺王甲拘江説囚王豹于句竇之丘三子景公嬖臣荼之黨也公使朱毛告於陳子曰朱毛齊大夫微子則不及此然君異于器不可以二器二不匱君二多難敢布諸大夫僖子不對而泣曰君舉不信羣臣乎以齊國之困困又有憂内有饑荒之困又有兵革之憂少君不可以訪是以求長君庶亦能容羣臣乎不然夫孺子何罪毛復命公悔之悔失言毛曰君大訪于陳子而圖其小可也大謂國政小謂殺荼使毛遷孺子于駘不至殺諸野幕之下葬諸殳冒淳恐駘人不從故毛駐于野張帳而殺之駘杜注齊邑殳冒淳杜注地名路史殳成國一名冒澤實以冬殺經書秋者史書秋記始事遂連其死通以秋告魯公羊𫝊弑而立者不以當國之辭言之此其以當國之辭言之何據齊公子商人弑其君舍而立書公子為諼也此其為諼柰何景公謂陳乞曰吾欲立舍何如陳乞曰所樂乎為君者欲立之則立之不欲立則不立貴自専也君如欲立之則臣請立之陽生謂陳乞曰吾聞子葢将不欲立我也陳乞曰夫千乘之主将廢正而立不正必殺正者晉世子申生是也吾不立子者所以生子者也走矣與之玉節而走之節信也析玉與陽生畱其半為後當迎之合以為信防稱矯也奔不書者未立為嗣景公死而舍立陳乞使人迎陽生于諸其家于諸寘也齊人語也除景公之喪期而小祥服期者除諸大夫皆在朝陳乞曰常之母有魚菽之祭常陳乞子重難言其妻故云爾齊俗婦人首祭事言魚豆者示薄陋無所有願諸大夫之化我也言欲以薄陋餘福共宴飲諸大夫皆曰諾于是皆之陳乞之家坐陳乞曰吾有所為甲甲鎧請以示焉諸大夫皆曰諾于是使力士舉巨囊而至于中霤巨囊大囊中央曰中霤諸大夫見之皆色然而駭色然驚駭貌開之則闖然公子陽生也闖出頭貌陳乞曰此君也已諸大夫不得已皆逡廵北面再拜稽首而君之爾知陳乞有備故不得已遂君之自是徃弑舍穀梁𫝊陽生入而弑其君以陳乞主之何也不以陽生君荼也其不以陽生君荼何也陽生正荼不正不正則其曰君何也荼雖不正己受命矣己受命于景公而立故可言君入者内弗受也荼不正何用弗受以其受命可以言弗受也先君已命立之于義可以拒之陽生其以國氏何也取國于荼也陽生之入與小白書入同然小白之入齊無君陽生之入齊有君則不得與小白比繫陽生於齊者以上文無所䝉下不言歸不書齊陽生将不知其為何國公子非以其當有國而繫之齊也弑荼者朱毛得國者陽生曷為不以罪齊無知者罪陽生而歸獄于乞於是齊政由陳氏矣彼陽生者一亡公子而已乞不有無君之心則陽生何由而入荼何自而弑春秋明正其罪所以正首惡杜亂源也冬仲孫何忌帥師伐邾既城瑕則邾無所恃故明年遂有入邾之役此其始事也宋向巢帥師伐曹七年春宋皇瑗帥師侵鄭左𫝊七年春宋師侵鄭鄭叛晉故也定八年鄭始叛宋連嵗有事於曹意鄭為援而侵之左氏以為為晉故也宋之叛晉久矣豈復為晉討鄭乎晉魏曼多帥師侵衞左𫝊晉師侵衛衛不服也五年晋伐衛至今未服夏公㑹吴于鄫鄫榖梁作繒左𫝊夏公㑹吴于鄫吴欲霸中國吴來徴百牢子服景伯對曰先王未之有也吴人曰宋百牢我是時吴過宋得百牢魯不可以後宋且魯牢晉大夫過十晉大夫范鞅也在昭二十一年吴王百牢不亦可乎景伯曰晉范鞅貪而棄禮以大國懼敝邑故敝邑十一牢之君若以禮命于諸侯則有數矣有常數若亦棄禮則有淫者矣淫過也周之王也制禮上物不過十二上物天子之牢以為天之大數也天有十二次故制禮象之今棄周禮而曰必百牢亦唯執事吴人弗聽景伯曰吴将亡矣棄天而背本違周為背本不與必棄疾于我言放其凶疾乃與之大宰嚭召季康子嚭吴大夫康子使子貢辭大宰嚭曰國君道長葢言君長大于道路而大夫不出門此何禮也對曰豈以為禮畏大國也畏大國不敢虚國盡行大國不以禮命于諸侯苟不以禮豈可量也寡君既共命焉其老豈敢棄其國大伯端委以治周禮仲雍嗣之斷髪文身臝以為飾豈禮也哉有由然也大伯周大王之長子仲雍大伯弟也大伯仲雍讓其弟季歴俱適荆蠻遂有民衆大伯卒無子仲雍嗣立不能行禮致化故效吴俗言其權時制宜以辟災害非以為禮也端委禮衣反自鄫以吴為無能為也棄禮知其不能霸也比年書㑹吴所以著公之失謀於始而遺患於後也秋公伐邾八月己酉入邾以邾子益來左𫝊季康子欲伐邾乃饗大夫以謀之子服景伯曰小所以事大信也大所以保小仁也背大國不信大國吴也伐小國不仁民保于城城保于徳失二徳者危将焉保二徳信與仁也孟孫曰二三子以為何如怪諸大夫不言故指問之惡賢而逆之孟孫賢景伯欲使大夫不逆其言惡猶安也對曰禹合諸侯于塗山執玉帛者萬國諸大夫對也諸侯執玉附庸執帛今其存者無數十焉唯大不字小小不事大也言諸侯相伐古來已然知必危何故不言知伐邾必危自當言今不言者不危故也大夫以答孟孫所怪且阿附季孫魯徳如邾而以衆加之可乎孟孫忿答大夫言不可不樂而出季孟意異佞直不同故罷饗秋伐邾及范門邾郭門也猶聞鐘聲邾不禦冦大夫諫不聽茅成子請吿于吴成子邾大夫茅夷鴻不許曰魯擊柝聞于邾言其近吴二千里不三月不至何及于我且國内豈不足言足以距魯成子以茅叛茅杜注髙平西南有茅鄉亭在今山東金鄉縣西北師遂入邾處其公宫衆師晝掠掠取財物邾衆保于繹繹杜注邾山也在鄒縣北今嶧山一名邾嶧山在鄒縣東南師宵掠以邾子益來益邾隠公也晝夜掠𫝊言康子無法獻于亳社以其亡國與殷同囚諸負瑕負瑕故有繹負瑕杜注魯邑髙平南平陽縣西北有瑕丘城在今山東滋陽縣西前者魯得邾之繹民使在負瑕故使相就以辱之邾茅夷鴻以束帛乘韋自請救于吴無君命故言自曰魯弱晉而逺吴馮恃其衆馮依而背君之盟辟君之執事辟陋以陵我小國邾非敢自愛也懼君威之不立君威之不立小國之憂也若夏盟于鄫衍鄫衍即鄫也秋而背之成求而不違言魯成其所求無違逆也四方諸侯其何以事君且魯賦八百乘君之貳也貳敵也魯以八百乘之賦貢于吴言其國大邾賦六百乘君之私也為私屬以私奉貳唯君圖之吴子從之為明年吴伐我𫝊公羊𫝊入不言伐此其言伐何内辭也若使他人然諱獲諸侯故不舉重而兩書使若魯公伐而去他人入之以來者邾婁子益何以名絶曷為絶之獲也曷為不言其獲内大惡諱也榖梁𫝊以者不以者也益之名惡也惡其不能死社稷春秋有臨天下之言焉有臨一國之言焉有臨一家之言焉其言來者有外魯之辭焉非已内有從外来者曰来今魯侯身自以歸而曰来是外之也三家欲倂邾而使公主兵葢廹於三子不得已也獲則三家享其利討則公受其惡春秋以諱不在公故直書而不避也不言滅明年魯歸邾子禾能有其國也在外曰以歸在内曰以来内外之别也宋人圍曹冬鄭駟𢎞帥師救曹左𫝊宋人圍曹鄭桓子思曰桓諡宋人有曹鄭之患也不可以不救冬鄭師救曹侵宋初曹人或夢衆君子立于社宫社宫社也而謀亡曹曹叔振鐸請待公孫彊許之振鐸曺始祖旦而求之曹無之無所謂公孫彊者戒其子曰我死爾聞公孫彊為政必去之及曹伯陽即位好田弋曹鄙人公孫彊好弋獲白雁獻之且言田弋之説説之因訪政事大説之有寵使為司城以聽政夢者之子乃行彊言霸説于曹伯曹伯從之乃背晉而奸宋宋人伐之晉人不救築五邑于其郊曰黍丘揖丘大城鍾邘為明年入曹𫝊黍丘杜注梁國下邑縣西南有黍丘亭按下邑即今河南之夏邑縣亭在縣西南揖丘當在今曺縣界大城當在今曹州界鍾當在今定陶縣界邘亦在定陶境内列國無盟主諸侯擅侵伐更相吞噬書圍曹罪宋也自魯救晉後凡晉楚之救皆不書此書救曹以大國不能援而諸侯自相救為世道之窮也八年春王正月宋公入曹以曹伯陽歸左𫝊八年春宋公伐曹将還禇師子肥殿子肥宋大夫曺人詬之不行詬詈辱也不行殿兵止也師待之公聞之怒命反之遂滅曺執曺伯及司城彊以歸殺之終曺人之夢公羊𫝊曺伯陽何以名絶曷為絶之滅也曷為不言其滅諱同姓之滅也何諱乎同姓之滅力能救之而不救也力能獲邾婁而不救曺故責之宋公滅曺而經書入先儒以為滅者亡國之善辭曺不書滅言自滅也考之春秋所書曺久困於宋非有大惡不幸而亡與諸國滅者無以異何獨文致其罪以為自滅或又以為曺亡春秋之終孔子至此不忍書滅此皆以私意穿鑿附㑹而不知其於義無當也宋之入曺葢取其地而不絶其祀故不以滅吿觀孟子時有曹交為曺君之弟則戰國之世曹尚未亡如陳蔡許滅而復存之類耳吴伐我書伐我始此左𫝊吴為邾故将伐魯問于叔孫輒輒故魯人叔孫輒對曰魯有名而無情有大國名無情實伐之必得志焉退而吿公山不狃不狃亦故魯人公山不狃曰非禮也君子違不適讎國違奔亡也未臣而又伐之奔命焉死之可也未臣所適之國若有伐本國者則可還奔命死其難所託也則隱曽所因託則為之隠惡且夫人之行也不以所惡廢鄉今子以小惡而欲覆宗國不亦難乎輒魯公族故謂之宗國若使子率子必辭王将使我子張病之子張輒也王問于子洩子洩不狃對曰魯雖無與立緩時若無能自立必有與斃急則人人知懼皆将同死戰諸侯将救之未可以得志焉晉與齊楚輔之是四讎也與魯而四夫魯齊晉之脣脣亡齒寒君所知也不救何為三月吴伐我子洩率故道險從武城故由險道欲使魯成備初武城人或有因于吴竟田焉僑田吴界拘鄫人之漚菅者曰何故使吾水滋鄫人亦僑田吴滋濁也及吴師至拘者道之以伐武城克之鄫人教吴必可克王犯嘗為之宰澹臺子羽之父好焉國人懼王犯吴大夫故嘗奔魯為武城宰澹臺子羽武城人孔子弟子也其父與王犯善國人懼其為内應懿子謂景伯若之何對曰吴師來斯與之戰何患焉且召之而至又何求焉吴師克東陽而進舍于五梧明日舍于蠶室三邑杜注魯地東陽今名闗陽鎮在山東費縣西南又縣西有五梧城即古五梧也蠶室亦應在縣西北境公賔庚公甲叔子與戰于夷獲叔子與析朱鉏公賓庚公甲叔子并析朱鉏為三人皆同車𫝊互言之獻于王王曰此同車必使能國未可望也同車能俱死是國能使人故不可望得明日舍于庚宗遂次于泗上㣲虎欲宵攻王舍㣲虎魯大夫私屬徒七百人三踊于幕庭于帳前設格令士試躍之卒三百人有若與焉卒終也終得三百人任行有若孔子弟子與在三百人中及稷門之内三百人行至稷門或謂季孫曰不足以害吴而多殺國士不如已也乃止之吴子聞之一夕三遷畏㣲虎吴人行成求與魯成将盟景伯曰楚人圍宋易子而食析骸而爨在宣十五年猶無城下之盟我未及虧而有城下之盟是棄國也吴輕而逺不能久将歸矣請少待之弗從景伯負載造于萊門負載書将欲出盟乃請釋子服何于吴吴人許之以王子姑曺當之而後止釋舍也魯恐吴不信欲畱景伯為質既得吴之許復求吴王之子以交質吴人不欲畱王子故遂兩止吴人盟而還不書盟諱恥前此書侵伐必言四鄙見魯之邉鄙猶有守禦之備也至是吴師直造國都則魯之四境藩屏蕩然而國不足為國矣夏齊人取讙及闡闡公羊作僤後同杜注闡在東平剛縣北今山東寧陽縣本魯闡邑地故剛城在縣東北左𫝊齊悼公之來也在五年季康子以其妹妻之即位而逆之季魴侯通焉魴侯康子叔父女言其情弗敢與也齊侯怒夏五月齊鮑牧率師伐我取讙及闡公羊𫝊外取邑不書此何以書所以賂齊也曷為賂齊為以邾婁子益來也榖梁𫝊惡内也凡内失邑不書自我與之則書取此與濟西田是也魯入邾而以其君來致齊以為辭故致賂以説之不書伐兵未加也附録左𫝊或譖胡姬于齊侯胡姬景公妾六年以安孺子如賴者曰安孺子之黨也六月齊侯殺胡姬𫝊言齊侯無道所以不終歸邾子益于邾左𫝊齊侯使如吴請師将以伐我乃歸邾子齊未得季姬故請師吴前為邾討魯懼二國同心故歸邾子邾子又無道吴子使大宰子餘討之子餘大宰嚭囚諸樓臺栫之以棘栫擁也使諸大夫奉大子革以為政革邾大子桓公也為十年邾子来奔𫝊穀梁𫝊益之名失國也于王法當絶故先書吴伐我又書齊取二邑然後書歸邾子于邾則是畏吴懼齊不勝困挫而後歸之也秋七月附録左𫝊秋及齊平九月臧賓如如齊涖盟齊閭丘明来涖盟賓如臧㑹子閭丘明嬰之子也盟不書畧之且逆季姬以歸嬖鮑牧又謂羣公子曰使女有馬千乘乎有馬千乘使為君也鮑牧本不欲立陽生故諷動羣公子公子愬之公謂鮑子或譖子子姑居于潞以察之潞杜注齊邑若有之則分室以行若無之則反子之所出門使以三分之一行半道使以二乘及潞麇之以入麇束縛也遂殺之冬十有二月癸亥把伯過卒齊人歸讙及闡左𫝊冬十二月齊人歸讙及闡季姬嬖故也歸不言來者齊本取讙闡脅魯歸邾子今既聽命則齊遂所欲非以魯能改過遷善服其義而歸之也歸濟西田言我此不言我者濟西田不獨我有之而所歸獨吾故封讙與闡則無疑焉耳九年春附録左𫝊九年春齊侯使公孟綽辭師于吴齊與魯平故辭吴師吴子曰昔嵗寡人聞命今又革之不知所從将進受命于君為十年吴伐齊𫝊王二月葬把僖公宋皇瑗帥師取鄭師于雍丘雍丘杜注雍丘縣屬陳畱郡今河南把縣治左𫝊鄭武子賸之嬖許瑕求邑無以與之賸罕逹也瑕武子之屬請外取許之瑕請取于他國故圍宋雍丘宋皇瑗圍鄭師許瑕師每日遷舍作壘塹成輒徙舍合其圍壘合鄭師哭子姚救之大敗子姚武子賸也二月甲戌宋取鄭師于雍丘使有能者無死惜其能也以郟張與鄭羅歸鄭之有能者公羊𫝊其言取之何易也其易柰何詐之也詐謂䧟阱竒伏之類榖梁𫝊取易辭也以師而易取鄭病矣以師之重而宋以易得之則鄭師将弱矣取鄭師者掩襲而盡俘以歸也觀左氏所載使有能者無死而止以二人歸則殺人多矣春秋之末特書取師者二葢詐力相傾竒變滋起故甚其譎惡其盡謝氏所謂著其禍之大者是也夏楚人伐陳左𫝊夏楚人伐陳陳即吴故也六年吴伐陳楚昭救之卒於城父不克而還陳以無援故即吴楚恵不念已之不能庇陳而憤其背已今年伐陳明年公子結復伐之十三年公子申又伐之終春秋之世陳困於楚弗克自振備書其事而楚人暴横不道之罪著矣秋宋公伐鄭左𫝊宋公伐鄭報雍丘宋自齊景之殁妄圖興霸前年以曺伯陽歸鄭不能救今又取鄭師其志益驕以鄭為易與遂親帥師以伐其國明年偏師再伐十二年向巢又伐至十三年而喪師於嵒與雍丘之後得失相當葢所自取也附録左𫝊秋吴城䢴溝通江淮䢴杜注于䢴江築城穿溝東北通射陽湖西北至宋口入淮通糧道廣陵䢴江是也晉趙鞅卜救鄭遇水適火水火之兆占諸史趙史墨史龜皆晉史史龜曰是謂沈陽火陽得水故沈可以興兵兵隂類也故可以興兵利以伐姜不利子商姜齊姓火師之後火弱故伐利子商姓屬水故伐不利伐齊則可敵宋不吉史墨曰盈水名也子水位也趙鞅姓盈宋姓子水盈坎乃行子姓又得北方水位名位敵不可干也二水俱盛故言不可干炎帝為火師神農有火瑞以火名官姜姓其後也水勝火伐姜則可史趙曰是謂如川之滿不可游也既盈而得水位故為如川之滿不可游言其波流盛鄭方有罪不可救也鄭以嬖寵伐人故以為有罪救鄭則不吉不知其他陽虎以周易筮之遇泰乾下坤上泰之需乾下坎上需泰六五變曰宋方吉不可與也不可與戰泰六五曰帝乙歸妹以祉元吉帝乙紂父隂而得中類王者嫁妹得如其願受福禄而大吉㣲子啟帝乙之元子也宋鄭甥舅也宋鄭為婚姻甥舅之國宋㣲子之後今卜得帝乙卦故以為宋吉祉禄也若帝乙之元子歸妹而有吉禄我安得吉焉乃止冬十月附録左𫝊冬吴子使來儆師伐齊前年齊與吴謀伐魯齊既與魯成而止故吴恨之反與魯謀伐齊十年春王二月邾子益來奔左𫝊十年春邾隠公來奔齊甥也故遂奔齊終子貢之言益先為魯所俘復之未幾而自失其國又来奔魯其不知恥甚矣公㑹吴伐齊三月戊戌齊侯陽生卒左𫝊公㑹吴子邾子郯子伐齊南鄙師于鄎鄎杜注齊地邾郯不書兵并屬吴齊人弑悼公赴于師以説吴吴子三日哭于軍門之外徐承帥舟師将自海入齊徐承吴大夫齊人敗之吴師乃還陽生之死𫝊書弑而經書卒杜氏預謂以疾赴以事勢推之齊為大國其止吴師小嫌也齊人何至遽弑其君以説乎葢當時以吴師在齊而悼公適斃遂以為弑耳𫝊如此類皆未可信信經可也夏宋人伐鄭晉趙鞅帥師侵齊左𫝊夏趙鞅帥師伐齊經書侵以侵告大夫請卜之趙孟曰吾卜于此起兵謂往嵗卜伐宋不吉利以伐姜故今興兵事不再令再令凟也卜不襲吉襲重也行也于是乎取犂及轅犂轅杜注犂一名隰濟南有隰隂縣祝阿縣西有轅城今山東臨邑縣西有漯隂故城即齊犂邑禹城縣西北有瑗城即轅也毁髙唐之郭侵及賴而還乘吴之亂伐齊之喪無名甚矣故書侵五月公至自伐齊葬齊悼公衞公孟彄自齊歸于衞彄蒯聵之黨今歸于衞是從輒而背蒯聵也故春秋後蒯聵入國彄復奔齊薛伯夷卒夷公羊作寅秋葬薛恵公附録左𫝊秋吴子使來復儆師伐齊未得志故為明年吴伐齊𫝊冬楚公子結帥師伐陳吴救陳書救止此左𫝊冬楚子期伐陳吴延州来季子救陳謂子期曰二君不務徳二君吴楚而力爭諸侯民何罪焉我請退以為子名務徳而安民乃還季子吴王夀夢少子也夀夢以襄十二年卒至今七十七嵗夀夢卒季子已能讓國年當十五六至今葢九十餘陳之禍吴為之也吴不挾陳以從已則楚陳無釁何用救為書救著其志在爭諸侯非真有扶危恤患之義葢與楚之救鄭同耳日講春秋解義卷六十二
