body:
  text: 欽定四庫全書日講春秋解義卷六桓公四年春正月公狩于郎此書蒐狩之始左傳四年春正月公狩于郎書時禮也公羊傳狩者何田狩也田者蒐狩之總名春曰苗秋曰蒐蒐簡擇也舍小取大冬曰狩常事不書此何以書譏何譏爾遠也以其地逺諸侯曷爲必田狩一曰乾豆上殺乾之以爲豆實可以祭祀二曰賓客次殺以供賓客三曰充君之庖下殺備君庖廚之用穀梁傳四時之田皆爲宗廟之事也春曰田取獸于田夏曰苗秋曰蒐冬曰狩四時之田用三焉惟其所先得一爲乾豆二爲賓客三爲充君之庖戎祀國之大事蒐苗獮狩皆所以講祀事也然先王四時之田皆於農隙以講事有常時矣諸侯田狩不過郊皆擇山林翳密之地有常所矣有常時有常所則民不以爲累物不以爲害周之正月夏之仲冬於時爲宜狩但魯狩大野乃常所也今不於大野而遠至郎地則非常所矣故書以示譏夏天王使宰渠伯糾來聘左傳夏周宰渠伯糾來聘父在故名公羊傳宰渠伯糾者何天子之大夫也其稱宰渠伯糾何下大夫也宰冢宰也渠氏伯爵糾其名也桓弟弑兄臣弑君不類見不請命天王不能討而反使冢宰下聘天理滅人道亡矣王朝公卿書爵大夫書字上士中士書名下士書人糾位六卿之長降而書名罪失職也操刑賞之柄以馭下者王也論刑賞之法以詔王者宰也乃爲亂首承命以聘弑君之賊乎於來聘名宰而天王從其常稱示王當奉天命彰天討也於錫命王不稱天而榮叔無譏焉其義蓋互相備糾書官又書爵任愈重則責愈大而恥愈深也附錄左傳秋秦師侵芮敗焉小之也秦國今陜西清水縣有故秦城冬王師秦師圍魏執芮伯以歸五年春正月甲戌己丑陳侯鮑卒左傳五年春正月甲戌己丑陳侯鮑卒再赴也于是陳亂文公子佗殺太子免而代之佗桓公弟五父也稱文公子明非桓公母弟也免桓公太子公疾病而亂作國人分散故再赴公羊傳曷爲以二日卒之怴也怴者狂也齊人語甲戌之日亡己丑之日死而得君子疑焉故以二日卒之也二日卒之者闕疑榖梁傳鮑卒何爲以二日卒之春秋之義信以傳信疑以傳疑明實錄也陳侯以甲戌之日岀己丑之日得不知死之日故舉二日以包也言陳侯避病以甲戌日出己丑之日得之不知其死之日故舉二日以包之陳侯鮑曷爲以二日卒按左氏公疾病而亂作則甲戌之下當有陳佗作亂之事而史闕之耳疑以傳疑聖人之慎也夏齊侯鄭伯如紀左傳夏齊侯鄭伯朝于紀欲以襲之紀人知之公羊傳外相如不書此何以書離不言㑹也時紀不與㑹故畧言也外相朝曰如春秋之世小役大弱役彊雖敵體之國不相朝也今以齊鄭之彊大相率而朝小弱之紀蓋實襲之幸紀人覺其詐而不得逞耳此外相如爾何以書紀人主魯故來告而魯史書之孔子存而不削以著齊人滅紀之罪明紀侯去國之由劉敞所謂聖人誅意之效是也紀近於齊許近於鄭齊欲得紀與鄭謀之而卒得紀鄭欲得許與齊謀之而卒得許王綱解紐彊大横行相要以利相傾以勢相尚以詐相助以惡而弱小無所逃其禍此春秋於紀侯之去弦子之奔所以無多責也天王使仍叔之子來聘仍穀梁作任左傳仍叔之子弱也譏使童子出聘公羊傳仍叔之子者何天子之大夫也其稱仍叔之子何譏何譏爾譏父老子代從政也穀梁傳任叔之子者錄父以使子也錄父使子者謂不氏名其人稱父言子也故微其君臣而著其父子不正父在子代仕之辭也古者官有世祿但使之食租衣稅而不畀以政事先王所以優恤功臣而防其敝者至矣周衰官人以世而大臣固位賴寵惟恐失之欲及其尚存而見子孫之進用故未有職司者或承王命而有事於諸侯春秋書武氏子仍叔之子云者戒後世人主狥大臣私意用其子弟而任之不以其賢使之不以其能也葬陳桓公不書月史失之也蓋陳佗簒立而葬之城祝丘祝丘杜注魯地漢即丘縣孟康曰春秋時之祝丘也今山東沂州東南有即丘城祝丘齊魯兩境上邑也齊將襲紀公欲助紀而畏齊故城此以備之書譏不時也秋蔡人衞人陳人從王伐鄭左傳王奪鄭伯政鄭伯不朝秋王以諸侯伐鄭鄭伯禦之王爲中軍虢公林父將右軍虢公林父王卿士蔡人衞人屬焉周公黑肩將左軍黑肩周桓公也陳人屬焉鄭子元請爲左拒子元鄭公子拒方陳也以當蔡人衞人爲右拒以當陳人曰陳亂民莫有鬭心若先犯之必奔王卒顧之必亂蔡衞不枝固將先奔既而萃于王卒可以集事萃聚也集成也從之曼伯爲右拒曼伯檀伯祭仲足爲左拒原繁高渠彌以中軍奉公二人鄭臣爲魚麗之陳先偏後伍伍承彌縫司馬法車戰二十五乘爲偏以車居前以伍次之承偏之隙而彌縫闕漏也五人爲伍此蓋魚麗陳法戰于繻葛繻葛杜注鄭地或云即長葛也命二拒曰旝動而鼓旝旃也通帛爲之蓋今大將之麾也執以爲號令蔡衞陳皆奔王卒亂鄭師合以攻之王卒大敗祝耼射王中肩王亦能軍祝耼鄭臣王雖傷猶殿而不奔故言能軍祝耼請從之公曰君子不欲多上人况敢陵天子乎茍自救也社稷無隕多矣夜鄭伯使祭足勞王且問左右公羊傳其言從王伐鄭何從王正也穀梁傳舉從者之辭也謂若王不親伐直舉三國從王命之辭也其舉從者之辭何也爲天王諱伐鄭也諱自伐鄭鄭同姓之國也在乎冀州于是不服爲天子病矣冀州者天下之中州自唐虞及夏殷皆都焉則冀州是天子之常居後王雖不都冀州亦得以冀州言之鄭近王畿故云在乎冀州言親近猶不能服則疏逺者可知王不稱天非天討也不書敗示諸侯不可敵王也鄭伯不朝固爲有罪然其罰至貶爵削地而止耳魯桓弑君而自立宋督弑君而得政天討不加乃親帥與鄭私憾之三國以伐之而陳佗簒弑之賊亦許以師從用此爲鄭所窺乘其瑕釁以敗王師而自是王命遂不行於天下春秋明治亂得失之原故王不稱天以正其夲三國書從以著人臣之義伐不書敗以存共主之體而鄭抗王師之罪亦不可掩輕重之權衡君臣之名分莫不畢見凡此皆裁自聖心非國史所能與也大雩此書雩之始左傳秋大雩書不時也凡祀啓蟄而郊啓蟄夏正建寅之月祀天南郊龍見而雩龍見建巳之月蒼龍之宿昏見東方萬物始盛待雨而大故祭天爲百穀祈膏雨始殺而嘗建酉之月隂氣始殺嘉穀始熟故薦嘗於宗廟閉蟄而烝建亥之月昆蟲閉藏萬物皆成可薦者衆故烝祭宗廟過則書祭必當卜卜有吉否不吉則改卜次旬卜不過三故限以一月過渉次月之節則書之以譏其慢公羊傳大雩者何旱祭也雩旱請雨祭名然則何以不言旱言雩則旱見言旱則雩不見何以書記災也大雩雩于上帝用盛樂也諸侯雩于境内之山川而配以上公禮也大雩則僭天子之禮矣然魯僭郊禘大雩舊矣欲悉書於策則不勝書故雩祭則因旱以書而特謂之大郊禘亦各因事而書以見其非義蓋分所不屬則氣不能相感此先王制禮之精義按以春秋所書而可見者也螽公羊作􅏑公羊傳何以書記災也榖梁傳螽蟲災也甚則月不甚則時螽之爲物常因旱而生以害稼故書冬州公如曹州國名姜姓曹杜注曹國濟陰定陶縣今山東定陶縣西北有故城即曹國也左傳冬淳于公如曹度其國危遂不復淳于杜注州國所都城陽淳于縣也今山東安丘縣東北有淳于故城公羊傳外相如不書此何以書過我也榖梁傳外相如不書此其書何也過我也天子三公稱公王者之後稱公州稱公與祭公同蓋天子三公而食邑於州者外相如不書此何以書自曹而來魯將有其末故先錄其夲也六年春正月實來左傳六年春自曹來朝書曰實來不復其國也公羊傳實來者何猶曰是人來也孰謂謂州公也曷爲謂之實來慢之也曷爲慢之化我也行過國竟而無禮于人謂之化穀梁傳實來者是來也何謂是來謂州公也其謂之是來何也以其畫我過我也故簡言之也諸侯不以過相朝也實或曰州公名或曰州公如曹而實來魯從省文也言奔則來行朝禮言朝則遂留不去故曰實來若覆書州公來則與祭伯來同而無以見不復其國之義矣附錄左傳楚武王侵隨隨國名姬姓侯爵杜注義陽隨縣西魏置隨州今屬湖廣徳安府古城在州南使薳章求成焉薳章楚大夫軍于瑕以待之瑕隨地隨人使少師董成董正也鬭伯比言于楚子曰伯比楚大夫令尹子文父吾不得志于漢東也漢釋例漢水出武都至江夏入江武都今陜西寧羌州江夏今湖廣江夏縣我則使然我張吾三軍而被吾甲兵以武臨之彼則懼而協以謀我故難間也漢東之國隨爲大隨張張自侈大也必棄小國小國離楚之利也少師侈請羸師以張之羸弱也熊率且比曰季梁在何益熊率且比楚大夫季梁隨賢臣鬭伯比曰以爲後圖少師得其君言季梁之諫不過一見從卒當以少師爲計故云以爲後圖王毁軍而納少師少師歸請追楚師隨侯將許之季梁止之曰天方授楚楚之羸其誘我也君何急焉臣聞小之能敵大也小道大淫所謂道忠于民而信於神也上思利民忠也祝史正辭信也今民餒而君逞欲祝史矯舉以祭臣不知其可也公曰吾牲牷肥腯牲牛羊豕也牷純色完全也腯亦肥也粢盛豐備黍稷曰粢在器曰盛何則不信對曰夫民神之主也神依于民是以聖王先成民而後致力于神故奉牲以告曰博碩肥腯謂民力之普存也博廣也碩大也謂其畜之碩大蕃滋也謂其不疾瘯蠡也謂其備腯咸有也雖告神以博碩肥腯其實皆當兼此四謂民力適完則六畜旣大而滋也皮毛無疥癬兼備而無有所闕奉盛以告曰絜粢豐盛謂其三時不害而民和年豐也奉酒醴以告曰嘉栗旨酒嘉善也栗敬也謂其上下皆有嘉德而無違心也所謂馨香無讒慝也故務其三時修其五教父義母慈兄友弟恭子孝親其九族以致其禋祀禋絜敬也九族謂外祖父外祖母從母子及妻父妻母姑之子姊妹之子女子之子非己之同族皆外親有服而異族者也于是乎民和而神降之福故動則有成今民各有心而鬼神乏主君雖獨豐其何福之有君姑修政而親兄弟之國庶免于難隨侯懼而修政楚不敢伐夏四月公㑹紀侯于郕郕左傳公羊傳作成杜注魯地泰山鉅平縣東南今山東寧陽縣東北有故城社即古成城也左傳夏㑹于成紀來諮謀齊難也齊欲滅紀故來謀五年齊鄭如紀欲以襲之而弗遂至是且將大加兵其國紀睦於魯越境而謀公徃㑹之蓋有不得已者是以春秋無譏焉附錄左傳北戎伐齊齊侯使乞師于鄭鄭太子忽帥師救齊六月大敗戎師獲其二帥大良少良二帥名甲首三百甲首被甲者首以獻于齊于是諸侯之大夫戍齊齊人饋之餼生曰餼使魯爲其班後鄭班次也鄭忽以其有功也怒故有郎之師郎師在十年公之未昏于齊也齊侯欲以文姜妻鄭太子忽太子忽辭人問其故太子曰人各有耦齊大非吾耦也詩云自求多福在我而已大國何爲君子曰善自爲謀及其敗戎師也齊侯又請妻之欲以他女妻之固辭人問其故太子曰無事于齊吾猶不敢今以君命奔齊之急而受室以歸是以師昏也民其謂我何遂辭諸鄭伯假父之命以爲辭爲十一年鄭忽出奔衞傳秋八月壬午大閲此書大閲之始左傳秋大閲簡車馬也公羊傳大閲者何簡車徒也何以書蓋以罕書也罕希也大閲之禮三年一舉桓公忽忘武備過于三年是以書之穀梁傳大閲者何閲兵車也修教明諭修先王之教以明逹于民國道也治國之道平而修戎事非正也平謂不因田獵無事而修之其日以爲崇武故謹而日之蓋以觀婦人也大閲者簡閲車徒而訓習之也周禮以仲冬之月大閲其法視三時爲獨詳者農隙故也周之八月乃夏正建未之月以盛夏而大閲則非其時矣昭定之間或書蒐或書大蒐凡稱大者皆僭用天子之禮也先王寓軍政於四時之田訓民禦暴其備豫也今以懼鄭忽畏齊人非時越禮而簡兵車不獨厲農失政平時軍政之不修亦可見矣蔡人殺陳佗公羊傳陳佗者何陳君也陳君則曷爲謂之陳佗絶也曷爲絶之賤也其賤奈何外淫也惡乎淫淫乎蔡蔡人殺之穀梁傳陳佗者陳君也其曰陳佗何也匹夫行故匹夫稱之也其匹夫行奈何陳侯憙獵淫獵于蔡與蔡人爭禽蔡人不知其是陳君也而殺之何以知其是陳君也兩下相殺不道兩大夫相殺不書其不地于蔡也蔡人殺陳佗者討賊之辭也亂臣賊子或夲國之臣子或鄰國之君臣茍有一人能起而誅之則春秋以討賊之義予之矣凡簒弑而稱君者著其國之臣子不以爲賊而奉之也書陳佗則知陳之臣子夲不以佗爲君矣用此見春秋之初先王之澤未冺人心正理猶存故州吁陳佗無知皆不容於天壌焉又以知五年陳侯鮑卒甲戌以下所闕即佗弑太子免事也九月丁卯子同生左傳九月丁卯子同生以太子生之禮舉之接以太牢太牢牛羊豕也以禮接夫人重嫡也卜士負之士妻食之禮世子生三日卜士負之射人以桑弧蓬矢射天地四方卜士之妻爲乳母公與文姜宗婦命之世子生三月君夫人沐浴於外寢立于阼階西鄉世婦抱子升自西階君命之乃降宗婦同宗之婦命之命名也公問名于申繻魯大夫對曰名有五有信有義有象有假有類以名生爲信若唐叔虞魯公子友以德命爲義若文王名昌武王名發以類命爲象若孔子首象尼丘取于物爲假若伯魚生人有饋之魚因名之曰鯉取于父爲類若子同生有與父同者不以國不以官不以山川不以隱疾不以畜牲不以器幣周人以諱事神名終將諱之諱始于周周人以諱法敬事明神子生三月爲之立名以其終將諱之故須豫有所避故以國則廢名國不可易故廢名以官則廢職以山川則廢主改其山川之名以畜牲則廢祀以器幣則廢禮晉以僖侯廢司徒僖侯名司徒廢爲中軍宋以武公廢司空武公名司空廢爲司城先君獻武廢二山二山具敖也魯獻公名具武公名敖更以其鄉名山是以大物不可以命公曰是其生也與吾同物物類也謂同日生命之曰同公羊傳子同生者孰謂謂莊公也何言乎子同生喜有正也喜國有正嗣未有言喜有正者此其言喜有正何乆無正也子公羊子曰其諸以病桓與穀梁傳疑故志之文姜淫于齊襄疑非公之子時曰同乎人也時人僉曰齊侯之子同于他人先儒皆謂嫡長始生即書於䇿此舊史之法非春秋書子同生之義也文公成公皆嫡嗣何以莊之生獨書文姜禽獸行故書之以正周公之後决後世之疑而朱子按經以核其事迹謂桓三年姜氏至自齊六年子同生十八年桓公乃與姜氏同如齊則莊公誠非齊侯之子以正二傳之妄也不曰世子何也天下無生而貴者故誓於天子然後爲世子冬紀侯來朝左傳冬紀侯來朝請王命以求成于齊公告不能紀微弱不能自通于天子欲因公以請王命公無寵于王故告不能魯桓弑君簒立天下之大惡也紀侯有齊難不能上告於天子自彊於政治和輯其民效死以守而求援於簒弑之人其能國乎七年春二月己亥焚咸丘咸丘杜注魯地髙平鉅野縣南有咸亭今屬山東兗州府公羊傳焚之者何樵之也樵薪也以樵燒之故曰樵之齊人語樵之者何以火攻也何言乎以火攻疾始以火攻也咸丘者何邾婁之邑也曷爲不繫乎邾婁國之也曷爲國之君存焉爾穀梁傳其不言邾咸丘何也疾其以火攻也古者昆蟲蟄而後火田去莽翳以逐禽獸但焚一叢一聚非竭山澤而焚之也易稱王用三驅在禮天子不合圍諸侯不掩羣所以養仁心而盡物之性也周之二月夏之十二月昆蟲未出固可以用火但已過冬狩之期而未及春蒐且咸丘非狩地故不言蒐狩直書曰焚以譏其盡物也夏穀伯綏來朝鄧侯吾離來朝穀杜注穀國在南鄉筑陽縣北今湖廣穀城縣治爲故筑陽城古穀城在縣北左傳七年春穀伯鄧侯來朝名賤之也二國以春來夏乃行朝禮故經書夏公羊傳皆何以名失地之君也其稱侯朝何貴者無後待之以初也貴者無後即郊特牲古者寓公不繼世之義諸侯不臣寓公寓公死則臣其子不得繼父寓公之世故曰無後也待之以初言穀鄧與魯夲同貴爲諸侯當待之如初也穀梁傳其名何也失國也失國則其以朝言之何也嘗以諸侯與之接矣雖失國弗損吾異日也待之以初春秋時諸侯相朝皆小國迫於鄰近之大國不得已而爲恭也榖鄧近楚而遠於魯地之相去千有餘里無緣越蔡許陳曹宿邾而來朝於魯以情事揆之必爲楚所逼失地而奔近楚之國皆不敢容故遠託於魯而魯桓以簒弑得國欲以遠國來朝爲名俾行朝禮以自侈大而震耀其臣民故舊史承而書之而實則失地之君故春秋據其實而稱名也先儒以爲貶其朝桓則身爲簒弑者㑹盟侵伐皆不書名而獨於朝之者舉罰頗其類矣至謂去秋冬二時以二國朝桓逆亂天道歲功不成則穿鑿附㑹將以扶植世教而轉破碎經指義不可通使孔子果以宰糾聘桓而闕秋冬則次年仍叔之子來聘亦宜復闕果以鄧榖朝魯而闕秋冬則當於滕子來朝四國㑹稷以成宋亂先見此義聖人作經不若是之疎也且幸四年七年秋冬適無事可書而闕之如有事將並闕其事耶抑書其事而獨闕二時耶義益無所處矣附錄左傳夏盟向求成于鄭既而背之盟向二邑名隱十一年王以與鄭故求與鄭成秋鄭人齊人衞人伐盟向王遷盟向之民于郟郟杜注王城今河南洛陽縣西有郟鄏陌冬曲沃伯誘晋小子侯殺之曲沃伯武公也小子侯哀侯子八年春正月己卯烝公羊傳烝者何冬祭也春曰祠祠猶食也猶繼嗣也春物始生孝子思親繼嗣而食之故曰祠薦尚韭卵夏曰礿始熟可礿故曰礿薦尚麥魚秋曰嘗嘗者先辭也秋穀成者非一黍先熟可得薦故曰嘗薦尚黍豚冬曰烝烝衆也氣盛貌冬萬物畢成所薦衆多芬芳備具故曰烝薦尚稻鴈常事不書此何以書譏何譏爾譏亟也亟數也亟則黷渫黷也黷則不敬君子之祭也敬而不黷疏則怠怠則忘士不及兹四者則冬不裘夏不葛四者四時祭也裘葛冬夏之羙服言士有公事不得及此四時之祭則不敢美其衣服蓋思念親之至也穀梁傳烝冬事也春興之志不時也周人以建子爲歲首周之春正月夏之十一月也烝以中冬不失時矣常事不書此何以書經有先起事以見義者書此以見夏五月之再烝爲黷禮也穀梁以春舉冬祭爲不時則未知周雖改朔而巡狩烝享猶用夏時且尚書洛誥王在新邑烝祭歲在十有二月則用亥月烝祭亦未爲失禮也天王使家父來聘家父天子大夫家氏父字下聘弑逆之人而無貶何也既名冢宰於其重者而舉法焉餘則從同之義也蓋君相一體任之重斯責之專故歸賵仲子㑹葬成風則宰咺書名於前王不稱天於後來聘桓公錫桓公命則宰糾書名以正其始王不稱天以正其終而榮叔家父之徒無貶也此即虞書君臣相戒庶事之原皆繫於元首股肱之義附錄左傳八年春滅翼曲沃滅之隨少師有寵楚鬬伯比曰可矣讎有釁不可失也無徳者寵國之釁也夏五月丁丑烝公羊傳何以書譏亟也穀梁傳烝冬事也春夏興之黷祀也志不敬也以季春而舉冬祭非時也建子之月既烝而建辰之月復烝必以前烝爲不備也其黷亂不經甚矣附錄左傳夏楚子合諸侯于沈鹿沈鹿杜注楚地今湖廣鍾祥縣東里有鹿湖池即其地也黄隨不㑹黄嬴姓杜注黄國弋陽縣魏置弋陽郡于此今河南光州境弋陽城在州東黄城在州西使薳章讓黄讓責也楚子伐隨軍于漢淮之間淮漢志南陽郡平氏縣禹貢桐柏大復山在東南淮水所出平氏故城在今河南南陽府西北季梁請下之下之請服也弗許而後戰所以怒我而怠冦也少師謂隨侯曰必速戰不然將失楚師随侯禦之望楚師遙見楚師季梁曰楚人上左君必左君楚君也無與王遇且攻其右右無良焉必敗偏敗衆乃攜矣少師曰不當王非敵也弗從戰于速杞速杞杜注隨地當在今湖廣應山縣境隨師敗績隨侯逸逃也鬭丹獲其戎車丹楚大夫與其戎右少師寵之以爲車右秋隨及楚平楚子將不許鬭伯比曰天去其疾矣少師見獲而死是去其疾隨未可克也乃盟而還秋伐邾桓自弑立恃其彊惡以陵小國小國皆畏而從之故紀郕滕杞或朝或會惟邾恃舊好而不顧至是遂伐之以是知儀父蓋知義者也隱有讓國之心則即位三月即來講好桓有簒弑之惡則定位六年尚不與通伐之而仍不至逮十五年然後與牟葛同來蓋困於力之不支耳冬十月雨雪公羊傳何以書記異也何異爾不時也周之十月夏之八月未當雨雪故曰不時建酉之月未霜而雪書異也隂陽方中而寒氣先至此積隂侵陽之象春秋凡三書雨雪其二言大以大爲異也此不言大以非時爲異也附錄左傳冬王命虢仲立晉哀侯之弟緡于晉虢仲王卿士虢公林父祭公來遂逆王后于紀此書遂之始左傳祭公來遂逆王后于紀禮也天子娶于諸侯使同姓諸侯爲之主祭公來受命于魯故曰禮公羊傳祭公者何天子之三公也祭者采也天子三公氏采稱爵何以不稱使昏禮不稱主人時王者有母也遂者何生事也生猶造也專事之辭大夫無遂事此其言遂何成使乎我也以上來無事知遂成使于我其成使乎我奈何使我爲媒可則因用是徃逆矣昏禮成于五先納采問名納吉納徴請期然後親迎今王使祭公來命魯爲媒即因用魯徃迎之不復成禮疾王不重妃匹也女在其國稱女此其稱王后何王者無外其辭成矣成其爲王后之辭也穀梁傳其不言使焉何也不正其以宗廟之大事即謀于我故弗與使也時天王命祭公就魯共卜擇紀女可爲后者便逆之不復反命遂繼事之辭也其曰遂逆王后故畧之也以其遂逆無禮故不書逆女而曰王后畧謂不以禮稱之或曰天子無外王命之則成矣四海之濱莫非王臣王命紀女爲后則已成王后非如諸侯入國乃稱夫人大夫出疆有以二事出者有以一事出而專繼事者其書皆曰遂祭公蓋受王命問期於魯并逆后于紀耳未有無王命而敢專行者獨書曰來正見非有聘問之事於魯即爲逆后來耳不稱使昏禮不稱主人也左傳莊十八年虢公晉侯鄭伯使原莊公逆王后于陳不言王使而曰虢晉鄭使蓋古禮如此先儒謂三公師傅之官坐而論道不宜逆女宜使卿徃公監之蓋據襄公十五年劉夏逆王后于齊傳稱官師從單靖公逆王后于齊而經獨書劉夏爲義蓋謂劉夏以非卿而書靖公合禮則不書也然以傳所書原莊公單靖公證之又似三公逆后周制固然故並存以備稽考日講春秋解義卷六
