body:
  text: 欽定四庫全書日講春秋解義卷三十宣公十有四年春衛殺其大夫孔達左傳十四年春孔達縊而死衛人以説于晉而免以殺告故免于伐遂告于諸侯曰寡君有不令之臣達構我敝邑于大國既伏其罪矣敢告衛人以為成勞復室其子以逹有平國之功故以女妻其子使復其位孔達自縊而稱國以殺端本清源之意也進謀者臣而制命者君始則用其謀以行私終則殺其人以謝過可乎此與魯刺公子買之事無異故不去其官夏五月壬申曹伯夀卒晉侯伐鄭左傳夏晉侯伐鄭為邲故也晉敗于邲鄭遂屬楚告于諸侯搜焉而還中行桓子之謀也曰示之以整使謀而來使鄭自謀而來服晉鄭人懼使子張代子良于楚十二年子良質于楚子張穆公孫鄭伯如楚謀晉故也鄭以子良為有禮故召之有讓國之禮事在四年晉以救鄭致敗于邲鄭乃翻然從楚楚之得志於諸侯未有甚於此時者也而晉景奮然自將以伐鄭自是合諸侯以伐鄭者一同盟者四皆君親之於是齊魯從而鄭亦服是以為國貴自強也秋九月楚子圍宋左傳楚子使申舟聘于齊申舟無畏曰無假道于宋亦使公子馮聘于晉不假道于鄭申舟以孟諸之役惡宋文十年楚子田孟諸無畏抶宋公僕曰鄭昭宋聾昭明也聾暗也晉使不害我則必死王曰殺女我伐之見犀而行犀申舟子以子託王示必死及宋宋人止之華元曰過我而不假道鄙我也鄙我亡也以我比其邉鄙是與亡國同殺其使者必伐我伐我亦亡也亡一也乃殺之楚子聞之投袂而起投振也屨及于窒皇窒皇寢門闕劍及于寢門之外車及于蒲胥之市蒲胥楚市言其興師甚速秋九月楚子圍宋楚莊始則滅蕭以逼宋繼則伐宋以聲其救蕭之罪又遣使不假道以激怒於宋而使殺之至是國君親將環其國而攻之宋為晉受兵而晉坐視不救咎在晉耳胡氏安國於衛人救陳以為著宋之罪而伐宋圍宋皆曰宋所自取失經旨矣晉之失謀莫過於置宋不救蓋果能悉師救宋因宋以守雖勝不可必而楚人糧盡師老無功而退天下諸侯畏楚之殘服晉之義必將改圖北嚮而霸事可成乃比之雖鞭之長不及馬腹不知宋既折而入楚則餘威震於齊魯而南北分霸之勢成矣甚矣晉人之昏冥也葬曹文公冬公孫歸父會齊侯于榖左傳冬公孫歸父會齊侯于穀見晏桓子晏今山東齊河縣西北有晏城寰宇記謂之晏嬰城桓子晏嬰父與之言魯樂桓子告髙宣子曰宣子髙固子家其亡乎子家歸父字懷于魯矣懷戀也懷必貪貪必謀人謀人人亦謀已一國謀之何以不亡為十八年歸父奔齊傳魯西南與宋為界楚人圍宋有震鄰之恐行父當國欲使歸父會楚以謀其不免但素服於齊而方是時楚使申舟聘齊是齊楚之交已合也故先遣歸父會穀以觀齊之向背以將會楚告所以盡事齊之禮而恐逢其怒也至以大夫會諸侯則自單伯會鄄公孫敖會戚已為故事於歸父不足責矣附録左傳孟獻子言于公曰臣聞小國之免于大國也聘而獻物于是有庭實旅百物玉帛皮幣也朝而獻功于是有容貌采章嘉淑而有加貨獻功獻其治國及征伐之功于牧伯容貌容顔威儀也采章車服文章也嘉淑令辭稱讚也言往共則來報亦備謀其不免也誅而薦賄則無及也薦進也今楚在宋君其圖之公説為明年歸父會楚子傳十有五年春公孫歸父會楚子于宋左傳十五年春公孫歸父會楚子于宋終前年傳自楚莊討陳亂挫晉師圍鄭圍宋威懾中夏然鄭宋被圍始皆闔城固守力屈而後求成獨魯不然兵未及國望風而靡僖公二十一年楚獻宋捷魯君會薄先諸侯而趨之今楚方圍宋歸父復及宋之未平而求媚焉文仲竊位不能正僖公之失固不足􅏜孟獻子賢大夫也而倡薦賄之謀亦可鄙也巳夏五月宋人及楚人平左傳宋人使樂嬰齊告急于晉晉侯欲救之伯宗曰伯宗晉大夫不可古人有言曰雖鞭之長不及馬腹言非所擊天方授楚未可與爭雖晉之強能違天乎諺曰髙下在心度時制宜川澤納汙受汙濁山藪藏疾山之有林藪毒害者居之瑾瑜匿瑕雖美玉之質亦或居藏瑕穢國君含垢忍垢恥天之道也晉侯恥不救宋故伯宗為言小惡不損大德之喻君其待之待楚衰乃止使解揚如宋使無降楚曰晉師悉起將至矣鄭人囚而獻諸楚楚子厚賂之使反其言反言晉不救不許三而許之登諸樓車樓車車上望櫓使呼宋人而告之遂致其君命楚子將殺之使與之言曰爾既許不穀而反之何故非我無信女則棄之速即爾刑對曰臣聞之君能制命為義臣能承命為信信載義而行之為利謀不失利以衛社稷民之主也義無二信信無二命欲為義者不行兩信欲為信者不受二命君之賂臣不知命也受命以出有死無霣霣廢墜也又可賂乎臣之許君以成命也成其君命死而成命臣之祿也寡君有信臣下臣獲考考成也死又何求楚子舍之以歸夏五月楚師將去宋在宋積九月不能服宋故申犀稽首于王之馬前曰無畏知死而不敢廢王命王棄言焉未服宋而去故曰棄言王不能答申叔時僕曰築室反耕者示無去志宋必聽命從之宋人懼使華元夜入楚師登子反之牀兵法因其鄉人而用之必先知其守將左右謁者門者之姓名因而利道之華元蓋用此術得以自通起之曰寡君使元以病告曰敝邑易子而食析骸以爨雖然城下之盟有以國斃不能從也古人以城下之盟為恥故寧亡不從去我三十里唯命是聽子反懼與之盟而告王退三十里宋及楚平華元為質盟曰我無爾詐爾無我虞盟不書不告公羊傳外平不書此何以書據十二年楚鄭平不書大其平乎巳也巳二大夫何大乎其平乎巳莊王圍宋軍有七日之糧爾盡此不勝將去而歸爾于是使司馬子反乘堙而窺宋城宋華元亦乘堙而出見之堙登城具司馬子反曰子之國何如華元曰憊矣曰何如曰易子而食之析骸而炊之司馬子反曰嘻甚矣憊雖然吾聞之也圍者柑馬而秣之使肥者應客是何子之情也圍者見圍之國秣以粟置馬口中柑以木銜其口不令食粟示有畜積肥者體肥之人使應客示飽足也情實也華元曰吾聞之君子見人之厄則矜之小人見人之厄則幸之吾見子之君子也是以告情于子也司馬子反曰諾勉之矣吾軍亦有七日之糧爾盡此不勝將去而歸爾揖而去之反于莊王莊王曰何如司馬子反曰憊矣曰何如曰易子而食之析骸而炊之莊王曰嘻甚矣憊雖然吾今取此然後而歸爾司馬子反曰不可臣已告之矣軍有七日之糧爾莊王怒曰吾使子往視之子曷為告之司馬子反曰以區區之宋猶有不欺人之臣可以楚而無乎是以告之也莊王曰諾先以諾受絶子反語舍而止雖然吾猶取此然後歸爾司馬子反曰然則君請處于此臣請歸爾莊王曰子去我而歸吾孰與處于此吾亦從子而歸爾引師而去之故君子大其平乎已也此皆大夫也其稱人何貶曷為貶平者在下也穀梁傳平者成也善其量力而反義也人者衆辭也平稱衆上下欲之也外平不道以吾人之存焉道之也吾人謂大夫歸父存在也不書宋及楚平而曰宋人楚人衆辭也君臣上下同欲之也蓋宋之力屈而楚師亦幾頓矣故皆以得平而息師為幸也文九年陳平不書宣十年鄭平不書即僖二十四年宋及楚平猶不書也至是年乃書之蓋陳蔡鄭許已若楚之內臣宋復不支而南北分霸之勢成矣六月癸卯晉師滅赤狄潞氏以潞子嬰兒歸潞氏赤狄别種以國名為氏子爵也今山西潞城縣即其地縣東北有古潞城左傳潞子嬰兒之夫人晉景公之姊也酆舒為政而殺之又傷潞子之目晉侯將伐之諸大夫皆曰不可酆舒有三俊才不如待後之人俊絶異也後之人繼酆舒者伯宗曰必伐之狄有五罪俊才雖多何補焉不祀一也耆酒二也棄仲章而奪黎氏地三也仲章潞賢人黎氏杜注黎侯國上黨壺關縣有黎亭今山西長治縣西黎侯亭是也又山東范縣有黎侯城則黎侯失國寓衛所居之地虐我伯姬四也傷其君目五也怙其俊才而不以茂德茲益罪也後之人或者將敬奉德義以事神人而申固其命審其政令若之何待之不討有罪曰將待後後有辭而討焉毋乃不可乎夫恃才與衆亡之道也商紂由之故滅天反時為災寒暑易節地反物為妖羣物失性民反德為亂亂則妖災生故文反正為乏文字也制字之體正之反為乏盡在狄矣晉侯從之六月癸卯晉荀林父敗赤狄于曲梁曲梁杜注廣平曲梁縣今曲梁故城在直隸永年縣東北辛亥滅潞酆舒奔衛衛人歸諸晉晉人殺之公羊傳潞何以稱子潞子之為善也躬足以亡爾言其去俗歸義適足以亡雖然君子不可不記也離于夷狄而未能合于中國晉師伐之中國不救狄人不有不有猶不顧也是以亡也穀梁傳滅國有三術中國謹日如衛侯滅邢之類卑國月卑國謂附庸之屬如齊侯滅萊之類夷狄不日如楚滅江黃吳滅州來之類其日潞子嬰兒賢也宋人易子而食析骸以爨以待晉救晉坐視不前以致諸侯皆南嚮而事楚晉乃用大師以滅潞氏明年又伐甲氏及留吁其棄諸侯而隳先業可愧莫甚矣潞國名赤狄之别種也凡滅國而奔者不名其位或未絶也以歸者名之責其無興復之志也惟夔子不名先儒以為無取滅之道理亦可通秦人伐晉左傳秋七月秦桓公伐晉次于輔氏輔氏杜注晉地今陜西朝邑縣西北有輔氏城壬午晉侯治兵于稷以略狄土稷杜注晉地河東聞喜縣西有稷山在今山西稷山縣南晉時新破狄土地未安度秦師之弱故别遣魏顆拒秦而自東行定狄地立黎侯而還狄奪黎土故晉復立之及雒晉侯還及雒也雒杜注晉地魏顆敗秦師于輔氏獲杜回秦之力人也初魏武子有嬖妾武子魏犨顆之父無子武子疾命顆曰必嫁是疾病則曰必以為殉及卒顆嫁之曰疾病則亂吾從其治也及輔氏之役顆見老人結草以亢杜回亢禦也杜回躓而顛故獲之夜夢之曰余而所嫁婦人之父也爾用先人之治命余是以報自二年秦師伐晉晉不報秦今十四年矣兹復伐晉必楚人既服鄭宋有力征中夏之心故使秦出師以相牽制俾晉不暇南顧耳幸而楚旅旋卒晉得以其間挫齊致宋諸侯復合尚能與楚相抗不然則諸侯駢首南鄉雖欲分霸而不可得矣王札子殺召伯毛伯左傳王孫蘇與召氏毛氏爭政三人皆王卿士使王子捷殺召戴公及毛伯衛王子捷即王札子卒立召襄襄召戴公子公羊傳王札子者何長庶之號也禮天子庶兄冠而不名札其字也不稱伯仲者避同母兄弟知其為庶兄也穀梁傳王札子者當上之辭也殺召伯毛伯不言其何也解經不言殺其大夫兩下相殺也若言殺其大夫則是上殺下非兩下相殺矣兩下相殺不志乎春秋此其志何也矯王命以殺之非忿怒相殺也故曰以王命殺也以王命殺則何志焉為天下主者天也繼天者君也君之所存者命也為人臣而侵其君之命而用之是不臣也為人君而失其命是不君也君不君臣不臣此天下所以傾也兩下相殺不志於春秋此其志者矯王命以殺之也桓襄以前列國交相侵伐是外諸侯不稟王命也至王之庶長一朝而殺世臣二人則內卿士亦不奉王命矣故以為非常而志之不稱子札而曰札子諸家之説皆穿鑿而不安似史文舛誤當闕所疑附録左傳晉侯賞桓子狄臣千室亦賞士伯以瓜衍之縣士伯士貞子瓜衍今山西孝義縣北有瓜城曰吾獲狄土子之功也微子吾喪伯氏矣伯桓子字邲之敗晉侯將殺林父士伯諫而止羊舌職説是賞也職叔向父曰周書所謂庸庸祗祗者謂此物也夫周書康誥庸用也祗敬也言文王能用可用敬可敬此物此事也士伯庸中行伯言中行伯可用君信之亦庸士伯此之謂明德矣文王所以造周不是過也故詩曰陳錫載周能施也詩大雅文王篇錫賜也言文王布陳大利以賜天下故能載行周道福流子孫率是道也其何不濟晉侯使趙同獻狄俘于周不敬劉康公曰不及十年原叔必有大咎天奪之魄矣心之精爽是為魂魄為八年殺趙同傳秋螽宣公煩於朝聘賂遺之末竭內奉外人事乖而戾氣應之矣仲孫蔑會齊髙固于無婁無婁公羊作牟婁杜注杞邑案隱四年莒人伐把取牟婁時已為莒邑杜注疑有誤髙固自以事出魯宣使大夫候之於途諂事外臣書之以示貶也初稅畝左傳初稅畝非禮也穀出不過藉以豐財也周法民耕百畝公田十畝借民力而治之稅不過此公羊傳初者何始也稅畝者何履畝而稅也按畝加稅初稅畝何以書譏何譏爾譏始履畝而稅也何譏乎始履畝而稅古者什一而藉什一而借民力以什與民自取其一為公田古者曷為什一而藉什一者天下之中正也多乎什一大桀小桀寡乎什一大貉小貉什一者天下之中正也什一行而頌聲作矣穀梁傳初者始也古者什一藉而不稅借民力治公田不稅其私初稅畝非正也古者三百步為里名曰井田井田者九百畝公田居一八家皆私百畝中百畝為公田私田稼不善則非吏非責也吏田畯也言吏急民使不得營私田公田稼不善則非民民勤私也初稅畝者非公之去公田而履畝十取一也以公之與民為己悉矣悉謂盡其力古者公田為居井竈蔥韭盡取焉公田百畝中又以二十畝為八家之宅家作一園以種五菜外種楸桑以備養生送死始變法以厲民也古者什一藉而不稅宣公因國用不足既收公田之入又履私畝而稅之是倍取於舊矣其後作丘甲用田賦至二猶不足則皆宣公啓之也冬蝝生公羊傳未有言蝝生者此其言蝝生何蝝生不書始生曰蝝既大曰螽蝝生例不書此何以書幸之也幸之者何猶曰受之云爾聞災當懼而反幸者猶曰宜得此災有受之者爾受之云爾者何上變古易常謂宣公變古常制而稅畝應是而有天災其諸則宜于此焉變矣人君觀此則宜遇災而懼知所變計穀梁傳蝝非災也初生故其曰蝝非稅畝之災也非責也螽之始生即為蝝方螽於秋冬又生子災之及民重矣螽飛蔽天或來自他處故不言生蝝生於境內人見其生故異文飢左傳冬蝝生飢幸之也蝝未為災而書之者幸其冬生不為物害時歲雖飢猶喜而書之古者以三十年之通制國用雖有凶荒民無菜色今宣公一遇螽蝝遽至於飢則以平時不知務農重穀以待緩急之需也莊二十八年大無麥禾而不書飢蓋當其時猶知告糴以救災也宣公之篇書飢者再是既無倉廩之藏又乏救荒之策惟坐視其民之飢而死耳十有六年春王正月晉人滅赤狄甲氏及留吁甲氏留吁杜注赤狄别種胡氏注留吁謂之純留今山西屯留縣南有故城左傳十六年春晉士會帥師滅赤狄甲氏及留吁鐸辰鐸辰不書留吁之屬當在今山西潞安府境三月獻狄俘獻于王也晉侯請于王戊申以黻冕命士會將中軍且為太傅代林父將中軍且加以大傅之官黻冕命卿之服于是晉國之盜逃奔于秦羊舌職曰吾聞之禹稱善人稱舉也不善人逺此之謂也夫詩曰戰戰兢兢如臨深淵如履薄氷善人在上也言善人居位則無不戒懼善人在上則國無幸民賞不僭刑不濫也諺曰民之多幸國之不幸也是無善人之謂也甲氏者潞之餘種留吁其殘邑也前此楚人圍宋晉坐視不救諉曰鞭長不及於潞氏甲氏則窮搜不已且欑函之會無幾時而滅狄者三蔑德棄信何以宗諸侯乎夏成周宣榭火榭公羊作謝火公羊穀梁作災左傳夏成周宣榭火人火之也凡火人火曰火天火曰災公羊傳成周者何東周也瀍水西為王城瀍水東下都為成周宣謝者何宣宫之謝也宣宫宣王廟至此不毁者有中興之功何言乎成周宣謝災樂器藏焉爾夷厲之時樂器有壞故宣王作之成周宣謝災何以書記災也外災不書此何以書新周也孔子作春秋上黜把下故宋而新周穀梁傳周災不志也其曰宣榭何也以樂器之所藏目之也榭者講武之屋宣王中興南征北討其用武於四方必有講肄之所即成周宣榭是也宣榭火而興王之迹泯矣聖人重之而書示不忘古也秋郯伯姬來歸左傳秋郯伯姬來歸出也伯姬魯女嫁郯者婦人歸寧曰來出曰來歸齊人來歸子叔姬叔姬無罪強歸之也郯伯姬來歸伯姬有罪自取之也把叔姬亦大歸也而書卒書把伯逆其喪歸則義尚有不當絶者郯伯姬不書卒不書喪歸則其過必有甚於把伯姬者矣附録左傳為毛召之難故王室復亂毛召難在前年王孫蘇奔晉晉人復之毛召之黨欲討蘇氏故出奔冬晉侯使士會平王室定王享之原襄公相禮原襄公周大夫殽蒸蒸升也升殽于爼武子私問其故享當體薦而殽蒸故􅏜問之武士會諡李其字王聞之召武子曰季氏而弗聞乎王享有體薦享則半解其體而薦之所以示儉宴有折俎體解節折升之于俎物皆可食所以示慈惠公當享卿當宴王室之禮也公謂諸侯卿雖享亦當用宴禮武子歸而講求典禮以修晉國之法傳言典禮之廢久冬大有年穀梁傳五穀大熟為大有年大者非常之詞有者不易有也記其有者所以見其無也宣公享國十有八年而僅一有年故以為非常而書之十有七年春王正月庚子許男錫我卒丁未蔡侯申卒夏葬許昭公葬蔡文公宣公華而少實其於邦交以勢利為疏數來赴而不會其葬者多矣乃許昭蔡文皆會其葬蓋許蔡為楚之私公方附楚故不敢略許蔡之喪紀耳六月癸卯日有食之已未公會晉侯衛侯曹伯邾子同盟於斷道斷道杜注晉地今山西沁州東有斷梁城左傳十七年春晉侯使郤克徴會於齊欲為斷道會齊頃公帷婦人使觀之郤子登婦人笑於房跛而登階故笑之獻子怒獻子郤克出而誓曰所不此報無能涉河獻子先歸使欒京廬待命於齊欒京廬郤克之介曰不得齊事無復命矣使得齊之罪乃復命郤子至請伐齊晉侯弗許請以其私屬又弗許私屬家衆為成二年戰於鞍傳齊侯使髙固晏弱蔡朝南郭偃會晏弱桓子及斂盂髙固逃歸聞郤克怒故夏會於斷道討二也盟於卷楚卷楚即斷道辭齊人晉人執晏弱於野王執蔡朝於原執南郭偃於溫執三子不書非卿野王杜注野王縣屬河內今河南懷慶府治苗賁皇使見晏桓子苗賁皇楚鬬椒之子楚滅鬬氏而奔晉食邑於苗地晏弱時在野王故因使而見之歸言於晉侯曰夫晏子何罪昔者諸侯事吾先君皆如不逮舉言羣臣不信舉皆也諸侯皆有二志齊君恐不得禮故不出而使四子來左右或沮之曰君不出必執吾使故髙子及斂盂而逃夫三子者曰若絶君好寧歸死焉為是犯難而來吾若善逆彼以懷來者彼齊三人吾又執之以信齊沮吾不既過矣乎過而不改而又久之以成其悔何利之有焉使反者得辭反者髙固謂得不當來之辭而害來者以懼諸侯將焉用之晉人緩之逸緩不拘執使得逃去也傳言晉不能修禮諸侯所以二榖梁傳同者有同也同外楚也不于淸丘發傳者清丘魯不會故重舉以包之也魯衛曹邾地皆鄰接於宋宋乃四國之藩蔽也宋折而入楚故四國自危晉亦懼楚故復結是盟其書同載書以是要言也榖梁以為外楚二傳以為謀齊蓋外楚其本謀而晉方怒齊故亦命事於會耳附録左傳秋八月晉師還范武子將老初受隨故曰隨武子後更受范復為范武子召文子曰燮乎文子士會之子燮其名吾聞之喜怒以類者鮮易者實多易遷怒也詩曰君子如怒亂庶遄沮君子如祉亂庶遄已詩小雅遄速君子之喜怒以已亂也弗已者必益之郤子其或者欲已亂于齊乎不然余懼其益之也余將老使郤子逞其志庶有豸乎豸解也欲使郤子從政快志以止亂爾從二三子唯敬二三子晉諸大夫乃請老郤獻子為政秋公至自會宣公會盟兩書至黑壤事齊而不事晉危晉之見討而不得釋也斷道背齊而與晉謀伐齊危齊人之見討也宣公既得國以後卑屈事齊惟恐獲戾逮齊惠公卒事齊之禮漸疏復附楚依晉以謀齊內不能守禮明政外不能講信修睦而傾側於強大之間其何能國乎冬十有一月壬午公弟叔肸卒左傳冬公弟叔肸卒公母弟也凡大子之母弟公在曰公子不在曰弟以兄為尊凡稱弟皆母弟也此策書之通例穀梁傳其曰公弟叔肸賢之也其賢之何也宣弒而非之也非之則胡為不去也曰兄弟也何去而之與之財則曰我足矣織屨而食終身不食宣公之食君子以是為通恩也以取貴乎春秋宣公弒逆故其祿不可受兄弟無絶道故雖非而不去論情可以明親親言義足以厲不軌是以貴之叔肸為宣公母弟生不見於策書死不稱公子則未為大夫明矣非大夫而書卒以其賢也傳稱得春秋之義者二衛侯之弟鱄以政刑無常潔身去國叔肸遭宣公大逆孔懷之誼不忍奮飛終身不食其祿皆處變而得其冝然叔肸所為內可以盡私恩外足以維公義故傳於鱄曰合於肸曰取貴則賢於鱄逺矣十有八年春晉侯衛世子臧伐齊左傳十八年春晉侯衛太子臧伐齊太子臧穆公子至于陽榖齊侯會晉侯盟於繒以公子強為質於晉晉師還蔡朝南郭偃逃歸齊霸國之餘晉文資其力以敗楚自文公卒齊不復從晉盟晉方不競於楚是以問不及齊至是以諸侯同心外楚徴會而齊不與乃毅然親將以伐之實得繼霸之義鞍之戰雖曰逞忿然自是齊服而東諸侯無二心無會不與無役不從與楚相抗者近百年不可謂非謀國之善也公伐把杞世婚於魯杞桓公魯出且娶於魯僖文之世各一來朝宣公篡立把伯終其世不來朝蓋疾其躬為大惡雖不能討而恥相附也故憾之而親伐焉然適以自暴其惡而張把之義耳夏四月附録左傳夏公使如楚乞師欲以伐齊公不事齊齊與晉盟故懼而乞師于楚不書微者行秋七月邾人戕鄫子于鄫鄫穀梁作繒左傳秋邾人戕鄫子于鄫凡自虐其君曰弒自外曰戕弒戕皆殺也所以别內外之名公羊傳戕鄫子于鄫者何殘賊而殺之也穀梁傳戕猶殘也捝殺也捝謂捶也戕者殘賊而殺之也于鄫罪鄫之臣子不能救君難也邾文公時曽虐用鄫子然尚以會盟于邾也今乃使人造其國都而戕殺其君則鄫豈虛無人乎至邾人滅人理而悖天常則不待貶而惡見矣甲戌楚子旅卒旅穀梁作吕楚始書卒左傳楚莊王卒楚師不出既而用晉師成二年戰于鞍是楚于是乎有蜀之役在成二年冬蜀杜注魯地泰山博縣西北有蜀亭在今山東泰安州西公羊傳何以不書葬吳楚之君不書葬辟其號也葬從臣子辭當稱王故絶其葬穀梁傳夷狄不卒卒少進也卒而不日日少進也日而不言正不正簡之也中國卒正則日不正乃不日夷狄進之則日不論正不正故云簡之楚君至是始書卒魯事之一如齊晉故著於䇿書也不書葬孔子削之也記曰天無二日土無二王春秋恐民之惑故不稱楚越之王喪蓋辟其號而不書其葬也楚入春秋百年武文成穆未敢有窺周室之心至楚子旅而觀兵問鼎力征中夏聘於齊晉直用王使過賓之禮非天奪其年不盡臣天下之諸侯不止也卒書其故爵蓋黜其淫名以正君臣之名分而先儒乃謂進之是以爵之貴之是以卒之其義悖矣公孫歸父如晉左傳公孫歸父以襄仲之立公也有寵歸父襄仲子欲去三桓以張公室與公謀而聘于晉欲以晉人去之宣公用歸父之謀欲去三桓以張公室其事未嘗不正而宣公薨歸父逐三桓之勢益張豈惟謀之不審哉其道固不足以勝三桓也仲遂身為大逆而任其子以圗世族義既不足以動人晉政方在強家而藉其力以逐內臣則謀亦不能以自遂使能信任仁賢修明政教漸收其威柄則三桓必有戢志公室可以自張然宣公篡弒之人豈足以語此哉冬十月壬戌公薨于路寢穀梁傳正寢也歸父還自晉至笙遂奔齊笙公羊穀梁作柳杜注魯竟也左傳冬公薨季文子言于朝曰使我殺適立庶以失大援者仲也夫適謂子惡襄仲殺之而立宣公事齊通楚以失晉援季文子怨歸父欲去三桓故借此以為之罪臧宣叔怒曰宣叔文仲子武仲父當其時不能治也後之人何罪子欲去之許請去之許宣叔名時為司寇遂逐東門氏襄仲居東門故曰東門氏子家還及笙壇帷復命于介除地為壇而張帷介副也將去使介復命于君既復命袒括髮袒衣以麻約髮即位哭三踊而出依在國喪禮設哭位公薨故遂奔齊書曰歸父還自晉善之也公羊傳還者何善辭也何善爾歸父使于晉還自晉至柳聞君薨家遣墠帷哭君成踊踊辟踊也成踊成三日五哭踊之禮反命乎介自是走之齊穀梁傳還者事未畢也自晉事畢也與人之子守其父之殯人之子謂歸父子也言成公與歸父子共守宣公殯捐殯而奔其父之使者是以奔父也捐棄也成公棄父之殯逐父之使父命未反而已逐之是與親奔父無異至柳遂奔齊遂繼事也歸父謀去三桓會公之薨季氏乃追論仲遂弒君之罪而逐歸父觀傳所載行父倡言臧孫逐之若無嗣君者行父罪不容誅而成公不足有為亦於此可見矣歸父奉使而還聞君薨家遣常人當此必震懼失常而墠帷哭君成踊反命乎介則猶能守禮者惜乎其始謀之不臧也日講春秋解義卷三十
