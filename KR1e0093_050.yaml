body:
  text: 欽定四庫全書日講春秋解義卷五十昭公九年春叔弓㑹楚子于陳左傳九年春叔弓宋華亥鄭游吉衛趙黶㑹楚子于陳此與宣十五年公孫歸父㑹楚子于宋同楚子在彼魯自使卿徃修禮致敬非楚子召之使㑹也許遷于夷左傳二月庚申楚公子棄疾遷許于夷實城父時改城父為夷杜注城父縣屬譙郡今江南亳州東南有城父故城取州來淮北之田以益之伍舉授許男田然丹遷城父人于陳以夷濮西田益之以夷田在濮水西者與城父人遷方城外人于許成十五年許遷于葉因謂之許今許遷于夷故以方城外人實其處傳言靈王使民不安許世服於楚而畏鄭欲遷都近楚故以自遷為文若楚彊之則當書楚人遷許如宋人遷宿齊人遷陽附録左傳周甘人與晉閻嘉爭閻田甘人甘大夫襄也閻嘉晉閻縣大夫晉梁丙張趯率隂戎伐潁隂戎杜注陸渾之戎潁杜注周邑王使詹桓伯辭于晉辭責讓之桓伯周大夫曰我自夏以后稷魏駘芮岐畢吾西土也在夏世以后稷功受此五國為西土之長駘杜注在始平武功縣所治釐城縣今屬陜西乾州古釐城在縣南及武王克商蒲姑商奄吾東土也蒲姑杜注樂安博昌縣北有蒲姑城今蒲姑故城在山東博興縣東南巴濮楚鄧吾南土也肅慎燕亳吾北土也肅慎杜注在𤣥莬北三千餘里孔疏𤣥莬在遼東北今屬盛京吾何邇封之有文武成康之建母弟以蕃屏周亦其廢隊是為豈如弁髦而因以敝之弁謂緇布冠髦謂童子垂髦凡加冠之禮先用緇布冠斂括垂髦三加之後去緇布冠不復用故言因以敝之先王居檮杌于四裔以禦螭魅言檮杌畧舉四凶之一故允姓之姦居于瓜州允姓隂戎之祖與三苗俱放三危者伯父惠公歸自秦而誘以來僖二十二年秦晉遷陸渾之戎于伊川使偪我諸姬入我郊甸則戎焉取之戎有中國誰之咎也咎在晉后稷封殖天下今戎制之不亦難乎后稷修封彊殖五榖今戎得之唯以畜牧伯父圖之我在伯父猶衣服之有冠冕木水之有本原民人之有謀主也民人謀主宗族之師長伯父若裂冠毁冕㧞夲塞原專棄謀主雖戎狄其何有余一人叔向謂宣子曰文之伯也豈能改物言未能改正朔易服色翼戴天子而加之以共自文以來世有衰徳而暴滅宗周以宣示其侈諸侯之貳不亦宜乎且王辭直子其圗之宣子說王有姻䘮使趙成如周弔且致閻田與襚反潁俘王亦使賓滑執甘大夫襄以說于晉賓滑周大夫晉人禮而歸之夏四月陳災災公羊榖梁作火左傳夏四月陳災鄭禆竈曰五年陳將復封封五十二年而遂亡子産問其故對曰陳水屬也陳顓頊之後故為水屬火水妃也火畏水故謂之妃而楚所相也相治也楚之先祝融為髙辛氏火正主治火事今火出而火陳火心星也火出于周為五月而以四月出者以長厯推前年誤置閏逐楚而建陳也水得妃而興妃以五成故曰五年妃合也五行各相妃合得五而成故五歲而陳復封為十三年陳侯吳歸于陳傳歲五及鶉火而後陳卒亡楚克有之天之道也故曰五十二年是歲歳在星紀五歳及大梁而陳復封自大梁四歳而及鶉火後四周四十八歳凡五及鶉火五十二年天數以五為紀故五及鶉火火盛水衰公羊傳陳已滅矣其言陳火何存陳也曰存陳悕矣悕悲也曷為存陳滅人之國執人之罪人罪人招也殺人之賊孔瑗弑君賊也葬人之君若是則陳存悕矣楚為無道託討賊行義陳臣子辟門虚心待之而滅其國悲之也榖梁傳國曰災邑曰火火不志此何以志閔陳而存之也陳已滅於楚而春秋猶書陳災猶邶鄘已滅於衞而删詩仍其故號所以存先王之建國也凡外災告則書楚已縣陳使穿封戍守之必不遣使告於諸侯蓋叔弓㑹楚子于陳目擊其事歸語陳故而魯史書之耳附錄左傳晉荀盈如齊逆女自為逆還六月卒于戯陽戯陽杜注魏郡内黄縣北有戯陽城殯于絳未葬晉侯飲酒樂膳宰屠蒯趨入請佐公使尊執尊酌酒許之而遂酌以飲工工樂師師曠也曰女為君耳將司聰也樂所以聰耳辰在子卯謂之疾日疾惡也紂以甲子䘮桀以乙卯亡故國君以為忌日君徹宴樂學人舍業學人謂習樂之人為疾故也君之卿佐是謂股肱股肱或虧何痛如之女弗聞而樂是不聰也又飲外嬖嬖叔外都大夫之嬖者曰女為君目將司明也職在外故主視服以旌禮禮以行事事有其物物類也物有其容容貌也今君之容非其物也有卿佐之䘮而作樂歡㑹故曰非其物而女不見是不明也亦自飲也曰味以行氣氣以實志氣和則志充志以定言在心為志發口為言言以出令臣實司味二御失官而君弗命臣之罪也工與嬖叔侍御君者失官不聰明公說徹酒初公欲廢知氏而立其外嬖為是悛而止秋八月使荀躒佐下軍以說焉荀躒盈之子知文子也佐下軍代父也秋仲孫貜如齊左傳孟僖子如齊殷聘禮也冬築郎囿左傳冬築郎囿書時也季平子欲其速成也叔孫昭子曰詩曰經始勿亟庶民子來詩大雅言文王始經營靈臺非急疾之衆民自以子義來歡樂為之焉用速成其以勦民也無囿猶可無民其可乎季孫既竊魯國又欲離公於民故娛公以耳目之觀而亟督其功役公尚不悟故他日見逐傳載如釋重負之言必季氏之誣辭乆而不能辨也十年春王正月附錄左傳十年春王正月有星出于婺女客星也不書非孛鄭禆竈言于子産曰七月戊子晉君將死今茲歳在顓頊之虚歲歳星也顓頊之虚為𤣥􅑎姜氏任氏實守其地姜齊姓任薛姓齊薛二國守𤣥􅑎之地居其維首而有妖星焉告邑姜也客星居𤣥􅑎之維首邑姜齊大公女晉唐叔之母星占婺女為既嫁之女織女為處女邑姜齊之既嫁女妖星在婺女齊得歲故知禍歸邑姜邑姜晉之妣也天以七紀二十八宿四七戊子逢公以登星斯于是乎出逢公殷諸侯居齊地者逢公將死妖星出婺女時非歲星所在故齊自當禍而以戊子日卒吾是以譏之為晉侯彪卒傳夏齊欒施來奔齊公羊作晉左傳齊惠欒髙氏皆耆酒欒髙二族皆出惠公信内多怨強于陳鮑氏而惡之夏有告陳桓子曰子旗子良將攻陳鮑亦告鮑氏桓子授甲而如鮑氏遭子良醉而騁欲及子良醉故聘告鮑文子遂見文子文子鮑國則亦授甲矣使視二子二子子旗子良則皆將飲酒桓子曰彼雖不信彼傳言者聞我授甲則必逐我及其飲酒也先伐諸陳鮑方睦遂伐欒髙氏子良曰先得公陳鮑焉徃欲以公自輔助遂伐虎門欲入公不聽故伐公門晏平仲端委立于虎門之外四族召之無所徃四族欒髙陳鮑其徒曰助陳鮑乎曰何善焉助欒髙乎曰庸愈乎然則歸乎曰君伐焉歸公召之而後入公卜使王黑以靈姑銔率吉請斷三尺焉而用之王黒齊大夫靈姑銔公旗名斷三尺不敢與君同五月庚辰戰于稷稷杜注祀后稷之處六國時齊有稷下館在今山東臨淄縣西欒髙敗又敗諸莊莊六軌之道國人追之又敗諸鹿門鹿門齊城門欒施髙彊來奔陳鮑分其室晏子謂桓子必致諸公讓徳之主也讓之謂懿徳凡有血氣皆有争心故利不可強不可強取思義為愈義利之夲也藴利生孽藴畜也孽妖害也姑使無藴乎可以滋長桓子盡致諸公而請老于莒莒杜注齊邑桓子召子山子山子商子周襄三十一年子尾所逐羣公子私具幄幕器用從者之衣屨而反棘焉棘杜注子山故邑齊國西安縣東有㦸里亭後漢志作棘里今臨淄縣西北有棘里亭子商亦如之而反其邑子周亦如之而與之夫于子周夲無邑故更與之夫于杜注濟南於陵縣西北有于亭今於陵城在山東長山縣南反子城子公公孫捷三子八年子旗所逐而皆益其禄凡公子公孫之無禄者私分之邑國之貧約孤寡者私與之粟曰詩云陳錫載周能施也詩大雅言文王能布陳大利以賜天下行之周徧桓公是以霸公與桓子莒之旁邑辭穆孟姬為之請髙唐陳氏始大穆孟姬景公母傳言陳氏所以興髙彊不書非卿也欒髙陳鮑以私憾生爭至動干戈於國中不忌其君之故也陳氏遂階此以竊國有國者之操柄可不謹與秋七月季孫意如叔弓仲孫貜帥師伐莒意公羊作隠後同左傳秋七月平子伐莒取郠卑子卽季孫意如郠杜注莒邑當在今山東沂水縣界獻俘始用人于亳社以人祭殷社臧武仲在齊聞之曰周公其不饗魯祭乎周公饗義魯無義詩曰徳音孔昭視民不佻詩小雅佻偷也言明徳君子必愛民不敢偷薄佻之謂甚矣而壹用之將誰福哉壹同也同人于畜牲既舍中軍公室無兵三家各帥其衆故竝書於䇿叔弓在行或曰所將乃叔孫氏之兵雖曰家徒猶使公臣帥之以此見婼之賢也或曰婼居守而叔弓佐意如也自是訖春秋魯有四卿而權歸三家公若寄寓矣戊子晉侯彪卒左傳戊子晉平公卒如禆竈之言鄭伯如晉及河晉人辭之游吉遂如晉禮諸侯不相弔故辭九月叔孫舍如晉葬晉平公左傳九月叔孫婼齊國弱宋華定衛北宮喜鄭罕虎許人曹人莒人邾人滕人薛人杞人小邾人如晉葬平公也經不書諸侯大夫者非盟㑹鄭子皮將以幣行見新君之贄子産曰䘮焉用幣用幣必百兩載幣用車百乘百兩必千人千人至將不行行用也不行必盡用之不得見新君將自費用盡㡬千人而國不亡言千人之費不可數子皮固請以行既葬諸侯之大夫欲因見新君叔孫昭子曰非禮也弗聽叔向辭之曰大夫之事畢矣送葬禮畢而又命孤孤斬焉在衰絰之中其以嘉服見則喪禮未畢其以喪服見是重受弔也大夫將若之何皆無辭以見子皮盡用其幣歸謂子羽曰非知之實難將在行之夫子知之矣我則不足言已由子産之戒既知其不可而遂行之是我之不足書曰欲敗度縱敗禮商書大甲篇我之謂矣夫子知度與禮矣我實縱欲而不能自克也昭子至自晉大夫皆見髙彊見而退昭子語諸大夫曰為人子不可不慎也哉昔慶封亡子尾多受邑而稍致諸君君以為忠而甚寵之將死疾于公宮輦而歸君親推之其子不能任是以在此忠為令徳其子弗能任罪猶及之難不慎也喪夫人之力夫人謂子尾棄徳曠宗以及其身不亦害乎詩曰不自我先不自我後其是之謂乎詩小雅言禍亂不在他正當己身以喻髙彊身自取此禍十有二月甲子宋公成卒成公羊作戍左傳冬十二月宋平公卒初元公惡寺人柳欲殺之元公平公大子佐也及喪柳熾炭于位以温地將至則去之使公坐其處比葬又有寵言元公好惡無常十有一年春王二月叔弓如宋葬宋平公二月公羊作正月左傳十一年春王二月叔弓如宋葬平公也夏四月丁已楚子䖍誘蔡侯般殺之于申䖍榖梁或作乾左傳景王問于萇𢎞曰萇𢎞周大夫今兹諸侯何實吉何實凶對曰蔡凶此蔡侯般弑其君之歳也歳在豕韋弗過此矣襄三十年蔡世子般弑其君歲在豕韋至今十三歳歳復在豕韋楚將有之然壅也壅積其惡歳及大梁蔡復楚凶天之道也楚靈王弑立之年歲在大梁至昭十三年歲復在大梁羙惡周必復故知楚凶楚子在申召蔡靈侯靈侯將往蔡大夫曰王貪而無信唯蔡于感恨其不服順今幣重而言甘誘我也不如無往蔡侯不可三月丙申楚子伏甲而饗蔡侯于申醉而執之夏四月丁已殺之刑其士七十人公羊傳楚子䖍何以名絶曷為絶之為其誘討也此討賊也蔡侯般弑父而立雖誘之則曷為絶之懷惡而討不義君子不予也榖梁傳何為名之也夷狄之君誘中國之君而殺之故謹而名之也稱時稱月稱日稱地謹之也蔡般覆載不容之賊人人得而誅之聖人乃名楚䖍而爵蔡般何也楚䖍身為簒弑春秋之義不以亂治亂且既與般㑹申又再㑹伐吳豈以般為賊哉今謀取其國重幣甘言誘以㑹而殺之則為誘蔡侯殺之于申而已至般之罪己前見苟有人心者皆知其宜絶也而蔡之臣子奉以為君魯弔其喪諸侯數與之㑹成其為君乆矣故不從州吁無知之例而以爵書所以著諸侯之罪也楚公子棄疾帥師圍蔡左傳公子棄疾帥師圍蔡韓宣子問于叔向曰楚其克乎對曰克哉蔡侯獲罪于其君謂弑逆而不能其民天將假手于楚以斃之何故不克然肸聞之不信以幸不可再也楚王奉孫吳以討于陳曰将定而國陳人聽命而遂縣之事在八年今又誘蔡而殺其君以圍其國雖幸而克必受其咎弗能乆矣桀克有緡以䘮其國紂克東夷而隕其身楚小位下而亟暴于二王能無咎乎天之假助不善非祚之也厚其凶惡而降之罰也且譬之如天其有五材而將用之力盡而敝之是以無極不可沒振金木水火土五者為物用乆則必敝盡敝盡則棄捐故言無拯拯猶救助也不可沒振猶沒不可復振滅不言圍蔡人效死固守以待諸侯之救故書圍以病晉也五月甲申夫人歸氏薨左傳五月齊歸薨胡女歸姓齊諡也敬歸之娣昭公之母大蒐于比蒲左傳大蒐于比蒲非禮也公羊傳大蒐者何簡車徒也何以書蓋以罕書也魯之大蒐已為僭禮况齊歸未葬乎蓋方是時魯君若寄寓君自有䘮三家自蒐以為與公室無與也三家據國乆之而民亦忘君此陽州之孫季氏所以晏然而魯衆亦安之若素與仲孫貜㑹邾子盟于祲祥祲祥公羊作侵羊祲祥杜注地闕左傳孟僖子㑹邾莊公盟于祲祥修好禮也泉丘人有女泉丘杜注魯邑當在今山東寜陽泗水間夢以其帷幕孟氏之廟遂奔僖子其僚從之鄰女為僚友者隨而奔盟于清丘之社曰有子無相棄也二女自共盟僖子使助薳氏之簉簉副倅也禮有副車倅車皆副貳之車也薳氏之女先為僖子副妾别居在外故僖子納泉丘人女令副助之反自祲祥宿于薳氏生懿子及南宮敬叔于泉丘人其僚無子使字敬叔字養也邾魯之争為日已乆自襄之季年邾子來朝昭元年魯㑹邾葬至是盟于祲祥以修舊好君有大喪而季氏大蒐於國中孟孫㑹盟於境外不惟魯人不知有君而鄰國亦不知魯之有君矣秋季孫意如㑹晉韓起齊國弱宋華亥衛北宮佗鄭罕虎曹人杞人于厥憖厥憖公羊作屈銀杜注地闕左傳楚師在蔡向四月之師晉荀吳謂韓宣子曰不能救陳又不能救蔡物以無親人情所以不附晉之不能亦可知也己為盟主而不恤亡國將焉用之秋㑹于厥憖謀救蔡也鄭子皮將行子産曰行不逺不能救蔡也蔡小而不順楚大而不徳天將棄蔡以壅楚盈而罰之蔡必亡矣且䘮君而能守者鮮矣三年王其有咎乎羙惡周必復王惡周矣元年楚子弑君而立歲在大梁後二年十三歲歲星周復于大梁晉人使狐父請蔡于楚弗許狐父晉大夫宋之盟以弭兵召諸侯楚背盟肆暴晉合八國之大夫縱不能如次陘之師聲罪致討亦可以大義責楚所以使狐父往請重自卑屈而楚弗許者由陳蔡有弑君之禍晉皆不討諸侯離心而楚借討亂以為名晉人雖欲執辭申義其勢不能且諸卿各營其私莫肯盡力於國事故為楚所料也三綱軍政之夲豈不信與附錄左傳單子㑹韓宣子于戚單子單成公視下言徐叔向曰單子其將死乎朝有著定著定朝内列位常處謂之表著㑹有表野㑹設表以為位衣有襘帯有結禬領㑹結帶結也㑹朝之言必聞于表著之位所以昭事序也視不過結襘之中所以道容貎也言以命之容貎以明之失則有闕今單子為王官伯而命事于㑹視不登帶言不過歩貌不道容而言不昭矣不道不共不昭不從貌正曰共言順曰從無守氣矣為是年冬單子卒起夲九月己亥葬我小君齊歸左傳九月葬齊歸公不慼晉士之送葬者歸以語史趙史趙曰必為魯郊言昭公必出在郊野不能有國侍者曰何故曰歸姓也不思親祖不歸也姓生也言不思親則不為祖考所歸佑叔向曰魯公室其卑乎君有大䘮國不廢蒐指比蒲有三年之䘮而無一日之慼國不恤喪不忌君也君無慼容不顧親也國不忌君君不顧親能無卑乎殆失其國為二十五年公孫于齊傳公羊傳齊歸者何昭公之母也冬十有一月丁酉楚師滅蔡執蔡世子有以歸用之有榖梁作友左傳冬十一月楚子滅蔡用隱大子于岡山蔡世子有諡隱靈公之子蔡侯廬之父申無宇曰不祥五牲不相為用况用諸侯乎王必悔之公羊傳此未踰年之君也其稱世子何不君靈公不成其子也靈公弑逆春子亦不得為不與其為君故其君以繼其父也不君靈公則曷為不成其子誅君之子不立非怒也無繼也父誅子當絶惡乎用之用之防也其用之防奈何蓋以築防也持其足以頭築防惡不以道榖梁傳此子也諸侯在䘮稱子其曰世子何也不與楚殺也一事註乎志有一暴虐之事必筆之于書所以惡楚子也書滅書執書以歸用之詳其事以重楚惡也滅而以歸未有言執者言執弗臣之辭也沈子嘉書以歸殺之既降服也有稱世子父死國危不忍立乎其位也父母之仇不共戴天與民守國效死不降至於力屈就擒虐用其身而不顧也則有之為世子之道得矣附録左傳十二月單成公卒終叔向之言楚子城陳蔡不羮不羮有二杜注襄城縣東南有不羮城定陵西北有不羮亭今按在河南襄城縣東南者西不羮也在舞陽縣北者東不羮即定陵之不羮亭也使棄疾為蔡公王問于申無宇曰棄疾在蔡何如對曰擇子莫如父擇臣莫如君鄭莊公城櫟而寘子元焉使昭公不立子元鄭公子莊公寘子元于櫟桓十五年厲公因之以殺櫟大夫檀伯遂居櫟卒使昭公不安位而見殺齊桓公城榖而寘管仲焉至于今賴之城榖在莊三十二年臣聞五大不在邊五細不在庭古者以五行建官故曰五官五官之長專盛過節則不可居邊細弱不勝任亦不可居朝庭親不在外羇不在内今棄疾在外鄭丹在内襄十九年丹奔楚君其少戒王曰國有大城何如對曰鄭京櫟實殺曼伯曼伯檀伯也厲公取櫟又并京宋蕭亳實殺子游在莊十二年齊渠丘實殺無知在莊九年渠丘杜注雍廩邑齊國西安縣衛蒲戚實出獻公蒲杜注甯殖邑戚杜注孫林父邑出獻公在襄十四年若由是觀之則害于國末大必折尾大不掉君所知也為十三年陳蔡作亂傳十有二年春齊髙偃帥師納北燕伯于陽陽杜注陽即唐燕别邑中山有唐縣今直𨽻唐縣東有故城是也左傳十二年春齊髙偃納北燕伯款于唐因其衆也公羊傳伯于陽者何公子陽生也子曰我乃知之矣子謂孔子乃乃是歳也時孔子年二十三具知其事在側者曰子苟知之何以不革曰如爾所不知何如猶奈也蓋子以見而改之人以不見而疑之非所以傳信故寜因而不革所以教天下之愼也春秋之信史也其序則齊桓晉文其㑹則主㑹者為之也其辭則丘有罪焉爾榖梁傳納者内不受也燕伯之不名何也不以髙偃挈燕伯也款之出書名共國也納之則不名正君臣之分也燕伯入陽衛侯入夷儀皆為亂臣所迫逐因大國之力而入故書法同不得入於國為在國之臣子所拒也三月壬申鄭伯嘉卒左傳三月鄭簡公卒將為葬除除葬道及游氏之廟游氏子大叔族將毁焉子大叔使其除徒執用以立而無庸毁用毁廟具曰子産過女而問何故不毁乃曰不忍廟也諾將毁矣教毁廟者之辭既如是子産乃使辟之司墓之室有當道者司墓之室掌公墓大夫徒屬之家毁之則朝而塴弗毁則日中而塴塴下棺子大叔請毁之曰無若諸侯之賓何不欲乆㽞賓子産曰諸侯之賓能來㑹吾䘮豈憚日中無捐于賓而民不害何故不為遂弗毁日中而葬君子謂子産于是乎知禮禮無毁人以自成也夏宋公使華定來聘左傳夏宋華定來聘通嗣君也宋元公新立享之為賦蓼蕭弗知又不答賦蓼蕭詩小雅義取燕笑語兮是以有譽處兮樂與華定燕語也又曰既見君子為龍為光欲以寵光賓也又曰宜兄宜弟令徳夀凱言賓有令徳可以夀樂也又曰和鸞雍雍萬福攸同言欲與賓同福禄也昭子曰必亡宴語之不懷懷思也寵光之不宣宣楊也令徳之不知同福之不受將何以在為二十年華定出奔傳附録左傳齊侯衛侯鄭伯如晉朝嗣君也晉昭公新立公如晉至河乃復左傳公如晉亦朝嗣君至河乃復取郠之役在十年莒人愬于晉晉有平公之䘮未之治也故辭公公子憖遂如晉憖魯大夫榖梁傳季孫氏不使遂乎晉也前此公兩如晉僅一見焉至是往朝嗣君復為所拒傳載以取郠之故辭公夫納莒之叛臣叛邑伐其國又披其地者皆季孫所為也明年晉執意如則亦知罪之所在矣而公每如晉則見却蓋晉之諸臣皆曲為季氏地而不使公得盡其辭榖梁謂季氏不使遂乎晉蓋得其情矣附録左傳晉侯享諸侯子産相鄭伯辭于享請免䘮而後聽命簡公未葬晉人許之禮也晉侯以齊侯宴中行穆子相投壺晉侯先穆子曰有酒如淮有肉如坻淮杜注水名坻水中髙地寡君中此為諸侯師中之齊侯舉矢曰有酒如澠有肉如陵渑杜注水出齊國臨淄縣北入時水陵大阜也寡人中此與君代興亦中之伯瑕謂穆子曰伯瑕士文伯子失辭吾固師諸侯矣壺何為焉其以中儁也言投壺中不足為儁異齊君弱吾君歸弗來矣欲與晉君代興是弱之穆子曰吾軍帥強禦卒乘競勸今猶古也齊將何事公孫傁趨進曰傁齊大夫日旰君勤可以出矣以齊侯出傳言晉之衰五月葬鄭簡公左傳六月葬鄭簡公經書五月誤楚殺其大夫成熊熊公羊作然榖梁作虎左傳楚子謂成虎若敖之餘也遂殺之成虎令尹子王之孫與鬬氏同出于若敖宣四年闘椒作亂今楚子信讒而託討若敖之餘或譛成虎于楚子成虎知之而不能行書曰楚殺其大夫成虎懷寵也虔以猜忌信讒殺無罪之大夫故以累上之辭書附録左傳晉荀吳偽㑹齊師者假道于鮮虞鮮虞杜注白狄别種在中山新市縣今直𨽻新樂縣西南有新市故城其地有鮮虞亭遂入昔陽昔陽杜注肥國都今藁城縣西南有昔陽亭水經注謂之鼓聚秋八月壬午滅肥以肥子緜皋歸肥杜注白狄鉅鹿下曲陽縣有肥累城在今藳城縣西南緜皋肥子名為下晉伐鮮虞起周原伯絞虐原伯絞周大夫原公其輿臣使曹逃輿衆也曹羣也冬十月壬申朔原輿人逐絞而立公子跪尋跪尋絞弟絞奔郊郊杜注周邑甘簡公無子甘簡公周卿士立其弟過過將去成景之族成公景公皆過之先君成景之族賂劉獻公欲使殺過劉獻公亦周卿士劉定公子丙申殺甘悼公悼公即過而立成公之孫鰌鰌平公丁酉殺獻大子之傅庾皮之子過過劉獻公大子之傅殺瑕辛于市及宫嬖綽王孫沒劉州鳩隂忌老陽子六子周大夫及庾過皆甘悼公之黨傳言周衰甘原二族所以遂微秋七月冬十月公子憖出奔齊憖公羊作整左傳季平子立而不禮于南蒯蒯南遺子南蒯謂子仲子仲公子憖吾出季氏而歸其室于公室季氏家財子更其位我以費為公臣子仲許之南蒯語叔仲穆子且告之故穆子叔仲帶之子叔仲小季悼子之卒也悼子武子之子平子父叔孫昭子以再命為卿及平子伐莒克之更受三命十年平子伐莒以功加三命昭子亦以例加三命叔仲子欲構二家欲構使相憎謂平子曰三命踰父兄非禮也言昭子受三命自踰其先人平子曰然故使昭子使昭子自貶黜昭子曰叔孫氏有家禍殺適立庶故婼也及此禍在四年若因禍以斃之則聞命矣若不廢君命則困有著矣著位次昭子朝而命吏曰婼将與季氏訟書辭無頗頗偏也季孫懼而歸罪于叔仲子故叔仲小南蒯公子憖謀季氏憖告公而遂從公如晉南蒯懼不克以費叛如齊子仲還及衞聞亂逃介而先介副使及郊聞費叛遂奔齊言及郊解經所以書出南蒯之将叛也其鄉人或知之過之而歎且言曰恤恤乎湫乎攸乎恤恤憂患貌湫愁隘貌攸懸危貌深思而淺謀邇身而遠志家臣而君圖有人矣哉言今有此人微以感之南蒯枚筮之不指其事泛卜吉凶遇坤坤下坤上坤之比坤下坎上比坤六五爻變曰黄裳元吉坤六五爻辭以為大吉也示子服惠伯曰即欲有事何如惠伯曰吾嘗學此矣忠信之事則可不然必敗外强内溫忠也坎險故強坤順故溫强而能溫所以為忠和以率貞信也水和而土安正和正信之本也故曰黄裳元吉黄中之色也裳下之飾也元善之長也中不忠不得其色言非黄下不共不得其飾不為裳事不善不得其極失中德外内倡和為忠不相違也率事以信為共率猶行也供養三德為善三德謂正直剛克柔克也非此三者弗當忠共善三者且夫易不可以占險将何事也且可飾乎夫易猶此易謂黄裳元吉之卦問其何事欲令從下之飾中美能黄上美為元下美則裳參成可筮參美盡備吉可如筮猶有闕也筮雖吉未也将適費蒯自其家遷適費飲鄉人酒鄉人或歌之曰我有圃生之把乎言南蒯在費欲為亂如把生于園圃非宜也把世所謂枸把也從我者子乎子男子之通稱言從己可不失今之尊去我者鄙乎倍其鄰者恥乎鄰猶親也己乎己乎非吾黨之士乎己乎己乎言自遂不改平子欲使昭子逐叔仲小欲以自解説小聞之不敢朝昭子命吏謂小待政于朝曰吾不為怨府言不能為季氏逐小生怨禍之聚為明年叔弓圍費傳按左氏季孫意如不禮于南蒯蒯與公子憖謀去之憖以告公未幾而敗蒯以費叛憖遂奔齊至是則公與季氏之釁己顯著季氏之謀公益急矣楚子伐徐左傳楚子狩于州來次于潁尾潁尾杜注潁水之尾在下蔡西按潁水入淮處在今江南潁上縣與夀州接界謂之潁口使蕩侯潘子司馬督囂尹午陵尹喜帥師圍徐以懼吴五子楚大夫囂陵二縣名徐吴與國故圍之以偪吴楚子次于乾谿以為之援乾谿杜注在譙國城父縣南雨雪王皮冠秦復陶秦所遺羽衣也翠被以翠羽飾被豹舄以豹皮為履執鞭以出執鞭以敎令僕析父從僕析父楚大夫右尹子革夕子革鄭丹夕暮見王見之去冠被舍鞭敬大臣與之語曰昔我先王熊繹與呂級王孫牟燮父禽父竝事康王熊繹楚始封君呂級齊大公子丁公牟衛康叔子康伯燮父晉唐叔子禽父周公子伯禽四國皆有分四國齊晉魯衛分珍寶之器我獨無有今吾使人于周求鼎以為分王其與我乎對曰與君王哉昔我先王熊繹辟在荆山荆山杜注在新城沶鄉縣南篳路藍縷以處草莽跋涉山林以事天子唯是桃弧棘矢以共禦王事篳荆柴路車也藍縷衣敝桃弧棘矢以禦不祥言楚在山林少所出有齊王舅也成王母齊大公女晉及魯衛王母弟也楚是以無分而彼皆有今周與四國服事君王将唯命是從豈其愛鼎王曰昔我皇祖伯父昆吾舊許是宅今鄭人貪賴其田而不我與我若求之其與我乎陸終氏生六子長曰昆吾少曰季連季連楚之祖故謂昆吾為伯父昆吾常居許地許既南遷故云舊許時地屬鄭對曰與君王哉周不愛鼎鄭敢愛田王曰昔諸侯遠我而畏晉今我大城陳蔡不羮賦皆千乘子與有勞焉諸侯其畏我乎對曰畏君王哉是四國者專足畏也四國陳蔡二不羮又加之以楚敢不畏君王哉工尹路請曰君王命剝圭以為鏚柲敢請命鏚斧也柲柄也破圭以飾斧柄請命請制度之命王入視之析父謂子革吾子楚國之望也今與王言如響國其若之何譏其順王心如響應聲子革曰摩厲以須王出吾刃将斬矣以己喻鋒刃欲自摩厲以斬王之淫慝王出復語左史倚相趨過倚相楚史名王曰是良史也子善視之是能讀三墳五典八索九丘皆古書名孔安國云伏羲神農黄帝之書謂之三墳言大道也少昊顓頊髙辛唐虞之書謂之五典言常道也八卦之説謂之八索求其義也九州之志謂之九丘丘聚也言九州所有土地所生風氣所宜皆聚此書也對曰臣嘗問焉昔穆王欲肆其心周行天下将皆必有車轍馬跡焉祭公謀父作祈招之詩以止王心王是以獲沒于祇宮謀父周卿士祈父周司馬招其名祭公方諫遊行故指司馬官而言詩逸祇宮王之離宮獲沒不見簒弑臣問其詩而不知也若問遠焉其焉能知之王曰子能乎能謂舉其辭對曰能其詩曰祈招之愔愔式昭德音愔愔安和貌式用也昭明也思我王度式如玉式如金金玉取其堅重形民之力而無醉飽之心言國之用民當隨其力任如金冶之器隨器而制形故言形民之力去其醉飽過淫之心王揖而入饋不食寢不寐數日深感子革之言不能自克以及于難仲尼曰古也有志克己復禮仁也信善哉楚靈王若能如是豈其辱于乾谿徐世服於楚其再見伐以吴故也楚虔自會申以後執徐子圍朱方遷賴于鄢滅陳蔡至是又親圍徐自謂天下莫敢違不知衆叛親離禍己伏積而不可解矣晉伐鮮虞左傳晉伐鮮虞因肥之役也肥役在此年穀梁傳其曰晉狄之也其狄之何也不正其與夷狄交伐中國故狄稱之也鮮虞姬姓白狄也地居中山故曰中國夷狄謂楚時楚滅陳蔡圍徐晉亦伐鮮虞是謂交伐中國昔陽之役假道鮮虞及返役遂因鮮虞之不備而伐之夫楚虔簒弑之賊連用詐謀以滅陳滅蔡晉不能反其道惇信明義以屬諸侯而師其詐謀庸何愈於楚貶而書號惡之深也日講春秋解義卷五十
