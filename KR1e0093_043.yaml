body:
  text: 欽定四庫全書日講春秋解義卷四十三襄公二十有四年春叔孫豹如晉左傳二十四年春穆叔如晉賀克欒氏范宣子逆之問焉曰古人有言曰死而不朽何謂也穆叔未對宣子曰昔丐之祖自虞以上為陶唐氏陶唐杜注堯所治地大原晉陽縣也在夏為御龍氏謂劉纍事見昭二十九年在商為豕韋氏豕韋杜注國名東郡白馬縣東南有韋城在今直隸滑縣東南在周為唐杜氏唐杜杜注二國名殷末豕韋國于唐周成王滅唐遷之于杜為杜伯杜伯之子隰叔奔晉四世及士會食邑于范復為范氏杜京兆杜縣今陜西西安府治東南有杜陵故城晉主夏盟為范氏其是之謂乎言己世為興家穆叔曰以豹所聞此之謂世祿非不朽也魯有先大夫曰臧文仲既沒其言立立謂不廢絶其是之謂乎豹聞之大上有立德黃帝堯舜其次有立功禹稷其次有立言史佚周任臧文仲雖久不廢此之謂不朽若夫保姓受氏以守宗祊世不絶祀無國無之祿之大者不可謂不朽傳善穆叔之知言附録左傳范宣子為政諸侯之幣重鄭人病之二月鄭伯如晉子産寓書于子西以告宣子子西相鄭伯如晉故曰子為晉國四鄰諸侯不聞令德而聞重幣僑也惑之僑聞君子長國家者非無賄之患而無令名之難夫諸侯之賄聚于公室則諸侯二若吾子賴之賴恃用之則晉國二諸侯二則晉國壞晉國二則子之家壞何沒沒也沒沒沈滅之言將焉用賄夫令名德之輿也德須令名以逺聞德國家之基也有基無壞無亦是務乎有德則樂樂則能久詩云樂只君子邦家之基有令德也夫詩小雅言君子樂美其道為邦家之基所以昭令德上帝臨女無二爾心有令名也夫詩大雅言武王為天所臨不敢懷二心所以獲令名恕思以明德則令名載而行之是以逺至邇安毋寧使人謂子子實生我而謂子浚我以生乎象有齒以焚其身賄也焚斃也宣子説乃輕幣是行也鄭伯朝晉為重幣故且請伐陳也鄭伯稽首宣子辭子西相曰以陳國之介恃大國大國楚也而陵虐于敝邑寡君是以請罪焉敢不稽首為明年鄭入陳傳仲孫羯帥師侵齊左傳孟孝伯侵齊孝伯仲孫羯晉故也前年齊伐晉故叔孫豹救晉無功故孟孝伯帥師侵齊為晉報焉羯代速為卿未練而帥師非禮也夏楚子伐吳左傳夏楚子為舟師以伐吳不為軍政不設賞罰之差無功而還為下吳召舒鳩張本襄十一年楚失鄭十四年伐吳自是舍鄭不爭又十年一再伐吳急吳而緩鄭蓋楚弱而吳張也秋七月甲子朔日有食之既春秋三書日食既桓三年以桓王敗宣八年以楚莊興是後則中國諸侯皆受盟於楚矣頻月食者惟襄二十一年九月十月及此年七月八月歷法無此先儒以為傳寫失真不可強通也齊崔杼帥師伐莒左傳齊侯既伐晉而懼將欲見楚子楚子使薳啓強如齊聘且請期請會期齊社搜軍實使客觀之陳文子曰陳須無齊將有寇吾聞之兵不戢必取其族戢藏也族類也取其族還自害也秋齊侯聞將有晉師夷儀之師使陳無宇從薳啓強如楚辭陳無宇齊大夫辭有晉師未得相見且乞師崔杼帥師送之遂伐莒侵介根介根杜注莒邑城陽黔陬縣東北計基城是也齊既與莒平今復伐之無信己甚崔杼自虛朾同盟久専國政至是假伐莒以竊兵柄篡弒之禍其所由來者漸矣大水夷儀之會以水不克伐齊則知水之所及廣矣非特魯之災也八月癸巳朔日有食之公會晉侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯把伯小邾子于夷儀夷儀公羊作陳儀後同左傳會于夷儀將以伐齊水不克會于夷儀帥十二諸侯之師將以討齊然會而不伐是有畏也國勢不競衆志不一也曰水不克者特辭不能伐爾下書崔杼伐我西鄙蓋知晉之無能為也冬楚子蔡侯陳侯許男伐鄭左傳冬楚子伐鄭以救齊門于東門次于棘澤棘澤在今河南新鄭縣東南諸侯還救鄭夷儀諸侯晉侯使張骼輔躒致楚師求御于鄭二子晉大夫欲得鄭人自御知其地利故也鄭人卜宛射犬吉射犬鄭公孫子大叔戒之曰大叔遊吉大國之人不可與也言不可與等欲使卑下之對曰無有衆寡其上一也言在己上者有常分無大小國之異大叔曰不然部婁無松柏部婁小阜松柏大木喻小國異于大國二子在幄坐射犬于外二子張骼輔躒既食而後食之使御廣車而行廣車兵車已皆乘乘車乘車安車將及楚師而後從之乘皆踞轉而鼓琴轉衣裝踞謂坐其上近不告而馳之射犬恨故近敵不告而馳皆取胄于櫜而胄入壘皆下搏人以投收禽挾囚弗待而出射犬又不待二子皆超乘抽弓而射既免復踞轉而鼓琴曰公孫同乘兄弟也胡再不謀謂不告而馳不待而出對曰曩者志入而已今則怯也皆笑曰公孫之亟也亟急也楚子自棘澤還使薳啓強帥師送陳無宇傳言齊楚固相結吳人為楚舟師之役故在此年夏召舒鳩人舒鳩人叛楚舒鳩杜注楚屬國楚子師于荒浦荒浦杜注舒鳩地使沈尹夀與師祁犂讓之二子楚大夫舒鳩子敬逆二子而告無之且請受盟二子復命王欲伐之薳子曰令尹薳子馮不可彼告不叛且請受盟而又伐之伐無罪也姑歸息民以待其卒卒而不二吾又何求若猶叛我無辭有庸乃還為明年楚滅舒鳩傳晉合十二國之君畏齊不敢伐而徒致棘澤之役以患鄭其無能可知矣諸侯救鄭不書救不及事不足録也公至自會陳針宜咎出奔楚左傳陳人復討慶氏之黨針宜咎出奔楚宜咎之事無聞焉而以慶氏之黨逐則其人可知矣其後在楚為針尹宜咎叔孫豹如京師左傳齊人城郟郟王城也于是穀雒鬬毁王宮故為王城之穆叔如周聘且賀城王嘉其有禮也賜之大路為昭四年叔孫以所賜路葬張本據傳穀洛鬭毁王宫齊侯叛晉求媚於天子故為王城之於是叔孫豹始如京師聘且賀焉襄之聘晉者九是年春先聘晉冬乃聘王慢甚矣城郟魯不與故不書大飢穀梁傳五穀不升為大飢一穀不升謂之嗛二穀不升謂之飢三穀不升謂之饉四穀不升謂之康五穀不升謂之大侵大侵之禮君食不兼味臺榭不塗弛侯廷道不除侯射侯廢侯不燕射廷內道路不修除百官布而不制官職修列不可缺廢不更有造作鬼神禱而不祀此大侵之禮也二穀不熟曰飢五穀不熟曰大飢古者備荒之政至纖且悉是年秋雖大水猶未至墮城郭沒倉廩而遽至大飢則知備荒之無政矣附録左傳晉侯嬖程鄭使佐下軍代欒盈鄭行人公孫揮如晉聘揮子羽程鄭問焉曰敢問降階何由問自降下之道子羽不能對歸以語然明然明鬷蔑然明曰是將死矣不然將亡貴而知懼懼而思降乃得其階階猶道也下人而已又何問焉且夫既登而求降階者知人也不在程鄭其有亡釁乎不然其有惑疾將死而憂也為明年程鄭死張本二十有五年春齊崔杼帥師伐我北鄙左傳二十五年春齊崔杼帥師伐我北鄙以報孝伯之師也前年魯使孟孝伯為晉伐齊公患之使告于晉孟公綽曰孟公綽魯大夫崔子將有大志不在病我必速歸何患焉其來也不寇使民不嚴異于他日齊師徒歸徒空也崔杼懷無君之心鄰國知之而齊莊貪伐國之功利令知昏豪不覺悟宜其及也夏五月乙亥齊崔杼弒其君光左傳齊棠公之妻棠公齊棠邑大夫東郭偃之姊也東郭偃臣崔武子棠公死偃御武子以弔焉見棠薑而美之使偃取之為己取偃曰男女辨姓今君出自丁齊丁公崔杼之祖臣出自桓不可桓公小白東郭偃之祖同薑姓故不可昏武子筮之遇困坎下兑上困之大過巽下兑上大過困六三變為大過史皆曰吉示陳文子文子曰夫從風坎為中男故曰夫變而為巽故曰從風風隕妻不可娶也風能隕落物者變而隕落故曰妻不可娶且其繇曰困于石據于蒺藜入于其宫不見其妻凶困六三爻辭困于石往不濟也坎為險為水水之險者石不可以動據于蒺藜所恃傷也坎為險兑為澤澤之生物而險者蒺藜恃之則傷入于其宫不見其妻凶無所歸也六三失位無應則喪其妻失其所歸也崔子曰嫠也何􅊣先夫當之矣寡婦曰嫠言棠公已當此凶遂取之莊公通焉驟如崔氏以崔子之冠賜人侍者曰不可公曰不為崔子其無冠乎崔子因是又以其間伐晉也曰晉必將報欲弒公以説于晉而不獲間公鞭侍人賈舉而又近之乃為崔子間公伺公間隙夏五月莒為且于之役故莒子朝于齊且于役在二十三年甲戌饗諸北郭崔子稱疾不視事欲使公來乙亥公問崔子問疾遂從薑氏薑入于室與崔子自側户出公拊楹而歌歌以命薑侍人賈舉止衆從者而入閉門為崔子閉公重言侍人者别下賈舉甲興公登臺而請弗許請盟弗許請自刃于廟弗許皆曰君之臣杼疾病不能聽命近于公宫言崔子宮近公宫或淫者詐稱公陪臣干掫有淫者不知二命干掫行夜言行夜得淫人受崔子命討之不知他命掫夜戒有所擊也公踰牆又射之中股反隊遂弒之賈舉州綽邴師公孫敖封具鐸父襄伊僂堙皆死此非侍人賈舉也八子皆齊勇力之臣為公所嬖者祝他父祭于髙唐祝他父莊公之嬖髙唐齊别廟至復命不説辨而死于崔氏爵辨祭服申蒯侍漁者侍漁監取魚之官退謂其宰曰爾以帑免我將死其宰曰免是反子之義也與之皆死崔氏殺鬷蔑于平隂鬷蔑平隂大夫公外嬖傳言莊公所養非國士故其死難皆寵嬖之人晏子立于崔氏之門外晏子平仲聞難而來其人曰死乎曰獨吾君也乎哉吾死也曰行乎曰吾罪也乎哉吾亡也曰歸乎曰君死安歸君民者豈以陵民社稷是主臣君者豈為其口實社稷是養口實祿養也故君為社稷死則死之為社稷亡則亡之若為己死而為己亡非其私昵誰敢任之且人有君而弒之吾焉得死之而焉得亡之將庸何歸將用死亡之義何所歸趣門啓而入枕尸股而哭以公尸枕己股興三踊而出人謂崔子必殺之崔子曰民之望也舍之得民盧蒲癸奔晉王何奔莒二子莊公黨為二十八年殺慶舍張本叔孫宣伯之在齊也宣伯魯叔孫僑如成十六年奔齊叔孫還納其女于靈公嬖生景公還齊羣公子納宣伯女于靈公丁丑崔杼立而相之慶封為左相盟國人于大宮大宫大公廟曰所不與崔慶者晏子仰天歎曰嬰所不唯忠于君利社稷者是與有如上帝乃歃盟書云所不與崔慶者有如上帝讀書未終晏子抄答易其辭因自歃辛巳公與大夫及莒子盟莒子朝齊遇崔杼作亂未去故復與景公盟大史書曰崔杼弒其君崔子殺之其弟嗣書而死者二人其弟又書乃舍之南史氏聞大史盡死執簡以往聞既書矣乃還南史氏齊史之在外者傳言齊有直史崔杼之罪所以聞閭丘嬰以帷縛其妻而載之與申鮮虞乘而出二子莊公近臣鮮虞推而下之下嬰妻也曰君昏不能匡危不能救死不能死而知匿其昵匿藏也昵親也其誰納之行及弇中弇中狹道將舍嬰曰崔慶其追我鮮虞曰一與一誰能懼我言道狹衆無所用遂舍枕轡而寢恐失馬也食馬而食駕而行出弇中謂嬰曰速驅之崔慶之衆不可當也道廣衆得用故遂來奔崔氏側莊公于北郭側瘞埋之不殯于廟丁亥葬諸士孫之里士孫人姓因名里死十三日便葬不待五月四翣喪車之飾諸侯六翣不蹕蹕止行人下車七乘不以兵甲下車送喪之車齊舊依上公禮九乘又有甲兵今皆降損穀梁傳莊公失言淫于崔氏放言將淫崔氏為此見弒齊莊公之難賈舉州綽等十人皆死之而不得以死節稱蓋平日從君於昏以致亂亡雖殺身不足以償其責也使其中有守義執節之臣將以死諫豈肯相隨入崔氏之宮耶但晏嬰號為賢者平時知君之必陷於亂亡而不能諫一旦有事則假社稷為重以自明其不必死使後世貪生忘義者得以藉口而先儒或是其言亦習焉而未之察耳公會晉侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯把伯小邾子于夷儀左傳晉侯濟自泮泮杜注闕會于夷儀伐齊以報朝歌之役朝歌役在二十三年齊人以莊公説使隰鉏請成慶封如師鉏隰朋之曽孫慶封獨使于晉不通諸侯故不書男女以班賂晉侯以宗器樂器自六正五吏三十帥三軍之大夫百官之正長師旅及處守者皆有賂六正三軍之六卿五吏文職三十帥武職皆軍卿之屬官百官正長羣有司師旅小將帥處守守國者賂財賄晉侯許之使叔向告于諸侯公使子服惠伯對曰君舍有罪以靖小國君之惠也寡君聞命矣晉會諸侯于夷儀本謀伐齊以報朝歌之役崔杼弒君本以私忿會諸侯之伐遂以莊公之弒自解夫莊公既死則齊可不伐而崔杼覆載不容之惡不可不討使晉能申明大義命齊人及崔氏之宗黨皆安堵而獨有討於杼躬率諸侯進薄於城下齊之臣庶服義懷德各有奮心杼之力能獨抗乎誅其賊置其君以定其國則晉之六卿魯之三桓皆有戢志矣不知出此而以賂罷兵此晉霸所以遂衰而終以自敝與附録左傳晉侯使魏舒宛沒逆衛侯衛獻公以十四年奔齊將使衛與之夷儀崔子止其帑以求五鹿崔杼欲得衛之五鹿故留衛侯妻子于齊以質之六月壬子鄭公孫舍之帥師入陳左傳初陳侯會楚子伐鄭在前年當陳隧者井堙木刋隧徑也堙塞也刋除也鄭人怨之六月鄭子展子産帥車七百乘伐陳宵突陳城突穿也遂入之陳侯扶其太子偃師奔墓欲逃冡間遇司馬桓子陳之司馬曰載余曰將巡城不欲載公以巡城辭遇賈獲賈獲陳大夫載其母妻下之而授公車公曰舍而母辭曰不祥雖急猶不欲男女無别與其婁扶其母以奔墓亦免子展命師無入公官與子産親御諸門欲服之而已故禁侵掠陳侯使司馬桓子賂以宗器陳侯免擁社免喪服擁社抱社主示服使其衆男女别而纍以待于朝纍自囚繫以待命子展執縶而見縶馬韁再拜稽首承飲而進獻示不失臣敬子美入數俘而出子美子産也但數其所獲人數不將以歸祝祓社司徒致民司馬致節司空致地乃還祓除也節兵符陳亂故正其衆官修其所職以安定之去秋夷儀之會楚合陳蔡許伐鄭是年復會夷儀鄭慮楚復來先帥師入陳以奪其心鄭以蕞爾國當南北之衝晉楚之師更至疊出自子産得政不獨修辭執禮足以服強大而軍政之修守不可拔攻則必克以是知立國貴自強也秋八月己巳諸侯同盟于重丘重丘杜注齊地寰宇記聊城縣東北有重丘聊城今山東東昌府治左傳秋七月己巳己巳七月十二日經書八月誤同盟于重丘齊成故也夷儀之會不書伐以齊逆服兵不加也杜氏預謂伐齊而書同盟以明齊亦同盟非也使齊果同盟當特書諸侯及齊某盟以著其失賊列姦之罪矣據經會不書伐而同盟書諸侯乃中有間事之恆辭蓋晉既許齊成齊亂未定崔杼既不敢自行又懼他人見諸侯而生異議實未嘗使人出受盟耳附録左傳趙文子為政趙武代范丐令薄諸侯之幣而重其禮穆叔見之謂穆叔曰自今以往兵其少弭矣弭止也齊崔慶新得政將求善于諸侯武也知楚令尹令尹屈建若敬行其禮道之以文辭以靖諸侯兵可以弭為二十七年晉楚盟于宋傳公至自會衛侯入于夷儀左傳衛獻公入于夷儀公羊傳陳儀者何衛之邑也曷為不言入于衛諼君以弒也諼詐也時衛侯為剽所逐不能自復詐言願居是邑為剽臣然後伺候間隙使寧喜弒之衛侯之入夷儀與鄭伯突同而或名或不名者鄭伯奪正以立國人君之諸侯助之不知其義不可以有國也故特書其名以絶之若衎之出奔雖不為無罪而非突比故止書其爵此輕重之權衡也楚屈建帥師滅舒鳩左傳楚薳子馮卒屈建為令尹屈建子木屈蕩為莫敖代屈建舒鳩人卒叛前年辭不叛楚令尹子木伐之及離城杜注舒鳩城吳人救之子木遽以右師先先至舒鳩子強息桓子捷子駢子盂帥左師以退五人不及子木與吳相遇而退吳人居其間七日居楚兩軍之間子強曰久將墊隘隘乃禽也墊隘慮水雨不如速戰請以其私卒誘之簡師陳以待我簡閲精兵駐後為陳我克則進奔則亦視之乃可以免不然必為吳禽從之五人以其私卒先擊吳師吳師奔登山以望見楚師不繼復逐之傅諸其軍吳還逐五子至其本軍簡師會之吳師大敗遂圍舒鳩舒鳩潰八月楚滅舒鳩晉霸既衰楚勢益強諸侯畏之故滅國書大夫之名氏自是凡大夫帥師滅國皆以名見而不復書人矣滅國不書大夫者吳也其威猶未盛於中夏也冬鄭公孫夏帥師伐陳夏公羊作蠆左傳鄭子産獻捷于晉獻入陳之功戎服將事晉人問陳之罪對曰昔虞閼父為周陶正以服事我先王閼父舜之後當周之興閼父為武王陶正我先王賴其利器用也與其神明之後也舜聖故謂之神明庸以元女大姬配胡公庸用也元女武王之長女胡公閼父之子滿也而封諸陳以備三恪周封夏殷後又封舜後謂之三恪示敬也則我周之自出至于今是賴桓公之亂蔡人欲立其出陳桓公鮑卒陳亂事在魯桓五年蔡出桓公子厲公我先君莊公奉五父而立之五父他桓公弟殺大子免而代之鄭莊公因定其位蔡人殺之我又與蔡人奉戴厲公至于莊宣皆我之自立陳莊公宣公皆厲公子夏氏之亂成公播蕩又我之自入君所知也宣公十一年陳夏徵舒弒靈公靈公之子成公奔晉自晉因鄭而入今陳忘周之大德蔑我大惠棄我姻親介恃楚衆以馮陵我敝邑不可億逞億度也逞盡也我是以有往年之告謂鄭伯稽首告晉請伐陳未獲成命則有我東門之役前年陳從楚伐鄭東門當陳隧者井堙木刋敝邑大懼不競而恥大姬天誘其衷啓敝邑心陳知其罪授手于我用敢獻功晉人曰何故侵小對曰先王之命唯罪所在各致其辟且昔天子之地一圻方千里列國一同方百里自是以衰衰差降今大國多數圻矣若無侵小何以至焉晉人曰何故戎服對曰我先君武莊為平桓卿士鄭武公莊公為周平王桓王卿士城濮之役文公布命曰晉文公各復舊職命我文公戎服輔王以受楚捷不敢廢王命故也士莊伯不能詰士莊伯士弱也復于趙文子文子曰其辭順犯順不祥乃受之冬十月子展相鄭伯如晉拜陳之功謝晉受其功子西復伐陳陳及鄭平仲尼曰志有之志古書言以足志文以足言足猶成也不言誰知其志言之無文行而不逺晉為伯鄭入陳非文辭不為功慎辭哉鄭再伐陳取成而還陳不能報楚不敢問以子産方明其政刑衆知鄭之不可侮也附録左傳楚蒍掩為司馬蒍子馮之子子木使庀賦庀治數甲兵數閲甲午蒍掩書土田書土地之所宜度山林量度山林之材以供國用鳩藪澤鳩聚也聚成藪澤使民不得焚燎以備田獵之處辨京陵辨别也絶髙曰京大阜曰陵别之以為冢墓之地表淳鹵淳鹵埆薄之地表異輕其賦稅數疆潦疆界有流潦者計數減其租入規偃豬偃豬下濕之地規度其受水多少町原防廣平曰原防隄也隄防間地不得方正如井田别為小頃町牧隰皋隰皋水崖下濕為芻牧之地井衍沃衍沃平美之地則制以為井田量入修賦量九土之所入而治理其賦稅賦車籍馬籍疏其毛色嵗齒以備軍用賦車兵徒卒甲楯之數車兵甲士數器仗有常數既成以授子木禮也得治國之禮傳言楚之所以興十有二月吳子遏伐楚門于巢卒遏公羊穀梁作謁左傳十二月吳子諸樊伐楚以報舟師之役舟師在二十四年門于巢攻巢門巢牛臣曰牛臣巢人吳王勇而輕若啓之啓開門也將親門我獲射之必殪是君也死疆其少安從之吳子門焉牛臣隱于短牆以射之卒公羊傳門于巢卒者何入門乎巢而卒也入門乎巢而卒者何入巢之門而卒也吳子謁何以名傷而反未至乎舍而卒也穀梁傳以伐楚之事門于巢卒也因伐楚而經巢于巢者外乎楚也言于巢則不在楚門于巢乃伐楚也先攻巢乃可伐楚諸侯不生名取卒之名加之伐楚之上者見以伐楚卒也其見以伐楚卒何也古者大國過小邑小邑必飾城而請罪禮也飾城者修守備請罪問所以致師之意吳子謁伐楚至巢入其門門人射吳子有矢創反舍而卒古者雖有文事必有武備非巢之不飾城而請罪非吳子之自輕也非責兩譏之也舉卒之名加於伐楚之上與七年鄭伯髠頑如會卒于鄵同義皆以便文耳門于巢謂攻其城而門焉見遏之死於兵也若暴疾過巢門而卒則當書卒于巢附録左傳楚子以滅舒鳩賞子木辭曰先大夫蒍子之功也以與蒍掩往年楚子將伐舒鳩蒍子馮請退師以須其叛故晉程鄭卒子産始知然明前年然明謂程鄭將死今如其言故知之問為政焉對曰視民如子見不仁者誅之如鷹鸇之逐鳥雀也子産喜以語子大叔且曰他日吾見蔑之靣而已蔑然明名今吾見其心矣子大叔問政于子産子産曰政如農功日夜思之思其始而成其終朝夕而行之行無越思如農之有畔其過鮮矣衛獻公自夷儀使與寧喜言求復國也寧喜許之大叔文子聞之大叔儀曰烏乎詩所謂我躬不説皇恤我後者寧子可謂不恤其後矣詩小雅謂寧子必身受禍不得恤其後也將可乎哉殆必不可君子之行思其終也思其復也書曰慎始而敬終終以不困周書蔡仲之命詩曰夙夜匪解以事一人今寧子視君不如奕棋其何以免乎奕者舉棋不定不勝其耦耦對敵也而况置君而弗定乎必不免矣九世之卿族一舉而滅之可哀也哉寧氏出自衛武公及喜九世也明年衛獻公歸國二十七年果殺寧喜會于夷儀之嵗齊人城郟在二十四年不直言會夷儀者别二十五年夷儀會其五月秦晉為成自十四年十三國伐秦至是始平晉韓起如秦涖盟秦伯車如晉涖盟伯車秦伯之弟針也成而不結傳為後年修成起本日講春秋解義卷四十三
