body:
  text: 欽定四庫全書日講春秋解義卷三十八襄公七年春郯子來朝左傳七年春郯子來朝始朝公也夏四月三卜郊不從乃免牲左傳夏四月三卜郊不從乃免牲孟獻子曰吾乃今而後知有卜筮夫郊祀后稷以祈農事也是故啓蟄而郊郊而後耕啓蟄夏正建寅之月耕謂春分今既耕而卜郊宜其不從也榖梁傳夏四月不時也三卜禮也乃者亡乎人之辭也公穀以三卜為合禮啖氏助及朱子皆從之此年三卜亦書蓋譏非時非譏其瀆卜也卜郊止於三月今四月而三卜則過時而不敬矣小邾子來朝左傳小邾穆公來朝亦始朝公也城費左傳南遺為費宰費季氏邑叔仲昭伯為隧正昭伯叔仲惠伯之孫隧正主役徒欲善季氏而求媚于南遺謂遺請城費吾多與而役故季氏城費𫝊言祿去公室季氏所以强費魯彊邑也隱元年𫝊稱費伯即其邑大夫僖公復以賜季友自南遺請城而後不獨季氏世卿而南氏亦世其邑季氏但知大城其私邑以弱公室而不知陪臣之擬其後也觀費之城可以知履霜堅冰之戒矣秋季孫宿如衛左傳秋季武子如衛報子叔之聘且辭緩報非二也子叔聘在元年比書滕郯小邾來朝而志大夫如晉如衛畏大慢小邦交之非義甚矣八月螽書螽記災也經自莊公以後螟不書螽然後書蓋不可勝書故獨舉其重者耳附録左傳冬十月晉韓獻子告老公族穆子有廢疾穆子韓厥長子成十八年為公族大夫將立之代厥為卿辭曰詩曰豈不夙夜謂行多露詩國風言雖欲早夜而行懼多露之濡己義取非禮不可妄行又曰弗躬弗親庶民弗信詩小雅譏在位者不躬親政事則庶民不奉信其命喻已有疾不能躬親政事無忌不才讓其可乎請立起也無忌穆子名起無忌弟宣子也與田蘇游而曰好仁田蘇晉賢人蘇言起好仁詩曰靖共爾位好是正直神之聼之介爾景福詩小雅言君子當思不出其位求正直之人與之竝立如是則神明順之致大福也恤民為德靖共其位所以恤民正直為正正己心正曲為直正人曲參和為仁德正直三者偹乃為仁如是則神聼之介福降之立之不亦可乎庚戌使宣子朝遂老晉侯謂韓無忌仁使掌公族大夫為之師長冬十月衛侯使孫林父來聘壬戌及孫林父盟左傳衛孫文子來聘且拜武子之言緩報非二之言而尋孫桓子之盟盟在成三年公登亦登禮登階臣後君一等叔孫穆子相趨進曰諸侯之㑹寡君未嘗後衛君今吾子不後寡君寡君未知所過吾子其少安安徐也孫子無辭亦無悛容穆叔曰孫子必亡為臣而君過而不悛亡之本也詩曰退食自公委蛇委蛇謂從者也衡而委蛇必折詩召南委蛇順貌從順行衡橫也橫不順道必毁折為十四年林父逐君起本楚公子貞帥師圍陳圍國書大夫始此十有二月公㑹晉侯宋公陳侯衛侯曹伯莒子邾子于鄬鄬榖梁或作䧦杜注鄭地左傳楚子囊圍陳㑹于鄬以救之前書伐陳此書圍陳楚之陵暴極矣㑹于鄬謀救陳也不書救不成救也夫楚以十月圍陳將歷一冬而悼公始㑹諸侯遷延鄭地是有畏楚之心而不能急救陳也此陳侯所以既㑹而逃歸歟鄭伯髠頑如㑹未見諸侯丙戌卒于鄵髠頑公羊穀梁作髠原鄵公羊穀梁作操杜注鄭地左傳鄭僖公之為大子也于成之十六年與子罕適晉不禮焉又與子豐適楚子豐穆公子亦不禮焉及其元年鄭僖元年魯襄三年朝于晉子豐欲訴諸晉而廢之子罕止之及將會于鄬子駟相又不禮焉侍者諫不聼又諫殺之及鄵子駟使賊夜弒僖公而以瘧疾赴于諸侯𫝊言經所以不書弒簡公生五年僖公子奉而立之公羊傳操者何鄭之邑也諸侯卒其封內不地此何以地隱之也何隱爾弒也孰弒之其大夫弒之曷為不言其大夫弒之為中國諱也曷為為中國諱鄭伯將會諸侯于鄬其大夫諫曰中國不足歸也則不若與楚鄭伯曰不可其大夫曰以中國為義則伐我喪據城虎牢事以中國為强則不若楚言楚圍陳不能救于是弒之鄭伯髠原何以名傷而反未至乎舍而卒也未見諸侯其言如會何致其意也穀梁傳未見諸侯其曰如會何也致其志也禮諸侯不生名此其生名何也卒之名也卒之名則何為加之如會之上見以如會卒也其見以如會卒何也鄭伯將會中國其臣欲從楚不勝其臣弒而死其不言弒何也不使夷狄之民加乎中國之君也以其臣欲從楚故謂夷狄之民其地于外也其日未踰竟也日卒時葬正也經書鄭伯卒三傳皆以為弒故趙氏匡以為疑而胡氏安國之說尤穿鑿而害義不知鄭人以疾訃魯史以卒書孔子無所據以革之故特文以發人之疑而見其實也如果以疾卒則書鄭伯髠頑如㑹卒于鄵如宋公佐之卒于曲棘可矣未達會所自無由與諸侯相見而曰未見諸侯明其以欲見諸侯死也其文與魯君不書弒而别見其義使後人得考其實同非聖人不能修謂此類耳以卒之名加乎如會之上舍此無以立文也陳侯逃歸左傳陳人患楚楚圍陳故慶虎慶寅謂楚人曰吾使公子黃往而執之二慶陳執政大夫公子黃哀公弟楚人從之二慶使告陳侯于㑹曰楚人執公子黃矣君若不來羣臣不忍社稷宗廟懼有二圗陳侯逃歸鄬㑹所以不書救穀梁傳以其去諸侯故逃之也陳侯以國難逃歸先儒皆以背晉從楚為陳罪義非不正而未得其情也蓋晉早不欲有陳故范宣子曰有陳非吾事也無之而後可楚人圍陳晉雖再合諸侯於鄬而遷延不救陳有宗社之憂安能以虛名從晉乎書陳逃於㑹鄬之下亦以見晉之不足恃而傷陳之不得已焉耳八年春王正月公如晉左傳八年春公如晉朝且聼朝聘之數晉悼復修伯業故朝而稟其多少文襄之伯也令諸侯三歲而聘五歲而朝魯襄嗣位甫及八年而三朝於晉蓋季氏専魯欲過禮以自媚於晉故若是其勤耳夏葬鄭僖公公羊傳賊未討何以書葬為中國諱也附録左傳鄭羣公子以僖公之死也謀子駟子駟先之夏四月庚辰辟殺子狐子熙子侯子丁辟罪也加罪以戮之孫擊孫惡出奔衛二孫子狐之子鄭人侵蔡獲蔡公子燮燮穀梁作濕後同左傳庚寅鄭子國子耳侵蔡獲蔡司馬公子燮子耳子良之子不言敗唯以獲告鄭人皆喜唯子産不順子産子國子曰小國無文德而有武功禍莫大焉楚人來討能勿從乎從之晉師必至晉楚伐鄭自今鄭國不四五年弗得寧矣子國怒之曰爾何知國有大命而有正卿童子言焉將為戮矣公羊傳此侵也其言獲何侵而言獲者適得之也時適遇值其不備獲得之穀梁傳人微者也侵淺事也而獲公子公子病矣鄭子駟當國以僖公之弒欲自掩於晉又隂欲致楚師以脅國人而固與楚考傳侵蔡之師使子國子耳主之而己不與則其情可知矣季孫宿㑹晉侯鄭伯齊人宋人衛人邾人于邢丘左傳五月甲辰會于邢丘以命朝聘之數使諸侯之大夫聽命季孫宿齊高厚宋向戍衛寧殖邾大夫㑹之晉難重煩諸侯故使大夫聼命鄭伯獻捷于㑹獻蔡捷故親聼命大夫不書尊晉侯也穀傳梁見魯之失正也公在而大夫㑹也邢丘之㑹以命諸侯朝聘之數非㑹盟㑹伐之比故重煩諸侯而使大夫聼命鄭伯以獻捷與㑹則公在晉而不與㑹者乃晉侯加禮於魯與盟長樗同意先儒謂魯君失政實由於此則未得其情蓋四國皆大夫會不得專以此責季孫也但悼公之意夲欲以德禮懷諸侯而不知大夫之勢亦由是益張耳公至自晉莒人伐我東鄙左傳莒人伐我東鄙以疆鄫田莒伐魯以疆鄫田而霸討不及晉方慮楚故也據此則莒以兵滅鄫益無可疑矣秋九月大雩左傳秋九月大雩旱也冬楚公子貞帥師伐鄭左傳冬楚子囊伐鄭討其侵蔡也子駟子國子耳欲從楚子孔子蟜子展欲待晉子孔穆公子子蟜子游子子展子罕子子駟曰周詩有之曰俟河之清人夀幾何逸詩也河水濁千年一清喻晉之不可待兆云詢多職競作羅兆卜詢謀也職主也言既卜且謀多則競作羅網之難無成功謀之多族民之多違事滋無成民急矣姑從楚以紓吾民晉師至吾又從之敬共幣帛以待來者小國之道也犧牲玉帛待于二竟以待強者而庇民焉寇不為害民不罷病不亦可乎子展曰小所以事大信也小國無信兵亂日至亡無日矣五㑹之信謂三年㑹雞澤五年㑹戚又㑹城棣七年會鄬八年㑹邢丘今將背之雖楚救我將安用之親我無成鄙我是欲不可從也不如待晉晉君方明四軍無闕八卿和睦四軍謂上下中新軍也軍有二卿必不棄鄭楚師遼逺糧食將盡必將速歸何患焉舍之聞之舍之子展名杖莫如信完守以老楚杖信以待晉不亦可乎子駟曰詩云謀夫孔多是用不集詩小雅集就也言人欲為政是非相亂而不成發言盈庭誰敢執其咎言謀者多若有不善無適受其咎如匪行邁謀是用不得于道匪彼也行邁謀謀于路人也不得于道衆無適從請從楚騑也受其咎騑子駟名乃及楚平使王子伯駢告于晉曰伯駢鄭大夫君命敝邑修而車賦警而師徒以討亂略蔡人不從敝邑之人不敢寧處悉索敝賦索盡也以討于蔡獲司馬燮獻于邢丘今楚來討曰女何故稱兵于蔡焚我郊保馮陵我城郭敝邑之衆夫婦男女不遑啓處以相救也翦焉傾覆翦盡也無所控告民死亡者非其父兄即其子弟夫人愁痛夫人猶人人也不知所庇民知窮困而受盟于楚孤也與其二三臣不能禁止不敢不告知武子使行人子員對之曰君有楚命見討之命亦不使一介行李行李行人也告于寡君而即安于楚君之所欲也誰敢違君寡君將帥諸侯以見于城下唯君圗之為明年晉伐鄭傳觀左氏所載則子駟志在從楚而僖公之弒實由之可知矣不書鄭及楚平以下書諸侯伐鄭則鄭之從楚不待言也晉侯使士丐來聘左傳晉范宣子來聘且拜公之辱謝公春朝告將用師于鄭公享之宣子賦摽有梅詩召南摽落也梅盛極則落宣子欲魯及時共討鄭取其汲汲相赴季武子曰誰敢哉言誰敢不從命今譬于草木寡君在君君之臭味也言同類歡以承命何時之有遲速無時武子賦角弓詩小雅取兄弟昏姻無相逺矣之意賔將出武子賦彤弓彤弓天子賜有功諸侯之詩欲使晉君繼文之業復受彤弓于王宣子曰城濮之役我先君文公獻功于衡雍在僖二十八年受彤弓于襄王以為子孫藏丐也先君守官之嗣也敢不承命君子以為知禮彤弓之義義在晉君故范丐受之所謂知禮魯之事晉甚謹而自成公之末至襄公十二年晉報聘者四焉其修禮於諸侯者厚矣宜乎大小輯睦而霸業復興也九年春宋災災公羊作火左傳九年春宋災樂喜為司城以為政樂喜子罕也為政卿知將有火災素戒為備火之政使伯氏司里伯氏宋大夫司里里宰火所未至徹小屋塗大屋大屋難徹就塗之陳畚挶具綆缶畚簣籠挶土輿綆汲索缶汲器備水器盆􅧲之屬量輕重計人力所任蓄水潦積土塗巡丈城巡行也丈度也繕守備繕治也行度守備之處恐因災作亂表火道火起則從其所趣摽表之使華臣具正徒華臣華元子為司徒正徒役徒也令隧正納郊保奔火所隧正官名五縣為隧納聚郊野保守之民使隨火所起往救之使華閲討右官官庀其司亦華元子代元為右師討治也庀具也使具其官屬向戌討左亦如之向戌左師使樂遄庀刑器亦如之樂遄司寇刑器刑書也使皇鄖命校正出馬工正出車備甲兵庀武守皇鄖皇父充石之後校正主馬工正主車使各備其官使西鉏吾庀府守鉏吾太宰也府六官之典令司宫巷伯警宫司宫奄臣巷伯寺人皆掌宫內之事二師令四鄉正敬享二師左右師也鄉正鄉大夫享祀也祝宗用馬于四墉祀盤庚于西門之外祝大祝宗宗人墉城也用馬祭于四城以禳火盤庚殷王宋之逺祖城積隂之氣故祀之晉侯問于士弱曰弱士渥濁之子莊子吾聞之宋災于是乎知有天道何故問宋何故自知天道當災對曰古之火正或食于心或食于咮以出內火是故咮為鶉火心為大火謂火正之官配食于火星建辰之月鶉火星昏在南方則令民放火建戌之月大火星伏在日下不得見則令民內火禁放火陶唐氏之火正閼伯居商丘閼伯髙辛氏之子傳曰遷閼伯于商丘主辰辰大火也今為宋星然則商丘在宋地祀大火而火紀時焉謂出內火時相土因之故商主大火相土契孫商之祖也始代閼伯之後居商丘祀大火商人閲其禍敗之釁必始于火是以日知其有天道也閲猶數也商人數所更歷恆多火災宋是殷商之後故知天道之災必火公曰可必乎對曰在道國亂無象不可知也公羊傳曷為或言災或言火大者曰災小者曰火大者謂正寢社稷宗廟朝廷也下此則小矣然則內何以不言火據西宫災不言火內不言火者甚之也春秋以內當自克責故小有火如大有災何以書記災也外災不書此何以書為王者之後記災也穀梁傳外災不志此其志何也故宋也故猶先也孔子之先宋人據左氏具詳宋司城救災之政則來告必矣公榖義不可通當以來告則書為正夏季孫宿如晉左傳夏季武子如晉報宣子之聘也宣子聘在八年五月辛酉夫人姜氏薨左傳穆姜薨于東宫大子宫也穆姜淫僑如欲廢成公故徙居東宮事在成十六年始往而筮之遇艮之八艮下艮上艮遇艮之八蓋乾爻七九坤爻六八其大凡也然乾爻用九不用七坤爻用六不用八用九故老陽變為少隂用六故老隂變為少陽不用七八故少隂少陽不變此艮卦六爻三上以九變初四五以六變二得八故不變是艮之八變卦為隨也史曰是謂艮之隨震下兌上隨隨其出也隨非閉固之卦君必速出姜曰亡亡猶無是于周易曰隨元亨利貞無咎隨彖辭元體之長也亨嘉之㑹也利義之和也貞事之幹也體仁足以長人嘉德足以合禮利物足以和義貞固足以幹事然故不可誣也是以雖隨旡咎今我婦人而與于亂固在下位而有不仁不可謂元不靖國家不可謂亨作而害身不可謂利棄位而姣姣淫之别名不可謂貞有四德者隨而旡咎我皆無之豈隨也哉我則取惡能無咎乎必死于此弗得出矣附録左傳秦景公使士雃乞師于楚士雃秦大夫將以伐晉楚子許之子囊曰不可當今吾不能與晉爭晉君類能而使之隨所能舉不失選官不易方方猶宜也其卿讓于善其大夫不失守其士競于教其庶人力于農穡商工皂隸不知遷業韓厥老矣知罃稟焉以為政代將中軍范丐少于中行偃而上之使佐中軍使丐佐中軍偃將上軍韓起少于欒黶而欒黶士魴上之使佐上軍欒黶讓起起佐上軍黶將下軍魴佐之魏絳多功以趙武為賢而為之佐武新軍將君明臣忠上讓下競當是時也晉不可敵事之而後可君其圗之王曰吾既許之矣雖不及晉必將出師秋楚子師于武城以為秦援秦人侵晉晉饑弗能報也為十年晉伐秦傳秋八月癸未葬我小君穆姜公羊作繆姜四月而葬速也據左氏穆姜幽於東宫終成公之世至於襄公不得出而遂薨焉蓋季氏專魯本怨宣公之謀去三桓又惡穆姜之欲逐季孟託於大義以逞其私忿魯君雖有悔心而不能自主也其速葬而略於禮亦職此之故耳婦人從夫之諡禮也魯以文姜謀弒欲配以桓公之諡而有所不安故别為諡穆姜棄位而姣從文姜之例可也聲姜齊姜亦别為諡則義無所處矣冬公㑹晉侯宋公衛侯曹伯莒子邾子滕子薛伯把伯小邾子齊世子光伐鄭十有二月己亥同盟于戲戲杜注鄭地左傳冬十月諸侯伐鄭鄭從楚也庚午季武子齊崔杼宋皇鄖從荀罃士丐門于鄟門鄟門鄭城門三國從中軍衛北宫括曹人邾人從荀偃韓起門于師之梁師之梁亦鄭城門三國從上軍滕人薛人從欒黶士魴門于北門二國從下軍把人郳人從趙武魏絳斬行栗二國從新軍行道也行栗表道樹甲戌師于泛汜杜注鄭地東汜令于諸侯曰修器備盛餱糧歸老幼居疾于虎牢使諸軍疾病息其中示將久師肆眚圍鄭不書圍鄭鄭逆服不成圍鄭人恐乃行成中行獻子曰獻子荀偃遂圍之以待楚人之救也而與之戰不然無成知武子曰許之盟而還師以敝楚人吾三分四軍分四軍為三部與諸侯之鋭以逆來者來者楚也于我未病楚不能矣晉各一動而楚三來故曰不能猶愈于戰暴骨以逞不可以爭大勞未艾君子勞心小人勞力先王之制也艾息也言當從勞心之勞諸侯皆不欲戰乃許鄭成十一月己亥同盟于戲鄭服也將盟鄭六卿公子騑子駟公子發子國公子嘉子孔公孫輒子耳公孫蠆子蟜公孫舍之子展及其大夫門子門子卿之適子皆從鄭伯晉士莊子為載書莊子士弱曰自今日既盟之後鄭國而不唯晉命是聼而或有異志者有如此盟如違盟之罰公子騑趨進曰天禍鄭國使介居二大國之間大國不加德音而亂以要之使其鬼神不獲歆其禋祀其民人不獲享其土利夫婦辛苦墊隘墊隘猶委頓無所底告自今日既盟之後鄭國而不唯有禮與强可以庇民者是從而敢有異志者亦如之荀偃曰改載書子駟亦以所言載于䇿故欲改之公孫舍之曰昭大神要言焉若可改也大國亦可叛也知武子謂獻子曰我實不德而要人以盟豈禮也哉非禮何以主盟姑􅉀而退修德息師而來終必獲鄭何必今日我之不德民將棄我豈唯鄭若能休和逺人將至何恃于鄭乃盟而還遂兩用載書晉人不得志于鄭以諸侯復伐之十二月癸亥門其三門三門鄟門師之梁北門癸亥月五日閏月戊寅濟于隂阪侵鄭以長厯參挍上下此年不得有閏月戊寅戊寅是十二月二十日疑閏月當為門五日晉人三分四軍更攻鄭門門各五日晉各一攻鄭三受敵欲以苦之癸亥去戊寅十六日以癸亥始攻攻輒五日凡十五日鄭故不服而去隂阪杜注洧津次于隂口而還隂口杜注鄭地子孔曰晉師可擊也師老而勞且有歸志必大克之子展曰不可傳言子展能守信穀梁傳不異言鄭善得鄭也不致耻不能據鄭也伐鄭而書同盟鄭受盟也下書楚子伐鄭則鄭復事晉可知矣齊桓之霸在能服楚晉文之霸在能勝楚至悼公之世楚勢益張而諸侯畏之欲如齊桓陘庭之師則楚必不帖往者處父之師無損於楚之毫末其前轍也欲如文公城濮之戰則勝未可期厲公勝於鄢陵而楚張鄭叛諸侯力屈訖無成功其明徵也故不得己而敝楚三分四軍與諸侯之鋭以數伐鄭而不與楚戰使楚勞於奔命又通吳以制其後皆審時度勢適得其宜其終有成功豈幸也哉附録左傳公送晉侯晉侯以公宴于河上問公年季武子對曰㑹于沙隨之歲寡君以生沙隨在成十六年晉侯曰十二年矣是謂一終一星終也歲星十二歲一周天國君十五而生子冠而生子禮也君可以冠矣大夫盍為冠具武子對曰君冠必以祼享之禮行之以金石之樂節之以鐘磬為舉動之節以先君之祧處之冠必在廟諸侯以始祖之廟為祧今寡君在行未可具也請及兄弟之國而假備焉晉侯曰諾公還及衛冠于成公之廟成公衛獻公之曽祖假鐘磬焉禮也楚子伐鄭左傳楚子伐鄭與晉成故子駟將及楚平子孔子蟜曰與大國盟口血未乾而背之可乎子駟子展曰吾盟固云唯强是從今楚師至晉不我救則楚强矣盟誓之言豈敢背之且要盟無質質主也神弗臨也所臨唯信信者言之瑞也瑞符也善之主也是故臨之明神不蠲要盟蠲潔也背之可也乃及楚平公子罷戎入盟罷戎楚大夫同盟于中分中分杜注鄭城中里名楚莊夫人卒共王母王未能定鄭而歸傳稱鄭及楚平同盟于中分而經不書不足書也明年諸侯伐鄭則鄭復與楚可知矣附録左傳晉侯歸謀所以息民魏絳請施舍輸積聚以貸輸盡也盡其積聚以借貸于民自公以下苟有積者盡出之國無滯積亦無困人公無禁利亦無貪民祈以幣更不用牲賓以特牲務崇省器用不作車服從給足給事行之期年國乃有節三駕而楚不能與爭三駕三興師謂十年師于牛首十一年師于向其秋觀兵于鄭東門自是鄭遂服日講春秋解義卷三十八
