body:
  text: 欽定四庫全書日講春秋解義卷十六僖公五年春附錄左傳五年春王正月辛亥朔日南至周正月今十一月冬至之日日南極公既視朔遂登觀臺以望而書禮也視朔親告朔也觀臺臺上構屋可以遘觀者也凡分至啓閉必書雲物分春秋分也至冬夏至也啓立春立夏閉立秋立冬雲物氣色災變也𫝊重申周典不言公者日官掌其職為備故也素察妖祥逆為之備晉侯殺其世子申生左傳晉侯使以殺大子申生之故来告釋經必告乃書初晉侯使士蒍為二公子築蒲與屈不慎寘薪焉不謹慎所為多寘薪于中夷吾訴之公使讓之士蒍稽首而對曰臣聞之無喪而慼憂必讎焉讎猶對也無戎而城讎必保焉保而守之寇讎之保又何慎焉守官廢命不敬固讎之保不忠失忠與敬何以事君詩云懐徳惟寧宗子惟城詩大雅懐徳以安則宗子之固若城君其修徳而固宗子何城如之三年將尋師焉焉用慎尋用也退而賦曰狐裘尨茸一國三公吾誰適從士蒍自作詩也尨茸亂貌公與二公子為三言城不堅則為公子所訴為公所讓堅之則為固讎不忠無以事君故不知所從及難公使寺人披伐蒲重耳曰君父之命不校乃徇曰校者吾讎也踰垣而走披斬其袪袪袂也遂出奔翟公羊傳曷為直稱晉侯以殺殺世子母弟直稱君者甚之也穀梁傳目晉侯斥殺惡晉侯也斥指斥申生自殺而斥言晉侯何也春秋之法有䜛而不見則其君之罪也故申生以驪姬之譖自殺宋痤以伊戾之譖自殺皆直稱君殺端本清源以為後戒也僖十六年鄭伯殺其世子華殺得其罪故不書杞伯姬来朝其子公羊傳其言来朝其子何内辭也與其子俱来朝也穀梁傳婦人既嫁不踰竟踰竟非正也諸侯相見曰朝伯姬為志乎朝其子也伯姬為志乎朝其子則是杞伯失夫之道矣諸侯相見曰朝以待人父之道待人之子非正也故曰杞伯姬来朝其子參譏也參譏謂伯姬杞伯魯侯也伯姬歸杞十三年耳其子必㓜而以之来朝者盖是年杞恵公卒疑方有疾伯姬以子為魯之甥故㩦之至魯令攝父行朝禮以豫託於魯也先王之制童子侯不朝况諸侯之子㓜而未誓於天子者乎伯姬失婦道杞伯失夫道魯公失主道皆非也故穀梁子曰參譏也夏公孫兹如牟左傳夏公孫兹如牟娶焉因聘而娶故𫝊實其事凡内朝聘皆曰如牟小國也桓十五年邾人牟人葛人来朝自是邦交之禮無聞焉𫝊言兹因聘而娶經不書常事故也先儒謂罪其託君命以遂其私非也韓侯因覲而娶事列大雅則無悖於禮可知矣果罪之也則當眀著其事今見於經者乃内大夫出聘之常詞而不書其娶何由知其託君命以遂私哉公及齊侯宋公陳侯衛侯鄭伯許男曹伯㑹王世子于首止首止公羊穀梁俱作首戴後同杜注衛地陳留襄邑縣東南有首鄉左傳㑹于首止㑹王大子鄭謀寧周也恵王以恵后故將廢大子鄭而立王子帯故齊桓帥諸侯㑹王大子以定其位公羊傳曷為殊㑹王世子世子貴也世子猶世世子也解貴意也言當世父位穀梁専及以㑹尊之也何尊焉王世子云者唯王之貳也云可以重之存焉尊之也言使天下曉然知其為至尊之儲貳至重所在非人臣比何重焉天子世子世天下也王世子不得與諸侯列序也故特書及以㑹若曰王世子在是而諸侯咸往㑹焉示不可得而抗也葵丘之㑹宰周公序諸侯之上與盟洮之王人同例而不得與王世子之殊㑹同文者以世子之尊非宰臣比也不書㑹齊侯者齊侯不敢為㑹主也附録左傳陳轅宣仲怨鄭申侯之反已于召陵宣仲轅濤塗故勸之城其賜邑齊桓所賜虎牢曰美城之大名也子孫不忘吾助子請乃為之請于諸侯而城之美樓櫓之備畢設遂譖諸鄭伯曰美城其賜邑將以叛也申侯由是得罪為七年鄭殺申侯𫝊秋八月諸侯􅉀于首止左傳秋諸侯􅉀公羊傳諸侯何以不序一事而再見者前目而後凡也穀梁傳無中事而復舉諸侯何也尊王世子而不敢與􅉀也尊則其不敢與盟何也盟者不相信也故謹信也不敢以所不信而加之尊者桓諸侯也不能朝天子是不臣也王世子子也塊然受諸侯之尊已而立乎其位塊然安然也是不子也桓不臣王世子不子則其所善焉何也是則變之正也天子微諸侯不享覲桓控大國扶小國統諸侯不能以朝天子亦不敢致天王尊王世子于首戴乃所以尊天王之命也世子含王命㑹齊桓亦所以尊天王之命也世子受之可乎是亦變之正也天子微諸侯不享覲世子受諸侯之尊已而天王尊矣世子受之可也無中事而復舉諸侯眀王世子不與盟也盟者不相信也不敢以所不信而加之尊者桓公之謹於禮也春秋常法㑹盟同地不再書其地此㑹盟同地而再言首止者書之重詞之複其中必有大美惡焉首止之盟美之大者也王將以愛易世子桓公控大國扶小國㑹于首止同心翊戴尊王世子而不敢與盟顯眀大義潛革姦萌一舉而父子君臣之道皆得焉一匡之烈莫大於此春秋所以特文以著其美也鄭伯逃歸不盟左傳王使周公召鄭伯曰吾撫女以從楚輔之以晉可以少安周公宰孔王恨齊桓定大子之位故召鄭伯使叛齊也晉楚不服于齊故以鎮安鄭鄭伯喜于王命而懼其不朝于齊也故逃歸不􅉀孔叔止之曰國君不可以輕輕則失親失親患必至病而乞盟所䘮多矣君必悔之弗聽逃其師而歸公羊傳其言逃歸不盟者何不可使盟也時鄭伯内欲與楚外依古不盟為解安居㑹上不肯從桓公盟故後言不盟不可使盟則其言逃歸何魯子曰盖不以寡犯衆也穀梁傳以其去諸侯故逃之也鄭伯書逃賤之也國君而匹夫行故惡之或曰召鄭伯以從楚王命也何惡乎鄭伯春秋以大義正天下謀定世子天下之公也召鄭從楚恵王之私也君能制命曰義臣能守命曰信制命非義而守之非所謂信也故春秋深罪鄭伯以示為人臣子遭變事而不知其權者楚人滅弦弦子奔黄弦杜注弦國在弋陽車犬縣東南今河南光州西南有弦城湖廣蘄水縣有車犬縣故城皆魏晉時弋陽郡境此楚滅國之始左傳楚鬭穀於菟滅弦弦子奔黄于是江黄道柏方睦于齊皆弦姻也道杜注道國在汝南安陽縣案安陽漢志作陽安應劭曰陽安縣有道亭今河南磪山縣東北有陽安故城其南即道國也柏杜注國名汝南西平縣有柏亭今縣屬河南汝寧府亭在縣西弦子恃之而不事楚又不設備故亡穀梁傳弦國也其不日微國也弦子書奔不服於楚也不書名有興復之望焉其位盖未絶也弦以恃齊不設備而亡桓不能救此楚人所以無忌馴至於伐黄滅江而為桓公霸業之累與九月戊申朔日有食之冬晉人執虞公左傳晉侯復假道于虞以伐虢宫之竒諫曰虢虞之表也虢亡虞必從之晉不可啓寇不可翫一之為甚其可再乎為二年假晉道滅下陽諺所謂輔車相依脣亡齒寒者其虞虢之謂也輔頬輔車牙車輔為外表車是内骨故云相依公曰晉吾宗也豈害我哉對曰大伯虞仲大王之昭也大伯不從是以不嗣大伯虞仲皆大王之子不從父命讓國適吳仲雍支子别封西吳虞公其後也虢仲虢叔王季之穆也王季大伯虞仲母弟虢仲虢叔王季之子文王之母弟也仲叔皆虢君名為文王卿士勲在王室蔵于盟府盟府司盟之官將虢是滅何愛于虞且虞能親于桓莊乎其愛之也桓莊之族何罪而以為戮不唯偪乎桓叔之族從祖昆弟也莊伯之族從父昆弟也獻公患其偪盡殺之事在莊二十五年親以寵偪猶尚害之况以國乎公曰吾享祀豐絜神必據我據猶安也對曰臣聞之鬼神非人實親惟徳是依故周書曰皇天無親惟徳是輔又曰黍稷非馨眀徳惟馨又曰民不易物惟徳繄物皇天無親惟徳是輔蔡仲之命文也黍稷非馨眀徳惟馨君陳文也民不易物惟徳繄物旅獒文也繄書作其言黍稷牲玉無徳則不見饗有徳則見饗物一而異用也如是則非徳民不和神不享矣神所馮依將在徳矣若晉取虞而眀徳以薦馨香神其吐之乎弗聽許晉使宫之竒以其族行曰虞不臘矣臘嵗終祭衆神之名在此行也晉不更舉矣八月甲午晉侯圍上陽上陽杜注虢國都在𢎞農陕縣東南問于卜偃曰吾其濟乎對曰克之公曰何時對曰童謡云丙之晨龍尾伏辰龍尾尾星也日月之㑹曰辰日在尾故尾星伏不見均服振振取虢之旂戎事上下同服振振盛貌旂軍之旌旗鶉之賁賁天䇿焞焞火中成軍虢公其奔鶉鶉火星也賁賁鳥星之體也天䇿傅説星時近日星㣲焞焞無光耀也言丙子平旦鶉火中軍事有成功也此已上皆童謡言也其九月十月之交乎以星驗推之知九月十月之交謂夏九月十月也交晦朔交㑹丙子旦日在尾月在䇿是夜日月合朔于尾月行疾故至旦而過在䇿鶉火中必是時也冬十二月丙子朔晉滅虢虢公醜奔亰師周十二月夏之十月師還館于虞遂襲虞滅之執虞公及其大夫井伯以媵秦穆姬秦穆姬晉獻公女送女曰媵以屈辱之而修虞祀虞所命祀且歸其職貢于王故書曰晉人執虞公罪虞且言易也公羊傳虞已滅矣其言執之何不與滅也曷為不與滅滅者亡國之善辭也滅者上下之同力者也穀梁傳執不言所于地緼于晉也時虞已包裹屬于晉故雖在虞執而不書其處其曰公何也猶曰其下執之之辭其猶下執之之辭何也晉命行乎虞民矣虞虢之相救非相為賜也今日亡虢而眀日亡虞矣虞虢之滅不見於經故三𫝊各為之説然舊史從赴告𫝊曰雖及滅國滅不告敗勝不告克不書于䇿舊史所不書孔子不得而益也虞虢之滅盖晉人修其祀而不以滅告而所告獨執虞公故舊史所書孔子無以易耳六年春王正月附録左傳六年春晉侯使賈華伐屈夷吾不能守盟而行賈莘晉大夫非不欲校力不能守言不如重耳之賢將奔狄郤芮曰後出同走罪也嫌與重耳同謀而相隨不如之梁梁近秦而幸焉乃之梁以梁為秦所親韋秦既大國且穆姬在焉故欲因以求入夏公㑹齊侯宋公陳侯衛侯曹伯伐鄭圍新城新城杜注鄭新密滎陽密縣今河南密縣東南有故密城左傳夏諸侯伐鄭以其逃首止之盟故也圍新密鄭所以不時城也密邑名鄭人所新築者不時城解經言新城之意公羊傳邑不言圍此其言圍何强也穀梁傳伐國不言圍邑此其言圍何也病鄭也著鄭伯之罪也秋楚人圍許諸侯遂救許左傳秋楚子圍許以救鄭諸侯救許乃還冬蔡穆侯將許僖公以見楚子于武城楚子退舍武城猶有忿志而諸侯各罷兵故蔡將許君歸楚武城杜注楚地在南陽宛縣北許男面縛銜璧大夫衰絰士輿櫬縛手于後惟見其面以璧為贄手縛故銜之櫬棺也將受死故衰絰楚子問諸逢伯逢伯楚大夫對曰昔武王克殷微子啓如是㣲子啓紂庶兄武王親釋其縛受其璧而祓之祓除凶之禮焚其櫬禮而命之使復其所楚子從之穀梁傳善救許也冬公至自伐鄭穀梁傳其不以救許致何也大伐鄭也齊桓之伐鄭討其逃首止之盟也故書伐書圍乃以見鄭之不服罪而諸侯無譏焉楚人圍許以救鄭與晉陽處父伐楚以救江同不書楚人救鄭而書諸侯之救許則楚罪眀矣凡書救皆善之也書遂救善之尤也救許乃繼事魯公㑹師本以伐鄭告廟故歸仍以伐鄭致也七年春齊人伐鄭左傳七年春齊人伐鄭孔叔言于鄭伯曰諺有之曰心則不競何憚于病競强也憚難也既不能强又不能弱所以斃也國危矣請下齊以救國公曰吾知其所由来矣姑少待我欲以申侯説對曰朝不及夕何以待君鄭人逃義甘心即楚新城之役猶未悔禍齊為是復治之則罪在鄭也其稱人將卑師少也夏小邾子来朝公羊作小邾婁子後同小邾杜注邾之别封宋忠曰邾顔别封小子肥于郳為小邾子今山東滕縣嶧縣並有郳城樂史云郳城在承縣文獻通考云郳城今沂州嶧即古承地屬沂州據此二説則在嶧者為近郳乃邾之别封齊桓請於王而進之命為小邾子始得王命而来朝杜預以為郳黎来也鄭殺其大夫申侯左傳夏鄭殺申侯以説于齊且用陳轅濤塗之譖也初申侯申出也有寵于楚文王文王將死與之璧使行曰惟我知女女専利而不厭予取予求不女疵瑕也後之人將求多于女後之人謂嗣君也求多以禮義大望責之女必不免我死女必速行無適小國將不女容焉既葬出奔鄭又有寵于厲公子文聞其死也曰古人有言曰知臣莫若君弗可改也已公羊傳其稱國以殺何稱國以殺者君殺大夫之辭也穀梁傳稱國以殺大夫殺無罪也稱國以殺者罪鄭伯也已則逃盟不知自反而内忌信䜛委罪執政其刑頗矣然則申侯無罪乎左氏載申侯初有寵于楚文王自楚奔鄭則不忘故國導鄭從楚理或有之故鄭伯暴其罪以告齊也不然齊方受申侯而賜以虎牢鄭乃殺之得罪於齊矣何能説於齊乎秋七月公㑹齊侯宋公陳世子款鄭世子華盟于甯母甯母穀梁作寧母杜注魯地髙平方與縣東有泥母亭今山東魚臺縣東穀城鎮即其地左傳秋盟于甯母謀鄭故也管仲言于齊侯曰臣聞之招攜以禮攜離也懐遠以徳徳禮不易無人不懐齊侯修禮于諸侯諸侯官受方物諸侯官司各于齊受其方所當貢之物鄭伯使大子華聽命于㑹言于齊侯曰洩氏孔氏子人氏三族實違君命三族鄭大夫若君去之以為成我以鄭為内臣以鄭事齊如封内臣君亦無所不利焉齊侯將許之管仲曰君以禮與信屬諸侯而以姦終之無乃不可乎子父不奸之謂禮守命共時之謂信守君命共時事違此二者姦莫大焉公曰諸侯有討于鄭未捷今茍有釁從之不亦可乎對曰君若綏之以徳加之以訓辭而帥諸侯以討鄭鄭將覆亡之不暇豈敢不懼若總其罪人以臨之總將領也子華奸父之命即罪人鄭有辭矣以大義為辭何懼且夫合諸侯以崇徳也㑹而列姦何以示後嗣夫諸侯之㑹其徳刑禮義無國不記記姦之位位㑹位也子華為姦人而列在㑹位將為諸侯所記君盟替矣替廢也作而不記非盛徳也君舉必書雖復齊史隠諱亦損盛徳君其勿許鄭必受盟夫子華既為大子而求介于大國以弱其國亦必不免鄭有叔詹堵叔師叔三良為政未可閒也齊侯辭焉子華由是得罪于鄭冬鄭伯使請盟于齊以齊侯不聽子華故穀梁傳衣裳之㑹也按周禮大行人侯服甸服男服采服衛服要服各有職貢及周之衰諸侯惰慢齊桓為衣裳之㑹總率諸侯量其國之大小號令所出之物以貢於天子又能納管仲之言却子華之請首止葵丘而外甯母之盟為盛矣據左氏記姦之位君盟替矣又曰齊侯辭焉似子華未與盟而三𫝊經文皆有鄭世子華豈齊桓但却子華内臣之請而未嘗拒之使不與盟與曹伯班卒班公羊作般公子友如齊甫盟甯母而又使季友修聘所以勤伯國之好也冬葬曹昭公附録左傳閏月恵王崩襄王惡大叔帯之難襄王恵王大子鄭也大叔帯襄王弟恵王之子也有寵于恵后恵后欲立之懼不立不發䘮而告難于齊為八年盟洮𫝊八年春王正月公㑹王人齊侯宋公衛侯許男曹伯陳世子款盟于洮鄭伯乞盟陳世子款下公羊有鄭世子華洮杜注曹地今山東濮州西南有洮城左傳八年春盟于洮謀王室也鄭伯乞盟請服也襄王定位而後發䘮王人㑹洮還而後王定位公羊傳王人者何㣲者也曷為序乎諸侯之上先王命也乞盟者何處其所而請與也其處其所而請與奈何盖酌之也酌挹也時鄭伯欲與楚不肯自来盟處其國遣使挹取其血而請與也穀梁傳王人之先諸侯何也貴王命也朝服雖敝必加于上弁冕雖舊必加于首周室雖衰必先諸侯兵車之㑹也以向之逃歸乞之也向謂五年逃首戴之盟乞者重辭也重是盟也乞者處其所而請與也盖汋之也汋血而與之王人㣲者而序乎諸侯之上重王命也王臣與列國同盟諸侯之抗也而於是盟則無譏焉盖襄王告難于齊本欲藉侯伯之權以鎮撫王室桓公大合諸侯同心翊戴而推王人以莅斯盟俾以㣲者而列天下公侯之上則子帯之黨不覺震懾而輯其邪心矣此桓公之以大義行權而不悖乎經也乞者卑遜以屈之詞鄭伯始而逃歸今則乞盟直書其事以見其不眀於義而自取愧辱也夏狄伐晉左傳晉里克帥師梁由靡御虢射為右以敗狄于采桑𫝊言前年事也采桑杜注平陽北屈縣西南有采桑津在今山西寧鄉縣西大河津濟處梁由靡曰狄無恥從之必大克不恥走故可逐里克曰懼之而已無速衆狄虢射曰期年狄必至示之弱矣夏狄伐晉報采桑之役也復期月明期年之言騐齊桓嘗存邢衛而不能挫狄師晉恃彊且遠不與齊合故狄無所忌而伐之秋七月禘于大廟用致夫人左傳秋禘而致哀姜焉非禮也凡夫人不薨于寢不殯于廟不赴于同不祔于姑則弗致也公羊傳用者何用者不宜用也致者何致者不宜致也禘用致夫人非禮也夫人何以不稱姜氏貶曷為貶譏以妾為妻也其言以妾為妻奈何盖脅于齊媵女之先至者也僖公本聘楚女為嫡齊女為媵齊先致其女脅僖公使用為嫡穀梁傳用者不宜用者也致者不宜致者也言夫人必以其氏姓言夫人而不以氏姓非夫人也立妾之辭也非正也夫人之我可以不夫人之乎夫人卒葬之我可以不卒葬之乎君以為夫人君以夫人之禮卒葬之不得不以夫人書也成風以文四年薨五年葬𫝊終説其事一則以宗廟臨之而後貶焉臣無貶君之義故于大廟去夫人姓氏以眀君之非正一則以外之弗夫人而見正焉秦人来歸僖公成風之襚不言夫人禮不王不禘故程子以為成王之賜伯禽之受皆非也聖人因事而書以見其非禮使於禮無違則當書大事而不書禘矣致夫人之説三𫝊各異劉向祖穀梁而胡氏從之盖成風也致者用夫人之禮見於廟而正位號也以私恩崇其母於大廟則輕宗廟矣故不稱姓氏以深貶之冬十有二月丁未天王崩左傳冬王人来告䘮難故也是以緩附録左傳宋公疾大子兹父固請曰目夷長且仁君其立之兹父襄公也目夷襄公庶兄子魚公命子魚子魚辭曰能以國讓仁孰大焉臣不及也且又不順遂走而退九年春王正月丁丑宋公御説卒正月公羊穀梁作三月御公羊穀梁作禦左傳九年春宋桓公卒未葬而襄公㑹諸侯故曰子凡在喪王曰小童在䘮未葬也小童王自稱之辭公侯曰子公羊傳何以不書葬為襄公諱也不書葬魯不㑹也宋襄方出㑹葵丘葬禮遂簡故諸侯亦不遣人往㑹爾公羊以為為襄公諱豈有魯史而為宋諱之義乎夏公㑹宰周公齊侯宋子衛侯鄭伯許男曹伯于葵丘葵丘杜注陳留外黄縣東有葵丘釋例曰宋地也在今河南考城縣東左傳夏㑹于葵丘尋盟且修好禮也王使宰孔賜齊侯胙胙祭肉周禮大宗伯以脤膰之禮親兄弟之國則異姓不合賜也二十四年𫝊曰宋先代之後也于周為客天子有事膰焉是二王之後禮得賜之今賜齊侯尊之比二王後也曰天子有事于文武有祭事也使孔賜伯舅胙天子謂異姓諸侯曰伯舅齊侯將下拜孔曰且有後命天子使孔曰以伯舅耋老加勞賜一級無下拜七十曰耋級等也對曰天威不違顔咫尺言天鑒察不遠威嚴常在顔面之前八寸曰咫小白余敢貪天子之命無下拜小白齊侯名余身也恐隕越于下隕越顛墜也以遺天子羞敢不下拜下拜登受自堂下受胙于堂上公羊傳宰周公者何天子之為政者也穀梁傳天子之宰通于四海冢宰掌建邦之六典以佐王治邦國故曰通于四海宋其稱子何也未葬之辭也禮柩在堂上孤無外事今背殯而出㑹以宋子為無哀矣宰周公冢宰而兼三公也以冢宰而兼三公其職任重矣乃與諸侯列序而不得與王世子之殊㑹同天澤之義也凡諸侯在䘮而出㑹以䘮服行者稱子以吉服行者稱爵宋子與㑹君子以為無哀而在齊桓亦為過舉矣秋七月乙酉伯姬卒公羊傳此未適人何以卒許嫁矣婦人許嫁字而笄之昏禮曰女子許嫁笄而禮之稱字死則以成人之䘮治之不以殤禮降也穀梁傳内女也未適人不卒此何以卒也許嫁笄而字之死則以成人之䘮治之謂許嫁于諸侯尊同則服大功九月伯姬未嫁何以書卒在禮女子許嫁以成人之䘮治之許嫁於諸侯故不以殤禮降也其為諸侯之媵與嫁於世子大夫者則不書蕩伯姬子叔姬之類是也惟紀叔姬之卒以執節故特書九月戊辰諸侯盟于葵丘左傳秋齊人盟諸侯于葵丘曰凡我同盟之人既盟之後言歸于好宰孔先歸遇晉侯曰可無㑹也齊侯不務徳而勤遠略故北伐山戎南伐楚西為此㑹也東略之不知西則否矣言或向東必不能復西略其在亂乎君務靖亂無勤于行在察也㣲戒獻公言晉將有亂晉侯乃還公羊傳桓之盟不日此何以日危之也何危爾貫澤之㑹桓公有憂中國之心不召而至者江人黄人也葵丘之㑹桓公震而矜之叛者九國震之者何猶曰振振然亢陽之貌矜之者何猶曰莫若我也穀梁傳桓盟不日此何以日美之也為見天子之禁故備之也令諸侯以天子之禁故備日美之葵丘之盟陳牲而不殺讀書加于牲上壹明天子之禁壹猶専也曰毋雍泉雍塞也専水利以障谷毋訖糴訖止也謂眝粟毋易樹子樹子嫡子毋以妾為妻毋使婦人與國事女正位于内齊桓尊王之實事於三㑹見之初㑹首止以尊王嗣而正大本繼㑹于洮以謀王室而遏亂萌今㑹葵丘以眀王禁而垂大法故孟子稱葵丘五命以為桓公盛事而春秋再書其地以美之也嗣王初立羣小尚懐異心而大合諸侯申嚴王禁首以誅不孝毋易樹子命焉是以王子帯之黨終桓公之世不敢為非也甲子晉侯詭諸卒甲子公羊作甲戌詭諸左氏作佹諸冬晉里克殺其君之子奚齊殺公羊作弑左傳九月晉獻公卒里克㔻鄭欲納文公故以三公子之徒作亂㔻鄭晉大夫三公子申生重耳夷吾初獻公使荀息傅奚齊公疾召之曰以是藐諸孤言其㓜穉與諸子懸藐辱在大夫其若之何稽首而對曰臣竭其股肱之力加之以忠貞其濟君之靈也不濟則以死繼之公曰何謂忠貞對曰公家之利知無不為忠也送往事居耦俱無猜貞也往死者居生者耦兩也送死事生兩無疑憾所謂正也及里克將殺奚齊先告荀息曰三怨將作三公子之徒秦晉輔之子將何如荀息曰將死之里克曰無益也荀叔曰荀叔荀息也吾與先君言矣不可以貳能欲復言而愛身乎雖無益也將焉辟之且人之欲善誰不如我我欲無貳而能謂人已乎言不能止里克使不忠于申生等冬十月里克殺奚齊于次次喪寢書曰殺其君之子未葬也荀息將死之人曰不如立卓子而輔之荀息立公子卓以葬十一月里克殺公子卓于朝荀息死之君子曰詩所謂白圭之玷尚可磨也斯言之玷不可為也詩大雅言言之缺失難治甚于白圭荀息有焉公羊傳此未踰年之君其言弑其君之子奚齊何弑未踰年君之號也穀梁傳其君之子云者國人不子也國人不子何也不正其殺世子申生而立之也晉獻公殺其世子申生而立奚齊自謂身為君父廢立惟其所欲臣民莫敢不從也今獻公甫卒奚齊立而里克殺之春秋不曰弑君而曰殺其君之子者眀國人不子也其君自子之而國人不以為子盖天理根於人心不可滅息也公羊氏以未踰年為義按齊舍亦未踰年而不書君之子則其説不可通矣附録左傳齊侯以諸侯之師伐晉及髙梁而還討晉亂也髙梁杜注晉地在平陽縣西南今山西臨汾縣東髙梁都地名梁墟是也令不及魯故不書晉郤芮使夷吾重賂秦以求入郤芮郤克祖父從夷吾者曰人實有國我何愛焉入而能民土于何有從之齊隰朋帥師㑹秦師納晉恵公隰朋齊大夫恵公夷吾秦伯謂郤芮曰公子誰恃對曰臣聞亡人無黨有黨必有讎言夷吾無黨援則無讎釁易出易入以㣲勸秦也夷吾弱不好弄弄戲也能鬭不過長亦不改不識其他公謂公孫枝曰夷吾其定乎公孫枝秦大夫子桑也對曰臣聞之唯則定國詩曰不識不知順帝之則文王之謂也詩大雅帝天也則法也又曰不僭不賊鮮不為則僭過差也賊傷害也皆忌克也能不僭賊則可為人法則無好無惡不忌不克之謂也今其言多忌克難哉言能自定難公曰忌則多怨又焉能克是吾利也其言雖多忌適足以自害不能勝人也秦伯慮其還害已故曰是吾利宋襄公即位以公子目夷為仁使為左師以聽政于是宋治故魚氏世為左師子魚之後以王父字為氏故曰魚氏日講春秋解義卷十六
