body:
  text: 欽定四庫全書日講春秋解義卷二十二僖公二十有九年春介葛盧來介杜注東夷國在城陽黔陬縣後為宻州膠西縣地今山東膠州西南有黔陬城葛盧介君名附庸無爵左傳二十九年春介葛盧來朝舍于昌衍之上昌衍杜注魯縣東南有昌平城在今山東曲阜縣東南公在會饋之芻米禮也公羊傳介葛盧者何夷狄之君也何以不言朝不能乎朝也不能行朝見之禮榖梁傳介國也葛盧㣲國之君未爵者也其曰來卑也介僻䖏東隅其來於魯與郳黎來同不能行朝禮故書來畧之也公至自圍許温之㑹公朝于王所不以王所致而曰至自圍許所以著温之㑹意在謀許而不在尊王也夏六月㑹王人晋人宋人齊人陳人蔡人秦人盟于翟泉㑹上公羊榖梁有公字翟公羊作狄翟泉杜注洛陽城内大倉西南池水也今古城在河南洛陽縣東北左傳夏公㑹王子虎晋狐偃宋公孫固齊國歸父陳轅濤塗秦小子憖盟于翟泉尋踐土之盟且謀伐鄭也卿不書罪之也王子虎下盟列國諸侯大夫上敵公侯虧禮傷教故貶諸大夫諱公與盟在禮卿不㑹公侯㑹伯子男可也大國之卿當小國之君故可以㑹伯子男𫝊言諸卿所以見貶是㑹為王子虎晋狐偃宋公孫固齊國歸父陳轅濤塗秦小子憖而公在焉乃貶而稱人諱不書公何也翟泉近在王城之内而王子虎於此下與列國盟是謂上替諸侯大夫入天子之境上盟王子是謂下陵而無君之心著矣故以為大惡諱公不書諸國之卿貶稱人而王子亦與焉此正其本之義也按晋文三大盟㑹此其一也既非踐土王子涖盟之比又無于温自嫌之心凟分亂常莫此為甚春秋所以惡之秋大雨雹左傳秋大雨雹為災也劉向曰盛陽雨水温煖而濕熱隂氣脅之不相入則轉而為雹雹者隂脅陽也胡氏以為魯之政在大夫故有是兆冬介葛盧來左傳冬介葛盧來以未見公故復來朝禮之加燕好燕燕禮好好貨一嵗再來故加之介葛盧聞牛鳴曰是生三犧皆用之矣其音云問之而信葛盧復來而明年有侵蕭之事則其再至非無故而修禮也三十年春王正月夏狄侵齊左傳三十年春晋人侵鄭以觀其可攻與否狄閒晋之有鄭虞也夏狄侵齊齊霸國之後與晋同盟狄之侵齊盖料晋方圖鄭而不暇救也齊桓召陵之後狄加兵於晋晋文城濮之後狄加兵於齊而桓文皆置而不問以楚人僭王力争中夏其志不測恐力分於狄而不能禦楚耳秋衛殺其大夫元咺左傳晋侯使醫衍酖衛侯衍醫名晋侯怨衛侯欲殺而罪不及死故使醫因治疾而加酖毒甯俞貨醫使薄其酖不死公為之請納玉于王與晋侯皆十瑴䨇玉曰瑴魯夲與衛同好故為之請王許之秋乃釋衛侯衛侯使賂周歂冶厪曰茍能納我吾使爾為卿恐元咺拒已故賂周冶周冶殺元咺及子適子儀子儀瑕母弟不書殺賤也公入祀先君周冶既服将命服卿服将入廟受命周歂先入及門遇疾而死冶厪辭卿見周歂死而懼公羊傳衛侯未至其稱國以殺何道殺也時已得天子命還國于道路遇而殺之故坐之與至國同榖梁傳稱國以殺罪累上也以是為訟君也衛侯在外其以累上之辭言之何也待其殺而後入也元咺以臣訟君君入則已奔君執則已歸不臣之罪固不容誅乃稱國以殺而不去其官何也咺雖有罪而衛侯賂其臣使殺其同列而求入焉則討之不以其罪矣衛侯在外而稱國殺待殺而後入也及公子瑕榖梁傳公子瑕累也以尊及卑也瑕之見殺以元咺欲立之也然使瑕安於其位則當與衛剽之書爵同經書公子是瑕能拒咺辭其位而不居也衛侯告殺必以討簒為言魯衛方睦舊史承告而書未必不蔽罪於瑕經以公子冠瑕而書及則釁由元咺而瑕夲無罪可知矣此孔子之特筆也衛侯鄭歸于衛公羊傳此殺其大夫其言歸何歸惡乎元咺也曷為歸惡乎元咺元咺之事君也君出則已入晋人執衛侯歸京師元咺自晋歸衛君入則已出衛侯自楚歸衛元咺出奔晋以為不臣也衛侯出奔於楚見執於晋皆不名今既歸國何以名之始歸而殺叔武再歸而及公子瑕春秋所深惡也諸侯之執不書歸其書歸者危不得歸也諸侯之歸必稱復不稱復者其義當絶也或曰難則書復易則苐書歸義亦可通晋人秦人圍鄭左傳九月甲午晋侯秦伯圍鄭以其無禮于晋且貳于楚也晋軍函陵秦軍氾南杜注此東氾也在滎陽中牟縣南今屬河南開封府佚之狐言于鄭伯曰國危矣若使燭之武見秦君師必退佚之狐燭之武皆鄭大夫公從之辭曰臣之壮也猶不如人今老矣無能為也已公曰吾不能早用子今急而求子是寡人之過也然鄭亡子亦有不利焉許之夜縋而出縋縣城而下見秦伯曰秦晋圍鄭鄭既知亡矣若亡鄭而有益于君敢以煩執事越國以鄙逺君知其難也設得鄭以為秦邉邑則越晋而難保焉用亡鄭以倍鄰倍益也鄰之厚君之薄也若舎鄭以為東道主行李之往來共其乏困鄭在東故曰東道主行李使人君亦無所害且君嘗為晋君賜矣許君焦瑕朝濟而夕設版焉君之所知也晋君謂惠公焦瑕杜注晋河外五城之二邑在今陜州南朝濟河而夕設版築以距秦言背秦之速夫晋何厭之有既東封鄭又欲肆其西封封疆也肆廣也若不闕秦将焉取之闕秦以利晋唯君圖之秦伯說與鄭人盟使把子逢孫揚孫戍之乃還三子秦大夫反為鄭守子犯請擊之公曰不可㣲夫人之力不及此夫人謂秦穆公因人之力而敝之不仁失其所與不知以亂易整不武秦晋和整而還相攻更為亂也吾其還也亦去之初鄭公子蘭出奔晋蘭鄭穆公從于晋侯伐鄭請無與圍鄭許之使待命于東晋東界鄭石甲父侯宣多逆以為大子以求成于晋晋人許之二子鄭大夫言穆公所以立獻俘踐土鄭伯傅王温之㑹同朝王所而翟泉之盟不與故晋以貳于楚討之先儒皆據左𫝊謂晋侯秦伯親将貶而稱人而以經考之自陽處父伐江以前外大夫無以名見者凡稱人皆大夫将之辭耳介人侵蕭蕭宋附庸也介再來魯而次年遂侵蕭豈懼為宋所忌而預附於魯以求援與冬天王使宰周公來聘左傳冬王使周公閱來聘閱周公名饗有昌歜白黑形鹽昌歜昌蒲葅白熬稻黑熬黍形鹽鹽形象虎辭曰國君文足昭也武可畏也則有備物之饗以象其徳薦五味羞嘉榖鹽虎形嘉榖熬稻黍也以象文鹽虎形以象武以獻其功吾何以堪之榖梁傳天子之宰通于四海公子遂如京師此聘周之始遂如晋此聘晋之始左傳東門襄仲将聘于周襄仲即公子遂遂初聘于晋公羊傳大夫無遂事此其言遂何公不得為政爾不從公政令也榖梁傳以尊遂乎卑此言不敢叛京師也謂若即言如京師知晋則同周于晋叛而不尊天子故云遂使若公子遂因聘周而自往晋也天王使宰周公下聘必因晋侯帥諸侯再朝重禮以報之而因及齊魯諸大國也魯君不能躬拜王命而使公子遂報聘又比周於晋不待貶絶而惡見矣凡書遂有以二事出者公子遂如京師遂如晋祭公來遂逆王后于紀是也有以一事出而専繼事者公子結媵陳人之婦遂及齊侯宋公盟是也其是非得失則存乎其事矣三十有一年春取濟西田左傳三十一年春取濟西田分曹地也二十八年晋文討曹分其地竟界未定至是乃以賜諸侯使臧文仲往宿于重館重魯地杜注髙平方與縣西北有重鄉城館候館也重館人告曰晋新得諸侯必親其共不速行將無及也從之分曹地自洮以南東傅于濟盡曹地也言獲地之多杜注濟水自滎陽東過魯之西至樂安入海公羊傳惡乎取之取之曹也曷為不言取之曹諱取同姓之田也此未有伐曹者則其言取之曹何言魯未嘗伐曹何以言取曹田晋侯執曹伯班其所取侵地于諸侯也班者徧還之辭晋侯執曹伯班其所取侵地于諸侯則何諱乎取同姓之田久也濟西故魯田見侵于曹歴時既久不得復為魯地故以取邑之例諱之濟西之田不繫曹者明其為魯田也復故田而謂之取何也借晋人之力而彊取之則與取非其有者同凡取人之有其惡易見取已之有而不以道其罪難知聖人正名曰取所以顯㣲也公子遂如晋左傳襄仲如晋拜曹田也往年宰周公來而公子遂報聘則以二事出今復以濟西之田使遂如晋慢於尊周而謹於事晋直書而罪自見矣夏四月四卜郊不從乃免牲猶三望左傳夏四月四卜郊不從乃免牲非禮也猶三望亦非禮也禮不卜常祀必其時而卜其牲日卜牲與日知吉凶牛卜日曰牲既得吉日則牛改名曰牲牲成而卜郊上怠慢也怠于古典慢凟龜策望郊之細也不郊亦無望可也公羊傳曷為或言三卜或言四卜三卜禮也四卜非禮也三卜何以禮四卜何以非禮求吉之道三三卜吉凶必有相奇者可以决疑故求吉必三卜禘嘗不卜郊何以卜卜郊非禮也卜郊何以非禮魯郊非禮也魯郊何以非禮天子祭天諸侯祭土土謂社也天子有方望之事方望謂郊時所望祭四方羣神日月星辰風伯雨師五嶽四瀆及餘山川凡三十六所無所不通盡八極之内天地之所覆載無所不至故得郊也諸侯山川有不在其封内者則不祭也曷言或言免牲或言免牛免牲禮也免牛非禮也免猶縱也卜郊不吉則不敢郊故免牲也免牛何以非禮傷者曰牛養牲不謹致災傷天不饗用不得復為天牲故以夲牛名之三望者何望祭也然則曷祭祭大山河海曷為祭大山河海山川有能潤于百里者天子秩而祭之此皆助天宣氣布功故祭天及之秩者隨其大小尊卑髙下所宜觸石而出膚寸而合側手為膚按指為寸言其觸石理而出無有膚寸而不合不崇朝而徧雨乎天下者惟大山爾河海潤于千里亦能通氣致雨潤澤及乎千里猶者何通可以已也已止也何以書譏不郊而望祭也榖梁傳夏四月不時也郊春事也四卜非禮也四卜則入夏免牲者為之緇衣熏裳有司𤣥端奉送至于南郊免牛亦然𤣥端黒衣接神之道𤣥熏者天地之色也南郊天位歸之于陽也全曰牲傷曰牛牛有變而不郊故卜免牛乃者亡乎人之辭也亡乎人若曰無賢人也猶者可以己之辭也天子以長至之日郊祀上帝孟春辛日祈榖亦謂之郊魯僭祈榖之郊已為嵗事之常矣春秋欲削而不存則無以志其失悉書之則有不勝書故因禮之變而特書以見義也凡郊三卜不從則不郊三不吉而至於四失禮又甚矣不郊而或言免牲或言免牛何也未牲曰牛既卜曰牲免牛猶可再卜牛至卜免牲吉則不可郊明矣故不復言不郊望望而祭之郊之細也周官四望盖望四方魯望止於三公羊謂大山河海鄭𤣥謂海岱淮賈逵服䖍謂分野之星及國中山川杜預因之而胡氏安國獨取公羊之説於理為近要非諸侯所得為也不郊而望故特書曰猶猶者可已而不巳之詞秋七月附録左傳秋晋蒐于清原作五軍以禦狄二十八年晋作三行今罷之更為上下新軍清原杜注河東聞喜縣北有清原在今山西稷山縣西北趙衰為卿二十七年命趙衰為卿讓于樂枝今始從原大夫為新軍帥冬把伯姬來求婦公羊傳其言來求婦何兄弟辭也其稱婦何有姑之辭也榖梁傳婦人既嫁不踰竟把伯姬來求婦非正也昏姻常事不書此何以書求婦非正也婦言不踰閫閾越竟而為子謀昏失婦義矣故謹之狄圍衛十有二月衛遷于帝丘帝丘杜注東郡濮陽縣帝顓頊之虛故曰帝丘今直𨽻䦕州有顓頊城左傳冬狄圍衛衛遷于帝丘卜曰三百年衛成公夢康叔曰相奪予享相夏后啓之孫居帝丘享祭也公命祀相甯武子不可曰鬼神非其族類不歆其祀歆猶享也把鄫何事言把鄫夏後自當祀相相之不享于此久矣非衛之罪也不可以閒成王周公之命祀諸侯受命各有常祀請改祀命改祀相之命狄嘗入衛齊桓率諸侯為城楚丘以定之今為狄所圍又自遷于帝丘夫立國在於自彊楚人謀徙于阪髙蒍賈曰我能往寇亦能往春秋書此以見衛之不能自彊而晋文衰暮無以大庇諸姬亦可見矣附録左傳鄭洩駕惡公子瑕鄭伯亦惡之故公子瑕出奔楚瑕文公子洩駕鄭大夫𫝊為納瑕張夲三十有二年春王正月附録左傳三十二年春楚鬭章請平于晋晋陽䖏父報之晋楚始通陽䖏父晋大夫晋楚自春秋以来始交使命為和同夏四月已丑鄭伯捷卒捷公羊作接衛人侵狄左傳夏狄有亂衛人侵狄狄請平焉秋衛人及狄盟左傳秋衛人及狄盟及者衛為志不地者盟於狄也衛畏狄彊遷都避之今不能聲罪致討乃乘亂而掠其境則不武又就其地汲汲而與之盟則非禮春秋書之以罪衛也冬十有二月已卯晋侯重耳卒左傳冬晋文公卒庚辰将殯于曲沃殯窆棺也曲沃有舊宫焉出絳柩有聲如牛如牛呴聲卜偃使大夫拜曰君命大事将有西師過軼我擊之必大捷焉聲自柩出故曰君命大事戎事也卜偃聞秦密謀故因柩聲以正衆心杞子自鄭使告于秦曰三十年秦使大夫把子戍鄭鄭人使我掌其北門之管管籥也若潛師以來國可得也穆公訪諸蹇叔蹇叔秦大夫蹇叔曰勞師以襲逺非所聞也師勞力竭逺主備之無乃不可乎師知所為鄭必知之勤而無所必有悖心士卒勞而無所得必生悖戾之心害及良善且行千里其誰不知公辭焉召孟明西乞白乙使出師于東門之外孟明百里孟明視西乞西乞術白乙白乙丙蹇叔哭之曰孟子吾見師之出而不見其入也公使謂之曰爾何知中壽爾墓之木拱矣合手曰拱言其過老悖不可用蹇叔之子與師哭而送之曰晋人禦師必于殽殽杜注在𢎞農澠池縣西殽有二陵焉大阜曰陵其南陵夏后皋之墓也皋夏桀之祖父其北陵文王之所辟風雨也此道在二殽之閒南谷中谷深委曲兩山相嶔故可以辟風雨必死是間以其深險故余收爾骨焉秦師遂東為明年晋敗秦于殽𫝊晋文公之入也左氏言之甚詳而經不書何也諸侯有朝聘之禮赴告之命若告命不通記注文闕聖人因魯史以作經有可損而不能益也三十有三年春王二月秦人入滑左傳三十三年春秦師過周北門左右免胄而下北門王城之北門冑兜鍪兵車非大将御者在中故左右下御不下超乘者三百乘王孫滿尚㓜觀之言于王曰秦師輕而無禮必敗無禮謂過天子門不卷甲束兵超乘示勇輕則寡謀無禮則脫脫易也入險而脫又不能謀能無敗乎及滑鄭商人弦髙将市于周遇之以乘韋先牛十二犒師乘韋四韋也皮熟曰韋生曰革古者将獻遺于人必有以先之曰寡君聞吾子将步師出于敝邑敢犒從者不腆敝邑為從者之淹居則具一日之積行則備一夕之衛弦髙知秦将襲鄭欲敗其謀故詐言君命歩猶行也積謂芻米菜薪衛捍禦之具且使遽告于鄭遽𫝊車鄭穆公使視客館秦把子逢孫楊孫戍鄭鄭人館之至是聞弦髙之言使視其所為則束載厲兵秣馬矣果見三子欲為内應使皇武子辭焉皇武子鄭大夫曰吾子淹久于敝邑唯是脯資餼牽竭矣資糧也生曰餼牽謂牛羊豕為吾子之将行也鄭之有原圃猶秦之有具囿也吾子取其麋鹿以閒敝邑若何原圃具囿皆囿名杜注滎陽中牟縣西有圃田澤使秦戍自取麋鹿以為行資盖明示三子已知其情杞子奔齊逢孫揚孫奔宋孟明曰鄭有備矣不可冀也攻之不克圍之不繼吾其還也滅滑而還榖梁傳滑國也滅滑而書入者不能有其地非末減也詐謀不遂又肆悖心以滅無罪之小國而不虞晋之擬其後非道失謀其困也宜矣齊侯使國歸父來聘左傳齊國荘子來聘自郊勞至于贈賄禮成而加之以敏聘禮賔至于郊君使卿朝服用束帛勞及聘事皆畢乃去賔遂行舎于郊公使卿贈如覿幣是來有郊勞去有贈賄也敏審當于事也臧文仲言于公曰國子為政齊猶有禮君其朝焉臣聞之服于有禮社稷之衛也為公如齊𫝊二十八年公子遂如齊平舊怨也今國歸父來報遂之聘也古者諸侯邦交其禮甚簡入春秋時比周相結使命日煩至國歸父來聘而大夫之交政列國者紛紛無制矣夏四月辛巳晋人及姜戎敗秦于殽敗秦下左𫝊榖梁有師字姜戎姜姓之戎居晋南鄙戎子駒支之先也殽杜注在𢎞農澠池縣西在今河南永寕縣北左傳晋原軫曰秦違蹇叔而以貪勤民天奉我也秦師還過晋竟先軫謀邀而伐之奉與也奉不可失敵不可縱縱敵患生違天不祥必伐秦師欒枝曰未報秦施而伐其師其為死君乎言以君死故忘秦施先軫曰秦不哀吾喪而伐吾同姓滑與晋同生秦則無禮何施之為吾聞之一日縱敵數世之患也謀及子孫可謂死君乎遂發命遽興姜戎以𫝊車起姜戎之兵欲其速也子墨衰絰晋文公未葬故襄公稱子以凶服從戎故墨之梁𢎞御戎萊駒為右夏四月辛巳敗秦師于殽獲百里孟明視西乞術白乙丙以歸遂墨以葬文公晋于是始墨後遂常以為俗記禮所由變文嬴請三帥文嬴晋文公始適秦秦穆公所妻夫人襄公嫡母三帥孟明等曰彼實搆吾二君寡君若得而食之不厭君何辱討焉使歸就戮于秦以逞寡君之志若何公許之先軫朝問秦囚公曰夫人請之吾舎之矣先軫怒曰武夫力而拘諸原婦人暫而免諸國暫猶卒也堕軍實而長寇讎堕毁也亡無日矣不顧而唾公使陽䖏父追之及諸河則在舟中矣釋左驂以公命贈孟明矯稱襄公命贈欲使還拜謝因而執之孟明稽首曰孟明知其詐乃遥于舟中稽首拜命君之恵不以纍臣釁鼓纍囚繫也殺人以血塗鼔謂之釁鼓使歸就戮于秦寡君之以為戮死且不朽若従君恵而免之三年將拜君賜意欲報伐晋秦伯素服郊次待之于郊鄉師而哭曰孤違蹇叔以辱二三子孤之罪也降名稱孤不替孟明孤之過也大夫何罪且吾不以一眚掩大徳眚過也公羊傳其謂之秦何稱國夷狄之也曷為夷狄之秦伯将襲鄭百里子與蹇叔子諫曰千里而襲人未有不亡者也秦伯怒曰若爾之年者宰上之木拱矣宰冢也爾曷知師出百里子與蹇叔子送其子而戒之曰爾即死必于殽之嶔巖是文王之所辟風雨者也其地險隘一可要百故文王過之驅馳常若辟風雨襲鄭所當由也吾将尸爾焉子揖師而行揖其父于師中介胄不拜為其拜如蹲百里子與蹇叔子従其子而哭之秦伯怒曰爾曷為哭吾師對曰臣非敢哭君師哭臣之子也弦髙者鄭商也遇之殽矯以鄭伯之命而犒師焉或曰往矣或曰反矣軍中語也時以為鄭實使弦髙犒之或以為鄭伯已知将見襲必設備不如還或曰師既出當遂往然而晋人與姜戎要之殽而擊之然而上議猶豫㽞往之頃也要邀也匹馬隻輪無反者言盡獲之其言及姜戎何姜戎㣲也稱人亦㣲者也何言乎姜戎之㣲先軫也先軫晋大夫也言姜戎㣲則知稱人者尊或曰襄公親之親将襄公親之則其稱人何貶曷為貶君在乎殯而用師危不得葬也詐戰不日詐卒也齊人語也此何以日盡也盡俘之惡其不仁榖梁傳不言戰而言敗何也狄秦也其狄之何也秦越千里之險入虛國滑無備故言虛國進不能守退敗其師徒亂人子女之教無男女之别秦之為狄自殽之戰始也進不能守謂入滑而去退敗其師謂敗于殽亂人子女謂入滑之時縱暴亂也秦伯将襲鄭百里子與蹇叔子諫曰千里而襲人未有不亡者也秦伯曰子之冢木已拱矣何知言其老無知師行百里子與蹇叔子送其子而戒之曰女死必于殽之巖唫之下我将尸女于是尸女者収女尸師行百里子與蹇叔子随其子而哭之秦伯怒曰何為哭吾師也二子曰非敢哭師也哭吾子也我老矣彼不死則我死矣畏秦伯怒故云彼我必有死者晋人與姜戎要而擊之殽匹馬倚輪無反者倚輪一隻之輪晋人者晋子也其曰人何也㣲之也何為㣲之不正其釋殯而主乎戰也秦自十三年圍鄭已識地形又見齊晋更霸宋楚争衡乘晋文新殁逾周而襲鄭使其謀得逞将據鄭以力征東夏蠶食諸姬其無王之心未必不同於荆楚晋襄要而擊之隻輪不反終春秋之世秦卒不能逾晋而東故敗殽之勲䓁於城濮先儒乃以墨衰即戎為晋子罪誤矣國君之孝異於匹夫社稷之役可以變禮故魯公禽父在喪而從金革孔子與之誓在尚書論具禮記且春秋之法外以諱為善故特書晋人若晋子未嘗在師者然如以為貶則凡會盟侵伐以喪出而稱爵稱子者乃得為襃乎陸氏淳謂孔子許其以權變禮故為之諱卓矣癸巳葬晋文公榖梁傳日葬危不得葬也晋先君有文侯而重耳復諡為文非禮也狄侵齊左傳狄侵齊因晋喪也狄閒晋喪而侵齊殽師方罷營葬先君齊晋懸隔千里即有赴告晋師非踰月不能出絳何及於狄先儒既以墨衰禦秦責晋而又以不能攘狄罪之義無所䖏矣公伐邾取訾婁訾婁公羊作叢榖梁作訾樓訾婁邾地當在今山東濟寕州界秋公子遂帥師伐邾左傳公伐邾取訾婁以報升陘之役在二十二年邾人不設備秋襄仲復伐邾僖公懷升陘之忿以晋文始霸不敢興報怨之師晋文既殁秦狄交訌故乘其閒而再伐邾以取利焉齊桓之殁楚宋争霸魯亦閒之而再伐邾毎乘霸國多事而陵弱暴寡何以為秉禮之國乎晋人敗狄于箕箕杜注大原陽邑縣南有箕城在今山西大谷縣東南左傳狄伐晋及箕八月戊子晋侯敗狄于箕郤缺獲白狄子白狄秋别種也子白狄之君子爵也先軫曰匹夫逞志于君而無討謂不顧而唾敢不自討乎免胄入狄師死焉狄人歸其元元首面如生初臼季使過冀見冀缺耨其妻饁之臼季胥臣也冀杜注晋邑今山西河津縣東有冀亭冀缺即郤缺耨鋤也野饋曰饁敬相待如賔與之歸言諸文公曰敬徳之聚也能敬必有徳徳以治民君請用之臣聞之出門如賔承事如祭仁之則也公曰其父有罪可乎缺父冀芮欲弑文公在二十四年對曰舜之罪也殛鯀其舉也興禹管敬仲桓之賊也實相以濟康誥曰父不慈子不祗兄不友弟不共不相及也康誥周書祗敬也詩曰采葑采菲無以下體君取節焉可也詩國風葑菲之莱上善下惡食之者不以其惡而棄其善言可取其善節文公以為下軍大夫反自箕襄公以三命命先且居将中軍且居先軫之子其父死敵故進之以再命命先茅之縣賞胥臣曰舉郤缺子之功也先茅絶後故取其縣以賞胥臣以一命命郤缺為卿復與之冀還其父故邑亦未有軍行雖登卿位未有軍列秦謀襲鄭狄攻齊衛乘文公之新殁而争衡於中夏也晋子敗秦于殽又敗狄于箕而霸統遂定諸侯賔服其功甚偉且皆應敵之師而先儒多以為病亦未揆於事理之實耳冬十月公如齊十有二月公至自齊報國莊子之聘也天王下聘不朝於京師齊國歸父來乃躬報謝不加貶而義自見矣乙巳公薨于小寢左傳冬公如齊朝且弔有狄師也反薨于小寢即安也小寢夫人寢也譏公就所安不終于路寢榖梁傳小寢非正也周制王宫六寢路寢一小寢五戴記君日出而眡朝退適路寢聼政使人眡大夫大夫退然後適小寢釋服是路寢治事之所小寢燕息之地也魯子以諸侯有三宫則列國之制盖降於王其以路寢為正則一爾隕霜不殺草李梅實隕公羊作霣公羊傳何以書記異也何異爾不時也榖梁傳未可殺而殺舉重也可殺而不殺舉輕也定元年隕霜殺菽此年隕霜不殺草重謂菽也輕謂草也輕者不死則重者不死可知實之為言猶實也實子也周之十二月夏之十月也霜既隕而草不殺固已異矣梅李再榮非時而成實隂陽失序物反其常先儒以為魯政不綱三桓盛彊干權擅國咎徴之先見者也晋人陳人鄭人伐許左傳晋陳鄭伐許討其貳于楚也陳鄭久服於楚晋人討許不用齊魯宋衛之師而獨與陳鄭同役以繼文之業席敗秦敗狄之威楚人不敢北鄉職是故也而先儒皆以為譏亦過矣附錄左傳楚令尹子上侵陳蔡子上即關勃陳蔡成遂伐鄭將納公子瑕三十一年瑕奔楚門于桔柣之門瑕覆于周氏之汪車傾覆池水中外僕髠屯禽之以獻鄭之外僕髠髮而名屯者殺瑕以獻鄭伯文夫人斂而葬之鄶城之下鄭文公夫人也鄶城杜注故鄶國在滎陽密縣東北今屬河南開封府晋陽處父侵蔡楚子上救之與晋師夾泜而軍泜水杜注出魯陽縣東經裏城定陵入汝陽子患之使謂子上曰吾聞之文不犯順武不違敵有文徳者不犯順意謂相約渉水而伐其師是犯順也有武徳者不棄敵意謂相約退舍而自棄去是違敵也子若欲戰則吾退舍子濟而陳欲辟楚使渡成陳而後戰遲速唯命不然紓我紓緩也老師費財亦無益也乃駕以待子上欲渉大孫伯曰大孫伯即成大心不可晋人無信半渉而薄我悔敗何及不如紓之乃退舍楚退欲使晋渡陽子宣言曰楚師遁矣遂歸楚師亦歸大子商臣譖子上曰受晋賂而辟之楚之恥也罪莫大焉王殺子上商臣怨子上止王立已譖之葬僖公緩十一月僖公薨文公元年四月葬僖公并閏七月乃葬故𫝊云緩作主非禮也文二年乃作主遂因葬文通議之凡君薨卒哭而祔祔而作主特祀于主烝嘗禘于廟既葬反虞則免喪故曰卒哭哭止也以新死者之神祔之于祖尸柩已逺孝子思慕故造木主立几筵特用喪禮祭祀于寢不同之于宗廟言凡君者謂諸侯以上不通于卿大夫冬祭曰烝秋祭曰嘗新主既立特祀于寢則宗廟四時常祀自如舊也三年禮畢又大禘乃皆同于吉日講春秋解義巻二十二
