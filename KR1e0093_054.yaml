body:
  text: 欽定四庫全書日講春秋解義卷五十四昭公二十有二年春齊侯伐莒左傳二十二年春王二月甲子齊北郭啓帥師伐莒啓齊大夫北郭佐之後莒子將戰苑羊牧之諫曰牧之莒大夫齊帥賤其求不多不如下之大國不可怒也弗聽敗齊師于壽餘壽餘杜注莒地當在今安丘縣境齊侯伐莒怒敗莒子行成司馬竈如莒涖盟竈齊大夫莒子如齊涖盟盟于稷門之外稷門齊城門莒于是乎大惡其君為明年莒子來奔傳十九年齊高發伐莒莒猶不服故齊侯復伐之明年莒子來奔齊迫之也宋華亥向寧華定自宋南里出奔楚左傳楚薳越使告于宋曰前年薳越帥師迎華氏寡君聞君有不令之臣為君憂無寧以為宗羞寡君請受而戮之對曰孤不佞不能媚于父兄華向公族也故稱父兄以為君憂拜命之辱抑君臣日戰君曰余必臣是助亦唯命人有言曰唯亂門之無過君若惠保敝邑無亢不衷以奬亂人孤之望也唯君圖之楚人患之患宋以義距之諸侯之戍謀曰若華氏知困而致死楚恥無功而疾戰非吾利也不如出之以為楚功其亦無能為也已言華氏不能復為宋患救宋而除其害又何求乃固請出之宋人從之己巳宋華亥向寧華定華貙華登皇奄傷省臧士平出奔楚華貙已下五子不書非卿宋公使公孫忌為大司馬代華費遂邉卬為大司徒卬平公曾孫代華定樂祁為司城祁子罕孫樂祁犁仲幾為左師幾仲江孫代向寧樂大心為右師代華亥樂挽為大司寇挽子罕孫以靖國人終梓慎之言三年而後弭穀梁傳自宋南里者專也專制南里齊慶封衛公孟彄再奔皆不書必嘗入叛也而後書譏佚賊也華向叛宋奔陳又自陳入宋披據國都踰年復出奔楚往來三年出入自如此天下之極變也其曰自宋南里者譏宋之釋有罪曰出奔楚者罪楚之奬亂納叛而諸侯之大夫怠於救患略而不書罪亦見矣大搜于昌閒閒公羊作姦穀梁傳秋而曰搜此春也其曰搜何也以搜事也何以書譏何譏爾公不與非禮也三綱軍政之本古者寓戎事於田狩以辨上下定民志非僅嫻馳射擊刺之末也今魯政在大夫公無軍行軍政之本亡矣何以搜為曰大志僭也言昌閒非搜所也夏四月乙丑天王崩左傳王子朝賓起有寵于景王子朝景王之長庶子賓起子朝之傅王與賓孟說之欲立之孟即起也王語賓孟欲立子朝為大子劉獻公之庶子伯蚠事單穆公獻公劉摯伯蚠劉狄穆公單旗惡賓孟之為人也願殺之又惡王子朝之言以為亂願去之子朝有欲位之言故劉蚠惡之賔孟適郊見雄雞自斷其尾問之侍者曰自憚其犧也畏其為犧牲奉宗廟故自殘毁遽歸告王且曰雞其憚為人用乎人異于是雞犧雖見寵飾然卒當見殺若人見寵飾則當貴盛故言異于是犧者實用人人犧實難已犧何害犧者寵牲之名因以喻寵子言設使寵人如寵犧則不宜假疏逺者以寵致反為己患惟所寵實己親屬則于己無害矣人喻子猛已喻子朝也王弗應十五年大子壽卒王立子猛後復欲立子朝而未定賓孟感雞盛稱子朝王心許之故不應夏四月王田北山使公卿皆從將殺單子劉子北山杜注洛北芒也一作邙山在今河南洛陽縣東北王知單劉不欲立子朝欲因田獵先殺之王有心疾乙丑崩于榮錡氏乙丑四月十九日榮錡杜注河南鞏縣西有榮錡澗今屬河南河南府戊辰劉子摯卒二十二日無子單子立劉蚠蚠獻公之庶子事單子故五月庚辰見王見王猛遂攻賓起殺之黨子朝故盟羣王子于單氏附録左𫝊晉之取鼓也在十五年既獻而反鼓子焉獻于廟又叛于鮮虞六月荀吳略東陽略行也東陽杜注晉之山東邑魏郡廣平以北使師僞糴者負甲以息于昔陽之門外昔陽故肥子所都遂襲鼓滅之以鼓子鳶鞮歸使涉他守之守鼓之地涉他晉大夫六月叔鞅如京師葬景王王室亂如京師止此左𫝊丁巳葬景王王子朝因舊官百工之喪職秩者與靈景之族以作亂靈景之族靈王景王之子孫帥郊要踐之甲以逐劉子郊要餞杜注三邑周地劉子伯蚠也壬戌劉子奔揚揚杜注周邑單子逆悼王于莊宫以歸悼王子猛也王子還夜取王以如莊宫王子還子朝黨不欲使單子得王猛故取之癸亥單子出失王故王子還與召莊公謀曰莊公召伯奐子朝黨不殺單旗不捷旗單子也與之重盟必來背盟而克者多矣從之樊頃子曰頃子樊齊單劉黨非言也必不克遂奉王以追單子王子還奉王及領大盟而復領杜注周地重盟而還殺摯荒以說委罪于荒劉子如劉歸其采邑單子亡乙丑奔于平畤知王子還欲背盟故平畤杜注周地羣王子追之單子殺還姑發弱鬷延定稠八子靈景之族因戰殺之子朝奔京其黨死故丙寅伐之單子伐京京人奔山劉子入于王城子朝奔京故得入辛未鞏簡公敗績于京乙亥甘平公亦敗焉甘鞏二公周卿士皆為子朝所敗叔鞅至自京師葬景王還言王室之亂也閔馬父曰子朝必不克其所與者天所廢也閔馬父閔子馬魯大夫天所廢謂羣喪職秩者公羊傳何言乎王室亂言不及外也宫謂之室刺周內亂故變京師而言王室穀梁傳亂之為言事未有所成也尹氏立子朝劉氏單氏立王猛俱未定也三月而葬亂故也不曰京師亂者言京師則通乎上下言王室則其父兄子弟自亂之亂自內作也惠襄之世不書王室亂者頽帶之亂周有君天下有王未足以言亂也景王崩王猛未能定其位子朝爭國是時周有兩天子其亂與頽帶異矣故特書之劉子單子以王猛居于皇皇杜注河南鞏縣西南有黃亭在今河南府左傳單子欲告急于晉秋七月戊寅以王如平畤遂如圃車次于皇出次以示急戊寅七月三日經書六月誤也圃車周地公羊𫝊其稱王猛何當國也穀梁傳以者不以者也王猛嫌也直言王猛不言王子是有當國之嫌言劉單以王猛者猛位未定不能自立其進退在二子也臣不可以乎君然在單劉則無貶前言王室亂後言二子以王猛居于皇則二子有不得已焉者而非為其私也于皇未得有京師也居者有土當得位之稱不書出王者無外也秋劉子單子以王猛入于王城王城杜注郟鄏河南縣括地志城本周公所築自平王以下都此至敬王乃遷都成周至赧王又居王城也在今河南洛陽縣城內西偏左傳劉子如劉單子使王子處守于王城處子猛黨盟百工于平宫平宫平王廟辛卯鄩肸伐皇鄩肸子朝黨大敗獲鄩肸壬辰焚諸王城之市焚鄩肸八月辛酉司徒醜以王師敗績于前城醜悼王司徒前城杜注子朝所得邑服䖍曰即泉戎地百工叛司徒醜敗故己巳伐單氏之宮敗焉為單氏所敗庚午反伐之單氏反伐百工辛未伐東圉百工所在東圉杜注洛陽東南有圉鄉冬十月丁巳晉籍談荀躒帥九州之戎及焦瑕溫原之師以納王于王城丁巳在十月經書秋誤九州戎陸渾戎十七年滅屬晉州鄉屬也五州為鄉焦瑕溫原杜注晉四邑庚申單子劉蚠以王師敗績于郊為子朝之黨所敗前城人敗陸渾于社前城子朝衆社杜注周地按黃河西自偃師界入鞏縣有五社渡公羊𫝊王城者何西周也其言入何篡辭也穀梁傳以者不以者也入者內弗受也猛何以稱王蓋未踰年不可以稱天王又不可以諸侯例稱子獨言子則似魯之子冠王於子又與他王子相亂故稱王繫猛乃嗣王未逾年之常稱無可疑也君前臣名劉單不名而王名者非王無以定一尊非名無以辨其人且在禮臨文不諱况史册所書以傳信於後世又非敷奏文告之比也冬十月王子猛卒左傳十一月乙酉王子猛卒乙酉在十一月經書十月誤雖未即位周人諡曰悼王不成喪也釋所以不稱王崩己丑敬王即位敬王王子猛母弟王子丐館于子旅氏子旅周大夫十二月庚戌晉籍談荀躒賈辛司馬督司馬烏帥師軍于陰籍談所軍于侯氏荀躒所軍于溪泉賈辛所軍杜注鞏縣西南有明溪泉次于社司馬督所次王師軍于汜于解次于任人王師分在三邑解杜注洛陽西南有大解小解大解城在今洛陽縣南小解城在縣西南閏月晉箕遺樂徴右行詭濟師取前城三子晉大夫濟師渡伊洛軍其東南王師軍于京楚京楚子朝所在辛丑伐京毁其西南公羊傳此未踰年之君也其稱王子猛卒何不與當也不當成其為君不與當者不與當父死子繼兄死弟及之辭也穀梁傳此不卒者也未成君也其曰卒失嫌也猛本有當國之嫌其卒則失嫌故録之生則書王明實為嗣死乃稱子正其為天王未踰年之子尊未成也降成君故不言崩又不可言薨故通稱卒十有二月癸酉朔日有食之此月有庚戌又以長歷推校前後當為癸卯朔書癸酉誤二十有三年春王正月附録左傳二十三年春王正月壬寅朔二師圍郊二師王師晉師也圍郊在叔鞅卒前經書在後從赴癸卯郊鄩潰鄩杜注河南鞏縣西南有地名鄩中郊鄩二邑皆子朝所得丁未晉師在平陰平陰杜注河陰縣今故城在河南府孟津東王師在澤邑澤邑賈逵曰澤即翟泉也王使告閒子朝敗故庚戌還晉師還叔孫舍如晉癸丑叔鞅卒晉人執我行人叔孫舍左傳邾人城翼翼杜注邾邑還將自離姑離姑杜注邾邑在今費縣南從離姑則道徑魯之武城公孫鉏曰鉏邾大夫魯將御我欲自武城還循山而南至武城而還依山南行不欲過武城徐鉏丘弱茅地曰三子邾大夫道下謂此山道下濕遇雨將不出是不歸也遂自離姑過武城武城人塞其前斷其後之木而弗殊殊絶也邾師過之乃推而蹶之蹶仆也遂取邾師獲鉏弱地取邾師不書非公命邾人訴于晉晉人來討叔孫舍如晉晉人執之書曰晉人執我行人叔孫婼言使人也晉人使與邾大夫坐坐訟曲直叔孫曰列國之卿當小國之君固周制也在禮卿得會伯子男故曰當小國之君邾又夷也寡君之命介子服回在子服回魯大夫為叔孫之介副請使當之不敢廢周制故也乃不果坐韓宣子使邾人聚其衆將以叔孫與之與邾使執之叔孫聞之去衆與兵而朝示欲以身死士彌牟謂韓宣子曰彌牟士景伯子弗良圖而以叔孫與其讎叔孫必死之魯亡叔孫必亡邾邾君亡國將焉歸子雖悔之何及所謂盟主討違命也若皆相執焉用盟主聽邾衆取叔孫是為諸侯皆得輒相執乃弗與使各居一館分别叔孫子服回士伯聽其辭而訴諸宣子乃皆執之二子辭不屈故士伯御叔孫從者四人過邾館以如吏欲使邾人見叔孫之屈辱先歸邾子士伯曰以芻蕘之難從者之病將館子于都都别都謂箕也叔孫旦而立期焉立待命也從旦至暮為期乃館諸箕舍子服昭伯于他邑别囚之范獻子求貨于叔孫使請冠焉以求冠為辭取其冠法而與之兩冠曰盡矣既送作冠模法又進二冠以與之僞若不解其意為叔孫故申豐以貨如晉欲行貨以免叔孫叔孫曰見我吾告女所行貨見而不出留申豐不使得出不欲以貨免吏人之與叔孫居于箕者請其吠狗弗與及將歸殺而與之食之示不愛叔孫所館者雖一日必葺其牆屋去之如始至不以當去而有所毁壞取邾師疆吏為之耳季孫當國夙與邾讎故疆吏承其意而啓釁焉乃蔽罪於行人晉政之無章甚矣蓋三家惟叔孫氏尚不忘君故中軍作舍皆不與季氏同心意如將逐其君故惡君於晉并及叔孫而晉之彊臣為之謀主遂明知叔孫無罪而橫加執辱耳晉人圍郊郊杜注周邑公羊傳郊者何天子之邑也曷為不繫于周不與伐天子也郊子朝邑晉遣大夫助王圍郊而經以人書微之也當是時天子䝉塵晉為方伯不躬率諸侯以赴其急而徐遣大夫帥偏師往援是養亂也書晉人圍郊而不能勤王之罪見矣附録左𫝊夏四月乙酉單子取訾劉子取牆人直人三邑屬子朝者訾杜注在河南鞏縣西南牆人今河南新安縣東北有白牆村疑即其處六月壬午王子朝入于尹尹杜注尹氏之邑今山西汾州有尹吉甫墓即古尹城也癸未尹圉誘劉他殺之尹圉尹文公也劉他劉蚠族敬王黨丙戌單子從阪道劉子從尹道伐尹單子先至而敗劉子還單子敗故己丑召伯奐南宫極以成周人戍尹二子周卿士子朝黨奐召莊公庚寅單子劉子樊齊以王如劉辟子朝出居劉子邑甲午王子朝入于王城次于左巷近東城秋七月戊申鄩羅納諸莊宫鄩羅周大夫鄩肸之子尹辛敗劉師于唐尹辛尹氏族唐杜注周地後漢志洛陽有唐聚在今洛陽縣東丙辰又敗諸鄩甲子尹辛取西闈西闈杜注周地丙寅攻蒯蒯潰蒯敬王邑杜注河南縣西南蒯鄉是也在今洛陽縣西南于是敬王居狄泉尹氏立子朝夏六月蔡侯東國卒于楚因朝於楚而卒也王父見殺父見用已乃結楚嬖臣以逐其君而又朝之三綱絶矣不書葬魯不會也秋七月莒子庚輿來奔左傳莒子庚輿虐而好劍苟鑄劍必試諸人國人患之又將叛齊烏存帥國人以逐之烏存莒大夫庚輿將出聞烏存執殳而立于道左懼將止死苑羊牧之曰牧之亦莒大夫君過之烏存以力聞可矣何必以弒君成名遂來奔齊人納郊公郊公著丘公之子十四年奔齊庚輿入國不書而書其出以奔魯故志之於是齊人納郊公郊公出入皆不書微之也微之為義㦯以國㦯以位㦯以人㦯以事春秋達王事若郊公之類名氏不登於史䇿者衆矣戊辰吳敗頓胡沈蔡陳許之師于雞父胡子髠沈子逞滅獲陳夏齧父穀梁作甫逞公羊作楹穀梁作盈雞父杜注楚地安豐縣南有雞備亭今安豐故城在江南壽州西南雞備亭又在其城西南左傳吳人伐州來楚薳越帥師及諸侯之師奔命救州來令尹以疾從戎故薳越攝其事吳人禦諸鍾離子瑕卒楚師熸子瑕即令尹不起所疾也吳楚之閒謂火滅為熸言其軍人無復氣勢吳公子光曰諸侯從于楚者衆而皆小國也畏楚而不獲已是以來吾聞之曰作事威克其愛雖小必濟克勝也軍事尚威胡沈之君幼而狂狂無常陳大夫齧壯而頑頓與許蔡疾楚政楚令尹死其師熸帥賤多寵政令不一帥賤薳越非正卿也軍多寵人政令不一于越七國同役而不同心七國楚頓胡沈蔡陳許帥賤而不能整無大威命楚可敗也若分師先以犯胡沈與陳必先奔三國敗諸侯之師乃搖心矣諸侯乖亂楚必大奔請先者去備薄威示之以不整以誘之後者敦陳整旅敦厚也吳子從之戊辰晦戰于雞父七月二十九日違兵忌晦戰擊楚所不意吳子以罪人三千先犯胡沈與陳囚徒不習戰以示不整三國爭之吳為三軍以繫于後中軍從王光帥右掩餘帥左掩餘吳王壽夢子吳之罪人或奔或止三國亂吳師擊之三國敗獲胡沈之君及陳大夫舍胡沈之囚使奔許與蔡頓曰吾君死矣師譟而從之三國奔三國許蔡頓楚師大奔書曰胡子髠沈子逞滅獲陳夏齧君臣之辭也君社稷之主與宗廟共存亡者故稱滅大夫輕故曰獲獲得也不言戰楚未陳也公羊傳此偏戰也曷為以詐戰之辭言之不與夷狄之主中國也序上言戰别主客之直不直也今吳序上而言戰則主中國辭也然則曷為不使中國主之中國亦新夷狄也王室亂諸侯莫肯救則與吳無以異其言滅獲何别君臣也君死于位曰滅生得曰獲大夫生死皆曰獲不與夷狄之主中國則其言獲陳夏齧何吳少進也能結日偏戰行少進故從中國辭治之榖梁傳中國不言敗此其言敗何也中國不敗胡子髠沈子盈其滅乎其言敗釋其滅也若師不敗則君無由滅也獲陳夏齧獲者非與之辭也上下之稱也君曰滅臣曰獲君臣之稱楚以諸侯之師與吳戰六國先敗楚師遂奔故不書楚諸侯之師略而不序者頓胡沈則君將陳蔡許則大夫將言戰則未陳言敗績則滅獲不同故總言吳以詐取勝於前而以君與大夫序六國於後或曰滅或曰獲别君臣也國君社稷之主與宗廟共存亡是以稱滅大夫輕故言獲獲生得也天王居于狄泉尹氏立王子朝狄泉杜注洛陽城內大倉西南池水也時在城外定元年城成周乃繞之入城亦曰翟泉在洛陽縣東故洛陽城中今堙公羊𫝊此未三年其稱天王何著有天子也穀梁傳始王也其曰天王因其居而王之也天子踰年即位稱王敬王踰年而出故曰始王雖不在國行即位之禮王者以天下為家故居于狄泉稱王立者不宜立者也朝之不名何也别嫌乎尹氏之朝也若但言尹氏立朝則嫌朝是尹氏之子故言王子以别之敬王王猛之母弟得繼正統時景王崩已踰年故稱天王以眀其正狄泉在王城東直稱天王居于狄泉而不言立者著天下有王矣立者不宜立也天下既有王則尹氏不宜立子朝也稱立而目尹氏蓋曰獨尹氏所欲立異於石碏立晉而書衛人以著其為衆人所欲立也朝已僭號猶稱王子言莫之君也傳稱尹圉而經書尹氏著世卿之擅權亂國為後戒也八月乙未地震左𫝊八月丁酉南宫極震經書乙未地震魯地也丁酉南宫極震周地亦震也為屋所壓而死萇𢎞謂劉文公曰君其勉之先君之力可濟也文公劉蚠先君謂蚠之父獻公也獻公欲立子猛未及而卒周之亡也其三川震謂幽王時三川涇渭洛水也地動川岸崩今西王之大臣亦震天棄之矣子朝在王城故謂西王東王必大克敬王居狄泉在王城之東故曰東王附録左傳楚大子建之母在郹郹杜注郹陽也蔡邑應在今新蔡境平王娶秦女廢大子建故母歸其家召吳人而啓之冬十月甲申吳大子諸樊入郹杜注諸樊吳王僚之大子按吳子遏號諸樊王僚是遏之弟子先儒又以為遏弟何容僚子乃取遏號為名恐傳寫之誤取楚夫人與其寶器以歸夫人大子建母楚司馬薳越追之不及將死衆曰請遂伐吳以徼之薳越曰再敗君師死且有罪此年秋敗于雞父設往復敗為再敗亡君夫人不可以莫之死也乃縊于薳澨薳澨杜注楚地在今湖廣京山縣境冬公如晉至河有疾乃復至河下公羊穀梁又有公字左傳公為叔孫故如晉及河有疾而復此年春晉為邾人執叔孫故公如晉請之公羊傳何言乎公有疾乃復殺恥也因有疾以殺畏晉之恥穀梁傳疾不志此其志何也釋不得入乎晉也昭公兩朝晉而一見止五如晉而四不得入今復如晉為叔孫請也公知季孫構已於晉往必不納故託疾以返蓋至是而意如與公有不能竝立之勢矣眀年公孫不之晉而之齊蓋稔知晉之彊家與意如之交甚固耳附録左傳楚囊瓦為令尹囊瓦子囊之孫子常也代陽丐城郢楚用子囊遺言已築郢城矣今畏吳復增修以自固沈尹戌曰子常必亡郢苟不能衛城無益也古者天子守在四夷德及逺天子卑守在諸侯諸侯守在四鄰鄰國為之守諸侯卑守在四竟裁自完慎其四竟結其四援民狎其野狎安習也三務成功春夏秋三時之務民無內憂而又無外懼國焉用城今吳是懼而城于郢守已小矣卑之不獲能無亡乎不獲守四竟昔梁伯溝其公宫而民潰在僖十八年民棄其上不亡何待夫正其疆埸修其土田險其走集走集邉竟之壘壁親其民人明其伍候使民有部伍相為候望信其鄰國慎其官守守其交禮交接之禮不僭不貪不懦不耆耆强也完其守備以待不虞又何畏矣詩曰無念爾祖聿修厥德詩大雅無念念也義取念祖考則述治其德以顯之無亦監乎若敖蚡冒至于武文四君皆楚先君之賢者土不過同方百里為一同慎其四竟猶不城郢今土數圻方千里為圻而郢是城不亦難乎為定四年吳入楚𫝊二十有四年春附録左𫝊二十四年春王正月辛丑召簡公南宮嚚以甘桓公見王子朝簡公召莊公之子召伯盈也嚚南宮極之子桓公甘平公之子劉子謂萇𢎞曰甘氏又往矣對曰何害同德度義大誓曰紂有億兆夷人亦有離德余有亂臣十人同心同德此周所以興也君其務德無患無人戊午王子朝入于塢鄥杜注緱氏西南有塢聚王二月丙戌仲孫貜卒叔孫舍至自晉左氏穀梁無叔孫字左𫝊晉士彌牟逆叔孫于箕將禮而歸之叔孫使梁其脛待于門內脛叔孫家臣曰余左顧而咳乃殺之疑士伯來殺已故謀殺之右顧而笑乃止叔孫見士伯士伯曰寡君以為盟主之故是以久子久執子以謝邾不腆敝邑之禮將致諸從者使彌牟逆吾子叔孫受禮而歸二月婼至自晉尊晉也貶婼族所以尊晉婼行人故不言罪已榖梁𫝊大夫執則致致則挈由上致之也上謂宗廟也致臣于廟則直挈其名而已所謂君前臣名婼之至二傳皆去氏公羊獨書氏所𫝊授異耳疏公羊者以為意如有罪故去其氏叔孫無罪故無貶文胡氏安國主其說義似可從蓋婼之見執實非其罪而以禮自衛終不辱國固不可與意如同也附録左傳三月庚戌晉侯使士景伯涖問周故就問子朝敬王知誰曲直士伯立于乾祭而問于介衆乾祭王城北門介大也晉人乃辭王子朝不納其使以衆言子朝曲故夏五月乙未朔日有食之左傳夏五月乙未朔日有食之梓慎曰將水陰勝陽故曰將水昭子曰旱也日過分而陽猶不克克必甚能無旱乎過春分陽氣盛時而不勝陰陽將猥出故為旱陽不克莫將積聚也陽氣莫然不動乃將積聚附録左𫝊六月壬申王子朝之師攻瑕及杏皆潰瑕杏敬王邑鄭伯如晋子大叔相見范獻子獻子曰若王室何對曰老夫其國家不能恤敢及王室抑人亦有言曰嫠不恤其緯嫠寡婦也織者常苦緯少嫠婦所宜憂而憂宗周之隕為將及焉恐禍及己今王室實蠢蠢焉蠢蠢動擾貌吾小國懼矣然大國之憂也吾儕何知焉吾子其早圖之詩曰瓶之罄矣惟罍之恥詩小雅罍大器瓶小器常稟于罍者而所受罄盡則罍為無餘故恥之王室之不寧晉之恥也獻子懼而與宣子圖之宣子韓起乃徴㑹于諸侯期以眀年為眀年會黃父傳秋八月大雩左傳秋八月大雩旱也終如叔孫之言丁酉杞伯郁釐卒郁公羊作鬱附録左傳冬十月癸酉王子朝用成周之寶圭于河禱河求福甲戌津人得諸河上圭自出水陰不佞以溫人南侵不佞敬王大夫晉以溫兵助王南侵子朝拘得玉者取其玉將賣之則為石王定而獻之與之東訾喜得玉故東訾杜注鞏縣西南訾城是也今鞏縣西南有訾店以有西訾故言東以别之冬吳滅巢左傳楚子為舟師以略吳疆沈尹戌曰此行也楚必亡邑不撫民而勞之吳不動而速之速召也吳踵楚而疆埸無備踵躡楚後邑能無亡乎越大夫胥犴勞王于豫章之汭汭水曲越公子倉歸王乘舟倉及壽夢帥師從王壽夢越大夫王及圉陽而還圉陽杜注楚地吳人踵楚而邊人不備遂滅巢及鍾離而還鍾離不書告敗略沈尹戌曰亡郢之始于此在矣王一動而亡二姓之帥二姓之帥守巢鍾離大夫幾如是而不及郢詩曰誰生厲階至今為梗詩大雅厲惡階道梗病也其王之謂乎為定四年吳入郢𫝊巢楚屬國而近吳吳將謀楚故先翦其與國與國盡則及於楚此入郢之漸也杜氏預以巢為楚邑非也勝國曰滅獲邑曰取國大而邑輕不可同辭葬杞平公二十有五年春叔孫舍如宋左傳二十五年春叔孫婼聘于宋桐門右師見之右師樂大心居桐門語卑宋大夫而賤司城氏司城氏樂氏之大宗也卑賤謂其才德薄昭子告其人曰右師其亡乎君子貴其身而後能及人是以有禮唯禮可以貴身貴身故尚禮今夫子卑其大夫而賤其宗是賤其身也賤人人亦賤已能有禮乎無禮必亡宋公享昭子賦新宫逸詩昭子賦車轄詩小雅周人思得賢女以配君子昭子將為季孫逆宋公女故賦之明日宴飲酒樂宋公使昭子右坐坐宋公右以相近言改禮坐語相泣也樂祁佐助宴禮退而告人曰今兹君與叔孫其皆死乎吾聞之哀樂而樂哀可樂而哀可哀而樂皆喪心也心之精爽是謂魂魄魂魄去之何以能久為此冬叔孫宋公卒傳季公若之姊為小邾夫人平子庶姑與公若同母故曰公若秭生宋元夫人平子外姊生子以妻季平子昭子如宋聘且逆之公若從從昭子謂曹氏勿與曹氏宋元夫人魯將逐之曹氏告公公告樂祁樂祁曰與之如是魯君必出政在季氏三世矣丈子武子平子魯君喪政四公矣宣成襄昭無民而能逞其志者未之有也國君是以鎮撫其民詩曰人之云亡心之憂矣詩大雅言無人則憂患至魯君失民矣焉得逞其志靖以待命猶可動必憂為下公孫𫝊此季孫意如將娶于宋而舍為之納聘且逆婦也國君逆女則使卿今意如以己私婚遣公室之正卿則名雖為臣而實行魯君之事其専恣不臣甚矣尚何待昭公孫齊而後擅魯哉夏叔詣會晉趙鞅宋樂大心衛北宮喜鄭游吉曹人邾人滕人薛人小邾人于黃父詣公羊穀梁作倪後同大心公羊作世心後同黃父即黑壤晉地左𫝊夏會于黃父謀王室也趙簡子令諸侯之大夫輸王粟具戍人簡子既鞅曰明年將納王納王于王城子大叔見趙簡子簡子問揖讓周旋之禮焉對曰是儀也非禮也簡子曰敢問何謂禮對曰吉也聞諸先大夫子産曰夫禮天之經也經者道之常地之義也義者利之宜民之行也行者人所履天地之經而民實則之則天之明日月星辰天之明因地之性髙下剛柔地之性生其六氣謂隂陽風雨晦明用其五行金木水火土氣為五味酸醎辛甘苦發為五色青黃赤白黑章為五聲宫商角徴羽淫則昏亂民失其性滋味聲色過則傷性是故為禮以奉之為六畜五牲三犧以奉五味六畜馬牛羊雞犬豕五牲䴢鹿麏狼三犧祭天地宗廟三者謂之犧為九文六采五章以奉五色九文謂山龍華蟲宗彝藻火粉米黼黻也六采畫績之事雜用天地四方之色青與白赤與黑𤣥與黃皆相次謂之六色五章青與赤謂之文赤與白謂之章白與黑謂之黼黑與青謂之黻五色備謂之繡為九歌八風七音六律以奉五聲為君臣上下以則地義君臣有尊卑法地有高下為夫婦外內以經二物夫治外婦治內各治其物為父子兄弟姑姊甥舅昏媾姻亞以象天明六親和睦以事嚴父若衆星之拱辰極也妻父曰昏重昏曰媾壻父曰姻兩壻相謂曰亞為政事庸力行務以從四時在君為政在臣為事民功曰庸治功曰力行其德教務其時要禮之本也為刑罰威獄使民畏忌以類其震曜殺戮雷震電曜天之威也聖人作刑戮以象之為溫慈惠和以效天之生殖長育民有好惡喜怒哀樂生于六氣此六者皆稟陰陽風雨晦明之氣是故審則宜類以制六志為禮以制好惡喜怒哀樂六志使不過節哀有哭泣樂有歌舞喜有施舍怒有戰鬭喜生于好怒生于惡是故審行信令禍福賞罰以制死生生好物也死惡物也好物樂也惡物哀也哀樂不失乃能協于天地之性是以長久簡子曰甚哉禮之大也對曰禮上下之紀天地之經緯也經緯錯居以相成者民之所以生也是以先王尚之故人之能自曲直以赴禮者謂之成人曲直以弼其性大不亦宜乎簡子曰鞅也請終身守此言也宋樂大心曰我不輸粟我于周為客若之何使客晉士伯曰自踐土以來宋何役之不會而何盟之不同曰同恤王室子焉得辟之子奉君命以會大事而宋背盟無乃不可乎右師不敢對受牒而退士伯告簡子曰宋右師必亡奉君命以使而欲背盟以干盟主無不祥大焉言不善無大此者為定十年宋樂大心出奔傳王室之亂四年諸侯無一念及者至是晉以鄭游吉之語赧然內慚始合諸大夫謀之而方是時大夫皆謀弱公室以私便身圖安知勤王之義哉雖勉從人言為會以塞天下之議而期以來年及來年王入成周子朝奔楚晉與諸國無見焉則空有此會而諸大夫之罪不待貶而著矣有鸜鵒來巢鸜公羊作鸛左傳有鸜鵒來巢書所無也師己曰師己魯大夫異哉吾聞文成之世童謠有之曰鸜之鵒之公出辱之言鸜鵒來則公出辱也鸜鵒之羽羽飛貌公在外野往饋之馬鸜鵒跦跦跦跦跳行貌公在乾侯徴褰與襦褰袴鸜鵒之巢逺哉遙遙裯父喪勞宋父以驕裯父昭公死外故喪勞宋父定公代立故以驕鸜鵒鸜鵒往歌來哭昭公生出歌死還哭童謡有是今鸜鵒來巢其將及乎將及禍也公羊傳何以書記異也何異爾非中國之禽也宜穴又巢也榖梁傳一有一亡曰有來者來中國也鸜鵒穴者而曰巢㦯曰增之也如增言巢爾其實不巢也考工記曰鸜鵒不踰濟魯在汶南其所本無今忽有之故書曰有又其物穴處今而巢居陰當陽位臣逐君象也使昭公能以德消異則無其應矣秋七月上辛大雩季辛又雩左傳秋書再雩旱甚也公羊傳又雩者何又雩者非雩也聚衆以逐季氏也榖梁傳季者有中之辭也又有繼之辭也中中辛緣有上辛大雩故言又也季辛不言大䝉上文也早既大甚因一月再雩而志其僭且數也九月己亥公孫于齊次于陽州己亥榖梁作乙亥陽公羊作楊陽州杜注齊魯竟上邑今山東東平州東北有陽州城是也左傳初季公鳥娶妻于齊鮑文子生申公鳥季公亥之兄平子庶叔公鳥死季公亥與公思展與公鳥之臣申夜姑相其室公亥即公若展季氏族及季姒與饔人檀通而懼季姒即文子女饔人食官檀名乃使其妾抶已以示秦遄之妻曰秦遄魯大夫妻公鳥妹公若欲使余余不可而抶余又訴于公甫曰公甫平子弟展與夜姑將要余要劫我以非禮秦姬以告公之公之亦平子弟公之與公甫告平子平子拘展于卞而執夜姑將殺之公若泣而哀之曰殺是是殺余也將為之請平子使豎勿內日中不得請有司逆命請殺生之命公之使速殺之故公若怨平子季郈之雞鬬季平子郈昭伯二家相近故雞鬭季氏介其雞介甲也為雞著甲郈氏為之金距平子怒怒不下己益宫于郈氏侵其室以自益且讓之故郈昭伯亦怨平子臧昭伯之從弟會昭伯臧為子為讒于臧氏而逃于季氏臧氏執旃平子怒拘臧氏老將禘于襄公萬者二人其衆萬于季氏萬舞也于禮公當三十六人臧孫曰此之謂不能庸先君之廟不能用禮也大夫遂怨平子公若獻弓于公為公為昭公子務人且與之出射于外而謀去季氏公為告公果公賁果賁皆公為弟公果公賁使侍人僚柤告公公寢將以戈擊之佯怒乃走公曰執之亦無命也獨言執之無敕命懼而不出數月不見公不怒又使言公執戈以懼之乃走又使言公曰非小人之所及也小人謂僚柤公果自言公以告臧孫臧孫以難言難逐告郈孫郈孫以可勸告子家懿伯名羈莊公𤣥孫懿伯曰讒人以君徼幸事若不克君受其名受惡名不可為也舍民數世以求克事不可必也且政在焉其難圖也公退之退使去辭曰臣與聞命矣言若泄臣不獲死乃館于公恐受泄命之罪故留公宮以自明叔孫昭子如闞闞杜注魯邑公居于長府長府官府名九月戊戌伐季氏殺公之于門遂入之平子登臺而請曰君不察臣之罪使有司討臣以干戈臣請待于沂上以察罪沂上杜注魯城南有沂水弗許請囚于費弗許請以五乘亡弗許子家子曰君其許之政自之出久矣隱民多取食焉隱約窮困為之徒者衆矣日入慝作弗可知也慝姦惡也日冥姦人將起叛君助季氏不可知衆怒不可蓄也季氏衆蓄而弗治將薀薀積也薀蓄民將生心生心同求將合與季氏同求叛君者君必悔之弗聽郈孫曰必殺之公使郈孫逆孟懿子懿子仲孫何忌叔孫氏之司馬鬷戾言于其衆曰若之何莫對又曰我家臣也不敢知國凡有季氏與無于我孰利皆曰無季氏是無叔孫氏也鬷戾曰然則救諸帥徒以往陷西北隅以入陷公圍也公徒釋甲執冰而踞冰櫝丸蓋或云櫝丸是箭筒其蓋可以取飲言無戰心也遂逐之逐公徒孟氏使登西北隅以望季氏見叔孫氏之旌以告孟氏執郈昭伯殺之于南門之西遂伐公徒子家子曰諸臣僞劫君者而負罪以出君止諸臣謂公若等使若非公本意君自可止不出意如之事君也不敢不改公曰余不忍也與臧孫如墓謀辭先君且謀所奔遂行己亥公孫于齊次于陽州穀梁傳孫之為言猶孫也諱奔也次止也內諱奔曰孫不忍斥言故隱之書次以公去國失其所也陽州齊魯境上邑將求援於齊未敢直前故野次以待命也夫季氏之惡極矣說者謂昭公不知威權去已而逞一朝之忿欲驟正之求凶之道以是咎公固然然於意如逐君篡國之憝反一無所責若本無罪而祗為公譏者則大失是非之正滅人紀矣齊侯唁公于野井野井杜注濟南祝阿縣東有野井亭在今齊河縣東濟河北岸左傳齊侯將唁公于平隂公先至于野井齊侯曰是寡人之罪也使有司待于平隂為近故也平隂齊地齊侯自咎本不敕有司逺詣陽州而欲近㑹于平隂故令魯侯過共先至野井逺來迎己自責以謝公書曰公孫于齊次于陽州齊侯唁公于野井禮也將求于人則先下之禮之善物也物事也謂先往至野井齊侯曰自莒疆以西請致千社二十五家為社千社二萬五千家以待君命待君伐季氏之命寡人將帥敝賦以從執事唯命是聽君之憂寡人之憂也公喜子家子曰天祿不再天若胙君不過周公以魯足矣失魯而以千社為臣為齊臣誰與之立且齊君無信不如早之晉弗從臧昭伯率從者將盟載書曰戮力一心好惡同之信罪之有無信明也處者有罪從者無罪繾綣從公繾綣不離散無通外內以公命示子家子子家子曰如此吾不可以盟羈也不佞不能與二三子同心而以為皆有罪從者陷君留者逐君皆有罪也或欲通外內通外內之言彼此解說且欲去君去君僞負罪出奔不必繾綣從公二三子好亡而惡定焉可同也陷君于難罪孰大焉通外內而去君君將速入弗通何為而何守焉何必守公乃不與盟公羊𫝊唁公者何昭公將弒季氏言弒誤告子家駒曰季氏為無道僭于公室久矣吾欲弒之何如子家駒曰諸侯僭于天子大夫僭于諸侯久矣昭公曰吾何僭矣哉子家駒曰設兩觀禮天子外闕兩觀諸侯內闕一觀乘大路禮天子大路諸侯路車大夫大車士飾車朱千玉戚以舞大夏千楯也以朱飾楯戚斧也以玉飾斧大夏夏樂周所以舞夏樂者王者始起未制作之時取先王之樂與己同者假以風化天下天下大同乃自作樂取夏樂者與周俱文也八佾以舞大武此皆天子之禮也且夫牛馬維婁繫馬曰維繫牛曰婁委己者也而柔焉委食己者柔順也言牛馬猶順餧己之人喻民受季氏惠自當從之季氏得民衆久矣君無多辱焉昭公不從其言終弒而敗焉走之齊齊侯唁公于野井曰奈何君去魯國之社稷昭公曰喪人不佞失守魯國之社稷執事以羞謙自比齊下執事言以羞及君再拜顙謝見唁也慶子家駒曰慶賀也慶子免君于大難矣子家駒曰臣不佞陷君于大難君不忍加之以鈇鑕賜之以死再拜顙髙子執簞食與四脡脯屈曰朐伸曰脡國子執壺漿曰吾寡君聞君在外餕饔未就餕熟食饔熟肉未就未成也敢致糗于從者昭公曰君不忘吾先君延及喪人錫之以大禮再拜稽首以衽受衽衣下裳當前者乏器謙不敢求索高子曰有夫不祥猶曰人皆有夫不善君無所辱大禮禮臣受君賜答拜謂之拜命之辱髙子見昭公拜辱大卑故曰君無所辱大禮昭公蓋祭而不嘗食必祭示有所先不嘗待禮讓也景公曰寡人有不腆先君之服未之敢服有不腆先君之器未之敢用敢以請昭公曰喪人不佞失守魯國之社稷執事以羞敢辱大禮敢辭景公曰寡人有不腆先君之服未之敢服有不腆先君之器未之敢用敢固以請昭公曰以吾宗廟之在魯也有先君之服未之能以服有先君之器未之能以出敢固辭景公曰寡人有不腆先君之服未之敢服有不腆先君之器未之敢用請以饗乎從者昭公曰喪人其何稱行禮賓主當各有所稱昭公失國不敢仍故稱故謙而問之景公曰孰君而無稱昭公于是噭然而哭噭然哭聲感景公言而自傷諸大夫皆哭既哭以人為菑菑周埓垣也所以别內外衛威儀也以幦為席幦車覆笭以鞍為几以遇禮相見以諸侯出相遇之禮相見孔子曰其禮與其辭足觀矣言外譏之穀梁𫝊弔失國曰唁唁公不得入于魯也凡唁皆造其所居公方孫齊求援故齊侯以唁為名而實拒公之適己也書齊侯唁非與其能唁也譏其無救災恤患之實徒行虛禮而誠不在焉耳冬十月戊辰叔孫舍卒左𫝊昭子自闞歸見平子平子稽顙曰子若我何昭子曰人誰不死子以逐君成名子孫不忘不亦傷乎將若子何平子曰苟使意如得改事君所謂生死而肉骨也昭子從公于齊與公言子家子命適公館者執之恐從者知叔孫謀公與昭子言于幄內曰將安衆而納公公徒將殺昭子伏諸道左師展告公展魯大夫公使昭子自鑄歸辟伏兵平子有異志不欲復納公冬十月辛酉昭子齊于其寢使祝宗祈死戊辰卒恥為平子所欺故祈而自殺左師展將以公乘馬而歸欲與公俱輕歸公徒執之昭公之禍原於叔孫氏之司馬婼果憤意如見欺即宜正鬷戾之罪而誅之以剪季氏之羽翼而徐為之圖今乃付之無可奈何之命則非忠矣至祈死之說本不可信此年春婼聘宋與宋公對語而泣樂祈已知其魂魄去矣何侍於祈哉附録左𫝊壬申尹文公涉于鞏焚東訾弗克文公子朝黨于鞏縣涉洛水也東訾杜注敬王邑十有一月己亥宋公佐卒于曲棘曲棘杜注宋地陳留外黃縣城中有曲棘里當在今河南杞縣境左𫝊十一月宋元公將為公故如晉請納公夢大子欒即位于廟已與平公服而相之欒元公子平公元公父旦召六卿公曰寡人不佞不能事父兄父兄謂華向以為二三子憂寡人之罪也若以羣子之靈獲保首領以殁唯是楄柎所以藉幹者楄柎棺中苓牀也幹骸骨也請無及先君欲自貶損仲幾對曰君若以社稷之故私降昵宴羣臣弗敢知昵近也降昵宴謂損聲樂飲食之事若夫宋國之法死生之度先君有命矣羣臣以死守之弗敢失隊臣之失職常刑不赦臣不忍其死君命祗辱言君命必不行祗適也宋公遂行己亥卒于曲棘公羊𫝊曲棘者何宋之邑也諸侯卒其封內不地此何以地憂內也時聞昭公見逐欲納之故曰憂內穀梁𫝊邡公也邡謀也曲棘宋地諸侯以境內為家故行而卒於境內者不書其地蓋以為常事而告辭不及也宋元公以公故將如晉以謀納公故告辭獨詳而載於册書夫元公之女為意如妻乃能不昵私愛急於正倫恤患賢於當時諸侯逺矣故不削其卒地以别之十有二月齊侯取鄆左𫝊十二月庚辰齊侯圍鄆欲取以居公公羊𫝊外取邑不書此何以書為公取之也穀梁𫝊取易辭也內不言取以其為公取之故易言之也鄆魯邑書齊侯取之何也齊不自取而為公取鄆使居之蓋無意於納公也使齊侯移圍鄆之師直指魯郊執意如而歸之京師復昭公於魯則義聲振於天下矣乃不能討賊以正大義而姑取鄆以塞己責故書以譏之胡氏安國乃謂公已絶於魯而見逐於季氏為不君此害義之言非經指也附録左𫝊初臧昭伯如晉臧㑹竊其寶龜僂句㑹昭伯從弟僂句龜所出地名以卜為信與僭僭不信也僭吉臧氏老將如晋問問昭伯起居㑹請往代家老行昭伯問家故故事也盡對及內子與母弟叔孫則不對內子昭伯妻不對若有他故再三問不對歸及郊會逆問又如初至次于外而察之皆無之執而戮之逸奔郈郈魴假使為賈正焉郈杜注在東平無鹽縣東南今山東東平州東四十里有郈城魴假郈邑大夫賈正掌貨物若市吏計于季氏送季簿臧氏使五人以戈楯伏諸桐汝之閭桐汝杜注里名會出逐之反奔執諸季氏中門之外平子怒曰何故以兵入吾門拘臧氏老季臧有惡相怨惡及昭伯從公平子立臧㑹立以為臧氏後會曰僂句不余欺也言不信果驗楚子使薳射城州屈復茄人焉還復茄人于州屈城丘皇遷訾人焉遷訾人于丘皇使熊相禖郭巢季然郭卷使二大夫為巢卷築郭也卷杜注卷城在南陽葉縣南今河南葉縣西南有建城故城即其地子太叔聞之曰楚王將死矣使民不安其土民必憂憂將及王弗能久矣為明年楚子居卒𫝊日講春秋解義卷五十四
