front:
  text: 聖祖仁皇帝御製日講春秋解義序
  hash: sha256:81c550531d6330458bbc1402323800e84d5ccc98c6d9d1c9054c6499d5ed353b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1e0093_WYG_000-1a, image: WYG0172/WYG0172-0001a.png}
body:
  text: 朕惟春秋者帝王經世之大法史外傳心之要典也大義炳若日星而褒貶筆削微顯婉章非後世所能窺至其立法謹嚴宅心一本忠恕因善惡是非而施豫奪焉有正例有變例有事同而辭異有事異而辭同一人之身前後不相掩一人之事功過不妨殊如化工之肖物隨類付形未嘗有所容心於其間後之説經者或穿鑿深文或附會失實固難悉當聖人之心左氏親見聖人公羊榖梁及門子夏猶彼此抵牾𩥫駮互見何况去聖人日逺紛紜探索如漢唐以下董仲舒趙匡啖助諸家乎惟宋康侯胡氏潛心二十年事本左氏義取公榖萃諸家之長勒成一家之書雖持論過激抉隱太嚴未必當日聖心皆然要其本三綱奉九法明王道正人心於春秋大旨十常得其六七較之漢唐以後諸家優矣朕萬幾之暇研精六經竊有慨於春秋經聖人手定其衮鉞本乎王章刑賞原於忠厚義例雖繁而其明白正大之旨必不如後之説經者委折碎細若此爰命儒臣撰集進講大約以胡氏為宗而去其論之太甚者無傳經文則博採諸儒論注以補之朕亦時有所折衷期歸於一編輯成書朝夕省覽亦欲俾學者有所遵守其於經世大法傳心要典未必無少助云爾御製日講春秋解義序嘗考春秋經文不過萬有六千三百餘言自三傳以後羣儒義疏纍數千萬言而微詞隱義之難眀者猶十有六七蓋是經乃孔子所手定也辭約而義深聖心之所運用每舉一事其義必貫於全經非若他經一章一節各指一事雖有不通而不􅊣其可通者故程朱二子深探力索久之皆見謂難眀而止至明初胡氏安國之説遂獨列於學官以朱子深病是經之難通而教門人姑從胡氏之説也然謂其以義理穿鑿則非義理之真而於聖人筆削之旨未能吻合眀矣故自眀以來雖著功令科舉之士稟為程式而終不足以服學者之心我聖祖仁皇帝聰眀天亶自少時即篤好經書及躬攬大政辨色出視朝裁決萬幾甫畢即召儒臣講論經義務抉其根源參伍羣言以求至當經筵所進日講四書及尚書周易解義皆裁自聖心以為無憾者故即時刋布及晚年以明初五經大全收採討論尚未精詳口授指畫成周易折衷一書詩書春秋則命重臣開館編次而親釐定之惟三禮體大未議纂修蓋有待也周易折衷成於康熙五十四年春秋傳説彚纂成于六十年已經頒布餘二經則至我皇考繼序之後始次第告成皇考大孝尊親凡皇祖一言一動莫不敬述以昭示來兹念欽定春秋于胡氏之説既多駁正則廷臣當日所進講義一遵胡氏之舊者於聖心自多未洽是以遲之又久未嘗宣布必將俟諸經備成而後重加討論也故再降諭旨命果親王允禮大學士張廷玉內閣學士方苞詳細校訂始事於雍正七年恭呈御覽者再而後告成凡六十四卷乾隆二年鋟版既訖諸臣請製序文頒示海內朕反覆循覽于胡氏穿鑿之説曠若發蒙筆削之旨闡眀者亦過半焉夫解義之成蓋數十年於兹矣觀皇祖之久不宣布可以徵望道未見之心觀皇考之再三考訂而後命刋可以知善繼善述之義豈惟是經之窔穾將由是以開通哉即兩朝聖人之心法治法亦於斯可睹矣乾隆丁巳仲春月乾隆二年正月二十四日奉旨開載監修總裁分撰校訂校録校刋監造諸臣銜名總裁經筵日講官起居注禮部左侍郎管翰林院掌院學士事臣庫勒納經筵日講官起居注翰林院掌院學士兼禮部侍郎臣李光地分撰日講官起居注詹事府少詹事兼翰林院侍講學士臣王封濚日講官起居注詹事府少詹事兼翰林院侍講學士臣髙士竒日講官起居注詹事府少詹事兼翰林院侍講學士臣田喜日講官起居注侍讀學士臣德格勒日講官起居注侍讀學士臣博濟日講官起居注侍讀學士臣朱都納日講官起居注侍讀學士臣思格則日講官起居注侍讀學士臣彭孫遹監修總理事務和碩莊親王臣允祿校訂總理事務和碩果親王臣允禮總理事務少保大學士臣張廷玉內閣學士兼禮部侍郎臣方苞校録翰林院侍讀今任福建學政臣周學健翰林院編修臣朱良裘翰林院編修臣余棟翰林院編修臣鄧啓元翰林院檢討臣周龍官翰林院編修臣王興吾翰林院編修臣呂熾翰林院編修臣夏廷芝翰林院編修臣王檢原任翰林院編修今任山西道監察御史臣劉元燮原任翰林院編修今任福建道監察御史臣鹿邁祖原任翰林院編修今任吏部驗封司郎中臣陳其凝原任翰林院編修今任刑部陕西司員外郎臣吳文煥原任翰林院檢討今任分巡浙江金衢嚴道按察使副使臣程光巨原任翰林院編修今任四川順慶府知府臣王泰甡校刋右春坊右庶子兼翰林院侍講臣陳浩左春坊左諭德兼翰林院修撰臣嵇璜右春坊右贊善兼翰林院檢討臣趙大鯨翰林院編修臣萬承蒼翰林院檢討今任山東學政臣李光墺翰林院編修臣于枋翰林院編修今任江西學政臣于辰翰林院編修臣林蒲封翰林院編修臣柏謙翰林院編修臣楊廷棟翰林院編修臣徐以烜翰林院編修臣吳士珣翰林院檢討臣韓彥曾翰林院編修臣陳大受原任翰林院編修今任雲南道監察御史貴州學政臣鄒一桂原任翰林院編修今任雲南曲靖府知府臣王雲銘監造巡視長蘆等處鹽政監察御史內務府佐領臣三保內務府南苑郎中兼佐領臣雅爾岱內務府掌儀司郎中兼佐領臣永保內務府織染局員外郎臣李之綱內務府廣儲司司庫臣三格監造臣西寧監造臣恩克日講春秋解義卷目經部五春秋類第一卷隱公元年之二年第二卷隱公三年之四年第三卷隱公五年之七年第四卷隱公八年之十一年第五卷桓公元年之三年第六卷桓公四年之八年第七卷桓公九年之十三年第八卷桓公十四年之十八年第九卷莊公元年之六年第十卷莊公七年之十一年第十一卷莊公十二年之十九年第十二卷莊公二十年之二十六年第十三卷莊公二十七年之三十二年第十四卷閔公元年之二年第十五卷僖公元年之四年第十六卷僖公五年之九年第十七卷僖公十年之十五年第十八卷僖公十六年之二十年第十九卷僖公二十一年之二十三年第二十卷僖公二十四年之二十七年第二十一卷僖公二十八年第二十二卷僖公二十九年之三十三年第二十三卷文公元年之四年第二十四卷文公五年之九年第二十五卷文公十年之十四年第二十六卷文公十五年之十八年第二十七卷宣公元年之四年第二十八卷宣公五年之十年第二十九卷宣公十一年之十三年第三十卷宣公十四年之十八年第三十一卷成公元年之二年第三十二卷成公三年之六年第三十三卷成公七年之九年第三十四卷成公十年之十四年第三十五卷成公十五年之十六年第三十六卷成公十七年之十八年第三十七卷襄公元年之六年第三十八卷襄公七年之九年第三十九卷襄公十年之十三年第四十卷襄公十四年之十六年第四十一卷襄公十七年之二十年第四十二卷襄公二十一年之二十三年第四十三卷襄公二十四年之二十五年第四十四卷襄公二十六年之二十七年第四十五卷襄公二十八年之二十九年第四十六卷襄公三十年之三十一年第四十七卷昭公元年之二年第四十八卷昭公三年之五年第四十九卷昭公六年之八年第五十卷昭公九年之十二年第五十一卷昭公十三年第五十二卷昭公十四年之十八年第五十三卷昭公十九年之二十一年第五十四卷昭公二十二年之二十五年第五十五卷昭公二十六年之二十八年第五十六卷昭公二十九年之三十二年第五十七卷定公元年之四年第五十八卷定公五年之八年第五十九卷定公九年之十二年第六十卷定公十三年之十五年第六十一卷哀公元年之五年第六十二卷哀公六年之十年第六十三卷哀公十一年之十四年第六十四卷哀公十五年之二十七年臣等謹按日講春秋解義六十四卷是書為聖祖仁皇帝經筵舊稿世宗憲皇帝復加考論乃編次成帙説春秋者莫夥於兩宋其為進講而作者宋史藝文志有王葆春秋講義二卷今已散佚張九成橫浦集有春秋講義一卷永樂大典有戴溪春秋講義三卷大抵皆演繹經文指陳政理與章句之學迥殊是非惟崇政邇英奏御之體裁如是亦以統馭之柄在慎其賞罰賞罰之要在當其功罪而别嫌疑明是非定猶豫者則莫精於春秋聖人筆削之旨實在於是也故孟子曰春秋天子之事也公扈子曰有國者不可以不學春秋春秋國之鑑也董仲舒推演公羊之旨得二百三十二條作春秋決事十六篇其義蓋有所受矣是編因宋儒進御舊體以闡發微言每條先列左氏之事迹而不取其浮夸次明公榖之義例而不取其穿鑿反覆演繹大旨歸本於王道允足明聖經之書法而探帝學之本原聖祖仁皇帝世宗憲皇帝聖聖相承鄭重分明以成此一編豈非以經世之樞要具在斯乎乾隆四十一年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書日講春秋解義總説綱領孟子曰春秋夫子之事也是故孔子曰知我者其惟春秋乎罪我者其惟春秋乎孔子成春秋而亂臣賊子懼又曰王者之迹熄而詩亡詩亡然後春秋作晉之乘楚之檮杌魯之春秋一也其事則齊桓晉文其文則史孔子曰其義則丘竊取之矣又曰春秋無義戰彼善於此則有之矣征者上伐下也敵國不相征也禮記經解屬辭比事春秋教也莊氏周曰春秋經世先王之志聖人議而不辨又曰春秋以道名分董氏仲舒曰春秋之道視人所惑大為説以明之又曰春秋無通辭從變而移又曰有國者不可以不知春秋前有讒而不見後有賊而不知為人臣者不可以不知春秋守經事而不知其宜遭變事而不知其權為人君父而不通於春秋之義者必蒙首惡之名為人臣子而不通於春秋之義者必陷死罪之名故春秋禮義之大宗也劉氏向曰春秋無通義司馬氏遷曰孔子西觀周室論史記舊聞興於魯而次春秋約其辭文去其煩重以制義法七十子之徒口受其傳指為有所刺譏褒諱挹損之文辭不可以書見也班彪引古語殺史見極平易正直韓氏愈曰春秋謹嚴又曰春秋書王法不誅其人身邵子曰春秋孔子之刑書也功過不相掩五伯者功之首罪之魁也先定五伯之功過而學春秋則大意立矣春秋之間有功者未有大於四國者也有過者亦未有大於四國者也不先治四國之功過則事無統理不得聖人之心矣程子曰春秋大義數十炳如日星乃易見也惟其微辭奧義時措從宜者為難知也或抑或縱或豫或奪或進或退或微或顯而得乎義理之安文質之中寬猛之宜是非之公乃制事之權衡揆道之模範也又曰春秋有重疉言者如征伐會盟之類蓋欲成書勢須如此不可事事各求異義但一字有異或上下文異則義須别胡氏安國曰春秋為誅亂臣賊子而作其法尤嚴於亂賊之黨朱子曰春秋是聖人據魯史以書其事使人自觀之以為鑒戒耳如書即位者是魯君行即位之禮繼故不書即位者是不行即位之禮若桓公之書即位則是桓公自正其即位之禮耳通論公羊氏高曰君子何為為春秋撥亂世反諸正莫近諸春秋董氏仲舒曰孔子知言之不用道之不行也是非二百四十二年之中以為天下儀表曰我欲載之空言不如見之行事之深切著明也又曰春秋辨是非故長於治人王氏通曰春秋之於王道是輕重之權衡曲直之繩墨也舍則無所取衷矣孔氏穎達曰年時月日四者史之所記皆應具文而春秋之經或時而不月月而不日亦有日不繫月月而無時者或史文先缺而仲尼不改或仲尼備文而後人脫誤桓十七年五月無夏昭十年十二月無冬既得其月時則可知仲尼不應故闕其時獨書其月當是寫者脫漏其日不繫於月或是史先闕文若僖二十八年冬下無月而有壬申丁丑雖欲改正無以復知其時而不月月而不日者史官之文亦或自有詳略案經傳書日者凡六百八十一事自文公以上書日者二百四十九宣公以下亦俱六公書日者四百三十二計年數略同而日數嚮倍此則久逺遺落不與近同且他國之告有詳有略若告不以日魯史無由得其日而書之如是則當時之史亦不能使日月皆具仲尼從後修之舊典參差安能皆使齊同去其日月則或害事之先後備其日月則古史有所不載自然舊有日者因而詳之舊無日者因而略之既有詳略不可以為褒貶故春秋諸事皆不以日月為例啖氏助曰左氏比餘傳其功最高博采諸家敘事尤備能令百代之下頗見本末因以求意經文可知穀梁意深公羊辭辨隨文解釋往往鉤深但以守文堅滯泥難不通比附日月曲生條例義有不合亦復強通或至矛盾不近聖人夷曠之體又不知有不告則不書之義凡不書者皆以義説之列國至多若盟會征伐喪紀不告亦書則一年之中可盈數卷况他國之事不慿告命從何得書但書所告之事定其善惡以文褒貶耳左氏言褒貶者又不過十數條其餘事同文異者亦無他解舊解皆言從告及舊史之文若如此論乃是夫子寫魯史耳何名修春秋乎故謂二者之説俱不得中趙氏匡曰啖氏依公羊家舊説云春秋變周之文從夏之質豫謂春秋因史制經以明王道其指大要二端而已興常典也著權制也故凡郊廟喪紀朝聘搜狩昏取皆違禮則譏之是興常典也非常之事典禮所不及則裁之聖心以定褒貶所以窮精理也精理者非權無以及之故曰可與適道未可與立可與立未可與權是以遊夏之徒不能贊一辭然則聖人當機發斷以定厥中辨惑質疑為後王法何必從夏乎問者曰然則春秋救世之宗指安在答曰在尊王室正陵僭舉三綱提五常彰善疸惡不失纖芥而已又曰褒貶之指在乎例綴敘之意在乎體所謂體者其大概有三而區分有十所謂三者凡即位崩薨卒葬朝聘會盟此常典所當載也故悉書之隨其邪正而加褒貶此其一也祭祀婚姻賦稅軍旅搜狩皆國之大事亦所當載也其合禮者夫子修經之時悉皆不取故公榖云常事不書是也其非者及合於變之正者乃取書之而增損其文以寄褒貶之意此其二也慶瑞災異及君被殺被執及奔放逃叛歸入納立如此並非常之事亦史册所當載夫子則因之而加褒貶焉此其三也此述作之大凡也所謂十者一曰悉書以志實二曰略常以明禮三曰省辭以從簡四曰變文以示義五曰即辭以見意六曰記是以著非七曰示諱以存禮八曰詳內以異外九曰闕略因舊史十曰損益以成辭知其體推其例觀其大意然後可以議之耳或曰聖人之教求以訓人也微其辭何也答曰非微之也事當爾也人之善惡必有淺深不約其辭不足以差之也若廣其辭則是史氏之書耳焉足以見條例而稱春秋乎周子曰春秋正王道明大法也孔子為後世王者而修也亂臣賊子誅死者於前所以懼生者於後也程子曰詩書載道之文春秋聖人之用詩書如藥方春秋如用藥治病聖人之用全在此書所謂不如載之行事深切著明者也又曰五經之有春秋猶法律之有斷例也律令惟言其法至於斷例則始見其法之用也又曰春秋之文一一意在示人如土功之事無小大莫不書之其意止欲人君重民力也又曰春秋一句即一事是非便見於此乃窮理之要學者只觀春秋亦可以盡道矣又曰春秋已前既已立例到近後來書得全别一般事便書得别有意思若依前例觀之殊失也春秋大率所書事同則辭同後人因謂之例然有事同辭異者蓋各有義非可例拘也汪氏藻曰六經惟春秋為仲尼作聖人見其所志之書也學而不眀乎是非何以為人治而不眀乎刑賞何以為國此書之所以作而為萬世法也朱子曰史記易本隱以之顯春秋推見至隱易與春秋天人之道也易以形而上者説出在那形而下者上春秋以形而下者説上那形而上者去吕氏大圭曰春秋穿鑿之患其大端有二一曰以日月為褒貶二曰以名稱爵號為褒貶春秋以事繫日以日繫月以月繫時事成於日者書日事成於月者書月事成於時者書時其或宜月而不月宜日而不日者皆史失之也劉氏永之曰春秋因乎魯史而筆之傳之而王法由諸而明亂逆由諸而章也言之重辭之復必有大美惡焉此先儒之説也抑嘗考之蓋史册之實録而其紀載之體異焉耳其凡有五有據其事之離合而書之者有重其終而録其始者有重其始而録其終者有承赴告之辭而書之者有非承赴告之辭聞而知之而書之者此五者其凡也而皆所以紀實也夫首止之與葵丘也皆夏之會而秋之盟是離而為二事矣故再書焉此據其事之離合而書之者也踐土之會美矣而盟不異書同日也平丘之會無美焉而盟則異書異日也皆實之紀也非美之大而詳其辭也將書其取鼎也於稷之會則始之以成宋亂此重其終而録其始也既書曰宋伯姬卒也於澶淵之會則終之以宋災故此重其始而録其終也會未有言其故者於兹二者言之特以眀其所重也他如書實來則先書州公如曹書齊侯伐北燕則遂書暨齊平皆是物也子朝之亂叔鞅至自京師而言之未知其孰是焉故曰王室亂此非承赴告之辭聞而知之而書之者也劉單以王猛居於皇則來告矣敬王居翟泉而尹氏立子朝則來告矣此承赴告之辭而書之者也皆實之紀也非惡之大而詳其辭也曰言之重辭之復必有大美惡焉者先儒之過也經傳源流班氏固曰左史記言右史記事事為春秋言為尚書杜氏預曰周禮有史官掌邦國四方之事達四方之志諸侯亦各有國史大事書之於䇿小事簡牘而已孟子曰楚謂之檮杌晉謂之乘而魯謂之春秋其實一也韓宣子適魯見易象與魯春秋曰周禮盡在魯矣吾乃今知周公之德與周之所以王韓子所見蓋周之舊典禮經也周德既衰官失其守上之人不能使春秋昭眀赴告䇿書諸所記注多違舊章仲尼因魯史䇿書成文考其真偽而志其典禮上以遵周公之遺制下以眀將來之法其教之所存文之所害則刋而正之以示勸戒其餘則皆即用舊史史有文質辭有詳略不必改也故傳曰其善志又曰非聖人孰能修之陸氏德明曰古之王者必有史官君舉則書所以慎言行昭法式也諸侯亦有國史春秋即魯之史記也孔子應聘不遇自衛而歸西狩獲麟傷其虛應乃與魯君子左丘明觀書於太史氏因魯史記而作春秋上遵周公遺制下眀將來之法褒善黜惡勒成十二公之經以授弟子弟子退而異言丘明恐弟子各安其意以失其真故論本事而為之傳明夫子不以空言説經也春秋所貶損人當世君臣其事實皆形於傳故隱其書而不宣所以免時難也及末世口説流行故有公羊穀梁鄒氏夾氏之傳鄒氏無師夾氏有録無書故不顯於世漢興齊人胡母生趙人董仲舒並治公羊春秋蘭陵褚大東平嬴公廣川段仲溫吕步舒皆仲舒弟子嬴公守學不失師法授東海孟卿及魯眭𢎞𢎞授嚴彭祖及顔安樂由是公羊有嚴顔之學𢎞弟子百餘人常曰春秋之意在二子矣彭祖授琅邪王中中授同郡公孫文及東門雲安樂授淮陽泠豐及淄川任翁豐授大司徒馬宫及琅邪左咸始貢禹事嬴公而成於眭孟以授潁川棠溪惠惠授泰山冥都又疏廣事孟卿以授琅邪管路管路及冥都又事顔安樂路授大司農孫寶瑕丘江公受穀梁春秋及詩於魯申公武帝時為博士使與董仲舒論江公呐於口而丞相公孫𢎞本為公羊學比輯其義卒用董生於是上因尊公羊家詔太子受衛太子復私問穀梁而善之其後浸微唯魯榮廣皓星公二人受焉廣盡能傳其詩春秋蔡千秋梁周慶丁姓皆從廣受千秋又事皓星公為學最篤宣宗即位聞衛太子好穀梁乃召千秋與公羊家並説上善穀梁説後又選郎十人從千秋受會千秋病死徴江公孫為博士詔劉向受穀梁欲令助之江博士復死乃徴周慶丁姓待詔使卒授十人十餘嵗皆明習乃召五經名儒太子太傳蕭望之等大議殿中平公羊穀梁同異望之等多從穀梁由是大盛慶姓皆為博士姓授楚申章昌曼君初尹更始事蔡千秋又受左氏傳取其變理合者以為章句傳子咸及翟方進房鳳始江博士授胡常常授梁蕭秉為講學大夫左丘明作傳以授曽申申傳衛人吳起起傳其子期期傳楚人鐸椒椒傳趙人虞卿卿傳同郡荀卿名況況傳武威張蒼蒼傳洛陽賈誼誼傳至其孫嘉嘉傳趙人貫公貫公傳其少子長卿長卿傳京兆尹張敞及侍御史張禹禹數為御史大夫蕭望之言左氏望之善之薦禹徴待詔未及問會病死禹傳尹更始更始傳其子咸及翟方進胡常常授黎陽賈護護授蒼梧陳欽漢書儒林傳云漢興北平侯張蒼及梁太傅賈誼京兆尹張敞太中大夫劉公子皆修春秋左氏傳始劉歆從尹咸及翟方進受左氏由是言左氏者本之賈護劉歆歆授扶風賈徽徽傳子逵逵受詔列公羊穀梁不如左氏四十事以奏之名曰左氏長義章帝善之逵又作左氏訓詁司空南閣祭酒陳元作左氏同異大司農鄭衆作左氏條例章句南郡太守馬融為三家異同之説京兆尹延篤受左氏於賈逵之孫伯升因而注之汝南彭汪記先師竒説及舊注太中大夫許淑九江太守服虔侍中孔嘉魏司徒王朗荆州刺史王基大司農董遇徴士燉煌周生烈並注解左氏傳梓潼李仲欽著左氏指歸陳郡潁容作春秋條例又何休作左氏膏肓公羊墨守穀梁廢疾鄭康成針膏肓發墨守起廢疾自是左氏大興漢初立公羊博士宣帝又立穀梁平帝始立左氏後漢建武中以魏郡李封為左氏博士羣儒蔽固者數廷爭之及封卒因不復輔和帝元興十一年鄭興父子奏上左氏乃立於學官仍行於世迄今遂盛行二傳漸微左氏今用杜預注公羊用何休注穀梁用范寧注啖氏助曰古之解説悉是口傳自漢以來乃為章句如本草皆後漢時郡國而題以神農山海經廣説殷時而云夏禹所紀自餘書籍比比甚多是知三傳之義本皆口傳後之學者乃著竹帛而以祖師之目題之子觀左氏傳自周晉齊宋楚鄭等國之事最詳晉則每一出師具列將佐宋則每因興廢備舉六卿故知史䇿之文每國各異左氏得此數國之史以授門人義則口傳未形竹帛後代學者乃演而通之總而合之編次年月以為傳記又廣采當時文籍故兼與子産晏子及諸國卿佐家傳并卜書及雜占書縱橫家小説諷諌等雜在其中故敘事雖多釋意殊少是非交錯混然難證公羊穀梁初亦口授後人據其大義散配經文故多乖謬失其綱統然其大指亦是子夏所傳鄭氏樵曰春秋者魯史記之名也有未經夫子筆削之春秋有已經夫子筆削之春秋孔潁達曰春秋之名無所經見惟昭二年韓起來聘見魯春秋晉語司馬侯對悼公曰羊舌肸習於春秋悼公使之傳其太子楚語申叔時論傅太子之法亦云教之以春秋由此觀之是周之典禮不存惟魯春秋為列國所重皆在夫子未修之前舊有春秋之目則韓起之所見與叔向叔時之所學者乃周公伯禽以來上自天子下至列國禮樂征伐等事無不備載皆周之盛時為王之典章此杜預所謂周之舊典禮經是也今汲冢瑣語亦有魯春秋記魯獻公十七年事諸如此類皆夫子未生之前未經筆削之春秋也孟子云王者之迹熄而詩亡詩亡然後春秋作此魯史記東遷以後事已經夫子筆削之春秋也或謂春秋之名取賞以春夏刑以秋冬或謂一褒一貶若春若秋或謂春獲麟秋成書謂之春秋皆非也惟杜預所謂年有四時故錯舉以為所記之名此説得之汲冢瑣語記夫子時事自為夏殷春秋墨子曰吾見百國春秋以至晏子虞卿吕不韋陸賈著書皆曰春秋蓋當時述作之流於正史外各記其書皆取春秋以名之然觀其篇第本無年月與錯舉春秋以為所記之名則異矣問公穀傳大概皆同朱子曰所以林黃中説只是一人只是看他文字疑若非一手者或曰疑當時皆有所傳授其後門人弟子始筆之於書耳曰想得皆是齊魯間儒其所著之書恐有所傳授但皆雜以己意所以多差舛其有合道理者疑是聖人之舊馬氏端臨曰案春秋古經雖漢藝文志有之然夫子所修之春秋其本文世所不見而自漢以來所編古經則俱自三傳中取出經文名之曰正經耳又曰易有彖象本與卦爻為二而王弼合之詩書有序本與經文為二而毛萇孔安國合之春秋有三傳亦本與經文為二而治三傳者合之先儒務欲存古於是取其已合者復析之命之曰古經然彖象之與卦爻序之與經毛孔王三公雖以之混為一書尚未嘗以己意增損於其間苟復析之即古人之舊矣獨春秋一書三傳各以其説與經文參錯而所載之經文又各爭異蓋事同而字異者及邾儀父盟于蔑于眛之類是也事字俱異者尹氏君氏之類是也元未嘗書其事而以意增入者孔子生孔丘卒是也然擇其差可信者則左氏為優何也蓋公羊穀梁直以其所作傳文攙入正經不曽别出而左氏則經自經而傳自傳又杜元凱經傳集解序文以為分經之年與傳之年相附則是左氏作傳之時經文本自為一書至元凱始以左氏傳附之經文各年之後是左氏傳中之經文可以言古經矣傳注得失歐陽氏修曰傳之於經勤矣其述經之事時有賴其詳焉至其失傳則不勝其戾也其述經之意亦時有得焉及其失也欲大聖人而反小之欲尊經而反卑之取其詳而得者廢其失者可也嘉其尊大之心可也取其卑小之説不可也又曰經不待傳而通者十七八因傳而惑者十五六程子曰以傳考經之事迹以經别傳之真偽朝氏説之曰穀梁晚出於漢因得監省左氏公羊之違畔而正之至其精深逺大者真得子夏之所傳范氏又因諸儒而博辨之申穀梁之志也其於是非亦少公矣非若征南一切申傳汲汲然不敢異同也楊氏時曰伯淳先生嘗有語云看春秋若經不通則當求之傳傳不通則當求之經某曽問之云傳不通則當求之經何也曰只如左氏春秋書君氏卒君氏乃惠公繼室聲子也而公羊春秋則書曰尹氏傳云大夫也然聲子而書曰君氏是何義當以尹氏為正此所謂求之經胡氏安國曰傳春秋者三家左氏敘事見本末公羊穀梁辭辨而義精學經以傳為案則當閲左氏玩辭以義為主則當習公穀胡氏寧曰左氏釋經雖簡而博通諸史敘事尤詳能令百世之下頗見本末其有功於春秋為多公穀釋經其義皆密如衛州吁以稱人為討賊之辭也公薨不地故也不書葬賊不討以罪下也若此之類深得聖人誅亂臣討賊子之意考其源流必有端緒非曲説所能及也啖趙謂三傳所記本皆不謬義則口傳未形竹帛後代學者妄加附益轉相傳授浸失本真故事多迂誕理或舛駁其言信矣然則學者於三傳忽焉而不習則無以知經習焉而不察擇焉而不精則春秋之宏意大旨簡易明白者汨於僻説愈晦而不顯矣朱子曰左氏曽見國史考事頗精只是不知大義專去小處理會往往不曽講學公穀考事甚踈然義理却精二人乃是經生傳得許多説話往往不曽見國史又曰左傳君子曰最無意思因舉芟夷藴崇之一段是關上文甚事左傳是一箇審利害之幾善避就底人所以其書有貶死節等事其間議論有極不是處如周鄭交質之類是何議論其曰宋宣公可謂知人矣立穆公其子饗之命以義夫只知有利害不知有義理此段不如公羊説君子大居正却是儒者議論又曰或有解春秋者專以日月為褒貶書時月則以為貶書日則以為褒穿鑿得全無義理若胡文定公所解乃是以義理穿鑿故可觀問胡春秋如何曰胡春秋大義正但春秋自難理會又曰前輩做春秋義言辭雖粗率却説得聖人大意出如二程未出時便有胡安定孫泰山石徂徠他們説經雖是甚有踈略處觀其推明治道直是凜凜可畏又曰左傳是後來人做為見陳氏有齊所以言八世之後莫之與京見三家分晉所以言公侯子孫必復其始左氏是史學公穀是經學史學者記得事却詳於道理上便差經學者於義理上有功然記事多誤擇之説文定説得理太多盡堆在裏面朱子曰不是如此底亦壓從這理來問春秋胡文定公之説如何曰尋常亦不滿於胡説且如解經不使道理明白却就其中多使故事大與做時文答䇿相似朝氏公武曰三傳之學穀梁所得最多諸家之解范寧之論最善郝氏經曰三傳之説雖不同要之出於聖人之門而學有所自終不外聖人之書法自王通為三傳作而春秋散之言而盧同輩遂謂三傳當束髙閣而獨抱遺經陸淳啖助趙匡等因之遂創為之傳自是春秋之學不專於三傳矣虞氏集曰昔之傳春秋者有五家鄒夾先亡學春秋者據左氏以記事以觀聖筆之所斷而或議其浮華與經意逺者多矣是以公穀據經以立義專門之家是以尚焉唐啖趙師友之間始知求聖人之意於聖人手筆之書宋之大儒以為可與三傳並治者明其能專求於經也然傳亡存者惟纂例等書意其傳之所發明無出於所存之書者清江劉氏權衡三傳得之為多而其所為傳用意奧深非博洽於典禮舊文者不足以盡明之是以知者鮮矣日講春秋解義總説
