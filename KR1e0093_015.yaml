body:
  text: 欽定四庫全書日講春秋解義卷十五僖公公名申莊公之子閔公之兄諡法小心畏忌曰僖周惠王十八年魯僖公八年惠王崩子襄王立鄭文公十四年魯僖公三十二年文公卒子穆公蘭立齊桓公二十七年魯僖公十七年桓公卒寺人貂作亂立無虧僖十八年殺無虧孝公昭立僖二十七年孝公卒弟昭公潘立宋桓公二十三年魯僖公九年桓公卒子襄公兹父立僖十九年盟於曹南宋襄公圖霸僖二十一年為鹿上之盟以求諸侯于楚僖二十二年及楚戰敗於泓二十三年襄公卒子成公王臣立晉獻公十八年魯僖公九年獻公卒子奚齊立冬殺奚齊卓子立僖十年弒卓子惠公夷吾立僖二十三年惠公卒懷公圉立僖二十四年殺懷公文公重耳立僖二十八年敗楚人于城濮合諸侯于踐土文公主伯魯僖公三十二年文公卒子襄公歡立僖三十三年敗秦於殽襄公繼伯是年敗狄於箕衛文公元年魯僖公二十五年文公卒子成公立僖二十八年成公奔楚衛元咺奉叔武以受盟于踐土衛成復歸殺叔武晋人執衛侯元咺立公子瑕僖三十年殺瑕衛成公歸衛蔡穆侯十六年魯僖公十四年穆公卒子莊公甲午立曹昭公三年魯僖公七年昭公卒子共公襄立僖二十八年晋文公執曹伯畀宋人是年曹伯歸曹滕詳見隱公元年魯僖公十九年宋執滕宣公陳宣公三十四年魯僖公十二年宣公卒子穆公欵立僖二十八年穆公卒子共公朔立杞杜氏年表武公十二年入春秋至僖公二十三年始載公杞成公卒弟桓公姑容立而考之史記自武公靖公共德公至桓公姑容立共九十六年而無成公一代世本譙周索隱徐廣所說又云惠公生成公桓公各有互異又如春秋所書隱四年伐杞桓三年來朝三年㑹杞莊二十五年伯姬歸杞傳竝不載何公今但當以左傳所載桓公及杜氏年表為正薛魯莊公三十一年載薛伯卒莒詳見隱公元年魯僖公二十六年傳見莒兹平公邾文公七年許穆公三十九年魯僖公四年穆公卒于師僖公業立小邾魯莊公五年書郳黎來至魯僖公七年始書小邾子始爵命也自郳黎來為小邾子天下無未命諸侯矣楚成王十三年魯僖公元年始書楚僖四年齊桓公服楚召陵僖二十二年楚敢宋于泓皆子文為令尹時也僖二十三年子文使子玉為令尹僖二十八年晋敗楚于城濮秦穆公元年魯僖公十五年戰韓始見經僖二十四年納晋文公僖三十三年晋襄公敗秦于殽遂成秦晋七十二年兵爭之始吳詳見隱公元年越詳見隱公元年欽定四庫全書日講春秋解義卷十五僖公名申莊公之子閔公庶兄以惠王十八年即位諡法小心畏忌曰僖元年春王正月左傳元年春不稱即位公出故也國亂身出復入故即位之禮有闕公出復入不書諱之也諱國惡禮也公羊傳公何以不言即位繼弒君子不言即位此非子也僖公者閔公庶兄其稱子何臣子一例也臣繼君猶子繼父穀梁傳繼弒君不言即位正也不書即位未行即位之禮也在禮諸侯臣諸父昆弟故閔僖之嗣位不以兄弟相及為義而禮如子之繼父傳稱臣子一例明此義也齊師宋師曹師次于聶北救邢曹伯公羊穀梁俱作曾師按下城邢書曹師則此作伯左傳文誤也聶北杜注邢地今山東聊城縣東北有聶城齊之西界近邢地也公羊傳救邢救不言次此其言次何不及事也不及事者何邢已亡矣孰亡之蓋狄滅之曷為不言狄滅之為桓公諱也曷為為桓公諱上無天子下無方伯天下諸侯有相滅亡者桓公不能救則桓公耻之曷為先言次而後言救君也據叔孫豹次雍榆先言救今後言救者豹為臣當先通君命此諸侯故先言次君則其稱師何不與諸侯專封也曷為不與實與而文不與文曷為不與諸侯之義不得専封也諸侯之義不得專封則其曰實與之何上無天子下無方伯天下諸侯有相滅亡者力能救之則救之可也穀梁傳救不言次言次非救也非救而曰救何也遂齊侯之意也録其本意是齊侯與齊侯也何用見其是齊侯也曹無師曹師者曹伯也小國卿將稱人不得稱師稱師則是曹伯也其不言曹伯何也以其不言齊侯不可言曹伯也其不言齊侯何也以其不足乎揚救不及事不足稱揚不言齊侯也救急辭也次緩辭也邢之患狄亟矣桓公合三國之師兵力有餘而宿師聶北坐視其敝故稱師書次責其衆可救而徒次以為聲援致邢之不保其國非拯急恤困之道也夏六月邢遷于夷儀夷儀公羊作陳儀後同杜注邢地今直隸邢臺縣西有夷儀城俗訛為隨宜城是也左傳諸侯救郉郉人潰出奔師奔聶北之師師遂逐狄人具邢器用而遷之師無私焉皆撰具還之無所私取夏邢遷于夷儀公羊傳遷者何其意也意自欲遷遷之者何非其意也穀梁傳遷者猶得其國家以往者也其地邢復見也非若宋人遷宿滅不復見齊師宋師曹師城邢左傳諸侯城之救患也凡侯伯救患分災討罪禮也公羊傳此一事也曷為復言齊師宋師曹師不復言師則無以知其為一事也穀梁傳是向之師也使之如改事然是向聶北之師重言師者若不因前事更來城邢也美齊侯之功也諸侯救邢不亟邢遂奔潰書邢遷于夷儀而齊師緩不及事之罪著矣復序城邢之師者以齊桓志義終有救患之功也蓋始緩于救邢聖人不以功掩過卒能城邢亦不以過掩功此春秋定功過之權衡也不曰城夷儀者邢既遷則夷儀即邢國也秋七月戊辰夫人姜氏薨于夷齊人以歸公羊傳夷者何齊地也齊地則其言齊人以歸何夫人薨于夷則齊人以歸夫人薨于夷則齊人曷為以歸桓公召而縊殺之穀梁傳夫人薨不地地故也不言以喪歸非以喪歸也加喪焉諱以夫人歸也先書薨則似夫人至夷而死然後齊人以其喪歸諱言夫人為齊人所殺也其以歸薨之也夫人薨不書地書薨于夷明不得其死也以歸之義胡氏安國程氏逈皆謂齊以喪歸魯然以歸之後越百七十日而喪始至無是理也經凡言以歸者歸其國如杞伯迎叔姬之喪以歸是也凡言歸者歸于魯如齊人歸公孫敖之喪是也以此斷之蓋殺之於夷而以喪歸齊然後魯請而歸于魯耳不然何以言夫人氏之喪至自齊而不言至自夷與至自乾侯同文乎書齊人以歸所以著齊人殺之也不曰齊侯而曰齊人討賊之詞也楚人伐鄭荆始書楚左傳秋楚人伐鄭鄭即齊故也荆自莊公之世敗蔡伐鄭皆舉其號惟來聘改稱人至是伐鄭稱楚人者蓋時兵衆地大駸駸乎將與齊晉爭衡諸侯畏之故舊史皆稱人而孔子不革俾論世者有考焉八月公㑹齊侯宋公鄭伯曹伯邾人于柳柳公羊作朾杜注宋地陳縣西北有柳城陳縣今河南陳州州境有犖城即柳城也左傳盟于犖謀救鄭也九月公敗邾師于偃偃公羊作纓杜注邾地當在今山東費縣南左傳九月公敗邾師于偃虛丘之戍將歸者也虛丘杜注邾地當在今山東費縣界魯有亂邾使戍虛丘公惡邾受姜氏故要其歸師敗之穀梁傳不日疑戰也疑戰而曰敗勝內也明魯之勝楚人伐鄭齊桓召諸侯謀之將以救鄭此義舉也公與邾人同會未兩月遽以詐敗邾師于此見僖公無安攘之誠矣邾受姜氏公不請于㑹而討之乃既㑹而掩其歸師非禮也詐戰曰敗敗之者為主冬十月壬午公子友帥師敗莒師于酈獲莒拿酈公羊作犁穀梁作麗杜注魯地左傳冬莒人來求賂求還慶父之賂公子友敗諸酈獲莒子之弟拿非卿也嘉獲之也公賜季友汶陽之田及費汶陽田杜注汶水北地定千年齊人歸鄆歡龜隂田三邑皆汶陽也今山東寧陽縣境公羊傳莒拿者何莒大夫也莒無大夫此何以書大季子之獲也何大乎季子之獲季子治內難以正謂拒慶父禦外難以正其禦外難以正奈何公子慶父弒閔公走而之莒莒人逐之將由乎齊齊人不納却反舍于汶水之上使公子奚斯入請季子曰公子不可以入入則殺矣奚斯不忍反命於慶父自南涘北面而哭涘水涯時慶父在汶水之北慶父聞之曰嘻嘻發痛聲此奚斯之聲也諾已諾己皆自畢語曰吾不得入矣于是抗輈經而次輈小車轅莒人聞之曰吾己得子之賊矣以求賂乎魯魯人不與為是興師而伐魯季子待之以偏戰穀梁傳莒無大夫其曰莒拿何也以吾獲之目之也內不言獲此其言獲何也惡公子之紿紿欺也紿者奈何公子友謂莒拿曰吾二人不相說士卒何罪屏左右而相搏搏手搏也公子友處下左右曰孟勞孟勞者魯之寶刀也公子友以殺之然則何以惡乎紿也曰棄師之道也舍三軍之整佻身獨鬬非慎戰之道莒人受賊責賂而以季友主此戰書敗獲何也莒固有罪魯若責以大義使自知不直而還師則善矣至於兵刃既接又以詐謀擒其主將豈以禮止亂之道哉王者之師不貴幸而勝不貴幸而獲此春秋之志也小國之大夫不名以獲於我故名之十有二月丁巳夫人氏之喪至自齊左傳夫人氏之喪至自齊君子以齊人之殺哀姜也為己甚矣女子從人者也女子有三從之義在夫家有罪非父母家所宜討也公羊傳夫人何以不稱姜氏貶曷為貶與弒公也然則曷為不于弒焉貶貶必于重者莫重乎其以喪至也榖梁傳其不言姜以其殺二子貶之也或曰為齊桓諱殺同姓也夫人身為淫亂與弒二君齊桓既正其罪魯人亦當以大義絶之乃復請其喪而齊亦聽之書曰至自齊交譏之也孫邾薨夷皆書夫人姜氏而喪至則削其姓何也正其罪于臣子迎集之時示不宜以夫人之禮治其喪也使齊桓當日能拒魯之請即其死所而葬之則義得矣二年春王正月城楚丘楚丘杜注衛邑朱子詩經集注楚丘在滑州今直隸滑縣東隋衛南廢縣即古楚丘城也案此楚丘之在北者與戎伐几伯之地不同左傳二年春諸侯城楚丘而封衛焉建國謂之封衛舊國以君死國滅故言封不書所㑹後也因魯後至不及㑹期故獨言城公羊傳孰城城衛也曷為不言城衛滅也孰滅之蓋狄滅之曷為不言狄滅之為桓公諱也曷為為桓公諱上無天子下無方伯天下諸侯有相滅亡者桓公不能救則桓公耻之也然則孰城之桓公城之曷為不言桓公城之不與諸侯專封也曷為不與實與而文不與文曷為不與諸侯之義不得專封諸侯之義不得專封則其曰實與之何上無天子下無方伯天下諸侯有相滅亡者力能救之則救之可也穀梁傳楚丘者何衛邑也國而曰城此邑也其曰城何也封衛也則其不言城衛何也衛未遷也其不言衛之遷焉何也不與齊侯專封也其言城之者專辭也故非天子不得專封諸侯諸侯不得專封諸侯雖通其仁以義而不與也故曰仁不勝道仁謂存亡國道謂上下之禮齊桓合諸侯以城楚丘而封衛功莫大焉春秋略而不序何也封國天子之大權非諸侯所得擅也然則城邢何以序三國之師邢國未滅自遷而後城之無專封之嫌衛滅復封此非有天子之命不可書法所以異也或謂不舉諸侯者齊桓以伯命令諸侯各自受功魯奉齊命從本國往非與諸侯同行故不得書諸侯義亦可通夏五月辛巳葬我小君哀姜公羊傳哀姜者何莊公之夫人也書夫人姜氏孫于邾夫人姜氏薨于夷夫人氏之喪至自齊其誅絶之義明矣及其終書日葬書小君書諡更無所貶者此亦春秋端本澄源治于未亂之意也文姜亦然始而不謹終欲正之可乎虞師晉師滅下陽公羊穀梁作夏陽晋始見經下陽杜注虢邑在河東大陽縣今大陽廢縣在山西平陸縣東北又三十里為故下陽城左傳晋荀息請以屈産之乘與垂棘之璧假道于虞以伐虢荀息晋大夫屈杜注地生良馬何休謂屈産為地名今山西石樓縣東南有屈産泉垂棘地名出美玉自晉適虢途出于虞故假道公曰是吾寶也對曰若得道于虞猶外府也公曰宫之竒存焉宫之竒虞臣對曰宫之竒之為人也懦而不能强諫且少長于君君昵之雖諫將不聽親而狎之必輕其言乃使荀息假道于虞曰冀為不道入自顛軨伐鄍三門冀杜注國名平陽皮氏縣東北有冀亭在今山西河津縣東北顛軨杜注河東大陽縣東北有顛軨坂在今山西平陸縣東北鄍杜注虞邑今山西平陸縣東北有故鄍城先是冀嘗伐虞至鄍也冀之既病則亦唯君故言虞報伐冀使病將欲道故稱虞强以說其心今虢為不道保于逆旅以侵敝邑之南鄙逆旅客舍也言虢遣人分依客舍掠晋邉邑敢請假道以請罪于虢虞公許之且請先伐虢喜于厚賂而欲求媚宫之竒諫不聼遂起師夏晋里克荀息帥師㑹虞師伐虢滅下陽先書虞賄故也晋主兵而先書虞惡貪賄也公羊傳虞微國也曷為序乎大國之上使虞首惡也曷為使虞首惡虞受賂假滅國者道以取亡焉其受賂奈何獻公朝諸大夫而問焉曰寡人夜者寢而不寐其意也何諸大夫有進對者曰寢不安與其諸侍御有不在側者與獻公不應荀息進曰虞郭見與見謂見于心也荀息素知獻公欲伐此二國故云爾獻公揖而進之遂與之入而謀曰吾欲攻郭則虞救之攻虞則郭救之如之何願與子慮之荀息對曰君若用臣之謀則今日取郭而明日取虞爾君何憂焉獻公曰然則奈何荀息曰請以屈産之乘與垂棘之白璧往必可得也則寶出之內藏藏之外府馬出之內廄繫之外廄爾君何喪焉獻公曰諾雖然宫之奇存焉如之何荀息曰宫之奇知則知矣雖然虞公貪而好寶見寶必不從其言請終以往于是終以往虞公見寶許諾宫之竒果諫記曰唇亡則齒寒虞郭之相救非相為賜則晋今日取郭而明日虞從而亡爾君請勿許也虞公不從其言終假之道以取郭還四年反取虞還復往故言反虞公抱寶牽馬而至荀息見曰臣之謀何如獻公曰子之謀則已行矣寶則吾寶也雖然吾馬之齒亦已長矣蓋戲之也夏陽者何郭之邑也曷為不繫于郭國之也曷為國之君存焉爾穀梁傳非國而曰滅重夏陽也虞無師其曰師何也以其先晋不可以不言師也其先晋何也為主乎滅夏陽也夏陽者虞虢之塞邑也滅夏陽而虞虢舉矣虞之為主乎滅夏陽何也晋獻公欲伐虢荀息曰君何不以屈産之乘垂棘之璧而借道乎虞也公曰此晉國之寶也如受吾幣而不借吾道則如之何荀息曰此小國之所以事大國也此謂璧馬之屬彼不借吾道必不敢受吾幣如受吾幣而借吾道則是我取之中府而藏之外府取之中廏而置之外廏也公曰宫之竒存焉必不使受之也荀息曰宫之竒之為人也達心而懦又少長于君達心則其言略明逹之人則言必簡要愚者不悟懦則不能彊諫少長于君則君輕之且夫玩好在耳目之前而患在一國之後此中知以上乃能慮之臣料虞君中知以下也公遂借道而伐虢宫之竒諌曰晋國之使者其辭卑而幣重必不便于虞虞公弗聼遂受其幣而借之道宫之竒諫曰語曰脣亡則齒寒其斯之謂與挈其妻子以奔曹獻公亡虢五年而後舉虞荀息牽馬操璧而前曰璧則猶是也而馬齒加長矣晋人為伐虢之謀主兵者晋也而先虞於晋以虞為首惡也晋非假道于虞不能越境出師而虞公貪賂為晋所愚忘脣齒之義戕兄弟之邦春秋蓋深罪虞之滅虢并以自滅也故先書虞師以著其罪下陽者虞虢之塞邑也下陽既失則虢不能自保虢亡則虞不能獨存一邑也而重若國然變文書滅以見虞虢之滅由于滅夏陽也秋九月齊侯宋公江人黃人盟于貫貫公羊作貫澤江杜注江國在汝南安陽縣括地志云安陽故城在新息縣西南新息今河南息縣是也貫杜注宋地梁國蒙縣西北有貫城貫與貫字相似今山東曹縣西南䝉澤故城即古貰國也左傳秋􅉀于貫服江黃也江黃楚與國始來服齊公羊傳江人黃人者何逺國之辭也逺國至矣則中國曷為獨言齊宋王爾大國言齊宋遠國言江黃則以其餘為莫敢不至也穀梁傳貫之􅉀不期而至者江人黃人也江人黃人者遠國之辭也中國稱齊宋逺國稱江黃以為諸侯皆來至也楚人伐鄭𫝑陵中原而江黃在楚東北境為其與國桓公謀楚不先服江黃則無以制其肘腋故因其逺來而與定􅉀服楚之慮周矣惟宋與􅉀不欲重煩諸侯也附鍊左傳齊寺人貂始漏師于多魚寺人內奄豎貂也多魚杜注地名闕齊桓多嬖貂于此始擅貴寵漏泄軍事為齊亂張本虢公敗戎于桑田桑田杜注虢地在𢎞農陜縣東北今河南靈寶縣西稠桑驛即其地也晋卜偃曰虢必亡矣亡下陽不懼而又有功是天奪之鑒而益其疾也必易晋而不橅其民矣不可以五稔稔熟也為下五年晋滅虢張本冬十月不雨公羊傳何以書記異也穀梁傳不雨者勤雨也欲得兩之心勤也明君之恤民楚人侵鄭左傳冬楚人伐鄭鬭章囚鄭聃伯為後年楚伐鄭鄭伯欲成張本楚人兵勢浸彊比年凌鄭若非齊桓有召陵之舉則執宋公盟諸侯不在僖十九年之後矣書人書侵惡楚也三年春王正月不雨夏四月不雨公羊傳何以書記異也穀梁傳不雨者勤雨也一時言不雨者閔雨也閔雨者有志乎民者也每時書不雨傳以為閔雨者以文公之篇自十有二月不雨至秋七月而書自正月不雨至秋七月而書以纍時而後書者為慢於民事而不以不雨為憂則知每時而一書者為勤于民事而以不雨為憂也不雨八越月而不書旱何也凡書旱者雖有時而雨猶以不足為旱若直書不雨則旱不必言矣徐人取舒徐杜注徐國在下邳僮縣東南括地志徐城縣西有大徐城即古徐國也今江南泗州北有古徐城相傳為徐偃王築舒杜注舒國廬江舒縣今江南廬江縣西舒縣古城是公羊傳其言取之何易也易者無守禦之備舒者楚之與國魯頌曰荆舒是懲則荆與舒比而為列國患久矣徐人取舒為齊桓撓楚也按徐偃始稱王故春秋外之楚敗徐徐伐莒是也惟取舒伐英氏得稱人以附齊也舒本附庸之國舊服于楚徐人取以自屬先儒以為滅而書取誤矣六月雨左傳三年春不雨夏六月雨自十月不雨至于五月不曰旱不為災也公羊傳其言六月雨何上雨而不甚也穀梁傳雨云者喜雨也喜雨者有志乎民者也周之六月夏正建巳之月也萬物始盛得雨而大古者以是月雩則是月之雨尤為可喜先書三時不雨蓋未雨而閔憂民之憂此既雨而喜樂民之樂君國子民之道也何休謂僖公飭過求已循省百官放佞臣郭都等理寃獄四百餘人精誠感天不雩而得澍雨蓋天人相與之際其感通有不爽者矣秋齊侯宋公江人黃人㑹于陽榖陽榖杜注齊地在東平須昌縣北今山東陽榖縣東北有故城左傳秋㑹於陽榖謀伐楚也二年楚侵鄭故公羊傳此大㑹也曷為末言爾末者但言㑹不言盟桓公曰無障谷無障斷川谷專水利也水注川曰溪注溪曰谷無貯粟有無當相通無易樹子樹立也無易當立之子無以妾為妻時桓公功德既盛諸侯咸從故不用盟但告誓而已穀梁傳陽榖之㑹桓公委端搢笏而朝諸侯委委貌之冠也端𤣥端之服搢插也笏以記事者也諸侯皆諭乎桓公之志按左氏謀伐楚也自北杏之會至是二十餘年諸侯從齊然必待江黃再㑹而謀始定何也荆楚盛彊憑恃險固雖合諸侯之師未易罙入其阻而制其死命惟披其肘腋附從之國使之內附然後諸侯聲罪致討楚不能無內顧之憂所以陘亭之師甫至而遽受􅉀也桓公欲蓄諸侯之力故江黃二會皆就近而與宋公主之先儒乃謂大會而末言鑿矣冬公子友如齊涖盟公子友榖梁作公子季友涖公羊穀梁作蒞左傳齊侯為陽榖之㑹來尋􅉀冬公子友如齊涖􅉀公羊傳蒞􅉀者何往盟乎彼也其言來盟者何來盟于我也榖梁傳蒞者位也約誓素定今但往其位而盟其不日前定也不言及者以國與之也不言其人亦以國與之也謂舉國為主此內外通例故重見華孫來盟孫良父來盟及荀庚盟之下涖臨也受命而往涖非大夫之專盟也陽穀之㑹魯君未與故齊侯使人來尋盟而季友往涖以聽伐楚之期而受命焉經書涖􅉀者四惟此盟佐齊謀楚有輔霸之善非他􅉀比矣楚人伐鄭左傳楚人伐鄭鄭伯欲成孔叔不可孔叔鄭大夫曰齊方勤我棄德不祥楚自莊十六年以來五加兵於鄭矣齊桓不救而孔叔猶有勤我之言蓋知柳貫陽榖之㑹皆為伐楚救鄭計也附録左傳齊侯與蔡姬乘舟于囿蕩公蔡姬齊侯夫人蕩搖也公懼變色禁之不可公怒歸之未絶之也蔡人嫁之為明年齊侵蔡𫝊四年春王正月公㑹齊侯宋公陳侯衛侯鄭伯許男曹伯侵蔡蔡潰遂伐楚次于陘陘杜注楚地穎川召陵縣南有陘亭今屬河南郾城縣左傳四年春齊侯以諸侯之師侵蔡蔡潰遂伐楚楚子使與師言曰君處北海寡人處南海唯是風馬牛不相及也馬牛風逸蓋末界之微事以喻齊楚逺不相干也不虞君之涉吾地也何故管仲對曰昔召康公命我先君太公曰召康公周太保召公奭太公吕望五侯九伯女實征之以夾輔周室賜我先君履履所踐履之界東至于海西至于河南至于穆陵北至于無棣穆陵杜注齊地今山東臨胊縣東南有穆陵關在大峴山上無棣杜注齊地伏琛齊地記無棣在渤海髙城縣今直隸鹽山縣即古無棣也縣南有無棣溝爾貢包茅不入王祭不共無以縮酒包裹束也茅菁茅也束茅而灌之以酒為縮酒寡人是徴昭王南征而不復昭王成王之孫南巡守涉漢船壞而溺寡人是問對曰貢之不入寡君之罪也敢不共給昭王之不復君其問諸水濵師進次于陘楚不服罪故復進師公羊傳潰者何下叛上也國曰潰邑曰叛其言次于陘何有俟也孰俟俟屈完也榖梁傳潰之為言上下不相得也侵淺事也侵蔡而蔡潰以桓公為知所侵也不土其地不分其民明正也遂繼事也次止也前此數㑹皆謀伐楚而兵先加于蔡蓋以楚𫝑方張稱兵遠伐楚人夙備以逸待勞未可以得志蔡近于楚帥八國之師以震之其橈敗可必也俟蔡既潰而後移師以向楚出其不意俾倉卒不暇為謀而又先之以文告整兵次陘示齊無必戰之心楚有可從之道是以不戰而受盟也然陘亭之師實不足以懾楚故既盟之後滅弦伐黃陵暴如故但不敢復逞志於陳鄭耳夏許男新臣卒榖梁傳諸侯死于國不地死于外地死於師何為不地內桓師也齊桓威德洽著諸侯安之雖卒于外與在國同諸侯卒于外在師則稱師在㑹則稱㑹而許男但書卒者此去師與㑹而復歸其國之驗也蓋召陵地在潁川故遇疾而歸遂卒於其國耳傳乃謂實卒于師而不書易事之實以為褒貶春秋無是法也楚屈完來盟于師盟于召陵召陵杜注潁川縣也今河南郾城縣東有召陵故城左傳夏楚子使屈完如師屈完楚大夫如陘之師觀强弱師退次于召陵完請盟故齊侯陳諸侯之師與屈完乘而觀之乘共載齊侯曰豈不榖是為先君之好是繼與不榖同好如何不榖諸侯謙稱對曰君惠徼福于敝邑之社稷辱收寡君寡君之願也齊侯曰以此衆戰誰能禦之以此攻城何城不克對曰君若以德綏諸侯誰敢不服君若以力楚國方城以為城漢水以為池方城杜注山在南陽葉縣南言其險固以當城池雖衆無所用之屈完及諸侯盟公羊傳屈完者何楚大夫也何以不稱使尊屈完也曷為尊屈完以當桓公也其言盟于師盟于召陵何師在召陵也師在召陵則曷為再言盟喜服楚也何言乎喜服楚楚有王者則後服無王者則先叛夷狄也而亟病中國南夷與北狄交南夷謂楚滅鄧榖伐蔡鄭北狄謂狄滅邢衛至于溫中國不絶若線桓公救中國而攘夷狄卒帖荆帖服也以此為王者之事也其言來何與桓為主也前此者有事矣後此者有事矣則曷為獨于此焉與桓公為主序績也序次也績功也桓公之功績莫大于服是榖梁傳楚無大夫無命卿也其曰屈完何也以其來㑹桓成之為大夫也其不言使權在屈完也則是正乎曰非正也臣無自專之道以其來㑹諸侯重之也來者何內桓師也來者內辭也內桓師故言來于師前定也于召陵得志乎桓公也得志者不得志也屈完來盟桓公退于召陵是屈完得其本志而桓公服楚之志猶未大遂以桓公得志為僅矣屈完曰大國之以兵向楚何也桓公曰昭王南征不反菁茅之貢不至故周室不祭屈完曰菁茅之貢不至則諾昭王南征不反我將問諸江屈完書名氏蓋齊桓心畏楚彊因完受􅉀有辭以退故假以為名也完不稱使以楚使如師本以觀齊之彊弱未嘗有必􅉀之意而其權在完也盟于召陵者退師召陵而後與之盟欲以禮柔楚也或曰前書屈完來􅉀後書盟于召陵而不列序諸侯與楚大夫為桓公諱也齊人執陳轅濤塗轅公羊榖梁作袁左傳陳轅濤塗謂鄭申侯曰轅濤塗陳大夫申侯鄭大夫師出于陳鄭之間國必甚病當有供給之費故若出於東方觀兵于東夷循海而歸其可也申侯曰善濤塗以告齊侯許之申侯見曰師老矣若出于東方而遇敵懼不可用也若出于陳鄭之間共其資糧屝屨屝草屨其可也齊侯說與之虎牢虎牢鄭邑執轅濤塗公羊傳濤塗之罪何辟軍之道也其辟軍之道奈何濤塗謂桓公曰君既服南夷矣何不還師濵海而東服東夷且歸桓公曰諾于是還師濵海而東大陷于沛澤之中草棘曰沛漸洳曰澤顧而執濤塗執者曷為或稱侯或稱人稱侯而執者伯討也稱人而執者非伯討也此執有罪何以不得為伯討古者周公東征則西國怨西征則東國怨桓公假途于陳而伐楚則陳人不欲其反由己者師不正故也不修其師而執濤塗古人之討則不然也榖梁傳齊人者齊侯也其人之何也于是哆然外齊侯也不正其踰國而執也轅濤塗陳大夫恐齊師歸取道于陳沮之使其東行致誤軍道固可罪矣然齊桓不能反求諸己思陳人所以厭苦之故增修其德而遽執濤塗以逞其忿不特桓德之衰而管仲之器小亦於是乎見矣秋及江人黃人伐陳左傳秋伐陳討不忠也穀梁傳不言其人及之者何內師也齊人既執濤塗憤猶未平以江黃近陳故使魯及二國伐之觀此則伐楚之師江黃不㑹蓋用之以為犄角之𫝑明矣或謂書及者䝉上齊人之文蓋齊及之也然考經所書他國再有事必書遂此不言遂實魯及之爾八月公至自伐楚公羊傳楚已服矣何以致伐楚叛􅉀也穀梁傳有二事偶則以後事致後事小則以先事致其以伐楚致大伐楚也兩事書至或原其志而至之或舉其重而至之此侵蔡伐楚不致侵者以伐楚事重䇿勳于廟故因其實而志之也葬許穆公穆公羊作繆左傳許穆公卒于師葬之以侯禮也凡諸侯薨于朝㑹加一等諸侯命有三等公為上等侯伯為中等子男為下等死王事加二等于是有以衮斂衮衣公服也謂加二等冬十有二月公孫兹帥師會齊人宋人衛人鄭人許人曹人侵陳兹公羊作慈後同霸國大夫㑹諸侯大夫侵與國自此始左傳冬叔孫戴伯帥師會諸侯之師侵陳陳成歸轅濤塗戴伯即公孫兹叔牙子戴諡也濤塗既執復帥江黃以伐之合七國之大夫以侵之修怨為已甚矣伐楚之師陳實與焉其臣一謀之不協而陵暴之若此于楚則責之略而待之恭于陳則怒之深而報之過此仲尼之徒所以羞稱五伯也附録左傳初晋獻公欲以驪姬為夫人卜之不吉筮之吉公曰從筮卜人曰筮短龜長物生而後有象象而後有滋滋而後有數龜象筮數故象長數短不如從長且其繇曰專之渝攘公之羭繇卜兆辭渝變也攘除也羭美也言變乃除公之美一薰一蕕十年尚猶有臭薰香草蕕臭草十年有臭言善易消惡難除必不可弗聽立之生奚齊其娣生卓子及將立奚齊既與中大夫成謀姬謂太子曰君夢齊姜必速祭之齊姜太子母言求食太子祭于曲沃歸胙于公公田姬置諸宫六日公至毒而獻之毒酒經宿輒敗而經六日明公之惑公祭之地地墳墳起也與犬犬斃與小臣小臣亦斃姬泣曰賊由太子太子奔新城新城曲沃公殺其傅杜原欵或謂太子子辭君必辨焉以六日之狀自理太子曰君非姬氏居不安食不飽我辭姬必有罪君老矣吾又不樂曰子其行乎太子曰君實不察其罪被此名也以出人誰納我十二月戊申縊于新城姬遂譖二公子曰皆知之重耳奔蒲夷吾奔屈日講春秋解義卷十五
