body:
  text: 欽定四庫全書日講春秋解義卷五十九定公九年春王正月附錄左傳九年春宋公使樂大心盟于晉且逆樂祁之尸辭僞有疾乃使向巢如晉盟巢向戌曾孫且逆子梁之尸子梁樂祁子明謂桐門右師出子明樂祁子溷右師樂大心子明族父也右師時往子明舎子明逐使去曰吾猶衰絰而子擊鐘何也忿其不逆父喪因責其無同族之恩右師曰喪不在此故也既而告人曰己衰絰而生子己子明也余何故舍鐘子明聞之怒言于公曰右師將不利戴氏樂氏戴公族不肯適晉將作亂也不然無疾乃逐桐門右師逐之在明年終叔孫舎之言鄭駟歂殺鄧析而用其竹刑鄧析鄭大夫昭六年子產鑄刑書析别造刑法書之竹簡故云竹刑君子謂子然于是不忠子然駟歂苟有可以加于國家者棄其邪可也加猶益也棄不責其邪惡也靜女之三章取彤管焉詩邶風彤管赤管筆女史記事規誨之所執靜女詩三章雖説美女義在彤管記事爲婦人大法故全篇取之不棄上下之二章也竿旄何以告之取其忠也詩鄘風錄竿旄詩者取其中心願告人以善道也言此二詩皆以一善見采而鄧析不以一善存身故用其道不棄其人詩云蔽芾甘棠勿翦勿伐召伯所茇詩召南召伯决訟于蔽芾甘棠之下詩人思之不伐其樹茇草舎也思其人猶愛其樹况用其道而不恤其人乎子然無以勸能矣傳言子然嗣太叔爲政鄭所以衰弱夏四月戊申鄭伯蠆卒蠆公羊作囆得寳玉大弓左傳夏陽虎歸寳玉大弓無益近用而祗爲名故歸之書曰得器用也凡獲器用曰得器用謂物之成器可爲人用者得用焉曰獲謂用器物以有獲若麟爲田獲俘爲戰獲六月伐陽關討陽虎陽虎使焚萊門萊門陽關邑門師驚犯之而出奔齊請師以伐魯曰三加必取之三加兵于魯齊侯將許之鮑文子諫曰文子鮑國臣嘗爲隸于施氏矣施氏魯大夫成十七年齊人召文子而立之于今七十四年文子蓋九十餘矣魯未可取也上下猶和衆庶猶睦能事大國大國晉也而無天菑若之何取之陽虎欲勤齊師也齊師罷大臣必多死亡已于是乎奮其詐謀夫陽虎有寵于季氏而將殺季孫以不利魯國而求容焉親富不親仁君焉用之君富于季氏而大于魯國兹陽虎所欲傾覆也魯免其疾而君又収之無乃害乎齊侯執陽虎將東之陽虎願東陽虎欲西奔晉知齊必反已故詐以東爲願乃囚諸西鄙盡借邑人之車鍥其軸麻約而歸之鍥刻也欲絶追者載蔥靈蔥靈輜車前後有蔽寢于其中而逃追而得之囚于齊又以蔥靈逃奔宋遂奔晉適趙氏仲尼曰趙氏其世有亂乎受亂人故公羊傳何以書國寳也喪之書得之書穀梁傳其不地何也寶玉大弓在家則羞不目羞也國之大寶在家則羞也况陪臣專之乎恥甚而不目其地惡得之得之堤下或曰陽虎以解衆也寶玉大弓既竊於盜何以復得蓋陽虎懼魯師將至遺於道路以爲緩追之計耳追者獲之以歸故府故書曰得幸之也且明佚盜也不地未出境也六月葬鄭獻公秋齊侯衞侯次于五氏五氏杜注晉地蓋晉大夫邯鄲午之私邑今直隸邯鄲縣西有五氏城亦曰寒氏城左傳秋齊侯伐晉夷儀爲衞討也敝無存之父將室之無存齊人室之爲取婦辭以與其弟曰此役也不死反必娶于髙國言欲有功還取貴族之女先登求自門出死于霤下鬬死于門屋霤下也東郭書讓登登城非人所樂故讓衆使後而已先登犂彌從之曰子讓而左我讓而右使登者絶而後下恐書先下故又譎以讓之下入城也書左彌先下書與王猛息戰訖共止息王猛齊人猛曰我先登書斂甲曰曩者之難今又難焉斂甲起欲擊猛猛笑曰吾從子如驂之靳靳車中服馬也外二馬謂之驂少次服後蓋不敢與書爭晉車千乘在中牟救夷儀也中牟杜注滎陽有中牟縣逈逺疑非也正義蕩陰縣西有牟山中牟蓋在山側今河南湯陰縣西有中牟城在牟山下是其地也衞侯將如五氏齊侯在五氏將往助之卜過之道過中牟畏晉故卜龜焦兆不成衞侯曰可也衞車當其半寡人當其半敵矣衞侯怒晉甚不復顧卜欲以身當五百乗乃過中牟中牟人欲伐之衞褚師圃亡在中牟褚師圃衞舊大夫曰衞雖小其君在焉未可勝也齊師克城而驕城謂夷儀也其帥又賤帥東郭書遇必敗之不如從齊乃伐齊師敗之獲齊車五百乘事見哀十五年齊侯致禚媚杏于衞三邑杜注皆齊西界媚當在今禹城縣杏當在今博平縣齊侯賞犂彌犂彌辭曰有先登者臣從之晳幘而衣貍製晳白也幘齒上下相値製裘也公使視東郭書曰乃夫子也吾貺子公賞東郭書辭曰彼賓旅也言彌與已若賓主相讓旅俱進退乃賞犂彌齊師之在夷儀也齊侯謂夷儀人曰得敝無存者以五家免給其五家令常不供役事乃得其尸公三襚之襚衣也比殯三加襚深禮厚之與之犀軒與直蓋犀軒以犀皮爲飾卿之車也直蓋髙蓋而先歸之坐引者以師哭之停喪車以盡哀也君方爲位而哭故挽喪者不敢立親推之三齊侯自推喪車輪三轉齊衞伐晉不書伐而書次者蓋二國雖有玩晉之心而晉勢尚彊未敢輕伐聊次五氏以觀其釁故不以伐告其後又次于垂葭又次于渠蒢至哀元年而後伐則其欲有所逞也久矣秦伯卒冬葬秦哀公秦自晉悼以後寖不見於經蓋退保西陲軍旅朝聘之事不交於中國卒葬得書從告也十年春王三月及齊平左傳十年春及齊平平侵齊之怨也時諸侯惟魯從晉至是亦叛列國無盟主矣及者内志也一國所欲故不稱公夏公會齊侯于夾谷公至自夾谷夾公羊穀梁作頰夾谷杜注即祝其也地理志濟南淄川縣西南有甲山亦名夾山一名祝山上有夾谷臺案淄川去魯甚逺今萊蕪縣有夾谷峪名勝志以爲萊兵劫魯侯處意近之左傳夏公㑹齊侯于祝其實夾谷孔丘相犂彌言于齊侯曰孔丘知禮而無勇若使萊人以兵劫魯侯必得志焉萊人齊滅萊所俘之人齊侯從之孔丘以公退曰士兵之以兵擊萊人兩君合好而裔夷之俘以兵亂之裔逺也非齊君所以命諸侯也裔不謀夏夷不亂華俘不干盟兵不偪好于神爲不祥盟將告神犯之爲不善于德爲愆義于人爲失禮君必不然齊侯聞之遽辟之辟去萊兵也將盟齊人加于載書曰齊師出境而不以甲車三百乘從我者有如此盟如此盟詛之禍孔丘使兹無還揖對曰無還大夫魯而不反我汶陽之田吾以共命者亦如之要盟不潔故畧不書齊侯將享公孔丘謂梁丘據曰齊魯之故舊典吾子何不聞焉事既成矣㑹事成而又享之是勤執事也且犧象不出門犧象酒器犧尊象尊也嘉樂不野合嘉樂鐘磬也饗而既具是棄禮也若其不具用秕稗也秕穀不成者稗草似穀者言享不具禮穢薄若秕稗用秕稗君辱棄禮名惡子盍圖之夫享所以昭德也不昭不如其已也乃不果享孔子知齊侯懷詐故以禮拒之齊人來歸鄆讙龜隂之田陽虎九年以此奔齊經在圍衞下而傳在前者次魯事鄆讙龜陰杜注三邑皆汶陽田泰山博縣北有龜山陰田在其北也今龜山在新泰縣西南泗水縣東北穀梁傳離㑹不致二國㑹曰離何爲致也危之也危之則以地致何也爲危之也其危柰何曰頰谷之會孔子相焉兩君就壇兩相相揖齊人鼓譟而起羣呼曰譟欲以執魯君孔子歴階而上不盡一等階㑹壇之階而視歸乎齊侯曰兩君合好夷狄之民何爲來爲命司馬止之齊侯逡廵而謝曰寡人之過也退而屬其二三大夫曰夫人率其君與之行古人之道屬語也夫人謂孔子二三子獨率我而入夷狄之俗何爲罷㑹齊人使優施舞于魯君之幕下優俳施其名也欲嗤笑魯君孔子曰笑君者罪當死使司馬行法焉首足異門而出齊人來歸鄆讙龜陰之田者蓋爲此也因是以見雖有文事必有武備孔子于頰谷之㑹見之矣齊魯相仇始於陽虎至是虎敗孔子與聞國政既已講信修睦而與齊平齊景志在求霸亦欲親魯以爲援遂歡然釋憾㑹于夾谷成禮而還左氏穀梁載却萊兵索汶陽田事皆欲侈張聖人而不知其陋也夫聖人過化存神從容揖讓暴慢自戢如傳所稱則春秋戰國之士多優爲之而謂孔子出此乎晉趙鞅帥師圍衞左傳晉趙鞅圍衞報夷儀也前年齊爲衞伐晉夷儀初衞侯伐邯鄲午于寒氏邯鄲杜注廣平縣今直隸邯鄲縣西南有故城午晉邯鄲大夫寒氏即五氏也前年衞人助齊伐五氏城其西北而守之宵熸午衆宵散及晉圍衞午以徒七十人門于衞西門殺人于門中衞開門與午鬭曰請報寒氏之役涉佗曰夫子則勇矣然我往必不敢啓門亦以徒七十人旦門焉步左右皆至而立如植佗先至步行門左右然後其徒皆至而立如植木不動以示整日中不啓門乃退反役晉人討衞之叛故曰由涉佗成何于是執涉佗以求成于衞捘衞侯手故衞人不許晉人遂殺涉佗成何奔燕君子曰此之謂棄禮必不鈞言必見殺不得與人等詩曰人而無禮胡不遄死涉佗亦遄矣哉詩鄘風遄速也討五氏之次也晉自召陵以後凡用兵書侵以義之不足以服人也此役書圍以力之不足以服人也齊人來歸鄆讙龜陰田田上穀梁有之字公羊傳齊人曷爲來歸運讙龜陰田孔子行乎季孫三月不違不言行乎定公者政在季氏齊人爲是來歸之取濟西取汶陽言取不言歸以其介大國而得之故書曰取歸濟西歸讙及闡言歸不言來以其請之而後得非彼自以歸也此則齊人服義自以地歸魯非假兵力智計而得之與前後歸田者異故言來歸叔孫州仇仲孫何忌帥師圍郈左傳初叔孫成子欲立武叔公若藐固諫曰藐叔孫氏之族不可成子立之而卒公南使賊射之不能殺公南叔孫家臣武叔之黨射公若公南爲馬正使公若爲郈宰武叔既定使郈馬正侯犯殺公若弗能其圉人曰吾以劍過朝公若必曰誰之劍也吾稱子以告必觀之吾僞固而授之末則可殺也圉人武叔之圉人僞爲固陋不知禮者以劍鋒末授之欲因推而殺之使如之公若曰爾欲吳王我乎見劍向已逆呵之鱄諸殺吳王亦用劍刺之遂殺公若侯犯以郈叛犯以不能副武叔命故叛武叔懿子圍郈弗克秋叔孫州仇仲孫何忌帥師圍郈郈公羊作費左傳秋二子及齊師復圍郈弗克叔孫謂郈工師駟赤曰工師掌工匠之官郈非唯叔孫氏之憂社稷之患也將若之何對曰臣之業在揚水卒章之四言矣揚水詩唐風卒章四言曰我聞有命叔孫稽首謝其受己命駟赤謂侯犯曰居齊魯之際而無事必不可矣無所服事子盍求事于齊以臨民不然將叛侯犯從之齊使至駟赤與郈人爲之宣言于郈中曰詐爲齊使言侯犯將以郈易于齊齊人將遷郈民衆兇懼駟赤謂侯犯曰衆言異矣不與始同子不如易于齊與其死也猶是郈也而得紓焉何必此言以郈易取齊邑與郈無異勝于守郈爲叛人所殺齊人欲以此偪魯必倍與子地且盍多舎甲于子之門以備不虞侯犯曰諾乃多舎甲焉侯犯請易于齊齊有司觀郈將至駟赤使周走呼曰齊師至矣郈人大駭介侯犯之門甲以圍侯犯駟赤將射之僞爲犯射郈人侯犯止之曰謀免我侯犯請行許之郈人四許之馬赤先如宿宿杜注故宿國侯犯殿毎出一門郈人閉之閉其後門及郭門止之曰子以叔孫氏之甲出有司若誅之羣臣懼死駟赤曰叔孫氏之甲有物吾未敢以出物識也赤還救侯犯也犯謂駟赤曰子止而與之數數甲以相付駟赤止而納魯人侯犯奔齊齊人乃致郈致其名簿也爲下武叔如齊傳郈叔孫氏邑書圍則叛可知以二卿伐之自夏至秋再圍而不克則家臣之彊亦可知矣春秋之始王室初卑諸侯擅命其後諸侯少怠而大夫傾公室以自張至是家臣復擬其後爭爲叛竊逆道彌甚召禍彌速而春秋以終此天下之勢也宋樂大心出奔曹宋公子地出奔陳地公羊作池左傳宋公子地嬖蘧富獵地宋景公弟辰之兄也十一分其室而以其五與之與富獵也公子地有白馬四公嬖向魋魋欲之向魋司馬桓魋也公取而朱其尾鬛以與之與向魋地怒使其徒抶魋而奪之魋懼將走公閉門而泣之目盡腫母弟辰曰子分室以與獵也而獨卑魋亦有頗焉子爲君禮禮辟君也不過出竟君必止子公子地出奔陳公弗止辰爲之請弗聽辰曰是我迋吾兄也迋欺也吾以國人出君誰與處冬母弟辰暨仲佗石彄出奔陳佗仲幾子彄禇師叚子皆宋卿衆之所望故言國人冬齊侯衞侯鄭游速會于安甫安甫公羊作鞌杜注安甫地闕盟鹹盟沙特相盟耳今則諸國參會益無憚於晉矣叔孫州仇如齊左傳武叔聘于齊謝致郈也傳在辰奔後經書在前從告齊侯享之曰子叔孫若使郈在君之他竟寡人何知焉屬與敝邑際故敢助君憂之以致郈得叔孫對曰非寡君之望也所以事君封疆社稷是以以猶爲也敢以家隸勤君之執事夫不令之臣天下之所惡也君豈以爲寡君賜言義在討惡也夾谷之會齊人既歸魯田侯犯奔齊齊又致郈故卿往謝之宋公之弟辰暨仲佗石彄出奔陳暨下公羊穀梁有宋字宋大夫公子母弟奔者三樂大心以讒奔公子地以向魋之嬖奔辰爲地請畱不許亦以魋奔也仲佗石彄稱暨暨者不得已之辭見脅於辰不能自主也宋公以寵魋故奔其二弟辰以地故自絶於君又率二卿以行佗彄身爲卿佐有君不事而惟辰是從皆罪也一書而竝見矣十有一年春宋公之弟辰及仲佗石彄公子地自陳入于蕭以叛蕭杜注宋邑穀梁傳宋公之弟辰未失其弟也言未失其爲弟之道及仲佗石彄公子地以尊及卑也自陳陳有奉焉爾入于蕭以叛入者内弗受也以者不以也叛直叛也夏四月秋宋樂大心自曹入于蕭左傳十一年春宋公母弟辰暨仲佗石彄公子地入于蕭以叛秋樂大心從之大爲宋患寵向魋故也出奔陳則稱暨入于蕭以叛則稱及及非不得已之辭得已而不已者也辰雖始禍而佗彄與地果於從逆其罪無别故不稱暨叛人羣聚於蕭而大心自曹入之其從叛可知矣故不書叛冬及鄭平叔還如鄭涖盟涖公羊穀梁作莅左傳冬及鄭平始叛晉也魯自僖公以來世服於晉及范荀納貨同盟解體齊張於東鄭衞先往魯及齊平然猶未顯與晉絶也至是魯鄭同盟四國之好成晉遂失諸侯不可復收矣十有二年春薛伯定卒夏葬薛襄公春秋書薛伯卒者三葢至是晉霸既衰三桓强盛自比於小國邦交始通故赴及而魯必㑹其葬也不書月曰史略之叔孫州仇帥師墮郈穀梁傳墮猶取也衞公孟彄帥師伐曹左傳十二年夏衞公孟彄伐曹克郊郊杜注曹邑當在今山東曹縣界還滑羅殿羅衞大夫未出不退于列未出曹竟羅不退在行列之後其御曰殿而在列其爲無勇乎羅曰與其素厲寧爲無勇素空也厲猛也言伐小國當如畏者以誘致之此及十三年再書衞彄伐曹著列國無盟主也彄衞侯兄縶子縶字公孟故其子以字爲氏季孫斯仲孫何忌帥師墮費左傳仲由爲季氏宰將墮三都仲由子路三都費郈成也强盛將爲國害故欲毁之于是叔孫氏墮郈季氏將墮費公山不狃叔孫輒帥費人以襲魯不狃費宰公與三子入于季氏之宫登武子之臺費人攻之弗克入及公側至臺下仲尼命申句須樂頎下伐之二子魯大夫孔子時爲司寇費人北國人追之敗諸姑蔑姑蔑魯地括地志在泗水縣東今縣治東南有故城二子奔齊二子不狃叔孫輒遂墮費公羊傳曷爲帥師墮郈帥師墮費孔子行乎季孫三月不違曰家不藏甲邑無百雉之城于是帥師墮郈帥師墮費雉者何五板而堵五堵而雉百雉而城墮都之事孔子因其機而爲之蓋三家之城其邑將以自利也而家臣憑倚其城數叛而不能制非獨魯患之三家亦患之矣孔子行乎季孫制國以禮謂都城無過百雉適有動乎三家之心於是各帥其衆自墮其邑絶不疑其害己此固有不言而信不怒而威者矣墮郈以一卿墮費以二卿者費彊於郈故也秋大雩冬十月癸亥公㑹齊侯盟于黄齊公羊作晉誤隱六年盟于艾齊魯爲盟之始也而齊霸遂興書以志諸侯之合此盟于黄齊魯爲盟之終也而晉霸遂失書以志諸侯之散此亦春秋之始終也十有一月丙寅朔日有食之公至自黄十有二月公圍成公至自圍成左傳將墮成公斂處父謂孟孫墮成齊人必至于北門成在魯北竟故且成孟氏之保障也無成是無孟氏也子僞不知我將不墮冬十二月公圍成弗克穀梁傳非國言圍圍成大公也何以致危之也何危爾邊乎齊也三家孟氏最弱季叔爲彊費郈已墮而成不墮者蓋因公斂處父之言覺其不利於己而三家之慮變矣且費郈之叛荐爲叔季之害而公斂在成方有功於孟氏則孟氏之不肯以師墮也固宜故經不言三家直書公公行非越境不書至致圍成危之也日講春秋解義卷五十九
