body:
  text: 欽定四庫全書日講春秋解義卷三隱公五年春公觀魚于棠觀左作矢棠今山東魚臺縣魚亭山是其處左傳五年春公將如棠觀魚者魚捕魚也魚者猶言獵者臧僖伯諫曰臧僖伯公子彄也諡曰僖凡物不足以講大事大事祀與戎其材不足以備器用材謂皮革齒牙骨角毛羽器用軍國之器則君不舉焉君將納民于軌物者也故講事以度軌量謂之軌取材以章物采謂之物不軌不物謂之亂政亂政亟行所以敗也故春搜夏苗秋獮冬狩搜索也擇取不孕者苗為苗除害也獮殺也以殺為名順秋氣也狩圍守也冬物畢成獲則取之無所擇也皆于農隙以講事也三年而治兵入而振旅雖四時講武猶復三年大習振整也歸而飲至以數軍實數車徒器械及所獲也昭文章車服旌旗明貴賤辨等列順少長出則少者在前還則在後所謂順也習威儀也鳥獸之肉不登于俎俎祭宗廟器皮革齒牙骨角毛羽不登于器以飾法度之器則公不射古之制也若夫山林川澤之實器用之資皂隸之事士臣皂皂臣輿輿臣隸官司之守非君所及也公曰吾將略地焉略總攝巡行之名言欲案行邊竟遂往陳魚而觀之陳設也謂大設捕魚之備而觀之僖伯稱疾不從書曰公矢魚于棠矢亦陳也非禮也且言遠地也棠實他竟故曰遠地公羊傳何以書譏何譏爾遠也公曷為遠而觀魚登來之也齊人語也齊人名求得為得來作登來者由口授也百金之魚公張之張謂張罔罟正以價值百金故言得來之登來之者何美大之之辭也棠者何濟上之邑也穀梁傳傳曰常事曰視視朔之類非常曰觀觀魚之類禮尊不親小事卑不尸大功尸主魚卑者之事也周禮漁人中士下士公觀之非正也君舉必書故諸侯非朝覲會同省耕省斂不得輕出隱公慢棄國政遠事逸遊託略地之説拒諫飾非故特書其事以志非禮附録左傳曲沃莊伯以鄭人邢人伐翼曲沃晉别封成師之邑今山西聞喜縣莊伯成師子翼晉舊都今山西翼城縣王使尹氏武氏助之尹氏武氏皆周世族大夫翼侯奔隨隨杜注晉地今山西介休縣東有古隨城晉內相攻伐不告亂故不書傳具其事為後晉事張本夏四月葬衛桓公左傳夏葬衛桓公衛亂是以緩有州吁之亂十四月乃葬明其非慢穀梁傳月葬故也衛桓公被弒至是閲十四月而後得葬魯往會之故書弒逆人道之大變送終臣子之大事君弒而臣子能討賊以葬其君然後送終之道盡故春秋於見弒之君必賊既討而後書葬也諡者行之迹也衛侯見弒而諡以桓名實乖矣周制五等諸侯禮辭皆稱公又有公食大夫禮葬以鄰國會之為義故從周之文而不革也附録左傳四月鄭人侵衛牧牧衛邑今河南汲縣地以報東門之役東門役在四年衛人以燕師伐鄭燕南燕國姞姓伯爵今汲縣西有古東燕城鄭祭足原繁泄駕以三軍軍其前使曼伯與子元潛軍軍其後燕人畏鄭三軍而不虞制人制北制鄭邑六月鄭二公子以制人敗燕師于北制二公子曼伯子元也君子曰不備不虞不可以師曲沃叛王秋王命虢公伐曲沃而立哀侯于翼翼侯子光秋衛師入郕郕公羊作盛國名姬姓伯爵今山東寧陽縣北有盛鄉城左傳衛之亂也郕人侵衛故衛師入郕公羊傳曷為或言率師或不言率師將尊師衆稱某率師將尊謂大夫師衆者滿二千五百人以上將尊師少稱將師少者不滿二千五百人將卑師衆稱師將卑謂士將卑師少稱人君將不言率師書其重者也穀梁傳入者內弗受也郕國也將卑師衆曰師衛與郕皆文之昭也郕乘亂侵衛固為非禮衛宣繼州吁暴亂之後當懲艾修德以固邦本以恤民力乃輕動大衆以入同姓之國故書衛師入郕譏其用衆而逞暴也九月考仲子之宮公羊傳考宮者何考猶入室也始祭仲子也考成也成仲子之宮廟而祭之猶生人入宮室必有飲食之事桓未君則曷為祭仲子隱為桓立故為桓祭其母也然則何言爾成公意也穀梁傳考者何也考者成之也成之為夫人也立其廟世祭之成夫人之禮禮庶子為君為其母築宫使公子主其祭也公當奉宗廟故不得自主别廟之祭公子者長子之弟及妾之子于子祭于孫止仲子者惠公之母隱孫而修之非隱也非責也仲子者惠公之妾桓公之母宮始成而祭之曰考禮諸侯無二嫡庶子既立為君則為其母别立宫以祀之其祭也以公子主之君不親祭尊宗廟也桓未為君何以為其母立廟隱將舉國而讓之也經於來賵考宮皆書仲子而其不得為嫡明矣隱公攝讓之實辨矣桓公篡弒之罪昭矣凡宮廟之立非失禮不書此著其不宜立也不書立宫而書考宮蓋連下初獻六羽以為義初獻六羽左傳九月考仲子之宮將萬焉萬舞也公問羽數于衆仲對曰天子用八八八六十四人諸侯用六六六三十六人大夫四四四十六人士二二二四人士有功賜用樂夫舞所以節八音而行八風八音金石絲竹匏土革木八風八方之風為調風明庶風清明風景風涼風閶闔風不周風廣莫風節者使音聲有作止之序行者宣布其風氣也故自八以下惟天子得盡物數故以八為列諸侯則不敢用八公從之于是初獻六羽始用六佾也公羊傳初者何始也六羽者何舞也初獻六羽何以書譏何譏爾譏始僣諸公也六羽之為僣奈何天子八佾諸公六諸侯四諸公者何諸侯者何天子三公稱公王者之後稱公其餘大國稱侯小國稱伯子男天子三公者何天子之相也天子之相則何以三自陜而東者周公主之自陜而西者召公主之一相處乎內始僣諸公昉于此乎前此矣前此則曷為始乎此僣諸公猶可言也僣天子不可言也穀梁傳初始也穀梁子曰舞夏夏大也天子八佾諸公六佾諸侯四佾初獻六羽始僣樂矣尸子曰舞夏自天子至諸侯皆用八佾初獻六羽始厲樂矣言時諸侯皆僭用八佾魯于是能自減厲而始用六穀梁子言其始僣尸子言其始降舊説成王特賜周公以天子之禮樂故魯得以八佾祀周公然猶止於周公之廟耳至其後羣公皆僣用焉仲子以别宮故不敢上同羣廟而用六羽書初獻者明前此用八之僣也不謂之佾而曰羽者佾乃干羽之總稱羽以象文德干以象武功婦人無武事則獨奏文樂故謂之羽而不曰佾也春秋於魯之郊禘皆因事而書以志其僣故僣用八佾亦因考仲子之宮而書初獻以明之若仲子之不宜别宮獻羽則不待貶而自見矣邾人鄭人伐宋左傳宋人取邾田邾人告于鄭曰請君釋憾于宋敝邑為道釋四年再見伐之憾鄭人以王師會之鄭莊為王卿士故得用王師不書不以告也伐宋入其郛以報東門之役東門役在四年宋人使來告命公聞其入郛也將救之問于使者曰師何及對曰未及國公怒乃止怒其詭辭辭使者曰君命寡人同恤社稷之難今問諸使者曰師未及國非寡人之所敢知也為七年公伐邾傳邾搆鄭以伐宋則主兵者邾也故序鄭上凡班序上下以國之大小從禮之常也而會盟侵伐以主者先因事之變也故僖二十七年楚人陳侯蔡侯鄭伯許男圍宋大夫主兵亦序於諸侯之上所以著事端所由起以别其善惡之所歸也螟此書蟲災之始公羊傳何以書記災也穀梁傳蟲災也甚則月不甚則時蟲食苗心曰螟言其害在內冥冥難知也稼穡為民生首務螟之害稼國之災也春秋於災異必書示人君當恐懼修省以謹天戒恤民隱也冬十有二月辛巳公子彄卒左傳冬十二月辛巳臧僖伯卒公曰叔父有憾于寡人恨諫觀魚不聼寡人弗敢忘葬之加一等榖梁傳隱不爵命大夫隱居攝故不爵命大夫其曰公子彄何也先君之大夫也公子不為大夫則不稱公子彄稱公子以公葬之有加禮也觀魚之諫公雖不聽而猶不忘其忠死而加禮於義為得然知其忠而不納其言則與郭公之善善而不能用等耳宋人伐鄭圍長葛此書圍之始長葛杜注鄭邑今河南長葛縣有故城左傳宋人伐鄭圍長葛以報入郛之役也公羊傳邑不言圍據伐於餘丘不言圍此其言圍何強也惡其強而無義必欲得邑穀梁傳伐國不言圍邑此其言圍何也久之也以此冬圍之至六年冬乃取之也伐不踰時戰不逐奔誅不填服填厭苞人民毆牛馬曰侵苞制也斬樹木壞宫室曰伐環而攻之曰圍以此年之冬圍至六年之冬而後取之直書而惡自見矣外伐國圍邑四自僖公後無復見於經者春秋之初猶以圍邑為重也兵爭日多疆埸之邑一彼一此攻奪無常則不復赴告於鄰國矣六年春鄭人來輸平輸左作渝左傳六年春鄭人來渝平更成也渝變也公之為公子戰于狐壤為鄭所執逃歸怨鄭鄭伐宋公欲救宋宋使者失辭公怒而止忿宋則欲厚鄭鄭因此而來故經曰渝平傳曰更成公羊傳輸平者何輸平猶墮成也何言乎墮成敗其成也曰吾成敗矣吾魯也吾與鄭人末有成也吾與鄭人則曷為末有成狐壤之戰隱公獲焉然則何以不言戰諱獲也君獲不言師敗績故以輸平諱也穀梁傳輸者墮也平之為言以道成也來輸平者不果成也春秋前魯與鄭平四年翬與宋伐鄭故來絶魯壞前平也平者兩國昔有怨忿解釋而使之平也輸謂輸寫其情鄭何為輸情而求平於魯以利相結而離魯宋之黨也據左氏公之未立與鄭人戰于狐壤止焉元年與宋盟于宿四年遇于清其秋會師伐鄭即魯宋為黨而與鄭有怨明矣五年鄭人伐宋宋來告命使者失辭公怒不救鄭人知其間可乘故來輸平而自是魯遂合於鄭也何以知其以利相結也後此鄭來歸祊而公遂會鄭伐宋取郜及防皆歸於我則其輸平乃以利相結可知矣公榖以輸平為墮成非也前此魯鄭未嘗結好不宜言墮左氏作渝謂變前惡而為和好以前年翬會伐鄭證之於情事為合故胡氏安國用左氏之義而不從其文主公穀作輸而易其詁曰納也附録左傳翼九宗五正頃父之子嘉父逆晉侯于隨唐叔始封受懷姓九宗職官五正九宗一姓為九族也五正五官之長頃父之子嘉父晉大夫新為大夫未甚著見故繫之于父納諸鄂晉人謂之鄂侯鄂晉别邑在今山西鄉寧縣南夏五月辛酉公會齊侯盟于艾此書齊魯交好之始艾山名在今山東蒙隂縣西北左傳夏盟于艾始平于齊也春秋前魯與齊不平今乃結好故言始平于齊宋殤既合五國之師以伐鄭又環其邑而圍之鄭之怨宋深矣去年與邾伐宋未足以釋憾故特平齊魯為他日伐宋之謀魯與齊盟而曰鄭莊合齊魯者以三年齊鄭盟石門知齊鄭合黨故也盟不書及而書會則非魯志而齊欲為盟也春秋通例凡書盟者惡之而况於植黨行私乎附録左傳五月庚申鄭伯侵陳大獲往歲鄭伯請成于陳陳侯不許五父諌曰五父陳公子他親仁善鄰國之寶也君其許鄭陳侯曰宋衛實難鄭何能為遂不許君子曰善不可失惡不可長其陳桓公之謂乎長惡不悛悛止也從自及也從隨也雖欲救之其將能乎商書曰惡之易也如火之燎于原不可鄉邇其猶可撲滅周任有言曰周任周大夫為國家者見惡如農夫之務去草焉芟夷薀崇之絶其本根勿使能殖則善者信矣芟刈也夷殺也蕰積也崇聚也秋七月公羊傳此無事何以書春秋雖無事首時過則書首始也時四時也過歷也歷一時無事則書其始月首時過則何以書春秋編年四時具然後為年春秋之法雖無事必書時而繫以首月四時具而後成歲也事在仲月季月則不書首月而書時以冠其月月必繫於時也冬宋人取長葛左傳秋宋人取長葛經書冬而傳書秋蓋秋取冬乃告也公羊傳外取邑不書此何以書久也古者師出不踰時今宋更年取邑暴師苦衆故書以疾之穀梁傳外取邑不志此其志何也久之也不言鄭長葛者蒙上文伐鄭圍長葛之文也以鄭莊之雄黠非不能保長葛而委之於宋蓋方連結齊魯為後日報復之計也宋殤役衆經年肆行貪暴而忌鄭之深實由公子馮之在鄭也其不善之積已著而不可解矣附録左傳冬京師來告飢公為之請糴于宋衛齊鄭禮也告飢不以王命故傳言京師而不書于經鄭伯如周始朝桓王也桓王即位周鄭交惡至是乃朝故曰始王不禮焉周桓公言于王曰我周之東遷晉鄭焉依周桓公周公黑肩也食采于周故城在今陜西岐山縣南平王東徙晉文侯鄭武公左右王室故曰晉鄭焉依善鄭以勸來者猶懼不蔇蔇至也况不禮焉鄭不來矣為桓五年諸侯從王伐鄭傳七年春王三月叔姬歸于紀穀梁傳其不言逆何也逆之道微無足道焉爾逆者非卿叔姬伯姬之娣古者諸侯一娶九女嫁女之國必以姪娣從二國來媵亦以姪娣從二年伯姬歸于紀叔姬至是始歸者待年也娣歸不書而叔姬書以其後紀亡叔姬不歸宗國而歸於酅能全婦道以賢而得書故此年特書其歸將有其末必著其本也滕侯卒滕國今山東滕縣西南古滕城是也左傳七年春滕侯卒不書名未同盟也凡諸侯同盟于是稱名故薨則赴以名盟以名告神故薨亦以名告同盟告終稱嗣也告亡者之終稱嗣位之主以繼好息民謂之禮經公羊傳何以不名微國也微國則其稱侯何不嫌也春秋貴賤不嫌同號美惡不嫌同辭穀梁傳滕侯無名少曰世子長曰君狄道也其不正者名也諸侯卒書名滕侯不名程子謂史闕文也不書葬魯不會也古者邦交有常春秋之時則惟以強弱為厚薄如晉楚之遠而魯君親奔其喪以俟其葬滕鄰境也宿同盟也而赴告雖及不會其葬無其事闕其文魯史之舊也聖人無加損焉存其卒闕其葬而義自見矣夏城中丘此書土功之始中丘魯地今山東沂州東北有中丘城左傳夏城中丘書不時也公羊傳中丘者何內之邑也城中丘何以書以重書也以功重故書穀梁傳城為保民為之也民衆城小則益城益城無極凡城之志皆譏也凡書城者完舊也書築者創始也春秋凡用民力必書其所興作不時害義固為罪矣雖時且義亦書見勞民為重事也然僖公嘗修泮宫復閟宮矣非不用民力也而不書蓋復古興廢奉先育賢乃為國之先務雖用民力不可以已故以為常事而不書耳齊侯使其弟年來聘此書列國來聘之始左傳齊侯使夷仲年來聘結艾之盟也艾盟在六年公羊傳其稱弟何諸侯之子稱公子母弟稱弟母兄稱兄謂同母弟兄穀梁傳諸侯之尊弟兄不得以屬通禮非始封之君則臣諸父昆弟匹敵之稱人臣不可以敵君故不得以屬通所以别貴賤明尊君卑臣之義其弟云者以其來接于我舉其貴者也弟為臣之親貴者年者僖公母弟也其不稱公子而變文書弟者罪僖公以母弟之故而寵愛之過也親親之道尊其位重其祿而非賢則不及以政事僖公私於同母寵愛異於他弟聘魯致女交政鄰國一以委之遂致亂嫡庶之辨以啓異日無知篡弒之階故特書弟以示貶著禍亂之所由始也使使致問曰聘古者諸侯間於天子之事乃有殷聘之禮自隱公即位未嘗朝周而受同列之聘是後內外交聘八十有七而尊王之禮罕見故悉書以示譏焉秋公伐邾此書伐邾之始左傳秋宋及鄭平七月庚申盟于宿公伐邾為宋討也為宋報入郛之憾公與邾人元年盟于蔑至是而伐邾為宋討也其為宋討何也魯嘗拒宋而與鄭平今鄭復與宋盟故懼而伐邾欲以悅宋也用此見經之書伐乃紀其用兵之實迹以别於侵而非謂主兵者皆有言可執見伐者皆有罪可討至於渝蔑之盟則不待貶而自見矣冬天王使凡伯來聘此書玉聘之始凡國名姬姓伯爵杜注汲郡共縣東南有凡城在今河南輝縣西戎伐凡伯于楚丘以歸此書戎患之始楚丘杜注衛地今山東曹縣東楚丘亭是也左傳初戎朝于周發幣于公卿發陳也凡伯弗賓凡伯周卿士冬王使凡伯來聘還戎伐之于楚丘以歸傳言凡伯所以見伐公羊傳凡伯者何天子之大夫也此聘也其言伐之何執之也執之則其言伐之何大之也尊天王命責當死位故使與國同曷為大之不與夷狄之執中國也其地何大之也天子大夫銜王命而被伐所在當赴其難與國君等穀梁傳凡伯者何也天子之大夫也國而曰伐此一人而曰伐何也大天子之命也戎者衛也戎衛者為其伐天子之使貶而戎之也楚丘衛之邑也以歸猶愈乎執也諱執言以歸尊尊之正義周禮時聘以結諸侯之好諸侯不修臣職而聘之非王法也國而曰伐此一人而曰伐見其以徒衆也楚丘衛地王使過賓戎伐之而衛不救是不臣也凡伯見執不能死於其位而從之歸是失身也王靈之不振如此此桓文之功所以不可沒與附録左傳陳及鄭平六年鄭侵陳大獲今乃平十二月陳五父如鄭涖盟壬申及鄭伯盟歃如忘志不在歃泄伯曰泄伯鄭泄駕五父必不免不賴盟矣鄭良佐如陳涖盟良佐鄭大夫辛巳及陳侯盟亦知陳之將亂也入其國觀其政治故總言之也為桓五年六年陳亂蔡人殺陳他傳鄭公子忽在王所故陳侯請妻之以忽有王寵故鄭伯許之乃成昏為鄭忽失齊昏援以至出奔傳日講春秋解義卷三
