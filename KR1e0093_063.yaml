body:
  text: 欽定四庫全書日講春秋解義卷六十三哀公十有一年春齊國書帥師伐我左𫝊十一年春齊為鄎故鄎在前年國書髙無㔻帥師伐我及清清杜注齊地濟北盧縣東有清亭盧縣今長清縣也季孫謂其宰冉求曰冉求魯人孔子弟子齊師在清必魯故也若之何求曰一子守二子從公禦諸竟季孫曰不能自度力不能使二子求曰居封疆之閒封疆竟內近郊地季孫告二子二子不可求曰若不可則君無出一子帥師背城而戰不屬者非魯人也屬臣屬也言不戰為不臣魯之羣室衆于齊之兵車羣室都邑居家一室敵車優矣子何患焉二子之不欲戰也宜政在季氏當子之身齊人伐魯而不能戰子之恥也大不列于諸侯矣季孫使從于朝俟于黨氏之溝黨氏溝杜注朝中地名武叔呼而問戰焉問冉求對曰君子有逺慮小人何知懿子強問之對曰小人慮材而言量力而共者也言所問非己材力所及故不能言武叔曰是謂我不成丈夫也知冉求非己不欲戰故不對退而搜乘孟孺子泄帥右師孺子懿子之子武伯彘顔羽御邴泄為右二子孟氏臣冉求帥左師管周父御樊遲為右樊遲名須魯人孔子弟子季孫曰須也弱有子曰就用命焉雖年少能用命有子冉求也季氏之甲七千冉有以武城人三百為己徒卒步卒精兵老幼守宫次于雩門之外雩門南城門五日右師從之五日乃從言不欲戰公叔務人見保者而泣務人公為昭公子保守城者曰事充政重事充繇役煩政重賦稅多上不能謀士不能死何以治民吾既言之矣敢不勉乎師及齊師戰于郊齊師自稷曲稷曲杜注郊地名師不踰溝樊遲曰非不能也不信子也請三刻而踰之與衆三刻約信如之衆從之師入齊軍冉求之師右師奔齊人從之陳瓘陳莊涉泗二陳齊大夫孟之側後入以為殿之側孟氏族字反抽矢策其馬曰馬不進也林不狃之伍曰走乎不狃魯士五人為伍不狃曰誰不如曰然則止乎不狃曰惡賢徐步而死言魯非無壯士但季孫不能使師獲甲首八十冉求所得齊人不能師宵諜曰齊人遁冉有請從之三季孫弗許孟孺子語人曰我不如顔羽而賢于邴泄二子與孺子同車子羽鋭敏子羽顔羽鋭敏言欲戰我不欲戰而能默泄曰驅之言驅馬欲奔公為與其嬖僮汪錡乘皆死皆殯孔子曰能執干戈以衛社稷可無殤也時人疑童子當殤冉有用矛于齊師故能入其軍孔子曰義也言能以義勇不書戰不皆陳也不書敗勝負不殊春秋詳內而略外故外之侵伐書國而魯書四鄙此以國言之者胡氏安國謂曲在我特書伐我非也按𫝊載老幼守宫次于雩門之外師及齊師戰于郊右師奔齊人從之至于涉泗則兵實加國都矣故直言伐我明與他伐異耳自哀公已前諸侯來伐無兵及近郊者至是政在季氏生事啓釁二家不肯同力前之吳師後之齊師召之而來傅國都而止春秋兩書伐我所以著魯之益衰不能守其四封而至見陵之甚也夏陳轅頗出奔鄭轅公羊作袁左𫝊夏陳轅頗出奔鄭初轅頗為司徒賦封田以嫁公女封內之田悉賦稅之有餘以為已大器大器鐘鼎之屬國人逐之故出道渴其族轅咺進稻醴梁糗腶脯焉醴濁酒也糗乾飯也腶脯捶脯施薑桂也喜曰何其給也對曰器成而具具此醴糗曰何不吾諫對曰懼先行恐言不從先見逐五月公㑹吳伐齊甲戌齊國書帥師及吳戰于艾陵齊師敗績獲齊國書書戰書獲止此齊魯交兵亦止此艾陵杜注齊地左𫝊為郊戰故公㑹吳子伐齊欲以報也五月克博壬申至于嬴博嬴杜注齊邑二縣皆屬泰山今泰安州東南有博陽故城中軍從王吳中軍胥門巢將上軍王子姑曹將下軍展如將右軍三將吳大夫齊國書將中軍髙無㔻將上軍宗樓將下軍陳僖子謂其弟書爾死我必得志書子占也欲獲死事之功宗子陽與閭丘明相厲也相勸厲致死子陽宗樓也桑掩胥御國子國書公孫夏曰二子必死亦勸勉之將戰公孫夏命其徒歌虞殯虞殯送葬歌曲示必死陳子行命其徒具含玉子行陳逆也具含玉亦示必死公孫揮命其徒曰人尋約吳髮短約繩也八尺曰尋吳髮短欲以繩貫其首東郭書曰三戰必死于此三矣三戰夷儀五氏與今使問弦多以琴弦多齊人六年奔魯曰吾不復見子矣言將戰死陳書曰此行也吾聞鼓而已不聞金矣軍以鼓進以金退不聞金言將死也𫝊言吳師強齊人皆自知將敗甲戌戰于艾陵展如敗髙子齊上軍敗國子敗胥門巢吳上軍亦敗王卒助之大敗齊師獲國書公孫夏閭丘明陳書東郭書革車八百乘甲首三千以獻于公公以兵從故以勞公將戰吳子哷叔孫曰而事何也問何職對曰從司馬從吳司馬所命王賜之甲劍鈹曰奉爾君事敬無廢命叔孫未能對衛賜進曰賜子貢孔子弟子州仇奉甲從君而拜公使大史固歸國子之元歸于齊也元首也吳以獻魯置之新篋褽之以𤣥纁加組帶焉褽薦也置書于其上曰天若不識不衷何以使下國言天識不善故殺國子公㑹伐而不與戰也蓋自季孫擅魯陵暴小國披其田邑皆三桓共之而危辱之地則使公試焉由來舊矣齊怨已深復假吳師以挑其禍故迫公自行叔孫以世行從而季孟不出蓋敗則公受其殃勝亦公主其怨也魯師不出公徒寡約不足以戰而從吳司馬如陳蔡之君附於楚乘故特書公㑹吳伐齊於前復大書齊國書及吳戰於後以發疑端見情實而著季孫之惡也先儒謂屬辭之法當然非也使魯師成列公實與戰則書公㑹吳伐齊甲戌及齊國書戰于艾陵可矣即欲著國書志為此戰書齊國書帥師及我師吳師戰于艾陵可矣何故迂其義而為公不與戰之辭哉書獲國書又書師敗績見師將皆隕與大棘之戰同𫝊曰大夫生死皆曰獲故國書華元無異辭附録左𫝊吳將伐齊越子率其衆以朝焉王及列士皆有饋賂吳人皆喜唯子胥懼曰是豢吳也夫豢飬也若人飬犧牲非愛之將殺之諫曰越在我心腹之疾也壤地同而有欲于我欲得吳夫其柔服求濟其欲也不如早從事焉從事擊之得志于齊猶獲石田也無所用之石田不可耕越不為沼吳其泯矣使醫除疾而曰必遺類焉者未之有也盤庚之誥曰其有顛越不共則劓殄無遺育無俾易種于兹邑盤庚商書顛越不共從橫不承命者也劓割也殄絶也育長也易種轉生種類是商所以興也今君易之將以求大不亦難乎弗聽使于齊屬其子于鮑氏為王孫氏私使人至齊屬其子改姓為王孫欲以辟吳禍反役王聞之使賜之屬鏤以死役艾陵役也屬鏤劍名將死曰樹吾墓檟檟可材也吳其亡乎三年其始弱矣盈必毁天之道也為十三年越入吳起秋七月辛酉滕子虞母卒附録左𫝊秋季孫命修守備曰小勝大禍也齊至無日矣冬十有一月葬滕隱公衛世叔齊出奔宋左𫝊冬衛太叔疾出奔宋疾即齊也初疾娶于宋子朝子朝宋人仕衛為大夫其娣嬖娣所娶女之娣子朝出出奔孔文子使疾出其妻而妻之疾使侍人誘其初妻之娣置于犁犁杜注衛邑而為之一宫如二妻文子怒欲攻之仲尼止之遂奪其妻或淫于外州外州杜注衛邑外州人奪之軒以獻軒車也以獻于君恥是二者故出衛人立遺疾弟使室孔姞文子女疾妻疾臣向魋納美珠焉與之城鉏城鉏杜注宋邑今直隸滑縣東有鉏城宋公求珠魋不與由是得罪及桓氏出在十四年城鉏人攻太叔疾衛莊公復之使處巢死焉殯于鄖葬于少禘終言疾之失所巢鄖少禘杜注皆衛地今巢亭在河南睢州初晉悼公子憗亡在衛使其女僕而田僕御以獵大叔懿子止而飲之酒懿子太叔儀之孫遂聘之生悼子悼子太叔疾悼子即位故夏戊為大夫夏戊悼子甥悼子亡衛人翦夏戊翦削其爵邑孔文子之將攻大叔也訪于仲尼仲尼曰胡簋之事則嘗學之矣胡簋禮器名夏曰胡周曰簋甲兵之事未之聞也退命駕而行曰鳥則擇木木豈能擇鳥以鳥自喻文子遽止之曰圉豈敢度其私訪衛國之難也圉文子名度謀也將止仲尼止魯人以幣召之乃歸于是自衛反魯樂正雅頌各得其所經書內外大夫奔者六十於定哀之世尤多蓋政在大夫各欲自専始則相猜相忌終乃相攻相逐也附録左𫝊季孫欲以田賦丘賦之法因其田財通出馬一匹牛三頭今欲别其田及家財各為一賦故言田賦使冉有訪諸仲尼仲尼曰丘不識也三發三發問卒曰子為國老待子而行若之何子之不言也仲尼不對不公對而私于冉有曰君子之行也度于禮施取其厚事舉其中斂從其薄如是則以丘亦足矣丘十六井出戎馬一匹牛三頭是賦之常法若不度于禮而貪冒無厭則雖以田賦將又不足且子季孫若欲行而法則周公之典在若欲苟而行又何訪焉弗聽為明年用田賦𫝊十有二年春用田賦左𫝊十二年春王正月用田賦終前年事公羊𫝊何以書譏何譏爾譏始用田賦也田謂一井之田賦者斂取其財物也禮稅民公田不過什一軍賦十井不過一乘哀公外慕強吳空盡國儲故復用田賦過什一榖梁𫝊古者公田什一用田賦非正也古者五口之家受田百畝為官田十畝是為私得其什而官稅其一故曰什一今乃棄中平之法而田財竝賦言其賦民甚矣用者不宜用也田賦之說杜預范寧皆云丘賦之法因其田財通出馬一匹牛三頭今别其田及家財各出此賦則是比先王之制加倍不翅矣况家財有無難均說未可信要之賦之本義専為出軍計丘而出兵車賦之常法今計田而出故曰田賦蓋春秋諸侯㑹盟禮繁兵戎事廣不能復守先王之籍故魯用不足則初稅畝益兵則作丘甲至哀公逺事彊吳事充政重二猶不足復用田賦蓋託以軍用加斂於田計田而出貨財也其數之多寡則不可考大約稅畝多乎什一田賦又多乎稅畝矣稅畝私田始有征也田賦私田又加征也夏五月甲辰孟子卒左𫝊夏五月昭夫人孟子卒昭公娶于吳故不書姓諱娶同姓故謂之孟子若宋女死不赴故不稱夫人不稱夫人故不言薨不反哭故不言葬小君反哭者夫人禮也以同姓故不成其夫人喪孔子與弔適季氏季氏不絻放絰而拜孔子始老故與弔絻喪冠也孔子以小君禮往弔季氏不服喪故去絰從主人節制公羊𫝊孟子者何昭公之夫人也其稱孟子何諱取同姓蓋吳女也穀梁𫝊孟子者何也昭公夫人也其不言夫人何也諱取同姓也孟子吳女昭公之夫人其生也昭公既謂之孟子故史亦因之不改不書夫人書卒著季氏逐其君又黜其夫人也觀左氏記孔子與弔而季孫不絻放絰而拜則知當時不以小君待之矣不書葬不成喪也公㑹吳于槖皋槖皋杜注在淮南逡道縣東南今江南巢縣西北有柘皋鎮即古吳邑也左𫝊公㑹吳于槖皋吳子使大宰嚭請尋盟尋鄫盟公不欲使子貢對曰盟所以周信也周固也故心以制之制其義玉帛以奉之言以結之明神以要之寡君以為苟有盟焉弗可改也已若猶可改日盟何益今吾子曰必尋盟若可尋也亦可寒也乃不尋盟秋公㑹衛侯宋皇瑗于鄖鄖公羊作運杜注鄖發陽也廣陵海陵縣東南有發繇亭今江南如皋縣東立發壩古發陽也亦名古鄖左𫝊吳徴㑹于衛初衛人殺吳行人且姚而懼謀于行人子羽衛大夫子羽曰吳方無道無乃辱吾君不如止也子木曰衛大夫吳方無道國無道必棄疾于人吳雖無道猶足以患衛往也長木之斃無不摽也摽擊國狗之瘈無不噬也疾狂也噬齧也而况大國乎秋衛侯㑹吳于鄖公及衛侯宋皇瑗盟而卒辭吳盟吳人藩衛侯之舍藩籬也圍其館舍子服景伯謂子貢曰夫諸侯之㑹事既畢矣侯伯致禮地主歸餼侯伯致禮以禮賔也地主所㑹主人也餼生物以相辭也各以禮相亂讓今吳不行禮于衛而藩其君舍以難之難困苦也子盍見大宰乃請束錦以行以賂吳語及衛故若本不為衛請者大宰嚭曰寡君願事衛君衛君之來也緩寡君懼故將止之子貢曰衛君之來必謀于其衆其衆或欲或否是以緩來其欲來者子之黨也其不欲來者子之讎也若執衛君是墮黨而崇讎也墮毁也夫墮子者得其志矣且合諸侯而執衛君誰敢不懼墮黨崇讎而懼諸侯或者難以霸乎大宰嚭說乃舍衛侯衛侯歸效夷言子之尚幼子之公孫彌牟曰君必不免其死于夷乎執焉而又說其言從之固矣後出公輒卒死于越宋向巢帥師伐鄭左𫝊宋鄭之閒有隙地焉曰彌作頃丘玉暢嵒戈錫凡六邑今把縣東北有玉帳或云古玉暢也子産與宋人為成曰勿有是俱棄之及宋平元之族自蕭奔鄭在定十五年鄭人為之城嵒戈錫以處平元之族九月宋向巢伐鄭取錫殺元公之孫遂圍嵒十二月鄭罕逹救嵒丙申圍宋師此事經在十二月螽上而𫝊本在下更具列其月以為别者丘明本不以為義例故不皆齊同冬十有二月螽螽公羊作􅏑左𫝊冬十二月螽季孫問諸仲尼仲尼曰丘聞之火伏而後蟄者畢火伏在今十月今火猶西流司厯過也猶西流言未盡沒知是九月厯官失一閏公羊𫝊何以書記異也何異爾不時也􅏑者與隂殺俱藏周十二月夏之十月不當見故為異杜氏預以為失閏雖書十二月實今九月氣尚溫故螽然明年九月螽又十二月螽蟲災亟作而不時沴氣所感非關閏也十有三年春鄭罕逹帥師取宋師于嵒左𫝊十三年春宋向魋救其師救前年圍嵒師鄭子賸使徇曰子賸罕逹得桓魋者有賞魋也逃歸遂取宋師于嵒獲成歡郜延二子宋大夫以六邑為虛空虛之各不有公羊𫝊其言取之何易也其易奈何詐反也反報也前宋行詐取鄭師今鄭復行詐取之苟相報償不以君子之道故曰詐反榖梁𫝊取易辭也以師而易取宋病矣書取師罪其以多殺為功不仁之甚也宋鄭自老丘之役彼此結怨悉其詐力必欲盡敵而後已此春秋將變而為戰國之勢也夏許男成卒成公羊作戊公㑹晉侯及吳子于黃池書㑹止此黃池杜注陳留封丘縣南有黃亭近濟水在今河南封丘縣西南左𫝊夏公㑹單平公晉定公吳夫差于黃池單平公周卿士公羊𫝊吳何以稱子吳主㑹也吳主㑹則曷為先言晉侯不與夷狄之主中國也其言及吳子何㑹兩伯之辭也不與夷狄之主中國則曷為以㑹兩伯之辭言之重吳也曷為重吳吳在是則天下諸侯莫敢不至也穀梁𫝊黃池之㑹吳子進乎哉遂子矣吳夷狄之國也祝髮文身祝斷也文身刻畫其身以為文也欲因魯之禮因晉之權而請冠端而襲端𤣥端服襲猶著也其藉于成周藉謂貢獻以尊天王吳進矣吳東方之大國也纍纍致小國以㑹諸侯以合乎中國吳能為之則不臣乎言其臣也吳進矣王尊稱也子卑稱也辭尊稱而居卑稱以㑹乎諸侯以尊天王吳王夫差曰好冠來孔子曰大矣哉夫差未能言冠而欲冠也不知冠有差等惟欲好冠黃池之㑹左氏曰先晉國語曰先吳後之說經者互有所主夫宋之盟晉國方彊而卒先楚人則謂晉定之不能先吳似也吳方在㑹而邉遽以越亂告則謂吳內惕而不敢復爭亦似也惟趙氏匡以為吳晉敵禮而㑹如賔主然故晉史即云晉為先而吳語即云吳先歃各自護其主春秋據其事實以兩霸之辭言之故曰及此於情事為合吳稱子為與晉侯同為㑹主故不稱人穀梁以為進之非也黃池地近魯前此魯數與吳㑹故是㑹公獨往不更序諸侯諸侯實未至非大㑹而末言之也楚公子申帥師伐陳乘吳出㑹而伐陳畏彊陵弱之實見矣於越入吳左𫝊六月丙子越子伐吳為二隧隧道也疇無餘謳陽自南方先及郊二子越大夫吳大子友王子地王孫彌庸夀於姚自泓上觀之觀越師泓杜注水名彌庸見姑蔑之旗曰吾父之旗也不可以見讎而弗殺也姑蔑杜注越地東陽大末縣今浙江龍游縣有姑蔑城彌庸父為越所獲故姑蔑人得其旗大子曰戰而不克將亡國請待之彌庸不可屬徒五千屬㑹也王子地助之乙酉戰彌庸獲疇無餘地獲謳陽越子至王子地守丙戌復戰大敗吳師獲大子友王孫彌庸夀於姚丁亥入吳吳人告敗于王王惡其聞也自剄七人于幕下以滅口秋七月辛丑盟吳晉爭先吳人曰于周室我為長吳為大伯後故為長晉人曰于姬姓我為伯為侯伯趙鞅呼司馬寅曰日旰矣大事未成二臣之罪也寅晉大夫旰晚也大事盟也二臣鞅與寅建鼓整列二臣死之長幼必可知也對曰請姑視之反曰肉食者無墨墨氣色下今吳王有墨國勝乎國為敵所勝大子死乎且夷德輕不忍久請少待之乃先晉人吳人將以公見晉侯子服景伯對使者曰王合諸侯則伯帥侯牧以見于王伯王官伯侯牧方伯伯合諸侯則侯帥子男以見于伯伯諸侯長自王以下朝聘玉帛不同故敝邑之職貢于吳有豐于晉無不及焉以為伯也今諸侯㑹而君將以寡君見晉君則晉成為伯矣敝邑將改職貢魯賦于吳八百乘若為子男則將半邾以屬于吳半邾三百乘而如邾以事晉如邾六百乘且執事以伯召諸侯而以侯終之何利之有焉吳人乃止既而悔之謂景伯欺之將囚景伯景伯曰何也立後于魯矣何景伯名將以二乘與六人從遲速唯命遂囚以還及户牖户牖杜注陳留外黃縣西北東昏城是今故城在河南蘭陽縣東北謂大宰曰魯將以十月上辛有事于上帝先王季辛而畢何世有職焉自襄以來未之改也魯襄公若不㑹祝宗將曰吳實然吳人信鬼故以是恐之且謂魯不共而執其賤者七人何損焉大宰嚭言于王曰無損于魯而祗為名適為惡名不如歸之乃歸景伯吳申叔儀乞糧于公孫有山氏申叔儀吳大夫公孫有山魯大夫舊相識曰佩玉繠兮余無所繫之繠然服飾備也已獨無以繫佩言吳王不恤下旨酒一盛兮余與褐之父睨之一盛一器也睨視也褐寒賤之人言但得視不得飲對曰粱則無矣粗則有之若登首山以呼曰庚癸乎則諾粱精米粗粗糲也首山地闕庚西方主榖癸北方主水軍中不得出糧故為私隱𫝊言吳子不與士共飢渴所以亡王欲伐宋殺其丈夫而囚其婦人以宋不㑹黃池故言吳子悖惑大宰嚭曰可勝也而勿能居也乃歸吳方爭中國之諸侯越遂乘其無備而入之春秋繼書於黃池之後所謂因事屬辭見吳子之勤逺略而忘近憂也秋公至自㑹晉魏曼多帥師侵衛公羊無曼字霸國侵伐止此晉事亦止此公羊𫝊此晉魏曼多也曷為謂之晉魏多據上七年言曼多譏二名二名非禮也此霸國侵伐之終事也晉主夏盟威動天下今其衰也趙鞅魏曼多數加兵於衛而卒不能服豈力不足哉彊家多門各自封殖不在諸侯志於怙權營私而已葬許元公九月螽冬十有一月有星孛于東方公羊𫝊孛者何彗星也其言于東方何見于旦也旦者日方出時宿不復見故言東方知為旦何以書記異也周十一月夏九月日在房心房心天子明堂布政之庭于此旦見與日爭明者諸侯放恣之象不言宿者平旦衆星皆沒而孛乃見故不言所在之次盜殺陳夏區夫區公羊作彄春秋之季世變日異至於盜興而専殺國君大夫則亂極矣區夫徵舒之後徵舒戮於楚而陳人猶使世執國政經因其為盜所殺而書之與書宋華孫同十有二月螽二年之內三書螽見田賦為害民力窮而天變作也附録左𫝊冬吳及越平終伍員之言十有四年春西狩獲麟左𫝊十四年春西狩于大野叔孫氏之車子鉏商獲麟大野杜注髙平巨野縣東北大澤是也今山東嘉祥縣西有獲麟堆車子微者鉏商名麟麕身牛尾狼額馬蹄有五采腹下黃髙丈二以為不祥以賜虞人時所未嘗見故怪之虞人掌山澤之官仲尼觀之曰麟也然後取之言魯史所以得書獲麟公羊𫝊何以書記異也何異爾非中國之獸也然則孰狩之薪采者也薪采者則微者也曷為以狩言之大之也曷為大之為獲麟大之也曷為為獲麟大之麟者仁獸也有王者則至無王者則不至有以告者曰有麏而角者孔子曰孰為來哉孰為來哉反袂拭面涕沾袍顔淵死子曰噫天喪豫子路死子曰噫天祝豫祝斷也西狩獲麟孔子曰吾道窮矣春秋何以始乎隱祖之所逮聞也託記髙祖以來事可及問聞知者所見異辭所聞異辭所𫝊聞異辭何以終乎哀十四年曰備矣君子曷為為春秋撥亂世反諸正莫近諸春秋則未知其為是與其諸君子樂道堯舜之道與末不亦樂乎堯舜之知君子也制春秋之義以俟後聖以君子之為亦有樂乎此也君子謂孔子樂者樂其貫通百王而無閒榖梁𫝊引取之也狩地不地不狩也非狩而曰狩大獲麟故大其適也其不言來不外麟于中國也其不言有不使麟不恆于中國也冬獵曰狩大野在魯西故言西狩常事不書書之為獲麟記異也春秋絶筆於此杜氏預謂感麟而作因以為終諸儒多從之學公榖者則謂文成致麟而胡氏因之此皆世儒欲推尊孔子而未得其實也謂文成致麟則麟出而死安得為瑞謂感麟而作則無麟將不作乎且周衰亂臣賊子接跡於世孔子道既不行作春秋以明王法視諸經尤重且急而直待前卒之二年始從事於此理不宜然或又謂義在春秋不在起止孔子得魯史記自隱公至獲麟遂刪修之然國史編年之體按年紀事至年終乃止則哀十四年之事魯史自當備録何為忽至於十四年春而遂止乎蓋麟仁獸聖世之嘉瑞時無盛王出而遇獲聖心能無感乎故傷之而遂絶茟焉與鳳至圖出之嘆同善乎朱子之言曰獲麟之說不敢定謂書成致麟亦不敢定謂感麟而作大槩非時而出見戕於人自是不祥此可以息衆說之穿鑿矣日講春秋解義卷六十三
