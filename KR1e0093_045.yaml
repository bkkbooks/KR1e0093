body:
  text: 欽定四庫全書日講春秋解義卷四十五襄公二十有八年春無冰左傳二十八年春無冰梓慎曰梓慎魯大夫今兹宋鄭其饑乎歳在星紀而淫于𤣥枵歳歳星也星紀在丑斗牛之次𤣥枵在子虚危之次十八年晉董叔曰天道多在西北是歳歳星在亥至此年十一歳故在星紀明年乃當在𤣥枵今已在𤣥枵淫行失次以有時菑隂不堪陽時菑無冰也盛隂用事而温無冰是隂不勝陽地氣發洩蛇乗龍蛇𤣥武之宿虚危之星龍歳星歳星木也木為青龍失次出虚危下為蛇所乗龍宋鄭之星也歳星本位在東方東方房心為宋角亢為鄭故以龍為宋鄭之星宋鄭必饑𤣥枵虚中也𤣥枵三宿虛星在其中枵耗名也土虛而民耗不饑何為歳為宋鄭之星今失常淫入虚耗之次時復無冰地氣發洩故曰土虛民耗自正月至三月為春在夏時則十一月十二月正月也此三月内無冰則天道恒燠故特書之以紀異附錄左傳夏齊侯陳侯蔡侯北燕伯把伯胡子沈子白狄朝于晉宋之盟故也陳侯蔡侯胡子沈子楚屬也宋盟曰晉楚之從交相見故朝晉燕國杜注薊縣今京城東偏即其地齊侯將行慶封曰我不與盟何為于晉以宋盟釋齊秦陳文子曰先事後賄禮也事大國當先從其政事而後薦賄以副已心小事大未獲事焉從之如志禮也言當從大國請事以順其志雖不與盟敢叛晉乎重丘之盟未可忘也重丘盟在二十五年子其勸行夏衛石惡出奔晉左傳衛人討甯氏之黨故石惡出奔晉衛人立其從子圃以守石氏之祀惡之先石碏有功衛國故禮也邾子來朝左傳邾悼公來朝時事也邾自晉執其君魯取其田微弱極矣故亟修禮於魯秋八月大雩左傳秋八月大雩旱也附錄左傳蔡侯歸自晉入于鄭鄭伯享之不敬子産曰蔡侯其不免乎日其過此也往日至晉時君使子展迋勞于東門之外而傲迋往也吾曰猶將更之今還受享而惰乃其心也君小國事大國而惰傲以為己心將得死乎若不免必由其子其為君也淫而不父通大子班之妻僑聞之如是者恒有子禍為三十年蔡世子班弑其君傳仲孫羯如晉左傳孟孝伯如晉告將為宋之盟故如楚也魯晉屬故告晉而行公因宋之盟將朝於楚又先禀命於晉南北分覇列國皆疲於奔命矣附錄左傳蔡侯之如晉也鄭伯使游吉如楚及漢楚人還之曰宋之盟君實親辱君謂鄭伯今吾子來寡君謂吾子姑還吾將使馹奔問諸晉而以告問鄭君應來朝否子大叔曰宋之盟君命將利小國而亦使安定其社稷鎮撫其民人以禮承天之休此君之憲令而小國之望也寡君是故使吉奉其皮幣以歳之不易聘于下執事言歳有饑荒之難故鄭伯不得自朝楚今執事有命曰女何與政令之有必使而君棄而封守跋涉山川蒙犯霜露以逞君心小國將君是望敢不唯命是聼無乃非盟載之言以闕君徳而執事有不利焉小國是懼不然其何勞之敢憚子大叔歸復命告子展曰楚子將死矣不修其政徳而貪昧于諸侯以逞其願欲久得乎周易有之在復震下坤上復之頤震下艮上頤復上六變得頤曰迷復凶復上六爻辭也復反也隂處極位終迷不反故凶其楚子之謂乎欲復其願謂欲得鄭朝以復其願而棄其本不修徳復歸無所失道已逺是謂迷復能無凶乎君其往也送葬而歸以快楚心楚不幾十年未能恤諸侯也幾近也吾乃休吾民矣裨竈曰裨竈鄭大夫裨諶今兹周王及楚子皆將死歳棄其次而旅于明年之次以害鳥帑周楚惡之旅客處也歳星棄星紀之次客在𤣥枵歳星所在其國有福失次于北禍衝在南南為朱鳥鳥尾曰帑鶉火鶉尾周楚之分故周王楚子受其咎俱論歳星過次梓慎則曰宋鄭饑裨竈則曰周楚王死傳故備舉以示卜占惟人所在九月鄭游吉如晉告將朝于楚以從宋之盟子産相鄭伯以如楚舎不為壇至敵國郊除地封土為壇以受郊勞外僕言曰外僕掌次舎者昔先大夫相先君適四國未嘗不為壇自是至今亦皆循之今子草舎無乃不可乎子産曰大適小則為壇小適大苟舎而已焉用壇僑聞之大適小有五美宥其罪戾赦其過失救其菑患賞其徳刑刑法也教其不及小國不困懐服如歸是故作壇以昭其功宣告後人無怠于徳小適大有五惡說其罪戾自解說請其不足行其政事奉行大國之政共其職貢從其時命不然則重其幣帛以賀其福而弔其凶皆小國之禍也焉用作壇以昭其禍所以告子孫無昭禍焉可也冬齊慶封來奔左傳齊慶封好田而耆酒與慶舎政舎慶封子封當國不自為政以付舎則以其内實遷于盧蒲嫳氏内實寳物妻妾也移而居嫳家易内而飲酒數日國遷朝焉就于盧蒲氏朝見封使諸亡人得賊者以告而反之亡人辟崔氏難出奔者故反盧蒲癸癸臣子之子之慶舎有寵妻之子之以其女妻癸慶舎之士謂盧蒲癸曰男女辨姓子不辟宗何也慶氏盧蒲氏皆姜姓曰宗不余辟余獨焉辟之賦詩斷章余取所求焉惡識宗言己欲求寵于慶氏為莊公報讎不能頋禮如賦詩者取其一章而己癸言王何而反之二人皆嬖二子皆莊公黨使執寢戈而先後之寢戈親近兵杖公膳日雙雞卿大夫之膳食饔人竊更之以鶩鶩鴨也御者知之則去其肉而以其洎饋御進食者洎肉汁也欲使諸大夫怨慶氏減其膳盖癸與何之謀子雅子尾怒二子皆恵公孫慶封告盧蒲嫳盧蒲嫳曰譬之如禽獸吾寢處之矣使析歸父告晏平仲欲與共謀子雅子尾平仲曰嬰之衆不足用也知無能謀也言弗敢出不敢洩謀有盟可也子家曰子家析歸父子之言云又焉用盟告北郭子車子車齊大夫子車曰人各有以事君非佐之所能也佐子車名陳文子謂桓子曰桓子文子之子無宇禍將作矣吾其何得對曰得慶氏之木百車于莊慶封時有此木積于六軌之道文子曰可慎守也已善其不志于貨財盧蒲癸王何卜攻慶氏示子之兆曰或卜攻讎敢獻其兆子之曰克見血冬十月慶封田于萊陳無宇從丙辰文子使召之請曰無宇之母疾病請歸慶季卜之季慶封示之兆曰死奉龜而泣無宇泣乃使歸慶嗣聞之嗣慶封之族曰禍將作矣謂子家速歸子家慶封字禍作必于嘗嘗秋祭歸猶可及也子家弗聼亦無悛志子息曰子息慶嗣亡矣幸而獲在吳越陳無宇濟水而戕舟發梁不欲慶封得救難盧蒲姜謂癸曰盧蒲姜慶舎女有事而不告我必不捷矣癸告之告欲殺慶舎姜曰夫子愎夫子謂慶舎莫之止將不出我請止之癸曰諾十一月乙亥嘗于大公之廟慶舎涖事盧蒲姜告之且止之弗聼曰誰敢者遂如公至公所麻嬰為尸慶奊為上獻上獻先獻者二子皆慶氏黨盧蒲癸王何執寢戈慶氏以其甲環公宫廟在宫内陳氏鮑氏之圉人為優優俳慶氏之馬善驚士皆釋甲束馬而飲酒且觀優至于魚里魚里杜注里名當在今山東臨淄縣境優在魚里就觀之欒髙陳鮑之徒介慶氏之甲欒子雅髙子尾陳陳湏無鮑鮑國子尾抽桷擊扉三桷椽也扉門闔也以桷擊扉為期盧蒲癸自後刺子之王何以戈擊之解其左肩猶援廟桷動于甍甍屋棟以俎壺投殺人而後死言其多力遂殺慶繩麻嬰慶繩慶奊公懼鮑國曰羣臣為君故也陳須無以公歸税服而如内宫慶封歸遇告亂者丁亥伐西門弗克還伐北門克之入伐内宫陳鮑在公所故弗克反陳于嶽嶽杜注里名請戰弗許遂來奔獻車于季武子美澤可以鑑展莊叔見之魯大夫曰車甚澤人必瘁宜其亡也叔孫穆子食慶封慶封汜祭禮食有祭示有所先也汜祭逺散所祭不共穆子不説使工為之誦茅鴟茅鴟逸詩刺不敬亦不知既而齊人來讓讓魯受慶封奔吳吳句餘予之朱方句餘吳子夷末也朱方杜注吳邑今江南鎮江府治聚其族焉而居之富于其舊子服恵伯謂叔孫曰天殆富滛人慶封又富矣穆子曰善人富謂之賞滛人富謂之殃天其殃之也其將聚而殱旃為昭四年殺慶封傳據左氏盧蒲癸王何殺慶舎逐慶封而戮崔杼經不書崔杼死於家難非以賊討過時而戮其屍與鄭歸生同或其國不告或雖告而義不得以討賊書也莊公之弑倖臣從死者十人而為之討賊復讎亦出於倖臣豈非卿大夫之恥與附錄左傳癸巳天王崩未來赴亦未書禮也崔氏之亂喪羣公子故鉏在魯叔孫還在燕賈在句瀆之丘在襄二十五年及慶氏亡皆召之具其器用而反其邑焉與晏子邶殿其鄙六十邶殿杜注齊百郡弗受子尾曰富人之所欲也何獨弗欲對曰慶氏之邑足欲故亡吾邑不足欲也益之以邶殿乃足欲足欲亡無日矣在外不得宰吾一邑不受邶殿非惡富也恐失富也且夫富如布帛之有幅焉為之制度使無遷也夫民生厚而用利于是乎正徳以幅之使無黜嫚黜猶放也謂之幅利利過則為敗吾不敢貪多所謂幅也與北郭佐邑六十受之與子雅邑辭多受少與子尾邑受而稍致之公以為忠故有寵釋盧蒲嫳于北竟釋放也求崔杼之尸將戮之不得叔孫穆子曰必得之武王有亂臣十人崔杼其有乎不十人不足以葬葬必湏十人崔氏不能令十人同心故必得既崔氏之臣曰與我其拱璧吾獻其柩于是得之十二月乙亥朔齊人遷莊公殯于大寢路寢以其棺尸崔杼于市國人猶知之皆曰崔子也始求崔杼之尸不得故傳云國人皆知之十有一月公如楚諸夏之君始旅見于楚左傳為宋之盟故公及宋公陳侯鄭伯許男如楚公過鄭鄭伯不在已在楚伯有迋勞于黄崖不敬黄崖杜注滎陽宛陵縣西有黄水今黄水在河南新鄭縣東穆叔曰伯有無戾于鄭鄭必有大咎敬民之主也而棄之何以承守鄭人不討必受其辜濟澤之阿行潦之蘋藻寘諸宗室季蘭尸之敬也言取蘋藻之菜于阿澤之中使服蘭之女而為之主神猶享之以其敬也敬可棄乎為三十年鄭殺良霄傳及漢楚康王卒公欲反叔仲昭伯曰昭伯叔仲帯我楚國之為豈為一人行也子服恵伯曰君子有逺慮小人從邇饑寒之不恤誰遑其後不如姑歸也叔孫穆子曰叔仲子專之矣言足專任子服子始學者也言未識逺榮成伯曰成伯榮駕鵞逺圗者忠也公遂行宋向戌曰我一人之為非為楚也饑寒之不恤誰能恤楚姑歸而息民待其立君而為之備宋公遂反舉魯以見其餘也書公朝于王所見王綱之墜書公如楚見霸業之衰凡舉魯以見其餘者皆天下之辭也僖二十八年鄭文公始朝於楚二十四年宋成公亦如楚自是以後鄭伯屢朝於楚而陳許諸君朝楚傳亦閒見至是則中國諸侯旅朝於楚直以事天子之禮事之矣迨昭九年而諸侯之大夫亦旅見於楚矣迨哀四年而晉亦京師楚矣凡此皆宋之盟實為厲階也附錄左傳楚屈建卒趙文子喪之如同盟禮也十有二月甲寅天王崩左傳王人來告喪問崩日以甲寅告故書之以徴過也也譏其怠慢乙未楚子昭卒乙未距甲寅四十二日其為閏明矣而不書閏者見喪服之不數閏也齊景公葬書閏月明殺恩之非禮也二十有九年春王正月公在楚左傳二十九年春王正月公在楚釋不朝正于廟也楚人使公親襚諸侯有遣使賵襚之禮今楚欲遣使之比公患之穆叔曰祓殯而襚則布幣也先使巫祓殯之凶邪而行襚禮與朝而布幣無異乃使巫以桃茢先祓殯茢黍穰楚人弗禁既而悔之禮君臨臣喪乃祓殯故楚悔之公羊傳何言乎公在楚正月以存君也榖梁傳閔公也閔公為楚所制故存録公如齊晉歳首闕朝正之禮亦多矣而經不書此獨書者何公廹於蠻荆久留以俟其葬而不能奔天王之喪故特書公所在以明其義以是知凡君在行國之守臣月朔必以公不朝正之故告於廟孔子修經以為常事而削之耳附録左傳二月癸卯齊人葬莊公于北郭兵死不入兆域故葬北郭夏四月葬楚康王公及陳侯鄭伯許男送葬至于西門之外諸侯之大夫皆至於墓楚郟敖即位郟敖康王子熊麇也王子圍為令尹圍康王弟鄭行人子羽曰是謂不宜必代之昌松柏之下其草不殖言楚君弱令尹強物不两盛為昭元年圍弑郟敖起本夏五月公至自楚左傳公還及方城季武子取卞取卞邑以自益使公冶問問公起居公冶季氏屬大夫璽書追而與之璽印也曰聞守卞者將叛臣帥徒以討之既得之矣敢告公冶致使而退及舎而後聞取卞發書乃聞之公曰欲之而言叛祗見疏也公謂公冶曰吾可以入乎以季氏疏已故不敢入對曰君實有國誰敢違君公與公冶冕服以卿服賞之固辭強之而後受公欲無入榮成伯賦式微乃歸詩邶風曰式微式微胡不歸式用也義取寄寓之微陋勸公歸也五月公至自楚公冶致其邑于季氏而終不入焉曰欺其君何必使余季孫見之則言季氏如他日不見則終不言季氏及疾聚其臣曰大夫家臣我死必無以冕服歛非徳賞也言公畏季氏而賞其使非以我有徳且無使季氏葬我榖梁傳喜之也逺之蠻國喜得全歸致君者殆其往而喜其反此致君之意義也公十一月如楚至夏始歸外辱於蠻荆内脅於彊臣危殆甚矣故返國而以告於廟也庚午衛侯衎卒附録左傳葬靈王不書魯不會鄭上卿有事子展使印段往伯有曰弱不可印段年少官卑子展曰與其莫往弱不猶愈乎詩云王事靡盬不遑啓處詩小雅盬不堅固也啓跪也言王事無不堅固故不暇跪處東西南北誰敢寧處謂上卿堅事晉楚以蕃王室也王事無曠何常之有遂使印段如周傳言周衰卑于晉楚閽弑吳子餘祭左傳吳人伐越獲俘焉以為閽使守舟吳子餘祭觀舟閽以刀弑之公羊傳閽者何門人也刑人也刑人則曷為謂之閽刑人非其人也以刑人為閽非其人君子不近刑人近刑人則輕死之道也榖梁傳閽門者也寺人也不稱名姓閽不得齊于人不稱其君閽不得君其君也禮君不使無恥不近刑人不狎敵不邇怨賤人非所貴也貴人非所刑也刑人非所近也舉至賤而加之吳子吳子近刑人也閽弑吳子餘祭仇之也怨仇餘祭故弑之閽刑人也謂之弑則其君也不曰其君賤閽也盜殺蔡侯申書殺閽書弑以食庶人在官者之禄也在禮國君不近刑人不邇怨據左氏閽乃越俘可以知違禮之起禍矣附録左傳鄭子展卒子皮即位子皮罕虎代父為上卿于是鄭饑而未及麥民病子皮以子展之命餼國人粟在喪故以父命戸一鍾六斛四斗曰鍾是以得鄭國之民故罕氏常掌國政以為上卿宋司城子罕聞之曰鄰于善民之望也民亦望君為善宋亦饑請于平公出公粟以貸使大夫皆貸司城氏貸而不書施而不徳為大夫之無者貸宋無饑人叔向聞之曰鄭之罕宋之樂其後亡者也二者其皆得國乎得國政民之歸也施而不徳樂氏加焉其以宋升降乎升降隨宋盛衰仲孫羯會晉荀盈齊髙止宋華定衛世叔儀鄭公孫段曹人莒人滕人薛人小邾人城把儀公羊作齊莒人下公羊榖梁有邾人左傳晉平公把出也故治把治理其地修其城六月知悼子合諸侯之大夫以城把孟孝伯會之鄭子大叔與伯石往子大叔見大叔文子衛大叔儀與之語文子曰甚乎其城把也子大叔曰若之何哉晉國不恤周宗之闕而夏肄是屏周宗諸姬也夏肄把也肄餘也屏城也其棄諸姬亦可知也已諸姬是棄其誰歸之吉也聞之棄同即異是謂離徳詩曰協比其鄰昏姻孔云詩小雅言王者和協近親則昏姻甚歸附也云猶旋旋歸之晉不鄰矣其誰云之齊高子容與宋司徒見知伯女齊相禮子容高止也司徒華定也知伯荀盈也女齊司馬侯也賓出司馬侯言于知伯曰二子皆將不免子容專自是也司徒侈皆亡家之主也知伯曰何如對曰專則速及侈將以其力斃專則人實斃之將及矣為此秋髙止出奔燕昭二十年華定出奔陳傳榖梁傳古者天子封諸侯其地足以容其民其民足以滿城以自守也把危而不能自守故諸侯之大夫相帥以城之此變之正也齊桓城衛而諸侯歸心其志公也晉平城把而人疾其役其志私也平公内不能討衛亂外屈於楚以致中夏諸侯南鄉而旅見乃役十一國以城毋家動又不時諸侯之貳不亦宜乎晉侯使士鞅來聘左傳范獻子來聘拜城把也公享之展莊叔執幣公將以酬賓射者三耦二人為耦公臣不足取于家臣家臣展瑕展玉父為一耦公臣公巫召伯仲顔莊叔為一耦鄫鼔父黨叔為一耦言公室卑微公臣不能備于三耦拜城把且俾我歸把田也以私役諸侯又有所請故特重其禮而遣聘焉把子來盟左傳晉侯使司馬女叔侯來治把田使魯歸前侵把田所歸少故不書弗盡歸也晉悼夫人愠曰夫人平公母把女齊也取貨先君若有知也不尚取之不尚叔侯之取貨公吿叔侯叔侯曰虞虢焦滑霍掦韓魏皆姬姓也八國皆晉所滅杜注焦在陜縣揚屬平陽郡晉是以大若非侵小將何所取武獻以下兼國多矣武公獻公晉始盛之君誰得治之把夏餘也而即東夷魯周公之後也而睦于晉以把封魯猶可而何有焉何有盡歸之魯之于晉也職貢不乏玩好時至公卿大夫相繼于朝史不絶書府無虛月無月不受魯貢如是可矣何必瘠魯以肥把且先君而有知也毋寧夫人而焉用老臣言先君毋寧怪夫人之所為無用責我把文公來盟魯歸其田故來盟書曰子賤之也賤其用夷禮把子來盟為田故也晉治把田非出於公義魯歸把田亦非出於誠心故把子親來要結之吳子使札來聘吳始聘吳始君臣竝見左傳吳公子札來聘見叔孫穆子說之謂穆子曰子其不得死乎好善而不能擇人吾聞君子務在擇人吾子為魯宗卿而任其大政不慎舉何以堪之禍必及子為昭四年𥪡牛作亂起本請觀于周樂魯以周公故有天子禮樂使工為之歌周南召南此皆各依其本國歌所常用聲曲曰美哉美其聲始基之矣猶未也猶有商紂未盡善也然勤而不怨矣為之歌邶鄘衛邶鄘孔氏穎逹曰自紂城而北謂之邶自紂城而南謂之鄘今邶城在河南衛輝府東北鄘城在新鄉縣西武王克殷分其地為三監三監叛周公滅之以其地封康叔故三國盡被康叔之化曰美哉淵乎憂而不困者也吾聞衛康叔武公之徳如是是其衛風乎武公康叔九世孫聼聲以為别故有疑言為之歌王王黍離也平王東遷王政不行風俗下同于諸侯故不為雅曰美哉思而不懼其周之東乎為之歌鄭詩第七曰美哉其細已甚民弗堪也是其先亡乎為之歌齊詩第八曰美哉泱泱乎大風也哉泱泱𢎞大之聲表東海者其大公乎國未可量也為之歌豳詩第十五豳杜注周之舊國在新平漆縣東北今陜西邠州東北有豳亭豳谷三水縣有豳城皆是也曰美哉蕩乎樂而不滛其周公之東乎蕩乎蕩然也周公遭管蔡之變東征三年為成王陳后稷先公不敢荒滛以成王業故言其周公之東乎為之歌秦詩第十一後仲尼刪定故不同曰此之謂夏聲夫能夏則大大之至也其周之舊乎秦本在西戎汧隴之西秦仲始有車馬禮樂去戎狄之音而有諸夏之聲故謂之夏聲及襄公佐平王東遷而受其故地故曰周之舊為之歌魏詩第九魏姬姓國閔元年晉獻公滅之曰美哉渢渢乎大而婉險而易行以徳輔此則明主也渢渢中庸之聲婉約也險當為儉字之誤也為之歌唐詩第十晉詩曰思深哉其有陶唐氏之遺民乎不然何憂之逺也晉夲唐國帝堯舊都非令徳之後誰能若是為之歌陳詩第十二曰國無主其能久乎滛聲放蕩無所畏忌故曰國無主自鄶以下無譏焉鄶第十三曹第十四鄶在今河南宻縣東北不復譏論之以其微也為之歌小雅小雅小正亦樂歌之常曰美哉思而不貳怨而不言其周徳之衰乎猶有先王之遺民焉為之歌大雅大雅陳文王之徳以正天下曰廣哉熙熙乎熙熙和樂聲曲而有直體論其聲其文王之徳乎雅頌所以詠盛德形容故但歌其美者不皆歌變雅為之歌頌頌者以其成功告于神明曰至矣哉言道備直而不倨曲而不屈邇而不偪逺而不攜遷而不滛復而不厭常日新哀而不愁樂而不荒用而不匱廣而不宣不自顯施而不費取而不貪處而不底底滯也行而不流五聲和八風平節有度守有序盛徳之所同也頌有殷魯故曰盛徳所同見舞象箾南籥者象箾舞所執南籥以籥舞也皆文王之樂曰美哉美其容猶有憾文王恨不及已致大平見舞大武者武王樂曰美哉周之盛也其若此乎見舞韶濩者殷湯樂曰聖人之𢎞也而猶有慚徳慚于始伐聖人之難也見舞大夏者禹樂曰美哉勤而不徳盡力溝洫勤也非禹其誰能修之見舞韶箾者舜樂曰徳至矣哉大矣如天之無不幬也如地之無不載也雖甚盛徳其蔑以加于此矣觀止矣若有他樂吾不敢請已其出聘也通嗣君也吳子餘祭嗣立故遂聘于齊說晏平仲謂之曰子速納邑與政無邑無政乃免于難齊國之政將有所歸未獲所歸難未歇也故晏子因陳桓子以納政與邑是以免于欒高之難欒子雅高子尾難在昭八年聘于鄭見子産如舊相識與之縞帶子産獻紵衣焉大帶也吳地貴縞鄭地貴紵故各獻已所貴示不為彼貨利謂子産曰鄭之執政侈侈謂伯有難將至矣政必及子子為政慎之以禮不然鄭國將敗適衛說蘧瑗蘧伯玉史狗史朝之子文子史鰌史魚公子荆字南楚公叔發公叔文子公子朝曰衛多君子未有患也自衛如晉將宿于戚戚孫文子之邑聞鐘聲焉曰異哉吾聞之也辯而不徳辯猶爭也必加于戮夫子獲罪于君以在此懼猶不足而又何樂夫子之在此也猶燕之巢于幕上言至危君又在殯而可以樂乎衛獻公卒未葬遂去之不止宿文子聞之終身不聴琴瑟適晉說趙文子韓宣子魏獻子曰晉國其萃于三族乎說叔向將行謂叔向曰吾子勉之君侈而多良謂多以惡人為良而善之大夫皆富政將在家吾子好直必思自免于難公羊傳吳無君無大夫據向之㑹稱國此何以有君有大夫賢季子也何賢乎季子讓國也其讓國奈何謁也餘祭也夷昧也與季子同母者四季子弱而才兄弟皆愛之同欲立之以為君謁曰今若是迮而與季子國迮起也倉卒意季子猶不受也請無與子而與弟弟兄迭為君而致國乎季子皆曰諾故諸為君者皆輕死為勇飲食必祝曰天苟有吳國尚速有悔于予身故謁也死餘祭也立餘祭也死夷昧也立夷昧也死則國宜之季子者也季子使而亡焉僚者長庶也即之即位季子使而反至而君之爾闔廬曰闔廬謁之長子光先君之所以不與子國而與弟者凡為季子故也將從先君之命與則國宜之季子者也如不從先君之命與則我宜立者也僚焉得為君乎于是使專諸刺僚專諸膳宰僚耆炙魚因進魚而刺之而致國乎季子季子不受曰爾殺吾君吾受爾國是吾與爾為簒也爾殺吾兄吾又殺爾是父子兄弟相殺終身無已也去之延陵延陵吳下邑公子無去國之義故不越竟終身不入吳國故君子以其不受為義以其不殺為仁賢季子則吳何以有君有大夫以季子為臣則宜有君者也札者何吳季子之名也春秋賢者不名此何以名許夷狄者不壹而足也當以漸進之故季子降字而名季子者所賢也曷為不足乎季子許人臣者必使臣許人子者必使子也臣子尊榮莫不欲與君父共之春秋隆父子之親厚君臣之義故賢者不名而札名以成尊于上也榖梁傳吳其稱子何也善使延陵季子故進之也身賢賢也使賢亦賢也延陵季子之賢尊君也以季子之賢吳子得進稱子是尊君也其名成尊于上也札稱名稱吳子使本與楚子使椒来聘秦伯使術來聘同秦楚之使再而後書名稱使初通於魯魯猶忽之吳則晉以楚故數合諸侯以㑹之魯又嘗奉晉命特遣國卿偕衛卿以㑹之其重吳也久矣故始通而舊史所書一同於秦楚耳先儒乃謂孔子特稱名以貶札而推原其故以為辭國而生亂不思札之辭國乃在聘魯之後而預貶之何義乎自盟宋以後中夏諸侯盡朝於楚吳楚方讎故歴聘上國以聮逺交且以觀諸侯之鄉背而其後楚求諸侯於晉以伐吳此當日邦交之情實也秋九月葬衛獻公齊高止出奔北燕北燕始見經左傳秋九月齊公孫蠆公孫竈放其大夫髙止于北燕止高厚之子蠆子尾竈子雅乙未出書曰出奔罪高止也實放書奔所以示罪高止好以事自為功且專故難及之榖梁傳其曰北燕從史文也以時有直言燕者故知從史文據傳齊公孫蠆公孫竈放高止于北燕君放大夫可也臣放大夫不可以訓故以出奔書冬仲孫羯如晉左傳冬孟孝伯如晉報范叔也范叔士鞅此年夏來聘附録左傳為高氏之難故高豎以盧叛豎高止子十月庚寅閭丘嬰帥師圍盧高豎曰苟使高氏有後請致邑齊人立敬仲之曾孫酀敬仲高傒良敬仲也良猶賢也十一月乙夘高豎致盧而出奔晉晉人城緜而寘旃鄭伯有使公孫黑如楚黑子晳辭曰楚鄭方惡而使余往是殺余也伯有曰世行也言世為行人子晳曰可則往難則已何世之有伯有將強使之子晳怒將伐伯有氏大夫和之十二月己巳鄭大夫盟于伯有氏裨諶曰是盟也其與幾何詩曰君子屢盟亂是用長詩小雅今是長亂之道也禍未歇也必三年而後能紓然明曰政將焉往裨諶曰善之代不善天命也其焉辟子産舉不踰等則位班也班次應知政擇善而舉則世隆也為世所高天又除之奪伯有魄喪其精神為子産驅除子西即世將焉辟之天禍鄭久矣其必使子産息之乃猶可以戾戾定也不然將亡矣日講春秋解義卷四十五
