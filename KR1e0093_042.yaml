body:
  text: 欽定四庫全書日講春秋解義卷四十二襄公二十有一年春王正月公如晉左傳二十一年春公如晉拜師及取邾田也謝十八年伐齊之師漷水之田朝聘㑹同禮有常期襄公以取邾田徳晉而於嵗首朝正之會親往拜之失禮甚矣邾庶其以漆閭丘来奔漆閭丘杜注二邑在髙平南平陽縣東北有漆鄉西北有顯閭亭今山東鄒縣北有漆城即漆鄉也顯閭亭即閭丘左傳邾庶其以漆閭丘来奔庶其邾大夫季武子以公姑姊妻之皆有賜于其從者于是魯多盜季孫謂臧武仲曰子盍詰盜詰治也武仲曰不可詰也紇又不能季孫曰我有四封而詰其盜何故不可子為司冦将盜是務去若之何不能武仲曰子召外盜而大禮焉何以止吾盜子為正卿而来外盜使紇去之将何以能庶其竊邑于邾以来子以姬氏妻之而與之邑其從者皆有賜焉若大盜禮焉以君之姑姊與其大邑其次皁牧輿馬給其賤役從皁至牧凡八等之人其小者衣裳劍帶是賞盜也賞而去之其或難焉紇也聞之在上位者洒濯其心壹以待人軌度其信可明徴也言欲納民于法度必信有諸己前後所行皆可明騐而後可以治人夫上之所為民之歸也上所不為而民或為之是以加刑罰焉而莫敢不懲若上之所為而民亦為之乃其所也又可禁乎夏書曰念兹在兹夏書大禹謨兹此也謂行此事當念使可施之于此釋兹在兹釋除也謂欲有所治除于人亦當顧己得無亦有之名言兹在兹名此事言此事亦皆當令可施于此允出兹在兹允信也一念信出于此則其徵之事者亦當在此惟帝念功言其責在帝帝念功則功可成也此斷章為義故與尚書本文稍殊将謂由己壹也言非但意念而已當湏信己誠至信由己壹而後功可念也庶其非卿也以地来雖賤必書重地也公羊傳邾婁庶其者何邾婁大夫也邾婁無大夫此何以書重地也穀梁傳以者不以者也人臣無専祿以邑叛之道来奔者不言出舉其接我者也漆閭丘不言及小大敵也春秋小國大夫多不書其姓氏庶其之書以其接我也以邑出為叛叛而歸魯則據其至魯而言来奔内外異辭也春秋内大惡諱今受叛人直書不諱者公時在晉季孫宿受之也義與公在㑹未歸而書滅項同漆閭丘不言及大小敵也附録左傳齊侯使慶佐為大夫慶佐崔杼黨復討公子牙之黨執公子買于句瀆之丘公子鉏来奔叔孫還奔燕三子齊公族夏楚子庚卒楚子使薳子馮為令尹訪于申叔豫叔豫叔時孫叔豫曰國多寵而王弱國不可為也遂以疾辭方暑闕地下冰而牀焉重繭衣裘繭綿衣鮮食而寢楚子使醫視之復曰瘠則甚矣而血氣未動乃使子南為令尹子南公子追舒為二十二年楚殺追舒傳夏公至自晉秋晉欒盈出奔楚左傳欒桓子娶于范宣子生懐子桓子欒黶懐子欒盈范鞅以其亡也怨欒氏十四年欒黶强逐范鞅使奔秦故與欒盈為公族大夫而不相能桓子卒欒祁與其老州賓通欒祁桓子妻范宣子女盈之母也范氏堯後祁姓幾亡室矣言亂甚懐子患之祁懼其討也愬諸宣子曰盈将為亂以范氏為死桓主而専政矣桓主欒黶曰吾父逐鞅也不怒而以寵報之謂宣子不為黶責怒鞅而反與鞅寵位又與吾同官而専之同為公族大夫吾父死而益富死吾父而専于國有死而已吾蔑從之矣其謀如是懼害于主吾不敢不言范鞅為之徵證其有此懐子好施士多歸之宣子畏其多士也信之懐子為下卿宣子使城著而遂逐之著杜注晉邑在外易逐秋欒盈出奔楚宣子殺箕遺黄淵嘉父司空靖邴豫董叔邴師申書羊舌虎叔羆囚伯華叔向籍偃十人皆晉大夫盈之黨伯華叔向兄羊舌虎其弟也籍偃上軍司馬人謂叔向曰子離于罪其為不知乎叔向曰與其死亾若何詩曰優哉游哉聊以卒嵗知也詩逸詩言君子優游于衰世以辟害而卒其夀是亦知也樂王鮒見叔向曰樂王鮒晉大夫樂桓子吾為子請叔向弗應出不拜其人皆咎叔向叔向曰必祁大夫祁大夫祁奚室老聞之室老叔向家臣之長曰樂王鮒言于君無不行求赦吾子吾子不許祁大夫所不能也而曰必由之何也叔向曰樂王鮒從君者也何能行祁大夫外舉不棄讎内舉不失親其獨遺我乎詩曰有覺徳行四國順之詩大雅覺正直也夫子覺者也晉侯問叔向之罪于樂王鮒對曰不棄其親其有焉言叔向篤親親必與叔虎同謀于是祁奚老矣老去公族大夫聞之乘馹而見宣子曰詩曰惠我無疆子孫保之詩周頌言文武有惠訓之徳加于百姓故子孫保頼之書曰聖有謩勲明徵定保書夏書言聖人之謨謀功勲明有效驗可定安邦國夫謀而鮮過惠訓不倦者叔向有焉謀鮮過有謨勲也惠訓不倦惠我無疆也社稷之固也猶将十世宥之以勸能者今壹不免其身以棄社稷不亦惑乎鯀殛而禹興言不以父廢子伊尹放太甲而相之卒無怨色言不以一怨妨大徳管蔡為戮周公右王言兄弟罪不相及若之何其以虎也棄社稷子為善誰敢不勉多殺何為宣子説與之乘以言諸公而免之共載入見公不見叔向而歸叔向亦不吿免焉而朝明不為私初叔向之母妒叔虎之母美而不使不使見叔向父其子皆諌其母其母曰深山大澤實生龍蛇言非常之地多生非常之物彼美余懼其生龍蛇以禍女龍蛇喻竒怪女敝族也國多大寵不仁人閒之不亦難乎余何愛焉使往視寝生叔虎美而有勇力欒懐子嬖之故羊舌氏之族及于難欒盈過于周周西鄙掠之辭于行人曰王行人天子陪臣盈得罪于王之守臣范宣子為王所命故曰守臣将逃罪罪重于郊甸謂為郊甸所侵掠曰罪重孫辭無所伏竄敢布其死昔陪臣書能輸力于王室輸力謂輔晉以翼戴天子王施惠焉其子黶不能保任其父之勞大君若不棄書之力大君謂天王亾臣猶有所逃若棄書之力而思黶之罪臣戮餘也将歸死于尉氏尉氏討姦之官不敢還矣敢布四體布四體言無所隠唯大君命焉王曰尤而效之其又甚焉尤晉逐盈而自掠之是效尤使司徒禁掠欒氏者歸所取焉使候出諸轘轅候送迎賔客之官轘轅杜注轘轅闗在緱氏縣東南今河南鞏縣西南有轘轅山凡大夫出奔皆不書逐之之人而以自奔為文者明其自有取奔之道也盈不能防閑其母禍有自矣故不以范匄逐之為文匄之罪易見盈之失難知也君子違不適讎國楚晉之讎也盈之奔楚欲因楚力以復入此無君之罪也九月庚戌朔日有食之冬十月庚辰朔日有食之厯家推歩之術皆一百七十三日始一交㑹去交逺則日食漸少無頻食之理此年及二十四年頻食古今術者不能考知故日食雖天數之常聖人必以為譴異而書之以警人君之怠也曹伯来朝左傳冬曹武公来朝始見也曹伯即位三年此䘮畢入見天子時也不朝京師而朝魯曽是以為禮乎公㑹晉侯齊侯宋公衞侯鄭伯曹伯莒子邾子于商任商任杜注地闕左傳㑹于商任錮欒氏也禁錮欒氏使諸侯不得受齊侯衞侯不敬叔向曰二君者必不免㑹朝禮之經也禮政之輿也政湏禮而行政身之守也政存則身安怠禮失政失政不立是以亂也為二十五年齊弑光二十六年衞弑剽傳知起中行喜州綽邢蒯出奔齊皆欒氏之黨也四子晉大夫樂王鮒謂范宣子曰盍反州綽邢蒯勇士也宣子曰彼欒氏之勇也余何獲焉王鮒曰子為彼欒氏乃亦子之勇也言子待之如欒氏亦為子用也齊荘公朝指殖綽郭最曰是寡人之雄也州綽曰君以為雄誰敢不雄然臣不敏平隂之役先二子鳴前十八年晉伐齊及平隂州綽獲殖綽郭最故自比于雞鬬勝而先鳴荘公為勇爵設爵位以命勇士一云爵飲酒器設此以觴勇士殖綽郭最欲與焉州綽曰東閭之役臣左驂廹還于門中識其枚數事見前十八年其可以與于此乎公曰子為晉君也對曰臣為隸新言事齊日淺未得效勇耳然二子者譬于禽獸臣食其肉而寝處其皮矣欒氏之出徒以范氏私相忌怨何有於國而平公受其激怒勤動諸侯以逞范鞅之積憾必欲盈無所容於世故盈發憤卒興禍亂此皆以私敗公足為世戒是時列國無事晉無所發政而亟㑹諸侯則知𫝊稱為錮欒氏信不誣也附録公羊十有一月庚子孔子生時嵗在己酉附録穀梁庚子孔子生二十有二年春王正月公至自㑹當嵗之首月而公至自㑹著不朝正於廟也附錄左傳二十二年春臧武仲如晉雨過御叔御叔魯御邑大夫御叔在其邑将飲酒曰焉用聖人武仲多知時人謂之聖我将飲酒而已雨行何以聖為穆叔聞之曰不可使也而傲使人言御叔不任使四方國之蠧也令倍其賦古者家有國邑故以重賦為罰𫝊言穆叔能用教夏四月附錄左傳夏晉人徵朝于鄭鄭人使少正公孫僑對曰少正鄭卿官也公孫僑子産在晉先君悼公九年我寡君于是即位魯襄八年即位八月而我先大夫子駟從寡君以朝于執事執事不禮于寡君寡君懼因是行也我二年六月朝于楚晉是以有戲之役在九年楚人猶競而申禮于敝邑敝邑欲從執事而懼為大尤曰晉其謂我不共有禮是以不敢攜貳于楚我四年三月先大夫子蟜又從寡君以觀釁于楚實朝言觀釁飾辭也言欲往視楚知可去否晉于是乎有蕭魚之役在十一年謂我敝邑邇在晉國譬諸草木吾臭味也而何敢差池差池不齊一楚亦不競寡君盡其土實土地所有重之以宗器以受齊盟遂帥羣臣隨于執事以㑹嵗終朝正貳于楚者子侯石盂歸而討之石盂石㚟湨梁之明年湨梁在十六年子蟜老矣公孫夏從寡君以朝于君見于嘗酎酒之新熟重者為酎嘗新飲酒為嘗酎與執燔焉助祭閒二年聞君将靖東夏謂二十年澶淵盟四月又朝以聽事期聽㑹期不朝之閒無嵗不聘無役不從以大國政令之無常國家罷病不虞荐至荐仍也無日不惕豈敢忘職大國若安定之其朝夕在庭何辱命焉若不恤其患而以為口實謂但有徵責之言其無乃不堪任命而翦為仇讎敝邑是懼其敢忘君命委諸執事執事實重圖之傳言子産有辭所以免大國之討秋七月辛酉叔老卒附錄左傳秋欒盈自楚適齊晏平仲言于齊侯曰商任之㑹受命于晉受錮欒氏之命今納欒氏将安用之小所以事大信也失信不立君其圖之弗聽退吿陳文子曰君人執信臣人執共忠信篤敬上下同之天之道也君自棄也弗能久矣為二十五年齊弑其君光𫝊九月鄭公孫黑肱有疾歸邑于公黑肱子張召室老宗人立段段子石黑肱子而使黜官薄祭黜官無多受職祭以特羊殷以少牢四時祀以一羊三年盛祭以羊豕殷盛也足以共祀盡歸其餘邑曰吾聞之生于亂世貴而能貧民無求焉可以後亡敬共事君與二三子生在敬戒不在富也已己伯張卒君子曰善戒詩曰慎爾侯度用戒不虞鄭子張其有焉詩大雅侯維也義取慎法度戒未然冬公㑹晉侯齊侯宋公衞侯鄭伯曹伯莒子邾子薛伯把伯小邾子于沙隨邾子下公羊穀梁有滕子左傳冬㑹于沙隨復錮欒氏也晉知欒盈在齊故欒盈猶在齊晏子曰禍将作矣齊将伐晉不可以不懼為明年齊伐晉𫝊晉聞欒盈去楚適齊復為此㑹意専在於齊也大夫彊擅以范氏惡欒盈而期年之閒再合諸侯晉失伯者之義不足以令諸侯矣是以齊荘不服雖㑹而隂實保盈明年遂伐晉也公至自㑹楚殺其大夫公子追舒左傳楚觀起有寵于令尹子南子南公子追舒未益禄而有馬數十乘言子南偏寵觀起令富楚人患之王将討焉子南之子棄疾為王御士王每見之必泣棄疾曰君三泣臣矣敢問誰之罪也王曰令尹之不能爾所知也國将討焉爾其居乎問能止事我否對曰父戮子居君焉用之洩命重刑臣亦不為漏洩君命罪之重王遂殺子南于朝轘觀起于四竟子南之臣謂棄疾請徙子尸于朝子子南欲犯命取殯曰君臣有禮唯二三子不欲犯命移尸三日棄疾請尸王許之既葬其徒曰行乎曰吾與殺吾父行将焉入曰然則臣王乎曰棄父事讎吾弗忍也遂縊而死𫝊譏康王與人子謀其父失君臣之義復使薳子馮為令尹公子齮為司馬屈建為莫敖屈建子本有寵于薳子者八人皆無祿而多馬他日朝與申叔豫言弗應而退從之入于人中申叔辟薳子不欲與語又從之遂歸退朝見之薳子就申叔家見之曰子三困我于朝吾懼不敢不見吾過子姑吿我何疾我也對曰吾不免是懼何敢吿子言恐與子並罪故不敢與子語曰何故對曰昔觀起有寵于子南子南得罪觀起車裂何故不懼自御而歸不能當道薳子惶懼意不在御至謂八人者曰吾見申叔夫子所謂生死而肉骨也知我者如夫子則可夫子謂申叔也如夫子謂以義匡已不然請止辭八人者而後王安之追舒寵近小人其及固宜然楚子乃與人之子謀殺其父賊恩害義甚矣故以累上之辭言之附錄左傳十二月鄭游眅将如晉游眅公孫蠆子未出竟遭逆妻者奪之以館于邑丁巳其夫攻子明殺之以其妻行子明游眅十二月無丁巳丁巳十一月十四日也子展廢良而立太叔良游眅子太叔眅弟曰國卿君之貳也民之主也不可以苟請舍子明之類子明有罪而良又不賢故求亾妻者使復其所使游氏勿怨曰無昭惡也二十有三年春王二月癸酉朔日有食之三月己巳把伯匄卒左傳二十三年春杞孝公卒晉悼夫人䘮之悼夫人晉平公母把孝公姊妹平公不徹樂非禮也禮為鄰國闕禮諸侯絶期故以鄰國責之把自桓公以来與晉悼為婚姻國魯禮有加焉故其卒其葬皆得書夏邾畀我来奔公羊作鼻我公羊傳邾婁鼻我者何邾婁大夫也邾婁無大夫此何以書以近書也畀我庶其之黨書来奔惡内也鄉受邾叛人邑今又納其叛人故是年冬臧紇奔邾邾亦受之葬把孝公陳殺其大夫慶虎及慶寅左傳陳侯如楚公子黄愬二慶于楚楚人召之二慶虎及寅也二十年二慶譖黄黄奔楚自理今陳侯往楚乃信黄為召二慶使慶樂往殺之慶樂二慶之族二慶畏誅故不敢自往慶氏以陳叛夏屈建從陳侯圍陳陳人城治城以距君板隊而殺人役人相命各殺其長慶氏忿其板隊遂殺築人故役人怒而作亂遂殺慶虎慶寅楚人納公子黄君子謂慶氏不義不可肆也故書曰惟命不于常周書康誥言有義則存無義則亾穀梁傳稱國以殺罪累上也及慶寅慶寅累也以慶虎及之慶虎與寅據國叛君其罪大矣楚實討而克之而以國殺為文何也盖陳侯不能正其罪而帥楚師以臨之使役人懼楚而殺二慶故不得以討賊書然觀陳蔡附楚尚能藉楚之力以制亂臣而魯臣之逆節皆齊晉成之蓋義亦有愧於楚矣及慶寅以虎之罪而及之也陳侯之弟黄自楚歸于陳黄之出以二慶二慶死則黄之歸易矣自楚者因楚力也晉欒盈復入于晉入于曲沃左傳晉将嫁女于吳齊侯使析歸父媵之以藩載欒盈及其士藩車之有障蔽者使若媵妾在其中納諸曲沃欒盈邑欒盈夜見胥午而吿之胥午守曲沃大夫對曰不可天之所廢誰能興之子必不免吾非愛死也知不集也集成也盈曰雖然因子而死吾無悔矣我實不天子無咎焉許諾伏之而觴曲沃人胥午匿盈而飲其衆樂作午言曰今也得欒孺子何如孺子欒盈對曰得主而為之死猶不死也皆歎有泣者爵行又言皆曰得主何貳之有盈出徧拜之謝衆之思己四月欒盈帥曲沃之甲因魏獻子以晝入絳獻子魏舒絳晉國都初欒盈佐魏荘子于下軍荘子魏絳獻子之父獻子私焉故因之私相親愛趙氏以原屏之難怨欒氏成八年荘姬譖之欒郤為徵韓趙方睦韓起讓趙武故和睦中行氏以伐秦之役怨欒氏十四年晉伐秦欒黶違荀偃命而固與范氏和親范宣子佐中行偃于中軍知悼子少而聽于中行氏悼子知罃之子荀盈也少年十七知氏中行氏同祖故相聽從程鄭嬖于公鄭亦荀氏宗唯魏氏及七輿大夫與之七輿官名樂王鮒侍坐于范宣子或吿曰欒氏至矣宣子懼桓子曰奉君以走固宫必無害也桓子樂王鮒固宫宫之有臺觀守備者且欒氏多怨子為政欒氏自外子在位其利多矣既有利權又執民柄賞罰為民柄將何懼焉欒氏所得其唯魏氏乎而可强取也夫克亂在權子無懈矣公有姻䘮夫人有杞䘮王鮒使宣子墨縗冒絰二婦人輦以如公恐欒氏有内應距之故為婦人服而入奉公以如固宫范鞅逆魏舒用王鮒計欲强取之則成列既乘將逆欒氏矣趨進曰欒氏帥賊以入鞅之父與二三子在君所矣使鞅逆吾子鞅請驂乘持帶驂乘必持帶備墮隊遂超乘躍登獻子車右撫劍左援帶劫之命驅之出僕請請所至鞅曰之公宣子逆諸階執其手賂之以曲沃恐不與已同心初斐豹隸也著于丹書盖犯罪沒為官奴以丹書其罪欒氏之力臣曰督戎國人懼之斐豹謂宣子曰苟焚丹書我殺督戎宣子喜曰而殺之所不請于君焚丹書者有如日乃出豹而閉之閉諸門外督戎從之踰隠而待之隠短牆也督戎踰入豹自後擊而殺之范氏之徒左臺後公臺之後欒氏乘公門乘登宣子謂鞅曰矢及君屋死之鞅用劍以帥卒用劍短兵接敵欲致死欒氏退攝車從之鞅攝宣子戎車遇欒樂樂盈之族曰樂免之死将訟女于天樂射之不中又注注屬矢于弦也則乘槐本而覆樂樂車轢槐而覆或以㦸鉤之斷肘而死欒魴傷魴欒氏族欒盈奔曲沃晉人圍之公羊傳曲沃者何晉之邑也其言入于晉入于曲沃何欒盈将入晉晉人不納由乎曲沃而入也盈挾齊援以入而不稱自齊潛入也不言叛非直叛也劫衆以敵君直亂而已矣曲沃欒氏邑盈帥曲沃之甲以入晉而兵敗之後仍入曲沃蓋當時彊臣各以利誘其私屬背公死黨不復知有大義春秋據實以書見諸行事者可謂深切著明矣秋齊侯伐衞遂伐晉齊始伐盟主左傳秋齊侯伐衞先驅穀榮御王孫揮召揚為右先驅前鋒軍申驅成秩御莒恒申鮮虞之傅摯為右申驅次前軍傅摯申鮮虞之子也曹開御戎晏父戎為右公御右貳廣上之登御邢公盧蒲癸為右貳廣公副車啓牢成御襄罷師狼蘧疏為右左翼曰啓胠商子車御侯朝桓跳為右右翼曰胠大殿商子游御夏之御宼崔如為右大殿後軍燭庸之越駟乘四人共乘殿車也自衞将遂伐晉晏平仲曰君恃勇力以伐盟主若不濟國之福也不徳而有功憂必及君崔杼諌曰不可臣聞之小國閒大國之敗而毁焉必受其咎君其圖之弗聽陳文子見崔武子曰文子陳完之孫須無武子崔杼也将如君何武子曰吾言于君君弗聽也以為盟主而利其難羣臣若急君于何有言欲弑之以説晉子姑止之文子退吿其人曰崔子将死乎謂君甚而又過之弑君之惡過于背盟主不得其死過君以義猶自抑也自抑損况以惡乎齊侯遂伐晉取朝歌朝歌杜注屬汲郡今河南淇縣即古朝歌也為二隊入孟門登大行二隊分兵為二部孟門杜注晉隘道司馬貞曰在朝歌東北大行杜注山在河内郡北地理志在野王縣西北今河南河内縣即河内郡野王縣張武軍于熒庭張武軍謂築壘壁熒庭杜注晉地戍郫邵取而守之郫邵杜注晉邑封少水封晉尸以為京觀少水即澮水也出今河南密縣古鄶城西北以報平隂之役乃還平隂役在十八年趙勝帥東陽之師以追之獲晏氂趙勝趙旃之子東陽杜注晉之山東魏郡廣平以北今山東恩縣西北有東陽城晏氂齊大夫上書欒盈入曲沃而繼書齊侯伐晉則𫝊稱齊隂納盈信而有徵矣齊為平隂之役欲報晉而未有閒故隂納盈以亂其國因乘亂以伐之度晉方内難力有所不能及也其言遂何意主伐晉而伐衞以先之猶齊桓意在伐楚而侵蔡以先之也八月叔孫豹帥師救晉次于雍榆榆公羊榖梁作渝雍榆杜注晉地汲郡朝歌縣東有雍城在今濬縣西南左傳八月叔孫豹帥師救晉次于雍榆禮也公羊傳曷為先言救而後言次先通君命也穀梁傳言救後次非救也救者赴急之師次止也次于雍榆有所畏也不救則畏晉之討往救則畏齊之彊於是遲回觀望待其已去而後躡之也然則齊桓聶北之次豈異此歟盖聶北之役先言次而後言救按兵待時卒能救邢故以救終之雍榆之役先言救而後言次心持兩端緩不及事故以次終之己卯仲孫速卒左傳季武子無適子公彌長而愛悼子欲立之公彌公鉏悼子紇也訪于申豐曰申豐季氏屬大夫彌與紇吾皆愛之欲擇才焉而立之申豐趨退歸盡室将行他日又訪焉對曰其然将具敝車而行其然猶必爾乃止訪于臧紇臧紇曰飲我酒吾為子立之季氏飲大夫酒臧紇為客為上賔既獻已獻酒臧孫命北靣重席新樽絜之酒樽既新復澡絜之召悼子降逆之大夫皆起及旅而召公鉏獻酬禮畢通行為旅使與之齒使從庶子之禮列在悼子下季孫失色季氏以公鉏為馬正馬正家司馬慍而不出閔子馬見之閔子馬閔馬父曰子無然禍福無門唯人所召為人子者患不孝不患無所所位處敬共父命何常之有若能孝敬富倍季氏可也姦回不軌禍倍下民可也公鉏然之敬共朝夕恪居官次次舍也季孫喜使飲己酒而以具往具燕饗之具盡舍旃故公鉏氏富又出為公左宰出季氏家臣仕于公孟孫惡臧孫季孫愛之孟氏之御騶豐點好羯也羯孟荘子之庶子孺子秩之弟孝伯也曰從余言必為孟孫為孟孫後再三云羯從之孟荘子疾豐點謂公鉏苟立羯請讎臧氏使孟氏與公鉏共憎臧孫公鉏謂季孫曰孺子秩固其所也固自當立若羯立則季氏信有力于臧氏矣不應立而立之則彼荷其恩故功力多也以臧氏為辭盖譏之弗應己卯孟孫卒公鉏奉羯立于户側户側䘮主季孫至入哭而出曰秩焉在公鉏曰羯在此矣季孫曰孺子長公鉏曰何長之有唯其才也季孫廢鉏立紇云欲擇才故以此答之且夫子之命也遂誣孟孫遂立羯秩奔邾臧孫入哭甚哀多涕出其御曰孟孫之惡子也而哀如是季孫若死其若之何臧孫曰季孫之愛我疾疢也常志相順從身之害孟孫之惡我藥石也常志相違戾猶藥石之療疾美疢不如惡石夫石猶生我愈已疾也疢之美其毒滋多孟孫死吾亡無日矣冬十月乙亥臧孫紇出奔邾左傳孟氏閉門告于季孫曰臧氏将為亂不使我葬欲為公鉏讐臧氏季孫不信臧孫聞之戒戒為備也冬十月孟氏将辟藉除于臧氏辟穿藏也于臧氏借人除葬道臧孫使正夫助之正夫隧正除于東門甲從已而視之畏孟氏故從甲士視作者孟氏又告季孫季孫怒命攻臧氏見其有甲故乙亥臧紇斬鹿門之闗以出魯南城東門奔邾初臧宣叔娶于鑄生賈及為而死鑄杜注鑄國濟北蛇丘縣所治今山東肥城縣有鑄鄉即漢蛇丘縣治也繼室以其姪穆姜之姨子也姪穆姜姨母之子與穆姜為姨昆弟生紇長于公宫姜氏愛之故立之臧賈臧為出在鑄臧武仲自邾使吿臧賈且致大蔡焉大蔡大龜曰紇不佞失守宗祧敢吿不弔紇之罪不及不祀子以大蔡納請其可賈曰是家之禍也非子之過也賈聞命矣再拜受龜使為以納請賈使為為己請遂自為也為自為請臧孫如防防臧孫邑使来吿曰紇非能害也知不足也言使甲從己但慮事淺耳非敢私請苟守先祀無廢二勲二勲文仲宣叔敢不辟邑乃立臧為臧紇致防而奔齊其人曰其盟我乎謂陳其罪惡盟諸大夫以為戒臧孫曰無辭廢長立少季孫所忌故謂無辭以罪己将盟臧氏季孫召外史掌惡臣而問盟首焉惡臣謂奔亡者盟首載書之章首對曰盟東門氏也曰毋或如東門遂不聽公命殺適立庶文公命立子惡公子遂殺之立宣公盟叔孫氏也曰毋或如叔孫僑如欲廢國常蕩覆公室謂譖公與季孟于晉季孫曰臧孫之罪皆不及此孟椒曰盍以其犯門斬闗季孫用之乃盟臧氏曰無或如臧孫紇干國之紀犯門斬闗臧孫聞之曰國有人焉誰居其孟椒乎孟椒孟獻子之孫子服惠伯居猶與也穀梁傳其日正臧孫紇之出也正其有罪蘧伯玉曰不以道事其君者其出乎紇阿季氏擅廢立以取亡罪也以防不書者魯不知以是罪紇特以犯門斬闗盟之故舊史唯紀其奔而聖人因之晉人殺欒盈左傳晉人克欒盈于曲沃盡殺欒氏之族黨欒魴出奔宋書曰晉人殺欒盈不言大夫言自外也公羊傳曷為不言殺其大夫非其大夫也穀梁傳惡之弗有也不言殺其大夫是不有之以為大夫自外犯君而入非復晉大夫故不言殺其大夫稱人者討賊之辭齊侯襲莒左傳齊侯還自晉不入遂襲莒門于且于且于杜注莒邑在今山東莒州境傷股而退齊侯傷明日将復戰期于夀舒夀舒杜注莒地亦屬莒州杞殖華還載甲夜入且于之隧二子齊大夫且于隧狹路宿于莒郊明日先遇莒子于蒲侯氏蒲侯氏杜注近莒之邑莒子重賂之使無死曰請有盟欲以盟要二子無致死戰華周對曰華周即華還貪貨棄命亦君所惡也昏而受命日未中而棄之何以事君莒子親鼓之從而伐之獲杞梁把梁即把殖莒人行成勝大國益懼故行成齊侯歸遇把梁之妻于郊梁戰死妻行迎䘮使弔之辭曰殖之有罪何辱命焉若免于罪猶有先人之敝廬在下妾不得與郊弔齊侯弔諸其室𫝊善婦人有禮乘人不備掩而取之曰襲齊侯還自伐晉而襲莒無名之師盜賊之為耳不言遂閒有事也附錄左傳齊侯将為臧紇田與之田邑臧孫聞之見齊侯與之言伐晉齊侯自道伐晉之功對曰多則多矣抑君似䑕夫䑕晝伏夜動不穴于寝廟畏人故也今君聞晉之亂而後作焉寧将事之非䑕何如乃弗與田臧孫知齊侯将敗不欲受其邑故以比䑕欲使怒而止仲尼曰知之難也有臧武仲之知謂能辟齊禍而不容于魯國抑有由也作不順而施不恕也夏書曰念兹在兹言行事當常念如在己身也順事恕施也日講春秋解義卷四十二
