body:
  text: 欽定四庫全書日講春秋解義卷十九僖公二十有一年春狄侵衛狄前伐衛盟郉以其有救患之善故稱人今兹侵衛師出無名故從其本稱也宋人齊人楚人盟于鹿上鹿上杜注宋地汝隂有原鹿縣今江南潁州太和縣西有原鹿城左傳二十一年春宋人為鹿上之盟以求諸侯于楚欲借楚之令使諸侯從己楚人許之公子目夷曰小國爭盟禍也宋其亡乎幸而後敗宋襄曹南之盟從者曹邾而曹復二齊之盟則陳蔡魯鄭皆服於楚故心竊慕焉而求諸侯於楚夫欲逞志於列國者楚也不能攘楚以安列國反盟楚以求諸侯義乖而計失莫此為甚矣盟于宋地必宋公親之而書人者齊楚皆大夫故赴告之辭不言宋公親與之盟而魯史從之也夏大旱左傳夏大旱公欲焚巫尫巫尫女巫也主祈禱請雨者或以為尫非巫也瘠病之人其面上向俗謂天哀其病恐雨入其鼻故為之旱是以公欲焚之臧文仲曰非旱備也修城郭貶食省用務穡勸分穡儉也勸分有無相濟此其務也巫尫何為天欲殺之則如勿生若能為旱焚之滋甚公從之是嵗也饑而不害不傷害民公羊傳何以書記災也穀梁傳旱時正也旱必歷時非一月之事故以書時為正春秋之例旱則修雩雩而得雨則書雩雩不得雨則書旱明災成也大者久且甚之辭秋宋公楚子陳侯蔡侯鄭伯許男曹伯㑹于盂執宋公以伐宋盂公羊作霍穀梁作雩杜注宋地今河南睢州有盂亭左傳秋諸侯㑹宋公于盂子魚曰禍其在此乎君欲己甚其何以堪之于是楚執宋公以伐宋公羊傳孰執之楚子執之曷為不言楚子執之不與夷狄之執中國也穀梁傳以重辭也國之所重故曰重辭執宋公者楚子也何以不書楚子宋率諸侯為㑹而楚執㑹主諸侯莫違故以同執為文所以分惡於諸侯也楚子使宜申來獻捷稱楚人此則書爵何也執宋公不可稱執宋人爵宋公而人諸國則疑若君與大夫㑹故皆稱爵而楚之詐宋之愚皆不待貶而自著矣冬公伐邾左傳任宿須句顓臾風姓也實司大皥與有濟之祀司主也大皥伏義也四國伏羲之後故主其祀任杜注任城縣也今山東濟寧州須句杜注在東平須昌縣西北今山東東平州東南有須句故城顓臾杜注在泰山南武陽縣東北今山東費縣西北有顓㬰城四國封近于濟故世祀之以服事諸夏與諸夏同服王事邾人滅須句須句子來奔因成風也須句成風母家成風為之言于公曰崇明祀保小寡周禮也明祀大皥有濟之祀保安也蠻夷猾夏周禍也邾曰蠻夷蓋迫近諸戎雜用夷禮故極言之若封須句是崇皥濟而修祀紓禍也紓解也為明年公伐邾𫝊邾滅須句經雖無文以明年取須句徴之則此年伐邾必感於成風所云也然大旱經時不知貶食損用而重興戎以困民非其道矣楚人使宜申來獻捷公羊傳此楚子也據稱使知為楚子其稱人何貶曷為貶為執宋公貶曷為為執宋公貶宋公與楚子期以乘車之㑹公子目夷諫曰楚夷國也强而無義請君以兵車之㑹往宋公曰不可吾與之約以乘車之㑹自我為之自我墮之曰不可終以乘車之㑹往楚人果伏兵車執宋公以伐宋宋公謂公子目夷曰子歸守國矣國子之國也吾不從子之言以至此乎公子目夷復曰君雖不言國國固臣之國也所以堅宋公意絶强楚之望于是歸設守械而守國楚人謂宋人曰子不與我國吾將殺子君矣宋人應之曰吾賴社稷之神靈吾國己有君矣楚人知雖殺宋公猶不得宋國于是釋宋公宋公釋乎執走之衛宋公愧前語故走之衛不書者執解而往非出奔也公子目夷復曰國為君守之君曷為不入然後逆襄公歸惡乎捷捷乎宋曷為不言捷乎宋為襄公諱也宋襄守信見欺故為之諱此圍辭也據上言守國知圍也曷為不言其圍為公子目夷諱也目夷遭難設權有存國免主之功故為之諱榖梁傳捷軍得也其不曰宋捷何也不與楚捷于宋也君使大夫何以稱人貶之也楚逞詐力欺諸侯執宋公而伐其國以魯不與㑹特假宋捷以威之僖公不能以禮拒而受其使命故不言宋捷為魯諱也十有二月癸丑公㑹諸侯盟于薄釋宋公薄宋地漢置薄縣屬山陽郡後漢改屬梁國今河南歸德府治西北有亳城即薄也左傳冬㑹于薄以釋之子魚曰禍猶未也未足以懲君為二十二年戰泓𫝊公羊傳執未有言釋之者此其言釋之何公與為爾也公與為爾奈何公與議爾也榖梁傳㑹者外為主焉爾外釋不志此其志何也以公之與之盟目之也不言楚不與楚専釋也凡盟不書所為盟于薄特言釋宋公者宋公方主㑹而楚執而伐之魯既不能明正其罪反懾於獻捷之威就楚求盟以請釋是操縱之權皆自楚出此天下大變故特書所為以謹之楚主盟而書公㑹諸侯不與楚主盟也諸侯請釋於楚而不言楚釋不與楚専釋也凡國君見執而返皆書歸此言釋不言歸者歸則自己主之釋則自人主之若曰諸侯不俯焉受盟於楚則宋公不得釋所以甚楚而病宋公也二十有二年春公伐邾取須句句公羊作朐後同左傳二十二年春伐邾取須句反其君焉禮也得恤寡小之禮須句為成風母家邾取而我伐之反其地置其君左氏所𫝊必信而有徴但以經書取斷之則罪其不請王命専為母家報讎雖存須句之祀而取為內臣實貪其土也使果有存亡繼絶之功則春秋必書公伐邾歸須句子于須句以著其善矣夏宋公衛侯許男滕子伐鄭左傳三月鄭伯如楚夏宋公伐鄭怒其朝楚故伐之子魚曰所謂禍在此矣鄭之朝楚信有罪矣然宋公本欲求好於楚以屬諸侯及力不能抗甘就執辱何以責鄭之附楚哉不知自反而遽興師以伐鄭榖梁氏所謂過而不改而又甚之者也然宋公見執而三國旋就宋棄楚陳亦與楚離心蓋深懼楚人暴詐而思中國之有霸也使襄公當此能恤民厲士以厚國勢布德修禮以綏諸侯則諸侯可以復合霸事可以復興乃不度德不量力而急於爭鄭敵楚以致師敗身傷使楚氛益熾見小欲速無德而寡謀其禍敗乃自取耳附録左傳初平王之東遷也因犬戎之變遷都洛邑辛有適伊川辛有周大夫伊川杜注周地伊水也見被髮而祭于野者曰不及百年此其戎乎其禮先亡矣被髮而祭衣冠之禮先亡秋秦晉遷陸渾之戎于伊川允姓之戎居陸渾在秦晉西北至是二國誘而徙之伊川辛有之言果驗晉大子圉為質于秦在十七年將逃歸謂嬴氏曰嬴氏秦所妻子圉懷嬴也與子歸乎對曰子晉太子而辱于秦子之欲歸不亦宜乎寡君之使婢子侍執巾櫛婢子婦人之卑稱以固子也從子而歸棄君命也不敢從亦不敢言遂逃歸𫝊終史蘇之占富辰言于王曰請召大叔富辰周大夫大叔王子帶十二年奔齊詩曰協比其鄰昏姻孔云詩小雅鄰猶近也孔甚也云旋也言王者先協和近親則昏姻甚相歸附也吾兄弟之不協焉能怨諸侯之不睦王說王子帶自齊復歸于京師王召之也終仲孫湫之言為二十四年天王出居于鄭𫝊秋八月丁未及邾人戰于升陘升陘杜注魯地左傳邾人以須句故出師公卑邾不設備而禦之卑小也臧文仲曰國無小不可易也無備雖衆不可恃也詩曰戰戰兢兢如臨深淵如履薄冰詩小雅言常戒懼又曰敬之敬之天維顯思命不易哉詩周頌顯明也思語辭言天之降鑒甚明其命靡常不易保先王之明德猶無不難也無不懼也况我小國乎君其無謂邾小蜂蠆有毒而况國乎弗聽八月丁未公及邾師戰于升陘我師敗績邾人獲公胄縣諸魚門魚門邾城門穀梁傳內諱敗舉其可道者也不言其人以吾敗也不言及之者為內諱也邾之出師以須句故也不書敗諱恥也內以諱為貶不書公其貶可知觀此則魯取須句之非存亡繼絶也益信冬十有一月己巳朔宋公及楚人戰于泓宋師敗績泓杜注水名在今河南柘城縣北左傳楚人伐宋以救鄭宋公將戰大司馬固諫曰固莊公之孫公孫固也言大司馬以别子魚天之棄商久矣君將興之弗可赦也已弗聽冬十一月己巳朔宋公及楚人戰于泓宋人既成列楚人未既濟未盡渡泓水司馬曰子魚曰彼衆我寡及其未既濟也請擊之公曰不可既濟而未成列又以告公曰未可既陳而後擊之宋師敗績公傷股門官殱焉門官守門者師行則在君左右殱盡也國人皆咎公公曰君子不重傷不禽二毛二毛頭白有二色古之為軍也不以阻隘也不因阻隘以求勝寡人雖亡國之餘以商之後故稱亡國之餘不鼓不成列恥以詐取勝也子魚曰君未知戰勍敵之人隘而不列天贊我也勍强也言楚在險隘不得陳列乃天所以佐宋阻而鼓之不亦可乎猶有懼焉雖因阻擊之猶恐不勝且今之勍者皆吾敵也雖及胡耉胡耉元老之稱獲則取之何有于二毛明恥教戰求殺敵也明設刑戮以恥不果傷未及死如何勿重言尚能害己若愛重傷則如勿傷愛其二毛則如服焉言苟不欲傷殺敵人則本可不須鬬三軍以利用也本為利興金鼓以聲氣也所以佐士衆之聲氣利而用之阻隘可也聲盛致志鼓儳可也儳巖未整陳公羊傳偏戰者日爾此其言朔何據桓十七年奚之戰不言朔春秋辭繁而不殺者正也繁多也殺省也正得正道何正爾宋公與楚人期戰于泓之陽水北曰陽楚人濟泓而來有司復曰請逮其未畢濟而擊之宋公曰不可吾聞之也君子不厄人吾雖喪國之餘寡人不忍行也既濟未畢陳有司復曰請逮其未畢陳而擊之宋公曰不可吾聞之也君子不鼓不成列已陳然後襄公鼓之宋師大敗故君子大其不鼓不成列臨大事而不忘大禮有君而無臣以為雖文王之戰亦不過此也榖梁傳日事遇朔曰朔此日之事遇朔則書朔春秋三十有四戰未有以尊敗乎卑以師敗乎人者也以尊敗乎卑以師敗乎人則驕其敵此論春秋書法謂如以尊敗乎卑則以卑者為主為若驕肆敢于犯尊者然襄公以師敗乎人而不驕其敵何也責之也泓之戰以為復雩之恥也雩即盂雩之恥宋襄公有以自取之伐齊之喪執滕子圍曹為雩之㑹不顧其力之不足而致楚成王成王怒而執之故曰禮人而不答則反其敬愛人而不親則反其仁治人而不治則反其知過而不改又之又復是謂之過襄公之謂也古者被甲嬰胄非以興國也則以征無道也豈曰以報其恥哉宋公與楚人戰于泓水之上司馬子反曰子反當為子魚楚衆我少鼓險而擊之勝無幸焉若要而擊之必可破非僥幸也襄公曰君子不推人危不攻人厄須其出待其出險既出旌亂于上陳亂于下子反曰楚衆我少擊之勝無幸焉襄公曰不鼓不成列須其成列而後擊之則衆敗而身傷焉七月而死倍則攻敵則戰少則守人之所以為人者言也人而不能言何以為人言之所以為言者信也言而不信何以為言信之所以為信者道也信而不道何以為道道之貴者時其勢行也道貴隨時制宜順其所行之勢而變通之不在守匹夫之小信此戰三𫝊皆稱楚人先儒或謂楚子在師貶而稱人蓋據左氏鄭夫人勞楚子于柯澤而言不知楚之軍法每使大夫前進而君次於後以為之援其在柯澤不足為臨敵之徴但楚師救鄭而不書則惡楚可知矣書宋及外楚而內宋也公羊氏以不鼓不成列為臨大事不忘大禮誤矣宋襄多行不義而獨愛重傷與二毛徇末遺本其道大悖何所取哉附録左傳丙子晨鄭文夫人芈氏姜氏勞楚子于柯澤芈氏楚女姜氏齊女楚子還過鄭故文公夫人出而勞之柯澤杜注鄭地楚子使師縉示之俘馘師縉楚樂師名縉俘所得囚馘所截耳君子曰非禮也婦人送迎不出門見兄弟不踰閾閾門限戎事不邇女器器物也言俘馘非近婦人之物丁丑楚子入饗于鄭九獻用上公之禮庭實旅百加籩豆六品庭中所陳之實品數有百籩豆所盛之物又加六品饗畢夜出文芈送于軍取鄭二姬以歸二姬文芈女也叔詹曰楚王其不沒乎為禮卒于無别無别不可謂禮將何以沒諸侯是以知其不遂霸也言楚子所以師敗城濮終為商臣所弒二十有三年春齊侯伐宋圍緡緡穀梁作閔後同杜注宋邑髙平昌邑縣東南有東緡城在今山東金鄉縣東北左傳二十三年春齊侯伐宋圍緡以討其不與盟于齊也十九年盟于齊以無忘桓公之德而宋獨不㑹復召齊人共盟鹿上故今討之公羊傳邑不言圍此其言圍何疾重故也疾痛也故舊傷也重故者于舊傷之處而加其傷宋襄新為楚敗齊不能助反因其困而伐之其痛與加舊傷無異故言國以惡其不仁也穀梁傳伐國不言圍邑此其言圍何也不正其以惡報惡也前十八年宋伐齊之喪是惡也今齊乘其敗而報是以惡報惡也楚與五國盟于齊乘間以攜諸侯於宋耳宋之不與義未愆也齊侯不悟而反以責宋伐之於敗傷之後悖義甚矣其以爵書蓋惡其昧敵愾之義忘定己之德故目其人以罪之夏五月庚寅宋公兹父卒兹公羊作慈左傳夏五月宋襄公卒傷于泓故也公羊傳何以不書葬盈乎諱也盈滿也襄公前以背殯出㑹不書其父葬以為之諱至襄公身亦不書葬所以滿其諱之之義也穀梁傳兹父之不葬何也失民也其失民何也以其不教民戰則是棄其師也為人君而棄其師其民孰以為君哉宋襄德政不修諸侯皆二復不量力以與楚戰兵敗身傷賫志而歿其所以圖霸者非其道也不書葬者時僖公已有志附楚故不使人往㑹秋楚人伐陳左傳秋楚成得臣帥師伐陳成得臣子玉也討其二于宋也遂取焦夷城頓而還焦杜注陳邑譙縣也今江南亳州夷杜注陳邑譙郡城父縣今故城在亳州東南頓杜注頓國汝隂南頓縣今河南項城縣北有南頓故城子文以為之功使為令尹叔伯曰子若國何叔伯楚大夫薳吕臣也言子玉不任令尹對曰吾以靖國也夫有大功而無貴仕其人能靖者與有幾言必矜功為亂不可不賞楚伐陳以為二于宋也考之經𫝊宋襄曹南之盟伐鄭之役陳皆不與而盟齊㑹盂陳實從楚未見其二也特以伐宋之後鄭朝而陳不朝即誣以二而伐取其二邑城頓以逼之蓋將有事於北方慮陳為梗故先懾以威使之困折而屬服耳附録左傳九月晉惠公卒經在明年從赴懷公命無從亡人懷公子圉亡人重耳期期而不至無赦狐突之子毛及偃從重耳在秦偃子記也弗召冬懷公執狐突未期而執突以不召子故曰子來則免對曰子之能仕父教之忠古之制也䇿名委質二乃辟也名書于所臣之䇿委贄而君事之則不可以二質贄也辟罪也今臣之子名在重耳有年數矣若又召之教之二也父教子二何以事君刑之不濫君之明也臣之願也淫刑以逞誰則無罪臣聞命矣乃殺之卜偃稱疾不出曰周書有之乃大明服周書康誥言君能大明則民服己則不明而殺人以逞不亦難乎民不見德而惟戮是聞其何後之有言懷公必無後于晉為二十四年殺懷公張本冬十有一月杞子卒左傳十一月杞成公卒書曰子杞夷也不書名未同盟也凡諸侯同盟死則赴以名禮也赴以名則亦書之謂未同盟不然則否謂同盟而不以名告辟不敏也敏猶審也例已見隱七年此又舉凡者為國史承告而書例也杞二王後初書杞侯繼而稱伯稱子蓋時王所黜後復稱伯亦時王復之春秋從史文耳不名者史逸之附録左傳晉公子重耳之及于難也晉人伐諸蒲城事在五年蒲城人欲戰重耳不可曰保君父之命而享其生祿保猶恃也享受也人以祿生故曰生祿于是乎得人以祿致衆有人而校罪莫大焉吾其奔也遂奔狄從者狐偃趙衰顛頡魏武子司空季子趙衰趙夙弟魏武子魏犨司空季子胥臣臼季也時狐毛賈他皆從獨舉此五人以賢而有大功狄人伐牆咎如牆咎如杜注赤狄之别種隗姓獲其二女叔隗季隗納諸公子公子取季隗生伯鯈叔劉以叔隗妻趙衰生盾盾趙宣子將適齊謂季隗曰待我二十五年不來而後嫁對曰我二十五年矣又如是而嫁則就木焉請待子處狄十二年而行以五年奔狄至十六年適齊過衛衛文公不禮焉出于五鹿五鹿杜注衛地衛縣西北有地名五鹿陽平元城縣東亦有五鹿今直𨽻五鹿城二屬元城縣者即沙鹿城屬開州者此衛地五鹿是也乞食于野人野人與之塊土塊也公子怒欲鞭之子犯曰天賜也得土有國之祥故以為天賜稽首受而載之及齊齊桓公妻之有馬二十乘公子安之從者以為不可齊桓既卒知孝公不足恃故將行謀于桑下蠶妾在其上以告姜氏即齊女妻重耳者姜氏殺之恐孝公怒其去故殺妾以滅口而謂公子曰子有四方之志其聞之者吾殺之矣公子曰無之姜曰行也懷與安實敗名公子不可姜與子犯謀醉而遣之醒以戈逐子犯無去志故怒及曹曹共公聞其駢脅駢脅合幹欲觀其裸浴薄而觀之裸赤體薄迫也僖負羈之妻曰僖負羈曹大夫吾觀晉公子之從者皆足以相國若以相夫子必反其國夫子謂重耳反其國必得志于諸侯得志于諸侯而誅無禮曹其首也子盍蚤自二焉自二自别異于曹乃饋盤飱置璧焉臣無外交故用盤藏璧飱中不欲令人見公子受飱反璧及宋宋襄公贈之以馬二十乘及鄭鄭文公亦不禮焉叔詹諫曰臣聞天之所啓人弗及也晉公子有三焉天其或者將建諸君其禮焉男女同姓其生不蕃晉公子姬出也而至于今一也離外之患出奔在外而天不靖晉國殆將啓之二也有三士足以上人而從之三也國語狐偃趙衰賈他三人皆卿材晉鄭同儕儕等也其過子弟固將禮焉况天之所啓乎弗聽及楚楚子饗之曰公子若反晉國則何以報不榖對曰子女玉帛則君有之羽毛齒革則君地生焉其波及晉國者君之餘也其何以報君曰雖然何以報我對曰若以君之靈得反晉國晉楚治兵遇于中原其辟君三舍若不獲命其左執鞕弭右屬櫜鞬以與君周旋弭弓末無緣者屬著也櫜以受箭鞬以受弓周旋相追逐也子玉請殺之楚子曰晉公子廣而儉志廣而體儉文而有禮其從者肅而寬忠而能力晉侯無親晉侯惠公也外內惡之吾聞姬姓唐叔之後其後衰者也其將由晉公子乎天將興之誰能廢之違天必有大咎乃送諸秦秦伯納女五人懷嬴與焉懷嬴子圉妻奉匜沃盥既而揮之匜沃盥器揮湔也怒曰秦晉匹也匹敵也何以卑我公子懼降服而囚去上服自拘囚以謝之他日公饗之子犯曰吾不如衰之文也文有文辭請使衰從公子賦河水河水逸詩義取河水朝宗于海海喻秦公賦六月六月詩小雅言尹吉甫佐宣王北伐喻重耳還晉必能匡王國趙衰曰重耳拜賜君前臣名故名重耳公子降拜稽首公降一級而辭焉下階一級辭重耳稽首衰曰君稱所以佐天子者命重耳重耳敢不拜詩首章言匡王國次章言佐天子故趙衰因通言之為明年秦伯納之張夲日講春秋解義卷十九
