body:
  text: 欽定四庫全書日講春秋解義卷六十一哀公公名蔣定公之子蓋夫人定姒所生諡法恭仁短折曰哀周敬王二十六年敬王四十一年孔子卒魯哀公十九年敬王崩子元王立此據左𫝊所載按諸本敬王崩或作哀公十七年十八年或作哀公二十年未詳孰是鄭聲公七年聲公二十二年孔子卒齊景公五十四年魯哀公五年景公卒安孺子荼立是年弒悼公陽生立哀十年悼公弒子簡公壬立哀十四年田常弒簡公立其弟鶩為平公而相之専其國權齊自是為田氏矣宋景公二十三年景公三十八年孔子卒晉定公十八年晉霸衰微魯哀公十三年會吳于黃池吳始稱伯衛靈公四十一年魯哀公二年靈公卒孫出公輒立是年晉納衛太子蒯聵于戚父子爭國哀十五年蒯聵入是為莊公輒出奔哀十七年莊公弒立公孫般師十二月齊伐衛立公子起執般師以歸哀十八年衛逐起輒復入蔡昭侯二十五年魯哀公四年昭侯弒子成侯立曹伯陽八年魯哀公八年宋滅曹滕頃公十六年魯哀公四年頃公卒子隱公虞母立哀十一年隱公卒陳閔公八年魯哀公十六年楚滅陳殺閔公杞僖公十二年魯哀公八年僖公卒子閔公維立薛惠公三年魯哀公十年惠公卒莒郊公邾隱公十一年魯哀公七年魯入邾執邾子益哀八年歸吳又討邾子囚諸樓臺栫之以棘使諸大夫奉子革以為政哀十年邾子益來奔許元公十年魯哀公十三年元公卒小邾詳見昭公元年楚昭王二十二年魯哀公六年昭王卒子惠王章立哀十六年楚白公勝殺令尹子西攻惠王葉公攻白公白公自殺惠王復國哀十八年惠王卒秦惠公七年魯哀公三年惠公卒子悼公立魯哀十八年悼公卒子共公立吳夫差二年魯哀公元年入越棲越于㑹稽越行成哀十年吳誅伍員哀十四年㑹晉黃池越入吳哀二十年越圍吳哀二十二年越滅吳越句踐二年魯哀公元年吳入越棲于㑹稽以行成用大夫種范蠡為政哀十四年入吳哀二十年圍吳哀二十一年始來聘魯哀二十二年滅吳乃以兵北渡淮與齊晉諸侯㑹于徐州周元王使人賜句踐胙為伯越兵橫行于江淮東諸侯畢賀號稱霸王欽定四庫全書日講春秋解義卷六十一哀公名蔣定公之子母定姒以敬王二十六年即位十四年西狩獲麟春秋終諡法恭仁短折曰哀元年春王正月公即位楚子陳侯隨侯許男圍蔡左𫝊元年春楚子圍蔡報柏舉也在定四年里而栽栽設版築為圍壘周匝去蔡城一里廣丈髙倍壘厚一丈髙二丈夫屯夫兵也壘未成故令人屯守蔡晝夜九日如子西之素子西本計為壘當用九日而成蔡人男女以辨辨别也男女各别係纍而出降使疆于江汝之閒而還使蔡徙都于江北汝水之南欲令近楚為私屬蔡于是乎請遷于吳楚還蔡人更叛楚就吳為明年蔡遷州來𫝊隨屬楚不與㑹盟至是楚人德其免昭王於難列於諸侯故見經許既滅復見者楚封之也楚徙蔡於江汝之閒不書遷蔡實未遷也胡氏安國乃謂遷蔡而書圍見楚子復讎為可恕此大失春秋之旨入郢者吳也楚不能報吳而摟二三小國以釋憾於蔡既已悖矣且楚誘殺蔡侯般而滅其國用隱太子拘蔡昭侯蔡之讎楚豈在入郢下豈蔡宜得報而楚獨不宜得報乎觀楚頻年滅頓滅胡何讎之復其志直欲蠶食小國不盡併諸侯不止耳而以復讎之說恕之誤矣附録左𫝊吳王夫差敗越于夫椒報檇李也檇李役在定十四年夫椒杜注吳郡吳縣西南大湖中椒山通典包山一名夫椒即西洞庭山也在今江南吳縣西南遂入越越子以甲楯五千保于㑹稽㑹稽杜注上㑹稽山也在㑹稽山隂縣南水經注古防山也周禮揚州之鎮在今浙江㑹稽縣東南使大夫種因吳大宰嚭以行成種越臣文種也吳子將許之伍員曰不可臣聞之樹德莫如滋去疾莫如盡昔有過澆殺斟灌以伐斟鄩澆寒浞子封于過者二斟夏同姓諸侯襄四年𫝊曰澆用師滅斟灌滅夏后相夏后相啓孫后相失國依于二斟復為澆所滅后緍方娠逃出自竇后緍相妻歸于有仍后緍有仍氏女生少康焉為仍牧正牧官之長惎澆能戒之惎毒也戒備也澆使椒求之椒澆臣逃奔有虞為之庖正以除其害虞舜後諸侯也杜注梁國有虞縣今故虞城在河南虞城縣南庖正掌膳羞之官賴此得不見殺也虞思于是妻之以二姚而邑諸綸思有虞君也虞思自以二女妻少康姚虞姓綸杜注虞邑今虞城縣東南有故綸城有田一成有衆一旅方十里為成五百人為旅能布其德而兆其謀兆始以收夏衆撫其官職襄四年𫝊曰靡自有鬲氏收二國之燼以滅浞而立少康使女艾諜澆女艾少康臣諜候也使季杼誘豷豷澆弟季杼少康子后杼也遂滅過戈復禹之績過杜注澆國戈杜注豷國祀夏配天不失舊物今吳不如過而越大于少康或將豐之不亦難乎言與越成是使越豐大必為吳難句踐能親而務施施不失人親不棄勞與我同壤而世為仇讎于是乎克而弗取將又存之違天而長寇讎猶言天與不取後雖悔之不可食已食消也已止也姬之衰也日可俟也姬吳姓介在蠻夷而長寇讎以是求伯必不行矣弗聽退而告人曰越十年生聚而十年教訓二十年之外吳其為沼乎謂吳宫室廢壞當為汙池為二十二年越入吳起本三月越及吳平吳入越不書吳不告慶越不告敗也鼷鼠食郊牛改卜牛郊牛下穀梁有角字夏四月辛巳郊穀梁𫝊此該之變而道之也該備也春秋書郊終于此故于此備說郊之變變謂郊非其時或牲被災害于變之中又有言焉于災變之中又有可善而言者鼷鼠食郊牛角改卜牛志不敬也郊牛日展觓角而知傷展道盡矣展道雖盡所以備災之道不盡譏哀公不敬故致大變郊自正月至于三月郊之時也夏四月郊不時也五月郊不時也夏之始可以承春以秋之末承春之始蓋不可矣不時之中有差别夏始承春方秋之末猶為可也九月用郊用者不宜用者也在成十七年郊三卜禮也三卜即𫝊末以十二月上辛卜之說四卜非禮也僖三十一年襄十一年皆四卜五卜强也成十年五卜卜免牲者吉則免之不吉則否牛傷不言傷之者傷自牛作也故其辭緩宣三年郊牛之口傷以牛自傷故辭緩全曰牲傷曰牛未牲曰牛其牛一也其所以為牛者異己卜日成牲而傷之曰牛與未卜日未成牲之牛二者不同有變而不郊故卜免牛也已牛矣其尚卜免之何也災傷不復以郊怪復卜免之禮與其亡也寧有禮與其無卜寧嘗有卜嘗置之上帝矣故卜而後免之不敢専也卜之不吉則如之何不免安置之繫而待六月上甲始庀牲然後左右之庀具也待具後牲然後左右前牛惟我所用不復須卜已有新牲故也周禮曰司門掌授管鍵以啓閉國門祭祀之牛繫焉然則未左右時監門者養之子之所言者牲之變也而曰我一該郊之變而道之何也此弟子問穀梁子之詞我以六月上甲始庀牲十月上甲始繫牲十一月十二月牲雖有變不道也牲有變則改卜牛以不妨郊事故不言其變待正月然後言牲之變此乃所以該郊至郊時然後言其變重其妨郊也十二月不道自前可知也至正月然後道則二月三月亦可知也此所以該郊言其變道盡郊享道也貴其時大其禮其養牲雖小不備可也享者飲食之道牲有變則改卜牛郊日已逼庀繫之禮雖小不備合時得禮用之可也子不志三月卜郊何也弟子以經不書而榖梁獨言之故復問也三月謂十二月正月二月也郊自正月至于三月郊之時也有變乃志常事不書我以十二月下辛卜正月上辛如不從則以正月下辛卜二月上辛如不從則以二月下辛卜三月上辛如不從則不郊矣意欲郊而卜不吉故曰不從郊必用上辛者取其新潔莫先也定公薨未及小祥而僣行天子之郊禮釋凶服從吉則為不孝於親矧郊之祭也喪者不敢哭凶服不敢入國門今在喪而蕆事則為不敬於天一舉而犯三不韙焉郊之失禮未有甚於此者也附録左𫝊夏四月齊侯衛侯救邯鄲圍五鹿趙稷以邯鄲叛范中行氏之黨也五鹿杜注晉邑吳之入楚也在定四年使召陳懷公懷公朝國人而問焉曰欲與楚者右欲與吳者左陳人從田無田從黨都邑之人無田者隨黨而立不知所與故直從所居田在西者居右在東者居左逢滑當公而進當公不左不右曰臣聞國之興也以福其亡也以禍今吳未有福楚未有禍楚未可棄吳未可從而晉盟主也若以晉辭吳若何公曰國勝君亡非禍而何楚為吳所勝對曰國之有是多矣何必不復小國猶復况大國乎臣聞國之興也視民如傷是其福也如傷恐驚動其亡也以民為土芥是其禍也楚雖無德亦不艾殺其民吳日敝于兵暴骨如莽草之生于廣野莽莽然故曰草莽而未見德焉天其或者正訓楚也禍之適吳其何日之有陳侯從之及夫差克越乃修先君之怨秋八月吳侵陳修舊怨也𫝊言吳不修德而修怨所以亡秋齊侯衛侯伐晉左𫝊齊侯衛侯㑹于乾侯救范氏也師及齊師衛孔圉鮮虞人伐晉取棘蒲魯師不書非公命也孔圉孔蒸鉏曽孫鮮虞狄帥賤故不書棘蒲晉地今趙州城內有棘蒲社前此齊衛伐晉夷儀河內皆不書諸侯猶有所忌未成乎伐也至是晉益衰無異於列國齊衛遂連兵伐之春秋特書以著霸統之絶也王道盡而霸統復亡世變於是窮矣附録左𫝊吳師在陳楚大夫皆懼曰闔廬唯能用其民以敗我于柏舉今聞其嗣又甚焉將若之何子西曰二三子恤不相睦無患吳矣昔闔廬食不二味居不重席室不崇壇平地作室不起壇也器不彤鏤彤丹也鏤刻也宫室不觀觀臺榭舟車不飾衣服財用擇不取費選取堅厚不尚細靡在國天有菑癘親巡其孤寡而共其乏困在軍熟食者分而後敢食必須軍士皆分熟食不敢先食分猶遍也其所嘗者卒乘與焉所嘗甘珍勤恤其民而與之勞逸是以民不罷勞死知不曠知身死不見曠棄吾先大夫子常易之所以敗我也今聞夫差次有臺榭陂池焉過再宿曰次積土為髙曰臺有木曰榭鄣澤曰陂積水曰池宿有妃嬙嬪御焉妃嬙貴者嬪御賤者皆內官一日之行所欲必成玩好必從珍異是聚觀樂是務視民如讎而用之日新夫先自敗也已安能敗我為二十二年越滅吳張本冬仲孫何忌帥師伐邾邾之事魯至矣前年邾子來奔喪今逾年而遽伐之蓋魯之彊臣利取邾田不復知有禮義也附録左𫝊冬十月晉趙鞅伐朝歌討范中行氏二年春王二月季孫斯叔孫州仇仲孫何忌帥師伐邾取漷東田及沂西田癸巳叔孫州仇仲孫何忌及邾子盟于句繹書盟止此句繹杜注邾地應在今山東鄒縣境左𫝊二年春伐邾將伐絞絞杜注邾邑當在今滕縣境邾人愛其土故賂以漷沂之田而受盟榖梁𫝊取漷東田漷東未盡也及沂西田沂西未盡也以其言東西則知其未盡也三人伐而二人盟何也各盟其得也季孫不得田故不與盟邾自昭公時訴魯於晉叔孫季孫見執今晉失霸邾子懼比來朝㑹三卿猶以為憾帥師伐取其田復盟以要之三子皆書不舉重者各將其兵政不自公出也三人伐而二人盟榖梁以為各盟其所得也莫彊於季孫何獨無得季氏志在滅邾二田不足充其欲又以昭公伐意如陽虎囚桓子皆賴叔仲之救故以田歸二家使與邾盟以示已不屑與且包藏禍心欲復圖其國而未肯盟也夏四月丙子衛侯元卒左𫝊初衛侯遊于郊子南僕子南靈公子郢公曰余無子將立女蒯聵奔無太子不對他日又謂之對曰郢不足以辱社稷君其改圖君夫人在堂三揖在下三揖卿大夫士也孤卿特揖大夫以其等旅揖士旁三揖見周禮司士君命祗辱夏衛靈公卒夫人曰命公子郢為大子君命也對曰郢異于他子言用意不同且君沒於吾手言公殁時已在左右若有之郢必聞之且亡人之子輒在輒蒯聵之子出公也靈公適孫乃立輒滕子來朝滕朝止此諸侯來朝亦止此晉趙鞅帥師納衛世子蒯聵于戚左𫝊六月乙酉晉趙鞅納衛大子于戚宵迷陽虎曰右河而南必至焉戚在河東是時晉軍已渡河師夜行失道陽虎憶渡處在戚之北河既北流據水所向則東為右故欲出河右而南行也使大子絻絻始發喪之服八人衰絰僞自衛逆者欲為衛人逆故衰絰成服告于門哭而入遂居之公羊𫝊戚者何衛之邑也曷為不言入于衛父有子子不得有父也明父得有子而廢之子不得有父之所有故奪其國榖梁𫝊納者內弗受也帥師而後納者有伐也何用弗受也以輒不受也以輒不受父之命受之王父也信父而辭王父則是不尊王父也其弗受以尊王父也蒯聵之出與納春秋再以世子書則知蒯聵為無辜而被此名以出故正其名而謂之世子所謂與之繼世者也書納于戚見為輒所拒而不得入於衛也程子謂縱令蒯聵得罪於父不得復立輒亦不得背父而不與其國為輒計者委於所可立使不失君之社稷而身從父則義矣榖梁尊王父之說非也秋八月甲戌晉趙鞅帥師及鄭罕達帥師戰于鐡鄭師敗績鐡公羊作栗又作秩杜注鐡丘名在戚城南今直隸開州北有戚城其南為王合里即鐡丘也左𫝊秋八月齊人輸范氏粟鄭子姚子般送之子姚罕達子般駟𢎞士吉射逆之趙鞅禦之遇于戚陽虎曰吾車少以兵車之斾與罕駟兵車先陳斾先驅車也以先驅車益其兵車以示衆罕駟自後隨而從之彼見吾貌必有懼心晉人先陳鄭人隨之不知其虛實見車多必懼于是乎㑹之㑹合戰必大敗之從之卜戰龜焦兆不成樂丁曰樂丁晉大夫詩曰爰始爰謀爰契我龜詩大雅言先人事而後卜筮謀協以故兆詢可也詢咨詢也故兆始納衛大子卜得吉兆言今既謀同可不須更卜簡子誓曰范氏中行氏反易天明不事君也斬艾百姓欲擅晉國而滅其君寡君恃鄭而保焉今鄭為不道棄君助臣二三子順天明從君命經德義除詬恥在此行也克敵者上大夫受縣下大夫受郡周書作雒篇千里百縣縣有四郡士田十萬十萬畝也庶人工商遂得遂進仕人臣隸圉免去厮役志父無罪君實圖之志父趙簡子之改名也言已事濟君當圖其賞若其有罪絞縊以戮桐棺三寸不設屬辟屬辟棺之重數王棺四重君再重大夫一重素車朴馬以載柩無入于兆兆葬域下卿之罰也為衆設賞自設罰所以能克敵甲戌將戰郵無恤御簡子郵無恤王良也衛大子為右登鐡上望見鄭師衆大子懼自投于車下子良授大子綏而乘之曰婦人也言其怯簡子巡列曰畢萬匹夫也七戰皆獲有馬百乘死于牖下畢萬晉獻公卿也皆獲有功死于牖下言得夀終羣子勉之死不在寇言有命繁羽御趙羅宋勇為右三子晉大夫羅無勇麇之麇束縛也吏詰之御對曰痁作而伏痁瘧疾也衛大子禱曰曾孫蒯聵敢昭告皇祖文王烈祖康叔文祖襄公蒯聵襄公之孫鄭勝亂從勝鄭聲公名釋君助臣為從亂晉午在難午晉定公名不能治亂使鞅討之鞅簡子名蒯聵不敢自佚備持矛焉戎右持矛敢告無絶筋無折骨無面傷以集大事無作三祖羞大命不敢請佩玉不敢愛不敢愛故以祈禱鄭人擊簡子中肩斃于車中斃踣也獲其蜂旗蜂旗旗名大子救之以戈鄭師北獲溫大夫趙羅羅無勇故鄭師雖北猶獲羅大子復伐之鄭師大敗獲齊粟千車趙孟喜曰可矣趙孟簡子傅叟曰𫝊叟簡子屬也雖克鄭猶有知在憂未艾也初周人與范氏田公孫尨稅焉尨范氏臣為范氏收周人所與田之稅趙氏得而獻之得尨以獻簡子吏請殺之趙孟曰為其主也何罪止而與之田還其所稅及鐡之戰以徒五百人有攻鄭師取蜂旗于子姚之幕下獻曰請報主德追鄭師姚般公孫林殿而射前列多死晉前列趙孟曰國無小既戰簡子曰吾伏韜嘔血韜弓衣鼓音不衰今日我上也功為上大子曰吾救主于車退敵于下我右之上也郵良曰我兩靷將絶吾能止之止使不絶我御之上也駕而乘材兩靷皆絶材橫木明細小也𫝊言簡子不讓下自伐春秋舍齊秦楚外無與晉戰者蓋無能與晉敵也今以蕞爾之鄭而趙鞅帥師與戰幸而勝之其衰甚矣書及所以辨主客皆言帥師其衆敵也冬十月葬衛靈公十有一月蔡遷于州來蔡殺其大夫公子駟書遷止此左𫝊吳泄庸如蔡納聘而稍納師師畢入衆知之泄庸吳大夫元年蔡請遷于吳中悔故因聘襲之蔡侯告大夫殺公子駟以說言不時遷者駟之為哭而遷墓將遷與先君辭故哭冬蔡遷于州來州來滅於吳蔡之徙此實吳人遷之而經以自遷為文者楚既疆蔡蔡背楚請遷於吳而中悔及其事急又委罪執政謀之不臧誰之咎也故經以自遷為文而殺公子駟則書大夫而稱國見君與用事大臣擅殺之而不以其罪也三年春齊國夏衛石曼姑帥師圍戚左𫝊三年春齊衛圍戚求援于中山中山鮮虞公羊𫝊齊國夏曷為與衛石曼姑帥師圍戚伯討也此其為伯討奈何曼姑受命乎靈公而立輒靈公者蒯聵之父以曼姑之義為固可以拒之也拒之者為靈公命故輒者曷為者也蒯聵之子也然則曷為不立蒯聵而立輒蒯聵為無道靈公逐蒯聵而立輒然則輒之義可以立乎曰可其可奈何不以父命辭王父命不以蒯聵命辭靈公命以王父命辭父命是父之行乎子也重本尊統之義不以家事辭王事以父見廢故辭讓不立是家私事以王事辭家事是上之行乎下也榖梁𫝊此衛事也其先國夏何也子不圍父也不繫戚于衛者子不有父也子有父者戚繫衛則為大夫屬于衛主兵者衛也而齊助子圍父逆亂人倫莫甚於此故惡其不義以為兵首所以深罪其黨惡而訓天下後世討亂賊之法也戚不書衛承前納衛世子蒯聵之文也其義與圍宋彭城異者彭城已披於楚故還繫之宋戚衛地而衛世子居之何用復書衛乎夏四月甲午地震五月辛卯桓宫僖宫災左𫝊夏五月辛卯司鐸火司鐸宫名火踰公宫桓僖災桓公僖公廟救火者皆曰顧府言常人愛財南宫敬叔至命周人出御書俟于宫敬叔孔子弟子南宫閲周人司周書典籍之官御書進于君者也曰庀女而不在死庀具也子服景伯至命宰人出禮書景伯子服何也宰人冡宰之屬以待命命不共有常刑校人乘馬巾車脂轄校人掌馬巾車掌車乘馬使四四相從為駕之易以脂膏轄為行之易百官官備府庫慎守官人肅給國有火災恐有變難故慎為備濟濡帷幕鬱攸從之濡物于水出用為濟鬱攸火氣也從之為備蒙葺公屋以濡物冒覆公室自大廟始外內以悛悛次也先尊後卑以次救之助所不給有不用命則有常刑無赦公父文伯至命校人駕乘車備緩急季桓子至御公立于象魏之外象魏門闕命救火者傷人則止財可為也命藏象魏周禮正月縣教令之法于象魏使萬民觀之故謂其書為象魏曰舊章不可亡也富父槐至曰無備而官辦者猶拾瀋也槐富父終生之後瀋汁也言不備而責辦不可得于是乎去表之槀表表火道風所向者去其槀積道還公宫開除道周匝公宫使火無相連孔子在陳聞火曰其桓僖乎言桓僖親盡而廟不毁宜為天所災公羊𫝊此皆毁廟也其言災何復立也曷為不言其復立據立武宫言立春秋見者不復見也于哀公時立即于哀公時災既書災則立可見故得省文何以不言及據雉門及兩觀敵也親過髙祖親踈敵等何以書記災也榖梁𫝊言及則祖有尊卑解經不言及僖由我言之則一也逺祖恩無差降如一故不言及桓僖親盡而宫存者蓋季氏出於桓立於僖世専國政隆其私恩而不毁焉耳不書及二宫分明且祖無尊卑也季孫斯叔孫州仇帥師城啓陽啓公羊作開啓陽本鄅國後屬魯杜注琅琊開陽縣今山東沂州北有故城啓陽故鄅國昭十八年邾人襲鄅鄅子從帑于邾其地在邾東鄙近費魯既取漷東沂西田因奪而城之懼其難故以師季氏以叔孫附已故與同城而地則季氏得之宋樂髠帥師伐曹曹奉樂大心入蕭以叛宋方有亂故且從齊盟未暇致討今聞齊景耄而無畏于齊故修曹之怨也附録左傳劉氏范氏世為婚姻劉氏周卿士范氏晋大夫萇𢎞事劉文公為之屬大夫故周與范氏趙鞅以為討六月癸卯周人殺萇𢎞終違天之禍秋七月丙子季孫斯卒左𫝊秋季孫有疾命正常曰無死正常桓子之寵臣欲付以後事故敕令勿從已死南孺子之子男也則以告而立之南孺子季桓子之妻言若生男告公而立之女也則肥也可肥康子季孫卒康子即位既葬康子在朝在公朝也南氏生男正常載以如朝告曰夫子有遺言命其圉臣曰南氏生男則以告于君與大夫而立之今生矣男也敢告遂奔衛康子請退退辟位也公使共劉視之共劉魯大夫則或殺之矣乃討之討殺者召正常正常不反畏康子也蔡人放其大夫公孫獵于吳獵蓋駟之黨蔡實背楚迋吳以自啓釁而委之罪故不去其官而稱人言國亂無政衆人擅放之也冬十月癸卯秦伯卒叔孫州仇仲孫何忌帥師圍邾邾子已受盟于句繹今踰年而復圍之其棄信肆虐甚矣附録左𫝊冬十月晉趙鞅圍朝歌師于其南范中行所在荀寅伐其郛伐其北郭圍使其徒自北門入已犯師而出使在外救已之徒擊趙氏圍之北門因外內攻得出癸丑奔邯鄲十一月趙鞅殺士皋夷惡范氏也四年春王二月庚戌盜殺蔡侯申二月公羊作三月殺公羊榖梁作弒左𫝊四年春蔡昭侯將如吳諸大夫恐其又遷也承承懲也蓋楚言公孫翩逐而射之翩蔡大夫入于家人而卒以兩矢門之翩以矢自守其門衆莫敢進文之鍇後至鍇蔡大夫曰如牆而進多而殺二人竝行如牆俱進鍇執弓而先翩射之中肘鍇遂殺之故逐公孫辰而殺公孫姓公孫旴旴即霍也公羊傳弒君賤者窮諸人此其稱盜以弒何據宋人弒其君處臼稱人賤乎賤者也賤于稱人者賤乎賤者孰謂謂罪人也蔡侯近罪人卒逢其禍故以為人君深戒榖梁𫝊稱盜以弒君不以上下道道也以上下道道者若衛祝吁弒其君完之類是直稱盜不在人倫之序內其君而外弒者不以弒道道也襄七年鄭伯將㑹中國其臣欲從楚不勝其臣弒而死不使夷狄之民加乎中國之君故曰鄭伯髠原如㑹未見諸侯丙戌卒于操是不以弒道道也春秋有三盜微殺大夫謂之盜十三年冬盜殺陳夏區夫是非所取而取之謂之盜定八年陽貨取寶玉大弓是辟中國之正道以襲利謂之盜即殺蔡侯申者是稱盜稱殺竊發而未得其主名也左氏以弒蔡侯為公孫翩既得其主名翩雖賤亦當從齊邴歜閻職弒商人之例而書人書弒則其說未可據也國君行則師從居有兵衛而為盜所殺見蔡之無臣子也不言君盜不得君其君也以盜為文故不得言弒其與閽弒吳子異者閽則有主名而食庶人在官者之祿也宣十七年書蔡侯申卒而此復書蔡侯申蓋𫝊寫之誤蔡公孫辰出奔吳書公孫辰出奔於盜殺蔡侯申之後則辰與聞乎弒矣葬秦惠公宋人執小邾子伐曹執邾子蓋齊景圖霸無成而宋亦有志於爭權也與宋襄執滕子圍曹同例夏蔡殺其大夫公孫姓公孫霍晉人執戎蠻子赤歸于楚蠻公羊作曼書執止此左𫝊夏楚人既克夷虎夷虎蠻夷叛楚者乃謀北方左司馬眅申公夀餘葉公諸梁致蔡于負函致方城之外于繒關三子楚大夫也此蔡之故地人民楚因以為邑致之者會其衆也負函繒關杜注皆楚地負函當在今信陽州境曰吳將泝江入郢將奔命焉為一昔之期襲梁及霍一昔一夜也僞辭當備吳夜結期明日便襲梁霍使不知之梁霍杜注梁河南梁縣西南故城也梁南有霍陽山皆蠻子之邑單浮餘圍蠻氏蠻氏潰浮餘楚大夫蠻子赤奔晉隂地隂地杜注河南山北自上雒以東至陸渾司馬起豐析與狄戎楚司馬眅也豐析杜注析縣屬南鄉郡析南有豐鄉皆楚邑今河南淅川縣及內鄉縣之西北境皆析地也豐鄉城在淅川縣西南發此二邑人及戎狄以臨上雒左師軍于菟和菟和杜注山在上雒東今陜西商州東有菟和山右師軍于倉野倉野杜注在上雒縣今商州東南有倉野聚使謂隂地之命大夫士蔑曰命大夫别縣監尹晉楚有盟好惡同之若將不廢寡君之願也不然將通于少習以聽命少習杜注商縣武關也今武關在商州東少習山下言將開道以伐晉士蔑請諸趙孟趙孟曰晉國未寧安能惡于楚必速與之士蔑乃致九州之戎九州戎在晉隂地陸渾者將裂田以與蠻子而城之以詐蠻子且將為之卜卜城蠻子聽卜遂執之與其五大夫以畀楚師于三户三户杜注丹水縣北有三户亭今三户城在淅川縣西南司馬致邑立宗焉以誘其遺民楚復詐為蠻子作邑立其宗主而盡俘以歸公羊𫝊赤者何戎曼子之名也其言歸于楚何據執曹伯畀宋人不言歸于宋子北宫子曰辟伯晉而京師楚也晉人執戎曼子歸于楚若不書戎曼子名則與伯執歸京師同文故辟其文而名之霸主執列國之君歸於京師正也今執而與楚宜從執曹伯畀宋人之例乃與歸于京師同文以著世變見情實晉與天下諸侯皆有罪焉耳城西郛六月辛丑亳社災亳公羊作蒲公羊𫝊蒲社者何據鼓用牲于社不言蒲亡國之社也社者封也封土為社其言災何據封土非火所能燒亡國之社蓋掩之掩其上而柴其下故火得燒之掩柴之者絶不得使通天地四方以為有國者戒蒲社災何以書記災也榖梁𫝊亳社者亳之社也亳亡國也亳即殷也殷都亳故謂之亳亡國之社以為廟屏戒也立亳社于廟外以為屏蔽取其不得通天人君瞻之而致戒心其屋亡國之社不得逹上也記曰喪國之社屋之武王克商班其社於諸侯使為鑒戒屋之故有災據左氏七年以邾子益來獻于亳社則新作亳社之屋可知矣不書者以其當作故不志也秋八月甲寅滕子結卒冬十有二月葬蔡昭公葬滕頃公附録左𫝊秋七月齊陳乞弦施衛寧跪救范氏陳乞僖子弦施弦多庚午圍五鹿九月趙鞅圍邯鄲冬十一月邯鄲降荀寅奔鮮虞趙稷奔臨臨杜注晉邑今直隸臨城縣東有故城十二月弦施逆之遂墮臨逆稷納之他邑以臨險固故毁之國夏伐晉取邢任欒鄗逆畤隂人盂壺口八邑杜注晉地欒在趙國平棘縣西北鄗即髙邑縣也潞縣東有壺口關今直隸欒城縣及趙州北境皆古欒邑地柏鄉縣北故城鎮即故鄗城地逆畤水經注謂之曲逆水今曲逆故城在完縣東南壺口關在山西黎城縣東北大行山口㑹鮮虞納荀寅于柏人柏人杜注晉邑趙國柏人縣今直隸唐山縣西有故城五年春城毗毗公羊作比又作芘夏齊侯伐宋定十四年齊與宋㑹洮至此忽伐之者齊方挾諸侯以伐晉而宋人伐曹執小邾子欲與爭霸故討之然景公內實不能正其國而惟力是競是以鄭衛魯宋雖從之而不心服也晉趙鞅帥師伐衛左𫝊五年春晉圍柏人荀寅士吉射奔齊初范氏之臣王生惡張栁朔言諸昭子使為柏人為柏人宰也昭子范吉射昭子曰夫非而讎乎對曰私讎不及公好不廢過惡不去善義之經也臣敢違之及范氏出出柏人奔齊張栁朔謂其子爾從主勉之我將止死王生授我矣授我死節吾不可以僣之僣不信也遂死于柏人為吉射距晉伐死夏趙鞅伐衛范氏之故也遂圍中牟是時齊方弱晉而列國諸侯堅於黨齊者衛鄭耳荀寅士吉射乃趙鞅之讎衛實庇之鞅度齊兵力彊盛未可與爭寅射附衛未可猝動於是計納蒯聵以為衛主故為之伐衛前此晉師皆書侵此獨書伐者趙鞅欲釋私憾故用大師而伐國圍邑志在必克也秋九月癸酉齊侯杵臼卒杵公羊作處左𫝊齊燕姬生子不成而死燕姬景公夫人不成未冠也諸子鬻姒之子荼嬖諸子庶公子也鬻姒景公妾荼安孺子諸大夫恐其為大子也言于公曰君之齒長矣未有大子若之何公曰二三子閒于憂虞則有疾疢亦姑謀樂何憂于無君景公意欲立荼而未發故以此言塞大夫請公疾使國惠子髙昭子立荼惠子國夏昭子髙張置羣公子于萊萊杜注齊東鄙邑今山東黃縣東南有萊子城秋齊景公卒冬十月公子嘉公子駒公子黔奔衛公子鉏公子陽生來奔皆景公子在萊者萊人歌之曰景公死乎不與埋三軍之事乎不與謀師乎師乎何黨之乎師衆也黨所也之往也稱諡蓋葬後而為此歌哀羣公子失所冬叔還如齊閏月葬齊景公公羊𫝊閏不書此何以書遽楚子昭卒不書閏喪以閏數也謂喪服大功以下諸喪當以閏月為數喪曷為以閏數據卒不書閏喪數略也略猶殺也以恩殺故竝閏數榖梁𫝊不正其閏也閏月附月之餘日喪事不數凡喪以年斷者不以閏數以月斷者則以閏數三年之喪二十五月而畢苟數閏則二年內已有二十五月安得謂之三年且以閏數而書則崩薨卒葬凡有閏者皆宜書何獨書於此故知書閏者譏其以閏月葬失喪事不數之義也附録左𫝊鄭駟秦富而侈嬖大夫也而常陳卿之車服于其庭鄭人惡而殺之子思曰詩曰不解于位民之攸塈子思子産子國參也詩大雅攸所也塈息也不守其位而能久者鮮矣商頌曰不僣不濫不敢怠皇命以多福僣差也濫溢也皇暇也言駟秦違詩商頌故受禍日講春秋解義卷六十一
