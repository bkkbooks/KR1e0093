body:
  text: 欽定四庫全書日講春秋解義卷二十八宣公五年春公如齊左傳五年春公如齊高固使齊侯止公請叔姬焉畱公强成昏夏公至自齊左傳夏公至自齊書過也齊魯接壤而踰時乃歸下書髙固之逆叔姬經雖諱止公之迹而比事以觀其實固不可揜矣以見止而連昏於齊臣降尊失列辱及先君乃行飲至之禮於宗廟是謂失其本心左氏特發書過之義以此秋九月齊高固來逆子叔姬左氏無子字左傳秋九月齊高固來逆女自為也故書曰逆叔姬卿自逆也適諸侯稱女適大夫稱字所以别尊卑也穀梁傳諸侯之嫁子于大夫主大夫以與之來者接内也不正其接内故不與夫婦之稱也見莊二十七年莒慶𫝊叔姬稱子别於先君之女也諸侯嫁女於諸侯則公自主之其嫁女於大夫則使大夫主之公自主然後書於策今書高固來逆是公自主之明矣以千乘之君見偪於齊大夫彊昏而不敢違焉輕朝廷慢宗廟蓋由身為不義藉勢於彊鄰故非禮相干忍辱而無所避之也叔孫得臣卒得臣之卒不日史失之也胡氏安國據何休之説謂得臣不能止仲遂之逆謀故春秋削之非也仲遂身為大惡而卒書日季孫行父助逆尤力而卒書日何獨苛於得臣乎凡以日不日為襃貶皆傳者之誤也冬齊高固及子叔姬來左傳冬來反馬也禮送女畱其送馬三月廟見遣使反馬髙固遂與叔姬俱寧故經傳具見以示譏公羊傳何言乎高固之來大夫私事不當書言叔姬之來而不言高固之來則不可子公羊子曰其諸為其雙雙而俱至者與言其雙行匹至似于鳥獸穀梁傳及者及吾子叔姬也為使來者不使得歸之意也固受使來聘而與婦俱歸故書及以明非禮反馬之禮當遣使不當親來女子歸寧當在閒歲不當在踰月大夫非君命不當出境則高固與叔姬來皆非禮矣故直書其事以示譏楚人伐鄭左傳楚子伐鄭陳及楚平晉荀林父救鄭伐陳為明年晉衛侵陳傳傳稱荀林父救鄭而經不書義不得書也趙盾歸生同為大惡盾之釋鄭不討惡傷其類耳以楚師之來而救之亦同惡相保耳若書救則似善其救而討賊之大義隱矣六年春晉趙盾衛孫免侵陳左傳六年春晉衛侵陳陳即楚故也公羊傳趙盾弑君此其復見何親弑君者趙穿也親弑君者趙穿則曷為加之趙盾不討賊也何以謂之不討賊晉史書賊曰晉趙盾弑其君夷獆趙盾曰天乎無辜吾不弑君誰謂吾弑君者乎史曰爾為仁為義人弑爾君而復國不討賊此非弑君而何趙盾之復國奈何靈公為無道使諸大夫皆内朝禮公族朝于内朝親親也然後處乎臺上引彈而彈之己趨而辟丸己諸大夫也是樂而已矣以是笑樂趙盾巳朝而出與諸大夫立于朝自内朝至外朝有人荷畚自閨而出者荷負也畚草器宮中之門謂之闈其小者謂之閨趙盾曰彼何也夫畚曷為出乎閨呼之不至曰子大夫也欲視之則就而視之恐君責己以視人欲以見就為解也古者士大夫通曰子趙盾就而視之則赫然死人也赫然巳支解之貌趙盾曰是何也曰膳宰也熊蹯不熟公怒以斗摮而殺之摮謂傍擊頭項支解將使我棄之趙盾曰嘻趨而入靈公望見趙盾愬而再拜愬者驚貌禮臣拜然後君答拜靈公先拜者畚出盾入知其欲諫欲以敬拒之使不復言也趙盾逡廵北靣再拜稽首趨而出本欲諫君以君拜謝知己意冀當覺悟故出靈公心怍焉欲殺之于是使勇士某者徃殺之勇士入其大門則無人門焉者入其閨則無人閨焉者上其堂則無人焉俯而闚其戸方食魚飱勇士曰嘻子誠仁人也吾入子之大門則無人焉入子之閨則無人焉上子之堂則無人焉是子之易也易猶省也子為晉國重卿而食魚飱是子之儉也君將使我殺子吾不忍殺子也雖然吾亦不可復見吾君矣遂刎頸而死靈公聞之怒滋欲殺之甚衆莫可使徃者于是伏甲于宫中召趙盾而食之趙盾之車右祁彌明者國之力士也仡然從乎趙盾而入放乎堂下而立趙盾已食靈公謂盾曰吾聞子之劍蓋利劍也子以示我吾將觀焉授君劍當㧞而進其首靈公因欲以推殺之趙盾起將進劍祁彌明自下呼之曰盾食飽則出何故拔劍于君所趙盾知之躇階而走躇猶超遽不暇以次靈公有周狗周狗可以比周之狗所指如意謂之獒呼獒而屬之獒亦躇階而從之祁彌明逆而踆之以足逆躢曰踆絶其頷趙盾顧曰君之獒不若臣之獒也然而宫中甲鼓而起有起于甲中者抱趙盾而乘之令升車疾走趙盾顧曰吾何以得此于子曰子某時所食活我于暴桑下者也趙盾曰子名為誰曰吾君孰為介介甲也言吾君誰為興此甲兵豈不為盾乎子之乘矣何問吾名之乘即上車也欲令蚤免去不望報趙盾驅而出衆無畱之者明盾賢人不忍殺趙穿縁民衆不説起弑靈公然後迎趙盾而入與之立于朝而立成公黑臀穀梁傳此帥師也其不言帥師何也不正其敗前事故不與帥師也元年敕而今更侵之傳稱陳及楚平晉荀林父伐陳經皆不書以下書晉衛加兵於陳即陳之即楚可知矣陳鄭每相視以為向背鄭穆公暮年棄楚歸晉本謂晉可託國及歸生之亂坐視不討是以陳有離心受伐受侵而終不為晉屈也夏四月附錄左傳夏定王使子服求后于齊子服周大夫秋赤狄伐晉圍懐及郉丘郉丘杜注河内平皋縣今河南河内縣東南有故城晉侯欲伐之中行桓子曰使疾其民驕則數戰為民所疾以盈其貫將可殪也周書曰殪戎殷周書康誥此類之謂也為十五年晉滅狄傳秋八月螽螽蝗屬食穀者劉歆謂貪虐取民則螽宣公身為不義朝齊伐莒賦歛日繁戾氣應之經書於䇿示天人感應之理不可誣也冬十月附錄左傳冬召桓公逆王后于齊召桓公王卿士事不闗魯故不書為成二年王甥舅張本楚人伐鄭取成而還九年十一年傳所稱厲之役蓋在此鄭公子曼滿與王子伯廖語欲為卿二子鄭大夫伯廖告人曰無徳而貪其在周易豐離下震上豐之離豐上六變而為純離也豐上六曰豐其屋蔀其家闚其戸閴其無人三歲不覿凶義取無徳而大其屋不過三歲必滅亡弗過之矣不過三年閒一歲鄭人殺之七年春衛侯使孫良夫來盟左傳七年春衛孫桓子來盟桓子良夫始通且謀會晉也公即位衞始修好穀梁傳來盟前定也不言及者以國與之不言其人亦以國與之不日前定之盟不日來盟者先有約言復遣使邀結也宣公專意事齊不通於晉晉將合諸侯故使衞通魯俾預於會魯以事齊恐晉蓄憾故使良夫來結言而力任其無咎也然黒壤之盟公卒見辱盟何足恃哉夏公會齊侯伐萊萊杜注萊國東萊黄縣今山東黄縣有萊山東南有萊子故城左傳夏公會齊侯伐萊不與謀也凡師出與謀曰及不與謀曰會皆據魯而言師者國之大事故詳其出以例别之秋公至自伐萊大旱萊近於齊與魯無怨齊志在幷兼後卒滅之而遷于郳則其伐萊不過陵弱暴寡之師耳宣公屈意從齊助人為虐不知自愧而策勲於廟是誣其祖也且螽災之後妄興師旅征役怨咨薄隂陽之和故大旱繼之比事以觀而公無恤民之心具見矣附錄左傳赤狄侵晉取向陰之禾此無秋字蓋闕文晉用桓子謀故縱狄冬公會晉侯宋公衞侯鄭伯曹伯于黑壤黒壤晉地一名黄父今山西沁水縣西北有黑嶺左傳鄭及晉平公子宋之謀也宋子公弑靈公故謀從晉以求媚故相鄭伯以會冬盟于黑壤王叔桓公臨之以謀不睦王叔桓公周卿士將王命以監臨諸侯不同歃者尊卑之别晉侯之立也在二年公不朝焉又不使大夫聘晉人止公于㑹盟于黄父公不與盟以賂免故黑壤之盟不書諱之也據左氏晉人止公于會以賂免而不得與盟經不書蓋舊史無其文也先儒以為孔子諱之而曲為之説誤矣晉靈公之篇諸侯之㑹同皆不序以靈公幼稚雖與盟會實趙盾專之黒壤以後晉始有君復序諸侯是則程子所謂大義數十炳如日星者耳八年春公至自會見止踰年以賂得免危而獲安故告廟而書於策宣公簒立依倚於齊晉之間毎見止辱竝以賂免屈身辱國亦甚矣夏六月公子遂如齊至黄乃復黄齊竟上地公羊傳其言至黄乃復何有疾也何言乎有疾乃復譏何譏耳大夫以君命出聞喪徐行而不反聞喪者聞父母之喪也徐行者不忍疾行又為君當使人追代之以喪喻疾者喪尚不當反况于疾乎穀梁傳乃者亡乎人之辭也謂其知有已不知有人雖君命鄰好不復顧念而惟直行已意也復者事畢也不專公命也遂以疾反而加事畢之文者是不使遂得專命而還也至黄乃復不稱有疾者大夫受命而出雖死以尸將命豈可以疾而廢君命耶乃者無其上之詞曰復事未畢也辛巳有事于大廟仲遂卒于垂垂杜注齊地當在今山東平隂縣境公羊傳仲遂者何公子遂也何以不稱公子貶曷為貶為弑子赤貶事在文十八年然則曷為不于其弑焉貶于文則無罪于子則無年此解文十八年秋如齊不貶意也言若于十八年加貶則嫌有罪于文公無罪于子赤矣無年言子赤之立即在文十八年當喪未君不及改元故曰無年穀梁傳為若反命而後卒也先言復後書卒則如已反命于君而後卒不使其違命専歸也此公子也其曰仲何也䟽之也何為䟽之也是不卒者也遂與宣公共弑子赤例應不書卒不䟽則無用見其不卒也若書公子則與正卒者同故去公子以見之則其卒之何也以譏乎宣也其譏乎宣何也聞大夫之喪則去樂卒事當去籥萬以終祭事言今不然有事者時祭也常事不書此何以書以仲遂卒於此日而下有猶繹去籥之事也遂何以不稱公子而書字生而賜氏俾世其官也季友有援立之功僖公徳之仲遂主簒弑之謀宣公徳之皆生而賜氏變易王法以開世卿擅權之漸魯政自是衰矣翬不書卒而遂書卒何也既誅首惡以存王法則其餘從同與桓不書王而宣皆書王同義壬午猶繹萬入去籥左傳有事于大廟襄仲卒而繹非禮也公羊傳繹者何祭之明日也繹繼昨日事但不灌地降神耳天子諸侯曰繹大夫曰賓尸士曰宴尸萬者何干舞也干謂楯也能為人扞難而不使害人故聖王貴之以為武樂萬者其篇名籥者何籥舞也籥所吹以節舞也吹籥而舞文樂之長其言萬入去籥何去其有聲者不欲令人聞之也廢其無聲者廢置也置者不去也齊人語存其心焉爾存其心焉爾者何知其不可而為之也猶者何通可以已也穀梁傳猶者可以已之辭也繹者祭之旦日之享賓也旦日明日也萬入去籥以其為之變為卿卒而變常禮譏之也繹者祭之明日復祭以賓尸也萬舞無聲籥則有聲者也魯以仲遂甫卒故萬入去籥猶者可已之辭禮大夫卒當祭則不告終事而聞則不繹不告者恐君哀戚所以重宗廟也不繹者以厚股肱所以礪臣節也仲遂弑君宣公茍知大義則始宜正亂賊之誅既與之同惡而任為大夫則終當循遇臣之禮至於萬入去籥又非所以盡事先之誠直書而其義皆著矣戊子夫人嬴氏薨公羊穀梁俱作熊氏敬嬴稱夫人自成風以後遂為魯之故典也春秋於風氏始卒凡四貶之於嬴氏無貶從同也然既書夫人姜氏歸于齊又書夫人嬴氏薨比事以考之則出姜為文公夫人而敬嬴之非嫡明矣晉師白狄伐秦白狄始見經左傳八年春白狄及晉平夏會晉伐秦經在仲遂卒下從赴晉人獲秦諜殺諸絳市六日而蘇蓋記異也晉所以為盟主者以其安内攘外修方伯之職也自趙穿侵崇秦晉之争復起晉人但知連白狄以攻秦而不知楚人狡焉啟疆國勢益張中夏諸侯將折而入楚適足以自困也下書舒蓼之滅比事以觀而晉之失圖具見矣楚人滅舒蓼穀梁作舒鄝杜注舒蓼二國名或曰地譜上義陽之蓼不與羣舒近蓼已滅于楚見文五年此即如舒鳩舒庸蓋一國也今江南廬江縣西故舒城是其地左傳楚為衆舒叛故伐舒蓼滅之楚子疆之及滑汭滑水名當在今江南廬州府東境水之隈曲曰汭蓋楚拓疆至滑汭之界盟吳越而還吳國今江南蘇州成七年始見經越國今浙江會稽昭五年始見經傳言楚彊吳越服從楚人觀兵問鼎知晉不足忌乃滅舒蓼盟吳越其謀益逺其勢益張然後北鄉爭權此陳鄭所以不支而晉卒為所挫也秋七月甲子日有食之既附錄左傳晉胥克有蠱疾郤缺為政代趙盾秋廢胥克使趙朔佐下軍朔盾之子代胥克為成十七年胥童怨郤氏張本冬十月己丑葬我小君敬嬴敬嬴公羊穀梁作頃熊左傳冬葬敬嬴旱無麻始用葛茀記禮變之所由茀所以引柩殯則有之以備大葬則以下柩敬嬴薨稱夫人葬稱小君與成風同義然子般閔公之弑非成風所知也敬嬴則與聞乎故矣春秋於成風特文以著其過而敬嬴無異文以其不待貶而惡見也雨不克葬庚寅日中而克葬左傳雨不克葬禮也禮卜葬先逺日辟不懷也懷思也曲禮云凡卜筮䘮事先逺日辟不思其親急欲𦵏也今若冒雨而𦵏是亦不思其親矣故舉以證其合禮公羊傳頃熊者何宣公之母也楚女熊姓諡曰頃而者何難也乃者何言定公書日下昃乃克葬難也難者難不得以正日葬其君曷為或言而或言乃乃難乎而也穀梁傳葬既有日不為雨止禮也雨不克葬喪不以制也言雨具未備非君喪之制而緩辭也足乎日之辭也此日中克葬足乎日故云緩定十五年日下昃乃克葬故云乃急辭也是二文相對為緩急也雨不克葬譏無備也潦車載簑笠士喪禮也有國家者乃不能為雨備乎定十五年日下昃乃克葬乃者難辭承日下昃而言也此曰而克葬緩辭也足乎日之辭也胡氏安國以雨不克葬為敬嬴隂謀簒弑之咎徵非也孔子合葬於防以雨甚而墓崩亦得謂咎徵乎春秋之義平易正直而以曲説附之過矣城平陽平陽杜注泰山有平陽縣今山東新泰縣西北平陽故城是也左傳城平陽書時也懼晉故也方舉大喪又城平陽重困民力故雖時亦書楚師伐陳左傳陳及晉平楚師伐陳取成而還言晉楚爭强舒蓼楚之與國無罪而見滅此陳所以懼而叛楚也使晉君臣能恐懼改圖内修政教外彰信義以固諸侯之心尚可以遏楚鋒而力疲於秦交踈於齊宋故不能禦楚以保陳鄭而霸業為之頽惜哉九年春王正月公如齊公至自齊夏仲孫蔑如京師左傳九年春王使來徵聘徵召也徵聘不書㣲加諷諭不指斥夏孟獻子聘于周王以為有禮厚賄之宣公即位九年兩朝於齊今又親徃於周則不聞入見待其來徵而後一遣大夫徃聘傎矣且諸侯宜朝正於王今正月朝齊夏乃聘周悖慢尤甚所謂不待貶絶而惡見者也齊侯伐萊狄比侵齊不敢報而亟伐萊畏彊凌弱之情見矣秋取根牟根牟杜注東夷國琅琊陽都縣東有牟鄉在今山東沂水縣南左傳秋取根牟言易也公羊傳根牟者何邾婁之邑也曷為不繫乎邾婁諱亟也亟疾也屬有小君之喪邾婁子來加禮乃未期而取其邑故諱不繫邾婁也根牟小國也在魯東界經諱滅言取與取鄟取邿同義八月滕子卒左傳滕昭公卒為宋圍滕傳此滕昭公也隱七年書滕侯卒至是書子亦時王所黜九月晉侯宋公衞侯鄭伯曹伯㑹于扈晉荀林父帥師伐陳左傳會于扈討不睦也謀齊陳陳侯不會前年與楚成故晉荀林父以諸侯之師伐陳晉侯卒于扈乃還討陳而先會于扈者以陳被楚兵晉不能救或從楚非其本願故㑹以待之待而不至則伐之為有名然晉實不能庇陳俟楚之歸而釋憾焉義豈足以相服哉不書諸侯之師而曰林父帥師者在會諸侯皆以師聽命而林父兼將之也辛酉晉侯黑臀卒于扈公羊傳扈者何晉之邑也諸侯卒其封内不地此何以地卒于會故地也未出其地故不言會也穀梁傳其地于外也其日未踰竟也傳例諸侯正卒則日不正則不日踰竟亦不曰冬十月癸酉衞侯鄭卒晉衞二君何以卒而不葬魯不會也良夫之盟衞欲為晉致魯及黑壤見止懐憾實深是以扈之會魯獨不徃二國繼以喪赴亦皆不㑹此所謂無其事而闕其文者也宋人圍滕左傳冬宋人圍滕因其喪也滕方有喪禮宜弔恤乃用衆以圍之不仁也晉政不競諸侯私相侵伐觀齊宋之擅兵則知不能禦楚之由矣楚子伐鄭晉郤缺帥師救鄭自是晉楚交伐鄭左傳楚子為厲之役故伐鄭六年楚伐鄭取成于厲既成鄭伯逃歸事見十一年傳晉郤缺救鄭鄭伯敗楚師于桞棼栁棼杜注鄭地國人皆喜唯子良憂曰是國之災也吾死無日矣十二年卒有楚子入鄭之禍五年晉荀林父帥師救鄭經不書以鄭方有弑君之亂也據明年傳載鄭人討亂斲歸生之棺而逐其族則此年歸生已斃矣故錄晉之救凡此類乃筆削之精義非舊史所能與也陳殺其大夫洩冶洩公羊穀梁作泄左傳陳靈公與孔寧儀行父通于夏姬二子陳卿夏姬鄭穆公女陳大夫御叔妻皆衷其衵服以戲于朝衷懷也衵服䙝衣洩冶諫曰公卿宣淫民無效焉且聞不令君其納之納藏衵服公曰吾能改矣公告二子二子請殺之公弗禁遂殺洩冶孔子曰詩云民之多辟無自立辟其洩冶之謂乎辟邪也辟法也詩大雅言邪辟之世不可立法國無道危行言遜穀梁傳稱國以殺其大夫殺無罪也泄冶之無罪如何陳靈公通于夏徵舒之家公孫寧儀行父亦通其家或衣其衣或衷其襦以相戲于朝泄冶聞之入諫曰使國人聞之則猶可使仁人聞之則不可君愧于泄冶不能用其言而殺之稱國以殺者君與用事大臣同殺之也稱殺其大夫見洩冶不失其官守也胡氏安國主左傳家語謂洩冶仕於亂朝懷寵不去非孔子所取誤矣邦無道危行言孫為不仕而髙尚者言之也人臣以身許國既受事任不獨緘黙取容以立辟為戒乃鄙夫之術即潔身而去亦卑賤踈逺之臣則可耳黄氏仲炎以為非孔子之言其見卓矣十年春公如齊公至自齊左傳十年春公如齊比年朝正即用此以事周亦過六年一朝之制矣屈體以諂彊鄰辱國莫大焉齊人歸我濟西田左傳齊侯以我服故歸濟西之田公比年朝齊故公羊傳齊已取之矣其言我何據歸讙及闡齊巳取不言我言我者未絶于我也曷為未絶于我齊已言取之矣其實未之齊也其人民貢賦尚屬于魯實未歸于齊不言來者明不從齊來穀梁傳公娶齊齊繇以為兄弟反之齊繇以婚族故還魯田婦之黨為婚兄弟不言來公如齊受之也宣公徳齊恵之援已順其所欲既賂以田復以女妻其臣會兵伐萊毎歲徃朝故齊侯悦其屈諂而歸濟西之田其曰我者濟經齊魯有魯濟有齊濟所歸之田乃魯濟也夏四月丙辰日有食之已巳齊侯元卒齊崔氏出奔衞左傳夏齊惠公卒崔杼有寵于惠公高國畏其偪也崔杼齊大夫高國二氏齊正卿公卒而逐之奔衞書曰崔氏非其罪也且告以族不以名典䇿之法告者皆當書以名今齊特以族告春秋因之不改凡諸侯之大夫違違奔放也告于諸侯曰某氏之守臣某上某氏姓下某名失守宗廟敢告所有玉帛之使者則告玉帛之使謂聘不然則否恩好不接故亦不告公羊傳崔氏者何齊大夫也其稱崔氏何據齊髙無咎出奔名此書崔氏與隱公三年書尹氏同貶曷為貶據外大夫奔不貶譏世卿世卿非禮也復見譏者嫌尹氏王者大夫職重不當世諸侯大夫任輕可世故重𤼵之穀梁傳氏者舉族而出之之辭也出奔而書崔氏蓋盡族而行且告以氏不以名也許翰以謂崔杼出而能反反而能弑以其宗彊故春秋特舉氏乃辨之早非也左氏見襄二十五年齊崔杼弑其君因謂出奔者即杼不知此距杼之為逆凡五十有一年古者四十而仕五十為大夫不聞杼之年壽遂致耄期若以世卿少而得政則奔時年未及冠不宜遂逼高國左氏所傳恐未可盡信也公如齊五月公至自齊公如齊止此左傳公如齊奔喪宣公於匡王之喪不奔欲舉郊祀而奔齊惠公之喪匡王之葬使㣲者徃而以貴卿葬齊惠公蓋濟田之歸重以為徳故聞喪而奔以報其賜也魯之事齊過於天王而齊之視魯不啻附庸其反易天常而無忌憚甚矣癸巳陳夏徵舒弑其君平國左傳陳靈公與孔寧儀行父飲酒于夏氏公謂行父曰徵舒似女徵舒夏姬子陳大夫對曰亦似君徵舒病之公出自其廐射而殺之二子奔楚弑君之賊既得其主名則直書以正亂賊之罪春秋常法也先儒多為曲説胡氏安國所謂見洩冶忠言之騐靈公見弑之由亦非本義蓋春秋於見弑之君皆不言所由與大夫出奔不言逐者同義皆深探其本以為世戒也六月宋師伐滕左傳滕人恃晉而不事宋六月宋師伐滕春秋時諸侯毎間霸國之多故以陵小弱故宋之於滕齊桓卒而執其君晉政衰而圍之伐之以逞志焉胡氏安國責宋不能討陳義雖正而逺於事情宋鮑與聞乎弑以簒得國而責之討賊誤矣公孫歸父如齊葬齊惠公魯宣深徳齊侯之定其位而又歸濟西田故生則屈諂以事之沒則親奔其喪又遣貴卿會葬焉歸父仲遂之子也父主簒弑子擅國權外結彊鄰内逢君惡亂臣賊子交得其志恣行非度豈非王綱縱弛九伐不行而霸政亦衰之故與此孔子所以不沒桓文之功也晉人宋人衞人曹人伐鄭左傳鄭及楚平前年敗楚師恐楚怒故與平諸侯之師伐鄭取成而還晉霸之衰皆由趙盾專政庇其同類齊魯宋鄭弑君之賊皆置而不問故諸侯皆有離心今陳有弑君之賊若晉能合諸侯以討之則桓文之功立就矣何患鄭之不服乎乃率三國以爭鄭而以討賊遺楚晉可謂無人矣秋天王使王季子來聘王聘止此左傳秋劉康公來報聘報孟獻子之聘康公即王季子也其後食采于劉公羊傳王季子者何天子之大夫也其稱王季子何據叔服不繫王不稱子王札子不稱季貴也其貴奈何母弟也子者王子也天子不言子弟故變文書季繫先王以明之穀梁傳其曰王季王子也其曰子尊之也聘問也宣公簒立至是十年不朝於周而比年朝齊不奔王喪而奔齊侯之喪使微者葬匡王而貴卿葬齊侯縱王討不加絶不與通可也乃使王季子來聘不亦悖乎自是王聘不見於經非孔子削而不書蓋諸侯不以王命為重輕而王亦不復遣使耳寥寥百有餘年而後石尚以歸脤錄自是天王之名號亦不見於經矣公孫歸父帥師伐邾取繹繹公羊作蘱杜注邾邑魯國鄒縣北有繹山今嶧山在鄒縣東南蓋縣治徙山北也左傳師伐邾取繹為子家如齊𫝊魯之伐邾取繹與宋之間晉而伐滕同胡氏安國皆責以不能討陳夫禁暴誅亂王者之師其次惟霸主乃能假之魯宣簒弑之惡視宋鮑有加焉豈可責以討賊乎大水季孫行父如齊左傳季文子初聘于齊齊侯初即位冬公孫歸父如齊宣公聘齊止此左傳冬子家如齊伐邾故也恐為齊討故徃謝魯君臣三如齊是年二卿又相繼而徃蓋簒弑之謀仲遂主之行父助之齊新立君恐以舊事聲討故諂附以自託耳左氏謂歸父之使以伐邾故恐猶未得其情也齊侯使國佐來聘左傳國武子來報聘報文子也魯君臣事齊甚謹未聞報聘今齊侯喪未踰年而命使來魯蓋議連兵伐莒故若是其亟也居喪而聘鄰國考之於禮雖無明禁然以春秋所書按之王聘及求金不稱王使而齊侯稱使則惡其即吉而親命聘使可知矣饑公羊傳何以書以重書也王政以民食為重楚子伐鄭左傳楚子伐鄭晉士會救鄭逐楚師于潁北潁杜注潁水出河南陽城至下蔡入淮諸侯之師戍鄭左氏稱晉士會救鄭逐楚師于潁北諸侯之師戍鄭先儒據此謂經削晉救意不以楚為罪皆由誤以稱爵為襃故曲為之説耳經所不書有可據傳以為義者必於經有考也元年經書趙盾救陳而傳兼救宋觀宋公旋會晉師于棐林則傳所稱救宋為得其實而經削之以宋有應討之罪而不當救可知矣下年夏楚子陳侯鄭伯盟于辰陵則是冬傳稱晉師救鄭逐楚師諸侯畱戍非其實矣附錄左傳鄭子家卒鄭人討幽公之亂斲子家之棺而逐其族以四年弑君故也斲薄其棺不使從卿禮改葬幽公諡之曰靈靈公初諡幽日講春秋解義卷二十八
