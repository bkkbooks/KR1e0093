body:
  text: 欽定四庫全書日講春秋解義卷二十三文公公名興僖公母母聲姜諡法慈惠愛民曰文忠信接禮曰文周襄王二十六年魯文公八年襄王崩子頃王立文十四年頃王崩子匡王立鄭穆公二年齊昭公七年魯文公十四年昭公卒子舍立九月舍弑商人立文十八年懿公弑惠公元立宋成公十一年魯文公七年成公卒昭公杵臼立文十六年昭公弑弟文公鮑立晉襄公繼霸二年魯文公六年襄公卒子靈公夷臯立是年趙盾為政衛成公九年蔡莊公十九年魯文公十五年莊公卒子文公申立曹共公二十七年魯文公九年共公卒子文公夀立滕詳見隱公元年魯文公十二年滕昭公來朝陳共公六年魯文公十三年共公卒子靈公平國立把詳見隱公元年薛詳見隱公元年及僖公元年莒魯文公十八年莒太子僕弑紀公庻其子李佗立邾文公四十二年魯文公十三年邾文公卒子定公貜且立許僖公二十九年魯文公五年僖公卒昭公錫我立小邾詳見僖公元年楚成王四十六年魯文公元年冬商臣弑成王而自立為穆王文十三年穆王卒子莊王立始爭覇秦穆公三十四年秦用孟明以為政魯文公二年秦伯伐晉濟河焚舟遂霸西戎史記穆公三十七年益國十二開地千里天子使召公過賀穆公以金鼓文六年穆公卒子康公罃立文十八年康公卒子共公稻立呉詳見隱公元年越詳見隱公元年欽定四庫全書日講春秋解義卷二十三文公名興僖公之子母聲姜以襄王二十六年即位諡法慈惠愛民曰文忠信接禮曰文元年春王正月公即位榖梁傳繼正即位正也繼正謂繼正卒也隠去即位以見讓桓書即位示安忍莊閔僖不言即位皆繼弑即位者告廟臨羣臣也必逾年然後改元書即位者緣始終之義一年不二君緣臣民之心不可曠年無君也即位必以嵗首正始也自古通喪三年告廟則冡宰攝而行之如伊尹祠於先王是也惟即位臨羣臣則權一時之宜如借吉例事畢即反喪服蓋易世傳授國之大事當嚴其禮而王侯以國為家雖先君之喪猶以為已私服也魯自隱至文桓公弑立外惟文公書即位蓋國無變事舉行其禮則史書其事也二月癸亥日有食之公羊日上有朔字天王使叔服來㑹葬左傳元年春王使内史叔服來㑹葬叔氏服字公孫敖聞其能相人也公孫敖魯大夫慶父子叔服能視人顔色知吉凶見其二子焉叔服曰穀也食子難也收子榖公孫敖長子文伯難公孫敖次子惠叔食子奉祭祀供養者也收子葬身者也穀也豐下必有後于魯國豐下蓋面方為八年公孫敖奔莒傳公羊傳其言來㑹葬何㑹葬禮也榖梁傳葬曰㑹言㑹明非一人之辭其志重天子之禮也凡崩薨卒葬人道之大變也不以得禮為常事而不書其甚害於王法如君弑賊不討呉楚稱王之類則聖人有削而不書以示義者矣諸侯使卿來㑹葬不書常事也王使來魯則無不書尊王命且以著魯不朝聘而王數加禮為失政也王於諸侯有弔贈舍襚之禮而使人㑹葬則諸侯相交之喪紀也况天王之喪葬魯君不聞親赴而王臣先至以待諸侯之葬期冠履倒置至此極矣附錄左傳于是閏三月非禮也于厯法當在僖公末年誤于今年三月置閏蓋時達厯者所譏先王之正時也履瑞于始舉正于中歸餘于終履歩也日月運轉于天猶人之行歩故推厯謂之歩厯歩厯之始以為術之端首謂以十一月一日子初一刻冬至為厯首朞之日三百六十有六日日月之行又有遲速而必分為十二月舉中氣以正月月朔之與月節每月各剰一日所有餘日歸之于終積成一月則置之為閏故言歸餘于終履端于始序則不愆四時無愆過舉正于中民則不惑斗建不失其次寒暑不失其常故無疑惑歸餘于終事則不悖四時得所則事無悖亂夏四月丁已葬我君僖公左傳夏四月丁巳葬僖公榖梁傳薨稱公舉上也葬我君接上下也僖公葬而後舉諡諡所以成德也于卒事乎加之矣諸侯五月而葬僖公以十二月薨以四月葬於禮為合矣天王使毛伯來錫公命左傳王使毛伯衛來錫公命毛國伯爵衛其字也諸侯為王卿士者公羊傳錫者何賜也命者何加我服也復發傳者嫌禮與桓公同死生異也古者三載考績三考點陟幽明文公新即位功未足施而錫之非禮也榖梁傳禮有受命無來錫命錫命非正也命所當錫者三終喪入見則有黻冕圭璧之錫禮所謂以士服見天子賜之黻冕圭璧然後歸是也嵗時來朝則有車馬衮黼之錫如采菽之詩所稱是也敵愾獻功則有彤弓玈矢之錫如彤弓之詩所稱是也然是三者皆諸侯至王所受之天子無往錫之禮今文公居喪始越五月既非初見之時又無繼朝獻功之事毛伯之錫何為哉故書以譏之晉侯伐衛左傳晉文公之季年諸侯朝晉衛成公不朝使孔達侵鄭伐緜訾及匡孔達衞大夫匡杜注在潁川新汲縣東北今河南扶溝縣西有匡城晉襄公既祥祥謂小祥也使告于諸侯而伐衞及南陽南陽杜注河内地先且居曰效尤禍也尤衞不朝故伐今不朝王是效衛致禍時王在温故勸之請君朝王臣從師晉侯朝王于温先且居胥臣伐衞五月辛酉朔晉師圍戚六月戊戌取之獲孫昭子昭子衞大夫食戚邑齊桓於霸為盛而業止其身晉文得國日淺視桓少遜而子孫繼霸者凡十世則以襄公克纘父功尊奬王室故威加諸侯而霸業不替如衞侯不朝將告于諸侯而伐之乃能聽先且居之言朝王于温而後往伐可謂知禮矣叔孫得臣如京師左傳叔孫得臣如周拜得臣叔牙之孫如周謝錫命不自朝而使卿拜命終喪之後又不類見慢王之罪其可逭乎趙氏鵬飛以拜命為非謂釋衰服韍於心不安説亦無據在禮喪公弔之必有拜者使人拜未聞遂釋服也衛人伐晉左傳衛人使告于陳以晉伐告陳共公曰更伐之我辭之見伐求和不競太甚故使報伐示己力足以距晉我陳侯也言為衞以辭謝晉求和衛孔達帥師伐晉君子以為古古者越國而謀衞人聽陳共公謀使孔達伐晉夫古者越國而謀必義事也今陳與衛不謀以小事大之禮而乃稱兵報伐他日陳為衛請而執達以説其為謀也過矣秋公孫敖㑹晉侯于戚此大夫專㑹諸侯之始戚杜注衛邑在頓丘衛縣西今直𨽻開州北有古戚城左傳秋晉侯疆戚田故公孫敖㑹之晉取衛田正其疆界公孫敖即穆伯慶父之子也魯之三家雖自僖公而僖之世尚未見其恣也及文公之初則已專盟㑹矣夫諸侯非王命自為㑹猶以為罪况以列卿上㑹霸主豈非政逮大夫之漸乎魯與晉交失之矣冬十月丁未楚世子商臣弑其君頵頵公羊榖梁作髠左傳初楚子將以商臣為太子訪諸令尹子上子上曰君之齒未也齒年也言尚少而又多愛黜乃亂也楚國之舉恒在少者舉立也且是人也蠭目而豺聲忍人也不可立也弗聽既又欲立王子職而黜太子商臣職商臣庻弟商臣聞之而未察告其師潘崇曰若之何而察之潘崇曰享江芈而勿敬也江芈成王妹嫁于江從之江芈怒曰呼役夫呼發聲也役夫賤者稱宜君王之欲殺女而立職也告潘崇曰信矣潘崇曰能事諸乎問能事職不曰不能能行乎曰不能能行大事乎曰能大事謂弑君冬十月以宮甲圍成王太子宮甲僖二十八年王以東宮卒從子玉蓋取此宮甲王請食熊蹯而死熊掌難熟兾久將有外救弗聽丁未王縊諡之曰靈不瞑曰成乃瞑穆王立以其為太子之室與潘崇使為太師且掌環列之尹環列之尹宮衛之官列兵而環王宮榖梁傳日髠之卒所以謹商臣之弑也夷狄不言正不正中國君卒正者例日簒立不正者不日夷狄君卒皆略而不日今書日謹識商臣之大逆耳不以明髠正與不正楚僭號已久世子必不誓於天子今特書世子以著其罪也不言其父言其君者君之於世子有父之親有君之尊言世子所以明有父之親言君所以明有君之尊也楚頵僭王在位四十六年陵暴列國戰克攻取毒被天下終以昧於父子君臣之道禍發蕭牆所謂不善之積必有餘殃豈不信與公孫敖如齊左傳穆伯如齊始聘焉禮也凡君即位卿出並聘踐修舊好要結外援好事鄰國以衛社稷忠信卑讓之道也忠德之正也信德之固也卑讓德之基也諸侯初即位於列國有通嗣君之禮然得臣聘周而敖聘齊等周於齊失禮已甚或謂聘齊以請婚在喪謀婚尤為非禮不貶而惡見矣附錄左傳殽之役在僖三十三年晉人既歸秦帥秦大夫及左右皆言于秦伯曰是敗也孟明之罪也必殺之秦伯曰是孤之罪也周芮良夫之詩曰大風有隧貪人敗類詩大雅隧蹊徑也言貪人之敗善類若大風之行毁壞衆物所在成蹊徑聽言則對誦言如醉言得道聽塗説之言則喜而答對典誦之言則聞之若醉匪用其良覆俾我悖覆反也俾使也不用良臣之言反使我為悖亂是貪故也孤之謂矣孤實貪以禍夫子夫子何罪復使為政為明年秦晉戰彭衙傳二年春王二月甲子晉侯及秦師戰于彭衙秦師敗績彭衙杜注秦地馮翊郃陽縣西北有彭衙城在今陜西白水縣東北左傳二年春秦孟明視帥師伐晉以報殽之役二月晉侯禦之先且居將中軍趙衰佐之代郤溱王官無地御戎代梁𢎞狐鞫居為右鞫居續簡伯甲子及秦師戰于彭衙秦師敗績晉人謂秦拜賜之師以孟明言三年將拜君賜故嗤之戰于殽也晉梁𢎞御戎萊駒為右戰之明日晉襄公縛秦囚使萊駒以戈斬之囚呼萊駒失戈狼瞫取戈以斬囚禽之以從公乘遂以為右因上文萊駒失戈故言禽之生死皆曰禽箕之役在僖三十三年先軫黜之而立續簡伯狼瞫怒其友曰盍死之瞫曰吾未獲死所其友曰吾與女為難欲共殺先軫瞫曰周志有之勇則害上不登于明堂周志周書也明堂所以䇿功序徳故不義之士不得升死而不義非勇也共用之謂勇共用死國用吾以勇求右無勇而黜亦其所也言今死而不義更成無勇宜見退謂上不我知黜而宜乃知我矣言今見黜而合宜則吾不得復言上不我知子姑待之及彭衙既陳以其屬馳秦師死焉晉師從之大敗秦師君子謂狼瞫于是乎君子詩曰君子如怒亂庻遄沮詩小雅遄疾也沮止也言君子之怒必以止亂又曰王赫斯怒爰整其旅詩大雅怒不作亂而以從師可謂君子矣秦伯猶用孟明孟明増修國政重施于民趙成子言于諸大夫曰成子趙衰秦師又至將必辟之懼而増德不可當也詩曰毋念爾祖聿修厥德詩大雅言念其祖考則宜述修其德以顯之母念念也孟明念之矣念德不怠其可敵乎為明年秦人伐晉傳秦穆公邀利以取敗不自悔責而事報復師出無名故不稱伐晉襄公得志於殽可以已矣秦兵再至不修文告以卻之而逞志於再戰是主乎戰者也故言及蓋秦穆憤於敗而不能平晉襄狃於勝而不能屈血氣用事無理義以養其心終於稔怨結讎黷武殘民而已春秋書秦晉之戰所以為世之不能懲忿窒慾者戒也丁丑作僖公主左傳丁丑作僖公主書不時也過葬十月故曰不時公羊傳作僖公主者何為僖公作主也主天子長尺二寸諸侯長一尺主者曷用虞主用桑禮平明而葬日中而反虞以陽求隂謂之虞者親䘮已下壙皇皇無所親求而虞事之虞猶安神也用桑者取其名與其麤觕所以副孝于之心禮虞祭天子九諸侯七卿大夫五士三其奠處猶吉祭練主用栗謂期年練祭也埋虞主于兩階之間易用栗也夏后氏以松殷人以柏周人以栗禮士虞記曰桑主不文吉主皆刻而諡之蓋為禘祫時别昭穆也虞主三代同者用意尚麤觕未暇别也用栗者藏主也藏于廟室中堂作僖公主何以書譏何譏爾不時也其不時奈何欲久䘮而後不能也禮作練主當以十三月文公亂制欲服喪三十六月十九月作練主又不能卒竟故以二十五月也榖梁傳作為也為僖公主也立主喪主于虞吉主于練此雖為練作之主終入廟以辨昭穆故傳以吉言之作僖公主譏其後也僖公薨至此已十五月作主壞廟有時日于練焉壞廟壞廟之道易檐可也改塗可也禮親過高祖則毁其廟以次而遷將納新神然作主在十二月壞廟在三年喪終傳連言之非謂作主壞廟同時也作主常禮也何以書蓋喪主作於方葬之時吉主作於小祥今僖公之薨已十有五月乃始作主慢甚矣故書之譏不時也三月乙巳及晉處父盟因朝而盟始此左傳晉人以公不朝來討公如晉夏四月己巳經書三月乙巳經傳必有誤晉人使陽處父盟公以恥之書曰及晉處父盟以厭之也厭猶損也適晉不書諱之也公羊傳此晉陽處父也何以不氏諱與大夫盟也榖梁傳不言公處父伉也為公諱也何以知其與公盟以其日也何以不言公之如晉所恥也出不書反不致也凡盟必書地其不地於晉也公在喪未朝天子而畏晉之威越禮朝晉晉侯乃使大夫盟公以辱之是以沒不書公諱之也齊晉霸業正盛時未嘗使諸侯受盟於其國魯閔公襄公童子侯也桓公出盟閔公于落姑悼公出盟襄公于長樗不敢以非禮加諸侯也而襄公乃使大夫盟公於國都故諸侯懾於其勢而心不服此晉霸之所以易世而衰與夏六月公孫敖㑹宋公陳侯鄭伯晉士縠盟于垂隴榖榖梁作榖垂隴公羊榖梁作垂斂杜注鄭地滎陽縣東有隴城在今河南滎澤縣東北此外大夫書名之始左傳公未至朝晉未歸六月穆伯㑹諸侯及晉司空士縠盟于垂隴晉討衛故也書士縠堪其事也晉司空非卿也以士縠能堪卿事故書陳侯為衞請成于晉執孔達以説穀梁傳内大夫可以㑹外諸侯大夫而敵諸侯於是始晉遂以大夫主諸侯也自書士縠而後凡役書大夫大夫張也大夫之張君使之也或疑當時君權尚尊非如襄昭之際大夫專國然防微杜漸不可不謹也自十有二月不雨至于秋七月公羊傳何以書記異也大旱以災書此亦旱也曷為以異書大旱之日短而云災云言也言有災故以災書此不雨之日長而無災故以異書也穀梁傳歴時而言不雨文不憂雨也不憂雨者無志乎民也不雨之月歴時而總書與僖公之每時一書不雨者異蓋僖公有閔雨之心文公無望雨之意也不雨止於七月則八月雨矣雨亦不書見不以民事繫憂樂也其怠於政事可知矣八月丁卯大事于太廟躋僖公左傳秋八月丁卯大事于太廟躋僖公逆祀也于是夏父弗忌為宗伯尊僖公且明見曰吾見新鬼大故鬼小新鬼僖公既為兄死時年又長故鬼閔公死時年少弗忌明言其所見先大後小順也躋聖賢明也又以僖公為聖賢明順禮也君子以為失禮禮無不順祀國之大事也而逆之可謂禮乎子雖齊聖不先父食久矣齊肅也臣繼君猶子繼父故禹不先鯀湯不先契鯀禹父契湯十三世祖文武不先不窋不窋后稷子宋祖帝乙鄭祖厲王猶上祖也帝乙微子父厲王鄭桓公父二國不以帝乙厲王不肖猶尊尚之是以魯頌曰春秋匪解享祀不忒皇皇后帝皇祖后稷忒差也皇皇美也后帝天也詩頌僖公郊祭上天配以后稷君子曰禮謂其后稷親而先帝也先稱帝也詩曰問我諸姑遂及伯姊詩邶風君子曰禮謂其姊親而先姑也僖親文公父夏父弗忌欲阿時君先其所親故傳以此二詩深責其意仲尼曰臧文仲其不仁者三不知者三下展禽展禽柳下惠也知其賢而使在下位廢六關塞關陽關之屬凡六所以禁絶末游而廢之妾織蒲言與民爭利三不仁也作虛器謂居蔡山節藻税也有其器而無其位故曰虚縱逆祀聽夏父躋僖公祀爰居海鳥曰爰居止于魯東門外文仲以為神命國人祀之三不知也公羊傳大事者何大祫也大祫者何合祭也其合祭奈何毁廟之主陳于大祖毁廟謂親過高祖毁其廟藏其主于大祖廟中陳者陳列大祖前大祖東鄉昭南鄉穆北鄉其餘孫從王父父曰昭子曰穆昭取鄉明穆取北面尚敬未毁廟之主皆升合食于大祖自外來曰升五年而再殷祭殷盛也謂三年祫五年禘禘所以異于祫者功臣皆祭也躋者何升也何言乎升僖公譏何譏爾逆祀也其逆祀奈何先禰而後祖也文公以僖公為閔公庻兄升僖公于上失先後之義故譏之曰後祖者僖公以臣繼閔公猶子繼父故閔公于文公亦猶祖也穀梁傳大事者何大是事也著祫嘗祫合也嘗秋祭祫祭者毁廟之主陳于大祖未毁廟之主皆升合祭于大祖祫祭者合祭諸廟已毁未毁者之主于大祖廟中以昭穆為次序祭畢則復退其廟躋升也先親而後祖也逆祀也逆祀則是無昭穆也無昭穆則是無祖也無祖則無天也故曰文無天無天者是無天而行也謂天道先尊而後親今亂其上下不仰法天也君子不以親親害尊尊此春秋之義也凡祭而失禮則書祭名祭非失禮為下事張本則稱事此大事于大廟蓋祫祭也祫者吉祭不言吉者主為逆祀書也閔僖二公昭穆雖同世而繼序有先後閔公弟也實為僖之君僖公兄也實為閔之臣入廟之主有定序僖不得先閔明矣今文公私於其父序兄弟畧君臣升僖之主於閔之上非禮甚矣公穀皆以大事為祫左傳無明文而杜預以為禘公羊注又曰三年祫五年禘皆非也五年而再殷祭謂三年一祫五年再祫耳冬晉人宋人陳人鄭人伐秦左傳冬晉先且居宋公子成陳轅選鄭公子歸生伐秦取汪及彭衙而還以報彭衙之役卿不書為穆公故尊秦也謂之崇德自入春秋至此惟魯大夫帥師以名見外師非君將恒稱人外大夫自士縠專盟始以名見陽處父專將始以名見而餘猶稱人大夫雖張而未甚也至晉秦結怨勦民報復無已則不待貶而惡見矣公子遂如齊納幣左傳襄仲如齊納幣禮也凡君即位好舅甥修昏姻娶元妃以奉粢盛孝也謂諒聞既終嘉好之事通于外内外内之禮始備此除凶之即位也孝禮之始也公羊傳納幣不書此何以書譏何譏爾譏喪娶也娶在三年之外則何譏乎喪娶三年之内不圖昏僖公以十二月薨至此木满二十五月又禮先納采問名納吉乃納幣此四者皆在三年之内故云爾吉禘于莊公譏然則曷為不于祭焉譏三年之恩疾矣疾痛非虛加之也以人心為皆有之以人心為皆有之則曷為獨于娶焉譏娶者大吉也非常吉也其為吉者主于已以為有人心焉者則宜于此焉變矣變者變慟哭泣也念親者聞欲為已圖昏則當變慟哭泣况乃至于納幣成昏哉昏姻常事不書其書納幣者譏喪未終而圖昏也婦姜之迎在四年夏喪服已畢何以譏之蓋事莫重乎志故曰志哀而居約與之知喪逆婦雖在三年外而納幣尚在喪期之内未祥而行嘉禮哀戚忘矣志可問乎春秋此義使人抑情以去私其垂教切矣三年春王正月叔孫得臣㑹晉人宋人陳人衞人鄭人伐沈沈潰沈杜注姬姓國汝南平輿縣北有沈亭按漢志汝南治平輿故沈子國屬蔡州今河南汝陽縣東南有平輿故城沈亭在其地霸國大夫㑹諸大夫伐國自此始左傳三年春莊叔㑹諸侯之師伐沈莊叔即得臣以其服于楚也沈潰凡民逃其上曰潰在上曰逃晉襄繼霸未嘗一出與諸侯㑹盟而使大夫主之自伐衞而後軍政亦委之大夫其志益怠矣方是時商臣有覆載不容之罪國人惡之使晉襄能伸大義親帥諸侯以討楚則商臣不能自安楚人必有因敵勢順衆心起而討賊改立君以聽命於諸侯者如此則有光於桓文矣乃視非己事而使大夫主兵伐其與國之小者商臣以是料晉之無能為是以沈雖潰而圍江之師旋出也附錄左傳衞侯如陳拜晉成也二年陳侯為衞請成于晉夏五月王子虎卒左傳夏四月乙亥王叔文公卒來赴弔如同盟禮也王子虎與僖公同盟于翟泉文公是同盟之子故赴以名公羊傳王子虎者何天子之大夫也外大夫不卒此何以卒新使乎我也榖梁傳叔服也此不卒者也何以卒之以其來㑹葬我卒之也或曰以其嘗執重以守也僖二十四年天王出居于鄭叔服執重任以守國王子虎者穀梁以為即叔服然左氏於叔服稱内史於子虎稱王叔文公而後此星孛入斗之時叔服復見於傳則非王子虎明矣踐土之役王子虎盟諸侯於王庭蓋天子之秉政者王臣無外交今死而赴告於魯故書以譏之秦人伐晉左傳秦伯伐晉濟河焚舟示必死也取王官及郊王官杜注晉地今山西臨晉縣東南王官谷有廢壘即王官城也郊杜注晉地當為今臨晉平陽閒小邑晉人不出遂自茅津濟封殽尸而還茅津杜注在河東大陽縣西今山西平陸縣南大陽渡即茅津也有古茅城封埋藏之遂霸西戎用孟明也君子是以知秦穆公之為君也舉人之周也周備也不偏以一惡棄其善與人之壹也壹無二心孟明之臣也其不解也能懼思也子桑之忠也其知人也能舉善也子桑公孫枝舉孟明者詩曰于以采蘩于沼于沚于以用之公侯之事秦穆有焉詩國風言沼沚之蘩至薄猶采以共公侯以喻秦穆不遺小善夙夜匪解以事一人孟明有焉詩大雅詒厥孫謀以燕翼子子桑有焉詒遺也燕安也翼成也詩大雅喻子桑有舉善之謀舊説秦伯知過復貳故貶而稱人非也考之於經惟戰韓稱秦伯蓋兩君親戰若書秦人則疑晉侯見獲於秦大夫其餘終穆公之篇皆書秦人未有稱爵者又謂晉人畏秦而不出秦伯逞其忿而後悔自是見伐不報始能踐其自誓之言亦非也考之傳記則踰二年而穆公卒何由知其自悔而不報乎先儒曲生義例謂聖人以常情待晉襄以王事責秦穆皆因書錄秦誓謂孔子以穆公為賢不知誓詞有足為天下後世法者故不廢其言至其窮兵報怨則備書於春秋以著其罪猶化工賦物生殺並行而不相悖也秋楚人圍江左傳楚師圍江晉先僕伐楚以救江自齊桓之霸江黄以近楚之國並從齊盟楚深憾之滅黄已久今復圍江亦以晉不能合諸侯以討其弑逆之罪故輕視中國而圍江以試之也雨螽于宋左傳秋雨螽于宋隊而死也公羊傳雨螽者何死而墜也何以書記異也外異不書此何以書為王者之後記異也穀梁傳外災不志此何以志也曰災甚也其甚奈何茅茨盡矣茅茨猶盡則嘉穀可知茨蒺藜著于上見于下謂之雨雨自上而下者也螽不見其所從來自上而下衆多如雨異之大者也冬公如晉十有二月己巳公及晉侯盟此書公如晉之始左傳晉人懼其無禮于公也請改盟改二年處父之盟公如晉及晉侯盟晉侯饗公賦菁菁者莪詩小雅義取既見君子樂且有儀莊叔以公降拜謝其以公比君子也曰小國受命于大國敢不慎儀賦詩曰樂且有儀故答以敢不慎儀君貺之以大禮何樂如之抑小國之樂大國之惠也晉侯降辭降階辭讓公登成拜俱還上成拜禮公賦嘉樂嘉樂詩大雅義取顯顯令德宜民宜人受祿于天晉人懼無禮而請改盟於公為不辱故適晉書而反國亦致不書地盟於晉都也晉陽處父帥師伐楚以救江公羊穀梁無以字外大夫書帥師自此始左傳冬晉以江故告于周王叔桓公晉陽處父伐楚以救江桓公周卿士王叔文公之子不書不親伐也門于方城遇息公子朱而還子朱楚大夫伐江之帥也聞晉師起而江兵解故晉亦還公羊傳此伐楚也其言救江何為諼也諼詐其為諼奈何伐楚為救江也救人之道當指其所之實欲救江而反伐楚以為其勢必當引圍江兵還自救也故云爾穀梁傳此伐楚其言救江何也江遠楚近伐楚所以救江也大夫帥師以名氏見大夫彊也春秋於侵伐多不言所事此書伐以救何言救江雖善而所以救之者非其道也是時楚商臣負弑逆之罪恃彊凌弱晉襄不能大合諸侯奉詞伐罪而獨遣一軍又不敢徑造江之城下而聲言伐楚一遇子朱即避之而返既不能伐楚又不能救江畏怯甚矣故特起伐以救之文以罪之以者不以者也四年春公至自晉附錄左傳四年春晉人歸孔達于衞以為衞之良也故免之二年衞執孔逹以説晉夏衞侯如晉拜謝歸孔逹曹伯如晉㑹正㑹受貢賦之政也傳言襄公能繼文之業而諸侯服從夏逆婦姜于齊左傳逆婦姜于齊卿不行非禮也禮諸侯有故則使卿逆君子是以知出姜之不允于魯也文公薨而見出故曰出姜允信也始來不見尊貴故終不為國人所敬信也曰貴聘而賤逆之公子遂納幣是貴聘也君而卑之君小君也立而廢之棄信而壞其主主内主也在國必亂在家必亡不允宜哉詩曰畏天之威于時保之敬主之謂也詩頌言畏天威于是保福祿為十八年姜氏歸齊張夲公羊傳其謂之逆婦姜于齊何略之也謂不書逆者之姓名不言如齊不稱女不書至也高子曰娶乎大夫者略之也謂夫人乃齊大夫女賤不可奉宗廟故略之榖梁傳其曰婦姜為其禮成乎齊也昏禮成于齊故在齊便稱婦其逆者誰也親逆而稱婦或者公與何其速婦之也怪稱婦速故設為問辭而反覆推之曰公也其不言公何也非成禮于齊也非責曰婦有姑之辭也其不言氏何也貶之也何為貶之也夫人與有貶也夫人能以禮自防則夫婦之禮不成于齊故譏公而夫人與焉納幣卿行則逆婦必非微者穀梁謂公自逆是也未至而稱婦則成禮于齊明矣圖昏於喪期之内又成禮於婦家所謂失禮之中又失禮也故諱不書公以示貶狄侵齊春秋霸業之盛首推桓文以其攘外而安内也狄雖敗於箕未幾復侵齊春秋書之譏晉襄無攘却之謀而齊霸不紹也秋楚人滅江左傳楚人滅江秦伯為之降服出次不舉過數降服素服也出次辟正寢不舉去盛饌鄰國之禮有數今秦伯過之大夫諫公曰同盟滅秦江同盟不告故不書雖不能救敢不矜乎吾自懼也君子曰詩云惟彼二國其政不獲惟此四國爰究爰度其秦穆之謂矣詩大雅爰于也究度皆謀也言夏商之君政不得人心故四方諸侯皆懼而謀度其政事喻秦穆亦能感江之㓕懼而思政也春秋中以慕義從霸遂致滅亡者江與黄是也當桓之世黄為楚滅齊不能救君子憫之江被圍經年晉霸不競不能撼楚以庇江春秋書圍書滅著晉襄之無遠謀見江上下同力效死乃亡國之善辭也不書奔死社稷也晉侯伐秦左傳秋晉侯伐秦圍邧新城邧杜注秦邑在今陜西澄城縣境新城杜注秦邑今澄城縣東北有古新城即梁國之新里也以報王官之役王官役在三年晉襄以王官之役不報為恥未若商臣得志於江為恥之大也報秦而不誅商臣末矣况救江則遣大夫伐秦則君親之故書晉侯伐秦於滅江之下見其急於修怨而緩於恤患也爵晉侯非善之以其徇私亟戰而不知戢故目其人而責之衞侯使寗俞來聘左傳衛寗武子來聘公與之宴為賦湛露及彤弓非禮之常公特命樂人以示意故言為賦湛露彤弓詩小雅不辭又不答賦使行人私焉私問之對曰臣以為肄業及之也肄習也以魯人失所賦故佯為不知昔諸侯朝正于王朝而受政教也王宴樂之于是乎賦湛露則天子當陽諸侯用命也詩云湛湛露斯匪陽不晞晞乾也言露見日而乾猶諸侯禀天子命而行諸侯敵王所愾而獻其功敵猶當也愾恨怒也王于是乎賜之彤弓一彤矢百玈弓矢千以覺報宴覺明也謂諸侯有四夷之功王賜之弓矢又為歌彤弓以明報功宴樂今陪臣來繼舊好因論天子之樂故自稱陪臣君辱貺之其敢干大禮以自取戾貺賜也干犯也戾罪也解已所以不辭亦不答之意禮諸侯嵗相問殷相聘殷衆也殷見曰同十有二年五服盡朝故曰殷見殷見既畢諸侯更遣大夫以交於鄰邦謂之殷聘今殷見則亡而殷聘則存聖人書之以傷周道也冬十有一月壬寅夫人風氏薨左傳冬成風薨為明年王使歸舍賵傳春秋正名定分之書也仲子不稱夫人稱夫人自風氏始春秋記其卒葬各以實書不為異辭者謹禮之所由變也日講春秋解義卷二十三
